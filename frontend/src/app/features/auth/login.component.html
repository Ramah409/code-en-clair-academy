<app-auth-layout heading="Content de te revoir" intro="Connecte-toi pour reprendre là où tu t'étais arrêtée.">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as err) {
      <div class="alert alert--error" role="alert">{{ err.message }}</div>
    }

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="email"
             [attr.aria-invalid]="invalid('email')" aria-describedby="email-error">
      @if (invalid('email')) {
        <span id="email-error" class="field__error">
          {{ form.controls.email.hasError('required') ? "L'adresse e-mail est obligatoire." : "L'adresse e-mail n'est pas valide." }}
        </span>
      }
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <div class="password">
        <input id="password" class="input" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
               autocomplete="current-password" [attr.aria-invalid]="invalid('password')" aria-describedby="password-error">
        <button type="button" class="password__toggle" (click)="showPassword.set(!showPassword())"
                [attr.aria-pressed]="showPassword()">
          {{ showPassword() ? 'Masquer' : 'Afficher' }}
        </button>
      </div>
      @if (invalid('password')) {
        <span id="password-error" class="field__error">Le mot de passe est obligatoire.</span>
      }
    </div>

    <button type="submit" class="btn btn--block" [disabled]="submitting()">
      {{ submitting() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>

  <p class="switch">Pas encore de compte ? <a routerLink="/inscription">Créer un compte</a></p>
</app-auth-layout>
