              message: "Exclus .env."
      - slug: dk-ex-dockerfile-corriger
        kind: CORRIGER_ERREUR
        title: "Un Dockerfile à alléger"
        difficulty: DIFFICILE
        skill: docker-deploiement
        statement: |
          Ce Dockerfile fonctionne, mais l'image est très lourde, contient le code source et le fichier `.env`,
          et tourne en root. Réécris-le en **deux étapes** :
          - étape `construction` à partir de `eclipse-temurin:21-jdk` qui construit le jar ;
          - étape finale à partir de `eclipse-temurin:21-jre-alpine` qui copie seulement le jar ;
          - plus de `COPY .env` ;
          - une instruction `USER` pour ne pas tourner en root.
        criteria: "Deux FROM (jdk AS construction, puis jre-alpine), COPY --from=construction, plus de .env, une instruction USER."
        hints:
          - "`FROM eclipse-temurin:21-jdk AS construction` en haut."
          - "Deuxième étape : `FROM eclipse-temurin:21-jre-alpine` puis `COPY --from=construction /app/target/*.jar app.jar`."
          - "Ajoute `RUN adduser -S app` puis `USER app` avant l'ENTRYPOINT."
        solution: |
          FROM eclipse-temurin:21-jdk AS construction
          WORKDIR /app
          COPY mvnw pom.xml ./
          COPY .mvn .mvn
          RUN ./mvnw -B dependency:go-offline
          COPY src src
          RUN ./mvnw -B package -DskipTests

          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          RUN adduser -S app
          COPY --from=construction /app/target/*.jar app.jar
          USER app
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
        explanation: "Image plus légère, sans source ni secret, et sans privilèges root."
        xp: 30
        payload:
          language: dockerfile
          starter: |
            FROM eclipse-temurin:21-jdk
            WORKDIR /app
            COPY . .
            COPY .env .env
            RUN ./mvnw -B package -DskipTests
