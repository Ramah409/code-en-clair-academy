slug: dk-comprendre-docker
position: 1
level: DEBUTANT
title: "Comprendre Docker"
summary: "Image, conteneur et registre, les commandes du quotidien, la publication de port, un premier Dockerfile, puis la construction en plusieurs étapes. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: dk-conteneurs
    title: "Image, conteneur, registre"
    duration: 9
    objective: "Distinguer image, conteneur et registre."
    prerequisites: "Parcours « Spring Boot » (chapitre 1)."
    skills: [docker-deploiement]
    xp: 15
    memo: |
      - **Image** : un modèle en lecture seule (le système, les outils, ton application). Comme un **moule**.
      - **Conteneur** : une image **en train de tourner**. Comme le **gâteau** sorti du moule. On peut en lancer plusieurs.
      - **Registre** : l'endroit où l'on range et partage les images (Docker Hub, GitHub Container Registry).
      - Un conteneur partage le noyau de la machine : ce n'est **pas** une machine virtuelle.
    commonMistakes: |
      - Confondre image et conteneur.
      - Croire qu'un conteneur est une machine virtuelle complète.
    blocks:
      - type: text
        md: |
          « Ça marche sur ma machine ! » : la phrase la plus célèbre de l'informatique. Docker la rend inutile,
          car l'application voyage **avec** tout son environnement.
      - type: definition
        id: def-image-conteneur
        term: "Image et conteneur"
        md: |
          L'**image**, c'est le **moule à gâteau** : il ne change pas. Le **conteneur**, c'est le **gâteau**
          sorti du moule : on peut en faire plusieurs, les manger (les supprimer), et en refaire des neufs à
          partir du même moule. Le **registre**, c'est la **boutique** où l'on range les moules.
      - type: code
        id: code-image
        language: bash
        title: "Du registre au conteneur"
        code: |
          docker pull postgres:16-alpine
          docker run -d --name bdd postgres:16-alpine
        lines:
          - n: 1
            note: "Télécharge l'**image** depuis le registre Docker Hub."
          - n: 2
            note: "Crée et lance un **conteneur** à partir de cette image."
      - type: question
        ref: dk-ct-q1
        review: def-image-conteneur
      - type: question
        ref: dk-ct-q5
        review: def-image-conteneur
      - type: text
        md: "**Exercice 1 (guidé)** : image, conteneur ou registre ?"
      - type: exercise
        ref: dk-ex-notions-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : expliquer avec ses mots."
      - type: exercise
        ref: dk-ex-notions-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une confusion."
      - type: exercise
        ref: dk-ex-notions-bug
      - type: jury
        items:
          - q: "Quelle différence entre une image et un conteneur ?"
            a: "L'image est un modèle immuable, construit à partir d'un Dockerfile et stocké dans un registre. Le conteneur est une instance en cours d'exécution de cette image, avec son propre système de fichiers modifiable et son réseau. On peut lancer plusieurs conteneurs à partir d'une même image."
          - q: "Docker est-il une machine virtuelle ?"
            a: "Non : une machine virtuelle embarque un système d'exploitation complet. Un conteneur partage le noyau de la machine hôte et n'isole que les processus, le réseau et les fichiers. Il est donc beaucoup plus léger et démarre en quelques secondes."
      - type: quiz
        items:
          - ref: dk-ic-q3
            review: def-image-conteneur
          - ref: dk-ic-q4
            review: code-image
          - ref: dk-c1-b2
            review: code-image
    questions:
      - code: dk-ct-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Qu'est-ce qu'un conteneur ?"
        choices:
          - label: "Une image en cours d'exécution"
            correct: true
            why: "Le gâteau sorti du moule."
          - label: "Un fichier de configuration"
            correct: false
            why: "C'est un processus qui tourne."
          - label: "Un site de partage d'images"
            correct: false
            why: "C'est un registre."
        explanation: "Image = modèle ; conteneur = instance qui tourne."
      - code: dk-ct-q5
        kind: TEXTE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Comment appelle-t-on le service où l'on stocke et partage des images Docker ? (un mot)"
        answers: ["registre", "registry", "Registre"]
        explanation: "Docker Hub, GitHub Container Registry (ghcr.io)…"
      - code: dk-ic-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: docker-deploiement
        prompt: "On peut lancer plusieurs conteneurs à partir d'une même image."
        choices:
          - label: "Vrai"
            correct: true
            why: "Plusieurs gâteaux, un seul moule."
          - label: "Faux"
            correct: false
            why: "L'image est un modèle réutilisable."
        explanation: "Une image, autant de conteneurs qu'on veut."
      - code: dk-ic-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Que fait `docker pull postgres:16-alpine` ?"
        choices:
          - label: "Il télécharge l'image depuis le registre"
            correct: true
            why: "Il ne lance rien."
          - label: "Il lance un conteneur"
            correct: false
            why: "C'est docker run."
          - label: "Il supprime l'image"
            correct: false
            why: "C'est docker rmi."
        explanation: "pull = récupérer le moule."
      - code: dk-c1-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Pourquoi préciser une version d'image (`postgres:16-alpine`) plutôt que `postgres:latest` ?"
        choices:
          - label: "Pour que tout le monde utilise exactement la même version, sans surprise lors d'une mise à jour"
            correct: true
            why: "Des environnements reproductibles."
          - label: "latest n'existe pas"
            correct: false
            why: "Il existe, mais il change avec le temps."
          - label: "Pour que l'image soit plus rapide"
            correct: false
            why: "La vitesse n'est pas en jeu."
        explanation: "La même version en développement, en CI et en production."
    exercises:
      - slug: dk-ex-notions-guide
        kind: COMPLETER
        title: "Image, conteneur ou registre ?"
        difficulty: FACILE
        skill: docker-deploiement
        statement: "Complète avec : image, conteneur, registre."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le modèle en lecture seule : image."
          - "Ce qui tourne : conteneur ; où l'on partage : registre."
          - "image, conteneur, registre."
        solution: '["image", "conteneur", "registre"]'
        explanation: "Moule, gâteau, boutique."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Le modèle qui ne change pas : l'[[1]]
            Ce qui tourne à partir du modèle : le [[2]]
            L'endroit où l'on partage les modèles : le [[3]]
          blanks:
            - ["image"]
            - ["conteneur"]
            - ["registre", "registry"]
      - slug: dk-ex-notions-libre
        kind: CODE_LIBRE
        title: "Expliquer avec ses mots"
        difficulty: FACILE
        skill: oral-cda
        statement: |
          En deux phrases, explique la différence entre une image et un conteneur. Utilise les mots **image**,
          **conteneur** et **modèle** (ou **moule**).
        criteria: "Les trois mots sont présents dans une explication."
        hints:
          - "L'image est un modèle qui ne change pas."
          - "Le conteneur, c'est l'image qui tourne."
          - "On peut lancer plusieurs conteneurs à partir d'une image."
        solution: |
          Une image est un modèle en lecture seule qui contient l'application et son environnement.
          Un conteneur est cette image en train de tourner ; on peut en lancer plusieurs à partir du même modèle.
        explanation: "Moule et gâteaux."
        xp: 15
        payload:
          language: text
          starter: |
            Une image
          checks:
            - pattern: '(?i)\bimage'
              message: "Parle de l'image."
            - pattern: '(?i)\bconteneur'
              message: "Parle du conteneur."
            - pattern: '(?i)mod[èe]le|moule'
              message: "Utilise le mot modèle (ou moule)."
      - slug: dk-ex-notions-bug
        kind: CORRIGER_ERREUR
        title: "Une confusion"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Cette phrase inverse image et conteneur. Corrige-la : « Le conteneur est l'image en train de tourner. »
        criteria: "Le conteneur est l'image en train de tourner."
        hints:
          - "Qu'est-ce qui tourne ?"
          - "Le conteneur."
          - "« Le conteneur est l'image en train de tourner. »"
        solution: |
          Le conteneur est l'image en train de tourner.
        explanation: "Le gâteau sort du moule, pas l'inverse."
        xp: 10
        payload:
          language: text
          starter: |
            L'image est le conteneur en train de tourner.
          checks:
            - pattern: "(?i)l'image est le conteneur"
              absent: true
              message: "C'est l'inverse."
            - pattern: "(?i)le conteneur est l'image en train de tourner"
              message: "Écris : Le conteneur est l'image en train de tourner."

  # ===================================================================== LEÇON 2
  - slug: dk-commandes
    title: "Les commandes du quotidien"
    duration: 10
    objective: "Lancer, lister, lire les journaux, entrer dans un conteneur, l'arrêter et le supprimer."
    prerequisites: "Leçon « Image, conteneur, registre »."
    skills: [docker-deploiement]
    xp: 15
    memo: |
      - `docker run -d --name api mon-api:1.0` : lancer un conteneur en arrière-plan, avec un nom.
      - `docker ps` : lister ; `docker logs api` : lire les journaux ; `docker exec -it api sh` : entrer dedans.
      - `docker stop api` : arrêter ; `docker rm api` : supprimer le conteneur (l'image reste).
      - En cas de problème : **les logs d'abord**.
    commonMistakes: |
      - Supprimer le conteneur avant d'avoir lu ses logs.
      - Croire que `docker rm` supprime l'image.
    blocks:
      - type: definition
        id: def-commandes
        term: "Le cycle de vie d'un conteneur"
        md: |
          Comme un **appareil électrique** : on l'allume (`run`), on vérifie qu'il marche (`ps`), on lit son
          écran d'erreur (`logs`), on l'éteint (`stop`), puis on le range (`rm`).
      - type: code
        id: code-commandes
        language: bash
        title: "Les commandes de base"
        code: |
          docker run -d --name bdd -e POSTGRES_PASSWORD=secret-local postgres:16-alpine
          docker ps
          docker logs bdd
          docker exec -it bdd psql -U postgres
          docker stop bdd
          docker rm bdd
        lines:
          - n: 1
            note: "`-d` : en arrière-plan ; `--name` : un nom facile ; `-e` : une variable d'environnement."
          - n: 2
            note: "Liste les conteneurs qui tournent."
          - n: 3
            note: "Affiche ce que le conteneur a écrit : indispensable pour comprendre une erreur."
          - n: 4
            note: "Ouvre `psql` **à l'intérieur** du conteneur."
          - n: 6
            note: "Supprime le conteneur arrêté. L'image, elle, reste."
      - type: question
        ref: dk-ct-q3
        review: code-commandes
      - type: question
        ref: dk-ct-q4
        review: def-commandes
      - type: text
        md: "**Exercice 1 (guidé)** : complète les commandes."
      - type: exercise
        ref: dk-ex-commandes-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : lancer et inspecter."
      - type: exercise
        ref: dk-ex-commandes-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : des indices supprimés."
      - type: exercise
        ref: dk-ex-commandes-bug
      - type: quiz
        items:
          - ref: dk-cm-q3
            review: code-commandes
          - ref: dk-cm-q4
            review: code-commandes
          - ref: dk-cm-q5
            review: def-commandes
    questions:
      - code: dk-ct-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Le conteneur s'arrête tout de suite après son lancement. Quelle commande regarder en premier ?"
        choices:
          - label: "docker logs nom-du-conteneur"
            correct: true
            why: "Les journaux contiennent le message d'erreur."
          - label: "docker pull"
            correct: false
            why: "Elle télécharge une image."
          - label: "docker rm"
            correct: false
            why: "Elle supprime le conteneur, et ses indices."
        explanation: "Les logs d'abord, toujours."
      - code: dk-ct-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: docker-deploiement
        prompt: "`docker rm` supprime aussi l'image qui a servi à créer le conteneur."
        choices:
          - label: "Vrai"
            correct: false
            why: "Il ne supprime que le conteneur."
          - label: "Faux"
            correct: true
            why: "L'image se supprime avec `docker rmi`."
        explanation: "Le moule reste quand on mange le gâteau."
      - code: dk-cm-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Que fait l'option `-d` de `docker run` ?"
        choices:
          - label: "Elle lance le conteneur en arrière-plan"
            correct: true
            why: "Le terminal reste libre."
          - label: "Elle supprime le conteneur"
            correct: false
            why: "C'est docker rm."
          - label: "Elle télécharge l'image"
            correct: false
            why: "C'est docker pull."
        explanation: "-d = detached."
      - code: dk-cm-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Quelle commande liste les conteneurs qui tournent ?"
        choices:
          - label: "docker ps"
            correct: true
            why: "Comme ps sous Linux."
          - label: "docker logs"
            correct: false
            why: "Elle affiche les journaux."
          - label: "docker stop"
            correct: false
            why: "Elle arrête."
        explanation: "ps = processus."
      - code: dk-cm-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "À quoi sert `docker exec -it bdd psql -U postgres` ?"
        choices:
          - label: "À ouvrir psql à l'intérieur du conteneur bdd"
            correct: true
            why: "On entre dans le conteneur."
          - label: "À créer le conteneur bdd"
            correct: false
            why: "C'est docker run."
          - label: "À supprimer la base"
            correct: false
            why: "Il ouvre seulement une console."
        explanation: "exec = exécuter une commande dans un conteneur qui tourne."
    exercises:
      - slug: dk-ex-commandes-guide
        kind: COMPLETER
        title: "Compléter les commandes"
        difficulty: FACILE
        skill: docker-deploiement
        statement: "Complète : lancer en arrière-plan, lister, lire les journaux, arrêter."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Lancer : run. Lister : ps."
          - "Journaux : logs. Arrêter : stop."
          - "run, ps, logs, stop."
        solution: '["run", "ps", "logs", "stop"]'
        explanation: "Les quatre commandes du quotidien."
        xp: 10
        payload:
          language: bash
          template: |
            docker [[1]] -d --name api mon-api:1.0
            docker [[2]]
            docker [[3]] api
            docker [[4]] api
          blanks:
            - ["run"]
            - ["ps"]
            - ["logs"]
            - ["stop"]
      - slug: dk-ex-commandes-libre
        kind: CODE_LIBRE
        title: "Lancer et inspecter"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Écris trois commandes, une par ligne :
          1. lancer en arrière-plan un conteneur nommé `cache` à partir de l'image `redis:7-alpine` ;
          2. lister les conteneurs qui tournent ;
          3. lire les journaux du conteneur `cache`.
        criteria: "docker run -d --name cache redis:7-alpine, docker ps, docker logs cache."
        hints:
          - "`docker run -d --name cache redis:7-alpine`"
          - "`docker ps`"
          - "`docker logs cache`"
        solution: |
          docker run -d --name cache redis:7-alpine
          docker ps
          docker logs cache
        explanation: "Lancer, vérifier, lire."
        xp: 15
        payload:
          language: bash
          starter: |
            docker
          checks:
            - pattern: 'docker\s+run\s+(?=[^\n]*-d\b)(?=[^\n]*--name[\s=]+cache\b)[^\n]*redis:7-alpine'
              message: "Lance : docker run -d --name cache redis:7-alpine."
            - pattern: '(?m)^\s*docker\s+ps\s*$'
              message: "Liste avec docker ps."
            - pattern: '(?m)^\s*docker\s+logs\s+cache\s*$'
              message: "Lis les journaux avec docker logs cache."
      - slug: dk-ex-commandes-bug
        kind: CORRIGER_ERREUR
        title: "Des indices supprimés"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Le conteneur `api` plante. Ces commandes le suppriment tout de suite, sans lire ce qui s'est passé.
          Remplace `docker rm api` par `docker logs api`.
        criteria: "docker logs api, plus de docker rm."
        hints:
          - "Où se trouve le message d'erreur ?"
          - "Dans les journaux."
          - "`docker logs api`"
        solution: |
          docker ps -a
          docker logs api
        explanation: "Les logs d'abord."
        xp: 10
        payload:
          language: bash
          starter: |
            docker ps -a
            docker rm api
          checks:
            - pattern: 'docker\s+rm\b'
              absent: true
              message: "Ne supprime pas les indices."
            - pattern: 'docker\s+logs\s+api'
              message: "Écris docker logs api."

  # ===================================================================== LEÇON 3
  - slug: dk-ports
    title: "Ouvrir un port : -p"
    duration: 9
    objective: "Publier le port d'un conteneur pour l'atteindre depuis sa machine."
    prerequisites: "Leçon « Les commandes du quotidien »."
    skills: [docker-deploiement]
    xp: 15
    memo: |
      - Sans `-p`, l'application tourne dans le conteneur mais **personne** ne peut l'atteindre.
      - `-p 5433:5432` : le port **5433 de ta machine** mène au port **5432 du conteneur**.
      - L'ordre : `-p machine:conteneur`.
    commonMistakes: |
      - Oublier `-p` : l'application tourne mais personne ne peut l'atteindre.
      - Inverser les deux ports.
    blocks:
      - type: definition
        id: def-port
        term: "Publication de port"
        md: |
          Le conteneur est un **appartement** dans un immeuble. `-p 5433:5432` pose une **boîte aux lettres**
          sur la façade (port 5433 de ta machine) qui transmet le courrier à l'appartement (port 5432 dans
          le conteneur).
      - type: code
        id: code-port
        language: bash
        title: "PostgreSQL accessible depuis ta machine"
        code: |
          docker run -d --name bdd -p 5433:5432 -e POSTGRES_PASSWORD=secret-local postgres:16-alpine
          psql -h localhost -p 5433 -U postgres
        lines:
          - n: 1
            note: "`-p 5433:5432` : à gauche ta machine, à droite le conteneur."
          - n: 2
            note: "Depuis ta machine, on se connecte sur le port 5433."
      - type: question
        ref: dk-ct-q2
        review: def-port
      - type: question
        ref: dk-po-q2
        review: code-port
      - type: text
        md: "**Exercice 1 (guidé)** : complète la publication."
      - type: exercise
        ref: dk-ex-port-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : lancer un serveur web."
      - type: exercise
        ref: dk-ex-run
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une application injoignable."
      - type: exercise
        ref: dk-ex-port-bug
      - type: quiz
        items:
          - ref: dk-po-q3
            review: def-port
          - ref: dk-po-q4
            review: code-port
          - ref: dk-po-q5
            review: def-port
    questions:
      - code: dk-ct-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Avec `-p 5433:5432`, sur quel port ta machine atteint-elle PostgreSQL ?"
        choices:
          - label: "5433"
            correct: true
            why: "Le premier nombre est le port de ta machine."
          - label: "5432"
            correct: false
            why: "C'est le port à l'intérieur du conteneur."
          - label: "8080"
            correct: false
            why: "Il n'apparaît pas dans la commande."
        explanation: "`-p machine:conteneur`."
      - code: dk-po-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: docker-deploiement
        prompt: "Sans l'option `-p`, on peut quand même ouvrir l'application depuis son navigateur."
        choices:
          - label: "Vrai"
            correct: false
            why: "Le port n'est pas publié."
          - label: "Faux"
            correct: true
            why: "Il faut publier le port avec -p."
        explanation: "Pas de boîte aux lettres, pas de courrier."
      - code: dk-po-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Dans `-p 8081:80`, que représente 80 ?"
        choices:
          - label: "Le port à l'intérieur du conteneur"
            correct: true
            why: "À droite : le conteneur."
          - label: "Le port de ta machine"
            correct: false
            why: "C'est 8081, à gauche."
          - label: "Le nombre de conteneurs"
            correct: false
            why: "C'est un port."
        explanation: "machine:conteneur."
      - code: dk-po-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Pourquoi publier PostgreSQL sur 5433 plutôt que 5432 sur ta machine ?"
        choices:
          - label: "Pour ne pas entrer en conflit avec un PostgreSQL déjà installé sur le port 5432"
            correct: true
            why: "Deux programmes ne peuvent pas écouter le même port."
          - label: "Parce que 5432 est interdit"
            correct: false
            why: "Il est permis s'il est libre."
          - label: "Pour aller plus vite"
            correct: false
            why: "Aucun rapport."
        explanation: "Un port = une seule application à la fois."
      - code: dk-po-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Quelle option publie le port d'un conteneur ?"
        choices:
          - label: "-p"
            correct: true
            why: "publish."
          - label: "-d"
            correct: false
            why: "Arrière-plan."
          - label: "-e"
            correct: false
            why: "Variable d'environnement."
        explanation: "-p machine:conteneur."
    exercises:
      - slug: dk-ex-port-guide
        kind: COMPLETER
        title: "Compléter la publication"
        difficulty: FACILE
        skill: docker-deploiement
        statement: "L'API écoute sur 8080 dans le conteneur ; on veut l'atteindre sur 8080 de la machine. Complète."
        criteria: "Les deux trous sont corrects."
        hints:
          - "L'option : -p."
