  # ===================================================================== LEÇON 4
  - slug: dk-dockerfile
    title: "Écrire un Dockerfile"
    duration: 11
    objective: "Écrire les instructions de base d'un Dockerfile, construire l'image et la lancer."
    prerequisites: "Leçon « Ouvrir un port : -p »."
    skills: [docker-deploiement]
    xp: 15
    memo: |
      - **Dockerfile** : la recette de l'image, instruction par instruction.
      - `FROM` (image de départ), `WORKDIR` (dossier de travail), `COPY` (copier des fichiers), `RUN` (exécuter pendant la construction), `EXPOSE` (port documenté), `ENTRYPOINT`/`CMD` (commande au démarrage).
      - `docker build -t mon-api:1.0 .` construit l'image ; `docker run` la lance.
      - Docker garde en **cache** les étapes qui n'ont pas changé.
    commonMistakes: |
      - Confondre RUN (à la construction) et ENTRYPOINT (au démarrage).
      - `COPY . .` avant de télécharger les dépendances : le cache Docker ne sert plus à rien.
    blocks:
      - type: definition
        id: def-dockerfile
        term: "Dockerfile"
        md: |
          La **recette** de l'image : chaque ligne est une étape (prendre une base, poser les ingrédients,
          cuire), et la dernière dit comment servir le plat (la commande de démarrage).
      - type: code
        id: code-dockerfile-simple
        language: dockerfile
        title: "Un Dockerfile simple pour un jar déjà construit"
        code: |
          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          COPY target/app.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
        lines:
          - n: 1
            note: "L'image de départ : Java 21 (JRE), sur Alpine."
          - n: 2
            note: "Le dossier de travail dans l'image."
          - n: 3
            note: "Copie le jar dans l'image."
          - n: 4
            note: "Documente le port de l'application."
          - n: 5
            note: "La commande lancée au démarrage du conteneur."
      - type: question
        ref: dk-df-q3
        review: code-dockerfile-simple
      - type: question
        ref: dk-dk-q2
        review: code-dockerfile-simple
      - type: text
        md: "**Exercice 1 (guidé)** : complète le Dockerfile."
      - type: exercise
        ref: dk-ex-dockerfile-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : construire et lancer."
      - type: exercise
        ref: dk-ex-build-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une commande de démarrage mal placée."
      - type: exercise
        ref: dk-ex-dockerfile-bug
      - type: jury
        items:
          - q: "Comment passez-vous la configuration au conteneur ?"
            a: "Par des variables d'environnement au lancement (docker run -e, ou le fichier .env lu par Docker Compose). L'image ne contient aucun secret : la même image sert en recette et en production."
      - type: quiz
        items:
          - ref: dk-dk-q3
            review: code-dockerfile-simple
          - ref: dk-dk-q4
            review: def-dockerfile
          - ref: dk-dk-q5
            review: code-dockerfile-simple
    questions:
      - code: dk-df-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Quelle instruction définit la commande exécutée au démarrage du conteneur ?"
        choices:
          - label: "ENTRYPOINT (ou CMD)"
            correct: true
            why: "Elle s'exécute à chaque lancement."
          - label: "RUN"
            correct: false
            why: "RUN s'exécute pendant la construction de l'image."
          - label: "FROM"
            correct: false
            why: "FROM choisit l'image de départ."
        explanation: "RUN = à la construction ; ENTRYPOINT/CMD = au démarrage."
      - code: dk-dk-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Que fait `WORKDIR /app` ?"
        choices:
          - label: "Il choisit le dossier de travail dans l'image"
            correct: true
            why: "Les commandes suivantes s'exécutent dans /app."
          - label: "Il crée un conteneur nommé app"
            correct: false
            why: "C'est docker run --name."
          - label: "Il copie le dossier app"
            correct: false
            why: "C'est COPY."
        explanation: "WORKDIR = se placer dans un dossier."
      - code: dk-dk-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Quelle instruction choisit l'image de départ ?"
        choices:
          - label: "FROM"
            correct: true
            why: "Toujours la première."
          - label: "COPY"
            correct: false
            why: "Elle copie des fichiers."
          - label: "EXPOSE"
            correct: false
            why: "Elle documente un port."
        explanation: "FROM = la base de la recette."
      - code: dk-dk-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Quelle commande construit l'image à partir du Dockerfile ?"
        choices:
          - label: "`docker build -t mon-api:1.0 .`"
            correct: true
            why: "Le point = le dossier courant."
          - label: "`docker run mon-api:1.0`"
            correct: false
            why: "Elle lance un conteneur."
          - label: "`docker pull mon-api:1.0`"
            correct: false
            why: "Elle télécharge une image existante."
        explanation: "build = fabriquer le moule."
      - code: dk-dk-q5
        kind: VRAI_FAUX
        difficulty: 2
        skill: docker-deploiement
        prompt: "`RUN` s'exécute à chaque démarrage du conteneur."
        choices:
          - label: "Vrai"
            correct: false
            why: "RUN s'exécute une fois, à la construction."
          - label: "Faux"
            correct: true
            why: "Au démarrage, c'est ENTRYPOINT ou CMD."
        explanation: "Construction ≠ démarrage."
    exercises:
      - slug: dk-ex-dockerfile-guide
        kind: COMPLETER
        title: "Compléter le Dockerfile"
        difficulty: FACILE
        skill: docker-deploiement
        statement: "Complète les instructions du Dockerfile."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "L'image de départ : FROM. Le dossier : WORKDIR."
          - "Copier un fichier : COPY."
          - "FROM, WORKDIR, COPY, ENTRYPOINT."
        solution: '["FROM", "WORKDIR", "COPY", "ENTRYPOINT"]'
        explanation: "Départ, dossier, copie, démarrage."
        xp: 10
        payload:
          language: dockerfile
          template: |
            [[1]] eclipse-temurin:21-jre-alpine
            [[2]] /app
            [[3]] target/app.jar app.jar
            EXPOSE 8080
            [[4]] ["java", "-jar", "app.jar"]
          blanks:
            - ["FROM"]
            - ["WORKDIR"]
            - ["COPY"]
            - ["ENTRYPOINT", "CMD"]
      - slug: dk-ex-build-libre
        kind: CODE_LIBRE
        title: "Construire et lancer"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Écris deux commandes : construire l'image `bibliotheque-api:1.0` à partir du dossier courant, puis la
          lancer en arrière-plan, nommée `api`, sur le port 8080.
        criteria: "docker build -t bibliotheque-api:1.0 . puis docker run -d --name api -p 8080:8080 bibliotheque-api:1.0."
        hints:
          - "`docker build -t bibliotheque-api:1.0 .`"
          - "N'oublie pas le point final."
          - "`docker run -d --name api -p 8080:8080 bibliotheque-api:1.0`"
        solution: |
          docker build -t bibliotheque-api:1.0 .
          docker run -d --name api -p 8080:8080 bibliotheque-api:1.0
        explanation: "Fabriquer le moule, puis le gâteau."
        xp: 15
        payload:
          language: bash
          starter: |
            docker build
          checks:
            - pattern: 'docker\s+build\s+-t\s+bibliotheque-api:1\.0\s+\.\s*$'
              message: "Construis : docker build -t bibliotheque-api:1.0 ."
            - pattern: 'docker\s+run\s+(?=[^\n]*-d\b)(?=[^\n]*--name[\s=]+api\b)(?=[^\n]*-p[\s=]+8080:8080)[^\n]*bibliotheque-api:1\.0'
              message: "Lance : docker run -d --name api -p 8080:8080 bibliotheque-api:1.0."
      - slug: dk-ex-dockerfile-bug
        kind: CORRIGER_ERREUR
        title: "Une commande de démarrage mal placée"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Ce Dockerfile lance l'application avec `RUN` : elle démarre pendant la construction, puis rien au
          démarrage du conteneur. Remplace cette ligne par `ENTRYPOINT ["java", "-jar", "app.jar"]`.
        criteria: "ENTRYPOINT, plus de RUN java -jar."
        hints:
          - "RUN = à la construction."
          - "Au démarrage : ENTRYPOINT."
          - "`ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]`"
        solution: |
          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          COPY target/app.jar app.jar
          ENTRYPOINT ["java", "-jar", "app.jar"]
        explanation: "Construire d'un côté, démarrer de l'autre."
        xp: 10
        payload:
          language: dockerfile
          starter: |
            FROM eclipse-temurin:21-jre-alpine
            WORKDIR /app
            COPY target/app.jar app.jar
            RUN java -jar app.jar
          checks:
            - pattern: 'RUN\s+java\s+-jar'
              absent: true
              message: "RUN s'exécute à la construction."
            - pattern: 'ENTRYPOINT\s*\[\s*"java"\s*,\s*"-jar"\s*,\s*"app\.jar"\s*\]'
              message: "Écris ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]."

  # ===================================================================== LEÇON 5
  - slug: dk-multi-etapes
    title: "Une image légère : les étapes multiples"
    duration: 12
    objective: "Écrire un Dockerfile en deux étapes pour Spring Boot, sans code source, sans secret et sans root."
    prerequisites: "Leçon « Écrire un Dockerfile »."
    skills: [docker-deploiement, spring-structure]
    xp: 15
    memo: |
      - **Multi-étapes** : une étape « construction » avec Maven et le JDK, une étape « exécution » légère avec seulement le JRE.
      - `COPY --from=construction …` récupère seulement le jar.
      - Ne jamais copier de secret dans l'image ; utiliser un utilisateur **non-root** (`USER app`) ; un `.dockerignore`.
    commonMistakes: |
      - Une image finale très lourde qui contient Maven, le JDK et le code source.
      - Copier le fichier `.env` dans l'image.
    blocks:
      - type: definition
        id: def-multi-etapes
        term: "Construction en plusieurs étapes"
        md: |
          Pour fabriquer un meuble, il faut un **atelier** plein d'outils. Mais on ne livre pas l'atelier au
          client : seulement le meuble. La première étape (l'atelier, avec Maven) fabrique le `.jar` ; la
          seconde (le camion de livraison, léger) ne transporte que le `.jar` et de quoi l'exécuter.
      - type: code
        id: code-dockerfile
        language: dockerfile
        title: "backend/Dockerfile"
        code: |
          FROM eclipse-temurin:21-jdk AS construction
          WORKDIR /app
          COPY mvnw pom.xml ./
          COPY .mvn .mvn
          RUN ./mvnw -B dependency:go-offline
          COPY src src
          RUN ./mvnw -B package -DskipTests

          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          RUN addgroup -S app && adduser -S app -G app
          COPY --from=construction /app/target/*.jar app.jar
          USER app
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
        lines:
          - n: 1
            note: "Étape 1 (« atelier ») : une image avec le JDK complet."
          - n: 3
            note: "On copie d'abord **seulement** le pom.xml…"
          - n: 5
            note: "… pour télécharger les dépendances. Cette étape reste en cache tant que le pom ne change pas."
          - n: 7
            note: "Fabrique le `.jar`. Les tests tournent déjà dans la CI."
          - n: 9
            note: "Étape 2 (« livraison ») : juste le JRE, sur Alpine, très légère."
          - n: 11
            note: "Un utilisateur sans privilèges : si l'application est piratée, les dégâts restent limités."
          - n: 12
            note: "On récupère **seulement** le `.jar` de l'étape 1."
      - type: question
        ref: dk-df-q2
        review: def-multi-etapes
      - type: question
        ref: dk-df-q4
        review: code-dockerfile
      - type: text
        md: "**Exercice 1 (guidé)** : complète les deux étapes."
      - type: exercise
        ref: dk-ex-multi-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un .dockerignore."
      - type: exercise
        ref: dk-ex-dockerignore-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un Dockerfile à alléger."
      - type: exercise
        ref: dk-ex-dockerfile-corriger
      - type: jury
        items:
          - q: "Expliquez votre Dockerfile."
            a: "Il a deux étapes. La première part d'une image JDK, télécharge les dépendances Maven (étape mise en cache) puis construit le jar. La seconde part d'une image JRE Alpine légère, crée un utilisateur non root, copie uniquement le jar et le lance. L'image finale est petite et ne contient ni le code source ni Maven."
      - type: quiz
        items:
          - ref: dk-df-q5
            review: def-multi-etapes
          - ref: dk-c1-b1
            review: def-multi-etapes
          - ref: dk-me-q5
            review: code-dockerfile
          - ref: dk-df-q1
            review: code-dockerfile
    questions:
      - code: dk-df-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Quel est l'intérêt principal d'un Dockerfile en plusieurs étapes ?"
        choices:
          - label: "Une image finale légère, sans outils de construction ni code source"
            correct: true
            why: "Plus rapide à transférer, moins de surface d'attaque."
          - label: "Construire plus vite la première fois"
            correct: false
            why: "Le gain principal est la taille de l'image finale."
          - label: "Lancer plusieurs conteneurs"
            correct: false
            why: "Il ne produit qu'une image."
        explanation: "On livre le meuble, pas l'atelier."
      - code: dk-df-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: docker-deploiement
        prompt: "Il vaut mieux faire tourner l'application avec un utilisateur non root dans le conteneur."
        choices:
          - label: "Vrai"
            correct: true
            why: "Moindre privilège : une faille donne moins de pouvoir."
          - label: "Faux"
            correct: false
            why: "root dans le conteneur augmente les risques."
        explanation: "`USER app` dans le Dockerfile."
      - code: dk-df-q5
        kind: TEXTE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Quel fichier liste ce que Docker ne doit pas copier dans le contexte de construction (target, node_modules, .env) ? (son nom exact)"
        answers: [".dockerignore", "dockerignore"]
        explanation: "Comme `.gitignore`, mais pour `docker build`."
      - code: dk-c1-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Que se passe-t-il pour les données écrites dans un conteneur sans volume quand on le supprime ?"
        choices:
          - label: "Elles sont perdues"
            correct: true
            why: "Elles vivaient dans le conteneur."
          - label: "Elles sont sauvegardées dans l'image"
            correct: false
            why: "L'image est en lecture seule."
          - label: "Elles sont envoyées au registre"
            correct: false
            why: "Rien n'est envoyé automatiquement."
        explanation: "Pour une base de données, on utilise toujours un volume (voir le chapitre suivant)."
      - code: dk-df-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Pourquoi copier `pom.xml` et télécharger les dépendances **avant** de copier `src` ?"
        choices:
          - label: "Pour que Docker réutilise le cache des dépendances quand seul le code change"
            correct: true
            why: "Les constructions suivantes sont bien plus rapides."
          - label: "Parce que Maven l'exige"
            correct: false
            why: "C'est une optimisation pour Docker."
          - label: "Pour réduire la taille du code"
            correct: false
            why: "La taille du code ne change pas."
        explanation: "Ce qui change rarement en haut, ce qui change souvent en bas."
      - code: dk-me-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Que fait `COPY --from=construction /app/target/*.jar app.jar` ?"
        choices:
          - label: "Il récupère seulement le jar fabriqué à l'étape construction"
            correct: true
            why: "Le reste de l'atelier reste derrière."
          - label: "Il copie tout le projet"
            correct: false
            why: "Seulement le jar."
          - label: "Il télécharge le jar sur Internet"
            correct: false
            why: "Il vient de l'étape précédente."
        explanation: "On livre le meuble."
    exercises:
      - slug: dk-ex-multi-guide
        kind: COMPLETER
        title: "Compléter les deux étapes"
        difficulty: FACILE
        skill: docker-deploiement
        statement: "Complète le nom de la première étape, la copie depuis cette étape, et l'utilisateur."
        criteria: "Les trois trous sont corrects."
        hints:
          - "On nomme l'étape avec AS."
          - "On copie depuis l'étape avec --from ; l'utilisateur avec USER."
          - "construction, construction, USER."
        solution: '["construction", "construction", "USER"]'
        explanation: "Nommer, récupérer, sécuriser."
        xp: 10
        payload:
          language: dockerfile
          template: |
            FROM eclipse-temurin:21-jdk AS [[1]]
            …
            FROM eclipse-temurin:21-jre-alpine
            COPY --from=[[2]] /app/target/*.jar app.jar
            [[3]] app
          blanks:
            - ["construction"]
            - ["construction"]
            - ["USER"]
      - slug: dk-ex-dockerignore-libre
        kind: CODE_LIBRE
        title: "Un .dockerignore"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Écris un `.dockerignore` qui exclut `target/`, `node_modules/` et `.env`, une ligne chacun.
        criteria: "Trois lignes : target/, node_modules/, .env."
        hints:
          - "Une ligne par élément à exclure."
          - "Comme un .gitignore."
          - "`target/`, `node_modules/`, `.env`."
        solution: |
          target/
          node_modules/
          .env
        explanation: "Plus léger, et aucun secret dans le contexte."
        xp: 15
        payload:
          language: text
          starter: |
            target/
          checks:
            - pattern: '(?m)^\s*target/?\s*$'
              message: "Exclus target/."
            - pattern: '(?m)^\s*node_modules/?\s*$'
              message: "Exclus node_modules/."
