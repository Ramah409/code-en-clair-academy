slug: sb-api-en-couches
position: 2
level: INTERMEDIAIRE
title: "Construire une API en couches"
summary: "Lire l'adresse, lire un filtre, recevoir un corps JSON, choisir le statut, échanger des DTO, placer les règles dans un service et protéger les écritures avec une transaction. Une seule notion par leçon."
quizQuestionCount: 16

lessons:
  # ===================================================================== LEÇON 1
  - slug: sb-controleur-dto
    title: "Lire l'identifiant dans l'adresse : @PathVariable"
    duration: 9
    objective: "Lire une partie variable de l'adresse avec @PathVariable."
    prerequisites: "Chapitre « Découvrir Spring Boot et REST »."
    skills: [spring-rest]
    xp: 15
    memo: |
      - `@GetMapping("/{id}")` : `{id}` est une partie **variable** de l'adresse.
      - `@PathVariable Long id` : copie cette partie dans le paramètre `id`.
      - `GET /api/livres/12` → `id` vaut 12.
    commonMistakes: |
      - Oublier `{id}` dans l'adresse de `@GetMapping`.
      - Donner au paramètre un autre nom que `{id}` sans le préciser.
    blocks:
      - type: definition
        id: def-pathvariable
        term: "@PathVariable"
        md: |
          Le **numéro de chambre** écrit sur la clé : l'adresse `/api/livres/12` désigne le livre 12, et
          `@PathVariable` lit ce numéro pour toi.
      - type: code
        id: code-parametres
        language: java
        title: "Lire un livre par son identifiant"
        code: |
          @GetMapping("/{id}")
          public LivreDto lire(@PathVariable Long id) {
              return service.lire(id);
          }
        lines:
          - n: 1
            note: "`{id}` est une partie variable de l'adresse : `/api/livres/12`."
          - n: 2
            note: "`@PathVariable` copie cette partie dans le paramètre `id`."
      - type: question
        ref: sb-dto-q1
        review: code-parametres
      - type: question
        ref: sb-pv-q2
        review: def-pathvariable
      - type: text
        md: "**Exercice 1 (guidé)** : complète la méthode."
      - type: exercise
        ref: sb-ex-pathvariable-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : lire une salle."
      - type: exercise
        ref: sb-ex-pathvariable-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une adresse sans partie variable."
      - type: exercise
        ref: sb-ex-pathvariable-bug
      - type: quiz
        items:
          - ref: sb-pv-q3
            review: code-parametres
          - ref: sb-pv-q4
            review: def-pathvariable
          - ref: sb-pv-q5
            review: code-parametres
    questions:
      - code: sb-dto-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Quelle annotation lit `12` dans `GET /api/livres/12` ?"
        choices:
          - label: "@PathVariable"
            correct: true
            why: "La valeur fait partie du chemin."
          - label: "@RequestBody"
            correct: false
            why: "Le corps est vide pour un GET."
          - label: "@RequestParam"
            correct: false
            why: "Il lit ce qui suit `?`."
        explanation: "Chemin → @PathVariable."
      - code: sb-pv-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Dans `@GetMapping(\"/{id}\")`, que représente `{id}` ?"
        choices:
          - label: "Une partie variable de l'adresse"
            correct: true
            why: "12, 40, 7… selon la requête."
          - label: "Le texte exact « {id} »"
            correct: false
            why: "Les accolades la rendent variable."
          - label: "Un paramètre après le ?"
            correct: false
            why: "C'est le rôle de @RequestParam."
        explanation: "{nom} = partie variable."
      - code: sb-pv-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: spring-rest
        prompt: "Avec la requête `GET /api/livres/40`, que vaut `id` ?"
        snippet: |
          @GetMapping("/{id}")
          public LivreDto lire(@PathVariable Long id) { … }
        language: java
        choices:
          - label: "40"
            correct: true
            why: "La partie variable de l'adresse."
          - label: "livres"
            correct: false
            why: "C'est la partie fixe."
          - label: "null"
            correct: false
            why: "@PathVariable l'a rempli."
        explanation: "L'adresse est découpée par Spring."
      - code: sb-pv-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: spring-rest
        prompt: "@PathVariable sert à identifier une ressource précise (le livre 12)."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est son usage principal."
          - label: "Faux"
            correct: false
            why: "L'identifiant est dans le chemin."
        explanation: "/ressources/{id} → @PathVariable."
      - code: sb-pv-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Quelle méthode répond à `DELETE /api/livres/12` ?"
        choices:
          - label: "`@DeleteMapping(\"/{id}\") supprimer(@PathVariable Long id)`"
            correct: true
            why: "Bon verbe, bonne partie variable."
          - label: "`@DeleteMapping supprimer(@PathVariable Long id)`"
            correct: false
            why: "Il manque {id} dans l'adresse."
          - label: "`@GetMapping(\"/{id}\") supprimer(@PathVariable Long id)`"
            correct: false
            why: "GET ne supprime pas."
        explanation: "Verbe + {id} + @PathVariable."
    exercises:
      - slug: sb-ex-pathvariable-guide
        kind: COMPLETER
        title: "Compléter la méthode"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète la méthode qui lit un client par son identifiant."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une lecture : GetMapping."
          - "La partie variable s'écrit {id} ; on la lit avec PathVariable."
          - "GetMapping, {id}, PathVariable."
        solution: '["GetMapping", "{id}", "PathVariable"]'
        explanation: "Verbe, partie variable, lecture."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]]("/[[2]]")
            public ClientDto lire(@[[3]] Long id) {
                return service.lire(id);
            }
          blanks:
            - ["GetMapping"]
            - ["{id}"]
            - ["PathVariable"]
      - slug: sb-ex-pathvariable-libre
        kind: CODE_LIBRE
        title: "Lire une salle"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          Écris la méthode `lire` qui répond à `GET /api/salles/{id}` (le `@RequestMapping("/api/salles")` est
          déjà sur la classe) et renvoie `service.lire(id)` sous forme de `SalleDto`.
        criteria: "@GetMapping(\"/{id}\") et @PathVariable Long id."
        hints:
          - "`@GetMapping(\"/{id}\")`"
          - "`public SalleDto lire(@PathVariable Long id)`"
          - "`return service.lire(id);`"
        solution: |
          @GetMapping("/{id}")
          public SalleDto lire(@PathVariable Long id) {
              return service.lire(id);
          }
        explanation: "L'adresse identifie la salle."
        xp: 15
        payload:
          language: java
          starter: |
            public SalleDto lire() {

            }
          checks:
            - pattern: '@GetMapping\s*\(\s*"/\{id\}"\s*\)'
              message: "Ajoute @GetMapping(\"/{id}\")."
            - pattern: 'lire\s*\(\s*@PathVariable\s+(?:Long|long)\s+id\s*\)'
              message: "Le paramètre : @PathVariable Long id."
            - pattern: 'return\s+service\.lire\s*\(\s*id\s*\)'
              message: "Renvoie service.lire(id)."
      - slug: sb-ex-pathvariable-bug
        kind: CORRIGER_ERREUR
        title: "Une adresse sans partie variable"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          `id` ne peut pas être lu : l'adresse de `@GetMapping` n'a pas de partie variable. Corrige-la.
        criteria: "@GetMapping(\"/{id}\")."
        hints:
          - "Où Spring lit-il la valeur de id ?"
          - "Dans une partie variable de l'adresse."
          - "`@GetMapping(\"/{id}\")`"
        solution: |
          @GetMapping("/{id}")
          public LivreDto lire(@PathVariable Long id) {
              return service.lire(id);
          }
        explanation: "Pas de {id}, pas de valeur à lire."
        xp: 10
        payload:
          language: java
          starter: |
            @GetMapping
            public LivreDto lire(@PathVariable Long id) {
                return service.lire(id);
            }
          checks:
            - pattern: '@GetMapping\s*\(\s*"/\{id\}"\s*\)'
              message: "Écris @GetMapping(\"/{id}\")."

  # ===================================================================== LEÇON 2
  - slug: sb-requestparam
    title: "Lire un filtre : @RequestParam"
    duration: 9
    objective: "Lire un paramètre après le point d'interrogation avec @RequestParam, pour filtrer ou chercher."
    prerequisites: "Leçon « Lire l'identifiant dans l'adresse : @PathVariable »."
    skills: [spring-rest]
    xp: 15
    memo: |
      - `/api/livres?auteur=Hugo` : `auteur=Hugo` est un **paramètre de requête**.
      - `@RequestParam String auteur` : lit sa valeur.
      - `@RequestParam(required = false)` : le paramètre est facultatif.
      - `@PathVariable` **identifie** une ressource ; `@RequestParam` **filtre** ou **cherche**.
    commonMistakes: |
      - Mettre un filtre dans le chemin (`/api/livres/auteur/Hugo`).
      - Oublier `required = false` pour un filtre facultatif : sans lui, Spring répond 400.
    blocks:
      - type: definition
        id: def-requestparam
        term: "@RequestParam"
        md: |
          Une **option cochée** sur un formulaire de recherche : « livres, **auteur = Hugo** ». Ce qui suit le
          `?` précise la demande, sans désigner une ressource unique.
      - type: code
        id: code-requestparam
        language: java
        title: "Chercher par auteur"
        code: |
          @GetMapping(params = "auteur")
          public List<LivreDto> parAuteur(@RequestParam String auteur) {
              return service.parAuteur(auteur);
          }
        lines:
          - n: 1
            note: "Cette méthode répond quand l'adresse contient `?auteur=…`."
          - n: 2
            note: "`@RequestParam` lit la valeur : `Hugo` pour `/api/livres?auteur=Hugo`."
      - type: question
        ref: sb-rp-q1
        review: code-requestparam
      - type: question
        ref: sb-rp-q2
        review: def-requestparam
      - type: text
        md: "**Exercice 1 (guidé)** : chemin ou filtre ?"
      - type: exercise
        ref: sb-ex-requestparam-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : chercher des salles par ville."
      - type: exercise
        ref: sb-ex-requestparam-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un filtre obligatoire."
      - type: exercise
        ref: sb-ex-requestparam-bug
      - type: jury
        items:
          - q: "Quelle différence entre @PathVariable et @RequestParam ?"
            a: "@PathVariable lit une partie de l'adresse qui identifie la ressource (/livres/12). @RequestParam lit un paramètre après le point d'interrogation, souvent pour filtrer, trier ou paginer (/livres?page=2)."
      - type: quiz
        items:
          - ref: sb-rp-q3
            review: def-requestparam
          - ref: sb-rp-q4
            review: code-requestparam
          - ref: sb-rp-q5
            review: def-requestparam
    questions:
      - code: sb-rp-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Quelle annotation lit `Hugo` dans `/api/livres?auteur=Hugo` ?"
        choices:
          - label: "@RequestParam"
            correct: true
            why: "La valeur suit le ?."
          - label: "@PathVariable"
            correct: false
            why: "Elle lit le chemin."
          - label: "@RequestBody"
            correct: false
            why: "Il lit le corps JSON."
        explanation: "Après le ? → @RequestParam."
      - code: sb-rp-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "À quoi sert surtout un paramètre après le `?` ?"
        choices:
          - label: "À filtrer, chercher ou paginer"
            correct: true
            why: "Il précise la demande."
          - label: "À identifier une ressource unique"
            correct: false
            why: "C'est le rôle du chemin."
          - label: "À envoyer le mot de passe"
            correct: false
            why: "Jamais dans l'adresse."
        explanation: "Chemin = qui ; paramètre = quelles options."
      - code: sb-rp-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-rest
        prompt: "Sans `required = false`, un @RequestParam absent provoque une erreur 400."
        choices:
          - label: "Vrai"
            correct: true
            why: "Il est obligatoire par défaut."
          - label: "Faux"
            correct: false
            why: "Spring exige le paramètre par défaut."
        explanation: "required = false pour un filtre facultatif."
      - code: sb-rp-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Quelle adresse appelle `parAuteur` de l'exemple ?"
        choices:
          - label: "GET /api/livres?auteur=Hugo"
            correct: true
            why: "Paramètre auteur après le ?."
          - label: "GET /api/livres/Hugo"
            correct: false
            why: "Ce serait une partie du chemin."
          - label: "POST /api/livres"
            correct: false
            why: "C'est une création."
        explanation: "params = \"auteur\" : il faut ?auteur=…"
      - code: sb-rp-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Où ne faut-il jamais placer un mot de passe ?"
        choices:
          - label: "Dans un paramètre d'adresse (?motDePasse=…)"
            correct: true
            why: "Les adresses sont enregistrées dans les journaux et l'historique."
          - label: "Dans le corps d'un POST en HTTPS"
            correct: false
            why: "C'est l'endroit prévu."
          - label: "Nulle part, on ne l'envoie jamais"
            correct: false
            why: "Il faut bien l'envoyer pour se connecter."
        explanation: "Données sensibles : dans le corps, en HTTPS."
    exercises:
      - slug: sb-ex-requestparam-guide
        kind: COMPLETER
        title: "Chemin ou filtre ?"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète chaque méthode avec PathVariable ou RequestParam."
        criteria: "Les deux trous sont corrects."
        hints:
          - "`/api/salles/3` : le 3 est dans le chemin."
          - "`/api/salles?ville=Lyon` : Lyon suit le ?."
          - "PathVariable, RequestParam."
        solution: '["PathVariable", "RequestParam"]'
        explanation: "Identifier ou filtrer."
        xp: 10
        payload:
          language: java
          template: |
            // GET /api/salles/3
            @GetMapping("/{id}")
            public SalleDto lire(@[[1]] Long id) { return service.lire(id); }

            // GET /api/salles?ville=Lyon
            @GetMapping(params = "ville")
            public List<SalleDto> parVille(@[[2]] String ville) { return service.parVille(ville); }
          blanks:
            - ["PathVariable"]
            - ["RequestParam"]
      - slug: sb-ex-requestparam-libre
        kind: CODE_LIBRE
        title: "Chercher des salles par ville"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          Écris `parVille` qui répond à `GET /api/salles?ville=…`, lit `ville` avec `@RequestParam` et renvoie
          `service.parVille(ville)` (type `List<SalleDto>`).
        criteria: "@GetMapping(params = \"ville\"), @RequestParam String ville."
        hints:
          - "`@GetMapping(params = \"ville\")`"
          - "`public List<SalleDto> parVille(@RequestParam String ville)`"
          - "`return service.parVille(ville);`"
        solution: |
          @GetMapping(params = "ville")
          public List<SalleDto> parVille(@RequestParam String ville) {
              return service.parVille(ville);
          }
        explanation: "Un filtre après le ?."
        xp: 15
        payload:
          language: java
          starter: |
            public List<SalleDto> parVille() {

            }
          checks:
            - pattern: '@GetMapping\s*\(\s*params\s*=\s*"ville"\s*\)'
              message: "Ajoute @GetMapping(params = \"ville\")."
            - pattern: 'parVille\s*\(\s*@RequestParam\s+String\s+ville\s*\)'
              message: "Le paramètre : @RequestParam String ville."
            - pattern: 'return\s+service\.parVille\s*\(\s*ville\s*\)'
              message: "Renvoie service.parVille(ville)."
      - slug: sb-ex-requestparam-bug
        kind: CORRIGER_ERREUR
        title: "Un filtre obligatoire"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          `GET /api/livres` sans `?genre=…` répond 400, alors que le genre doit être facultatif. Rends le
          paramètre facultatif.
        criteria: "@RequestParam(required = false)."
        hints:
          - "Par défaut, un @RequestParam est obligatoire."
          - "Une option le rend facultatif."
          - "`@RequestParam(required = false) String genre`"
        solution: |
          @GetMapping
          public List<LivreDto> lister(@RequestParam(required = false) String genre) {
              return service.lister(genre);
          }
        explanation: "required = false : le filtre peut manquer."
        xp: 10
        payload:
          language: java
          starter: |
            @GetMapping
            public List<LivreDto> lister(@RequestParam String genre) {
                return service.lister(genre);
            }
          checks:
            - pattern: '@RequestParam\s*\(\s*required\s*=\s*false\s*\)\s+String\s+genre'
              message: "Écris @RequestParam(required = false) String genre."

  # ===================================================================== LEÇON 3
  - slug: sb-requestbody
    title: "Recevoir un objet JSON : @RequestBody"
    duration: 9
    objective: "Recevoir le corps JSON d'un POST ou d'un PUT sous forme d'objet Java avec @RequestBody."
    prerequisites: "Leçon « Lire un filtre : @RequestParam »."
    skills: [spring-rest]
    xp: 15
    memo: |
      - `@PostMapping` + `@RequestBody LivreRequest req` : le JSON reçu devient un objet Java.
      - Les noms des champs JSON correspondent aux noms des champs de l'objet.
      - Sans `@RequestBody`, l'objet reste vide.
    commonMistakes: |
      - Oublier `@RequestBody` : tous les champs sont null.
      - Envoyer un JSON dont les noms ne correspondent pas aux champs.
    blocks:
      - type: definition
        id: def-requestbody
        term: "@RequestBody"
        md: |
          Le **déballage du colis** : le JSON arrive emballé dans le corps de la requête ; `@RequestBody`
          l'ouvre et range chaque valeur dans le bon champ de l'objet Java.
      - type: code
        id: code-requestbody
        language: java
        title: "Créer un livre"
        code: |
          public record LivreRequest(String titre, String auteur) {}

          @PostMapping
          public LivreDto creer(@RequestBody LivreRequest req) {
              return service.creer(req);
          }

          // Corps reçu : { "titre": "Dune", "auteur": "Frank Herbert" }
        lines:
          - n: 1
            note: "L'objet qui recevra les données : mêmes noms que dans le JSON."
          - n: 4
            note: "`@RequestBody` : le JSON du corps devient un `LivreRequest`."
      - type: question
        ref: sb-dto-q3
        review: code-requestbody
      - type: question
        ref: sb-rb-q2
        review: def-requestbody
      - type: text
        md: "**Exercice 1 (guidé)** : complète la modification."
      - type: exercise
        ref: sb-ex-dto-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : créer une salle."
      - type: exercise
        ref: sb-ex-requestbody-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un objet toujours vide."
      - type: exercise
        ref: sb-ex-requestbody-bug
      - type: quiz
        items:
          - ref: sb-rb-q3
            review: code-requestbody
          - ref: sb-rb-q4
            review: def-requestbody
          - ref: sb-c2-b1
            review: def-requestbody
    questions:
      - code: sb-dto-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Le livre reçu dans `creer(LivreRequest req)` a tous ses champs à null. Pourquoi ?"
        choices:
          - label: "Il manque @RequestBody devant le paramètre"
            correct: true
            why: "Sans lui, Spring ne lit pas le JSON."
          - label: "Il manque @PathVariable"
            correct: false
            why: "Rien n'est lu dans l'adresse ici."
          - label: "Le record n'a pas de setters"
            correct: false
            why: "Jackson sait créer des records."
        explanation: "JSON dans le corps → @RequestBody."
      - code: sb-rb-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Avec quels verbes reçoit-on le plus souvent un corps JSON ?"
        choices:
          - label: "POST et PUT"
            correct: true
            why: "Créer et remplacer envoient des données."
          - label: "GET et DELETE"
            correct: false
            why: "Ils n'ont généralement pas de corps."
          - label: "Aucun"
            correct: false
            why: "POST et PUT en ont un."
        explanation: "Écrire = envoyer des données."
      - code: sb-rb-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: spring-rest
        prompt: "Avec le corps `{ \"titre\": \"Dune\", \"auteur\": \"Frank Herbert\" }`, que vaut `req.titre()` ?"
        snippet: |
          public record LivreRequest(String titre, String auteur) {}
          public LivreDto creer(@RequestBody LivreRequest req) { … }
        language: java
        choices:
          - label: "Dune"
            correct: true
            why: "Le champ titre du JSON."
          - label: "Frank Herbert"
            correct: false
            why: "C'est l'auteur."
          - label: "null"
            correct: false
            why: "@RequestBody l'a rempli."
        explanation: "Noms JSON = noms des champs."
      - code: sb-rb-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-rest
        prompt: "Si le JSON envoie `\"name\"` au lieu de `\"titre\"`, le champ titre reste vide."
        choices:
          - label: "Vrai"
            correct: true
            why: "Les noms doivent correspondre."
          - label: "Faux"
            correct: false
            why: "Spring ne devine pas les traductions."
        explanation: "Le contrat JSON est précis."
      - code: sb-c2-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Quel verbe HTTP convient pour modifier seulement le titre d'un livre ?"
        choices:
          - label: "PATCH"
            correct: true
            why: "Modification partielle."
          - label: "PUT"
            correct: false
            why: "PUT remplace toute la ressource."
          - label: "POST"
            correct: false
            why: "POST crée."
        explanation: "PUT = tout remplacer ; PATCH = modifier une partie."
    exercises:
      - slug: sb-ex-dto-guide
        kind: COMPLETER
        title: "Compléter la modification"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète : le verbe de remplacement, la partie variable et le corps reçu."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Remplacer : PutMapping."
          - "L'identifiant : PathVariable ; le JSON : RequestBody."
          - "PutMapping, PathVariable, RequestBody."
        solution: '["PutMapping", "PathVariable", "RequestBody"]'
        explanation: "Lire l'adresse, lire le corps : deux annotations à ne pas confondre."
        xp: 10
        payload:
