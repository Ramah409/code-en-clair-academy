  # ===================================================================== LEÇON 6
  - slug: sb-service
    title: "La couche service et les règles métier"
    duration: 11
    objective: "Placer une règle métier dans un service et signaler un problème avec une exception claire."
    prerequisites: "Leçon « Les DTO : ce qui entre et sort de l'API »."
    skills: [spring-structure]
    xp: 15
    memo: |
      - **Contrôleur** → **Service** → **Repository** : chaque couche n'appelle que la suivante.
      - `@Service` : la classe contient les **règles métier** (un livre déjà emprunté ne peut pas être emprunté).
      - `findById(id).orElseThrow(() -> new RessourceIntrouvableException(...))` : une absence devient une erreur claire.
      - Quand une règle est violée, le service **lance une exception** (`throw new LivreDejaEmprunteException(...)`).
    commonMistakes: |
      - Mettre la règle dans le contrôleur.
      - Renvoyer `null` quand un élément est introuvable au lieu de lancer une exception claire.
    blocks:
      - type: text
        md: |
          Le contrôleur est un standardiste : il ne décide rien. Les décisions sont prises par le **service**,
          l'expert métier. Ainsi, les règles sont **au même endroit** et faciles à tester.
      - type: definition
        id: def-couches
        term: "Architecture en couches"
        md: |
          Comme dans un restaurant : le **serveur** (contrôleur) prend la commande, le **chef** (service)
          décide comment cuisiner et vérifie les ingrédients, le **commis** (repository) va chercher les
          produits dans la réserve (la base). Personne ne saute d'étape.
      - type: code
        id: code-service
        language: java
        title: "EmpruntService.java"
        code: |
          @Service
          public class EmpruntService {

              private final LivreRepository livres;

              public EmpruntService(LivreRepository livres) {
                  this.livres = livres;
              }

              public LivreDto verifierDisponible(Long livreId) {
                  Livre livre = livres.findById(livreId)
                          .orElseThrow(() -> new RessourceIntrouvableException("Livre " + livreId));
                  if (livre.isEmprunte()) {
                      throw new LivreDejaEmprunteException(livre.getTitre());
                  }
                  return LivreDto.from(livre);
              }
          }
        lines:
          - n: 1
            note: "`@Service` : un bean qui porte la logique métier."
          - n: 6
            note: "Injection par constructeur du repository."
          - n: 12
            note: "`orElseThrow` : si le livre n'existe pas, on lance une exception claire (qui deviendra un 404)."
          - n: 13
            note: "La **règle métier** : un livre déjà emprunté n'est pas disponible."
          - n: 16
            note: "On renvoie un DTO, jamais l'entité."
