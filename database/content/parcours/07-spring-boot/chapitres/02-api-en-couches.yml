  # ===================================================================== LEÇON 7
  - slug: sb-transactional
    title: "Tout ou rien : @Transactional"
    duration: 10
    objective: "Protéger plusieurs écritures avec @Transactional pour qu'elles réussissent ensemble ou soient toutes annulées."
    prerequisites: "Leçon « La couche service et les règles métier »."
    skills: [spring-structure]
    xp: 15
    memo: |
      - `@Transactional` : toutes les écritures de la méthode réussissent **ensemble** ou sont **toutes annulées** (rollback).
      - Le rollback a lieu par défaut sur les exceptions non vérifiées (`RuntimeException`).
      - On le place sur les méthodes de **service** qui écrivent ; `readOnly = true` pour les lectures.
    commonMistakes: |
      - Oublier `@Transactional` sur une méthode qui écrit dans plusieurs tables.
      - Le mettre sur le contrôleur au lieu du service.
    blocks:
      - type: definition
        id: def-transaction
        term: "Transaction"
        md: |
          Un **déménagement en un seul voyage** : soit tous les cartons arrivent dans la nouvelle maison, soit on
          ramène tout à l'ancienne. Jamais la moitié des meubles d'un côté et le reste de l'autre.
      - type: code
        id: code-transaction
        language: java
        title: "Emprunter un livre"
        code: |
          @Transactional
          public void emprunter(Long livreId, Long adherentId) {
              Livre livre = livres.findById(livreId)
                      .orElseThrow(() -> new RessourceIntrouvableException("Livre " + livreId));
              livre.setEmprunte(true);
              emprunts.save(new Emprunt(livre, adherentId));
          }
        lines:
          - n: 1
            note: "`@Transactional` : les deux écritures forment un tout."
          - n: 5
            note: "Première écriture : le livre devient emprunté."
          - n: 6
            note: "Seconde écriture : l'emprunt est enregistré. Si elle échoue, la première est annulée."
      - type: question
        ref: sb-sv-q2
        review: code-transaction
      - type: question
        ref: sb-sv-q5
        review: def-transaction
      - type: text
        md: "**Exercice 1 (guidé)** : complète les annotations."
      - type: exercise
        ref: sb-ex-transaction-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : la règle des emprunts."
      - type: exercise
        ref: sb-ex-regle-metier
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : deux écritures sans filet."
      - type: exercise
        ref: sb-ex-transaction-bug
      - type: jury
        items:
          - q: "À quoi sert @Transactional ?"
            a: "À exécuter plusieurs opérations en base de façon atomique : si une exception non vérifiée survient, tout est annulé (rollback). Je la place sur les méthodes de service qui écrivent, et readOnly = true sur les lectures."
      - type: quiz
        items:
          - ref: sb-tx-q3
            review: def-transaction
          - ref: sb-tx-q4
            review: code-transaction
          - ref: sb-tx-q5
            review: def-transaction
