        skill: spring-rest
        statement: |
          L'entité `Utilisateur` contient `id`, `email`, `motDePasseHash` et `role`. Écris le record
          `UtilisateurDto` qui ne contient que `Long id`, `String email` et `String role`.
        criteria: "Un record avec id, email et role, sans motDePasseHash."
