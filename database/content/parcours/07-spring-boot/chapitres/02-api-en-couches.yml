  # ===================================================================== LEÇON 5
  - slug: sb-dto
    title: "Les DTO : ce qui entre et sort de l'API"
    duration: 10
    objective: "Utiliser des records comme DTO pour contrôler exactement ce qui entre et sort de l'API."
    prerequisites: "Leçon « Choisir le statut : ResponseEntity »."
    skills: [spring-rest]
    xp: 15
    memo: |
      - **DTO** (objet de transfert) : un `record` qui contient **seulement** ce qui entre ou sort de l'API.
      - Un DTO d'**entrée** (`LivreRequest`) n'a pas d'`id` : c'est la base qui le donne.
      - Un DTO de **sortie** (`LivreDto`) ne contient jamais de champ sensible (mot de passe haché).
      - `LivreDto.from(livre)` : transformer l'entité en DTO.
    commonMistakes: |
      - Renvoyer directement l'entité JPA : on expose des champs internes.
      - Mettre un `id` dans le DTO d'entrée d'une création.
    blocks:
      - type: definition
        id: def-dto
        term: "DTO (objet de transfert de données)"
        md: |
          Le **bon de livraison** de l'API : il liste seulement ce qui voyage, pas tout le contenu de
          l'entrepôt. L'entité (la table) peut contenir un mot de passe haché ou des dates internes : le DTO,
          lui, ne montre que ce que le frontend doit voir.
      - type: code
        id: code-dto
        language: java
        title: "Deux records : l'entrée et la sortie"
        code: |
          public record LivreRequest(String titre, String auteur, Long genreId) {}

          public record LivreDto(Long id, String titre, String auteur, String genre) {
              public static LivreDto from(Livre l) {
                  return new LivreDto(l.getId(), l.getTitre(), l.getAuteur(), l.getGenre().getNom());
              }
          }
        lines:
          - n: 1
            note: "Ce que le frontend **envoie** : pas d'`id`, c'est la base qui le donne."
          - n: 3
            note: "Ce que l'API **renvoie** : le nom du genre plutôt que l'objet entier."
          - n: 4
            note: "Une méthode pratique pour transformer l'entité en DTO."
      - type: question
        ref: sb-dto-q2
        review: def-dto
      - type: question
        ref: sb-dto-q4
        review: code-dto
      - type: text
        md: "**Exercice 1 (guidé)** : complète les deux records."
      - type: exercise
        ref: sb-ex-dto-records-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : le DTO d'un utilisateur."
      - type: exercise
        ref: sb-ex-dto-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un mot de passe exposé."
      - type: exercise
        ref: sb-ex-dto-bug
      - type: jury
        items:
          - q: "Pourquoi utiliser des DTO plutôt que renvoyer les entités ?"
            a: "Pour contrôler exactement ce qui entre et sort de l'API : on n'expose pas le mot de passe haché ni les champs internes, on évite les boucles de sérialisation des relations JPA, et on peut faire évoluer la base sans casser le contrat de l'API. J'utilise des records Java, immuables et concis."
      - type: quiz
        items:
          - ref: sb-dt-q3
            review: code-dto
          - ref: sb-dt-q4
            review: def-dto
          - ref: sb-dt-q5
            review: code-dto
    questions:
      - code: sb-dto-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Quel est le principal danger de renvoyer l'entité `Utilisateur` directement ?"
        choices:
          - label: "Exposer des champs sensibles comme le mot de passe haché"
            correct: true
            why: "Tout ce qui est dans l'entité part dans le JSON."
          - label: "La réponse est plus lente"
            correct: false
            why: "Le problème est la sécurité et le couplage."
          - label: "Spring refuse de compiler"
            correct: false
            why: "Il compile, c'est justement le piège."
        explanation: "Le DTO choisit ce qui sort."
      - code: sb-dto-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: spring-rest
        prompt: "Un `record` Java est pratique pour un DTO car il est court et immuable."
        choices:
          - label: "Vrai"
            correct: true
            why: "Constructeur, accesseurs, equals et toString sont générés."
          - label: "Faux"
            correct: false
            why: "C'est justement l'usage recommandé."
        explanation: "`public record LivreDto(Long id, String titre) {}`"
      - code: sb-dt-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Pourquoi `LivreRequest` n'a-t-il pas d'`id` ?"
        choices:
          - label: "Parce que c'est la base qui attribue l'identifiant à la création"
            correct: true
            why: "Le frontend ne le connaît pas encore."
          - label: "Parce que les records n'acceptent pas les nombres"
            correct: false
            why: "Ils acceptent tous les types."
          - label: "Par oubli"
            correct: false
            why: "C'est voulu."
        explanation: "Entrée : ce que le client sait ; sortie : ce qu'il doit voir."
      - code: sb-dt-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Que veut dire DTO ?"
        choices:
          - label: "Data Transfer Object : objet de transfert de données"
            correct: true
            why: "Il transporte les données de l'API."
          - label: "Database Table Object"
            correct: false
            why: "C'est l'entité qui représente la table."
          - label: "Direct Text Output"
            correct: false
            why: "Aucun rapport."
        explanation: "Le bon de livraison."
      - code: sb-dt-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "À quoi sert `LivreDto.from(livre)` ?"
        choices:
          - label: "À transformer l'entité en DTO de sortie"
            correct: true
            why: "On choisit les champs qui sortent."
          - label: "À enregistrer le livre en base"
            correct: false
            why: "C'est le rôle du repository."
          - label: "À lire le JSON reçu"
            correct: false
            why: "C'est le rôle de @RequestBody."
        explanation: "Entité → DTO à la sortie du service."
    exercises:
      - slug: sb-ex-dto-records-guide
        kind: COMPLETER
        title: "Compléter les deux records"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète le mot-clé, puis le champ qui n'existe que dans la sortie."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Un DTO concis s'écrit avec record."
          - "La sortie contient l'identifiant donné par la base."
          - "record, record, id."
        solution: '["record", "record", "id"]'
        explanation: "L'entrée sans id, la sortie avec."
        xp: 10
        payload:
          language: java
          template: |
            public [[1]] SalleRequest(String nom, String ville) {}

            public [[2]] SalleDto(Long [[3]], String nom, String ville) {}
          blanks:
            - ["record"]
            - ["record"]
            - ["id"]
      - slug: sb-ex-dto-libre
        kind: CODE_LIBRE
