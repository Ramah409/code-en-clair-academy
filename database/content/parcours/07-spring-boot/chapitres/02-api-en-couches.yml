  # ===================================================================== LEÇON 4
  - slug: sb-responseentity
    title: "Choisir le statut : ResponseEntity"
    duration: 10
    objective: "Répondre avec le bon statut (201, 204) grâce à ResponseEntity."
    prerequisites: "Leçon « Recevoir un objet JSON : @RequestBody »."
    skills: [spring-rest, api-rest]
    xp: 15
    memo: |
      - Par défaut, Spring répond **200**.
      - `ResponseEntity.status(HttpStatus.CREATED).body(dto)` : **201** avec le corps.
      - `ResponseEntity.noContent().build()` : **204**, sans corps.
      - Le type de retour devient `ResponseEntity<LivreDto>` (ou `ResponseEntity<Void>` sans corps).
    commonMistakes: |
      - Toujours répondre 200, même après une création ou une suppression.
      - Oublier `.build()` après `noContent()`.
    blocks:
      - type: definition
        id: def-responseentity
        term: "ResponseEntity"
        md: |
          L'**enveloppe complète** de la réponse : on choisit le tampon (le statut) et ce qu'on met dedans (le
          corps). Sans elle, Spring met toujours le tampon « 200 ».
      - type: code
        id: code-responseentity
        language: java
        title: "Créer et supprimer avec le bon statut"
        code: |
          @PostMapping
          public ResponseEntity<LivreDto> creer(@RequestBody LivreRequest req) {
              LivreDto cree = service.creer(req);
              return ResponseEntity.status(HttpStatus.CREATED).body(cree);
          }

          @DeleteMapping("/{id}")
          public ResponseEntity<Void> supprimer(@PathVariable Long id) {
              service.supprimer(id);
              return ResponseEntity.noContent().build();
          }
        lines:
          - n: 4
            note: "Statut **201** + le livre créé dans le corps."
          - n: 8
            note: "`Void` : il n'y aura pas de corps."
          - n: 10
            note: "Statut **204** : réussi, rien à renvoyer."
      - type: question
        ref: sb-dto-q5
        review: code-responseentity
      - type: question
        ref: sb-rs-q2
        review: def-responseentity
      - type: text
        md: "**Exercice 1 (guidé)** : complète les statuts."
      - type: exercise
        ref: sb-ex-responseentity-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : créer et supprimer un rendez-vous."
      - type: exercise
        ref: sb-ex-creer-supprimer
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une création qui répond 200."
      - type: exercise
        ref: sb-ex-responseentity-bug
      - type: quiz
        items:
          - ref: sb-rs-q3
            review: code-responseentity
          - ref: sb-rs-q4
            review: def-responseentity
          - ref: sb-rs-q5
            review: code-responseentity
    questions:
      - code: sb-dto-q5
        kind: TEXTE
        difficulty: 2
        skill: api-rest
        prompt: "Quel statut renvoie `ResponseEntity.noContent().build()` ? (le nombre)"
        answers: ["204"]
        explanation: "204 No Content : réussi, rien à renvoyer. Typique après un DELETE."
      - code: sb-rs-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Quel statut Spring renvoie-t-il si on retourne simplement un objet ?"
        choices:
          - label: "200"
            correct: true
            why: "C'est le statut par défaut."
          - label: "201"
            correct: false
            why: "Il faut le demander avec ResponseEntity."
          - label: "204"
            correct: false
            why: "Il faut le demander avec ResponseEntity."
        explanation: "ResponseEntity pour choisir un autre statut."
      - code: sb-rs-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Comment répondre 201 avec le livre créé ?"
        choices:
          - label: "`ResponseEntity.status(HttpStatus.CREATED).body(cree)`"
            correct: true
            why: "Statut + corps."
          - label: "`ResponseEntity.noContent().build()`"
            correct: false
            why: "C'est 204."
          - label: "`return cree;`"
            correct: false
            why: "Ce serait 200."
        explanation: "CREATED = 201."
      - code: sb-rs-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: spring-rest
        prompt: "`ResponseEntity<Void>` signifie que la réponse n'a pas de corps."
        choices:
          - label: "Vrai"
            correct: true
            why: "Void = rien."
          - label: "Faux"
            correct: false
            why: "C'est le type d'une réponse vide."
        explanation: "Typique avec 204."
      - code: sb-rs-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: api-rest
        prompt: "Pourquoi répondre 201 plutôt que 200 après une création ?"
        choices:
          - label: "Le frontend sait précisément qu'une ressource a été créée"
            correct: true
            why: "Le statut porte une information exacte."
          - label: "C'est plus rapide"
            correct: false
            why: "Aucune différence de vitesse."
          - label: "200 est interdit"
            correct: false
            why: "Il est permis, mais moins précis."
        explanation: "Chaque statut dit une chose précise."
    exercises:
      - slug: sb-ex-responseentity-guide
        kind: COMPLETER
        title: "Compléter les statuts"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète : 201 pour la création, 204 pour la suppression."
        criteria: "Les trois trous sont corrects."
        hints:
          - "201 se nomme CREATED."
          - "204 : noContent, puis build."
          - "CREATED, noContent, build."
        solution: '["CREATED", "noContent", "build"]'
        explanation: "Un statut précis pour chaque action."
        xp: 10
        payload:
          language: java
          template: |
            return ResponseEntity.status(HttpStatus.[[1]]).body(cree);

            return ResponseEntity.[[2]]().[[3]]();
          blanks:
            - ["CREATED"]
            - ["noContent"]
            - ["build"]
      - slug: sb-ex-creer-supprimer
        kind: CODE_LIBRE
        title: "Créer et supprimer un rendez-vous"
        difficulty: INTERMEDIAIRE
        skill: spring-rest
        statement: |
          Dans `RendezVousController` (le champ `service` existe déjà), écris :
          1. `creer` : `POST`, reçoit un `RendezVousRequest` dans le corps, appelle `service.creer(req)` et
             répond **201** avec le `RendezVousDto` créé (`ResponseEntity<RendezVousDto>`) ;
          2. `supprimer` : `DELETE /{id}`, appelle `service.supprimer(id)` et répond **204**
             (`ResponseEntity<Void>`).
        criteria: "@PostMapping + @RequestBody + 201 ; @DeleteMapping(\"/{id}\") + @PathVariable + 204."
        hints:
          - "`@PostMapping public ResponseEntity<RendezVousDto> creer(@RequestBody RendezVousRequest req)`"
          - "201 : `ResponseEntity.status(HttpStatus.CREATED).body(dto)`."
          - "204 : `return ResponseEntity.noContent().build();`"
        solution: |
          @PostMapping
          public ResponseEntity<RendezVousDto> creer(@RequestBody RendezVousRequest req) {
              RendezVousDto cree = service.creer(req);
              return ResponseEntity.status(HttpStatus.CREATED).body(cree);
          }

          @DeleteMapping("/{id}")
          public ResponseEntity<Void> supprimer(@PathVariable Long id) {
              service.supprimer(id);
              return ResponseEntity.noContent().build();
          }
        explanation: "Chaque action a son verbe et son statut : 201 pour une création, 204 pour une suppression."
        xp: 25
        payload:
          language: java
          starter: |
            // private final RendezVousService service; (déjà présent)

          checks:
            - pattern: '@PostMapping\s+public\s+ResponseEntity\s*<\s*RendezVousDto\s*>\s+creer\s*\('
              message: "Déclare `@PostMapping public ResponseEntity<RendezVousDto> creer(…)`."
            - pattern: 'creer\s*\(\s*@RequestBody\s+RendezVousRequest\s+\w+\s*\)'
              message: "Le paramètre doit être `@RequestBody RendezVousRequest req`."
            - pattern: 'service\.creer\s*\('
              message: "Appelle `service.creer(req)`."
            - pattern: 'HttpStatus\.CREATED|status\s*\(\s*201\s*\)|ResponseEntity\.created\s*\('
              message: "Réponds avec le statut 201 (Created)."
            - pattern: '@DeleteMapping\s*\(\s*"/\{id\}"\s*\)'
              message: "Ajoute `@DeleteMapping(\"/{id}\")`."
            - pattern: 'supprimer\s*\(\s*@PathVariable\s+(?:Long|long)\s+id\s*\)'
              message: "Le paramètre doit être `@PathVariable Long id`."
            - pattern: 'service\.supprimer\s*\(\s*id\s*\)'
              message: "Appelle `service.supprimer(id)`."
            - pattern: 'noContent\s*\(\s*\)\s*\.build\s*\(\s*\)|HttpStatus\.NO_CONTENT'
              message: "Réponds 204 : `ResponseEntity.noContent().build()`."
      - slug: sb-ex-responseentity-bug
        kind: CORRIGER_ERREUR
        title: "Une création qui répond 200"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          Cette création répond 200. Fais-la répondre 201 avec `ResponseEntity.status(HttpStatus.CREATED).body(cree)`
          (le type de retour devient `ResponseEntity<SalleDto>`).
        criteria: "ResponseEntity<SalleDto> et HttpStatus.CREATED."
        hints:
          - "Il faut choisir le statut."
          - "ResponseEntity permet de le choisir."
