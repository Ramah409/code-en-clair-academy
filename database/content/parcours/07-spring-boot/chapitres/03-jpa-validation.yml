slug: sb-jpa-validation
position: 3
level: AVANCE
title: "Persister avec JPA, valider et gérer les erreurs"
summary: "Relier une classe Java à une table, relier deux tables, écrire des recherches avec Spring Data, charger les relations efficacement, valider les entrées et renvoyer des erreurs claires. Une seule notion par leçon."
quizQuestionCount: 16

lessons:
  # ===================================================================== LEÇON 1
  - slug: sb-jpa
    title: "Une entité JPA : une classe, une table"
    duration: 11
    objective: "Écrire une entité JPA avec sa table, sa clé primaire générée et ses colonnes."
    prerequisites: "Chapitre « Construire une API en couches » et parcours « SQL et PostgreSQL »."
    skills: [spring-jpa]
    xp: 15
    memo: |
      - **ORM** : l'outil qui traduit les objets Java en lignes de tables (et inversement). JPA est la norme, Hibernate l'outil.
      - `@Entity` + `@Table(name = "livres")` : cette classe correspond à une table.
      - `@Id @GeneratedValue(strategy = GenerationType.IDENTITY)` : la clé primaire, générée par PostgreSQL.
      - `@Column(nullable = false, length = 100)` : les contraintes de la colonne.
      - Un constructeur **sans argument** est obligatoire (il peut être `protected`).
    commonMistakes: |
      - Oublier le constructeur sans argument : Hibernate ne peut pas créer l'objet.
      - Oublier `@Id` : Hibernate refuse de démarrer.
    blocks:
      - type: text
        md: |
          En Java, on manipule des **objets**. PostgreSQL range des **lignes** dans des **tables**. JPA fait
          la traduction : tu enregistres un objet, il écrit l'`INSERT` pour toi.
      - type: definition
        id: def-orm
        term: "ORM et JPA"
        md: |
          Un **interprète** entre deux langues : le Java (objets) et le SQL (tables). **JPA** est le
          dictionnaire officiel ; **Hibernate** est l'interprète qui l'applique.
      - type: code
        id: code-entite
        language: java
        title: "Livre.java"
        code: |
          @Entity
          @Table(name = "livres")
          public class Livre {

              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              @Column(nullable = false, length = 100)
              private String titre;

              private boolean emprunte;

              protected Livre() {}

              // constructeur, getters…
          }
        lines:
          - n: 1
            note: "`@Entity` : cette classe est gérée par JPA."
          - n: 2
            note: "Le nom de la table dans PostgreSQL."
          - n: 5
            note: "`@Id` : la clé primaire."
          - n: 6
            note: "`IDENTITY` : PostgreSQL donne le numéro."
          - n: 9
            note: "`@Column` précise les contraintes : `NOT NULL`, 100 caractères maximum."
          - n: 14
            note: "Constructeur vide exigé par JPA (`protected` pour ne pas l'utiliser ailleurs)."
      - type: question
        ref: sb-jpa-q3
        review: code-entite
      - type: question
        ref: sb-jpa-q5
        review: def-orm
      - type: text
        md: "**Exercice 1 (guidé)** : complète l'entité."
      - type: exercise
        ref: sb-ex-entite-base-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : l'entité Salle."
      - type: exercise
        ref: sb-ex-entite-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un constructeur manquant."
      - type: exercise
        ref: sb-ex-entite-bug
      - type: jury
        items:
          - q: "Qu'est-ce que JPA et Hibernate ?"
            a: "JPA est la spécification Java de mapping objet-relationnel ; Hibernate en est l'implémentation utilisée par Spring Boot. Les classes annotées @Entity correspondent aux tables, et Spring Data JPA génère les repositories à partir d'interfaces."
      - type: quiz
        items:
          - ref: sb-en-q3
            review: code-entite
          - ref: sb-en-q4
            review: code-entite
          - ref: sb-c3-b1
            review: def-orm
    questions:
      - code: sb-jpa-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-jpa
        prompt: "Une entité JPA doit avoir un constructeur sans argument."
        choices:
          - label: "Vrai"
            correct: true
            why: "Hibernate crée l'objet vide puis le remplit."
          - label: "Faux"
            correct: false
            why: "Sans lui, le chargement échoue."
        explanation: "Il peut être `protected`."
      - code: sb-jpa-q5
        kind: TEXTE
        difficulty: 2
        skill: spring-jpa
        prompt: "Quelle implémentation de JPA Spring Boot utilise-t-il par défaut ? (un nom)"
        answers: ["Hibernate"]
        explanation: "JPA = la norme ; Hibernate = l'outil qui l'applique."
      - code: sb-en-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-jpa
        prompt: "Quelle annotation marque la clé primaire ?"
        choices:
          - label: "@Id"
            correct: true
            why: "Identifiant de la ligne."
          - label: "@Entity"
            correct: false
            why: "Elle marque la classe."
          - label: "@Column"
            correct: false
            why: "Elle précise une colonne."
        explanation: "@Id + @GeneratedValue."
      - code: sb-en-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-jpa
        prompt: "Que fait `@Column(nullable = false)` ?"
        choices:
          - label: "La colonne est NOT NULL"
            correct: true
            why: "Une valeur est obligatoire."
          - label: "La colonne est facultative"
            correct: false
            why: "C'est l'inverse."
          - label: "La colonne est supprimée"
            correct: false
            why: "Aucun rapport."
        explanation: "Les contraintes SQL, écrites en Java."
      - code: sb-c3-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Pourquoi utiliser Flyway plutôt que `ddl-auto=update` en production ?"
        choices:
          - label: "Les migrations SQL sont versionnées, relues et rejouables à l'identique"
            correct: true
            why: "On sait exactement ce qui change dans la base."
          - label: "Flyway est plus rapide que Hibernate"
            correct: false
            why: "Ce n'est pas une question de vitesse."
          - label: "ddl-auto n'existe plus"
            correct: false
            why: "Il existe, mais il est risqué en production."
        explanation: "`V1__schema_initial.sql`, `V2__…` : l'histoire de la base, dans Git."
    exercises:
      - slug: sb-ex-entite-base-guide
        kind: COMPLETER
        title: "Compléter l'entité"
        difficulty: FACILE
        skill: spring-jpa
        statement: "Complète les annotations de l'entité Auteur."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La classe est une Entity."
          - "La clé primaire : Id ; les contraintes d'une colonne : Column."
          - "Entity, Id, Column."
        solution: '["Entity", "Id", "Column"]'
        explanation: "Entité, clé primaire, colonne."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]]
            @Table(name = "auteurs")
            public class Auteur {
                @[[2]]
                @GeneratedValue(strategy = GenerationType.IDENTITY)
                private Long id;

                @[[3]](nullable = false)
                private String nom;

                protected Auteur() {}
            }
          blanks:
            - ["Entity"]
            - ["Id"]
            - ["Column"]
      - slug: sb-ex-entite-libre
        kind: CODE_LIBRE
        title: "L'entité Salle"
        difficulty: INTERMEDIAIRE
        skill: spring-jpa
        statement: |
          Écris l'entité `Salle` (table `salles`) avec :
          - un `Long id` clé primaire générée (`IDENTITY`) ;
          - un `String nom` obligatoire ;
          - un constructeur sans argument `protected`.
        criteria: "@Entity, @Table, @Id + @GeneratedValue, @Column(nullable = false), constructeur vide."
        hints:
          - "`@Entity @Table(name = \"salles\") public class Salle { … }`"
          - "`@Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;`"
          - "`@Column(nullable = false) private String nom;` puis `protected Salle() {}`."
        solution: |
          @Entity
          @Table(name = "salles")
          public class Salle {

              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              @Column(nullable = false)
              private String nom;

              protected Salle() {}
          }
        explanation: "Une classe, une table."
        xp: 20
        payload:
          language: java
          starter: |
            public class Salle {

            }
          checks:
            - pattern: '@Entity\s+(?:@Table\s*\([^)]*\)\s+)?public\s+class\s+Salle|@Table\s*\([^)]*\)\s+@Entity'
              message: "Annote la classe avec @Entity."
            - pattern: '@Table\s*\(\s*name\s*=\s*"salles"\s*\)'
              message: "Ajoute @Table(name = \"salles\")."
            - pattern: '@Id\s+@GeneratedValue\s*\(\s*strategy\s*=\s*GenerationType\.IDENTITY\s*\)\s+private\s+Long\s+id\s*;'
              message: "Déclare la clé primaire générée : @Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;"
            - pattern: '@Column\s*\(\s*nullable\s*=\s*false\s*\)\s+private\s+String\s+nom\s*;'
              message: "Déclare @Column(nullable = false) private String nom;"
            - pattern: 'protected\s+Salle\s*\(\s*\)\s*\{\s*\}'
              message: "Ajoute le constructeur protected Salle() {}."
      - slug: sb-ex-entite-bug
        kind: CORRIGER_ERREUR
        title: "Un constructeur manquant"
        difficulty: FACILE
        skill: spring-jpa
        statement: |
          Hibernate ne peut pas charger les genres : il manque le constructeur sans argument. Ajoute-le
          (`protected`).
        criteria: "protected Genre() {}."
        hints:
          - "Hibernate crée d'abord un objet vide."
          - "Il faut un constructeur sans argument."
          - "`protected Genre() {}`"
        solution: |
          @Entity
          public class Genre {
              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;
              private String nom;

              protected Genre() {}

              public Genre(String nom) { this.nom = nom; }
          }
        explanation: "JPA exige un constructeur vide."
        xp: 10
        payload:
          language: java
          starter: |
            @Entity
            public class Genre {
                @Id
                @GeneratedValue(strategy = GenerationType.IDENTITY)
                private Long id;
                private String nom;

                public Genre(String nom) { this.nom = nom; }
            }
          checks:
            - pattern: '(?:protected|public)\s+Genre\s*\(\s*\)\s*\{\s*\}'
              message: "Ajoute protected Genre() {}."

  # ===================================================================== LEÇON 2
  - slug: sb-jpa-relations
    title: "Relier deux entités : @ManyToOne"
    duration: 10
    objective: "Représenter une clé étrangère avec @ManyToOne et @JoinColumn."
    prerequisites: "Leçon « Une entité JPA : une classe, une table »."
    skills: [spring-jpa]
    xp: 15
    memo: |
      - « Plusieurs livres pour **un** auteur » : côté Livre, `@ManyToOne`.
      - `@JoinColumn(name = "auteur_id")` : le nom de la colonne clé étrangère dans la table `livres`.
      - `fetch = FetchType.LAZY` : l'auteur n'est chargé que si on en a besoin.
      - L'autre côté (`@OneToMany(mappedBy = "auteur")` dans Auteur) est facultatif.
    commonMistakes: |
      - Mettre `@OneToMany` du côté qui porte la clé étrangère.
      - Stocker `Long auteurId` au lieu d'un objet `Auteur`.
    blocks:
      - type: definition
        id: def-manytoone
        term: "@ManyToOne"
        md: |
          La **fiche d'un livre** porte le nom de son auteur : plusieurs fiches peuvent citer le même auteur.
          C'est la clé étrangère du MLD, écrite en Java.
      - type: code
        id: code-relation
        language: java
        title: "Un livre et son auteur"
        code: |
          @Entity
          @Table(name = "livres")
          public class Livre {
              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              @ManyToOne(fetch = FetchType.LAZY)
              @JoinColumn(name = "auteur_id")
              private Auteur auteur;
          }
        lines:
          - n: 8
            note: "Plusieurs livres pour **un** auteur. `LAZY` : l'auteur n'est chargé que si on en a besoin."
          - n: 9
            note: "La colonne clé étrangère dans la table `livres`."
          - n: 10
            note: "On manipule un objet `Auteur`, pas un simple numéro."
      - type: question
        ref: sb-jpa-q1
        review: code-relation
      - type: question
        ref: sb-mo-q2
        review: def-manytoone
      - type: text
        md: "**Exercice 1 (guidé)** : complète la relation."
      - type: exercise
        ref: sb-ex-entite-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une réservation et sa salle."
      - type: exercise
        ref: sb-ex-relation-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : la mauvaise annotation."
      - type: exercise
        ref: sb-ex-relation-bug
      - type: quiz
        items:
          - ref: sb-mo-q3
            review: code-relation
          - ref: sb-mo-q4
            review: def-manytoone
          - ref: sb-mo-q5
            review: code-relation
    questions:
      - code: sb-jpa-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Quelle annotation représente « plusieurs livres appartiennent à un auteur » côté Livre ?"
        choices:
          - label: "@ManyToOne"
            correct: true
            why: "Plusieurs (Many) livres vers un (One) auteur."
          - label: "@OneToMany"
            correct: false
            why: "C'est le côté Auteur (un auteur, plusieurs livres)."
          - label: "@ManyToMany"
            correct: false
            why: "Un livre n'a qu'un auteur ici."
        explanation: "Le côté @ManyToOne porte la clé étrangère."
      - code: sb-mo-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-jpa
        prompt: "À quoi sert `@JoinColumn(name = \"auteur_id\")` ?"
        choices:
          - label: "À nommer la colonne clé étrangère"
            correct: true
            why: "Dans la table livres."
          - label: "À créer une table d'association"
            correct: false
            why: "Il s'agit d'une simple colonne."
          - label: "À charger l'auteur tout de suite"
            correct: false
            why: "C'est le rôle de fetch."
        explanation: "La FK du MLD, en Java."
      - code: sb-mo-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-jpa
        prompt: "Avec `FetchType.LAZY`, l'auteur n'est chargé que si le code l'utilise."
        choices:
          - label: "Vrai"
            correct: true
            why: "Chargement paresseux."
          - label: "Faux"
            correct: false
            why: "C'est EAGER qui charge tout de suite."
        explanation: "LAZY évite de charger des données inutiles."
      - code: sb-mo-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-jpa
        prompt: "Dans quelle table se trouve la colonne `auteur_id` ?"
        choices:
          - label: "livres"
            correct: true
            why: "Le côté « plusieurs » porte la clé étrangère."
          - label: "auteurs"
            correct: false
            why: "L'auteur ne connaît pas un seul livre."
          - label: "Une troisième table"
            correct: false
            why: "Pas pour une relation plusieurs-vers-un."
        explanation: "Règle du MLD : la FK va du côté x,1."
      - code: sb-mo-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Pourquoi déclarer `private Auteur auteur;` plutôt que `private Long auteurId;` ?"
        choices:
          - label: "On navigue directement vers l'objet auteur (livre.getAuteur().getNom())"
            correct: true
            why: "JPA gère la jointure."
          - label: "C'est obligatoire en Java"
            correct: false
            why: "C'est un choix de conception JPA."
          - label: "C'est plus rapide dans tous les cas"
            correct: false
            why: "La question est la lisibilité."
        explanation: "On pense en objets, JPA écrit les jointures."
    exercises:
      - slug: sb-ex-entite-guide
        kind: COMPLETER
        title: "Compléter la relation"
        difficulty: FACILE
        skill: spring-jpa
        statement: "Complète la relation d'un livre vers son auteur."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Plusieurs livres pour un auteur : ManyToOne."
          - "Le chargement paresseux : LAZY ; la colonne : JoinColumn."
          - "ManyToOne, LAZY, JoinColumn."
        solution: '["ManyToOne", "LAZY", "JoinColumn"]'
        explanation: "Relation, chargement, clé étrangère."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]](fetch = FetchType.[[2]])
            @[[3]](name = "auteur_id")
            private Auteur auteur;
          blanks:
            - ["ManyToOne"]
            - ["LAZY"]
            - ["JoinColumn"]
      - slug: sb-ex-relation-libre
        kind: CODE_LIBRE
        title: "Une réservation et sa salle"
        difficulty: FACILE
        skill: spring-jpa
        statement: |
          Dans l'entité `Reservation`, déclare le champ `salle` : plusieurs réservations pour une salle,
          chargement paresseux, colonne `salle_id`.
        criteria: "@ManyToOne(fetch = LAZY), @JoinColumn(name = \"salle_id\"), private Salle salle."
        hints:
          - "`@ManyToOne(fetch = FetchType.LAZY)`"
          - "`@JoinColumn(name = \"salle_id\")`"
          - "`private Salle salle;`"
        solution: |
          @ManyToOne(fetch = FetchType.LAZY)
          @JoinColumn(name = "salle_id")
          private Salle salle;
        explanation: "La clé étrangère est du côté des réservations."
        xp: 15
        payload:
          language: java
          starter: |
            private Salle salle;
          checks:
            - pattern: '@ManyToOne\s*\(\s*fetch\s*=\s*FetchType\.LAZY\s*\)'
              message: "Ajoute @ManyToOne(fetch = FetchType.LAZY)."
            - pattern: '@JoinColumn\s*\(\s*name\s*=\s*"salle_id"\s*\)\s+private\s+Salle\s+salle\s*;'
              message: "Ajoute @JoinColumn(name = \"salle_id\") au-dessus de private Salle salle;"
      - slug: sb-ex-relation-bug
        kind: CORRIGER_ERREUR
        title: "La mauvaise annotation"
        difficulty: FACILE
        skill: spring-jpa
        statement: |
          Dans `Emprunt`, le champ `livre` porte la clé étrangère (plusieurs emprunts pour un livre), mais il est
          annoté `@OneToMany`. Corrige.
        criteria: "@ManyToOne."
        hints:
          - "Qui porte la clé étrangère ?"
          - "Le côté « plusieurs » : Many… vers One."
          - "`@ManyToOne`"
        solution: |
          @ManyToOne(fetch = FetchType.LAZY)
          @JoinColumn(name = "livre_id")
          private Livre livre;
        explanation: "FK → @ManyToOne."
        xp: 10
        payload:
          language: java
          starter: |
            @OneToMany(fetch = FetchType.LAZY)
            @JoinColumn(name = "livre_id")
            private Livre livre;
          checks:
            - pattern: '@OneToMany'
              absent: true
              message: "@OneToMany est le côté sans clé étrangère."
            - pattern: '@ManyToOne\b'
              message: "Écris @ManyToOne."

  # ===================================================================== LEÇON 3
  - slug: sb-repository
    title: "Le repository Spring Data"
    duration: 10
    objective: "Déclarer un repository qui étend JpaRepository et écrire des méthodes de recherche par leur nom."
    prerequisites: "Leçon « Relier deux entités : @ManyToOne »."
    skills: [spring-jpa]
    xp: 15
    memo: |
      - `interface LivreRepository extends JpaRepository<Livre, Long>` : `save`, `findById`, `findAll`, `deleteById` offerts.
      - Méthodes par le nom : `findByTitreContainingIgnoreCase(String morceau)`, `existsByEmail(String email)`.
      - C'est une **interface** : Spring écrit le code à ta place.
    commonMistakes: |
      - Écrire une classe au lieu d'une interface.
      - Se tromper dans le nom d'un champ : `findByTitle` alors que le champ s'appelle `titre`.
    blocks:
      - type: definition
        id: def-repository
        term: "Repository Spring Data"
        md: |
          Le **commis de la réserve** : tu lui dis ce que tu veux (« tous les livres dont le titre contient
          prince »), il va le chercher. Avec Spring Data, il suffit d'écrire une **interface** : Spring écrit le
          code à ta place.
      - type: code
        id: code-repository
        language: java
        title: "LivreRepository.java"
        code: |
          public interface LivreRepository extends JpaRepository<Livre, Long> {

              List<Livre> findByTitreContainingIgnoreCase(String morceau);

              List<Livre> findByAuteurIdOrderByTitreAsc(Long auteurId);
          }
        lines:
          - n: 1
            note: "`<Livre, Long>` : l'entité gérée et le type de son identifiant."
          - n: 3
            note: "Spring lit le nom : `WHERE LOWER(titre) LIKE LOWER('%morceau%')`."
          - n: 5
            note: "Filtre sur l'auteur, trié par titre."
      - type: question
        ref: sb-jpa-q2
        review: code-repository
      - type: question
        ref: sb-rpo-q2
        review: def-repository
      - type: text
        md: "**Exercice 1 (guidé)** : complète le repository."
      - type: exercise
        ref: sb-ex-repository-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : le repository des adhérents."
      - type: exercise
        ref: sb-ex-repository
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une classe au lieu d'une interface."
      - type: exercise
        ref: sb-ex-repository-bug
      - type: quiz
        items:
          - ref: sb-rpo-q3
            review: code-repository
          - ref: sb-rpo-q4
            review: def-repository
          - ref: sb-rpo-q5
            review: code-repository
    questions:
      - code: sb-jpa-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Que fait `findByEmail(String email)` dans un repository Spring Data ?"
        choices:
          - label: "Spring génère la requête `WHERE email = ?` d'après le nom de la méthode"
            correct: true
            why: "Les méthodes dérivées lisent leur nom."
          - label: "Il faut écrire le corps de la méthode"
            correct: false
            why: "C'est une interface, Spring écrit le code."
          - label: "Rien, il faut @Query obligatoirement"
            correct: false
            why: "@Query est facultative pour les cas simples."
        explanation: "findBy + nom du champ + mots-clés (Containing, OrderBy…)."
      - code: sb-rpo-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-jpa
        prompt: "Dans `JpaRepository<Livre, Long>`, que représente `Long` ?"
        choices:
          - label: "Le type de l'identifiant de Livre"
            correct: true
            why: "La clé primaire est un Long."
          - label: "Le nombre de livres"
            correct: false
            why: "C'est un type, pas une quantité."
          - label: "La longueur du titre"
            correct: false
            why: "Aucun rapport."
        explanation: "<Entité, type de l'id>."
      - code: sb-rpo-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-jpa
