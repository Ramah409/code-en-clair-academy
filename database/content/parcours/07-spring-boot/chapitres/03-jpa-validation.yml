      - slug: sb-ex-repository
        kind: CODE_LIBRE
        title: "Le repository des adhérents"
        difficulty: INTERMEDIAIRE
        skill: spring-jpa
        statement: |
          Écris `AdherentRepository` pour l'entité `Adherent` (identifiant `Long`) avec :
          - `findByEmail(String email)` qui renvoie un `Optional<Adherent>` ;
          - `existsByEmail(String email)` qui renvoie un `boolean` ;
          - `findByVilleOrderByNomAsc(String ville)` qui renvoie une `List<Adherent>`.
        criteria: "Interface qui étend JpaRepository<Adherent, Long> avec les trois méthodes dérivées."
        hints:
          - "`public interface AdherentRepository extends JpaRepository<Adherent, Long> {`"
          - "`Optional<Adherent> findByEmail(String email);`"
          - "Pas de corps : ce sont des déclarations terminées par un point-virgule."
        solution: |
          public interface AdherentRepository extends JpaRepository<Adherent, Long> {

              Optional<Adherent> findByEmail(String email);

              boolean existsByEmail(String email);

              List<Adherent> findByVilleOrderByNomAsc(String ville);
          }
        explanation: "Trois méthodes, zéro ligne de SQL : Spring Data les génère."
        xp: 20
        payload:
          language: java
          starter: |
            public interface AdherentRepository {

            }
          checks:
            - pattern: 'interface\s+AdherentRepository\s+extends\s+JpaRepository\s*<\s*Adherent\s*,\s*Long\s*>'
              message: "L'interface doit étendre `JpaRepository<Adherent, Long>`."
            - pattern: 'Optional\s*<\s*Adherent\s*>\s+findByEmail\s*\(\s*String\s+\w+\s*\)\s*;'
              message: "Déclare `Optional<Adherent> findByEmail(String email);`."
            - pattern: 'boolean\s+existsByEmail\s*\(\s*String\s+\w+\s*\)\s*;'
              message: "Déclare `boolean existsByEmail(String email);`."
            - pattern: 'List\s*<\s*Adherent\s*>\s+findByVilleOrderByNomAsc\s*\(\s*String\s+\w+\s*\)\s*;'
              message: "Déclare `List<Adherent> findByVilleOrderByNomAsc(String ville);`."
            - pattern: 'class\s+AdherentRepository'
              absent: true
              message: "Un repository Spring Data est une interface, pas une classe."
      - slug: sb-ex-repository-bug
        kind: CORRIGER_ERREUR
        title: "Une classe au lieu d'une interface"
        difficulty: FACILE
        skill: spring-jpa
        statement: |
          Ce repository est déclaré comme une classe : Spring ne peut pas générer son code. Corrige la
          déclaration.
        criteria: "public interface GenreRepository extends JpaRepository<Genre, Long>."
        hints:
          - "Spring Data génère le code d'une interface."
          - "Remplace class par interface."
          - "`public interface GenreRepository extends JpaRepository<Genre, Long>`"
        solution: |
          public interface GenreRepository extends JpaRepository<Genre, Long> {
              List<Genre> findByNomContainingIgnoreCase(String morceau);
          }
        explanation: "Une interface, et Spring fait le reste."
        xp: 10
        payload:
          language: java
          starter: |
            public class GenreRepository extends JpaRepository<Genre, Long> {
                List<Genre> findByNomContainingIgnoreCase(String morceau);
            }
          checks:
            - pattern: 'class\s+GenreRepository'
              absent: true
              message: "Ce n'est pas une classe."
            - pattern: 'public\s+interface\s+GenreRepository\s+extends\s+JpaRepository\s*<\s*Genre\s*,\s*Long\s*>'
              message: "Écris public interface GenreRepository extends JpaRepository<Genre, Long>."

  # ===================================================================== LEÇON 4
  - slug: sb-query-jpql
    title: "Une requête sur mesure : @Query et join fetch"
    duration: 11
    objective: "Écrire une requête JPQL avec @Query et éviter le problème des N+1 requêtes avec join fetch."
    prerequisites: "Leçon « Le repository Spring Data »."
    skills: [spring-jpa]
    xp: 15
    memo: |
      - `@Query("select l from Livre l where …")` : une requête **JPQL**, écrite avec les **classes** et **attributs** Java.
      - `@Param("nom")` relie un paramètre de méthode à `:nom` dans la requête.
      - **Problème N+1** : une requête pour la liste, puis une de plus pour la relation de **chaque** élément.
      - `join fetch l.auteur` : charge la relation dans la même requête.
    commonMistakes: |
      - Écrire le nom de la table (`livres`) au lieu du nom de la classe (`Livre`) en JPQL.
      - Passer toutes les relations en EAGER pour éviter le N+1 : on charge trop de données partout.
    blocks:
      - type: definition
        id: def-jpql
        term: "JPQL et le problème N+1"
        md: |
          Le **JPQL** ressemble au SQL mais parle des classes Java. Le **N+1**, c'est aller à la réserve une fois
          pour la liste des livres, puis retourner une fois **par livre** pour chercher son auteur. `join fetch`
          ramène tout en un seul voyage.
      - type: code
        id: code-query
        language: java
        title: "Une recherche avec son auteur, en une requête"
        code: |
          public interface LivreRepository extends JpaRepository<Livre, Long> {

              @Query("select l from Livre l join fetch l.auteur where l.emprunte = false")
              List<Livre> disponiblesAvecAuteur();

              @Query("select l from Livre l where l.auteur.nom = :nom")
              List<Livre> parNomAuteur(@Param("nom") String nom);
          }
        lines:
          - n: 3
            note: "JPQL : `Livre` (la classe), `l.auteur` (l'attribut). `join fetch` charge l'auteur en même temps."
          - n: 6
            note: "`:nom` est rempli par le paramètre annoté `@Param(\"nom\")`."
      - type: question
        ref: sb-jpa-q4
        review: def-jpql
      - type: question
        ref: sb-c3-b2
        review: code-query
      - type: text
        md: "**Exercice 1 (guidé)** : complète la requête."
      - type: exercise
        ref: sb-ex-query-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : les réservations avec leur salle."
      - type: exercise
        ref: sb-ex-query-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une table au lieu d'une classe."
      - type: exercise
        ref: sb-ex-query-bug
      - type: jury
        items:
          - q: "Qu'est-ce que le problème N+1 ?"
            a: "Une requête charge N éléments, puis une requête supplémentaire part pour la relation de chacun. On le corrige avec un join fetch, un @EntityGraph, ou une projection DTO qui récupère tout en une requête."
      - type: quiz
        items:
          - ref: sb-qy-q3
            review: code-query
          - ref: sb-qy-q4
            review: def-jpql
          - ref: sb-qy-q5
            review: code-query
    questions:
      - code: sb-jpa-q4
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: spring-jpa
        prompt: "La page liste les livres et affiche leur auteur : une requête supplémentaire part pour chaque livre. Quelle solution ?"
        choices:
          - label: "Une requête avec `join fetch l.auteur`"
            correct: true
            why: "Tout est chargé en une requête."
          - label: "Passer toutes les relations en EAGER"
            correct: false
            why: "On chargerait trop de données partout."
          - label: "Ajouter un index"
            correct: false
            why: "Le nombre de requêtes ne change pas."
        explanation: "C'est le problème N+1."
      - code: sb-c3-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Quelle est la différence entre JPQL et SQL ?"
        choices:
          - label: "JPQL s'écrit avec les noms des classes et des attributs Java, SQL avec les tables et les colonnes"
            correct: true
            why: "`select l from Livre l` vs `SELECT * FROM livres`."
          - label: "JPQL est plus rapide"
            correct: false
            why: "Il est traduit en SQL."
          - label: "Aucune différence"
            correct: false
            why: "Les noms utilisés ne sont pas les mêmes."
        explanation: "Hibernate traduit le JPQL en SQL PostgreSQL."
      - code: sb-qy-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-jpa
        prompt: "Dans `where l.auteur.nom = :nom`, qui remplit `:nom` ?"
        choices:
          - label: "Le paramètre annoté `@Param(\"nom\")`"
            correct: true
            why: "Même nom des deux côtés."
          - label: "Spring devine tout seul"
            correct: false
            why: "Il faut @Param."
          - label: "La base de données"
            correct: false
            why: "La valeur vient de l'appel de méthode."
        explanation: ":nom ↔ @Param(\"nom\")."
      - code: sb-qy-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-jpa
        prompt: "`join fetch` charge la relation dans la même requête que la liste."
        choices:
          - label: "Vrai"
            correct: true
            why: "Un seul voyage."
          - label: "Faux"
            correct: false
            why: "C'est justement son rôle."
        explanation: "join fetch = remède au N+1."
      - code: sb-qy-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Quand écrire une `@Query` plutôt qu'une méthode par le nom ?"
        choices:
          - label: "Quand la requête devient trop complexe pour un nom lisible, ou qu'il faut un join fetch"
            correct: true
            why: "On garde des noms courts et clairs."
          - label: "Toujours"
            correct: false
            why: "Les méthodes par le nom suffisent souvent."
          - label: "Jamais"
            correct: false
            why: "Elle est utile pour les cas avancés."
        explanation: "Simple → par le nom ; avancé → @Query."
    exercises:
      - slug: sb-ex-query-guide
        kind: COMPLETER
        title: "Compléter la requête"
        difficulty: FACILE
        skill: spring-jpa
        statement: "Complète la requête qui charge les emprunts avec leur livre, en une seule fois."
        criteria: "Les trois trous sont corrects."
        hints:
          - "L'annotation s'appelle Query."
          - "On écrit la classe Emprunt ; on charge avec join fetch."
          - "Query, Emprunt, fetch."
        solution: '["Query", "Emprunt", "fetch"]'
        explanation: "JPQL avec la classe, et join fetch."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]]("select e from [[2]] e join [[3]] e.livre")
            List<Emprunt> tousAvecLivre();
          blanks:
            - ["Query"]
            - ["Emprunt"]
            - ["fetch"]
      - slug: sb-ex-query-libre
        kind: CODE_LIBRE
        title: "Les réservations avec leur salle"
        difficulty: INTERMEDIAIRE
        skill: spring-jpa
        statement: |
          Dans `ReservationRepository`, écris une méthode `toutesAvecSalle()` annotée `@Query` qui renvoie
          `List<Reservation>` et charge la salle avec `join fetch` : `select r from Reservation r join fetch r.salle`.
        criteria: "@Query avec join fetch r.salle et la bonne signature."
        hints:
          - "`@Query(\"select r from Reservation r join fetch r.salle\")`"
          - "`List<Reservation> toutesAvecSalle();`"
          - "JPQL : la classe Reservation, l'attribut salle."
        solution: |
          @Query("select r from Reservation r join fetch r.salle")
          List<Reservation> toutesAvecSalle();
        explanation: "Une seule requête pour la liste et les salles."
        xp: 15
        payload:
          language: java
          starter: |
            List<Reservation> toutesAvecSalle();
          checks:
            - pattern: '@Query\s*\(\s*"select\s+r\s+from\s+Reservation\s+r\s+join\s+fetch\s+r\.salle\s*"\s*\)'
              message: "Écris @Query(\"select r from Reservation r join fetch r.salle\")."
            - pattern: 'List\s*<\s*Reservation\s*>\s+toutesAvecSalle\s*\(\s*\)\s*;'
              message: "Garde la signature List<Reservation> toutesAvecSalle();"
      - slug: sb-ex-query-bug
        kind: CORRIGER_ERREUR
        title: "Une table au lieu d'une classe"
        difficulty: FACILE
        skill: spring-jpa
        statement: |
          Cette requête JPQL utilise le nom de la table `livres`. En JPQL, on écrit le nom de la **classe**.
          Corrige.
        criteria: "from Livre l."
        hints:
          - "JPQL parle des classes Java."
          - "La classe s'appelle Livre."
          - "`select l from Livre l where l.emprunte = false`"
        solution: |
          @Query("select l from Livre l where l.emprunte = false")
          List<Livre> disponibles();
        explanation: "JPQL = classes ; SQL = tables."
        xp: 10
        payload:
          language: java
          starter: |
            @Query("select l from livres l where l.emprunte = false")
            List<Livre> disponibles();
          checks:
            - pattern: 'from\s+livres\b'
              absent: true
              message: "En JPQL, pas de nom de table."
            - pattern: 'from\s+Livre\s+l\b'
              message: "Écris from Livre l."

  # ===================================================================== LEÇON 5
  - slug: sb-validation-erreurs
    title: "Valider les entrées : @Valid"
    duration: 10
    objective: "Poser des règles de validation sur un DTO et les déclencher avec @Valid."
    prerequisites: "Leçon « Une requête sur mesure : @Query et join fetch »."
    skills: [spring-rest]
    xp: 15
    memo: |
      - Annotations sur le DTO : `@NotBlank`, `@Email`, `@Size(min = 12)`, `@NotNull`, `@Future`.
      - `@Valid @RequestBody` : Spring vérifie **avant** d'entrer dans la méthode ; sinon **400**.
      - Le backend revalide **toujours**, même si Angular a déjà validé.
    commonMistakes: |
      - Oublier `@Valid` : les annotations du DTO sont ignorées.
      - Ne valider que côté frontend.
    blocks:
      - type: text
        md: |
          Le frontend valide déjà les formulaires… mais n'importe qui peut appeler l'API directement, avec
          n'importe quelles données. Le backend doit donc **tout revérifier**.
      - type: definition
        id: def-validation
        term: "Bean Validation"
        md: |
          Des **étiquettes de contrôle** collées sur les champs du DTO, comme les règles d'un formulaire
          administratif : « obligatoire », « format e-mail », « au moins 12 caractères ». `@Valid` demande à
          Spring de les vérifier.
      - type: code
        id: code-validation
        language: java
        title: "Un DTO validé"
        code: |
          public record InscriptionRequest(
                  @NotBlank @Size(max = 60) String nom,
                  @NotBlank @Email String email,
                  @NotBlank @Size(min = 12) String motDePasse) {}

          @PostMapping("/inscription")
          public ResponseEntity<UtilisateurDto> inscrire(@Valid @RequestBody InscriptionRequest req) {
              return ResponseEntity.status(HttpStatus.CREATED).body(service.inscrire(req));
          }
        lines:
          - n: 2
            note: "`@NotBlank` : ni null, ni vide, ni seulement des espaces."
          - n: 3
            note: "`@Email` : doit ressembler à une adresse e-mail."
          - n: 4
            note: "`@Size(min = 12)` : au moins 12 caractères."
          - n: 7
            note: "`@Valid` déclenche la vérification. En cas d'échec : **400**, sans entrer dans la méthode."
      - type: question
        ref: sb-val-q1
        review: code-validation
      - type: question
        ref: sb-val-q3
        review: def-validation
      - type: text
        md: "**Exercice 1 (guidé)** : valider un rendez-vous."
      - type: exercise
        ref: sb-ex-validation-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : valider une salle."
      - type: exercise
        ref: sb-ex-validation-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : des règles ignorées."
      - type: exercise
        ref: sb-ex-validation-bug
      - type: jury
        items:
          - q: "Comment validez-vous les données reçues par l'API ?"
            a: "Avec Bean Validation sur les DTO (@NotBlank, @Email, @Size…) et @Valid dans le contrôleur. Les règles métier plus complexes, comme un e-mail déjà utilisé, sont vérifiées dans le service. La validation Angular améliore l'expérience, mais seule celle du backend protège."
      - type: quiz
        items:
          - ref: sb-vd-q3
            review: code-validation
          - ref: sb-vd-q4
            review: def-validation
          - ref: sb-vd-q5
            review: code-validation
    questions:
      - code: sb-val-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Le DTO a `@NotBlank` sur `nom`, mais un nom vide est accepté. Que manque-t-il ?"
        choices:
          - label: "@Valid devant @RequestBody"
            correct: true
            why: "Sans @Valid, les annotations sont ignorées."
          - label: "@NotNull en plus"
            correct: false
            why: "@NotBlank refuse déjà null."
          - label: "Un try/catch"
            correct: false
            why: "La validation ne s'est même pas déclenchée."
        explanation: "`@Valid @RequestBody InscriptionRequest req`."
      - code: sb-val-q3
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: spring-rest
        prompt: "Quelles annotations Bean Validation existent ? (plusieurs réponses)"
        choices:
          - label: "@NotBlank"
            correct: true
            why: "Texte non vide."
          - label: "@Email"
            correct: true
            why: "Format e-mail."
          - label: "@Size(min = 12)"
            correct: true
            why: "Longueur."
          - label: "@Password"
            correct: false
            why: "N'existe pas dans la norme."
        explanation: "Aussi : @NotNull, @Future, @Past, @Pattern…"
      - code: sb-vd-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Quel statut renvoie Spring quand `@Valid` échoue ?"
        choices:
          - label: "400"
            correct: true
            why: "Demande invalide."
          - label: "404"
            correct: false
            why: "Rien d'introuvable ici."
          - label: "500"
            correct: false
            why: "Le serveur n'est pas en panne."
        explanation: "Données invalides → 400."
      - code: sb-vd-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: spring-rest
        prompt: "Si Angular valide le formulaire, le backend n'a pas besoin de @Valid."
        choices:
          - label: "Vrai"
            correct: false
            why: "On peut appeler l'API sans Angular."
          - label: "Faux"
            correct: true
            why: "Seule la validation du backend protège."
        explanation: "Frontend : confort ; backend : sécurité."
      - code: sb-vd-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Quelle annotation refuse un texte vide ou fait d'espaces ?"
        choices:
          - label: "@NotBlank"
            correct: true
            why: "Ni null, ni vide, ni espaces."
          - label: "@Email"
            correct: false
            why: "Il vérifie un format."
          - label: "@Future"
            correct: false
            why: "Il concerne les dates."
        explanation: "@NotBlank pour les textes obligatoires."
    exercises:
      - slug: sb-ex-validation-guide
        kind: COMPLETER
        title: "Valider un rendez-vous"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète : motif obligatoire, date dans le futur, et déclenchement de la validation."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Texte obligatoire : NotBlank. Date dans le futur : Future."
          - "Le déclenchement : Valid."
          - "NotBlank, Future, Valid."
        solution: '["NotBlank", "Future", "Valid"]'
        explanation: "Les règles sur le DTO, le déclenchement dans le contrôleur."
        xp: 10
        payload:
          language: java
          template: |
            public record RendezVousRequest(
                    @[[1]] String motif,
                    @NotNull @[[2]] LocalDateTime debut) {}

            public RendezVousDto creer(@[[3]] @RequestBody RendezVousRequest req) { … }
          blanks:
            - ["NotBlank"]
            - ["Future", "FutureOrPresent"]
            - ["Valid"]
      - slug: sb-ex-validation-libre
        kind: CODE_LIBRE
        title: "Valider une salle"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          Écris le record `SalleRequest` avec `String nom` obligatoire (`@NotBlank`, au plus 50 caractères avec
          `@Size(max = 50)`) et `String ville` obligatoire (`@NotBlank`).
        criteria: "Deux champs annotés correctement."
        hints:
          - "`public record SalleRequest(…) {}`"
          - "`@NotBlank @Size(max = 50) String nom`"
          - "`@NotBlank String ville`"
        solution: |
          public record SalleRequest(
                  @NotBlank @Size(max = 50) String nom,
                  @NotBlank String ville) {}
        explanation: "Les règles voyagent avec le DTO."
        xp: 15
        payload:
          language: java
          starter: |
            public record SalleRequest(String nom, String ville) {}
          checks:
            - pattern: '@NotBlank\s+@Size\s*\(\s*max\s*=\s*50\s*\)\s+String\s+nom|@Size\s*\(\s*max\s*=\s*50\s*\)\s+@NotBlank\s+String\s+nom'
              message: "nom : @NotBlank @Size(max = 50)."
            - pattern: '@NotBlank\s+String\s+ville'
              message: "ville : @NotBlank."
      - slug: sb-ex-validation-bug
        kind: CORRIGER_ERREUR
        title: "Des règles ignorées"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          Le DTO porte des règles, mais un e-mail vide est accepté. Ajoute ce qui déclenche la validation.
        criteria: "@Valid devant @RequestBody."
        hints:
          - "Les annotations du DTO ne se vérifient pas seules."
          - "Une annotation les déclenche."
          - "`@Valid @RequestBody ContactRequest req`"
        solution: |
          @PostMapping
          public ContactDto envoyer(@Valid @RequestBody ContactRequest req) {
              return service.envoyer(req);
          }
        explanation: "Sans @Valid, aucune règle n'est vérifiée."
        xp: 10
        payload:
          language: java
          starter: |
            @PostMapping
            public ContactDto envoyer(@RequestBody ContactRequest req) {
                return service.envoyer(req);
            }
          checks:
            - pattern: '@Valid\s+@RequestBody\s+ContactRequest|@RequestBody\s+@Valid\s+ContactRequest'
              message: "Ajoute @Valid devant @RequestBody."

  # ===================================================================== LEÇON 6
  - slug: sb-gestion-erreurs
    title: "Des erreurs claires : @RestControllerAdvice"
    duration: 11
    objective: "Centraliser la gestion des erreurs et renvoyer 400, 404 ou 409 avec un message utile."
    prerequisites: "Leçon « Valider les entrées : @Valid »."
    skills: [spring-rest, api-rest]
    xp: 15
    memo: |
      - `@RestControllerAdvice` + `@ExceptionHandler` : **un seul endroit** transforme les exceptions en réponses.
      - Correspondances : introuvable → **404**, conflit (e-mail déjà pris) → **409**, données invalides → **400**.
      - `ProblemDetail` : un format standard de réponse d'erreur (`title`, `status`, `detail`).
      - Ne jamais renvoyer la trace Java (stack trace) au client.
    commonMistakes: |
      - Un `try/catch` dans chaque contrôleur au lieu d'un gestionnaire global.
      - Renvoyer le message technique de l'exception (nom de table, requête SQL) à l'utilisateur.
    blocks:
      - type: definition
        id: def-advice
        term: "Gestionnaire global d'erreurs"
        md: |
          Un **service réclamations** unique pour toute l'API : quelle que soit l'erreur et l'endroit où elle
          arrive, c'est lui qui rédige une réponse polie, avec le bon statut.
      - type: code
        id: code-advice
        language: java
        title: "GestionErreurs.java"
        code: |
          @RestControllerAdvice
          public class GestionErreurs {

              @ExceptionHandler(RessourceIntrouvableException.class)
              public ProblemDetail introuvable(RessourceIntrouvableException e) {
                  return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());
              }

              @ExceptionHandler(EmailDejaUtiliseException.class)
              public ProblemDetail conflit(EmailDejaUtiliseException e) {
                  return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, "Cet e-mail est déjà utilisé.");
              }
          }
        lines:
          - n: 1
            note: "S'applique à **tous** les contrôleurs."
          - n: 4
            note: "Cette méthode s'occupe d'un type d'exception précis."
          - n: 6
            note: "404 avec un message clair."
          - n: 11
            note: "409 Conflict : la demande entre en conflit avec l'état actuel."
      - type: question
        ref: sb-val-q2
        review: code-advice
      - type: question
        ref: sb-val-q5
        review: def-advice
      - type: text
        md: "**Exercice 1 (guidé)** : complète le gestionnaire."
      - type: exercise
        ref: sb-ex-advice-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un gestionnaire d'erreurs."
      - type: exercise
        ref: sb-ex-advice
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une trace technique renvoyée."
      - type: exercise
        ref: sb-ex-advice-bug
      - type: jury
        items:
          - q: "Comment gérez-vous les erreurs ?"
            a: "Les services lancent des exceptions métier. Un @RestControllerAdvice les traduit en réponses ProblemDetail avec le bon statut : 400, 404, 409. Les erreurs inattendues donnent un 500 générique, journalisé côté serveur, sans trace technique pour le client."
      - type: quiz
        items:
          - ref: sb-val-q4
            review: def-advice
          - ref: sb-ge-q4
            review: code-advice
          - ref: sb-ge-q5
            review: def-advice
    questions:
      - code: sb-val-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: api-rest
        prompt: "Une inscription avec un e-mail déjà utilisé : quel statut ?"
        choices:
          - label: "409 Conflict"
            correct: true
            why: "Conflit avec une donnée existante."
          - label: "500"
            correct: false
            why: "Ce n'est pas une panne du serveur."
          - label: "200 avec un message d'erreur"
            correct: false
            why: "Le statut doit dire la vérité."
        explanation: "400 données invalides, 404 introuvable, 409 conflit."
      - code: sb-val-q5
        kind: TEXTE
        difficulty: 2
        skill: spring-rest
        prompt: "Quelle annotation de classe centralise la gestion des exceptions de tous les contrôleurs REST ? (sans @)"
        answers: ["RestControllerAdvice", "@RestControllerAdvice", "ControllerAdvice"]
        explanation: "`@RestControllerAdvice` + une méthode `@ExceptionHandler` par type d'erreur."
      - code: sb-val-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: api-rest
        prompt: "Renvoyer la trace complète de l'exception (stack trace) au client aide à la sécurité."
        choices:
          - label: "Vrai"
            correct: false
            why: "Elle révèle des détails internes utiles à un attaquant."
          - label: "Faux"
            correct: true
            why: "On journalise côté serveur et on renvoie un message simple."
        explanation: "Message clair pour l'utilisateur, détails dans les logs."
      - code: sb-ge-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "À quoi sert `@ExceptionHandler(RessourceIntrouvableException.class)` ?"
        choices:
          - label: "À indiquer quelle exception cette méthode transforme en réponse"
            correct: true
            why: "Une méthode par type d'erreur."
          - label: "À lancer l'exception"
            correct: false
            why: "C'est le service qui la lance."
          - label: "À ignorer l'exception"
            correct: false
            why: "Elle est traitée, pas ignorée."
        explanation: "Exception → réponse HTTP."
      - code: sb-ge-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Pourquoi un gestionnaire global plutôt qu'un try/catch dans chaque contrôleur ?"
        choices:
          - label: "Les règles d'erreur sont écrites une seule fois pour toute l'API"
            correct: true
            why: "Même statut, même format partout."
          - label: "Les try/catch sont interdits en Java"
            correct: false
            why: "Ils sont permis."
          - label: "C'est plus rapide"
            correct: false
            why: "C'est une question de cohérence."
        explanation: "Un seul service réclamations."
    exercises:
      - slug: sb-ex-advice-guide
        kind: COMPLETER
        title: "Compléter le gestionnaire"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète l'annotation de la classe, l'annotation de la méthode et le statut 404."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La classe : RestControllerAdvice."
          - "La méthode : ExceptionHandler ; 404 se nomme NOT_FOUND."
          - "RestControllerAdvice, ExceptionHandler, NOT_FOUND."
        solution: '["RestControllerAdvice", "ExceptionHandler", "NOT_FOUND"]'
        explanation: "Classe globale, méthode ciblée, statut précis."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]]
            public class GestionErreurs {
                @[[2]](RessourceIntrouvableException.class)
                public ProblemDetail introuvable(RessourceIntrouvableException e) {
                    return ProblemDetail.forStatusAndDetail(HttpStatus.[[3]], e.getMessage());
                }
            }
          blanks:
            - ["RestControllerAdvice"]
            - ["ExceptionHandler"]
            - ["NOT_FOUND"]
      - slug: sb-ex-advice
        kind: CODE_LIBRE
        title: "Un gestionnaire d'erreurs"
        difficulty: DIFFICILE
        skill: spring-rest
        statement: |
          Écris la classe `GestionErreurs` :
          - annotée `@RestControllerAdvice` ;
          - une méthode qui gère `RessourceIntrouvableException` et renvoie un `ProblemDetail` **404** avec
            le message de l'exception ;
          - une méthode qui gère `CreneauIndisponibleException` et renvoie un `ProblemDetail` **409** avec
            le texte « Ce créneau n'est plus disponible. ».
        criteria: "@RestControllerAdvice, deux @ExceptionHandler, ProblemDetail avec NOT_FOUND et CONFLICT."
        hints:
          - "`@ExceptionHandler(RessourceIntrouvableException.class)` au-dessus de la méthode."
          - "`return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());`"
          - "Pour le conflit : `HttpStatus.CONFLICT`."
        solution: |
          @RestControllerAdvice
          public class GestionErreurs {

              @ExceptionHandler(RessourceIntrouvableException.class)
              public ProblemDetail introuvable(RessourceIntrouvableException e) {
                  return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());
              }

              @ExceptionHandler(CreneauIndisponibleException.class)
              public ProblemDetail conflit(CreneauIndisponibleException e) {
                  return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, "Ce créneau n'est plus disponible.");
              }
          }
        explanation: "Chaque exception métier a son statut, défini une seule fois pour toute l'API."
        xp: 30
        payload:
          language: java
          starter: |
            public class GestionErreurs {

            }
          checks:
            - pattern: '@RestControllerAdvice\s+public\s+class\s+GestionErreurs'
              message: "Annote la classe avec `@RestControllerAdvice`."
            - pattern: '@ExceptionHandler\s*\(\s*RessourceIntrouvableException\.class\s*\)'
              message: "Ajoute `@ExceptionHandler(RessourceIntrouvableException.class)`."
            - pattern: '@ExceptionHandler\s*\(\s*CreneauIndisponibleException\.class\s*\)'
              message: "Ajoute `@ExceptionHandler(CreneauIndisponibleException.class)`."
            - pattern: 'HttpStatus\.NOT_FOUND\s*,\s*\w+\.getMessage\s*\(\s*\)'
              message: "Renvoie un 404 avec le message de l'exception : `HttpStatus.NOT_FOUND, e.getMessage()`."
            - pattern: 'HttpStatus\.CONFLICT\s*,\s*"Ce créneau n''est plus disponible\.?"'
              message: "Renvoie un 409 (`HttpStatus.CONFLICT`) avec « Ce créneau n'est plus disponible. »."
            - pattern: '\A(?>[\s\S]*?ProblemDetail\.forStatusAndDetail\s*\(){2}'
              message: "Utilise `ProblemDetail.forStatusAndDetail(…)` dans les deux méthodes."
      - slug: sb-ex-advice-bug
        kind: CORRIGER_ERREUR
        title: "Une trace technique renvoyée"
        difficulty: INTERMEDIAIRE
        skill: spring-rest
        statement: |
          Ce gestionnaire des erreurs inattendues renvoie la trace technique au client. Remplace le détail par
          un message simple : « Une erreur inattendue est survenue. ».
        criteria: "Plus de getStackTrace ni de toString de l'exception ; message simple."
        hints:
          - "Le client ne doit voir aucun détail interne."
          - "Les détails vont dans les journaux du serveur."
          - "`ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, \"Une erreur inattendue est survenue.\")`"
        solution: |
          @ExceptionHandler(Exception.class)
          public ProblemDetail inattendue(Exception e) {
              log.error("Erreur inattendue", e);
              return ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, "Une erreur inattendue est survenue.");
          }
        explanation: "Message simple pour le client, détails dans les journaux."
        xp: 10
        payload:
          language: java
          starter: |
            @ExceptionHandler(Exception.class)
            public ProblemDetail inattendue(Exception e) {
                log.error("Erreur inattendue", e);
                return ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, Arrays.toString(e.getStackTrace()));
            }
          checks:
            - pattern: 'getStackTrace|e\.toString\(\)'
              absent: true
              message: "Ne renvoie pas la trace technique."
            - pattern: 'INTERNAL_SERVER_ERROR\s*,\s*"Une erreur inattendue est survenue\.?"'
              message: "Renvoie « Une erreur inattendue est survenue. »."

