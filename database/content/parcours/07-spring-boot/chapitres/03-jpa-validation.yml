        difficulty: FACILE
        skill: spring-jpa
        statement: "Complète le repository des salles et sa recherche par ville."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Un repository est une interface qui étend JpaRepository."
          - "L'identifiant est un Long ; la recherche commence par findBy."
          - "interface, Long, findByVille."
        solution: '["interface", "Long", "findByVille"]'
        explanation: "Interface, types, méthode dérivée."
        xp: 10
        payload:
