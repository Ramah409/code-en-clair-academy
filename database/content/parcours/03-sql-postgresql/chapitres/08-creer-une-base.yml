slug: creer-une-base
position: 8
level: AVANCE
title: "Créer une base : tables, contraintes, index et vues"
summary: "Passer du modèle au code : choisir les types, créer des tables avec leurs clés et contraintes, accélérer les recherches avec des index et simplifier l'accès avec des vues."
quizQuestionCount: 15

lessons:
  # ===================================================================== LEÇON 1
  - slug: sql-create-table
    title: "CREATE TABLE et types de données"
    duration: 12
    objective: "Créer une table en choisissant des types adaptés et une clé primaire générée automatiquement."
    prerequisites: "Chapitres 1 à 6."
    skills: [sql-ddl]
    xp: 15
    memo: |
      - `CREATE TABLE nom (colonne TYPE contraintes, ...);`
      - Types courants : `INTEGER`, `BIGINT`, `NUMERIC(p, s)` (montants), `VARCHAR(n)`, `TEXT`, `BOOLEAN`, `DATE`, `TIMESTAMPTZ`.
      - Clé primaire auto-incrémentée : `id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY` (ou `SERIAL`, plus ancien).
      - Nommage : tables au pluriel, en `snake_case`, sans accent.
    commonMistakes: |
      - Stocker un prix dans un `REAL` ou un `FLOAT` : erreurs d'arrondi. Utilise `NUMERIC(10, 2)`.
      - Stocker une date dans un `VARCHAR` : impossible de trier ou de calculer correctement.
      - Oublier la clé primaire.
    blocks:
      - type: text
        md: |
          Jusqu'ici, tu as utilisé des tables existantes. Au titre CDA, tu dois aussi savoir **les créer** à
          partir d'un modèle (le MPD). C'est le rôle du **DDL** (*Data Definition Language*) : `CREATE`,
          `ALTER`, `DROP`.
      - type: definition
        id: def-ddl-et-dml
        term: "DDL et DML"
        md: |
          - **DDL** (définition) : crée ou modifie la **structure** → `CREATE TABLE`, `ALTER TABLE`, `DROP TABLE`.
          - **DML** (manipulation) : agit sur les **données** → `SELECT`, `INSERT`, `UPDATE`, `DELETE`.
      - type: code
        language: sql
        title: "La table des formations d'un centre de formation"
        code: |
          CREATE TABLE formations (
            id          BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            titre       VARCHAR(150) NOT NULL,
            duree_jours INTEGER      NOT NULL,
            prix        NUMERIC(8, 2),
            a_distance  BOOLEAN      NOT NULL DEFAULT FALSE,
            date_debut  DATE
          );
        lines:
          - n: 1
            note: "Nom de la table : pluriel, minuscules, sans accent."
          - n: 2
            note: "Identifiant technique généré automatiquement par PostgreSQL (1, 2, 3…) et clé primaire."
          - n: 3
            note: "Texte de 150 caractères maximum, obligatoire (`NOT NULL`)."
          - n: 4
            note: "Nombre entier obligatoire."
          - n: 5
            note: "Montant exact : 8 chiffres dont 2 après la virgule. Facultatif (peut être NULL)."
          - n: 6
            note: "Booléen avec une valeur par défaut : si on ne le précise pas à l'insertion, il vaut FALSE."
          - n: 7
            note: "Une vraie date (pas un texte) : on pourra trier et calculer."
      - type: demo
        title: "Démonstration : créer, insérer, relire"
        md: "La table est créée, remplie puis lue… et tout disparaît à la fin de l'exécution. Remarque que `id` et `a_distance` sont remplis automatiquement."
        language: sql
        code: |
          CREATE TABLE formations (
            id          BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            titre       VARCHAR(150) NOT NULL,
            duree_jours INTEGER      NOT NULL,
            prix        NUMERIC(8, 2),
            a_distance  BOOLEAN      NOT NULL DEFAULT FALSE,
            date_debut  DATE
          );
          INSERT INTO formations (titre, duree_jours, prix)
          VALUES ('Concepteur Développeur d''Applications', 180, 7900.00);
          SELECT * FROM formations;
      - type: question
        ref: sql-c7l1-q1
      - type: question
        ref: sql-c7l1-q2
      - type: exercise
        ref: sql-ex-create-apprenants
      - type: question
        ref: sql-c7l1-q3
      - type: question
        ref: sql-c7l1-q4
      - type: quiz
        items:
          - ref: sqlq-create-1
          - ref: sqlq-create-2
            review: def-ddl-et-dml
          - ref: sqlq-create-3
    questions:
      - code: sql-c7l1-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-ddl
        prompt: "Quel type choisir pour stocker un **prix** en euros ?"
        choices:
          - label: "`NUMERIC(10, 2)`"
            correct: true
            why: "Type exact : pas d'erreur d'arrondi sur les centimes."
          - label: "`REAL`"
            correct: false
            why: "Nombre approché : les centimes peuvent être mal enregistrés."
          - label: "`VARCHAR(10)`"
            correct: false
            why: "Un texte ne permet ni calcul fiable ni tri numérique."
          - label: "`INTEGER`"
            correct: false
            why: "Possible en stockant des centimes, mais pas pour une valeur en euros avec décimales."
        explanation: "Pour l'argent : NUMERIC (ou DECIMAL) côté base, BigDecimal côté Java. Jamais float ni double."
      - code: sql-c7l1-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-ddl
        prompt: "`CREATE TABLE` fait partie du DML (langage de manipulation des données)."
        choices:
          - label: "Vrai"
            correct: false
            why: "CREATE agit sur la structure : c'est du DDL."
          - label: "Faux"
            correct: true
            why: "DDL = structure (CREATE, ALTER, DROP) ; DML = données (SELECT, INSERT, UPDATE, DELETE)."
        explanation: "On cite aussi le DCL (GRANT, REVOKE) pour les droits et le TCL (COMMIT, ROLLBACK) pour les transactions."
      - code: sql-c7l1-q3
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-ddl
        prompt: "Complète pour qu'une colonne `actif` vaille TRUE si on ne la renseigne pas."
        snippet: |
          actif BOOLEAN NOT NULL ____ TRUE
        language: sql
        answers: ["DEFAULT"]
        explanation: "`DEFAULT valeur` fournit la valeur utilisée quand l'INSERT n'en précise pas."
      - code: sql-c7l1-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-ddl
        prompt: "Que signifie `GENERATED ALWAYS AS IDENTITY` ?"
        choices:
          - label: "PostgreSQL génère lui-même une valeur croissante pour chaque nouvelle ligne"
            correct: true
            why: "C'est la forme standard SQL de l'auto-incrément ; ALWAYS interdit de fournir la valeur à la main."
          - label: "La colonne doit être identique dans toutes les lignes"
            correct: false
            why: "C'est l'inverse : chaque ligne reçoit une valeur différente."
          - label: "La colonne est une clé étrangère"
            correct: false
            why: "Une identité est une valeur générée, pas une référence."
        explanation: "C'est ce qu'utilise le schéma de Code en Clair Academy. `SERIAL` produit un effet proche, avec une séquence moins encapsulée."
      - code: sqlq-create-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-ddl
        prompt: Quel type pour une date de naissance (sans heure) ?
        choices:
          - label: '`DATE`'
            correct: true
            why: Oui.
          - label: '`VARCHAR(10)`'
            correct: false
            why: Un texte ne permet ni calcul ni contrôle de validité.
          - label: '`INTEGER`'
            correct: false
            why: Un nombre ne représente pas une date.
        explanation: DATE (jour), TIMESTAMPTZ (date + heure + fuseau), INTERVAL (durée).
      - code: sqlq-create-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-ddl
        prompt: Laquelle de ces instructions fait partie du DDL ?
        choices:
          - label: '`ALTER TABLE`'
            correct: true
            why: 'Oui : elle modifie la structure.'
          - label: '`INSERT`'
            correct: false
            why: INSERT manipule les données (DML).
          - label: '`SELECT`'
            correct: false
            why: SELECT lit les données.
        explanation: DDL = structure (CREATE, ALTER, DROP) ; DML = données (INSERT, UPDATE, DELETE).
      - code: sqlq-create-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-ddl
        prompt: '`VARCHAR(50)` refuse un texte de 60 caractères.'
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : PostgreSQL lève une erreur (valeur trop longue).'
          - label: Faux
            correct: false
            why: 'PostgreSQL ne tronque pas : il refuse.'
        explanation: 'La longueur maximale est une contrainte de qualité : choisis-la selon le métier.'
    exercises:
      - slug: sql-ex-create-apprenants
        kind: SQL
        title: "Créer la table des apprenants"
        difficulty: INTERMEDIAIRE
        skill: sql-ddl
        statement: |
          Crée la table `apprenants` avec les colonnes suivantes :

          | Colonne | Type | Règle |
          |---------|------|-------|
          | `id` | entier long généré automatiquement | clé primaire |
          | `nom` | texte de 80 caractères maximum | obligatoire |
          | `email` | texte de 254 caractères maximum | obligatoire |
          | `date_naissance` | date | facultative |
          | `actif` | booléen | obligatoire, vaut TRUE par défaut |
        criteria: "Colonnes, types, caractère obligatoire et clé primaire conformes au tableau."
        hints:
          - "Commence par `CREATE TABLE apprenants (` et sépare les colonnes par des virgules."
          - "Types : BIGINT GENERATED ALWAYS AS IDENTITY, VARCHAR(80), VARCHAR(254), DATE, BOOLEAN. « Obligatoire » se traduit par NOT NULL."
          - "`actif BOOLEAN NOT NULL DEFAULT TRUE` ; `id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY`."
        solution: |
          CREATE TABLE apprenants (
            id             BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            nom            VARCHAR(80)  NOT NULL,
            email          VARCHAR(254) NOT NULL,
            date_naissance DATE,
            actif          BOOLEAN      NOT NULL DEFAULT TRUE
          );
        explanation: |
          La vérification lit la description de ta table dans le catalogue de PostgreSQL (colonnes, types,
          caractère obligatoire, valeur par défaut) et ses contraintes. `NOT NULL` est implicite pour la clé
          primaire.
        xp: 20
        payload:
          mode: WRITE
          check: >-
            SELECT 'colonne' AS element, column_name AS nom, data_type AS type,
                   COALESCE(character_maximum_length::text, '') AS taille, is_nullable AS nullable,
                   COALESCE(column_default, '') AS defaut
            FROM information_schema.columns
            WHERE table_schema = 'lab' AND table_name = 'apprenants'
            UNION ALL
            SELECT 'contrainte', contype::text, count(*)::text, '', '', ''
            FROM pg_constraint WHERE conrelid = 'lab.apprenants'::regclass GROUP BY contype
            ORDER BY 1, 2

  # ===================================================================== LEÇON 2
  - slug: sql-contraintes
    title: "Contraintes et clés étrangères"
    duration: 12
    objective: "Protéger la qualité des données avec NOT NULL, UNIQUE, CHECK, PRIMARY KEY et FOREIGN KEY."
    prerequisites: "CREATE TABLE."
    skills: [sql-ddl, merise-mld-mpd]
    xp: 15
    memo: |
      - `NOT NULL` : valeur obligatoire ; `UNIQUE` : pas de doublon ; `CHECK (condition)` : règle métier.
      - `REFERENCES table (colonne)` : clé étrangère.
      - Comportement à la suppression : `ON DELETE RESTRICT` (défaut), `CASCADE`, `SET NULL`.
      - Clé primaire composée : `PRIMARY KEY (col1, col2)` pour une table d'association.
    commonMistakes: |
      - Mettre `ON DELETE CASCADE` partout : on peut effacer des données sans le vouloir.
      - Oublier la contrainte UNIQUE sur un email de connexion.
      - Déclarer une clé étrangère vers une colonne qui n'est ni clé primaire ni UNIQUE.
    blocks:
      - type: text
        md: |
          Une application peut avoir des bugs ; la base, elle, doit rester cohérente. Les **contraintes**
          traduisent les **règles de gestion** directement dans la structure : PostgreSQL refusera toute
          donnée qui les viole, quelle que soit l'application qui l'envoie.
      - type: code
        language: sql
        title: "Sessions de formation et inscriptions"
        code: |
          CREATE TABLE sessions_formation (
            id         BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            code       VARCHAR(20) NOT NULL UNIQUE,
            places     INTEGER     NOT NULL CHECK (places BETWEEN 1 AND 30),
            date_debut DATE        NOT NULL
          );
          CREATE TABLE inscriptions (
            session_id  BIGINT NOT NULL REFERENCES sessions_formation (id) ON DELETE CASCADE,
            apprenant   VARCHAR(80) NOT NULL,
            inscrit_le  DATE NOT NULL DEFAULT CURRENT_DATE,
            PRIMARY KEY (session_id, apprenant)
          );
        lines:
          - n: 3
            note: "`UNIQUE` : deux sessions ne peuvent pas avoir le même code."
          - n: 4
            note: "`CHECK` : règle de gestion « une session accueille entre 1 et 30 personnes »."
          - n: 8
            note: "Clé étrangère : chaque inscription référence une session existante. Si la session est supprimée, ses inscriptions le sont aussi (CASCADE)."
          - n: 10
            note: "Valeur par défaut calculée : la date du jour."
          - n: 11
            note: "Clé primaire **composée** : une même personne ne peut s'inscrire qu'une fois à une session."
      - type: demo
        title: "Démonstration : les contraintes en action"
        md: "La troisième insertion viole le CHECK (35 places). Supprime-la et exécute à nouveau, puis essaie d'inscrire deux fois la même personne."
        language: sql
        code: |
          CREATE TABLE sessions_formation (
            id         BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            code       VARCHAR(20) NOT NULL UNIQUE,
            places     INTEGER     NOT NULL CHECK (places BETWEEN 1 AND 30),
            date_debut DATE        NOT NULL
          );
          INSERT INTO sessions_formation (code, places, date_debut) VALUES ('CDA-2026-A', 15, '2026-10-05');
          INSERT INTO sessions_formation (code, places, date_debut) VALUES ('CDA-2026-B', 35, '2027-01-11');
          SELECT * FROM sessions_formation;
      - type: question
        ref: sql-c7l2-q1
      - type: question
        ref: sql-c7l2-q2
      - type: exercise
        ref: sql-ex-create-avis-formation
      - type: question
        ref: sql-c7l2-q3
      - type: question
        ref: sql-c7l2-q4
      - type: quiz
        items:
          - ref: sqlq-contr-1
          - ref: sqlq-contr-2
          - ref: sqlq-contr-3
    questions:
      - code: sql-c7l2-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-ddl
        prompt: "Quelle contrainte traduit la règle « une note est comprise entre 0 et 20 » ?"
        choices:
          - label: "`CHECK (note BETWEEN 0 AND 20)`"
            correct: true
            why: "CHECK exprime une condition que chaque ligne doit respecter."
          - label: "`UNIQUE (note)`"
            correct: false
            why: "UNIQUE interdirait que deux apprenants aient la même note."
          - label: "`DEFAULT 0 AND 20`"
            correct: false
            why: "DEFAULT fournit une valeur par défaut, pas une règle ; la syntaxe est invalide."
        explanation: "Les règles de gestion simples (bornes, valeurs autorisées) se traduisent en CHECK."
      - code: sql-c7l2-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-ddl
        prompt: "Que se passe-t-il si l'on supprime une session avec `ON DELETE CASCADE` sur la clé étrangère des inscriptions ?"
        choices:
          - label: "Les inscriptions de cette session sont supprimées automatiquement"
            correct: true
            why: "La suppression est propagée aux lignes qui référencent la session."
          - label: "La suppression est refusée tant qu'il reste des inscriptions"
            correct: false
            why: "C'est le comportement RESTRICT (par défaut)."
          - label: "Les inscriptions gardent un session_id NULL"
            correct: false
            why: "C'est le comportement SET NULL (impossible ici avec NOT NULL)."
        explanation: "Choisis CASCADE pour les données qui n'ont pas de sens sans leur parent (inscriptions, lignes de commande), RESTRICT sinon."
      - code: sql-c7l2-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-ddl
        prompt: "Une table d'association a souvent une clé primaire composée des deux clés étrangères."
        choices:
          - label: "Vrai"
            correct: true
            why: "Exemple : `PRIMARY KEY (commande_id, produit_id)` dans lignes_commande."
          - label: "Faux"
            correct: false
            why: "C'est justement la traduction d'une association (0,n)–(0,n) du MCD."
        explanation: "La clé composée empêche aussi les doublons : un produit n'apparaît qu'une fois par commande."
      - code: sql-c7l2-q4
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-ddl
        prompt: "Complète la déclaration de clé étrangère."
        snippet: |
          client_id BIGINT NOT NULL ____ clients (id)
        language: sql
        answers: ["REFERENCES"]
        explanation: "`REFERENCES table (colonne)` déclare une clé étrangère directement sur la colonne."
      - code: sqlq-contr-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-ddl
        prompt: Quelle contrainte rend une colonne obligatoire ?
        choices:
          - label: '`NOT NULL`'
            correct: true
            why: Oui.
          - label: '`UNIQUE`'
            correct: false
            why: UNIQUE interdit les doublons, pas le vide.
          - label: '`DEFAULT`'
            correct: false
            why: DEFAULT propose une valeur, mais n'interdit pas NULL.
        explanation: NOT NULL = obligatoire ; UNIQUE = sans doublon ; CHECK = règle ; FOREIGN KEY = lien.
      - code: sqlq-contr-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-ddl
        prompt: Que fait `ON DELETE SET NULL` sur une clé étrangère ?
        choices:
          - label: Met la clé étrangère à NULL quand la ligne visée est supprimée
            correct: true
            why: 'Oui : la ligne dépendante est conservée.'
          - label: Supprime les lignes dépendantes
            correct: false
            why: C'est CASCADE.
          - label: Empêche la suppression
            correct: false
            why: C'est le comportement par défaut (RESTRICT / NO ACTION).
        explanation: La colonne doit alors accepter NULL.
      - code: sqlq-contr-3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-ddl
        prompt: Une contrainte en base protège les données même si le code de l'application a un bug.
        choices:
          - label: Vrai
            correct: true
            why: "Oui : c'est la dernière ligne de défense."
          - label: Faux
            correct: false
            why: La base refuse toute donnée invalide, quel que soit le programme.
        explanation: 'Règles dans le service ET contraintes en base : deux niveaux de protection.'
    exercises:
      - slug: sql-ex-create-avis-formation
        kind: SQL
        title: "Table des avis de formation"
        difficulty: DIFFICILE
        skill: sql-ddl
        statement: |
          Crée la table `avis_formation` :
          - `id` : entier long généré automatiquement, clé primaire ;
          - `client_id` : entier, **obligatoire**, **clé étrangère** vers `clients (id)` ;
          - `note` : entier obligatoire, **compris entre 1 et 5** ;
          - `commentaire` : texte libre (type `TEXT`), facultatif ;
          - `cree_le` : date obligatoire, valant **la date du jour par défaut**.

          Règle supplémentaire : un client ne peut déposer **qu'un seul avis** (contrainte d'unicité sur `client_id`).
        criteria: "Colonnes, types, NOT NULL, DEFAULT, clé primaire, clé étrangère, CHECK et UNIQUE conformes."
        hints:
          - "Il te faut une contrainte de chaque sorte : PRIMARY KEY, FOREIGN KEY (REFERENCES), CHECK et UNIQUE."
          - "`client_id INTEGER NOT NULL UNIQUE REFERENCES clients (id)` et `note INTEGER NOT NULL CHECK (note BETWEEN 1 AND 5)`."
          - "`cree_le DATE NOT NULL DEFAULT CURRENT_DATE` ; `commentaire TEXT`."
        solution: |
          CREATE TABLE avis_formation (
            id          BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            client_id   INTEGER NOT NULL UNIQUE REFERENCES clients (id),
            note        INTEGER NOT NULL CHECK (note BETWEEN 1 AND 5),
            commentaire TEXT,
            cree_le     DATE    NOT NULL DEFAULT CURRENT_DATE
          );
        explanation: |
          Chaque règle de gestion devient une contrainte : l'unicité de l'avis par client (UNIQUE), la
          plage de notes (CHECK), l'existence du client (FOREIGN KEY). La base garantit ces règles même si
          une application boguée tente de les contourner.
        xp: 30
        payload:
          mode: WRITE
          check: >-
            SELECT 'colonne' AS element, column_name AS nom, data_type AS type, is_nullable AS nullable,
                   COALESCE(column_default, '') AS defaut
            FROM information_schema.columns
            WHERE table_schema = 'lab' AND table_name = 'avis_formation'
            UNION ALL
            SELECT 'contrainte', contype::text, count(*)::text, '', ''
            FROM pg_constraint WHERE conrelid = 'lab.avis_formation'::regclass GROUP BY contype
            ORDER BY 1, 2

  # ===================================================================== LEÇON 3
  - slug: sql-index-vues
    title: "Accélérer les recherches : les index"
    duration: 10
    objective: "Comprendre à quoi sert un index, en créer un avec CREATE INDEX et lire un plan avec EXPLAIN."
    prerequisites: "Leçon « Contraintes et clés étrangères »."
    skills: [sql-avance]
    xp: 12
    memo: |
      - Un **index** accélère les recherches (WHERE, JOIN, ORDER BY) sur une colonne.
      - En échange, les écritures (INSERT, UPDATE, DELETE) sont un peu plus lentes et l'index prend de la place.
      - `CREATE INDEX nom_index ON table (colonne);`
      - Les clés primaires et UNIQUE ont déjà un index ; pas les clés étrangères.
      - `EXPLAIN` montre comment PostgreSQL va lire la table (Seq Scan = tout lire, Index Scan = via l'index).
    commonMistakes: |
      - Indexer toutes les colonnes : chaque index ralentit les écritures.
      - Oublier d'indexer les clés étrangères utilisées dans les jointures.
    blocks:
      - type: text
        md: |
          Sur 30 produits, PostgreSQL lit toute la table en un instant. Sur 30 millions, chercher un e-mail
          ligne par ligne prendrait des secondes. Un **index** règle ce problème.
      - type: definition
        id: def-index
        term: "Index"
        md: |
          L'**index à la fin d'un livre** : au lieu de lire toutes les pages pour trouver « jointure », tu
          regardes l'index qui te donne directement la bonne page.
      - type: code
        id: code-index
        language: sql
        title: "Créer un index et observer le plan"
        code: |
          CREATE TABLE commandes_copie AS SELECT * FROM commandes;
          CREATE INDEX ix_copie_client ON commandes_copie (client_id);
          EXPLAIN
          SELECT * FROM commandes_copie WHERE client_id = 7;
        lines:
          - n: 1
            note: "Dans le laboratoire, on ne peut indexer que ses propres tables : on crée donc une copie de `commandes`."
          - n: 2
            note: "Un index sur client_id : il accélère la recherche des commandes d'un client."
          - n: 3
            note: "`EXPLAIN` n'exécute pas la requête : il affiche le **plan** choisi par PostgreSQL."
      - type: demo
        title: "Essaie"
        md: "Sur une si petite table, PostgreSQL peut préférer tout lire (Seq Scan) : c'est plus rapide pour lui. Sur de gros volumes, il utiliserait l'index."
        language: sql
        code: |
          CREATE TABLE commandes_copie AS SELECT * FROM commandes;
          CREATE INDEX ix_copie_client ON commandes_copie (client_id);
          EXPLAIN
          SELECT * FROM commandes_copie WHERE client_id = 7;
      - type: question
        ref: sqlq-index-1
        review: def-index
      - type: question
        ref: sql-c7l3-q1
        review: def-index
      - type: text
        md: "Exercice guidé : complète la création de l'index."
      - type: exercise
        ref: sql-ex-index-guide
      - type: text
        md: "Remets dans l'ordre la démarche pour vérifier un index."
      - type: exercise
        ref: sql-ex-index-ordre
      - type: quiz
        items:
          - ref: sqlq-index-3
            review: code-index
          - ref: sql-c7l3-q4
            review: def-index
          - ref: sql-p23-q5
            review: code-index
    questions:
      - code: sqlq-index-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-avance
        prompt: À quoi sert un index ?
        choices:
          - label: À accélérer les recherches sur une colonne
            correct: true
            why: "Oui : comme l'index d'un livre."
          - label: À empêcher les doublons dans tous les cas
            correct: false
            why: Seul un index UNIQUE fait cela.
          - label: À sauvegarder la table
            correct: false
            why: Un index n'est pas une sauvegarde.
        explanation: Index = lectures plus rapides, écritures un peu plus lentes.
      - code: sql-c7l3-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Quel est l'inconvénient principal d'un index ?"
        choices:
          - label: "Il ralentit un peu les écritures (INSERT, UPDATE, DELETE) et prend de la place"
            correct: true
            why: "Chaque modification de la table doit aussi mettre l'index à jour."
          - label: "Il ralentit les SELECT"
            correct: false
            why: "C'est l'inverse : il les accélère."
          - label: "Il interdit les doublons"
            correct: false
            why: "Seul un index UNIQUE interdit les doublons."
        explanation: "On indexe les colonnes souvent utilisées dans WHERE, JOIN et ORDER BY, pas toutes."
      - code: sqlq-index-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-avance
        prompt: '`EXPLAIN` montre le plan choisi par PostgreSQL pour exécuter une requête.'
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : on y voit par exemple Seq Scan ou Index Scan.'
          - label: Faux
            correct: false
            why: C'est précisément son rôle.
        explanation: EXPLAIN aide à vérifier qu'un index est bien utilisé.
      - code: sql-c7l3-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Quelles colonnes PostgreSQL indexe-t-il **automatiquement** ?"
        choices:
          - label: "Les clés primaires et les colonnes UNIQUE"
            correct: true
            why: "Ces contraintes reposent sur un index créé automatiquement."
          - label: "Toutes les clés étrangères"
            correct: false
            why: "Les clés étrangères ne sont pas indexées automatiquement : c'est à toi de le faire."
          - label: "Toutes les colonnes NOT NULL"
            correct: false
            why: "NOT NULL n'a pas besoin d'index."
        explanation: "Bonne pratique : indexer les clés étrangères utilisées dans les jointures."
      - code: sql-p23-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Dans un plan, que signifie « Seq Scan on commandes » ?"
        choices:
          - label: "PostgreSQL lit toute la table, ligne par ligne"
            correct: true
            why: "Seq Scan = lecture complète, sans index."
          - label: "PostgreSQL utilise un index"
            correct: false
            why: "Ce serait « Index Scan »."
          - label: "La requête a échoué"
            correct: false
            why: "C'est seulement la façon de lire choisie."
        explanation: "Un Seq Scan sur une grosse table filtrée est souvent le signe d'un index manquant."
    exercises:
      - slug: sql-ex-index-guide
        kind: COMPLETER
        title: "Compléter la création de l'index"
        difficulty: FACILE
        skill: sql-avance
        statement: "Complète pour créer un index sur la colonne `email` de ta table `contacts`."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Créer un index : CREATE INDEX."
          - "Le nom de la table vient après ON."
          - "CREATE, INDEX, ON."
        solution: '["CREATE", "INDEX", "ON"]'
        explanation: "`CREATE INDEX ix_contacts_email ON contacts (email);`"
        xp: 10
        payload:
          language: sql
          template: |
            [[1]] [[2]] ix_contacts_email [[3]] contacts (email);
          blanks:
            - ["CREATE"]
            - ["INDEX"]
            - ["ON"]
      - slug: sql-ex-index-ordre
        kind: REMETTRE_ORDRE
        title: "Vérifier qu'un index sert"
        difficulty: FACILE
        skill: sql-avance
        statement: "Remets ces lignes dans l'ordre : créer une copie, l'indexer, puis afficher le plan d'une recherche."
        criteria: "La table existe avant l'index, et EXPLAIN précède la requête observée."
        hints:
          - "On ne peut pas indexer une table qui n'existe pas encore."
          - "EXPLAIN se place juste avant le SELECT qu'il observe."
          - "CREATE TABLE, CREATE INDEX, EXPLAIN, SELECT."
        solution: |
          CREATE TABLE clients_copie AS SELECT * FROM clients;
          CREATE INDEX ix_copie_ville ON clients_copie (ville);
          EXPLAIN
          SELECT * FROM clients_copie WHERE ville = 'Lyon';
        explanation: "La table d'abord, l'index ensuite, puis EXPLAIN pour voir si PostgreSQL l'utilise."
        xp: 10
        payload:
          language: sql
          lines:
            - "CREATE TABLE clients_copie AS SELECT * FROM clients;"
            - "CREATE INDEX ix_copie_ville ON clients_copie (ville);"
            - "EXPLAIN"
            - "SELECT * FROM clients_copie WHERE ville = 'Lyon';"

  # ===================================================================== LEÇON 4
  - slug: sql-vues
    title: "Enregistrer une requête : les vues"
    duration: 10
    objective: "Enregistrer une requête sous un nom avec CREATE VIEW, puis l'interroger comme une table."
    prerequisites: "Leçon « Accélérer les recherches : les index »."
    skills: [sql-avance]
    xp: 12
    memo: |
      - `CREATE VIEW nom AS SELECT ...;` enregistre une requête sous un nom.
      - On l'interroge comme une table : `SELECT * FROM nom;`
      - Une vue ne stocke pas de données : elle relance sa requête à chaque fois, donc elle est toujours à jour.
      - Pratique pour simplifier une requête longue ou cacher des colonnes sensibles.
    commonMistakes: |
      - Croire qu'une vue est une copie des données.
      - Confondre une vue (enregistrée dans la base) et une CTE (qui ne dure que le temps d'une requête).
    blocks:
      - type: text
        md: |
          Une requête longue que tu relances tous les jours ? Au lieu de la réécrire, tu l'**enregistres**
          sous un nom : c'est une **vue**.
      - type: definition
        id: def-vue
        term: "Vue"
        md: |
          Un **raccourci sur ton bureau** : il ne contient pas le fichier, il te mène au bon endroit. Une vue
          ne contient pas les données, elle relance la requête enregistrée.
      - type: code
        id: code-vue
        language: sql
        title: "Une vue « catalogue public »"
        code: |
          CREATE VIEW catalogue AS
          SELECT p.nom, c.nom AS categorie, p.prix
          FROM produits p
          LEFT JOIN categories c ON c.id = p.categorie_id
          WHERE p.stock > 0;
          SELECT * FROM catalogue ORDER BY prix LIMIT 5;
        lines:
          - n: 1
            note: "On enregistre la requête qui suit sous le nom `catalogue`."
          - n: 5
            note: "Seuls les produits disponibles apparaissent ; le stock exact n'est pas montré."
          - n: 6
            note: "On interroge la vue exactement comme une table."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis remplace la dernière ligne par `SELECT * FROM catalogue WHERE categorie = 'Livres';`."
        language: sql
        code: |
          CREATE VIEW catalogue AS
          SELECT p.nom, c.nom AS categorie, p.prix
          FROM produits p
          LEFT JOIN categories c ON c.id = p.categorie_id
          WHERE p.stock > 0;
          SELECT * FROM catalogue ORDER BY prix LIMIT 5;
      - type: question
        ref: sqlq-index-2
        review: def-vue
      - type: question
        ref: sql-p24-q2
        review: code-vue
      - type: text
        md: "Exercice guidé : complète la vue."
      - type: exercise
        ref: sql-ex-vue-guide
      - type: text
        md: "En autonomie : une vue des ventes par produit."
      - type: exercise
        ref: sql-ex-vue-ventes
      - type: quiz
        items:
          - ref: sql-c7l3-q2
            review: def-vue
          - ref: sql-p24-q4
            review: def-vue
          - ref: sql-p24-q5
            review: code-vue
    questions:
      - code: sqlq-index-2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-avance
        prompt: Quel est l'intérêt d'une vue ?
        choices:
          - label: Donner un nom à une requête pour la réutiliser simplement
            correct: true
            why: "Oui : on l'interroge comme une table."
          - label: Copier les données pour les sauvegarder
            correct: false
            why: Une vue ne stocke pas de données.
          - label: Accélérer toutes les requêtes
            correct: false
            why: "Pour la vitesse, ce sont les index."
        explanation: Une vue simplifie, cache des colonnes sensibles et évite de répéter une requête.
      - code: sql-p24-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-avance
        prompt: "Comment lire la vue `catalogue` ?"
        choices:
          - label: "`SELECT * FROM catalogue;`"
            correct: true
            why: "Une vue se lit comme une table."
          - label: "`OPEN VIEW catalogue;`"
            correct: false
            why: "Cette instruction n'existe pas."
          - label: "`RUN catalogue;`"
            correct: false
            why: "Cette instruction n'existe pas."
        explanation: "Pour la personne qui l'utilise, une vue ressemble à une table."
      - code: sql-c7l3-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-avance
        prompt: "Une vue stocke une copie des données au moment de sa création."
        choices:
          - label: "Vrai"
            correct: false
            why: "Une vue relance sa requête à chaque lecture : elle est toujours à jour."
          - label: "Faux"
            correct: true
            why: "Seule une vue « matérialisée » garde un résultat enregistré."
        explanation: "Vue = requête enregistrée, pas données enregistrées."
      - code: sql-p24-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Quelle différence entre une vue et une CTE (WITH) ?"
        choices:
          - label: "La vue reste enregistrée dans la base ; la CTE ne dure que le temps d'une requête"
            correct: true
            why: "La vue se réutilise demain ; la CTE disparaît après la requête."
          - label: "Aucune"
            correct: false
            why: "Leur durée de vie est différente."
          - label: "La CTE est plus rapide"
            correct: false
            why: "La différence porte sur la durée de vie, pas la vitesse."
        explanation: "Vue = enregistrée ; CTE = brouillon d'une seule requête."
      - code: sql-p24-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-avance
        prompt: "Si on ajoute un produit en stock, il apparaît automatiquement dans la vue `catalogue`."
        choices:
          - label: "Vrai"
            correct: true
            why: "La vue relance sa requête à chaque lecture."
          - label: "Faux"
            correct: false
            why: "Une vue est toujours à jour."
        explanation: "C'est un avantage de la vue : aucune mise à jour à faire."
    exercises:
      - slug: sql-ex-vue-guide
        kind: COMPLETER
        title: "Compléter la vue"
        difficulty: FACILE
        skill: sql-avance
        statement: "Complète pour enregistrer la liste des clients lyonnais dans une vue `clients_lyon`."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Créer une vue : CREATE VIEW."
          - "Après le nom : AS, puis la requête."
          - "CREATE, VIEW, AS."
        solution: '["CREATE", "VIEW", "AS"]'
        explanation: "`CREATE VIEW clients_lyon AS SELECT ...;`"
        xp: 10
        payload:
          language: sql
          template: |
            [[1]] [[2]] clients_lyon [[3]]
            SELECT prenom, nom
            FROM clients
            WHERE ville = 'Lyon';
          blanks:
            - ["CREATE"]
            - ["VIEW"]
            - ["AS"]
      - slug: sql-ex-vue-ventes
        kind: SQL
        title: "Vue des ventes par produit"
        difficulty: DIFFICILE
        skill: sql-avance
        statement: |
          Crée une vue `ventes_par_produit` qui affiche, pour chaque produit **déjà vendu** dans une commande
          **non annulée** :
          - `produit` : le nom du produit ;
          - `quantite_vendue` : le total des quantités (c'est `SUM` qui le calcule).

          Puis, dans la même exécution, lis la vue et range ses lignes par `quantite_vendue` décroissante,
          puis par `produit`.
        criteria: "Une vue ventes_par_produit ; la requête finale affiche 2 colonnes triées par quantité vendue décroissante puis par produit."
        hints:
          - "`CREATE VIEW ventes_par_produit AS SELECT ...` avec deux jointures (lignes_commande → produits, lignes_commande → commandes)."
          - "Filtre `WHERE co.statut <> 'ANNULEE'` et regroupe par produit (p.id, p.nom)."
          - "Termine par `SELECT * FROM ventes_par_produit ORDER BY quantite_vendue DESC, produit;`"
        solution: |
          CREATE VIEW ventes_par_produit AS
          SELECT p.nom AS produit,
                 SUM(l.quantite) AS quantite_vendue
          FROM lignes_commande l
          JOIN produits p ON p.id = l.produit_id
          JOIN commandes co ON co.id = l.commande_id
          WHERE co.statut <> 'ANNULEE'
          GROUP BY p.id, p.nom;
          SELECT * FROM ventes_par_produit ORDER BY quantite_vendue DESC, produit;
        explanation: |
          La vue range une requête d'analyse sous un nom : un tableau de bord peut ensuite la lire simplement,
          sans répéter les jointures ni la règle « on exclut les commandes annulées ».
        xp: 30
        payload:
          mode: WRITE
          ordered: true

  # ===================================================================== LEÇON 5
  - slug: sql-alter-drop
    title: "Faire évoluer une table : ALTER TABLE et DROP"
    duration: 10
    objective: "Ajouter une colonne ou une contrainte avec ALTER TABLE, et supprimer un objet avec DROP."
    prerequisites: "Leçon « Enregistrer une requête : les vues »."
    skills: [sql-ddl]
    xp: 12
    memo: |
      - `ALTER TABLE clients ADD COLUMN telephone VARCHAR(20);` ajoute une colonne (les lignes existantes reçoivent NULL).
      - `ALTER TABLE ... ADD CONSTRAINT ...` ajoute une règle.
      - `DROP TABLE nom;` supprime la table **et** ses données ; `DROP VIEW nom;` supprime une vue.
      - DELETE vide des lignes ; DROP supprime l'objet entier.
    commonMistakes: |
      - Confondre `DELETE FROM` (les lignes) et `DROP TABLE` (la table entière).
      - Ajouter une colonne NOT NULL sans valeur par défaut sur une table déjà remplie : erreur.
    blocks:
      - type: text
        md: |
          Une application évolue : il faut un numéro de téléphone pour les clients, une ancienne table ne
          sert plus… On ne recrée pas tout : on **modifie** la structure avec `ALTER TABLE`, et on supprime
          avec `DROP`.
      - type: definition
        id: def-alter-drop
        term: "ALTER TABLE et DROP"
        md: |
          `ALTER TABLE`, c'est **ajouter une pièce à une maison** déjà habitée. `DROP`, c'est **démolir** le
          bâtiment entier, meubles compris.
      - type: code
        id: code-alter
        language: sql
        title: "Faire évoluer une table"
        code: |
          ALTER TABLE clients ADD COLUMN telephone VARCHAR(20);
          ALTER TABLE clients ADD CONSTRAINT ck_clients_email CHECK (email LIKE '%@%');
        lines:
          - n: 1
            note: "Ajoute une colonne facultative : les lignes existantes reçoivent NULL."
          - n: 2
            note: "Ajoute une contrainte nommée ; PostgreSQL vérifie aussitôt que les lignes existantes la respectent. (Dans le laboratoire, ALTER TABLE ne marche que sur tes propres tables.)"
      - type: code
        id: code-drop
        language: sql
        title: "Supprimer ce qui ne sert plus"
        code: |
          DROP VIEW catalogue;
          DROP TABLE commandes_copie;
        lines:
          - n: 1
            note: "Supprime la vue (les tables qu'elle lisait ne sont pas touchées)."
          - n: 2
            note: "Supprime la table **et toutes ses lignes**. Aucune annulation possible hors transaction."
      - type: question
        ref: sql-c7l3-q3
        review: code-alter
      - type: question
        ref: sql-c7-b5
        review: code-drop
      - type: text
        md: "Exercice guidé : complète l'évolution de la table."
      - type: exercise
        ref: sql-ex-alter-guide
      - type: text
        md: "Remets dans l'ordre la vie d'une table de test."
      - type: exercise
        ref: sql-ex-alter-ordre
      - type: quiz
        items:
          - ref: sql-p25-q3
            review: def-alter-drop
          - ref: sql-p25-q4
            review: code-alter
          - ref: sql-p25-q5
            review: def-alter-drop
    questions:
      - code: sql-c7l3-q3
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-ddl
        prompt: "Complète pour ajouter une colonne `newsletter` à la table clients."
        snippet: |
          ____ clients ADD COLUMN newsletter BOOLEAN NOT NULL DEFAULT FALSE;
        language: sql
        answers: ["ALTER TABLE"]
        explanation: "`ALTER TABLE ... ADD COLUMN` fait évoluer une table. En entreprise, ces évolutions passent par des migrations (Flyway)."
      - code: sql-c7-b5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-ddl
        prompt: "Quelle instruction supprime une table **et** ses données ?"
        choices:
          - label: "`DROP TABLE nom;`"
            correct: true
            why: "DROP supprime l'objet entier."
          - label: "`DELETE FROM nom;`"
            correct: false
            why: "Supprime les lignes, la table reste."
          - label: "`ALTER TABLE nom DROP;`"
            correct: false
            why: "Cette écriture n'existe pas ; `ALTER TABLE ... DROP COLUMN` supprime une colonne."
        explanation: "Dans le laboratoire, tu ne peux supprimer que les tables que tu as créées toi-même."
      - code: sql-p25-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-ddl
        prompt: "Quand on ajoute une colonne facultative avec ALTER TABLE, les lignes existantes y reçoivent NULL."
        choices:
          - label: "Vrai"
            correct: true
            why: "La case est vide tant qu'on n'y met rien."
          - label: "Faux"
            correct: false
            why: "Sans valeur par défaut, c'est NULL."
        explanation: "Avec `DEFAULT valeur`, les lignes existantes reçoivent cette valeur à la place."
      - code: sql-p25-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-ddl
        prompt: "Quelle instruction ajoute une colonne `pays` à la table `clients` ?"
        choices:
          - label: "`ALTER TABLE clients ADD COLUMN pays VARCHAR(50);`"
            correct: true
            why: "ALTER TABLE, la table, ADD COLUMN, le nom et le type."
          - label: "`UPDATE clients ADD pays VARCHAR(50);`"
            correct: false
            why: "UPDATE modifie des données, pas la structure."
          - label: "`INSERT INTO clients COLUMN pays;`"
            correct: false
            why: "INSERT ajoute des lignes, pas des colonnes."
        explanation: "Structure → ALTER TABLE ; données → INSERT, UPDATE, DELETE."
      - code: sql-p25-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-ddl
        prompt: "Tu supprimes la vue `catalogue` avec `DROP VIEW catalogue;`. Que deviennent les produits ?"
        choices:
          - label: "Ils sont intacts : seule la requête enregistrée disparaît"
            correct: true
            why: "Une vue ne contient pas de données."
          - label: "Ils sont supprimés"
            correct: false
            why: "La vue ne faisait que lire la table produits."
          - label: "Ils sont cachés"
            correct: false
            why: "La table produits n'est pas touchée."
        explanation: "Supprimer le raccourci ne supprime pas le fichier."
    exercises:
      - slug: sql-ex-alter-guide
        kind: COMPLETER
        title: "Compléter l'évolution"
        difficulty: FACILE
        skill: sql-ddl
        statement: "Complète pour ajouter une colonne `telephone` à ta table `contacts`, puis supprimer la table `contacts_ancien`."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Modifier la structure : ALTER TABLE, puis ADD COLUMN."
          - "Supprimer une table entière : DROP TABLE."
          - "ALTER, ADD, DROP, TABLE."
        solution: '["ALTER", "ADD", "DROP", "TABLE"]'
        explanation: "`ALTER TABLE contacts ADD COLUMN telephone VARCHAR(20);` puis `DROP TABLE contacts_ancien;`"
        xp: 10
        payload:
          language: sql
          template: |
            [[1]] TABLE contacts [[2]] COLUMN telephone VARCHAR(20);
            [[3]] [[4]] contacts_ancien;
          blanks:
            - ["ALTER"]
            - ["ADD"]
            - ["DROP"]
            - ["TABLE"]
      - slug: sql-ex-alter-ordre
        kind: REMETTRE_ORDRE
        title: "La vie d'une table de test"
        difficulty: FACILE
        skill: sql-ddl
        statement: "Remets ces instructions dans l'ordre : créer la table, lui ajouter une colonne, puis la supprimer."
        criteria: "La table est créée avant d'être modifiée, et supprimée en dernier."
        hints:
          - "On ne peut pas modifier une table qui n'existe pas."
          - "DROP en dernier : après, la table n'existe plus."
          - "CREATE TABLE, ALTER TABLE, DROP TABLE."
        solution: |
          CREATE TABLE essais (id INTEGER PRIMARY KEY, titre VARCHAR(100));
          ALTER TABLE essais ADD COLUMN termine BOOLEAN DEFAULT FALSE;
          DROP TABLE essais;
        explanation: "Créer, faire évoluer, supprimer : le cycle de vie d'une table."
        xp: 10
        payload:
          language: sql
          lines:
            - "CREATE TABLE essais (id INTEGER PRIMARY KEY, titre VARCHAR(100));"
            - "ALTER TABLE essais ADD COLUMN termine BOOLEAN DEFAULT FALSE;"
            - "DROP TABLE essais;"

bank:
  - code: sql-c7-b1
    kind: CHOIX_UNIQUE
    difficulty: 1
    skill: sql-ddl
    prompt: "Quel type choisir pour une date et une heure précises, avec fuseau horaire (date de création d'un compte) ?"
    choices:
      - label: "`TIMESTAMPTZ`"
        correct: true
        why: "Date + heure + fuseau : idéal pour dater des événements."
      - label: "`DATE`"
        correct: false
        why: "Pas d'heure."
      - label: "`VARCHAR(30)`"
        correct: false
        why: "Un texte ne se trie pas et ne se calcule pas comme une date."
    explanation: "Le schéma de Code en Clair Academy utilise TIMESTAMPTZ pour tous les horodatages (created_at, updated_at…)."
  - code: sql-c7-b2
    kind: RESULTAT_CODE
    difficulty: 2
    skill: sql-ddl
    prompt: "Que se passe-t-il à la seconde insertion ?"
    snippet: |
      CREATE TABLE comptes (email VARCHAR(254) UNIQUE);
      INSERT INTO comptes VALUES ('a@exemple.fr');
      INSERT INTO comptes VALUES ('a@exemple.fr');
    language: sql
    choices:
      - label: "Erreur 23505 : la valeur viole la contrainte d'unicité"
        correct: true
        why: "UNIQUE interdit deux lignes avec le même email."
      - label: "La seconde ligne est ignorée silencieusement"
        correct: false
        why: "PostgreSQL signale toujours la violation (sauf ON CONFLICT DO NOTHING)."
      - label: "Les deux lignes sont insérées"
        correct: false
        why: "La contrainte l'interdit."
    explanation: "Astuce : pour une unicité insensible à la casse, on crée un index unique sur `lower(email)` (comme dans Code en Clair Academy)."
  - code: sql-c7-b3
    kind: VRAI_FAUX
    difficulty: 2
    skill: sql-ddl
    prompt: "UNIQUE autorise plusieurs lignes avec la valeur NULL (par défaut en PostgreSQL)."
    choices:
      - label: "Vrai"
        correct: true
        why: "NULL n'est égal à rien, donc plusieurs NULL ne sont pas des doublons."
      - label: "Faux"
        correct: false
        why: "C'est pourtant le comportement par défaut (sauf NULLS NOT DISTINCT depuis PostgreSQL 15)."
    explanation: "Ajoute NOT NULL si la valeur doit être à la fois obligatoire et unique."
