slug: premiers-pas
position: 1
level: DEBUTANT
title: "Premiers pas avec SQL"
summary: "Comprendre ce qu'est une table, écrire ta première requête, choisir tes colonnes, les renommer et transformer du texte. Une seule notion par leçon."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: sql-bases-relationnelles
    title: "Tables, lignes et colonnes"
    duration: 8
    objective: "Savoir dire ce qu'est une table, une ligne, une colonne et une clé primaire."
    prerequisites: "Aucun : c'est le point de départ."
    skills: [sql-select]
    xp: 10
    memo: |
      - Une **base de données** range les informations dans des **tables**, une table par sujet.
      - Une table a des **colonnes** (les informations) et des **lignes** (les éléments).
      - La **clé primaire** est une colonne dont la valeur est **unique** et **jamais vide** : elle désigne chaque ligne (souvent la colonne `id`).
    commonMistakes: |
      - Confondre la **base** (l'ensemble) et une **table** (un seul tableau).
      - Confondre ligne et colonne : une ligne = un élément, une colonne = une information.
    blocks:
      - type: text
        md: |
          Quand tu t'inscris sur un site, ton prénom et ton e-mail sont enregistrés quelque part. Ce
          « quelque part », c'est une **base de données**.

          Aujourd'hui, on n'écrit pas encore de code : on apprend juste à **lire** une base.
      - type: definition
        id: def-table
        term: "Table"
        md: |
          Un **tableau** sur un seul sujet, comme une feuille de tableur. Une table pour les clients, une
          pour les produits, une pour les commandes…
      - type: definition
        id: def-colonne-ou-attribut
        term: "Colonne"
        md: |
          Une **information** qu'on note pour chaque élément : le prénom, la ville, le prix… C'est l'en-tête
          d'une colonne dans un tableau.
      - type: definition
        id: def-ligne
        term: "Ligne"
        md: |
          Un **élément** concret : **une** cliente, **un** produit. C'est une rangée du tableau.
      - type: text
        md: |
          Voici un morceau de la table `clients` :

          | id | prenom | nom | ville |
          |----|--------|-----|-------|
          | 1 | Awa | Diallo | Paris |
          | 2 | Lucas | Martin | Lyon |
          | 3 | Inès | Benali | Marseille |

          Chaque **ligne** est une cliente. Chaque **colonne** est une information.
      - type: question
        ref: sql-l1-q1
        review: def-ligne
      - type: definition
        id: def-cle-primaire
        term: "Clé primaire"
        md: |
          Le **numéro de dossier** de chaque ligne. Deux clientes peuvent s'appeler Awa, mais elles n'auront
          jamais le même numéro. Ce numéro est **unique** et **jamais vide**. Dans nos tables, c'est la
          colonne `id`.
      - type: question
        ref: sql-l1-q2
        review: def-cle-primaire
      - type: text
        md: "Exercice guidé : complète le vocabulaire."
      - type: exercise
        ref: sql-ex-vocabulaire-guide
      - type: text
        md: "En autonomie : décris une table avec tes mots."
      - type: exercise
        ref: sql-ex-decrire-table
      - type: quiz
        items:
          - ref: sqlq-bases-1
            review: def-colonne-ou-attribut
          - ref: sqlq-bases-3
            review: def-cle-primaire
          - ref: sql-p1-q5
            review: def-table
    questions:
      - code: sql-l1-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Dans la table `clients`, que représente **une ligne** ?"
        choices:
          - label: "Une cliente précise, avec toutes ses informations"
            correct: true
            why: "Exact : chaque ligne correspond à un élément concret, ici une cliente."
          - label: "Une information commune à toutes les clientes, comme la ville"
            correct: false
            why: "Ça, c'est une colonne."
          - label: "L'ensemble de toutes les tables de la boutique"
            correct: false
            why: "L'ensemble des tables, c'est la base de données."
        explanation: "Les colonnes sont les informations, les lignes sont les éléments (ici les clientes)."
      - code: sql-l1-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "Deux lignes d'une même table peuvent avoir la même clé primaire."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : la clé primaire est unique, comme un numéro de dossier."
          - label: "Faux"
            correct: true
            why: "Correct : chaque ligne a son propre numéro."
        explanation: "La clé primaire est **unique** et **jamais vide**."
      - code: sqlq-bases-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Dans la table `produits`, la colonne `prix` représente…
        choices:
          - label: une information notée pour chaque produit
            correct: true
            why: 'Oui : chaque produit a un prix.'
          - label: un produit précis
            correct: false
            why: Un produit précis, c'est une ligne.
          - label: l'ensemble des tables
            correct: false
            why: L'ensemble des tables, c'est la base de données.
        explanation: Colonne = une information ; ligne = un élément ; table = le tableau entier.
      - code: sqlq-bases-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: La clé primaire d'une ligne peut rester vide.
        choices:
          - label: Vrai
            correct: false
            why: 'Non : une clé primaire est toujours remplie.'
          - label: Faux
            correct: true
            why: 'Exact : unique et jamais vide.'
        explanation: Clé primaire = unique + obligatoire.
      - code: sql-p1-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "La boutique a une table pour les clients, une pour les produits et une pour les commandes. L'ensemble de ces tables forme…"
        choices:
          - label: "la base de données"
            correct: true
            why: "Oui : la base rassemble toutes les tables."
          - label: "une ligne"
            correct: false
            why: "Une ligne est un seul élément d'une table."
          - label: "une colonne"
            correct: false
            why: "Une colonne est une seule information d'une table."
        explanation: "Base de données = l'armoire ; tables = les classeurs ; lignes = les fiches."
    exercises:
      - slug: sql-ex-vocabulaire-guide
        kind: COMPLETER
        title: "Le bon mot"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète avec : table, ligne, colonne, clé primaire."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Le tableau entier sur un sujet : une table."
          - "Une cliente : une ligne. Le prénom : une colonne."
          - "table, ligne, colonne, clé primaire."
        solution: '["table", "ligne", "colonne", "clé primaire"]'
        explanation: "Table = le tableau ; ligne = un élément ; colonne = une information ; clé primaire = le numéro unique."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Le tableau qui rassemble tous les produits est une [[1]].
            Le produit « Souris sans fil » est une [[2]] de ce tableau.
            Le prix est une [[3]] : on le note pour chaque produit.
            L'id, unique et jamais vide, est la [[4]].
          blanks:
            - ["table"]
            - ["ligne"]
            - ["colonne"]
            - ["clé primaire", "cle primaire"]
      - slug: sql-ex-decrire-table
        kind: CODE_LIBRE
        title: "Décrire la table des livres"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Une médiathèque range ses livres dans une table. Décris-la en trois lignes :
          - `Table :` son nom ;
          - `Colonnes :` au moins trois informations notées pour chaque livre ;
          - `Clé primaire :` la colonne qui donne un numéro unique à chaque livre.
        criteria: "Les trois lignes sont remplies, avec au moins trois colonnes."
        hints:
          - "Table : livres."
          - "Colonnes : par exemple titre, auteur, annee."
          - "Clé primaire : id."
        solution: |
          Table : livres
          Colonnes : id, titre, auteur, annee
          Clé primaire : id
        explanation: "Chaque livre sera une ligne ; le titre, l'auteur et l'année sont des colonnes ; l'id est la clé primaire."
        xp: 10
        payload:
          language: text
          starter: |
            Table :
            Colonnes :
            Clé primaire :
          checks:
            - pattern: '(?im)^\s*Table\s*:\s*\S+'
              message: "Donne le nom de la table après « Table : »."
            - pattern: '(?im)^\s*Colonnes\s*:\s*\S+\s*,\s*\S+\s*,\s*\S+'
              message: "Donne au moins trois colonnes, séparées par des virgules."
            - pattern: '(?im)^\s*Cl[ée]\s+primaire\s*:\s*\S+'
              message: "Indique la clé primaire après « Clé primaire : »."

  # ===================================================================== LEÇON 2
  - slug: sql-select-etoile
    title: "Ta première requête : SELECT * FROM"
    duration: 8
    objective: "Afficher tout le contenu d'une table avec SELECT * FROM."
    prerequisites: "Leçon « Tables, lignes et colonnes »."
    skills: [sql-select]
    xp: 10
    memo: |
      - Le **SQL** est la langue qu'on utilise pour parler à la base.
      - `SELECT *` : « montre-moi toutes les colonnes ».
      - `FROM table` : « dans cette table ».
      - `;` termine la requête.
    commonMistakes: |
      - Oublier `FROM` : la base ne sait pas quelle table lire.
      - Mal écrire le nom de la table (`client` au lieu de `clients`).
    blocks:
      - type: text
        md: |
          Pour lire une table, on pose une **question** à la base. Cette question s'appelle une **requête**,
          et elle s'écrit en **SQL**.
      - type: definition
        id: def-sgbd-et-sql
        term: "SGBD et SQL"
        md: |
          Le **SGBD** (ici PostgreSQL) est le **bibliothécaire** : il range les données et va les chercher.
          Le **SQL** est la **langue** qu'il comprend. On lui écrit une requête, il répond avec un tableau.
      - type: code
        id: code-select-etoile
        language: sql
        title: "Ta première requête"
        code: |
          SELECT *
          FROM categories;
        lines:
          - n: 1
            note: "`SELECT` = « montre-moi ». L'étoile `*` = « toutes les colonnes »."
          - n: 2
            note: "`FROM` = « dans la table ». Ici, la table `categories`. Le `;` termine la requête."
      - type: demo
        title: "Essaie"
        md: "Clique sur **Exécuter** : PostgreSQL répond avec le contenu de la table. Remplace ensuite `categories` par `services`."
        language: sql
        code: |
          SELECT *
          FROM categories;
      - type: callout
        variant: tip
        md: |
          Les mots `SELECT` et `FROM` peuvent s'écrire en minuscules : `select` fonctionne aussi. Par habitude,
          on les écrit en **MAJUSCULES**, pour mieux les voir.
      - type: question
        ref: sql-l1-q3
        review: code-select-etoile
      - type: question
        ref: sql-l1-q4
        review: def-sgbd-et-sql
      - type: text
        md: "Exercice guidé : complète la requête."
      - type: exercise
        ref: sql-ex-select-etoile-guide
      - type: text
        md: "En autonomie : affiche tout le contenu de la table `services`."
      - type: exercise
        ref: sql-ex-select-services
      - type: quiz
        items:
          - ref: sqlq-bases-2
            review: def-sgbd-et-sql
          - ref: sql-p2-q4
            review: code-select-etoile
          - ref: sql-p2-q5
            review: code-select-etoile
    questions:
      - code: sql-l1-q3
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Complète la requête pour afficher toutes les colonnes de la table `produits`."
        snippet: |
          SELECT ____
          FROM produits;
        language: sql
        answers: ["*"]
        explanation: "L'étoile `*` signifie « toutes les colonnes »."
      - code: sql-l1-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quel est le rôle du **SGBD** PostgreSQL ?"
        choices:
          - label: "Ranger les données, les protéger et répondre aux requêtes SQL"
            correct: true
            why: "Oui : c'est le bibliothécaire de la base."
          - label: "Afficher les pages web de l'application"
            correct: false
            why: "C'est le rôle du navigateur et du frontend."
          - label: "Écrire les requêtes à notre place"
            correct: false
            why: "C'est nous qui écrivons les requêtes ; le SGBD y répond."
        explanation: "SQL est la langue ; PostgreSQL est le SGBD qui la comprend."
      - code: sqlq-bases-2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: SQL, c'est…
        choices:
          - label: la langue pour poser des questions à une base de données
            correct: true
            why: 'Oui : on écrit des requêtes en SQL.'
          - label: le logiciel qui range les données
            correct: false
            why: Ça, c'est le SGBD (PostgreSQL).
          - label: une table particulière
            correct: false
            why: SQL est une langue, pas une table.
        explanation: Le SGBD garde les données ; SQL est la langue qu'on utilise pour lui parler.
      - code: sql-p2-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Dans `SELECT * FROM clients;`, à quoi sert `FROM clients` ?"
        choices:
          - label: "À dire dans quelle table chercher"
            correct: true
            why: "FROM = « dans la table »."
          - label: "À choisir les colonnes"
            correct: false
            why: "Les colonnes se choisissent après SELECT."
          - label: "À terminer la requête"
            correct: false
            why: "C'est le rôle du point-virgule."
        explanation: "SELECT dit **quoi** montrer, FROM dit **où** chercher."
      - code: sql-p2-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`select * from produits;` (en minuscules) fonctionne."
        choices:
          - label: "Vrai"
            correct: true
            why: "Les mots-clés SQL ne font pas la différence entre majuscules et minuscules."
          - label: "Faux"
            correct: false
            why: "Les majuscules sont seulement une habitude pour mieux lire."
        explanation: "On écrit `SELECT` et `FROM` en majuscules par habitude, pas par obligation."
    exercises:
      - slug: sql-ex-select-etoile-guide
        kind: COMPLETER
        title: "Compléter ta première requête"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète la requête qui affiche tout le contenu de la table `clients`."
        criteria: "Les trois trous sont corrects."
        hints:
          - "« Montre-moi » se dit SELECT."
          - "« Dans la table » se dit FROM."
          - "SELECT, *, FROM."
        solution: '["SELECT", "*", "FROM"]'
        explanation: "`SELECT * FROM clients;` : toutes les colonnes de la table clients."
        xp: 10
        payload:
          language: sql
          template: |
            [[1]] [[2]]
            [[3]] clients;
          blanks:
            - ["SELECT"]
            - ["*"]
            - ["FROM"]
      - slug: sql-ex-select-services
        kind: SQL
        title: "Afficher tous les services"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Affiche **toutes les colonnes** et **toutes les lignes** de la table `services`.
        criteria: "Le résultat contient les 4 services avec leurs colonnes id, nom et ville."
        hints:
          - "C'est la même requête que pour `categories`, avec une autre table."
          - "Deux mots-clés : `SELECT` pour les colonnes, `FROM` pour la table."
          - "`SELECT * FROM services;`"
        solution: |
          SELECT *
          FROM services;
        explanation: "`SELECT *` demande toutes les colonnes, `FROM services` désigne la table."
        xp: 10
        payload:
          mode: READ
          starter: "-- Écris ta requête ici\n"

  # ===================================================================== LEÇON 3
  - slug: sql-select-colonnes
    title: "Choisir ses colonnes avec SELECT"
    duration: 8
    objective: "Afficher seulement les colonnes utiles, dans l'ordre voulu."
    prerequisites: "Leçon « Ta première requête : SELECT * FROM »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `SELECT prenom, ville FROM clients;` : seulement ces deux colonnes.
      - Les colonnes sont séparées par des **virgules**.
      - **Pas** de virgule après la dernière colonne, juste avant `FROM`.
      - L'ordre écrit est l'ordre affiché.
    commonMistakes: |
      - Mettre une virgule avant `FROM` : `SELECT nom, prix, FROM produits` → erreur.
      - Oublier une virgule : `SELECT prenom nom` n'affiche qu'une colonne.
    blocks:
      - type: text
        md: |
          `SELECT *` affiche **tout**. Souvent, on n'a besoin que de **quelques colonnes**.
      - type: definition
        id: def-select-colonnes
        term: "Choisir ses colonnes"
        md: |
          Comme au restaurant : on ne commande pas toute la carte, seulement les plats qu'on veut. Après
          `SELECT`, on écrit **les noms des colonnes** voulues, séparés par des virgules.
      - type: code
        id: code-select-colonnes
        language: sql
        title: "Le nom et le prix des produits"
        code: |
          SELECT nom, prix
          FROM produits;
        lines:
          - n: 1
            note: "Deux colonnes : `nom`, puis `prix`. Une virgule entre les deux, pas après."
          - n: 2
            note: "La table lue."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis ajoute la colonne `stock` à la fin de la liste (n'oublie pas la virgule)."
        language: sql
        code: |
          SELECT nom, prix
          FROM produits;
      - type: question
        ref: sql-l2-q1
        review: def-select-colonnes
      - type: question
        ref: sqlq-select-3
        review: code-select-colonnes
      - type: text
        md: "Exercice guidé : complète la requête."
      - type: exercise
        ref: sql-ex-colonnes-guide
      - type: text
        md: "En autonomie : prépare la fiche contact des clients."
      - type: exercise
        ref: sql-ex-clients-contact
      - type: quiz
        items:
          - ref: sqlq-select-1
            review: code-select-colonnes
          - ref: sql-p3-q4
            review: code-select-colonnes
          - ref: sql-p3-q5
            review: def-select-colonnes
    questions:
      - code: sql-l2-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quelle requête affiche uniquement le prénom et la ville des clients ?"
        choices:
          - label: "`SELECT prenom, ville FROM clients;`"
            correct: true
            why: "Les colonnes après SELECT, séparées par une virgule, puis la table après FROM."
          - label: "`SELECT prenom ville FROM clients;`"
            correct: false
            why: "Sans virgule, une seule colonne s'affiche."
          - label: "`SELECT * FROM clients;`"
            correct: false
            why: "L'étoile affiche toutes les colonnes, pas seulement ces deux-là."
          - label: "`FROM clients SELECT prenom, ville;`"
            correct: false
            why: "SELECT s'écrit d'abord, FROM ensuite."
        explanation: "`SELECT colonne1, colonne2 FROM table;`"
      - code: sqlq-select-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: Dans SELECT, les noms de colonnes sont séparés par des virgules.
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : `SELECT prenom, nom, ville`.'
          - label: Faux
            correct: false
            why: 'Si : une virgule entre chaque colonne, pas après la dernière.'
        explanation: "Une virgule entre chaque colonne, aucune avant FROM."
      - code: sqlq-select-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Que signifie `*` dans `SELECT * FROM clients;` ?
        choices:
          - label: Toutes les colonnes
            correct: true
            why: "Oui : l'étoile remplace la liste de toutes les colonnes."
          - label: Toutes les tables
            correct: false
            why: La table est indiquée après FROM.
          - label: Aucune colonne
            correct: false
            why: "Au contraire : l'étoile les affiche toutes."
        explanation: "Pour découvrir une table, `*` est pratique. Dans une application, on liste les colonnes utiles."
      - code: sql-p3-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Qu'est-ce qui ne va pas dans `SELECT nom, prix, FROM produits;` ?"
        choices:
          - label: "Il y a une virgule en trop avant FROM"
            correct: true
            why: "La dernière colonne n'est pas suivie d'une virgule."
          - label: "Il manque une étoile"
            correct: false
            why: "On a choisi des colonnes : pas besoin d'étoile."
          - label: "FROM devrait être avant SELECT"
            correct: false
            why: "SELECT s'écrit toujours en premier."
        explanation: "La virgule sépare deux colonnes : jamais de virgule juste avant FROM."
      - code: sql-p3-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`SELECT ville, prenom FROM clients;` affiche la ville avant le prénom."
        choices:
          - label: "Vrai"
            correct: true
            why: "L'ordre écrit après SELECT est l'ordre affiché."
          - label: "Faux"
            correct: false
            why: "C'est toi qui choisis l'ordre des colonnes."
        explanation: "Les colonnes s'affichent dans l'ordre où tu les écris."
    exercises:
      - slug: sql-ex-colonnes-guide
        kind: COMPLETER
        title: "Trois colonnes"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour afficher le prénom, le nom et la ville des clients."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Entre deux colonnes : une virgule."
          - "Avant le nom de la table : FROM."
          - ", , , , FROM."
        solution: '[",", ",", "FROM"]'
        explanation: "`SELECT prenom, nom, ville FROM clients;`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT prenom[[1]] nom[[2]] ville
            [[3]] clients;
          blanks:
            - [","]
            - [","]
            - ["FROM"]
      - slug: sql-ex-clients-contact
        kind: SQL
        title: "Fiche contact des clients"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Le service client veut une liste simple : affiche le **prénom**, le **nom** et l'**email** de tous
          les clients, dans cet ordre de colonnes.
        criteria: "3 colonnes (prenom, nom, email) et 25 lignes."
        hints:
          - "Liste les trois colonnes après SELECT."
          - "Des virgules entre les colonnes, pas de virgule avant FROM."
          - "`SELECT prenom, nom, email FROM clients;`"
        solution: |
          SELECT prenom, nom, email
          FROM clients;
        explanation: "On liste exactement les colonnes demandées, dans l'ordre demandé."
        xp: 10
        payload:
          mode: READ
          starter: "SELECT \nFROM clients;\n"

  # ===================================================================== LEÇON 4
  - slug: sql-alias-as
    title: "Renommer une colonne avec AS"
    duration: 8
    objective: "Donner un nom plus clair à une colonne du résultat avec AS."
    prerequisites: "Leçon « Choisir ses colonnes avec SELECT »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `nom AS produit` : la colonne `nom` s'affiche sous le titre `produit`.
      - Le nouveau nom s'appelle un **alias**.
      - L'alias change seulement l'**affichage** : la table n'est jamais modifiée.
      - Un alias avec des espaces s'écrit entre **guillemets doubles** : `AS "Nom du client"`.
    commonMistakes: |
      - Mettre l'alias entre apostrophes : `AS 'client'` → erreur.
      - Croire que AS renomme la colonne dans la table : c'est seulement pour le résultat.
    blocks:
      - type: text
        md: |
          Les noms de colonnes ne sont pas toujours parlants. Avec `AS`, on donne au résultat un titre plus
          clair, comme on colle une nouvelle étiquette sur un bocal.
      - type: definition
        id: def-alias-as
        term: "Alias (AS)"
        md: |
          Un **surnom** donné à une colonne, **seulement dans le résultat**. La colonne garde son vrai nom dans
          la table : c'est juste l'étiquette affichée qui change.
      - type: code
        id: code-alias
        language: sql
        title: "Des titres plus clairs"
        code: |
          SELECT nom AS produit,
                 prix AS prix_en_euros
          FROM produits;
        lines:
          - n: 1
            note: "La colonne `nom` s'affiche sous le titre `produit`."
          - n: 2
            note: "La colonne `prix` s'affiche sous le titre `prix_en_euros`."
          - n: 3
            note: "La table n'est pas modifiée : seul le résultat change."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis écris `AS \"Nom du produit\"` (avec des guillemets doubles, car il y a des espaces)."
        language: sql
        code: |
          SELECT nom AS produit,
                 prix AS prix_en_euros
          FROM produits;
      - type: question
        ref: sql-l2-q4
        review: code-alias
      - type: question
        ref: sqlq-select-2
        review: def-alias-as
      - type: text
        md: "Exercice guidé : complète les alias."
      - type: exercise
        ref: sql-ex-alias-guide
      - type: text
        md: "En autonomie : renomme deux colonnes des clients."
      - type: exercise
        ref: sql-ex-alias-clients
      - type: quiz
        items:
          - ref: sql-p4-q3
            review: def-alias-as
          - ref: sql-p4-q4
            review: code-alias
          - ref: sql-p4-q5
            review: def-alias-as
    questions:
      - code: sql-l2-q4
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Complète pour que la colonne `nom` s'affiche sous le titre `produit`."
        snippet: |
          SELECT nom ____ produit
          FROM produits;
        language: sql
        answers: ["AS"]
        explanation: "`AS` introduit l'alias : le nouveau titre de la colonne dans le résultat."
      - code: sqlq-select-2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: À quoi sert `AS` dans `SELECT prenom AS client FROM clients;` ?
        choices:
          - label: À afficher la colonne prenom sous le titre client
            correct: true
            why: "Oui : c'est un alias."
          - label: À renommer la colonne dans la table
            correct: false
            why: "La table n'est jamais modifiée par un SELECT."
          - label: À créer une nouvelle table client
            correct: false
            why: "AS change seulement le titre affiché."
        explanation: Un alias renomme une colonne dans le résultat seulement.
      - code: sql-p4-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "Après `SELECT nom AS produit FROM produits;`, la table `produits` a une colonne `produit`."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : l'alias n'existe que dans le résultat affiché."
          - label: "Faux"
            correct: true
            why: "Exact : la colonne s'appelle toujours `nom` dans la table."
        explanation: "SELECT ne fait que lire : il ne modifie jamais la table."
      - code: sql-p4-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: "Comment écrire un alias qui contient des espaces ?"
        choices:
          - label: "`AS \"Nom du produit\"`"
            correct: true
            why: "Les guillemets doubles entourent un nom avec des espaces."
          - label: "`AS 'Nom du produit'`"
            correct: false
            why: "Les apostrophes sont réservées aux textes, pas aux noms de colonnes."
          - label: "`AS Nom du produit`"
            correct: false
            why: "Sans guillemets, les espaces coupent le nom : erreur."
        explanation: "Pour éviter les soucis, on préfère des alias sans espaces : `nom_du_produit`."
      - code: sql-p4-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Comment s'appelle le nouveau nom donné avec AS ?"
        choices:
          - label: "Un alias"
            correct: true
            why: "Un alias est un surnom pour le résultat."
          - label: "Une clé primaire"
            correct: false
            why: "La clé primaire est le numéro unique d'une ligne."
          - label: "Une table"
            correct: false
            why: "AS ne crée pas de table."
        explanation: "Alias = surnom affiché dans le résultat."
    exercises:
      - slug: sql-ex-alias-guide
        kind: COMPLETER
        title: "Compléter les alias"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour afficher `prenom` sous le titre `client` et `ville` sous le titre `habite_a`."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot-clé de l'alias : AS."
          - "Le nouveau titre vient juste après AS."
          - "AS, AS, habite_a."
        solution: '["AS", "AS", "habite_a"]'
        explanation: "`SELECT prenom AS client, ville AS habite_a FROM clients;`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT prenom [[1]] client,
                   ville [[2]] [[3]]
            FROM clients;
          blanks:
            - ["AS"]
            - ["AS"]
            - ["habite_a"]
      - slug: sql-ex-alias-clients
        kind: SQL
        title: "Des titres clairs pour les clients"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Affiche le **prénom** des clients sous le titre `client` et leur **email** sous le titre `contact`.
        criteria: "2 colonnes nommées client et contact, 25 lignes."
        hints:
          - "Deux colonnes : prenom et email."
          - "Après chaque colonne : AS puis le nouveau titre."
          - "`SELECT prenom AS client, email AS contact FROM clients;`"
        solution: |
          SELECT prenom AS client, email AS contact
          FROM clients;
        explanation: "Les données sont les mêmes ; seuls les titres des colonnes changent dans le résultat."
        xp: 10
        payload:
          mode: READ
          starter: "SELECT \nFROM clients;\n"

  # ===================================================================== LEÇON 5
  - slug: sql-transformer-texte
    title: "Transformer du texte : UPPER, LOWER et ||"
    duration: 10
    objective: "Mettre un texte en majuscules ou en minuscules, et coller plusieurs textes ensemble."
    prerequisites: "Leçon « Renommer une colonne avec AS »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `UPPER(nom)` : le nom en MAJUSCULES.
      - `LOWER(email)` : l'e-mail en minuscules.
      - `prenom || ' ' || nom` : colle le prénom, un espace et le nom.
      - Un texte fixe s'écrit entre **apostrophes** : `' '`, `'Bonjour '`.
      - On ajoute souvent un alias : `UPPER(nom) AS etiquette`.
    commonMistakes: |
      - Oublier l'espace : `prenom || nom` donne « AwaDiallo ».
      - Écrire un texte fixe entre guillemets doubles : `" "` → erreur.
      - Croire que UPPER modifie la table : c'est seulement l'affichage.
    blocks:
      - type: text
        md: |
          On peut aussi **transformer** une colonne avant de l'afficher : la mettre en majuscules, ou coller
          deux colonnes pour faire une phrase.
      - type: definition
        id: def-fonction-texte
        term: "Fonction de texte"
        md: |
          Une **machine** : on lui donne un texte, elle rend un texte transformé. `UPPER` rend le texte en
          majuscules, `LOWER` en minuscules. Le `||` sert de **colle** entre deux textes.
      - type: code
        id: code-texte
        language: sql
        title: "Une étiquette et un nom complet"
        code: |
          SELECT UPPER(nom) AS nom_majuscules,
                 prenom || ' ' || nom AS client,
                 LOWER(email) AS email_minuscules
          FROM clients;
        lines:
          - n: 1
            note: "`UPPER(nom)` : le nom en majuscules, affiché sous le titre `nom_majuscules`."
          - n: 2
            note: "On colle le prénom, un espace `' '` et le nom : « Awa Diallo »."
          - n: 3
            note: "`LOWER(email)` : l'e-mail tout en minuscules."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis remplace `' '` par `' - '` pour voir la différence."
        language: sql
        code: |
          SELECT UPPER(nom) AS nom_majuscules,
                 prenom || ' ' || nom AS client,
                 LOWER(email) AS email_minuscules
          FROM clients;
      - type: question
        ref: sql-l2-q3
        review: code-texte
      - type: question
        ref: sql-l2-q2
        review: def-fonction-texte
      - type: text
        md: "Exercice guidé : complète le nom complet."
      - type: exercise
        ref: sql-ex-texte-guide
      - type: text
        md: "En autonomie : prépare une étiquette de rayon."
      - type: exercise
        ref: sql-ex-nom-complet
      - type: quiz
        items:
          - ref: sql-c1-b8
            review: def-fonction-texte
          - ref: sql-p5-q4
            review: code-texte
          - ref: sql-p5-q5
            review: def-fonction-texte
    questions:
      - code: sql-l2-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Pour la cliente Awa Diallo, que contient la colonne `client` ?"
        snippet: |
          SELECT prenom || ' ' || UPPER(nom) AS client
          FROM clients;
        language: sql
        choices:
          - label: "Awa DIALLO"
            correct: true
            why: "Le prénom reste tel quel, un espace est ajouté, UPPER met le nom en majuscules."
          - label: "AWA DIALLO"
            correct: false
            why: "UPPER ne s'applique qu'à `nom`, pas au prénom."
          - label: "AwaDIALLO"
            correct: false
            why: "Le morceau `' '` ajoute bien un espace."
        explanation: "`||` colle des textes, `' '` est un espace, `UPPER()` met en majuscules."
      - code: sql-l2-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "La requête `SELECT UPPER(nom) FROM produits;` met les noms des produits en majuscules dans la table."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : SELECT ne fait que lire."
          - label: "Faux"
            correct: true
            why: "Exact : la transformation n'existe que dans le résultat affiché."
        explanation: "Un SELECT ne modifie jamais les données. Tu verras plus tard comment les modifier."
      - code: sql-c1-b8
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Que renvoie cette requête ?"
        snippet: |
          SELECT 'Code' || ' en ' || 'Clair' AS titre;
        language: sql
        choices:
          - label: "Code en Clair"
            correct: true
            why: "`||` colle les trois morceaux, espaces compris."
          - label: "CodeenClair"
            correct: false
            why: "Les espaces sont écrits dans le morceau ' en ' : ils sont gardés."
          - label: "Une erreur, car il n'y a pas de FROM"
            correct: false
            why: "PostgreSQL accepte un SELECT sans FROM pour tester une expression."
        explanation: "`||` colle des textes. PostgreSQL accepte `SELECT` sans `FROM`, pratique pour essayer."
      - code: sql-p5-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quelle fonction affiche un texte en minuscules ?"
        choices:
          - label: "`LOWER`"
            correct: true
            why: "LOWER = en bas, les minuscules."
          - label: "`UPPER`"
            correct: false
            why: "UPPER met en majuscules."
          - label: "`||`"
            correct: false
            why: "`||` colle des textes."
        explanation: "UPPER = majuscules, LOWER = minuscules."
      - code: sql-p5-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: "Comment écrire un espace dans une requête qui colle des textes ?"
        choices:
          - label: "`' '` (un espace entre apostrophes)"
            correct: true
            why: "Un texte fixe s'écrit entre apostrophes."
          - label: "`\" \"` (entre guillemets doubles)"
            correct: false
            why: "Les guillemets doubles servent aux noms de colonnes."
          - label: "Rien, l'espace s'ajoute tout seul"
            correct: false
            why: "`||` colle sans rien ajouter."
        explanation: "`prenom || ' ' || nom` : l'espace est un petit texte entre apostrophes."
    exercises:
      - slug: sql-ex-texte-guide
        kind: COMPLETER
        title: "Le nom complet"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour afficher le prénom et le nom collés avec un espace, sous le titre `client`."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La colle entre deux textes : ||."
          - "L'espace : un espace entre apostrophes."
          - "||, ' ', AS."
        solution: '["||", "'' ''", "AS"]'
        explanation: "`SELECT prenom || ' ' || nom AS client FROM clients;`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT prenom [[1]] [[2]] || nom [[3]] client
            FROM clients;
          blanks:
            - ["||"]
            - ["' '"]
            - ["AS"]
      - slug: sql-ex-nom-complet
        kind: SQL
        title: "Une étiquette de rayon"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Pour une étiquette de rayon, affiche pour chaque produit :
          - son **nom** ;
          - son **nom en majuscules**, dans une colonne nommée `etiquette`.
        criteria: "2 colonnes : nom et etiquette (le nom en majuscules), 30 lignes."
        hints:
          - "La transformation se fait directement dans le SELECT."
          - "La fonction `UPPER(texte)` met un texte en majuscules."
          - "`SELECT nom, UPPER(nom) AS etiquette FROM produits;`"
        solution: |
          SELECT nom, UPPER(nom) AS etiquette
          FROM produits;
        explanation: |
          `UPPER(nom)` transforme le nom pour chaque ligne et `AS etiquette` nomme la colonne. Rien n'est
          modifié dans la table.
        xp: 15
        payload:
          mode: READ
          starter: "SELECT nom, \nFROM produits;\n"

bank:
