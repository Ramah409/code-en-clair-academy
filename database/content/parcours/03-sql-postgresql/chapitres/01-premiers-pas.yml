      - label: "Simple Question Library"
        correct: false
        why: "Inventé : SQL n'est pas une bibliothèque."
      - label: "Server Quality Layer"
        correct: false
        why: "Inventé également."
    explanation: "SQL = Structured Query Language, la langue des bases de données relationnelles."
  - code: sql-c1-b2
    kind: CHOIX_MULTIPLE
    difficulty: 1
