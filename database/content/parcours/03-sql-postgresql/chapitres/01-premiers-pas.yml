        correct: true
        why: "Les majuscules sont une habitude de lisibilité."
      - label: "Faux"
        correct: false
        why: "`select nom from produits;` fonctionne."
    explanation: "Habitude : mots-clés en MAJUSCULES, noms de tables et de colonnes en minuscules."
  - code: sql-c1-b7
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-select
    prompt: "Pourquoi éviter `SELECT *` dans le code d'une application ?"
    choices:
      - label: "On récupère des colonnes inutiles, voire sensibles"
        correct: true
        why: "Lister les colonnes utiles est plus sûr et plus léger."
      - label: "Parce que `*` est interdit par PostgreSQL"
        correct: false
        why: "`*` est parfaitement valide."
      - label: "Parce que `*` ne renvoie que la première colonne"
        correct: false
        why: "`*` renvoie toutes les colonnes."
    explanation: "`SELECT *` est idéal pour découvrir une table ; dans une application, on liste les colonnes utiles."
  - code: sql-c1-b11
