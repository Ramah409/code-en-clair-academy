slug: filtres-avances
position: 3
level: DEBUTANT
title: "Filtres pratiques"
summary: "Des raccourcis pour filtrer (IN, BETWEEN, LIKE), la valeur NULL, les doublons avec DISTINCT et les étiquettes avec CASE. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: sql-in-between-like
    title: "Une liste de valeurs : IN"
    duration: 8
    objective: "Garder les lignes dont une colonne vaut l'une des valeurs d'une liste, avec IN et NOT IN."
    prerequisites: "Chapitre « Trier et filtrer » (en particulier OR et NOT)."
    skills: [sql-select]
    xp: 10
    memo: |
      - `ville IN ('Paris', 'Lyon')` est un raccourci pour `ville = 'Paris' OR ville = 'Lyon'`.
      - La liste s'écrit **entre parenthèses**, les valeurs sont séparées par des **virgules**.
      - `NOT IN (...)` garde tout **sauf** les valeurs de la liste.
    commonMistakes: |
      - Oublier les parenthèses : `ville IN 'Paris', 'Lyon'`.
      - Oublier les apostrophes autour des textes de la liste.
    blocks:
      - type: text
        md: |
          Écrire `ville = 'Paris' OR ville = 'Lyon' OR ville = 'Lille'`, c'est long. Quand on compare **une
          même colonne** à plusieurs valeurs, SQL propose un raccourci : `IN`.
      - type: definition
        id: def-in
        term: "IN (dans la liste)"
        md: |
          Une **liste d'invités** à l'entrée d'une fête : si ton nom est sur la liste, tu entres.
          `ville IN ('Paris', 'Lyon')` garde les lignes dont la ville est sur la liste.
      - type: code
        id: code-in
        language: sql
        title: "Les clients de Paris ou de Lyon"
        code: |
          SELECT prenom, nom, ville
          FROM clients
          WHERE ville IN ('Paris', 'Lyon');
        lines:
          - n: 3
            note: "`IN (...)` : la ville doit faire partie de la liste. Même résultat qu'avec deux OR."
      - type: demo
        title: "Essaie"
        md: "Ajoute `'Lille'` à la liste, puis remplace `IN` par `NOT IN`."
        language: sql
        code: |
          SELECT prenom, nom, ville
          FROM clients
          WHERE ville IN ('Paris', 'Lyon');
      - type: question
        ref: sql-c2l2-q1
        review: def-in
      - type: question
        ref: sql-p11-q2
        review: code-in
      - type: text
        md: "Exercice guidé : complète la liste."
      - type: exercise
        ref: sql-ex-in-guide
      - type: text
        md: "En autonomie : les employés de certains services."
      - type: exercise
        ref: sql-ex-in-employes
      - type: quiz
        items:
          - ref: sql-c2-b5
            review: def-in
          - ref: sql-p11-q4
            review: def-in
          - ref: sql-p11-q5
            review: code-in
    questions:
      - code: sql-c2l2-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quelle condition fait la même chose que `statut IN ('EN_ATTENTE', 'EXPEDIEE')` ?"
        choices:
          - label: "`statut = 'EN_ATTENTE' OR statut = 'EXPEDIEE'`"
            correct: true
            why: "IN est un raccourci pour plusieurs OR sur la même colonne."
          - label: "`statut = 'EN_ATTENTE' AND statut = 'EXPEDIEE'`"
            correct: false
            why: "Une commande n'a pas deux statuts à la fois : aucune ligne."
          - label: "`statut = 'EN_ATTENTE', 'EXPEDIEE'`"
            correct: false
            why: "Cette écriture n'existe pas : c'est une erreur."
        explanation: "`IN (liste)` rend la requête plus courte et plus lisible que plusieurs OR."
      - code: sql-p11-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quelle écriture est correcte ?"
        choices:
          - label: "`WHERE ville IN ('Nantes', 'Lille')`"
            correct: true
            why: "Parenthèses, virgules, apostrophes : tout y est."
          - label: "`WHERE ville IN 'Nantes', 'Lille'`"
            correct: false
            why: "La liste doit être entre parenthèses."
          - label: "`WHERE ville IN (Nantes, Lille)`"
            correct: false
            why: "Sans apostrophes, PostgreSQL cherche des colonnes nommées nantes et lille."
        explanation: "La liste de IN : entre parenthèses, séparée par des virgules, textes entre apostrophes."
      - code: sql-c2-b5
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Complète pour garder les commandes dont le statut n'est **ni** ANNULEE **ni** EN_ATTENTE."
        snippet: |
          SELECT id, statut FROM commandes
          WHERE statut ____ ('ANNULEE', 'EN_ATTENTE');
        language: sql
        answers: ["NOT IN"]
        explanation: "`NOT IN (liste)` garde tout sauf les valeurs de la liste."
      - code: sql-p11-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`categorie_id IN (1, 2, 3)` garde les produits des catégories 1, 2 et 3."
        choices:
          - label: "Vrai"
            correct: true
            why: "Chaque produit dont la catégorie est dans la liste est gardé."
          - label: "Faux"
            correct: false
            why: "C'est exactement le rôle de IN."
        explanation: "Les nombres de la liste s'écrivent sans apostrophes."
      - code: sql-p11-q5
        kind: RESULTAT_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Que renvoie cette requête sur la table `services` (1 Direction, 2 Développement, 3 Support client, 4 Logistique) ?"
        snippet: |
          SELECT nom
          FROM services
          WHERE id NOT IN (1, 4);
        language: sql
        choices:
          - label: "Développement et Support client"
            correct: true
            why: "On garde tout sauf les services 1 et 4."
          - label: "Direction et Logistique"
            correct: false
            why: "Ce serait le résultat avec IN, sans NOT."
          - label: "Les quatre services"
            correct: false
            why: "NOT IN écarte les services 1 et 4."
        explanation: "`NOT IN` = tout sauf la liste."
    exercises:
      - slug: sql-ex-in-guide
        kind: COMPLETER
        title: "Compléter la liste"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour garder les produits des catégories 2 (Informatique) et 6 (Musique)."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le raccourci pour une liste de valeurs : IN."
          - "La liste commence par une parenthèse ouvrante."
          - "IN, (, )."
        solution: '["IN", "(", ")"]'
        explanation: "`WHERE categorie_id IN (2, 6)`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT nom
            FROM produits
            WHERE categorie_id [[1]] [[2]]2, 6[[3]];
          blanks:
            - ["IN"]
            - ["("]
            - [")"]
      - slug: sql-ex-in-employes
        kind: SQL
        title: "Les employés de deux services"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Affiche le **prénom**, le **nom** et le **service_id** des employés des services **2** et **3**.
        criteria: "3 colonnes, uniquement les employés des services 2 et 3."
        hints:
          - "Une liste de valeurs pour une même colonne : IN."
          - "Les numéros s'écrivent sans apostrophes."
          - "`WHERE service_id IN (2, 3)`"
        solution: |
          SELECT prenom, nom, service_id
          FROM employes
          WHERE service_id IN (2, 3);
        explanation: "`IN (2, 3)` remplace `service_id = 2 OR service_id = 3`."
        xp: 10
        payload:
          mode: READ

  # ===================================================================== LEÇON 2
  - slug: sql-between
    title: "Un intervalle : BETWEEN"
    duration: 8
    objective: "Garder les valeurs comprises entre deux bornes (incluses) avec BETWEEN."
    prerequisites: "Leçon « Une liste de valeurs : IN »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `prix BETWEEN 20 AND 30` garde les prix **de 20 à 30**, les deux bornes **comprises**.
      - C'est un raccourci pour `prix >= 20 AND prix <= 30`.
      - Ça marche aussi avec les dates : `date_commande BETWEEN '2025-01-01' AND '2025-03-31'`.
    commonMistakes: |
      - Croire que BETWEEN exclut les bornes.
      - Mettre la grande valeur en premier : `BETWEEN 30 AND 20` ne renvoie rien.
    blocks:
      - type: text
        md: |
          « Les produits **entre** 20 et 30 € » : on pourrait écrire `prix >= 20 AND prix <= 30`. `BETWEEN`
          dit la même chose, plus simplement.
      - type: definition
        id: def-between
        term: "BETWEEN … AND …"
        md: |
          Une **tranche** sur une règle graduée : tout ce qui est entre les deux repères, **repères compris**.
          On écrit toujours la petite valeur d'abord.
      - type: code
        id: code-between
        language: sql
        title: "Les produits de 20 à 30 €"
        code: |
          SELECT nom, prix
          FROM produits
          WHERE prix BETWEEN 20 AND 30
          ORDER BY prix;
        lines:
          - n: 3
            note: "Garde les prix de 20 à 30, **inclus**. Le AND fait partie de BETWEEN : il relie les deux bornes."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis essaie sur les dates : `SELECT id, date_commande FROM commandes WHERE date_commande BETWEEN '2025-01-01' AND '2025-03-31';`"
        language: sql
        code: |
          SELECT nom, prix
          FROM produits
          WHERE prix BETWEEN 20 AND 30
          ORDER BY prix;
      - type: question
        ref: sql-c2l2-q2
        review: def-between
      - type: question
        ref: sql-p12-q2
        review: code-between
      - type: text
        md: "Exercice guidé : complète l'intervalle."
      - type: exercise
        ref: sql-ex-between-guide
      - type: text
        md: "En autonomie : une vitrine « petits prix » (IN et BETWEEN ensemble)."
      - type: exercise
        ref: sql-ex-produits-intervalle
      - type: quiz
        items:
          - ref: sqlq-inlike-3
            review: def-between
          - ref: sql-c2-b7
            review: code-between
          - ref: sql-p12-q5
            review: def-between
    questions:
      - code: sql-c2l2-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`WHERE prix BETWEEN 20 AND 30` écarte un produit qui coûte exactement 30 €."
        choices:
          - label: "Vrai"
            correct: false
            why: "BETWEEN inclut les deux bornes."
          - label: "Faux"
            correct: true
            why: "Exact : 20 et 30 font partie de l'intervalle."
        explanation: "`BETWEEN a AND b` revient à `>= a AND <= b`."
      - code: sql-p12-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quelle condition garde les produits dont le stock va de 10 à 50 (inclus) ?"
        choices:
          - label: "`stock BETWEEN 10 AND 50`"
            correct: true
            why: "La petite valeur d'abord, la grande ensuite, bornes comprises."
          - label: "`stock BETWEEN 50 AND 10`"
            correct: false
            why: "Dans ce sens, BETWEEN ne renvoie rien."
          - label: "`stock BETWEEN (10, 50)`"
            correct: false
            why: "BETWEEN s'écrit avec AND, pas avec une liste entre parenthèses."
        explanation: "`BETWEEN petite AND grande`."
      - code: sqlq-inlike-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: '`prix BETWEEN 10 AND 20` garde les produits à 10 € et à 20 €.'
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : les bornes sont comprises.'
          - label: Faux
            correct: false
            why: BETWEEN inclut les deux bornes.
        explanation: '`BETWEEN a AND b` équivaut à `>= a AND <= b`.'
      - code: sql-c2-b7
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: "Quelle condition garde les commandes de **janvier à mars 2025** (inclus) ?"
        choices:
          - label: "`date_commande BETWEEN '2025-01-01' AND '2025-03-31'`"
            correct: true
            why: "Du 1er janvier au 31 mars, bornes comprises."
          - label: "`date_commande BETWEEN '2025-01' AND '2025-03'`"
            correct: false
            why: "Ce ne sont pas des dates complètes au format AAAA-MM-JJ."
          - label: "`date_commande > '2025-01-01' AND date_commande < '2025-03-31'`"
            correct: false
            why: "`>` et `<` excluent le 1er janvier et le 31 mars."
        explanation: "Avec des dates complètes, BETWEEN est la forme la plus lisible."
      - code: sql-p12-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: "Dans `WHERE prix BETWEEN 5 AND 20`, à quoi sert le mot AND ?"
        choices:
          - label: "À relier les deux bornes de l'intervalle"
            correct: true
            why: "Dans BETWEEN, AND sépare la petite et la grande valeur."
          - label: "À ajouter une deuxième condition"
            correct: false
            why: "Ici, il fait partie de BETWEEN."
          - label: "Il est en trop"
            correct: false
            why: "BETWEEN s'écrit toujours avec AND."
        explanation: "`BETWEEN … AND …` forme un tout."
    exercises:
      - slug: sql-ex-between-guide
        kind: COMPLETER
        title: "Compléter l'intervalle"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour garder les clients inscrits en 2024 (du 1er janvier au 31 décembre)."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Un intervalle : BETWEEN."
          - "Les deux bornes sont reliées par AND."
          - "BETWEEN, AND."
        solution: '["BETWEEN", "AND"]'
        explanation: "`WHERE date_inscription BETWEEN '2024-01-01' AND '2024-12-31'`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT prenom, nom
            FROM clients
            WHERE date_inscription [[1]] '2024-01-01' [[2]] '2024-12-31';
          blanks:
            - ["BETWEEN"]
            - ["AND"]
      - slug: sql-ex-produits-intervalle
        kind: SQL
        title: "Petits prix dans certaines catégories"
        difficulty: INTERMEDIAIRE
        skill: sql-select
        statement: |
          Pour une vitrine « petits prix », affiche le **nom**, le **prix** et la **categorie_id** des
          produits des catégories **5 (jeux), 7 (papeterie) et 8 (jardin)** dont le prix va **de 5 à 20 €**
          (bornes incluses), du moins cher au plus cher.
        criteria: "3 colonnes, catégories 5, 7 ou 8, prix de 5 à 20 € inclus, tri par prix croissant."
        hints:
          - "IN pour la liste de catégories, BETWEEN pour les prix."
          - "Les deux conditions se relient avec AND."
          - "`WHERE categorie_id IN (5, 7, 8) AND prix BETWEEN 5 AND 20 ORDER BY prix`"
        solution: |
          SELECT nom, prix, categorie_id
          FROM produits
          WHERE categorie_id IN (5, 7, 8)
            AND prix BETWEEN 5 AND 20
          ORDER BY prix;
        explanation: "`IN (5, 7, 8)` évite trois OR, et `BETWEEN 5 AND 20` inclut les deux bornes."
        xp: 15
        payload:
          mode: READ
          ordered: true

  # ===================================================================== LEÇON 3
  - slug: sql-like
    title: "Chercher dans un texte : LIKE"
    duration: 10
    objective: "Filtrer un texte selon un motif avec LIKE, les jokers % et _, et ILIKE."
    prerequisites: "Leçon « Un intervalle : BETWEEN »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `%` remplace **n'importe quelle suite** de caractères (même aucune).
      - `_` remplace **exactement un** caractère.
      - `'A%'` commence par A ; `'%ine'` finit par « ine » ; `'%jeu%'` contient « jeu ».
      - `LIKE` tient compte des majuscules ; `ILIKE` (PostgreSQL) les ignore.
    commonMistakes: |
      - Écrire `LIKE 'A*'` : le joker SQL est `%`, pas `*`.
      - Écrire `nom = 'A%'` : `=` ne comprend pas les jokers, il cherche littéralement « A% ».
    blocks:
      - type: text
        md: |
          La barre de recherche d'un site : tu tapes « jeu » et tu trouves « Jeu de cartes », « Puzzle… jeu »…
          En SQL, on cherche un **morceau** de texte avec `LIKE`.
      - type: definition
        id: def-like-et-ses-jokers
        term: "LIKE et ses jokers"
        md: |
          Comme un **mot mêlé avec des trous** : `%` est un trou de n'importe quelle taille, `_` un trou
          d'une seule lettre. `'A%'` = « un A, puis n'importe quoi ».
      - type: code
        id: code-like
        language: sql
        title: "Les clients dont le prénom commence par M"
        code: |
          SELECT prenom, nom
          FROM clients
          WHERE prenom LIKE 'M%';
        lines:
          - n: 3
            note: "`'M%'` : un M majuscule, puis n'importe quelle suite de lettres."
      - type: demo
        title: "Une barre de recherche"
        md: "Exécute, puis remplace `jeu` par `livre`. Essaie aussi `LIKE` au lieu de `ILIKE` : les majuscules comptent alors."
        language: sql
        code: |
          SELECT nom, prix
          FROM produits
          WHERE nom ILIKE '%jeu%';
      - type: question
        ref: sqlq-inlike-1
        review: def-like-et-ses-jokers
      - type: question
        ref: sql-c2l2-q4
        review: code-like
      - type: text
        md: "Exercice guidé : complète le motif."
      - type: exercise
        ref: sql-ex-like-guide
      - type: text
        md: "En autonomie : les prénoms qui commencent par A."
      - type: exercise
        ref: sql-ex-clients-prenom-a
      - type: quiz
        items:
          - ref: sqlq-inlike-2
            review: def-like-et-ses-jokers
          - ref: sql-c2l2-q3
            review: def-like-et-ses-jokers
          - ref: sql-c2-b1
            review: code-like
    questions:
      - code: sqlq-inlike-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Dans LIKE, que remplace le joker `%` ?
        choices:
          - label: N'importe quelle suite de caractères, même aucune
            correct: true
            why: Oui.
          - label: Exactement un caractère
            correct: false
            why: C'est le rôle de `_`.
          - label: Un chiffre seulement
            correct: false
            why: '`%` accepte tout type de caractère.'
        explanation: '`%` : zéro, un ou plusieurs caractères ; `_` : exactement un caractère.'
      - code: sql-c2l2-q4
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Complète pour trouver les clients dont l'e-mail se termine par `@exemple.fr`."
        snippet: |
          SELECT prenom, email
          FROM clients
          WHERE email LIKE ____;
        language: sql
        answers: ["'%@exemple.fr'"]
        explanation: "`%` au début = « n'importe quoi avant ». Le motif est un texte : entre apostrophes."
      - code: sqlq-inlike-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: Quelle condition trouve « clavier », « Clavier » et « CLAVIER » dans PostgreSQL ?
        choices:
          - label: "`nom ILIKE '%clavier%'`"
            correct: true
            why: 'Oui : ILIKE ignore les majuscules.'
          - label: "`nom LIKE '%clavier%'`"
            correct: false
            why: LIKE tient compte des majuscules.
          - label: "`nom = 'clavier'`"
            correct: false
            why: Il faudrait le mot exact, sans rien autour.
        explanation: "ILIKE est propre à PostgreSQL. Ailleurs, on écrit `LOWER(nom) LIKE '%clavier%'` (LOWER, vu au chapitre 1)."
      - code: sql-c2l2-q3
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: sql-select
        prompt: "Quels noms correspondent au motif `LIKE 'C_a%'` ? (plusieurs réponses)"
        choices:
          - label: "Chaise"
            correct: true
            why: "C, puis une lettre (h), puis a, puis n'importe quoi."
          - label: "Clavier mécanique"
            correct: true
            why: "C, l, a, puis la suite."
          - label: "Casque audio"
            correct: false
            why: "La 3ᵉ lettre est « s », pas « a »."
          - label: "coffret"
            correct: false
            why: "LIKE tient compte des majuscules : « c » n'est pas « C »."
        explanation: "`_` = une seule lettre, `%` = n'importe quelle suite. Ici : C + une lettre + a + le reste."
      - code: sql-c2-b1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quelle condition trouve les produits dont le nom **contient** « SQL », quelles que soient les majuscules ?"
        choices:
          - label: "`WHERE nom ILIKE '%sql%'`"
            correct: true
            why: "ILIKE ignore les majuscules et `%...%` veut dire « contient »."
          - label: "`WHERE nom LIKE 'sql'`"
            correct: false
            why: "Sans joker, LIKE cherche exactement « sql »."
          - label: "`WHERE nom = '%SQL%'`"
            correct: false
            why: "`=` ne comprend pas les jokers."
          - label: "`WHERE nom CONTAINS 'SQL'`"
            correct: false
            why: "CONTAINS n'existe pas en SQL."
        explanation: "« Contient » = un `%` de chaque côté."
    exercises:
      - slug: sql-ex-like-guide
        kind: COMPLETER
        title: "Compléter le motif"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour trouver les produits dont le nom contient « lot »."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Chercher un morceau de texte : LIKE."
          - "« Contient » : un joker de chaque côté."
          - "LIKE, %, %."
        solution: '["LIKE", "%", "%"]'
        explanation: "`WHERE nom LIKE '%lot%'`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT nom
            FROM produits
            WHERE nom [[1]] '[[2]]lot[[3]]';
          blanks:
            - ["LIKE", "ILIKE"]
            - ["%"]
            - ["%"]
      - slug: sql-ex-clients-prenom-a
        kind: SQL
        title: "Clients dont le prénom commence par A"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Affiche le **prénom** et le **nom** des clients dont le prénom **commence par la lettre A**.
        criteria: "2 colonnes (prenom, nom), uniquement les prénoms commençant par A."
        hints:
          - "Un filtre sur un motif de texte utilise LIKE."
          - "Le joker `%` remplace n'importe quelle suite de caractères."
          - "`WHERE prenom LIKE 'A%'`"
        solution: |
          SELECT prenom, nom
          FROM clients
          WHERE prenom LIKE 'A%';
        explanation: "`'A%'` : un A majuscule suivi de n'importe quoi. On obtient Awa, Aminata et Alice."
        xp: 10
        payload:
          mode: READ
          requiredKeywords:
            - pattern: "\\blike\\b|\\bilike\\b"
              message: "Utilise LIKE (ou ILIKE) pour filtrer sur un motif de texte."

  # ===================================================================== LEÇON 4
  - slug: sql-null
    title: "La case vide : NULL et IS NULL"
    duration: 10
    objective: "Comprendre NULL et le tester avec IS NULL et IS NOT NULL."
    prerequisites: "Leçon « Chercher dans un texte : LIKE »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `NULL` veut dire « **pas de valeur** » : ni 0, ni texte vide.
      - On teste NULL avec `IS NULL` ou `IS NOT NULL`, **jamais** avec `= NULL`.
      - `WHERE ville = NULL` ne renvoie **jamais** rien, sans message d'erreur.
    commonMistakes: |
      - Écrire `= NULL` au lieu de `IS NULL`.
      - Oublier les NULL dans un « différent de » : `ville <> 'Paris'` écarte aussi les clients sans ville.
      - Confondre NULL et `''` (texte vide).
    blocks:
      - type: text
        md: |
          Trois clients n'ont pas donné leur ville. Leur case `ville` n'est pas « vide » au sens d'un texte
          vide : elle contient **NULL**, le signe SQL pour « rien ici ».
      - type: definition
        id: def-null
        term: "NULL"
        md: |
          Une **case d'un formulaire laissée blanche**. On ne sait pas ce qu'il y aurait dû y avoir. NULL
          n'est égal à rien, **pas même à un autre NULL** : on ne peut donc pas le tester avec `=`.
      - type: demo
        title: "Le piège du = NULL"
        md: "Exécute : **aucune ligne**, alors que trois clients n'ont pas de ville. Remplace `= NULL` par `IS NULL`."
        language: sql
        code: |
          SELECT prenom, nom, ville
          FROM clients
          WHERE ville = NULL;
      - type: code
        id: code-is-null
        language: sql
        title: "Tester correctement une case vide"
        code: |
          SELECT prenom, nom
          FROM clients
          WHERE ville IS NULL;
        lines:
          - n: 3
            note: "`IS NULL` : la bonne façon de tester une case vide. Le contraire : `IS NOT NULL`."
      - type: question
        ref: sqlq-null-2
        review: code-is-null
      - type: question
        ref: sqlq-null-1
        review: def-null
      - type: text
        md: "Exercice guidé : complète le test."
      - type: exercise
        ref: sql-ex-null-guide
      - type: text
        md: "En autonomie : les avis sans commentaire."
      - type: exercise
        ref: sql-ex-avis-sans-commentaire
      - type: quiz
        items:
          - ref: sql-c2l3-q1
            review: code-is-null
          - ref: sql-c2l3-q3
            review: def-null
          - ref: sql-c2-b4
            review: def-null
    questions:
      - code: sqlq-null-2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Quelle condition est correcte pour trouver les clients sans ville ?
        choices:
          - label: '`WHERE ville IS NULL`'
            correct: true
            why: Oui.
          - label: '`WHERE ville = NULL`'
            correct: false
            why: 'Une comparaison avec NULL ne donne jamais « vrai » : aucune ligne.'
          - label: "`WHERE ville = ''`"
            correct: false
            why: "'' est un texte vide, pas NULL."
        explanation: On teste NULL avec `IS NULL` / `IS NOT NULL`, jamais avec `=`.
      - code: sqlq-null-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Que représente NULL ?
        choices:
          - label: L'absence de valeur (inconnue ou non renseignée)
            correct: true
            why: Oui.
          - label: Le nombre zéro
            correct: false
            why: 0 est une vraie valeur.
          - label: Un texte vide ''
            correct: false
            why: "'' est un texte, même vide."
        explanation: "NULL n'est ni 0, ni '' : c'est « pas de valeur »."
      - code: sql-c2l3-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Comment afficher les avis **sans commentaire** ?"
        choices:
          - label: "`WHERE commentaire IS NULL`"
            correct: true
            why: "IS NULL est le seul test fiable d'une case vide."
          - label: "`WHERE commentaire = NULL`"
            correct: false
            why: "Aucune ligne ne serait renvoyée."
          - label: "`WHERE commentaire = ''`"
            correct: false
            why: "Le texte vide est une vraie valeur, différente de NULL."
        explanation: "Réflexe : **NULL se teste avec IS**."
      - code: sql-c2l3-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-select
        prompt: "`WHERE ville <> 'Paris'` renvoie aussi les clients dont la ville est NULL."
        choices:
          - label: "Vrai"
            correct: false
            why: "Comparer NULL à 'Paris' ne donne pas « vrai » : ces lignes sont écartées."
          - label: "Faux"
            correct: true
            why: "Pour les garder, il faut ajouter `OR ville IS NULL`."
        explanation: "Piège classique : un filtre « différent de » écarte en silence les cases vides."
      - code: sql-c2-b4
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`NULL = NULL` est vrai en SQL."
        choices:
          - label: "Vrai"
            correct: false
            why: "Deux cases vides ne sont pas « égales » : le résultat est inconnu."
          - label: "Faux"
            correct: true
            why: "Exact : c'est pour ça qu'on utilise IS NULL."
        explanation: "NULL n'est égal à rien, même pas à un autre NULL."
    exercises:
      - slug: sql-ex-null-guide
        kind: COMPLETER
        title: "Compléter le test"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour afficher les clients qui **ont** une ville renseignée."
        criteria: "Les trois trous sont corrects."
        hints:
          - "On teste une case vide avec IS, jamais avec =."
          - "« A une ville » = la case n'est pas vide."
          - "IS, NOT, NULL."
        solution: '["IS", "NOT", "NULL"]'
        explanation: "`WHERE ville IS NOT NULL`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT prenom, nom, ville
            FROM clients
            WHERE ville [[1]] [[2]] [[3]];
          blanks:
            - ["IS"]
            - ["NOT"]
            - ["NULL"]
      - slug: sql-ex-avis-sans-commentaire
        kind: SQL
        title: "Avis sans commentaire"
        difficulty: FACILE
        skill: sql-select
        statement: |
          La responsable qualité veut relancer les clients qui ont noté un produit **sans laisser de
          commentaire**. Affiche l'**id** de l'avis, le **produit_id**, le **client_id** et la **note** de ces avis.
        criteria: "4 colonnes, uniquement les avis dont le commentaire est NULL."
        hints:
          - "L'absence de commentaire, c'est NULL."
          - "Un test avec `= NULL` ne fonctionne jamais."
          - "`WHERE commentaire IS NULL`"
        solution: |
          SELECT id, produit_id, client_id, note
          FROM avis
          WHERE commentaire IS NULL;
        explanation: "`IS NULL` teste l'absence de valeur. Avec `= NULL`, aucune ligne, sans message d'erreur."
        xp: 10
        payload:
          mode: READ

  # ===================================================================== LEÇON 5
  - slug: sql-coalesce
    title: "Remplacer une case vide : COALESCE"
    duration: 8
    objective: "Afficher une valeur par défaut à la place de NULL avec COALESCE."
    prerequisites: "Leçon « La case vide : NULL et IS NULL »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `COALESCE(ville, 'Non renseignée')` affiche la ville, ou « Non renseignée » si elle est NULL.
      - COALESCE renvoie la **première valeur non NULL** de sa liste.
      - Pense à donner un nom à la colonne avec `AS`.
    commonMistakes: |
      - Croire que COALESCE modifie la table : il change seulement l'affichage.
    blocks:
      - type: text
        md: |
          Afficher « NULL » à un utilisateur, ce n'est pas joli. Mieux vaut afficher « Non renseignée ».
          C'est le rôle de `COALESCE`.
      - type: definition
        id: def-coalesce
        term: "COALESCE"
        md: |
          Une **roue de secours** : si la première valeur manque (NULL), on prend la suivante.
          `COALESCE(ville, 'Non renseignée')` = « la ville, sinon Non renseignée ».
      - type: code
        id: code-coalesce
        language: sql
        title: "Une valeur par défaut"
        code: |
          SELECT prenom,
                 COALESCE(ville, 'Non renseignée') AS ville
          FROM clients;
        lines:
          - n: 2
            note: "Si `ville` est NULL, on affiche 'Non renseignée' ; sinon la ville elle-même. `AS ville` garde un nom clair."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis remplace `'Non renseignée'` par `'?'`."
        language: sql
        code: |
          SELECT prenom,
                 COALESCE(ville, 'Non renseignée') AS ville
          FROM clients;
      - type: question
        ref: sql-c2l3-q4
        review: code-coalesce
      - type: question
        ref: sqlq-null-3
        review: def-coalesce
      - type: text
        md: "Exercice guidé : complète la valeur par défaut."
      - type: exercise
        ref: sql-ex-coalesce-guide
      - type: text
        md: "En autonomie : les avis avec un commentaire par défaut."
      - type: exercise
        ref: sql-ex-avis-commentaire-defaut
      - type: quiz
        items:
          - ref: sql-c2-b2
            review: def-coalesce
          - ref: sql-c2l3-q2
            review: def-coalesce
          - ref: sql-p14-q5
            review: code-coalesce
    questions:
      - code: sql-c2l3-q4
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Complète pour afficher 'Aucun' au lieu de NULL dans la colonne `commentaire`."
        snippet: |
          SELECT note, ____(commentaire, 'Aucun') AS commentaire
          FROM avis;
        language: sql
        answers: ["COALESCE"]
        explanation: "`COALESCE(a, b)` renvoie `a` s'il n'est pas NULL, sinon `b`."
      - code: sqlq-null-3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: Que renvoie `COALESCE(NULL, NULL, 'inconnue')` ?
        choices:
          - label: "'inconnue'"
            correct: true
            why: 'Oui : la première valeur non NULL.'
          - label: 'NULL'
            correct: false
            why: COALESCE saute les NULL.
          - label: Une erreur
            correct: false
            why: C'est un usage normal.
        explanation: 'COALESCE renvoie la première valeur non NULL : pratique pour une valeur par défaut.'
      - code: sql-c2-b2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Que renvoie cette requête ?"
        snippet: |
          SELECT COALESCE(NULL, 'défaut', 'autre') AS valeur;
        language: sql
        choices:
          - label: "défaut"
            correct: true
            why: "C'est la première valeur non NULL."
          - label: "autre"
            correct: false
            why: "COALESCE s'arrête à la première valeur non NULL."
          - label: "NULL"
            correct: false
            why: "Il existe une valeur non NULL."
        explanation: "COALESCE lit ses valeurs de gauche à droite et s'arrête à la première non NULL."
      - code: sql-c2l3-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`SELECT COALESCE(ville, 'Inconnue') FROM clients;` remplace les NULL dans la table clients."
        choices:
          - label: "Vrai"
            correct: false
            why: "SELECT ne fait que lire : seul l'affichage change."
          - label: "Faux"
            correct: true
            why: "La table garde ses NULL ; COALESCE agit sur le résultat affiché."
        explanation: "Un SELECT ne modifie jamais la table."
      - code: sql-p14-q5
        kind: RESULTAT_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Awa habite à Lyon. Que s'affiche-t-il pour elle ?"
        snippet: |
          SELECT prenom, COALESCE(ville, 'Non renseignée') AS ville
          FROM clients;
        language: sql
        choices:
          - label: "Awa | Lyon"
            correct: true
            why: "Sa ville n'est pas NULL : COALESCE la renvoie telle quelle."
          - label: "Awa | Non renseignée"
            correct: false
            why: "Ce texte n'apparaît que pour les clients sans ville."
          - label: "Awa | NULL"
            correct: false
            why: "Sa ville est renseignée."
        explanation: "COALESCE ne remplace que les NULL."
    exercises:
      - slug: sql-ex-coalesce-guide
        kind: COMPLETER
        title: "Compléter la valeur par défaut"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour afficher « Non renseignée » à la place d'une ville vide."
        criteria: "Les deux trous sont corrects."
        hints:
          - "La fonction « valeur par défaut » : COALESCE."
          - "On nomme la colonne avec AS."
          - "COALESCE, AS."
        solution: '["COALESCE", "AS"]'
        explanation: "`COALESCE(ville, 'Non renseignée') AS ville`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT prenom,
                   [[1]](ville, 'Non renseignée') [[2]] ville
            FROM clients;
          blanks:
            - ["COALESCE"]
            - ["AS"]
      - slug: sql-ex-avis-commentaire-defaut
        kind: SQL
        title: "Un commentaire par défaut"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Affiche l'**id** et la **note** de chaque avis, et une colonne `commentaire` qui montre le
          commentaire, ou le texte `'Sans commentaire'` quand il est NULL.
        criteria: "3 colonnes (id, note, commentaire), les 26 avis, 'Sans commentaire' à la place de NULL."
        hints:
          - "Une valeur par défaut : COALESCE."
          - "`COALESCE(commentaire, 'Sans commentaire')`"
          - "N'oublie pas `AS commentaire`."
        solution: |
          SELECT id, note,
                 COALESCE(commentaire, 'Sans commentaire') AS commentaire
          FROM avis;
        explanation: "COALESCE affiche le commentaire, ou la valeur de secours s'il est NULL."
        xp: 10
        payload:
          mode: READ

  # ===================================================================== LEÇON 6
  - slug: sql-distinct-case-fonctions
    title: "Sans doublon : DISTINCT"
    duration: 8
    objective: "Supprimer les lignes en double d'un résultat avec DISTINCT."
    prerequisites: "Leçon « Remplacer une case vide : COALESCE »."
    skills: [sql-select]
    xp: 10
    memo: |
      - `SELECT DISTINCT ville` : chaque ville n'apparaît **qu'une fois**.
      - DISTINCT se place **juste après SELECT**.
      - Avec plusieurs colonnes, DISTINCT compare **toute la ligne**.
    commonMistakes: |
      - Croire que DISTINCT porte sur une seule colonne : il porte sur toute la ligne affichée.
      - Croire que DISTINCT supprime des lignes dans la table : il ne change que le résultat.
    blocks:
      - type: text
        md: |
          « Dans quelles villes avons-nous des clients ? » Avec `SELECT ville FROM clients`, Paris apparaît
          plusieurs fois. Pour une liste **sans doublon** : `DISTINCT`.
      - type: definition
        id: def-distinct
        term: "DISTINCT"
        md: |
          Une **liste de courses sans répétition** : même si trois personnes demandent du pain, « pain »
          n'est écrit qu'une fois.
      - type: code
        id: code-distinct
        language: sql
        title: "Les villes, chacune une fois"
        code: |
          SELECT DISTINCT ville
          FROM clients
          WHERE ville IS NOT NULL
          ORDER BY ville;
        lines:
          - n: 1
            note: "`DISTINCT` juste après SELECT : chaque ville une seule fois."
          - n: 3
            note: "On écarte les clients sans ville (vu à la leçon NULL)."
      - type: demo
        title: "Essaie"
        md: "Retire `DISTINCT` : les doublons reviennent."
        language: sql
        code: |
          SELECT DISTINCT ville
          FROM clients
          WHERE ville IS NOT NULL
          ORDER BY ville;
      - type: question
        ref: sqlq-case-1
        review: def-distinct
      - type: question
        ref: sql-c2l4-q3
        review: code-distinct
      - type: text
        md: "Exercice guidé : complète la requête."
      - type: exercise
        ref: sql-ex-distinct-guide
      - type: text
        md: "En autonomie : les statuts de commande."
      - type: exercise
        ref: sql-ex-statuts-distincts
      - type: quiz
        items:
          - ref: sql-c2l4-q4
            review: def-distinct
          - ref: sql-c2l4-q1
            review: code-distinct
          - ref: sql-p15-q5
            review: def-distinct
    questions:
      - code: sqlq-case-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: À quoi sert `DISTINCT` ?
        choices:
          - label: À supprimer les lignes en double du résultat
            correct: true
            why: Oui.
          - label: À supprimer les doublons dans la table
            correct: false
            why: SELECT ne modifie jamais la table.
          - label: À trier le résultat
            correct: false
            why: C'est ORDER BY.
        explanation: '`SELECT DISTINCT ville FROM clients` : chaque ville une seule fois.'
      - code: sql-c2l4-q3
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Complète pour afficher chaque poste des employés une seule fois."
        snippet: |
          SELECT ____ poste
          FROM employes;
        language: sql
        answers: ["DISTINCT"]
        explanation: "`DISTINCT` se place juste après SELECT."
      - code: sql-c2l4-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-select
        prompt: "Dans `SELECT DISTINCT ville, prenom FROM clients`, DISTINCT s'applique seulement à la colonne ville."
        choices:
          - label: "Vrai"
            correct: false
            why: "DISTINCT compare toutes les colonnes affichées."
          - label: "Faux"
            correct: true
            why: "Deux lignes ne sont fusionnées que si ville ET prenom sont identiques."
        explanation: "DISTINCT supprime les **lignes** en double, en comparant toutes les colonnes du SELECT."
      - code: sql-c2l4-q1
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Certains clients n'ont pas de ville. Que renvoie cette requête ?"
        snippet: |
          SELECT DISTINCT ville
          FROM clients;
        language: sql
        choices:
          - label: "Chaque ville une fois, plus une ligne NULL pour les clients sans ville"
            correct: true
            why: "DISTINCT regroupe tous les NULL en une seule ligne."
          - label: "Chaque ville une fois, sans ligne NULL"
            correct: false
            why: "Sans `IS NOT NULL`, la case vide apparaît une fois."
          - label: "Une ligne par client"
            correct: false
            why: "Ce serait le résultat sans DISTINCT."
        explanation: "Pour DISTINCT, tous les NULL comptent comme un seul. D'où le `WHERE ville IS NOT NULL` de l'exemple."
      - code: sql-p15-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Où se place DISTINCT ?"
        choices:
          - label: "Juste après SELECT"
            correct: true
            why: "`SELECT DISTINCT colonne …`"
          - label: "Après FROM"
            correct: false
            why: "Il se place avant les colonnes."
          - label: "À la fin de la requête"
            correct: false
            why: "La fin, c'est pour ORDER BY et LIMIT."
        explanation: "`SELECT DISTINCT ville FROM clients;`"
    exercises:
      - slug: sql-ex-distinct-guide
        kind: COMPLETER
        title: "Compléter DISTINCT"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour afficher, sans doublon, les villes des services, de A à Z."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Sans doublon : DISTINCT, juste après SELECT."
          - "De A à Z : un tri."
          - "DISTINCT, ORDER."
        solution: '["DISTINCT", "ORDER"]'
        explanation: "`SELECT DISTINCT ville FROM services ORDER BY ville;`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT [[1]] ville
            FROM services
            [[2]] BY ville;
          blanks:
            - ["DISTINCT"]
            - ["ORDER"]
      - slug: sql-ex-statuts-distincts
        kind: SQL
        title: "Les statuts de commande"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Affiche la liste des **statuts** utilisés dans la table `commandes`, **sans doublon**, rangés de A à Z.
        criteria: "1 colonne (statut), une ligne par statut, triée par ordre alphabétique."
        hints:
          - "Sans doublon : DISTINCT."
          - "De A à Z : ORDER BY statut."
          - "`SELECT DISTINCT statut FROM commandes ORDER BY statut;`"
        solution: |
          SELECT DISTINCT statut
          FROM commandes
          ORDER BY statut;
        explanation: "40 commandes, mais seulement 4 statuts différents : DISTINCT les montre chacun une fois."
        xp: 10
        payload:
          mode: READ
          ordered: true

  # ===================================================================== LEÇON 7
  - slug: sql-case
    title: "Des étiquettes selon une condition : CASE"
    duration: 10
    objective: "Afficher une valeur différente selon une condition, avec CASE WHEN … THEN … ELSE … END."
    prerequisites: "Leçon « Sans doublon : DISTINCT »."
    skills: [sql-select]
    xp: 12
    memo: |
      - `CASE WHEN condition THEN valeur ELSE autre END` : le « si… alors… sinon » de SQL.
      - Les WHEN sont lus **dans l'ordre** : la **première** condition vraie gagne.
      - Sans ELSE, les cas non prévus donnent NULL.
      - On termine toujours par `END`, puis on nomme la colonne avec `AS`.
    commonMistakes: |
      - Oublier `END`.
      - Mal ranger les WHEN : une condition large placée en premier « avale » les suivantes.
    blocks:
      - type: text
        md: |
          On veut afficher « En stock » ou « Rupture » plutôt qu'un simple nombre. `CASE` pose une
          **étiquette** selon une condition.
      - type: definition
        id: def-case
        term: "CASE"
        md: |
          Un **aiguillage** : « si le stock vaut 0, alors écris Rupture, sinon écris En stock ». Les
          conditions sont testées dans l'ordre ; la **première vraie** l'emporte.
      - type: code
        id: code-case
        language: sql
        title: "Disponible ou non ?"
        code: |
          SELECT nom, stock,
                 CASE
                   WHEN stock = 0 THEN 'Rupture'
                   ELSE 'En stock'
                 END AS disponibilite
          FROM produits;
        lines:
          - n: 2
            note: "Début de l'aiguillage."
          - n: 3
            note: "Si le stock vaut 0, l'étiquette est 'Rupture'."
          - n: 4
            note: "Tous les autres cas : 'En stock'."
          - n: 5
            note: "`END` ferme le CASE ; `AS disponibilite` nomme la colonne."
      - type: demo
        title: "Essaie"
        md: "Ajoute une ligne `WHEN stock < 10 THEN 'Presque épuisé'` juste après le premier WHEN."
        language: sql
        code: |
          SELECT nom, stock,
                 CASE
                   WHEN stock = 0 THEN 'Rupture'
                   ELSE 'En stock'
                 END AS disponibilite
          FROM produits;
      - type: question
        ref: sqlq-case-2
        review: def-case
      - type: question
        ref: sql-p16-q2
        review: code-case
      - type: text
        md: "Exercice guidé : complète l'aiguillage."
      - type: exercise
        ref: sql-ex-case-guide
      - type: text
        md: "En autonomie : trois niveaux de stock."
      - type: exercise
        ref: sql-ex-niveau-stock
      - type: quiz
        items:
          - ref: sql-c2l4-q2
            review: def-case
          - ref: sql-c2-b9
            review: def-case
          - ref: sql-p16-q5
            review: code-case
    questions:
      - code: sqlq-case-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: Dans un CASE, que se passe-t-il si aucune condition WHEN n'est vraie et qu'il n'y a pas de ELSE ?
        choices:
          - label: La valeur est NULL
            correct: true
            why: Oui.
          - label: Une erreur est levée
            correct: false
            why: 'Aucune erreur : le résultat est NULL.'
          - label: La ligne est supprimée du résultat
            correct: false
            why: La ligne reste, avec NULL.
        explanation: Pense au ELSE pour couvrir tous les cas.
      - code: sql-p16-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quel mot ferme obligatoirement un CASE ?"
        choices:
          - label: "`END`"
            correct: true
            why: "`CASE … END`, comme une parenthèse qu'on ferme."
          - label: "`STOP`"
            correct: false
            why: "Ce mot n'existe pas en SQL."
          - label: "`ELSE`"
            correct: false
            why: "ELSE est facultatif ; END est obligatoire."
        explanation: "`CASE WHEN … THEN … ELSE … END AS nom`"
      - code: sql-c2l4-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Pour un produit dont le stock vaut **5**, que vaut la colonne `niveau` ?"
        snippet: |
          CASE
            WHEN stock < 50 THEN 'Moyen'
            WHEN stock < 10 THEN 'Faible'
            ELSE 'Élevé'
          END AS niveau
        language: sql
        choices:
          - label: "Moyen"
            correct: true
            why: "5 < 50 est vrai dès la première condition : le CASE s'arrête là."
          - label: "Faible"
            correct: false
            why: "Cette ligne n'est jamais atteinte pour 5, la première condition est déjà vraie."
          - label: "Élevé"
            correct: false
            why: "ELSE ne sert que si aucune condition n'est vraie."
        explanation: "Les WHEN sont testés **dans l'ordre**. Range-les du plus précis au plus large."
      - code: sql-c2-b9
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Le produit d'id 3 a un stock de 0. Que renvoie cette requête ?"
        snippet: |
          SELECT CASE WHEN stock > 0 THEN 'Disponible' END AS dispo
          FROM produits WHERE id = 3;
        language: sql
        choices:
          - label: "NULL"
            correct: true
            why: "Aucun WHEN n'est vrai et il n'y a pas de ELSE."
          - label: "'Disponible'"
            correct: false
            why: "0 n'est pas plus grand que 0."
          - label: "Une erreur, car le ELSE est obligatoire"
            correct: false
            why: "ELSE est facultatif ; sans lui, on obtient NULL."
        explanation: "Écris toujours un ELSE, par exemple 'Indisponible'."
      - code: sql-p16-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "Dans l'exemple de la leçon, un produit avec un stock de 12 reçoit l'étiquette 'En stock'."
        choices:
          - label: "Vrai"
            correct: true
            why: "12 ne vaut pas 0 : c'est le ELSE qui s'applique."
          - label: "Faux"
            correct: false
            why: "Seul un stock de 0 donne 'Rupture'."
        explanation: "Le ELSE couvre tous les cas non prévus par les WHEN."
    exercises:
      - slug: sql-ex-case-guide
        kind: COMPLETER
        title: "Compléter l'aiguillage"
        difficulty: FACILE
        skill: sql-select
        statement: "Complète pour afficher « Annulée » pour les commandes annulées, et « Active » pour les autres."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Structure : CASE WHEN … THEN … ELSE … END."
          - "Le « sinon » s'écrit ELSE."
          - "WHEN, THEN, ELSE, END."
        solution: '["WHEN", "THEN", "ELSE", "END"]'
        explanation: "`CASE WHEN statut = 'ANNULEE' THEN 'Annulée' ELSE 'Active' END AS etat`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT id,
                   CASE
                     [[1]] statut = 'ANNULEE' [[2]] 'Annulée'
                     [[3]] 'Active'
                   [[4]] AS etat
            FROM commandes;
          blanks:
            - ["WHEN"]
            - ["THEN"]
            - ["ELSE"]
            - ["END"]
      - slug: sql-ex-niveau-stock
        kind: SQL
        title: "Niveau de stock"
        difficulty: INTERMEDIAIRE
        skill: sql-select
        statement: |
          Affiche le **nom**, le **stock** et une colonne `niveau` qui vaut :
          - `'Rupture'` si le stock vaut 0 ;
          - `'Faible'` si le stock est plus petit que 10 ;
          - `'Correct'` sinon.

          Range le résultat par stock (du plus petit au plus grand), puis par nom.
        criteria: "3 colonnes (nom, stock, niveau), les 30 produits, tri par stock puis nom."
        hints:
          - "Un CASE avec deux WHEN et un ELSE."
          - "L'ordre des WHEN compte : teste d'abord `stock = 0`, ensuite `stock < 10`."
          - "`CASE WHEN stock = 0 THEN 'Rupture' WHEN stock < 10 THEN 'Faible' ELSE 'Correct' END AS niveau`"
        solution: |
          SELECT nom, stock,
                 CASE
                   WHEN stock = 0 THEN 'Rupture'
                   WHEN stock < 10 THEN 'Faible'
                   ELSE 'Correct'
                 END AS niveau
          FROM produits
          ORDER BY stock, nom;
        explanation: |
          Le CASE teste les conditions dans l'ordre. Si l'on testait d'abord `stock < 10`, les produits en
          rupture seraient classés « Faible », car 0 est plus petit que 10.
        xp: 20
        payload:
          mode: READ
          ordered: true

bank:
  - code: sql-c2-b3
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-select
    prompt: "Tu veux les clients qui n'habitent **pas** à Paris, y compris ceux sans ville. Quelle condition choisir ?"
    choices:
      - label: "`WHERE ville <> 'Paris' OR ville IS NULL`"
        correct: true
        why: "La seconde partie récupère les clients sans ville, écartés par le <>."
      - label: "`WHERE ville <> 'Paris'`"
        correct: false
        why: "Les clients sans ville sont écartés."
      - label: "`WHERE NOT ville = 'Paris'`"
        correct: false
        why: "Même problème : les NULL restent écartés."
    explanation: "Quand une colonne peut être NULL, demande-toi si ces lignes doivent être gardées."
  - code: sql-c2-b6
    kind: RESULTAT_CODE
    difficulty: 2
    skill: sql-select
    prompt: "Que renvoie cette requête ?"
    snippet: |
      SELECT UPPER('cda') || ' ' || LOWER('ACADEMY') AS titre;
    language: sql
    choices:
      - label: "CDA academy"
        correct: true
        why: "UPPER met « cda » en majuscules, LOWER met « ACADEMY » en minuscules, et `||` colle le tout."
      - label: "cda ACADEMY"
        correct: false
        why: "Les deux fonctions transforment les textes avant de les coller."
      - label: "CDAacademy"
        correct: false
        why: "Le morceau `' '` ajoute bien un espace."
    explanation: "UPPER et LOWER changent les majuscules ; `||` colle deux textes."
  - code: sql-c2-b8
    kind: CHOIX_MULTIPLE
    difficulty: 2
    skill: sql-select
    prompt: "Quelles conditions renvoient exactement les produits des catégories 1 et 2 ? (plusieurs réponses)"
    choices:
      - label: "`categorie_id IN (1, 2)`"
        correct: true
        why: "La liste des deux valeurs."
      - label: "`categorie_id = 1 OR categorie_id = 2`"
        correct: true
        why: "La forme longue de IN."
      - label: "`categorie_id BETWEEN 1 AND 2`"
        correct: true
        why: "Entre 1 et 2 inclus, il n'y a que 1 et 2 pour des numéros entiers."
      - label: "`categorie_id = 1 AND categorie_id = 2`"
        correct: false
        why: "Un produit n'a pas deux catégories à la fois : aucun résultat."
    explanation: "Plusieurs écritures peuvent être équivalentes ; choisis la plus lisible (ici `IN`)."
  - code: sql-c2-b10
    kind: CHOIX_UNIQUE
    difficulty: 3
    skill: sql-select
    prompt: "Pourquoi `WHERE categorie_id NOT IN (1, NULL)` ne renvoie-t-il aucune ligne ?"
    choices:
      - label: "Parce qu'une comparaison avec NULL n'est jamais vraie, donc la condition ne l'est jamais"
        correct: true
        why: "NOT IN (1, NULL) revient à « différent de 1 ET différent de NULL » ; la seconde partie n'est jamais vraie."
      - label: "Parce que NOT IN est interdit avec des nombres"
        correct: false
        why: "NOT IN fonctionne avec tous les types."
      - label: "Parce que la catégorie 1 n'existe pas"
        correct: false
        why: "Elle existe (Livres), et ce n'est pas la cause."
    explanation: "Piège célèbre : un NULL dans une liste NOT IN vide le résultat."
  - code: sqlq-case-3
    kind: CHOIX_UNIQUE
    difficulty: 1
    skill: sql-select
    prompt: Quelle fonction met un texte en majuscules ?
    choices:
      - label: '`UPPER(nom)`'
        correct: true
        why: Oui.
      - label: '`LOWER(nom)`'
        correct: false
        why: LOWER met en minuscules.
      - label: '`COALESCE(nom)`'
        correct: false
        why: COALESCE remplace une case vide.
    explanation: 'UPPER (majuscules) et LOWER (minuscules), vues au chapitre 1.'
  - code: sql-c2-b13
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-select
    prompt: "Quelle requête affiche les villes des clients sans doublon ni case vide ?"
    choices:
      - label: "`SELECT DISTINCT ville FROM clients WHERE ville IS NOT NULL;`"
        correct: true
        why: "DISTINCT enlève les doublons, IS NOT NULL les cases vides."
      - label: "`SELECT ville FROM clients WHERE ville IS NOT NULL;`"
        correct: false
        why: "Sans DISTINCT, chaque ville apparaît autant de fois qu'elle a de clients."
      - label: "`SELECT DISTINCT ville FROM clients WHERE ville <> NULL;`"
        correct: false
        why: "`<> NULL` n'est jamais vrai : aucune ligne."
    explanation: "Deux notions du chapitre réunies : DISTINCT et IS NOT NULL."
