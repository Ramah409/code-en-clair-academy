slug: sous-requetes
position: 6
level: AVANCE
title: "Sous-requêtes, CTE et fonctions de fenêtrage"
summary: "Imbriquer des requêtes, tester l'existence de lignes liées, structurer une requête complexe avec WITH et calculer des classements avec les fonctions de fenêtrage."
quizQuestionCount: 15

lessons:
  # ===================================================================== LEÇON 1
  - slug: sql-sous-requetes
    title: "Sous-requêtes dans WHERE"
    duration: 12
    objective: "Utiliser le résultat d'une requête comme valeur (sous-requête scalaire) ou comme liste (IN)."
    prerequisites: "Agrégation et jointures."
    skills: [sql-agregation]
    xp: 15
    memo: |
      - Une **sous-requête** est une requête entre parenthèses, utilisée dans une autre.
      - **Scalaire** (une seule valeur) : `WHERE prix > (SELECT AVG(prix) FROM produits)`.
      - **Liste** : `WHERE id IN (SELECT client_id FROM avis)`.
      - Une sous-requête **corrélée** utilise une colonne de la requête principale : elle est réévaluée pour chaque ligne.
    commonMistakes: |
      - Utiliser `=` avec une sous-requête qui renvoie plusieurs lignes → erreur « more than one row returned ».
      - Oublier les parenthèses autour de la sous-requête.
      - Écrire `WHERE prix > AVG(prix)` : un agrégat ne peut pas être utilisé directement dans WHERE.
    blocks:
      - type: text
        md: |
          « Quels produits coûtent **plus cher que la moyenne** ? » Deux étapes : calculer la moyenne, puis
          filtrer. En SQL, on peut les écrire en **une seule requête** en imbriquant la première dans la seconde.
      - type: code
        language: sql
        title: "Plus cher que la moyenne"
        code: |
          SELECT nom, prix
          FROM produits
          WHERE prix > (SELECT AVG(prix) FROM produits)
          ORDER BY prix DESC;
        lines:
          - n: 3
            note: "La sous-requête entre parenthèses est exécutée : elle renvoie **une seule valeur** (43,62). La condition devient `prix > 43.62`."
      - type: demo
        title: "Démonstration"
        md: "Exécute d'abord la sous-requête seule (`SELECT AVG(prix) FROM produits`) pour voir la valeur utilisée, puis la requête complète."
        language: sql
        code: |
          SELECT nom, prix
          FROM produits
          WHERE prix > (SELECT AVG(prix) FROM produits)
          ORDER BY prix DESC;
      - type: question
        ref: sql-c5l1-q1
      - type: code
        language: sql
        title: "Sous-requête qui renvoie une liste : IN"
        code: |
          SELECT prenom, nom
          FROM clients
          WHERE id IN (SELECT client_id FROM avis);
        lines:
          - n: 3
            note: "La sous-requête renvoie la liste des clients ayant laissé un avis ; IN garde les clients qui en font partie."
      - type: definition
        id: def-sous-requete-correlee
        term: "Sous-requête corrélée"
        md: |
          Sous-requête qui **fait référence à la ligne en cours** de la requête principale. Elle est
          (logiquement) exécutée une fois par ligne. Exemple : le produit le plus cher **de sa propre catégorie**.
      - type: code
        language: sql
        title: "Le produit le plus cher de chaque catégorie"
        code: |
          SELECT p.nom, p.categorie_id, p.prix
          FROM produits p
          WHERE p.prix = (SELECT MAX(p2.prix)
                          FROM produits p2
                          WHERE p2.categorie_id = p.categorie_id)
          ORDER BY p.categorie_id;
        lines:
          - n: 3
            note: "Pour chaque produit p, on compare son prix au maximum…"
          - n: 5
            note: "…des produits **de la même catégorie que p** : c'est la corrélation (p2 dépend de p)."
      - type: question
        ref: sql-c5l1-q2
      - type: question
        ref: sql-c5l1-q3
      - type: exercise
        ref: sql-ex-salaire-superieur-moyenne
      - type: question
        ref: sql-c5l1-q4
      - type: quiz
        items:
          - ref: sqlq-sub-1
          - ref: sqlq-sub-2
            review: def-sous-requete-correlee
          - ref: sqlq-sub-3
    questions:
      - code: sql-c5l1-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: "Pourquoi écrire `WHERE prix > (SELECT AVG(prix) FROM produits)` plutôt que `WHERE prix > AVG(prix)` ?"
        choices:
          - label: "Parce qu'un agrégat ne peut pas être utilisé directement dans WHERE"
            correct: true
            why: "WHERE est évalué ligne par ligne, avant tout calcul d'agrégat ; la sous-requête calcule la moyenne à part."
          - label: "Parce que la sous-requête est plus rapide"
            correct: false
            why: "La vraie raison est l'interdiction des agrégats dans WHERE."
          - label: "Les deux écritures sont équivalentes"
            correct: false
            why: "La seconde provoque une erreur."
        explanation: "La sous-requête scalaire permet de comparer chaque ligne à une valeur calculée sur l'ensemble de la table."
      - code: sql-c5l1-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-agregation
        prompt: "Que se passe-t-il à l'exécution ?"
        snippet: |
          SELECT nom FROM produits
          WHERE categorie_id = (SELECT id FROM categories WHERE nom LIKE 'J%');
        language: sql
        choices:
          - label: "Erreur : la sous-requête renvoie plusieurs lignes (Jeux et Jardin)"
            correct: true
            why: "Avec `=`, la sous-requête doit renvoyer une seule valeur."
          - label: "Elle renvoie les produits des catégories Jeux et Jardin"
            correct: false
            why: "Il faudrait `IN` au lieu de `=`."
          - label: "Elle ne renvoie aucune ligne"
            correct: false
            why: "La requête ne va pas jusqu'au bout : elle échoue."
        explanation: "`=` attend une seule valeur, `IN` accepte une liste. Utilise IN dès qu'une sous-requête peut renvoyer plusieurs lignes."
      - code: sql-c5l1-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-agregation
        prompt: "Une sous-requête corrélée fait référence à une colonne de la requête principale."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est la définition : elle dépend de la ligne en cours."
          - label: "Faux"
            correct: false
            why: "Une sous-requête indépendante n'est pas corrélée ; une corrélée l'est par définition."
        explanation: "Exemple : `WHERE p2.categorie_id = p.categorie_id`, où p vient de la requête principale."
      - code: sql-c5l1-q4
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-agregation
        prompt: "Complète pour afficher les produits qui ont **déjà été commandés**."
        snippet: |
          SELECT nom FROM produits
          WHERE id ____ (SELECT produit_id FROM lignes_commande);
        language: sql
        answers: ["IN"]
        explanation: "La sous-requête renvoie la liste des produits commandés ; IN teste l'appartenance à cette liste."
      - code: sqlq-sub-1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: Une sous-requête utilisée avec `=` doit renvoyer…
        choices:
          - label: une seule valeur (une ligne, une colonne)
            correct: true
            why: 'Oui : sinon PostgreSQL lève une erreur.'
          - label: plusieurs lignes
            correct: false
            why: Pour plusieurs lignes, on utilise IN.
          - label: une table entière
            correct: false
            why: Une table se place dans FROM.
        explanation: '`=` attend une valeur ; `IN` accepte une liste.'
      - code: sqlq-sub-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: Pourquoi une sous-requête corrélée est-elle souvent plus lente ?
        choices:
          - label: Elle est réévaluée pour chaque ligne de la requête principale
            correct: true
            why: 'Oui : elle dépend de la ligne courante.'
          - label: Elle ne peut pas utiliser d'index
            correct: false
            why: Elle peut utiliser des index.
          - label: Elle est toujours interdite en PostgreSQL
            correct: false
            why: Elle est autorisée et utile.
        explanation: Corrélée = qui fait référence à la ligne en cours de la requête principale.
      - code: sqlq-sub-3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-agregation
        prompt: On peut placer une sous-requête dans FROM, à condition de lui donner un alias.
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : `FROM (SELECT ...) AS t`.'
          - label: Faux
            correct: false
            why: C'est autorisé (table dérivée).
        explanation: Sous-requête dans FROM = table temporaire ; dans WHERE = filtre ; dans SELECT = valeur calculée.
    exercises:
      - slug: sql-ex-salaire-superieur-moyenne
        kind: SQL
        title: "Salaires au-dessus de la moyenne de leur service"
        difficulty: DIFFICILE
        skill: sql-agregation
        statement: |
          Affiche le **prénom**, le **nom**, le **service_id** et le **salaire** des employés qui gagnent
          **plus que la moyenne de leur propre service**, triés par service puis par salaire décroissant.
        criteria: "4 colonnes, uniquement les employés au-dessus de la moyenne de leur service, tri par service puis salaire décroissant."
        hints:
          - "Il faut comparer le salaire de chaque employé à une moyenne qui dépend de son service : sous-requête corrélée."
          - "Dans la sous-requête : `SELECT AVG(e2.salaire) FROM employes e2 WHERE e2.service_id = e.service_id`."
          - "`WHERE e.salaire > (SELECT AVG(e2.salaire) FROM employes e2 WHERE e2.service_id = e.service_id) ORDER BY e.service_id, e.salaire DESC`"
        solution: |
          SELECT e.prenom, e.nom, e.service_id, e.salaire
          FROM employes e
          WHERE e.salaire > (SELECT AVG(e2.salaire)
                             FROM employes e2
                             WHERE e2.service_id = e.service_id)
          ORDER BY e.service_id, e.salaire DESC;
        explanation: |
          Pour chaque employé `e`, la sous-requête calcule la moyenne des salaires **de son service**. Le
          consultant sans service est écarté : sa sous-requête compare avec `service_id = NULL`, qui ne
          renvoie aucune ligne, donc une moyenne NULL.
        xp: 25
        payload:
          mode: READ
          ordered: true

  # ===================================================================== LEÇON 2
  - slug: sql-exists
    title: "EXISTS et NOT EXISTS"
    duration: 10
    objective: "Tester l'existence de lignes liées et préférer NOT EXISTS à NOT IN."
    prerequisites: "Sous-requêtes corrélées."
    skills: [sql-agregation, sql-jointures]
    xp: 15
    memo: |
      - `EXISTS (sous-requête)` est vrai si la sous-requête renvoie **au moins une ligne**.
      - La sous-requête est presque toujours **corrélée** ; ce qu'elle sélectionne n'a pas d'importance (`SELECT 1`).
      - `NOT EXISTS` est la forme la plus sûre pour « ceux qui n'ont pas de… » : pas de piège avec les NULL.
    commonMistakes: |
      - Oublier la corrélation : `EXISTS (SELECT 1 FROM avis)` est vrai pour toutes les lignes dès que la table avis n'est pas vide.
      - Utiliser `NOT IN` avec une sous-requête pouvant contenir des NULL (résultat vide).
    blocks:
      - type: text
        md: |
          Pour savoir si un produit a reçu **au moins un avis**, on n'a pas besoin de compter les avis : il
          suffit de savoir s'il **en existe un**. C'est exactement ce que fait `EXISTS`.
      - type: code
        language: sql
        title: "Les produits jamais notés"
        code: |
          SELECT p.nom
          FROM produits p
          WHERE NOT EXISTS (
            SELECT 1
            FROM avis a
            WHERE a.produit_id = p.id
          )
          ORDER BY p.nom;
        lines:
          - n: 3
            note: "NOT EXISTS est vrai quand la sous-requête ne renvoie **aucune** ligne."
          - n: 4
            note: "`SELECT 1` : la valeur renvoyée n'a pas d'importance, seule compte l'existence d'une ligne."
          - n: 6
            note: "Corrélation : les avis **de ce produit-là**."
      - type: demo
        title: "Démonstration"
        md: "Remplace `NOT EXISTS` par `EXISTS` pour obtenir les produits qui ont au moins un avis."
        language: sql
        code: |
          SELECT p.nom
          FROM produits p
          WHERE NOT EXISTS (
            SELECT 1
            FROM avis a
            WHERE a.produit_id = p.id
          )
          ORDER BY p.nom;
      - type: question
        ref: sql-c5l2-q1
      - type: callout
        variant: exam
        title: "Question fréquente du jury"
        md: |
          « Pourquoi préférer NOT EXISTS à NOT IN ? » Parce que si la sous-requête de NOT IN renvoie un seul
          NULL, la condition n'est **jamais vraie** et le résultat est vide. NOT EXISTS ne compare pas de
          valeurs : il n'a pas ce problème. Il est aussi très bien optimisé par PostgreSQL (anti-jointure).
      - type: question
        ref: sql-c5l2-q2
      - type: question
        ref: sql-c5l2-q3
      - type: exercise
        ref: sql-ex-clients-sans-avis
      - type: quiz
        items:
          - ref: sqlq-exists-1
          - ref: sqlq-exists-2
          - ref: sqlq-exists-3
    questions:
      - code: sql-c5l2-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: "Quand `EXISTS (sous-requête)` est-il vrai ?"
        choices:
          - label: "Quand la sous-requête renvoie au moins une ligne"
            correct: true
            why: "EXISTS ne regarde que la présence de lignes, pas leurs valeurs."
          - label: "Quand la sous-requête renvoie une valeur non NULL"
            correct: false
            why: "Même une ligne contenant NULL rend EXISTS vrai."
          - label: "Quand la sous-requête renvoie exactement une ligne"
            correct: false
            why: "Une ou plusieurs lignes : EXISTS est vrai."
        explanation: "EXISTS s'arrête dès la première ligne trouvée : c'est efficace pour des tests de présence."
      - code: sql-c5l2-q2
        kind: VRAI_FAUX
        difficulty: 3
        skill: sql-agregation
        prompt: "`WHERE id NOT IN (SELECT manager_id FROM employes)` renvoie les employés qui ne managent personne."
        choices:
          - label: "Vrai"
            correct: false
            why: "La colonne manager_id contient un NULL (la directrice) : NOT IN renvoie alors un résultat vide."
          - label: "Faux"
            correct: true
            why: "Le NULL de la liste rend chaque comparaison « inconnue »."
        explanation: "Solutions : ajouter `WHERE manager_id IS NOT NULL` dans la sous-requête, ou mieux, utiliser NOT EXISTS."
      - code: sql-c5l2-q3
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-agregation
        prompt: "Complète pour afficher les catégories qui contiennent au moins un produit en rupture de stock."
        snippet: |
          SELECT c.nom FROM categories c
          WHERE ____ (SELECT 1 FROM produits p
                      WHERE p.categorie_id = c.id AND p.stock = 0);
        language: sql
        answers: ["EXISTS"]
        explanation: "EXISTS avec une sous-requête corrélée : pour chaque catégorie, existe-t-il un produit à stock nul ?"
      - code: sqlq-exists-1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: Que teste `NOT EXISTS (SELECT 1 FROM avis a WHERE a.produit_id = p.id)` ?
        choices:
          - label: Que le produit p n'a aucun avis
            correct: true
            why: Oui.
          - label: Que la table avis est vide
            correct: false
            why: La condition dépend du produit p (corrélée).
          - label: Que le produit a exactement un avis
            correct: false
            why: EXISTS teste l'existence, pas un nombre précis.
        explanation: 'EXISTS / NOT EXISTS : « existe-t-il au moins une ligne qui… ? »'
      - code: sqlq-exists-2
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: sql-agregation
        prompt: Pourquoi préférer NOT EXISTS à NOT IN quand la sous-requête peut contenir NULL ?
        choices:
          - label: Parce que NOT IN renvoie alors zéro ligne
            correct: true
            why: 'Oui : une comparaison avec NULL rend tout le NOT IN « inconnu ».'
          - label: Parce que NOT IN est interdit
            correct: false
            why: NOT IN est permis, mais piégeux avec NULL.
          - label: Il n'y a aucune différence
            correct: false
            why: La présence d'un NULL change tout.
        explanation: NOT EXISTS n'est pas piégé par les NULL.
      - code: sqlq-exists-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-agregation
        prompt: Dans une sous-requête EXISTS, on écrit souvent `SELECT 1` car seules les lignes comptent, pas leurs colonnes.
        choices:
          - label: Vrai
            correct: true
            why: "Oui : EXISTS ne regarde que s'il y a au moins une ligne."
          - label: Faux
            correct: false
            why: Les colonnes renvoyées ne sont pas utilisées par EXISTS.
        explanation: "`SELECT 1` rend l'intention claire : on teste l'existence."
    exercises:
      - slug: sql-ex-clients-sans-avis
        kind: SQL
        title: "Clients ayant commandé mais jamais noté"
        difficulty: DIFFICILE
        skill: sql-jointures
        statement: |
          Le service marketing veut solliciter un avis auprès des clients qui ont **au moins une commande
          livrée** mais **n'ont jamais laissé d'avis**. Affiche leur **prénom**, **nom** et **email**, triés par nom.
        criteria: "3 colonnes ; clients avec au moins une commande LIVREE et aucun avis ; tri par nom."
        hints:
          - "Deux conditions d'existence : EXISTS pour les commandes livrées, NOT EXISTS pour les avis."
          - "Chaque sous-requête est corrélée sur `client_id = cl.id`."
          - "`WHERE EXISTS (SELECT 1 FROM commandes co WHERE co.client_id = cl.id AND co.statut = 'LIVREE') AND NOT EXISTS (SELECT 1 FROM avis a WHERE a.client_id = cl.id)`"
        solution: |
          SELECT cl.prenom, cl.nom, cl.email
          FROM clients cl
          WHERE EXISTS (SELECT 1 FROM commandes co
                        WHERE co.client_id = cl.id AND co.statut = 'LIVREE')
            AND NOT EXISTS (SELECT 1 FROM avis a
                            WHERE a.client_id = cl.id)
          ORDER BY cl.nom;
        explanation: |
          EXISTS et NOT EXISTS expriment directement la règle métier, sans risque de doublons (contrairement à
          une jointure avec commandes, qui produirait une ligne par commande).
        xp: 25
        payload:
          mode: READ
          ordered: true

  # ===================================================================== LEÇON 3
  - slug: sql-cte-fenetrage
    title: "Découper en étapes : WITH (CTE)"
    duration: 10
    objective: "Nommer une étape intermédiaire avec WITH, puis la lire comme une table."
    prerequisites: "Leçon « EXISTS et NOT EXISTS »."
    skills: [sql-avance]
    xp: 15
    memo: |
      - `WITH nom AS (requête)` crée une **étape nommée** (une CTE).
      - La requête qui suit lit cette étape **comme une table** : `FROM nom`.
      - La CTE n'existe que le temps de la requête : rien n'est enregistré dans la base.
    commonMistakes: |
      - Oublier les parenthèses autour de la requête de la CTE.
      - Mettre un point-virgule entre la CTE et la requête principale : c'est une seule requête.
    blocks:
      - type: text
        md: |
          Quand une requête devient longue, on a envie de la **découper en étapes**, comme une recette :
          « d'abord préparer la pâte, ensuite la garnir ». La clause `WITH` fait exactement ça.
      - type: definition
        id: def-cte
        term: "CTE (WITH)"
        md: |
          Un **brouillon nommé** : tu prépares un résultat intermédiaire, tu lui donnes un nom, puis tu
          t'en sers juste après comme d'une table.
      - type: code
        id: code-cte
        language: sql
        title: "Étape 1 : les commandes de chaque client ; étape 2 : les clients fidèles"
        code: |
          WITH commandes_par_client AS (
            SELECT client_id, COUNT(*) AS nb
            FROM commandes
            GROUP BY client_id
          )
          SELECT client_id, nb
          FROM commandes_par_client
          WHERE nb >= 3
          ORDER BY nb DESC, client_id;
        lines:
          - n: 1
            note: "On nomme l'étape intermédiaire `commandes_par_client`."
          - n: 2
            note: "Elle compte les commandes de chaque client (GROUP BY, déjà vu)."
          - n: 6
            note: "La requête principale lit l'étape comme une table ordinaire."
          - n: 8
            note: "Comme `nb` est une vraie colonne de l'étape, on peut la filtrer avec WHERE."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis remplace `nb >= 3` par `nb = 1` : les clients qui n'ont commandé qu'une fois."
        language: sql
        code: |
          WITH commandes_par_client AS (
            SELECT client_id, COUNT(*) AS nb
            FROM commandes
            GROUP BY client_id
          )
          SELECT client_id, nb
          FROM commandes_par_client
          WHERE nb >= 3
          ORDER BY nb DESC, client_id;
      - type: question
        ref: sql-c5l3-q1
        review: def-cte
      - type: question
        ref: sqlq-cte-1
        review: code-cte
      - type: text
        md: "Exercice guidé : complète la CTE."
      - type: exercise
        ref: sql-ex-cte-guide
      - type: text
        md: "En autonomie : les catégories bien remplies."
      - type: exercise
        ref: sql-ex-cte-categories
      - type: quiz
        items:
          - ref: sql-c5-b3
            review: def-cte
          - ref: sql-p20-q4
            review: code-cte
          - ref: sql-p20-q5
            review: def-cte
    questions:
      - code: sql-c5l3-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Quel est le principal intérêt d'une CTE (`WITH ... AS`) ?"
        choices:
          - label: "Découper une requête longue en étapes nommées"
            correct: true
            why: "Elle rend la requête plus lisible."
          - label: "Créer une table permanente dans la base"
            correct: false
            why: "La CTE n'existe que pendant la requête."
          - label: "Rendre la requête toujours plus rapide"
            correct: false
            why: "Son intérêt principal est la lisibilité."
        explanation: "Une CTE est une étape nommée, placée avant la requête principale."
      - code: sqlq-cte-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-avance
        prompt: Comment commence une CTE ?
        choices:
          - label: '`WITH nom AS ( SELECT ... )`'
            correct: true
            why: Oui.
          - label: '`CREATE CTE nom`'
            correct: false
            why: Cette syntaxe n'existe pas.
          - label: '`SELECT ... INTO nom`'
            correct: false
            why: Ce n'est pas une CTE.
        explanation: "`WITH`, le nom, `AS`, puis la requête entre parenthèses."
      - code: sql-c5-b3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-avance
        prompt: "Une CTE définie avec `WITH` n'existe que pendant la requête qui la suit."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est un brouillon, jeté après la requête."
          - label: "Faux"
            correct: false
            why: "Rien n'est enregistré dans la base."
        explanation: "Pour enregistrer une requête réutilisable, on utilisera une vue (chapitre 8)."
      - code: sql-p20-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-avance
        prompt: "Dans l'exemple de la leçon, la requête principale lit `commandes_par_client` comme une table."
        choices:
          - label: "Vrai"
            correct: true
            why: "`FROM commandes_par_client`, exactement comme une table."
          - label: "Faux"
            correct: false
            why: "C'est tout l'intérêt de nommer l'étape."
        explanation: "Une CTE se lit avec FROM, comme une table."
      - code: sql-p20-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Pourquoi peut-on écrire `WHERE nb >= 3` dans la requête principale de l'exemple ?"
        choices:
          - label: "Parce que `nb` est une colonne de l'étape `commandes_par_client`"
            correct: true
            why: "Le comptage est déjà fait dans l'étape : `nb` y est une colonne comme une autre."
          - label: "Parce que WHERE accepte toujours COUNT(*)"
            correct: false
            why: "Non : sans étape, il faudrait HAVING."
          - label: "Parce que WITH remplace GROUP BY"
            correct: false
            why: "La CTE contient justement un GROUP BY."
        explanation: "La CTE transforme un résultat en table : on filtre ensuite ses colonnes avec WHERE."
    exercises:
      - slug: sql-ex-cte-guide
        kind: COMPLETER
        title: "Compléter la CTE"
        difficulty: FACILE
        skill: sql-avance
        statement: "Complète pour nommer l'étape `clients_lyon`, puis la lire."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une CTE commence par WITH."
          - "Après le nom : AS, puis la requête entre parenthèses."
          - "WITH, AS, clients_lyon."
        solution: '["WITH", "AS", "clients_lyon"]'
        explanation: "`WITH clients_lyon AS (...) SELECT ... FROM clients_lyon;`"
        xp: 10
        payload:
          language: sql
          template: |
            [[1]] clients_lyon [[2]] (
              SELECT prenom, nom
              FROM clients
              WHERE ville = 'Lyon'
            )
            SELECT prenom, nom
            FROM [[3]];
          blanks:
            - ["WITH"]
            - ["AS"]
            - ["clients_lyon"]
      - slug: sql-ex-cte-categories
        kind: SQL
        title: "Les catégories bien remplies"
        difficulty: INTERMEDIAIRE
        skill: sql-avance
        statement: |
          Avec une CTE nommée `produits_par_categorie` qui compte les produits de chaque **categorie_id**
          (colonne `nb`), affiche les catégories qui ont **au moins 4 produits**, rangées par categorie_id.
        criteria: "2 colonnes (categorie_id, nb), uniquement les catégories d'au moins 4 produits, triées par categorie_id."
        hints:
          - "Dans la CTE : `SELECT categorie_id, COUNT(*) AS nb FROM produits GROUP BY categorie_id`."
          - "Dans la requête principale : `FROM produits_par_categorie WHERE nb >= 4`."
          - "N'oublie pas `ORDER BY categorie_id`."
        solution: |
          WITH produits_par_categorie AS (
            SELECT categorie_id, COUNT(*) AS nb
            FROM produits
            GROUP BY categorie_id
          )
          SELECT categorie_id, nb
          FROM produits_par_categorie
          WHERE nb >= 4
          ORDER BY categorie_id;
        explanation: "La CTE compte, la requête principale filtre : deux étapes lisibles."
        xp: 20
        payload:
          mode: READ
          ordered: true
          requiredKeywords:
            - pattern: "\\bwith\\b"
              message: "Utilise une CTE (WITH produits_par_categorie AS (...))."

  # ===================================================================== LEÇON 4
  - slug: sql-fenetrage
    title: "Classer sans regrouper : les fonctions de fenêtrage"
    duration: 12
    objective: "Numéroter ou classer des lignes avec ROW_NUMBER, RANK et OVER, sans les regrouper."
    prerequisites: "Leçon « Découper en étapes : WITH (CTE) »."
    skills: [sql-avance]
    xp: 15
    memo: |
      - `ROW_NUMBER() OVER (ORDER BY prix DESC)` numérote les lignes 1, 2, 3… du plus cher au moins cher.
      - `RANK()` donne le même rang aux ex æquo.
      - `PARTITION BY categorie_id` recommence la numérotation **dans chaque catégorie**.
      - Contrairement à GROUP BY, **toutes les lignes restent** affichées.
    commonMistakes: |
      - Filtrer un rang dans WHERE : impossible, il faut passer par une CTE.
      - Confondre GROUP BY (une ligne par groupe) et OVER (toutes les lignes gardées).
    blocks:
      - type: text
        md: |
          « Le produit le plus cher **de chaque catégorie** » : il faut classer les produits, catégorie par
          catégorie, en gardant chaque produit visible. C'est le rôle des **fonctions de fenêtrage**.
      - type: definition
        id: def-fonction-de-fenetrage-over
        term: "Fonction de fenêtrage (OVER)"
        md: |
          Un **podium par épreuve** : chaque sportif garde sa ligne, et reçoit en plus sa place dans son
          épreuve. `OVER (...)` dit comment ranger ; `PARTITION BY` dit « une épreuve par catégorie ».
      - type: code
        id: code-fenetrage
        language: sql
        title: "Classer les produits par prix dans chaque catégorie"
        code: |
          SELECT nom, categorie_id, prix,
                 RANK() OVER (PARTITION BY categorie_id ORDER BY prix DESC) AS rang
          FROM produits
          WHERE categorie_id IS NOT NULL
          ORDER BY categorie_id, rang;
        lines:
          - n: 2
            note: "RANK classe du plus cher au moins cher, **en recommençant à 1 dans chaque catégorie** (PARTITION BY)."
          - n: 5
            note: "On affiche les catégories dans l'ordre, et les produits par rang."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis retire `PARTITION BY categorie_id` : le classement devient général."
        language: sql
        code: |
          SELECT nom, categorie_id, prix,
                 RANK() OVER (PARTITION BY categorie_id ORDER BY prix DESC) AS rang
          FROM produits
          WHERE categorie_id IS NOT NULL
          ORDER BY categorie_id, rang;
      - type: question
        ref: sqlq-cte-3
        review: def-fonction-de-fenetrage-over
      - type: question
        ref: sqlq-cte-2
        review: code-fenetrage
      - type: text
        md: "Exercice guidé : complète le classement."
      - type: exercise
        ref: sql-ex-fenetre-guide
      - type: text
        md: "En autonomie : le top 2 de chaque catégorie (fenêtrage + CTE)."
      - type: exercise
        ref: sql-ex-top2-par-categorie
      - type: quiz
        items:
          - ref: sql-c5l3-q2
            review: def-fonction-de-fenetrage-over
          - ref: sql-c5l3-q3
            review: code-fenetrage
          - ref: sql-c5l3-q4
            review: def-fonction-de-fenetrage-over
    questions:
      - code: sqlq-cte-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-avance
        prompt: Contrairement à GROUP BY, une fonction de fenêtrage garde toutes les lignes du résultat.
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : chaque ligne reçoit en plus sa valeur (son rang).'
          - label: Faux
            correct: false
            why: C'est la différence principale avec GROUP BY.
        explanation: GROUP BY donne une ligne par groupe ; OVER ajoute une colonne à chaque ligne.
      - code: sqlq-cte-2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-avance
        prompt: Que fait `ROW_NUMBER() OVER (ORDER BY prix DESC)` ?
        choices:
          - label: Numérote les lignes 1, 2, 3… du plus cher au moins cher
            correct: true
            why: 'Oui : un numéro par ligne.'
          - label: Compte le nombre de produits
            correct: false
            why: Ce serait COUNT.
          - label: Regroupe les produits de même prix
            correct: false
            why: Aucune ligne n'est regroupée avec OVER.
        explanation: Les fonctions de fenêtrage classent sans fusionner les lignes.
      - code: sql-c5l3-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Quelle différence entre `GROUP BY categorie_id` et `OVER (PARTITION BY categorie_id)` ?"
        choices:
          - label: "GROUP BY donne une ligne par catégorie ; OVER garde toutes les lignes"
            correct: true
            why: "La fenêtre ajoute une valeur sans fusionner les lignes."
          - label: "Aucune, ce sont deux écritures de la même chose"
            correct: false
            why: "Le nombre de lignes du résultat n'est pas le même."
          - label: "OVER est ancien et déconseillé"
            correct: false
            why: "Les fonctions de fenêtrage sont modernes et très utilisées."
        explanation: "Avec OVER, tu vois chaque produit **et** son rang dans sa catégorie."
      - code: sql-c5l3-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-avance
        prompt: "Deux produits ont exactement le même prix. Quelle fonction leur donne le **même** rang ?"
        choices:
          - label: "`RANK()`"
            correct: true
            why: "RANK donne le même rang aux ex æquo."
          - label: "`ROW_NUMBER()`"
            correct: false
            why: "ROW_NUMBER donne toujours un numéro différent à chaque ligne."
          - label: "`COUNT()`"
            correct: false
            why: "COUNT compte, il ne classe pas."
        explanation: "ROW_NUMBER : un numéro unique par ligne. RANK : les ex æquo partagent leur rang."
      - code: sql-c5l3-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-avance
        prompt: "On peut écrire `WHERE RANK() OVER (ORDER BY prix DESC) <= 3` pour garder les 3 produits les plus chers."
        choices:
          - label: "Vrai"
            correct: false
            why: "Le rang est calculé après WHERE : il y est interdit."
          - label: "Faux"
            correct: true
            why: "On calcule le rang dans une CTE, puis on filtre dessus."
        explanation: "`WITH classement AS (SELECT ..., RANK() OVER (...) AS rang FROM ...) SELECT * FROM classement WHERE rang <= 3`."
    exercises:
      - slug: sql-ex-fenetre-guide
        kind: COMPLETER
        title: "Compléter le classement"
        difficulty: FACILE
        skill: sql-avance
        statement: "Complète pour numéroter les clients du plus récent au plus ancien."
        criteria: "Les deux trous sont corrects."
        hints:
          - "La numérotation : ROW_NUMBER()."
          - "La fenêtre s'écrit avec OVER."
          - "ROW_NUMBER, OVER."
        solution: '["ROW_NUMBER", "OVER"]'
        explanation: "`ROW_NUMBER() OVER (ORDER BY date_inscription DESC) AS numero`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT prenom, date_inscription,
                   [[1]]() [[2]] (ORDER BY date_inscription DESC) AS numero
            FROM clients;
          blanks:
            - ["ROW_NUMBER"]
            - ["OVER"]
      - slug: sql-ex-top2-par-categorie
        kind: SQL
        title: "Les 2 produits les plus chers de chaque catégorie"
        difficulty: DIFFICILE
        skill: sql-avance
        statement: |
          Affiche, pour chaque catégorie (hors produits sans catégorie), les **2 produits les plus chers**
          avec les colonnes **categorie_id**, **nom**, **prix** et **rang** (1 ou 2), triés par catégorie puis
          par rang. Utilise `ROW_NUMBER()` pour qu'il y ait exactement deux produits par catégorie.
        criteria: "4 colonnes, au plus 2 produits par catégorie, tri par categorie_id puis rang."
        hints:
          - "Calcule d'abord le rang de chaque produit dans sa catégorie, dans une CTE."
          - "`ROW_NUMBER() OVER (PARTITION BY categorie_id ORDER BY prix DESC) AS rang`"
          - "`WITH classement AS (...) SELECT categorie_id, nom, prix, rang FROM classement WHERE rang <= 2 ORDER BY categorie_id, rang;`"
        solution: |
          WITH classement AS (
            SELECT categorie_id, nom, prix,
                   ROW_NUMBER() OVER (PARTITION BY categorie_id ORDER BY prix DESC) AS rang
            FROM produits
            WHERE categorie_id IS NOT NULL
          )
          SELECT categorie_id, nom, prix, rang
          FROM classement
          WHERE rang <= 2
          ORDER BY categorie_id, rang;
        explanation: |
          La fenêtre numérote les produits de chaque catégorie du plus cher au moins cher. Comme on ne peut pas
          filtrer un rang dans WHERE, on passe par la CTE `classement`, puis on garde les rangs 1 et 2.
        xp: 30
        payload:
          mode: READ
          ordered: true
          requiredKeywords:
            - pattern: "\\bover\\s*\\("
              message: "Utilise une fonction de fenêtrage (ROW_NUMBER() OVER (...))."

bank:
  - code: sql-c5-b1
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-agregation
    prompt: "Où peut-on placer une sous-requête ?"
    choices:
      - label: "Dans WHERE, dans FROM (table dérivée) et dans SELECT (valeur calculée)"
        correct: true
        why: "Les trois emplacements sont possibles, avec des usages différents."
      - label: "Uniquement dans WHERE"
        correct: false
        why: "FROM et SELECT acceptent aussi des sous-requêtes."
      - label: "Uniquement dans FROM"
        correct: false
        why: "La plus courante est même dans WHERE."
    explanation: "Une sous-requête dans FROM doit avoir un alias : `FROM (SELECT ...) AS t`."
  - code: sql-c5-b2
    kind: RESULTAT_CODE
    difficulty: 2
    skill: sql-agregation
    prompt: "Que renvoie cette requête ?"
    snippet: |
      SELECT MAX(n) FROM (SELECT COUNT(*) AS n FROM commandes GROUP BY client_id) AS t;
    language: sql
    choices:
      - label: "Le plus grand nombre de commandes passées par un même client"
        correct: true
        why: "La sous-requête compte les commandes par client, la requête principale prend le maximum."
      - label: "Le nombre total de commandes"
        correct: false
        why: "Ce serait SUM(n)."
      - label: "Une erreur, car une sous-requête dans FROM est interdite"
        correct: false
        why: "C'est autorisé, avec un alias (ici t)."
    explanation: "Agréger un agrégat nécessite deux niveaux : une sous-requête (ou une CTE), puis une seconde agrégation."
  - code: sql-c5-b4
    kind: CHOIX_UNIQUE
    difficulty: 3
    skill: sql-avance
    prompt: "Quelle fonction numérote les lignes 1, 2, 3… sans jamais d'ex æquo ?"
    choices:
      - label: "ROW_NUMBER()"
        correct: true
        why: "Chaque ligne reçoit un numéro unique dans sa partition."
      - label: "RANK()"
        correct: false
        why: "RANK donne le même rang aux ex æquo."
      - label: "COUNT()"
        correct: false
        why: "COUNT compte, il ne numérote pas."
    explanation: "ROW_NUMBER est utile pour « le n premier de chaque groupe », quand un départage arbitraire est acceptable."
  - code: sql-c5-b5
    kind: COMPLETER_CODE
    difficulty: 3
    skill: sql-avance
    prompt: "Complète pour afficher le **cumul** des salaires, employé après employé, dans l'ordre des identifiants."
    snippet: |
      SELECT id, salaire,
             SUM(salaire) ____ (ORDER BY id) AS cumul
      FROM employes;
    language: sql
    answers: ["OVER"]
    explanation: "`SUM(...) OVER (ORDER BY id)` additionne les salaires de la première ligne jusqu'à la ligne courante : c'est un total cumulé, sans regrouper les lignes."
  - code: sql-c5-b6
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-jointures
    prompt: "Quelle requête renvoie les catégories qui n'ont **aucun** produit, sans risque avec les NULL ?"
    choices:
      - label: "`SELECT nom FROM categories c WHERE NOT EXISTS (SELECT 1 FROM produits p WHERE p.categorie_id = c.id);`"
        correct: true
        why: "NOT EXISTS n'est pas perturbé par le produit dont categorie_id est NULL."
      - label: "`SELECT nom FROM categories WHERE id NOT IN (SELECT categorie_id FROM produits);`"
        correct: false
        why: "La sous-requête contient un NULL (coffret surprise) : le résultat est toujours vide."
      - label: "`SELECT nom FROM categories WHERE id <> ALL (produits);`"
        correct: false
        why: "Syntaxe invalide."
    explanation: "Réflexe professionnel : NOT EXISTS pour les anti-jointures par sous-requête."
