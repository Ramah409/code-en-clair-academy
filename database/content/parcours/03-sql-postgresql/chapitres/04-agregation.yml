slug: agregation
position: 4
level: INTERMEDIAIRE
title: "Agréger et regrouper"
summary: "Compter, trouver le plus petit et le plus grand, laisser la base faire les totaux, puis regrouper les lignes et filtrer les groupes. Une notion par leçon."
quizQuestionCount: 15

lessons:
  # ===================================================================== LEÇON 1
  - slug: sql-fonctions-agregat
    title: "Compter les lignes : COUNT"
    duration: 9
    objective: "Compter des lignes avec COUNT(*), compter les valeurs renseignées avec COUNT(colonne) et les valeurs différentes avec COUNT(DISTINCT colonne)."
    prerequisites: "Chapitre « Filtres pratiques » (NULL et DISTINCT)."
    skills: [sql-agregation]
    xp: 10
    memo: |
      - `COUNT(*)` compte les **lignes**.
      - `COUNT(ville)` compte seulement les lignes où la ville est **renseignée** (pas NULL).
      - `COUNT(DISTINCT ville)` compte les villes **différentes**.
      - Tu n'as rien à calculer : c'est PostgreSQL qui compte et affiche le nombre.
      - Sans autre chose dans le SELECT, le résultat tient en **une seule ligne**.
    commonMistakes: |
      - Confondre `COUNT(*)` (toutes les lignes) et `COUNT(colonne)` (les cases remplies).
      - Écrire `SELECT nom, COUNT(*) FROM produits;` : on ne mélange pas une colonne simple et un comptage (tu verras pourquoi avec GROUP BY).
    blocks:
      - type: text
        md: |
          « Combien de clients avons-nous ? » On ne va pas les compter à la main sur l'écran : on demande
          à la base de **compter pour nous**, avec `COUNT`.
      - type: definition
        id: def-fonction-d-agregat
        term: "COUNT (compter)"
        md: |
          Un **compteur à l'entrée d'un magasin** : il ne retient pas qui est entré, seulement **combien**.
          `COUNT` résume plusieurs lignes en **un seul nombre**.
      - type: code
        id: code-count
        language: sql
        title: "Combien de produits dans le catalogue ?"
        code: |
          SELECT COUNT(*) AS nb_produits
          FROM produits;
        lines:
          - n: 1
            note: "`COUNT(*)` compte toutes les lignes. `AS nb_produits` donne un nom clair au résultat."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis ajoute `WHERE categorie_id = 1` : tu obtiens le nombre de livres."
        language: sql
        code: |
          SELECT COUNT(*) AS nb_produits
          FROM produits;
      - type: question
        ref: sqlq-agg-1
        review: def-fonction-d-agregat
      - type: definition
        id: def-count-colonne
        term: "COUNT(*) ou COUNT(colonne) ?"
        md: |
          `COUNT(*)` compte **toutes les lignes**. `COUNT(ville)` saute les cases vides (NULL) : il compte
          les clients **qui ont une ville**. `COUNT(DISTINCT ville)` compte les villes **différentes**.
      - type: demo
        title: "Trois façons de compter"
        md: "Compare les trois colonnes : tous les clients, ceux qui ont une ville, les villes différentes."
        language: sql
        code: |
          SELECT COUNT(*)              AS clients,
                 COUNT(ville)          AS avec_ville,
                 COUNT(DISTINCT ville) AS villes_differentes
          FROM clients;
      - type: question
        ref: sqlq-agg-2
        review: def-count-colonne
      - type: text
        md: "Exercice guidé : complète le comptage."
      - type: exercise
        ref: sql-ex-count-guide
      - type: text
        md: "En autonomie : combien de commandes livrées ?"
      - type: exercise
        ref: sql-ex-count-livrees
      - type: quiz
        items:
          - ref: sql-c3l1-q2
            review: def-count-colonne
          - ref: sql-c3l1-q4
            review: def-count-colonne
          - ref: sql-p17-q5
            review: code-count
    questions:
      - code: sqlq-agg-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: Combien de lignes renvoie `SELECT COUNT(*) FROM produits;` ?
        choices:
          - label: Une seule ligne, qui contient le nombre de produits
            correct: true
            why: "Oui : COUNT résume toutes les lignes en un seul nombre."
          - label: Une ligne par produit
            correct: false
            why: COUNT regroupe toutes les lignes.
          - label: Aucune
            correct: false
            why: Même sur une table vide, COUNT renvoie une ligne (avec 0).
        explanation: COUNT résume toute la table en un seul résultat.
      - code: sqlq-agg-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: Quelle différence entre `COUNT(*)` et `COUNT(commentaire)` ?
        choices:
          - label: COUNT(commentaire) ne compte pas les lignes où commentaire est NULL
            correct: true
            why: Oui.
          - label: Aucune
            correct: false
            why: Elles diffèrent dès qu'il y a des cases vides.
          - label: COUNT(*) saute les NULL
            correct: false
            why: "C'est l'inverse : COUNT(*) compte toutes les lignes."
        explanation: COUNT(*) compte les lignes ; COUNT(colonne) compte les cases remplies.
      - code: sql-c3l1-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-agregation
        prompt: "Certains avis n'ont pas de commentaire. Que montrent les deux colonnes ?"
        snippet: |
          SELECT COUNT(*), COUNT(commentaire)
          FROM avis;
        language: sql
        choices:
          - label: "Le nombre de tous les avis, puis le nombre d'avis qui ont un commentaire"
            correct: true
            why: "COUNT(*) compte toutes les lignes ; COUNT(commentaire) saute les cases vides."
          - label: "Deux fois le même nombre"
            correct: false
            why: "COUNT(colonne) ne compte pas les NULL : les deux nombres diffèrent."
          - label: "Le nombre d'avis sans commentaire, deux fois"
            correct: false
            why: "COUNT(*) compte toutes les lignes, avec ou sans commentaire."
        explanation: "`COUNT(*)` = toutes les lignes ; `COUNT(col)` = les lignes où col est renseignée."
      - code: sql-c3l1-q4
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-agregation
        prompt: "Complète pour compter les **villes différentes** où habitent les clients."
        snippet: |
          SELECT COUNT(____ ville) AS nb_villes
          FROM clients;
        language: sql
        answers: ["DISTINCT"]
        explanation: "`COUNT(DISTINCT col)` compte les valeurs différentes (DISTINCT, vu au chapitre 3)."
      - code: sql-p17-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-agregation
        prompt: "Avec COUNT, c'est PostgreSQL qui compte les lignes : tu n'as rien à calculer."
        choices:
          - label: "Vrai"
            correct: true
            why: "Tu écris la question, la base donne la réponse."
          - label: "Faux"
            correct: false
            why: "COUNT fait tout le travail."
        explanation: "Ton rôle : choisir quoi compter (`*`, une colonne, `DISTINCT`) et filtrer avec WHERE."
    exercises:
      - slug: sql-ex-count-guide
        kind: COMPLETER
        title: "Compléter le comptage"
        difficulty: FACILE
        skill: sql-agregation
        statement: "Complète pour compter les clients qui habitent à Lyon."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Compter des lignes : COUNT(*)."
          - "On nomme le résultat avec AS."
          - "COUNT, AS, WHERE."
        solution: '["COUNT", "AS", "WHERE"]'
        explanation: "`SELECT COUNT(*) AS nb_clients FROM clients WHERE ville = 'Lyon';`"
        xp: 10
        payload:
          language: sql
          template: |
            SELECT [[1]](*) [[2]] nb_clients
            FROM clients
            [[3]] ville = 'Lyon';
          blanks:
            - ["COUNT"]
            - ["AS"]
            - ["WHERE"]
      - slug: sql-ex-count-livrees
        kind: SQL
        title: "Combien de commandes livrées ?"
        difficulty: FACILE
        skill: sql-agregation
        statement: |
          Affiche, dans une colonne nommée `nb_livrees`, le **nombre de commandes** dont le statut est `'LIVREE'`.
        criteria: "Une ligne, une colonne nb_livrees."
        hints:
          - "On filtre d'abord avec WHERE, puis on compte."
          - "`COUNT(*) AS nb_livrees`"
          - "`SELECT COUNT(*) AS nb_livrees FROM commandes WHERE statut = 'LIVREE';`"
        solution: |
          SELECT COUNT(*) AS nb_livrees
          FROM commandes
          WHERE statut = 'LIVREE';
        explanation: "WHERE garde les commandes livrées, COUNT les compte."
        xp: 10
        payload:
          mode: READ

  # ===================================================================== LEÇON 2
  - slug: sql-min-max
    title: "Le plus petit et le plus grand : MIN et MAX"
    duration: 8
    objective: "Trouver la plus petite et la plus grande valeur d'une colonne avec MIN et MAX."
    prerequisites: "Leçon « Compter les lignes : COUNT »."
    skills: [sql-agregation]
    xp: 10
    memo: |
      - `MIN(prix)` : le plus petit prix. `MAX(prix)` : le plus grand.
      - Pour une date : `MIN` = la plus ancienne, `MAX` = la plus récente.
      - Pour un texte : `MIN` = le premier dans l'ordre alphabétique.
      - Les cases vides (NULL) sont ignorées.
    commonMistakes: |
      - Écrire `WHERE prix = MAX` : MAX est une fonction, elle s'écrit avec des parenthèses dans le SELECT.
    blocks:
      - type: text
        md: |
          « Quelle est notre commande la plus ancienne ? la plus récente ? » `MIN` et `MAX` répondent
          directement, sans trier toute la table.
      - type: definition
        id: def-min-max
        term: "MIN et MAX"
        md: |
          Les **deux bouts d'une file rangée** : MIN donne le premier (le plus petit, le plus ancien),
          MAX donne le dernier (le plus grand, le plus récent).
      - type: code
        id: code-min-max
        language: sql
        title: "La première et la dernière commande"
        code: |
          SELECT MIN(date_commande) AS premiere,
                 MAX(date_commande) AS derniere
          FROM commandes;
        lines:
          - n: 1
            note: "La date la plus ancienne."
          - n: 2
            note: "La date la plus récente. Le résultat tient en une ligne."
      - type: demo
        title: "Essaie"
        md: "Remplace `date_commande` par `prix` et `commandes` par `produits`."
        language: sql
        code: |
          SELECT MIN(date_commande) AS premiere,
                 MAX(date_commande) AS derniere
          FROM commandes;
      - type: question
        ref: sql-c3l1-q1
        review: def-min-max
      - type: question
        ref: sql-p18-q2
        review: code-min-max
      - type: text
        md: "Exercice guidé : complète MIN et MAX."
      - type: exercise
        ref: sql-ex-minmax-guide
      - type: text
        md: "En autonomie : les inscriptions extrêmes."
      - type: exercise
        ref: sql-ex-inscriptions-extremes
      - type: quiz
        items:
          - ref: sql-p18-q3
            review: def-min-max
          - ref: sql-p18-q4
            review: def-min-max
          - ref: sql-p18-q5
            review: code-min-max
    questions:
      - code: sql-c3l1-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: "Quelle requête donne le **prix du produit le plus cher** ?"
        choices:
          - label: "`SELECT MAX(prix) FROM produits;`"
            correct: true
            why: "MAX renvoie la plus grande valeur de la colonne."
          - label: "`SELECT prix FROM produits WHERE prix = MAX;`"
            correct: false
            why: "MAX est une fonction : elle s'écrit avec des parenthèses, dans le SELECT."
          - label: "`SELECT COUNT(prix) FROM produits;`"
            correct: false
            why: "COUNT compte, il ne cherche pas la plus grande valeur."
        explanation: "Pour afficher aussi le nom du produit : `ORDER BY prix DESC LIMIT 1` (chapitre 2)."
      - code: sql-p18-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: "Sur une colonne de dates, que donne `MIN(date_inscription)` ?"
        choices:
          - label: "La date d'inscription la plus ancienne"
            correct: true
            why: "Pour une date, le plus petit = le plus tôt."
          - label: "La date la plus récente"
            correct: false
            why: "Ce serait MAX."
          - label: "Le nombre d'inscriptions"
            correct: false
            why: "Ce serait COUNT."
        explanation: "MIN = la plus ancienne, MAX = la plus récente."
      - code: sql-p18-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: "Quelle fonction donne la plus grande valeur d'une colonne ?"
        choices:
          - label: "`MAX`"
            correct: true
            why: "MAX = maximum, le plus grand."
          - label: "`MIN`"
            correct: false
            why: "MIN donne le plus petit."
          - label: "`COUNT`"
            correct: false
            why: "COUNT compte les lignes."
        explanation: "MIN (minimum) et MAX (maximum)."
      - code: sql-p18-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-agregation
        prompt: "`MIN(nom)` sur des textes donne le nom qui vient en premier dans l'ordre alphabétique."
        choices:
          - label: "Vrai"
            correct: true
            why: "Pour un texte, le plus petit = le premier de A à Z."
          - label: "Faux"
            correct: false
            why: "MIN fonctionne aussi avec les textes."
        explanation: "MIN et MAX marchent avec les nombres, les dates et les textes."
      - code: sql-p18-q5
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-agregation
        prompt: "Complète pour afficher le plus petit stock du catalogue."
        snippet: |
          SELECT ____(stock) AS plus_petit_stock
          FROM produits;
        language: sql
        answers: ["MIN"]
        explanation: "`MIN(stock)` : la plus petite valeur de la colonne stock."
    exercises:
      - slug: sql-ex-minmax-guide
        kind: COMPLETER
        title: "Compléter MIN et MAX"
        difficulty: FACILE
        skill: sql-agregation
        statement: "Complète pour afficher le prix le plus bas et le prix le plus haut du catalogue."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Le plus bas : MIN."
          - "Le plus haut : MAX."
          - "MIN, MAX."
        solution: '["MIN", "MAX"]'
        explanation: "`MIN(prix)` et `MAX(prix)`."
        xp: 10
        payload:
          language: sql
          template: |
            SELECT [[1]](prix) AS prix_bas,
                   [[2]](prix) AS prix_haut
            FROM produits;
          blanks:
            - ["MIN"]
            - ["MAX"]
      - slug: sql-ex-inscriptions-extremes
        kind: SQL
        title: "La première et la dernière inscription"
        difficulty: FACILE
        skill: sql-agregation
        statement: |
          Affiche la date d'inscription la **plus ancienne** (colonne `premiere`) et la **plus récente**
          (colonne `derniere`) de la table `clients`.
        criteria: "Une ligne, deux colonnes : premiere et derniere."
        hints:
          - "La plus ancienne : MIN. La plus récente : MAX."
          - "La colonne s'appelle `date_inscription`."
          - "`SELECT MIN(date_inscription) AS premiere, MAX(date_inscription) AS derniere FROM clients;`"
        solution: |
          SELECT MIN(date_inscription) AS premiere,
                 MAX(date_inscription) AS derniere
          FROM clients;
        explanation: "MIN et MAX parcourent toute la colonne et gardent les deux extrêmes."
        xp: 10
        payload:
          mode: READ

  # ===================================================================== LEÇON 3
  - slug: sql-sum-avg
    title: "La base calcule pour toi : SUM et AVG"
    duration: 9
    objective: "Savoir quand utiliser SUM (le total) et AVG (la moyenne) : c'est PostgreSQL qui fait le calcul."
    prerequisites: "Leçon « Le plus petit et le plus grand : MIN et MAX »."
    skills: [sql-agregation]
    xp: 10
    memo: |
      - `SUM(stock)` : le **total** de la colonne. `AVG(note)` : la **moyenne**.
      - **Tu ne calcules rien** : tu choisis la bonne fonction, PostgreSQL fait le calcul.
      - `ROUND(AVG(note), 2)` garde 2 chiffres après la virgule, pour un affichage propre.
      - Les cases vides (NULL) sont ignorées.
    commonMistakes: |
      - Confondre SUM (total) et COUNT (nombre de lignes).
      - Oublier ROUND : AVG affiche beaucoup de chiffres après la virgule.
    blocks:
      - type: text
        md: |
          Dans un tableau de bord, on affiche « le stock total » ou « la note moyenne ». Ces valeurs, tu
          ne les calcules jamais toi-même : tu demandes à la base avec `SUM` ou `AVG`.
      - type: definition
        id: def-sum-avg
        term: "SUM et AVG"
        md: |
          Une **calculatrice intégrée** à la base : tu appuies sur le bon bouton, elle affiche la réponse.
          `SUM` = le bouton « total », `AVG` = le bouton « moyenne ».
      - type: code
        id: code-sum-avg
        language: sql
        title: "Le résumé des avis"
        code: |
          SELECT COUNT(*)            AS nb_avis,
                 ROUND(AVG(note), 2) AS note_moyenne
          FROM avis;
        lines:
          - n: 1
            note: "Le nombre d'avis (COUNT, déjà vu)."
          - n: 2
            note: "La note moyenne, calculée par PostgreSQL. `ROUND(…, 2)` garde deux chiffres après la virgule."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis essaie `SELECT SUM(stock) AS stock_total FROM produits;`."
        language: sql
        code: |
          SELECT COUNT(*)            AS nb_avis,
                 ROUND(AVG(note), 2) AS note_moyenne
          FROM avis;
      - type: question
        ref: sqlq-agg-3
        review: def-sum-avg
      - type: question
        ref: sql-p19-q2
        review: def-sum-avg
      - type: text
        md: "Exercice guidé : choisis la bonne fonction."
      - type: exercise
        ref: sql-ex-sumavg-guide
      - type: text
        md: "En autonomie : toutes les fonctions du chapitre dans une requête."
      - type: exercise
        ref: sql-ex-stats-avis
      - type: quiz
        items:
          - ref: sql-c3l1-q3
            review: def-sum-avg
          - ref: sql-p19-q4
            review: code-sum-avg
          - ref: sql-p19-q5
            review: def-sum-avg
    questions:
      - code: sqlq-agg-3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: Quelle fonction donne la moyenne ?
        choices:
          - label: '`AVG`'
            correct: true
            why: Oui (average = moyenne en anglais).
          - label: '`SUM`'
            correct: false
            why: SUM donne le total.
          - label: '`MID`'
            correct: false
            why: Cette fonction n'existe pas en PostgreSQL.
        explanation: 'COUNT, SUM, AVG, MIN, MAX : les cinq fonctions de résumé.'
      - code: sql-p19-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: "Tu veux afficher le **stock total** de tous les produits. Quelle fonction choisir ?"
        choices:
          - label: "`SUM(stock)`"
            correct: true
            why: "SUM additionne toute la colonne à ta place."
          - label: "`COUNT(stock)`"
            correct: false
            why: "COUNT compte les lignes, il n'additionne pas les stocks."
          - label: "`MAX(stock)`"
            correct: false
            why: "MAX donne seulement le plus grand stock."
        explanation: "Total = SUM ; nombre de lignes = COUNT."
      - code: sql-c3l1-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-agregation
        prompt: "`AVG(note)` compte une note NULL comme un zéro."
        choices:
          - label: "Vrai"
            correct: false
            why: "Les cases vides sont simplement ignorées."
          - label: "Faux"
            correct: true
            why: "La moyenne se fait sur les seules notes renseignées."
        explanation: "SUM, AVG, MIN et MAX ignorent les NULL."
      - code: sql-p19-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: "À quoi sert `ROUND(…, 2)` autour de `AVG(note)` ?"
        choices:
          - label: "À garder deux chiffres après la virgule, pour un affichage propre"
            correct: true
            why: "Sans ROUND, la moyenne peut avoir beaucoup de chiffres."
          - label: "À compter deux notes"
            correct: false
            why: "ROUND ne compte rien."
          - label: "À garder les deux meilleures notes"
            correct: false
            why: "ROUND arrondit l'affichage, il ne filtre pas."
        explanation: "`ROUND(valeur, 2)` = arrondi à 2 chiffres après la virgule."
      - code: sql-p19-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-agregation
        prompt: "Pour utiliser SUM ou AVG, il faut savoir faire le calcul soi-même."
        choices:
          - label: "Vrai"
            correct: false
            why: "C'est la base qui calcule."
          - label: "Faux"
            correct: true
            why: "Ton rôle est seulement de choisir la bonne fonction."
        explanation: "Total → SUM, moyenne → AVG, nombre → COUNT, extrêmes → MIN et MAX."
    exercises:
      - slug: sql-ex-sumavg-guide
        kind: COMPLETER
        title: "La bonne fonction"
        difficulty: FACILE
        skill: sql-agregation
        statement: "Complète : le stock total, puis la note moyenne arrondie."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le total : SUM."
          - "La moyenne : AVG, entourée de ROUND pour l'arrondi."
          - "SUM, ROUND, AVG."
        solution: '["SUM", "ROUND", "AVG"]'
        explanation: "`SUM(stock)` puis `ROUND(AVG(note), 2)`."
        xp: 10
        payload:
          language: sql
          template: |
            -- Le stock total du catalogue
            SELECT [[1]](stock) AS stock_total FROM produits;
            -- La note moyenne, avec deux chiffres après la virgule
            SELECT [[2]]([[3]](note), 2) AS note_moyenne FROM avis;
          blanks:
            - ["SUM"]
            - ["ROUND"]
            - ["AVG"]
      - slug: sql-ex-stats-avis
        kind: SQL
        title: "Le résumé des avis"
        difficulty: FACILE
        skill: sql-agregation
        statement: |
          Affiche en une seule ligne :
          - le **nombre d'avis** (`nb_avis`) ;
          - la **note moyenne** arrondie à 2 chiffres après la virgule (`note_moyenne`) ;
          - la **note la plus basse** (`note_min`) et la **plus haute** (`note_max`).
        criteria: "Une ligne, 4 colonnes : nb_avis, note_moyenne (2 décimales), note_min, note_max."
        hints:
          - "Tout vient de la table avis."
          - "COUNT(*), ROUND(AVG(note), 2), MIN(note) et MAX(note)."
          - "`SELECT COUNT(*) AS nb_avis, ROUND(AVG(note), 2) AS note_moyenne, MIN(note) AS note_min, MAX(note) AS note_max FROM avis;`"
        solution: |
          SELECT COUNT(*)            AS nb_avis,
                 ROUND(AVG(note), 2) AS note_moyenne,
                 MIN(note)           AS note_min,
                 MAX(note)           AS note_max
          FROM avis;
        explanation: "Chaque fonction parcourt la table avis et donne une valeur : le résultat tient en une ligne."
        xp: 15
        payload:
          mode: READ

  # ===================================================================== LEÇON 4
  - slug: sql-group-by
    title: "Regrouper les lignes avec GROUP BY"
    duration: 12
    objective: "Obtenir un résultat par catégorie, par client, par ville… et respecter la règle d'or du GROUP BY."
    prerequisites: "Leçon « La base calcule pour toi : SUM et AVG »."
    skills: [sql-agregation]
    xp: 12
    memo: |
      - `GROUP BY col` forme **un groupe par valeur** de col ; les agrégats sont calculés **par groupe**.
      - Règle d'or : toute colonne du SELECT est **soit dans le GROUP BY, soit dans un agrégat**.
      - Les NULL forment **un groupe à part**.
      - On peut trier les groupes avec ORDER BY, par exemple du plus grand nombre au plus petit.
    commonMistakes: |
      - `SELECT nom, categorie_id, COUNT(*) ... GROUP BY categorie_id` : `nom` n'est ni groupé ni agrégé → erreur 42803.
      - Oublier le groupe NULL dans l'analyse du résultat.
    blocks:
      - type: text
        md: |
          « Combien de produits par catégorie ? », « Combien de commandes par client ? » : ces questions
          demandent un agrégat **pour chaque valeur** d'une colonne. C'est le rôle de `GROUP BY`.
      - type: definition
        id: def-group-by
        term: "GROUP BY"
        md: |
          Rassemble les lignes qui ont la **même valeur** dans la ou les colonnes indiquées. Chaque groupe
          produit **une ligne** de résultat, et les fonctions d'agrégat sont calculées **dans chaque groupe**.
      - type: code
        language: sql
        title: "Nombre de produits par catégorie"
        code: |
          SELECT categorie_id,
                 COUNT(*) AS nb_produits
          FROM produits
          GROUP BY categorie_id
          ORDER BY categorie_id;
        lines:
          - n: 1
            note: "La colonne de regroupement est affichée : elle identifie chaque groupe."
          - n: 2
            note: "COUNT(*) est calculé **dans chaque groupe** : le nombre de produits de la catégorie."
          - n: 4
            note: "Un groupe par valeur de categorie_id. Le produit sans catégorie forme un groupe NULL."
      - type: demo
        title: "Démonstration"
        md: "Remarque la ligne où `categorie_id` est NULL : le « Coffret surprise » sans catégorie forme son propre groupe."
        language: sql
        code: |
          SELECT categorie_id,
                 COUNT(*) AS nb_produits,
                 ROUND(AVG(prix), 2) AS prix_moyen
          FROM produits
          GROUP BY categorie_id
          ORDER BY categorie_id;
      - type: question
        ref: sql-c3l2-q1
      - type: callout
        variant: warning
        title: "La règle d'or"
        md: |
          Dans une requête avec GROUP BY, chaque colonne du SELECT doit être **dans le GROUP BY** ou
          **dans une fonction d'agrégat**. Sinon, PostgreSQL ne sait pas quelle valeur afficher pour le
          groupe et renvoie l'erreur *« must appear in the GROUP BY clause or be used in an aggregate function »*.
      - type: demo
        title: "Démonstration : provoque l'erreur"
        md: "Exécute, lis l'erreur, puis corrige en retirant `nom` du SELECT."
        language: sql
        code: |
          SELECT categorie_id, nom, COUNT(*)
          FROM produits
          GROUP BY categorie_id;
      - type: question
        ref: sql-c3l2-q2
      - type: code
        language: sql
        title: "Regrouper, puis trier les groupes"
        code: |
          SELECT ville, COUNT(*) AS nb_clients
          FROM clients
          WHERE ville IS NOT NULL
          GROUP BY ville
          ORDER BY nb_clients DESC, ville;
        lines:
          - n: 3
            note: "WHERE écarte d'abord les clients sans ville."
          - n: 4
            note: "Un groupe par ville ; COUNT(*) compte les clients de chaque groupe."
          - n: 5
            note: "Les villes qui ont le plus de clients en premier ; à égalité, par ordre alphabétique."
      - type: question
        ref: sql-c3l2-q3
      - type: exercise
        ref: sql-ex-commandes-par-statut
      - type: question
        ref: sql-c3l2-q4
      - type: exercise
        ref: sql-ex-masse-salariale
      - type: quiz
        items:
          - ref: sqlq-group-1
            review: def-group-by
          - ref: sqlq-group-2
          - ref: sqlq-group-3
    questions:
      - code: sql-c3l2-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: "Avec `GROUP BY ville`, combien de lignes obtient-on ?"
        choices:
          - label: "Une ligne par valeur différente de ville (NULL compris)"
            correct: true
            why: "Chaque valeur distincte forme un groupe, et les NULL forment un groupe à part."
          - label: "Une ligne par client"
            correct: false
            why: "Ce serait le cas sans GROUP BY."
          - label: "Une seule ligne"
            correct: false
            why: "C'est le cas d'un agrégat sans GROUP BY."
        explanation: "GROUP BY produit autant de lignes que de groupes, c'est-à-dire de valeurs distinctes dans les colonnes de regroupement."
      - code: sql-c3l2-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: "Pourquoi cette requête échoue-t-elle ?"
        snippet: |
          SELECT client_id, statut, COUNT(*)
          FROM commandes
          GROUP BY client_id;
        language: sql
        choices:
          - label: "`statut` n'est ni dans le GROUP BY ni dans une fonction d'agrégat"
            correct: true
            why: "Un client a plusieurs commandes de statuts différents : quelle valeur afficher ?"
          - label: "COUNT(*) est interdit avec GROUP BY"
            correct: false
            why: "C'est au contraire l'usage le plus courant."
          - label: "GROUP BY doit être placé avant FROM"
            correct: false
            why: "L'ordre est SELECT, FROM, WHERE, GROUP BY."
        explanation: "Pour corriger : `GROUP BY client_id, statut` (un groupe par couple client/statut) ou retirer `statut` du SELECT."
      - code: sql-c3l2-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-agregation
        prompt: "Un consultant n'est rattaché à aucun service. Que renvoie cette requête ?"
        snippet: |
          SELECT service_id, COUNT(*)
          FROM employes
          GROUP BY service_id;
        language: sql
        choices:
          - label: "Une ligne par service, plus une ligne pour les employés sans service (NULL)"
            correct: true
            why: "Les NULL forment un groupe à part."
          - label: "Une ligne par service seulement"
            correct: false
            why: "Le consultant sans service forme un groupe NULL supplémentaire."
          - label: "Une ligne par employé"
            correct: false
            why: "Il y a une ligne par groupe, pas par employé."
          - label: "Une seule ligne"
            correct: false
            why: "GROUP BY produit un groupe par valeur différente."
        explanation: "Les NULL forment toujours un groupe à part dans un GROUP BY. Filtre-les avec `WHERE service_id IS NOT NULL` si besoin."
      - code: sql-c3l2-q4
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-agregation
        prompt: "Complète pour obtenir le nombre de clients par ville."
        snippet: |
          SELECT ville, COUNT(*) AS nb_clients
          FROM clients
          ____ ville;
        language: sql
        answers: ["GROUP BY"]
        explanation: "`GROUP BY ville` crée un groupe par ville ; COUNT(*) compte les clients de chaque groupe."
      - code: sqlq-group-1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: Dans une requête avec GROUP BY, quelles colonnes peut-on afficher sans agrégat ?
        choices:
          - label: Seulement celles du GROUP BY
            correct: true
            why: 'Oui : les autres ont plusieurs valeurs par groupe.'
          - label: Toutes les colonnes de la table
            correct: false
            why: 'PostgreSQL refuse : quelle valeur choisir dans le groupe ?'
          - label: Aucune
            correct: false
            why: Les colonnes de regroupement peuvent être affichées.
        explanation: "Règle d'or : chaque colonne du SELECT est soit dans le GROUP BY, soit dans un agrégat."
      - code: sqlq-group-2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-agregation
        prompt: Quelle requête donne le nombre de produits de chaque catégorie ?
        choices:
          - label: '`SELECT categorie_id, COUNT(*) FROM produits GROUP BY categorie_id;`'
            correct: true
            why: Oui.
          - label: '`SELECT categorie_id, COUNT(*) FROM produits;`'
            correct: false
            why: 'Il manque le GROUP BY : erreur.'
          - label: '`SELECT COUNT(categorie_id) FROM produits;`'
            correct: false
            why: On obtient un seul total, pas un nombre par catégorie.
        explanation: GROUP BY crée un groupe par valeur ; COUNT compte les lignes de chaque groupe.
      - code: sqlq-group-3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-agregation
        prompt: Les lignes dont la colonne de regroupement vaut NULL forment un groupe à part.
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : GROUP BY rassemble tous les NULL dans un même groupe.'
          - label: Faux
            correct: false
            why: 'Elles ne disparaissent pas : elles forment un groupe.'
        explanation: Pense à ce groupe NULL dans tes résultats (produit sans catégorie, employé sans service…).
    exercises:
      - slug: sql-ex-commandes-par-statut
        kind: SQL
        title: "Commandes par statut"
        difficulty: FACILE
        skill: sql-agregation
        statement: |
          Affiche chaque **statut** de commande et le **nombre de commandes** correspondant (colonne
          `nb_commandes`), du statut le plus fréquent au moins fréquent.
        criteria: "2 colonnes (statut, nb_commandes), une ligne par statut, triées par nombre décroissant."
        hints:
          - "Il faut un groupe par statut."
          - "`COUNT(*)` compte les commandes de chaque groupe ; trie ensuite par ce nombre."
          - "`SELECT statut, COUNT(*) AS nb_commandes FROM commandes GROUP BY statut ORDER BY nb_commandes DESC;`"
        solution: |
          SELECT statut, COUNT(*) AS nb_commandes
          FROM commandes
          GROUP BY statut
          ORDER BY nb_commandes DESC;
        explanation: |
          GROUP BY statut forme 4 groupes (LIVREE, EN_ATTENTE, EXPEDIEE, ANNULEE). ORDER BY peut utiliser
          l'alias `nb_commandes`, car le tri est effectué après le calcul des agrégats.
        xp: 15
        payload:
          mode: READ
          ordered: true
      - slug: sql-ex-masse-salariale
        kind: SQL
        title: "Masse salariale par service"
        difficulty: INTERMEDIAIRE
        skill: sql-agregation
        statement: |
          Pour chaque **service_id** (en excluant les employés sans service), affiche :
          - le nombre d'employés (`nb_employes`) ;
          - la somme des salaires (`masse_salariale`) ;
          - le salaire moyen arrondi à 2 décimales (`salaire_moyen`).

          Trie par masse salariale décroissante.
        criteria: "4 colonnes, 4 lignes (services 1 à 4), triées par masse salariale décroissante."
        hints:
          - "Exclure les employés sans service se fait **avant** le regroupement, avec WHERE."
          - "Trois agrégats : COUNT(*), SUM(salaire) et ROUND(AVG(salaire), 2)."
          - "`WHERE service_id IS NOT NULL GROUP BY service_id ORDER BY masse_salariale DESC`"
        solution: |
          SELECT service_id,
                 COUNT(*)               AS nb_employes,
                 SUM(salaire)           AS masse_salariale,
                 ROUND(AVG(salaire), 2) AS salaire_moyen
          FROM employes
          WHERE service_id IS NOT NULL
          GROUP BY service_id
          ORDER BY masse_salariale DESC;
        explanation: |
          WHERE retire le consultant sans service **avant** la formation des groupes. On obtient ensuite un
          groupe par service avec ses trois indicateurs. Le service Développement (2) arrive en tête.
        xp: 20
        payload:
          mode: READ
          ordered: true

  # ===================================================================== LEÇON 5
  - slug: sql-having
    title: "Filtrer des groupes avec HAVING"
    duration: 10
    objective: "Distinguer WHERE (filtre des lignes) et HAVING (filtre des groupes) et connaître l'ordre d'exécution d'une requête."
    prerequisites: "Leçon « Regrouper les lignes avec GROUP BY »."
    skills: [sql-agregation]
    xp: 12
    memo: |
      - `WHERE` filtre les **lignes avant** le regroupement ; `HAVING` filtre les **groupes après**.
      - Une condition sur un agrégat (`COUNT(*) >= 3`) va **toujours** dans HAVING.
      - Ordre logique d'exécution : FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.
    commonMistakes: |
      - `WHERE COUNT(*) > 2` : un agrégat n'est pas encore calculé au moment du WHERE → erreur.
      - Mettre dans HAVING une condition simple sur une colonne : ça fonctionne, mais c'est moins efficace et moins lisible que WHERE.
    blocks:
      - type: text
        md: |
          « Quels clients ont passé **au moins 3 commandes** ? » Il faut compter les commandes **par client**
          (GROUP BY), puis ne garder que les **groupes** dont le compte atteint 3. Ce filtre sur des groupes
          s'écrit avec `HAVING`.
      - type: code
        language: sql
        title: "Les clients fidèles"
        code: |
          SELECT client_id,
                 COUNT(*) AS nb_commandes
          FROM commandes
          GROUP BY client_id
          HAVING COUNT(*) >= 3
          ORDER BY nb_commandes DESC;
        lines:
          - n: 4
            note: "Un groupe par client, avec le nombre de ses commandes."
          - n: 5
            note: "HAVING s'applique **aux groupes** : on ne garde que ceux qui ont au moins 3 commandes."
          - n: 6
            note: "Le tri se fait après, sur les groupes restants."
      - type: demo
        title: "Démonstration"
        language: sql
        code: |
          SELECT client_id,
                 COUNT(*) AS nb_commandes
          FROM commandes
          GROUP BY client_id
          HAVING COUNT(*) >= 3
          ORDER BY nb_commandes DESC;
      - type: question
        ref: sql-c3l3-q1
      - type: definition
        id: def-ordre-logique-d-execution
        term: "Ordre logique d'exécution"
        md: |
          PostgreSQL n'exécute pas une requête dans l'ordre où elle est écrite :
          1. `FROM` (et les jointures) : quelles lignes ?
          2. `WHERE` : on écarte des lignes ;
          3. `GROUP BY` : on forme les groupes ;
          4. `HAVING` : on écarte des groupes ;
          5. `SELECT` : on calcule les colonnes (et les alias) ;
          6. `ORDER BY` puis `LIMIT`.

          C'est pourquoi un alias du SELECT est utilisable dans ORDER BY mais **pas** dans WHERE.
      - type: compare
        left:
          title: "WHERE : filtre des lignes"
          language: sql
          code: |
            SELECT client_id, COUNT(*)
            FROM commandes
            WHERE statut = 'LIVREE'
            GROUP BY client_id;
          md: "On ne compte que les commandes **livrées** de chaque client."
        right:
          title: "HAVING : filtre des groupes"
          language: sql
          code: |
            SELECT client_id, COUNT(*)
            FROM commandes
            GROUP BY client_id
            HAVING COUNT(*) >= 3;
          md: "On ne garde que les **clients** ayant au moins 3 commandes."
      - type: question
        ref: sql-c3l3-q2
      - type: question
        ref: sql-c3l3-q3
      - type: exercise
        ref: sql-ex-categories-bien-fournies
      - type: question
        ref: sql-c3l3-q4
      - type: quiz
        items:
          - ref: sqlq-having-1
            review: def-ordre-logique-d-execution
          - ref: sqlq-having-2
          - ref: sqlq-having-3
    questions:
      - code: sql-c3l3-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: "Où placer la condition `SUM(stock) > 50` pour ne garder que les catégories au stock total supérieur à 50 ?"
        choices:
          - label: "Dans une clause HAVING, après GROUP BY"
            correct: true
            why: "La condition porte sur un agrégat, calculé par groupe : c'est le rôle de HAVING."
          - label: "Dans la clause WHERE"
            correct: false
            why: "Au moment du WHERE, les groupes et leurs sommes n'existent pas encore."
          - label: "Dans le SELECT"
            correct: false
            why: "Le SELECT choisit les colonnes, il ne filtre pas."
        explanation: "Règle simple : condition sur une **colonne** → WHERE ; condition sur un **agrégat** → HAVING."
      - code: sql-c3l3-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-agregation
        prompt: "Que se passe-t-il à l'exécution de cette requête ?"
        snippet: |
          SELECT client_id, COUNT(*) AS nb
          FROM commandes
          WHERE nb >= 3
          GROUP BY client_id;
        language: sql
        choices:
          - label: "Erreur : la colonne « nb » n'existe pas"
            correct: true
            why: "WHERE est évalué avant le SELECT : l'alias nb n'est pas encore défini."
          - label: "Elle renvoie les clients ayant au moins 3 commandes"
            correct: false
            why: "Il faudrait `HAVING COUNT(*) >= 3`."
          - label: "Elle renvoie toutes les commandes"
            correct: false
            why: "La requête ne s'exécute pas."
        explanation: "L'ordre d'exécution explique l'erreur : FROM → WHERE → GROUP BY → HAVING → SELECT. Corrige avec `HAVING COUNT(*) >= 3`."
      - code: sql-c3l3-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-agregation
        prompt: "Une même requête peut contenir à la fois WHERE et HAVING."
        choices:
          - label: "Vrai"
            correct: true
            why: "WHERE filtre d'abord les lignes, HAVING filtre ensuite les groupes."
          - label: "Faux"
            correct: false
            why: "Les deux sont complémentaires et souvent utilisés ensemble."
        explanation: "Exemple : les clients ayant au moins 2 commandes **livrées** → `WHERE statut = 'LIVREE' GROUP BY client_id HAVING COUNT(*) >= 2`."
      - code: sql-c3l3-q4
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-agregation
        prompt: "Complète pour n'afficher que les villes comptant **au moins 3 clients**."
        snippet: |
          SELECT ville, COUNT(*) AS nb
          FROM clients
          GROUP BY ville
          ____ COUNT(*) >= 3;
        language: sql
        answers: ["HAVING"]
        explanation: "HAVING filtre les groupes selon la valeur d'un agrégat. Attention : le groupe NULL (clients sans ville) compte aussi 3 clients et apparaît dans le résultat !"
      - code: sqlq-having-1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: Quelle est la différence entre WHERE et HAVING ?
        choices:
          - label: WHERE filtre les lignes avant le regroupement, HAVING filtre les groupes après
            correct: true
            why: Oui.
          - label: Aucune, ce sont des synonymes
            correct: false
            why: Ils n'agissent pas au même moment.
          - label: HAVING s'utilise sans GROUP BY uniquement
            correct: false
            why: HAVING s'utilise justement avec les groupes.
        explanation: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.
      - code: sqlq-having-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-agregation
        prompt: Quelle clause peut contenir `COUNT(*) > 2` ?
        choices:
          - label: HAVING
            correct: true
            why: "Oui : c'est une condition sur un groupe."
          - label: WHERE
            correct: false
            why: WHERE s'exécute avant le calcul des agrégats.
          - label: FROM
            correct: false
            why: FROM indique les tables.
        explanation: Une condition qui utilise un agrégat va dans HAVING.
      - code: sqlq-having-3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-agregation
        prompt: Filtrer dans WHERE quand c'est possible (avant de regrouper) est plus efficace que tout filtrer dans HAVING.
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : moins de lignes à regrouper.'
          - label: Faux
            correct: false
            why: "On réduit tôt le volume de données : c'est plus efficace."
        explanation: Conditions sur les lignes → WHERE ; conditions sur les groupes → HAVING.
    exercises:
      - slug: sql-ex-categories-bien-fournies
        kind: SQL
        title: "Catégories bien fournies"
        difficulty: INTERMEDIAIRE
        skill: sql-agregation
        statement: |
          Affiche les **categorie_id** (en excluant les produits sans catégorie) dont le **stock total**
          dépasse **100 unités**, avec ce stock total dans une colonne `stock_total`, du plus grand au plus
          petit.
        criteria: "2 colonnes (categorie_id, stock_total), uniquement les catégories dont le stock total > 100, tri décroissant."
        hints:
          - "WHERE pour exclure les produits sans catégorie, GROUP BY categorie_id, puis un filtre sur le groupe."
          - "La condition sur `SUM(stock)` va dans HAVING."
          - "`GROUP BY categorie_id HAVING SUM(stock) > 100 ORDER BY stock_total DESC`"
        solution: |
          SELECT categorie_id, SUM(stock) AS stock_total
          FROM produits
          WHERE categorie_id IS NOT NULL
          GROUP BY categorie_id
          HAVING SUM(stock) > 100
          ORDER BY stock_total DESC;
        explanation: |
          WHERE agit sur les lignes (produits), HAVING sur les groupes (catégories). La somme des stocks est
          calculée par catégorie, puis seules les catégories dépassant 100 unités sont conservées.
        xp: 20
        payload:
          mode: READ
          ordered: true
          requiredKeywords:
            - pattern: "\\bhaving\\b"
              message: "Le filtre sur le stock total doit utiliser HAVING."

bank:
  - code: sql-c3-b1
    kind: RESULTAT_CODE
    difficulty: 1
    skill: sql-agregation
    prompt: "Combien de lignes renvoie une requête avec des fonctions d'agrégat **sans** GROUP BY ?"
    snippet: |
      SELECT COUNT(*), AVG(prix) FROM produits WHERE prix > 1000;
    language: sql
    choices:
      - label: "Exactement une ligne"
        correct: true
        why: "Sans GROUP BY, toutes les lignes forment un seul groupe, même vide : COUNT vaut 0 et AVG vaut NULL."
      - label: "Aucune ligne, car aucun produit ne coûte plus de 1000 €"
        correct: false
        why: "Un agrégat sans GROUP BY renvoie toujours une ligne, même sur un ensemble vide."
      - label: "Une ligne par produit"
        correct: false
        why: "Les agrégats résument les lignes en une seule."
    explanation: "Sur un ensemble vide : COUNT renvoie 0, et SUM/AVG/MIN/MAX renvoient NULL."
  - code: sql-c3-b2
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-agregation
    prompt: "Quelle requête donne le **nombre total d'articles vendus** (somme des quantités) ?"
    choices:
      - label: "`SELECT SUM(quantite) FROM lignes_commande;`"
        correct: true
        why: "SUM additionne la colonne quantite de toutes les lignes : c'est la base qui fait l'addition."
      - label: "`SELECT COUNT(quantite) FROM lignes_commande;`"
        correct: false
        why: "COUNT compte les lignes, il n'additionne pas les quantités."
      - label: "`SELECT MAX(quantite) FROM lignes_commande;`"
        correct: false
        why: "MAX donne seulement la plus grande quantité."
    explanation: "COUNT compte des lignes, SUM additionne les valeurs d'une colonne : dans les deux cas, c'est PostgreSQL qui calcule."
  - code: sql-c3-b3
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-agregation
    prompt: "Dans quel ordre PostgreSQL évalue-t-il logiquement ces clauses ?"
    choices:
      - label: "FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY"
        correct: true
        why: "C'est l'ordre logique d'exécution, différent de l'ordre d'écriture."
      - label: "SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY"
        correct: false
        why: "C'est l'ordre d'écriture, pas l'ordre d'exécution."
      - label: "FROM, GROUP BY, WHERE, SELECT, HAVING, ORDER BY"
        correct: false
        why: "WHERE agit avant GROUP BY et HAVING après."
    explanation: "Connaître l'ordre logique explique pourquoi un alias n'est pas utilisable dans WHERE mais l'est dans ORDER BY."
  - code: sql-c3-b4
    kind: VRAI_FAUX
    difficulty: 2
    skill: sql-agregation
    prompt: "`SELECT MAX(prix), nom FROM produits;` affiche le nom du produit le plus cher."
    choices:
      - label: "Vrai"
        correct: false
        why: "La requête échoue : nom n'est ni groupé ni agrégé."
      - label: "Faux"
        correct: true
        why: "Pour obtenir ce nom, on utilise `ORDER BY prix DESC LIMIT 1` ou une sous-requête."
    explanation: "Un agrégat résume un groupe ; il ne « pointe » pas vers une ligne précise."
  - code: sql-c3-b5
    kind: COMPLETER_CODE
    difficulty: 2
    skill: sql-agregation
    prompt: "Complète pour obtenir le nombre de commandes par client **et** par statut."
    snippet: |
      SELECT client_id, statut, COUNT(*)
      FROM commandes
      GROUP BY ____;
    language: sql
    answers: ["client_id, statut", "statut, client_id"]
    explanation: "Grouper sur plusieurs colonnes forme un groupe par **combinaison** de valeurs."
  - code: sql-c3-b6
    kind: CHOIX_MULTIPLE
    difficulty: 3
    skill: sql-agregation
    prompt: "Quelles requêtes sont valides en PostgreSQL ? (plusieurs réponses)"
    choices:
      - label: "`SELECT ville, COUNT(*) FROM clients GROUP BY ville ORDER BY COUNT(*) DESC;`"
        correct: true
        why: "ORDER BY peut trier sur un agrégat."
      - label: "`SELECT ville, COUNT(*) AS n FROM clients GROUP BY ville HAVING n > 2;`"
        correct: false
        why: "PostgreSQL n'accepte pas l'alias dans HAVING : il faut répéter COUNT(*)."
      - label: "`SELECT ville, COUNT(*) AS n FROM clients GROUP BY 1 ORDER BY n DESC;`"
        correct: true
        why: "`GROUP BY 1` désigne la 1ʳᵉ colonne du SELECT, et ORDER BY accepte l'alias."
      - label: "`SELECT COUNT(*) FROM clients WHERE COUNT(*) > 2;`"
        correct: false
        why: "Un agrégat est interdit dans WHERE."
    explanation: "En PostgreSQL : alias autorisé dans ORDER BY, interdit dans WHERE et HAVING."
  - code: sql-c3-b7
    kind: RESULTAT_CODE
    difficulty: 2
    skill: sql-agregation
    prompt: "Que fait `AVG` quand une des valeurs est NULL ?"
    snippet: |
      SELECT AVG(x) FROM (VALUES (4), (NULL), (2)) AS t(x);
    language: sql
    choices:
      - label: "Il ignore la valeur NULL et travaille seulement avec les valeurs connues"
        correct: true
        why: "Les fonctions d'agrégat laissent de côté les NULL."
      - label: "Il compte la valeur NULL comme un zéro"
        correct: false
        why: "NULL veut dire « inconnu », pas zéro."
      - label: "Le résultat devient NULL"
        correct: false
        why: "Un seul NULL ne rend pas le résultat NULL : il est ignoré."
    explanation: "Les agrégats (`SUM`, `AVG`, `MIN`, `MAX`, `COUNT(colonne)`) ignorent les NULL. `VALUES` permet de créer une petite table à la volée pour tester."
  - code: sql-c3-b8
    kind: CHOIX_UNIQUE
    difficulty: 3
    skill: sql-agregation
    prompt: "Quelle requête donne le nombre de clients ayant passé **au moins une** commande ?"
    choices:
      - label: "`SELECT COUNT(DISTINCT client_id) FROM commandes;`"
        correct: true
        why: "Chaque client n'est compté qu'une fois, quel que soit son nombre de commandes."
      - label: "`SELECT COUNT(client_id) FROM commandes;`"
        correct: false
        why: "Cela compte les commandes (40), pas les clients."
      - label: "`SELECT COUNT(*) FROM clients;`"
        correct: false
        why: "Cela compte tous les clients, y compris ceux sans commande."
    explanation: "COUNT(DISTINCT ...) est l'outil idéal pour compter des « entités différentes » dans une table de faits."
