slug: ng-typescript-composant
position: 1
level: DEBUTANT
title: "TypeScript et premier composant"
summary: "Donner des types à ses valeurs, décrire un objet avec une interface, créer son premier composant Angular, puis l'utiliser dans une page. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: ng-typescript
    title: "TypeScript : des étiquettes sur les valeurs"
    duration: 9
    objective: "Déclarer des variables typées avec string, number, boolean et string[]."
    prerequisites: "Parcours « Premiers pas en programmation » (variables, listes)."
    skills: [typescript]
    xp: 15
    memo: |
      - **TypeScript** = JavaScript + **types**. Le navigateur exécute ensuite du JavaScript normal.
      - Types de base : `string` (texte), `number` (nombre), `boolean` (vrai/faux), `string[]` (liste de textes).
      - On écrit le type après le nom, derrière deux-points : `let ville: string = "Lyon";`.
      - Les erreurs de type sont signalées **avant** l'exécution, dans l'éditeur.
    commonMistakes: |
      - Écrire `String` ou `Number` avec une majuscule au lieu de `string` et `number`.
      - Utiliser `any` partout : on perd toute l'aide de TypeScript.
    blocks:
      - type: text
        md: |
          En JavaScript, une variable peut contenir n'importe quoi : un texte, puis un nombre, puis une liste.
          **TypeScript** ajoute des **étiquettes** sur les valeurs. Comme les étiquettes sur des bocaux de
          cuisine : si le bocal dit « sucre », on n'y verse pas du sel.
      - type: definition
        id: def-type
        term: "Type"
        md: |
          Le **genre** d'une valeur : `string` pour un texte, `number` pour un nombre, `boolean` pour vrai ou
          faux. On l'écrit après le nom, derrière deux-points.
      - type: code
        id: code-types
        language: typescript
        title: "Des variables avec des étiquettes"
        code: |
          let prenom: string = "Awa";
          let annee: number = 2024;
          let inscrite: boolean = true;
          let langues: string[] = ["français", "anglais"];

          annee = "deux mille"; // Erreur !
        lines:
          - n: 1
            note: "`string` : cette variable contiendra toujours du texte."
          - n: 2
            note: "`number` : un nombre."
          - n: 3
            note: "`boolean` : seulement `true` ou `false`."
          - n: 4
            note: "`string[]` : une liste de textes. Les crochets veulent dire « liste de »."
          - n: 6
            note: "TypeScript souligne cette ligne en rouge **avant** même de lancer le programme."
      - type: callout
        variant: tip
        title: "TypeScript devine souvent tout seul"
        md: |
          Si tu écris `let ville = "Lyon";`, TypeScript comprend que `ville` est un `string`. On appelle ça
          l'**inférence**.
      - type: question
        ref: ng-ts-q1
        review: code-types
      - type: question
        ref: ng-ts-q5
        review: code-types
      - type: text
        md: "**Exercice 1 (guidé)** : donne le bon type à chaque variable."
      - type: exercise
        ref: ng-ex-types-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : déclare trois variables typées."
      - type: exercise
        ref: ng-ex-types-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une majuscule de trop."
      - type: exercise
        ref: ng-ex-types-bug
      - type: jury
        items:
          - q: "Pourquoi utiliser TypeScript plutôt que JavaScript ?"
            a: "Les types détectent beaucoup d'erreurs pendant l'écriture du code, avant l'exécution. L'éditeur propose aussi une meilleure autocomplétion, et le code est plus lisible pour l'équipe."
      - type: quiz
        items:
          - ref: ng-ts-q3
            review: def-type
          - ref: ng-c1-b1
            review: def-type
          - ref: ng-ty-q5
            review: code-types
    questions:
      - code: ng-ts-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Quel type donner à `let ville = \"Nantes\";` ?"
        choices:
          - label: "string"
            correct: true
            why: "C'est un texte."
          - label: "number"
            correct: false
            why: "Ce n'est pas un nombre."
          - label: "boolean"
            correct: false
            why: "Ce n'est pas vrai/faux."
        explanation: "Les guillemets indiquent un texte : `string`."
      - code: ng-ts-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Comment écrire le type « liste de textes » ?"
        choices:
          - label: "string[]"
            correct: true
            why: "Le type, puis des crochets."
          - label: "[string]list"
            correct: false
            why: "Cette écriture n'existe pas."
          - label: "strings"
            correct: false
            why: "Ce n'est pas un type TypeScript."
        explanation: "`string[]` se lit « liste de string »."
      - code: ng-ts-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: typescript
        prompt: "Les types TypeScript vérifient aussi les données reçues d'une API pendant l'exécution."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : les types disparaissent une fois le code transformé en JavaScript."
          - label: "Faux"
            correct: true
            why: "Exact : ils ne servent qu'à l'écriture du code."
        explanation: "Pour vérifier des données reçues, il faut du code de contrôle (et le backend valide aussi)."
      - code: ng-c1-b1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Pourquoi éviter le type `any` ?"
        choices:
          - label: "Il désactive les vérifications de TypeScript sur cette valeur"
            correct: true
            why: "On perd la protection."
          - label: "Il ralentit le navigateur"
            correct: false
            why: "Les types disparaissent à l'exécution."
          - label: "Il est interdit par Angular"
            correct: false
            why: "Il est permis, mais déconseillé."
        explanation: "Préfère un type précis, ou `unknown` si tu ne sais vraiment pas."
      - code: ng-ty-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Quel type pour `let connecte = false;` ?"
        choices:
          - label: "boolean"
            correct: true
            why: "true ou false."
          - label: "string"
            correct: false
            why: "Pas de guillemets : ce n'est pas un texte."
          - label: "number"
            correct: false
            why: "Ce n'est pas un nombre."
        explanation: "true/false → boolean."
    exercises:
      - slug: ng-ex-types-guide
        kind: COMPLETER
        title: "Le bon type pour chaque variable"
        difficulty: FACILE
        skill: typescript
        statement: "Complète chaque variable avec son type."
        criteria: "Les quatre types sont corrects (en minuscules)."
        hints:
          - "Un texte : string."
          - "Vrai ou faux : boolean."
          - "string, number, boolean, string[]."
        solution: '["string", "number", "boolean", "string[]"]'
        explanation: "Les types de base s'écrivent en minuscules."
        xp: 10
        payload:
          language: typescript
          template: |
            let nom: [[1]] = "Café";
            let etage: [[2]] = 3;
            let disponible: [[3]] = true;
            let tags: [[4]] = ["chaud", "boisson"];
          blanks:
            - ["string"]
            - ["number"]
            - ["boolean"]
            - ["string[]", "Array<string>"]
      - slug: ng-ex-types-libre
        kind: CODE_LIBRE
        title: "Trois variables typées"
        difficulty: FACILE
        skill: typescript
        statement: |
          Déclare avec leur type :
          - `titre` qui vaut `"Le Petit Prince"` ;
          - `disponible` qui vaut `true` ;
          - `genres` qui vaut la liste `["conte", "jeunesse"]`.
        criteria: "Trois variables avec les types string, boolean et string[]."
        hints:
          - "`let nom: type = valeur;`"
          - "Une liste de textes : `string[]`."
          - "`let titre: string = \"Le Petit Prince\";`"
        solution: |
          let titre: string = "Le Petit Prince";
          let disponible: boolean = true;
          let genres: string[] = ["conte", "jeunesse"];
        explanation: "Chaque valeur a son étiquette."
        xp: 15
        payload:
          language: typescript
          starter: |
            // Tes trois variables
          checks:
            - pattern: '\btitre\s*:\s*string\s*='
              message: "Déclare titre avec le type string."
            - pattern: '\bdisponible\s*:\s*boolean\s*=\s*true'
              message: "Déclare disponible avec le type boolean."
            - pattern: '\bgenres\s*:\s*(string\[\]|Array<string>)\s*=\s*\['
              message: "Déclare genres avec le type string[]."
      - slug: ng-ex-types-bug
        kind: CORRIGER_ERREUR
        title: "Une majuscule de trop"
        difficulty: FACILE
        skill: typescript
        statement: |
          Les types de base s'écrivent en minuscules. Corrige `String` et `Boolean`.
        criteria: "string et boolean en minuscules."
        hints:
          - "Regarde la première lettre des types."
          - "Les types de base sont en minuscules."
          - "`string` et `boolean`."
        solution: |
          let ville: string = "Lyon";
          let ouvert: boolean = true;
        explanation: "`String` avec majuscule désigne autre chose : on écrit toujours `string`."
        xp: 10
        payload:
          language: typescript
          starter: |
            let ville: String = "Lyon";
            let ouvert: Boolean = true;
          checks:
            - pattern: ':\s*(String|Boolean)\b'
              absent: true
              message: "Écris les types en minuscules."
            - pattern: '\bville\s*:\s*string\b'
              message: "ville : string."
            - pattern: '\bouvert\s*:\s*boolean\b'
              message: "ouvert : boolean."

  # ===================================================================== LEÇON 2
  - slug: ng-interfaces
    title: "Les interfaces et les fonctions typées"
    duration: 10
    objective: "Décrire la forme d'un objet avec une interface et l'utiliser comme type de paramètre."
    prerequisites: "Leçon « TypeScript : des étiquettes sur les valeurs »."
    skills: [typescript]
    xp: 15
    memo: |
      - `interface` : la **forme** d'un objet (ses champs et leurs types).
      - `?` = champ **facultatif** : `telephone?: string;`.
      - Fonction typée : `function fiche(livre: Livre): string { … }` — type du paramètre, puis type du résultat.
      - Tous les champs sans `?` sont obligatoires.
    commonMistakes: |
      - Oublier un champ obligatoire en créant l'objet.
      - Confondre interface (une forme) et classe (qui existe à l'exécution).
    blocks:
      - type: definition
        id: def-interface
        term: "Interface"
        md: |
          Le **plan** d'un objet : la liste de ses champs et leurs types. Comme un formulaire papier vierge
          qui dit quelles cases remplir. Un point d'interrogation `?` marque une case facultative.
      - type: code
        id: code-interface
        language: typescript
        title: "Décrire un livre"
        code: |
          interface Livre {
            id: number;
            titre: string;
            auteur: string;
            emprunte?: boolean;
          }

          function fiche(livre: Livre): string {
            return `${livre.titre}, de ${livre.auteur}`;
          }

          const conte: Livre = { id: 1, titre: "Le Petit Prince", auteur: "Saint-Exupéry" };
          console.log(fiche(conte)); // Le Petit Prince, de Saint-Exupéry
        lines:
          - n: 1
            note: "`interface Livre` : le plan de tout objet « livre »."
          - n: 5
            note: "`emprunte?` : champ facultatif, on peut ne pas le donner."
          - n: 8
            note: "Le paramètre doit être un `Livre`, et la fonction renvoie un texte (`string`)."
          - n: 12
            note: "Si on oublie `titre`, TypeScript refuse."
      - type: question
        ref: ng-ts-q2
        review: def-interface
      - type: question
        ref: ng-ts-q4
        review: code-interface
      - type: text
        md: "**Exercice 1 (guidé)** : complète l'interface."
      - type: exercise
        ref: ng-ex-interface-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une interface et une fonction typée."
      - type: exercise
        ref: ng-ex-interface
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un champ facultatif oublié."
      - type: exercise
        ref: ng-ex-interface-bug
      - type: jury
        items:
          - q: "Quelle différence entre une interface et une classe en TypeScript ?"
            a: "L'interface décrit seulement une forme ; elle disparaît à la compilation. La classe existe à l'exécution : on peut créer des objets avec new et elle contient du code."
      - type: quiz
        items:
          - ref: ng-it-q3
            review: def-interface
          - ref: ng-it-q4
            review: code-interface
          - ref: ng-it-q5
            review: code-interface
    questions:
      - code: ng-ts-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Dans une interface, que signifie `telephone?: string;` ?"
        choices:
          - label: "Le champ est facultatif"
            correct: true
            why: "Le `?` rend le champ optionnel."
          - label: "Le champ est une question"
            correct: false
            why: "Le `?` n'a rien à voir avec une question."
          - label: "Le champ peut contenir n'importe quel type"
            correct: false
            why: "S'il est présent, c'est un `string`."
        explanation: "`?` = on peut ne pas le fournir."
      - code: ng-ts-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: typescript
        prompt: "Que se passe-t-il avec ce code ?"
        snippet: |
          interface Livre { titre: string; auteur: string; }
          const l: Livre = { titre: "Dune" };
        language: typescript
        choices:
          - label: "Erreur : le champ auteur manque"
            correct: true
            why: "auteur n'a pas de `?` : il est obligatoire."
          - label: "Aucune erreur"
            correct: false
            why: "Le plan exige auteur."
          - label: "auteur vaut un texte vide automatiquement"
            correct: false
            why: "TypeScript ne remplit rien tout seul."
        explanation: "Tous les champs sans `?` doivent être présents."
      - code: ng-it-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: typescript
        prompt: "Une interface décrit la forme d'un objet, sans contenir de code à exécuter."
        choices:
          - label: "Vrai"
            correct: true
            why: "Elle n'est qu'un plan."
          - label: "Faux"
            correct: false
            why: "C'est la classe qui contient du code."
        explanation: "Interface = plan ; classe = fabrique d'objets."
      - code: ng-it-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Dans `function fiche(livre: Livre): string`, que veut dire le `string` final ?"
        choices:
          - label: "La fonction renvoie un texte"
            correct: true
            why: "C'est le type du résultat."
          - label: "Le paramètre est un texte"
            correct: false
            why: "Le paramètre est un Livre."
          - label: "La fonction s'appelle string"
            correct: false
            why: "Elle s'appelle fiche."
        explanation: "Type des paramètres entre parenthèses, type du résultat après."
      - code: ng-it-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: typescript
        prompt: "Que se passe-t-il si on appelle `fiche(\"Dune\")` ?"
        choices:
          - label: "TypeScript signale une erreur : un texte n'est pas un Livre"
            correct: true
            why: "Le paramètre doit respecter l'interface."
          - label: "Ça marche"
            correct: false
            why: "Le type du paramètre protège la fonction."
          - label: "Le texte est transformé en Livre"
            correct: false
            why: "Rien n'est transformé automatiquement."
        explanation: "L'interface protège la fonction contre les mauvais arguments."
    exercises:
      - slug: ng-ex-interface-guide
        kind: COMPLETER
        title: "Compléter une interface"
        difficulty: FACILE
        skill: typescript
        statement: "Complète l'interface Salle : le mot-clé, le type du nom, et le symbole qui rend `projecteur` facultatif."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot-clé qui déclare un plan d'objet."
          - "Un nom est un texte ; facultatif s'écrit avec un point d'interrogation."
          - "interface, string, ?."
        solution: '["interface", "string", "?"]'
        explanation: "`projecteur?: boolean` : on peut ne pas le donner."
        xp: 10
        payload:
          language: typescript
          template: |
            [[1]] Salle {
              nom: [[2]];
              projecteur[[3]]: boolean;
            }
          blanks:
            - ["interface"]
            - ["string"]
            - ["?"]
      - slug: ng-ex-interface
        kind: CODE_LIBRE
        title: "Une interface et une fonction typée"
        difficulty: INTERMEDIAIRE
        skill: typescript
        statement: |
          1. Écris une interface `Film` avec : `titre` (texte), `realisatrice` (texte) et `vu` (vrai/faux,
             **facultatif**).
          2. Écris une fonction `resume(film: Film): string` qui renvoie le titre suivi de « , de » et du nom de
             la réalisatrice.
        criteria: "L'interface a les trois champs bien typés ; la fonction est typée et utilise le titre et la réalisatrice."
        hints:
          - "Commence par `interface Film {` et termine chaque champ par un point-virgule."
          - "Le champ facultatif s'écrit `vu?: boolean;`."
          - "``function resume(film: Film): string { return `${film.titre}, de ${film.realisatrice}`; }``"
        solution: |
          interface Film {
            titre: string;
            realisatrice: string;
            vu?: boolean;
          }

          function resume(film: Film): string {
            return `${film.titre}, de ${film.realisatrice}`;
          }
        explanation: "L'interface décrit la forme ; la fonction ne peut recevoir qu'un objet qui respecte cette forme."
        xp: 20
        payload:
          language: typescript
          starter: |
            // 1. L'interface Film


            // 2. La fonction resume
          checks:
            - pattern: 'interface\s+Film\s*\{'
              message: "Déclare `interface Film { … }`."
            - pattern: '\btitre\s*:\s*string'
              message: "titre doit être de type string."
            - pattern: '\brealisatrice\s*:\s*string'
              message: "realisatrice doit être de type string."
            - pattern: '\bvu\s*\?\s*:\s*boolean'
              message: "vu est facultatif : `vu?: boolean`."
            - pattern: 'function\s+resume\s*\(\s*film\s*:\s*Film\s*\)\s*:\s*string'
              message: "Écris la signature `function resume(film: Film): string`."
            - pattern: 'film\.titre[\s\S]*film\.realisatrice'
              message: "Utilise film.titre puis film.realisatrice dans le texte renvoyé."
      - slug: ng-ex-interface-bug
        kind: CORRIGER_ERREUR
        title: "Un champ facultatif oublié"
        difficulty: FACILE
        skill: typescript
        statement: |
          L'objet `alice` n'a pas de téléphone, et TypeScript refuse de le créer. Rends le champ `telephone`
          facultatif dans l'interface.
        criteria: "telephone?: string."
        hints:
          - "Quel symbole rend un champ facultatif ?"
          - "Il se place juste après le nom du champ."
          - "`telephone?: string;`"
        solution: |
          interface Contact {
            nom: string;
            telephone?: string;
          }
          const alice: Contact = { nom: "Alice" };
        explanation: "Le `?` autorise l'absence du champ."
        xp: 10
        payload:
          language: typescript
          starter: |
            interface Contact {
              nom: string;
              telephone: string;
            }
            const alice: Contact = { nom: "Alice" };
          checks:
            - pattern: '\btelephone\s*\?\s*:\s*string'
              message: "Écris telephone?: string."

  # ===================================================================== LEÇON 3
  - slug: ng-composant
    title: "Mon premier composant"
    duration: 11
    objective: "Écrire un composant Angular : sa classe, son sélecteur et un template qui affiche une valeur avec l'interpolation."
    prerequisites: "Leçon « Les interfaces et les fonctions typées »."
    skills: [angular-composants, typescript]
    xp: 15
    memo: |
      - Un **composant** = une brique d'interface : une **classe** TypeScript (les données) + un **template** HTML (l'affichage).
      - `@Component({ selector, template })` : le décorateur qui transforme la classe en composant.
      - `selector: 'app-carte'` : le nom de la balise pour utiliser le composant (`<app-carte />`).
      - `{{ titre }}` : l'**interpolation**, qui affiche la valeur d'une propriété de la classe.
    commonMistakes: |
      - Oublier `export` devant la classe : les autres fichiers ne peuvent pas l'utiliser.
      - Écrire `{{ this.titre }}` : dans le template, on écrit juste `{{ titre }}`.
    blocks:
      - type: text
        md: |
          Regarde une page web : un menu, une barre de recherche, des cartes, un pied de page. Chaque morceau est
          une **brique**. Angular te fait construire chaque brique à part.
      - type: definition
        id: def-composant
        term: "Composant"
        md: |
          Une **brique d'interface** réutilisable. Elle a deux parties, comme une recette : la **liste des
          ingrédients** (la classe, avec ses données) et la **présentation dans l'assiette** (le template HTML).
      - type: code
        id: code-composant
        language: typescript
        title: "carte-livre.component.ts"
        code: |
          import { Component } from '@angular/core';

          @Component({
            selector: 'app-carte-livre',
            template: `
              <h2>{{ titre }}</h2>
              <p>Auteur : {{ auteur }}</p>
            `,
          })
          export class CarteLivreComponent {
            titre = 'Le Petit Prince';
            auteur = 'Saint-Exupéry';
          }
        lines:
          - n: 1
            note: "On importe l'outil `Component` depuis Angular."
          - n: 3
            note: "`@Component` est un **décorateur** : une étiquette qui dit « cette classe est un composant »."
          - n: 4
            note: "Le nom de la balise HTML à utiliser : `<app-carte-livre />`."
          - n: 6
            note: "`{{ titre }}` affiche la valeur de la propriété `titre` de la classe."
          - n: 10
            note: "`export` rend la classe utilisable ailleurs."
          - n: 11
            note: "Les propriétés de la classe sont les données affichées par le template."
      - type: callout
        variant: info
        title: "Template dans un fichier séparé"
        md: |
          Pour un grand template, on utilise `templateUrl: './carte-livre.component.html'` et on met le HTML dans
          son propre fichier. Le style se met dans `styleUrl`.
      - type: question
        ref: ng-cp-q1
        review: code-composant
      - type: question
        ref: ng-cp-q3
        review: code-composant
      - type: text
        md: "**Exercice 1 (guidé)** : complète ce composant."
      - type: exercise
        ref: ng-ex-composant-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : écris un composant complet."
      - type: exercise
        ref: ng-ex-composant
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un `this` de trop."
      - type: exercise
        ref: ng-ex-composant-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'un composant Angular ?"
            a: "Une brique d'interface réutilisable : une classe TypeScript qui porte les données, associée à un template HTML et à des styles. Le décorateur @Component déclare son sélecteur et son template."
      - type: quiz
        items:
          - ref: ng-cp-q4
            review: def-composant
          - ref: ng-co-q4
            review: code-composant
          - ref: ng-co-q5
            review: code-composant
    questions:
      - code: ng-cp-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans le template, comment afficher la propriété `prenom` de la classe ?"
        choices:
          - label: "{{ prenom }}"
            correct: true
            why: "C'est l'interpolation."
          - label: "{{ this.prenom }}"
            correct: false
            why: "Pas de `this` dans le template."
          - label: "$prenom"
            correct: false
            why: "Ce n'est pas la syntaxe d'Angular."
        explanation: "Double accolade = afficher une valeur."
      - code: ng-cp-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "À quoi sert `selector: 'app-menu'` ?"
        choices:
          - label: "À donner le nom de la balise qui affiche le composant"
            correct: true
            why: "On écrira `<app-menu />`."
          - label: "À choisir la couleur du menu"
            correct: false
            why: "C'est le rôle du style."
          - label: "À sélectionner des éléments dans la base de données"
            correct: false
            why: "Aucun rapport."
        explanation: "Le sélecteur est le nom de balise du composant."
      - code: ng-cp-q4
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: angular-composants
        prompt: "Qu'est-ce qui compose un composant Angular ? (plusieurs réponses)"
        choices:
          - label: "Une classe TypeScript"
            correct: true
            why: "Elle porte les données."
          - label: "Un template HTML"
            correct: true
            why: "Il décrit l'affichage."
          - label: "Le décorateur @Component"
            correct: true
            why: "Il relie le tout."
          - label: "Une table SQL"
            correct: false
            why: "La base est côté serveur."
        explanation: "Classe + template (+ styles), reliés par @Component."
      - code: ng-co-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Pourquoi écrire `export` devant la classe du composant ?"
        choices:
          - label: "Pour que les autres fichiers puissent l'utiliser"
            correct: true
            why: "Sans export, elle reste enfermée dans son fichier."
          - label: "Pour l'envoyer au serveur"
            correct: false
            why: "Rien n'est envoyé."
          - label: "Pour l'afficher en gras"
            correct: false
            why: "Aucun rapport avec le style."
        explanation: "export = rendre disponible ailleurs."
      - code: ng-co-q5
        kind: RESULTAT_CODE
        difficulty: 1
        skill: angular-composants
        prompt: "Qu'affiche ce template ?"
        snippet: |
          // classe : ville = 'Lyon';
          <p>Ville : {{ ville }}</p>
        language: typescript
        choices:
          - label: "Ville : Lyon"
            correct: true
            why: "L'interpolation remplace {{ ville }} par sa valeur."
          - label: "Ville : {{ ville }}"
            correct: false
            why: "Angular remplace les doubles accolades."
          - label: "Ville : ville"
            correct: false
            why: "On affiche la valeur, pas le nom."
        explanation: "{{ }} affiche la valeur de la propriété."
    exercises:
      - slug: ng-ex-composant-guide
        kind: COMPLETER
        title: "Compléter un composant"
        difficulty: FACILE
        skill: angular-composants
        statement: "Complète ce composant qui affiche un message de bienvenue."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Le décorateur s'appelle Component."
          - "Le nom de la balise se déclare dans selector."
          - "Component, selector, message, export."
        solution: '["Component", "selector", "message", "export"]'
        explanation: "Décorateur, sélecteur, interpolation et export : les quatre bases d'un composant."
        xp: 10
        payload:
          language: typescript
          template: |
            @[[1]]({
              [[2]]: 'app-accueil',
              template: `<p>{{ [[3]] }}</p>`,
            })
            [[4]] class AccueilComponent {
              message = 'Bienvenue !';
            }
          blanks:
            - ["Component"]
            - ["selector"]
            - ["message"]
            - ["export"]
      - slug: ng-ex-composant
        kind: CODE_LIBRE
        title: "Écrire le composant profil"
        difficulty: INTERMEDIAIRE
        skill: angular-composants
        statement: |
          Écris un composant `ProfilComponent` :
          - sélecteur `app-profil` ;
          - deux propriétés : `prenom = 'Awa'` et `ville = 'Lyon'` ;
          - un template qui affiche `<h2>` avec le prénom et `<p>` avec la ville, grâce à l'interpolation.
        criteria: "Décorateur, sélecteur, classe exportée, deux propriétés et deux interpolations."
        hints:
          - "Commence par `import { Component } from '@angular/core';`."
          - "Le template s'écrit entre accents graves (la touche Alt Gr + 7) et contient `<h2>{{ prenom }}</h2>`."
          - "Termine par `export class ProfilComponent { prenom = 'Awa'; ville = 'Lyon'; }`."
        solution: |
          import { Component } from '@angular/core';

          @Component({
            selector: 'app-profil',
            template: `
              <h2>{{ prenom }}</h2>
              <p>{{ ville }}</p>
            `,
          })
          export class ProfilComponent {
            prenom = 'Awa';
            ville = 'Lyon';
          }
        explanation: "Chaque propriété de la classe peut être affichée dans le template avec `{{ }}`."
        xp: 20
        payload:
          language: typescript
          starter: |
            import { Component } from '@angular/core';

          checks:
            - pattern: '@Component\s*\(\s*\{'
              message: "Ajoute le décorateur `@Component({ … })`."
            - pattern: 'selector\s*:\s*[''"`]app-profil[''"`]'
              message: "Le sélecteur doit être 'app-profil'."
            - pattern: 'export\s+class\s+ProfilComponent'
              message: "Déclare `export class ProfilComponent`."
            - pattern: '\bprenom\s*(?::\s*string\s*)?=\s*[''"]Awa[''"]'
              message: "Ajoute la propriété `prenom = 'Awa'`."
            - pattern: '\bville\s*(?::\s*string\s*)?=\s*[''"]Lyon[''"]'
              message: "Ajoute la propriété `ville = 'Lyon'`."
            - pattern: '<h2>\s*\{\{\s*prenom\s*\}\}\s*</h2>'
              message: "Affiche le prénom dans un `<h2>` avec `{{ prenom }}`."
            - pattern: '<p>\s*\{\{\s*ville\s*\}\}\s*</p>'
              message: "Affiche la ville dans un `<p>` avec `{{ ville }}`."
      - slug: ng-ex-composant-bug
        kind: CORRIGER_ERREUR
        title: "Un this de trop"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Dans un template, on n'écrit pas `this.`. Corrige l'interpolation.
        criteria: "{{ titre }} sans this."
        hints:
          - "Le template voit directement les propriétés de la classe."
          - "Retire `this.`."
          - "`<h1>{{ titre }}</h1>`"
        solution: |
          @Component({
            selector: 'app-titre',
            template: `<h1>{{ titre }}</h1>`,
          })
          export class TitreComponent {
            titre = 'Bibliothèque';
          }
        explanation: "Dans le template, on écrit juste le nom de la propriété."
        xp: 10
        payload:
          language: typescript
          starter: |
            @Component({
              selector: 'app-titre',
              template: `<h1>{{ this.titre }}</h1>`,
            })
            export class TitreComponent {
              titre = 'Bibliothèque';
            }
          checks:
            - pattern: '\{\{\s*this\.'
              absent: true
              message: "Retire `this.` dans le template."
            - pattern: '\{\{\s*titre\s*\}\}'
              message: "Écris {{ titre }}."

  # ===================================================================== LEÇON 4
  - slug: ng-imports-composants
    title: "Utiliser un composant dans un autre"
    duration: 9
    objective: "Placer un composant dans la page d'un autre grâce à imports et à sa balise."
    prerequisites: "Leçon « Mon premier composant »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - Pour utiliser un composant dans un autre : l'ajouter dans `imports: [...]`, puis écrire sa **balise** dans le template.
      - Depuis Angular 17+, les composants sont **standalone** : chacun déclare lui-même ses `imports`.
      - Un même composant peut être affiché **plusieurs fois**.
    commonMistakes: |
      - Utiliser la balise sans ajouter le composant aux `imports` : erreur « is not a known element ».
      - Mettre le nom de la classe dans le template au lieu de la balise.
    blocks:
      - type: definition
        id: def-imports
        term: "Utiliser un composant dans un autre"
        md: |
          Pour placer la carte dans une page, on ajoute la classe dans les `imports` de la page, puis on écrit sa
          balise dans le template : c'est comme **ranger un outil dans sa boîte** avant de s'en servir.
      - type: code
        id: code-imports
        language: typescript
        title: "La page catalogue utilise la carte"
        code: |
          @Component({
            selector: 'app-catalogue',
            imports: [CarteLivreComponent],
            template: `
              <h1>Catalogue</h1>
              <app-carte-livre />
            `,
          })
          export class CatalogueComponent {}
        lines:
          - n: 3
            note: "On déclare les briques utilisées par ce template."
          - n: 6
            note: "La balise affiche le composant carte à cet endroit."
      - type: question
        ref: ng-cp-q2
        review: def-imports
      - type: question
        ref: ng-cp-q5
        review: code-imports
      - type: text
        md: "**Exercice 1 (guidé)** : complète la page."
      - type: exercise
        ref: ng-ex-imports-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une page d'accueil qui assemble deux briques."
      - type: exercise
        ref: ng-ex-imports-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un composant inconnu."
      - type: exercise
        ref: ng-ex-imports-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'un composant standalone ?"
            a: "Un composant qui déclare lui-même ses dépendances dans imports, sans NgModule. C'est le mode par défaut depuis Angular 17 ; ça simplifie la structure et permet le chargement différé par route."
      - type: quiz
        items:
          - ref: ng-c1-b2
            review: def-imports
          - ref: ng-im-q4
            review: code-imports
          - ref: ng-im-q5
            review: def-imports
    questions:
      - code: ng-cp-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "La page affiche une erreur « 'app-carte' is not a known element ». Pourquoi ?"
        choices:
          - label: "Le composant carte n'est pas dans les imports de la page"
            correct: true
            why: "Il faut l'ajouter à `imports`."
          - label: "Le navigateur est trop ancien"
            correct: false
            why: "C'est une erreur de compilation d'Angular."
          - label: "Il manque un point-virgule"
            correct: false
            why: "Le message parle d'un élément inconnu."
        explanation: "Un composant utilisé dans un template doit être importé."
      - code: ng-cp-q5
        kind: TEXTE
        difficulty: 2
        skill: angular-composants
        prompt: "Dans `@Component({ … })`, quel champ liste les composants utilisés par le template ? (un seul mot)"
        answers: ["imports"]
        explanation: "`imports: [CarteLivreComponent]` rend la balise utilisable."
      - code: ng-c1-b2
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-composants
        prompt: "Un même composant peut être affiché plusieurs fois dans une page."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est tout l'intérêt d'une brique réutilisable."
          - label: "Faux"
            correct: false
            why: "On peut écrire sa balise autant de fois que nécessaire."
        explanation: "Une liste de livres affiche le même composant carte pour chaque livre."
      - code: ng-im-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans le template de la page, comment afficher `CarteLivreComponent` (sélecteur `app-carte-livre`) ?"
        choices:
          - label: "`<app-carte-livre />`"
            correct: true
            why: "On utilise la balise du sélecteur."
          - label: "`<CarteLivreComponent />`"
            correct: false
            why: "C'est le nom de la classe, pas la balise."
          - label: "`{{ CarteLivreComponent }}`"
            correct: false
            why: "L'interpolation affiche une valeur."
        explanation: "Classe dans imports, balise dans le template."
      - code: ng-im-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Que veut dire « composant standalone » ?"
        choices:
          - label: "Il déclare lui-même, dans imports, les briques qu'il utilise"
            correct: true
            why: "Sans NgModule."
          - label: "Il ne peut pas être utilisé dans un autre composant"
            correct: false
            why: "Il peut l'être, via imports."
          - label: "Il fonctionne sans navigateur"
            correct: false
            why: "Aucun rapport."
        explanation: "Standalone = autonome pour ses dépendances."
    exercises:
      - slug: ng-ex-imports-guide
        kind: COMPLETER
        title: "Compléter la page"
        difficulty: FACILE
        skill: angular-composants
        statement: "La page Accueil affiche le composant `MenuComponent` (sélecteur `app-menu`). Complète."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Le champ qui liste les briques utilisées."
          - "La balise vient du sélecteur."
          - "imports, app-menu."
        solution: '["imports", "app-menu"]'
        explanation: "On importe la classe, on écrit la balise."
        xp: 10
        payload:
          language: typescript
          template: |
            @Component({
              selector: 'app-accueil',
              [[1]]: [MenuComponent],
              template: `<[[2]] />`,
            })
            export class AccueilComponent {}
          blanks:
            - ["imports"]
            - ["app-menu"]
      - slug: ng-ex-imports-libre
        kind: CODE_LIBRE
        title: "Assembler deux briques"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Écris le décorateur de `PageAccueilComponent` (sélecteur `app-page-accueil`). Son template affiche
          `<app-entete />` puis `<app-pied-page />`. Les classes s'appellent `EnteteComponent` et
          `PiedPageComponent`.
        criteria: "Les deux classes dans imports, les deux balises dans le template."
        hints:
          - "`imports: [EnteteComponent, PiedPageComponent]`"
          - "Le template contient les deux balises."
          - "N'oublie pas `export class PageAccueilComponent {}`."
        solution: |
          @Component({
            selector: 'app-page-accueil',
            imports: [EnteteComponent, PiedPageComponent],
            template: `
              <app-entete />
              <app-pied-page />
            `,
          })
          export class PageAccueilComponent {}
        explanation: "Une page est un assemblage de briques."
        xp: 15
        payload:
          language: typescript
          starter: |
            @Component({

            })
            export class PageAccueilComponent {}
          checks:
            - pattern: 'selector\s*:\s*[''"`]app-page-accueil[''"`]'
              message: "Le sélecteur doit être 'app-page-accueil'."
            - pattern: 'imports\s*:\s*\[[^\]]*EnteteComponent'
              message: "Ajoute EnteteComponent dans imports."
            - pattern: 'imports\s*:\s*\[[^\]]*PiedPageComponent'
              message: "Ajoute PiedPageComponent dans imports."
            - pattern: '<app-entete\s*/?>[\s\S]*<app-pied-page\s*/?>'
              message: "Écris <app-entete /> puis <app-pied-page /> dans le template."
      - slug: ng-ex-imports-bug
        kind: CORRIGER_ERREUR
        title: "Un composant inconnu"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          La page affiche l'erreur « 'app-carte-livre' is not a known element ». Ajoute ce qui manque.
        criteria: "CarteLivreComponent est dans imports."
        hints:
          - "Relis le message : l'élément est inconnu."
          - "La page doit déclarer les briques qu'elle utilise."
          - "`imports: [CarteLivreComponent],`"
        solution: |
          @Component({
            selector: 'app-catalogue',
            imports: [CarteLivreComponent],
            template: `<app-carte-livre />`,
          })
          export class CatalogueComponent {}
        explanation: "Sans imports, Angular ne connaît pas la balise."
        xp: 10
        payload:
          language: typescript
          starter: |
            @Component({
              selector: 'app-catalogue',
              template: `<app-carte-livre />`,
            })
            export class CatalogueComponent {}
          checks:
            - pattern: 'imports\s*:\s*\[[^\]]*CarteLivreComponent'
              message: "Ajoute CarteLivreComponent dans imports."

