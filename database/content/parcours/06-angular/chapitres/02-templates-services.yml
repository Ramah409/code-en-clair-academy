        solution: '["for", "track", "empty"]'
        explanation: "`@for … track … @empty`."
        xp: 10
        payload:
          language: html
          template: |
            <ul>
              @[[1]] (t of taches; [[2]] t.id) {
                <li>{{ t.titre }}</li>
              } @[[3]] {
                <li>Rien à faire.</li>
              }
            </ul>
          blanks:
            - ["for"]
            - ["track"]
            - ["empty"]
      - slug: ng-ex-for-libre
        kind: CODE_LIBRE
        title: "La liste des salles"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Écris un `<ul>` qui affiche, pour chaque salle `s` de la liste `salles`, un `<li>` avec `{{ s.nom }}`.
          Utilise `track s.id`, et affiche `<li>Aucune salle.</li>` si la liste est vide.
        criteria: "@for avec track et @empty."
        hints:
          - "`@for (s of salles; track s.id) { … }`"
          - "`<li>{{ s.nom }}</li>`"
          - "`} @empty { <li>Aucune salle.</li> }`"
        solution: |
          <ul>
            @for (s of salles; track s.id) {
              <li>{{ s.nom }}</li>
            } @empty {
