  # ===================================================================== LEÇON 8
  - slug: ng-output
    title: "Prévenir le parent : output()"
    duration: 10
    objective: "Faire remonter un événement de l'enfant vers le parent avec output() et emit()."
    prerequisites: "Leçon « Recevoir une donnée du parent : input() »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - Dans l'enfant : `choisi = output<string>();` puis `this.choisi.emit(valeur)`.
      - Dans le parent : `<app-carte (choisi)="ouvrir($event)" />`.
      - `$event` contient la valeur envoyée par `emit`.
      - input **descend** (parent → enfant), output **remonte** (enfant → parent).
    commonMistakes: |
      - Oublier `emit` : le parent n'est jamais prévenu.
      - Utiliser des crochets côté parent : un output s'écoute avec des parenthèses.
    blocks:
      - type: definition
        id: def-output
        term: "output()"
        md: |
          La **sonnette** de l'enfant : quand il se passe quelque chose, il sonne (`emit`) et le parent, qui
          écoute, vient voir ce qu'on lui apporte (`$event`).
      - type: code
        id: code-input-output
        language: typescript
        title: "Une carte qui prévient sa page"
        code: |
          export class CarteLivreComponent {
            titre = input.required<string>();
            emprunt = output<string>();

            clic() {
              this.emprunt.emit(this.titre());
            }
          }

          // Dans le template du parent :
          // <app-carte-livre [titre]="l.titre" (emprunt)="emprunter($event)" />
        lines:
          - n: 3
            note: "`output` : l'enfant pourra émettre un événement `emprunt`."
          - n: 6
            note: "`emit` envoie le titre au parent."
          - n: 11
            note: "Le parent donne `[titre]` et écoute `(emprunt)` ; `$event` contient le titre envoyé."
      - type: question
        ref: ng-sg-q2
        review: def-output
      - type: question
        ref: ng-sg-q4
        review: code-input-output
      - type: text
        md: "**Exercice 1 (guidé)** : complète l'émission."
      - type: exercise
        ref: ng-ex-output-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une carte de tâche."
      - type: exercise
        ref: ng-ex-input-output
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un parent qui n'écoute pas."
      - type: exercise
        ref: ng-ex-output-bug
      - type: jury
        items:
          - q: "Comment deux composants communiquent-ils ?"
            a: "Du parent vers l'enfant avec input, de l'enfant vers le parent avec output et emit. Entre composants éloignés, on passe par un service partagé qui contient des signaux."
      - type: quiz
        items:
          - ref: ng-ou-q3
            review: def-output
          - ref: ng-ou-q4
            review: code-input-output
          - ref: ng-ou-q5
            review: def-output
    questions:
      - code: ng-sg-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Un enfant doit prévenir son parent qu'un bouton a été cliqué. Qu'utilise-t-il ?"
        choices:
          - label: "output() et emit()"
            correct: true
