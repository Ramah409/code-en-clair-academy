          template: |
            // Enfant
            nom = [[1]].required<string>();
            // template de l'enfant : <p>{{ [[2]] }}</p>

            // Parent
            // <app-badge [[3]]="utilisatrice.prenom" />
          blanks:
            - ["input"]
