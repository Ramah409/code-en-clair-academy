  - code: ng-c2-b2
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: angular-services
    prompt: "Comment partager une donnée entre deux composants qui n'ont aucun lien parent-enfant ?"
    choices:
      - label: "Avec un service injecté dans les deux composants"
        correct: true
        why: "Le service tient l'état commun."
      - label: "Avec input()"
        correct: false
        why: "input suppose un lien parent-enfant."
      - label: "En copiant la donnée dans chaque composant"
        correct: false
        why: "Les copies finiraient par diverger."
