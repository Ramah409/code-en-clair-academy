            - ["[nom]"]
      - slug: ng-ex-input-libre
        kind: CODE_LIBRE
        title: "Une carte de salle"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          1. Écris la classe `CarteSalleComponent` (sans le décorateur) avec un input **obligatoire** `nom` de
             type `string`.
