          - "On crée une boîte avec signal."
          - "On remplace la valeur avec set ; on la lit avec des parenthèses."
          - "signal, set, ville()."
        solution: '["signal", "set", "ville()"]'
        explanation: "signal pour créer, set pour remplacer, () pour lire."
