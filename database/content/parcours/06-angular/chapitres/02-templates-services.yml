  # ===================================================================== LEÇON 6
  - slug: ng-computed
    title: "Une valeur qui se déduit : computed"
    duration: 9
    objective: "Créer une valeur dérivée d'autres signaux avec computed, qui se met à jour toute seule."
    prerequisites: "Leçon « Les signaux : une boîte qui prévient »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - `computed(() => …)` : une valeur **déduite** d'autres signaux, recalculée automatiquement quand ils changent.
      - On la lit comme un signal : `message()`.
      - On ne la modifie pas avec `set` : on modifie ses **sources**.
    commonMistakes: |
      - Vouloir appeler `set` sur un computed.
      - Oublier de lire les signaux sources avec des parenthèses dans le computed.
    blocks:
      - type: definition
        id: def-computed
        term: "computed"
        md: |
          Un **panneau d'affichage** relié à d'autres boîtes : dès qu'une boîte change, le panneau se réécrit
          tout seul. On ne peint jamais le panneau à la main.
      - type: code
        id: code-computed
        language: typescript
        title: "Un message de bienvenue qui suit le prénom"
        code: |
          prenom = signal('Awa');
          bienvenue = computed(() => `Bonjour ${this.prenom()} !`);

          changer() {
            this.prenom.set('Léo');
          }
          // template : <p>{{ bienvenue() }}</p>
        lines:
          - n: 2
            note: "`computed` lit `prenom()` : il se reconstruit dès que prenom change."
          - n: 5
            note: "On change la source ; le message suit tout seul."
      - type: question
        ref: ng-sg-q3
        review: code-computed
      - type: question
        ref: ng-cm-q2
        review: def-computed
      - type: text
        md: "**Exercice 1 (guidé)** : un message à signaux."
      - type: exercise
        ref: ng-ex-signal-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un libellé de statut."
      - type: exercise
        ref: ng-ex-computed-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un computed qu'on veut modifier."
      - type: exercise
        ref: ng-ex-computed-bug
      - type: quiz
        items:
          - ref: ng-cm-q3
            review: def-computed
          - ref: ng-cm-q4
            review: code-computed
          - ref: ng-cm-q5
            review: code-computed
    questions:
      - code: ng-sg-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: angular-composants
        prompt: "Que vaut `salutation()` à la fin ?"
        snippet: |
          const prenom = signal('Awa');
          const salutation = computed(() => `Bonjour ${prenom()}`);
          prenom.set('Léo');
        language: typescript
        choices:
          - label: "Bonjour Léo"
            correct: true
            why: "computed se reconstruit avec la nouvelle valeur « Léo »."
          - label: "Bonjour Awa"
            correct: false
            why: "computed n'est pas figé à la première valeur."
          - label: "Une erreur"
            correct: false
            why: "Ce code est correct."
        explanation: "Une valeur déduite suit toujours ses sources."
      - code: ng-cm-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "À quoi sert `computed` ?"
        choices:
          - label: "À créer une valeur déduite d'autres signaux, mise à jour toute seule"
            correct: true
            why: "Le panneau relié aux boîtes."
          - label: "À écouter un clic"
            correct: false
            why: "C'est (click)."
          - label: "À répéter un morceau de template"
            correct: false
            why: "C'est @for."
        explanation: "computed = valeur dérivée."
      - code: ng-cm-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-composants
        prompt: "On peut appeler `set` sur une valeur créée avec `computed`."
        choices:
          - label: "Vrai"
            correct: false
            why: "Un computed n'a pas de set."
          - label: "Faux"
            correct: true
            why: "On modifie ses sources."
        explanation: "On change la source, pas le panneau."
      - code: ng-cm-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Comment lire le computed `bienvenue` dans le template ?"
        choices:
          - label: "{{ bienvenue() }}"
            correct: true
            why: "Comme un signal."
          - label: "{{ bienvenue }}"
            correct: false
            why: "Il manque les parenthèses."
          - label: "{{ computed(bienvenue) }}"
            correct: false
            why: "On appelle directement bienvenue()."
        explanation: "Signal ou computed : on lit avec ()."
      - code: ng-cm-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Dans `computed(() => this.prenom().toUpperCase())`, quand la valeur change-t-elle ?"
        choices:
          - label: "Chaque fois que prenom change"
            correct: true
            why: "computed suit les signaux qu'il lit."
          - label: "Jamais"
            correct: false
            why: "Il suit sa source."
          - label: "Seulement au rechargement de la page"
            correct: false
            why: "La mise à jour est immédiate."
        explanation: "computed lit prenom() : il dépend de prenom."
    exercises:
      - slug: ng-ex-signal-guide
        kind: COMPLETER
        title: "Un message à signaux"
        difficulty: FACILE
        skill: angular-composants
        statement: "Complète : créer le signal, fabriquer un message déduit, changer le prénom, afficher le message."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "On crée une boîte avec signal('Awa')."
          - "Une valeur déduite : computed. Remplacer la valeur : set."
          - "signal, computed, set, message."
        solution: '["signal", "computed", "set", "message"]'
        explanation: "signal pour stocker, computed pour déduire, set pour remplacer la valeur."
        xp: 10
        payload:
          language: typescript
          template: |
            prenom = [[1]]('Awa');
            message = [[2]](() => `Bienvenue ${this.prenom()} !`);

            changer(nouveau: string) {
              this.prenom.[[3]](nouveau);
            }
            // template : <p>{{ [[4]]() }}</p>
          blanks:
            - ["signal"]
            - ["computed"]
            - ["set"]
            - ["message"]
      - slug: ng-ex-computed-libre
        kind: CODE_LIBRE
        title: "Un libellé de statut"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          La classe a un signal `connecte = signal(false);`. Crée un computed `statut` qui vaut `'En ligne'`
          si `connecte()` est vrai, sinon `'Hors ligne'`.
        criteria: "computed qui lit connecte() et renvoie l'un des deux textes."
        hints:
          - "`statut = computed(() => …);`"
          - "Utilise la condition courte : `condition ? a : b`."
          - "`statut = computed(() => this.connecte() ? 'En ligne' : 'Hors ligne');`"
        solution: |
          connecte = signal(false);
          statut = computed(() => this.connecte() ? 'En ligne' : 'Hors ligne');
        explanation: "Le libellé suit la connexion, sans jamais être écrit à la main."
        xp: 15
        payload:
          language: typescript
          starter: |
            connecte = signal(false);
          checks:
            - pattern: '\bstatut\s*=\s*computed\s*\(\s*\(\s*\)\s*=>'
              message: "Déclare statut = computed(() => …)."
            - pattern: 'this\.connecte\(\)'
              message: "Lis la source avec this.connecte()."
            - pattern: '[''"]En ligne[''"][\s\S]*[''"]Hors ligne[''"]'
              message: "Renvoie 'En ligne' ou 'Hors ligne'."
      - slug: ng-ex-computed-bug
        kind: CORRIGER_ERREUR
        title: "Un computed qu'on veut modifier"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          On ne peut pas appeler `set` sur un computed. Pour changer le message, modifie plutôt sa source :
          `this.prenom.set('Léo');`.
        criteria: "set est appelé sur prenom, pas sur bienvenue."
        hints:
          - "bienvenue est déduit de prenom."
          - "On change la source."
          - "`this.prenom.set('Léo');`"
        solution: |
          prenom = signal('Awa');
          bienvenue = computed(() => `Bonjour ${this.prenom()} !`);

          changer() {
            this.prenom.set('Léo');
          }
        explanation: "Le computed suit tout seul."
        xp: 10
        payload:
          language: typescript
          starter: |
            prenom = signal('Awa');
            bienvenue = computed(() => `Bonjour ${this.prenom()} !`);

            changer() {
              this.bienvenue.set('Bonjour Léo !');
            }
          checks:
            - pattern: 'bienvenue\.set'
              absent: true
              message: "On n'appelle pas set sur un computed."
            - pattern: 'this\.prenom\.set\s*\(\s*[''"]Léo[''"]\s*\)'
              message: "Écris this.prenom.set('Léo');"

  # ===================================================================== LEÇON 7
  - slug: ng-input
    title: "Recevoir une donnée du parent : input()"
    duration: 10
    objective: "Faire passer une donnée d'un composant parent à un composant enfant avec input()."
    prerequisites: "Leçon « Une valeur qui se déduit : computed »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - Un composant **parent** contient un composant **enfant** dans son template.
      - Dans l'enfant : `titre = input.required<string>();` (obligatoire) ou `input('')` (avec valeur par défaut).
      - Dans le parent : `<app-carte [titre]="l.titre" />`.
      - L'enfant lit la donnée comme un signal : `titre()`. Il ne la modifie pas : elle appartient au parent.
    commonMistakes: |
      - Oublier les crochets côté parent : l'enfant reçoit un texte fixe.
      - Vouloir modifier un `input()` depuis l'enfant.
    blocks:
      - type: definition
        id: def-input
        term: "input()"
        md: |
          Le **facteur** : le parent confie une lettre (la donnée) à l'enfant. L'enfant peut la lire, mais
          c'est le parent qui l'écrit.
      - type: code
        id: code-input
        language: typescript
        title: "Une carte qui reçoit son titre"
        code: |
          @Component({
            selector: 'app-carte-livre',
            template: `<h2>{{ titre() }}</h2>`,
          })
          export class CarteLivreComponent {
            titre = input.required<string>();
          }

          // Dans le template du parent :
          // @for (l of livres; track l.id) {
          //   <app-carte-livre [titre]="l.titre" />
          // }
        lines:
          - n: 3
            note: "L'enfant lit la donnée comme un signal : `titre()`."
          - n: 6
            note: "`input.required` : le parent **doit** fournir un titre."
          - n: 11
            note: "Le parent donne la valeur avec des crochets : `[titre]`."
      - type: question
        ref: ng-in-q1
        review: def-input
      - type: question
        ref: ng-in-q2
        review: code-input
      - type: text
        md: "**Exercice 1 (guidé)** : complète l'enfant et le parent."
      - type: exercise
        ref: ng-ex-input-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une carte de salle."
      - type: exercise
        ref: ng-ex-input-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un input jamais ouvert."
      - type: exercise
        ref: ng-ex-input-bug
      - type: quiz
        items:
          - ref: ng-in-q3
            review: def-input
          - ref: ng-in-q4
            review: code-input
          - ref: ng-in-q5
            review: code-input
    questions:
      - code: ng-in-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans quel sens va une donnée passée avec `input()` ?"
        choices:
          - label: "Du parent vers l'enfant"
            correct: true
            why: "Le parent confie la donnée."
          - label: "De l'enfant vers le parent"
            correct: false
            why: "Ce serait output."
          - label: "Du serveur vers la base"
            correct: false
            why: "Aucun rapport."
        explanation: "input descend."
      - code: ng-in-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Côté parent, comment donner le titre `l.titre` à `<app-carte-livre>` ?"
        choices:
          - label: "`<app-carte-livre [titre]=\"l.titre\" />`"
            correct: true
            why: "Crochets : une valeur vers l'enfant."
          - label: "`<app-carte-livre (titre)=\"l.titre\" />`"
            correct: false
            why: "Les parenthèses écoutent un événement."
          - label: "`<app-carte-livre titre=\"l.titre\" />`"
            correct: false
            why: "Ce serait le texte « l.titre »."
        explanation: "Comme une liaison de propriété."
      - code: ng-in-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-composants
        prompt: "L'enfant peut modifier un `input()` avec `set`."
        choices:
          - label: "Vrai"
            correct: false
            why: "La donnée appartient au parent."
          - label: "Faux"
            correct: true
            why: "L'enfant la lit seulement."
        explanation: "Le parent écrit, l'enfant lit."
      - code: ng-in-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans l'enfant, comment afficher l'input `titre` ?"
        choices:
          - label: "{{ titre() }}"
            correct: true
            why: "Un input se lit comme un signal."
          - label: "{{ titre }}"
            correct: false
            why: "Il manque les parenthèses."
          - label: "{{ input.titre }}"
