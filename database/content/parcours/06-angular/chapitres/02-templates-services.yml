      - slug: ng-ex-input-output
        kind: CODE_LIBRE
        title: "Une carte de tâche"
        difficulty: INTERMEDIAIRE
        skill: angular-composants
        statement: |
          Écris la classe `CarteTacheComponent` (sans le décorateur) :
          - un `input` **obligatoire** `titre` de type `string` ;
          - un `output` `terminee` de type `string` ;
          - une méthode `terminer()` qui émet le titre.
        criteria: "input.required<string>, output<string>, méthode terminer qui appelle emit avec le titre lu."
        hints:
          - "`titre = input.required<string>();`"
          - "`terminee = output<string>();`"
          - "Dans terminer : `this.terminee.emit(this.titre());`"
        solution: |
          export class CarteTacheComponent {
            titre = input.required<string>();
            terminee = output<string>();

            terminer() {
              this.terminee.emit(this.titre());
            }
          }
        explanation: "Le parent écrira `<app-carte-tache [titre]=\"t.titre\" (terminee)=\"fermer($event)\" />`."
        xp: 20
        payload:
          language: typescript
          starter: |
            export class CarteTacheComponent {

            }
          checks:
            - pattern: '\btitre\s*=\s*input\.required\s*<\s*string\s*>\s*\(\s*\)'
              message: "Déclare `titre = input.required<string>();`."
            - pattern: '\bterminee\s*=\s*output\s*<\s*string\s*>\s*\(\s*\)'
              message: "Déclare `terminee = output<string>();`."
            - pattern: '\bterminer\s*\(\s*\)\s*(?::\s*void\s*)?\{'
              message: "Écris la méthode `terminer()`."
            - pattern: 'this\.terminee\.emit\s*\(\s*this\.titre\s*\(\s*\)\s*\)'
              message: "Émets le titre : `this.terminee.emit(this.titre());` (n'oublie pas `titre()` avec parenthèses)."
      - slug: ng-ex-output-bug
        kind: CORRIGER_ERREUR
        title: "Un parent qui n'écoute pas"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Le parent utilise des crochets pour l'output `choisi` : il n'écoute rien. Remplace-les par des
          parenthèses.
        criteria: "(choisi)=\"ouvrir($event)\"."
        hints:
          - "Un output est un événement."
          - "Un événement s'écoute avec des parenthèses."
          - "`(choisi)=\"ouvrir($event)\"`"
        solution: |
          <app-carte-salle [nom]="s.nom" (choisi)="ouvrir($event)" />
        explanation: "[input] pour donner, (output) pour écouter."
        xp: 10
        payload:
          language: html
          starter: |
            <app-carte-salle [nom]="s.nom" [choisi]="ouvrir($event)" />
          checks:
            - pattern: '\[choisi\]'
              absent: true
              message: "Un output ne s'écrit pas avec des crochets."
            - pattern: '\(choisi\)\s*=\s*"ouvrir\(\$event\)"'
              message: "Écris (choisi)=\"ouvrir($event)\"."

  # ===================================================================== LEÇON 9
  - slug: ng-services
    title: "Services et injection de dépendances"
    duration: 12
    objective: "Sortir la logique des composants dans un service, l'injecter avec inject() et partager un état entre plusieurs composants."
    prerequisites: "Leçon « Prévenir le parent : output() »."
    skills: [angular-services]
    xp: 20
    memo: |
      - Un **service** = une classe qui contient la logique partagée (données, appels HTTP, règles).
      - `@Injectable({ providedIn: 'root' })` : **une seule instance** pour toute l'application.
      - `private favoris = inject(FavorisService);` : Angular **fournit** le service au composant.
      - Le composant **affiche** ; le service **sait faire**.
      - Exposer un signal en lecture seule : `readonly titres = this._titres.asReadonly();`.
    commonMistakes: |
      - Créer le service soi-même avec `new FavorisService()` : chaque composant aurait sa propre copie.
      - Mettre les appels HTTP directement dans les composants.
      - Laisser les composants modifier l'état du service sans passer par ses méthodes.
    blocks:
      - type: text
        md: |
          Les favoris doivent s'afficher dans l'en-tête **et** dans la page des livres. Si chaque composant garde
          sa propre liste, elles ne seront jamais d'accord. Il faut **une seule liste**, partagée : un service.
      - type: definition
        id: def-service
        term: "Service"
        md: |
          Une classe qui **rend un service** aux composants : garder des données, appeler le serveur, appliquer
          une règle. Comme la **cuisine** d'un restaurant : les serveurs (composants) prennent les commandes et
          servent, la cuisine prépare.
      - type: definition
        id: def-injection
        term: "Injection de dépendances"
        md: |
          Le composant ne fabrique pas lui-même ce dont il a besoin : il le **demande** à Angular, qui le lui
          **fournit**. Comme à l'hôtel : on ne construit pas son lit, on le trouve dans la chambre.
      - type: code
        id: code-service
        language: typescript
        title: "favoris.service.ts et son utilisation"
        code: |
          @Injectable({ providedIn: 'root' })
          export class FavorisService {
            private readonly _titres = signal<string[]>([]);
            readonly titres = this._titres.asReadonly();

            ajouter(titre: string) {
              this._titres.update(liste => [...liste, titre]);
            }
          }

          @Component({
            selector: 'app-entete',
            template: `
              @for (t of favoris.titres(); track t) {
                <span>{{ t }}</span>
              }
            `,
          })
          export class EnteteComponent {
            protected readonly favoris = inject(FavorisService);
          }
        lines:
          - n: 1
            note: "`providedIn: 'root'` : Angular crée **une seule** liste de favoris pour toute l'application."
          - n: 3
            note: "Le vrai stockage est **privé** : seul le service le modifie."
          - n: 4
            note: "Les composants lisent une version en lecture seule."
          - n: 6
            note: "La seule porte d'entrée pour modifier les favoris."
          - n: 20
            note: "`inject(FavorisService)` : Angular fournit la même instance à tous les composants."
      - type: question
        ref: ng-sv-q1
        review: code-service
      - type: question
        ref: ng-sv-q2
        review: def-injection
      - type: text
        md: "**Exercice 1 (guidé)** : remets ce service dans l'ordre."
      - type: exercise
        ref: ng-ex-service-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : écris un service de notifications."
      - type: exercise
        ref: ng-ex-service
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un service fabriqué à la main."
      - type: exercise
        ref: ng-ex-service-bug
      - type: jury
        items:
          - q: "Qu'est-ce que l'injection de dépendances ?"
            a: "Un mécanisme où Angular crée et fournit les objets dont une classe a besoin, au lieu qu'elle les fabrique avec new. Ça réduit le couplage et permet de remplacer un service par une version factice dans les tests."
          - q: "Pourquoi séparer composants et services ?"
            a: "Pour respecter la responsabilité unique : le composant gère l'affichage et les interactions, le service contient la logique et l'accès aux données. La logique devient réutilisable et testable sans interface."
      - type: quiz
        items:
          - ref: ng-sv-q3
            review: code-service
          - ref: ng-sv-q4
            review: def-service
          - ref: ng-sv-q5
            review: def-injection
          - ref: ng-c2-b2
            review: def-service
    questions:
      - code: ng-sv-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-services
        prompt: "Que signifie `providedIn: 'root'` ?"
        choices:
          - label: "Une seule instance du service est partagée dans toute l'application"
            correct: true
            why: "C'est un singleton."
          - label: "Le service n'est utilisable que par AppComponent"
            correct: false
            why: "Tous les composants peuvent l'injecter."
          - label: "Le service a les droits administrateur"
            correct: false
            why: "Aucun rapport avec les droits."
        explanation: "root = racine de l'application."
      - code: ng-sv-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-services
        prompt: "Pourquoi ne pas écrire `favoris = new FavorisService();` dans un composant ?"
        choices:
          - label: "Chaque composant aurait sa propre liste, non partagée"
            correct: true
            why: "Et on ne pourrait plus le remplacer dans les tests."
          - label: "new est interdit en TypeScript"
            correct: false
            why: "new existe, mais ici c'est une erreur de conception."
          - label: "Le service serait plus lent"
            correct: false
            why: "Le problème est le partage, pas la vitesse."
        explanation: "On demande le service avec `inject()`."
      - code: ng-sv-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-services
        prompt: "Avec `asReadonly()`, un composant peut appeler `set()` sur le signal exposé."
        choices:
          - label: "Vrai"
            correct: false
            why: "Un signal en lecture seule n'a pas de set."
          - label: "Faux"
            correct: true
            why: "Il doit passer par les méthodes du service."
        explanation: "On protège l'état : une seule porte d'entrée."
      - code: ng-sv-q4
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: angular-services
        prompt: "Qu'est-ce qui a sa place dans un service ? (plusieurs réponses)"
        choices:
          - label: "Les appels HTTP vers l'API"
            correct: true
            why: "Logique d'accès aux données."
          - label: "L'état partagé (favoris, utilisateur connecté)"
            correct: true
            why: "Partagé entre composants."
          - label: "Le HTML de la page"
            correct: false
            why: "Il va dans le template du composant."
          - label: "Les règles métier (un livre déjà en favori, un compte désactivé)"
            correct: true
            why: "Logique réutilisable et testable."
        explanation: "Le composant affiche, le service sait faire."
      - code: ng-sv-q5
        kind: TEXTE
        difficulty: 2
        skill: angular-services
        prompt: "Quelle fonction Angular utilise-t-on pour obtenir un service dans un composant ? (un mot)"
        answers: ["inject", "inject()"]
        explanation: "`private readonly api = inject(ApiService);`"
      - code: ng-c2-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-services
        prompt: "Comment partager une donnée entre deux composants qui n'ont aucun lien parent-enfant ?"
        choices:
          - label: "Avec un service injecté dans les deux composants"
            correct: true
            why: "Le service tient l'état commun."
          - label: "Avec input()"
            correct: false
            why: "input suppose un lien parent-enfant."
          - label: "En copiant la donnée dans chaque composant"
            correct: false
            why: "Les copies finiraient par diverger."
        explanation: "Un service singleton = une seule source de vérité."
    exercises:
      - slug: ng-ex-service-ordre
        kind: REMETTRE_ORDRE
        title: "Remettre un service dans l'ordre"
        difficulty: FACILE
        skill: angular-services
        statement: "Remets les lignes dans l'ordre pour obtenir un service de thème clair/sombre."
        criteria: "Décorateur, classe, état privé, lecture seule, méthode, accolades fermantes."
        hints:
          - "Le décorateur vient avant la classe."
          - "L'état privé est déclaré avant sa version en lecture seule."
          - "La méthode est à la fin, avant l'accolade de la classe."
        solution: |
          @Injectable({ providedIn: 'root' })
          export class ThemeService {
            private readonly _sombre = signal(false);
            readonly sombre = this._sombre.asReadonly();
            basculer() {
              this._sombre.update(v => !v);
            }
          }
        explanation: "Un service type : état privé, lecture publique, méthodes pour modifier."
        xp: 10
        payload:
          language: typescript
          lines:
            - "@Injectable({ providedIn: 'root' })"
            - "export class ThemeService {"
            - "  private readonly _sombre = signal(false);"
            - "  readonly sombre = this._sombre.asReadonly();"
            - "  basculer() {"
            - "    this._sombre.update(v => !v);"
            - "  }"
            - "}"
      - slug: ng-ex-service
        kind: CODE_LIBRE
        title: "Un service de notifications"
        difficulty: INTERMEDIAIRE
        skill: angular-services
        statement: |
          Écris `NotificationService` :
          - décoré avec `@Injectable({ providedIn: 'root' })` ;
          - un signal **privé** `_messages` contenant une liste de textes, vide au départ ;
          - une version publique en lecture seule `messages` ;
          - une méthode `ajouter(texte: string)` qui ajoute un message **sans** utiliser `push` ;
          - une méthode `vider()` qui remet la liste à vide.
        criteria: "Injectable root, signal privé typé, asReadonly, update sans push, set([])."
        hints:
          - "`private readonly _messages = signal<string[]>([]);`"
          - "`this._messages.update(liste => [...liste, texte]);`"
          - "`vider() { this._messages.set([]); }`"
        solution: |
          @Injectable({ providedIn: 'root' })
          export class NotificationService {
            private readonly _messages = signal<string[]>([]);
            readonly messages = this._messages.asReadonly();

            ajouter(texte: string) {
              this._messages.update(liste => [...liste, texte]);
            }

            vider() {
              this._messages.set([]);
            }
          }
        explanation: "Le même modèle sert pour des favoris, un utilisateur connecté, des filtres…"
        xp: 25
        payload:
          language: typescript
          starter: |
            export class NotificationService {

            }
          checks:
            - pattern: '@Injectable\s*\(\s*\{\s*providedIn\s*:\s*[''"]root[''"]\s*\}\s*\)'
              message: "Ajoute `@Injectable({ providedIn: 'root' })`."
            - pattern: 'private\s+(?:readonly\s+)?_messages\s*=\s*signal\s*<\s*string\[\]\s*>\s*\(\s*\[\s*\]\s*\)'
              message: "Déclare `private readonly _messages = signal<string[]>([]);`."
            - pattern: '\bmessages\s*=\s*this\._messages\.asReadonly\s*\(\s*\)'
              message: "Expose `messages = this._messages.asReadonly();`."
            - pattern: 'ajouter\s*\(\s*texte\s*:\s*string\s*\)'
              message: "Écris la méthode `ajouter(texte: string)`."
            - pattern: '_messages\.update\s*\(\s*\(?\s*\w+\s*\)?\s*=>\s*\[\s*\.\.\.\w+\s*,\s*texte\s*\]\s*\)'
              message: "Ajoute avec `update(liste => [...liste, texte])`."
            - pattern: '\.push\s*\('
              absent: true
              message: "N'utilise pas `push` : crée un nouveau tableau."
            - pattern: 'vider\s*\(\s*\)[^{]*\{\s*this\._messages\.set\s*\(\s*\[\s*\]\s*\)'
              message: "Dans `vider()`, écris `this._messages.set([]);`."
      - slug: ng-ex-service-bug
        kind: CORRIGER_ERREUR
        title: "Un service fabriqué à la main"
        difficulty: FACILE
        skill: angular-services
        statement: |
          Ce composant fabrique sa propre copie du service avec `new` : ses favoris ne sont pas partagés.
          Demande plutôt le service à Angular avec `inject`.
        criteria: "inject(FavorisService), sans new."
        hints:
          - "Qui doit fournir le service ?"
          - "Angular, avec la fonction inject."
          - "`protected readonly favoris = inject(FavorisService);`"
        solution: |
          export class PageLivresComponent {
            protected readonly favoris = inject(FavorisService);
          }
        explanation: "inject donne la même instance partagée à tous."
        xp: 10
        payload:
          language: typescript
          starter: |
            export class PageLivresComponent {
              protected readonly favoris = new FavorisService();
            }
          checks:
            - pattern: 'new\s+FavorisService'
              absent: true
              message: "Ne fabrique pas le service avec new."
            - pattern: '=\s*inject\s*\(\s*FavorisService\s*\)'
              message: "Écris inject(FavorisService)."

