      - slug: ng-ex-signal-libre
        kind: CODE_LIBRE
        title: "Une liste de favoris"
        difficulty: INTERMEDIAIRE
        skill: angular-composants
        statement: |
          Dans une classe :
          - crée un signal `favoris` contenant une liste de textes, vide au départ (`signal<string[]>([])`) ;
          - écris une méthode `ajouter(titre: string)` qui ajoute le titre **sans** utiliser `push`.
        criteria: "signal<string[]>([]) et update qui crée une nouvelle liste."
