      - code: ng-fo-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans `@for (s of salles; track s.id)`, que représente `s` ?"
        choices:
          - label: "La salle en cours, à chaque tour"
