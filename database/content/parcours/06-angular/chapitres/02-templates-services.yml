            correct: false
            why: "update utilise l'ancienne valeur."
          - label: "set lit, update écrit"
            correct: false
            why: "Les deux écrivent ; on lit avec ()."
        explanation: "set('x') ; update(v => …)."
    exercises:
      - slug: ng-ex-signal-base-guide
        kind: COMPLETER
        title: "Créer, lire et remplacer"
        difficulty: FACILE
        skill: angular-composants
