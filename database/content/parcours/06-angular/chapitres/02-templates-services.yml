slug: ng-templates-services
position: 2
level: INTERMEDIAIRE
title: "Templates, signaux et services"
summary: "Réagir aux clics, remplir des attributs, afficher selon une condition, répéter une liste, garder l'état dans des signaux, faire parler les composants et partager les données avec un service. Une seule notion par leçon."
quizQuestionCount: 16

lessons:
  # ===================================================================== LEÇON 1
  - slug: ng-evenements
    title: "Réagir à un clic : (click)"
    duration: 9
    objective: "Appeler une méthode de la classe quand l'utilisatrice clique, avec la liaison d'événement (click)."
    prerequisites: "Chapitre « TypeScript et premier composant »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - `(click)="dire()"` : **liaison d'événement**. Quand on clique, Angular appelle la méthode `dire()` de la classe.
      - Les **parenthèses** autour du nom de l'événement **écoutent** (écran → classe).
      - Dans la méthode, on écrit `this.` pour parler des propriétés de la classe.
      - Quand une propriété change, l'écran se met à jour tout seul.
    commonMistakes: |
      - Écrire `(click)="dire"` sans parenthèses d'appel : la méthode n'est pas appelée.
      - Oublier `this.` dans la méthode.
    blocks:
      - type: text
        md: |
          Un template n'est pas une page figée : quand l'utilisatrice clique, la classe est prévenue et peut
          changer ses données. L'écran suit.
      - type: definition
        id: def-evenement
        term: "Liaison d'événement"
        md: |
          Une **sonnette** posée sur un bouton : quand on appuie, elle fait sonner une méthode de la classe.
          Astuce : les parenthèses `( )` ressemblent à des **oreilles** qui écoutent.
      - type: code
        id: code-evenement
        language: typescript
        title: "Un bouton qui change le message"
        code: |
          @Component({
            selector: 'app-accueil',
            template: `
              <p>{{ message }}</p>
              <button (click)="remercier()">Dire merci</button>
            `,
          })
          export class AccueilComponent {
            message = 'Bonjour !';
            remercier() {
              this.message = 'Merci pour ta visite !';
            }
          }
        lines:
          - n: 4
            note: "L'interpolation affiche le message actuel."
          - n: 5
            note: "`(click)` écoute le clic et appelle `remercier()`."
          - n: 11
            note: "La méthode change la propriété ; l'écran affiche aussitôt le nouveau message."
      - type: question
        ref: ng-tp-q1
        review: def-evenement
      - type: question
        ref: ng-tp-q5
        review: def-evenement
      - type: text
        md: "**Exercice 1 (guidé)** : complète la liaison."
      - type: exercise
        ref: ng-ex-evenement-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un bouton qui affiche un message d'au revoir."
      - type: exercise
        ref: ng-ex-evenement-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une méthode jamais appelée."
      - type: exercise
        ref: ng-ex-evenement-bug
      - type: quiz
        items:
          - ref: ng-ev-q3
            review: code-evenement
          - ref: ng-ev-q4
            review: code-evenement
          - ref: ng-ev-q5
            review: def-evenement
    questions:
      - code: ng-tp-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Quelle écriture appelle `envoyer()` quand on clique sur le bouton ?"
        choices:
          - label: "<button (click)=\"envoyer()\">"
            correct: true
            why: "Parenthèses = écouter un événement."
          - label: "<button [click]=\"envoyer()\">"
            correct: false
            why: "Les crochets n'écoutent pas."
          - label: "<button click=\"{{ envoyer() }}\">"
            correct: false
            why: "L'interpolation affiche, elle n'écoute pas."
        explanation: "`(événement)=\"méthode()\"`."
      - code: ng-tp-q5
        kind: TEXTE
        difficulty: 2
        skill: angular-composants
        prompt: "Quel symbole entoure un nom d'événement dans un template : crochets ou parenthèses ? (un mot)"
        answers: ["parenthèses", "parentheses", "parenthèse", "()"]
        explanation: "`(click)`, `(submit)`, `(input)`… Les parenthèses écoutent."
      - code: ng-ev-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans l'exemple, qu'affiche le paragraphe après un clic sur « Dire merci » ?"
        snippet: |
          message = 'Bonjour !';
          remercier() { this.message = 'Merci pour ta visite !'; }
        language: typescript
        choices:
          - label: "Merci pour ta visite !"
            correct: true
            why: "La méthode a remplacé le message."
          - label: "Bonjour !"
            correct: false
            why: "L'écran suit la nouvelle valeur."
          - label: "remercier()"
            correct: false
            why: "On affiche la propriété message."
        explanation: "Clic → méthode → propriété changée → écran mis à jour."
      - code: ng-ev-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans une méthode de la classe, comment modifier la propriété `message` ?"
        choices:
          - label: "`this.message = 'Salut';`"
            correct: true
            why: "Dans la classe, on écrit this."
          - label: "`message = 'Salut';`"
            correct: false
            why: "Sans this, ce n'est pas la propriété."
          - label: "`{{ message }} = 'Salut';`"
            correct: false
            why: "Les accolades sont pour le template."
        explanation: "Template : `message` ; classe : `this.message`."
      - code: ng-ev-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-composants
        prompt: "Avec `(click)`, l'information va de l'écran vers la classe."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le clic remonte vers la classe."
          - label: "Faux"
            correct: false
            why: "C'est justement le sens des parenthèses."
        explanation: "Parenthèses : écran → classe."
    exercises:
      - slug: ng-ex-evenement-guide
        kind: COMPLETER
        title: "Compléter la liaison"
        difficulty: FACILE
        skill: angular-composants
        statement: "Le bouton doit appeler `ouvrir()`. Complète."
        criteria: "Les deux trous sont corrects."
        hints:
          - "L'événement s'écrit entre parenthèses."
          - "On appelle la méthode avec ses parenthèses."
          - "(click), ouvrir()."
        solution: '["(click)", "ouvrir()"]'
        explanation: "`(click)=\"ouvrir()\"`."
        xp: 10
        payload:
          language: html
          template: |
            <button [[1]]="[[2]]">Ouvrir</button>
          blanks:
            - ["(click)"]
            - ["ouvrir()"]
      - slug: ng-ex-evenement-libre
        kind: CODE_LIBRE
        title: "Un message d'au revoir"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Écris la classe et le template de `SortieComponent` (sélecteur `app-sortie`) :
          - une propriété `texte = 'À bientôt ?'` affichée dans un `<p>` ;
          - un bouton « Partir » qui appelle `partir()` au clic ;
          - la méthode `partir()` remplace le texte par `'Au revoir !'`.
        criteria: "Interpolation, (click) qui appelle partir(), méthode qui modifie this.texte."
        hints:
          - "`<p>{{ texte }}</p>`"
          - "`<button (click)=\"partir()\">Partir</button>`"
          - "`partir() { this.texte = 'Au revoir !'; }`"
        solution: |
          @Component({
            selector: 'app-sortie',
            template: `
              <p>{{ texte }}</p>
              <button (click)="partir()">Partir</button>
            `,
          })
          export class SortieComponent {
            texte = 'À bientôt ?';
            partir() {
              this.texte = 'Au revoir !';
            }
          }
        explanation: "Le clic change la donnée, l'écran suit."
        xp: 15
        payload:
          language: typescript
          starter: |
            @Component({
              selector: 'app-sortie',
              template: ``,
            })
            export class SortieComponent {

            }
          checks:
            - pattern: '<p>\s*\{\{\s*texte\s*\}\}\s*</p>'
              message: "Affiche le texte : <p>{{ texte }}</p>."
            - pattern: '\(click\)\s*=\s*"partir\(\)"'
              message: "Le bouton appelle partir() : (click)=\"partir()\"."
            - pattern: '\btexte\s*=\s*[''"]À bientôt \?[''"]'
              message: "Déclare texte = 'À bientôt ?'."
            - pattern: 'partir\s*\(\s*\)\s*\{\s*this\.texte\s*=\s*[''"]Au revoir !?[''"]'
              message: "Dans partir(), écris this.texte = 'Au revoir !';"
      - slug: ng-ex-evenement-bug
        kind: CORRIGER_ERREUR
        title: "Une méthode jamais appelée"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Le bouton n'appelle pas vraiment la méthode `commander` : il manque les parenthèses d'appel. Corrige.
        criteria: "(click)=\"commander()\"."
        hints:
          - "Regarde ce qu'il y a entre les guillemets."
          - "Une méthode s'appelle avec des parenthèses."
          - "`(click)=\"commander()\"`"
        solution: |
          <button (click)="commander()">Commander</button>
        explanation: "Sans parenthèses, on nomme la méthode sans l'appeler."
        xp: 10
        payload:
          language: html
          starter: |
            <button (click)="commander">Commander</button>
          checks:
            - pattern: '\(click\)\s*=\s*"commander\s*\(\s*\)"'
              message: "Écris (click)=\"commander()\"."

  # ===================================================================== LEÇON 2
  - slug: ng-liaison-propriete
    title: "Remplir un attribut : [propriété]"
    duration: 9
    objective: "Remplir un attribut HTML avec une valeur de la classe grâce à la liaison de propriété [ ]."
    prerequisites: "Leçon « Réagir à un clic : (click) »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - `[disabled]="envoiEnCours"` : **liaison de propriété**. L'attribut prend la valeur de la classe (classe → écran).
      - `[src]="photo"` : l'image affiche l'adresse contenue dans la propriété `photo`.
      - Les **crochets** envoient une valeur vers l'écran ; les **parenthèses** écoutent un événement.
    commonMistakes: |
      - Écrire `disabled="envoiEnCours"` sans crochets : Angular y met le texte « envoiEnCours », pas la valeur.
      - Confondre `[ ]` (valeur vers l'écran) et `( )` (événement vers la classe).
    blocks:
      - type: definition
        id: def-propriete
        term: "Liaison de propriété"
        md: |
          Un **tuyau** de la classe vers l'écran : la valeur de la propriété coule dans l'attribut HTML. Si la
          valeur change, l'attribut change aussi.
      - type: code
        id: code-propriete
        language: typescript
        title: "Un bouton grisé pendant l'envoi"
        code: |
          @Component({
            selector: 'app-envoi',
            template: `
              <img [src]="logo" alt="Logo" />
              <button [disabled]="envoiEnCours" (click)="envoyer()">Envoyer</button>
            `,
          })
          export class EnvoiComponent {
            logo = 'assets/logo.png';
            envoiEnCours = false;
            envoyer() {
              this.envoiEnCours = true;
            }
          }
        lines:
          - n: 4
            note: "`[src]` : l'image prend l'adresse contenue dans `logo`."
          - n: 5
            note: "`[disabled]` : le bouton est grisé quand `envoiEnCours` vaut `true`."
          - n: 12
            note: "Après le clic, le bouton se grise tout seul."
      - type: question
        ref: ng-tp-q3
        review: code-propriete
      - type: question
        ref: ng-lp-q2
        review: def-propriete
      - type: text
        md: "**Exercice 1 (guidé)** : crochets ou parenthèses ?"
      - type: exercise
        ref: ng-ex-propriete-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une photo de profil."
      - type: exercise
        ref: ng-ex-propriete-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : des crochets oubliés."
      - type: exercise
        ref: ng-ex-propriete-bug
      - type: jury
        items:
          - q: "Quelle différence entre [propriete] et (evenement) ?"
            a: "Les crochets lient une valeur de la classe vers le DOM (liaison de propriété). Les parenthèses écoutent un événement du DOM et appellent une méthode de la classe. [(ngModel)] combine les deux : c'est la liaison bidirectionnelle."
      - type: quiz
        items:
          - ref: ng-lp-q3
            review: def-propriete
          - ref: ng-lp-q4
            review: code-propriete
          - ref: ng-c2-b1
            review: def-propriete
    questions:
      - code: ng-tp-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Que fait `[disabled]=\"envoiEnCours\"` ?"
        choices:
          - label: "Désactive le bouton quand envoiEnCours vaut true"
            correct: true
            why: "La valeur remplit l'attribut disabled."
          - label: "Lance l'envoi au clic"
            correct: false
            why: "Ce serait un événement (click)."
          - label: "Affiche le texte « envoiEnCours »"
            correct: false
            why: "Les crochets lisent la valeur de la propriété."
        explanation: "Liaison de propriété : classe → écran."
      - code: ng-lp-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Dans quel sens va l'information avec les crochets `[ ]` ?"
        choices:
          - label: "De la classe vers l'écran"
            correct: true
            why: "La valeur remplit l'attribut."
          - label: "De l'écran vers la classe"
            correct: false
            why: "C'est le rôle des parenthèses."
          - label: "Du serveur vers la base"
            correct: false
            why: "Aucun rapport."
        explanation: "[ ] : vers l'écran ; ( ) : vers la classe."
      - code: ng-lp-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-composants
        prompt: "`<img src=\"photo\">` affiche l'image dont l'adresse est dans la propriété `photo`."
        choices:
          - label: "Vrai"
            correct: false
            why: "Sans crochets, l'adresse est le texte « photo »."
          - label: "Faux"
            correct: true
            why: "Il faut `[src]=\"photo\"`."
        explanation: "Sans crochets, c'est du texte brut."
      - code: ng-lp-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Comment afficher l'image dont l'adresse est dans la propriété `avatar` ?"
        choices:
          - label: "`<img [src]=\"avatar\" />`"
            correct: true
            why: "Liaison de propriété."
          - label: "`<img (src)=\"avatar\" />`"
            correct: false
            why: "src n'est pas un événement."
          - label: "`<img src=\"avatar\" />`"
            correct: false
            why: "Ce serait le texte « avatar »."
        explanation: "[attribut]=\"propriété\"."
      - code: ng-c2-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Quelle écriture crée une liaison dans les deux sens sur un champ de formulaire (avec FormsModule) ?"
        choices:
          - label: "[(ngModel)]=\"nom\""
            correct: true
            why: "La « banane dans la boîte » : crochets + parenthèses."
          - label: "(ngModel)=\"nom\""
            correct: false
            why: "Seulement l'écoute."
          - label: "{{ ngModel }}"
            correct: false
            why: "Seulement l'affichage."
        explanation: "`[( )]` combine valeur vers l'écran et événement vers la classe."
    exercises:
      - slug: ng-ex-propriete-guide
        kind: COMPLETER
        title: "Crochets ou parenthèses ?"
        difficulty: FACILE
        skill: angular-composants
        statement: "Complète : l'image affiche `photo`, le bouton est grisé si `occupe`, et il appelle `valider()` au clic."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une valeur vers l'écran : crochets."
          - "Un événement : parenthèses."
          - "[src], [disabled], (click)."
        solution: '["[src]", "[disabled]", "(click)"]'
        explanation: "Crochets pour remplir, parenthèses pour écouter."
        xp: 10
        payload:
          language: html
          template: |
            <img [[1]]="photo" alt="Photo" />
            <button [[2]]="occupe" [[3]]="valider()">Valider</button>
          blanks:
            - ["[src]"]
            - ["[disabled]"]
            - ["(click)"]
      - slug: ng-ex-propriete-libre
        kind: CODE_LIBRE
        title: "Une photo de profil"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Écris le template : une image dont l'adresse vient de la propriété `photo` et dont le texte alternatif
          vient de la propriété `prenom` (liaison `[alt]`).
        criteria: "[src]=\"photo\" et [alt]=\"prenom\"."
        hints:
          - "Deux attributs, deux paires de crochets."
          - "`[src]=\"photo\"`"
          - "`<img [src]=\"photo\" [alt]=\"prenom\" />`"
        solution: |
          <img [src]="photo" [alt]="prenom" />
        explanation: "Chaque attribut peut être relié à une propriété."
        xp: 15
        payload:
          language: html
          starter: |
            <img />
          checks:
            - pattern: '<img[^>]*\[src\]\s*=\s*"photo"'
              message: "Relie l'adresse : [src]=\"photo\"."
            - pattern: '<img[^>]*\[alt\]\s*=\s*"prenom"'
              message: "Relie le texte alternatif : [alt]=\"prenom\"."
      - slug: ng-ex-propriete-bug
        kind: CORRIGER_ERREUR
        title: "Des crochets oubliés"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Le bouton devrait être grisé quand `chargement` vaut `true`, mais Angular reçoit le texte
          « chargement ». Ajoute les crochets.
        criteria: "[disabled]=\"chargement\"."
        hints:
          - "Sans crochets, c'est du texte."
          - "Avec crochets, c'est la valeur de la propriété."
          - "`[disabled]=\"chargement\"`"
        solution: |
          <button [disabled]="chargement">Enregistrer</button>
        explanation: "Les crochets lisent la valeur."
        xp: 10
        payload:
          language: html
          starter: |
            <button disabled="chargement">Enregistrer</button>
          checks:
            - pattern: '\[disabled\]\s*=\s*"chargement"'
              message: "Écris [disabled]=\"chargement\"."

  # ===================================================================== LEÇON 3
  - slug: ng-if
    title: "Afficher selon une condition : @if"
    duration: 9
    objective: "Afficher un morceau de template seulement si une condition est vraie, avec @if et @else."
    prerequisites: "Leçon « Remplir un attribut : [propriété] »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - `@if (connecte) { … }` : le morceau s'affiche **seulement si** `connecte` est vrai.
      - `@else { … }` : ce qui s'affiche sinon.
      - Les accolades délimitent le morceau concerné.
    commonMistakes: |
      - Oublier les parenthèses autour de la condition.
      - Oublier une accolade fermante.
    blocks:
      - type: definition
        id: def-if
        term: "@if"
        md: |
          Un **videur** à l'entrée d'une salle : il ne laisse entrer le morceau que si la condition est vraie.
          `@else` est la salle d'à côté, pour tous les autres cas.
      - type: code
        id: code-if
        language: html
        title: "Un message selon la connexion"
        code: |
          @if (connecte) {
            <p>Bienvenue, {{ prenom }} !</p>
          } @else {
            <button (click)="seConnecter()">Se connecter</button>
          }
        lines:
          - n: 1
            note: "Si `connecte` vaut `true`, on affiche le message de bienvenue."
          - n: 3
            note: "Sinon, on affiche le bouton de connexion."
      - type: question
        ref: ng-if-q1
        review: def-if
      - type: question
        ref: ng-if-q2
        review: code-if
      - type: text
        md: "**Exercice 1 (guidé)** : complète la condition."
      - type: exercise
        ref: ng-ex-if-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un message de chargement."
      - type: exercise
        ref: ng-ex-if-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une condition sans parenthèses."
      - type: exercise
        ref: ng-ex-if-bug
      - type: quiz
        items:
          - ref: ng-if-q3
            review: code-if
          - ref: ng-if-q4
            review: def-if
          - ref: ng-if-q5
            review: code-if
    questions:
      - code: ng-if-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "À quoi sert `@if` dans un template ?"
        choices:
          - label: "À afficher un morceau seulement si une condition est vraie"
            correct: true
            why: "Le videur laisse passer ou non."
          - label: "À répéter un morceau"
            correct: false
            why: "C'est le rôle de @for."
          - label: "À écouter un clic"
            correct: false
            why: "C'est le rôle de (click)."
        explanation: "@if = afficher sous condition."
      - code: ng-if-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: angular-composants
        prompt: "Avec `connecte = false`, qu'affiche l'exemple ?"
        snippet: |
          @if (connecte) {
            <p>Bienvenue !</p>
          } @else {
            <button>Se connecter</button>
          }
        language: html
        choices:
          - label: "Le bouton « Se connecter »"
            correct: true
            why: "La condition est fausse : on passe dans @else."
          - label: "Le message « Bienvenue ! »"
            correct: false
            why: "Il faudrait connecte = true."
          - label: "Les deux"
            correct: false
            why: "Un seul des deux morceaux s'affiche."
        explanation: "Condition fausse → @else."
      - code: ng-if-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Quelle écriture est correcte ?"
        choices:
          - label: "`@if (admin) { <p>Espace admin</p> }`"
            correct: true
            why: "Condition entre parenthèses, morceau entre accolades."
          - label: "`@if admin { <p>Espace admin</p> }`"
            correct: false
            why: "Il manque les parenthèses."
          - label: "`if (admin) <p>Espace admin</p>`"
            correct: false
            why: "Dans un template, on écrit @if avec des accolades."
        explanation: "@if (condition) { … }."
      - code: ng-if-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-composants
        prompt: "Le bloc `@else` est obligatoire après un `@if`."
        choices:
          - label: "Vrai"
