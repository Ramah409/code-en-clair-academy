        kind: COMPLETER
        title: "Compléter l'émission"
        difficulty: FACILE
        skill: angular-composants
        statement: "Complète : déclarer l'output, émettre la valeur, écouter côté parent."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La fonction qui déclare un événement de sortie."
          - "La méthode qui envoie ; le parent écoute avec des parenthèses."
          - "output, emit, (supprime)."
        solution: '["output", "emit", "(supprime)"]'
        explanation: "Déclarer, émettre, écouter."
        xp: 10
        payload:
