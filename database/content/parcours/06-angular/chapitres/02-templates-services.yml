  # ===================================================================== LEÇON 4
  - slug: ng-for
    title: "Répéter pour chaque élément : @for"
    duration: 11
    objective: "Afficher un élément pour chaque valeur d'une liste avec @for, track et @empty."
    prerequisites: "Leçon « Afficher selon une condition : @if »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - `@for (l of livres; track l.id) { … }` : répéter le morceau pour chaque livre `l`.
      - `track` est **obligatoire** : il aide Angular à reconnaître chaque élément (souvent par son `id`).
      - `@empty { … }` : ce qui s'affiche si la liste est vide.
    commonMistakes: |
      - Oublier `track` : Angular refuse de compiler.
      - Utiliser `@else` après un `@for` : le bon bloc est `@empty`.
    blocks:
      - type: definition
        id: def-for
        term: "@for"
        md: |
          Une **imprimante à étiquettes** : elle sort une étiquette par élément de la liste. `track` est le
          numéro de série qui permet de reconnaître chaque étiquette.
      - type: code
        id: code-for
        language: html
        title: "Afficher la liste des livres"
        code: |
          <ul>
            @for (l of livres; track l.id) {
              <li>{{ l.titre }} – {{ l.auteur }}</li>
            } @empty {
              <li>Aucun livre.</li>
            }
          </ul>
        lines:
          - n: 2
            note: "Pour chaque livre `l` de la liste. `track l.id` : chaque élément est reconnu par son identifiant."
          - n: 3
            note: "Le morceau répété, qui utilise `l`."
          - n: 4
            note: "`@empty` : ce qui s'affiche si la liste est vide."
      - type: question
        ref: ng-tp-q2
        review: def-for
      - type: question
        ref: ng-tp-q4
        review: code-for
      - type: text
        md: "**Exercice 1 (guidé)** : complète la boucle."
      - type: exercise
        ref: ng-ex-template-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : la liste des salles."
      - type: exercise
        ref: ng-ex-for-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : réparer un template."
      - type: exercise
        ref: ng-ex-template-corriger
      - type: jury
        items:
          - q: "À quoi sert track dans @for ?"
            a: "À identifier chaque élément, par exemple par son id. Quand la liste change, Angular ne recrée que les éléments modifiés au lieu de tout redessiner : c'est plus rapide et ça garde l'état des éléments."
      - type: quiz
        items:
          - ref: ng-fo-q3
            review: code-for
          - ref: ng-fo-q4
            review: def-for
          - ref: ng-fo-q5
            review: code-for
