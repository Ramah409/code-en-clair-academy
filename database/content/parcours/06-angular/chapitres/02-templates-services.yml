          </ul>
        explanation: "Une liste, un morceau par élément, un message si vide."
        xp: 15
        payload:
          language: html
          starter: |
            <ul>

            </ul>
          checks:
            - pattern: '@for\s*\(\s*s\s+of\s+salles\s*;\s*track\s+s\.id\s*\)'
              message: "Écris @for (s of salles; track s.id)."
            - pattern: '<li>\s*\{\{\s*s\.nom\s*\}\}\s*</li>'
              message: "Affiche <li>{{ s.nom }}</li>."
            - pattern: '\}\s*@empty\s*\{[\s\S]*Aucune salle'
              message: "Ajoute @empty { <li>Aucune salle.</li> }."
      - slug: ng-ex-template-corriger
        kind: CORRIGER_ERREUR
        title: "Réparer un template"
        difficulty: INTERMEDIAIRE
        skill: angular-composants
        statement: |
          Ce template contient trois erreurs :
          - la boucle n'a pas de `track` ;
          - le bouton n'appelle pas vraiment la méthode `emprunter` (il manque les parenthèses d'appel) ;
          - le message d'absence utilise `@else` au lieu de `@empty`.
          Corrige-les.
        criteria: "@for avec track, (click) qui appelle emprunter(), bloc @empty."
        hints:
          - "`@for (l of livres; track l.id) {`"
          - "`(click)=\"emprunter(l)\"` : on appelle la méthode avec des parenthèses."
          - "Après une boucle, le bloc « liste vide » s'appelle `@empty`."
        solution: |
          <ul>
            @for (l of livres; track l.id) {
              <li>
                {{ l.titre }}
                <button (click)="emprunter(l)">Emprunter</button>
              </li>
            } @empty {
              <li>Aucun livre.</li>
            }
          </ul>
        explanation: "Trois erreurs classiques que le compilateur d'Angular (ou le jury) repère immédiatement."
        xp: 20
        payload:
          language: html
          starter: |
            <ul>
              @for (l of livres) {
                <li>
                  {{ l.titre }}
                  <button (click)="emprunter">Emprunter</button>
                </li>
              } @else {
                <li>Aucun livre.</li>
              }
            </ul>
          checks:
            - pattern: '@for\s*\(\s*l\s+of\s+livres\s*;\s*track\s+[\w.$]+'
              message: "Ajoute `track` dans la boucle : `@for (l of livres; track l.id)`."
            - pattern: '\(click\)\s*=\s*"emprunter\s*\([^"]*\)"'
              message: "Le bouton doit appeler la méthode : `(click)=\"emprunter(l)\"`."
            - pattern: '\}\s*@empty\s*\{'
              message: "Après une boucle, utilise `@empty`."
            - pattern: '@else'
              absent: true
              message: "`@else` n'existe pas après un `@for`."

  # ===================================================================== LEÇON 5
  - slug: ng-signaux
    title: "Les signaux : une boîte qui prévient"
    duration: 10
    objective: "Stocker un état dans un signal, le lire avec des parenthèses et le modifier avec set et update."
    prerequisites: "Leçon « Répéter pour chaque élément : @for »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - `signal('Awa')` : une **boîte** qui contient une valeur et **prévient** l'écran quand elle change.
      - Lire : `prenom()` (avec parenthèses) ; remplacer : `prenom.set('Léo')`.
      - Modifier à partir de l'ancienne valeur : `sombre.update(v => !v)`.
      - Pour une liste : `livres.update(liste => [...liste, nouveau])` — on crée une **nouvelle** liste.
    commonMistakes: |
      - Oublier les parenthèses pour lire un signal : `{{ prenom }}` au lieu de `{{ prenom() }}`.
      - Modifier une liste avec `push` : l'écran ne se met pas à jour.
    blocks:
      - type: text
        md: |
          Angular doit savoir **quand** redessiner l'écran. Les **signaux** le lui disent précisément : chaque
          fois qu'une valeur change, seuls les morceaux d'écran qui l'utilisent sont mis à jour.
      - type: definition
        id: def-signal
        term: "Signal"
        md: |
          Une **boîte avec une sonnette**. On y range une valeur ; dès qu'on la change, la sonnette prévient
          tous ceux qui l'utilisent. On lit la valeur en « ouvrant » la boîte avec des parenthèses : `prenom()`.
      - type: code
        id: code-signal
        language: typescript
        title: "Un thème clair ou sombre"
        code: |
          import { Component, signal } from '@angular/core';

          @Component({
            selector: 'app-theme',
            template: `
              <p>Mode sombre : {{ sombre() }}</p>
              <button (click)="basculer()">Changer</button>
            `,
          })
          export class ThemeComponent {
            sombre = signal(false);

            basculer() {
              this.sombre.update(v => !v);
            }
          }
        lines:
          - n: 6
            note: "On lit un signal en l'appelant : `sombre()`."
          - n: 11
            note: "`signal(false)` : une boîte qui contient `false` au départ."
          - n: 14
            note: "`update` reçoit l'ancienne valeur `v` et renvoie son contraire (`!v`)."
      - type: question
        ref: ng-sg-q1
        review: code-signal
      - type: question
        ref: ng-si-q2
        review: def-signal
      - type: text
        md: "**Exercice 1 (guidé)** : crée, lis et remplace."
      - type: exercise
        ref: ng-ex-signal-base-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une liste de favoris."
      - type: exercise
        ref: ng-ex-signal-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une boîte jamais ouverte."
      - type: exercise
        ref: ng-ex-signal-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'un signal Angular ?"
            a: "Une valeur réactive : on la lit en l'appelant, on la modifie avec set ou update, et Angular sait exactement quelles parties de l'écran mettre à jour."
      - type: quiz
        items:
          - ref: ng-sg-q5
            review: def-signal
          - ref: ng-si-q4
            review: code-signal
          - ref: ng-si-q5
            review: code-signal
    questions:
      - code: ng-sg-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Comment afficher la valeur du signal `prenom` dans un template ?"
        choices:
          - label: "{{ prenom() }}"
            correct: true
            why: "On lit un signal en l'appelant."
          - label: "{{ prenom }}"
            correct: false
            why: "Cela afficherait la boîte, pas son contenu."
          - label: "{{ prenom.value }}"
            correct: false
            why: "Ce n'est pas la syntaxe des signaux Angular."
        explanation: "Parenthèses = ouvrir la boîte."
      - code: ng-si-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Comment remplacer la valeur du signal `ville` par « Nantes » ?"
        choices:
          - label: "`this.ville.set('Nantes');`"
            correct: true
            why: "set remplace la valeur."
          - label: "`this.ville = 'Nantes';`"
            correct: false
            why: "On casserait la boîte au lieu de changer son contenu."
          - label: "`this.ville() = 'Nantes';`"
            correct: false
            why: "On ne peut pas affecter une lecture."
        explanation: "Lire : `ville()` ; écrire : `ville.set(…)`."
      - code: ng-sg-q5
        kind: VRAI_FAUX
