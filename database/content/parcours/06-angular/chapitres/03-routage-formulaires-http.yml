      - slug: ng-ex-http-post-bug
        kind: CORRIGER_ERREUR
        title: "Un GET qui veut créer"
        difficulty: FACILE
        skill: api-rest
        statement: |
          Cette méthode doit **créer** un livre, mais elle utilise `get` et n'envoie pas l'objet. Corrige-la
          avec `post` et l'objet `livre` en second argument.
        criteria: "http.post<Livre>('/api/livres', livre)."
        hints:
          - "Quel verbe crée ?"
          - "post prend l'adresse puis l'objet."
          - "`return this.http.post<Livre>('/api/livres', livre);`"
        solution: |
          creer(livre: NouveauLivre): Observable<Livre> {
            return this.http.post<Livre>('/api/livres', livre);
          }
        explanation: "Créer = POST avec un corps."
        xp: 10
        payload:
          language: typescript
          starter: |
            creer(livre: NouveauLivre): Observable<Livre> {
              return this.http.get<Livre>('/api/livres');
            }
          checks:
            - pattern: 'http\.get'
              absent: true
              message: "GET sert à lire, pas à créer."
            - pattern: 'http\.post\s*(?:<[^>]*>)?\s*\(\s*[''"]/api/livres[''"]\s*,\s*livre\s*\)'
              message: "Écris this.http.post<Livre>('/api/livres', livre)."

  # ===================================================================== LEÇON 8
  - slug: ng-intercepteur
    title: "Envoyer le jeton : l'intercepteur"
    duration: 10
    objective: "Ajouter automatiquement le jeton JWT à toutes les requêtes avec un intercepteur HTTP."
    prerequisites: "Leçon « Créer et supprimer : post et delete »."
    skills: [angular-services, api-rest]
    xp: 15
    memo: |
      - Un **intercepteur** voit passer **toutes** les requêtes HTTP.
      - Il ajoute `Authorization: Bearer <jeton>` en **clonant** la requête : `req.clone({ setHeaders: { … } })`.
      - On l'enregistre une fois : `provideHttpClient(withInterceptors([authInterceptor]))`.
    commonMistakes: |
      - Vouloir modifier la requête directement : elle est immuable, on la clone.
      - Oublier de laisser passer la requête avec `next(...)`.
    blocks:
      - type: definition
        id: def-intercepteur
        term: "Intercepteur"
        md: |
          Un **guichet de contrôle** par lequel passent **toutes** les requêtes. Il peut y coller un tampon
          (le jeton JWT) avant de les laisser partir.
      - type: code
        id: code-intercepteur
        language: typescript
        title: "auth.interceptor.ts"
        code: |
          export const authInterceptor: HttpInterceptorFn = (req, next) => {
            const jeton = inject(AuthService).jeton();
            if (!jeton) {
              return next(req);
            }
            return next(req.clone({ setHeaders: { Authorization: `Bearer ${jeton}` } }));
          };

          // app.config.ts
          // provideHttpClient(withInterceptors([authInterceptor]))
        lines:
          - n: 1
            note: "Une fonction qui reçoit la requête et le « suivant » dans la chaîne."
          - n: 4
            note: "Pas de jeton : la requête passe telle quelle."
          - n: 6
            note: "Une requête ne se modifie pas : on la **clone** avec l'en-tête en plus."
          - n: 10
            note: "On enregistre l'intercepteur une seule fois, dans la configuration."
      - type: question
        ref: ng-ht-q2
        review: code-intercepteur
      - type: question
        ref: ng-ht-q5
        review: code-intercepteur
      - type: text
        md: "**Exercice 1 (guidé)** : complète l'intercepteur."
      - type: exercise
        ref: ng-ex-intercepteur-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un intercepteur de langue."
      - type: exercise
        ref: ng-ex-intercepteur-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une requête modifiée directement."
      - type: exercise
        ref: ng-ex-intercepteur-bug
      - type: jury
        items:
          - q: "Comment le jeton JWT est-il envoyé à l'API ?"
            a: "Un intercepteur HTTP ajoute l'en-tête Authorization: Bearer <jeton> à chaque requête. Il peut aussi intercepter les réponses 401 pour déconnecter l'utilisatrice et la renvoyer vers la page de connexion."
      - type: quiz
        items:
          - ref: ng-ic-q3
            review: def-intercepteur
          - ref: ng-ic-q4
            review: code-intercepteur
          - ref: ng-ic-q5
            review: code-intercepteur
    questions:
      - code: ng-ht-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: api-rest
        prompt: "Quel en-tête transporte le jeton JWT vers l'API ?"
        choices:
          - label: "Authorization: Bearer <jeton>"
            correct: true
            why: "C'est la convention standard."
          - label: "Cookie: jwt"
            correct: false
            why: "Possible dans d'autres architectures, mais pas avec un intercepteur Bearer."
          - label: "Content-Type: jwt"
            correct: false
            why: "Content-Type décrit le format du corps."
        explanation: "Bearer = « porteur » du jeton."
      - code: ng-ht-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-services
        prompt: "Pourquoi l'intercepteur utilise-t-il `req.clone(…)` ?"
        choices:
          - label: "Parce qu'une requête HttpClient ne peut pas être modifiée : on en crée une copie modifiée"
            correct: true
            why: "Les requêtes sont immuables."
          - label: "Pour envoyer la requête deux fois"
            correct: false
            why: "Une seule requête part."
          - label: "Pour chiffrer la requête"
            correct: false
            why: "C'est HTTPS qui chiffre."
        explanation: "Immuable = on remplace au lieu de modifier."
      - code: ng-ic-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-services
        prompt: "Quelles requêtes passent par l'intercepteur ?"
        choices:
          - label: "Toutes les requêtes HttpClient"
            correct: true
            why: "C'est un guichet commun."
          - label: "Seulement les GET"
            correct: false
            why: "Tous les verbes passent."
          - label: "Seulement celles d'un composant"
            correct: false
            why: "Il est global."
        explanation: "Un endroit unique pour toutes les requêtes."
      - code: ng-ic-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-services
        prompt: "Sans jeton, l'intercepteur laisse passer la requête telle quelle avec `next(req)`."
        choices:
          - label: "Vrai"
            correct: true
            why: "Les pages publiques continuent de marcher."
          - label: "Faux"
            correct: false
            why: "C'est la branche « pas de jeton »."
        explanation: "next(req) = laisser partir."
      - code: ng-ic-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-services
        prompt: "Où enregistre-t-on l'intercepteur ?"
        choices:
          - label: "Une fois, dans app.config.ts avec withInterceptors"
            correct: true
            why: "Il s'applique ensuite partout."
          - label: "Dans chaque composant"
            correct: false
            why: "Une seule fois suffit."
          - label: "Dans le fichier de routes"
            correct: false
            why: "Les routes ne gèrent pas HTTP."
        explanation: "`provideHttpClient(withInterceptors([authInterceptor]))`."
    exercises:
      - slug: ng-ex-intercepteur-guide
        kind: COMPLETER
        title: "Compléter l'intercepteur"
        difficulty: FACILE
        skill: angular-services
        statement: "Complète le clonage, l'en-tête et l'envoi."
        criteria: "Les trois trous sont corrects."
        hints:
          - "On copie la requête avec clone."
          - "L'en-tête du jeton s'appelle Authorization ; on laisse partir avec next."
          - "clone, Authorization, next."
        solution: '["clone", "Authorization", "next"]'
        explanation: "Copier, tamponner, laisser partir."
        xp: 10
        payload:
          language: typescript
          template: |
            const copie = req.[[1]]({ setHeaders: { [[2]]: `Bearer ${jeton}` } });
            return [[3]](copie);
          blanks:
            - ["clone"]
            - ["Authorization"]
            - ["next"]
      - slug: ng-ex-intercepteur-libre
        kind: CODE_LIBRE
        title: "Un intercepteur de langue"
        difficulty: INTERMEDIAIRE
        skill: angular-services
        statement: |
          Écris `langueInterceptor` de type `HttpInterceptorFn`, qui ajoute à toutes les requêtes l'en-tête
          `'Accept-Language': 'fr'` puis laisse partir la copie.
        criteria: "HttpInterceptorFn, clone avec setHeaders, next sur la copie."
        hints:
          - "`export const langueInterceptor: HttpInterceptorFn = (req, next) => { … };`"
          - "`req.clone({ setHeaders: { 'Accept-Language': 'fr' } })`"
          - "`return next(req.clone(…));`"
        solution: |
          export const langueInterceptor: HttpInterceptorFn = (req, next) => {
            return next(req.clone({ setHeaders: { 'Accept-Language': 'fr' } }));
          };
        explanation: "Le même modèle sert pour tout en-tête commun."
        xp: 15
        payload:
          language: typescript
          starter: |
            export const langueInterceptor
          checks:
            - pattern: 'langueInterceptor\s*:\s*HttpInterceptorFn\s*=\s*\(\s*req\s*,\s*next\s*\)\s*=>'
              message: "Déclare langueInterceptor: HttpInterceptorFn = (req, next) => …"
            - pattern: 'req\.clone\s*\(\s*\{\s*setHeaders\s*:\s*\{\s*[''"]Accept-Language[''"]\s*:\s*[''"]fr[''"]'
              message: "Clone la requête avec setHeaders: { 'Accept-Language': 'fr' }."
            - pattern: 'next\s*\(\s*req\.clone'
              message: "Laisse partir la copie : return next(req.clone(…))."
      - slug: ng-ex-intercepteur-bug
        kind: CORRIGER_ERREUR
        title: "Une requête modifiée directement"
        difficulty: INTERMEDIAIRE
        skill: angular-services
        statement: |
          Cet intercepteur essaie de modifier la requête directement, ce qui est impossible. Remplace les deux
          dernières lignes par un seul `return next(req.clone(…))` qui ajoute l'en-tête `Authorization`.
        criteria: "Clonage avec setHeaders, sans modification directe."
        hints:
          - "Une requête est immuable."
          - "On la clone avec l'en-tête en plus."
          - "`return next(req.clone({ setHeaders: { Authorization: `Bearer ${jeton}` } }));`"
        solution: |
          export const authInterceptor: HttpInterceptorFn = (req, next) => {
            const jeton = inject(AuthService).jeton();
            return next(req.clone({ setHeaders: { Authorization: `Bearer ${jeton}` } }));
          };
        explanation: "Immuable : on clone."
        xp: 10
        payload:
          language: typescript
          starter: |
            export const authInterceptor: HttpInterceptorFn = (req, next) => {
              const jeton = inject(AuthService).jeton();
              req.headers.set('Authorization', `Bearer ${jeton}`);
              return next(req);
            };
          checks:
            - pattern: 'req\.headers\.set'
              absent: true
              message: "On ne modifie pas la requête directement."
            - pattern: 'next\s*\(\s*req\.clone\s*\(\s*\{\s*setHeaders\s*:\s*\{\s*Authorization\s*:'
              message: "Écris return next(req.clone({ setHeaders: { Authorization: … } }))."

