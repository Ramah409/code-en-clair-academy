        explanation: "GET lire, POST créer, PUT/PATCH modifier, DELETE supprimer."
      - code: ng-he-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: api-rest
        prompt: "Dans `http.post<Livre>('/api/livres', livre)`, où part l'objet `livre` ?"
        choices:
          - label: "Dans le corps de la requête, en JSON"
            correct: true
