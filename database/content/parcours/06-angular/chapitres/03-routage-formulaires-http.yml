        criteria: "canActivate: [adminGuard] sur la route admin."
        hints:
          - "Quelle propriété de route reçoit les gardes ?"
          - "canActivate, avec une liste."
          - "`canActivate: [adminGuard],`"
        solution: |
          { path: 'admin', canActivate: [adminGuard], component: AdminComponent }
        explanation: "La garde est consultée avant l'entrée."
        xp: 10
        payload:
          language: typescript
          starter: |
            { path: 'admin', component: AdminComponent }
          checks:
            - pattern: 'canActivate\s*:\s*\[\s*adminGuard\s*\]'
              message: "Ajoute canActivate: [adminGuard]."

  # ===================================================================== LEÇON 4
  - slug: ng-formulaires
    title: "Le formulaire réactif"
    duration: 11
    objective: "Décrire un formulaire dans la classe avec fb.group, le brancher dans le template et récupérer les valeurs."
    prerequisites: "Leçon « Protéger une page : les gardes »."
    skills: [angular-formulaires]
    xp: 15
    memo: |
      - Formulaire **réactif** : le formulaire est décrit **dans la classe**, le template s'y branche.
      - `form = inject(NonNullableFormBuilder).group({ email: [''] })` : un champ `email`, vide au départ.
      - Template : `<form [formGroup]="form" (ngSubmit)="envoyer()">` et `<input formControlName="email">`.
      - `form.getRawValue()` : les valeurs saisies.
      - Ajouter `ReactiveFormsModule` dans les `imports` du composant.
    commonMistakes: |
      - Oublier `ReactiveFormsModule` dans les `imports` du composant.
      - Écrire `name="email"` au lieu de `formControlName="email"`.
    blocks:
      - type: definition
        id: def-form-reactif
        term: "Formulaire réactif"
        md: |
          Le formulaire est d'abord **décrit dans la classe**, comme un **plan de montage** : quels champs. Le
          template ne fait que brancher chaque champ HTML sur son morceau du plan.
      - type: code
        id: code-formulaire
        language: typescript
        title: "contact.component.ts"
        code: |
          @Component({
            selector: 'app-contact',
            imports: [ReactiveFormsModule],
            template: `
              <form [formGroup]="form" (ngSubmit)="envoyer()">
                <label for="nom">Nom</label>
                <input id="nom" formControlName="nom">
                <button type="submit">Envoyer</button>
              </form>
            `,
          })
          export class ContactComponent {
            private readonly fb = inject(NonNullableFormBuilder);
            form = this.fb.group({ nom: [''] });

            envoyer() {
              console.log(this.form.getRawValue());
            }
          }
        lines:
          - n: 3
            note: "Sans `ReactiveFormsModule`, `formGroup` est inconnu dans le template."
          - n: 5
            note: "`[formGroup]` branche le HTML sur le plan ; `(ngSubmit)` est appelé à l'envoi."
          - n: 6
            note: "Un `label` relié au champ : indispensable pour l'accessibilité."
          - n: 7
            note: "`formControlName` relie ce champ au contrôle `nom`."
          - n: 14
            note: "Le plan : un champ `nom`, vide au départ."
          - n: 17
            note: "Les valeurs saisies, par exemple `{ nom: 'Awa' }`."
      - type: question
        ref: ng-fm-q2
        review: code-formulaire
      - type: question
        ref: ng-fm-q5
        review: def-form-reactif
      - type: text
        md: "**Exercice 1 (guidé)** : branche le formulaire."
      - type: exercise
        ref: ng-ex-form-base-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un formulaire de recherche."
      - type: exercise
        ref: ng-ex-form-base-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un champ débranché."
      - type: exercise
        ref: ng-ex-form-base-bug
      - type: jury
        items:
          - q: "Formulaires réactifs ou formulaires pilotés par le template ?"
            a: "J'utilise les formulaires réactifs : la structure et les validateurs sont dans la classe, fortement typés, faciles à tester et à faire évoluer. Les formulaires template (ngModel) conviennent aux très petits formulaires."
      - type: quiz
        items:
          - ref: ng-fm-q4
            review: code-formulaire
          - ref: ng-fr-q4
            review: code-formulaire
          - ref: ng-fr-q5
            review: code-formulaire
    questions:
      - code: ng-fm-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-formulaires
        prompt: "Quel attribut relie un `<input>` à un contrôle du FormGroup ?"
        choices:
          - label: "formControlName=\"email\""
            correct: true
            why: "Il désigne le contrôle par son nom."
          - label: "name=\"email\""
            correct: false
            why: "C'est l'attribut HTML classique, sans lien avec le FormGroup."
          - label: "[(ngModel)]=\"email\""
            correct: false
            why: "C'est la syntaxe des formulaires template."
        explanation: "`formControlName` dans un `[formGroup]`."
      - code: ng-fm-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-formulaires
        prompt: "Où sont déclarés les champs d'un formulaire réactif ?"
        choices:
          - label: "Dans la classe du composant"
            correct: true
            why: "Le template s'y branche."
          - label: "Uniquement dans le HTML"
            correct: false
            why: "C'est le principe des formulaires template."
          - label: "Dans la base de données"
            correct: false
            why: "Aucun rapport."
        explanation: "Réactif = piloté par le code."
      - code: ng-fm-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-formulaires
        prompt: "Chaque champ doit avoir un `<label>` relié pour être accessible aux lecteurs d'écran."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le label est lu quand le champ reçoit le focus."
          - label: "Faux"
            correct: false
            why: "Un placeholder ne remplace pas un label."
        explanation: "`<label for=\"id\">` + `<input id=\"id\">`."
      - code: ng-fr-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-formulaires
        prompt: "Quel événement appelle `envoyer()` quand on soumet le formulaire ?"
        choices:
          - label: "`(ngSubmit)=\"envoyer()\"` sur la balise form"
            correct: true
            why: "Il est déclenché par le bouton submit."
          - label: "`[ngSubmit]=\"envoyer()\"`"
            correct: false
            why: "Un événement s'écoute avec des parenthèses."
          - label: "`(click)=\"envoyer\"` sur le label"
            correct: false
            why: "Le label ne soumet rien."
        explanation: "`<form [formGroup]=\"form\" (ngSubmit)=\"envoyer()\">`."
      - code: ng-fr-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-formulaires
        prompt: "Que renvoie `this.form.getRawValue()` ?"
        choices:
          - label: "Un objet avec les valeurs saisies, par exemple `{ nom: 'Awa' }`"
            correct: true
            why: "Prêt à être envoyé à l'API."
          - label: "Le HTML du formulaire"
            correct: false
            why: "Il renvoie les données."
          - label: "Le nombre de champs"
            correct: false
            why: "Il renvoie les valeurs."
        explanation: "getRawValue = les données saisies."
    exercises:
      - slug: ng-ex-form-base-guide
        kind: COMPLETER
        title: "Brancher le formulaire"
        difficulty: FACILE
        skill: angular-formulaires
        statement: "Complète le template qui se branche sur `form` (champ `email`) et appelle `connecter()` à l'envoi."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La balise form se branche avec [formGroup], crochets compris."
          - "L'envoi s'écoute avec (ngSubmit) ; le champ se relie avec formControlName."
          - "[formGroup], ngSubmit, formControlName."
        solution: '["[formGroup]", "ngSubmit", "formControlName"]'
        explanation: "Brancher le groupe, écouter l'envoi, relier le champ."
        xp: 10
        payload:
          language: html
          template: |
            <form [[1]]="form" ([[2]])="connecter()">
              <input type="email" [[3]]="email">
              <button type="submit">Se connecter</button>
            </form>
          blanks:
            - ["[formGroup]"]
            - ["ngSubmit"]
            - ["formControlName"]
      - slug: ng-ex-form-base-libre
        kind: CODE_LIBRE
        title: "Un formulaire de recherche"
        difficulty: FACILE
        skill: angular-formulaires
        statement: |
          Dans la classe `RechercheComponent` (sans décorateur) :
          - injecte `NonNullableFormBuilder` dans `fb` ;
          - crée `form` avec un champ `motCle`, vide au départ ;
          - écris `chercher()` qui affiche `this.form.getRawValue()` avec `console.log`.
        criteria: "fb injecté, group avec motCle, méthode chercher qui lit getRawValue."
        hints:
          - "`private readonly fb = inject(NonNullableFormBuilder);`"
          - "`form = this.fb.group({ motCle: [''] });`"
          - "`chercher() { console.log(this.form.getRawValue()); }`"
        solution: |
          export class RechercheComponent {
            private readonly fb = inject(NonNullableFormBuilder);
            form = this.fb.group({ motCle: [''] });

            chercher() {
              console.log(this.form.getRawValue());
            }
          }
        explanation: "Le plan dans la classe, les valeurs à l'envoi."
        xp: 15
        payload:
          language: typescript
          starter: |
            export class RechercheComponent {

            }
          checks:
            - pattern: '\bfb\s*=\s*inject\s*\(\s*NonNullableFormBuilder\s*\)'
              message: "Injecte NonNullableFormBuilder dans fb."
            - pattern: 'form\s*=\s*this\.fb\.group\s*\(\s*\{\s*motCle\s*:\s*\[\s*[''"]{2}\s*\]'
              message: "Crée form = this.fb.group({ motCle: [''] })."
            - pattern: 'chercher\s*\(\s*\)[^{]*\{[^}]*this\.form\.getRawValue\s*\(\s*\)'
              message: "Dans chercher(), lis this.form.getRawValue()."
      - slug: ng-ex-form-base-bug
        kind: CORRIGER_ERREUR
        title: "Un champ débranché"
        difficulty: FACILE
        skill: angular-formulaires
        statement: |
          Le champ `ville` utilise l'attribut HTML `name` : il n'est pas relié au formulaire réactif. Corrige.
        criteria: "formControlName=\"ville\"."
        hints:
          - "Quel attribut relie un champ au FormGroup ?"
          - "formControlName."
          - "`<input formControlName=\"ville\">`"
        solution: |
          <form [formGroup]="form" (ngSubmit)="envoyer()">
            <input formControlName="ville">
          </form>
        explanation: "name ne relie rien ; formControlName si."
        xp: 10
        payload:
          language: html
          starter: |
            <form [formGroup]="form" (ngSubmit)="envoyer()">
              <input name="ville">
            </form>
          checks:
            - pattern: '<input[^>]*\bname\s*='
