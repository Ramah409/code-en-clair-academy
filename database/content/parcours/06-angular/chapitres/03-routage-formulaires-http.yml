            - pattern: '<input[^>]*formControlName\s*=\s*"ville"'
              message: "Écris formControlName=\"ville\"."

  # ===================================================================== LEÇON 5
  - slug: ng-validateurs
    title: "Valider un formulaire et afficher les erreurs"
    duration: 12
    objective: "Ajouter des validateurs, bloquer l'envoi d'un formulaire invalide et afficher des messages d'erreur au bon moment."
    prerequisites: "Leçon « Le formulaire réactif »."
    skills: [angular-formulaires]
    xp: 15
    memo: |
      - Les règles se placent après la valeur de départ : `email: ['', [Validators.required, Validators.email]]`.
      - `Validators.required` (obligatoire), `Validators.email` (format), `Validators.minLength(12)` (longueur minimale).
      - `form.invalid` : vrai s'il reste une erreur ; `markAllAsTouched()` affiche toutes les erreurs.
      - Afficher l'erreur seulement si le champ a été touché : `form.controls.email.touched && form.controls.email.hasError('email')`.
    commonMistakes: |
      - Afficher les erreurs avant que l'utilisatrice ait touché le champ.
      - Ne valider que côté Angular : le backend doit valider aussi (`@Valid`).
    blocks:
      - type: text
        md: |
          Un formulaire d'inscription doit vérifier que l'e-mail ressemble à un e-mail, et le dire **gentiment**
          avant l'envoi.
      - type: definition
        id: def-validateur
        term: "Validateur"
        md: |
          Un **contrôleur de billets** posté sur un champ : il vérifie une règle (rempli, bon format…). Tant qu'un
          contrôleur dit non, le formulaire est **invalide**.
      - type: code
        id: code-validateurs
        language: typescript
        title: "inscription.component.ts"
        code: |
          form = this.fb.group({
            email: ['', [Validators.required, Validators.email]],
            motDePasse: ['', [Validators.required, Validators.minLength(12)]],
          });

          envoyer() {
            if (this.form.invalid) {
              this.form.markAllAsTouched();
              return;
            }
            console.log(this.form.getRawValue());
          }
        lines:
          - n: 2
            note: "Valeur de départ `''`, puis la liste des règles (**validateurs**)."
          - n: 3
            note: "`minLength(12)` : au moins 12 caractères."
          - n: 7
            note: "Formulaire invalide : on marque tout comme « touché » pour afficher les erreurs, puis on s'arrête."
      - type: code
        id: code-erreur-html
        language: html
        title: "Le message d'erreur"
        code: |
          <input id="email" type="email" formControlName="email">
          @if (form.controls.email.touched && form.controls.email.hasError('email')) {
            <p class="erreur">Cet e-mail n'a pas un format valide.</p>
          }
        lines:
          - n: 2
            note: "On n'affiche l'erreur que si le champ a été touché et que la règle email échoue."
      - type: question
        ref: ng-fm-q1
        review: def-validateur
      - type: question
        ref: ng-fm-q3
        review: code-validateurs
      - type: text
        md: "**Exercice 1 (guidé)** : le formulaire de connexion."
      - type: exercise
        ref: ng-ex-form-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : le formulaire de contact."
      - type: exercise
        ref: ng-ex-form
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un formulaire envoyé malgré les erreurs."
      - type: exercise
        ref: ng-ex-validateur-bug
      - type: jury
        items:
          - q: "La validation côté Angular suffit-elle ?"
            a: "Non. Elle améliore l'expérience utilisateur, mais n'importe qui peut appeler l'API directement. Le backend revalide avec Bean Validation (@Valid, @NotBlank, @Email) et renvoie une erreur 400 claire."
      - type: quiz
        items:
          - ref: ng-va-q3
            review: code-erreur-html
          - ref: ng-va-q4
            review: def-validateur
          - ref: ng-va-q5
            review: code-validateurs
    questions:
      - code: ng-fm-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-formulaires
        prompt: "Quel validateur vérifie qu'un champ n'est pas vide ?"
        choices:
          - label: "Validators.required"
            correct: true
            why: "Champ obligatoire."
          - label: "Validators.email"
            correct: false
            why: "Il vérifie le format d'un e-mail."
          - label: "Validators.minLength(1)"
            correct: false
            why: "Il ne se déclenche pas sur une valeur vide ; on utilise required."
        explanation: "required = obligatoire."
      - code: ng-fm-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-formulaires
        prompt: "À quoi sert `markAllAsTouched()` avant de quitter `envoyer()` ?"
        choices:
          - label: "À afficher toutes les erreurs, même sur les champs jamais visités"
            correct: true
            why: "Les messages dépendent de touched."
          - label: "À envoyer le formulaire malgré les erreurs"
            correct: false
            why: "On fait return juste après."
          - label: "À vider le formulaire"
            correct: false
            why: "C'est reset()."
        explanation: "L'utilisatrice voit tout ce qu'il reste à corriger."
      - code: ng-va-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-formulaires
        prompt: "Pourquoi tester `touched` avant d'afficher une erreur ?"
        choices:
          - label: "Pour ne pas afficher d'erreurs sur un formulaire que l'utilisatrice n'a pas encore rempli"
            correct: true
            why: "Un formulaire tout rouge dès l'ouverture décourage."
          - label: "Parce que hasError ne marche pas sans"
            correct: false
            why: "hasError fonctionne toujours."
          - label: "Pour accélérer le formulaire"
            correct: false
            why: "C'est une question de confort."
        explanation: "Afficher l'erreur au bon moment."
      - code: ng-va-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-formulaires
        prompt: "Si la validation Angular est bonne, le backend n'a pas besoin de revalider."
        choices:
          - label: "Vrai"
            correct: false
            why: "On peut appeler l'API sans passer par Angular."
          - label: "Faux"
            correct: true
            why: "Le backend revalide toujours."
        explanation: "Angular : confort ; backend : sécurité."
      - code: ng-va-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-formulaires
        prompt: "Où placer les validateurs d'un champ ?"
        choices:
          - label: "Après la valeur de départ : `['', [Validators.required]]`"
            correct: true
            why: "Valeur, puis liste des règles."
          - label: "Dans le HTML, dans l'attribut name"
            correct: false
            why: "Les règles sont dans la classe."
          - label: "Dans la route"
            correct: false
            why: "Aucun rapport."
        explanation: "`champ: [valeur, [règles]]`."
    exercises:
      - slug: ng-ex-form-guide
        kind: COMPLETER
        title: "Le formulaire de connexion"
        difficulty: FACILE
        skill: angular-formulaires
        statement: "Complète les validateurs du champ email, puis le test qui bloque l'envoi."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Obligatoire : required ; format : email."
          - "La propriété vraie s'il reste une erreur : invalid."
          - "required, email, invalid."
        solution: '["required", "email", "invalid"]'
        explanation: "Des règles, puis un contrôle avant l'envoi."
        xp: 10
        payload:
          language: typescript
          template: |
            form = this.fb.group({
              email: ['', [Validators.[[1]], Validators.[[2]]]],
              motDePasse: ['', Validators.required],
            });

            connecter() {
              if (this.form.[[3]]) {
                this.form.markAllAsTouched();
                return;
              }
            }
          blanks:
            - ["required"]
            - ["email"]
            - ["invalid"]
      - slug: ng-ex-form
        kind: CODE_LIBRE
        title: "Le formulaire de contact"
        difficulty: INTERMEDIAIRE
        skill: angular-formulaires
        statement: |
          Dans la classe `ContactComponent` (sans décorateur), écris :
          - `private readonly fb = inject(NonNullableFormBuilder);`
          - un `form` avec trois champs : `nom` (obligatoire), `email` (obligatoire + format e-mail),
            `message` (obligatoire + au moins 20 caractères) ;
          - une méthode `envoyer()` qui, si le formulaire est invalide, appelle `markAllAsTouched()` et s'arrête.
        criteria: "fb.group avec trois champs et leurs validateurs ; envoyer() teste invalid et appelle markAllAsTouched."
        hints:
          - "`form = this.fb.group({ nom: ['', Validators.required], … });`"
          - "Plusieurs validateurs : `['', [Validators.required, Validators.minLength(20)]]`."
          - "`if (this.form.invalid) { this.form.markAllAsTouched(); return; }`"
        solution: |
          export class ContactComponent {
            private readonly fb = inject(NonNullableFormBuilder);

            form = this.fb.group({
              nom: ['', Validators.required],
              email: ['', [Validators.required, Validators.email]],
              message: ['', [Validators.required, Validators.minLength(20)]],
            });

            envoyer() {
              if (this.form.invalid) {
                this.form.markAllAsTouched();
                return;
              }
            }
          }
        explanation: "Un formulaire typé, validé, qui montre toutes les erreurs à l'envoi."
        xp: 25
        payload:
          language: typescript
          starter: |
            export class ContactComponent {
              private readonly fb = inject(NonNullableFormBuilder);

            }
          checks:
            - pattern: 'form\s*=\s*this\.fb\.group\s*\(\s*\{'
              message: "Crée le formulaire avec `form = this.fb.group({ … })`."
            - pattern: '\bnom\s*:\s*\[\s*[''"]{2}\s*,\s*\[?\s*Validators\.required'
              message: "Le champ nom doit être obligatoire."
            - pattern: '\bemail\s*:\s*\[\s*[''"]{2}\s*,\s*\[(?=[^\]]*Validators\.required)(?=[^\]]*Validators\.email)'
              message: "Le champ email a besoin de `Validators.required` et `Validators.email`."
            - pattern: '\bmessage\s*:\s*\[\s*[''"]{2}\s*,\s*\[(?=[^\]]*Validators\.required)(?=[^\]]*Validators\.minLength\s*\(\s*20\s*\))'
              message: "Le champ message a besoin de `Validators.required` et `Validators.minLength(20)`."
            - pattern: 'envoyer\s*\(\s*\)[^{]*\{\s*if\s*\(\s*this\.form\.invalid\s*\)'
              message: "Dans `envoyer()`, commence par tester `this.form.invalid`."
            - pattern: 'this\.form\.markAllAsTouched\s*\(\s*\)'
              message: "Appelle `this.form.markAllAsTouched()` pour afficher les erreurs."
      - slug: ng-ex-validateur-bug
        kind: CORRIGER_ERREUR
        title: "Un formulaire envoyé malgré les erreurs"
        difficulty: FACILE
        skill: angular-formulaires
        statement: |
          `envoyer()` transmet les valeurs même si le formulaire est invalide. Ajoute au début le test qui
          affiche les erreurs et s'arrête.
        criteria: "if (this.form.invalid) { markAllAsTouched(); return; } avant l'envoi."
        hints:
          - "Quelle propriété dit qu'il reste une erreur ?"
          - "this.form.invalid."
          - "`if (this.form.invalid) { this.form.markAllAsTouched(); return; }`"
        solution: |
          envoyer() {
            if (this.form.invalid) {
              this.form.markAllAsTouched();
              return;
            }
            this.service.envoyer(this.form.getRawValue());
          }
        explanation: "On ne transmet que des données valides."
        xp: 10
        payload:
          language: typescript
          starter: |
            envoyer() {
              this.service.envoyer(this.form.getRawValue());
            }
          checks:
            - pattern: 'if\s*\(\s*this\.form\.invalid\s*\)\s*\{\s*this\.form\.markAllAsTouched\s*\(\s*\)\s*;\s*return\s*;\s*\}[\s\S]*this\.service\.envoyer'
              message: "Au début d'envoyer(), teste this.form.invalid, appelle markAllAsTouched() puis return."

  # ===================================================================== LEÇON 6
  - slug: ng-http
    title: "Lire des données de l'API : get et subscribe"
    duration: 12
    objective: "Récupérer des données avec HttpClient.get, comprendre qu'un Observable attend un abonnement, et gérer l'erreur."
    prerequisites: "Leçon « Valider un formulaire et afficher les erreurs »."
    skills: [angular-services, api-rest, full-stack]
    xp: 15
    memo: |
      - `HttpClient` s'active avec `provideHttpClient()` dans `app.config.ts`, puis s'injecte dans un service.
      - `http.get<Livre[]>('/api/livres')` renvoie un **Observable** : rien ne part tant qu'on ne s'**abonne** pas.
      - `subscribe({ next, error })` : réagir à la réponse ou à l'erreur.
    commonMistakes: |
      - Appeler `http.get(...)` sans `subscribe` : la requête n'est jamais envoyée.
      - Oublier de gérer l'erreur : l'écran reste bloqué sur « Chargement… ».
    blocks:
      - type: text
        md: |
          Jusqu'ici, nos données étaient écrites dans le code. Dans une vraie application, elles viennent de
          l'**API Spring Boot**. Angular les demande avec `HttpClient`, et la réponse arrive **plus tard**.
      - type: definition
        id: def-observable
        term: "Observable"
        md: |
          Une **promesse de livraison**. Commander un colis ne le fait pas arriver : il faut d'abord
          **s'abonner** (donner son adresse). Ensuite, on est prévenu à l'arrivée (`next`) ou en cas de
          problème (`error`).
      - type: code
        id: code-http
        language: typescript
        title: "livre.service.ts"
        code: |
          @Injectable({ providedIn: 'root' })
          export class LivreService {
            private readonly http = inject(HttpClient);

            lister(): Observable<Livre[]> {
              return this.http.get<Livre[]>('/api/livres');
            }
          }
        lines:
          - n: 3
            note: "Le service reçoit `HttpClient` par injection."
          - n: 6
            note: "`get<Livre[]>` : on annonce le type de la réponse. **Rien n'est encore envoyé.**"
      - type: code
        id: code-subscribe
        language: typescript
        title: "Dans le composant"
        code: |
          export class ListeLivresComponent {
            private readonly service = inject(LivreService);
            livres = signal<Livre[]>([]);
            erreur = signal('');

            constructor() {
              this.service.lister().subscribe({
                next: liste => this.livres.set(liste),
                error: () => this.erreur.set('Impossible de charger les livres.'),
              });
            }
          }
        lines:
          - n: 7
            note: "`subscribe` déclenche vraiment la requête."
          - n: 8
            note: "`next` : la réponse est arrivée, on range la liste dans le signal."
          - n: 9
            note: "`error` : on affiche un message clair au lieu de rester bloqué."
      - type: question
        ref: ng-ht-q1
        review: def-observable
      - type: question
        ref: ng-ht-q3
        review: code-subscribe
      - type: text
        md: "**Exercice 1 (guidé)** : remets l'appel et l'abonnement dans l'ordre."
      - type: exercise
        ref: ng-ex-http-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : charger les salles."
      - type: exercise
        ref: ng-ex-http-get-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une requête jamais envoyée."
      - type: exercise
        ref: ng-ex-http-get-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'un Observable, et quelle différence avec une Promise ?"
            a: "Un flux de valeurs asynchrones de RxJS. Il est paresseux (rien ne se passe sans subscribe), peut émettre plusieurs valeurs, s'annuler (unsubscribe) et se transformer avec des opérateurs comme map ou switchMap. Une Promise démarre tout de suite et ne donne qu'une valeur."
      - type: quiz
        items:
          - ref: ng-hg-q3
            review: code-http
          - ref: ng-hg-q4
            review: code-subscribe
          - ref: ng-c3-b1
            review: def-observable
    questions:
      - code: ng-ht-q1
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-services
        prompt: "`this.http.get('/api/livres');` seul, sans subscribe, envoie la requête."
        choices:
          - label: "Vrai"
            correct: false
            why: "Un Observable est paresseux."
          - label: "Faux"
            correct: true
            why: "La requête part au moment de l'abonnement."
        explanation: "Pas d'abonnement, pas de requête (sauf `toSignal` ou le pipe `async`, qui s'abonnent pour toi)."
      - code: ng-ht-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: full-stack
        prompt: "L'API renvoie une erreur 500. Que se passe-t-il avec `subscribe({ next, error })` ?"
        choices:
          - label: "La fonction error est appelée"
            correct: true
            why: "Toute réponse 4xx ou 5xx passe par error."
          - label: "La fonction next reçoit null"
            correct: false
            why: "next n'est pas appelée en cas d'erreur."
          - label: "Rien ne se passe"
            correct: false
            why: "C'est justement pour ça qu'on gère error."
        explanation: "Prévois toujours un message d'erreur clair."
      - code: ng-hg-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-services
        prompt: "Où placer les appels HTTP ?"
        choices:
          - label: "Dans un service"
            correct: true
            why: "Le composant affiche, le service sait faire."
          - label: "Dans le template"
            correct: false
            why: "Le template affiche seulement."
          - label: "Dans le fichier de routes"
            correct: false
            why: "Aucun rapport."
        explanation: "Service = accès aux données."
      - code: ng-hg-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-services
        prompt: "Dans `subscribe({ next: liste => this.livres.set(liste) })`, que contient `liste` ?"
        choices:
          - label: "La réponse de l'API : les livres"
            correct: true
            why: "next reçoit les données arrivées."
          - label: "L'adresse de l'API"
            correct: false
            why: "C'est la donnée reçue."
          - label: "Le message d'erreur"
            correct: false
            why: "Il arrive dans error."
        explanation: "next = livraison reçue."
      - code: ng-c3-b1
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: angular-services
        prompt: "Une recherche lance une requête à chaque frappe. Quel opérateur RxJS annule la requête précédente quand une nouvelle arrive ?"
        choices:
          - label: "switchMap"
            correct: true
            why: "Il « bascule » sur la dernière requête et abandonne l'ancienne."
          - label: "map"
            correct: false
            why: "map transforme une valeur, il n'enchaîne pas de requête."
          - label: "filter"
            correct: false
            why: "filter garde ou rejette des valeurs."
        explanation: "Les opérateurs RxJS se placent dans `pipe(…)` ; switchMap est souvent combiné avec `debounceTime`."
    exercises:
      - slug: ng-ex-http-ordre
        kind: REMETTRE_ORDRE
        title: "Charger des commandes"
        difficulty: FACILE
        skill: angular-services
        statement: "Remets dans l'ordre ce code qui charge les commandes et gère l'erreur."
        criteria: "Appel, subscribe, next, error, fermetures."
        hints:
          - "On appelle d'abord le service, puis on s'abonne."
          - "next vient avant error."
          - "On ferme l'objet de subscribe, puis la parenthèse."
        solution: |
          this.service.lister()
            .subscribe({
              next: liste => this.commandes.set(liste),
              error: () => this.erreur.set('Chargement impossible.'),
            });
        explanation: "Appeler, s'abonner, traiter la réponse, traiter l'erreur."
        xp: 10
        payload:
          language: typescript
          lines:
            - "this.service.lister()"
            - "  .subscribe({"
            - "    next: liste => this.commandes.set(liste),"
            - "    error: () => this.erreur.set('Chargement impossible.'),"
            - "  });"
      - slug: ng-ex-http-get-libre
        kind: CODE_LIBRE
        title: "Charger les salles"
        difficulty: INTERMEDIAIRE
        skill: angular-services
        statement: |
          1. Dans `SalleService`, écris `lister(): Observable<Salle[]>` qui fait un GET sur `/api/salles`
             (`http` est déjà injecté).
          2. Dans le composant, abonne-toi : `next` range la liste dans le signal `salles`, `error` met
             `'Chargement impossible.'` dans le signal `erreur`.
        criteria: "get<Salle[]> sur /api/salles, subscribe avec next et error."
        hints:
