slug: ng-routage-formulaires-http
position: 3
level: AVANCE
title: "Routage, formulaires et appels HTTP"
summary: "Naviguer entre les pages, lire un paramètre d'adresse, protéger une page, créer un formulaire puis le valider, et dialoguer avec l'API Spring Boot. Une seule notion par leçon."
quizQuestionCount: 16

lessons:
  # ===================================================================== LEÇON 1
  - slug: ng-routage
    title: "Les routes : une adresse, une page"
    duration: 11
    objective: "Déclarer des routes, afficher la page active avec router-outlet et naviguer avec routerLink."
    prerequisites: "Chapitre « Templates, signaux et services »."
    skills: [angular-routage]
    xp: 15
    memo: |
      - Une **route** associe une adresse (`/livres`) à un composant.
      - `<router-outlet />` : l'**emplacement** où s'affiche la page de la route active.
      - `routerLink="/livres"` : un lien qui change de page **sans recharger** le site.
      - `path: '**'` attrape les adresses inconnues (page 404) ; elle se place **en dernier**.
    commonMistakes: |
      - Utiliser `href` au lieu de `routerLink` : toute l'application se recharge.
      - Oublier la route `**` pour les adresses inconnues, ou la placer avant les autres.
    blocks:
      - type: text
        md: |
          Une application Angular n'a qu'**une seule page HTML**. Pourtant, l'adresse change et on a
          l'impression de changer de page. C'est le **routeur** qui échange les composants affichés.
      - type: definition
        id: def-route
        term: "Route"
        md: |
          Une ligne du **plan de l'immeuble** : « à l'adresse `/profil`, on trouve la pièce `ProfilComponent` ».
          Le routeur lit l'adresse et ouvre la bonne pièce, à l'emplacement `<router-outlet />`.
      - type: code
        id: code-routes
        language: typescript
        title: "app.routes.ts"
        code: |
          export const routes: Routes = [
            { path: '', component: AccueilComponent },
            { path: 'livres', component: ListeLivresComponent },
            { path: 'contact', component: ContactComponent },
            { path: '**', component: PageIntrouvableComponent },
          ];

          // Dans le template principal :
          // <a routerLink="/livres">Livres</a>
          // <router-outlet />
        lines:
          - n: 2
            note: "Le chemin vide : la page d'accueil."
          - n: 3
            note: "À l'adresse `/livres`, on affiche `ListeLivresComponent`."
          - n: 5
            note: "`**` attrape toutes les adresses inconnues (page 404). Elle doit être **en dernier**."
          - n: 9
            note: "`routerLink` : on change de page sans recharger."
          - n: 10
            note: "`<router-outlet />` : l'endroit où la page s'affiche."
      - type: question
        ref: ng-rt-q1
        review: code-routes
      - type: question
        ref: ng-rt-q5
        review: def-route
      - type: text
        md: "**Exercice 1 (guidé)** : complète le fichier de routes."
      - type: exercise
        ref: ng-ex-routes-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : les routes d'une bibliothèque."
      - type: exercise
        ref: ng-ex-routes-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un lien qui recharge tout."
      - type: exercise
        ref: ng-ex-routerlink-bug
      - type: quiz
        items:
          - ref: ng-rt-q3
            review: code-routes
          - ref: ng-ro-q4
            review: def-route
          - ref: ng-ro-q5
            review: code-routes
    questions:
      - code: ng-rt-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-routage
        prompt: "Quel lien change de page sans recharger toute l'application ?"
        choices:
          - label: "<a routerLink=\"/livres\">"
            correct: true
            why: "Le routeur gère la navigation."
          - label: "<a href=\"/livres\">"
            correct: false
            why: "href recharge tout le site."
          - label: "<a link=\"/livres\">"
            correct: false
            why: "Cet attribut n'existe pas."
        explanation: "routerLink = navigation interne."
      - code: ng-rt-q5
        kind: TEXTE
        difficulty: 2
        skill: angular-routage
        prompt: "Quelle balise indique où s'affiche la page de la route active ? (sans les chevrons)"
        answers: ["router-outlet", "router-outlet /", "router-outlet/"]
        explanation: "`<router-outlet />` se place en général dans le composant principal."
      - code: ng-rt-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-routage
        prompt: "Pourquoi la route `**` doit-elle être la dernière ?"
        choices:
          - label: "Parce qu'elle correspond à toutes les adresses : les routes suivantes ne seraient jamais atteintes"
            correct: true
            why: "Le routeur prend la première route qui correspond."
          - label: "Parce qu'Angular trie les routes par ordre alphabétique"
            correct: false
            why: "L'ordre d'écriture compte."
          - label: "Ce n'est pas obligatoire"
            correct: false
            why: "Placée avant, elle masquerait les autres."
        explanation: "Premier trouvé, premier servi."
      - code: ng-ro-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-routage
        prompt: "Une application Angular change réellement de page HTML à chaque navigation."
        choices:
          - label: "Vrai"
            correct: false
            why: "Il n'y a qu'une page : le routeur échange les composants."
          - label: "Faux"
            correct: true
            why: "Seul le contenu de router-outlet change."
        explanation: "Une seule page, des composants échangés."
      - code: ng-ro-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-routage
        prompt: "Quelle route affiche la page d'accueil ?"
        choices:
          - label: "`{ path: '', component: AccueilComponent }`"
            correct: true
            why: "Le chemin vide correspond à la racine du site."
          - label: "`{ path: '**', component: AccueilComponent }`"
            correct: false
            why: "`**` est pour les adresses inconnues."
          - label: "`{ path: '/', component: AccueilComponent }`"
            correct: false
            why: "Les chemins s'écrivent sans barre au début."
        explanation: "'' = accueil ; '**' = 404."
    exercises:
      - slug: ng-ex-routes-guide
        kind: COMPLETER
        title: "Compléter les routes"
        difficulty: FACILE
        skill: angular-routage
        statement: "Complète : la page des livres (`/livres`), la page des salles (`/salles`) et la page introuvable."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Les chemins s'écrivent sans barre au début."
          - "La page 404 attrape toutes les adresses."
          - "livres, salles, **."
        solution: '["livres", "salles", "**"]'
        explanation: "Une adresse par page, et la 404 en dernier."
        xp: 10
        payload:
          language: typescript
          template: |
            export const routes: Routes = [
              { path: '', component: AccueilComponent },
              { path: '[[1]]', component: ListeLivresComponent },
              { path: '[[2]]', component: SallesComponent },
              { path: '[[3]]', component: PageIntrouvableComponent },
            ];
          blanks:
            - ["livres"]
            - ["salles"]
            - ["**"]
      - slug: ng-ex-routes-libre
        kind: CODE_LIBRE
        title: "Les routes d'une bibliothèque"
        difficulty: FACILE
        skill: angular-routage
        statement: |
          Écris le tableau `routes` avec, dans cet ordre :
          - `''` → `AccueilComponent` ;
          - `'livres'` → `ListeLivresComponent` ;
          - `'**'` → `PageIntrouvableComponent`.
        criteria: "Trois routes, la route ** en dernier."
        hints:
          - "`export const routes: Routes = [ … ];`"
          - "Chaque route : `{ path: 'livres', component: ListeLivresComponent }`."
          - "La route `**` se place à la fin."
        solution: |
          export const routes: Routes = [
            { path: '', component: AccueilComponent },
            { path: 'livres', component: ListeLivresComponent },
            { path: '**', component: PageIntrouvableComponent },
          ];
        explanation: "Chaque adresse a sa page ; la 404 ferme la marche."
        xp: 15
        payload:
          language: typescript
          starter: |
            export const routes: Routes = [

            ];
          checks:
            - pattern: 'path\s*:\s*[''"]{2}\s*,\s*component\s*:\s*AccueilComponent'
              message: "Ajoute la route '' vers AccueilComponent."
            - pattern: 'path\s*:\s*[''"]livres[''"]\s*,\s*component\s*:\s*ListeLivresComponent'
              message: "Ajoute la route 'livres' vers ListeLivresComponent."
            - pattern: 'path\s*:\s*[''"]\*\*[''"]\s*,\s*component\s*:\s*PageIntrouvableComponent\s*\}\s*,?\s*\]'
              message: "Termine par la route '**' vers PageIntrouvableComponent."
      - slug: ng-ex-routerlink-bug
        kind: CORRIGER_ERREUR
        title: "Un lien qui recharge tout"
        difficulty: FACILE
        skill: angular-routage
        statement: |
          Ce menu utilise `href` : à chaque clic, toute l'application se recharge. Remplace par `routerLink`.
        criteria: "Les deux liens utilisent routerLink."
        hints:
          - "Quel attribut navigue sans recharger ?"
          - "routerLink."
          - "`<a routerLink=\"/livres\">Livres</a>`"
        solution: |
          <nav>
            <a routerLink="/livres">Livres</a>
            <a routerLink="/contact">Contact</a>
          </nav>
        explanation: "routerLink laisse le routeur changer la page."
        xp: 10
        payload:
          language: html
          starter: |
            <nav>
              <a href="/livres">Livres</a>
              <a href="/contact">Contact</a>
            </nav>
          checks:
            - pattern: '\bhref\s*='
              absent: true
              message: "Remplace href par routerLink."
            - pattern: 'routerLink\s*=\s*"/livres"[\s\S]*routerLink\s*=\s*"/contact"'
              message: "Utilise routerLink pour les deux liens."

  # ===================================================================== LEÇON 2
  - slug: ng-parametres-route
    title: "Lire un paramètre d'adresse : :id"
    duration: 10
    objective: "Déclarer une route avec un paramètre et le lire dans le composant."
    prerequisites: "Leçon « Les routes : une adresse, une page »."
    skills: [angular-routage]
    xp: 15
    memo: |
      - `path: 'livres/:id'` : `:id` est un **paramètre** : `/livres/12`, `/livres/40`…
      - Avec l'option `withComponentInputBinding()`, le composant le reçoit dans un **input du même nom** : `id = input<string>();`.
      - Lien vers un détail : `[routerLink]="['/livres', l.id]"`.
    commonMistakes: |
      - Oublier les deux-points : `livres/id` ne correspond qu'à l'adresse exacte « /livres/id ».
      - Donner à l'input un autre nom que le paramètre.
    blocks:
      - type: definition
        id: def-parametre
        term: "Paramètre de route"
        md: |
          Une **case à remplir** dans l'adresse, comme le numéro de chambre sur une clé d'hôtel : `/livres/:id`
          sert pour tous les livres, et `id` dit lequel.
      - type: code
        id: code-parametre
        language: typescript
        title: "La page détail d'un livre"
        code: |
          // app.routes.ts
          { path: 'livres/:id', component: DetailLivreComponent }

          // detail-livre.component.ts
          export class DetailLivreComponent {
            id = input<string>();
          }

          // Dans la liste :
          // <a [routerLink]="['/livres', l.id]">{{ l.titre }}</a>
        lines:
          - n: 2
            note: "`:id` : la partie variable de l'adresse."
          - n: 6
            note: "Le routeur remplit l'input qui porte le même nom que le paramètre."
          - n: 10
            note: "On construit l'adresse `/livres/12` à partir de l'identifiant."
      - type: question
        ref: ng-c3-b2
        review: code-parametre
      - type: question
        ref: ng-pa-q2
        review: def-parametre
      - type: text
        md: "**Exercice 1 (guidé)** : complète la route et le composant."
      - type: exercise
        ref: ng-ex-parametre-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : la page détail d'une salle."
      - type: exercise
        ref: ng-ex-parametre-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : des deux-points oubliés."
      - type: exercise
        ref: ng-ex-parametre-bug
      - type: quiz
        items:
          - ref: ng-pa-q3
            review: code-parametre
          - ref: ng-pa-q4
            review: def-parametre
          - ref: ng-pa-q5
            review: code-parametre
    questions:
      - code: ng-c3-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-routage
        prompt: "Comment lire le paramètre `:id` de la route dans un composant (avec `withComponentInputBinding`) ?"
        choices:
          - label: "Avec un input nommé id : `id = input<string>();`"
            correct: true
            why: "Le routeur remplit l'input du même nom."
          - label: "Avec `document.location`"
            correct: false
            why: "On passe par le routeur, pas par le navigateur."
          - label: "Ce n'est pas possible"
            correct: false
            why: "C'est même très courant (page détail)."
        explanation: "Sans cette option, on utilise `inject(ActivatedRoute)`."
      - code: ng-pa-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-routage
        prompt: "Quelles adresses correspondent à `path: 'livres/:id'` ?"
        choices:
          - label: "`/livres/12` et `/livres/40`"
            correct: true
            why: ":id prend n'importe quelle valeur."
          - label: "Seulement `/livres/id`"
            correct: false
            why: "Les deux-points rendent la partie variable."
          - label: "Seulement `/livres`"
            correct: false
            why: "Il faut une partie après /livres/."
        explanation: ":nom = partie variable."
      - code: ng-pa-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: angular-routage
        prompt: "L'input qui reçoit le paramètre doit porter le même nom que lui (`id`)."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est ainsi que le routeur le retrouve."
          - label: "Faux"
            correct: false
            why: "Un autre nom resterait vide."
        explanation: "`:id` → `id = input()`."
      - code: ng-pa-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-routage
        prompt: "À quoi sert un paramètre de route ?"
        choices:
          - label: "À utiliser une seule page pour tous les éléments (tous les livres)"
            correct: true
            why: "Une page détail, un identifiant variable."
          - label: "À protéger une page"
            correct: false
            why: "C'est le rôle d'une garde."
          - label: "À charger la page plus vite"
            correct: false
            why: "Aucun rapport."
        explanation: "Une route, une infinité d'adresses."
      - code: ng-pa-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-routage
        prompt: "Comment écrire un lien vers le détail du livre `l` ?"
        choices:
          - label: "`<a [routerLink]=\"['/livres', l.id]\">`"
            correct: true
            why: "Le routeur assemble /livres/ et l'identifiant."
          - label: "`<a routerLink=\"/livres/l.id\">`"
            correct: false
            why: "Sans crochets, « l.id » serait du texte."
          - label: "`<a href=\"/livres/{{ l.id }}\">`"
            correct: false
            why: "href recharge toute l'application."
        explanation: "Crochets + tableau de morceaux d'adresse."
    exercises:
      - slug: ng-ex-parametre-guide
        kind: COMPLETER
        title: "Compléter la route et le composant"
        difficulty: FACILE
        skill: angular-routage
        statement: "Complète la route avec un paramètre `id`, puis l'input qui le reçoit."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Un paramètre commence par deux-points."
          - "L'input porte le même nom que le paramètre."
          - ":id, id."
        solution: '[":id", "id"]'
        explanation: "Même nom des deux côtés."
        xp: 10
        payload:
          language: typescript
          template: |
            { path: 'commandes/[[1]]', component: DetailCommandeComponent }

            export class DetailCommandeComponent {
              [[2]] = input<string>();
            }
          blanks:
            - [":id"]
            - ["id"]
      - slug: ng-ex-parametre-libre
        kind: CODE_LIBRE
        title: "La page détail d'une salle"
        difficulty: FACILE
        skill: angular-routage
        statement: |
          1. Écris la route `salles/:id` vers `DetailSalleComponent` (dans une constante `route`).
          2. Écris la classe `DetailSalleComponent` avec un input `id` de type `string`.
        criteria: "Route avec :id et input id."
        hints:
          - "`const route = { path: 'salles/:id', component: DetailSalleComponent };`"
          - "`id = input<string>();`"
          - "Les deux noms doivent être identiques."
        solution: |
          const route = { path: 'salles/:id', component: DetailSalleComponent };

          export class DetailSalleComponent {
            id = input<string>();
          }
        explanation: "Le routeur remplit l'input id avec la valeur de l'adresse."
        xp: 15
        payload:
          language: typescript
          starter: |
            const route =

            export class DetailSalleComponent {

            }
          checks:
            - pattern: 'path\s*:\s*[''"]salles/:id[''"]\s*,\s*component\s*:\s*DetailSalleComponent'
              message: "Écris la route { path: 'salles/:id', component: DetailSalleComponent }."
            - pattern: '\bid\s*=\s*input\s*<\s*string\s*>\s*\(\s*\)'
              message: "Déclare id = input<string>();"
      - slug: ng-ex-parametre-bug
        kind: CORRIGER_ERREUR
        title: "Des deux-points oubliés"
        difficulty: FACILE
        skill: angular-routage
        statement: |
          Cette route ne correspond qu'à l'adresse exacte « /livres/id ». Rends `id` variable.
        criteria: "path: 'livres/:id'."
        hints:
          - "Qu'est-ce qui rend une partie variable ?"
          - "Deux-points devant le nom."
          - "`'livres/:id'`"
        solution: |
          { path: 'livres/:id', component: DetailLivreComponent }
        explanation: "`:id` = partie variable."
        xp: 10
        payload:
          language: typescript
          starter: |
            { path: 'livres/id', component: DetailLivreComponent }
          checks:
            - pattern: 'path\s*:\s*[''"]livres/:id[''"]'
              message: "Écris path: 'livres/:id'."

  # ===================================================================== LEÇON 3
  - slug: ng-gardes
    title: "Protéger une page : les gardes"
    duration: 11
    objective: "Écrire une garde canActivate qui laisse entrer ou redirige, en sachant que la vraie sécurité est sur le serveur."
    prerequisites: "Leçon « Lire un paramètre d'adresse : :id »."
    skills: [angular-routage]
    xp: 15
    memo: |
      - `canActivate: [authGuard]` : une **garde** décide si on a le droit d'entrer sur la route.
      - Une garde est une fonction `CanActivateFn` qui renvoie `true` (entrer) ou `router.createUrlTree(['/connexion'])` (rediriger).
      - Elle améliore le confort, mais le **backend** doit toujours vérifier les droits.
      - `loadComponent: () => import(…)` : la page n'est téléchargée que si on la visite (chargement différé).
    commonMistakes: |
      - Croire qu'une garde suffit à protéger les données.
      - Rediriger avec `window.location` : toute l'application se recharge.
    blocks:
      - type: definition
        id: def-garde
        term: "Garde (guard)"
        md: |
          Le **vigile** à l'entrée d'une page. Il répond oui (on entre) ou redirige ailleurs (vers la page de
          connexion). Il améliore le confort, mais la vraie sécurité reste sur le serveur.
      - type: code
        id: code-garde
        language: typescript
        title: "auth.guard.ts et son utilisation"
        code: |
          export const authGuard: CanActivateFn = () => {
            const auth = inject(AuthService);
            const router = inject(Router);
            return auth.estConnecte() ? true : router.createUrlTree(['/connexion']);
          };

          // app.routes.ts
          { path: 'compte', canActivate: [authGuard], component: CompteComponent }
        lines:
          - n: 1
            note: "Une garde est une simple fonction de type `CanActivateFn`."
          - n: 2
            note: "Elle peut injecter des services comme un composant."
          - n: 4
            note: "`true` : on entre. Sinon, on renvoie une redirection vers `/connexion`."
          - n: 8
            note: "La garde est consultée avant d'entrer sur `/compte`."
      - type: callout
        variant: tip
        title: "Le chargement différé"
        md: |
          Avec `loadComponent: () => import('./compte/compte.component').then(m => m.CompteComponent)`, le code
          de la page n'est téléchargé qu'à la première visite : l'application démarre plus vite.
      - type: question
        ref: ng-rt-q2
        review: def-garde
      - type: question
        ref: ng-rt-q4
        review: code-garde
      - type: text
        md: "**Exercice 1 (guidé)** : complète la garde."
      - type: exercise
        ref: ng-ex-garde-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une garde réservée aux administrateurs."
      - type: exercise
        ref: ng-ex-garde
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une page non protégée."
      - type: exercise
        ref: ng-ex-garde-bug
      - type: jury
        items:
          - q: "Comment protégez-vous les pages réservées ?"
            a: "Avec des gardes Angular (canActivate) qui redirigent vers la connexion si l'utilisatrice n'est pas authentifiée ou n'a pas le bon rôle. Mais c'est seulement du confort : l'API Spring Security vérifie le jeton et le rôle à chaque requête."
          - q: "Qu'est-ce que le lazy loading ?"
            a: "Le chargement différé : avec loadComponent ou loadChildren, le code d'une page n'est téléchargé qu'à la première visite. Le premier chargement de l'application est plus léger et plus rapide."
      - type: quiz
        items:
          - ref: ng-ga-q3
            review: code-garde
          - ref: ng-ga-q4
            review: def-garde
          - ref: ng-ga-q5
            review: code-garde
    questions:
      - code: ng-rt-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-routage
        prompt: "Une garde Angular suffit à protéger les données d'une page administrateur."
        choices:
          - label: "Vrai"
            correct: false
            why: "Le code du navigateur peut être contourné."
          - label: "Faux"
            correct: true
            why: "L'API doit vérifier les droits à chaque requête."
        explanation: "Le frontend protège l'affichage ; le backend protège les données."
      - code: ng-rt-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-routage
        prompt: "Que renvoie une garde pour rediriger vers la page de connexion ?"
        choices:
          - label: "router.createUrlTree(['/connexion'])"
            correct: true
            why: "Un « arbre d'URL » : le routeur redirige."
          - label: "window.location = '/connexion'"
            correct: false
            why: "Cela recharge toute l'application."
          - label: "null"
            correct: false
            why: "Ce n'est pas une redirection."
        explanation: "true = entrer ; UrlTree = rediriger."
      - code: ng-ga-q3
        kind: CHOIX_UNIQUE
