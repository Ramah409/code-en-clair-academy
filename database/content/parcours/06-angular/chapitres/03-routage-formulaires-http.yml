        explanation: "Chargement différé (lazy loading)."
    exercises:
      - slug: ng-ex-garde-guide
        kind: COMPLETER
        title: "Compléter la garde"
        difficulty: FACILE
        skill: angular-routage
        statement: "Complète le type de la garde, la redirection, puis son utilisation dans la route."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le type d'une garde : CanActivateFn."
          - "La redirection : createUrlTree ; la propriété de route : canActivate."
          - "CanActivateFn, createUrlTree, canActivate."
        solution: '["CanActivateFn", "createUrlTree", "canActivate"]'
        explanation: "Déclarer, rediriger, brancher."
        xp: 10
        payload:
          language: typescript
          template: |
            export const connecteGuard: [[1]] = () => {
              const auth = inject(AuthService);
              const router = inject(Router);
              return auth.estConnecte() ? true : router.[[2]](['/connexion']);
            };

            { path: 'favoris', [[3]]: [connecteGuard], component: FavorisComponent }
          blanks:
            - ["CanActivateFn"]
            - ["createUrlTree"]
            - ["canActivate"]
      - slug: ng-ex-garde
        kind: CODE_LIBRE
        title: "Une garde administrateur"
        difficulty: INTERMEDIAIRE
        skill: angular-routage
        statement: |
          Écris `adminGuard`, de type `CanActivateFn` :
          - injecte `AuthService` et `Router` ;
          - si `auth.estAdmin()` renvoie vrai, laisse passer (`true`) ;
          - sinon, redirige vers `/accueil` avec `createUrlTree`.
        criteria: "CanActivateFn, deux inject, test de estAdmin(), redirection createUrlTree(['/accueil'])."
        hints:
          - "`export const adminGuard: CanActivateFn = () => { … };`"
          - "`const auth = inject(AuthService);` et `const router = inject(Router);`"
          - "`return auth.estAdmin() ? true : router.createUrlTree(['/accueil']);`"
        solution: |
          export const adminGuard: CanActivateFn = () => {
            const auth = inject(AuthService);
            const router = inject(Router);
            return auth.estAdmin() ? true : router.createUrlTree(['/accueil']);
          };
        explanation: "La même forme sert pour toutes les gardes : injecter, tester, autoriser ou rediriger."
        xp: 20
        payload:
          language: typescript
          starter: |
            export const adminGuard
          checks:
            - pattern: 'adminGuard\s*:\s*CanActivateFn\s*='
              message: "Déclare `export const adminGuard: CanActivateFn = …`."
            - pattern: 'inject\s*\(\s*AuthService\s*\)'
              message: "Injecte `AuthService`."
            - pattern: 'inject\s*\(\s*Router\s*\)'
              message: "Injecte `Router`."
            - pattern: '\.estAdmin\s*\(\s*\)'
              message: "Teste `auth.estAdmin()`."
            - pattern: 'createUrlTree\s*\(\s*\[\s*[''"]/accueil[''"]\s*\]\s*\)'
              message: "Redirige avec `router.createUrlTree(['/accueil'])`."
      - slug: ng-ex-garde-bug
        kind: CORRIGER_ERREUR
        title: "Une page non protégée"
        difficulty: FACILE
        skill: angular-routage
        statement: |
