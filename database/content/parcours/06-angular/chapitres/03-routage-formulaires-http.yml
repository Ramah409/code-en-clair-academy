  # ===================================================================== LEÇON 7
  - slug: ng-http-ecrire
    title: "Créer et supprimer : post et delete"
    duration: 11
    objective: "Envoyer des données avec post et supprimer avec delete, en choisissant le bon verbe HTTP."
    prerequisites: "Leçon « Lire des données de l'API : get et subscribe »."
    skills: [api-rest, angular-services]
    xp: 15
    memo: |
      - GET **lire**, POST **créer**, PUT/PATCH **modifier**, DELETE **supprimer**.
      - `http.post<Livre>('/api/livres', livre)` : l'objet part en JSON dans le corps de la requête.
      - `http.delete<void>(`/api/livres/${id}`)` : l'identifiant est dans l'adresse.
      - Chaque méthode du service correspond à une action de l'API.
    commonMistakes: |
      - Utiliser `get` pour créer une ressource.
      - Oublier d'envoyer l'objet en second argument de `post`.
    blocks:
      - type: definition
        id: def-verbes
        term: "Verbes HTTP"
        md: |
          Les **verbes** disent au serveur ce qu'on veut faire, comme au guichet de la bibliothèque :
          « je consulte » (GET), « je dépose » (POST), « je remplace » (PUT), « je retire » (DELETE).
      - type: code
        id: code-http-ecrire
        language: typescript
        title: "livre.service.ts (suite)"
        code: |
          creer(livre: NouveauLivre): Observable<Livre> {
            return this.http.post<Livre>('/api/livres', livre);
          }

          supprimer(id: number): Observable<void> {
            return this.http.delete<void>(`/api/livres/${id}`);
          }
        lines:
          - n: 2
            note: "`post` envoie l'objet en JSON ; l'API répond avec le livre créé."
          - n: 6
            note: "`delete` : l'identifiant est placé dans l'adresse avec un gabarit."
      - type: question
        ref: ng-ht-q4
        review: def-verbes
      - type: question
        ref: ng-he-q2
        review: code-http-ecrire
      - type: text
        md: "**Exercice 1 (guidé)** : le bon verbe pour chaque action."
      - type: exercise
        ref: ng-ex-verbes-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : le service des rendez-vous."
      - type: exercise
        ref: ng-ex-http
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un GET qui veut créer."
      - type: exercise
        ref: ng-ex-http-post-bug
      - type: quiz
        items:
          - ref: ng-he-q3
            review: def-verbes
          - ref: ng-he-q4
            review: code-http-ecrire
          - ref: ng-he-q5
            review: def-verbes
    questions:
      - code: ng-ht-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: api-rest
        prompt: "Quelle méthode HttpClient utiliser pour créer un nouveau livre ?"
        choices:
          - label: "post"
            correct: true
            why: "POST crée une ressource."
          - label: "get"
            correct: false
            why: "GET lit."
          - label: "delete"
            correct: false
