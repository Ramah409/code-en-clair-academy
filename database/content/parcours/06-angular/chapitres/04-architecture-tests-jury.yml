          language: html
          starter: |
            <!-- L'avis du lecteur -->
          checks:
            - pattern: '<p>\s*\{\{\s*avis\s*\}\}\s*</p>'
              message: "Affiche l'avis avec <p>{{ avis }}</p>."
            - pattern: 'innerHTML|bypassSecurityTrust'
              absent: true
              message: "Pas besoin d'innerHTML ni de bypass : l'interpolation suffit."
      - slug: ng-ex-xss-bug
        kind: CORRIGER_ERREUR
        title: "Une protection désactivée"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Ce composant désactive la protection sur un commentaire saisi par une utilisatrice. Retire
          `bypassSecurityTrustHtml` et affiche simplement le commentaire avec `{{ commentaire }}`.
        criteria: "Pas de bypass ; interpolation de commentaire."
        hints:
          - "bypass désactive la protection."
          - "L'interpolation échappe le texte."
          - "`template: `<p>{{ commentaire }}</p>``"
        solution: |
          @Component({
            selector: 'app-commentaire',
            template: `<p>{{ commentaire }}</p>`,
          })
          export class CommentaireComponent {
            commentaire = '';
          }
        explanation: "Données saisies = toujours échappées."
        xp: 10
        payload:
          language: typescript
          starter: |
            @Component({
              selector: 'app-commentaire',
              template: `<p [innerHTML]="contenu"></p>`,
            })
            export class CommentaireComponent {
              commentaire = '';
              contenu = inject(DomSanitizer).bypassSecurityTrustHtml(this.commentaire);
            }
          checks:
            - pattern: 'bypassSecurityTrust'
              absent: true
              message: "Retire bypassSecurityTrustHtml."
            - pattern: '<p>\s*\{\{\s*commentaire\s*\}\}\s*</p>'
              message: "Affiche <p>{{ commentaire }}</p>."

  # ===================================================================== LEÇON 6
  - slug: ng-questions-jury
    title: "Angular devant le jury"
    duration: 11
    objective: "Répondre en trois temps (définition, exemple, bonne pratique) aux questions classiques du jury sur Angular."
    prerequisites: "Leçon « La protection contre les failles XSS »."
    skills: [angular-composants, oral-cda]
    xp: 20
    memo: |
      - Une bonne réponse : **une définition simple**, **un exemple de ton projet**, **une bonne pratique**.
      - **SPA** : une seule page HTML, le routeur change les composants.
      - **Performance** : chargement différé des routes, `@defer`, `track` dans `@for`, `OnPush` et signaux.
    commonMistakes: |
      - Réciter une définition sans exemple tiré de son projet.
      - Dire que le frontend « sécurise » les données.
    blocks:
      - type: text
        md: |
          Devant le jury, une bonne réponse tient en trois temps : **une définition simple**, **un exemple de
          ton projet**, **une limite ou une bonne pratique**.
      - type: steps
        id: etapes-reponse
        title: "Répondre en trois temps"
        items:
          - "**Définition** : « Une SPA charge une seule page HTML. »"
          - "**Exemple** : « Dans mon projet, le routeur affiche la liste des livres ou le détail sans recharger. »"
          - "**Bonne pratique** : « Je charge les pages à la demande pour un démarrage rapide. »"
      - type: jury
        id: jury-angular
        title: "Questions fréquentes sur Angular"
        items:
          - q: "Qu'est-ce qu'une SPA ?"
            a: "Une Single Page Application : le navigateur charge une seule page HTML, puis Angular change les composants affichés selon l'adresse, sans recharger. Les données viennent de l'API en JSON."
          - q: "Qu'est-ce que la stratégie OnPush ?"
            a: "Le composant n'est revérifié que si ses inputs changent, si un événement s'y produit ou si un signal qu'il lit change. Moins de vérifications, donc de meilleures performances."
      - type: question
        ref: ng-jq-q3
        review: jury-angular
      - type: question
        ref: ng-qj-q2
        review: etapes-reponse
      - type: text
        md: "**Exercice 1 (guidé)** : les trois temps d'une réponse."
      - type: exercise
        ref: ng-ex-trois-temps-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : prépare ta réponse en trois temps."
      - type: exercise
        ref: ng-ex-reponse-jury
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une réponse sans exemple."
      - type: exercise
        ref: ng-ex-reponse-bug
      - type: quiz
        items:
          - ref: ng-jq-q4
            review: jury-angular
          - ref: ng-c4-b1
            review: jury-angular
          - ref: ng-qj-q5
            review: etapes-reponse
    questions:
      - code: ng-jq-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Qu'est-ce qu'une SPA ?"
        choices:
          - label: "Une application qui charge une seule page HTML et change les composants affichés sans recharger"
            correct: true
            why: "Single Page Application."
          - label: "Une application avec une seule fonctionnalité"
            correct: false
            why: "Elle peut en avoir beaucoup."
          - label: "Une application sans backend"
            correct: false
            why: "Elle dialogue avec une API."
        explanation: "Le routeur change les pages côté navigateur."
      - code: ng-qj-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Quels sont les trois temps d'une bonne réponse au jury ?"
        choices:
          - label: "Définition, exemple de mon projet, bonne pratique"
            correct: true
            why: "Simple, concret, réfléchi."
          - label: "Définition, définition, définition"
            correct: false
            why: "Le jury veut du concret."
          - label: "Un long historique du framework"
            correct: false
            why: "Hors sujet."
        explanation: "Montre que tu as compris et appliqué."
      - code: ng-jq-q4
        kind: CHOIX_MULTIPLE
        difficulty: 3
        skill: angular-composants
        prompt: "Quelles techniques améliorent les performances d'une application Angular ? (plusieurs réponses)"
        choices:
          - label: "Charger les routes à la demande (loadComponent)"
            correct: true
            why: "Premier chargement plus léger."
          - label: "La stratégie OnPush et les signaux"
            correct: true
            why: "Moins de vérifications."
          - label: "`track` dans les boucles @for"
            correct: true
            why: "Moins d'éléments recréés."
          - label: "Mettre tout le code dans un seul composant"
            correct: false
            why: "Plus difficile à maintenir et à optimiser."
        explanation: "Charger moins, vérifier moins, redessiner moins."
      - code: ng-c4-b1
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: angular-composants
        prompt: "À quoi sert le bloc `@defer (on viewport) { … }` ?"
        choices:
          - label: "À charger ce morceau de page seulement quand il devient visible"
            correct: true
            why: "Son code est téléchargé plus tard."
          - label: "À retarder l'appel à l'API de quelques secondes"
            correct: false
            why: "Il concerne le chargement du code des composants."
          - label: "À masquer un élément aux lecteurs d'écran"
            correct: false
            why: "Aucun rapport."
        explanation: "Utile pour un commentaire, une carte ou un graphique en bas de page."
      - code: ng-qj-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: oral-cda
        prompt: "Citer un exemple tiré de son propre projet rend une réponse plus convaincante."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le jury voit que tu as appliqué la notion."
          - label: "Faux"
            correct: false
            why: "L'exemple prouve la compréhension."
        explanation: "Une définition + ton exemple."
    exercises:
      - slug: ng-ex-trois-temps-guide
        kind: COMPLETER
        title: "Les trois temps d'une réponse"
        difficulty: FACILE
        skill: oral-cda
        statement: "Complète avec : Définition, Exemple, Bonne pratique."
        criteria: "Les trois trous sont corrects."
        hints:
          - "On commence par dire ce que c'est."
          - "Puis un cas concret, puis un conseil."
          - "Définition, Exemple, Bonne pratique."
        solution: '["Définition", "Exemple", "Bonne pratique"]'
        explanation: "Simple, concret, réfléchi."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            [[1]] : une SPA charge une seule page HTML.
            [[2]] : dans mon projet, la liste et le détail des livres s'affichent sans recharger.
            [[3]] : je charge les pages à la demande pour démarrer vite.
          blanks:
            - ["Définition", "Definition"]
            - ["Exemple"]
            - ["Bonne pratique"]
      - slug: ng-ex-reponse-jury
        kind: CODE_LIBRE
        title: "Répondre en trois temps"
        difficulty: INTERMEDIAIRE
        skill: oral-cda
        statement: |
          Question du jury : « **Pourquoi avez-vous utilisé des services dans votre application Angular ?** »

          Réponds en trois lignes commençant par `Définition :`, `Exemple :` et `Bonne pratique :`.
          Ta réponse doit parler d'**injection** et donner le nom d'un de tes services (qui finit par `Service`).
        criteria: "Les trois temps sont présents, avec le mot injection et un nom de service."
        hints:
          - "Définition : un service contient la logique partagée, fourni par injection de dépendances."
          - "Exemple : mon AuthService garde l'utilisatrice connectée…"
          - "Bonne pratique : le composant affiche, le service sait faire ; c'est plus facile à tester."
        solution: |
          Définition : un service est une classe qui contient la logique partagée, fournie aux composants par injection de dépendances.
          Exemple : mon AuthService garde l'utilisatrice connectée dans un signal et est utilisé par l'en-tête, les gardes et l'intercepteur.
          Bonne pratique : le composant affiche, le service sait faire ; la logique est réutilisable et testable sans interface.
        explanation: "Définition, exemple concret, bonne pratique : une réponse complète en moins d'une minute."
        xp: 20
        payload:
          language: text
          starter: |
            Définition :
            Exemple :
            Bonne pratique :
          checks:
            - pattern: '(?im)^\s*D[ée]finition\s*:\s*\S.{15,}'
              message: "Écris une définition après « Définition : »."
            - pattern: '(?im)^\s*Exemple\s*:\s*\S.{15,}'
              message: "Donne un exemple après « Exemple : »."
            - pattern: '(?im)^\s*Bonne\s+pratique\s*:\s*\S.{15,}'
              message: "Écris une bonne pratique après « Bonne pratique : »."
            - pattern: '(?i)inject'
              message: "Parle de l'injection de dépendances."
            - pattern: '\b[A-Z]\w*Service\b'
              message: "Cite un de tes services (par exemple AuthService)."
      - slug: ng-ex-reponse-bug
        kind: CORRIGER_ERREUR
        title: "Une réponse sans exemple"
        difficulty: FACILE
        skill: oral-cda
        statement: |
          Cette réponse sur les gardes n'a pas d'exemple concret. Complète la ligne `Exemple :` avec un cas de
          ton projet qui cite une garde (un nom qui finit par `Guard`).
        criteria: "La ligne Exemple contient une vraie phrase et un nom de garde."
        hints:
          - "Quelle page de ton projet est protégée ?"
          - "Donne le nom de la garde."
          - "Exemple : mon authGuard protège la page Mon compte et renvoie vers la connexion."
        solution: |
          Définition : une garde décide si l'on peut entrer sur une route.
          Exemple : mon authGuard protège la page Mon compte et renvoie vers la connexion.
          Bonne pratique : l'API vérifie aussi les droits, car la garde n'est qu'un confort.
        explanation: "L'exemple prouve que tu as appliqué la notion."
        xp: 10
        payload:
          language: text
          starter: |
            Définition : une garde décide si l'on peut entrer sur une route.
            Exemple :
            Bonne pratique : l'API vérifie aussi les droits, car la garde n'est qu'un confort.
          checks:
            - pattern: '(?m)^\s*Exemple\s*:[^\n]*\b\w+Guard\b[^\n]{10,}'
              message: "Dans la ligne Exemple, cite une garde de ton projet (…Guard) et ce qu'elle protège."

