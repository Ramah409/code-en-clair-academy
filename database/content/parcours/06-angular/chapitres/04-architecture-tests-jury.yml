slug: ng-architecture-tests-jury
position: 4
level: EXAMEN
title: "Architecture, tests et jury Angular"
summary: "Ranger les dossiers d'une vraie application, tester un service puis un composant, comprendre le cycle de vie et la protection XSS, et répondre aux questions du jury. Une seule notion par leçon."
quizQuestionCount: 16

lessons:
  # ===================================================================== LEÇON 1
  - slug: ng-architecture-tests
    title: "Ranger son application : core, shared, features"
    duration: 9
    objective: "Ranger chaque fichier d'une application Angular dans core, shared ou features."
    prerequisites: "Chapitre « Routage, formulaires et appels HTTP »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - **core/** : ce qui existe une seule fois (authentification, intercepteurs, gardes, services API).
      - **shared/** : les briques réutilisables (boutons, cartes, pipes).
      - **features/** : un dossier par fonctionnalité (catalogue, favoris, compte), chargé à la demande.
    commonMistakes: |
      - Un dossier `components/` fourre-tout avec 50 fichiers.
      - Ranger dans shared un composant utilisé par une seule page.
    blocks:
      - type: text
        md: |
          Une application grandit vite. Sans rangement, on ne retrouve plus rien.
      - type: definition
        id: def-architecture
        term: "core, shared, features"
        md: |
          Pense à une **maison** : **core** est la chaudière et le compteur électrique (un seul exemplaire,
          indispensable) ; **shared** est la boîte à outils (utilisée dans toutes les pièces) ; **features**
          sont les pièces (cuisine, chambre), chacune avec ses propres meubles.
      - type: code
        id: code-arborescence
        language: text
        title: "Arborescence type"
        code: |
          src/app/
            core/
              auth/ (auth.service.ts, auth.guard.ts, auth.interceptor.ts)
              api/  (api.service.ts, models.ts)
            shared/
              carte-livre.component.ts
              date-courte.pipe.ts
            features/
              catalogue/  (catalogue.component.ts, detail-livre.component.ts)
              favoris/    (favoris.component.ts, favoris.service.ts)
              compte/     (compte.component.ts)
            app.routes.ts
            app.config.ts
        lines:
          - n: 2
            note: "Le cœur technique : authentification, accès à l'API."
          - n: 5
            note: "Les briques partagées par plusieurs pages."
          - n: 8
            note: "Une fonctionnalité = un dossier, chargé avec `loadComponent`."
      - type: question
        ref: ng-at-q1
        review: def-architecture
      - type: question
        ref: ng-at-q4
        review: code-arborescence
      - type: text
        md: "**Exercice 1 (guidé)** : range chaque fichier."
      - type: exercise
        ref: ng-ex-rangement-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : l'arborescence d'une application de réservation."
      - type: exercise
        ref: ng-ex-rangement-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une garde mal rangée."
      - type: exercise
        ref: ng-ex-rangement-bug
      - type: jury
        items:
          - q: "Comment est organisé votre frontend ?"
            a: "En trois zones : core pour les éléments uniques (authentification, intercepteur, gardes, accès API), shared pour les composants réutilisables, et features avec un dossier par fonctionnalité chargé à la demande. Les composants sont standalone et utilisent des signaux."
      - type: quiz
        items:
          - ref: ng-ar-q3
            review: def-architecture
          - ref: ng-ar-q4
            review: code-arborescence
          - ref: ng-ar-q5
            review: def-architecture
    questions:
      - code: ng-at-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Où ranger l'intercepteur qui ajoute le jeton JWT ?"
        choices:
          - label: "core/"
            correct: true
            why: "Il existe une seule fois pour toute l'application."
          - label: "shared/"
            correct: false
            why: "shared contient des briques d'interface réutilisables."
          - label: "features/favoris/"
            correct: false
            why: "Il ne concerne pas que les favoris."
        explanation: "core = les éléments techniques uniques."
      - code: ng-at-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-composants
        prompt: "Un composant réutilisé dans plusieurs pages (carte livre) se range dans shared/."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est une brique de la boîte à outils."
          - label: "Faux"
            correct: false
            why: "features/ contient ce qui est propre à une seule fonctionnalité."
        explanation: "Partagé → shared ; propre à une fonctionnalité → features."
      - code: ng-ar-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Où ranger la page « Mon compte » et ses composants propres ?"
        choices:
          - label: "features/compte/"
            correct: true
            why: "Une fonctionnalité, un dossier."
          - label: "core/"
            correct: false
            why: "core contient la technique unique, pas les pages."
          - label: "shared/"
            correct: false
            why: "Elle n'est pas réutilisée ailleurs."
        explanation: "Une pièce de la maison = une feature."
      - code: ng-ar-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Où ranger le service d'authentification ?"
        choices:
          - label: "core/auth/"
            correct: true
            why: "Un seul exemplaire, utilisé partout."
          - label: "shared/"
            correct: false
            why: "shared est pour les briques d'interface."
          - label: "features/compte/"
            correct: false
            why: "Il sert à toute l'application."
        explanation: "Authentification = chaudière de la maison."
      - code: ng-ar-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Quel avantage apporte un dossier par fonctionnalité ?"
        choices:
          - label: "On retrouve vite tout ce qui concerne une fonctionnalité, et on peut la charger à la demande"
            correct: true
            why: "Rangement clair + chargement différé."
          - label: "Il y a moins de fichiers"
            correct: false
            why: "Le nombre ne change pas."
          - label: "Les tests deviennent inutiles"
            correct: false
            why: "Aucun rapport."
        explanation: "Ranger par fonctionnalité, pas par type de fichier."
    exercises:
      - slug: ng-ex-rangement-guide
        kind: COMPLETER
        title: "Ranger chaque fichier"
        difficulty: FACILE
        skill: angular-composants
        statement: "Complète chaque ligne avec core, shared ou features."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La garde d'authentification existe une seule fois."
          - "Un bouton réutilisé partout va dans la boîte à outils ; une page va dans sa fonctionnalité."
          - "core, shared, features."
        solution: '["core", "shared", "features"]'
        explanation: "Unique, réutilisable, propre à une page."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            auth.guard.ts → [[1]]/auth/
            bouton-principal.component.ts → [[2]]/
            reservations.component.ts → [[3]]/reservations/
          blanks:
            - ["core"]
            - ["shared"]
            - ["features"]
      - slug: ng-ex-rangement-libre
        kind: CODE_LIBRE
        title: "L'arborescence d'une application de réservation"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Écris une ligne par fichier, sous la forme `dossier/fichier` :
          - `auth.interceptor.ts` (unique, technique) ;
          - `carte-salle.component.ts` (réutilisée dans plusieurs pages) ;
          - `salles.component.ts` (la page des salles, dans `features/salles/`).
        criteria: "Chaque fichier est dans le bon dossier."
        hints:
          - "L'intercepteur est unique : core."
          - "La carte est partagée : shared."
          - "La page est une fonctionnalité : features/salles."
        solution: |
          core/auth.interceptor.ts
          shared/carte-salle.component.ts
          features/salles/salles.component.ts
        explanation: "Chaque fichier à sa place."
        xp: 15
        payload:
          language: text
          starter: |
            auth.interceptor.ts
            carte-salle.component.ts
            salles.component.ts
          checks:
            - pattern: '(?m)^\s*core/(?:\w+/)?auth\.interceptor\.ts'
              message: "L'intercepteur va dans core/."
            - pattern: '(?m)^\s*shared/(?:\w+/)?carte-salle\.component\.ts'
              message: "La carte partagée va dans shared/."
            - pattern: '(?m)^\s*features/salles/salles\.component\.ts'
              message: "La page va dans features/salles/."
      - slug: ng-ex-rangement-bug
        kind: CORRIGER_ERREUR
        title: "Une garde mal rangée"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          La garde d'authentification a été rangée dans la fonctionnalité favoris, alors qu'elle protège toute
          l'application. Déplace-la dans `core/auth/`.
        criteria: "core/auth/auth.guard.ts."
        hints:
          - "Elle existe une seule fois et sert partout."
          - "Donc dans core."
          - "`core/auth/auth.guard.ts`"
        solution: |
          core/auth/auth.guard.ts
          features/favoris/favoris.component.ts
        explanation: "Technique unique → core."
        xp: 10
        payload:
          language: text
          starter: |
            features/favoris/auth.guard.ts
            features/favoris/favoris.component.ts
          checks:
            - pattern: 'features/favoris/auth\.guard\.ts'
              absent: true
              message: "La garde n'appartient pas aux favoris."
            - pattern: 'core/auth/auth\.guard\.ts'
              message: "Range-la dans core/auth/."

  # ===================================================================== LEÇON 2
  - slug: ng-test-service
    title: "Tester un service"
    duration: 11
    objective: "Écrire un test unitaire de service en trois temps : préparer, agir, vérifier."
    prerequisites: "Leçon « Ranger son application : core, shared, features »."
    skills: [tests-strategie]
    xp: 15
    memo: |
      - `describe('Nom', () => { … })` : un groupe de tests ; `it('fait ceci', () => { … })` : un test.
      - `beforeEach` : exécuté avant **chaque** test ; `TestBed.inject(Service)` fournit le service.
      - `expect(valeur).toEqual(attendu)` : vérifier ; `toBe` pour une valeur simple.
      - Trois temps : **préparer**, **agir**, **vérifier**.
    commonMistakes: |
      - Oublier de repartir de zéro avant chaque test.
      - Écrire un test sans expect : il passe toujours.
    blocks:
      - type: text
        md: |
          Sans tests, chaque modification fait peur. Un test vérifie tout seul, en une seconde, que le code fait
          toujours ce qu'on attend.
      - type: definition
        id: def-test-unitaire
        term: "Test unitaire"
        md: |
          Un petit **contrôle automatique** d'un seul morceau de code, comme vérifier une ampoule avant de
          l'installer. Il suit trois temps : **préparer** (arrange), **agir** (act), **vérifier** (assert).
      - type: code
        id: code-test-service
        language: typescript
        title: "favoris.service.spec.ts"
        code: |
          describe('FavorisService', () => {
            let service: FavorisService;

            beforeEach(() => {
              service = TestBed.inject(FavorisService);
            });

            it('garde les titres ajoutés', () => {
              service.ajouter('Dune');
              expect(service.titres()).toEqual(['Dune']);
            });
          });
        lines:
          - n: 1
            note: "`describe` : un groupe de tests pour un même élément."
          - n: 4
            note: "`beforeEach` : exécuté avant **chaque** test, pour repartir de zéro."
          - n: 5
            note: "Préparer : on obtient le service comme Angular le ferait."
          - n: 9
            note: "Agir : on ajoute un titre."
          - n: 10
            note: "Vérifier : la liste contient exactement ce titre."
      - type: question
        ref: ng-at-q3
        review: def-test-unitaire
      - type: question
        ref: ng-ts-s-q2
        review: code-test-service
      - type: text
        md: "**Exercice 1 (guidé)** : complète ce test de service."
      - type: exercise
        ref: ng-ex-test-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : tester le thème."
      - type: exercise
        ref: ng-ex-test-service-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un test qui ne vérifie rien."
      - type: exercise
        ref: ng-ex-test-service-bug
      - type: quiz
        items:
          - ref: ng-at-q5
            review: def-test-unitaire
          - ref: ng-ts-s-q4
            review: code-test-service
          - ref: ng-c4-b2
            review: def-test-unitaire
    questions:
      - code: ng-at-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Dans quel ordre s'écrit un test unitaire ?"
        choices:
          - label: "Préparer, agir, vérifier"
            correct: true
            why: "Arrange, Act, Assert."
          - label: "Vérifier, préparer, agir"
            correct: false
            why: "On ne peut pas vérifier avant d'agir."
          - label: "Agir, vérifier, préparer"
            correct: false
            why: "Il faut préparer d'abord."
        explanation: "Le modèle AAA rend chaque test lisible."
      - code: ng-ts-s-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "À quoi sert `beforeEach` ?"
        choices:
          - label: "À préparer un point de départ neuf avant chaque test"
            correct: true
            why: "Les tests ne se gênent pas entre eux."
          - label: "À lancer les tests plus vite"
            correct: false
            why: "C'est une question d'indépendance."
          - label: "À vérifier le résultat"
            correct: false
            why: "C'est le rôle d'expect."
        explanation: "Chaque test repart de zéro."
      - code: ng-at-q5
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: tests-strategie
        prompt: "Quels sont les avantages des tests automatisés ? (plusieurs réponses)"
        choices:
          - label: "Détecter une régression dès qu'on modifie le code"
            correct: true
            why: "Un test qui passait et échoue alerte tout de suite."
          - label: "Documenter le comportement attendu"
            correct: true
            why: "Un test se lit comme un exemple d'utilisation."
          - label: "Remplacer la validation côté serveur"
            correct: false
            why: "Aucun rapport."
          - label: "Modifier le code avec confiance"
            correct: true
            why: "Refactoriser sans peur."
        explanation: "Les tests sont un filet de sécurité."
      - code: ng-ts-s-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: tests-strategie
        prompt: "Un test sans `expect` ne vérifie rien et passe toujours."
        choices:
          - label: "Vrai"
            correct: true
            why: "Aucune vérification, aucun échec possible."
          - label: "Faux"
            correct: false
            why: "C'est expect qui peut faire échouer le test."
        explanation: "Pas d'expect, pas de test."
      - code: ng-c4-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Comment tester un service qui fait des appels HTTP sans appeler le vrai serveur ?"
        choices:
          - label: "Avec provideHttpClientTesting() et HttpTestingController"
            correct: true
            why: "On intercepte la requête et on renvoie une fausse réponse."
          - label: "En lançant le backend avant les tests"
            correct: false
            why: "Ce serait un test d'intégration, lent et fragile."
          - label: "Ce n'est pas possible"
            correct: false
            why: "Angular le prévoit."
        explanation: "`httpMock.expectOne('/api/livres').flush([...])` renvoie les données voulues."
    exercises:
      - slug: ng-ex-test-guide
        kind: COMPLETER
        title: "Compléter un test de service"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Complète ce test qui vérifie que `vider()` vide la liste des favoris."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Avant chaque test : beforeEach."
          - "On obtient le service avec TestBed.inject."
          - "beforeEach, inject, expect, toEqual."
        solution: '["beforeEach", "inject", "expect", "toEqual"]'
        explanation: "Préparer (beforeEach + inject), agir (vider), vérifier (expect + toEqual)."
        xp: 10
        payload:
          language: typescript
          template: |
            let service: FavorisService;

            [[1]](() => {
              service = TestBed.[[2]](FavorisService);
            });

            it('vide les favoris', () => {
              service.ajouter('Dune');
              service.vider();
              [[3]](service.titres()).[[4]]([]);
            });
          blanks:
            - ["beforeEach"]
            - ["inject"]
            - ["expect"]
            - ["toEqual"]
      - slug: ng-ex-test-service-libre
        kind: CODE_LIBRE
        title: "Tester le thème"
        difficulty: INTERMEDIAIRE
        skill: tests-strategie
        statement: |
          `ThemeService` a un signal `sombre` (faux au départ) et une méthode `basculer()`. Écris un test
          `it('passe en sombre', …)` qui obtient le service avec `TestBed.inject`, appelle `basculer()`, puis
          vérifie que `sombre()` vaut `true`.
        criteria: "TestBed.inject, appel de basculer, expect(service.sombre()).toBe(true)."
        hints:
          - "`const service = TestBed.inject(ThemeService);`"
          - "`service.basculer();`"
          - "`expect(service.sombre()).toBe(true);`"
        solution: |
          it('passe en sombre', () => {
            const service = TestBed.inject(ThemeService);
            service.basculer();
            expect(service.sombre()).toBe(true);
          });
        explanation: "Préparer, agir, vérifier."
        xp: 15
        payload:
          language: typescript
          starter: |
            it('passe en sombre', () => {

            });
          checks:
            - pattern: 'TestBed\.inject\s*\(\s*ThemeService\s*\)'
              message: "Obtiens le service avec TestBed.inject(ThemeService)."
            - pattern: '\.basculer\s*\(\s*\)'
              message: "Appelle basculer()."
            - pattern: 'expect\s*\(\s*\w+\.sombre\(\)\s*\)\s*\.\s*(?:toBe|toEqual)\s*\(\s*true\s*\)|expect\s*\(\s*\w+\.sombre\(\)\s*\)\s*\.\s*toBeTrue\s*\(\s*\)'
              message: "Vérifie : expect(service.sombre()).toBe(true)."
      - slug: ng-ex-test-service-bug
        kind: CORRIGER_ERREUR
        title: "Un test qui ne vérifie rien"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Ce test agit mais ne vérifie rien : il passerait même si `ajouter` était cassé. Ajoute la vérification
          `expect(service.titres()).toEqual(['Dune']);`.
        criteria: "Un expect sur titres() après l'ajout."
        hints:
          - "Il manque le troisième temps."
          - "La vérification commence par expect."
          - "`expect(service.titres()).toEqual(['Dune']);`"
        solution: |
          it('ajoute un favori', () => {
            const service = TestBed.inject(FavorisService);
            service.ajouter('Dune');
            expect(service.titres()).toEqual(['Dune']);
          });
        explanation: "Sans expect, le test ne protège rien."
        xp: 10
        payload:
          language: typescript
          starter: |
            it('ajoute un favori', () => {
              const service = TestBed.inject(FavorisService);
              service.ajouter('Dune');
            });
          checks:
            - pattern: "ajouter\\([^)]*\\)[\\s\\S]*expect\\s*\\(\\s*service\\.titres\\(\\)\\s*\\)\\s*\\.\\s*toEqual\\s*\\(\\s*\\[\\s*['\"]Dune['\"]\\s*\\]\\s*\\)"
              message: "Après l'ajout, vérifie : expect(service.titres()).toEqual(['Dune'])."

  # ===================================================================== LEÇON 3
  - slug: ng-test-composant
    title: "Tester un composant"
    duration: 12
    objective: "Monter un composant avec TestBed, afficher son template avec detectChanges et vérifier ce que voit l'utilisatrice."
    prerequisites: "Leçon « Tester un service »."
    skills: [tests-strategie, angular-composants]
    xp: 15
    memo: |
      - `TestBed.configureTestingModule({ imports: [MonComposant] })` puis `TestBed.createComponent(MonComposant)`.
      - `fixture.detectChanges()` : Angular dessine le template (à rappeler après chaque action).
      - `fixture.nativeElement.querySelector('h2')` : chercher un élément dans le HTML produit.
      - On teste **ce que voit l'utilisatrice**, pas les détails internes.
    commonMistakes: |
      - Oublier `fixture.detectChanges()` : le template n'est pas encore affiché.
      - Oublier de rappeler `detectChanges()` après un clic.
    blocks:
      - type: definition
        id: def-fixture
        term: "fixture"
        md: |
          Un **banc d'essai** : le composant est monté dans un mini-navigateur de test. On peut cliquer dessus
          et lire ce qu'il affiche, comme une vraie utilisatrice.
      - type: code
        id: code-test-composant
        language: typescript
        title: "profil.component.spec.ts"
        code: |
          it('affiche le prénom', () => {
            TestBed.configureTestingModule({ imports: [ProfilComponent] });
            const fixture = TestBed.createComponent(ProfilComponent);
            fixture.detectChanges();

            const titre = fixture.nativeElement.querySelector('h2');
            expect(titre.textContent).toContain('Awa');
          });
        lines:
          - n: 2
            note: "Le composant standalone est placé dans `imports`."
          - n: 3
            note: "`fixture` : le composant monté dans un mini-navigateur de test."
          - n: 4
            note: "Indispensable : Angular dessine le template."
          - n: 6
            note: "On cherche le `<h2>` dans le HTML produit."
      - type: question
        ref: ng-at-q2
        review: code-test-composant
      - type: question
        ref: ng-tc-q2
        review: def-fixture
      - type: text
        md: "**Exercice 1 (guidé)** : complète le test."
      - type: exercise
        ref: ng-ex-test-composant-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : tester un clic."
      - type: exercise
        ref: ng-ex-test-composant
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un template jamais dessiné."
      - type: exercise
        ref: ng-ex-test-composant-bug
      - type: jury
        items:
          - q: "Comment testez-vous votre application Angular ?"
            a: "Des tests unitaires sur les services (logique, règles) et des tests de composants avec TestBed pour vérifier l'affichage. Les appels HTTP sont simulés avec HttpTestingController. Les parcours complets peuvent être couverts par des tests de bout en bout (Playwright ou Cypress)."
      - type: quiz
        items:
          - ref: ng-tc-q3
            review: code-test-composant
          - ref: ng-tc-q4
            review: def-fixture
          - ref: ng-tc-q5
            review: code-test-composant
    questions:
      - code: ng-at-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Dans un test de composant, le `<h2>` est vide. Qu'a-t-on probablement oublié ?"
        choices:
          - label: "fixture.detectChanges()"
            correct: true
            why: "Sans cet appel, le template n'est pas rendu."
          - label: "Un point-virgule"
            correct: false
            why: "Le code compile."
          - label: "De lancer le backend"
            correct: false
            why: "Un test unitaire n'a pas besoin du backend."
        explanation: "detectChanges = « dessine maintenant »."
      - code: ng-tc-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
