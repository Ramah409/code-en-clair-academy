          - "Créer : createComponent."
          - "Dessiner : detectChanges ; chercher : querySelector."
          - "createComponent, detectChanges, querySelector."
        solution: '["createComponent", "detectChanges", "querySelector"]'
        explanation: "Monter, dessiner, lire."
        xp: 10
        payload:
          language: typescript
          template: |
            TestBed.configureTestingModule({ imports: [AccueilComponent] });
            const fixture = TestBed.[[1]](AccueilComponent);
            fixture.[[2]]();
            const p = fixture.nativeElement.[[3]]('p');
            expect(p.textContent).toContain('Bonjour');
          blanks:
            - ["createComponent"]
            - ["detectChanges"]
            - ["querySelector"]
      - slug: ng-ex-test-composant
        kind: CODE_LIBRE
        title: "Tester un clic"
        difficulty: DIFFICILE
        skill: tests-strategie
        statement: |
          Le composant `AccueilComponent` affiche `<p>{{ message }}</p>` (« Bonjour ! » au départ) et un bouton
          qui remplace le message par « Merci pour ta visite ! ». Écris un test `it('remercie au clic', …)` qui :
          1. configure TestBed avec le composant dans `imports` ;
          2. crée le composant et appelle `detectChanges()` ;
          3. clique sur le bouton (`querySelector('button').click()`) ;
          4. rappelle `detectChanges()` ;
          5. vérifie que le `<p>` contient `Merci`.
        criteria: "TestBed configuré, createComponent, clic sur le bouton, deux detectChanges, expect sur le texte du paragraphe."
        hints:
          - "`TestBed.configureTestingModule({ imports: [AccueilComponent] });`"
          - "`const fixture = TestBed.createComponent(AccueilComponent);` puis `fixture.detectChanges();`"
          - "`fixture.nativeElement.querySelector('button').click();` puis `detectChanges()` et `expect(…textContent).toContain('Merci')`."
        solution: |
          it('remercie au clic', () => {
            TestBed.configureTestingModule({ imports: [AccueilComponent] });
            const fixture = TestBed.createComponent(AccueilComponent);
            fixture.detectChanges();

            fixture.nativeElement.querySelector('button').click();
            fixture.detectChanges();

            const p = fixture.nativeElement.querySelector('p');
            expect(p.textContent).toContain('Merci');
          });
        explanation: "On teste ce que voit l'utilisatrice : elle clique, le message change."
        xp: 30
        payload:
          language: typescript
          starter: |
            it('remercie au clic', () => {

            });
          checks:
            - pattern: 'TestBed\.configureTestingModule\s*\(\s*\{\s*imports\s*:\s*\[\s*AccueilComponent\s*\]'
              message: "Configure TestBed : `imports: [AccueilComponent]`."
            - pattern: 'TestBed\.createComponent\s*\(\s*AccueilComponent\s*\)'
              message: "Crée le composant avec `TestBed.createComponent(AccueilComponent)`."
            - pattern: "querySelector\\s*\\(\\s*['\"]button['\"]\\s*\\)\\s*\\.click\\s*\\(\\s*\\)"
              message: "Clique sur le bouton : `querySelector('button').click()`."
            - pattern: '\A(?>[\s\S]*?\.detectChanges\s*\(\s*\)){2}'
              message: "Appelle `detectChanges()` deux fois : après la création et après le clic."
            - pattern: '\.click\s*\(\s*\)[\s\S]*?\.detectChanges\s*\(\s*\)'
              message: "Rappelle `detectChanges()` après le clic."
            - pattern: "expect\\s*\\([^;]*textContent[^;]*\\)\\s*\\.\\s*(?:toContain|toBe|toEqual)\\s*\\(\\s*['\"][^'\"]*Merci[^'\"]*['\"]\\s*\\)"
              message: "Vérifie le texte : `expect(p.textContent).toContain('Merci')`."
      - slug: ng-ex-test-composant-bug
        kind: CORRIGER_ERREUR
        title: "Un template jamais dessiné"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Ce test échoue : le `<h2>` est vide. Ajoute l'appel qui dessine le template, juste après la création.
        criteria: "fixture.detectChanges() avant querySelector."
        hints:
          - "Angular n'a pas encore dessiné le template."
          - "La méthode s'appelle detectChanges."
          - "`fixture.detectChanges();`"
        solution: |
          it('affiche le titre', () => {
            TestBed.configureTestingModule({ imports: [TitreComponent] });
            const fixture = TestBed.createComponent(TitreComponent);
            fixture.detectChanges();
            const h2 = fixture.nativeElement.querySelector('h2');
            expect(h2.textContent).toContain('Bibliothèque');
          });
        explanation: "detectChanges = « dessine maintenant »."
        xp: 10
        payload:
          language: typescript
          starter: |
            it('affiche le titre', () => {
              TestBed.configureTestingModule({ imports: [TitreComponent] });
              const fixture = TestBed.createComponent(TitreComponent);
              const h2 = fixture.nativeElement.querySelector('h2');
              expect(h2.textContent).toContain('Bibliothèque');
            });
          checks:
            - pattern: 'createComponent\([^)]*\)\s*;\s*fixture\.detectChanges\s*\(\s*\)\s*;[\s\S]*querySelector'
              message: "Appelle fixture.detectChanges() juste après la création, avant querySelector."

  # ===================================================================== LEÇON 4
  - slug: ng-cycle-vie
    title: "Le cycle de vie d'un composant"
    duration: 9
    objective: "Savoir ce qui se passe dans constructor, ngOnInit et ngOnDestroy, et où placer chaque action."
    prerequisites: "Leçon « Tester un composant »."
    skills: [angular-composants]
    xp: 15
    memo: |
      - `constructor` : le composant naît ; on reçoit les services injectés.
      - `ngOnInit` : les inputs sont disponibles ; on lance le chargement des données.
      - `ngOnDestroy` : le composant va disparaître ; on nettoie (minuteur, abonnement infini).
      - Pour les flux infinis : `takeUntilDestroyed()` ou `toSignal()` se désabonnent tout seuls.
    commonMistakes: |
      - Lire un input dans le constructeur : il n'est pas encore rempli.
      - Oublier d'arrêter un minuteur à la destruction.
    blocks:
      - type: definition
        id: def-cycle-vie
        term: "Cycle de vie d'un composant"
        md: |
          Les grandes étapes de la vie d'un composant, comme une journée de travail : **arriver**
          (`ngOnInit`, on prépare), **travailler** (les mises à jour), **partir** (`ngOnDestroy`, on range et on
          éteint la lumière).
      - type: code
        id: code-cycle-vie
        language: typescript
        title: "Un composant qui charge puis nettoie"
        code: |
          export class HorlogeComponent implements OnInit, OnDestroy {
            private readonly service = inject(MessageService);
            private minuteur?: ReturnType<typeof setInterval>;

            ngOnInit() {
              this.minuteur = setInterval(() => this.service.rafraichir(), 60000);
            }

            ngOnDestroy() {
              clearInterval(this.minuteur);
            }
          }
        lines:
          - n: 2
            note: "L'injection a lieu à la naissance du composant."
          - n: 5
            note: "`ngOnInit` : on démarre le travail."
          - n: 9
            note: "`ngOnDestroy` : on arrête le minuteur, sinon il continuerait après la disparition du composant."
      - type: question
        ref: ng-jq-q1
        review: def-cycle-vie
      - type: question
        ref: ng-cv-q2
        review: code-cycle-vie
      - type: text
        md: "**Exercice 1 (guidé)** : associe chaque étape à son rôle."
      - type: exercise
        ref: ng-ex-cycle-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : charger au démarrage."
      - type: exercise
        ref: ng-ex-cycle-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un minuteur jamais arrêté."
      - type: exercise
        ref: ng-ex-cycle-bug
      - type: jury
        items:
          - q: "À quoi sert ngOnInit ?"
            a: "C'est le moment où les inputs du composant sont disponibles : on y lance l'initialisation (chargement de données). Le constructeur sert seulement à l'injection."
          - q: "Comment éviter les fuites de mémoire avec RxJS ?"
            a: "HttpClient se termine tout seul après la réponse. Pour les flux infinis, j'utilise takeUntilDestroyed() ou toSignal(), qui se désabonnent automatiquement à la destruction du composant."
      - type: quiz
        items:
          - ref: ng-cv-q3
            review: def-cycle-vie
          - ref: ng-cv-q4
            review: code-cycle-vie
          - ref: ng-cv-q5
            review: def-cycle-vie
    questions:
      - code: ng-jq-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Dans quelle méthode du cycle de vie nettoie-t-on (arrêter un minuteur, se désabonner) ?"
        choices:
          - label: "ngOnDestroy"
            correct: true
            why: "Appelée juste avant la destruction du composant."
          - label: "ngOnInit"
            correct: false
            why: "C'est l'initialisation."
          - label: "constructor"
            correct: false
            why: "Le composant vient seulement de naître."
        explanation: "On « éteint la lumière » en partant."
      - code: ng-cv-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Où lancer le chargement des données d'un composant ?"
        choices:
          - label: "Dans ngOnInit"
            correct: true
            why: "Les inputs y sont disponibles."
          - label: "Dans ngOnDestroy"
            correct: false
            why: "Le composant est en train de partir."
          - label: "Dans le template"
            correct: false
            why: "Le template affiche seulement."
        explanation: "ngOnInit = on se met au travail."
      - code: ng-cv-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-composants
        prompt: "Dans le constructeur, les inputs du composant sont déjà remplis."
        choices:
          - label: "Vrai"
            correct: false
            why: "Ils arrivent après la naissance."
          - label: "Faux"
            correct: true
            why: "On les lit à partir de ngOnInit."
        explanation: "Constructeur : injection ; ngOnInit : inputs prêts."
      - code: ng-cv-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Que se passe-t-il si on oublie `clearInterval` dans ngOnDestroy ?"
        choices:
          - label: "Le minuteur continue de tourner après la disparition du composant"
            correct: true
            why: "C'est une fuite de mémoire."
          - label: "Le composant ne s'affiche pas"
            correct: false
            why: "L'affichage n'est pas concerné."
          - label: "Rien"
            correct: false
            why: "Le minuteur tourne pour rien."
        explanation: "Toujours éteindre la lumière en partant."
      - code: ng-cv-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-composants
        prompt: "Quel outil se désabonne tout seul d'un flux infini à la destruction du composant ?"
        choices:
          - label: "takeUntilDestroyed()"
            correct: true
            why: "Il coupe le flux quand le composant disparaît."
          - label: "setInterval()"
            correct: false
            why: "Il crée un minuteur."
          - label: "console.log()"
            correct: false
            why: "Aucun rapport."
        explanation: "takeUntilDestroyed ou toSignal."
    exercises:
      - slug: ng-ex-cycle-guide
        kind: COMPLETER
        title: "Le cycle de vie"
        difficulty: FACILE
        skill: angular-composants
        statement: "Complète avec : constructor, ngOnInit, ngOnDestroy."
        criteria: "Les trois trous sont corrects."
        hints:
          - "L'injection se fait à la naissance : constructor."
          - "Les inputs sont prêts dans ngOnInit."
          - "constructor, ngOnInit, ngOnDestroy."
        solution: '["constructor", "ngOnInit", "ngOnDestroy"]'
        explanation: "Naître, s'initialiser, partir."
        xp: 10
        payload:
          language: text
          template: |
            [[1]] : le composant est créé, on reçoit les services injectés.
            [[2]] : les inputs sont disponibles, on charge les données.
            [[3]] : le composant va disparaître, on nettoie.
          blanks:
            - ["constructor"]
            - ["ngOnInit"]
            - ["ngOnDestroy"]
      - slug: ng-ex-cycle-libre
        kind: CODE_LIBRE
        title: "Charger au démarrage"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Dans `ListeSallesComponent` (qui implémente `OnInit`), écris la méthode `ngOnInit()` qui appelle
          `this.charger()`.
        criteria: "ngOnInit qui appelle this.charger()."
        hints:
          - "La méthode s'appelle ngOnInit."
          - "Elle ne prend aucun paramètre."
          - "`ngOnInit() { this.charger(); }`"
        solution: |
          export class ListeSallesComponent implements OnInit {
            ngOnInit() {
              this.charger();
            }

            charger() {}
          }
        explanation: "Le chargement démarre quand le composant est prêt."
        xp: 15
        payload:
          language: typescript
          starter: |
            export class ListeSallesComponent implements OnInit {

              charger() {}
            }
          checks:
            - pattern: 'ngOnInit\s*\(\s*\)\s*(?::\s*void\s*)?\{\s*this\.charger\s*\(\s*\)'
              message: "Écris ngOnInit() { this.charger(); }."
      - slug: ng-ex-cycle-bug
        kind: CORRIGER_ERREUR
        title: "Un minuteur jamais arrêté"
        difficulty: FACILE
        skill: angular-composants
        statement: |
          Ce composant démarre un minuteur mais ne l'arrête jamais. Ajoute `ngOnDestroy()` qui appelle
          `clearInterval(this.minuteur)`.
        criteria: "ngOnDestroy avec clearInterval."
        hints:
          - "Quelle méthode est appelée au départ du composant ?"
          - "ngOnDestroy."
          - "`ngOnDestroy() { clearInterval(this.minuteur); }`"
        solution: |
          export class HorlogeComponent implements OnInit, OnDestroy {
            private minuteur?: ReturnType<typeof setInterval>;

            ngOnInit() {
              this.minuteur = setInterval(() => this.rafraichir(), 60000);
            }

            ngOnDestroy() {
              clearInterval(this.minuteur);
            }

            rafraichir() {}
          }
        explanation: "On éteint la lumière en partant."
        xp: 10
        payload:
          language: typescript
          starter: |
            export class HorlogeComponent implements OnInit, OnDestroy {
              private minuteur?: ReturnType<typeof setInterval>;

              ngOnInit() {
                this.minuteur = setInterval(() => this.rafraichir(), 60000);
              }

              rafraichir() {}
            }
          checks:
            - pattern: 'ngOnDestroy\s*\(\s*\)\s*(?::\s*void\s*)?\{\s*clearInterval\s*\(\s*this\.minuteur\s*\)'
              message: "Ajoute ngOnDestroy() { clearInterval(this.minuteur); }."

  # ===================================================================== LEÇON 5
  - slug: ng-securite-xss
    title: "La protection contre les failles XSS"
    duration: 9
    objective: "Comprendre comment l'interpolation protège contre les failles XSS et ce qu'il ne faut pas faire."
    prerequisites: "Leçon « Le cycle de vie d'un composant »."
    skills: [angular-composants, securite-owasp]
    xp: 15
    memo: |
      - **XSS** : quelqu'un glisse du JavaScript dans un texte pour qu'il s'exécute chez les autres.
      - `{{ commentaire }}` **échappe** la valeur : le code s'affiche comme du texte.
      - `[innerHTML]` est assaini par Angular ; `bypassSecurityTrustHtml` désactive la protection : jamais sur des données saisies.
      - Le backend valide aussi les entrées.
    commonMistakes: |
      - Utiliser `bypassSecurityTrustHtml` sur un commentaire d'utilisatrice.
      - Construire du HTML à la main avec des textes saisis.
    blocks:
      - type: definition
        id: def-xss
        term: "Faille XSS"
        md: |
          Une attaque où quelqu'un glisse du **code JavaScript** dans un texte (un commentaire, un nom) pour
          qu'il s'exécute chez les autres. Angular **échappe** automatiquement ce qu'il affiche avec `{{ }}` :
          le code s'affiche comme du texte au lieu de s'exécuter, comme une lettre piégée qu'on lirait à voix
          haute sans jamais l'ouvrir.
      - type: code
        id: code-xss
        language: html
        title: "Afficher un commentaire sans danger"
        code: |
          <!-- commentaire = '<script>voler()</script>' -->
          <p>{{ commentaire }}</p>
          <!-- Affiche le texte « <script>voler()</script> » sans l'exécuter. -->
        lines:
          - n: 2
            note: "L'interpolation transforme les chevrons en simple texte : rien ne s'exécute."
      - type: question
        ref: ng-jq-q2
        review: def-xss
      - type: question
        ref: ng-jq-q5
        review: def-xss
      - type: text
        md: "**Exercice 1 (guidé)** : complète la règle de sécurité."
      - type: exercise
        ref: ng-ex-xss-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : afficher un avis de lecteur."
      - type: exercise
        ref: ng-ex-xss-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une protection désactivée."
      - type: exercise
        ref: ng-ex-xss-bug
      - type: jury
        items:
          - q: "Comment Angular vous protège-t-il des failles XSS ?"
            a: "Toute valeur affichée par interpolation ou liaison est échappée ou assainie. Je n'utilise jamais bypassSecurityTrustHtml sur des données saisies par les utilisateurs. Côté serveur, les entrées sont aussi validées."
      - type: quiz
        items:
          - ref: ng-xs-q3
            review: code-xss
          - ref: ng-xs-q4
            review: def-xss
          - ref: ng-xs-q5
            review: def-xss
    questions:
      - code: ng-jq-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-composants
        prompt: "Avec `{{ commentaire }}`, un texte contenant `<script>` s'exécute dans le navigateur."
        choices:
          - label: "Vrai"
            correct: false
            why: "Angular échappe la valeur."
          - label: "Faux"
            correct: true
            why: "Le texte s'affiche tel quel, sans s'exécuter."
        explanation: "L'interpolation protège contre les XSS."
      - code: ng-jq-q5
        kind: TEXTE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quel est le sigle de la faille qui consiste à injecter du JavaScript dans une page ? (trois lettres)"
        answers: ["XSS"]
        explanation: "Cross-Site Scripting. Angular s'en protège en échappant les valeurs affichées."
      - code: ng-xs-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Que veut dire « échapper » une valeur ?"
        choices:
          - label: "La transformer pour qu'elle s'affiche comme du texte, sans s'exécuter"
            correct: true
            why: "Les chevrons deviennent de simples caractères."
          - label: "La supprimer"
            correct: false
            why: "Elle reste affichée."
          - label: "La chiffrer"
            correct: false
            why: "Aucun chiffrement ici."
        explanation: "Lire la lettre piégée sans l'ouvrir."
      - code: ng-xs-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quand peut-on utiliser `bypassSecurityTrustHtml` ?"
        choices:
          - label: "Jamais sur des données saisies par les utilisateurs"
            correct: true
            why: "Il désactive la protection."
          - label: "Sur tous les commentaires"
            correct: false
            why: "Ce serait ouvrir la porte aux XSS."
          - label: "Pour accélérer l'affichage"
            correct: false
            why: "Ce n'est pas son rôle."
        explanation: "bypass = contourner la protection."
      - code: ng-xs-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: securite-owasp
        prompt: "Même avec la protection d'Angular, le backend doit valider les données reçues."
        choices:
          - label: "Vrai"
            correct: true
            why: "On peut appeler l'API sans Angular."
          - label: "Faux"
            correct: false
            why: "La défense se fait des deux côtés."
        explanation: "Défense en profondeur."
    exercises:
      - slug: ng-ex-xss-guide
        kind: COMPLETER
        title: "La règle de sécurité"
        difficulty: FACILE
        skill: securite-owasp
        statement: "Complète avec : XSS, échappe, bypassSecurityTrustHtml."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La faille s'appelle XSS."
          - "L'interpolation échappe les valeurs."
          - "XSS, échappe, bypassSecurityTrustHtml."
        solution: '["XSS", "échappe", "bypassSecurityTrustHtml"]'
        explanation: "Connaître la faille, la protection et ce qu'il ne faut pas faire."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            La faille qui injecte du JavaScript s'appelle [[1]].
            L'interpolation {{ }} [[2]] les valeurs affichées.
            On n'utilise jamais [[3]] sur des données saisies.
          blanks:
            - ["XSS"]
            - ["échappe", "echappe"]
            - ["bypassSecurityTrustHtml"]
      - slug: ng-ex-xss-libre
        kind: CODE_LIBRE
        title: "Afficher un avis de lecteur"
        difficulty: FACILE
        skill: securite-owasp
        statement: |
          Écris le template qui affiche l'avis saisi par un lecteur (`avis`) dans un `<p>`, de manière sûre,
          avec l'interpolation.
        criteria: "<p>{{ avis }}</p>, sans innerHTML ni bypass."
