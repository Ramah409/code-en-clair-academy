          - ref: gp-dd-q5
            review: def-termine
    questions:
      - code: gp-er-q4
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: gestion-projet
        prompt: "Que contient une bonne définition de terminé ? (plusieurs réponses)"
        choices:
          - label: "Les critères d'acceptation sont validés"
            correct: true
            why: "Le besoin est couvert."
          - label: "Les tests automatiques passent dans la CI"
            correct: true
            why: "Pas de régression."
          - label: "Le code a été relu et fusionné"
            correct: true
            why: "Qualité partagée."
          - label: "Le développeur pense que c'est fini"
            correct: false
            why: "Ce n'est pas vérifiable."
        explanation: "Une liste de contrôle commune à toute l'équipe."
      - code: gp-dd-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: gestion-projet
        prompt: "Dans l'exemple de la leçon, la story est terminée."
        choices:
          - label: "Vrai"
            correct: false
            why: "La documentation n'est pas cochée."
          - label: "Faux"
            correct: true
            why: "Il reste une case vide."
        explanation: "Toutes les cases, sans exception."
      - code: gp-dd-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: gestion-projet
        prompt: "Qui utilise la définition de terminé ?"
        choices:
          - label: "Toute l'équipe, pour toutes les stories"
            correct: true
            why: "Une règle commune."
          - label: "Seulement le Product Owner"
            correct: false
            why: "Tout le monde."
          - label: "Seulement pour les grandes stories"
            correct: false
            why: "Pour toutes."
