      - code: gp-dd-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: gestion-projet
        prompt: "Une story est codée mais pas encore relue. Dans quelle colonne Kanban est-elle ?"
        choices:
          - label: "À vérifier"
            correct: true
            why: "Elle n'est pas terminée."
          - label: "Terminé"
            correct: false
            why: "Il manque la relecture."
          - label: "À faire"
            correct: false
            why: "Elle est commencée."
        explanation: "Terminé = toutes les cases cochées."
      - code: gp-dd-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: gestion-projet
        prompt: "Pourquoi « ça marche sur mon ordinateur » ne suffit-il pas ?"
        choices:
          - label: "Rien ne prouve que c'est testé, relu et que ça marche ailleurs"
            correct: true
            why: "Ce n'est pas vérifiable."
          - label: "Parce que les ordinateurs sont interdits"
            correct: false
            why: "Non."
          - label: "Ça suffit"
