      - type: question
        ref: gp-dd-q2
        review: code-dod
      - type: text
        md: "**Exercice 1 (guidé)** : complète la liste."
      - type: exercise
        ref: gp-ex-dod-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : ta définition de terminé."
      - type: exercise
        ref: gp-ex-dod-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : « ça marche chez moi »."
      - type: exercise
