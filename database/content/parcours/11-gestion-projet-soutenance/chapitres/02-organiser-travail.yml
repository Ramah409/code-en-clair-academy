            why: "Non."
        explanation: "La liste de contrôle rend « terminé » vérifiable."
    exercises:
      - slug: gp-ex-dod-guide
        kind: COMPLETER
        title: "La définition de terminé"
        difficulty: FACILE
        skill: gestion-projet
        statement: "Complète la liste de contrôle."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Les critères d'acceptation sont validés."
          - "La CI est verte ; le code est relu."
          - "acceptation, tests, relu, documentation."
        solution: '["acceptation", "tests", "relu", "documentation"]'
        explanation: "Une story n'est terminée que lorsque tout est coché."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            [ ] Les critères d'[[1]] sont vérifiés
            [ ] Les [[2]] automatiques passent dans la CI
            [ ] Le code est [[3]] par une autre personne et fusionné
            [ ] La [[4]] (README, API) est à jour
          blanks:
            - ["acceptation"]
            - ["tests"]
            - ["relu", "revu"]
            - ["documentation", "doc"]
      - slug: gp-ex-dod-libre
        kind: CODE_LIBRE
        title: "Ma définition de terminé"
        difficulty: FACILE
        skill: gestion-projet
        statement: |
          Écris ta définition de terminé en trois lignes commençant par `[ ]` : une sur les **tests**, une sur
          la **relecture**, une sur les **critères d'acceptation**.
        criteria: "Trois cases : tests, relecture, critères."
        hints:
          - "[ ] Les tests passent."
          - "[ ] Le code est relu."
          - "[ ] Les critères d'acceptation sont vérifiés."
        solution: |
          [ ] Les critères d'acceptation sont vérifiés
          [ ] Les tests automatiques passent
          [ ] Le code est relu par une autre personne
        explanation: "Trois cases vérifiables."
        xp: 15
        payload:
          language: text
          starter: |
            [ ]
          checks:
            - pattern: '(?im)^\s*\[\s?\][^\n]*test'
              message: "Ajoute une case sur les tests."
            - pattern: '(?im)^\s*\[\s?\][^\n]*(?:relu|relecture|revu)'
              message: "Ajoute une case sur la relecture."
            - pattern: "(?im)^\\s*\\[\\s?\\][^\\n]*crit[èe]re"
              message: "Ajoute une case sur les critères d'acceptation."
      - slug: gp-ex-dod-bug
        kind: CORRIGER_ERREUR
        title: "« Ça marche chez moi »"
        difficulty: FACILE
        skill: gestion-projet
        statement: |
          Cette définition de terminé n'est pas vérifiable. Remplace la ligne par deux cases : les tests
          passent, et le code est relu.
        criteria: "Plus de « chez moi » ; deux cases tests et relecture."
        hints:
          - "Qu'est-ce qui se vérifie ?"
          - "Les tests, la relecture."
          - "[ ] Les tests passent / [ ] Le code est relu."
        solution: |
          [ ] Les tests automatiques passent
          [ ] Le code est relu par une autre personne
        explanation: "Vérifiable par n'importe qui."
        xp: 10
        payload:
          language: text
          starter: |
            [ ] Ça marche chez moi
          checks:
            - pattern: '(?i)chez moi'
              absent: true
              message: "« Chez moi » n'est pas vérifiable."
            - pattern: '(?im)^\s*\[\s?\][^\n]*test'
              message: "Ajoute une case sur les tests."
            - pattern: '(?im)^\s*\[\s?\][^\n]*(?:relu|relecture|revu)'
              message: "Ajoute une case sur la relecture."

