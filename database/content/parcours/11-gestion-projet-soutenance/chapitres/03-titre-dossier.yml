slug: gp-titre-dossier
position: 3
level: AVANCE
title: "Le titre CDA et le dossier de projet"
summary: "Connaître les trois blocs du titre, relier chaque compétence à une preuve, construire le plan du dossier, écrire des extraits utiles et le résumé en anglais. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: gp-competences-cda
    title: "Les trois blocs du titre CDA"
    duration: 10
    objective: "Citer les trois blocs de compétences du titre Concepteur Développeur d'Applications et ce que chacun contient."
    prerequisites: "Chapitre « Organiser le travail en mode agile »."
    skills: [oral-cda]
    xp: 15
    memo: |
      - Le titre professionnel **CDA** (niveau 6) comporte **trois blocs** de compétences.
      - **Bloc 1 — Développer une application sécurisée** : environnement de travail, interfaces utilisateur, composants métier, contribution à la gestion de projet.
      - **Bloc 2 — Concevoir et développer une application sécurisée organisée en couches** : besoin et maquettes, architecture, base de données, accès aux données (SQL et NoSQL).
      - **Bloc 3 — Préparer le déploiement d'une application sécurisée** : plans de tests, documentation du déploiement, mise en production DevOps.
      - Référence officielle : le **REAC** et le **RC** du titre sur France Compétences ; vérifie la version de ta session.
    commonMistakes: |
      - Oublier la sécurité, présente dans le nom des trois blocs.
      - Ne rien prévoir pour le NoSQL ou le déploiement.
    blocks:
      - type: text
        md: |
          Le jury évalue des **compétences**, pas un logiciel. Ton projet est la **preuve** que tu les as.
      - type: definition
        id: def-bloc
        term: "Bloc de compétences"
        md: |
          Un **chapitre du permis de conduire** : le code, la conduite en ville, la conduite sur autoroute.
          Chaque bloc regroupe des compétences proches, et il faut les valider tous pour obtenir le titre.
      - type: code
        id: code-blocs
        language: text
        title: "Les trois blocs en une phrase"
        code: |
          Bloc 1 : je développe  (interfaces, composants métier, gestion de projet)
          Bloc 2 : je conçois    (besoin, architecture, base de données, accès aux données)
          Bloc 3 : je livre      (tests, documentation du déploiement, mise en production)
        lines:
          - n: 1
            note: "Écrire le code de l'application."
          - n: 2
            note: "Réfléchir à sa structure et à ses données."
          - n: 3
            note: "La tester et la mettre en ligne."
      - type: question
        ref: gp-cd-q1
        review: code-blocs
      - type: question
        ref: gp-cd-q2
        review: def-bloc
      - type: text
        md: "**Exercice 1 (guidé)** : quel bloc ?"
      - type: exercise
        ref: gp-ex-blocs-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : résume chaque bloc."
      - type: exercise
        ref: gp-ex-blocs-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un bloc mal rangé."
      - type: exercise
        ref: gp-ex-blocs-bug
      - type: quiz
        items:
          - ref: gp-cd-q5
            review: def-bloc
          - ref: gp-bl-q4
            review: code-blocs
          - ref: gp-bl-q5
            review: code-blocs
    questions:
      - code: gp-cd-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Dans quel bloc se trouve la compétence « concevoir et mettre en place une base de données relationnelle » ?"
        choices:
          - label: "Bloc 2 : concevoir et développer une application sécurisée organisée en couches"
            correct: true
            why: "Conception et accès aux données."
          - label: "Bloc 1 : développer une application sécurisée"
            correct: false
            why: "Le bloc 1 couvre interfaces, composants métier et gestion de projet."
          - label: "Bloc 3 : préparer le déploiement"
            correct: false
            why: "Le bloc 3 couvre tests et déploiement."
        explanation: "Bloc 2 = besoin, architecture, base de données, accès aux données."
      - code: gp-cd-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: oral-cda
        prompt: "Pour obtenir le titre CDA, il faut valider les trois blocs de compétences."
        choices:
          - label: "Vrai"
            correct: true
            why: "Chaque bloc est indispensable."
          - label: "Faux"
            correct: false
            why: "Le titre complet exige les trois."
        explanation: "Un bloc peut aussi être validé séparément (certificat de compétences)."
      - code: gp-cd-q5
        kind: TEXTE
        difficulty: 3
        skill: oral-cda
        prompt: "Quel sigle désigne le référentiel qui décrit les activités et compétences d'un titre professionnel ? (quatre lettres)"
        answers: ["REAC"]
        explanation: "Référentiel Emploi Activités Compétences ; le RC décrit, lui, les modalités d'évaluation."
      - code: gp-bl-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Quel mot est présent dans le nom des trois blocs ?"
        choices:
          - label: "Sécurisée"
            correct: true
            why: "La sécurité est partout."
          - label: "Mobile"
            correct: false
            why: "Non."
          - label: "Rapide"
            correct: false
            why: "Non."
        explanation: "Une application sécurisée, à chaque bloc."
      - code: gp-bl-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Dans quel bloc se trouve « développer des interfaces utilisateur » ?"
        choices:
          - label: "Bloc 1"
            correct: true
            why: "Je développe."
          - label: "Bloc 2"
            correct: false
            why: "Il concerne la conception."
          - label: "Bloc 3"
            correct: false
            why: "Il concerne le déploiement."
        explanation: "Développer (1), concevoir (2), livrer (3)."
    exercises:
      - slug: gp-ex-blocs-guide
        kind: COMPLETER
        title: "Quel bloc ?"
        difficulty: FACILE
        skill: oral-cda
        statement: "Indique le bloc (1, 2 ou 3) de chaque preuve."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Un formulaire Angular : je développe."
          - "Un MCD : je conçois ; un workflow de déploiement : je livre."
          - "1, 2, 3."
        solution: '["1", "2", "3"]'
        explanation: "Développer (1), concevoir en couches (2), préparer le déploiement (3)."
        xp: 10
        payload:
          language: text
          template: |
            Formulaire Angular accessible avec validation     → bloc [[1]]
            MCD, MLD et migrations Flyway                    → bloc [[2]]
            Workflow GitHub Actions qui teste et déploie      → bloc [[3]]
          blanks:
            - ["1"]
            - ["2"]
            - ["3"]
      - slug: gp-ex-blocs-libre
        kind: CODE_LIBRE
        title: "Résumer chaque bloc"
        difficulty: FACILE
        skill: oral-cda
        statement: |
          Écris trois lignes `Bloc 1 :`, `Bloc 2 :`, `Bloc 3 :` et résume chaque bloc avec ses mots-clés
          (développer, concevoir, déployer).
        criteria: "Bloc 1 développer, bloc 2 concevoir, bloc 3 déployer."
        hints:
          - "Bloc 1 : développer."
          - "Bloc 2 : concevoir en couches."
          - "Bloc 3 : préparer le déploiement."
        solution: |
          Bloc 1 : développer une application sécurisée.
          Bloc 2 : concevoir et développer une application organisée en couches.
          Bloc 3 : préparer le déploiement d'une application sécurisée.
        explanation: "Trois verbes à retenir en les comprenant : développer, concevoir, livrer."
        xp: 15
        payload:
          language: text
          starter: |
            Bloc 1 :
            Bloc 2 :
            Bloc 3 :
          checks:
            - pattern: '(?im)^\s*Bloc\s*1\s*:[^\n]*d[ée]velopp'
              message: "Le bloc 1 : développer."
            - pattern: '(?im)^\s*Bloc\s*2\s*:[^\n]*con[çc]e'
              message: "Le bloc 2 : concevoir."
            - pattern: '(?im)^\s*Bloc\s*3\s*:[^\n]*(?:d[ée]ploi|mise en production|livr)'
              message: "Le bloc 3 : préparer le déploiement."
      - slug: gp-ex-blocs-bug
        kind: CORRIGER_ERREUR
        title: "Un bloc mal rangé"
        difficulty: FACILE
        skill: oral-cda
        statement: "Le MCD a été rangé dans le bloc 3. Corrige le numéro du bloc."
        criteria: "Le MCD est dans le bloc 2."
        hints:
          - "Le MCD sert à concevoir la base."
          - "Concevoir : bloc 2."
          - "MCD → bloc 2"
        solution: |
          MCD → bloc 2
        explanation: "La base de données se conçoit dans le bloc 2."
        xp: 10
        payload:
          language: text
          starter: |
            MCD → bloc 3
          checks:
            - pattern: '(?i)MCD\s*(?:→|->)\s*bloc\s*3'
              absent: true
              message: "Le MCD n'est pas dans le bloc 3."
            - pattern: '(?i)MCD\s*(?:→|->)\s*bloc\s*2'
              message: "Écris : MCD → bloc 2."

  # ===================================================================== LEÇON 2
  - slug: gp-matrice-preuves
    title: "Une preuve pour chaque compétence"
    duration: 10
    objective: "Relier chaque compétence à une preuve concrète de son projet dans une matrice."
    prerequisites: "Leçon « Les trois blocs du titre CDA »."
    skills: [oral-cda]
    xp: 15
    memo: |
      - Une **preuve** est un élément concret que tu peux montrer : un fichier, un composant, un diagramme, un test, une capture.
      - La **matrice compétences → preuves** structure ton dossier et ta présentation.
      - Le NoSQL et le bloc 3 aussi ont besoin d'une preuve.
    commonMistakes: |
      - Une preuve vague (« j'ai fait du Java »).
      - Présenter son projet sans jamais nommer les compétences.
    blocks:
      - type: definition
        id: def-preuve
        term: "Preuve"
        md: |
          Au permis, dire « je sais faire un créneau » ne suffit pas : l'examinateur veut te **voir** le faire.
          Au titre CDA, la preuve est un morceau de ton projet que le jury peut regarder.
      - type: code
        id: code-matrice
        language: text
        title: "Une matrice compétences → preuves (extrait)"
        code: |
          Bloc 1 · Développer des interfaces utilisateur    → Composants Angular, formulaires réactifs, accessibilité
          Bloc 1 · Développer des composants métier          → Services Spring (règles de réservation) + tests JUnit
          Bloc 1 · Contribuer à la gestion de projet         → Backlog MoSCoW, sprints, GitHub Projects
          Bloc 2 · Analyser les besoins et maquetter         → User stories, wireframes Figma
          Bloc 2 · Concevoir la base de données              → MCD, MLD, script SQL, migrations Flyway
          Bloc 2 · Composants d'accès aux données            → Repositories JPA, NoSQL (journal)
          Bloc 3 · Plans de tests                            → Testcontainers, cahier de recette
          Bloc 3 · Mise en production DevOps                 → GitHub Actions : CI puis déploiement
        lines:
          - n: 1
            note: "Pour chaque compétence, une preuve concrète que tu peux **montrer**."
          - n: 6
            note: "Le NoSQL est attendu : même un petit usage (MongoDB, Redis, JSONB) doit être expliqué."
          - n: 8
            note: "Le bloc 3 se prouve avec des fichiers réels : workflow, Dockerfile, résultats de tests."
      - type: question
        ref: gp-cd-q3
        review: code-matrice
      - type: question
        ref: gp-mx-q2
        review: def-preuve
      - type: text
        md: "**Exercice 1 (guidé)** : complète la matrice."
      - type: exercise
        ref: gp-ex-matrice-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : ta propre matrice."
      - type: exercise
        ref: gp-ex-matrice
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une preuve trop vague."
      - type: exercise
        ref: gp-ex-matrice-bug
      - type: jury
        items:
          - q: "Quelles compétences votre projet couvre-t-il ?"
            a: "Les trois blocs : le développement sécurisé (interfaces Angular, composants métier Spring, gestion de projet agile), la conception en couches (besoin et maquettes, architecture, base PostgreSQL, accès aux données SQL et NoSQL) et la préparation du déploiement (plan de tests, Docker, CI/CD avec GitHub Actions). J'ai une preuve concrète pour chaque compétence."
          - q: "Où utilisez-vous du NoSQL ?"
            a: "Donner l'usage réel : par exemple un journal d'événements dans MongoDB, un cache Redis, ou une colonne JSONB dans PostgreSQL. Expliquer pourquoi ce choix convient mieux qu'une table classique pour ces données peu structurées."
      - type: quiz
        items:
          - ref: gp-cd-q4
            review: code-matrice
          - ref: gp-mx-q4
            review: def-preuve
          - ref: gp-mx-q5
            review: code-matrice
    questions:
      - code: gp-cd-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Quelle preuve montre la compétence « préparer et exécuter les plans de tests » ?"
        choices:
          - label: "La stratégie de tests, les tests automatisés et le cahier de recette"
            correct: true
            why: "Plan + exécution + résultats."
          - label: "Le diagramme de cas d'utilisation"
            correct: false
            why: "Il prouve l'analyse du besoin."
          - label: "Le Dockerfile"
            correct: false
            why: "Il prouve la préparation du déploiement."
        explanation: "Montre aussi les résultats (CI verte, rapport de recette)."
      - code: gp-mx-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: oral-cda
        prompt: "« J'ai fait du Java » est une bonne preuve de compétence."
        choices:
          - label: "Vrai"
            correct: false
            why: "Trop vague : le jury ne peut rien regarder."
          - label: "Faux"
            correct: true
            why: "Il faut un élément précis : un service, un test, un fichier."
        explanation: "Une preuve se montre."
      - code: gp-cd-q4
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: oral-cda
        prompt: "Quelles preuves appartiennent au bloc 3 (préparer le déploiement) ? (plusieurs réponses)"
        choices:
          - label: "Le workflow GitHub Actions"
            correct: true
            why: "Démarche DevOps."
          - label: "Le fichier compose.yaml et la documentation de déploiement"
            correct: true
            why: "Documenter le déploiement."
          - label: "Le cahier de recette"
            correct: true
            why: "Plans de tests."
          - label: "Le MCD"
            correct: false
            why: "Il appartient au bloc 2."
        explanation: "Tests, documentation du déploiement, mise en production."
      - code: gp-mx-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "À quoi sert la matrice compétences → preuves ?"
        choices:
          - label: "À montrer où chaque compétence est démontrée dans le projet"
            correct: true
            why: "Une carte pour le jury."
          - label: "À lister les bugs"
            correct: false
            why: "Non."
          - label: "À remplacer le code"
            correct: false
            why: "Non."
        explanation: "Elle structure le dossier et la présentation."
      - code: gp-mx-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Quelle preuve convient à « contribuer à la gestion de projet » ?"
        choices:
          - label: "Le backlog priorisé et le tableau GitHub Projects"
            correct: true
            why: "On voit l'organisation."
          - label: "Le fichier application.properties"
            correct: false
            why: "C'est de la configuration."
          - label: "Une capture de la page d'accueil"
            correct: false
            why: "Elle prouve une interface."
        explanation: "Chaque compétence a sa preuve."
    exercises:
      - slug: gp-ex-matrice-guide
        kind: COMPLETER
        title: "Compléter la matrice"
        difficulty: FACILE
        skill: oral-cda
        statement: "Complète avec la bonne preuve : JUnit, Figma, Actions."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Des tests du service : JUnit."
          - "Des maquettes : Figma ; un déploiement automatique : GitHub Actions."
          - "JUnit, Figma, Actions."
        solution: '["JUnit", "Figma", "Actions"]'
        explanation: "Une preuve concrète par compétence."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Composants métier       → ReservationService et ses tests [[1]]
            Maquetter               → wireframes réalisés dans [[2]]
            Mise en production      → workflow GitHub [[3]]
          blanks:
            - ["JUnit"]
            - ["Figma"]
            - ["Actions"]
      - slug: gp-ex-matrice
        kind: CODE_LIBRE
        title: "Ma matrice de preuves"
        difficulty: INTERMEDIAIRE
        skill: oral-cda
        statement: |
          Écris **trois lignes**, une par bloc, au format `Bloc N : compétence → preuve`. Chaque preuve doit
          être un élément **concret** de ton projet (un fichier, un composant, un diagramme, un test…).
        criteria: "Trois lignes Bloc 1, Bloc 2, Bloc 3, chacune avec une flèche et une preuve."
        hints:
          - "Bloc 1 : développer des composants métier → ReservationService et ses tests JUnit."
          - "Bloc 2 : concevoir la base de données → MCD, MLD et migrations Flyway."
          - "Bloc 3 : mise en production DevOps → workflow GitHub Actions deploiement.yml."
        solution: |
          Bloc 1 : développer des composants métier → ReservationService et ses tests JUnit.
          Bloc 2 : concevoir la base de données → MCD, MLD et migrations Flyway.
          Bloc 3 : mise en production DevOps → workflow GitHub Actions deploiement.yml.
        explanation: "Complète ensuite la matrice pour toutes les compétences : elle structure ton dossier et ta présentation."
        xp: 20
        payload:
          language: text
          starter: |
            Bloc 1 :
            Bloc 2 :
            Bloc 3 :
          checks:
            - pattern: '(?im)^\s*Bloc\s*1\s*:[ \t]*\S[^\n]*(?:→|->|=>)[ \t]*\S{3,}'
              message: "Ligne « Bloc 1 : compétence → preuve »."
            - pattern: '(?im)^\s*Bloc\s*2\s*:[ \t]*\S[^\n]*(?:→|->|=>)[ \t]*\S{3,}'
              message: "Ligne « Bloc 2 : compétence → preuve »."
            - pattern: '(?im)^\s*Bloc\s*3\s*:[ \t]*\S[^\n]*(?:→|->|=>)[ \t]*\S{3,}'
              message: "Ligne « Bloc 3 : compétence → preuve »."
      - slug: gp-ex-matrice-bug
        kind: CORRIGER_ERREUR
        title: "Une preuve trop vague"
        difficulty: FACILE
        skill: oral-cda
        statement: |
          « j'ai fait du Java » ne prouve rien. Remplace-le par un élément précis, par exemple un service et
          ses tests JUnit.
        criteria: "Plus de « j'ai fait du Java » ; une preuve précise (service, test…)."
        hints:
          - "Quel fichier peux-tu montrer ?"
          - "Un service Spring et ses tests."
          - "→ ReservationService et ses tests JUnit"
        solution: |
          Bloc 1 : développer des composants métier → ReservationService et ses tests JUnit
        explanation: "Le jury peut ouvrir le fichier."
        xp: 10
        payload:
          language: text
          starter: |
            Bloc 1 : développer des composants métier → j'ai fait du Java
          checks:
            - pattern: "(?i)j'ai fait du Java"
              absent: true
              message: "C'est trop vague."
            - pattern: '(?i)(?:→|->)[^\n]*(?:Service|test|JUnit|Controller|Repository)'
              message: "Donne une preuve précise : un service, un test…"

  # ===================================================================== LEÇON 3
  - slug: gp-dossier-projet
    title: "Le plan du dossier de projet"
    duration: 10
    objective: "Construire le plan du dossier de projet, du besoin au bilan."
    prerequisites: "Leçon « Une preuve pour chaque compétence »."
    skills: [oral-cda]
    xp: 15
    memo: |
      - Le **dossier de projet** présente ton projet au jury **avant** la soutenance.
      - Plan type : compétences couvertes, contexte et besoin, gestion de projet, conception, réalisations, tests et déploiement, veille et bilan.
      - Le **dossier professionnel** (DP) est un document distinct : il décrit tes pratiques par compétence.
      - Relire : orthographe, sommaire, légendes des figures.
    commonMistakes: |
      - Oublier la veille technologique et de sécurité.
      - Un bilan qui ne parle que des réussites.
    blocks:
      - type: text
        md: |
          Le jury lit ton dossier avant de te rencontrer. Un dossier clair, c'est une soutenance qui commence
          bien : le jury arrive avec des questions précises.
      - type: definition
        id: def-dossier
        term: "Dossier de projet"
        md: |
          La **bande-annonce** de ton projet : il raconte l'histoire (le besoin), montre les meilleurs moments
          (tes réalisations) et prouve la qualité (tests, sécurité, déploiement).
      - type: steps
        id: etapes-plan
        title: "Un plan qui fonctionne"
        items:
          - "**Compétences couvertes** : la matrice compétences → preuves, dès les premières pages."
          - "**Contexte et besoin** : l'entreprise, le client, le problème, le périmètre (MoSCoW)."
          - "**Gestion de projet** : méthode, outils, organisation."
          - "**Conception** : maquettes, architecture, UML, MCD/MLD, choix techniques justifiés."
          - "**Réalisations** : extraits de code commentés (front, back, données), sécurité."
          - "**Tests et déploiement** : stratégie, résultats, Docker, CI/CD."
          - "**Veille et bilan** : sources de veille, difficultés, améliorations possibles, ce que tu as appris."
      - type: question
        ref: gp-dp-q1
        review: etapes-plan
      - type: question
        ref: gp-dp-q5
        review: etapes-plan
      - type: text
        md: "**Exercice 1 (guidé)** : remets le plan dans l'ordre."
      - type: exercise
        ref: gp-ex-plan-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : ton bilan."
      - type: exercise
        ref: gp-ex-bilan-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une partie oubliée."
      - type: exercise
        ref: gp-ex-plan-bug
      - type: jury
        items:
          - q: "Comment faites-vous votre veille ?"
            a: "Des sources régulières et fiables : blogs officiels d'Angular et Spring, notes de version, CERT-FR et OWASP pour la sécurité, newsletters, conférences en ligne. Donner un exemple concret : une nouveauté ou une faille découverte grâce à la veille et ce qu'elle a changé dans mon projet."
      - type: quiz
        items:
          - ref: gp-c3-b1
            review: etapes-plan
          - ref: gp-c3-b2
            review: def-dossier
          - ref: gp-pl-q5
            review: def-dossier
    questions:
      - code: gp-dp-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Pourquoi placer la matrice compétences → preuves au début du dossier ?"
        choices:
          - label: "Le jury voit tout de suite où chaque compétence est démontrée"
            correct: true
            why: "Il évalue des compétences."
          - label: "Pour remplir des pages"
            correct: false
            why: "Elle a une vraie utilité."
          - label: "Parce qu'elle est obligatoire en dernière page"
            correct: false
            why: "Elle est utile dès le début."
        explanation: "Une carte pour guider la lecture."
      - code: gp-dp-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Que doit contenir la partie « bilan » du dossier ?"
        choices:
          - label: "Les difficultés rencontrées, les solutions, les améliorations possibles et ce que tu as appris"
            correct: true
            why: "Elle montre ton recul."
          - label: "Uniquement les réussites"
            correct: false
            why: "Le jury apprécie l'honnêteté."
          - label: "La liste des fichiers du projet"
            correct: false
