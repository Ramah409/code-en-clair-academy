            correct: true
            why: "Deux documents distincts, tous deux lus par le jury."
          - label: "Ce sont deux noms pour le même document"
            correct: false
            why: "Ils ont des rôles différents."
          - label: "Le dossier professionnel est facultatif"
            correct: false
            why: "Il fait partie du dossier de candidature au titre."
        explanation: "Vérifie les consignes exactes de ton centre et de ta session."
      - code: gp-pl-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: oral-cda
        prompt: "Le jury lit le dossier de projet avant la soutenance."
        choices:
          - label: "Vrai"
            correct: true
            why: "Il arrive avec des questions."
          - label: "Faux"
            correct: false
            why: "Il le lit avant."
        explanation: "Le dossier prépare la rencontre."
    exercises:
      - slug: gp-ex-plan-ordre
        kind: REMETTRE_ORDRE
        title: "Le plan du dossier"
        difficulty: FACILE
        skill: oral-cda
        statement: "Remets les parties du dossier de projet dans un ordre logique."
        criteria: "Compétences, contexte, gestion, conception, réalisations, tests et déploiement, veille et bilan."
        hints:
          - "On commence par les compétences couvertes."
          - "La conception vient avant les réalisations."
          - "La veille et le bilan terminent le dossier."
        solution: |
          Compétences couvertes par le projet
          Contexte, besoin et périmètre
          Gestion de projet
          Conception : maquettes, architecture, UML, base de données
          Réalisations commentées et sécurité
          Tests et déploiement
          Veille et bilan
        explanation: "Du pourquoi au comment, puis la preuve de la qualité et le recul."
        xp: 10
        payload:
          language: text
          lines:
            - "Compétences couvertes par le projet"
            - "Contexte, besoin et périmètre"
            - "Gestion de projet"
            - "Conception : maquettes, architecture, UML, base de données"
            - "Réalisations commentées et sécurité"
            - "Tests et déploiement"
            - "Veille et bilan"
      - slug: gp-ex-bilan-libre
        kind: CODE_LIBRE
        title: "Mon bilan"
        difficulty: INTERMEDIAIRE
        skill: oral-cda
        statement: |
          Écris ton bilan en trois lignes : `Difficulté :`, `Solution :`, `Appris :`.
        criteria: "Trois lignes remplies."
        hints:
          - "Difficulté : une requête trop lente sur la liste des réservations."
          - "Solution : j'ai analysé le plan avec EXPLAIN et ajouté un index."
          - "Appris : vérifier les requêtes importantes avant la mise en production."
        solution: |
          Difficulté : la liste des réservations s'affichait lentement.
          Solution : j'ai analysé la requête avec EXPLAIN et ajouté un index sur la date.
          Appris : je vérifie maintenant les requêtes importantes avant la mise en production.
        explanation: "Une vraie difficulté, racontée honnêtement, montre ton recul."
        xp: 15
        payload:
          language: text
          starter: |
            Difficulté :
            Solution :
            Appris :
          checks:
            - pattern: '(?im)^\s*Difficult[ée]\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris une difficulté."
            - pattern: '(?im)^\s*Solution\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris la solution."
            - pattern: '(?im)^\s*Appris\s*:[ \t]*\S[^\n]{10,}'
              message: "Dis ce que tu as appris."
      - slug: gp-ex-plan-bug
        kind: CORRIGER_ERREUR
        title: "Une partie oubliée"
        difficulty: FACILE
        skill: oral-cda
        statement: "Ce plan oublie la dernière partie. Ajoute-la à la fin : `Veille et bilan`."
        criteria: "La ligne Veille et bilan est présente, après Tests et déploiement."
        hints:
          - "Qu'est-ce qui termine le dossier ?"
          - "Le recul et les sources d'information."
          - "Veille et bilan"
        solution: |
          Conception
          Réalisations
          Tests et déploiement
          Veille et bilan
        explanation: "La veille et le bilan montrent ton recul."
        xp: 10
        payload:
          language: text
          starter: |
            Conception
            Réalisations
            Tests et déploiement
          checks:
            - pattern: '(?is)Tests et d[ée]ploiement.*Veille et bilan'
              message: "Ajoute « Veille et bilan » à la fin."

  # ===================================================================== LEÇON 4
  - slug: gp-extraits-code
    title: "Un extrait de code utile"
    duration: 9
    objective: "Présenter un extrait de code court, légendé, expliqué et relié à une compétence, en disant « je »."
    prerequisites: "Leçon « Le plan du dossier de projet »."
    skills: [oral-cda]
    xp: 15
    memo: |
      - Un extrait est **court**, **légendé** (Figure N – titre) et **expliqué** : le problème, la solution, la preuve.
      - Il est relié à une **compétence**.
      - Écris « **j'ai** fait » pour ta part : le jury évalue tes compétences à toi.
    commonMistakes: |
      - Copier des pages entières de code.
      - Écrire « on » partout.
      - Laisser un mot de passe dans une capture.
    blocks:
      - type: definition
        id: def-extrait
        term: "Extrait utile"
        md: |
          Une **photo de vacances avec sa légende** : on ne montre pas les deux mille photos, on choisit la
          meilleure et on dit où et quand elle a été prise.
      - type: compare
        left:
          title: "Extrait peu utile"
          code: |
            (3 pages de code du contrôleur, sans commentaire)
          language: text
        right:
          title: "Extrait utile"
          code: |
            Figure 12 – Vérification de propriété (bloc 1, composants métier)
            10 lignes du service + 3 phrases :
            le problème (IDOR), la solution, le test qui la prouve.
          language: text
      - type: question
        ref: gp-dp-q2
        review: def-extrait
      - type: question
        ref: gp-dp-q3
        review: def-extrait
      - type: text
        md: "**Exercice 1 (guidé)** : complète la légende."
      - type: exercise
        ref: gp-ex-extrait-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : explique un extrait."
      - type: exercise
        ref: gp-ex-extrait-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : « on »."
      - type: exercise
        ref: gp-ex-extrait-bug
      - type: jury
        items:
          - q: "Pourquoi avoir choisi ces technologies ?"
            a: "Répondre avec des critères : besoin du projet, compétences visées, écosystème et documentation, sécurité, maintenabilité, et contexte de l'entreprise. Par exemple : Spring Boot pour Spring Security et JPA, Angular pour TypeScript et une architecture structurée, PostgreSQL pour la fiabilité et les contraintes relationnelles."
      - type: quiz
        items:
          - ref: gp-dp-q4
            review: def-extrait
          - ref: gp-ext-q4
            review: def-extrait
          - ref: gp-ext-q5
            review: def-extrait
    questions:
      - code: gp-dp-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: oral-cda
        prompt: "Un bon dossier de projet contient de longues pages de code sans commentaire, pour montrer le volume de travail."
        choices:
          - label: "Vrai"
            correct: false
            why: "Le jury ne lira pas des pages de code brut."
          - label: "Faux"
            correct: true
            why: "Des extraits courts, commentés et reliés à une compétence."
        explanation: "La qualité compte, pas la quantité."
      - code: gp-dp-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Dans le dossier, faut-il écrire « nous avons fait » ou « j'ai fait » ?"
        choices:
          - label: "« J'ai fait » pour ta part, « l'équipe a fait » pour le reste, clairement distingués"
            correct: true
            why: "Le jury évalue tes compétences à toi."
          - label: "Toujours « on »"
            correct: false
            why: "Trop flou."
          - label: "Toujours « nous », par modestie"
            correct: false
            why: "Le jury ne sait plus ce que tu as fait."
        explanation: "Sois précise sur ta contribution."
      - code: gp-dp-q4
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: oral-cda
        prompt: "Qu'est-ce qui rend un extrait de code utile dans le dossier ? (plusieurs réponses)"
        choices:
          - label: "Il est court et centré sur l'essentiel"
            correct: true
            why: "Le jury comprend vite."
          - label: "Il est expliqué en quelques phrases"
            correct: true
            why: "Le problème, la solution, la preuve."
          - label: "Il est relié à une compétence"
            correct: true
            why: "Il sert de preuve."
          - label: "Il contient des mots de passe réels pour prouver que ça marche"
            correct: false
            why: "Jamais de secret dans un document."
        explanation: "Court, commenté, relié."
      - code: gp-ext-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Que contient une bonne légende d'extrait ?"
        choices:
          - label: "Un numéro de figure, un titre et la compétence concernée"
            correct: true
            why: "Le jury s'y retrouve."
          - label: "Le nom de l'ordinateur"
            correct: false
            why: "Inutile."
          - label: "Rien"
            correct: false
            why: "Une légende aide la lecture."
        explanation: "Figure 12 – titre (bloc, compétence)."
      - code: gp-ext-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Dans les trois phrases qui expliquent un extrait, que dit-on ?"
        choices:
          - label: "Le problème, la solution, et le test qui la prouve"
            correct: true
            why: "Une petite histoire complète."
          - label: "Le nombre de lignes du fichier"
            correct: false
            why: "Sans intérêt."
          - label: "Le prix de l'ordinateur"
            correct: false
            why: "Aucun rapport."
        explanation: "Problème, solution, preuve."
    exercises:
      - slug: gp-ex-extrait-guide
        kind: COMPLETER
        title: "Compléter la légende"
        difficulty: FACILE
        skill: oral-cda
        statement: "Complète la légende et l'explication de l'extrait."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une légende commence par Figure."
          - "Ce qu'on corrige : le problème ; ce qui prouve : le test."
          - "Figure, problème, test."
        solution: '["Figure", "problème", "test"]'
        explanation: "Légende, problème, solution, preuve."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            [[1]] 12 – Vérification de propriété (bloc 1, composants métier)
            Le [[2]] : une utilisatrice pouvait annuler la réservation d'une autre.
            La solution : le service vérifie la propriétaire avant d'annuler.
            La preuve : un [[3]] JUnit vérifie qu'une autre utilisatrice reçoit un refus.
          blanks:
            - ["Figure"]
            - ["problème", "probleme"]
            - ["test"]
      - slug: gp-ex-extrait-libre
        kind: CODE_LIBRE
        title: "Expliquer un extrait"
        difficulty: INTERMEDIAIRE
        skill: oral-cda
        statement: |
          Choisis une partie de ton projet (ou une validation de formulaire) et écris quatre lignes :
          `Figure :`, `Problème :`, `Solution :`, `Preuve :`.
        criteria: "Quatre lignes remplies."
        hints:
          - "Figure : Validation de l'e-mail (bloc 1, interfaces)."
          - "Problème : des adresses invalides étaient enregistrées."
          - "Solution : @Email et @NotBlank ; Preuve : un test renvoie 400."
        solution: |
          Figure : Validation de l'e-mail à l'inscription (bloc 1, composants métier)
          Problème : des adresses invalides étaient enregistrées.
          Solution : j'ai ajouté @Email et @NotBlank sur le DTO et @Valid dans le contrôleur.
          Preuve : un test MockMvc vérifie qu'un e-mail invalide renvoie une erreur 400.
        explanation: "Une petite histoire complète que le jury comprend en quelques secondes."
        xp: 15
        payload:
          language: text
          starter: |
            Figure :
            Problème :
            Solution :
            Preuve :
          checks:
            - pattern: '(?im)^\s*Figure\s*:[ \t]*\S[^\n]{5,}'
              message: "Donne un titre à la figure."
            - pattern: '(?im)^\s*Probl[èe]me\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris le problème."
            - pattern: '(?im)^\s*Solution\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris la solution."
            - pattern: '(?im)^\s*Preuve\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris la preuve (un test, une capture)."
      - slug: gp-ex-extrait-bug
        kind: CORRIGER_ERREUR
        title: "« On »"
        difficulty: FACILE
        skill: oral-cda
        statement: "Cette phrase utilise « on ». Réécris-la en disant « j'ai »."
        criteria: "Plus de « on » ; la phrase commence par « J'ai »."
        hints:
          - "Le jury veut savoir ce que tu as fait."
          - "Remplace « On a » par « J'ai »."
          - "J'ai ajouté une vérification de propriété dans le service."
        solution: |
          J'ai ajouté une vérification de propriété dans le service.
        explanation: "Ta contribution devient claire."
        xp: 10
        payload:
          language: text
          starter: |
            On a ajouté une vérification de propriété dans le service.
          checks:
            - pattern: '(?i)\bon a\b'
              absent: true
              message: "Évite « on »."
            - pattern: "(?i)j'ai\\s+\\S"
              message: "Commence par « J'ai »."

  # ===================================================================== LEÇON 5
  - slug: gp-resume-anglais
    title: "Le résumé en anglais"
    duration: 11
    objective: "Écrire un court résumé de son projet en anglais, avec des phrases simples."
    prerequisites: "Leçon « Un extrait de code utile »."
    skills: [oral-cda]
    xp: 20
    memo: |
      - Un **résumé en anglais** est demandé (vérifie le format exact dans le RC de ta session).
      - Il présente : le **besoin**, les **technologies**, la **sécurité**, les **tests** ou le **déploiement**.
      - Des phrases simples : sujet, verbe, complément.
    commonMistakes: |
      - Des phrases trop longues traduites mot à mot.
      - Oublier la sécurité.
    blocks:
      - type: definition
        id: def-summary
        term: "Summary"
        md: |
          La **quatrième de couverture** d'un livre, en anglais : quelques phrases qui disent de quoi parle
          le projet, sans entrer dans les détails.
      - type: code
        id: code-summary
        language: text
        title: "Des phrases modèles"
        code: |
          This project is a web application that allows members to book a room online.
          The front end is built with Angular and the back end with Spring Boot and PostgreSQL.
          Security relies on hashed passwords and JWT authentication.
          The application is tested with JUnit and deployed with Docker.
        lines:
          - n: 1
            note: "Le besoin : « allows … to … »."
          - n: 2
            note: "Les technologies : « is built with »."
          - n: 3
            note: "La sécurité : « relies on »."
          - n: 4
            note: "Tests et déploiement."
      - type: question
        ref: gp-en-q1
        review: code-summary
      - type: question
        ref: gp-en-q2
        review: code-summary
      - type: text
        md: "**Exercice 1 (guidé)** : complète le résumé."
      - type: exercise
        ref: gp-ex-summary-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : rédige ton résumé."
      - type: exercise
        ref: gp-ex-summary
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une phrase restée en français."
      - type: exercise
        ref: gp-ex-summary-bug
      - type: quiz
        items:
          - ref: gp-en-q3
            review: def-summary
          - ref: gp-en-q4
            review: code-summary
          - ref: gp-en-q5
            review: code-summary
    questions:
      - code: gp-en-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Quelle phrase présente le besoin ?"
        choices:
          - label: "This project allows members to book a room online."
            correct: true
            why: "« allows … to … » dit à quoi sert le projet."
          - label: "The front end is built with Angular."
            correct: false
            why: "C'est la technique."
          - label: "The application is deployed with Docker."
            correct: false
            why: "C'est le déploiement."
        explanation: "Besoin, technique, sécurité, tests."
      - code: gp-en-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Que veut dire « is built with » ?"
        choices:
          - label: "Est construit avec"
            correct: true
            why: "Pour présenter les technologies."
          - label: "Est testé par"
            correct: false
            why: "C'est « is tested with »."
          - label: "Est déployé sur"
            correct: false
            why: "C'est « is deployed on »."
        explanation: "The front end is built with Angular."
      - code: gp-en-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: oral-cda
        prompt: "Des phrases simples (sujet, verbe, complément) conviennent parfaitement au résumé."
        choices:
          - label: "Vrai"
            correct: true
            why: "Clair et correct."
          - label: "Faux"
            correct: false
            why: "Le jury attend de la clarté, pas de la complexité."
        explanation: "Simple et juste."
      - code: gp-en-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Comment dire « les mots de passe sont hachés » ?"
        choices:
          - label: "Passwords are hashed."
            correct: true
            why: "Hash = hacher."
          - label: "Passwords are hidden."
            correct: false
            why: "Caché, ce n'est pas haché."
          - label: "Passwords are deleted."
            correct: false
            why: "Supprimés."
        explanation: "Security relies on hashed passwords."
      - code: gp-en-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Quelles parties doit couvrir le résumé ?"
        choices:
          - label: "Le besoin, les technologies, la sécurité, les tests ou le déploiement"
            correct: true
            why: "Tout le projet en quelques phrases."
          - label: "Uniquement la liste des fichiers"
            correct: false
            why: "Non."
          - label: "Uniquement les couleurs de l'interface"
            correct: false
            why: "Non."
        explanation: "Une vue d'ensemble."
    exercises:
      - slug: gp-ex-summary-guide
        kind: COMPLETER
        title: "Compléter le résumé"
        difficulty: FACILE
        skill: oral-cda
        statement: "Complète avec : allows, built, hashed."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le besoin : allows … to."
          - "Les technologies : is built with."
          - "allows, built, hashed."
        solution: '["allows", "built", "hashed"]'
        explanation: "Trois phrases modèles."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            This project [[1]] readers to borrow books online.
            The front end is [[2]] with Angular.
            Security relies on [[3]] passwords and JWT authentication.
          blanks:
            - ["allows"]
            - ["built"]
            - ["hashed"]
      - slug: gp-ex-summary
        kind: CODE_LIBRE
        title: "Le résumé en anglais"
        difficulty: DIFFICILE
        skill: oral-cda
        statement: |
          Écris un court résumé **en anglais** (au moins quatre phrases) d'une application de réservation.
          Il doit présenter : le **besoin** (the goal, allows…), la **technique** (Angular, Spring Boot,
          PostgreSQL), la **sécurité** (security, JWT…) et le **déploiement** ou les **tests** (Docker, tests,
          CI). Utilise des phrases simples : sujet, verbe, complément.
        criteria: "Au moins quatre phrases en anglais couvrant besoin, technologies, sécurité, tests ou déploiement."
        hints:
          - "This project is a web application that allows customers to book an appointment online."
          - "The front end is built with Angular and the back end with Spring Boot and PostgreSQL."
          - "Users are authenticated with JWT tokens, and the application is tested and deployed with Docker and GitHub Actions."
        solution: |
          This project is a web application that allows customers to book an appointment with a hairdresser online.
          The goal is to reduce phone calls and to give the salon a clear view of its schedule.
          The front end is built with Angular, and the back end is a REST API developed with Spring Boot and PostgreSQL.
          Security relies on hashed passwords, JWT authentication and role-based access control.
          The application is tested with JUnit and Playwright, and deployed with Docker through a GitHub Actions pipeline.
        explanation: "Des phrases courtes et le vocabulaire technique que tu connais déjà : c'est ce que le jury attend."
        xp: 30
        payload:
          language: text
          starter: |
            This project is
          checks:
            - pattern: '\A(?>[\s\S]*?[a-z][^.!?]{15,}[.!?]){4}'
              message: "Écris au moins quatre phrases complètes, terminées par un point."
            - pattern: '(?i)\b(?:allows?|goal|aim|need|helps?|enables?|purpose)\b'
              message: "Explique le besoin ou le but (the goal, allows users to…)."
            - pattern: '(?i)angular|spring|postgre'
              message: "Cite les technologies (Angular, Spring Boot, PostgreSQL)."
            - pattern: '(?i)secur|jwt|authenticat|password|hash'
              message: "Parle de la sécurité (security, JWT, hashed passwords…)."
            - pattern: '(?i)docker|deploy|tests?\b|tested|pipeline|\bci\b'
              message: "Parle des tests ou du déploiement."
            - pattern: '(?i)\b(?:le|la|les|des|est|avec|pour)\b'
              absent: true
              message: "Écris le résumé en anglais."
      - slug: gp-ex-summary-bug
        kind: CORRIGER_ERREUR
        title: "Une phrase restée en français"
        difficulty: FACILE
        skill: oral-cda
        statement: |
          La deuxième phrase est restée en français. Traduis-la : « The application is tested with JUnit. »
        criteria: "Plus de français ; la phrase est en anglais."
        hints:
