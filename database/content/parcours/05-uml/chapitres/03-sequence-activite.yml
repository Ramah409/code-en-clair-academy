        kind: CODE_LIBRE
        title: "Emprunter un livre"
        difficulty: FACILE
        skill: uml-architecture
        statement: |
          Écris le diagramme d'activité PlantUML de l'emprunt d'un livre :
          `start`, puis les actions `:Chercher le livre;`, `:Cliquer sur Emprunter;`, `:Enregistrer l'emprunt;`,
          puis `stop`.
        criteria: "start, trois actions dans l'ordre, stop."
        hints:
          - "Entre @startuml et @enduml."
          - "Chaque action : `:texte;`."
          - "start, les trois actions, stop."
