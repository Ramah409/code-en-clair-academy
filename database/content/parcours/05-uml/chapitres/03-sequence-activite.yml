          :Enregistrer la réservation;
          :Envoyer la confirmation;
          stop
        explanation: "`:texte;` : le point-virgule ferme l'action."
        xp: 10
        payload:
          language: text
          starter: |
            start
            :Enregistrer la réservation;
            :Envoyer la confirmation
            stop
          checks:
            - pattern: '(?m):Envoyer la confirmation\s*$'
              absent: true
              message: "Il manque le point-virgule après « Envoyer la confirmation »."
            - pattern: ':\s*Envoyer la confirmation\s*;'
              message: "Écris :Envoyer la confirmation;"

  # ===================================================================== LEÇON 4
  - slug: uml-activite-decision
    title: "Les décisions dans un diagramme d'activité"
    duration: 11
    objective: "Ajouter une décision (if / else / endif) à un processus, avec ses deux branches."
    prerequisites: "Leçon « Le diagramme d'activité : début, actions, fin »."
    skills: [uml-architecture]
    xp: 15
    memo: |
      - Une décision est un **carrefour** : `if (Salle libre ?) then (oui) ... else (non) ... endif`.
      - Chaque branche contient ses actions ; `endif` referme le carrefour.
      - Une décision peut être placée **dans** une autre : chaque `if` a alors son propre `endif`.
    commonMistakes: |
      - Oublier une branche d'une décision.
      - Oublier le `endif`.
      - Confondre `endif` (activité) et `end` (bloc alt de séquence).
    blocks:
      - type: text
        md: |
          Un processus réel a souvent un **carrefour** : si la salle est libre, on réserve ; sinon, on prévient.
      - type: definition
        id: def-decision
        term: "Décision"
        md: |
          Un **panneau de bifurcation** sur un sentier : une question, deux chemins (oui / non), puis les
          chemins se rejoignent (`endif`).
      - type: code
        id: code-decision
        language: text
        title: "Réserver une salle, avec une décision"
        code: |
          @startuml
          start
          :Choisir une salle;
          if (Salle libre ?) then (oui)
            :Enregistrer la réservation;
            :Envoyer la confirmation;
          else (non)
            :Afficher « salle déjà prise »;
          endif
          stop
          @enduml
        lines:
          - n: 4
            note: "Une décision : une question, avec la branche « oui »."
          - n: 7
            note: "La branche « non »."
          - n: 9
            note: "`endif` referme la décision."
      - type: question
        ref: uml-act-q2
        review: code-decision
      - type: question
        ref: uml-act-q5
        review: def-decision
      - type: text
        md: "**Exercice 1 (guidé)** : remets le processus dans l'ordre."
      - type: exercise
        ref: uml-ex-activite-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : une réservation avec deux décisions."
      - type: exercise
        ref: uml-ex-activite
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une décision jamais refermée."
      - type: exercise
        ref: uml-ex-decision-bug
      - type: jury
        items:
          - q: "Quand utilisez-vous un diagramme d'activité plutôt qu'un diagramme de séquence ?"
            a: "Le diagramme d'activité décrit un processus métier (étapes et décisions), compréhensible par le client ; le diagramme de séquence montre les échanges techniques entre composants pour un scénario."
      - type: quiz
        items:
          - ref: uml-ad-q3
            review: code-decision
          - ref: uml-ad-q4
            review: def-decision
          - ref: uml-c3-b2
            review: def-decision
    questions:
      - code: uml-act-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: uml-architecture
        prompt: "Dans l'exemple, que se passe-t-il si la salle est déjà prise ?"
        choices:
          - label: "Le message « salle déjà prise » s'affiche, puis le processus se termine"
            correct: true
            why: "Branche « non »."
          - label: "La réservation est enregistrée quand même"
            correct: false
            why: "Seulement dans la branche « oui »."
          - label: "Le processus recommence au début"
            correct: false
            why: "Aucune boucle n'est dessinée."
        explanation: "Chaque branche d'une décision est suivie jusqu'à la fin."
      - code: uml-act-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: uml-architecture
        prompt: "Quel mot-clé ferme une décision en PlantUML ?"
        choices:
          - label: "`endif`"
            correct: true
            why: "if … then … else … endif."
          - label: "`end`"
            correct: false
            why: "end ferme un bloc alt dans une séquence."
          - label: "`stop`"
            correct: false
            why: "stop termine tout le processus."
        explanation: "if / then / else / endif."
      - code: uml-ad-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: uml-architecture
        prompt: "Combien de branches a une décision `if … else … endif` ?"
        choices:
          - label: "Deux : oui et non"
            correct: true
            why: "Une par réponse à la question."
          - label: "Une seule"
            correct: false
            why: "Le else ajoute la seconde."
          - label: "Aucune"
            correct: false
            why: "Une décision crée justement des branches."
        explanation: "Question, branche oui, branche non."
      - code: uml-ad-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: uml-architecture
        prompt: "Si on place une décision dans une autre, chaque `if` doit avoir son propre `endif`."
        choices:
          - label: "Vrai"
            correct: true
            why: "Chaque carrefour se referme."
          - label: "Faux"
            correct: false
            why: "Un endif manquant empêche le dessin."
        explanation: "Autant de endif que de if."
      - code: uml-c3-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: uml-architecture
        prompt: "Quels sont les trois diagrammes UML les plus attendus au dossier CDA ?"
        choices:
          - label: "Cas d'utilisation, classes, séquence"
            correct: true
            why: "Le besoin, la structure, le déroulement."
          - label: "Composants, paquets, objets"
            correct: false
            why: "Utiles, mais moins attendus."
          - label: "Activité, états, temps"
            correct: false
            why: "Complémentaires."
        explanation: "Besoin → structure → comportement."
    exercises:
      - slug: uml-ex-activite-ordre
        kind: REMETTRE_ORDRE
        title: "Ordonner un processus avec décision"
        difficulty: FACILE
        skill: uml-architecture
        statement: "Remets les lignes du diagramme d'activité dans l'ordre."
        criteria: "start, action, décision complète, stop."
        hints:
          - "start en premier, stop en dernier."
          - "La décision s'ouvre avec if et se ferme avec endif."
          - "start, action, if, action, else, action, endif, stop."
        solution: |
          start
          :Saisir le code d'accès;
          if (Code valide ?) then (oui)
            :Ouvrir la porte;
          else (non)
            :Afficher « code invalide »;
          endif
          stop
        explanation: "Une décision complète a ses deux branches avant endif."
        xp: 10
        payload:
          language: text
          lines:
            - "start"
            - ":Saisir le code d'accès;"
            - "if (Code valide ?) then (oui)"
            - "  :Ouvrir la porte;"
            - "else (non)"
            - "  :Afficher « code invalide »;"
            - "endif"
            - "stop"
      - slug: uml-ex-activite
        kind: CODE_LIBRE
        title: "Une réservation avec deux décisions"
        difficulty: INTERMEDIAIRE
        skill: uml-architecture
        statement: |
          Écris le diagramme d'activité PlantUML d'une réservation :
          1. `start` ;
          2. `:Se connecter;` ;
          3. décision `if (Compte valide ?) then (oui)` : `:Choisir une salle;` puis une seconde décision
             `if (Salle libre ?)` avec `:Enregistrer la réservation;` (oui) ou `:Proposer une autre salle;` (non) ;
          4. sinon (compte invalide) : `:Afficher « compte invalide »;` ;
          5. `stop`.
        criteria: "start, stop, deux décisions imbriquées et les actions demandées."
        hints:
          - "Chaque action s'écrit `:texte;`."
          - "Une décision : `if (question) then (oui) ... else (non) ... endif`."
          - "La seconde décision se place dans la branche « oui » de la première."
        solution: |
          @startuml
          start
          :Se connecter;
          if (Compte valide ?) then (oui)
            :Choisir une salle;
            if (Salle libre ?) then (oui)
              :Enregistrer la réservation;
            else (non)
              :Proposer une autre salle;
            endif
          else (non)
            :Afficher « compte invalide »;
          endif
          stop
          @enduml
        explanation: "Deux décisions imbriquées : chaque if a son endif."
        xp: 20
        payload:
          language: text
          starter: |
            @startuml

            @enduml
          checks:
            - pattern: '(?m)^\s*start\s*$'
              message: "Commence par start."
            - pattern: '(?m)^\s*stop\s*$'
              message: "Termine par stop."
            - pattern: ':\s*Se connecter\s*;'
              message: "Action :Se connecter;"
            - pattern: 'if\s*\(\s*Compte valide\s*\?\s*\)\s*then'
              message: "Décision if (Compte valide ?) then (oui)."
            - pattern: 'if\s*\(\s*Salle libre\s*\?\s*\)\s*then'
              message: "Seconde décision if (Salle libre ?) then (oui)."
            - pattern: ':\s*Enregistrer la réservation\s*;'
              message: "Action :Enregistrer la réservation;"
            - pattern: ':\s*Proposer une autre salle\s*;'
              message: "Action :Proposer une autre salle;"
            - pattern: '\A(?>[\s\S]*?\bendif\b){2}'
              message: "Chaque décision se ferme par endif (deux au total)."
      - slug: uml-ex-decision-bug
        kind: CORRIGER_ERREUR
        title: "Une décision jamais refermée"
        difficulty: FACILE
        skill: uml-architecture
        statement: |
          La décision « Livre disponible ? » n'est jamais refermée. Ajoute le mot qui manque avant `stop`.
        criteria: "La décision se termine par endif."
        hints:
          - "Chaque if doit être refermé."
          - "Ce n'est pas `end` (réservé à la séquence)."
          - "Ajoute `endif` avant stop."
        solution: |
          start
          if (Livre disponible ?) then (oui)
            :Enregistrer l'emprunt;
          else (non)
            :Proposer une réservation;
          endif
          stop
        explanation: "if … else … endif, puis stop."
        xp: 10
        payload:
          language: text
          starter: |
            start
            if (Livre disponible ?) then (oui)
              :Enregistrer l'emprunt;
            else (non)
              :Proposer une réservation;
            stop
          checks:
            - pattern: '\bendif\b[\s\S]*\bstop\b'
              message: "Ajoute endif avant stop."

