slug: uml-sequence-activite
position: 3
level: AVANCE
title: "Séquences et activités"
summary: "Montrer l'ordre des échanges entre les composants avec le diagramme de séquence, puis un processus métier avec le diagramme d'activité. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: uml-sequence
    title: "Le diagramme de séquence : messages et réponses"
    duration: 11
    objective: "Dessiner une séquence simple : des participants, des appels (->) et des réponses (-->)."
    prerequisites: "Chapitre « Le diagramme de classes »."
    skills: [uml-architecture, full-stack]
    xp: 15
    memo: |
      - Le diagramme de séquence montre **qui parle à qui, dans quel ordre**, pour un scénario.
      - Les **participants** sont en colonnes ; le temps descend de haut en bas.
      - Appel : flèche pleine `->` ; réponse : flèche pointillée `-->`.
      - `database` dessine la base de données (un cylindre).
    commonMistakes: |
      - Oublier les réponses.
      - Mélanger plusieurs scénarios dans un seul diagramme.
      - Faire parler Angular directement à la base.
    blocks:
      - type: text
        md: |
          Le diagramme de classes montre la **structure** ; le diagramme de séquence montre le **déroulement**
          dans le temps. C'est le meilleur support pour raconter « ce qui se passe quand on clique ».
      - type: definition
        id: def-sequence
        term: "Diagramme de séquence"
        md: |
          Une **bande dessinée** d'un scénario : chaque participant a sa colonne, et les bulles (messages)
          s'enchaînent de haut en bas. On voit qui envoie quoi à qui, et qui répond.
      - type: code
        id: code-sequence
        language: text
        title: "Afficher la liste des livres, en PlantUML"
        code: |
          @startuml
          participant Angular
          participant LivreController
          participant LivreService
          database PostgreSQL

          Angular -> LivreController : GET /api/livres
          LivreController -> LivreService : listerLivres()
          LivreService -> PostgreSQL : SELECT * FROM livres
          PostgreSQL --> LivreService : lignes
          LivreService --> LivreController : liste de livres
          LivreController --> Angular : 200 + liste
          @enduml
        lines:
          - n: 2
            note: "Les participants, de gauche à droite dans l'ordre du voyage."
          - n: 5
            note: "`database` dessine un cylindre : la base de données."
          - n: 7
            note: "Flèche pleine `->` : un appel."
          - n: 10
            note: "Flèche pointillée `-->` : une réponse, qui remonte."
      - type: question
        ref: uml-seq-q1
        review: def-sequence
      - type: question
        ref: uml-seq-q2
        review: code-sequence
      - type: text
        md: "**Exercice 1 (guidé)** : complète les flèches."
      - type: exercise
        ref: uml-ex-sequence-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : afficher le détail d'un livre."
      - type: exercise
        ref: uml-ex-sequence-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une réponse dessinée comme un appel."
      - type: exercise
        ref: uml-ex-sequence-bug
      - type: quiz
        items:
          - ref: uml-seq-q4
            review: def-sequence
          - ref: uml-seq-q5
            review: code-sequence
          - ref: uml-sq-q5
            review: code-sequence
    questions:
      - code: uml-seq-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: uml-architecture
        prompt: "Dans un diagramme de séquence, dans quel sens s'écoule le temps ?"
        choices:
          - label: "De haut en bas"
            correct: true
            why: "Les messages s'enchaînent vers le bas."
          - label: "De droite à gauche"
            correct: false
            why: "Les colonnes sont les participants."
          - label: "Il n'y a pas de temps"
            correct: false
            why: "C'est justement un diagramme temporel."
        explanation: "Colonnes = participants ; vers le bas = temps."
      - code: uml-seq-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: uml-architecture
        prompt: "Que représente `-->` en PlantUML de séquence ?"
        choices:
          - label: "Une réponse (flèche pointillée)"
            correct: true
            why: "Retour d'un appel."
          - label: "Un héritage"
            correct: false
            why: "C'est le diagramme de classes (<|--)."
          - label: "Un appel"
            correct: false
            why: "L'appel est `->`."
        explanation: "`->` appel, `-->` réponse."
      - code: uml-seq-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: uml-architecture
        prompt: "Un diagramme de séquence décrit un seul scénario à la fois."
        choices:
          - label: "Vrai"
            correct: true
            why: "On fait un diagramme par scénario important."
          - label: "Faux"
            correct: false
            why: "Mélanger les scénarios le rend illisible."
        explanation: "Un scénario, un diagramme."
      - code: uml-seq-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: full-stack
        prompt: "Dans la séquence des livres, qui interroge la base de données ?"
        choices:
          - label: "LivreService"
            correct: true
            why: "Le contrôleur délègue au service."
          - label: "Angular"
            correct: false
            why: "Le navigateur ne parle jamais à la base."
          - label: "LivreController directement"
            correct: false
            why: "Le contrôleur ne touche pas la base."
        explanation: "Architecture en couches : contrôleur → service → base."
      - code: uml-sq-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: uml-architecture
        prompt: "Quel mot PlantUML dessine la base de données en cylindre ?"
        choices:
          - label: "`database`"
            correct: true
            why: "Le mot anglais pour base de données."
          - label: "`actor`"
            correct: false
            why: "Il dessine un bonhomme."
          - label: "`class`"
            correct: false
            why: "C'est pour le diagramme de classes."
        explanation: "`participant` pour un composant, `database` pour la base, `actor` pour une personne."
    exercises:
      - slug: uml-ex-sequence-guide
        kind: COMPLETER
        title: "Compléter les flèches"
        difficulty: FACILE
        skill: uml-architecture
        statement: "Complète avec `->` (appel) ou `-->` (réponse)."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Angular demande quelque chose : c'est un appel."
          - "Ce qui remonte vers celui qui a demandé est une réponse."
          - "->, -->, -->."
        solution: '["->", "-->", "-->"]'
        explanation: "Appel en trait plein, réponses en pointillés."
        xp: 10
        payload:
          language: text
          template: |
            Angular [[1]] SalleController : GET /api/salles
            SalleController -> SalleService : listerSalles()
            SalleService [[2]] SalleController : liste de salles
            SalleController [[3]] Angular : 200 + liste
          blanks:
            - ["->"]
            - ["-->"]
            - ["-->"]
      - slug: uml-ex-sequence-libre
        kind: CODE_LIBRE
        title: "Afficher le détail d'un livre"
        difficulty: FACILE
        skill: uml-architecture
        statement: |
          Écris la séquence PlantUML avec `participant Angular`, `participant LivreController`,
          `participant LivreService` :
          1. Angular appelle `GET /api/livres/1` sur le contrôleur ;
          2. le contrôleur appelle `trouverLivre(1)` sur le service ;
          3. le service répond `livre` au contrôleur ;
          4. le contrôleur répond `200 + livre` à Angular.
        criteria: "Trois participants, deux appels (->) et deux réponses (-->)."
        hints:
          - "Déclare d'abord les trois participants."
          - "Les appels : `Angular -> LivreController : GET /api/livres/1`."
          - "Les réponses remontent : `LivreService --> LivreController : livre`."
        solution: |
          @startuml
          participant Angular
          participant LivreController
          participant LivreService
          Angular -> LivreController : GET /api/livres/1
          LivreController -> LivreService : trouverLivre(1)
          LivreService --> LivreController : livre
          LivreController --> Angular : 200 + livre
          @enduml
        explanation: "Deux appels qui descendent, deux réponses qui remontent."
        xp: 15
        payload:
          language: text
          starter: |
            @startuml

            @enduml
          checks:
            - pattern: 'participant\s+Angular'
              message: "Déclare participant Angular."
            - pattern: 'participant\s+LivreController'
              message: "Déclare participant LivreController."
            - pattern: 'participant\s+LivreService'
              message: "Déclare participant LivreService."
            - pattern: 'Angular\s*->\s*LivreController\s*:\s*GET\s+/api/livres/1'
              message: "Angular -> LivreController : GET /api/livres/1"
            - pattern: 'LivreController\s*->\s*LivreService\s*:'
              message: "LivreController -> LivreService : trouverLivre(1)"
            - pattern: 'LivreService\s*-->\s*LivreController\s*:'
              message: "La réponse du service : LivreService --> LivreController : livre"
            - pattern: 'LivreController\s*-->\s*Angular\s*:'
              message: "La réponse du contrôleur : LivreController --> Angular : 200 + livre"
      - slug: uml-ex-sequence-bug
        kind: CORRIGER_ERREUR
        title: "Une réponse dessinée comme un appel"
        difficulty: FACILE
        skill: uml-architecture
        statement: |
          La base renvoie les lignes au service, mais la flèche est pleine (`->`) : on dirait que la base appelle
          le service. Corrige-la en réponse.
        criteria: "PostgreSQL --> SalleService."
        hints:
          - "Ce qui remonte est une réponse."
          - "Une réponse est en pointillés."
          - "`PostgreSQL --> SalleService : lignes`"
        solution: |
          SalleService -> PostgreSQL : SELECT * FROM salles
          PostgreSQL --> SalleService : lignes
        explanation: "La base ne prend jamais l'initiative : elle répond."
        xp: 10
        payload:
          language: text
          starter: |
            SalleService -> PostgreSQL : SELECT * FROM salles
            PostgreSQL -> SalleService : lignes
          checks:
            - pattern: 'PostgreSQL\s*->\s*SalleService'
              absent: true
              message: "La base répond : utilise une flèche pointillée."
            - pattern: 'PostgreSQL\s*-->\s*SalleService'
              message: "Écris PostgreSQL --> SalleService : lignes."

  # ===================================================================== LEÇON 2
  - slug: uml-sequence-alt
    title: "Deux chemins possibles : le bloc alt"
    duration: 11
    objective: "Montrer un succès et une erreur dans une même séquence avec alt, else et end."
    prerequisites: "Leçon « Le diagramme de séquence : messages et réponses »."
    skills: [uml-architecture, full-stack]
    xp: 15
    memo: |
      - `alt condition` ouvre le premier chemin ; `else autre cas` ouvre le second ; `end` ferme le bloc.
      - C'est l'équivalent du `if / else` dans un diagramme de séquence.
      - On s'en sert pour montrer le **succès** et l'**erreur** (200 ou 401, 201 ou 409).
    commonMistakes: |
      - Oublier le `end`.
      - Oublier le cas d'erreur : le diagramme ne montre que le chemin heureux.
    blocks:
      - type: text
        md: |
          Une connexion peut réussir… ou échouer. Plutôt que deux diagrammes, on montre les **deux chemins**
          dans le même, avec un bloc `alt`.
      - type: definition
        id: def-alt
        term: "Bloc alt"
        md: |
          Un **aiguillage de train** : selon la condition, le scénario part sur une voie (`alt`) ou sur l'autre
          (`else`). `end` marque l'endroit où les voies se rejoignent.
      - type: code
        id: code-alt
        language: text
        title: "La connexion, avec succès et échec"
        code: |
          @startuml
          participant Angular
          participant AuthController
          participant AuthService

          Angular -> AuthController : POST /api/auth/login
          AuthController -> AuthService : login(requete)
          alt mot de passe correct
            AuthService --> AuthController : jeton JWT
            AuthController --> Angular : 200 + jeton
          else mot de passe incorrect
            AuthService --> AuthController : erreur
            AuthController --> Angular : 401
          end
          @enduml
        lines:
          - n: 8
            note: "`alt` : le premier chemin, avec sa condition."
          - n: 11
            note: "`else` : l'autre chemin."
          - n: 14
            note: "`end` ferme le bloc."
      - type: question
        ref: uml-seq-q3
        review: def-alt
      - type: question
        ref: uml-alt-q2
        review: code-alt
      - type: text
        md: "**Exercice 1 (guidé)** : complète le bloc."
      - type: exercise
        ref: uml-ex-sequence-alt-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : la séquence de l'inscription."
      - type: exercise
        ref: uml-ex-sequence
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un bloc jamais fermé."
      - type: exercise
        ref: uml-ex-sequence-alt-bug
      - type: jury
        items:
          - q: "Expliquez-nous un diagramme de séquence de votre application."
            a: "Je montre par exemple la connexion : Angular appelle le contrôleur, qui délègue au service ; selon le mot de passe, le service renvoie un jeton ou une erreur, et le contrôleur répond 200 ou 401. Chaque colonne correspond à une vraie classe de mon code."
      - type: quiz
        items:
          - ref: uml-alt-q3
            review: code-alt
          - ref: uml-alt-q4
            review: def-alt
          - ref: uml-c3-b1
            review: def-alt
    questions:
      - code: uml-seq-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: uml-architecture
        prompt: "À quoi sert le bloc `alt ... else ... end` ?"
        choices:
          - label: "À montrer deux chemins possibles selon une condition"
            correct: true
            why: "Succès ou erreur."
          - label: "À répéter des messages"
            correct: false
            why: "La répétition, c'est `loop`."
          - label: "À commenter le diagramme"
            correct: false
            why: "Un commentaire, c'est `note`."
        explanation: "alt = alternative (if/else)."
      - code: uml-alt-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: full-stack
        prompt: "Dans l'exemple, que reçoit Angular si le mot de passe est incorrect ?"
        choices:
          - label: "401"
            correct: true
            why: "C'est le chemin `else`."
          - label: "200 + jeton"
            correct: false
            why: "C'est le chemin du succès."
          - label: "Rien du tout"
            correct: false
            why: "Le contrôleur répond toujours."
        explanation: "Chaque chemin a sa propre réponse."
      - code: uml-alt-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: uml-architecture
        prompt: "Quel mot ferme un bloc `alt` ?"
        choices:
          - label: "`end`"
            correct: true
            why: "Il marque la fin de l'alternative."
          - label: "`endif`"
            correct: false
            why: "C'est pour le diagramme d'activité."
          - label: "`stop`"
            correct: false
            why: "C'est la fin d'un diagramme d'activité."
        explanation: "alt … else … end."
      - code: uml-alt-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: uml-architecture
        prompt: "Un bon diagramme de séquence montre aussi le cas d'erreur, pas seulement le succès."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le jury veut voir que les erreurs sont prévues."
          - label: "Faux"
            correct: false
            why: "Oublier l'erreur donne une vision incomplète."
        explanation: "alt pour le succès, else pour l'erreur."
      - code: uml-c3-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: uml-architecture
        prompt: "Quel bloc PlantUML représente une répétition dans un diagramme de séquence ?"
        choices:
          - label: "`loop ... end`"
            correct: true
            why: "Répétition."
          - label: "`alt ... end`"
            correct: false
            why: "Alternative."
          - label: "`note ... end note`"
            correct: false
            why: "Commentaire."
        explanation: "loop pour répéter, alt pour choisir, opt pour une partie facultative."
    exercises:
      - slug: uml-ex-sequence-alt-guide
        kind: COMPLETER
        title: "Compléter le bloc alt"
        difficulty: FACILE
        skill: uml-architecture
        statement: "Complète les trois mots du bloc."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot qui ouvre le bloc."
          - "Le mot qui ouvre l'autre chemin, puis celui qui ferme."
          - "alt, else, end."
        solution: '["alt", "else", "end"]'
        explanation: "alt ouvre, else sépare, end ferme."
        xp: 10
        payload:
          language: text
          template: |
            Angular -> SalleController : GET /api/salles/3
            [[1]] salle trouvée
              SalleController --> Angular : 200 + salle
            [[2]] salle inconnue
              SalleController --> Angular : 404
            [[3]]
          blanks:
            - ["alt"]
            - ["else"]
            - ["end"]
      - slug: uml-ex-sequence
        kind: CODE_LIBRE
        title: "La séquence de l'inscription"
        difficulty: INTERMEDIAIRE
        skill: uml-architecture
        statement: |
          Écris en PlantUML la séquence de l'inscription avec les participants `Angular`, `AuthController`,
          `AuthService` et `database PostgreSQL` :
          1. Angular appelle `POST /api/auth/register` ;
          2. le contrôleur appelle `register(requete)` du service ;
          3. le service vérifie l'e-mail dans la base ;
          4. un bloc `alt` : si l'e-mail est libre, le service enregistre (INSERT) et le contrôleur répond `201` ;
             sinon, le contrôleur répond `409`.
        criteria: "Quatre participants, les appels dans l'ordre, un alt avec 201 et 409."
        hints:
          - "`participant Angular`, `participant AuthController`, `participant AuthService`, `database PostgreSQL`."
          - "`Angular -> AuthController : POST /api/auth/register`"
          - "`alt e-mail libre ... AuthController --> Angular : 201 ... else e-mail déjà utilisé ... AuthController --> Angular : 409 ... end`"
        solution: |
          @startuml
          participant Angular
          participant AuthController
          participant AuthService
          database PostgreSQL
          Angular -> AuthController : POST /api/auth/register
          AuthController -> AuthService : register(requete)
          AuthService -> PostgreSQL : SELECT ... WHERE email = ?
          PostgreSQL --> AuthService : résultat
          alt e-mail libre
            AuthService -> PostgreSQL : INSERT INTO users
            AuthService --> AuthController : compte créé
            AuthController --> Angular : 201
          else e-mail déjà utilisé
            AuthService --> AuthController : DuplicateResourceException
            AuthController --> Angular : 409
          end
          @enduml
        explanation: "Le diagramme reprend l'architecture en couches et les deux issues prévues dans la fiche de cas."
        xp: 25
        payload:
          language: text
          starter: |
            @startuml

            @enduml
          checks:
            - pattern: 'participant\s+Angular'
              message: "Déclare participant Angular."
            - pattern: 'participant\s+AuthController'
              message: "Déclare participant AuthController."
            - pattern: 'participant\s+AuthService'
              message: "Déclare participant AuthService."
            - pattern: 'database\s+PostgreSQL'
              message: "Déclare database PostgreSQL."
            - pattern: 'Angular\s*->\s*AuthController\s*:\s*POST\s+/api/auth/register'
              message: "Angular -> AuthController : POST /api/auth/register"
            - pattern: 'AuthController\s*->\s*AuthService\s*:'
              message: "Le contrôleur appelle le service : AuthController -> AuthService : register(requete)."
            - pattern: 'AuthService\s*->\s*PostgreSQL\s*:'
              message: "Le service interroge la base : AuthService -> PostgreSQL : ..."
            - pattern: '\balt\b[\s\S]*-->\s*Angular\s*:\s*201[\s\S]*\belse\b[\s\S]*-->\s*Angular\s*:\s*409[\s\S]*\bend\b'
              message: "Ajoute un bloc alt : 201 si l'e-mail est libre, else 409, puis end."
      - slug: uml-ex-sequence-alt-bug
        kind: CORRIGER_ERREUR
        title: "Un bloc jamais fermé"
        difficulty: FACILE
        skill: uml-architecture
        statement: |
          Ce bloc `alt` n'est jamais fermé : PlantUML refuse de dessiner le diagramme. Ajoute la ligne qui manque
          à la fin.
        criteria: "Le bloc se termine par end."
        hints:
          - "Chaque alt doit être fermé."
          - "Le mot de fermeture tient en trois lettres."
          - "Ajoute `end` sur la dernière ligne."
        solution: |
          alt livre disponible
            LivreController --> Angular : 200
          else livre déjà emprunté
            LivreController --> Angular : 409
          end
        explanation: "alt … else … end : sans end, le bloc reste ouvert."
        xp: 10
        payload:
          language: text
          starter: |
            alt livre disponible
              LivreController --> Angular : 200
            else livre déjà emprunté
              LivreController --> Angular : 409
          checks:
            - pattern: '(?m)^\s*end\s*$'
              message: "Ferme le bloc avec end."

  # ===================================================================== LEÇON 3
  - slug: uml-activite
    title: "Le diagramme d'activité : début, actions, fin"
    duration: 9
    objective: "Décrire un processus simple avec start, des actions et stop."
    prerequisites: "Leçon « Deux chemins possibles : le bloc alt »."
    skills: [uml-architecture]
    xp: 15
    memo: |
      - Le diagramme d'activité décrit un **processus** : une suite d'étapes, comme un organigramme.
      - `start` : le point de départ ; `stop` : la fin.
      - Une action s'écrit entre deux-points et point-virgule : `:Choisir une salle;`.
      - Il est compréhensible par le client : idéal pour valider une règle métier.
    commonMistakes: |
      - Oublier le point-virgule à la fin d'une action.
      - Mettre des détails techniques (requêtes SQL) dans un processus métier.
      - Plusieurs points de départ.
    blocks:
      - type: text
        md: |
          Pour expliquer **un processus** à un client (« comment se passe une réservation ? »), rien ne vaut un
          **organigramme** : c'est le diagramme d'activité.
      - type: definition
        id: def-activite
        term: "Diagramme d'activité"
        md: |
          Une **recette de cuisine** dessinée : un début, des étapes les unes après les autres, et une fin.
          Chaque étape est une **action**.
      - type: code
        id: code-activite
        language: text
        title: "Réserver une salle (sans décision)"
        code: |
          @startuml
          start
          :Choisir une salle;
          :Choisir une date;
          :Enregistrer la réservation;
          :Envoyer la confirmation;
          stop
          @enduml
        lines:
          - n: 2
            note: "`start` : le point de départ (disque noir)."
          - n: 3
            note: "Une action, entre deux-points et point-virgule."
          - n: 7
            note: "`stop` : la fin du processus."
      - type: question
        ref: uml-act-q1
        review: def-activite
      - type: question
        ref: uml-act-q3
        review: code-activite
      - type: text
        md: "**Exercice 1 (guidé)** : remets le processus dans l'ordre."
      - type: exercise
        ref: uml-ex-activite-simple-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : emprunter un livre."
      - type: exercise
        ref: uml-ex-activite-simple
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un point-virgule oublié."
      - type: exercise
        ref: uml-ex-activite-simple-bug
      - type: quiz
        items:
          - ref: uml-act-q4
            review: def-activite
          - ref: uml-ac-q4
