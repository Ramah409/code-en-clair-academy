slug: sec-bases
position: 1
level: DEBUTANT
title: "Les bases de la sécurité"
summary: "Les trois objectifs de la sécurité, le moindre privilège, la défense en profondeur, le hachage des mots de passe et une connexion qui ne révèle rien. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: sec-principes
    title: "Les trois objectifs : confidentialité, intégrité, disponibilité"
    duration: 9
    objective: "Reconnaître quel objectif de sécurité est touché dans une situation donnée."
    prerequisites: "Parcours « Spring Boot » (chapitre 1)."
    skills: [securite-owasp]
    xp: 15
    memo: |
      - **Confidentialité** : seules les bonnes personnes lisent les données (HTTPS chiffre les échanges).
      - **Intégrité** : les données ne sont pas modifiées en cachette.
      - **Disponibilité** : le service reste accessible.
    commonMistakes: |
      - Penser que la sécurité ne concerne que la confidentialité.
      - Oublier la disponibilité (une application saturée ne sert plus à rien).
    blocks:
      - type: text
        md: |
          La sécurité n'est pas un bouton qu'on active à la fin. C'est une **habitude** prise à chaque ligne de
          code. Tout commence par trois objectifs.
      - type: definition
        id: def-cia
        term: "Confidentialité, intégrité, disponibilité"
        md: |
          Pense à une **lettre** : la **confidentialité**, c'est que personne d'autre ne la lise ; l'**intégrité**,
          que personne ne change son contenu en route ; la **disponibilité**, qu'elle arrive bien, au bon moment.
      - type: compare
        left:
          title: "HTTP (en clair)"
          code: |
            Mot de passe lisible sur le Wi-Fi public
          language: text
        right:
          title: "HTTPS (chiffré)"
          code: |
            Contenu illisible pour un espion
          language: text
      - type: question
        ref: sec-pr-q1
        review: def-cia
      - type: question
        ref: sec-pr-q4
        review: def-cia
      - type: text
        md: "**Exercice 1 (guidé)** : un objectif par situation."
      - type: exercise
        ref: sec-ex-principes-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : classer des incidents."
      - type: exercise
        ref: sec-ex-cia-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un objectif mal attribué."
      - type: exercise
        ref: sec-ex-cia-bug
      - type: jury
        items:
          - q: "Pourquoi HTTPS est-il indispensable ?"
            a: "Il chiffre les échanges : sans lui, le mot de passe et le jeton JWT circulent en clair et peuvent être interceptés sur un Wi-Fi public. Il garantit aussi qu'on parle bien au bon serveur grâce au certificat."
      - type: quiz
        items:
          - ref: sec-ci-q3
            review: def-cia
          - ref: sec-ci-q4
            review: def-cia
          - ref: sec-c1-b1
            review: def-cia
    questions:
      - code: sec-pr-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Un pirate change la date d'un rendez-vous pendant son envoi. Quel objectif est touché ?"
        choices:
          - label: "L'intégrité"
            correct: true
            why: "Les données ont été modifiées."
          - label: "La disponibilité"
            correct: false
            why: "Le service fonctionne toujours."
          - label: "La confidentialité"
            correct: false
            why: "Le problème n'est pas la lecture."
        explanation: "Intégrité = les données restent exactes."
      - code: sec-pr-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Un site est saturé de fausses requêtes et plus personne ne peut s'y connecter. Quel objectif est touché ?"
        choices:
          - label: "La disponibilité"
            correct: true
            why: "Le service n'est plus accessible."
          - label: "L'intégrité"
            correct: false
            why: "Rien n'a été modifié."
          - label: "La confidentialité"
            correct: false
            why: "Rien n'a été lu."
        explanation: "C'est une attaque par déni de service."
      - code: sec-ci-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Quel objectif HTTPS protège-t-il d'abord ?"
        choices:
          - label: "La confidentialité"
            correct: true
            why: "Il chiffre les échanges."
          - label: "La disponibilité"
            correct: false
            why: "Il ne rend pas le serveur plus accessible."
          - label: "Aucun"
            correct: false
            why: "Il est indispensable."
        explanation: "Chiffrer = empêcher de lire."
      - code: sec-ci-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: securite-owasp
        prompt: "Lire les messages d'une autre utilisatrice touche la confidentialité."
        choices:
          - label: "Vrai"
            correct: true
            why: "Quelqu'un lit ce qu'il ne devrait pas."
          - label: "Faux"
            correct: false
            why: "C'est exactement la confidentialité."
        explanation: "Lire sans droit = confidentialité."
      - code: sec-c1-b1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Qu'est-ce que l'OWASP ?"
        choices:
          - label: "Une fondation qui publie notamment le Top 10 des risques de sécurité web"
            correct: true
            why: "La référence du domaine."
          - label: "Un antivirus"
            correct: false
            why: "Ce n'est pas un logiciel."
          - label: "Un langage de programmation"
            correct: false
            why: "C'est une communauté."
        explanation: "Open Worldwide Application Security Project."
    exercises:
      - slug: sec-ex-principes-guide
        kind: COMPLETER
        title: "Un objectif par situation"
        difficulty: FACILE
        skill: securite-owasp
        statement: "Complète avec : confidentialité, intégrité, disponibilité."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Lire des données interdites touche la confidentialité."
          - "Modifier en cachette : intégrité ; ne plus pouvoir accéder : disponibilité."
          - "confidentialité, intégrité, disponibilité."
        solution: '["confidentialité", "intégrité", "disponibilité"]'
        explanation: "Lire, modifier, accéder."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Un utilisateur lit les commandes d'un autre      : atteinte à la [[1]]
            Un rôle est changé dans la requête               : atteinte à l'[[2]]
            Le serveur tombe pendant les inscriptions        : atteinte à la [[3]]
          blanks:
            - ["confidentialité", "confidentialite"]
            - ["intégrité", "integrite"]
            - ["disponibilité", "disponibilite"]
      - slug: sec-ex-cia-libre
        kind: CODE_LIBRE
        title: "Classer des incidents"
        difficulty: FACILE
        skill: securite-owasp
        statement: |
          Écris l'objectif touché pour chaque incident, une ligne par lettre (`a : …`) :
          - `a` : un espion lit un mot de passe envoyé en HTTP ;
          - `b` : le titre d'un livre est modifié par quelqu'un sans droit ;
          - `c` : l'application est inaccessible pendant une journée.
        criteria: "a : confidentialité, b : intégrité, c : disponibilité."
        hints:
          - "Lire → confidentialité."
          - "Modifier → intégrité."
          - "Ne plus accéder → disponibilité."
        solution: |
          a : confidentialité
          b : intégrité
          c : disponibilité
        explanation: "Chaque incident touche un objectif précis."
        xp: 15
        payload:
          language: text
          starter: |
            a :
            b :
            c :
          checks:
            - pattern: '(?mi)^\s*a\s*:\s*confidentialit[ée]'
              message: "a : l'espion lit une donnée."
            - pattern: '(?mi)^\s*b\s*:\s*int[ée]grit[ée]'
              message: "b : la donnée est modifiée."
            - pattern: '(?mi)^\s*c\s*:\s*disponibilit[ée]'
              message: "c : le service n'est plus accessible."
      - slug: sec-ex-cia-bug
        kind: CORRIGER_ERREUR
        title: "Un objectif mal attribué"
        difficulty: FACILE
        skill: securite-owasp
        statement: |
          « Un pirate modifie le rôle d'un compte » a été classé en confidentialité. Corrige l'objectif.
        criteria: "intégrité."
        hints:
          - "Le pirate lit-il ou modifie-t-il ?"
          - "Il modifie."
          - "Objectif : intégrité."
        solution: |
          Un pirate modifie le rôle d'un compte : intégrité
        explanation: "Modifier = intégrité."
        xp: 10
        payload:
          language: text
          starter: |
            Un pirate modifie le rôle d'un compte : confidentialité
          checks:
            - pattern: '(?i)confidentialit'
              absent: true
              message: "Le pirate ne lit pas : il modifie."
            - pattern: '(?i):\s*int[ée]grit[ée]'
              message: "Écris : intégrité."

  # ===================================================================== LEÇON 2
  - slug: sec-moindre-privilege
    title: "Le moindre privilège"
    duration: 9
    objective: "Donner à chaque utilisateur et à chaque compte technique seulement les droits nécessaires."
    prerequisites: "Leçon « Les trois objectifs »."
    skills: [securite-owasp]
    xp: 15
    memo: |
      - **Moindre privilège** : chacun n'a que les droits dont il a **vraiment** besoin.
      - Les utilisateurs : rôle USER par défaut, ADMIN seulement pour qui administre.
      - L'application : un compte PostgreSQL **dédié**, sans droit de supprimer des tables.
    commonMistakes: |
      - Donner le rôle administrateur « pour simplifier ».
      - Utiliser le compte superutilisateur de PostgreSQL pour l'application.
    blocks:
      - type: definition
        id: def-moindre-privilege
        term: "Moindre privilège"
        md: |
          Le **trousseau de clés** d'un employé : l'agent d'entretien a la clé du local ménage, pas celle du
          coffre. Si sa clé est volée, les dégâts restent limités.
      - type: code
        id: code-privilege
        language: sql
        title: "Un compte PostgreSQL dédié à l'application"
        code: |
          CREATE ROLE appli LOGIN PASSWORD '...';
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO appli;
          -- pas de DROP, pas de CREATE, pas de superutilisateur
        lines:
          - n: 1
            note: "Un compte réservé à l'application."
          - n: 2
            note: "Seulement les droits dont elle a besoin pour travailler."
      - type: question
        ref: sec-pr-q3
        review: def-moindre-privilege
      - type: question
        ref: sec-mp-q2
        review: code-privilege
      - type: text
        md: "**Exercice 1 (guidé)** : le bon niveau de droits."
      - type: exercise
        ref: sec-ex-privilege-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : les rôles d'une bibliothèque."
      - type: exercise
        ref: sec-ex-privilege-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un superutilisateur de trop."
      - type: exercise
        ref: sec-ex-privilege-bug
      - type: quiz
        items:
          - ref: sec-mp-q3
            review: def-moindre-privilege
          - ref: sec-mp-q4
            review: def-moindre-privilege
          - ref: sec-mp-q5
            review: code-privilege
    questions:
      - code: sec-pr-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quel compte l'application Spring Boot doit-elle utiliser pour se connecter à PostgreSQL ?"
        choices:
          - label: "Un compte dédié avec seulement les droits nécessaires"
            correct: true
            why: "Moindre privilège."
          - label: "Le superutilisateur postgres"
            correct: false
            why: "Une faille donnerait tous les pouvoirs."
          - label: "Le compte personnel du développeur"
            correct: false
            why: "Droits inadaptés et traçabilité perdue."
        explanation: "Si le compte est compromis, les dégâts restent limités."
      - code: sec-mp-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Quel droit le compte de l'application n'a-t-il pas besoin d'avoir ?"
        choices:
          - label: "Supprimer des tables (DROP)"
            correct: true
            why: "L'application lit et écrit des lignes, elle ne détruit pas la structure."
          - label: "Lire des lignes (SELECT)"
            correct: false
            why: "Elle en a besoin."
          - label: "Ajouter des lignes (INSERT)"
            correct: false
            why: "Elle en a besoin."
        explanation: "Seulement ce qui sert."
      - code: sec-mp-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: securite-owasp
        prompt: "Donner le rôle ADMIN à tous les comptes simplifie le développement sans risque."
        choices:
          - label: "Vrai"
            correct: false
            why: "Un compte volé aurait tous les pouvoirs."
          - label: "Faux"
            correct: true
            why: "Chacun reçoit seulement ce dont il a besoin."
        explanation: "Moindre privilège."
      - code: sec-mp-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Pourquoi appliquer le moindre privilège ?"
        choices:
          - label: "Pour limiter les dégâts si un compte est compromis"
            correct: true
            why: "La clé volée n'ouvre que peu de portes."
          - label: "Pour accélérer l'application"
            correct: false
            why: "Ce n'est pas le but."
          - label: "Pour éviter d'écrire des tests"
            correct: false
            why: "Aucun rapport."
        explanation: "Moins de droits = moins de risques."
      - code: sec-mp-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quel rôle donner par défaut à une nouvelle inscrite ?"
        choices:
          - label: "USER"
            correct: true
            why: "Le minimum utile."
          - label: "ADMIN"
            correct: false
            why: "Beaucoup trop de droits."
          - label: "Aucun rôle, mais accès à tout"
            correct: false
            why: "C'est l'inverse du principe."
        explanation: "Le rôle ADMIN se donne à la main, à peu de personnes."
    exercises:
      - slug: sec-ex-privilege-guide
        kind: COMPLETER
        title: "Le bon niveau de droits"
        difficulty: FACILE
        skill: securite-owasp
        statement: "Complète avec USER, ADMIN ou appli."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une adhérente emprunte des livres : USER."
          - "La bibliothécaire gère le catalogue : ADMIN."
          - "USER, ADMIN, appli."
        solution: '["USER", "ADMIN", "appli"]'
        explanation: "Chacun ses droits."
        xp: 10
        payload:
          language: text
          template: |
            Une adhérente qui emprunte des livres : rôle [[1]]
            La bibliothécaire qui gère le catalogue : rôle [[2]]
            Spring Boot se connecte à PostgreSQL avec le compte [[3]]
          blanks:
            - ["USER"]
            - ["ADMIN"]
            - ["appli"]
      - slug: sec-ex-privilege-libre
        kind: CODE_LIBRE
        title: "Les rôles d'une bibliothèque"
        difficulty: FACILE
        skill: securite-owasp
        statement: |
          Écris le rôle nécessaire pour chaque action, une ligne par action, sous la forme `action : RÔLE` :
          - `emprunter` ;
          - `supprimer un livre` ;
          - `voir ses emprunts`.
        criteria: "emprunter : USER, supprimer un livre : ADMIN, voir ses emprunts : USER."
        hints:
          - "Une adhérente emprunte et voit ses emprunts."
          - "Seule l'administration supprime."
          - "USER, ADMIN, USER."
        solution: |
          emprunter : USER
          supprimer un livre : ADMIN
          voir ses emprunts : USER
        explanation: "Le rôle minimum pour chaque action."
        xp: 15
        payload:
          language: text
          starter: |
            emprunter :
            supprimer un livre :
            voir ses emprunts :
          checks:
            - pattern: '(?mi)^\s*emprunter\s*:\s*USER\s*$'
              message: "emprunter : une adhérente suffit."
            - pattern: '(?mi)^\s*supprimer un livre\s*:\s*ADMIN\s*$'
              message: "supprimer un livre : réservé à l'administration."
            - pattern: '(?mi)^\s*voir ses emprunts\s*:\s*USER\s*$'
              message: "voir ses emprunts : une adhérente suffit."
      - slug: sec-ex-privilege-bug
        kind: CORRIGER_ERREUR
        title: "Un superutilisateur de trop"
        difficulty: FACILE
        skill: securite-owasp
        statement: |
          L'application se connecte avec le superutilisateur `postgres`. Remplace-le par le compte dédié `appli`.
        criteria: "username: appli."
        hints:
          - "Le superutilisateur a tous les pouvoirs."
          - "L'application a son propre compte."
          - "`username: appli`"
        solution: |
          spring:
            datasource:
              username: appli
              password: ${DB_PASSWORD}
        explanation: "Un compte dédié, aux droits limités."
        xp: 10
        payload:
          language: yaml
          starter: |
            spring:
              datasource:
                username: postgres
                password: ${DB_PASSWORD}
          checks:
            - pattern: 'username\s*:\s*postgres'
              absent: true
              message: "Pas de superutilisateur."
            - pattern: 'username\s*:\s*appli\b'
              message: "Écris username: appli."

  # ===================================================================== LEÇON 3
  - slug: sec-defense-profondeur
    title: "La défense en profondeur"
    duration: 10
    objective: "Empiler plusieurs barrières indépendantes et ne jamais faire confiance au client."
    prerequisites: "Leçon « Le moindre privilège »."
    skills: [securite-owasp]
    xp: 15
    memo: |
      - **Défense en profondeur** : plusieurs protections empilées ; si l'une cède, les autres tiennent.
      - Règle d'or : **ne jamais faire confiance** à ce qui vient du client (le frontend peut être contourné).
      - Exemple : validation Angular, **puis** validation Spring, **puis** contraintes en base.
    commonMistakes: |
      - Compter uniquement sur le frontend pour protéger les données.
      - Penser qu'une seule protection suffit.
    blocks:
      - type: definition
        id: def-defense-profondeur
        term: "Défense en profondeur"
        md: |
          Un **château fort** : des douves, puis un rempart, puis une porte, puis des gardes. Une application,
          c'est pareil : validation Angular, **puis** validation Spring, **puis** contraintes en base, **puis**
          droits limités du compte PostgreSQL.
      - type: compare
        left:
          title: "Une seule barrière"
          code: |
            Angular cache le bouton « Supprimer »
            → l'API supprime pour n'importe qui
          language: text
        right:
          title: "Plusieurs barrières"
          code: |
            Angular cache le bouton
            + l'API vérifie le rôle ADMIN
            + l'API vérifie que la ressource existe
            + le compte BDD n'a pas DROP TABLE
          language: text
      - type: question
        ref: sec-pr-q2
        review: def-defense-profondeur
      - type: question
        ref: sec-pr-q5
        review: def-defense-profondeur
      - type: text
        md: "**Exercice 1 (guidé)** : les couches d'une validation."
      - type: exercise
        ref: sec-ex-defense-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : les barrières de ton application."
      - type: exercise
        ref: sec-ex-barrieres
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une confiance aveugle."
      - type: exercise
        ref: sec-ex-defense-bug
      - type: jury
        items:
          - q: "Quels principes de sécurité avez-vous appliqués ?"
            a: "Le moindre privilège (rôles USER et ADMIN, compte PostgreSQL applicatif sans droits d'administration), la défense en profondeur (validation Angular, validation Spring, contraintes SQL), et le principe de ne jamais faire confiance au client : chaque requête est authentifiée et autorisée côté API."
      - type: quiz
        items:
          - ref: sec-dp-q3
            review: def-defense-profondeur
          - ref: sec-dp-q4
            review: def-defense-profondeur
          - ref: sec-dp-q5
            review: def-defense-profondeur
    questions:
      - code: sec-pr-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: securite-owasp
        prompt: "Cacher le bouton « Supprimer » dans Angular suffit à empêcher les suppressions non autorisées."
        choices:
          - label: "Vrai"
            correct: false
            why: "On peut appeler l'API directement (Postman, curl)."
          - label: "Faux"
            correct: true
            why: "L'API doit vérifier les droits."
        explanation: "Le frontend est une commodité, pas une barrière."
      - code: sec-pr-q5
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quelles protections forment une défense en profondeur contre une donnée invalide ? (plusieurs réponses)"
        choices:
          - label: "Validation du formulaire Angular"
            correct: true
            why: "Première barrière, pour le confort."
          - label: "@Valid sur le DTO Spring"
            correct: true
            why: "Deuxième barrière, obligatoire."
          - label: "Contrainte CHECK ou NOT NULL en base"
            correct: true
            why: "Dernière barrière."
          - label: "Un message « merci de ne pas tricher »"
            correct: false
            why: "Ce n'est pas une protection."
        explanation: "Plusieurs couches indépendantes."
      - code: sec-dp-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Que veut dire « ne jamais faire confiance au client » ?"
        choices:
          - label: "L'API revérifie tout ce qui arrive, même si le frontend a déjà vérifié"
            correct: true
            why: "Le frontend peut être contourné."
          - label: "Ne jamais répondre aux utilisateurs"
            correct: false
            why: "Il s'agit de vérifier, pas de refuser."
          - label: "Chiffrer la base"
            correct: false
            why: "C'est une autre protection."
        explanation: "Tout ce qui vient du navigateur peut être modifié."
      - code: sec-dp-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: securite-owasp
        prompt: "Dans une défense en profondeur, si une barrière cède, les autres protègent encore."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est tout l'intérêt."
          - label: "Faux"
            correct: false
            why: "Les barrières sont indépendantes."
        explanation: "Le château fort."
      - code: sec-dp-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quelle est la barrière qui protège vraiment les données ?"
        choices:
          - label: "Les vérifications côté API et base"
            correct: true
            why: "Elles ne peuvent pas être contournées par le navigateur."
          - label: "Le bouton caché dans Angular"
            correct: false
            why: "Confort seulement."
          - label: "Le message d'erreur"
            correct: false
            why: "Il n'empêche rien."
        explanation: "Le serveur décide."
    exercises:
      - slug: sec-ex-defense-guide
        kind: COMPLETER
        title: "Les couches d'une validation"
        difficulty: FACILE
        skill: securite-owasp
        statement: "Complète les trois barrières contre un e-mail vide : Angular, Spring, PostgreSQL."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Angular : Validators.required."
          - "Spring : @NotBlank ; PostgreSQL : NOT NULL."
          - "required, NotBlank, NULL."
        solution: '["required", "NotBlank", "NULL"]'
        explanation: "Trois couches indépendantes."
        xp: 10
        payload:
