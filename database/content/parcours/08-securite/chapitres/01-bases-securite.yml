      - slug: sec-ex-barrieres
        kind: CODE_LIBRE
        title: "Les barrières de mon application"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Décris, en une ligne chacune, **quatre barrières** qui empêchent un utilisateur simple de supprimer
          un livre dans une application Angular + Spring Boot + PostgreSQL. Commence chaque ligne par un
          tiret `-`. Tu dois parler du **frontend**, du **jeton** (ou de l'authentification), du **rôle** et de
