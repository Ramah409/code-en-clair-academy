  # ===================================================================== LEÇON 5
  - slug: sec-connexion
    title: "Une connexion qui ne révèle rien"
    duration: 10
    objective: "Vérifier un mot de passe avec matches, répondre le même message dans tous les cas et ne jamais journaliser de secret."
    prerequisites: "Leçon « Hacher les mots de passe avec BCrypt »."
    skills: [auth-jwt, securite-owasp]
    xp: 15
    memo: |
      - À la connexion : `passwordEncoder.matches(saisi, empreinte)` rehache la saisie avec le même sel et compare.
      - **Même message** « Identifiants invalides » si l'e-mail est inconnu **ou** si le mot de passe est faux.
      - **Jamais** de mot de passe dans les journaux (logs).
    commonMistakes: |
      - Comparer `saisi.equals(empreinte)` : ça ne marche jamais, il faut `matches`.
      - Dire « e-mail inconnu » : on révèle quels e-mails existent.
    blocks:
      - type: definition
        id: def-connexion-sure
        term: "Connexion sûre"
        md: |
          Un **portier discret** : il compare ta clé avec la serrure (matches) et, si ça ne va pas, dit seulement
          « désolé », sans préciser si c'est ton nom ou ta clé qui ne va pas.
      - type: code
        id: code-connexion
        language: java
        title: "Connexion"
        code: |
          Utilisateur u = utilisateurs.findByEmail(email)
                  .orElseThrow(() -> new BadCredentialsException("Identifiants invalides"));
          if (!passwordEncoder.matches(motDePasseSaisi, u.getEmpreinte())) {
              throw new BadCredentialsException("Identifiants invalides");
          }
        lines:
          - n: 2
            note: "Même message si l'e-mail est inconnu…"
          - n: 3
            note: "`matches` rehache la saisie avec le même sel et compare."
          - n: 4
            note: "… ou si le mot de passe est faux : on ne révèle rien."
      - type: question
        ref: sec-mdp-q2
        review: code-connexion
      - type: question
        ref: sec-mdp-q4
        review: def-connexion-sure
      - type: text
        md: "**Exercice 1 (guidé)** : complète la connexion."
      - type: exercise
        ref: sec-ex-connexion-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une connexion par e-mail."
      - type: exercise
        ref: sec-ex-connexion-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une connexion trop bavarde."
      - type: exercise
        ref: sec-ex-connexion
      - type: quiz
        items:
          - ref: sec-cx-q3
            review: code-connexion
          - ref: sec-cx-q4
            review: def-connexion-sure
          - ref: sec-cx-q5
            review: def-connexion-sure
    questions:
      - code: sec-mdp-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Comment vérifier un mot de passe saisi avec Spring Security ?"
        choices:
          - label: "passwordEncoder.matches(saisi, empreinte)"
            correct: true
            why: "Il rehache avec le bon sel et compare."
          - label: "saisi.equals(empreinte)"
            correct: false
            why: "Un texte ne sera jamais égal à son empreinte."
          - label: "passwordEncoder.encode(saisi).equals(empreinte)"
            correct: false
            why: "Un nouveau sel donne une empreinte différente."
        explanation: "Toujours `matches`."
      - code: sec-mdp-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quel message afficher quand la connexion échoue ?"
        choices:
          - label: "« Identifiants invalides », dans tous les cas"
            correct: true
            why: "On ne révèle pas si l'e-mail existe."
          - label: "« Cet e-mail n'existe pas »"
            correct: false
            why: "Un attaquant apprend quels e-mails sont inscrits."
          - label: "« Mot de passe faux pour cet e-mail »"
            correct: false
            why: "Même problème : l'e-mail est confirmé."
        explanation: "Un message unique empêche l'énumération des comptes."
      - code: sec-cx-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: auth-jwt
        prompt: "`motDePasse.equals(empreinte)` peut renvoyer vrai si le mot de passe est bon."
        choices:
          - label: "Vrai"
            correct: false
            why: "Le mot de passe et son empreinte ne se ressemblent pas."
          - label: "Faux"
            correct: true
            why: "Il faut matches."
        explanation: "equals ne marche jamais ici."
      - code: sec-cx-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Peut-on écrire le mot de passe saisi dans les journaux pour déboguer ?"
        choices:
          - label: "Non, jamais"
            correct: true
            why: "Les journaux sont lus par d'autres et conservés longtemps."
          - label: "Oui, en développement"
            correct: false
            why: "Les mauvaises habitudes finissent en production."
          - label: "Oui, s'il est haché ensuite"
            correct: false
            why: "Le journal l'aura déjà gardé en clair."
        explanation: "Aucun secret dans les logs."
      - code: sec-cx-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Pourquoi un message unique empêche-t-il l'énumération des comptes ?"
        choices:
          - label: "L'attaquant ne peut pas savoir si un e-mail est inscrit"
            correct: true
            why: "Même réponse dans les deux cas."
          - label: "Il bloque le compte"
            correct: false
            why: "Le message ne bloque rien."
          - label: "Il chiffre l'e-mail"
            correct: false
            why: "Aucun chiffrement ici."
        explanation: "Ne rien révéler."
    exercises:
      - slug: sec-ex-connexion-guide
        kind: COMPLETER
        title: "Compléter la connexion"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Complète la comparaison et le message commun."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La comparaison : matches."
          - "Le même message dans les deux cas."
          - "Identifiants invalides, matches, Identifiants invalides."
        solution: '["Identifiants invalides", "matches", "Identifiants invalides"]'
        explanation: "Comparer correctement, ne rien révéler."
        xp: 10
        payload:
          language: java
          caseSensitive: false
          template: |
            Utilisateur u = utilisateurs.findByEmail(email)
                    .orElseThrow(() -> new BadCredentialsException("[[1]]"));
            if (!passwordEncoder.[[2]](saisi, u.getEmpreinte())) {
                throw new BadCredentialsException("[[3]]");
            }
          blanks:
            - ["Identifiants invalides"]
            - ["matches"]
            - ["Identifiants invalides"]
      - slug: sec-ex-connexion-libre
        kind: CODE_LIBRE
        title: "Une connexion par e-mail"
        difficulty: INTERMEDIAIRE
        skill: auth-jwt
        statement: |
          Écris `connecter(String email, String motDePasse)` qui :
          - cherche l'utilisateur avec `utilisateurs.findByEmail(email)` et lance
            `BadCredentialsException("Identifiants invalides")` s'il n'existe pas ;
          - compare avec `passwordEncoder.matches(motDePasse, u.getEmpreinte())` et lance la même exception si
            c'est faux ;
          - renvoie `u`.
        criteria: "orElseThrow et matches avec le même message."
        hints:
          - "`.orElseThrow(() -> new BadCredentialsException(\"Identifiants invalides\"))`"
          - "`if (!passwordEncoder.matches(motDePasse, u.getEmpreinte())) { throw … }`"
          - "`return u;`"
        solution: |
          public Utilisateur connecter(String email, String motDePasse) {
              Utilisateur u = utilisateurs.findByEmail(email)
                      .orElseThrow(() -> new BadCredentialsException("Identifiants invalides"));
              if (!passwordEncoder.matches(motDePasse, u.getEmpreinte())) {
                  throw new BadCredentialsException("Identifiants invalides");
              }
              return u;
          }
        explanation: "Correcte et discrète."
        xp: 20
        payload:
          language: java
          starter: |
            public Utilisateur connecter(String email, String motDePasse) {

            }
          checks:
            - pattern: 'utilisateurs\.findByEmail\s*\(\s*email\s*\)\s*\.orElseThrow'
              message: "Cherche l'utilisateur avec findByEmail(email).orElseThrow(…)."
            - pattern: 'passwordEncoder\.matches\s*\(\s*motDePasse\s*,\s*\w+\.getEmpreinte\s*\(\s*\)\s*\)'
              message: "Compare avec passwordEncoder.matches(motDePasse, u.getEmpreinte())."
            - pattern: '\A(?>[\s\S]*?"Identifiants invalides"){2}'
              message: "Utilise « Identifiants invalides » dans les deux cas."
            - pattern: 'return\s+\w+\s*;'
              message: "Renvoie l'utilisateur."
      - slug: sec-ex-connexion
        kind: CORRIGER_ERREUR
        title: "Une connexion trop bavarde"
        difficulty: INTERMEDIAIRE
        skill: auth-jwt
        statement: |
          Cette méthode de connexion a trois défauts :
          - elle compare le mot de passe avec `equals` ;
          - elle dit si l'e-mail existe (« E-mail inconnu ») ;
          - elle écrit le mot de passe dans les logs.
          Corrige-la : `passwordEncoder.matches`, le **même** message « Identifiants invalides » dans les deux
          cas, et plus aucun log du mot de passe.
        criteria: "matches utilisé, plus d'equals sur le mot de passe, plus de « E-mail inconnu », plus de log du mot de passe."
        hints:
          - "`if (!passwordEncoder.matches(motDePasse, u.getEmpreinte()))`"
          - "Remplace « E-mail inconnu » par « Identifiants invalides »."
