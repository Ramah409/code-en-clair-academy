  # ===================================================================== LEÇON 4
  - slug: sec-mots-de-passe
    title: "Hacher les mots de passe avec BCrypt"
    duration: 11
    objective: "Distinguer chiffrement et hachage, comprendre le sel et hacher un mot de passe avec BCrypt."
    prerequisites: "Leçon « La défense en profondeur »."
    skills: [securite-owasp, auth-jwt]
    xp: 15
    memo: |
      - On ne stocke **jamais** un mot de passe en clair, ni chiffré : on stocke son **empreinte** (hachage).
      - **Hachage** : sens unique. **Chiffrement** : réversible avec une clé.
      - **Sel** : une valeur aléatoire ajoutée avant le hachage ; deux mots de passe identiques donnent deux empreintes différentes.
      - **BCrypt** (ou Argon2) : volontairement **lent**. MD5 et SHA-1 sont interdits.
      - À l'inscription : `passwordEncoder.encode(motDePasse)`.
    commonMistakes: |
      - Enregistrer le mot de passe en clair « pour l'instant ».
      - Utiliser SHA-256 seul, sans sel et trop rapide.
    blocks:
      - type: text
        md: |
          Si la base est volée un jour, les mots de passe ne doivent **pas** être lisibles. Beaucoup de gens
          réutilisent le même mot de passe partout : une fuite chez toi ouvrirait leurs autres comptes.
      - type: definition
        id: def-hachage
        term: "Hachage"
        md: |
          Un **hachoir à viande** : on met un steak, il en sort de la viande hachée. Impossible de reconstituer
          le steak. Mais le même steak donne toujours la même viande hachée : on peut **comparer** sans
          connaître l'original.
      - type: definition
        id: def-sel
        term: "Sel"
        md: |
          Une **pincée d'ingrédient au hasard** ajoutée avant de hacher. Deux personnes avec le même mot de
          passe `Soleil2024` obtiennent des empreintes différentes. BCrypt ajoute le sel **tout seul**.
      - type: code
        id: code-bcrypt
        language: java
        title: "Inscription"
        code: |
          @Bean
          PasswordEncoder passwordEncoder() {
              return new BCryptPasswordEncoder();
          }

          // Inscription
          String empreinte = passwordEncoder.encode(req.motDePasse());
          utilisateurs.save(new Utilisateur(req.email(), empreinte));
        lines:
          - n: 3
            note: "BCrypt : lent exprès, avec sel automatique."
          - n: 7
            note: "`encode` produit une empreinte du type `$2a$10$…` qui contient le sel."
          - n: 8
            note: "On enregistre **l'empreinte**, jamais le mot de passe."
      - type: question
        ref: sec-mdp-q1
        review: def-hachage
      - type: question
        ref: sec-mdp-q3
        review: def-sel
      - type: text
        md: "**Exercice 1 (guidé)** : complète l'inscription."
      - type: exercise
        ref: sec-ex-bcrypt-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : enregistrer un compte."
      - type: exercise
        ref: sec-ex-bcrypt-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un mot de passe en clair."
      - type: exercise
        ref: sec-ex-bcrypt-bug
      - type: jury
        items:
          - q: "Comment stockez-vous les mots de passe ?"
            a: "Hachés avec BCrypt via le PasswordEncoder de Spring Security : algorithme lent, avec un sel aléatoire intégré à chaque empreinte. Je ne stocke jamais le mot de passe en clair ni chiffré, et je compare avec matches()."
          - q: "Quelle différence entre hachage et chiffrement ?"
            a: "Le chiffrement est réversible avec une clé : on retrouve le texte d'origine. Le hachage est à sens unique : on ne peut que comparer deux empreintes. Pour un mot de passe, on n'a jamais besoin de le relire, donc on le hache."
      - type: quiz
        items:
          - ref: sec-mdp-q5
            review: code-bcrypt
          - ref: sec-c1-b2
            review: def-hachage
          - ref: sec-hc-q5
            review: code-bcrypt
    questions:
      - code: sec-mdp-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Pourquoi hacher plutôt que chiffrer les mots de passe ?"
        choices:
          - label: "Le hachage est à sens unique : même avec la base, on ne retrouve pas le mot de passe"
            correct: true
            why: "Pas de clé à voler."
          - label: "Le hachage est plus court"
            correct: false
            why: "La longueur n'est pas l'argument."
          - label: "Le chiffrement est interdit"
            correct: false
            why: "Il est utile ailleurs, pas pour les mots de passe."
        explanation: "On n'a jamais besoin de relire un mot de passe, seulement de le comparer."
      - code: sec-mdp-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: securite-owasp
        prompt: "Avec BCrypt, deux utilisateurs ayant le même mot de passe ont la même empreinte en base."
        choices:
          - label: "Vrai"
            correct: false
            why: "Chaque empreinte a son propre sel."
          - label: "Faux"
            correct: true
            why: "Le sel aléatoire rend les empreintes différentes."
        explanation: "Le sel empêche de repérer les mots de passe identiques."
      - code: sec-mdp-q5
        kind: TEXTE
        difficulty: 1
        skill: securite-owasp
        prompt: "Quel algorithme de hachage lent est fourni par Spring Security et recommandé pour les mots de passe ? (un nom)"
        answers: ["BCrypt", "bcrypt", "Argon2", "argon2"]
        explanation: "BCrypt (ou Argon2). Jamais MD5 ni SHA-1."
      - code: sec-c1-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Pourquoi un algorithme de hachage de mots de passe doit-il être lent ?"
        choices:
          - label: "Pour rendre très coûteux les essais en masse de mots de passe"
            correct: true
            why: "Un attaquant teste des candidats à la chaîne."
          - label: "Pour économiser la batterie"
            correct: false
            why: "Aucun rapport."
          - label: "Ce n'est pas souhaitable"
            correct: false
            why: "C'est justement la qualité recherchée."
        explanation: "Imperceptible pour un utilisateur, décourageant pour un attaquant."
      - code: sec-hc-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: auth-jwt
        prompt: "Que faut-il enregistrer en base à l'inscription ?"
        choices:
          - label: "L'empreinte produite par passwordEncoder.encode"
            correct: true
            why: "Jamais le mot de passe lui-même."
          - label: "Le mot de passe en clair"
            correct: false
            why: "Il serait lisible en cas de fuite."
          - label: "Le mot de passe chiffré"
            correct: false
            why: "Réversible avec la clé."
        explanation: "encode → empreinte → base."
    exercises:
      - slug: sec-ex-bcrypt-guide
        kind: COMPLETER
        title: "Compléter l'inscription"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Complète : l'encodeur BCrypt et le hachage à l'inscription."
        criteria: "Les deux trous sont corrects."
        hints:
          - "La classe s'appelle BCryptPasswordEncoder."
          - "À l'inscription : encode."
          - "BCryptPasswordEncoder, encode."
        solution: '["BCryptPasswordEncoder", "encode"]'
        explanation: "Un encodeur lent, une empreinte enregistrée."
        xp: 10
        payload:
          language: java
          template: |
            @Bean PasswordEncoder passwordEncoder() { return new [[1]](); }

            String empreinte = passwordEncoder.[[2]](req.motDePasse());
          blanks:
            - ["BCryptPasswordEncoder"]
            - ["encode"]
      - slug: sec-ex-bcrypt-libre
        kind: CODE_LIBRE
        title: "Enregistrer un compte"
        difficulty: FACILE
        skill: auth-jwt
        statement: |
          Écris `inscrire(InscriptionRequest req)` qui calcule l'empreinte avec `passwordEncoder.encode(req.motDePasse())`
          puis enregistre `new Utilisateur(req.email(), empreinte)` avec `utilisateurs.save(...)`.
        criteria: "encode puis save avec l'empreinte."
        hints:
          - "`String empreinte = passwordEncoder.encode(req.motDePasse());`"
          - "`utilisateurs.save(new Utilisateur(req.email(), empreinte));`"
          - "Jamais `req.motDePasse()` dans le save."
        solution: |
          public void inscrire(InscriptionRequest req) {
              String empreinte = passwordEncoder.encode(req.motDePasse());
              utilisateurs.save(new Utilisateur(req.email(), empreinte));
          }
        explanation: "Seule l'empreinte arrive en base."
        xp: 15
        payload:
          language: java
          starter: |
            public void inscrire(InscriptionRequest req) {

            }
          checks:
            - pattern: '(\w+)\s*=\s*passwordEncoder\.encode\s*\(\s*req\.motDePasse\s*\(\s*\)\s*\)[\s\S]*utilisateurs\.save\s*\(\s*new\s+Utilisateur\s*\(\s*req\.email\s*\(\s*\)\s*,\s*\1\s*\)\s*\)'
              message: "Calcule l'empreinte avec encode, puis enregistre new Utilisateur(req.email(), empreinte)."
            - pattern: 'new\s+Utilisateur\s*\([^)]*req\.motDePasse'
              absent: true
              message: "N'enregistre jamais le mot de passe lui-même."
      - slug: sec-ex-bcrypt-bug
        kind: CORRIGER_ERREUR
        title: "Un mot de passe en clair"
        difficulty: FACILE
        skill: auth-jwt
        statement: |
          Cette inscription enregistre le mot de passe en clair. Hache-le d'abord avec `passwordEncoder.encode`.
        criteria: "L'empreinte est enregistrée à la place du mot de passe."
        hints:
          - "Qu'est-ce qui doit arriver en base ?"
          - "L'empreinte."
          - "`passwordEncoder.encode(req.motDePasse())`"
        solution: |
          public void inscrire(InscriptionRequest req) {
              String empreinte = passwordEncoder.encode(req.motDePasse());
              utilisateurs.save(new Utilisateur(req.email(), empreinte));
