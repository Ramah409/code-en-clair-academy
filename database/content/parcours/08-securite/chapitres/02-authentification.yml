    exercises:
      - slug: sec-ex-jjwt-guide
        kind: COMPLETER
        title: "Compléter la construction"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Complète : le sujet, l'expiration et la signature."
        criteria: "Les trois trous sont corrects."
        hints:
          - "L'identité : subject."
          - "La date de fin : expiration ; le sceau : signWith."
          - "subject, expiration, signWith."
        solution: '["subject", "expiration", "signWith"]'
        explanation: "Qui, jusqu'à quand, signé."
        xp: 10
        payload:
          language: java
          template: |
            return Jwts.builder()
                    .[[1]](u.getEmail())
                    .[[2]](Date.from(maintenant.plus(1, ChronoUnit.HOURS)))
                    .[[3]](cle)
                    .compact();
          blanks:
            - ["subject"]
            - ["expiration"]
            - ["signWith"]
      - slug: sec-ex-jwt-generer
        kind: CODE_LIBRE
        title: "Générer un jeton"
        difficulty: DIFFICILE
        skill: auth-jwt
        statement: |
          Avec la bibliothèque **jjwt**, écris la méthode `String generer(Utilisateur u)` qui renvoie un jeton :
          - `subject` : l'e-mail de l'utilisateur (`u.getEmail()`) ;
          - une information `role` : `u.getRole().name()` ;
          - date d'émission : maintenant ;
          - expiration : dans **une heure** (`maintenant.plus(1, ChronoUnit.HOURS)`) ;
          - signé avec le champ `cle` (déjà construit à partir du secret de l'environnement).
        criteria: "Jwts.builder, subject, claim role, issuedAt, expiration à une heure, signWith(cle), compact."
        hints:
          - "Commence par `return Jwts.builder()` et termine par `.compact();`."
          - "`.subject(u.getEmail()).claim(\"role\", u.getRole().name())`"
          - "`.issuedAt(Date.from(maintenant)).expiration(Date.from(maintenant.plus(1, ChronoUnit.HOURS))).signWith(cle)`"
        solution: |
          public String generer(Utilisateur u) {
              Instant maintenant = Instant.now();
              return Jwts.builder()
                      .subject(u.getEmail())
                      .claim("role", u.getRole().name())
                      .issuedAt(Date.from(maintenant))
                      .expiration(Date.from(maintenant.plus(1, ChronoUnit.HOURS)))
                      .signWith(cle)
                      .compact();
          }
        explanation: "Un jeton minimal : qui, quel rôle, quand, jusqu'à quand, signé."
        xp: 30
        payload:
          language: java
          starter: |
            public String generer(Utilisateur u) {

            }
          checks:
            - pattern: 'Jwts\.builder\s*\(\s*\)'
              message: "Commence par `Jwts.builder()`."
            - pattern: '\.(?:subject|setSubject)\s*\(\s*u\.getEmail\s*\(\s*\)\s*\)'
              message: "Le sujet est l'e-mail : `.subject(u.getEmail())`."
            - pattern: '\.claim\s*\(\s*"role"\s*,\s*u\.getRole\s*\(\s*\)\s*\.name\s*\(\s*\)\s*\)'
              message: "Ajoute le rôle : `.claim(\"role\", u.getRole().name())`."
            - pattern: '\.(?:issuedAt|setIssuedAt)\s*\('
              message: "Indique la date d'émission avec `.issuedAt(…)`."
            - pattern: '\.(?:expiration|setExpiration)\s*\([^;]*(?:plusSeconds\s*\(\s*3600\s*\)|plus\s*\(\s*1\s*,\s*ChronoUnit\.HOURS\s*\)|plus\s*\(\s*Duration\.ofHours\s*\(\s*1\s*\)\s*\)|3600000|3_600_000)'
              message: "L'expiration doit être dans une heure : `maintenant.plus(1, ChronoUnit.HOURS)`."
            - pattern: '\.signWith\s*\(\s*cle\s*\)'
              message: "Signe avec `.signWith(cle)`."
            - pattern: '\.compact\s*\(\s*\)'
              message: "Termine par `.compact()` pour obtenir le texte du jeton."
      - slug: sec-ex-jjwt-bug
        kind: CORRIGER_ERREUR
        title: "Un jeton éternel"
        difficulty: FACILE
        skill: auth-jwt
        statement: |
          Ce jeton n'a pas d'expiration : volé, il servirait pour toujours. Ajoute
          `.expiration(Date.from(maintenant.plus(1, ChronoUnit.HOURS)))` avant la signature.
        criteria: "Une expiration à une heure avant signWith."
        hints:
          - "Il manque la date de fin."
          - "Une heure suffit."
          - "`.expiration(Date.from(maintenant.plus(1, ChronoUnit.HOURS)))`"
        solution: |
          return Jwts.builder()
                  .subject(u.getEmail())
                  .issuedAt(Date.from(maintenant))
                  .expiration(Date.from(maintenant.plus(1, ChronoUnit.HOURS)))
                  .signWith(cle)
                  .compact();
        explanation: "Un jeton volé ne doit servir que peu de temps."
        xp: 10
        payload:
          language: java
          starter: |
            return Jwts.builder()
                    .subject(u.getEmail())
                    .issuedAt(Date.from(maintenant))
                    .signWith(cle)
                    .compact();
          checks:
            - pattern: '\.expiration\s*\(\s*Date\.from\s*\(\s*maintenant\.plus\s*\(\s*1\s*,\s*ChronoUnit\.HOURS\s*\)\s*\)\s*\)[\s\S]*\.signWith'
              message: "Ajoute .expiration(Date.from(maintenant.plus(1, ChronoUnit.HOURS))) avant signWith."

  # ===================================================================== LEÇON 4
  - slug: sec-spring-security
    title: "Spring Security : les règles d'accès"
    duration: 12
    objective: "Configurer une SecurityFilterChain sans état qui ouvre les routes publiques, exige des rôles et ferme tout le reste."
    prerequisites: "Leçon « Fabriquer un jeton avec jjwt »."
    skills: [auth-jwt, securite-owasp]
    xp: 15
    memo: |
      - `SecurityFilterChain` : la **liste des règles** appliquées à chaque requête.
      - `SessionCreationPolicy.STATELESS` : pas de session serveur, le JWT suffit.
      - `requestMatchers("/api/auth/**").permitAll()` : public ; `.hasRole("ADMIN")` : réservé ; `.anyRequest().authenticated()` : tout le reste exige un jeton.
      - Les règles sont lues **dans l'ordre** : de la plus précise à la plus générale.
      - `@PreAuthorize("hasRole('ADMIN')")` sur une méthode : règle plus fine.
    commonMistakes: |
      - Mettre `anyRequest().permitAll()` pour débloquer un problème.
      - Placer `anyRequest()` avant les règles précises.
    blocks:
      - type: definition
        id: def-filter-chain
        term: "Chaîne de filtres"
        md: |
          Les **contrôles d'un aéroport** : vérification du billet, puis de l'identité, puis passage aux
          rayons X. Chaque requête traverse les filtres dans l'ordre ; si l'un dit non, elle ne va pas plus loin.
      - type: code
        id: code-security
        language: java
        title: "SecurityConfig.java"
        code: |
          @Bean
          SecurityFilterChain securite(HttpSecurity http, JwtFilter jwtFilter) throws Exception {
              return http
                  .csrf(csrf -> csrf.disable())
                  .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
                  .authorizeHttpRequests(auth -> auth
                      .requestMatchers("/api/auth/**").permitAll()
                      .requestMatchers(HttpMethod.GET, "/api/livres/**").permitAll()
                      .requestMatchers("/api/admin/**").hasRole("ADMIN")
                      .anyRequest().authenticated())
                  .addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class)
                  .build();
          }
        lines:
          - n: 4
            note: "CSRF désactivé : sans cookie de session, cette attaque ne s'applique pas (le jeton est dans un en-tête)."
          - n: 5
            note: "`STATELESS` : aucune session côté serveur."
          - n: 7
            note: "Connexion et inscription : ouvertes à tous."
          - n: 8
            note: "Le catalogue se consulte sans compte (GET seulement)."
          - n: 9
            note: "L'administration exige le rôle ADMIN, sinon **403**."
          - n: 10
            note: "Tout le reste exige un jeton valide, sinon **401**. Toujours **en dernier**."
          - n: 11
            note: "Notre filtre lit et vérifie le JWT avant les contrôles de Spring."
      - type: question
        ref: sec-ss-q1
        review: code-security
      - type: question
        ref: sec-ss-q3
        review: code-security
      - type: text
        md: "**Exercice 1 (guidé)** : complète la configuration."
      - type: exercise
        ref: sec-ex-security-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : les règles d'une API de réservation."
      - type: exercise
        ref: sec-ex-security-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une porte grande ouverte."
      - type: exercise
        ref: sec-ex-security-corriger
      - type: jury
        items:
          - q: "Comment gérez-vous les rôles ?"
            a: "Le rôle est stocké en base et placé dans le JWT. Le filtre JWT crée l'Authentication avec l'autorité ROLE_ADMIN ou ROLE_USER. La SecurityFilterChain protège les routes par préfixe (hasRole), et @PreAuthorize permet des règles plus fines sur les méthodes."
      - type: quiz
        items:
          - ref: sec-ss-q6
            review: def-filter-chain
          - ref: sec-ss-q7
            review: code-security
          - ref: sec-ss-q8
            review: code-security
    questions:
      - code: sec-ss-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Pourquoi `anyRequest().authenticated()` doit-il être la dernière règle ?"
        choices:
          - label: "Les règles sont lues dans l'ordre : placée avant, elle masquerait les règles précises"
            correct: true
            why: "La première règle qui correspond gagne."
          - label: "Spring trie les règles tout seul"
            correct: false
            why: "C'est l'ordre d'écriture qui compte."
          - label: "Ce n'est pas obligatoire"
            correct: false
            why: "Spring lève même une erreur si des règles suivent anyRequest."
        explanation: "Du plus précis au plus général."
      - code: sec-ss-q3
        kind: VRAI_FAUX
