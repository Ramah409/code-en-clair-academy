      - code: sec-jg-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Où ranger le secret de signature ?"
        choices:
          - label: "Dans une variable d'environnement (JWT_SECRET)"
