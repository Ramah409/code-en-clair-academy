      - code: sec-ss-q6
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: auth-jwt
        prompt: "Que fait `.requestMatchers(\"/api/auth/**\").permitAll()` ?"
        choices:
          - label: "Il ouvre la connexion et l'inscription à tous"
