      - slug: sec-ex-propriete-libre
        kind: CODE_LIBRE
        title: "Ses propres réservations"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Écris `lire(Long id, String emailConnecte)` dans `ReservationService` : cherche avec
          `reservations.findByIdAndMembreEmail(id, emailConnecte)`, lance `RessourceIntrouvableException` si
          rien n'est trouvé, et renvoie `ReservationDto.from(r)`.
        criteria: "findByIdAndMembreEmail avec l'e-mail connecté, orElseThrow, DTO."
        hints:
          - "`reservations.findByIdAndMembreEmail(id, emailConnecte)`"
          - "`.orElseThrow(() -> new RessourceIntrouvableException(\"Réservation \" + id))`"
          - "`return ReservationDto.from(r);`"
        solution: |
          public ReservationDto lire(Long id, String emailConnecte) {
              Reservation r = reservations.findByIdAndMembreEmail(id, emailConnecte)
                      .orElseThrow(() -> new RessourceIntrouvableException("Réservation " + id));
              return ReservationDto.from(r);
          }
        explanation: "Chacune ne voit que ses réservations."
        xp: 20
        payload:
          language: java
          starter: |
            public ReservationDto lire(Long id, String emailConnecte) {

            }
          checks:
            - pattern: 'reservations\.findByIdAndMembreEmail\s*\(\s*id\s*,\s*emailConnecte\s*\)'
              message: "Cherche avec findByIdAndMembreEmail(id, emailConnecte)."
            - pattern: '\.orElseThrow\s*\(\s*\(\s*\)\s*->\s*new\s+RessourceIntrouvableException'
              message: "Lance RessourceIntrouvableException si rien n'est trouvé."
            - pattern: 'return\s+ReservationDto\.from\s*\(\s*\w+\s*\)'
              message: "Renvoie ReservationDto.from(r)."
      - slug: sec-ex-propriete-bug
        kind: CORRIGER_ERREUR
        title: "N'importe quel emprunt"
        difficulty: FACILE
        skill: securite-owasp
        statement: |
          Ce service renvoie n'importe quel emprunt à n'importe quelle adhérente connectée. Remplace
          `findById(id)` par `findByIdAndAdherentEmail(id, emailConnecte)`.
        criteria: "findByIdAndAdherentEmail, plus de findById seul."
        hints:
          - "Il manque la vérification du propriétaire."
          - "La méthode combine l'id et l'e-mail."
          - "`emprunts.findByIdAndAdherentEmail(id, emailConnecte)`"
        solution: |
          public EmpruntDto lire(Long id, String emailConnecte) {
              Emprunt e = emprunts.findByIdAndAdherentEmail(id, emailConnecte)
                      .orElseThrow(() -> new RessourceIntrouvableException("Emprunt " + id));
              return EmpruntDto.from(e);
          }
        explanation: "Vérifier à qui appartient la ressource."
        xp: 10
        payload:
          language: java
          starter: |
            public EmpruntDto lire(Long id, String emailConnecte) {
                Emprunt e = emprunts.findById(id)
                        .orElseThrow(() -> new RessourceIntrouvableException("Emprunt " + id));
                return EmpruntDto.from(e);
            }
          checks:
            - pattern: '\.findById\s*\(\s*id\s*\)'
              absent: true
              message: "findById seul ne vérifie pas le propriétaire."
            - pattern: 'emprunts\.findByIdAndAdherentEmail\s*\(\s*id\s*,\s*emailConnecte\s*\)'
              message: "Écris emprunts.findByIdAndAdherentEmail(id, emailConnecte)."

