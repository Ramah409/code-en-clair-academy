  # ===================================================================== LEÇON 5
  - slug: sec-propriete
    title: "Vérifier à qui appartient la ressource"
    duration: 10
    objective: "Empêcher une utilisatrice connectée de lire la ressource d'une autre (faille IDOR)."
    prerequisites: "Leçon « Spring Security : les règles d'accès »."
    skills: [securite-owasp]
    xp: 15
    memo: |
      - Être connectée ne donne pas accès à **toutes** les ressources : seulement aux **siennes**.
      - On cherche la ressource **et** son propriétaire : `findByIdAndAdherentEmail(id, emailConnecte)`.
      - L'e-mail vient du **jeton vérifié**, jamais d'un paramètre envoyé par le client.
      - Une ressource d'une autre personne est traitée comme **introuvable** (404).
    commonMistakes: |
      - Vérifier le rôle mais oublier de vérifier **à qui** appartient l'emprunt demandé.
      - Lire l'e-mail dans un paramètre `?email=`.
    blocks:
      - type: definition
        id: def-idor
        term: "Vérifier la propriété"
        md: |
          Avoir un badge d'hôtel valide ne donne pas accès à **toutes** les chambres, seulement à la **sienne**.
          `GET /api/emprunts/42` : l'adhérente est connectée, d'accord… mais l'emprunt 42 est-il à elle ?
      - type: code
        id: code-propriete
        language: java
        title: "Dans le service"
        code: |
          public EmpruntDto lire(Long id, String emailConnecte) {
              Emprunt e = emprunts.findByIdAndAdherentEmail(id, emailConnecte)
                      .orElseThrow(() -> new RessourceIntrouvableException("Emprunt " + id));
              return EmpruntDto.from(e);
          }
        lines:
          - n: 1
            note: "L'e-mail vient du jeton vérifié, jamais d'un paramètre envoyé par le client."
          - n: 2
            note: "On cherche l'emprunt **et** son propriétaire en une seule requête."
          - n: 3
            note: "Un emprunt d'une autre personne est traité comme introuvable (404) : on ne révèle même pas qu'il existe."
      - type: question
        ref: sec-ss-q2
        review: def-idor
      - type: question
        ref: sec-ss-q4
        review: code-propriete
      - type: text
        md: "**Exercice 1 (guidé)** : complète la recherche."
      - type: exercise
        ref: sec-ex-propriete-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : ses propres réservations."
      - type: exercise
        ref: sec-ex-propriete-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : n'importe quel emprunt."
      - type: exercise
        ref: sec-ex-propriete-bug
      - type: jury
        items:
          - q: "Un utilisateur connecté peut-il lire l'emprunt d'un autre ?"
            a: "Non : le service récupère l'emprunt avec l'identifiant ET l'e-mail extrait du jeton. S'il ne lui appartient pas, il reçoit 404. C'est la protection contre la faille IDOR, en tête du Top 10 OWASP (contrôle d'accès défaillant)."
      - type: quiz
        items:
          - ref: sec-po-q3
            review: code-propriete
          - ref: sec-po-q4
            review: def-idor
          - ref: sec-po-q5
            review: code-propriete
    questions:
      - code: sec-ss-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Awa, connectée, change l'URL `/api/emprunts/12` en `/api/emprunts/13` et voit l'emprunt de Karim. Quelle faille ?"
        choices:
          - label: "Un contrôle d'accès défaillant (IDOR)"
            correct: true
            why: "On ne vérifie pas à qui appartient la ressource."
          - label: "Une injection SQL"
            correct: false
            why: "Aucune requête n'est détournée."
          - label: "Une faille XSS"
            correct: false
            why: "Aucun script n'est injecté."
        explanation: "C'est le risque n° 1 du Top 10 OWASP 2021."
      - code: sec-ss-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "D'où doit venir l'e-mail de l'utilisatrice utilisé pour filtrer ses emprunts ?"
        choices:
          - label: "Du jeton vérifié (le SecurityContext)"
            correct: true
            why: "Le client ne peut pas le falsifier."
          - label: "D'un paramètre `?email=` envoyé par Angular"
            correct: false
            why: "N'importe qui pourrait mettre l'e-mail d'un autre."
          - label: "Du localStorage"
            correct: false
            why: "Il est contrôlé par le client."
        explanation: "L'identité vient toujours d'une source vérifiée par le serveur."
      - code: sec-po-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: securite-owasp
        prompt: "Que renvoyer si l'emprunt demandé appartient à quelqu'un d'autre ?"
        choices:
          - label: "404, comme s'il n'existait pas"
            correct: true
            why: "On ne révèle même pas son existence."
          - label: "200 avec l'emprunt"
            correct: false
            why: "C'est la faille."
          - label: "500"
            correct: false
