              message: "Ne laisse pas `anyRequest().permitAll()` : tout serait ouvert."
            - pattern: 'requestMatchers\s*\(\s*"/api/auth/\*\*"\s*\)\s*\.\s*permitAll\s*\(\s*\)'
              message: "Garde `/api/auth/**` en `permitAll()`."
            - pattern: 'requestMatchers\s*\(\s*"/api/admin/\*\*"\s*\)\s*\.\s*hasRole\s*\(\s*"ADMIN"\s*\)'
              message: "Ajoute `.requestMatchers(\"/api/admin/**\").hasRole(\"ADMIN\")`."
            - pattern: 'hasRole\s*\(\s*"ADMIN"\s*\)[\s\S]*anyRequest\s*\(\s*\)\s*\.\s*authenticated\s*\(\s*\)'
