      - code: sec-ss-q7
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: auth-jwt
        prompt: "Que signifie `SessionCreationPolicy.STATELESS` ?"
        choices:
          - label: "Le serveur ne garde aucune session : le jeton est vérifié à chaque requête"
            correct: true
            why: "Sans état."
          - label: "Le serveur garde une session par utilisatrice"
            correct: false
            why: "C'est l'inverse."
          - label: "Les requêtes sont interdites"
            correct: false
            why: "Aucun rapport."
        explanation: "API sans état + JWT."
      - code: sec-ss-q8
        kind: VRAI_FAUX
        difficulty: 2
        skill: auth-jwt
        prompt: "`anyRequest().permitAll()` est acceptable pour débloquer rapidement un problème en production."
        choices:
          - label: "Vrai"
            correct: false
            why: "Toute l'API serait ouverte."
          - label: "Faux"
            correct: true
            why: "On n'ouvre que le strict nécessaire."
        explanation: "Fermé par défaut."
    exercises:
      - slug: sec-ex-security-guide
        kind: COMPLETER
        title: "Compléter la configuration"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Complète : sans session, route publique, route administrateur, tout le reste authentifié."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Pas de session : STATELESS."
          - "Route ouverte : permitAll ; réservée : hasRole."
          - "STATELESS, permitAll, hasRole, authenticated."
        solution: '["STATELESS", "permitAll", "hasRole", "authenticated"]'
        explanation: "Sans état, public, réservé, authentifié : les quatre réglages de base."
        xp: 10
        payload:
          language: java
          template: |
            .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.[[1]]))
            .authorizeHttpRequests(auth -> auth
                .requestMatchers("/api/auth/**").[[2]]()
                .requestMatchers("/api/admin/**").[[3]]("ADMIN")
                .anyRequest().[[4]]())
          blanks:
            - ["STATELESS"]
            - ["permitAll"]
            - ["hasRole"]
            - ["authenticated"]
      - slug: sec-ex-security-libre
        kind: CODE_LIBRE
        title: "Les règles d'une API de réservation"
        difficulty: INTERMEDIAIRE
        skill: auth-jwt
        statement: |
          Écris le bloc `authorizeHttpRequests` :
          - `/api/auth/**` ouvert à tous ;
          - `GET /api/salles/**` ouvert à tous ;
          - `/api/admin/**` réservé au rôle `ADMIN` ;
          - tout le reste exige d'être authentifié.
        criteria: "Quatre règles dans le bon ordre."
        hints:
          - "`.requestMatchers(HttpMethod.GET, \"/api/salles/**\").permitAll()`"
          - "`.requestMatchers(\"/api/admin/**\").hasRole(\"ADMIN\")`"
          - "Termine par `.anyRequest().authenticated()`."
        solution: |
          .authorizeHttpRequests(auth -> auth
              .requestMatchers("/api/auth/**").permitAll()
              .requestMatchers(HttpMethod.GET, "/api/salles/**").permitAll()
              .requestMatchers("/api/admin/**").hasRole("ADMIN")
              .anyRequest().authenticated())
        explanation: "Du plus précis au plus général."
        xp: 20
        payload:
          language: java
          starter: |
            .authorizeHttpRequests(auth -> auth
            )
          checks:
            - pattern: 'requestMatchers\s*\(\s*"/api/auth/\*\*"\s*\)\s*\.\s*permitAll\s*\(\s*\)'
              message: "Ouvre /api/auth/** avec permitAll()."
            - pattern: 'requestMatchers\s*\(\s*HttpMethod\.GET\s*,\s*"/api/salles/\*\*"\s*\)\s*\.\s*permitAll\s*\(\s*\)'
              message: "Ouvre GET /api/salles/** avec permitAll()."
            - pattern: 'requestMatchers\s*\(\s*"/api/admin/\*\*"\s*\)\s*\.\s*hasRole\s*\(\s*"ADMIN"\s*\)'
              message: "Réserve /api/admin/** au rôle ADMIN."
            - pattern: 'hasRole\s*\(\s*"ADMIN"\s*\)[\s\S]*anyRequest\s*\(\s*\)\s*\.\s*authenticated\s*\(\s*\)'
              message: "Termine par .anyRequest().authenticated()."
      - slug: sec-ex-security-corriger
        kind: CORRIGER_ERREUR
        title: "Une porte grande ouverte"
        difficulty: INTERMEDIAIRE
        skill: auth-jwt
        statement: |
          Pour « faire marcher » l'application, quelqu'un a tout ouvert. Corrige les règles :
          - `/api/auth/**` reste public ;
          - `/api/admin/**` exige le rôle `ADMIN` ;
          - toutes les autres requêtes exigent d'être authentifié (au lieu de `permitAll`).
        criteria: "Plus de anyRequest().permitAll(), /api/admin/** en hasRole(\"ADMIN\"), anyRequest().authenticated() en dernier."
        hints:
          - "Ajoute `.requestMatchers(\"/api/admin/**\").hasRole(\"ADMIN\")` avant la dernière règle."
          - "Remplace `anyRequest().permitAll()` par `anyRequest().authenticated()`."
          - "L'ordre : auth, admin, puis anyRequest."
        solution: |
          .authorizeHttpRequests(auth -> auth
              .requestMatchers("/api/auth/**").permitAll()
              .requestMatchers("/api/admin/**").hasRole("ADMIN")
              .anyRequest().authenticated())
        explanation: "On n'ouvre que le strict nécessaire ; tout le reste est fermé par défaut."
        xp: 20
        payload:
          language: java
          starter: |
