slug: sec-authentification
position: 2
level: INTERMEDIAIRE
title: "Authentification et autorisation"
summary: "Distinguer qui on est et ce qu'on a le droit de faire, lire puis fabriquer un jeton JWT, écrire les règles de Spring Security et vérifier à qui appartient une ressource. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: sec-authn-authz
    title: "Authentification ou autorisation ?"
    duration: 9
    objective: "Distinguer l'authentification (qui es-tu ?) de l'autorisation (qu'as-tu le droit de faire ?) et leurs statuts 401 et 403."
    prerequisites: "Chapitre « Les bases de la sécurité »."
    skills: [auth-jwt]
    xp: 15
    memo: |
      - **Authentification** : prouver **qui** on est (e-mail + mot de passe, puis jeton). Échec → **401**.
      - **Autorisation** : savoir **ce qu'on a le droit** de faire (rôle, propriétaire). Refus → **403**.
      - On s'authentifie une fois ; l'autorisation est vérifiée à **chaque** action.
    commonMistakes: |
      - Répondre 401 à une personne connectée qui n'a pas le droit (c'est 403).
      - Croire qu'être connecté donne accès à tout.
    blocks:
      - type: definition
        id: def-authn-authz
        term: "Authentification et autorisation"
        md: |
          À l'entrée d'un **concert** : le vigile vérifie ta **pièce d'identité** (authentification : qui es-tu ?),
          puis ton **bracelet** dit si tu as accès à l'espace VIP (autorisation : qu'as-tu le droit de faire ?).
      - type: compare
        left:
          title: "401 : identité inconnue"
          code: |
            GET /api/emprunts
            (aucun jeton)
            → 401 Unauthorized
          language: text
        right:
          title: "403 : droit refusé"
          code: |
            DELETE /api/livres/3
            (jeton d'une adhérente USER)
            → 403 Forbidden
          language: text
      - type: question
        ref: sec-jwt-q1
        review: def-authn-authz
      - type: question
        ref: sec-ss-q5
        review: def-authn-authz
      - type: text
        md: "**Exercice 1 (guidé)** : authentification ou autorisation ?"
      - type: exercise
        ref: sec-ex-authn-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : le bon statut."
      - type: exercise
        ref: sec-ex-authn-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une confusion de statut."
      - type: exercise
        ref: sec-ex-authn-bug
      - type: quiz
        items:
          - ref: sec-aa-q3
            review: def-authn-authz
          - ref: sec-aa-q4
            review: def-authn-authz
          - ref: sec-aa-q5
            review: def-authn-authz
    questions:
      - code: sec-jwt-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: auth-jwt
        prompt: "Vérifier qu'un utilisateur connecté a le rôle ADMIN, c'est…"
        choices:
          - label: "de l'autorisation"
            correct: true
            why: "On décide de ses droits."
          - label: "de l'authentification"
            correct: false
            why: "Son identité est déjà prouvée."
          - label: "du chiffrement"
            correct: false
            why: "Aucun rapport."
        explanation: "Qui es-tu ? (authentification) puis Que peux-tu faire ? (autorisation)."
      - code: sec-ss-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: auth-jwt
        prompt: "Une requête sans jeton arrive sur une route qui exige d'être connecté. Quel statut ?"
        choices:
          - label: "401"
            correct: true
            why: "Identité inconnue."
          - label: "403"
            correct: false
            why: "403 = identité connue mais droit refusé."
          - label: "200"
            correct: false
            why: "La requête est refusée."
        explanation: "Pas de badge : 401. Mauvais badge : 403."
      - code: sec-aa-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: auth-jwt
        prompt: "Saisir son e-mail et son mot de passe, c'est…"
        choices:
          - label: "de l'authentification"
            correct: true
            why: "On prouve qui on est."
          - label: "de l'autorisation"
            correct: false
            why: "On ne parle pas encore des droits."
          - label: "du hachage"
            correct: false
            why: "Le hachage sert à stocker."
        explanation: "Identité d'abord."
      - code: sec-aa-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: auth-jwt
        prompt: "Être connectée donne automatiquement accès à toutes les pages d'administration."
        choices:
          - label: "Vrai"
            correct: false
            why: "Il faut aussi le bon rôle."
          - label: "Faux"
            correct: true
            why: "L'autorisation est vérifiée à chaque action."
        explanation: "Connecté ≠ autorisé."
      - code: sec-aa-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "À quel moment l'autorisation est-elle vérifiée ?"
        choices:
          - label: "À chaque action demandée"
            correct: true
            why: "Chaque route a ses règles."
          - label: "Une seule fois, à la connexion"
            correct: false
            why: "C'est l'authentification."
          - label: "Jamais côté serveur"
            correct: false
            why: "C'est justement le serveur qui décide."
        explanation: "S'identifier une fois, être contrôlé à chaque porte."
    exercises:
      - slug: sec-ex-authn-guide
        kind: COMPLETER
        title: "Authentification ou autorisation ?"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Complète chaque ligne avec authentification ou autorisation."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Qui es-tu ? → authentification."
          - "Qu'as-tu le droit de faire ? → autorisation."
          - "authentification, autorisation, autorisation."
        solution: '["authentification", "autorisation", "autorisation"]'
        explanation: "Identité, puis droits."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Vérifier l'e-mail et le mot de passe : [[1]]
            Exiger le rôle ADMIN pour supprimer un livre : [[2]]
            Refuser l'accès à l'emprunt d'une autre adhérente : [[3]]
          blanks:
            - ["authentification"]
            - ["autorisation"]
            - ["autorisation"]
      - slug: sec-ex-authn-libre
        kind: CODE_LIBRE
        title: "Le bon statut"
        difficulty: FACILE
        skill: auth-jwt
        statement: |
          Écris le statut (401 ou 403) pour chaque situation, sous la forme `lettre : statut` :
          - `a` : un jeton expiré ;
          - `b` : une adhérente connectée essaie de supprimer un livre ;
          - `c` : aucun jeton envoyé.
        criteria: "a : 401, b : 403, c : 401."
        hints:
          - "Un jeton expiré ne prouve plus l'identité."
          - "Une personne connectée sans le droit : 403."
          - "401, 403, 401."
        solution: |
          a : 401
          b : 403
          c : 401
        explanation: "Identité inconnue : 401 ; droit refusé : 403."
        xp: 15
        payload:
          language: text
          starter: |
            a :
            b :
            c :
          checks:
            - pattern: '(?m)^\s*a\s*:\s*401\s*$'
              message: "a : le jeton expiré ne prouve plus rien."
            - pattern: '(?m)^\s*b\s*:\s*403\s*$'
              message: "b : elle est connue, mais n'a pas le droit."
            - pattern: '(?m)^\s*c\s*:\s*401\s*$'
              message: "c : sans jeton, identité inconnue."
      - slug: sec-ex-authn-bug
        kind: CORRIGER_ERREUR
        title: "Une confusion de statut"
        difficulty: FACILE
        skill: auth-jwt
        statement: |
          Aucun jeton n'est envoyé, mais l'API répond 403. Corrige le statut.
        criteria: "401."
        hints:
          - "Le serveur sait-il qui fait la demande ?"
          - "Non : identité inconnue."
          - "401 Unauthorized."
        solution: |
          HTTP/1.1 401 Unauthorized
        explanation: "Sans jeton : 401."
        xp: 10
        payload:
          language: text
          starter: |
            HTTP/1.1 403 Forbidden
          checks:
            - pattern: '\b403\b'
              absent: true
              message: "403 veut dire « identité connue, droit refusé »."
            - pattern: 'HTTP/1\.1\s+401\b'
              message: "Écris HTTP/1.1 401 Unauthorized."

  # ===================================================================== LEÇON 2
  - slug: sec-jwt
    title: "Lire un jeton JWT"
    duration: 11
    objective: "Décrire les trois parties d'un JWT, savoir ce qui est lisible par tous et comment la signature le protège."
    prerequisites: "Leçon « Authentification ou autorisation ? »."
    skills: [auth-jwt]
    xp: 15
    memo: |
      - Un **JWT** a trois parties séparées par des points : **en-tête**.**contenu**.**signature**.
      - Le contenu est seulement **encodé** (Base64), pas chiffré : **tout le monde peut le lire**. Jamais de secret dedans.
      - La **signature** (HS256 + secret du serveur) prouve que personne n'a modifié le jeton.
      - Toujours une **expiration** courte (`exp`).
      - Le frontend l'envoie dans `Authorization: Bearer <jeton>`.
    commonMistakes: |
      - Mettre le mot de passe ou des données sensibles dans le JWT.
      - Un jeton sans date d'expiration.
    blocks:
      - type: text
        md: |
          Après la connexion, l'utilisatrice ne va pas retaper son mot de passe à chaque clic. Le serveur lui
          donne un **jeton** : une sorte de badge qu'elle montrera à chaque requête.
      - type: definition
        id: def-jwt
        term: "JWT (JSON Web Token)"
        md: |
          Un **bracelet de festival** avec un **sceau officiel**. N'importe qui peut lire ce qui est écrit
          dessus (nom, rôle, date de fin), mais personne ne peut le falsifier sans casser le sceau. Le serveur
          vérifie le sceau à chaque passage.
      - type: code
        id: code-jwt
        language: text
        title: "Un JWT décodé"
        code: |
          eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhd2FAZXhlbXBsZS5mciIsInJvbGUiOiJVU0VSIn0.k3Jx…

          En-tête   : { "alg": "HS256" }
          Contenu   : { "sub": "awa@exemple.fr", "role": "USER", "exp": … }
          Signature : produite avec le SECRET_DU_SERVEUR
        lines:
          - n: 1
            note: "Trois morceaux séparés par des points."
          - n: 3
            note: "L'algorithme de signature."
          - n: 4
            note: "`sub` : qui ; `role` : ses droits ; `exp` : date d'expiration. **Lisible par tous.**"
          - n: 5
            note: "Produite avec un secret que seul le serveur connaît. Si on change le rôle en ADMIN, la signature ne correspond plus."
      - type: question
        ref: sec-jwt-q2
        review: code-jwt
      - type: question
        ref: sec-jwt-q3
        review: def-jwt
      - type: text
        md: "**Exercice 1 (guidé)** : le voyage du jeton."
      - type: exercise
        ref: sec-ex-jwt-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : les trois parties."
      - type: exercise
        ref: sec-ex-jwt-parties
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un secret dans le jeton."
      - type: exercise
        ref: sec-ex-jwt-bug
      - type: jury
        items:
          - q: "Un JWT est-il chiffré ?"
            a: "Non, il est seulement encodé en Base64 et signé. Tout le monde peut lire son contenu, mais personne ne peut le modifier sans le secret. Je n'y mets donc aucune donnée sensible."
      - type: quiz
        items:
          - ref: sec-jwt-q4
            review: code-jwt
          - ref: sec-jwt-q5
            review: def-jwt
          - ref: sec-c2-b1
            review: def-jwt
    questions:
      - code: sec-jwt-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: auth-jwt
        prompt: "On peut stocker le mot de passe de l'utilisateur dans le contenu du JWT puisqu'il est signé."
        choices:
          - label: "Vrai"
            correct: false
            why: "Signé ne veut pas dire chiffré : tout le monde peut le lire."
          - label: "Faux"
            correct: true
            why: "Le contenu est seulement encodé en Base64."
        explanation: "Colle un JWT sur jwt.io : tout s'affiche en clair."
      - code: sec-jwt-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Un pirate modifie `\"role\": \"USER\"` en `\"ADMIN\"` dans son jeton. Que se passe-t-il ?"
        choices:
          - label: "La signature ne correspond plus : le serveur rejette le jeton (401)"
            correct: true
            why: "Il ne connaît pas le secret pour resigner."
          - label: "Il devient administrateur"
            correct: false
            why: "La signature l'en empêche."
          - label: "Le serveur corrige le rôle tout seul"
            correct: false
            why: "Il refuse simplement le jeton."
        explanation: "La signature garantit l'intégrité."
      - code: sec-jwt-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Pourquoi donner une expiration courte au jeton ?"
        choices:
          - label: "Un jeton volé ne sert que peu de temps"
            correct: true
            why: "On limite les dégâts."
          - label: "Pour que le jeton soit plus court"
            correct: false
            why: "La longueur ne change presque pas."
          - label: "Ce n'est pas utile"
            correct: false
            why: "Un jeton sans fin serait valable pour toujours."
        explanation: "Un JWT ne se révoque pas facilement : l'expiration est la protection principale."
      - code: sec-jwt-q5
        kind: TEXTE
        difficulty: 2
        skill: auth-jwt
        prompt: "Dans quel en-tête HTTP le frontend envoie-t-il le JWT ? (un mot)"
        answers: ["Authorization"]
        explanation: "`Authorization: Bearer eyJhbGciOi…`"
      - code: sec-c2-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Où garder le JWT côté Angular pour limiter le risque en cas de faille XSS ?"
        choices:
          - label: "En mémoire (un signal d'un service), avec une expiration courte"
            correct: true
            why: "Un script injecté aura plus de mal à le récupérer durablement."
          - label: "Dans le code source d'Angular"
            correct: false
            why: "Le jeton change à chaque connexion."
          - label: "Dans l'URL de chaque page"
            correct: false
            why: "Il apparaîtrait dans l'historique et les logs."
        explanation: "Le localStorage est pratique mais lisible par tout script de la page : c'est un compromis à justifier."
    exercises:
      - slug: sec-ex-jwt-ordre
        kind: REMETTRE_ORDRE
        title: "Le voyage du jeton"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Remets dans l'ordre les étapes, de la connexion à une requête protégée."
        criteria: "Connexion, vérification, émission, stockage, envoi, contrôle."
        hints:
          - "Tout commence par l'envoi de l'e-mail et du mot de passe."
          - "Le serveur vérifie l'empreinte avant de signer un jeton."
          - "Le jeton est vérifié à chaque requête suivante."
        solution: |
          Angular envoie e-mail et mot de passe à /api/auth/login
          L'API compare le mot de passe avec l'empreinte BCrypt
          L'API signe un JWT (e-mail, rôle, expiration) et le renvoie
          Angular garde le jeton en mémoire
          L'intercepteur ajoute Authorization: Bearer à chaque requête
          Le filtre JWT vérifie la signature et l'expiration
        explanation: "Connexion une seule fois, puis le jeton sert de badge."
        xp: 10
        payload:
          language: text
          lines:
            - "Angular envoie e-mail et mot de passe à /api/auth/login"
            - "L'API compare le mot de passe avec l'empreinte BCrypt"
            - "L'API signe un JWT (e-mail, rôle, expiration) et le renvoie"
            - "Angular garde le jeton en mémoire"
            - "L'intercepteur ajoute Authorization: Bearer à chaque requête"
            - "Le filtre JWT vérifie la signature et l'expiration"
      - slug: sec-ex-jwt-parties
        kind: CODE_LIBRE
        title: "Les trois parties"
        difficulty: FACILE
        skill: auth-jwt
        statement: |
          Écris le rôle de chaque partie d'un JWT, une ligne par partie :
          `En-tête : …`, `Contenu : …`, `Signature : …`. Tu dois parler de l'**algorithme**, de qui est la
          personne (**e-mail** ou **rôle**) et du **secret**.
        criteria: "Trois lignes : algorithme, e-mail/rôle, secret."
        hints:
          - "L'en-tête dit quel algorithme signe."
          - "Le contenu dit qui est la personne et son rôle."
          - "La signature est produite avec le secret du serveur."
        solution: |
          En-tête : l'algorithme de signature, par exemple HS256.
          Contenu : l'e-mail, le rôle et la date d'expiration, lisibles par tous.
          Signature : produite avec le secret du serveur, elle empêche toute modification.
        explanation: "Qui signe, ce qui est dit, la preuve."
        xp: 15
        payload:
          language: text
          starter: |
            En-tête :
            Contenu :
            Signature :
          checks:
            - pattern: '(?mi)^\s*En-t[êe]te\s*:[^\n]*algorithme'
              message: "En-tête : parle de l'algorithme."
            - pattern: '(?mi)^\s*Contenu\s*:[^\n]*(e-mail|email|r[ôo]le)'
              message: "Contenu : parle de l'e-mail ou du rôle."
            - pattern: '(?mi)^\s*Signature\s*:[^\n]*secret'
              message: "Signature : parle du secret du serveur."
      - slug: sec-ex-jwt-bug
        kind: CORRIGER_ERREUR
        title: "Un secret dans le jeton"
        difficulty: FACILE
        skill: auth-jwt
        statement: |
          Ce contenu de jeton contient le mot de passe, lisible par tous. Retire ce champ.
        criteria: "Plus de motDePasse dans le contenu."
        hints:
          - "Le contenu d'un JWT est lisible par tous."
          - "Aucun secret dedans."
          - "`{ \"sub\": \"awa@exemple.fr\", \"role\": \"USER\" }`"
        solution: |
          { "sub": "awa@exemple.fr", "role": "USER" }
        explanation: "Signé ne veut pas dire secret."
        xp: 10
        payload:
          language: text
          starter: |
            { "sub": "awa@exemple.fr", "role": "USER", "motDePasse": "Soleil2024" }
          checks:
            - pattern: '(?i)motDePasse|Soleil2024'
              absent: true
              message: "Retire le mot de passe du jeton."
            - pattern: '"sub"\s*:\s*"awa@exemple\.fr"'
              message: "Garde le sujet awa@exemple.fr."

  # ===================================================================== LEÇON 3
  - slug: sec-jwt-generer
    title: "Fabriquer un jeton avec jjwt"
    duration: 11
    objective: "Écrire la méthode qui génère un JWT signé avec un sujet, un rôle et une expiration."
    prerequisites: "Leçon « Lire un jeton JWT »."
    skills: [auth-jwt]
    xp: 15
    memo: |
      - `Jwts.builder()` … `.compact()` : on construit le jeton, puis on obtient son texte.
      - `.subject(email)` : qui ; `.claim("role", role)` : une information de plus.
      - `.issuedAt(...)` et `.expiration(...)` : quand il a été émis, jusqu'à quand il vaut.
      - `.signWith(cle)` : la clé vient d'un **secret long** placé dans une variable d'environnement.
    commonMistakes: |
      - Oublier l'expiration.
      - Un secret court ou écrit dans le code.
    blocks:
      - type: definition
        id: def-jjwt
        term: "Fabriquer un jeton"
        md: |
          Remplir un **bracelet** : écrire le nom, le rôle, la date de fin, puis apposer le **sceau** (la
          signature). `compact()` donne le bracelet prêt à porter.
      - type: code
        id: code-jjwt
        language: java
        title: "JwtService.java"
        code: |
          public String generer(Utilisateur u) {
              Instant maintenant = Instant.now();
              return Jwts.builder()
                      .subject(u.getEmail())
                      .claim("role", u.getRole().name())
                      .issuedAt(Date.from(maintenant))
                      .expiration(Date.from(maintenant.plus(1, ChronoUnit.HOURS)))
                      .signWith(cle)
                      .compact();
          }
        lines:
          - n: 3
            note: "On commence la construction."
          - n: 4
            note: "Le sujet : qui est la personne."
          - n: 5
            note: "Une information supplémentaire : son rôle."
          - n: 7
            note: "Valable une heure."
          - n: 8
            note: "Le sceau, avec la clé construite à partir du secret."
          - n: 9
            note: "Le jeton, en texte."
      - type: question
        ref: sec-c2-b2
        review: code-jjwt
      - type: question
        ref: sec-jg-q2
        review: def-jjwt
      - type: text
        md: "**Exercice 1 (guidé)** : complète la construction."
      - type: exercise
        ref: sec-ex-jjwt-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : générer un jeton."
      - type: exercise
        ref: sec-ex-jwt-generer
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un jeton éternel."
      - type: exercise
        ref: sec-ex-jjwt-bug
      - type: jury
        items:
          - q: "Comment fonctionne l'authentification dans votre application ?"
            a: "L'utilisatrice envoie e-mail et mot de passe à /api/auth/login. Le serveur vérifie l'empreinte BCrypt et renvoie un JWT signé en HS256, qui contient l'e-mail, le rôle et une expiration. Angular l'envoie ensuite dans l'en-tête Authorization grâce à un intercepteur ; un filtre Spring Security vérifie la signature et l'expiration à chaque requête."
      - type: quiz
        items:
          - ref: sec-jg-q3
            review: code-jjwt
          - ref: sec-jg-q4
            review: code-jjwt
          - ref: sec-jg-q5
            review: def-jjwt
    questions:
      - code: sec-c2-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Comment choisir le secret qui signe les jetons HS256 ?"
        choices:
          - label: "Un long secret aléatoire (au moins 256 bits), dans une variable d'environnement"
            correct: true
            why: "La bibliothèque jjwt refuse une clé trop courte."
          - label: "Un mot court et facile à retenir"
            correct: false
            why: "On pourrait le deviner et fabriquer de faux jetons."
          - label: "Peu importe"
            correct: false
            why: "Un secret faible casse toute la sécurité."
        explanation: "Exemple : `openssl rand -base64 48`, stocké dans une variable d'environnement."
      - code: sec-jg-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: auth-jwt
        prompt: "Que renvoie `.compact()` ?"
        choices:
          - label: "Le jeton sous forme de texte"
            correct: true
            why: "Prêt à être envoyé au frontend."
          - label: "Le mot de passe"
            correct: false
            why: "Jamais."
          - label: "Rien"
            correct: false
            why: "Il renvoie le jeton."
        explanation: "builder() … compact()."
      - code: sec-jg-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
