slug: sec-rgpd-jury
position: 4
level: EXAMEN
title: "RGPD, secrets et jury sécurité"
summary: "Collecter le moins de données possible, recueillir un vrai consentement, respecter les droits des personnes, garder les secrets hors du code, puis défendre ses choix de sécurité devant le jury. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: sec-rgpd-secrets
    title: "Données personnelles et minimisation"
    duration: 9
    objective: "Reconnaître une donnée personnelle et ne collecter que ce qui est nécessaire au service."
    prerequisites: "Chapitre « Les failles du Top 10 OWASP »."
    skills: [rgpd-secrets]
    xp: 15
    memo: |
      - Le **RGPD** est une loi européenne qui protège les personnes dont on enregistre les informations.
      - **Donnée personnelle** : toute information qui permet d'identifier une personne (nom, e-mail, adresse IP…).
      - **Minimisation** : ne collecter que ce qui est **nécessaire** au service.
      - **Durée de conservation** limitée, puis suppression ou anonymisation.
    commonMistakes: |
      - Demander la date de naissance « au cas où ».
      - Garder les données pour toujours.
    blocks:
      - type: text
        md: |
          Le **RGPD** (Règlement général sur la protection des données) est une loi européenne. Pour un
          développeur, il se traduit par des choix **très concrets**, dès le premier formulaire.
      - type: definition
        id: def-minimisation
        term: "Minimisation"
        md: |
          Faire ses **valises au plus juste** : on n'emporte que ce qui sert au voyage. Moins de données
          collectées, c'est moins de données à protéger… et moins à perdre en cas de fuite.
      - type: compare
        left:
          title: "Trop de données"
          code: |
            Inscription à une newsletter :
            - nom, prénom
            - e-mail
            - date de naissance
            - adresse postale
            - téléphone
          language: text
        right:
          title: "Minimisé"
          code: |
            Inscription à une newsletter :
            - e-mail
          language: text
      - type: question
        ref: sec-rg-q1
        review: def-minimisation
      - type: question
        ref: sec-c4-b1
        review: def-minimisation
      - type: text
        md: "**Exercice 1 (guidé)** : utile ou inutile ?"
      - type: exercise
        ref: sec-ex-minimisation-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un formulaire d'inscription minimal."
      - type: exercise
        ref: sec-ex-minimisation-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un formulaire trop curieux."
      - type: exercise
        ref: sec-ex-minimisation-bug
      - type: quiz
        items:
          - ref: sec-mi-q3
            review: def-minimisation
          - ref: sec-mi-q4
            review: def-minimisation
          - ref: sec-mi-q5
            review: def-minimisation
    questions:
      - code: sec-rg-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Pour une prise de rendez-vous chez un coiffeur, quelle donnée est inutile ?"
        choices:
          - label: "Le numéro de sécurité sociale"
            correct: true
            why: "Aucun rapport avec le service."
          - label: "Le prénom"
            correct: false
            why: "Utile pour accueillir la personne."
          - label: "Un moyen de contact"
            correct: false
            why: "Utile pour confirmer ou annuler."
        explanation: "Minimisation : seulement ce qui sert au service."
      - code: sec-c4-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Qu'est-ce qu'une donnée personnelle ?"
        choices:
          - label: "Toute information qui permet d'identifier une personne, directement ou non"
            correct: true
            why: "Nom, e-mail, adresse IP, identifiant…"
          - label: "Uniquement le nom et le prénom"
            correct: false
            why: "La définition est bien plus large."
          - label: "Uniquement les données bancaires"
            correct: false
            why: "Elles en font partie, mais ne sont pas les seules."
        explanation: "Une adresse IP ou un identifiant client sont aussi des données personnelles."
      - code: sec-mi-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Une adresse IP est une donnée personnelle."
        choices:
          - label: "Vrai"
            correct: true
            why: "Elle peut permettre d'identifier une personne."
          - label: "Faux"
            correct: false
            why: "Indirectement, elle identifie."
        explanation: "La définition est large."
      - code: sec-mi-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Pourquoi collecter moins de données protège-t-il les personnes ?"
        choices:
          - label: "Moins de données, c'est moins à perdre en cas de fuite"
            correct: true
            why: "Ce qu'on n'a pas ne peut pas fuir."
          - label: "Cela accélère l'application"
            correct: false
            why: "Ce n'est pas le but."
          - label: "Cela évite d'écrire des tests"
            correct: false
            why: "Aucun rapport."
        explanation: "La meilleure protection : ne pas collecter."
      - code: sec-mi-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Que faire des données quand leur durée de conservation est dépassée ?"
        choices:
          - label: "Les supprimer ou les anonymiser"
            correct: true
            why: "On ne garde pas pour toujours."
          - label: "Les garder au cas où"
            correct: false
            why: "Contraire au RGPD."
          - label: "Les publier"
            correct: false
            why: "Évidemment non."
        explanation: "Durée limitée, puis suppression."
    exercises:
      - slug: sec-ex-minimisation-guide
        kind: COMPLETER
        title: "Utile ou inutile ?"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: "Pour s'inscrire à une bibliothèque, complète avec utile ou inutile."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Il faut pouvoir contacter l'adhérente : e-mail utile."
          - "La situation familiale ne sert pas à emprunter."
          - "utile, inutile, inutile."
        solution: '["utile", "inutile", "inutile"]'
        explanation: "Seulement ce qui sert au service."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            E-mail : [[1]]
            Situation familiale : [[2]]
            Religion : [[3]]
          blanks:
            - ["utile"]
            - ["inutile"]
            - ["inutile"]
      - slug: sec-ex-minimisation-libre
        kind: CODE_LIBRE
        title: "Un formulaire d'inscription minimal"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: |
          Écris le record `InscriptionRequest` d'une bibliothèque en ligne avec seulement les champs utiles :
          `String email` et `String motDePasse`.
        criteria: "Deux champs seulement : email et motDePasse."
        hints:
          - "`public record InscriptionRequest(…) {}`"
          - "Seulement ce qui sert à se connecter."
          - "`String email, String motDePasse`"
        solution: |
          public record InscriptionRequest(String email, String motDePasse) {}
        explanation: "Le minimum pour ouvrir un compte."
        xp: 15
        payload:
          language: java
          starter: |
            public record InscriptionRequest() {}
          checks:
            - pattern: 'record\s+InscriptionRequest\s*\(\s*String\s+email\s*,\s*String\s+motDePasse\s*\)'
              message: "Écris record InscriptionRequest(String email, String motDePasse)."
      - slug: sec-ex-minimisation-bug
        kind: CORRIGER_ERREUR
        title: "Un formulaire trop curieux"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: |
          Ce DTO d'inscription à la newsletter demande la date de naissance et le téléphone, qui ne servent à
          rien. Garde seulement l'e-mail.
        criteria: "record NewsletterRequest(String email)."
        hints:
          - "Que faut-il pour envoyer une newsletter ?"
          - "Seulement un e-mail."
          - "`public record NewsletterRequest(String email) {}`"
        solution: |
          public record NewsletterRequest(String email) {}
        explanation: "Minimisation."
        xp: 10
        payload:
          language: java
          starter: |
            public record NewsletterRequest(String email, LocalDate naissance, String telephone) {}
          checks:
            - pattern: 'naissance|telephone'
              absent: true
              message: "Retire les champs inutiles."
            - pattern: 'record\s+NewsletterRequest\s*\(\s*String\s+email\s*\)'
              message: "Garde seulement String email."

  # ===================================================================== LEÇON 2
  - slug: sec-consentement
    title: "Le consentement"
    duration: 9
    objective: "Recueillir un consentement libre et éclairé, jamais précoché, et retirable."
    prerequisites: "Leçon « Données personnelles et minimisation »."
    skills: [rgpd-secrets]
    xp: 15
    memo: |
      - Le **consentement** est une des bases légales possibles (avec le contrat, l'obligation légale…).
      - Il doit être **libre**, **éclairé**, **spécifique** et **retirable** à tout moment.
      - Une case de consentement n'est **jamais précochée**.
      - Une mention explique la **finalité**, la **durée de conservation** et comment exercer ses **droits**.
    commonMistakes: |
      - Une case de consentement **précochée**.
      - Un consentement impossible à retirer.
    blocks:
      - type: definition
        id: def-consentement
        term: "Consentement"
        md: |
          Une **invitation** qu'on accepte volontairement : personne ne coche la case à ta place, tu sais à quoi
          tu t'engages, et tu peux changer d'avis plus tard.
      - type: code
        id: code-consentement
        language: html
        title: "Une case de consentement correcte"
        code: |
          <input id="offres" type="checkbox" formControlName="accepteOffres">
          <label for="offres">J'accepte de recevoir la lettre d'information.</label>
          <p>Vos données servent uniquement à cet envoi. Elles sont conservées 12 mois.
             Pour exercer vos droits, écrivez à dpo@exemple.fr.</p>
        lines:
          - n: 1
            note: "Pas d'attribut `checked` : la case est décochée par défaut."
          - n: 3
            note: "La mention : finalité, durée, droits."
      - type: question
        ref: sec-rg-q4
        review: def-consentement
      - type: question
        ref: sec-co-q2
        review: code-consentement
      - type: text
        md: "**Exercice 1 (guidé)** : les qualités du consentement."
      - type: exercise
        ref: sec-ex-consentement-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : la mention d'information."
      - type: exercise
        ref: sec-ex-mention-rgpd
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une case précochée."
      - type: exercise
        ref: sec-ex-consentement-bug
      - type: quiz
        items:
          - ref: sec-co-q3
            review: def-consentement
          - ref: sec-co-q4
            review: code-consentement
          - ref: sec-co-q5
            review: def-consentement
    questions:
      - code: sec-rg-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Une case « J'accepte de recevoir des offres » doit être…"
        choices:
          - label: "décochée par défaut"
            correct: true
            why: "Le consentement doit être un acte volontaire."
          - label: "cochée par défaut"
            correct: false
            why: "Un consentement précoché n'est pas valable."
          - label: "cachée"
            correct: false
            why: "Le consentement doit être éclairé."
        explanation: "Libre, éclairé, spécifique, et retirable à tout moment."
      - code: sec-co-q2
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Que doit indiquer la mention sous un formulaire ? (plusieurs réponses)"
        choices:
          - label: "Pourquoi les données sont collectées"
            correct: true
            why: "La finalité."
          - label: "Combien de temps elles sont gardées"
            correct: true
            why: "La durée de conservation."
          - label: "Comment exercer ses droits"
            correct: true
            why: "Un contact."
          - label: "Le mot de passe de la base"
            correct: false
            why: "Jamais."
        explanation: "Pourquoi, combien de temps, comment agir."
      - code: sec-co-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Une fois donné, le consentement ne peut plus être retiré."
        choices:
          - label: "Vrai"
            correct: false
            why: "Il est retirable à tout moment."
          - label: "Faux"
            correct: true
            why: "La personne peut changer d'avis."
        explanation: "Retirer doit être aussi simple que donner."
      - code: sec-co-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Quel attribut HTML rendrait la case précochée (et donc non conforme) ?"
        choices:
          - label: "`checked`"
            correct: true
            why: "Il coche la case par défaut."
          - label: "`id`"
            correct: false
            why: "Il identifie le champ."
          - label: "`type`"
            correct: false
            why: "Il indique le type du champ."
        explanation: "Pas de checked sur un consentement."
      - code: sec-co-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Que veut dire « consentement éclairé » ?"
        choices:
          - label: "La personne sait clairement à quoi elle consent"
            correct: true
            why: "Une information simple et visible."
          - label: "La case est en couleur"
            correct: false
            why: "L'apparence ne compte pas."
          - label: "Le consentement est donné la nuit"
            correct: false
            why: "Aucun rapport."
        explanation: "Informer avant de demander."
    exercises:
      - slug: sec-ex-consentement-guide
        kind: COMPLETER
        title: "Les qualités du consentement"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: "Complète avec : libre, éclairé, retirable."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Sans pression : libre."
          - "En connaissance de cause : éclairé ; on peut changer d'avis : retirable."
          - "libre, éclairé, retirable."
        solution: '["libre", "éclairé", "retirable"]'
        explanation: "Trois qualités à retenir en les comprenant."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Personne ne force la personne : consentement [[1]]
            Elle sait à quoi elle s'engage : consentement [[2]]
            Elle peut changer d'avis : consentement [[3]]
          blanks:
            - ["libre"]
            - ["éclairé", "eclaire"]
            - ["retirable"]
      - slug: sec-ex-mention-rgpd
        kind: CODE_LIBRE
        title: "La mention d'information"
        difficulty: INTERMEDIAIRE
        skill: rgpd-secrets
        statement: |
          Rédige la courte mention affichée sous un formulaire de contact. Elle doit indiquer : **pourquoi**
          les données sont collectées (la finalité), **combien de temps** elles sont conservées (une durée en
          mois ou en ans), et **comment** exercer ses droits (une adresse de contact). Utilise les mots
          « finalité » ou « pour », « conservées » et « droits ».
        criteria: "Finalité, durée chiffrée, droits et moyen de contact."
        hints:
          - "Commence par : « Vos données sont utilisées uniquement pour répondre à votre message. »"
          - "Ajoute : « Elles sont conservées 12 mois. »"
          - "Termine par : « Pour exercer vos droits (accès, effacement), écrivez à dpo@exemple.fr. »"
        solution: |
          Vos données sont utilisées uniquement pour répondre à votre message.
          Elles sont conservées 12 mois puis supprimées.
          Pour exercer vos droits d'accès, de rectification et d'effacement, écrivez à dpo@exemple.fr.
        explanation: "Trois informations, en langage simple : pourquoi, combien de temps, comment agir."
        xp: 20
        payload:
          language: text
          starter: |
            Vos données sont utilisées
          checks:
            - pattern: '(?i)finalit[ée]|\bpour\b'
              message: "Indique pourquoi les données sont collectées (la finalité)."
            - pattern: '(?i)conserv[ée]es?\s+[^.]*?\d+\s*(?:mois|ans?|jours?)'
              message: "Indique une durée de conservation chiffrée (par exemple « conservées 12 mois »)."
            - pattern: '(?i)droits?'
              message: "Parle des droits des personnes."
            - pattern: '[\w.+-]+@[\w-]+\.[\w.]+'
              message: "Donne une adresse de contact pour exercer ses droits."
      - slug: sec-ex-consentement-bug
        kind: CORRIGER_ERREUR
        title: "Une case précochée"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: |
          Cette case de consentement est cochée par défaut : le consentement n'est pas valable. Retire
          l'attribut qui la coche.
        criteria: "Plus de checked."
        hints:
          - "Quel attribut coche une case ?"
          - "checked."
          - "Retire checked."
        solution: |
          <input id="offres" type="checkbox" formControlName="accepteOffres">
        explanation: "La personne coche elle-même."
        xp: 10
        payload:
          language: html
          starter: |
            <input id="offres" type="checkbox" formControlName="accepteOffres" checked>
          checks:
            - pattern: '\bchecked\b'
              absent: true
              message: "Retire l'attribut checked."
            - pattern: '<input[^>]*type="checkbox"[^>]*formControlName="accepteOffres"'
              message: "Garde la case à cocher."

  # ===================================================================== LEÇON 3
  - slug: sec-droits
    title: "Les droits des personnes"
    duration: 11
    objective: "Permettre à chacun de voir, corriger, exporter et supprimer ses données, en respectant les obligations légales."
    prerequisites: "Leçon « Le consentement »."
    skills: [rgpd-secrets]
    xp: 15
    memo: |
      - **Droits** : accès, rectification, effacement, portabilité, opposition.
      - Dans l'application : une page « Mon compte » avec consultation, modification, export et suppression.
      - La personne est identifiée par son **jeton** : elle n'agit que sur **ses** données.
      - Les données qu'une loi oblige à garder (factures) sont **anonymisées** plutôt que supprimées.
    commonMistakes: |
      - Pas de moyen de supprimer son compte.
      - Supprimer des factures que la loi oblige à conserver.
    blocks:
      - type: definition
        id: def-droits
        term: "Les droits des personnes"
        md: |
          Chaque personne peut demander : **voir** ses données (accès), les **corriger** (rectification), les
          **effacer** (droit à l'oubli), les **récupérer** dans un format lisible (portabilité). Dans
          l'application : une page « Mon compte » avec export et suppression.
      - type: code
        id: code-suppression
        language: java
        title: "Supprimer son compte"
        code: |
          @DeleteMapping("/api/moi")
          public ResponseEntity<Void> supprimerMonCompte(Authentication auth) {
              service.supprimerCompte(auth.getName());
              return ResponseEntity.noContent().build();
          }

          @Transactional
          public void supprimerCompte(String email) {
              Utilisateur u = utilisateurs.findByEmail(email).orElseThrow();
              factures.anonymiserClient(u.getId());
              utilisateurs.delete(u);
          }
        lines:
          - n: 2
            note: "L'utilisateur est identifié par son jeton : il ne peut supprimer que **son** compte."
          - n: 10
            note: "Les factures doivent être gardées (obligation légale) : on les **anonymise** au lieu de les supprimer."
          - n: 11
            note: "Puis on supprime le compte et ses données personnelles."
      - type: question
        ref: sec-rg-q2
        review: code-suppression
      - type: question
        ref: sec-rg-q3
        review: def-droits
      - type: text
        md: "**Exercice 1 (guidé)** : un droit par demande."
      - type: exercise
        ref: sec-ex-droits-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : supprimer son compte."
      - type: exercise
        ref: sec-ex-droits-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : supprimer le compte d'un autre."
      - type: exercise
        ref: sec-ex-droits-bug
      - type: jury
        items:
          - q: "Comment avez-vous pris en compte le RGPD ?"
            a: "Minimisation (seulement les champs utiles), consentement explicite non précoché, mots de passe hachés, HTTPS, droits limités par rôle, et une page Mon compte pour consulter, modifier, exporter et supprimer ses données. Les données obligatoires comme les factures sont anonymisées plutôt que supprimées."
      - type: quiz
        items:
          - ref: sec-rg-q5
            review: def-droits
          - ref: sec-dr-q4
            review: code-suppression
          - ref: sec-dr-q5
            review: def-droits
    questions:
      - code: sec-rg-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Pour respecter le droit à l'effacement, on doit aussi supprimer les factures, même si la loi impose de les garder."
        choices:
          - label: "Vrai"
            correct: false
            why: "Une obligation légale de conservation s'applique."
          - label: "Faux"
            correct: true
            why: "On les garde, en retirant ce qui n'est pas nécessaire (anonymisation partielle)."
        explanation: "Le RGPD s'articule avec les autres lois."
      - code: sec-rg-q3
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Quels droits le RGPD donne-t-il aux personnes ? (plusieurs réponses)"
        choices:
          - label: "Accéder à leurs données"
            correct: true
            why: "Droit d'accès."
          - label: "Les faire effacer"
            correct: true
            why: "Droit à l'effacement."
          - label: "Les récupérer dans un format lisible"
            correct: true
            why: "Droit à la portabilité."
          - label: "Lire les données des autres utilisateurs"
            correct: false
            why: "Au contraire : chacun ne voit que les siennes."
        explanation: "Aussi : rectification, opposition, limitation."
      - code: sec-rg-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Quel droit permet de récupérer ses données dans un format lisible (JSON, CSV) ?"
        choices:
          - label: "La portabilité"
            correct: true
            why: "Pour les emporter ailleurs."
          - label: "La rectification"
            correct: false
            why: "C'est corriger."
          - label: "L'opposition"
            correct: false
            why: "C'est refuser un traitement."
        explanation: "Un bouton « Exporter mes données »."
      - code: sec-dr-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "D'où vient l'e-mail du compte à supprimer dans `DELETE /api/moi` ?"
        choices:
          - label: "Du jeton vérifié (`auth.getName()`)"
            correct: true
            why: "Chacun ne supprime que son compte."
          - label: "D'un paramètre envoyé par le client"
            correct: false
            why: "N'importe qui pourrait supprimer le compte d'un autre."
          - label: "De la configuration"
            correct: false
            why: "Aucun rapport."
        explanation: "Identité = jeton vérifié."
      - code: sec-dr-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: rgpd-secrets
        prompt: "L'application doit offrir un moyen simple de supprimer son compte."
        choices:
          - label: "Vrai"
            correct: true
            why: "C'est le droit à l'effacement."
          - label: "Faux"
            correct: false
            why: "Le RGPD l'exige."
        explanation: "Une page « Mon compte » avec suppression."
    exercises:
      - slug: sec-ex-droits-guide
        kind: COMPLETER
        title: "Un droit par demande"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: "Complète avec : accès, rectification, effacement."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Voir ses données : accès."
          - "Corriger : rectification ; supprimer : effacement."
          - "accès, rectification, effacement."
        solution: '["accès", "rectification", "effacement"]'
        explanation: "Voir, corriger, supprimer."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            « Montrez-moi ce que vous savez de moi » : droit d'[[1]]
            « Mon adresse e-mail a changé » : droit de [[2]]
            « Supprimez mon compte » : droit à l'[[3]]
          blanks:
            - ["accès", "acces"]
            - ["rectification"]
            - ["effacement"]
      - slug: sec-ex-droits-libre
        kind: CODE_LIBRE
        title: "Supprimer son compte"
        difficulty: INTERMEDIAIRE
        skill: rgpd-secrets
        statement: |
          Écris la méthode de contrôleur `@DeleteMapping("/api/moi")` `supprimerMonCompte(Authentication auth)` qui
          appelle `service.supprimerCompte(auth.getName())` et répond 204.
        criteria: "@DeleteMapping(\"/api/moi\"), auth.getName(), 204."
        hints:
          - "`@DeleteMapping(\"/api/moi\")`"
          - "`service.supprimerCompte(auth.getName());`"
          - "`return ResponseEntity.noContent().build();`"
        solution: |
          @DeleteMapping("/api/moi")
          public ResponseEntity<Void> supprimerMonCompte(Authentication auth) {
              service.supprimerCompte(auth.getName());
              return ResponseEntity.noContent().build();
          }
        explanation: "L'identité vient du jeton."
        xp: 15
        payload:
          language: java
          starter: |
            public ResponseEntity<Void> supprimerMonCompte(Authentication auth) {

            }
          checks:
            - pattern: '@DeleteMapping\s*\(\s*"/api/moi"\s*\)'
              message: "Ajoute @DeleteMapping(\"/api/moi\")."
            - pattern: 'service\.supprimerCompte\s*\(\s*auth\.getName\s*\(\s*\)\s*\)'
              message: "Appelle service.supprimerCompte(auth.getName())."
            - pattern: 'noContent\s*\(\s*\)\s*\.build\s*\(\s*\)'
              message: "Réponds 204 : ResponseEntity.noContent().build()."
      - slug: sec-ex-droits-bug
        kind: CORRIGER_ERREUR
        title: "Supprimer le compte d'un autre"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: |
          Cette route supprime le compte dont l'e-mail est envoyé en paramètre : n'importe qui peut supprimer
