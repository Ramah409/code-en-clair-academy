            - pattern: 'supprimerMonCompte\s*\(\s*Authentication\s+auth\s*\)'
              message: "Reçois Authentication auth."
            - pattern: 'service\.supprimerCompte\s*\(\s*auth\.getName\s*\(\s*\)\s*\)'
              message: "Appelle service.supprimerCompte(auth.getName())."

  # ===================================================================== LEÇON 4
  - slug: sec-secrets
    title: "Garder les secrets hors du code"
    duration: 9
    objective: "Ranger les secrets dans des variables d'environnement, ignorer .env et partager un .env.example factice."
    prerequisites: "Leçon « Les droits des personnes »."
    skills: [rgpd-secrets]
    xp: 15
    memo: |
      - **Secrets** : mots de passe de base, clé JWT, clés d'API.
      - En local : un fichier `.env`, listé dans `.gitignore`.
      - Dans Git : un `.env.example` avec des **valeurs factices**, pour guider l'équipe.
      - En production : les secrets du serveur ou de la CI.
    commonMistakes: |
      - Un fichier `.env` poussé sur GitHub.
      - Des vrais secrets dans `.env.example`.
    blocks:
      - type: definition
        id: def-secrets
        term: "Secret"
        md: |
          La **combinaison d'un coffre** : on ne l'écrit pas sur le coffre lui-même (le code), on la garde à part
          (l'environnement). Le mode d'emploi du coffre (`.env.example`) peut être partagé : il ne contient pas la
          combinaison.
      - type: code
        id: code-secrets
        language: text
        title: "Trois fichiers, trois rôles"
        code: |
          # .gitignore
          .env

          # .env (jamais dans Git)
          JWT_SECRET=vraie-valeur-longue-et-aleatoire

          # .env.example (dans Git)
          JWT_SECRET=a-generer
        lines:
          - n: 2
            note: "Git ignore le fichier des vrais secrets."
          - n: 5
            note: "La vraie valeur, seulement sur ta machine."
          - n: 8
            note: "Une valeur factice, pour que l'équipe sache quoi remplir."
      - type: question
        ref: sec-c4-b2
        review: code-secrets
      - type: question
        ref: sec-se-q2
        review: def-secrets
      - type: text
        md: "**Exercice 1 (guidé)** : ranger les secrets."
      - type: exercise
        ref: sec-ex-secrets-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un .env.example."
      - type: exercise
        ref: sec-ex-secrets-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un .env oublié."
      - type: exercise
        ref: sec-ex-secrets-bug
      - type: jury
        items:
          - q: "Où sont stockés vos secrets ?"
            a: "Dans des variables d'environnement : un fichier .env local ignoré par Git, et les secrets du serveur ou de GitHub Actions en production. Le dépôt ne contient qu'un .env.example avec des valeurs factices."
      - type: quiz
        items:
          - ref: sec-se-q3
            review: code-secrets
          - ref: sec-se-q4
            review: def-secrets
          - ref: sec-se-q5
            review: code-secrets
    questions:
      - code: sec-c4-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Que contient le fichier `.env.example` versionné dans Git ?"
        choices:
          - label: "Les noms des variables avec des valeurs factices"
            correct: true
            why: "Il guide l'équipe sans révéler de secret."
          - label: "Les vrais mots de passe de production"
            correct: false
            why: "Jamais de vrai secret dans Git."
          - label: "Rien, il est vide"
            correct: false
            why: "Il liste les variables attendues."
        explanation: "`DB_PASSWORD=change-moi`, `JWT_SECRET=a-generer`…"
      - code: sec-se-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Où ranger le mot de passe de la base en local ?"
        choices:
          - label: "Dans un fichier .env ignoré par Git"
            correct: true
            why: "Il reste sur ta machine."
          - label: "Dans le code Java"
            correct: false
            why: "Il partirait dans Git."
          - label: "Dans le README"
            correct: false
            why: "Il serait public."
        explanation: ".env + .gitignore."
      - code: sec-se-q3
        kind: TEXTE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Quel fichier liste les fichiers que Git doit ignorer, comme .env ? (son nom exact)"
        answers: [".gitignore", "gitignore"]
        explanation: "Ajoute `.env` dans `.gitignore` avant le premier commit."
      - code: sec-se-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Supprimer un secret dans un nouveau commit suffit à le protéger."
        choices:
          - label: "Vrai"
            correct: false
            why: "L'historique Git le garde."
          - label: "Faux"
            correct: true
            why: "Il faut le changer."
        explanation: "Un secret exposé est un secret à remplacer."
      - code: sec-se-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Où sont les secrets en production ?"
        choices:
          - label: "Dans les variables d'environnement du serveur ou de la CI"
            correct: true
            why: "Jamais dans le dépôt."
          - label: "Dans le fichier .env.example"
            correct: false
            why: "Il ne contient que des valeurs factices."
          - label: "Dans le code compilé"
            correct: false
            why: "On pourrait les extraire."
        explanation: "Secrets du serveur, de Render, de GitHub Actions…"
    exercises:
      - slug: sec-ex-secrets-guide
        kind: COMPLETER
        title: "Ranger les secrets"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: "Complète : le fichier ignoré par Git, puis la référence au secret dans la configuration."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le fichier des secrets locaux s'appelle .env."
          - "La configuration lit une variable avec ${NOM}."
          - ".env, ${JWT_SECRET}, .env.example."
        solution: '[".env", "${JWT_SECRET}", ".env.example"]'
        explanation: "Secrets en local dans .env (ignoré), modèle factice versionné dans .env.example."
        xp: 10
        payload:
          language: text
          template: |
            # .gitignore
            [[1]]

            # application.properties
            app.jwt-secret=[[2]]

            # fichier versionné, avec des valeurs factices, pour guider l'équipe
            [[3]]
          blanks:
            - [".env"]
            - ["${JWT_SECRET}"]
            - [".env.example"]
      - slug: sec-ex-secrets-libre
        kind: CODE_LIBRE
        title: "Un .env.example"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: |
          Écris un `.env.example` avec les variables `DB_PASSWORD` et `JWT_SECRET`, et des valeurs **factices** :
          `change-moi` et `a-generer`.
        criteria: "Deux variables avec des valeurs factices."
        hints:
          - "Une variable par ligne : NOM=valeur."
          - "`DB_PASSWORD=change-moi`"
          - "`JWT_SECRET=a-generer`"
        solution: |
          DB_PASSWORD=change-moi
          JWT_SECRET=a-generer
        explanation: "L'équipe sait quoi remplir, sans aucun secret."
        xp: 15
        payload:
          language: properties
          starter: |
            DB_PASSWORD=
          checks:
            - pattern: '(?m)^\s*DB_PASSWORD\s*=\s*change-moi\s*$'
              message: "DB_PASSWORD=change-moi"
            - pattern: '(?m)^\s*JWT_SECRET\s*=\s*a-generer\s*$'
              message: "JWT_SECRET=a-generer"
      - slug: sec-ex-secrets-bug
        kind: CORRIGER_ERREUR
        title: "Un .env oublié"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: |
          Ce `.gitignore` oublie le fichier des secrets : il partirait sur GitHub au prochain commit. Ajoute la
          ligne qui l'ignore.
        criteria: ".env dans .gitignore."
        hints:
          - "Quel fichier contient les vrais secrets ?"
          - ".env."
          - "Ajoute une ligne `.env`."
        solution: |
          node_modules/
          target/
          .env
        explanation: "Git ne verra jamais ce fichier."
        xp: 10
        payload:
          language: text
          starter: |
            node_modules/
            target/
          checks:
            - pattern: '(?m)^\s*\.env\s*$'
              message: "Ajoute une ligne .env."

  # ===================================================================== LEÇON 5
  - slug: sec-questions-jury
    title: "La sécurité devant le jury"
    duration: 11
    objective: "Présenter la sécurité de son application couche par couche et répondre honnêtement sur une limite."
    prerequisites: "Leçon « Garder les secrets hors du code »."
    skills: [securite-owasp, oral-cda]
    xp: 20
    memo: |
      - Présenter la sécurité **couche par couche** : navigateur → réseau → API → base → configuration.
      - Pour chaque couche : **la menace**, **la parade**, **où dans le code**.
      - Admettre une limite connue et dire comment on l'améliorerait : c'est un signe de maturité.
    commonMistakes: |
      - Dire « c'est sécurisé » sans exemple.
      - Cacher une faiblesse que le jury trouvera en posant une question.
    blocks:
      - type: text
        md: |
          Devant le jury, la sécurité se raconte comme une **visite guidée** : on suit une requête depuis le
          navigateur jusqu'à la base, et on montre les protections à chaque étape.
      - type: steps
        id: etapes-presentation
        title: "La visite guidée en cinq étapes"
        items:
          - "**Navigateur** : Angular échappe l'affichage (XSS), les gardes masquent les écrans non autorisés."
          - "**Réseau** : HTTPS chiffre les échanges, CORS limite les origines."
          - "**API** : filtre JWT (signature, expiration), rôles, vérification de propriété, validation @Valid."
          - "**Base** : requêtes paramétrées, mots de passe BCrypt, compte aux droits limités, contraintes."
          - "**Configuration** : secrets en variables d'environnement, erreurs sans trace, dépendances à jour."
      - type: question
        ref: sec-jq-q1
        review: etapes-presentation
      - type: jury
        id: jury-securite
        title: "Questions fréquentes sur la sécurité"
        items:
          - q: "Que se passe-t-il si votre clé JWT fuit ?"
            a: "N'importe qui pourrait fabriquer des jetons valides. Je change immédiatement la clé : tous les jetons existants deviennent invalides et les utilisateurs se reconnectent. Je cherche ensuite l'origine de la fuite."
          - q: "Comment déconnecter un utilisateur avec un JWT ?"
            a: "Côté client, on supprime le jeton. Côté serveur, un JWT reste valide jusqu'à son expiration : c'est pourquoi elle est courte. Pour une révocation immédiate, on peut tenir une liste de jetons révoqués ou utiliser des jetons de rafraîchissement stockés en base."
          - q: "Quelle est la limite de sécurité de votre projet ?"
            a: "Par exemple : pas encore de limitation du nombre de tentatives de connexion. Je l'ajouterais avec un blocage temporaire par adresse IP et par compte."
      - type: question
        ref: sec-jq-q2
        review: jury-securite
      - type: text
        md: "**Exercice 1 (guidé)** : remets la visite guidée dans l'ordre."
      - type: exercise
        ref: sec-ex-visite-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : parler d'une limite."
      - type: exercise
        ref: sec-ex-limite
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une réponse sans preuve."
      - type: exercise
        ref: sec-ex-jury-bug
      - type: quiz
        items:
          - ref: sec-jq-q3
            review: jury-securite
          - ref: sec-jq-q4
            review: etapes-presentation
          - ref: sec-jq-q5
            review: jury-securite
    questions:
      - code: sec-jq-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Quelle présentation de la sécurité convainc le mieux le jury ?"
        choices:
          - label: "Suivre une requête couche par couche en montrant la menace, la parade et le code"
            correct: true
            why: "Concret et structuré."
          - label: "Dire que l'application est sécurisée car elle utilise Spring"
            correct: false
            why: "Aucune preuve."
          - label: "Réciter le Top 10 OWASP par cœur"
            correct: false
            why: "Il faut le relier à son projet."
        explanation: "Menace → parade → où dans le code."
      - code: sec-jq-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "La clé de signature JWT a fuité. Première action ?"
        choices:
          - label: "Changer la clé : tous les anciens jetons deviennent invalides"
            correct: true
            why: "On coupe l'accès aux faux jetons."
          - label: "Attendre l'expiration des jetons"
            correct: false
            why: "L'attaquant peut en créer de nouveaux à volonté."
          - label: "Supprimer les comptes"
            correct: false
            why: "Disproportionné et inutile."
        explanation: "Un secret compromis se remplace immédiatement."
      - code: sec-jq-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: auth-jwt
        prompt: "Supprimer le JWT du navigateur le rend immédiatement invalide côté serveur."
        choices:
          - label: "Vrai"
            correct: false
            why: "Une copie du jeton reste valide jusqu'à son expiration."
          - label: "Faux"
            correct: true
            why: "Le serveur ne garde pas de liste des jetons, sauf si on l'ajoute."
        explanation: "D'où l'intérêt d'une expiration courte."
      - code: sec-jq-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "À quelle couche appartient la protection « requêtes paramétrées » ?"
        choices:
          - label: "L'accès à la base de données"
            correct: true
            why: "Elle protège contre l'injection SQL."
          - label: "Le navigateur"
            correct: false
            why: "Le navigateur n'écrit pas de SQL."
          - label: "Le réseau"
            correct: false
            why: "C'est le rôle de HTTPS."
        explanation: "Chaque parade a sa place dans la visite guidée."
      - code: sec-jq-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: oral-cda
        prompt: "Le jury demande une faiblesse de votre sécurité. Que répondre ?"
        choices:
          - label: "Une limite réelle et la façon dont vous la corrigeriez"
            correct: true
            why: "Cela montre du recul et de la méthode."
          - label: "« Il n'y en a aucune »"
            correct: false
            why: "Peu crédible : le jury en trouvera une."
          - label: "Changer de sujet"
            correct: false
            why: "Le jury le remarquera."
        explanation: "Admettre une limite, c'est prouver qu'on comprend le sujet."
    exercises:
      - slug: sec-ex-visite-ordre
        kind: REMETTRE_ORDRE
        title: "La visite guidée"
        difficulty: FACILE
        skill: oral-cda
        statement: "Remets les couches dans l'ordre du voyage d'une requête."
        criteria: "Navigateur, réseau, API, base, configuration."
        hints:
          - "La requête part du navigateur."
          - "Elle traverse le réseau avant d'arriver à l'API."
          - "La configuration concerne l'ensemble : on la présente en dernier."
        solution: |
          Navigateur : Angular échappe l'affichage et masque les écrans interdits
          Réseau : HTTPS et CORS
          API : filtre JWT, rôles, propriété, validation
          Base : requêtes paramétrées et BCrypt
          Configuration : secrets en variables d'environnement
        explanation: "Suivre la requête rend la présentation facile à comprendre."
        xp: 10
        payload:
          language: text
          lines:
            - "Navigateur : Angular échappe l'affichage et masque les écrans interdits"
            - "Réseau : HTTPS et CORS"
            - "API : filtre JWT, rôles, propriété, validation"
            - "Base : requêtes paramétrées et BCrypt"
            - "Configuration : secrets en variables d'environnement"
      - slug: sec-ex-limite
        kind: CODE_LIBRE
        title: "Parler d'une limite"
        difficulty: INTERMEDIAIRE
        skill: oral-cda
        statement: |
          Question du jury : « **Quelle est la principale limite de sécurité de votre application ?** »

          Réponds en trois lignes : `Limite :`, `Risque :`, `Amélioration :`.
        criteria: "Les trois temps sont présents avec une vraie phrase chacun."
        hints:
          - "Limite : par exemple, aucune limitation des tentatives de connexion."
          - "Risque : une attaque par force brute sur un compte."
          - "Amélioration : bloquer temporairement après plusieurs échecs, par adresse IP et par compte."
        solution: |
          Limite : il n'y a pas encore de limitation du nombre de tentatives de connexion.
          Risque : un attaquant pourrait essayer de nombreux mots de passe sur un même compte.
          Amélioration : bloquer temporairement après plusieurs échecs, par adresse IP et par compte, et journaliser ces blocages.
        explanation: "Limite, risque, amélioration : une réponse honnête et professionnelle."
        xp: 20
        payload:
          language: text
          starter: |
            Limite :
            Risque :
            Amélioration :
          checks:
            - pattern: '(?im)^\s*Limite\s*:\s*\S.{15,}'
              message: "Décris la limite après « Limite : »."
            - pattern: '(?im)^\s*Risque\s*:\s*\S.{15,}'
              message: "Décris le risque après « Risque : »."
            - pattern: '(?im)^\s*Am[ée]lioration\s*:\s*\S.{15,}'
              message: "Décris l'amélioration après « Amélioration : »."
      - slug: sec-ex-jury-bug
        kind: CORRIGER_ERREUR
        title: "Une réponse sans preuve"
        difficulty: FACILE
        skill: oral-cda
        statement: |
          Cette réponse dit seulement « c'est sécurisé ». Complète la ligne `Parade :` avec une vraie protection
          de ton projet, qui cite `BCrypt` ou `JWT`.
        criteria: "La ligne Parade cite BCrypt ou JWT avec une vraie phrase."
        hints:
          - "Le jury veut une preuve concrète."
          - "Cite une protection et où elle se trouve."
          - "Parade : les mots de passe sont hachés avec BCrypt dans le service d'inscription."
        solution: |
          Menace : vol de la base de données.
          Parade : les mots de passe sont hachés avec BCrypt dans le service d'inscription.
        explanation: "Menace, parade, où dans le code."
        xp: 10
        payload:
          language: text
          starter: |
            Menace : vol de la base de données.
            Parade : c'est sécurisé.
          checks:
            - pattern: "(?i)c'est\\s+s[ée]curis[ée]"
              absent: true
              message: "« C'est sécurisé » ne prouve rien."
            - pattern: '(?im)^\s*Parade\s*:[^\n]*(BCrypt|JWT)[^\n]{10,}'
              message: "Dans la ligne Parade, cite BCrypt ou JWT et où c'est fait."

