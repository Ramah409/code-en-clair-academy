        criteria: "auth.getName(), plus de @RequestParam email."
        hints:
          - "Qui a le droit de supprimer ce compte ?"
          - "Seulement la personne connectée."
          - "`service.supprimerCompte(auth.getName());`"
        solution: |
          @DeleteMapping("/api/moi")
          public ResponseEntity<Void> supprimerMonCompte(Authentication auth) {
              service.supprimerCompte(auth.getName());
              return ResponseEntity.noContent().build();
          }
        explanation: "Chacun ne supprime que son propre compte."
        xp: 10
        payload:
          language: java
          starter: |
            @DeleteMapping("/api/moi")
            public ResponseEntity<Void> supprimerMonCompte(@RequestParam String email) {
                service.supprimerCompte(email);
                return ResponseEntity.noContent().build();
            }
          checks:
