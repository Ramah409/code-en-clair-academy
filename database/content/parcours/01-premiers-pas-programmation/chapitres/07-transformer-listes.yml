      - slug: prog-ex-find-libre
        kind: CODE_LIBRE
        title: "Trouver un produit par son nom"
        difficulty: FACILE
        skill: javascript-bases
        statement: |
          Avec la liste fournie, trouve le produit dont le nom est `"Sac"` avec `find`, range-le dans
          `produit`, puis affiche sa couleur.
        criteria: "find avec une comparaison sur le nom, puis affichage de la couleur."
        hints:
          - "`produits.find(p => ...)`"
          - "Le test : `p.nom === \"Sac\"`."
          - "`console.log(produit.couleur);`"
        solution: |
          const produits = [
            { nom: "Alarme", couleur: "rouge" },
            { nom: "Sac", couleur: "noir" }
          ];
          const produit = produits.find(p => p.nom === "Sac");
          console.log(produit.couleur);
        explanation: "find renvoie la fiche du sac : on lit sa couleur."
        xp: 15
        payload:
          language: javascript
          starter: |
            const produits = [
              { nom: "Alarme", couleur: "rouge" },
              { nom: "Sac", couleur: "noir" }
            ];

          checks:
            - pattern: '(const|let)\s+produit\s*=\s*produits\.find\s*\('
              message: "Range le résultat : const produit = produits.find(...)."
            - pattern: '\.nom\s*===\s*["''`]Sac["''`]'
              message: "Le test : p.nom === \"Sac\"."
            - pattern: 'console\.log\s*\(\s*produit\.couleur\s*\)'
              message: "Affiche produit.couleur."
          output: "noir"
      - slug: prog-ex-find-bug
        kind: CORRIGER_ERREUR
        title: "filter au lieu de find"
        difficulty: INTERMEDIAIRE
        skill: javascript-bases
        statement: |
          Ce programme affiche `undefined` au lieu de `Dakar` : filter renvoie une **liste**, qui n'a pas de
          propriété ville. Utilise la méthode qui renvoie **un seul** élément.
        criteria: "La recherche utilise find."
        hints:
          - "On veut une seule fiche, pas une liste."
          - "La méthode qui s'arrête au premier trouvé."
          - "`membres.find(m => m.prenom === \"Awa\")`"
        solution: |
          const membres = [
            { prenom: "Awa", ville: "Dakar" },
            { prenom: "Léo", ville: "Nantes" }
          ];
          const awa = membres.find(m => m.prenom === "Awa");
          console.log(awa.ville);
        explanation: "find renvoie la fiche elle-même : on peut lire sa ville."
        xp: 15
        payload:
          language: javascript
          starter: |
            const membres = [
              { prenom: "Awa", ville: "Dakar" },
              { prenom: "Léo", ville: "Nantes" }
            ];
            const awa = membres.filter(m => m.prenom === "Awa");
            console.log(awa.ville);
          checks:
            - pattern: 'membres\.find\s*\('
              message: "Utilise find pour obtenir une seule fiche."
            - pattern: 'membres\.filter\s*\('
              absent: true
              message: "filter renvoie une liste : ici il faut find."
          output: "Dakar"

  # ===================================================================== LEÇON 4
  - slug: prog-reduce
    title: "Tout assembler en une valeur : reduce"
    duration: 11
    objective: "Parcourir une liste en gardant un résultat qui s'enrichit à chaque élément, avec reduce."
    prerequisites: "Leçon « Trouver un élément : find »."
    skills: [javascript-bases]
    xp: 15
    memo: |
      - `liste.reduce((acc, x) => acc + x, depart)` part de `depart`, puis ajoute chaque élément à `acc`.
      - `acc` (l'**accumulateur**) garde le résultat en cours.
      - Le second argument (`depart`) est la valeur de départ : ne l'oublie pas.
      - À la fin, il ne reste **qu'une seule valeur**.
    commonMistakes: |
      - Oublier la valeur de départ.
      - Confondre l'ordre des paramètres : d'abord `acc`, ensuite l'élément.
    blocks:
      - type: text
        md: |
          Parfois, on veut **résumer** toute une liste en **une seule** valeur : une phrase avec tous les
          prénoms, une liste de mots collés… C'est le travail de `reduce`.
      - type: definition
        id: def-reduce
        term: "reduce (assembler)"
        md: |
          Un **collier** : on part d'un fil vide (la valeur de départ), puis on enfile les perles une à une.
          À la fin, il ne reste qu'un seul objet : le collier. `acc`, c'est le collier en cours de fabrication.
      - type: code
        id: code-reduce
        language: javascript
        title: "Une phrase avec tous les invités"
        code: |
          const prenoms = ["Awa", "Léo", "Inès"];
          const phrase = prenoms.reduce((acc, p) => acc + p + " ", "Invités : ");
          console.log(phrase);
        lines:
          - n: 2
            note: "`acc` démarre à « Invités : » (le dernier argument). À chaque tour, on colle le prénom et un espace."
          - n: 3
            note: "Affiche : Invités : Awa Léo Inès"
      - type: demo
        title: "Essaie"
        md: "Change la valeur de départ, par exemple `\"Présents : \"`."
        language: javascript
        code: |
          const prenoms = ["Awa", "Léo", "Inès"];
          const phrase = prenoms.reduce((acc, p) => acc + p + " ", "Invités : ");
          console.log(phrase);
      - type: question
        ref: prog-m-q3
        review: def-reduce
      - type: question
        ref: prog-rd-q2
        review: code-reduce
      - type: text
        md: "**Exercice 1 (guidé)** : filter, map ou reduce ?"
      - type: exercise
        ref: prog-ex-methodes-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un mot de passe fabriqué avec des initiales."
      - type: exercise
        ref: prog-ex-reduce-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une valeur de départ oubliée."
      - type: exercise
        ref: prog-ex-reduce-bug
      - type: quiz
        items:
          - ref: prog-rd-q3
            review: def-reduce
          - ref: prog-rd-q4
            review: code-reduce
          - ref: prog-rd-q5
            review: def-reduce
    questions:
      - code: prog-m-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: javascript-bases
        prompt: "Que vaut `[\"a\", \"b\", \"c\"].reduce((acc, l) => acc + l, \"x\")` ?"
        snippet: "[\"a\", \"b\", \"c\"].reduce((acc, l) => acc + l, \"x\")"
        language: javascript
        choices:
          - label: "\"xabc\""
            correct: true
            why: "Départ « x », puis on colle a, b et c."
          - label: "\"abc\""
            correct: false
            why: "La valeur de départ est « x » : elle est au début du résultat."
          - label: "[\"xa\", \"xb\", \"xc\"]"
            correct: false
            why: "reduce renvoie une seule valeur, pas une liste."
        explanation: "Le second argument de reduce est la valeur de départ de l'accumulateur."
      - code: prog-rd-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: javascript-bases
        prompt: "Que contient `acc` pendant un reduce ?"
        choices:
          - label: "Le résultat en cours de fabrication"
            correct: true
            why: "Le collier qui s'allonge perle après perle."
          - label: "L'élément du tour en cours"
            correct: false
            why: "C'est le deuxième paramètre."
          - label: "La liste d'origine"
            correct: false
            why: "acc contient le résultat qui se construit."
        explanation: "acc = accumulateur."
      - code: prog-rd-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: javascript-bases
        prompt: "Combien de valeurs reste-t-il à la fin d'un reduce ?"
        choices:
          - label: "Une seule"
            correct: true
            why: "Toute la liste est résumée en une valeur."
          - label: "Autant que d'éléments"
            correct: false
            why: "Ça, c'est map."
          - label: "Aucune"
            correct: false
            why: "reduce renvoie le résultat final."
        explanation: "reduce = tout assembler en une valeur."
      - code: prog-rd-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: javascript-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const mots = ["bon", "jour"];
          console.log(mots.reduce((acc, m) => acc + m, ""));
        language: javascript
        choices:
          - label: "bonjour"
            correct: true
            why: "Départ vide, puis on colle bon et jour."
          - label: "bon jour"
            correct: false
            why: "Aucun espace n'est ajouté."
          - label: "[\"bon\", \"jour\"]"
            correct: false
            why: "reduce renvoie une seule valeur."
        explanation: "Avec un départ vide, reduce colle simplement les éléments."
      - code: prog-rd-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: javascript-bases
        prompt: "Le dernier argument de reduce est la valeur de départ."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le fil vide du collier."
          - label: "Faux"
            correct: false
            why: "C'est bien la valeur de départ de acc."
        explanation: "`reduce((acc, x) => ..., depart)`."
    exercises:
      - slug: prog-ex-methodes-guide
        kind: COMPLETER
        title: "La bonne méthode"
        difficulty: FACILE
        skill: javascript-bases
        statement: "Complète chaque ligne avec filter, map ou reduce."
        criteria: "Les trois méthodes sont correctes."
        hints:
          - "Garder certains éléments : filter."
          - "Transformer chaque élément : map."
          - "filter, map, reduce."
        solution: '["filter", "map", "reduce"]'
        explanation: "Garder → filter, transformer → map, assembler → reduce."
        xp: 10
        payload:
          language: javascript
          template: |
            const prenoms = ["Awa", "Léo", "Inès"];
            const sansLeo = prenoms.[[1]](p => p !== "Léo");
            const enMajuscules = prenoms.[[2]](p => p.toUpperCase());
            const phrase = prenoms.[[3]]((acc, p) => acc + p + " ", "");
          blanks:
            - ["filter"]
            - ["map"]
            - ["reduce"]
      - slug: prog-ex-reduce-libre
        kind: CODE_LIBRE
        title: "Un code fait d'initiales"
        difficulty: INTERMEDIAIRE
        skill: javascript-bases
        statement: |
          Avec `const prenoms = ["Awa", "Léo", "Inès"];`, fabrique avec `reduce` le texte `ALI` : on part
          d'un texte vide et on colle la **première lettre** (`p[0]`) de chaque prénom. Affiche le résultat.
        criteria: "Un reduce qui part de \"\" et colle p[0], résultat affiché."
        hints:
          - "`prenoms.reduce((acc, p) => ..., \"\")`"
          - "À chaque tour : `acc + p[0]`."
          - "`const code = prenoms.reduce((acc, p) => acc + p[0], \"\");`"
        solution: |
          const prenoms = ["Awa", "Léo", "Inès"];
          const code = prenoms.reduce((acc, p) => acc + p[0], "");
          console.log(code);
        explanation: "Départ vide, puis A, puis L, puis I : ALI."
        xp: 20
        payload:
          language: javascript
          starter: |
            const prenoms = ["Awa", "Léo", "Inès"];

          checks:
            - pattern: 'prenoms\.reduce\s*\('
              message: "Utilise prenoms.reduce(...)."
            - pattern: '\w+\s*\+\s*\w+\s*\[\s*0\s*\]'
              message: "À chaque tour, colle la première lettre : acc + p[0]."
            - pattern: ',\s*["''`]["''`]\s*\)'
              message: "Pars d'un texte vide : dernier argument \"\"."
          output: "ALI"
      - slug: prog-ex-reduce-bug
        kind: CORRIGER_ERREUR
        title: "Une valeur de départ oubliée"
        difficulty: INTERMEDIAIRE
        skill: javascript-bases
        statement: |
          Ce programme doit afficher `Au menu : riz poulet salade `. Sans valeur de départ, reduce utilise le
          premier plat comme départ, et « Au menu : » n'apparaît jamais. Ajoute la valeur de départ
          `"Au menu : "`.
        criteria: "reduce a pour dernier argument \"Au menu : \"."
        hints:
          - "La valeur de départ est le dernier argument de reduce."
          - "Elle se place après la fonction fléchée, séparée par une virgule."
          - "`plats.reduce((acc, p) => acc + p + \" \", \"Au menu : \")`"
        solution: |
          const plats = ["riz", "poulet", "salade"];
          const menu = plats.reduce((acc, p) => acc + p + " ", "Au menu : ");
          console.log(menu);
        explanation: "Le fil de départ du collier, c'est « Au menu : »."
        xp: 15
        payload:
          language: javascript
          starter: |
            const plats = ["riz", "poulet", "salade"];
            const menu = plats.reduce((acc, p) => acc + p + " ");
            console.log(menu);
          checks:
            - pattern: ',\s*["''`]Au menu : ["''`]\s*\)'
              message: "Ajoute la valeur de départ \"Au menu : \" en dernier argument."
          output: "Au menu : riz poulet salade"

