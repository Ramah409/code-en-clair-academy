        kind: COMPLETER
        title: "Compléter la recherche"
        difficulty: FACILE
        skill: javascript-bases
        statement: "Complète pour trouver la tâche nommée « Coder » et afficher si elle est terminée."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Trouver un seul élément : find."
          - "Comparer deux textes : ===."
          - "find, ===."
        solution: '["find", "==="]'
        explanation: "`taches.find(t => t.nom === \"Coder\")`"
        xp: 10
        payload:
