      - slug: prog-ex-initiale-securisee
        kind: CODE_LIBRE
        title: "Une initiale qui ne plante jamais"
        difficulty: INTERMEDIAIRE
        skill: algo-bases
        statement: |
          Écris `initiale(prenom)` :
          - si le prénom est vide (`""`), renvoie `"?"` (cas limite) ;
          - sinon, renvoie sa première lettre en majuscule.

          Teste avec `"awa"` (résultat `A`) et avec `""` (résultat `?`).
        criteria: "Cas du prénom vide traité en premier ; première lettre en majuscule ; deux tests."
        hints:
          - "Commence par `if (prenom === \"\") { return \"?\"; }`."
          - "La première lettre, c'est `prenom[0]` ; en majuscule : `prenom[0].toUpperCase()`."
          - "Puis `console.log(initiale(\"awa\"));` et `console.log(initiale(\"\"));`"
        solution: |
          function initiale(prenom) {
            if (prenom === "") {
              return "?";
            }
            return prenom[0].toUpperCase();
          }
          console.log(initiale("awa"));
          console.log(initiale(""));
        explanation: "Sans le test du prénom vide, `prenom[0]` vaudrait `undefined` et `toUpperCase()` ferait planter le programme."
        xp: 25
        payload:
          language: javascript
          starter: |
            // Ta fonction initiale

          checks:
            - pattern: 'function\s+initiale\s*\(\s*\w+\s*\)|const\s+initiale\s*='
              message: "Déclare function initiale(prenom)."
            - pattern: '\w+\s*===?\s*["''`]["''`]|\w+\.length\s*===?\s*0|!\s*\w+\s*\)'
              message: "Traite d'abord le cas du prénom vide : if (prenom === \"\")."
            - pattern: 'return\s+["''`]\?["''`]'
              message: "Pour un prénom vide, renvoie \"?\"."
            - pattern: '\w+\s*\[\s*0\s*\]\s*\.toUpperCase\s*\(\s*\)'
              message: "Renvoie la première lettre en majuscule : prenom[0].toUpperCase()."
            - pattern: 'initiale\s*\(\s*["''`]["''`]\s*\)'
              message: "Teste le cas limite : initiale(\"\")."
          output: |
            A
            ?
      - slug: prog-ex-cas-limite-bug
        kind: CORRIGER_ERREUR
        title: "Un cas limite oublié"
        difficulty: INTERMEDIAIRE
        skill: algo-bases
        statement: |
          Cette fonction renvoie le premier invité en majuscules. Avec une liste **vide**, elle plante
          (« Cannot read properties of undefined »). Ajoute le cas limite : si la liste est vide, renvoie
          `"Personne"`.
        criteria: "La liste vide est traitée avant de lire invites[0]."
        hints:
          - "Une liste vide a une longueur de 0."
          - "Traite ce cas au tout début de la fonction."
          - "`if (invites.length === 0) { return \"Personne\"; }`"
        solution: |
          function premierInvite(invites) {
            if (invites.length === 0) {
              return "Personne";
            }
            return invites[0].toUpperCase();
          }
          console.log(premierInvite(["awa", "léo"]));
          console.log(premierInvite([]));
        explanation: "Le cas limite est traité d'abord : la fonction ne plante plus."
        xp: 20
        payload:
          language: javascript
          starter: |
            function premierInvite(invites) {
              return invites[0].toUpperCase();
            }
            console.log(premierInvite(["awa", "léo"]));
            console.log(premierInvite([]));
          checks:
            - pattern: 'if\s*\(\s*invites\.length\s*===?\s*0\s*\)|if\s*\(\s*!\s*invites\.length\s*\)'
              message: "Teste la liste vide : if (invites.length === 0)."
            - pattern: 'return\s+["''`]Personne["''`]'
              message: "Pour une liste vide, renvoie \"Personne\"."
          output: |
            AWA
            Personne

