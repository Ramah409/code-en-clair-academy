slug: prog-organiser-code
position: 3
level: INTERMEDIAIRE
title: "Organiser son code"
summary: "Écrire des fonctions réutilisables, décrire des choses avec des objets et transformer des listes avec filter, map et reduce."
quizQuestionCount: 10

lessons:
  # ===================================================================== LEÇON 1
  - slug: prog-fonctions
    title: "Les fonctions : des recettes réutilisables"
    duration: 12
    objective: "Déclarer une fonction avec des paramètres, l'appeler et utiliser sa valeur de retour."
    prerequisites: "Chapitre « Décider et répéter »."
    skills: [algo-fonctions]
    xp: 20
    memo: |
      - Une **fonction** regroupe des instructions sous un nom, pour les réutiliser.
      - `function saluer(prenom) { return "Bonjour " + prenom; }` : `prenom` est un **paramètre**.
      - On l'**appelle** avec un **argument** : `saluer("Awa")`.
      - `return` renvoie un résultat **et** arrête la fonction.
      - Écriture courte (fonction fléchée) : `const double = (n) => n * 2;`
    commonMistakes: |
      - Oublier `return` : la fonction renvoie `undefined`.
      - Afficher (`console.log`) au lieu de renvoyer (`return`) : on ne peut plus réutiliser le résultat.
      - Déclarer la fonction sans jamais l'appeler.
    blocks:
      - type: text
        md: |
          Quand on répète souvent les mêmes instructions, on les range dans une **fonction**. On l'écrit une
          fois, on l'utilise autant qu'on veut.
      - type: definition
        id: def-fonction
        term: "Fonction"
        md: |
          Une **recette** avec un nom. On lui donne des **ingrédients** (les paramètres), elle fait son
          travail et rend un **plat** (la valeur de retour). La machine à café : on met une capsule, elle
          rend un café.
      - type: code
        id: code-fonction
        language: javascript
        title: "Une fonction qui calcule un prix TTC"
        code: |
          function prixTTC(prixHT) {
            return prixHT * 1.2;
          }

          const prix = prixTTC(50);
          console.log(prix);
          console.log(prixTTC(10));
        lines:
          - n: 1
            note: "`function` + le nom + les **paramètres** entre parenthèses : `prixHT` est une variable qui recevra la valeur donnée à l'appel."
          - n: 2
            note: "`return` renvoie le résultat du calcul à celui qui a appelé la fonction."
          - n: 5
            note: "L'**appel** : 50 est l'**argument**. Le résultat (60) est rangé dans `prix`."
          - n: 7
            note: "Réutilisation immédiate : affiche 12."
      - type: demo
        title: "Crée tes appels"
        language: javascript
        code: |
          function prixTTC(prixHT) {
            return prixHT * 1.2;
          }
          console.log(prixTTC(50));
          console.log(prixTTC(99.99));
      - type: question
        ref: prog-f-q1
        review: def-fonction
      - type: compare
        left:
          title: "Fonction classique"
          code: |
            function double(n) {
              return n * 2;
            }
          language: javascript
        right:
          title: "Fonction fléchée (même résultat)"
          code: |
            const double = (n) => n * 2;
          language: javascript
      - type: callout
        variant: info
        title: "return ou console.log ?"
        md: |
          `console.log` **montre** une valeur à l'écran. `return` la **rend** au programme, qui peut la
          réutiliser (la ranger, la comparer, la passer à une autre fonction). Une bonne fonction calcule et
          rend ; c'est l'appelant qui décide de l'afficher.
      - type: question
        ref: prog-f-q2
        review: code-fonction
      - type: text
        md: "Exercice guidé : complète une fonction qui calcule l'aire d'un rectangle."
      - type: exercise
        ref: prog-ex-fonction-guide
      - type: text
        md: "En autonomie : écris une fonction qui dit si une personne est majeure."
      - type: exercise
        ref: prog-ex-majeur
      - type: jury
        items:
          - q: "Quelle différence entre un paramètre et un argument ?"
            a: "Le paramètre est le nom utilisé dans la définition de la fonction (`prixHT`) ; l'argument est la valeur réelle donnée lors de l'appel (`50`)."
          - q: "Pourquoi découper son code en fonctions ?"
            a: "Pour éviter de répéter du code, donner un nom clair à chaque action, et pouvoir tester chaque morceau séparément."
      - type: quiz
        items:
          - ref: prog-f-q3
            review: code-fonction
          - ref: prog-f-q4
            review: def-fonction
          - ref: prog-f-q5
            review: code-fonction
    questions:
      - code: prog-f-q1
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          function carre(n) {
            return n * n;
          }
          console.log(carre(4));
        language: javascript
        choices:
          - label: "16"
            correct: true
            why: "4 × 4."
          - label: "8"
            correct: false
            why: "Ce serait n + n."
          - label: "carre(4)"
            correct: false
            why: "La fonction est appelée : on affiche son résultat."
        explanation: "L'appel `carre(4)` exécute la fonction avec n = 4 et renvoie 16."
      - code: prog-f-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          function ajouter(a, b) {
            console.log(a + b);
          }
          const resultat = ajouter(2, 3);
          console.log(resultat);
        language: javascript
        choices:
          - label: "5 puis undefined"
            correct: true
            why: "La fonction affiche 5 mais ne renvoie rien : resultat vaut undefined."
          - label: "5 puis 5"
            correct: false
            why: "Il manque `return` pour que resultat vaille 5."
          - label: "undefined"
            correct: false
            why: "Le console.log interne affiche d'abord 5."
        explanation: "Sans `return`, une fonction renvoie `undefined`."
      - code: prog-f-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Dans `function saluer(prenom) { ... }`, que représente `prenom` ?"
        choices:
          - label: "Un paramètre : la valeur reçue lors de l'appel"
            correct: true
            why: "Oui."
          - label: "Le nom de la fonction"
            correct: false
            why: "Le nom de la fonction est `saluer`."
          - label: "La valeur renvoyée"
            correct: false
            why: "La valeur renvoyée suit `return`."
        explanation: "Les paramètres sont les « ingrédients » attendus par la fonction."
      - code: prog-f-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-fonctions
        prompt: "Une fonction déclarée mais jamais appelée ne s'exécute jamais."
        choices:
          - label: "Vrai"
            correct: true
            why: "La déclaration ne fait que préparer la recette."
          - label: "Faux"
            correct: false
            why: "Il faut l'appeler pour l'exécuter."
        explanation: "Déclarer, c'est écrire la recette ; appeler, c'est cuisiner."
      - code: prog-f-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Quelle fonction fléchée renvoie la moitié d'un nombre ?"
        choices:
          - label: "`const moitie = (n) => n / 2;`"
            correct: true
            why: "Paramètre n, résultat n / 2 renvoyé automatiquement."
          - label: "`const moitie = n / 2;`"
            correct: false
            why: "Ce n'est pas une fonction."
          - label: "`const moitie = (n) => { n / 2 };`"
            correct: false
            why: "Avec des accolades, il faut écrire `return`."
        explanation: "Sans accolades, la fonction fléchée renvoie l'expression ; avec accolades, il faut `return`."
    exercises:
      - slug: prog-ex-fonction-guide
        kind: COMPLETER
        title: "L'aire d'un rectangle"
        difficulty: FACILE
        skill: algo-fonctions
        statement: "Complète la fonction et son appel."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot-clé qui déclare une fonction."
          - "Le mot-clé qui renvoie le résultat."
          - "function, return, aire."
        solution: '["function", "return", "aire"]'
        explanation: "`function aire(l, h) { return l * h; }` puis `aire(4, 3)` renvoie 12."
        xp: 10
        payload:
          language: javascript
          template: |
            [[1]] aire(largeur, hauteur) {
              [[2]] largeur * hauteur;
            }
            console.log([[3]](4, 3));
          blanks:
            - ["function"]
            - ["return"]
            - ["aire"]
      - slug: prog-ex-majeur
        kind: CODE_LIBRE
        title: "La fonction estMajeur"
        difficulty: FACILE
        skill: algo-fonctions
        statement: |
          Écris une fonction `estMajeur(age)` qui **renvoie** `true` si l'âge est supérieur ou égal à 18,
          sinon `false`. Appelle-la avec 16 et avec 20 et affiche les résultats.
        criteria: "Une fonction estMajeur avec paramètre age, un return, deux appels."
        hints:
          - "`function estMajeur(age) { ... }`"
          - "La comparaison `age >= 18` vaut déjà true ou false : on peut la renvoyer directement."
          - "`return age >= 18;` puis `console.log(estMajeur(16));` et `console.log(estMajeur(20));`"
        solution: |
          function estMajeur(age) {
            return age >= 18;
          }
          console.log(estMajeur(16));
          console.log(estMajeur(20));
        explanation: "Une comparaison est déjà un booléen : pas besoin de `if` pour renvoyer true ou false."
        xp: 20
        payload:
          language: javascript
          starter: |
            // Ta fonction ici

          checks:
            - pattern: 'function\s+estMajeur\s*\(\s*age\s*\)|const\s+estMajeur\s*=\s*\(?\s*age\s*\)?\s*=>'
              message: "Déclare la fonction : function estMajeur(age) { ... }"
            - pattern: 'return\b[^;]*age\s*>=\s*18|=>\s*age\s*>=\s*18'
              message: "Renvoie le résultat de la comparaison : return age >= 18;"
            - pattern: 'estMajeur\s*\(\s*16\s*\)'
              message: "Appelle la fonction avec 16."
            - pattern: 'estMajeur\s*\(\s*20\s*\)'
              message: "Appelle la fonction avec 20."
          output: |
            false
            true

  # ===================================================================== LEÇON 2
  - slug: prog-objets
    title: "Les objets : décrire une chose"
    duration: 11
    objective: "Créer un objet avec des propriétés, lire et modifier ses valeurs, et ranger des objets dans une liste."
    prerequisites: "Leçon « Les fonctions »."
    skills: [algo-fonctions]
    xp: 20
    memo: |
      - Un **objet** regroupe des informations sur une même chose : `{ nom: "Awa", age: 25 }`.
      - Chaque information est une **propriété** : un nom (clé) et une valeur.
      - Lire : `personne.nom` ; modifier : `personne.age = 26;`.
      - Une liste d'objets : `[{ nom: "Awa" }, { nom: "Léo" }]` — la forme des données JSON échangées par les API.
    commonMistakes: |
      - Confondre crochets (tableau) et accolades (objet).
      - Oublier la virgule entre deux propriétés.
      - Lire une propriété mal orthographiée : on obtient `undefined`, sans erreur.
    blocks:
      - type: text
        md: |
          Un produit a un nom, un prix, un stock. Plutôt que trois variables séparées, on les regroupe dans
          un **objet**.
      - type: definition
        id: def-objet
        term: "Objet"
        md: |
          Une **fiche d'identité** : une série de lignes « nom : valeur ». La fiche d'un livre contient son
          titre, son auteur, son nombre de pages. En JavaScript, elle s'écrit entre accolades `{ }`.
      - type: code
        id: code-objet
        language: javascript
        title: "La fiche d'un produit"
        code: |
          const produit = {
            nom: "Alarme de poche",
            prix: 15,
            enStock: true
          };
          console.log(produit.nom);
          produit.prix = 12;
          console.log(`${produit.nom} : ${produit.prix} €`);
        lines:
          - n: 1
            note: "Un objet s'écrit entre accolades."
          - n: 2
            note: "Une **propriété** : la clé `nom`, deux-points, la valeur. Une virgule sépare les propriétés."
          - n: 6
            note: "On lit une propriété avec un point : `produit.nom`."
          - n: 7
            note: "On la modifie de la même façon."
      - type: question
        ref: prog-o-q1
        review: def-objet
      - type: definition
        id: def-liste-objets
        term: "Liste d'objets"
        md: |
          Un tableau dont chaque case contient une fiche. C'est exactement la forme des données qu'une API
          renvoie en JSON : `[{ "nom": "Awa" }, { "nom": "Léo" }]`.
      - type: demo
        title: "Parcourir une liste de produits"
        language: javascript
        code: |
          const produits = [
            { nom: "Alarme", prix: 15 },
            { nom: "Coque SOS", prix: 10 },
            { nom: "Sac antivol", prix: 20 }
          ];
          for (const p of produits) {
            console.log(`${p.nom} coûte ${p.prix} €`);
          }
      - type: question
        ref: prog-o-q2
        review: def-liste-objets
      - type: text
        md: "Exercice guidé : complète l'objet d'un livre."
      - type: exercise
        ref: prog-ex-objet-guide
      - type: text
        md: "En autonomie : calcule la valeur totale d'un stock de produits."
      - type: exercise
        ref: prog-ex-stock
      - type: jury
        items:
          - q: "Quel lien entre un objet JavaScript et le JSON ?"
            a: "Le JSON reprend la syntaxe des objets JavaScript pour échanger des données en texte : clés entre guillemets, valeurs simples, objets et tableaux imbriqués."
      - type: quiz
        items:
          - ref: prog-o-q3
            review: code-objet
          - ref: prog-o-q4
            review: code-objet
          - ref: prog-o-q5
            review: def-objet
    questions:
      - code: prog-o-q1
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const livre = { titre: "Dune", pages: 600 };
          console.log(livre.pages);
        language: javascript
        choices:
          - label: "600"
            correct: true
            why: "On lit la propriété pages."
          - label: "Dune"
            correct: false
            why: "C'est la propriété titre."
          - label: "livre.pages"
            correct: false
            why: "Sans guillemets, c'est la valeur qui est affichée."
        explanation: "`objet.propriete` lit une valeur."
      - code: prog-o-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Comment lire le nom du deuxième produit de `produits` ?"
        choices:
          - label: "`produits[1].nom`"
            correct: true
            why: "Indice 1 pour le deuxième, puis la propriété."
          - label: "`produits.nom[1]`"
            correct: false
            why: "La liste n'a pas de propriété nom."
          - label: "`produits[2].nom`"
            correct: false
            why: "L'indice 2 est le troisième."
        explanation: "On choisit d'abord la case de la liste, puis la propriété de l'objet."
      - code: prog-o-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Quelle écriture crée un objet ?"
        choices:
          - label: "`{ nom: \"Awa\", age: 25 }`"
            correct: true
            why: "Accolades, clés et valeurs."
          - label: "`[\"Awa\", 25]`"
            correct: false
            why: "C'est un tableau."
          - label: "`(nom = \"Awa\")`"
            correct: false
            why: "Ce n'est pas une syntaxe d'objet."
        explanation: "Objet : accolades `{ }` ; tableau : crochets `[ ]`."
      - code: prog-o-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const p = { nom: "Kit", prix: 20 };
          console.log(p.prx);
        language: javascript
        choices:
          - label: "undefined"
            correct: true
            why: "La propriété `prx` n'existe pas (faute de frappe)."
          - label: "20"
            correct: false
            why: "`prx` n'est pas `prix`."
          - label: "Une erreur"
            correct: false
            why: "JavaScript renvoie undefined sans erreur : d'où l'intérêt de TypeScript."
        explanation: "Une propriété inexistante vaut `undefined`. TypeScript détecte ce genre de faute avant l'exécution."
      - code: prog-o-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-fonctions
        prompt: "Une propriété d'objet est composée d'une clé et d'une valeur."
        choices:
          - label: "Vrai"
            correct: true
            why: "Par exemple `prix: 15`."
          - label: "Faux"
            correct: false
            why: "C'est la définition d'une propriété."
        explanation: "Clé : valeur, séparées par des deux-points."
    exercises:
      - slug: prog-ex-objet-guide
        kind: COMPLETER
        title: "La fiche d'un livre"
        difficulty: FACILE
        skill: algo-fonctions
        statement: "Complète l'objet et l'affichage du titre."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Un objet s'ouvre avec une accolade."
          - "Entre deux propriétés : une virgule."
          - "{ , , , titre."
        solution: '["{", ",", "titre"]'
        explanation: "`{ titre: \"Dune\", pages: 600 }` puis `livre.titre`."
        xp: 10
        payload:
          language: javascript
          template: |
            const livre = [[1]] titre: "Dune"[[2]] pages: 600 };
            console.log(livre.[[3]]);
          blanks:
            - ["{"]
            - [","]
            - ["titre"]
      - slug: prog-ex-stock
        kind: CODE_LIBRE
        title: "La valeur du stock"
        difficulty: INTERMEDIAIRE
        skill: algo-fonctions
        statement: |
          Avec la liste fournie, calcule la valeur totale du stock : pour chaque produit, `prix * quantite`,
          additionné dans une variable `total`. Affiche `total` (résultat attendu : 175).
        criteria: "Parcours de la liste, multiplication prix × quantité, accumulation, affichage."
        hints:
          - "`let total = 0;` avant la boucle."
          - "`for (const p of produits) { ... }`"
          - "Dans la boucle : `total += p.prix * p.quantite;`"
        solution: |
          const produits = [
            { nom: "Alarme", prix: 15, quantite: 5 },
            { nom: "Coque SOS", prix: 10, quantite: 4 },
            { nom: "Sac antivol", prix: 20, quantite: 3 }
          ];
          let total = 0;
          for (const p of produits) {
            total += p.prix * p.quantite;
          }
          console.log(total);
        explanation: "15×5 + 10×4 + 20×3 = 75 + 40 + 60 = 175. On combine liste, objets et boucle."
        xp: 20
        payload:
          language: javascript
          starter: |
            const produits = [
              { nom: "Alarme", prix: 15, quantite: 5 },
              { nom: "Coque SOS", prix: 10, quantite: 4 },
              { nom: "Sac antivol", prix: 20, quantite: 3 }
            ];

          checks:
            - pattern: 'let\s+total\s*=\s*0'
              message: "Démarre le total à 0 : let total = 0;"
            - pattern: 'for\s*\('
              message: "Parcours la liste avec une boucle."
            - pattern: '(\w+)\.prix\s*\*\s*\1\.quantite|(\w+)\.quantite\s*\*\s*\2\.prix'
              message: "Multiplie le prix par la quantité de chaque produit : p.prix * p.quantite."
            - pattern: 'total\s*\+=|total\s*=\s*total\s*\+'
              message: "Ajoute chaque résultat au total : total += ..."
            - pattern: 'console\.log\s*\(\s*total\s*\)'
              message: "Affiche le total."
          output: "175"

  # ===================================================================== LEÇON 3
  - slug: prog-filter-map-reduce
    title: "Transformer des listes : filter, map, reduce"
    duration: 13
    objective: "Filtrer, transformer et résumer une liste avec les méthodes filter, map et reduce."
    prerequisites: "Leçon « Les objets »."
    skills: [algo-fonctions, javascript-bases]
    xp: 20
    memo: |
      - `liste.filter(x => condition)` : garde les éléments pour lesquels la condition est vraie.
      - `liste.map(x => transformation)` : crée une nouvelle liste de même taille, chaque élément transformé.
      - `liste.reduce((acc, x) => acc + x, 0)` : résume la liste en une seule valeur (0 = départ).
      - Ces méthodes ne modifient pas la liste d'origine : elles en créent une nouvelle.
      - On peut les enchaîner : `produits.filter(...).map(...)`.
    commonMistakes: |
      - Oublier la valeur de départ de `reduce`.
      - Utiliser `map` pour filtrer : la liste garde sa taille, avec des `undefined` ou des `false`.
      - Oublier `return` dans une fonction fléchée avec accolades.
    blocks:
      - type: text
        md: |
          Trois méthodes font 90 % du travail sur les listes. On les retrouve en Java (streams), en
          TypeScript et en Angular.
      - type: definition
        id: def-filter
        term: "filter : trier le bon grain"
        md: |
          Garde seulement les éléments qui passent un test, comme un **tamis** : on verse toute la liste,
          seuls ceux qui répondent « vrai » restent.
      - type: definition
        id: def-map
        term: "map : transformer chaque élément"
        md: |
          Applique la même transformation à chaque élément, comme une **chaîne de peinture** : chaque objet
          entre gris et sort rouge. La liste obtenue a la même taille.
      - type: definition
        id: def-reduce
        term: "reduce : tout résumer en une valeur"
        md: |
          Parcourt la liste en gardant un **accumulateur**, comme le total d'une caisse enregistreuse qui
          augmente à chaque article.
      - type: code
        id: code-fmr
        language: javascript
        title: "Les trois méthodes sur des prix"
        code: |
          const prix = [5, 20, 12, 40];
          const chers = prix.filter(p => p > 10);
          const ttc = prix.map(p => p * 1.2);
          const somme = prix.reduce((total, p) => total + p, 0);
          console.log(chers, ttc, somme);
        lines:
          - n: 2
            note: "`filter` garde ceux qui dépassent 10 : [20, 12, 40]."
          - n: 3
            note: "`map` multiplie chacun par 1.2 : [6, 24, 14.4, 48]."
          - n: 4
            note: "`reduce` : `total` démarre à 0 (le dernier argument), puis reçoit chaque prix. Résultat : 77."
      - type: demo
        title: "Enchaîner les méthodes"
        language: javascript
        code: |
          const produits = [
            { nom: "Alarme", prix: 15 },
            { nom: "Coque", prix: 10 },
            { nom: "Sac", prix: 20 }
          ];
          const nomsAbordables = produits.filter(p => p.prix <= 15).map(p => p.nom);
          console.log(nomsAbordables);
      - type: question
        ref: prog-m-q1
        review: def-filter
      - type: question
        ref: prog-m-q2
        review: def-map
      - type: text
        md: "Exercice guidé : complète avec la bonne méthode."
      - type: exercise
        ref: prog-ex-methodes-guide
      - type: text
        md: "En autonomie : transforme une liste d'utilisatrices."
      - type: exercise
        ref: prog-ex-methodes
      - type: jury
        items:
          - q: "Quelle différence entre map et filter ?"
            a: "`map` transforme chaque élément et renvoie une liste de même taille ; `filter` garde seulement les éléments qui passent un test, la liste peut donc être plus courte."
      - type: quiz
        items:
          - ref: prog-m-q3
            review: def-reduce
          - ref: prog-m-q4
            review: code-fmr
          - ref: prog-m-q5
            review: def-map
    questions:
      - code: prog-m-q1
        kind: RESULTAT_CODE
        difficulty: 2
        skill: javascript-bases
        prompt: "Que vaut `[3, 8, 1, 10].filter(n => n > 2)` ?"
        snippet: "[3, 8, 1, 10].filter(n => n > 2)"
        language: javascript
        choices:
          - label: "[3, 8, 10]"
            correct: true
            why: "1 est retiré car 1 > 2 est faux."
          - label: "[true, true, false, true]"
            correct: false
            why: "Ce serait le résultat de map avec la même condition."
          - label: "3"
            correct: false
            why: "filter renvoie une liste."
        explanation: "filter garde les éléments pour lesquels la fonction renvoie vrai."
      - code: prog-m-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: javascript-bases
        prompt: "Que vaut `[\"a\", \"b\"].map(l => l.toUpperCase())` ?"
        snippet: "[\"a\", \"b\"].map(l => l.toUpperCase())"
        language: javascript
        choices:
          - label: "[\"A\", \"B\"]"
            correct: true
            why: "Chaque lettre est transformée en majuscule."
          - label: "[\"a\", \"b\"]"
            correct: false
            why: "map renvoie les valeurs transformées."
          - label: "\"AB\""
            correct: false
            why: "map renvoie une liste, pas un texte."
        explanation: "map : même nombre d'éléments, chacun transformé."
      - code: prog-m-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: javascript-bases
        prompt: "Que vaut `[2, 3, 4].reduce((acc, n) => acc + n, 10)` ?"
        snippet: "[2, 3, 4].reduce((acc, n) => acc + n, 10)"
        language: javascript
        choices:
          - label: "19"
            correct: true
            why: "Départ 10, puis +2, +3, +4."
          - label: "9"
            correct: false
            why: "La valeur de départ est 10, pas 0."
          - label: "[12, 13, 14]"
            correct: false
            why: "reduce renvoie une seule valeur."
        explanation: "Le second argument de reduce est la valeur de départ de l'accumulateur."
      - code: prog-m-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: javascript-bases
        prompt: "`prix.filter(...)` modifie le tableau `prix` d'origine."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : filter crée un nouveau tableau."
          - label: "Faux"
            correct: true
            why: "Exact : l'original est intact."
        explanation: "filter, map et reduce ne modifient pas la liste d'origine."
      - code: prog-m-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: javascript-bases
        prompt: "Pour obtenir la liste des noms à partir d'une liste de produits, quelle méthode utiliser ?"
        choices:
          - label: "`map`"
            correct: true
            why: "On transforme chaque produit en son nom."
          - label: "`filter`"
            correct: false
            why: "filter garde des produits entiers, il ne les transforme pas."
          - label: "`reduce`"
            correct: false
            why: "reduce résume en une seule valeur."
        explanation: "`produits.map(p => p.nom)`."
    exercises:
      - slug: prog-ex-methodes-guide
        kind: COMPLETER
        title: "La bonne méthode"
        difficulty: FACILE
        skill: javascript-bases
        statement: "Complète chaque ligne avec filter, map ou reduce."
        criteria: "Les trois méthodes sont correctes."
        hints:
          - "Garder certains éléments : filter."
          - "Transformer chaque élément : map."
          - "filter, map, reduce."
        solution: '["filter", "map", "reduce"]'
        explanation: "Garder → filter, transformer → map, résumer → reduce."
        xp: 10
        payload:
          language: javascript
          template: |
            const pairs = nombres.[[1]](n => n % 2 === 0);
            const doubles = nombres.[[2]](n => n * 2);
            const somme = nombres.[[3]]((acc, n) => acc + n, 0);
          blanks:
            - ["filter"]
            - ["map"]
            - ["reduce"]
      - slug: prog-ex-methodes
        kind: CODE_LIBRE
        title: "Les adresses des utilisatrices actives"
        difficulty: INTERMEDIAIRE
        skill: javascript-bases
        statement: |
          Avec la liste `utilisatrices` fournie, crée `emails` : la liste des **e-mails** des seules
          utilisatrices **actives**. Utilise `filter` puis `map`, et affiche `emails`.
        criteria: "filter sur actif, map vers email, affichage."
        hints:
          - "D'abord garder les actives : `.filter(u => u.actif)`."
          - "Puis ne garder que l'e-mail : `.map(u => u.email)`."
          - "`const emails = utilisatrices.filter(u => u.actif).map(u => u.email);`"
        solution: |
          const utilisatrices = [
            { email: "awa@exemple.fr", actif: true },
            { email: "leo@exemple.fr", actif: false },
            { email: "ines@exemple.fr", actif: true }
          ];
          const emails = utilisatrices.filter(u => u.actif).map(u => u.email);
          console.log(emails);
        explanation: "On filtre d'abord (moins d'éléments à transformer), puis on transforme. Résultat : les e-mails d'Awa et d'Inès."
        xp: 20
        payload:
          language: javascript
          starter: |
            const utilisatrices = [
              { email: "awa@exemple.fr", actif: true },
              { email: "leo@exemple.fr", actif: false },
              { email: "ines@exemple.fr", actif: true }
            ];

          checks:
            - pattern: '\.filter\s*\(\s*\(?\s*(\w+)\s*\)?\s*=>\s*\1\.actif'
              message: "Garde les utilisatrices actives : .filter(u => u.actif)."
            - pattern: '\.map\s*\(\s*\(?\s*(\w+)\s*\)?\s*=>\s*\1\.email'
              message: "Transforme chaque utilisatrice en son e-mail : .map(u => u.email)."
            - pattern: '(const|let)\s+emails\s*='
              message: "Range le résultat dans une variable emails."
            - pattern: 'console\.log\s*\(\s*emails\s*\)'
              message: "Affiche emails."

