slug: prog-decider-repeter
position: 2
level: DEBUTANT
title: "Décider et répéter"
summary: "Faire des choix avec if / else, répéter des actions avec les boucles, et ranger plusieurs valeurs dans une liste."
quizQuestionCount: 10

lessons:
  # ===================================================================== LEÇON 1
  - slug: prog-conditions
    title: "Les conditions : si… sinon…"
    duration: 11
    objective: "Écrire des conditions avec if, else if, else et les opérateurs de comparaison."
    prerequisites: "Chapitre « Parler à un ordinateur »."
    skills: [algo-bases]
    xp: 15
    memo: |
      - `if (condition) { ... } else { ... }` : si la condition est vraie, on fait le premier bloc, sinon le second.
      - Comparaisons : `===` égal, `!==` différent, `<`, `>`, `<=`, `>=`.
      - Combiner : `&&` (ET : les deux vraies), `||` (OU : au moins une vraie), `!` (NON : l'inverse).
      - `else if` ajoute un cas intermédiaire ; les conditions sont testées dans l'ordre.
    commonMistakes: |
      - Écrire `=` (ranger) au lieu de `===` (comparer) dans une condition.
      - Oublier les accolades `{ }` autour d'un bloc de plusieurs instructions.
      - Mettre les cas dans le mauvais ordre : `if (note >= 10)` avant `if (note >= 16)` attrape tout.
    blocks:
      - type: text
        md: |
          Dans la vie, on décide sans cesse : « **s'il** pleut, je prends un parapluie, **sinon** des
          lunettes de soleil ». Un programme fait pareil avec une **condition**.
      - type: definition
        id: def-condition
        term: "Condition"
        md: |
          Une **question** dont la réponse est vraie (`true`) ou fausse (`false`) : « l'âge est-il supérieur
          ou égal à 18 ? ». Le programme choisit son chemin selon la réponse, comme à un **carrefour**.
      - type: code
        id: code-if
        language: javascript
        title: "Majeur ou mineur ?"
        code: |
          const age = 16;
          if (age >= 18) {
            console.log("Accès autorisé");
          } else {
            console.log("Accès réservé aux adultes");
          }
        lines:
          - n: 2
            note: "`if` = « si ». La condition est entre parenthèses : `age >= 18` (supérieur ou égal)."
          - n: 3
            note: "Ce bloc, entre accolades, ne s'exécute que si la condition est **vraie**."
          - n: 4
            note: "`else` = « sinon » : ce bloc s'exécute quand la condition est **fausse**. Ici, 16 < 18, donc on arrive ici."
      - type: demo
        title: "Change l'âge et exécute"
        language: javascript
        code: |
          const age = 16;
          if (age >= 18) {
            console.log("Accès autorisé");
          } else {
            console.log("Accès réservé aux adultes");
          }
      - type: question
        ref: prog-if-q1
        review: def-condition
      - type: definition
        id: def-comparaison
        term: "Opérateurs de comparaison et logiques"
        md: |
          - `===` : est égal à ; `!==` : est différent de ;
          - `<`, `>`, `<=`, `>=` : plus petit, plus grand, ou égal ;
          - `&&` (ET) : les deux conditions doivent être vraies — « j'ai mon billet **et** ma pièce d'identité » ;
          - `||` (OU) : au moins une suffit — « je paie par carte **ou** en espèces » ;
          - `!` (NON) : inverse vrai et faux.
      - type: code
        id: code-else-if
        language: javascript
        title: "Plusieurs cas : else if"
        code: |
          const note = 14;
          if (note >= 16) {
            console.log("Très bien");
          } else if (note >= 10) {
            console.log("Admis");
          } else {
            console.log("À retravailler");
          }
        lines:
          - n: 2
            note: "On teste d'abord le cas le plus exigeant."
          - n: 4
            note: "`else if` : testé seulement si la première condition est fausse. 14 >= 10 : « Admis »."
          - n: 6
            note: "Le dernier `else` attrape tous les autres cas."
      - type: question
        ref: prog-if-q2
        review: def-comparaison
      - type: text
        md: "Exercice guidé : complète la condition d'une réduction."
      - type: exercise
        ref: prog-ex-if-guide
      - type: text
        md: "En autonomie : écris un programme qui dit si un nombre est pair ou impair."
      - type: exercise
        ref: prog-ex-pair
      - type: jury
        items:
          - q: "Quelle différence entre = et === en JavaScript ?"
            a: "`=` range une valeur dans une variable (affectation). `===` compare deux valeurs, type compris, et renvoie vrai ou faux."
      - type: quiz
        items:
          - ref: prog-if-q3
            review: code-else-if
          - ref: prog-if-q4
            review: def-comparaison
          - ref: prog-if-q5
            review: code-if
    questions:
      - code: prog-if-q1
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const temperature = 30;
          if (temperature > 25) {
            console.log("Chaud");
          } else {
            console.log("Frais");
          }
        language: javascript
        choices:
          - label: "Chaud"
            correct: true
            why: "30 > 25 : la condition est vraie."
          - label: "Frais"
            correct: false
            why: "Le bloc else ne s'exécute que si la condition est fausse."
          - label: "Chaud puis Frais"
            correct: false
            why: "Un seul des deux blocs s'exécute."
        explanation: "if / else : un seul chemin est suivi."
      - code: prog-if-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: algo-bases
        prompt: "Quelle condition est vraie quand l'âge est entre 12 et 17 inclus ?"
        choices:
          - label: "`age >= 12 && age <= 17`"
            correct: true
            why: "Les deux conditions doivent être vraies : ET."
          - label: "`age >= 12 || age <= 17`"
            correct: false
            why: "Avec OU, tout le monde passe (100 ans est >= 12)."
          - label: "`age === 12 && age === 17`"
            correct: false
            why: "Un âge ne peut pas valoir 12 et 17 en même temps."
        explanation: "Un intervalle se teste avec deux conditions reliées par `&&`."
      - code: prog-if-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-bases
        prompt: "Avec `note = 8`, qu'affiche le programme « Plusieurs cas » ?"
        snippet: |
          const note = 8;
          if (note >= 16) {
            console.log("Très bien");
          } else if (note >= 10) {
            console.log("Admis");
          } else {
            console.log("À retravailler");
          }
        language: javascript
        choices:
          - label: "À retravailler"
            correct: true
            why: "8 n'est ni >= 16 ni >= 10."
          - label: "Admis"
            correct: false
            why: "8 est inférieur à 10."
          - label: "Rien"
            correct: false
            why: "Le dernier `else` attrape tous les autres cas."
        explanation: "Les conditions sont testées dans l'ordre ; le `else` final sert de filet."
      - code: prog-if-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Que vaut `!true` ?"
        choices:
          - label: "`false`"
            correct: true
            why: "`!` inverse."
          - label: "`true`"
            correct: false
            why: "`!` change vrai en faux."
          - label: "Une erreur"
            correct: false
            why: "C'est une opération valide."
        explanation: "`!` (NON) inverse une valeur booléenne."
      - code: prog-if-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "Dans `if (age = 18)`, on compare l'âge à 18."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : `=` range 18 dans age ; il faudrait `===`."
          - label: "Faux"
            correct: true
            why: "Exact : c'est une affectation, une erreur classique."
        explanation: "Pour comparer : `===`. Pour ranger : `=`."
    exercises:
      - slug: prog-ex-if-guide
        kind: COMPLETER
        title: "Une réduction pour les étudiants"
        difficulty: FACILE
        skill: algo-bases
        statement: "Si `etudiant` vaut `true`, le prix est 5 €, sinon 8 €. Complète."
        criteria: "Les trois trous sont corrects."
        hints:
          - "« si » se dit if ; « sinon » se dit else."
          - "Pour comparer à true : trois signes égal."
          - "if, ===, else."
        solution: '["if", "===", "else"]'
        explanation: "`if (etudiant === true)` (on peut aussi écrire `if (etudiant)`), puis `else` pour les autres."
        xp: 10
        payload:
          language: javascript
          template: |
            const etudiant = true;
            [[1]] (etudiant [[2]] true) {
              console.log("5 €");
            } [[3]] {
              console.log("8 €");
            }
          blanks:
            - ["if"]
            - ["==="]
            - ["else"]
      - slug: prog-ex-pair
        kind: CODE_LIBRE
        title: "Pair ou impair ?"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Crée une constante `nombre` qui vaut `7`. Si le reste de la division de `nombre` par 2 vaut 0,
          affiche `pair`, sinon affiche `impair`. Change ensuite la valeur pour vérifier les deux cas.
        criteria: "Un if / else qui utilise nombre % 2 === 0."
        hints:
          - "Le reste d'une division s'obtient avec `%`."
          - "`if (nombre % 2 === 0) { ... } else { ... }`"
          - "Dans chaque bloc : `console.log(\"pair\");` ou `console.log(\"impair\");`"
        solution: |
          const nombre = 7;
          if (nombre % 2 === 0) {
            console.log("pair");
          } else {
            console.log("impair");
          }
        explanation: "Un nombre pair a un reste nul quand on le divise par 2."
        xp: 15
        payload:
          language: javascript
          starter: |
            const nombre = 7;

          checks:
            - pattern: 'if\s*\(\s*nombre\s*%\s*2\s*===?\s*0\s*\)|if\s*\(\s*nombre\s*%\s*2\s*!==?\s*0\s*\)'
              message: "Teste le reste : if (nombre % 2 === 0)."
            - pattern: '\belse\b'
              message: "Ajoute un else pour l'autre cas."
            - pattern: 'console\.log\s*\(\s*["''`]pair["''`]\s*\)'
              message: "Affiche \"pair\" dans le bon cas."
            - pattern: 'console\.log\s*\(\s*["''`]impair["''`]\s*\)'
              message: "Affiche \"impair\" dans l'autre cas."
          output: "impair"

  # ===================================================================== LEÇON 2
  - slug: prog-boucles
    title: "Les boucles : répéter sans se fatiguer"
    duration: 12
    objective: "Répéter des instructions avec for et while, et éviter les boucles infinies."
    prerequisites: "Leçon « Les conditions »."
    skills: [algo-bases]
    xp: 15
    memo: |
      - Une **boucle** répète des instructions.
      - `for (let i = 1; i <= 5; i++) { ... }` : départ, condition pour continuer, pas (ici +1).
      - `while (condition) { ... }` répète **tant que** la condition est vraie.
      - `i++` ajoute 1 à `i` ; `total += x` ajoute x à total.
      - Toujours faire avancer la boucle vers sa fin, sinon elle ne s'arrête jamais (boucle infinie).
    commonMistakes: |
      - Oublier `i++` dans un `while` : la boucle ne s'arrête jamais.
      - Se tromper de borne : `i < 5` fait 5 tours depuis 0, `i <= 5` en fait 6.
      - Déclarer le total **dans** la boucle : il repart de 0 à chaque tour.
    blocks:
      - type: text
        md: |
          Afficher « Bonjour » 100 fois en écrivant 100 lignes ? Non merci. Une **boucle** répète le travail
          pour nous.
      - type: definition
        id: def-boucle
        term: "Boucle"
        md: |
          Une instruction qui **répète** un bloc de code. Comme un tour de piste : on recommence tant qu'on
          n'a pas fait le nombre de tours prévu.
      - type: code
        id: code-for
        language: javascript
        title: "Compter de 1 à 5"
        code: |
          for (let i = 1; i <= 5; i++) {
            console.log(i);
          }
        lines:
          - n: 1
            note: "Trois parties : `let i = 1` (départ), `i <= 5` (on continue tant que c'est vrai), `i++` (après chaque tour, i augmente de 1)."
          - n: 2
            note: "Le bloc s'exécute à chaque tour : il affiche 1, 2, 3, 4, 5."
      - type: demo
        title: "Modifie la boucle"
        md: "Essaie de compter jusqu'à 10, ou de 2 en 2 avec `i += 2`."
        language: javascript
        code: |
          for (let i = 1; i <= 5; i++) {
            console.log(i);
          }
      - type: question
        ref: prog-b-q1
        review: code-for
      - type: code
        id: code-somme
        language: javascript
        title: "Additionner avec une boucle"
        code: |
          let total = 0;
          for (let i = 1; i <= 4; i++) {
            total += i;
          }
          console.log(total);
        lines:
          - n: 1
            note: "Le total démarre à 0, **avant** la boucle."
          - n: 3
            note: "`total += i` veut dire `total = total + i`. Tours : 0+1, puis +2, +3, +4."
          - n: 5
            note: "Après la boucle : affiche 10."
      - type: definition
        id: def-while
        term: "while (tant que)"
        md: |
          Répète **tant que** la condition est vraie, sans compteur intégré : « tant que la casserole n'est pas
          vide, je sers une assiette ». Il faut penser à faire évoluer quelque chose à chaque tour.
      - type: callout
        variant: warning
        title: "La boucle infinie"
        md: |
          Si la condition reste toujours vraie, la boucle ne s'arrête jamais. Ici, le bouton **Exécuter**
          arrête ton code au bout de 2 secondes et t'explique ce qui s'est passé.
      - type: question
        ref: prog-b-q2
        review: def-while
      - type: text
        md: "Exercice guidé : remets la boucle dans l'ordre."
      - type: exercise
        ref: prog-ex-boucle-ordre
      - type: text
        md: "En autonomie : affiche la table de multiplication de 7."
      - type: exercise
        ref: prog-ex-table
      - type: jury
        items:
          - q: "Quand utilise-t-on for plutôt que while ?"
            a: "`for` quand on connaît le nombre de tours (parcourir une liste, compter). `while` quand on répète jusqu'à ce qu'une situation change (lire tant qu'il reste des données)."
      - type: quiz
        items:
          - ref: prog-b-q3
            review: code-somme
          - ref: prog-b-q4
            review: code-for
          - ref: prog-b-q5
            review: def-while
    questions:
      - code: prog-b-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Combien de fois s'exécute le bloc de `for (let i = 0; i < 3; i++)` ?"
        choices:
          - label: "3 fois (i = 0, 1, 2)"
            correct: true
            why: "Quand i vaut 3, `i < 3` est faux : on s'arrête."
          - label: "4 fois"
            correct: false
            why: "Ce serait avec `i <= 3`."
          - label: "2 fois"
            correct: false
            why: "On commence à 0 : 0, 1, 2 font trois tours."
        explanation: "Départ 0, condition `< 3` : 3 tours. Classique pour parcourir une liste de 3 éléments."
      - code: prog-b-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: algo-bases
        prompt: "Pourquoi ce code ne s'arrête-t-il jamais ?"
        snippet: |
          let i = 0;
          while (i < 5) {
            console.log(i);
          }
        language: javascript
        choices:
          - label: "i ne change jamais : il manque `i++` dans la boucle"
            correct: true
            why: "i reste à 0, la condition reste vraie."
          - label: "while ne fonctionne pas avec des nombres"
            correct: false
            why: "while fonctionne avec n'importe quelle condition."
          - label: "Il faut écrire `i <= 5`"
            correct: false
            why: "Le problème vient de i qui ne bouge pas."
        explanation: "Une boucle while doit faire évoluer sa condition à chaque tour."
      - code: prog-b-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          let total = 0;
          for (let i = 1; i <= 3; i++) {
            total += i;
          }
          console.log(total);
        language: javascript
        choices:
          - label: "6"
            correct: true
            why: "1 + 2 + 3."
          - label: "3"
            correct: false
            why: "On additionne à chaque tour, on ne garde pas seulement le dernier."
          - label: "0"
            correct: false
            why: "total change à chaque tour."
        explanation: "`total += i` accumule les valeurs."
      - code: prog-b-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Que fait `i++` ?"
        choices:
          - label: "Ajoute 1 à i"
            correct: true
            why: "C'est un raccourci de `i = i + 1`."
          - label: "Double i"
            correct: false
            why: "Ce serait `i = i * 2`."
          - label: "Affiche i"
            correct: false
            why: "Rien n'est affiché."
        explanation: "`i++` incrémente de 1 ; `i--` décrémente de 1."
      - code: prog-b-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "Une boucle `while` répète son bloc tant que sa condition est vraie."
        choices:
          - label: "Vrai"
            correct: true
            why: "« while » = « tant que »."
          - label: "Faux"
            correct: false
            why: "C'est exactement sa définition."
        explanation: "Dès que la condition devient fausse, on sort de la boucle."
    exercises:
      - slug: prog-ex-boucle-ordre
        kind: REMETTRE_ORDRE
        title: "Remettre une boucle dans l'ordre"
        difficulty: FACILE
        skill: algo-bases
        statement: "Remets les lignes dans l'ordre pour afficher la somme des nombres de 1 à 10."
        criteria: "Le total est créé avant la boucle et affiché après."
        hints:
          - "Le total démarre à 0, avant tout."
          - "L'addition se fait dans la boucle."
          - "On affiche le résultat une fois la boucle terminée."
        solution: |
          let total = 0;
          for (let i = 1; i <= 10; i++) {
            total += i;
          }
          console.log(total);
        explanation: "Préparer, répéter, puis afficher. Résultat : 55."
        xp: 10
        payload:
          language: javascript
          lines:
            - "let total = 0;"
            - "for (let i = 1; i <= 10; i++) {"
            - "  total += i;"
            - "}"
            - "console.log(total);"
      - slug: prog-ex-table
        kind: CODE_LIBRE
        title: "La table de 7"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Avec une boucle `for`, affiche la table de multiplication de 7, de 1 à 10, sous la forme
          `7 x 1 = 7`, `7 x 2 = 14`… (utilise un gabarit `${}`).
        criteria: "Une boucle for de 1 à 10 et un affichage avec gabarit."
        hints:
          - "`for (let i = 1; i <= 10; i++) { ... }`"
          - "Le résultat se calcule avec `7 * i`."
          - "``console.log(`7 x ${i} = ${7 * i}`);``"
        solution: |
          for (let i = 1; i <= 10; i++) {
            console.log(`7 x ${i} = ${7 * i}`);
          }
        explanation: "La boucle fait varier i de 1 à 10 ; le gabarit construit chaque ligne."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Table de 7

          checks:
            - pattern: 'for\s*\(\s*let\s+(\w+)\s*=\s*1\s*;\s*\1\s*<=\s*10\s*;\s*\1\s*(\+\+|\+=\s*1)\s*\)'
              message: "Écris une boucle de 1 à 10 : for (let i = 1; i <= 10; i++)."
            - pattern: '7\s*\*\s*\w+|\w+\s*\*\s*7'
              message: "Calcule le résultat avec 7 * i."
            - pattern: 'console\.log\s*\(\s*`'
              message: "Affiche chaque ligne avec un gabarit entre accents graves."
          output: |
            7 x 1 = 7
            7 x 2 = 14
            …
            7 x 10 = 70

  # ===================================================================== LEÇON 3
  - slug: prog-tableaux
    title: "Les listes (tableaux)"
    duration: 12
    objective: "Créer un tableau, lire ses éléments par leur position, en ajouter et le parcourir."
    prerequisites: "Leçon « Les boucles »."
    skills: [algo-bases]
    xp: 15
    memo: |
      - Un **tableau** range plusieurs valeurs dans l'ordre : `const fruits = ["pomme", "kiwi"];`
      - Les positions (**indices**) commencent à **0** : `fruits[0]` vaut `"pomme"`.
      - `fruits.length` : nombre d'éléments ; `fruits.push("poire")` ajoute à la fin.
      - Parcourir : `for (const fruit of fruits) { ... }`.
    commonMistakes: |
      - Croire que le premier élément est à l'indice 1.
      - Lire `fruits[fruits.length]` : il n'existe pas (le dernier est à `length - 1`), on obtient `undefined`.
      - Oublier les crochets `[ ]` à la création.
    blocks:
      - type: text
        md: "Pour ranger **plusieurs** valeurs ensemble — une liste de courses, des notes — on utilise un **tableau**."
      - type: definition
        id: def-tableau
        term: "Tableau (array)"
        md: |
          Une **liste numérotée**, comme une étagère à cases. Chaque case a un numéro, l'**indice**, qui
          commence à **0**. On écrit la liste entre crochets, les éléments séparés par des virgules.
      - type: code
        id: code-tableau
        language: javascript
        title: "Une liste de courses"
        code: |
          const courses = ["pain", "lait", "œufs"];
          console.log(courses[0]);
          console.log(courses.length);
          courses.push("beurre");
          console.log(courses);
        lines:
          - n: 1
            note: "Trois éléments, aux indices 0, 1 et 2."
          - n: 2
            note: "Affiche « pain » : le **premier** élément est à l'indice 0."
          - n: 3
            note: "`length` : le nombre d'éléments, ici 3."
          - n: 4
            note: "`push` ajoute « beurre » à la fin. `const` empêche de remplacer la liste, pas de la modifier."
          - n: 5
            note: "Affiche toute la liste."
      - type: question
        ref: prog-t-q1
        review: def-tableau
      - type: definition
        id: def-for-of
        term: "Parcourir avec for…of"
        md: |
          `for (const element of liste)` prend les éléments un par un, du premier au dernier : comme on
          vide un panier en prenant les articles un à un.
      - type: demo
        title: "Parcourir et additionner des notes"
        language: javascript
        code: |
          const notes = [12, 15, 9, 18];
          let somme = 0;
          for (const note of notes) {
            somme += note;
          }
          console.log("Moyenne :", somme / notes.length);
      - type: question
        ref: prog-t-q2
        review: def-for-of
      - type: text
        md: "Exercice guidé : complète le parcours d'une liste."
      - type: exercise
        ref: prog-ex-tableau-guide
      - type: text
        md: "En autonomie : trouve la note la plus haute d'une liste."
      - type: exercise
        ref: prog-ex-maximum
      - type: jury
        items:
