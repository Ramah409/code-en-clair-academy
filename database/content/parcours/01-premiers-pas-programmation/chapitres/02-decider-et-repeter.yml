        kind: COMPLETER
        title: "Afficher chaque prénom"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète pour afficher chaque prénom de la liste."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une liste s'écrit entre crochets."
          - "« pour chaque … de … » : for (const … of …)."
          - "[, of, prenom."
        solution: '["[", "of", "prenom"]'
        explanation: "`for (const prenom of prenoms)` donne les prénoms un par un."
        xp: 10
        payload:
          language: javascript
          template: |
            const prenoms = [[1]]"Awa", "Léo", "Inès"];
            for (const prenom [[2]] prenoms) {
              console.log([[3]]);
            }
          blanks:
            - ["["]
            - ["of"]
            - ["prenom"]
      - slug: prog-ex-maximum
        kind: CODE_LIBRE
        title: "La meilleure note"
        difficulty: INTERMEDIAIRE
        skill: algo-bases
        statement: |
          Avec la liste `const notes = [12, 17, 9, 15];` :
          1. crée une variable `max` qui vaut la première note (`notes[0]`) ;
          2. parcours la liste : si une note est plus grande que `max`, range-la dans `max` ;
          3. affiche `max` (le résultat attendu est 17).

          N'utilise pas `Math.max` : le but est de comprendre l'algorithme.
        criteria: "Parcours de la liste, comparaison et mise à jour de max."
        hints:
          - "`let max = notes[0];`"
          - "`for (const note of notes) { if (note > max) { ... } }`"
          - "Dans le if : `max = note;`, puis après la boucle `console.log(max);`"
        solution: |
          const notes = [12, 17, 9, 15];
          let max = notes[0];
          for (const note of notes) {
            if (note > max) {
              max = note;
            }
          }
          console.log(max);
        explanation: |
          C'est l'algorithme du **maximum** : on garde le meilleur trouvé jusqu'ici et on le remplace dès
          qu'on trouve mieux. On le retrouve partout (le prix le plus bas, le meilleur score…).
        xp: 20
        payload:
          language: javascript
          starter: |
            const notes = [12, 17, 9, 15];

          checks:
            - pattern: 'let\s+max\s*=\s*notes\s*\[\s*0\s*\]'
              message: "Démarre avec la première note : let max = notes[0];"
            - pattern: 'for\s*\('
              message: "Parcours la liste avec une boucle for."
            - pattern: 'if\s*\(\s*\w+\s*>\s*max\s*\)|if\s*\(\s*max\s*<\s*\w+\s*\)'
              message: "Compare chaque note à max : if (note > max)."
            - pattern: '\bmax\s*=\s*(?!notes\s*\[)\w+'
              message: "Mets à jour max quand tu trouves plus grand : max = note;"
            - pattern: 'Math\.max'
              absent: true
              message: "Écris l'algorithme toi-même, sans Math.max."
            - pattern: 'console\.log\s*\(\s*max\s*\)'
              message: "Affiche le résultat : console.log(max);"
          output: "17"

