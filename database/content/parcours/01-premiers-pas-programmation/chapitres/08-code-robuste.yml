        explanation: "`string[]`, `Produit[]`…"
      - code: prog-if2-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Que signifie le `?` dans `description?: string` ?"
        choices:
          - label: "La propriété est facultative"
            correct: true
