slug: prog-code-robuste
position: 8
level: AVANCE
title: "Écrire un code robuste"
summary: "Lire un message d'erreur, rattraper une erreur avec try / catch, typer son code avec TypeScript, décrire un objet avec une interface, puis attendre une réponse avec async / await. Une seule notion par leçon."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: prog-erreurs
    title: "Lire un message d'erreur"
    duration: 10
    objective: "Comprendre un message d'erreur (son type et sa ligne) et déboguer avec méthode."
    prerequisites: "Chapitre « Transformer des listes »."
    skills: [algo-fonctions]
    xp: 15
    memo: |
      - Une erreur n'est pas un échec : c'est un **message** qui dit **quoi** ne va pas et **où**.
      - `ReferenceError` : un nom inconnu (souvent une faute de frappe).
      - `TypeError` : une opération impossible sur cette sorte de valeur (changer une const, lire une propriété de undefined…).
      - `SyntaxError` : le code est mal écrit (parenthèse ou accolade oubliée…).
      - Méthode : lire, trouver la ligne, afficher les valeurs avec console.log, changer **une seule** chose, réessayer.
    commonMistakes: |
      - Ignorer le message d'erreur au lieu de le lire.
      - Modifier plusieurs choses à la fois : on ne sait plus ce qui a réglé le problème.
    blocks:
      - type: text
        md: |
          Tous les développeurs voient des erreurs, tous les jours. La différence entre une débutante et une
          professionnelle ? La professionnelle **lit le message**.
      - type: definition
        id: def-erreur
        term: "Erreur"
        md: |
          Le **voyant du tableau de bord** d'une voiture : il s'allume quand quelque chose ne va pas, et
          indique quoi vérifier. Le message dit **quoi**, le numéro de ligne dit **où**.
      - type: steps
        id: etapes-debogage
        title: "Méthode pour déboguer"
        items:
          - "**Lire** le message : son type (`TypeError`…) et sa phrase."
          - "**Trouver** la ligne indiquée."
          - "**Afficher** les valeurs juste avant cette ligne avec `console.log`."
          - "**Changer une seule chose** et réessayer."
      - type: demo
        title: "Provoque une erreur et lis le message"
        md: "Exécute : une faute de frappe dans un nom provoque une `ReferenceError`. Corrige `prenon` en `prenom`."
        language: javascript
        code: |
          const prenom = "Awa";
          console.log("Bonjour " + prenon);
      - type: question
        ref: prog-e-q1
        review: def-erreur
      - type: question
        ref: prog-e-q5
        review: def-erreur
      - type: text
        md: "**Exercice 1 (guidé)** : associe chaque erreur à son type."
      - type: exercise
        ref: prog-ex-erreurs-guide
      - type: text
        md: "**Exercice 2** : remets les étapes de débogage dans l'ordre."
      - type: exercise
        ref: prog-ex-debug-ordre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : ce code contient trois erreurs."
      - type: exercise
        ref: prog-ex-corriger-bugs
      - type: jury
        items:
          - q: "Comment déboguez-vous un programme ?"
            a: "Je lis le message d'erreur et la ligne indiquée, j'affiche les valeurs intermédiaires (console.log ou point d'arrêt dans l'outil de débogage), je réduis le problème et je change une seule chose à la fois."
      - type: quiz
        items:
          - ref: prog-e-q4
            review: etapes-debogage
          - ref: prog-c4-b2
            review: def-erreur
          - ref: prog-er-q5
            review: def-erreur
    questions:
      - code: prog-e-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "« ReferenceError: prenon is not defined ». Que signifie ce message ?"
        choices:
          - label: "Le nom `prenon` n'existe pas : sans doute une faute de frappe"
            correct: true
            why: "Oui : la variable s'appelle prenom."
          - label: "L'ordinateur est en panne"
            correct: false
            why: "Le message désigne un problème précis dans le code."
          - label: "Le texte est trop long"
            correct: false
            why: "Aucun rapport avec la longueur."
        explanation: "ReferenceError : on utilise un nom qui n'a jamais été créé."
      - code: prog-e-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Quelle erreur obtient-on avec `const ville = \"Lyon\"; ville = \"Nice\";` ?"
        choices:
          - label: "TypeError : on ne peut pas changer une constante"
            correct: true
            why: "Assignment to constant variable."
          - label: "SyntaxError"
            correct: false
            why: "Le code est bien écrit ; c'est l'opération qui est interdite."
          - label: "Aucune"
            correct: false
            why: "`const` interdit le changement."
        explanation: "Changer une const provoque une TypeError."
      - code: prog-e-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Quelle est la première chose à faire face à une erreur ?"
        choices:
          - label: "Lire le message et la ligne indiquée"
            correct: true
            why: "Le message dit quoi, la ligne dit où."
          - label: "Tout effacer et recommencer"
            correct: false
            why: "On perd le travail et on ne comprend pas l'erreur."
          - label: "Changer plusieurs lignes au hasard"
            correct: false
            why: "On ne saurait plus ce qui a réglé le problème."
        explanation: "Lire, localiser, afficher les valeurs, changer une chose à la fois."
      - code: prog-c4-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Quel type d'erreur provoque `undefined.length` ?"
        choices:
          - label: "TypeError"
            correct: true
            why: "On lit une propriété sur une valeur qui n'en a pas."
          - label: "ReferenceError"
            correct: false
            why: "undefined est un nom connu."
          - label: "SyntaxError"
            correct: false
            why: "Le code est bien écrit."
        explanation: "TypeError : la valeur n'est pas de la sorte attendue (ici undefined)."
      - code: prog-er-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Une accolade fermante oubliée provoque…"
        choices:
          - label: "une SyntaxError : le code est mal écrit"
            correct: true
            why: "JavaScript ne peut même pas lire le programme."
          - label: "une ReferenceError"
            correct: false
            why: "Aucun nom inconnu ici."
          - label: "aucune erreur"
            correct: false
            why: "Chaque accolade ouverte doit être fermée."
        explanation: "SyntaxError = problème d'écriture (ponctuation)."
    exercises:
      - slug: prog-ex-erreurs-guide
        kind: COMPLETER
        title: "Le bon type d'erreur"
        difficulty: FACILE
        skill: algo-fonctions
        statement: "Complète chaque commentaire avec le type d'erreur : ReferenceError, TypeError ou SyntaxError."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Un nom qui n'existe pas : Reference."
          - "Changer une const : Type. Une parenthèse oubliée : Syntax."
          - "ReferenceError, TypeError, SyntaxError."
        solution: '["ReferenceError", "TypeError", "SyntaxError"]'
        explanation: "Nom inconnu → ReferenceError ; opération impossible → TypeError ; code mal écrit → SyntaxError."
        xp: 10
        payload:
          language: text
          template: |
            console.log(prenon);            → [[1]]
            const a = 1; a = 2;             → [[2]]
            console.log("Bonjour";          → [[3]]
          blanks:
            - ["ReferenceError"]
            - ["TypeError"]
            - ["SyntaxError"]
      - slug: prog-ex-debug-ordre
        kind: REMETTRE_ORDRE
        title: "Les étapes du débogage"
        difficulty: FACILE
        skill: algo-fonctions
        statement: "Remets les étapes dans l'ordre."
        criteria: "Lire, localiser, observer, corriger, vérifier."
        hints:
          - "On commence par lire."
          - "On change une seule chose avant de vérifier."
          - "Lire, trouver la ligne, afficher, changer, réexécuter."
        solution: |
          1. Lire le message d'erreur
          2. Trouver la ligne indiquée
          3. Afficher les valeurs avec console.log
          4. Changer une seule chose
          5. Réexécuter pour vérifier
        explanation: "Une démarche calme et méthodique, qui marche pour tous les langages."
        xp: 10
        payload:
          language: text
          lines:
            - "Lire le message d'erreur"
            - "Trouver la ligne indiquée"
            - "Afficher les valeurs avec console.log"
            - "Changer une seule chose"
            - "Réexécuter pour vérifier"
      - slug: prog-ex-corriger-bugs
        kind: CORRIGER_ERREUR
        title: "Trois bugs à corriger"
        difficulty: INTERMEDIAIRE
        skill: algo-fonctions
        statement: |
          Ce programme doit afficher `Invités : Awa Léo Inès`. Exécute-le, lis les erreurs et corrige les
          **trois** problèmes : une faute de frappe dans un nom, une `const` qu'on essaie de changer, et
          l'affichage de la mauvaise variable.
        criteria: "Le programme affiche la liste des invités sans erreur."
        hints:
          - "`liste` doit pouvoir changer : ce ne peut pas être une const."
          - "Regarde bien le nom `invites` dans la boucle."
          - "À la fin, on affiche le texte construit : `liste`."
        solution: |
          const invites = ["Awa", "Léo", "Inès"];
          let liste = "";
          for (const invite of invites) {
            liste += " " + invite;
          }
          console.log("Invités :" + liste);
        explanation: "`let` car le texte grandit à chaque tour, `invites` bien orthographié, et on affiche `liste`, le texte construit."
        xp: 25
        payload:
          language: javascript
          starter: |
            const invites = ["Awa", "Léo", "Inès"];
            const liste = "";
            for (const invite of invite) {
              liste += " " + invite;
            }
            console.log("Invités :" + invite);
          checks:
            - pattern: 'let\s+liste\s*=\s*["''`]["''`]'
              message: "liste change à chaque tour : déclare-la avec let."
            - pattern: 'for\s*\(\s*const\s+invite\s+of\s+invites\s*\)'
              message: "La boucle parcourt la liste invites (avec un s)."
            - pattern: 'console\.log\s*\([^)]*\bliste\b'
              message: "Affiche le texte construit : liste."
            - pattern: 'const\s+liste'
              absent: true
              message: "liste ne peut pas être une const."
          output: "Invités : Awa Léo Inès"

  # ===================================================================== LEÇON 2
  - slug: prog-try-catch
    title: "Signaler et rattraper une erreur : throw, try, catch"
    duration: 11
    objective: "Lancer une erreur avec throw, puis la rattraper avec try / catch pour que le programme continue."
    prerequisites: "Leçon « Lire un message d'erreur »."
    skills: [algo-fonctions]
    xp: 15
    memo: |
      - `throw new Error("message")` **lance** une erreur : la fonction s'arrête là.
      - `try { ... } catch (e) { ... }` : « **essaie** ce bloc ; **si** une erreur survient, fais plutôt celui-là ».
      - Dans le catch, `e.message` contient le texte de l'erreur.
      - Après le catch, le programme **continue** au lieu de s'arrêter net.
    commonMistakes: |
      - Un `catch` vide (`catch (e) {}`) : l'erreur est cachée, impossible à comprendre ensuite.
      - Oublier `new` devant `Error`.
    blocks:
      - type: text
        md: |
          Parfois, c'est **ton** code qui doit dire « stop, ça ne va pas » (un prénom vide, par exemple). Et
          ailleurs, on veut **rattraper** ce problème proprement au lieu de tout faire planter.
      - type: definition
        id: def-try-catch
        term: "throw, try et catch"
        md: |
          Un **filet de trapéziste** : `throw`, c'est la chute ; `try`, c'est le numéro qu'on tente ; `catch`,
          c'est le filet qui rattrape. Le spectacle continue.
      - type: code
        id: code-try
        language: javascript
        title: "Signaler et rattraper une erreur"
        code: |
          function saluer(prenom) {
            if (prenom === "") {
              throw new Error("Le prénom est vide");
            }
            return `Bonjour ${prenom} !`;
          }
          try {
            console.log(saluer(""));
          } catch (e) {
            console.log("Problème : " + e.message);
          }
          console.log("Le programme continue");
        lines:
          - n: 3
            note: "`throw` lance une erreur avec un message clair. La fonction s'arrête ici."
          - n: 7
            note: "`try` : on essaie d'exécuter ce bloc."
          - n: 9
            note: "`catch (e)` : l'erreur est rattrapée ici. `e.message` contient son texte."
          - n: 12
            note: "Grâce au filet, cette ligne s'exécute quand même."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis remplace `saluer(\"\")` par `saluer(\"Awa\")` : le catch n'est plus utilisé."
        language: javascript
        code: |
          function saluer(prenom) {
            if (prenom === "") {
              throw new Error("Le prénom est vide");
            }
            return `Bonjour ${prenom} !`;
          }
          try {
            console.log(saluer(""));
          } catch (e) {
            console.log("Problème : " + e.message);
          }
          console.log("Le programme continue");
      - type: question
        ref: prog-e-q2
        review: code-try
      - type: question
        ref: prog-tc-q2
        review: def-try-catch
      - type: text
        md: "**Exercice 1 (guidé)** : complète throw, try et catch."
      - type: exercise
        ref: prog-ex-try-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une fonction qui refuse un e-mail sans @."
      - type: exercise
        ref: prog-ex-try-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un filet qui cache tout."
      - type: exercise
        ref: prog-ex-try-bug
      - type: quiz
        items:
          - ref: prog-e-q3
            review: def-try-catch
          - ref: prog-tc-q4
            review: code-try
          - ref: prog-tc-q5
            review: def-try-catch
    questions:
      - code: prog-e-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Dans l'exemple, qu'affiche le bloc try / catch avec `saluer(\"\")` ?"
        snippet: |
          try {
            console.log(saluer(""));
          } catch (e) {
            console.log("Problème : " + e.message);
          }
        language: javascript
        choices:
          - label: "Problème : Le prénom est vide"
            correct: true
            why: "L'erreur est lancée puis rattrapée par catch."
          - label: "Bonjour  !"
            correct: false
            why: "La fonction lance une erreur avant de préparer le message."
          - label: "Rien, le programme plante"
            correct: false
            why: "catch rattrape l'erreur."
        explanation: "throw lance l'erreur, catch la récupère avec son message."
      - code: prog-tc-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "À quoi sert `throw new Error(\"...\")` ?"
        choices:
          - label: "À signaler un problème en lançant une erreur"
            correct: true
            why: "La fonction s'arrête et prévient."
          - label: "À afficher un message normal"
            correct: false
            why: "Pour afficher, on utilise console.log."
          - label: "À rattraper une erreur"
            correct: false
            why: "Ça, c'est catch."
        explanation: "throw = lancer ; catch = rattraper."
      - code: prog-e-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: algo-fonctions
        prompt: "Un `catch` vide (`catch (e) {}`) est une bonne pratique pour éviter les erreurs."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : il cache le problème, qui devient très difficile à trouver."
          - label: "Faux"
            correct: true
            why: "Exact : on doit au moins informer ou noter l'erreur."
        explanation: "Rattraper une erreur, c'est pour y réagir : message, valeur de secours, journal."
      - code: prog-tc-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          try {
            console.log("A");
            throw new Error("oups");
            console.log("B");
          } catch (e) {
            console.log("C");
          }
        language: javascript
        choices:
          - label: "A puis C"
            correct: true
            why: "A s'affiche, l'erreur saute directement au catch : B est ignoré."
          - label: "A, B puis C"
            correct: false
            why: "Après throw, le reste du try est sauté."
          - label: "C seulement"
            correct: false
            why: "A s'affiche avant l'erreur."
        explanation: "throw interrompt le try et saute au catch."
      - code: prog-tc-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Que contient `e.message` dans un catch ?"
        choices:
          - label: "Le texte de l'erreur"
            correct: true
            why: "Celui écrit dans new Error(\"...\")."
          - label: "Le numéro de la ligne"
            correct: false
            why: "C'est le texte de l'erreur."
          - label: "true ou false"
            correct: false
            why: "C'est un texte."
        explanation: "`new Error(\"Le prénom est vide\")` → e.message vaut « Le prénom est vide »."
    exercises:
      - slug: prog-ex-try-guide
        kind: COMPLETER
        title: "Compléter throw, try, catch"
        difficulty: FACILE
        skill: algo-fonctions
        statement: "Complète les trois mots-clés."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Lancer une erreur : throw."
          - "Essayer : try. Rattraper : catch."
          - "throw, try, catch."
        solution: '["throw", "try", "catch"]'
        explanation: "throw lance, try essaie, catch rattrape."
        xp: 10
        payload:
          language: javascript
          template: |
            function verifier(age) {
              if (age < 0) {
                [[1]] new Error("Âge impossible");
              }
              return "Âge valide";
            }
            [[2]] {
              console.log(verifier(-3));
            } [[3]] (e) {
              console.log(e.message);
            }
          blanks:
            - ["throw"]
            - ["try"]
            - ["catch"]
      - slug: prog-ex-try-libre
        kind: CODE_LIBRE
        title: "Refuser un e-mail sans @"
        difficulty: INTERMEDIAIRE
        skill: algo-fonctions
        statement: |
          1. écris une fonction `verifierEmail(email)` qui **lance** une erreur `"E-mail invalide"` si l'e-mail
             ne contient pas `"@"`, sinon renvoie `"E-mail valide"` ;
          2. appelle-la avec `"awa.exemple.fr"` dans un `try`, et affiche `e.message` dans le `catch`.
        criteria: "throw avec le bon message, try / catch, affichage de e.message."
        hints:
          - "Le test : `if (!email.includes(\"@\")) { throw new Error(\"E-mail invalide\"); }`"
          - "Après le if : `return \"E-mail valide\";`"
          - "`try { console.log(verifierEmail(\"awa.exemple.fr\")); } catch (e) { console.log(e.message); }`"
        solution: |
          function verifierEmail(email) {
            if (!email.includes("@")) {
              throw new Error("E-mail invalide");
            }
            return "E-mail valide";
          }
          try {
            console.log(verifierEmail("awa.exemple.fr"));
          } catch (e) {
            console.log(e.message);
          }
        explanation: "L'e-mail n'a pas de @ : l'erreur est lancée, puis rattrapée et affichée."
        xp: 20
        payload:
          language: javascript
          starter: |
            // Ta fonction verifierEmail, puis le try / catch

          checks:
            - pattern: 'function\s+verifierEmail\s*\(\s*email\s*\)'
              message: "Déclare function verifierEmail(email)."
            - pattern: 'throw\s+new\s+Error\s*\(\s*["''`]E-mail invalide["''`]\s*\)'
              message: "Lance throw new Error(\"E-mail invalide\")."
            - pattern: 'try\s*\{[\s\S]*verifierEmail\s*\(\s*["''`]awa\.exemple\.fr["''`]\s*\)[\s\S]*\}\s*catch\s*\(\s*(\w+)\s*\)\s*\{[\s\S]*\1\.message'
              message: "Appelle verifierEmail(\"awa.exemple.fr\") dans un try, et affiche e.message dans le catch."
          output: "E-mail invalide"
      - slug: prog-ex-try-bug
        kind: CORRIGER_ERREUR
        title: "Un filet qui cache tout"
        difficulty: FACILE
        skill: algo-fonctions
        statement: |
          Ce programme n'affiche rien : le `catch` est vide, l'erreur est cachée. Complète le catch pour
          afficher `Erreur : ` suivi du message de l'erreur.
        criteria: "Le catch affiche le message de l'erreur."
        hints:
          - "Le catch reçoit l'erreur dans e."
          - "Son texte est dans e.message."
          - "`console.log(\"Erreur : \" + e.message);`"
        solution: |
          try {
            throw new Error("Stock épuisé");
          } catch (e) {
            console.log("Erreur : " + e.message);
          }
        explanation: "Un catch doit réagir : ici, il informe."
        xp: 10
        payload:
          language: javascript
          starter: |
            try {
              throw new Error("Stock épuisé");
            } catch (e) {
            }
          checks:
            - pattern: 'catch\s*\(\s*(\w+)\s*\)\s*\{\s*\}'
              absent: true
              message: "Le catch ne doit pas rester vide."
            - pattern: 'console\.log\s*\([^)]*\be\.message'
              message: "Affiche le message : console.log(\"Erreur : \" + e.message);"
          output: "Erreur : Stock épuisé"

  # ===================================================================== LEÇON 3
  - slug: prog-typescript
    title: "TypeScript : des étiquettes de type"
    duration: 11
    objective: "Annoter une variable, un paramètre et un retour de fonction avec un type TypeScript."
    prerequisites: "Leçon « Signaler et rattraper une erreur »."
    skills: [typescript]
    xp: 15
    memo: |
      - **TypeScript** = JavaScript + des **types** vérifiés **avant** l'exécution. Angular est écrit en TypeScript.
      - Variable : `let age: number = 18;`
      - Fonction : `function saluer(nom: string): string { ... }` (paramètre typé, puis type du résultat).
      - Types de base : `string`, `number`, `boolean`, et les listes : `string[]`.
    commonMistakes: |
      - Croire que les types existent à l'exécution : ils disparaissent quand le code devient du JavaScript.
      - Utiliser `any` partout : on perd toute la protection.
    blocks:
      - type: text
        md: |
          En JavaScript, `produit.coleur` donnait `undefined` sans prévenir. **TypeScript** repère ce genre
          d'erreur **pendant que tu écris**, avant même d'exécuter.
      - type: definition
        id: def-typescript
        term: "TypeScript"
        md: |
          Des **étiquettes** collées sur les boîtes, comme « verre » ou « papier » sur les poubelles de tri :
          si on met une bouteille dans la poubelle papier, on est prévenue tout de suite.
      - type: code
        id: code-ts-base
        language: typescript
        title: "Des annotations de type"
        code: |
          let inscrite: boolean = true;
          const prenom: string = "Awa";
          function saluer(nom: string): string {
            return `Bonjour ${nom} !`;
          }
          saluer(true);
        lines:
          - n: 1
            note: "`: boolean` : inscrite ne contiendra que true ou false."
          - n: 3
