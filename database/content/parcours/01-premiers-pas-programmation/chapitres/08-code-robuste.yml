        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot-clé : interface."
          - "Un nombre : number. Facultatif : un point d'interrogation."
          - "interface, number, ?"
        solution: '["interface", "number", "?"]'
        explanation: "`interface Livre { titre: string; pages: number; resume?: string; }`"
        xp: 10
        payload:
          language: typescript
          template: |
            [[1]] Livre {
              titre: string;
              pages: [[2]];
              resume[[3]]: string;
            }
          blanks:
            - ["interface"]
            - ["number"]
            - ["?"]
      - slug: prog-ex-ts-interface
        kind: CODE_LIBRE
        title: "Une interface Utilisatrice"
        difficulty: INTERMEDIAIRE
        skill: typescript
        statement: |
          1. déclare une interface `Utilisatrice` avec `nom` (texte), `email` (texte) et `admin` (booléen) ;
          2. écris une fonction `presenter(u: Utilisatrice): string` qui renvoie
             `` `${u.nom} (${u.email})` `` ;
          3. crée une utilisatrice et affiche le résultat de `presenter`.
        criteria: "Interface complète, fonction typée avec retour string, un appel."
        hints:
          - "`interface Utilisatrice { nom: string; email: string; admin: boolean; }`"
          - "`function presenter(u: Utilisatrice): string { return ...; }`"
          - "`const awa: Utilisatrice = { nom: \"Awa\", email: \"awa@exemple.fr\", admin: false };`"
        solution: |
          interface Utilisatrice {
            nom: string;
            email: string;
            admin: boolean;
          }

          function presenter(u: Utilisatrice): string {
            return `${u.nom} (${u.email})`;
          }

          const awa: Utilisatrice = { nom: "Awa", email: "awa@exemple.fr", admin: false };
          console.log(presenter(awa));
        explanation: "L'interface garantit que chaque utilisatrice a bien un nom, un e-mail et un indicateur admin du bon type."
        xp: 20
        payload:
          language: typescript
          starter: |
            // Interface, fonction et appel

          checks:
            - pattern: 'interface\s+Utilisatrice\s*\{'
              message: "Déclare interface Utilisatrice { ... }."
            - pattern: 'nom\s*:\s*string'
              message: "Propriété nom : string."
            - pattern: 'email\s*:\s*string'
              message: "Propriété email : string."
            - pattern: 'admin\s*:\s*boolean'
              message: "Propriété admin : boolean."
            - pattern: 'function\s+presenter\s*\(\s*\w+\s*:\s*Utilisatrice\s*\)\s*:\s*string'
              message: "Signature : function presenter(u: Utilisatrice): string."
            - pattern: 'presenter\s*\(\s*\w+\s*\)\s*\)'
              message: "Affiche le résultat : console.log(presenter(...))."
            - pattern: ':\s*any\b'
              absent: true
              message: "N'utilise pas any : garde les vrais types."
      - slug: prog-ex-interface-bug
        kind: CORRIGER_ERREUR
        title: "Un objet qui ne respecte pas l'interface"
        difficulty: FACILE
        skill: typescript
        statement: |
          TypeScript signale que l'objet `seance` ne respecte pas l'interface : il manque la propriété
          obligatoire `salle`. Ajoute `salle: "B12"` à l'objet.
        criteria: "L'objet contient la propriété salle."
        hints:
          - "Toutes les propriétés sans ? sont obligatoires."
          - "salle est un texte."
          - "`{ titre: \"SQL\", salle: \"B12\" }`"
        solution: |
          interface Seance {
            titre: string;
            salle: string;
          }
          const seance: Seance = { titre: "SQL", salle: "B12" };
        explanation: "L'objet respecte maintenant le formulaire."
        xp: 10
        payload:
          language: typescript
          starter: |
            interface Seance {
              titre: string;
              salle: string;
            }
            const seance: Seance = { titre: "SQL" };
          checks:
            - pattern: 'const\s+seance\s*:\s*Seance\s*=\s*\{[^}]*salle\s*:\s*["''`]B12["''`]'
              message: "Ajoute la propriété salle: \"B12\" à l'objet."

  # ===================================================================== LEÇON 5
  - slug: prog-asynchrone
    title: "Attendre sans bloquer : async et await"
    duration: 12
    objective: "Comprendre ce qu'est une opération asynchrone et attendre son résultat avec async / await."
    prerequisites: "Leçon « Décrire la forme d'un objet : interface »."
    skills: [javascript-bases, angular-services]
    xp: 20
    memo: |
      - Une opération **asynchrone** prend du temps (appel au serveur, minuteur) : le programme continue en attendant.
      - Une **promesse** (`Promise`) représente un résultat qui arrivera plus tard (ou une erreur).
      - Dans une fonction `async`, `await` attend la promesse **sans bloquer** la page.
      - Les erreurs se gèrent avec `try / catch` autour de `await`.
    commonMistakes: |
      - Oublier `await` : on obtient la promesse au lieu du résultat.
      - Écrire `await` hors d'une fonction `async`.
    blocks:
      - type: text
        md: |
          Quand tu commandes au comptoir d'un café, on te donne un **ticket**. Tu ne restes pas figée devant
          la machine : tu vas t'asseoir, et on t'appelle quand c'est prêt. C'est l'**asynchrone**.
      - type: definition
        id: def-async
        term: "Asynchrone"
        md: |
          Une tâche qui **prend du temps** et dont le résultat arrive **plus tard**. Pendant ce temps, le
          programme continue (la page reste utilisable). Exemple : demander des données à un serveur.
      - type: definition
        id: def-promesse
        term: "Promesse (Promise)"
        md: |
          Le **ticket** du café : l'engagement qu'un résultat arrivera (ou qu'on te préviendra d'un
          problème). `await` = « j'attends mon ticket à cet endroit précis du code ».
      - type: code
        id: code-await
        language: javascript
        title: "Attendre une réponse simulée"
        code: |
          function attendre(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function commander() {
            console.log("Commande passée");
            await attendre(500);
            console.log("Café prêt !");
          }

          commander();
          console.log("Je m'assois en attendant");
        lines:
          - n: 2
            note: "Une promesse qui se réalise après une demi-seconde (500 millisecondes)."
          - n: 5
            note: "`async` : cette fonction peut utiliser `await`."
          - n: 7
            note: "`await` met **cette fonction** en pause jusqu'à la fin de l'attente."
          - n: 12
            note: "Pendant la pause, le reste du programme continue : cette ligne s'affiche **avant** « Café prêt ! »."
      - type: demo
        title: "Observe l'ordre d'affichage"
        language: javascript
        code: |
          function attendre(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }
          async function commander() {
            console.log("Commande passée");
            await attendre(500);
            console.log("Café prêt !");
          }
          commander();
          console.log("Je m'assois en attendant");
      - type: question
        ref: prog-a-q1
        review: code-await
      - type: code
        id: code-fetch
        language: javascript
        title: "Le cas réel : appeler une API"
        code: |
          async function chargerProduits() {
            try {
              const reponse = await fetch("/api/produits");
              const produits = await reponse.json();
              console.log(produits);
            } catch (e) {
              console.log("Impossible de charger les produits");
            }
          }
        lines:
          - n: 3
            note: "`fetch` envoie une demande au serveur et renvoie une promesse de réponse."
          - n: 4
            note: "Lire le contenu JSON prend aussi du temps : encore `await`."
          - n: 6
            note: "Serveur éteint, réseau coupé : on affiche un message clair au lieu de planter."
      - type: question
        ref: prog-a-q2
        review: def-promesse
      - type: text
        md: "**Exercice 1 (guidé)** : complète la fonction asynchrone."
      - type: exercise
        ref: prog-ex-async-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : charger une liste de cours."
      - type: exercise
        ref: prog-ex-async
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un await oublié."
      - type: exercise
        ref: prog-ex-async-bug
      - type: jury
        items:
          - q: "Qu'est-ce que l'asynchrone et pourquoi est-ce important dans une application web ?"
            a: "C'est l'exécution d'une tâche longue (appel HTTP) sans bloquer le reste : l'interface reste utilisable et le résultat est traité quand il arrive, via une promesse ou un Observable."
      - type: quiz
        items:
          - ref: prog-a-q3
            review: code-fetch
          - ref: prog-a-q4
            review: def-async
          - ref: prog-a-q5
            review: code-await
    questions:
      - code: prog-a-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: javascript-bases
        prompt: "Dans l'exemple du café, dans quel ordre s'affichent les messages ?"
        choices:
          - label: "Commande passée, Je m'assois en attendant, Café prêt !"
            correct: true
            why: "Pendant l'await, le reste du programme continue."
          - label: "Commande passée, Café prêt !, Je m'assois en attendant"
            correct: false
            why: "await ne met en pause que la fonction commander."
          - label: "Je m'assois en attendant, Commande passée, Café prêt !"
            correct: false
            why: "commander() est appelée avant, et affiche tout de suite « Commande passée »."
        explanation: "await met en pause la fonction async, pas tout le programme."
      - code: prog-a-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: javascript-bases
        prompt: "Une promesse représente…"
        choices:
          - label: "un résultat qui arrivera plus tard, ou une erreur"
            correct: true
            why: "C'est le ticket du café."
          - label: "une variable constante"
