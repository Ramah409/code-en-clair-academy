  # ===================================================================== LEÇON 4
  - slug: prog-interfaces
    title: "Décrire la forme d'un objet : interface"
    duration: 11
    objective: "Déclarer une interface TypeScript, avec des propriétés obligatoires et facultatives, et l'utiliser comme type."
    prerequisites: "Leçon « TypeScript : des étiquettes de type »."
    skills: [typescript]
    xp: 15
    memo: |
      - `interface Produit { nom: string; prix: number; }` décrit la **forme** attendue d'un objet.
      - Une propriété **facultative** s'écrit avec `?` : `description?: string`.
      - On l'utilise comme un type : `const alarme: Produit = { ... };` ou `Produit[]` pour une liste.
      - Oublier une propriété obligatoire ou mal l'écrire → erreur signalée tout de suite.
    commonMistakes: |
      - Oublier le `?` d'une propriété facultative, puis être obligée de toujours la remplir.
      - Écrire des virgules à la place des points-virgules dans l'interface (les deux sont acceptés, mais on garde une seule habitude).
    blocks:
      - type: text
        md: |
          Une API renvoie des produits : chacun doit avoir un nom et un prix. Une **interface** écrit cette
          règle une fois pour toutes.
      - type: definition
        id: def-interface
        term: "Interface"
        md: |
          Le **formulaire vierge** : « nom : texte, prix : nombre ». Chaque objet de ce type doit remplir le
          formulaire correctement. Les cases marquées `?` sont facultatives.
      - type: code
        id: code-interface
        language: typescript
        title: "Décrire un produit"
        code: |
          interface Produit {
            nom: string;
            prix: number;
            description?: string;
          }

          const alarme: Produit = { nom: "Alarme", prix: 15 };
          const produits: Produit[] = [alarme];
          console.log(alarme.prx);
        lines:
          - n: 1
            note: "`interface` déclare la forme attendue d'un objet."
          - n: 4
            note: "`?` : propriété facultative."
          - n: 7
            note: "L'objet respecte l'interface : pas d'erreur."
          - n: 8
            note: "`Produit[]` : une liste de produits."
          - n: 9
            note: "Erreur détectée tout de suite : la propriété `prx` n'existe pas dans `Produit`."
      - type: question
        ref: prog-ts-q2
        review: def-interface
      - type: question
        ref: prog-ts-q3
        review: code-interface
      - type: text
        md: "**Exercice 1 (guidé)** : complète l'interface."
      - type: exercise
        ref: prog-ex-interface-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une interface et une fonction typée."
      - type: exercise
        ref: prog-ex-ts-interface
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un objet qui ne respecte pas l'interface."
      - type: exercise
        ref: prog-ex-interface-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'une interface en TypeScript ?"
            a: "Un contrat qui décrit la forme d'un objet : ses propriétés et leurs types. Elle sert à vérifier le code, puis disparaît à la compilation."
      - type: quiz
        items:
          - ref: prog-if2-q3
            review: def-interface
          - ref: prog-if2-q4
            review: code-interface
          - ref: prog-if2-q5
            review: def-interface
    questions:
      - code: prog-ts-q2
