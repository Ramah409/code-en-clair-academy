        explanation: "Les propriétés sans `?` sont obligatoires et doivent avoir le bon type."
      - code: prog-ts-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Comment s'écrit le type « liste de produits » ?"
        choices:
          - label: "`Produit[]`"
            correct: true
            why: "Le type des éléments, suivi de crochets."
