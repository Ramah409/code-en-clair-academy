  - code: prog-c8-b2
    kind: RESULTAT_CODE
    difficulty: 2
    skill: algo-fonctions
    prompt: "Qu'affiche ce code ?"
    snippet: |
      function diviserEnMots(phrase) {
        if (phrase === "") {
          throw new Error("Phrase vide");
        }
        return "OK";
      }
      try {
        console.log(diviserEnMots(""));
      } catch (e) {
        console.log(e.message);
      }
    language: javascript
    choices:
      - label: "Phrase vide"
        correct: true
        why: "L'erreur est lancée puis rattrapée : on affiche son message."
      - label: "OK"
        correct: false
        why: "La phrase est vide : throw arrête la fonction avant le return."
      - label: "Rien"
        correct: false
        why: "Le catch affiche le message."
    explanation: "throw → catch → e.message."
