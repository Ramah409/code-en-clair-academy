      - code: prog-a-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: javascript-bases
        prompt: "Quelle opération est typiquement asynchrone ?"
        choices:
          - label: "Demander des données à un serveur"
            correct: true
