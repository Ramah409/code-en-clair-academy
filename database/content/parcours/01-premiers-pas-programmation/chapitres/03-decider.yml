        hints:
          - "ET s'écrit avec deux &."
          - "Chaque côté est une comparaison complète avec ===."
          - "&&, ===."
        solution: '["&&", "==="]'
        explanation: "`email === \"awa@exemple.fr\" && motDePasse === \"soleil\"`"
        xp: 10
        payload:
          language: javascript
          template: |
            const email = "awa@exemple.fr";
            const motDePasse = "soleil";
            if (email === "awa@exemple.fr" [[1]] motDePasse [[2]] "soleil") {
              console.log("Connexion réussie");
            }
          blanks:
            - ["&&"]
            - ["==="]
      - slug: prog-ex-et-libre
        kind: CODE_LIBRE
        title: "L'accès à un atelier"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Avec `const inscrite = true;` et `const aPaye = true;`, affiche `Accès à l'atelier` si la personne
          est inscrite **et** a payé, sinon `Accès refusé`.
        criteria: "Un if avec inscrite && aPaye, et un else."
        hints:
          - "`if (inscrite && aPaye) { ... }`"
          - "Ajoute un else pour le refus."
          - "`console.log(\"Accès à l'atelier\");` dans le if."
        solution: |
          const inscrite = true;
          const aPaye = true;
          if (inscrite && aPaye) {
            console.log("Accès à l'atelier");
          } else {
            console.log("Accès refusé");
          }
        explanation: "Les deux conditions sont vraies : l'accès est accordé."
        xp: 15
        payload:
          language: javascript
          starter: |
            const inscrite = true;
            const aPaye = true;

          checks:
            - pattern: 'if\s*\(\s*inscrite(\s*===\s*true)?\s*&&\s*aPaye(\s*===\s*true)?\s*\)|if\s*\(\s*aPaye(\s*===\s*true)?\s*&&\s*inscrite(\s*===\s*true)?\s*\)'
              message: "Exige les deux : if (inscrite && aPaye)."
            - pattern: '\belse\b'
              message: "Ajoute un else pour le refus."
            - pattern: 'console\.log\s*\(\s*"Accès à l''atelier"\s*\)'
              message: "Affiche \"Accès à l'atelier\" (entre guillemets doubles, à cause de l'apostrophe)."
          output: "Accès à l'atelier"
      - slug: prog-ex-et-bug
        kind: CORRIGER_ERREUR
        title: "Une condition coupée en deux"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme plante : la condition `heure >= 9 && <= 17` est incomplète. Corrige-la pour afficher
          `Ouvert` entre 9 h et 17 h.
        criteria: "Chaque côté du && est une comparaison complète."
        hints:
          - "À droite du &&, il manque quelque chose avant <=."
          - "Chaque comparaison a sa variable, son signe et sa valeur."
          - "`heure >= 9 && heure <= 17`"
        solution: |
          const heure = 14;
          if (heure >= 9 && heure <= 17) {
            console.log("Ouvert");
          } else {
            console.log("Fermé");
          }
        explanation: "On répète la variable des deux côtés du &&."
        xp: 10
        payload:
          language: javascript
          starter: |
            const heure = 14;
            if (heure >= 9 && <= 17) {
              console.log("Ouvert");
            } else {
              console.log("Fermé");
            }
          checks:
            - pattern: 'heure\s*>=\s*9\s*&&\s*heure\s*<=\s*17'
              message: "Complète : heure >= 9 && heure <= 17."
          output: "Ouvert"

  # ===================================================================== LEÇON 6
  - slug: prog-ou-non
    title: "L'une ou l'autre : || et le contraire : !"
    duration: 10
    objective: "Accepter une condition parmi plusieurs avec || (OU) et inverser une condition avec ! (NON)."
    prerequisites: "Leçon « Deux conditions à la fois : && »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - `a || b` est vrai si **au moins un** des deux est vrai.
      - `!a` inverse : `!true` vaut `false`, `!false` vaut `true`.
      - Chaque côté du `||` est une comparaison complète : `ville === "Paris" || ville === "Lyon"`.
    commonMistakes: |
      - Écrire `ville === "Paris" || "Lyon"` : il faut répéter `ville ===`.
      - Confondre && (toutes) et || (au moins une).
    blocks:
      - type: text
        md: |
          « Je paie **par carte ou en espèces**. » Un seul moyen suffit. En JavaScript, c'est `||`. Et pour dire
          « **pas** », on utilise `!`.
      - type: definition
        id: def-ou
        term: "|| (OU)"
        md: |
          Une **porte qui s'ouvre avec l'une ou l'autre clé** : une seule suffit. Le signe `|` s'obtient avec
          AltGr + 6 sur un clavier français.
      - type: code
        id: code-ou
        language: javascript
        title: "Carte ou espèces"
        code: |
          const carte = false;
          const especes = true;
          if (carte || especes) {
            console.log("Paiement accepté");
          }
        lines:
          - n: 3
            note: "`||` : une seule condition vraie suffit. Les espèces sont là : c'est vrai."
      - type: question
        ref: prog-ou-q1
        review: def-ou
      - type: definition
        id: def-non
        term: "! (NON)"
        md: |
          Un **interrupteur** qu'on bascule : `!` transforme vrai en faux, et faux en vrai. `!connecte` se lit
          « pas connecté ».
      - type: code
        id: code-non
        language: javascript
        title: "Pas encore connectée"
        code: |
          const connecte = false;
          if (!connecte) {
            console.log("Merci de te connecter");
          }
        lines:
          - n: 2
            note: "`!connecte` : connecte vaut false, donc « pas connecté » vaut true. Le message s'affiche."
      - type: demo
        title: "Essaie"
        md: "Change `connecte` en true : le message disparaît."
        language: javascript
        code: |
          const connecte = false;
          if (!connecte) {
            console.log("Merci de te connecter");
          }
      - type: question
        ref: prog-if-q4
        review: def-non
      - type: text
        md: "**Exercice 1 (guidé)** : complète avec || et !."
      - type: exercise
        ref: prog-ex-ou-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : le week-end."
      - type: exercise
        ref: prog-ex-ou-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un OU incomplet."
      - type: exercise
        ref: prog-ex-ou-bug
      - type: jury
        items:
          - q: "Quelle différence entre && et || ?"
            a: "`&&` (ET) est vrai seulement si toutes les conditions sont vraies ; `||` (OU) est vrai dès qu'au moins une condition est vraie."
      - type: quiz
        items:
          - ref: prog-ou-q3
            review: def-ou
          - ref: prog-ou-q4
            review: code-ou
          - ref: prog-ou-q5
            review: def-non
    questions:
      - code: prog-ou-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quand `a || b` est-il vrai ?"
        choices:
          - label: "Quand au moins l'un des deux est vrai"
            correct: true
            why: "Une seule clé suffit."
          - label: "Seulement quand les deux sont vrais"
            correct: false
            why: "Ça, c'est &&."
          - label: "Jamais"
            correct: false
            why: "Il suffit d'un seul vrai."
        explanation: "|| = OU : au moins un."
      - code: prog-if-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Que vaut `!true` ?"
        choices:
          - label: "`false`"
            correct: true
            why: "`!` inverse."
          - label: "`true`"
            correct: false
            why: "`!` change vrai en faux."
          - label: "Une erreur"
            correct: false
            why: "C'est une opération valide."
        explanation: "`!` (NON) inverse une valeur vraie ou fausse."
      - code: prog-ou-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: algo-bases
        prompt: "Quelle condition est vraie si la ville est Paris **ou** Lyon ?"
        choices:
          - label: "`ville === \"Paris\" || ville === \"Lyon\"`"
            correct: true
            why: "Deux comparaisons complètes reliées par ||."
          - label: "`ville === \"Paris\" || \"Lyon\"`"
            correct: false
            why: "Il faut répéter ville === à droite."
          - label: "`ville === \"Paris\" && ville === \"Lyon\"`"
            correct: false
            why: "Une ville ne peut pas être les deux à la fois : toujours faux."
        explanation: "« Paris ou Lyon » se traduit par `||`, avec deux comparaisons complètes."
      - code: prog-ou-q4
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const jour = "dimanche";
          if (jour === "samedi" || jour === "dimanche") {
            console.log("Week-end");
          } else {
            console.log("Semaine");
          }
        language: javascript
        choices:
          - label: "Week-end"
            correct: true
            why: "La deuxième comparaison est vraie : cela suffit."
          - label: "Semaine"
            correct: false
            why: "Avec ||, une seule condition vraie suffit."
          - label: "Rien"
            correct: false
            why: "Le if s'exécute."
        explanation: "|| : un seul vrai suffit."
      - code: prog-ou-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "`!false` vaut `true`."
        choices:
          - label: "Vrai"
            correct: true
            why: "! bascule faux en vrai."
          - label: "Faux"
            correct: false
            why: "! inverse toujours."
        explanation: "`!` est l'interrupteur qui bascule."
    exercises:
      - slug: prog-ex-ou-guide
        kind: COMPLETER
        title: "Compléter avec || et !"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète : on accepte le chat **ou** le chien, et on affiche un message si l'animal n'est **pas** vacciné."
        criteria: "Les deux trous sont corrects."
        hints:
          - "OU s'écrit avec deux barres verticales."
          - "NON s'écrit avec un point d'exclamation."
          - "||, !"
        solution: '["||", "!"]'
        explanation: "`animal === \"chat\" || animal === \"chien\"` puis `!vaccine`."
        xp: 10
        payload:
          language: javascript
          template: |
            const animal = "chien";
            const vaccine = false;
            if (animal === "chat" [[1]] animal === "chien") {
              console.log("Animal accepté");
            }
            if ([[2]]vaccine) {
              console.log("Pense au vaccin");
            }
          blanks:
            - ["||"]
            - ["!"]
      - slug: prog-ex-ou-libre
        kind: CODE_LIBRE
        title: "C'est le week-end ?"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Avec `const jour = "samedi";`, affiche `Repos` si le jour est `"samedi"` **ou** `"dimanche"`,
          sinon `Au travail`.
        criteria: "Un if avec deux comparaisons reliées par ||, et un else."
        hints:
          - "`jour === \"samedi\" || jour === \"dimanche\"`"
          - "Dans le if : `console.log(\"Repos\");`"
          - "Dans le else : `console.log(\"Au travail\");`"
        solution: |
          const jour = "samedi";
          if (jour === "samedi" || jour === "dimanche") {
            console.log("Repos");
          } else {
            console.log("Au travail");
          }
        explanation: "Un seul des deux jours suffit pour être le week-end."
        xp: 15
        payload:
          language: javascript
          starter: |
            const jour = "samedi";

          checks:
            - pattern: 'jour\s*===\s*["''`]samedi["''`]\s*\|\|\s*jour\s*===\s*["''`]dimanche["''`]|jour\s*===\s*["''`]dimanche["''`]\s*\|\|\s*jour\s*===\s*["''`]samedi["''`]'
              message: "Relie deux comparaisons complètes avec || : jour === \"samedi\" || jour === \"dimanche\"."
            - pattern: 'console\.log\s*\(\s*["''`]Repos["''`]\s*\)'
              message: "Affiche \"Repos\" le week-end."
            - pattern: 'console\.log\s*\(\s*["''`]Au travail["''`]\s*\)'
              message: "Affiche \"Au travail\" dans le else."
          output: "Repos"
      - slug: prog-ex-ou-bug
        kind: CORRIGER_ERREUR
        title: "Un OU incomplet"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme affiche `Livraison possible` pour **toutes** les villes, même Brest : la partie droite
          du `||` n'est pas une vraie comparaison. Corrige-la pour n'accepter que Paris et Lyon.
        criteria: "Deux comparaisons complètes reliées par ||."
        hints:
          - "À droite du ||, \"Lyon\" tout seul compte toujours comme vrai."
          - "Il faut répéter ville === devant \"Lyon\"."
          - "`ville === \"Paris\" || ville === \"Lyon\"`"
        solution: |
          const ville = "Brest";
          if (ville === "Paris" || ville === "Lyon") {
            console.log("Livraison possible");
          } else {
            console.log("Pas de livraison");
          }
        explanation: "Chaque côté du || doit être une comparaison complète."
        xp: 15
        payload:
          language: javascript
          starter: |
            const ville = "Brest";
            if (ville === "Paris" || "Lyon") {
              console.log("Livraison possible");
            } else {
              console.log("Pas de livraison");
            }
          checks:
            - pattern: '\|\|\s*["''`]Lyon'
              absent: true
              message: "\"Lyon\" seul n'est pas une comparaison : écris ville === \"Lyon\"."
            - pattern: 'ville\s*===\s*["''`]Paris["''`]\s*\|\|\s*ville\s*===\s*["''`]Lyon["''`]'
              message: "Écris : ville === \"Paris\" || ville === \"Lyon\"."
          output: "Pas de livraison"

