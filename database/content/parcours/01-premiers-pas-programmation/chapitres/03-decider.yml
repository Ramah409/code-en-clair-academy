  # ===================================================================== LEÇON 4
  - slug: prog-else-if
    title: "Plusieurs cas : else if"
    duration: 10
    objective: "Tester plusieurs cas à la suite avec else if, dans le bon ordre."
    prerequisites: "Leçon « Sinon… : l'instruction else »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - `else if (condition)` ajoute un cas entre le if et le else.
      - Les conditions sont testées **dans l'ordre** ; la **première** vraie gagne, les suivantes sont ignorées.
      - On commence par le cas **le plus précis** (le plus exigeant).
      - Le `else` final attrape tout ce qui reste.
    commonMistakes: |
      - Mettre un cas large en premier : il « avale » les suivants.
      - Écrire `elseif` en un seul mot.
    blocks:
      - type: text
        md: |
          Parfois, il y a plus de deux routes : « le matin, dis bonjour ; l'après-midi, bon après-midi ; le
          soir, bonsoir ». On ajoute des cas avec `else if`.
      - type: definition
        id: def-else-if
        term: "else if (sinon, si…)"
        md: |
          Une **file de guichets** : on présente la question au premier guichet ; s'il répond non, on passe au
          suivant ; dès qu'un guichet répond oui, on s'arrête là.
      - type: code
        id: code-else-if
        language: javascript
        title: "Une salutation selon l'heure"
        code: |
          const heure = 15;
          if (heure < 12) {
            console.log("Bonjour");
          } else if (heure < 18) {
            console.log("Bon après-midi");
          } else {
            console.log("Bonsoir");
          }
        lines:
          - n: 2
            note: "Premier guichet : avant midi ? 15 non."
          - n: 4
            note: "`else if` : testé seulement si le premier a dit non. Avant 18 h ? Oui : « Bon après-midi »."
          - n: 6
            note: "Le `else` final attrape tous les autres cas (le soir)."
      - type: demo
        title: "Change l'heure"
        md: "Essaie 9, puis 15, puis 20."
        language: javascript
        code: |
          const heure = 15;
          if (heure < 12) {
            console.log("Bonjour");
          } else if (heure < 18) {
            console.log("Bon après-midi");
          } else {
            console.log("Bonsoir");
          }
      - type: question
        ref: prog-if-q3
        review: code-else-if
      - type: question
        ref: prog-ei-q2
        review: def-else-if
      - type: text
        md: "**Exercice 1 (guidé)** : complète les trois cas."
      - type: exercise
        ref: prog-ex-elseif-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un conseil selon la saison."
      - type: exercise
        ref: prog-ex-elseif-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : les cas sont dans le mauvais ordre."
      - type: exercise
        ref: prog-ex-elseif-bug
      - type: quiz
        items:
          - ref: prog-ei-q3
            review: def-else-if
          - ref: prog-ei-q4
            review: code-else-if
          - ref: prog-ei-q5
            review: def-else-if
    questions:
      - code: prog-if-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-bases
        prompt: "Avec `heure = 21`, qu'affiche le programme ?"
        snippet: |
