      - slug: prog-ex-elseif-libre
        kind: CODE_LIBRE
        title: "Un conseil selon la saison"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Crée `const saison = "hiver";`. Affiche :
          - `Prends un manteau` si c'est l'hiver ;
          - `Prends un maillot` si c'est l'été ;
          - `Prends une veste` dans tous les autres cas.
        criteria: "if, else if et else avec les trois messages."
        hints:
          - "`if (saison === \"hiver\") { ... }`"
          - "`else if (saison === \"été\") { ... }`"
          - "`else { console.log(\"Prends une veste\"); }`"
        solution: |
          const saison = "hiver";
          if (saison === "hiver") {
            console.log("Prends un manteau");
          } else if (saison === "été") {
            console.log("Prends un maillot");
          } else {
            console.log("Prends une veste");
          }
        explanation: "Trois routes : deux cas précis, puis le else pour le reste."
        xp: 15
        payload:
          language: javascript
          starter: |
            const saison = "hiver";

          checks:
            - pattern: 'if\s*\(\s*saison\s*===\s*["''`]hiver["''`]\s*\)'
              message: "Premier cas : if (saison === \"hiver\")."
            - pattern: 'else\s+if\s*\(\s*saison\s*===\s*["''`]été["''`]\s*\)'
              message: "Deuxième cas : else if (saison === \"été\")."
            - pattern: '\}\s*else\s*\{'
              message: "Termine par un else pour les autres saisons."
            - pattern: 'console\.log\s*\(\s*["''`]Prends une veste["''`]\s*\)'
              message: "Dans le else, affiche \"Prends une veste\"."
          output: "Prends un manteau"
      - slug: prog-ex-elseif-bug
        kind: CORRIGER_ERREUR
        title: "Des cas dans le mauvais ordre"
        difficulty: INTERMEDIAIRE
        skill: algo-bases
        statement: |
          À 9 h, ce programme devrait afficher `Bonjour`, mais il affiche `Bon après-midi` : le cas le plus
          large est placé en premier. Remets les deux cas dans le bon ordre (le plus précis d'abord).
        criteria: "heure < 12 est testé avant heure < 18."
        hints:
          - "9 est avant 18 : le premier cas répond oui tout de suite."
          - "Il faut tester « avant midi » en premier."
          - "`if (heure < 12) { Bonjour } else if (heure < 18) { Bon après-midi }`"
        solution: |
          const heure = 9;
          if (heure < 12) {
            console.log("Bonjour");
          } else if (heure < 18) {
            console.log("Bon après-midi");
          } else {
            console.log("Bonsoir");
          }
        explanation: "Le cas le plus précis (avant midi) doit passer avant le plus large (avant 18 h)."
        xp: 15
        payload:
          language: javascript
          starter: |
            const heure = 9;
            if (heure < 18) {
              console.log("Bon après-midi");
            } else if (heure < 12) {
              console.log("Bonjour");
            } else {
