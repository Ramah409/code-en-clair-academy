        snippet: |
          const heure = 8;
          if (heure < 18) {
            console.log("Journée");
          } else if (heure < 12) {
            console.log("Matin");
          }
        language: javascript
        choices:
          - label: "Journée"
            correct: true
            why: "8 est avant 18 : le premier cas gagne, le second n'est jamais testé."
          - label: "Matin"
            correct: false
            why: "Le premier cas, trop large, a déjà répondu oui."
          - label: "Journée puis Matin"
            correct: false
            why: "Un seul bloc s'exécute."
        explanation: "Le cas le plus large placé en premier avale les suivants : on commence par le plus précis."
      - code: prog-ei-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
