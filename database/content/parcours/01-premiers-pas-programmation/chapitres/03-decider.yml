          - label: "À rien, il est interdit"
            correct: false
            why: "Il est facultatif, mais très utile."
        explanation: "Sans else final, aucun message ne s'affiche si aucun cas n'est vrai."
    exercises:
      - slug: prog-ex-elseif-guide
        kind: COMPLETER
        title: "Compléter les trois cas"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète pour afficher un message selon le feu : vert, orange ou autre."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le premier cas commence par if."
          - "Le deuxième cas : else if."
          - "if, else if, else."
        solution: '["if", "else if", "else"]'
        explanation: "if pour le premier cas, else if pour le deuxième, else pour tout le reste."
        xp: 10
        payload:
          language: javascript
          template: |
            const feu = "orange";
            [[1]] (feu === "vert") {
              console.log("Passe");
            } [[2]] (feu === "orange") {
              console.log("Ralentis");
            } [[3]] {
              console.log("Arrête-toi");
            }
          blanks:
            - ["if"]
