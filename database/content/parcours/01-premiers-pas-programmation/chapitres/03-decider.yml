  # ===================================================================== LEÇON 5
  - slug: prog-et
    title: "Deux conditions à la fois : &&"
    duration: 9
    objective: "Exiger que deux conditions soient vraies en même temps avec && (ET)."
    prerequisites: "Leçon « Plusieurs cas : else if »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - `a && b` est vrai seulement si `a` **et** `b` sont vrais.
      - Il suffit qu'une seule soit fausse pour que tout soit faux.
      - Chaque côté du `&&` est une comparaison **complète** : `age >= 12 && age <= 17`.
    commonMistakes: |
      - Écrire `age >= 12 && <= 17` : il manque `age` à droite.
      - Utiliser && pour « Paris et Lyon » : une ville ne peut pas valoir les deux à la fois (ce sera || à la leçon suivante).
    blocks:
      - type: text
        md: |
          « Pour entrer, il faut **ton billet et ta pièce d'identité**. » Une seule chose ne suffit pas : il
          faut les deux. En JavaScript, c'est `&&`.
      - type: definition
        id: def-et
        term: "&& (ET)"
        md: |
          Une **porte à deux serrures** : il faut les deux clés. `billet && identite` est vrai seulement si
          les deux sont vrais.
      - type: code
        id: code-et
        language: javascript
        title: "Billet et pièce d'identité"
        code: |
          const aUnBillet = true;
          const aSaPiece = false;
          if (aUnBillet && aSaPiece) {
            console.log("Bon voyage !");
          } else {
            console.log("Il manque quelque chose");
          }
        lines:
          - n: 3
            note: "`&&` : les deux doivent être vrais. Ici, la pièce manque : c'est faux."
          - n: 6
            note: "On arrive donc dans le else."
      - type: demo
        title: "Essaie"
        md: "Mets `aSaPiece` à true : le voyage est autorisé."
        language: javascript
        code: |
          const aUnBillet = true;
          const aSaPiece = false;
          if (aUnBillet && aSaPiece) {
            console.log("Bon voyage !");
          } else {
            console.log("Il manque quelque chose");
          }
      - type: question
        ref: prog-et-q1
        review: def-et
      - type: question
        ref: prog-if-q2
        review: code-et
      - type: text
        md: "**Exercice 1 (guidé)** : complète la double condition."
      - type: exercise
        ref: prog-ex-et-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : l'accès à un atelier."
      - type: exercise
        ref: prog-ex-et-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une condition coupée en deux."
      - type: exercise
        ref: prog-ex-et-bug
      - type: quiz
        items:
          - ref: prog-c2-b1
            review: def-et
          - ref: prog-et-q4
            review: def-et
          - ref: prog-et-q5
            review: code-et
    questions:
      - code: prog-et-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quand `a && b` est-il vrai ?"
        choices:
          - label: "Quand a et b sont vrais tous les deux"
            correct: true
            why: "Les deux clés sont nécessaires."
          - label: "Quand au moins l'un des deux est vrai"
