      - code: prog-ei-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quand plusieurs conditions sont vraies, quel bloc s'exécute ?"
        choices:
          - label: "Le premier dont la condition est vraie"
            correct: true
            why: "Dès qu'un guichet dit oui, on s'arrête."
          - label: "Tous ceux dont la condition est vraie"
            correct: false
            why: "Un seul bloc s'exécute."
          - label: "Le dernier"
            correct: false
            why: "C'est le premier vrai qui gagne."
        explanation: "L'ordre des cas est donc très important."
      - code: prog-ei-q3
