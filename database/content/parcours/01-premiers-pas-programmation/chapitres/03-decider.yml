slug: prog-decider-repeter
position: 3
level: DEBUTANT
title: "Prendre des décisions"
summary: "Comparer deux valeurs, puis choisir un chemin avec if, else, else if, et combiner des conditions avec &&, || et !. Une seule notion par leçon."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: prog-comparaisons
    title: "Comparer deux valeurs : ===, !==, <, >"
    duration: 9
    objective: "Comparer deux valeurs et obtenir true ou false avec ===, !==, <, >, <= et >=."
    prerequisites: "Chapitre « Jouer avec les textes »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - Une **comparaison** répond toujours `true` (vrai) ou `false` (faux).
      - `===` : est égal à. `!==` : est différent de.
      - `<` plus petit, `>` plus grand, `<=` plus petit **ou égal**, `>=` plus grand **ou égal**.
      - `=` (un seul) **range** une valeur ; `===` (trois) **compare**.
    commonMistakes: |
      - Écrire `=` au lieu de `===` pour comparer.
      - Inverser les signes : on écrit `>=` (le signe égal en second).
      - Comparer un texte et un nombre : `"18" === 18` vaut `false`.
    blocks:
      - type: text
        md: |
          Avant de prendre une décision, un programme **pose une question** : « l'âge est-il au moins 18 ? »,
          « le mot de passe est-il le bon ? ». Ces questions s'écrivent avec des **comparaisons**.
      - type: definition
        id: def-comparaison
        term: "Comparaison"
        md: |
          Une **balance** : on pose deux valeurs, et elle répond `true` ou `false`. `===` demande « sont-elles
          pareilles ? », `>` demande « la première est-elle plus grande ? ».
      - type: code
        id: code-comparaison
        language: javascript
        title: "Poser des questions"
        code: |
          const age = 20;
          const ville = "Lyon";
          console.log(age >= 18);
          console.log(ville === "Paris");
          console.log(ville !== "Paris");
        lines:
          - n: 3
            note: "20 est-il plus grand ou égal à 18 ? Oui : true."
          - n: 4
            note: "Lyon est-il égal à Paris ? Non : false."
          - n: 5
            note: "Lyon est-il différent de Paris ? Oui : true."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis change l'âge en 15 et la ville en « Paris »."
        language: javascript
        code: |
          const age = 20;
          const ville = "Lyon";
          console.log(age >= 18);
          console.log(ville === "Paris");
          console.log(ville !== "Paris");
      - type: question
        ref: prog-if-q5
        review: def-comparaison
      - type: question
        ref: prog-cp-q2
        review: code-comparaison
      - type: text
        md: "**Exercice 1 (guidé)** : choisis le bon signe."
      - type: exercise
        ref: prog-ex-comparer-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : pose trois questions."
      - type: exercise
        ref: prog-ex-comparer-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un seul signe égal."
      - type: exercise
        ref: prog-ex-comparer-bug
      - type: jury
        items:
          - q: "Quelle différence entre = et === en JavaScript ?"
            a: "`=` range une valeur dans une variable (affectation). `===` compare deux valeurs, type compris, et renvoie vrai ou faux."
      - type: quiz
        items:
          - ref: prog-cp-q3
            review: def-comparaison
          - ref: prog-cp-q4
            review: code-comparaison
          - ref: prog-cp-q5
            review: def-comparaison
    questions:
      - code: prog-if-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "`age = 18` compare l'âge à 18."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : `=` range 18 dans age ; pour comparer, il faut `===`."
          - label: "Faux"
            correct: true
            why: "Exact : c'est un rangement, une erreur classique."
        explanation: "Pour comparer : `===`. Pour ranger : `=`."
      - code: prog-cp-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const couleur = "bleu";
          console.log(couleur === "bleu");
        language: javascript
        choices:
          - label: "true"
            correct: true
            why: "La couleur vaut bien bleu."
          - label: "false"
            correct: false
            why: "Les deux textes sont identiques."
          - label: "bleu"
            correct: false
            why: "Une comparaison répond true ou false."
        explanation: "Une comparaison donne toujours un booléen."
      - code: prog-cp-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quel signe veut dire « est différent de » ?"
        choices:
          - label: "`!==`"
            correct: true
            why: "Le point d'exclamation veut dire « pas »."
          - label: "`===`"
            correct: false
            why: "=== veut dire « est égal à »."
          - label: "`<>`"
            correct: false
            why: "Ce signe n'existe pas en JavaScript."
        explanation: "`===` égal, `!==` différent."
      - code: prog-cp-q4
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const age = 18;
          console.log(age >= 18);
        language: javascript
        choices:
          - label: "true"
            correct: true
            why: "`>=` veut dire plus grand **ou égal** : 18 compte."
          - label: "false"
            correct: false
            why: "Ce serait le cas avec `>` seul."
          - label: "18"
            correct: false
            why: "Une comparaison répond true ou false."
        explanation: "`>` exclut la valeur repère, `>=` l'inclut."
      - code: prog-cp-q5
        kind: VRAI_FAUX
        difficulty: 2
        skill: algo-bases
        prompt: "`\"18\" === 18` vaut `true`."
        choices:
          - label: "Vrai"
            correct: false
            why: "L'un est un texte, l'autre un nombre : ils ne sont pas identiques."
          - label: "Faux"
            correct: true
            why: "Exact : `===` compare aussi la sorte de valeur."
        explanation: "`===` exige la même valeur **et** la même sorte."
    exercises:
      - slug: prog-ex-comparer-guide
        kind: COMPLETER
        title: "Le bon signe"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète chaque comparaison pour qu'elle affiche true."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Égal : trois signes égal."
          - "Différent : point d'exclamation puis deux signes égal."
          - "===, !==, >="
        solution: '["===", "!==", ">="]'
        explanation: "Lyon est égal à Lyon, Lyon est différent de Paris, 20 est plus grand ou égal à 18."
        xp: 10
        payload:
          language: javascript
          template: |
            const ville = "Lyon";
            const age = 20;
            console.log(ville [[1]] "Lyon");   // true
            console.log(ville [[2]] "Paris");  // true
            console.log(age [[3]] 18);         // true
          blanks:
            - ["==="]
            - ["!=="]
            - [">=", ">"]
      - slug: prog-ex-comparer-libre
        kind: CODE_LIBRE
        title: "Trois questions"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Avec `const pays = "Mali";` et `const age = 16;`, affiche :
          1. si le pays est égal à `"Mali"` ;
          2. si le pays est différent de `"France"` ;
          3. si l'âge est plus grand ou égal à `18`.
        criteria: "Trois console.log avec ===, !== et >=."
        hints:
          - "`console.log(pays === \"Mali\");`"
          - "`console.log(pays !== \"France\");`"
          - "`console.log(age >= 18);`"
        solution: |
          const pays = "Mali";
          const age = 16;
          console.log(pays === "Mali");
          console.log(pays !== "France");
          console.log(age >= 18);
        explanation: "Chaque comparaison répond true ou false : ici true, true, puis false."
        xp: 15
        payload:
          language: javascript
          starter: |
            const pays = "Mali";
            const age = 16;

          checks:
            - pattern: 'console\.log\s*\(\s*pays\s*===\s*["''`]Mali["''`]\s*\)'
              message: "Affiche pays === \"Mali\"."
            - pattern: 'console\.log\s*\(\s*pays\s*!==\s*["''`]France["''`]\s*\)'
              message: "Affiche pays !== \"France\"."
            - pattern: 'console\.log\s*\(\s*age\s*>=\s*18\s*\)'
              message: "Affiche age >= 18."
          output: |
            true
            true
            false
      - slug: prog-ex-comparer-bug
        kind: CORRIGER_ERREUR
        title: "Ranger au lieu de comparer"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme doit afficher si le code saisi est le bon (`false` ici), mais il affiche `1234` et
          change la valeur de la saisie. Corrige le signe.
        criteria: "La comparaison utilise ===."
        hints:
          - "Un seul `=` range une valeur."
          - "Pour comparer, il en faut trois."
          - "`console.log(saisie === \"1234\");`"
        solution: |
          let saisie = "0000";
          console.log(saisie === "1234");
        explanation: "`===` compare sans rien changer : 0000 n'est pas 1234, donc false."
        xp: 10
        payload:
          language: javascript
          starter: |
            let saisie = "0000";
            console.log(saisie = "1234");
          checks:
            - pattern: 'console\.log\s*\(\s*saisie\s*===\s*["''`]1234["''`]\s*\)'
              message: "Compare avec === : saisie === \"1234\"."
            - pattern: 'saisie\s*=\s*["''`]1234'
              absent: true
              message: "Un seul = range la valeur : il faut ===."
          output: "false"

  # ===================================================================== LEÇON 2
  - slug: prog-conditions
    title: "Si… : l'instruction if"
    duration: 9
    objective: "Exécuter un bloc d'instructions seulement si une condition est vraie, avec if."
    prerequisites: "Leçon « Comparer deux valeurs »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - `if (condition) { ... }` : le bloc entre accolades ne s'exécute **que si** la condition est vraie.
      - La condition est entre **parenthèses**, le bloc entre **accolades**.
      - Si la condition est fausse, on saute le bloc et on continue après.
    commonMistakes: |
      - Oublier les parenthèses autour de la condition.
      - Oublier l'accolade fermante `}`.
      - Mettre un point-virgule juste après la parenthèse : `if (x) ;` rend le if inutile.
    blocks:
      - type: text
        md: |
          Dans la vie, on décide sans cesse : « **s'il** pleut, je prends un parapluie ». Un programme fait
          pareil avec `if`.
      - type: definition
        id: def-condition
        term: "if (si)"
        md: |
          Une **porte** avec un gardien : si la réponse à la question est `true`, la porte s'ouvre et on
          exécute le bloc ; sinon, on passe son chemin.
      - type: code
        id: code-if
        language: javascript
        title: "Un parapluie s'il pleut"
        code: |
          const meteo = "pluie";
          if (meteo === "pluie") {
            console.log("Prends ton parapluie");
          }
          console.log("Bonne journée");
        lines:
          - n: 2
            note: "`if` = « si ». La question est entre parenthèses."
          - n: 3
            note: "Ce bloc, entre accolades, ne s'exécute que si la météo vaut « pluie »."
          - n: 5
            note: "Après le bloc : cette ligne s'exécute dans tous les cas."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis change la météo en « soleil » : seul « Bonne journée » s'affiche."
        language: javascript
        code: |
          const meteo = "pluie";
          if (meteo === "pluie") {
            console.log("Prends ton parapluie");
          }
          console.log("Bonne journée");
      - type: question
        ref: prog-si-q1
        review: def-condition
      - type: question
        ref: prog-si-q2
        review: code-if
      - type: text
        md: "**Exercice 1 (guidé)** : complète le if."
      - type: exercise
        ref: prog-ex-si-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un message seulement pour les adultes."
      - type: exercise
        ref: prog-ex-si-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un if mal écrit."
      - type: exercise
        ref: prog-ex-si-bug
      - type: quiz
        items:
          - ref: prog-si-q3
            review: code-if
          - ref: prog-si-q4
            review: def-condition
          - ref: prog-si-q5
            review: code-if
    questions:
      - code: prog-si-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quand le bloc d'un `if` s'exécute-t-il ?"
        choices:
          - label: "Seulement si la condition vaut true"
            correct: true
            why: "La porte ne s'ouvre que sur un oui."
          - label: "Toujours"
            correct: false
            why: "Sinon, le if ne servirait à rien."
          - label: "Seulement si la condition vaut false"
            correct: false
            why: "C'est l'inverse."
        explanation: "if = « si c'est vrai, alors… »."
      - code: prog-si-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const age = 15;
          if (age >= 18) {
            console.log("Majeur");
          }
          console.log("Fin");
        language: javascript
        choices:
          - label: "Fin"
            correct: true
            why: "15 n'est pas >= 18 : le bloc est sauté."
          - label: "Majeur puis Fin"
            correct: false
            why: "La condition est fausse."
          - label: "Rien"
            correct: false
            why: "La dernière ligne est hors du if : elle s'exécute toujours."
        explanation: "Ce qui est après l'accolade fermante s'exécute dans tous les cas."
      - code: prog-si-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quelle écriture est correcte ?"
        choices:
          - label: "`if (ville === \"Lyon\") { console.log(\"Salut\"); }`"
            correct: true
            why: "Condition entre parenthèses, bloc entre accolades."
          - label: "`if ville === \"Lyon\" { console.log(\"Salut\"); }`"
            correct: false
            why: "Il manque les parenthèses autour de la condition."
          - label: "`if (ville = \"Lyon\") { console.log(\"Salut\"); }`"
            correct: false
            why: "Un seul = range au lieu de comparer."
        explanation: "`if (condition) { bloc }`."
      - code: prog-si-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "Si la condition d'un if est fausse, le programme s'arrête."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : il saute le bloc et continue après."
          - label: "Faux"
            correct: true
            why: "Exact : on passe simplement son chemin."
        explanation: "Une condition fausse fait sauter le bloc, rien de plus."
      - code: prog-si-q5
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const inscrite = true;
          if (inscrite === true) {
            console.log("Bienvenue");
          }
        language: javascript
        choices:
          - label: "Bienvenue"
            correct: true
            why: "La condition est vraie."
          - label: "Rien"
            correct: false
            why: "inscrite vaut true : le bloc s'exécute."
          - label: "true"
            correct: false
            why: "On affiche le texte du bloc, pas la condition."
        explanation: "Astuce : `if (inscrite)` suffit, car inscrite vaut déjà true ou false."
    exercises:
      - slug: prog-ex-si-guide
        kind: COMPLETER
        title: "Compléter le if"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète pour afficher « Accès autorisé » seulement si le code vaut « 1234 »."
        criteria: "Les trois trous sont corrects."
        hints:
          - "« si » se dit if."
          - "Pour comparer : trois signes égal."
          - "if, ===, {"
        solution: '["if", "===", "{"]'
        explanation: "`if (code === \"1234\") { ... }`"
        xp: 10
        payload:
          language: javascript
          template: |
            const code = "1234";
            [[1]] (code [[2]] "1234") [[3]]
              console.log("Accès autorisé");
            }
          blanks:
            - ["if"]
            - ["==="]
            - ["{"]
      - slug: prog-ex-si-libre
        kind: CODE_LIBRE
        title: "Seulement pour les adultes"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Crée `const age = 20;`. Si l'âge est plus grand ou égal à 18, affiche `Tu peux voter`.
          Après le if, affiche `Merci` dans tous les cas.
        criteria: "Un if avec age >= 18, un message dans le bloc, un message après."
        hints:
          - "`if (age >= 18) { ... }`"
          - "Dans le bloc : `console.log(\"Tu peux voter\");`"
          - "Après l'accolade fermante : `console.log(\"Merci\");`"
        solution: |
          const age = 20;
          if (age >= 18) {
            console.log("Tu peux voter");
          }
          console.log("Merci");
        explanation: "Le premier message dépend de l'âge, le second s'affiche toujours."
        xp: 15
        payload:
          language: javascript
          starter: |
            const age = 20;

          checks:
            - pattern: 'if\s*\(\s*age\s*>=\s*18\s*\)\s*\{'
              message: "Écris la condition : if (age >= 18) {"
            - pattern: 'console\.log\s*\(\s*["''`]Tu peux voter["''`]\s*\)'
              message: "Dans le bloc, affiche \"Tu peux voter\"."
            - pattern: '\}\s*console\.log\s*\(\s*["''`]Merci["''`]\s*\)'
              message: "Après le bloc, affiche \"Merci\"."
          output: |
            Tu peux voter
            Merci
      - slug: prog-ex-si-bug
        kind: CORRIGER_ERREUR
        title: "Un if mal écrit"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme doit afficher `Bon appétit` si le repas est prêt. Il manque les parenthèses autour de
          la condition et l'accolade fermante. Corrige-le.
        criteria: "Condition entre parenthèses, bloc fermé."
        hints:
          - "La condition d'un if est toujours entre parenthèses."
          - "Chaque accolade ouvrante a sa fermante."
          - "`if (pret === true) { ... }`"
        solution: |
          const pret = true;
          if (pret === true) {
            console.log("Bon appétit");
          }
        explanation: "`if (condition) { bloc }` : parenthèses et accolades vont par paires."
        xp: 10
        payload:
          language: javascript
          starter: |
            const pret = true;
            if pret === true {
              console.log("Bon appétit");
          checks:
            - pattern: 'if\s*\(\s*pret(\s*===\s*true)?\s*\)\s*\{'
              message: "Mets la condition entre parenthèses : if (pret === true) {"
            - pattern: 'console\.log\s*\(\s*["''`]Bon appétit["''`]\s*\)\s*;?\s*\}'
              message: "Ferme le bloc avec } après le console.log."
          output: "Bon appétit"

  # ===================================================================== LEÇON 3
  - slug: prog-else
    title: "Sinon… : l'instruction else"
    duration: 9
    objective: "Choisir entre deux chemins avec if … else."
    prerequisites: "Leçon « Si… : l'instruction if »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - `if (condition) { A } else { B }` : si c'est vrai on fait A, **sinon** on fait B.
      - Un seul des deux blocs s'exécute, jamais les deux.
      - `else` n'a pas de condition : il attrape tous les autres cas.
    commonMistakes: |
      - Écrire une condition après else : `else (age < 18)` provoque une erreur.
      - Mettre le else à l'intérieur du bloc du if.
    blocks:
      - type: text
        md: |
          « **S'il** pleut, je prends un parapluie, **sinon** des lunettes de soleil. » Avec `else`, le
          programme a un plan B.
      - type: definition
        id: def-else
        term: "else (sinon)"
        md: |
          Un **carrefour** à deux routes : la condition choisit la route de gauche (if) ou celle de droite
          (else). On ne peut pas prendre les deux.
      - type: code
        id: code-else
        language: javascript
        title: "Majeur ou mineur ?"
        code: |
          const age = 16;
          if (age >= 18) {
            console.log("Accès autorisé");
          } else {
            console.log("Accès réservé aux adultes");
          }
        lines:
          - n: 2
            note: "La question : l'âge est-il au moins 18 ?"
          - n: 3
            note: "Route 1 : seulement si c'est vrai."
          - n: 4
            note: "`else` = « sinon » : route 2, quand c'est faux. Ici, 16 n'est pas au moins 18 : on arrive ici."
      - type: demo
        title: "Change l'âge et exécute"
        language: javascript
        code: |
          const age = 16;
          if (age >= 18) {
            console.log("Accès autorisé");
          } else {
            console.log("Accès réservé aux adultes");
          }
      - type: question
        ref: prog-if-q1
        review: def-else
      - type: question
        ref: prog-el-q2
        review: code-else
      - type: text
        md: "**Exercice 1 (guidé)** : une réduction pour les étudiants."
      - type: exercise
        ref: prog-ex-if-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un conseil selon la météo."
      - type: exercise
        ref: prog-ex-meteo
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un else avec une condition."
      - type: exercise
        ref: prog-ex-else-bug
      - type: quiz
        items:
          - ref: prog-el-q3
            review: def-else
          - ref: prog-el-q4
            review: code-else
          - ref: prog-el-q5
            review: def-else
    questions:
      - code: prog-if-q1
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const meteo = "soleil";
          if (meteo === "pluie") {
            console.log("Parapluie");
          } else {
            console.log("Lunettes de soleil");
          }
        language: javascript
        choices:
          - label: "Lunettes de soleil"
            correct: true
            why: "La météo n'est pas « pluie » : on prend la route du else."
          - label: "Parapluie"
            correct: false
            why: "Le bloc du if ne s'exécute que si la condition est vraie."
          - label: "Parapluie puis Lunettes de soleil"
            correct: false
            why: "Un seul des deux blocs s'exécute."
        explanation: "if / else : un seul chemin est suivi."
      - code: prog-el-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Combien de blocs s'exécutent dans un if / else ?"
        choices:
          - label: "Un seul : celui du if ou celui du else"
            correct: true
            why: "C'est un carrefour : une seule route."
          - label: "Les deux"
