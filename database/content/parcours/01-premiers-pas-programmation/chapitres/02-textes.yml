        criteria: "Les deux trous sont corrects."
        hints:
          - "La taille d'un texte : length."
          - "« contient-il ? » se dit includes."
          - "length, includes."
        solution: '["length", "includes"]'
        explanation: "`pseudo.length` donne la taille ; `pseudo.includes(\"2025\")` répond true."
        xp: 10
