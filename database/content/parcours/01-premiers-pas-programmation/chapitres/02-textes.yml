  # ===================================================================== LEÇON 4
  - slug: prog-questions-texte
    title: "Interroger un texte : length et includes"
    duration: 9
    objective: "Connaître la longueur d'un texte avec length et savoir s'il contient un mot avec includes."
    prerequisites: "Leçon « Transformer un texte : majuscules, minuscules, espaces »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - `texte.length` donne le **nombre de caractères** (espaces compris). **Sans parenthèses** : c'est une information, pas un outil.
      - `texte.includes("mot")` répond `true` si le texte contient ce mot, sinon `false`.
      - `includes` respecte les majuscules : `"Lyon".includes("lyon")` vaut `false`.
    commonMistakes: |
      - Écrire `texte.length()` avec des parenthèses : erreur.
      - Oublier que `includes` fait la différence entre majuscules et minuscules.
    blocks:
      - type: text
        md: |
          Un mot de passe est-il assez long ? Un message contient-il un mot interdit ? Le programme **pose des
          questions** aux textes.
      - type: definition
        id: def-length-includes
        term: "length et includes"
        md: |
          - `length` : la **taille** du texte, comme le compteur de caractères d'un SMS ;
          - `includes("…")` : « **contient-il** ce morceau ? », comme la recherche Ctrl+F. Réponse : `true` ou `false`.
      - type: code
        id: code-length-includes
        language: javascript
        title: "Deux questions à un texte"
        code: |
          const phrase = "J'adore le chocolat";
          console.log(phrase.length);
          console.log(phrase.includes("chocolat"));
          console.log(phrase.includes("vanille"));
        lines:
          - n: 2
            note: "`length` sans parenthèses : le nombre de caractères de la phrase."
          - n: 3
            note: "La phrase contient « chocolat » : affiche true."
          - n: 4
            note: "Elle ne contient pas « vanille » : affiche false."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis cherche `\"Chocolat\"` avec une majuscule : includes répond false."
        language: javascript
        code: |
          const phrase = "J'adore le chocolat";
          console.log(phrase.length);
          console.log(phrase.includes("chocolat"));
          console.log(phrase.includes("vanille"));
      - type: question
        ref: prog-c-q3
        review: def-length-includes
      - type: question
        ref: prog-qt-q2
        review: code-length-includes
      - type: text
        md: "**Exercice 1 (guidé)** : complète les deux questions."
      - type: exercise
        ref: prog-ex-questions-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un message contient-il « urgent » ?"
      - type: exercise
        ref: prog-ex-mot-cle
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : length est mal écrit."
      - type: exercise
        ref: prog-ex-length-bug
      - type: jury
        items:
          - q: "À quoi sert includes sur un texte ?"
            a: "À savoir si un texte contient un morceau donné. Il renvoie true ou false, en tenant compte des majuscules."
      - type: quiz
        items:
          - ref: prog-qt-q3
            review: def-length-includes
          - ref: prog-qt-q4
            review: def-length-includes
          - ref: prog-qt-q5
            review: code-length-includes
    questions:
      - code: prog-c-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const phrase = "J'adore le chocolat";
          console.log(phrase.includes("chocolat"));
        language: javascript
        choices:
          - label: "true"
            correct: true
            why: "La phrase contient bien le mot « chocolat »."
          - label: "false"
            correct: false
            why: "Ce serait le cas si le mot n'était pas dans la phrase."
          - label: "chocolat"
            correct: false
            why: "`includes` répond par vrai ou faux, il ne renvoie pas le mot."
        explanation: "`includes` répond à la question « ce texte contient-il ce mot ? » par `true` ou `false`."
      - code: prog-qt-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Que donne `mot.length` ?"
        choices:
          - label: "Le nombre de caractères du texte"
            correct: true
            why: "Comme le compteur de caractères d'un SMS."
          - label: "Le texte en majuscules"
            correct: false
            why: "Ce serait toUpperCase()."
          - label: "true ou false"
            correct: false
            why: "C'est includes qui répond vrai ou faux."
        explanation: "`length` = la taille."
      - code: prog-qt-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
