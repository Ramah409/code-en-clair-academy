            why: "length s'écrit sans parenthèses."
          - label: "`motDePasse.length()`"
            correct: false
            why: "length n'est pas un outil : pas de parenthèses."
          - label: "`length(motDePasse)`"
            correct: false
            why: "On écrit le texte, un point, puis length."
        explanation: "`length` est une information du texte, sans parenthèses. `includes(...)` est un outil, avec parenthèses."
      - code: prog-qt-q5
        kind: VRAI_FAUX
        difficulty: 1
