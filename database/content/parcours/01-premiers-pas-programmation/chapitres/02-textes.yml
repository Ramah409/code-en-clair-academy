          - label: "Marseille"
            correct: false
            why: "includes répond vrai ou faux."
        explanation: "Astuce : `ville.toLowerCase().includes(\"marseille\")` ignore les majuscules."
      - code: prog-qt-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quelle écriture est correcte ?"
        choices:
