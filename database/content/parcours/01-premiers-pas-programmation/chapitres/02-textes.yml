        prompt: "`includes` renvoie un booléen."
        choices:
          - label: "Vrai"
            correct: true
            why: "true ou false."
          - label: "Faux"
            correct: false
            why: "C'est bien un booléen."
        explanation: "La réponse d'includes est toujours `true` ou `false`."
