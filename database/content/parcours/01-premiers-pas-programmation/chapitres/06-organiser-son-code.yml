        prompt: "Une fonction qui renvoie son résultat est plus facile à réutiliser qu'une fonction qui l'affiche."
        choices:
          - label: "Vrai"
            correct: true
            why: "On peut ranger le résultat, le transformer, le comparer…"
          - label: "Faux"
            correct: false
            why: "Un résultat seulement affiché est perdu pour le programme."
        explanation: "Préparer et rendre, puis laisser l'appelant décider."
