slug: prog-organiser-code
position: 6
level: INTERMEDIAIRE
title: "Organiser son code : fonctions et objets"
summary: "Ranger des instructions dans une fonction, lui donner des paramètres, récupérer un résultat avec return, l'écrire en version courte, puis décrire des choses avec des objets. Une seule notion par leçon."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: prog-fonctions
    title: "Créer et appeler une fonction"
    duration: 9
    objective: "Ranger des instructions dans une fonction avec un nom, puis l'appeler pour les exécuter."
    prerequisites: "Chapitre « Les listes »."
    skills: [algo-fonctions]
    xp: 10
    memo: |
      - Une **fonction** range des instructions sous un **nom**, pour les réutiliser.
      - **Déclarer** : `function saluer() { console.log("Bonjour"); }` (on écrit la recette).
      - **Appeler** : `saluer();` (on cuisine la recette). Sans appel, rien ne se passe.
      - On peut appeler la même fonction autant de fois qu'on veut.
    commonMistakes: |
      - Déclarer la fonction sans jamais l'appeler.
      - Oublier les parenthèses à l'appel : `saluer;` ne fait rien.
    blocks:
      - type: text
        md: |
          Quand on répète souvent les mêmes instructions, on les range dans une **fonction**. On l'écrit une
          fois, on l'utilise autant qu'on veut.
      - type: definition
        id: def-fonction
        term: "Fonction"
        md: |
          Une **recette** avec un nom. L'écrire dans le cahier (la déclarer) ne fait pas le gâteau : il faut
          ensuite la **suivre** (l'appeler). Et on peut la suivre autant de fois qu'on veut.
      - type: code
        id: code-fonction
        language: javascript
        title: "Une fonction qui salue"
        code: |
          function saluer() {
            console.log("Bonjour !");
            console.log("Bienvenue sur le site.");
          }

          saluer();
          saluer();
        lines:
          - n: 1
            note: "`function`, le nom `saluer`, des parenthèses vides, puis le bloc entre accolades."
          - n: 6
            note: "L'**appel** : le nom suivi de parenthèses. Les deux messages s'affichent."
          - n: 7
            note: "Deuxième appel : les deux messages s'affichent encore."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis supprime les deux appels : plus rien ne s'affiche."
        language: javascript
        code: |
          function saluer() {
            console.log("Bonjour !");
            console.log("Bienvenue sur le site.");
          }
          saluer();
          saluer();
      - type: question
        ref: prog-f-q4
        review: def-fonction
      - type: question
        ref: prog-fn-q2
        review: code-fonction
      - type: text
        md: "**Exercice 1 (guidé)** : complète la déclaration et l'appel."
      - type: exercise
        ref: prog-ex-fonction-appel-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une fonction qui affiche un menu."
      - type: exercise
        ref: prog-ex-fonction-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une fonction qui ne fait rien."
      - type: exercise
        ref: prog-ex-fonction-bug
      - type: jury
        items:
          - q: "Pourquoi découper son code en fonctions ?"
            a: "Pour éviter de répéter du code, donner un nom clair à chaque action, et pouvoir tester chaque morceau séparément."
      - type: quiz
        items:
          - ref: prog-fn-q3
            review: def-fonction
          - ref: prog-fn-q4
            review: code-fonction
          - ref: prog-c3-b1
            review: def-fonction
    questions:
      - code: prog-f-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-fonctions
        prompt: "Une fonction déclarée mais jamais appelée ne s'exécute jamais."
        choices:
          - label: "Vrai"
            correct: true
            why: "La déclaration ne fait qu'écrire la recette."
          - label: "Faux"
            correct: false
            why: "Il faut l'appeler pour l'exécuter."
        explanation: "Déclarer, c'est écrire la recette ; appeler, c'est cuisiner."
      - code: prog-fn-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Combien de fois « Coucou » s'affiche-t-il ?"
        snippet: |
          function dire() {
            console.log("Coucou");
          }
          dire();
          dire();
          dire();
        language: javascript
        choices:
          - label: "Trois fois"
            correct: true
            why: "Un affichage par appel."
          - label: "Une fois"
            correct: false
            why: "Chaque appel exécute à nouveau la fonction."
          - label: "Aucune"
            correct: false
            why: "La fonction est bien appelée."
        explanation: "Chaque `dire();` exécute la recette."
      - code: prog-fn-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Comment appelle-t-on la fonction `ranger` ?"
        choices:
          - label: "`ranger();`"
            correct: true
            why: "Le nom suivi de parenthèses."
          - label: "`ranger;`"
            correct: false
            why: "Sans parenthèses, la fonction n'est pas exécutée."
          - label: "`function ranger();`"
            correct: false
            why: "function sert à déclarer, pas à appeler."
        explanation: "Appeler = le nom + des parenthèses."
      - code: prog-fn-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Où s'écrivent les instructions d'une fonction ?"
        choices:
          - label: "Entre les accolades `{ }` qui suivent son nom"
            correct: true
            why: "C'est le corps de la recette."
          - label: "Entre les parenthèses"
            correct: false
            why: "Les parenthèses servent à autre chose (on le verra à la leçon suivante)."
          - label: "Après l'appel"
            correct: false
            why: "Elles sont dans la déclaration."
        explanation: "`function nom() { instructions }`."
      - code: prog-c3-b1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Quel nom de fonction est le plus clair ?"
        choices:
          - label: "`envoyerMessageBienvenue`"
            correct: true
            why: "Un verbe et ce que fait la fonction."
          - label: "`f1`"
            correct: false
            why: "Le nom ne dit rien de son rôle."
          - label: "`truc`"
            correct: false
            why: "Un nom vague rend le code difficile à relire."
        explanation: "Une fonction se nomme avec un verbe qui décrit son action."
    exercises:
      - slug: prog-ex-fonction-appel-guide
        kind: COMPLETER
        title: "Déclarer et appeler"
        difficulty: FACILE
        skill: algo-fonctions
        statement: "Complète pour déclarer la fonction `applaudir`, puis l'appeler."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot qui déclare une fonction."
          - "Le bloc s'ouvre avec une accolade."
          - "function, {, applaudir."
        solution: '["function", "{", "applaudir"]'
        explanation: "`function applaudir() { ... }` puis `applaudir();`."
        xp: 10
        payload:
          language: javascript
          template: |
            [[1]] applaudir() [[2]]
              console.log("Clap clap !");
            }
            [[3]]();
          blanks:
            - ["function"]
            - ["{"]
            - ["applaudir"]
      - slug: prog-ex-fonction-libre
        kind: CODE_LIBRE
        title: "Une fonction qui affiche un menu"
        difficulty: FACILE
        skill: algo-fonctions
        statement: |
          Écris une fonction `afficherMenu()` qui affiche trois lignes : `Entrée`, `Plat`, `Dessert`.
          Appelle-la **une fois**.
        criteria: "Une fonction afficherMenu avec trois console.log, et un appel."
        hints:
          - "`function afficherMenu() { ... }`"
          - "Dans le bloc : trois `console.log`."
          - "Après la fonction : `afficherMenu();`"
        solution: |
          function afficherMenu() {
            console.log("Entrée");
            console.log("Plat");
            console.log("Dessert");
          }
          afficherMenu();
        explanation: "La recette est écrite une fois, puis suivie avec l'appel."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Ta fonction afficherMenu

          checks:
            - pattern: 'function\s+afficherMenu\s*\(\s*\)\s*\{'
              message: "Déclare function afficherMenu() { ... }"
            - pattern: 'console\.log\s*\(\s*["''`]Dessert["''`]\s*\)'
              message: "Affiche les trois lignes, dont \"Dessert\"."
            - pattern: '\}\s*afficherMenu\s*\(\s*\)'
              message: "Appelle la fonction après l'avoir écrite : afficherMenu();"
          output: |
            Entrée
            Plat
            Dessert
      - slug: prog-ex-fonction-bug
        kind: CORRIGER_ERREUR
        title: "Une fonction qui ne fait rien"
        difficulty: FACILE
        skill: algo-fonctions
        statement: |
          Ce programme n'affiche rien : la fonction est écrite, mais l'appel est mal fait. Corrige l'appel
          pour afficher `Lumière allumée`.
        criteria: "La fonction est appelée avec des parenthèses."
        hints:
          - "Regarde la dernière ligne."
          - "Un appel a toujours des parenthèses."
          - "`allumer();`"
        solution: |
          function allumer() {
            console.log("Lumière allumée");
          }
          allumer();
        explanation: "Sans parenthèses, on nomme la fonction mais on ne l'exécute pas."
        xp: 10
        payload:
          language: javascript
          starter: |
            function allumer() {
              console.log("Lumière allumée");
            }
            allumer;
          checks:
            - pattern: '\}\s*allumer\s*\(\s*\)'
              message: "Appelle la fonction avec des parenthèses : allumer();"
          output: "Lumière allumée"

  # ===================================================================== LEÇON 2
  - slug: prog-parametres
    title: "Donner une information à une fonction : les paramètres"
    duration: 10
    objective: "Déclarer une fonction avec un paramètre et l'appeler avec différents arguments."
    prerequisites: "Leçon « Créer et appeler une fonction »."
    skills: [algo-fonctions]
    xp: 10
    memo: |
      - Un **paramètre** est une variable de la fonction, qui reçoit une valeur à chaque appel : `function saluer(prenom) { ... }`.
      - L'**argument** est la valeur donnée à l'appel : `saluer("Awa")`.
      - Plusieurs paramètres se séparent par des virgules : `function presenter(prenom, ville)`.
      - Les arguments sont donnés **dans le même ordre** que les paramètres.
    commonMistakes: |
      - Oublier l'argument à l'appel : le paramètre vaut alors `undefined`.
      - Inverser l'ordre des arguments.
    blocks:
      - type: text
        md: |
          Une fonction qui dit toujours « Bonjour Awa » n'est pas très utile. On veut pouvoir lui dire **à qui**
          dire bonjour. C'est le rôle des **paramètres**.
      - type: definition
        id: def-parametre
        term: "Paramètre et argument"
        md: |
          La **machine à café** : elle a une fente pour la capsule (le **paramètre**). À chaque utilisation, on
          y glisse une capsule différente (l'**argument**) : espresso, cappuccino…
      - type: code
        id: code-parametre
        language: javascript
        title: "Saluer quelqu'un"
        code: |
          function saluer(prenom) {
            console.log(`Bonjour ${prenom} !`);
          }

          saluer("Awa");
          saluer("Léo");
        lines:
          - n: 1
            note: "`prenom` est le **paramètre** : une variable qui recevra la valeur donnée à l'appel."
          - n: 5
            note: "\"Awa\" est l'**argument** : pendant cet appel, prenom vaut Awa."
          - n: 6
            note: "Nouvel appel, nouvel argument : Bonjour Léo !"
      - type: demo
        title: "Essaie"
        md: "Ajoute un appel avec ton prénom."
        language: javascript
        code: |
          function saluer(prenom) {
            console.log(`Bonjour ${prenom} !`);
          }
          saluer("Awa");
          saluer("Léo");
      - type: question
        ref: prog-f-q3
        review: def-parametre
      - type: question
        ref: prog-pa-q2
        review: code-parametre
      - type: text
        md: "**Exercice 1 (guidé)** : complète le paramètre et l'appel."
      - type: exercise
        ref: prog-ex-parametre-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une fonction à deux paramètres."
      - type: exercise
        ref: prog-ex-parametre-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un argument oublié."
      - type: exercise
        ref: prog-ex-parametre-bug
      - type: jury
        items:
          - q: "Quelle différence entre un paramètre et un argument ?"
            a: "Le paramètre est le nom utilisé dans la définition de la fonction (`prenom`) ; l'argument est la valeur réelle donnée lors de l'appel (`\"Awa\"`)."
      - type: quiz
        items:
          - ref: prog-pa-q3
            review: def-parametre
          - ref: prog-pa-q4
            review: code-parametre
          - ref: prog-pa-q5
            review: def-parametre
    questions:
      - code: prog-f-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Dans `function saluer(prenom) { ... }`, que représente `prenom` ?"
        choices:
          - label: "Un paramètre : la valeur reçue lors de l'appel"
            correct: true
            why: "Oui."
          - label: "Le nom de la fonction"
            correct: false
            why: "Le nom de la fonction est `saluer`."
          - label: "Un texte à afficher tel quel"
            correct: false
            why: "C'est une variable qui recevra une valeur."
        explanation: "Les paramètres sont les « ingrédients » attendus par la fonction."
      - code: prog-pa-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          function annoncer(plat) {
            console.log(`Au menu : ${plat}`);
          }
          annoncer("tajine");
        language: javascript
        choices:
          - label: "Au menu : tajine"
            correct: true
            why: "Pendant l'appel, plat vaut tajine."
          - label: "Au menu : plat"
            correct: false
            why: "C'est le contenu du paramètre qui est affiché."
          - label: "Rien"
            correct: false
            why: "La fonction est bien appelée."
        explanation: "Le paramètre reçoit l'argument de l'appel."
      - code: prog-pa-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Dans `saluer(\"Inès\")`, que représente `\"Inès\"` ?"
        choices:
          - label: "L'argument : la valeur donnée à l'appel"
            correct: true
            why: "La capsule glissée dans la machine."
          - label: "Le paramètre"
            correct: false
            why: "Le paramètre est le nom dans la déclaration."
          - label: "Le nom de la fonction"
            correct: false
            why: "La fonction s'appelle saluer."
        explanation: "Paramètre dans la déclaration, argument dans l'appel."
      - code: prog-pa-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          function presenter(prenom, ville) {
            console.log(`${prenom} vit à ${ville}`);
          }
          presenter("Nice", "Awa");
        language: javascript
        choices:
          - label: "Nice vit à Awa"
            correct: true
            why: "Les arguments arrivent dans l'ordre : prenom reçoit Nice, ville reçoit Awa."
          - label: "Awa vit à Nice"
            correct: false
            why: "Les arguments sont inversés à l'appel."
          - label: "Une erreur"
            correct: false
            why: "Le code s'exécute, mais le résultat n'a pas de sens."
        explanation: "L'ordre des arguments doit suivre l'ordre des paramètres."
      - code: prog-pa-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-fonctions
        prompt: "Si on oublie l'argument à l'appel, le paramètre vaut `undefined`."
        choices:
          - label: "Vrai"
            correct: true
            why: "La fente est vide : rien n'a été donné."
          - label: "Faux"
            correct: false
            why: "JavaScript ne devine pas la valeur."
        explanation: "`saluer()` sans argument affiche « Bonjour undefined ! »."
    exercises:
      - slug: prog-ex-parametre-guide
        kind: COMPLETER
        title: "Compléter le paramètre"
        difficulty: FACILE
        skill: algo-fonctions
        statement: "Complète pour que la fonction affiche `J'adore le thé`."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Le paramètre s'écrit dans les parenthèses de la déclaration."
          - "L'argument est la valeur donnée à l'appel, entre guillemets."
          - "boisson, \"thé\"."
        solution: '["boisson", "\"thé\""]'
        explanation: "`function adorer(boisson)` puis `adorer(\"thé\")`."
        xp: 10
        payload:
          language: javascript
          template: |
            function adorer([[1]]) {
              console.log(`J'adore le ${boisson}`);
            }
            adorer([[2]]);
          blanks:
            - ["boisson"]
            - ["\"thé\"", "'thé'"]
      - slug: prog-ex-parametre-libre
        kind: CODE_LIBRE
        title: "Une fonction à deux paramètres"
        difficulty: FACILE
        skill: algo-fonctions
        statement: |
          Écris une fonction `commander(plat, boisson)` qui affiche `Un couscous et un jus`
          (avec un gabarit qui utilise les deux paramètres). Appelle-la avec `"couscous"` et `"jus"`.
        criteria: "Une fonction à deux paramètres, un gabarit avec les deux, un appel."
        hints:
          - "`function commander(plat, boisson) { ... }`"
          - "``console.log(`Un ${plat} et un ${boisson}`);``"
          - "`commander(\"couscous\", \"jus\");`"
        solution: |
          function commander(plat, boisson) {
            console.log(`Un ${plat} et un ${boisson}`);
          }
          commander("couscous", "jus");
        explanation: "Deux paramètres, deux arguments, dans le même ordre."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Ta fonction commander

          checks:
            - pattern: 'function\s+commander\s*\(\s*plat\s*,\s*boisson\s*\)'
              message: "Déclare function commander(plat, boisson)."
            - pattern: '`[^`]*\$\{\s*plat\s*\}[^`]*\$\{\s*boisson\s*\}[^`]*`'
              message: "Utilise un gabarit avec ${plat} puis ${boisson}."
            - pattern: 'commander\s*\(\s*["''`]couscous["''`]\s*,\s*["''`]jus["''`]\s*\)'
              message: "Appelle commander(\"couscous\", \"jus\")."
          output: "Un couscous et un jus"
      - slug: prog-ex-parametre-bug
        kind: CORRIGER_ERREUR
        title: "Un argument oublié"
        difficulty: FACILE
        skill: algo-fonctions
        statement: |
          Ce programme affiche `Bon anniversaire undefined !`. Corrige l'appel pour souhaiter bon
          anniversaire à `Karim`.
        criteria: "La fonction est appelée avec l'argument \"Karim\"."
        hints:
          - "undefined veut dire qu'aucune valeur n'a été donnée."
          - "L'argument se met entre les parenthèses de l'appel."
          - "`feter(\"Karim\");`"
        solution: |
          function feter(prenom) {
            console.log(`Bon anniversaire ${prenom} !`);
          }
          feter("Karim");
        explanation: "Sans argument, le paramètre prenom reste vide (undefined)."
        xp: 10
        payload:
          language: javascript
          starter: |
            function feter(prenom) {
              console.log(`Bon anniversaire ${prenom} !`);
            }
            feter();
          checks:
            - pattern: 'feter\s*\(\s*["''`]Karim["''`]\s*\)'
              message: "Donne l'argument à l'appel : feter(\"Karim\");"
          output: "Bon anniversaire Karim !"

  # ===================================================================== LEÇON 3
  - slug: prog-return
    title: "Obtenir un résultat : return"
    duration: 11
    objective: "Renvoyer un résultat avec return, le ranger dans une variable et le réutiliser."
    prerequisites: "Leçon « Donner une information à une fonction : les paramètres »."
    skills: [algo-fonctions]
    xp: 15
    memo: |
      - `return valeur;` **renvoie** un résultat à celui qui a appelé la fonction, et **arrête** la fonction.
      - On récupère le résultat : `const message = saluer("Awa");`.
      - `console.log` **montre** une valeur ; `return` la **rend** au programme, qui peut la réutiliser.
      - Sans `return`, une fonction renvoie `undefined`.
    commonMistakes: |
      - Afficher (`console.log`) au lieu de renvoyer (`return`) : on ne peut plus réutiliser le résultat.
      - Écrire des instructions après `return` : elles ne s'exécutent jamais.
    blocks:
      - type: text
        md: |
          Jusqu'ici, nos fonctions affichaient directement. Souvent, on préfère qu'elles **préparent** un résultat
          et nous le **rendent** : c'est ensuite à nous de décider quoi en faire.
      - type: definition
        id: def-return
        term: "return (renvoyer)"
        md: |
          Le **plat qui sort de la cuisine** : la recette est suivie, et le plat est rendu à la personne qui l'a
          commandé. Elle peut le manger, le ranger au frigo, le partager…
      - type: code
        id: code-return
        language: javascript
        title: "Une fonction qui prépare un message"
        code: |
          function saluer(prenom) {
            return `Bonjour ${prenom} !`;
          }

          const message = saluer("Awa");
          console.log(message);
          console.log(saluer("Léo").toUpperCase());
        lines:
          - n: 2
            note: "`return` rend le message préparé à celui qui a appelé la fonction."
          - n: 5
            note: "Le résultat (« Bonjour Awa ! ») est rangé dans `message`."
          - n: 7
            note: "On réutilise le résultat directement : BONJOUR LÉO !"
      - type: demo
        title: "Essaie"
        language: javascript
        code: |
          function saluer(prenom) {
            return `Bonjour ${prenom} !`;
          }
          const message = saluer("Awa");
          console.log(message);
          console.log(saluer("Léo").toUpperCase());
      - type: question
        ref: prog-f-q1
        review: code-return
      - type: callout
        variant: info
        title: "return ou console.log ?"
        md: |
          `console.log` **montre** une valeur à l'écran. `return` la **rend** au programme, qui peut la
          réutiliser (la ranger, la comparer, la passer à une autre fonction). Une bonne fonction prépare son
          résultat et le rend ; c'est l'appelant qui décide de l'afficher.
      - type: question
        ref: prog-f-q2
        review: def-return
      - type: text
        md: "**Exercice 1 (guidé)** : une fonction qui présente une personne."
      - type: exercise
        ref: prog-ex-fonction-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une fonction qui dit si une personne est majeure."
      - type: exercise
        ref: prog-ex-majeur
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un résultat qui vaut undefined."
      - type: exercise
        ref: prog-ex-return-bug
      - type: quiz
        items:
          - ref: prog-rt-q3
            review: def-return
          - ref: prog-rt-q4
            review: code-return
          - ref: prog-rt-q5
            review: def-return
    questions:
      - code: prog-f-q1
