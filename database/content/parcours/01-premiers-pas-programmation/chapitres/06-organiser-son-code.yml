        language: javascript
        choices:
          - label: "A"
            correct: true
            why: "`prenom[0]` est la première lettre du prénom (comme la première case d'une liste)."
          - label: "Awa"
            correct: false
            why: "La fonction ne renvoie que la première lettre."
          - label: "initiale(\"Awa\")"
            correct: false
            why: "La fonction est appelée : on affiche son résultat."
        explanation: "L'appel `initiale(\"Awa\")` exécute la fonction avec prenom = \"Awa\" et renvoie \"A\"."
      - code: prog-f-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          function saluer(prenom) {
            console.log("Salut " + prenom);
          }
          const resultat = saluer("Léo");
          console.log(resultat);
        language: javascript
        choices:
          - label: "Salut Léo puis undefined"
            correct: true
            why: "La fonction affiche « Salut Léo » mais ne renvoie rien : resultat vaut undefined."
          - label: "Salut Léo puis Salut Léo"
            correct: false
            why: "Il manque `return` pour que resultat contienne le message."
          - label: "undefined"
            correct: false
            why: "Le console.log de la fonction affiche d'abord « Salut Léo »."
        explanation: "Sans `return`, une fonction renvoie `undefined`."
      - code: prog-rt-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-fonctions
        prompt: "Que fait `return` ?"
        choices:
          - label: "Il rend un résultat à l'appelant et arrête la fonction"
            correct: true
            why: "Le plat sort de la cuisine."
          - label: "Il affiche le résultat"
            correct: false
            why: "C'est console.log qui affiche."
          - label: "Il recommence la fonction"
            correct: false
            why: "Au contraire, il l'arrête."
        explanation: "return = rendre et s'arrêter."
      - code: prog-rt-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-fonctions
        prompt: "Qu'affiche ce code ?"
        snippet: |
          function test() {
            return "A";
            console.log("B");
          }
          console.log(test());
        language: javascript
        choices:
          - label: "A"
            correct: true
            why: "return arrête la fonction : la ligne suivante n'est jamais exécutée."
          - label: "B puis A"
            correct: false
            why: "La ligne après return n'est jamais atteinte."
          - label: "A puis B"
            correct: false
            why: "Le console.log de B ne s'exécute jamais."
        explanation: "Tout ce qui suit un return dans le même bloc est ignoré."
      - code: prog-rt-q5
        kind: VRAI_FAUX
        difficulty: 1
