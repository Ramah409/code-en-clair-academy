      - slug: prog-ex-recherche
        kind: CODE_LIBRE
        title: "Inès est-elle invitée ?"
        difficulty: INTERMEDIAIRE
        skill: algo-bases
        statement: |
          Avec la liste `const invites = ["Awa", "Léo", "Inès", "Karim"];` :
          1. crée une variable `trouve` qui vaut `false` ;
          2. parcours la liste : si un invité vaut `"Inès"`, mets `trouve` à `true` ;
          3. après la boucle, affiche `Inès est invitée` si `trouve` vaut `true`, sinon `Inès n'est pas invitée`.

          N'utilise pas `includes` : le but est de comprendre la méthode.
        criteria: "Parcours de la liste, comparaison et mise à jour de trouve, puis affichage selon trouve."
        hints:
          - "`let trouve = false;`"
          - "`for (const invite of invites) { if (invite === \"Inès\") { ... } }`"
          - "Dans le if : `trouve = true;`, puis après la boucle un `if (trouve) { ... } else { ... }`."
        solution: |
          const invites = ["Awa", "Léo", "Inès", "Karim"];
          let trouve = false;
          for (const invite of invites) {
            if (invite === "Inès") {
              trouve = true;
            }
          }
          if (trouve) {
            console.log("Inès est invitée");
          } else {
            console.log("Inès n'est pas invitée");
          }
        explanation: |
          C'est la méthode de **recherche** : on regarde chaque élément un par un et on lève un drapeau
          (`trouve`) dès qu'on tombe sur celui qu'on cherche. On la retrouve partout (un e-mail déjà
          inscrit, un produit dans le panier…).
        xp: 20
        payload:
          language: javascript
          starter: |
            const invites = ["Awa", "Léo", "Inès", "Karim"];

          checks:
            - pattern: 'let\s+trouve\s*=\s*false'
              message: "Démarre avec let trouve = false;"
            - pattern: 'for\s*\('
              message: "Parcours la liste avec une boucle for."
            - pattern: 'if\s*\(\s*\w+\s*===?\s*["''`]Inès["''`]\s*\)|if\s*\(\s*["''`]Inès["''`]\s*===?\s*\w+\s*\)'
              message: "Compare chaque invité à \"Inès\" : if (invite === \"Inès\")."
            - pattern: '\btrouve\s*=\s*true'
              message: "Lève le drapeau quand tu la trouves : trouve = true;"
            - pattern: '\.includes\s*\('
              absent: true
              message: "Écris la méthode toi-même, sans includes."
            - pattern: 'console\.log\s*\(\s*["''`]Inès est invitée["''`]\s*\)'
              message: "Affiche \"Inès est invitée\" quand trouve vaut true."
          output: "Inès est invitée"
      - slug: prog-ex-forof-bug
        kind: CORRIGER_ERREUR
        title: "in au lieu de of"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme doit afficher `J'aime le rouge`, `J'aime le vert`… Il affiche des numéros (0, 1, 2) à
          la place des couleurs. Corrige le mot qui relie l'élément et la liste.
        criteria: "Le parcours utilise of."
        hints:
          - "in donne les numéros des cases."
          - "Pour obtenir les éléments eux-mêmes, on utilise un autre mot."
          - "`for (const couleur of couleurs)`"
        solution: |
          const couleurs = ["rouge", "vert", "bleu"];
          for (const couleur of couleurs) {
            console.log(`J'aime le ${couleur}`);
          }
        explanation: "`of` donne les éléments ; `in` donne leurs numéros."
        xp: 10
        payload:
          language: javascript
          starter: |
            const couleurs = ["rouge", "vert", "bleu"];
            for (const couleur in couleurs) {
              console.log(`J'aime le ${couleur}`);
            }
          checks:
            - pattern: 'for\s*\(\s*const\s+couleur\s+of\s+couleurs\s*\)'
              message: "Utilise of : for (const couleur of couleurs)."
            - pattern: '\bin\s+couleurs'
              absent: true
              message: "in donne les numéros : remplace-le par of."
          output: |
            J'aime le rouge
            J'aime le vert
            J'aime le bleu

