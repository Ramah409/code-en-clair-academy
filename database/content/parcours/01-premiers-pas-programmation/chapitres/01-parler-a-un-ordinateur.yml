slug: prog-parler-ordinateur
position: 1
level: DEBUTANT
title: "Parler à un ordinateur"
summary: "Comprendre ce qu'est un programme, afficher un message, ranger des valeurs dans des variables et faire des calculs."
quizQuestionCount: 10

lessons:
  # ===================================================================== LEÇON 1
  - slug: prog-programme
    title: "Qu'est-ce qu'un programme ?"
    duration: 8
    objective: "Savoir ce qu'est un programme et afficher un message avec console.log."
    prerequisites: "Aucun : c'est le tout début."
    skills: [algo-bases]
    xp: 10
    memo: |
      - Un **programme** est une liste d'**instructions** que l'ordinateur suit **dans l'ordre**, de haut en bas.
      - Une **instruction** = un ordre précis. En JavaScript, on la termine par un point-virgule `;`.
      - `console.log("Bonjour");` **affiche** le texte « Bonjour » dans la console.
      - Un texte s'écrit **entre guillemets** : `"Bonjour"` ou `'Bonjour'`.
      - L'ordinateur ne devine rien : une faute de frappe (`consol.log`) provoque une erreur.
    commonMistakes: |
      - Oublier les guillemets autour d'un texte : `console.log(Bonjour)` provoque une erreur.
      - Écrire `Console.log` avec une majuscule : JavaScript fait la différence entre majuscules et minuscules.
      - Oublier une parenthèse fermante.
    blocks:
      - type: text
        md: |
          Un ordinateur est très rapide, mais il ne comprend rien tout seul. Il faut lui dire **exactement**
          quoi faire, étape par étape. C'est ce qu'on appelle **programmer**.
      - type: definition
        id: def-programme
        term: "Programme"
        md: |
          Une **liste d'instructions** que l'ordinateur suit dans l'ordre, de haut en bas. C'est comme une
          **recette de cuisine** : « casser les œufs, battre, verser dans la poêle ». Si on inverse les
          étapes, le résultat n'est pas le même.
      - type: definition
        id: def-instruction
        term: "Instruction"
        md: |
          Un ordre précis donné à l'ordinateur. En JavaScript, chaque instruction se termine en général par
          un **point-virgule** `;`, comme le point à la fin d'une phrase.
      - type: code
        id: code-bonjour
        language: javascript
        title: "Ton premier programme"
        code: |
          console.log("Bonjour !");
          console.log("Je découvre la programmation.");
        lines:
          - n: 1
            note: "`console.log(...)` affiche ce qu'on met entre les parenthèses. Le texte est entre guillemets."
          - n: 2
            note: "Deuxième instruction : elle s'exécute **après** la première."
      - type: demo
        title: "À toi : exécute ce programme"
        md: "Clique sur **Exécuter**. Puis change le texte et exécute de nouveau."
        language: javascript
        code: |
          console.log("Bonjour !");
          console.log("Je découvre la programmation.");
      - type: question
        ref: prog-p-q1
        review: def-programme
      - type: definition
        id: def-console
        term: "Console"
        md: |
          Une **zone de texte** où le programme écrit ses messages. C'est le carnet de bord du
          programme : on y lit ce qu'il affiche, et les erreurs s'il y en a.
      - type: callout
        variant: tip
        title: "L'ordinateur est très pointilleux"
        md: |
          `console.log` s'écrit toujours de la même façon : tout en minuscules, un point au milieu, des
          parenthèses. `Console.log` ou `consolelog` provoquent une erreur. Ce n'est pas grave : lis le
          message, corrige, recommence.
      - type: text
        md: "Exercice guidé : complète le programme pour qu'il affiche deux messages."
      - type: exercise
        ref: prog-ex-bonjour-guide
      - type: text
        md: "En autonomie : écris un programme qui se présente en trois lignes."
      - type: exercise
        ref: prog-ex-presentation
      - type: jury
        items:
          - q: "Qu'est-ce qu'un programme ?"
            a: "Une suite d'instructions exécutées dans l'ordre par l'ordinateur pour obtenir un résultat, comme une recette de cuisine."
      - type: quiz
        items:
          - ref: prog-p-q2
            review: def-instruction
          - ref: prog-p-q3
            review: code-bonjour
          - ref: prog-p-q4
            review: def-console
    questions:
      - code: prog-p-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Dans quel ordre l'ordinateur exécute-t-il les instructions d'un programme simple ?"
        choices:
          - label: "De haut en bas, une par une"
            correct: true
            why: "Oui, comme les étapes d'une recette."
          - label: "Dans le désordre"
            correct: false
            why: "Non : l'ordre est toujours respecté."
          - label: "Toutes en même temps"
            correct: false
            why: "Non : chaque instruction attend la fin de la précédente."
        explanation: "Un programme se lit de haut en bas : l'ordre des instructions compte."
      - code: prog-p-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "En JavaScript, une instruction se termine en général par un point-virgule `;`."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui, comme le point à la fin d'une phrase."
          - label: "Faux"
            correct: false
            why: "Si : c'est la convention habituelle."
        explanation: "Le point-virgule marque la fin d'une instruction."
      - code: prog-p-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce programme ?"
        snippet: |
          console.log("A");
          console.log("B");
        language: javascript
        choices:
          - label: "A puis B, sur deux lignes"
            correct: true
            why: "Oui : deux instructions, deux lignes, dans l'ordre."
          - label: "B puis A"
            correct: false
            why: "L'ordre est de haut en bas."
          - label: "AB sur une seule ligne"
            correct: false
            why: "Chaque `console.log` affiche une nouvelle ligne."
        explanation: "Chaque `console.log` écrit une ligne dans la console, dans l'ordre du programme."
      - code: prog-p-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Pourquoi `console.log(Bonjour);` provoque-t-il une erreur ?"
        choices:
          - label: "Parce qu'un texte doit être écrit entre guillemets"
            correct: true
            why: "Oui : sans guillemets, JavaScript cherche une variable nommée Bonjour."
          - label: "Parce que Bonjour est trop long"
            correct: false
            why: "La longueur n'a aucune importance."
          - label: "Parce qu'il faut écrire Console avec une majuscule"
            correct: false
            why: "C'est l'inverse : tout en minuscules."
        explanation: "`\"Bonjour\"` est un texte ; `Bonjour` sans guillemets est un nom (de variable) que JavaScript ne connaît pas."
    exercises:
      - slug: prog-ex-bonjour-guide
        kind: COMPLETER
        title: "Compléter un premier programme"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète le programme pour qu'il affiche « Bonjour » puis « À bientôt »."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La commande pour afficher commence par console…"
          - "Le texte s'écrit entre guillemets."
          - "log, Bonjour, log."
        solution: '["log", "Bonjour", "log"]'
        explanation: "`console.log(\"Bonjour\");` affiche Bonjour. La deuxième instruction affiche ensuite « À bientôt »."
        xp: 10
        payload:
          language: javascript
          template: |
            console.[[1]]("[[2]]");
            console.[[3]]("À bientôt");
          blanks:
            - ["log"]
            - ["Bonjour"]
            - ["log"]
      - slug: prog-ex-presentation
        kind: CODE_LIBRE
        title: "Se présenter en trois lignes"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Écris un programme qui affiche **trois lignes** avec `console.log` :
          1. `Bonjour`
          2. ton prénom (par exemple `Je m'appelle Awa`)
          3. `J'apprends à programmer`

          Clique sur **Exécuter** pour voir le résultat, puis sur **Valider**.
        criteria: "Trois console.log, dont « Bonjour » et « J'apprends à programmer »."
        hints:
          - "Une instruction par ligne : `console.log(\"...\");`"
          - "Pour écrire l'apostrophe de « J'apprends », entoure le texte de guillemets doubles."
          - "`console.log(\"J'apprends à programmer\");`"
        solution: |
          console.log("Bonjour");
          console.log("Je m'appelle Awa");
          console.log("J'apprends à programmer");
        explanation: |
          Trois instructions, trois lignes. Les guillemets doubles permettent d'écrire une apostrophe
          dans le texte sans le couper.
        xp: 15
        payload:
          language: javascript
          starter: |
            // Écris tes trois lignes ici

          checks:
            - pattern: '\A(?>[\s\S]*?console\.log\s*\(){3}'
              message: "Il faut trois instructions console.log(...)."
            - pattern: 'console\.log\s*\(\s*["''`]Bonjour["''`]\s*\)'
              message: "La première ligne affiche \"Bonjour\"."
            - pattern: 'console\.log\s*\(\s*"J''apprends à programmer"\s*\)|console\.log\s*\(\s*`J''apprends à programmer`\s*\)'
              message: "Affiche exactement \"J'apprends à programmer\" (avec des guillemets doubles)."
            - pattern: 'Console\.log'
              absent: true
              message: "console s'écrit en minuscules."

  # ===================================================================== LEÇON 2
  - slug: prog-variables
    title: "Les variables : des boîtes avec une étiquette"
    duration: 10
    objective: "Créer des variables avec let et const, et connaître les trois types de base : nombre, texte, booléen."
    prerequisites: "Leçon « Qu'est-ce qu'un programme ? »."
    skills: [algo-bases]
    xp: 15
    memo: |
      - Une **variable** est une boîte avec une étiquette (son nom) qui contient une valeur.
      - `let age = 18;` crée une variable **modifiable** ; `const prenom = "Awa";` crée une **constante** (non modifiable).
      - Types de base : **nombre** (`18`, `3.5`), **texte** (`"Awa"`), **booléen** (`true` / `false`).
      - `age = 19;` change la valeur (sans `let` la deuxième fois).
      - `typeof age` donne le type : `"number"`, `"string"`, `"boolean"`.
    commonMistakes: |
      - Réécrire `let` pour modifier une variable existante : `let age = 19;` une deuxième fois provoque une erreur.
      - Modifier une `const` : erreur « Assignment to constant variable ».
      - Mettre un nombre entre guillemets : `"18"` est un texte, pas un nombre.
      - Utiliser des espaces ou des accents dans un nom : on écrit `dateNaissance`, pas `date naissance`.
    blocks:
      - type: text
        md: |
          Un programme a souvent besoin de **se souvenir** de choses : un prénom, un âge, un score. Pour
          ça, on utilise des **variables**.
      - type: definition
        id: def-variable
        term: "Variable"
        md: |
          Une **boîte avec une étiquette**. L'étiquette est le **nom** (`age`), le contenu est la **valeur**
          (`18`). On peut ouvrir la boîte pour lire la valeur, ou la remplacer par une autre.
      - type: code
        id: code-let-const
        language: javascript
        title: "Créer et utiliser des variables"
        code: |
          let age = 18;
          const prenom = "Awa";
          console.log(prenom);
          console.log(age);
          age = 19;
          console.log(age);
        lines:
          - n: 1
            note: "`let` crée une boîte nommée `age` et y range 18. Le `=` veut dire « ranger dans », pas « est égal à »."
          - n: 2
            note: "`const` crée une boîte **scellée** : sa valeur ne changera plus."
          - n: 3
            note: "Sans guillemets : on affiche le **contenu** de la boîte `prenom`, donc Awa."
          - n: 5
            note: "On remplace 18 par 19. Pas de `let` : la boîte existe déjà."
          - n: 6
            note: "Affiche 19."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis change l'âge et le prénom."
        language: javascript
        code: |
          let age = 18;
          const prenom = "Awa";
          console.log(prenom, "a", age, "ans");
      - type: question
        ref: prog-v-q1
        review: def-variable
      - type: definition
        id: def-types
        term: "Type"
        md: |
          La **sorte** de valeur rangée dans la boîte :
          - **nombre** (`number`) : `18`, `-3`, `2.5` (virgule écrite avec un point) ;
          - **texte** (`string`, « chaîne de caractères ») : `"Awa"`, entre guillemets ;
          - **booléen** (`boolean`) : `true` (vrai) ou `false` (faux), comme un interrupteur allumé ou éteint.
      - type: compare
        left:
          title: "Nombre"
          code: |
            let prix = 20;
            console.log(prix + 5); // 25
          language: javascript
        right:
          title: "Texte qui ressemble à un nombre"
          code: |
            let prix = "20";
            console.log(prix + 5); // "205" !
          language: javascript
      - type: question
        ref: prog-v-q2
        review: def-types
      - type: text
        md: "Exercice guidé : complète la déclaration des variables."
      - type: exercise
        ref: prog-ex-variables-guide
      - type: text
        md: "En autonomie : crée tes propres variables et affiche-les."
      - type: exercise
        ref: prog-ex-variables
      - type: jury
        items:
          - q: "Quelle différence entre let et const ?"
            a: "`let` déclare une variable dont la valeur peut changer ; `const` déclare une valeur qui ne sera plus réaffectée. On utilise `const` par défaut, `let` quand la valeur doit évoluer."
      - type: quiz
        items:
          - ref: prog-v-q3
            review: code-let-const
          - ref: prog-v-q4
            review: def-types
          - ref: prog-v-q5
            review: code-let-const
    questions:
      - code: prog-v-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Dans `let age = 18;`, que fait le signe `=` ?"
        choices:
          - label: "Il range la valeur 18 dans la variable age"
            correct: true
            why: "Oui : c'est une affectation."
          - label: "Il vérifie si age est égal à 18"
            correct: false
            why: "Pour comparer, on utilise `===`."
          - label: "Il affiche 18"
            correct: false
            why: "Pour afficher, on utilise `console.log`."
        explanation: "En programmation, `=` signifie « ranger dans la boîte ». La comparaison s'écrit `===`."
      - code: prog-v-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quel est le type de la valeur `true` ?"
        choices:
          - label: "Booléen"
            correct: true
            why: "Oui : vrai ou faux."
          - label: "Texte"
            correct: false
            why: "Sans guillemets, `true` n'est pas un texte."
          - label: "Nombre"
            correct: false
            why: "Ce n'est pas un nombre."
        explanation: "Les booléens n'ont que deux valeurs : `true` et `false`."
      - code: prog-v-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          let score = 10;
          score = 15;
          console.log(score);
        language: javascript
        choices:
          - label: "15"
            correct: true
            why: "La deuxième ligne remplace 10 par 15."
          - label: "10"
            correct: false
            why: "La valeur a été remplacée avant l'affichage."
          - label: "25"
            correct: false
            why: "On remplace, on n'additionne pas."
        explanation: "Une affectation remplace l'ancienne valeur."
      - code: prog-v-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          let a = "3";
          console.log(a + 2);
        language: javascript
        choices:
          - label: "32"
            correct: true
            why: "\"3\" est un texte : `+` colle les deux morceaux."
          - label: "5"
            correct: false
            why: "Ce serait le cas avec le nombre 3, sans guillemets."
          - label: "Une erreur"
            correct: false
            why: "JavaScript transforme 2 en texte et colle."
        explanation: "Avec un texte, `+` sert à coller (concaténer). Attention aux nombres écrits entre guillemets."
      - code: prog-v-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "On peut changer la valeur d'une variable déclarée avec `const`."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : JavaScript refuse (« Assignment to constant variable »)."
          - label: "Faux"
            correct: true
            why: "Exact : `const` fige la valeur."
        explanation: "`const` pour ce qui ne change pas, `let` pour ce qui change."
    exercises:
      - slug: prog-ex-variables-guide
        kind: COMPLETER
        title: "Déclarer deux variables"
        difficulty: FACILE
        skill: algo-bases
        statement: "Le prénom ne changera pas, l'âge oui. Complète avec le bon mot-clé, puis affiche l'âge."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une valeur qui ne change pas : mot-clé de cinq lettres."
          - "Une valeur qui change : mot-clé de trois lettres."
          - "const, let, age."
        solution: '["const", "let", "age"]'
        explanation: "`const prenom` car le prénom ne change pas ; `let age` car il augmente chaque année."
        xp: 10
        payload:
          language: javascript
          template: |
            [[1]] prenom = "Inès";
            [[2]] age = 25;
            console.log([[3]]);
          blanks:
            - ["const"]
            - ["let"]
            - ["age"]
      - slug: prog-ex-variables
        kind: CODE_LIBRE
        title: "Mes trois variables"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          1. crée une constante `ville` qui contient le texte `"Lyon"` ;
          2. crée une variable `temperature` (avec `let`) qui vaut le nombre `21` ;
          3. crée une variable `ensoleille` qui vaut `true` ;
          4. affiche les trois avec `console.log`.
        criteria: "Trois déclarations correctes et un affichage."
        hints:
          - "`const ville = \"Lyon\";`"
          - "Un nombre s'écrit sans guillemets : `let temperature = 21;`"
          - "`let ensoleille = true;` puis `console.log(ville, temperature, ensoleille);`"
        solution: |
          const ville = "Lyon";
          let temperature = 21;
          let ensoleille = true;
          console.log(ville, temperature, ensoleille);
        explanation: "Trois types différents : un texte, un nombre, un booléen. `console.log` peut afficher plusieurs valeurs séparées par des virgules."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Tes variables ici

          checks:
            - pattern: 'const\s+ville\s*=\s*["''`]Lyon["''`]'
              message: "Déclare la constante : const ville = \"Lyon\";"
            - pattern: 'let\s+temperature\s*=\s*21\b'
              message: "Déclare la variable : let temperature = 21; (sans guillemets, c'est un nombre)."
            - pattern: '(let|const)\s+ensoleille\s*=\s*true\b'
              message: "Déclare ensoleille avec la valeur true (sans guillemets)."
            - pattern: 'console\.log\s*\('
              message: "Affiche les valeurs avec console.log."
            - pattern: 'temperature\s*=\s*["''`]21'
              absent: true
              message: "21 est un nombre : pas de guillemets."

  # ===================================================================== LEÇON 3
  - slug: prog-calculs-textes
    title: "Assembler et transformer des textes"
    duration: 10
    objective: "Coller des textes, construire un message avec les gabarits `${}` et utiliser les outils des textes (majuscules, recherche, nettoyage)."
    prerequisites: "Leçon « Les variables »."
    skills: [algo-bases]
    xp: 15
    memo: |
      - Avec des textes, `+` **colle** : `"Bon" + "jour"` donne `"Bonjour"`.
      - Gabarit : `` `Bonjour ${prenom}` `` insère la valeur de la variable dans le texte (accents graves).
      - `texte.toUpperCase()` met en MAJUSCULES, `texte.toLowerCase()` en minuscules.
      - `texte.includes("mot")` répond `true` si le texte contient ce mot, sinon `false`.
      - `texte.trim()` enlève les espaces en trop au début et à la fin.
    commonMistakes: |
      - Utiliser des guillemets normaux au lieu des accents graves pour un gabarit : `"${prenom}"` s'affiche tel quel.
      - Oublier l'espace en collant : `"Bonjour" + "Awa"` donne `"BonjourAwa"`.
      - Oublier les parenthèses : `prenom.toUpperCase` sans `()` ne transforme rien.
    blocks:
      - type: text
        md: |
          Un programme passe son temps à fabriquer des **messages** : « Bonjour Awa », « Ta commande est prête »,
          « Mot de passe incorrect ». Voyons comment assembler et transformer des textes.
      - type: definition
        id: def-concatenation
        term: "Concaténation"
        md: |
          Le fait de **coller des textes bout à bout**, comme on accroche des wagons l'un derrière l'autre.
          En JavaScript, on colle avec le signe `+`. Attention : les espaces ne s'ajoutent pas tout seuls.
      - type: code
        id: code-textes
        language: javascript
        title: "Fabriquer un message"
        code: |
          const prenom = "Awa";
          const ville = "Lyon";
          const message = "Bonjour " + prenom + " de " + ville + " !";
          console.log(message);
          console.log(prenom.toUpperCase());
        lines:
          - n: 3
            note: "On colle cinq morceaux. Les espaces sont écrits **dans** les guillemets."
          - n: 4
            note: "Affiche : Bonjour Awa de Lyon !"
          - n: 5
            note: "`toUpperCase()` renvoie le texte en majuscules : AWA."
      - type: question
        ref: prog-c-q1
        review: def-concatenation
      - type: definition
        id: def-gabarit
        term: "Gabarit de texte (template literal)"
        md: |
          Un texte écrit entre **accents graves** `` ` `` (touche AltGr + 7 sur un clavier français) dans
          lequel on insère des valeurs avec `${...}`. C'est un **texte à trous** qu'on remplit
          automatiquement.
      - type: compare
        left:
          title: "Coller avec +"
          code: |
            const prenom = "Awa";
            console.log("Bonjour " + prenom + " !");
          language: javascript
        right:
          title: "Gabarit (plus lisible)"
          code: |
            const prenom = "Awa";
            console.log(`Bonjour ${prenom} !`);
          language: javascript
      - type: demo
        title: "Essaie les deux façons"
        language: javascript
        code: |
          const prenom = "Awa";
          const ville = "Lyon";
          console.log("Bonjour " + prenom + " !");
          console.log(`${prenom} habite à ${ville}.`);
          console.log(prenom.toUpperCase());
      - type: question
        ref: prog-c-q2
        review: def-gabarit
      - type: definition
        id: def-outils-texte
        term: "Les outils des textes"
        md: |
          Chaque texte a une **boîte à outils** attachée. On l'ouvre avec un point : `prenom.toUpperCase()`.
          Les plus utiles : `toUpperCase()` (majuscules), `toLowerCase()` (minuscules), `includes("mot")`
          (le texte contient-il ce mot ? réponse `true` ou `false`) et `trim()` (enlève les espaces en trop).
      - type: text
        md: "Exercice guidé : complète le message de bienvenue."
      - type: exercise
        ref: prog-ex-bienvenue-guide
      - type: text
        md: "En autonomie : fabrique une carte de visite avec un gabarit."
      - type: exercise
        ref: prog-ex-carte-visite
      - type: jury
        items:
          - q: "Qu'est-ce qu'une concaténation ?"
            a: "Le fait de coller des textes bout à bout, par exemple avec `+` ou un gabarit `${}` en JavaScript."
      - type: quiz
        items:
          - ref: prog-c-q3
            review: def-outils-texte
          - ref: prog-c-q4
            review: def-outils-texte
          - ref: prog-c-q5
            review: def-gabarit
    questions:
      - code: prog-c-q1
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const debut = "Bon";
          const fin = "jour";
          console.log(debut + fin);
        language: javascript
        choices:
          - label: "Bonjour"
            correct: true
            why: "Le `+` colle les deux textes."
          - label: "Bon jour"
            correct: false
            why: "Aucun espace n'est ajouté automatiquement."
          - label: "debut + fin"
            correct: false
            why: "Sans guillemets, ce sont les valeurs des variables qui sont utilisées."
        explanation: "Avec des textes, `+` colle bout à bout, sans ajouter d'espace."
      - code: prog-c-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quel code affiche `Salut Léo` si `prenom` vaut `\"Léo\"` ?"
        choices:
          - label: "``console.log(`Salut ${prenom}`);``"
            correct: true
            why: "Accents graves et `${}` : le gabarit insère la valeur."
          - label: "`console.log(\"Salut ${prenom}\");`"
            correct: false
            why: "Avec des guillemets normaux, `${prenom}` s'affiche tel quel."
          - label: "`console.log(Salut prenom);`"
            correct: false
            why: "Il manque les guillemets autour du texte."
        explanation: "Un gabarit s'écrit entre accents graves `` ` ``."
      - code: prog-c-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const phrase = "J'adore le chocolat";
          console.log(phrase.includes("chocolat"));
        language: javascript
        choices:
          - label: "true"
            correct: true
            why: "La phrase contient bien le mot « chocolat »."
          - label: "false"
            correct: false
            why: "Ce serait le cas si le mot n'était pas dans la phrase."
          - label: "chocolat"
            correct: false
            why: "`includes` répond par vrai ou faux, il ne renvoie pas le mot."
        explanation: "`includes` répond à la question « ce texte contient-il ce mot ? » par `true` ou `false`."
      - code: prog-c-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "`prenom` vaut `\"awa\"`. Quel code affiche `AWA` ?"
        choices:
          - label: "`console.log(prenom.toUpperCase());`"
            correct: true
            why: "`toUpperCase()` met tout le texte en majuscules."
          - label: "`console.log(prenom.toLowerCase());`"
            correct: false
            why: "`toLowerCase()` met en minuscules."
          - label: "`console.log(prenom.toUpperCase);`"
            correct: false
            why: "Sans les parenthèses, l'outil n'est pas utilisé."
        explanation: "Les outils des textes s'utilisent avec un point et des parenthèses : `texte.outil()`."
      - code: prog-c-q5
        kind: RESULTAT_CODE
        difficulty: 2
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const animal = "chat";
          console.log(`Mon ${animal} dort.`);
        language: javascript
        choices:
          - label: "Mon chat dort."
            correct: true
            why: "`${animal}` est remplacé par la valeur de la variable."
          - label: "Mon ${animal} dort."
            correct: false
            why: "Ce serait le cas avec des guillemets normaux."
          - label: "Mon animal dort."
            correct: false
            why: "C'est la valeur de la variable qui est insérée, pas son nom."
        explanation: "Dans un gabarit, ce qui est entre `${ }` est remplacé par sa valeur."
    exercises:
      - slug: prog-ex-bienvenue-guide
        kind: COMPLETER
        title: "Un message de bienvenue"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète : mets le prénom en majuscules, puis affiche un message avec un gabarit."
        criteria: "Les trois trous sont corrects."
        hints:
          - "L'outil qui met en majuscules s'appelle toUpperCase."
          - "Un gabarit commence et finit par un accent grave `."
          - "toUpperCase , ` , `"
        solution: '["toUpperCase", "`", "`"]'
        explanation: "`prenom.toUpperCase()` donne AWA, puis le gabarit affiche : Bienvenue AWA !"
        xp: 10
        payload:
          language: javascript
          template: |
            const prenom = "awa";
            const nom = prenom.[[1]]();
            console.log([[2]]Bienvenue ${nom} ![[3]]);
          blanks:
            - ["toUpperCase"]
            - ["`"]
            - ["`"]
      - slug: prog-ex-carte-visite
        kind: CODE_LIBRE
        title: "Une carte de visite"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          1. crée `prenom` qui vaut `"Awa"` et `metier` qui vaut `"développeuse"` ;
          2. crée `carte` avec un **gabarit** qui donne : `Awa, développeuse` (utilise `${prenom}` et `${metier}`) ;
          3. affiche la carte **en majuscules** avec `toUpperCase()`.
        criteria: "Deux variables, un gabarit avec ${prenom} et ${metier}, affichage en majuscules."
        hints:
          - "`const prenom = \"Awa\";` et `const metier = \"développeuse\";`"
          - "``const carte = `${prenom}, ${metier}`;``"
          - "`console.log(carte.toUpperCase());`"
        solution: |
          const prenom = "Awa";
          const metier = "développeuse";
          const carte = `${prenom}, ${metier}`;
          console.log(carte.toUpperCase());
        explanation: "Le gabarit assemble le texte une seule fois, puis `toUpperCase()` le transforme. Résultat : AWA, DÉVELOPPEUSE."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Ton code ici

          output: "AWA, DÉVELOPPEUSE"
          checks:
            - pattern: '(const|let)\s+prenom\s*=\s*["''`]Awa["''`]'
              message: "Déclare prenom = \"Awa\"."
            - pattern: '(const|let)\s+metier\s*=\s*["''`]développeuse["''`]'
              message: "Déclare metier = \"développeuse\"."
            - pattern: '(const|let)\s+carte\s*=\s*`[^`]*\$\{\s*prenom\s*\}[^`]*\$\{\s*metier\s*\}[^`]*`'
              message: "Crée carte avec un gabarit qui contient ${prenom} puis ${metier}."
            - pattern: '\.toUpperCase\s*\(\s*\)'
              message: "Mets la carte en majuscules avec toUpperCase()."
            - pattern: 'console\.log\s*\('
              message: "Affiche le résultat avec console.log."

