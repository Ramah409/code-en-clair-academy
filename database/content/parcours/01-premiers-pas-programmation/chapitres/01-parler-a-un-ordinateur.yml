            - pattern: '(const|let)\s+quantite\s*=\s*3\b'
              message: "Déclare quantite = 3."
            - pattern: '(const|let)\s+total\s*=\s*(prix\s*\*\s*quantite|quantite\s*\*\s*prix)'
              message: "Calcule total = prix * quantite."
            - pattern: '`[^`]*\$\{\s*total\s*\}[^`]*`'
              message: "Affiche le total avec un gabarit entre accents graves : `Total : ${total} €`."
