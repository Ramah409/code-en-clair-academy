      - slug: prog-ex-panier
        kind: CODE_LIBRE
        title: "Le prix d'un panier"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          1. crée `prix` qui vaut `20` et `quantite` qui vaut `3` ;
          2. crée `total` qui vaut `prix * quantite` ;
          3. affiche avec un **gabarit** : `Total : 60 €` (utilise `${total}`).
        criteria: "Variables, calcul et gabarit avec ${total}."
        hints:
          - "`const prix = 20;` et `const quantite = 3;`"
          - "`const total = prix * quantite;`"
          - "``console.log(`Total : ${total} €`);``"
        solution: |
          const prix = 20;
          const quantite = 3;
          const total = prix * quantite;
          console.log(`Total : ${total} €`);
        explanation: "Le calcul est fait une seule fois et rangé dans `total`, puis inséré dans le message."
