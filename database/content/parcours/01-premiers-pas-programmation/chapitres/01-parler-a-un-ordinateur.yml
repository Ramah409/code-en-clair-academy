slug: prog-parler-ordinateur
position: 1
level: DEBUTANT
title: "Parler à un ordinateur"
summary: "Afficher un message, ranger une valeur dans une variable avec let, figer une valeur avec const, reconnaître les sortes de valeurs. Une seule notion par leçon."
quizQuestionCount: 10

lessons:
  # ===================================================================== LEÇON 1
  - slug: prog-programme
    title: "Qu'est-ce qu'un programme ?"
    duration: 8
    objective: "Savoir ce qu'est un programme et afficher un message avec console.log."
    prerequisites: "Aucun : c'est le tout début."
    skills: [algo-bases]
    xp: 10
    memo: |
      - Un **programme** est une liste d'**instructions** que l'ordinateur suit **dans l'ordre**, de haut en bas.
      - Une **instruction** = un ordre précis. En JavaScript, on la termine par un point-virgule `;`.
      - `console.log("Bonjour");` **affiche** le texte « Bonjour » dans la console.
      - Un texte s'écrit **entre guillemets** : `"Bonjour"`.
      - L'ordinateur ne devine rien : une faute de frappe (`consol.log`) provoque une erreur.
    commonMistakes: |
      - Oublier les guillemets autour d'un texte : `console.log(Bonjour);` provoque une erreur.
      - Écrire `Console.log` avec une majuscule : JavaScript fait la différence entre majuscules et minuscules.
      - Oublier une parenthèse fermante.
    blocks:
      - type: text
        md: |
          Un ordinateur est très rapide, mais il ne comprend rien tout seul. Il faut lui dire **exactement**
          quoi faire, étape par étape. C'est ce qu'on appelle **programmer**.
      - type: definition
        id: def-programme
        term: "Programme"
        md: |
          Une **liste d'instructions** que l'ordinateur suit dans l'ordre, de haut en bas. C'est comme une
          **recette de cuisine** : « casser les œufs, battre, verser dans la poêle ». Si on inverse les
          étapes, le résultat n'est pas le même.
      - type: definition
        id: def-instruction
        term: "Instruction"
        md: |
          Un ordre précis donné à l'ordinateur. En JavaScript, chaque instruction se termine en général par
          un **point-virgule** `;`, comme le point à la fin d'une phrase.
      - type: code
        id: code-bonjour
        language: javascript
        title: "Ton premier programme"
        code: |
          console.log("Bonjour !");
          console.log("Je découvre la programmation.");
        lines:
          - n: 1
            note: "`console.log(...)` affiche ce qu'on met entre les parenthèses. Le texte est entre guillemets."
          - n: 2
            note: "Deuxième instruction : elle s'exécute **après** la première."
      - type: demo
        title: "À toi : exécute ce programme"
        md: "Clique sur **Exécuter**. Puis change le texte et exécute de nouveau."
        language: javascript
        code: |
          console.log("Bonjour !");
          console.log("Je découvre la programmation.");
      - type: question
        ref: prog-p-q1
        review: def-programme
      - type: definition
        id: def-console
        term: "Console"
        md: |
          Une **zone de texte** où le programme écrit ses messages. C'est le carnet de bord du
          programme : on y lit ce qu'il affiche, et les erreurs s'il y en a.
      - type: callout
        variant: tip
        title: "L'ordinateur est très pointilleux"
        md: |
          `console.log` s'écrit toujours de la même façon : tout en minuscules, un point au milieu, des
          parenthèses. `Console.log` ou `consolelog` provoquent une erreur. Ce n'est pas grave : lis le
          message, corrige, recommence.
      - type: question
        ref: prog-p-q4
        review: code-bonjour
      - type: text
        md: "**Exercice 1 (guidé)** : complète le programme pour qu'il affiche deux messages."
      - type: exercise
        ref: prog-ex-bonjour-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : écris un programme qui se présente en trois lignes."
      - type: exercise
        ref: prog-ex-presentation
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : ce programme contient deux fautes. Corrige-les."
      - type: exercise
        ref: prog-ex-programme-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'un programme ?"
            a: "Une suite d'instructions exécutées dans l'ordre par l'ordinateur pour obtenir un résultat, comme une recette de cuisine."
      - type: quiz
        items:
          - ref: prog-p-q2
            review: def-instruction
          - ref: prog-p-q3
            review: code-bonjour
          - ref: prog-p-q5
            review: def-console
    questions:
      - code: prog-p-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Dans quel ordre l'ordinateur exécute-t-il les instructions d'un programme simple ?"
        choices:
          - label: "De haut en bas, une par une"
            correct: true
            why: "Oui, comme les étapes d'une recette."
          - label: "Dans le désordre"
            correct: false
            why: "Non : l'ordre est toujours respecté."
          - label: "Toutes en même temps"
            correct: false
            why: "Non : chaque instruction attend la fin de la précédente."
        explanation: "Un programme se lit de haut en bas : l'ordre des instructions compte."
      - code: prog-p-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "En JavaScript, une instruction se termine en général par un point-virgule `;`."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui, comme le point à la fin d'une phrase."
          - label: "Faux"
            correct: false
            why: "Si : c'est la convention habituelle."
        explanation: "Le point-virgule marque la fin d'une instruction."
      - code: prog-p-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce programme ?"
        snippet: |
          console.log("A");
          console.log("B");
        language: javascript
        choices:
          - label: "A puis B, sur deux lignes"
            correct: true
            why: "Oui : deux instructions, deux lignes, dans l'ordre."
          - label: "B puis A"
            correct: false
            why: "L'ordre est de haut en bas."
          - label: "AB sur une seule ligne"
            correct: false
            why: "Chaque `console.log` affiche une nouvelle ligne."
        explanation: "Chaque `console.log` écrit une ligne dans la console, dans l'ordre du programme."
      - code: prog-p-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Pourquoi `console.log(Bonjour);` provoque-t-il une erreur ?"
        choices:
          - label: "Parce qu'un texte doit être écrit entre guillemets"
            correct: true
            why: "Oui : sans guillemets, JavaScript ne sait pas que c'est un texte."
          - label: "Parce que Bonjour est trop long"
            correct: false
            why: "La longueur n'a aucune importance."
          - label: "Parce qu'il faut écrire Console avec une majuscule"
            correct: false
            why: "C'est l'inverse : tout en minuscules."
        explanation: "`\"Bonjour\"` avec guillemets est un texte. Sans guillemets, JavaScript cherche un nom qu'il ne connaît pas."
      - code: prog-p-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Où apparaît ce qu'affiche `console.log` ?"
        choices:
          - label: "Dans la console, la zone de messages du programme"
            correct: true
            why: "C'est le carnet de bord du programme."
          - label: "Dans une nouvelle page web"
            correct: false
            why: "console.log écrit dans la console, pas sur une page."
          - label: "Nulle part"
            correct: false
            why: "Le message est bien affiché, dans la console."
        explanation: "La console montre les messages du programme, et les erreurs."
    exercises:
      - slug: prog-ex-bonjour-guide
        kind: COMPLETER
        title: "Compléter un premier programme"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète le programme pour qu'il affiche « Bonjour » puis « À bientôt »."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La commande pour afficher commence par console…"
          - "Le texte s'écrit entre guillemets."
          - "log, Bonjour, log."
        solution: '["log", "Bonjour", "log"]'
        explanation: "`console.log(\"Bonjour\");` affiche Bonjour. La deuxième instruction affiche ensuite « À bientôt »."
        xp: 10
        payload:
          language: javascript
          template: |
            console.[[1]]("[[2]]");
            console.[[3]]("À bientôt");
          blanks:
            - ["log"]
            - ["Bonjour"]
            - ["log"]
      - slug: prog-ex-presentation
        kind: CODE_LIBRE
        title: "Se présenter en trois lignes"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Écris un programme qui affiche **trois lignes** avec `console.log` :
          1. `Bonjour`
          2. ton prénom (par exemple `Je m'appelle Awa`)
          3. `J'apprends à programmer`

          Clique sur **Exécuter** pour voir le résultat, puis sur **Valider**.
        criteria: "Trois console.log, dont « Bonjour » et « J'apprends à programmer »."
        hints:
          - "Une instruction par ligne : `console.log(\"...\");`"
          - "Pour écrire l'apostrophe de « J'apprends », entoure le texte de guillemets doubles."
          - "`console.log(\"J'apprends à programmer\");`"
        solution: |
          console.log("Bonjour");
          console.log("Je m'appelle Awa");
          console.log("J'apprends à programmer");
        explanation: |
          Trois instructions, trois lignes. Les guillemets doubles permettent d'écrire une apostrophe
          dans le texte sans le couper.
        xp: 15
        payload:
          language: javascript
          starter: |
            // Écris tes trois lignes ici

          checks:
            - pattern: '\A(?>[\s\S]*?console\.log\s*\(){3}'
              message: "Il faut trois instructions console.log(...)."
            - pattern: 'console\.log\s*\(\s*["''`]Bonjour["''`]\s*\)'
              message: "La première ligne affiche \"Bonjour\"."
            - pattern: 'console\.log\s*\(\s*"J''apprends à programmer"\s*\)|console\.log\s*\(\s*`J''apprends à programmer`\s*\)'
              message: "Affiche exactement \"J'apprends à programmer\" (avec des guillemets doubles)."
            - pattern: 'Console\.log'
              absent: true
              message: "console s'écrit en minuscules."
          output: |
            Bonjour
            Je m'appelle Awa
            J'apprends à programmer
      - slug: prog-ex-programme-bug
        kind: CORRIGER_ERREUR
        title: "Deux fautes à corriger"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme doit afficher `Bonjour` puis `Au revoir`, mais il contient **deux fautes**.
          Exécute-le, lis le message d'erreur, puis corrige.
        criteria: "console en minuscules et les deux textes entre guillemets."
        hints:
          - "Regarde la première lettre de la première ligne."
          - "Un texte s'écrit toujours entre guillemets."
          - "`console.log(\"Bonjour\");` puis `console.log(\"Au revoir\");`"
        solution: |
          console.log("Bonjour");
          console.log("Au revoir");
        explanation: "`console` s'écrit en minuscules, et chaque texte est entouré de guillemets."
        xp: 10
        payload:
          language: javascript
          starter: |
            Console.log("Bonjour");
            console.log(Au revoir);
          checks:
            - pattern: 'Console\.log'
              absent: true
              message: "console s'écrit tout en minuscules."
            - pattern: 'console\.log\s*\(\s*["''`]Bonjour["''`]\s*\)'
              message: "La première ligne affiche \"Bonjour\"."
            - pattern: 'console\.log\s*\(\s*["''`]Au revoir["''`]\s*\)'
              message: "Mets le texte Au revoir entre guillemets."
          output: |
            Bonjour
            Au revoir

  # ===================================================================== LEÇON 2
  - slug: prog-variables
    title: "Ranger une valeur : les variables avec let"
    duration: 10
    objective: "Créer une variable avec let, afficher son contenu, puis changer sa valeur."
    prerequisites: "Leçon « Qu'est-ce qu'un programme ? »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - Une **variable** est une boîte avec une étiquette (son nom) qui contient une valeur.
      - `let ville = "Lyon";` crée la boîte `ville` et y range le texte « Lyon ».
      - Le signe `=` veut dire « **ranger dans** », pas « est égal à ».
      - `console.log(ville);` (sans guillemets) affiche le **contenu** de la boîte : Lyon.
      - `ville = "Paris";` remplace la valeur. On n'écrit `let` **qu'une seule fois**, à la création.
    commonMistakes: |
      - Réécrire `let` pour changer la valeur : `let ville = "Paris";` une deuxième fois provoque une erreur.
      - Mettre le nom de la variable entre guillemets : `console.log("ville")` affiche le mot ville, pas son contenu.
      - Mettre des espaces ou des accents dans un nom : on écrit `dateNaissance`, pas `date naissance`.
    blocks:
      - type: text
        md: |
          Un programme a souvent besoin de **se souvenir** de choses : un prénom, une ville, un score. Pour
          ça, on utilise des **variables**.
      - type: definition
        id: def-variable
        term: "Variable"
        md: |
          Une **boîte avec une étiquette**. L'étiquette est le **nom** (`ville`), le contenu est la **valeur**
          (`"Lyon"`). On peut ouvrir la boîte pour lire la valeur, ou la remplacer par une autre.
      - type: code
        id: code-let
        language: javascript
        title: "Créer, lire et changer une variable"
        code: |
          let ville = "Lyon";
          console.log(ville);
          ville = "Paris";
          console.log(ville);
        lines:
          - n: 1
            note: "`let` crée une boîte nommée `ville` et y range « Lyon ». Le `=` veut dire « ranger dans »."
          - n: 2
            note: "Sans guillemets : on affiche le **contenu** de la boîte, donc Lyon."
          - n: 3
            note: "On remplace Lyon par Paris. Pas de `let` : la boîte existe déjà."
          - n: 4
            note: "Affiche Paris : la boîte contient la nouvelle valeur."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis change les deux villes."
        language: javascript
        code: |
          let ville = "Lyon";
          console.log(ville);
          ville = "Paris";
          console.log(ville);
      - type: question
        ref: prog-v-q1
        review: def-variable
      - type: compare
        left:
          title: "Afficher le contenu"
          good: true
          language: javascript
          code: |
            let ville = "Lyon";
            console.log(ville);
          md: "Affiche **Lyon** : le contenu de la boîte."
        right:
          title: "Afficher un texte"
          good: false
          language: javascript
          code: |
            let ville = "Lyon";
            console.log("ville");
          md: "Affiche le mot **ville** : avec des guillemets, c'est un texte, pas la boîte."
      - type: question
        ref: prog-v-q6
        review: code-let
      - type: text
        md: "**Exercice 1 (guidé)** : complète la création d'une variable."
      - type: exercise
        ref: prog-ex-let-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : crée une variable, affiche-la, change-la, affiche-la encore."
      - type: exercise
        ref: prog-ex-let-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : ce programme plante. Pourquoi ?"
      - type: exercise
        ref: prog-ex-let-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'une variable ?"
            a: "Un espace nommé qui contient une valeur. On peut lire cette valeur grâce au nom de la variable, et la remplacer si elle est déclarée avec let."
      - type: quiz
        items:
          - ref: prog-v-q3
            review: code-let
          - ref: prog-v-q7
            review: code-let
          - ref: prog-v-q8
            review: def-variable
    questions:
      - code: prog-v-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Dans `let ville = \"Lyon\";`, que fait le signe `=` ?"
        choices:
          - label: "Il range le texte Lyon dans la variable ville"
            correct: true
            why: "Oui : on range une valeur dans la boîte."
          - label: "Il vérifie si ville est égale à Lyon"
            correct: false
            why: "Non : ici, `=` range une valeur. La comparaison viendra plus tard, avec un autre signe."
          - label: "Il affiche Lyon"
            correct: false
            why: "Pour afficher, on utilise `console.log`."
        explanation: "En programmation, `=` signifie « ranger dans la boîte »."
      - code: prog-v-q6
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          let animal = "chat";
          console.log(animal);
        language: javascript
        choices:
          - label: "chat"
            correct: true
            why: "Sans guillemets, on affiche le contenu de la boîte animal."
          - label: "animal"
            correct: false
            why: "Il faudrait des guillemets pour afficher le mot animal."
          - label: "Une erreur"
            correct: false
            why: "La variable existe : tout va bien."
        explanation: "`console.log(nom)` affiche le contenu de la variable."
      - code: prog-v-q3
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          let couleur = "rouge";
          couleur = "vert";
          console.log(couleur);
        language: javascript
        choices:
          - label: "vert"
            correct: true
            why: "La deuxième ligne remplace rouge par vert."
          - label: "rouge"
            correct: false
            why: "La valeur a été remplacée avant l'affichage."
          - label: "rouge vert"
            correct: false
            why: "La boîte ne garde que la dernière valeur rangée."
        explanation: "Ranger une nouvelle valeur remplace l'ancienne."
      - code: prog-v-q7
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "La variable `prenom` existe déjà. Comment changer sa valeur en « Léo » ?"
        choices:
          - label: "`prenom = \"Léo\";`"
            correct: true
            why: "Sans let : la boîte existe déjà, on change seulement son contenu."
          - label: "`let prenom = \"Léo\";`"
            correct: false
            why: "Recréer une boîte qui existe déjà provoque une erreur."
          - label: "`\"prenom\" = \"Léo\";`"
            correct: false
            why: "Le nom d'une variable ne s'écrit pas entre guillemets."
        explanation: "`let` sert seulement à créer la variable, la première fois."
      - code: prog-v-q8
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quel nom de variable est valide en JavaScript ?"
        choices:
          - label: "`dateNaissance`"
            correct: true
            why: "Oui : pas d'espace, commence par une lettre."
          - label: "`date naissance`"
            correct: false
            why: "Un nom ne peut pas contenir d'espace."
          - label: "`2date`"
            correct: false
            why: "Un nom ne peut pas commencer par un chiffre."
        explanation: "On colle les mots en mettant une majuscule à chaque nouveau mot : `dateNaissance`."
    exercises:
      - slug: prog-ex-let-guide
        kind: COMPLETER
        title: "Créer une variable"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète pour créer la variable `fruit` qui contient « pomme », puis l'afficher."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot qui crée une variable a trois lettres."
          - "Le signe qui range une valeur dans la boîte."
          - "let, =, fruit."
        solution: '["let", "=", "fruit"]'
        explanation: "`let fruit = \"pomme\";` puis `console.log(fruit);` affiche pomme."
        xp: 10
        payload:
          language: javascript
          template: |
            [[1]] fruit [[2]] "pomme";
            console.log([[3]]);
          blanks:
            - ["let"]
            - ["="]
            - ["fruit"]
      - slug: prog-ex-let-libre
        kind: CODE_LIBRE
        title: "Une variable qui change"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          1. crée une variable `saison` avec `let`, qui contient `"hiver"` ;
          2. affiche-la ;
          3. change sa valeur en `"printemps"` (sans réécrire `let`) ;
          4. affiche-la encore.
        criteria: "Une variable créée avec let, affichée, modifiée sans let, puis affichée."
        hints:
          - "`let saison = \"hiver\";`"
          - "Pour changer la valeur : `saison = \"printemps\";`"
          - "Un `console.log(saison);` avant le changement, et un autre après."
        solution: |
          let saison = "hiver";
          console.log(saison);
          saison = "printemps";
          console.log(saison);
        explanation: "La même boîte contient d'abord hiver, puis printemps."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Ta variable saison

          checks:
            - pattern: 'let\s+saison\s*=\s*["''`]hiver["''`]'
              message: "Crée la variable : let saison = \"hiver\";"
            - pattern: '(?<!let\s)(?<!let\s\s)\bsaison\s*=\s*["''`]printemps["''`]'
              message: "Change la valeur : saison = \"printemps\";"
            - pattern: 'let\s+saison\s*=\s*["''`]printemps'
              absent: true
              message: "N'écris pas let une deuxième fois : la variable existe déjà."
            - pattern: '\A(?>[\s\S]*?console\.log\s*\(\s*saison\s*\)){2}'
              message: "Affiche saison deux fois : avant et après le changement."
          output: |
            hiver
            printemps
      - slug: prog-ex-let-bug
        kind: CORRIGER_ERREUR
        title: "Un let de trop"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme doit afficher `Lyon` puis `Nantes`, mais il provoque une erreur :
          « Identifier 'ville' has already been declared » (la variable ville existe déjà). Corrige-le.
        criteria: "La variable est créée une seule fois avec let."
        hints:
          - "Le message dit que ville a déjà été créée."
          - "Pour changer la valeur d'une variable qui existe, on n'écrit pas let."
          - "`ville = \"Nantes\";`"
        solution: |
          let ville = "Lyon";
          console.log(ville);
          ville = "Nantes";
          console.log(ville);
        explanation: "`let` crée la boîte ; ensuite, on change seulement son contenu."
        xp: 10
        payload:
          language: javascript
          starter: |
            let ville = "Lyon";
            console.log(ville);
            let ville = "Nantes";
            console.log(ville);
          checks:
            - pattern: 'let\s+ville\s*=\s*["''`]Nantes'
              absent: true
              message: "Ne recrée pas ville avec let : écris seulement ville = \"Nantes\";"
            - pattern: '\bville\s*=\s*["''`]Nantes["''`]'
              message: "Change la valeur : ville = \"Nantes\";"
            - pattern: 'let\s+ville\s*=\s*["''`]Lyon["''`]'
              message: "Garde la création : let ville = \"Lyon\";"
          output: |
            Lyon
            Nantes

  # ===================================================================== LEÇON 3
  - slug: prog-const
    title: "Une valeur qui ne change pas : const"
    duration: 8
    objective: "Créer une constante avec const et choisir entre let et const."
    prerequisites: "Leçon « Ranger une valeur : les variables avec let »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - `const pays = "France";` crée une boîte **scellée** : sa valeur ne changera plus.
      - Essayer de la changer (`pays = "Italie";`) provoque une erreur.
      - `let` : la valeur **va changer** (un score, une saison). `const` : elle **ne change pas** (une date de naissance).
      - Bonne habitude : on utilise `const` par défaut, et `let` seulement quand la valeur doit changer.
    commonMistakes: |
      - Changer une `const` : erreur « Assignment to constant variable ».
      - Utiliser `let` partout : le code dit moins bien ce qui peut changer.
    blocks:
      - type: text
        md: |
          Certaines valeurs ne bougent jamais : ta date de naissance, le nom d'une ville. Pour elles, on
          utilise une **constante**.
      - type: definition
        id: def-const
        term: "Constante (const)"
        md: |
          Une boîte **scellée** : on y range une valeur à la création, puis plus personne ne peut la
          changer. Comme une **date gravée** sur une médaille.
      - type: code
        id: code-const
        language: javascript
        title: "let ou const ?"
        code: |
          const prenom = "Awa";
          let humeur = "fatiguée";
          console.log(prenom);
          console.log(humeur);
          humeur = "en forme";
          console.log(humeur);
        lines:
          - n: 1
            note: "Le prénom ne changera pas : `const`."
          - n: 2
            note: "L'humeur, elle, va changer : `let`."
          - n: 5
            note: "On change l'humeur : autorisé, car c'est un `let`."
      - type: demo
        title: "Provoque l'erreur"
        md: "Exécute, puis ajoute la ligne `prenom = \"Inès\";` à la fin : lis le message d'erreur."
        language: javascript
        code: |
          const prenom = "Awa";
          let humeur = "fatiguée";
          humeur = "en forme";
          console.log(prenom);
          console.log(humeur);
      - type: question
        ref: prog-v-q5
        review: def-const
      - type: question
        ref: prog-k-q2
        review: code-const
      - type: text
        md: "**Exercice 1 (guidé)** : choisis let ou const."
      - type: exercise
        ref: prog-ex-variables-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une constante et une variable."
      - type: exercise
        ref: prog-ex-const-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une constante qu'on essaie de changer."
      - type: exercise
        ref: prog-ex-const-bug
      - type: jury
        items:
          - q: "Quelle différence entre let et const ?"
            a: "`let` déclare une variable dont la valeur peut changer ; `const` déclare une valeur qui ne sera plus réaffectée. On utilise `const` par défaut, `let` quand la valeur doit évoluer."
      - type: quiz
        items:
          - ref: prog-k-q3
            review: def-const
          - ref: prog-k-q4
            review: code-const
          - ref: prog-k-q5
            review: def-const
    questions:
      - code: prog-v-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "On peut changer la valeur d'une variable déclarée avec `const`."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : JavaScript refuse (« Assignment to constant variable »)."
          - label: "Faux"
            correct: true
            why: "Exact : `const` fige la valeur."
        explanation: "`const` pour ce qui ne change pas, `let` pour ce qui change."
      - code: prog-k-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Pour ranger le **score** d'un jeu, qui augmente pendant la partie, que choisir ?"
        choices:
          - label: "`let`"
            correct: true
            why: "Le score change : il faut une variable modifiable."
          - label: "`const`"
            correct: false
            why: "Une constante ne pourrait pas changer."
          - label: "Aucun des deux"
            correct: false
            why: "Il faut bien une boîte pour le score."
        explanation: "Valeur qui change → `let` ; valeur fixe → `const`."
      - code: prog-k-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Pour ranger une **date de naissance**, que choisir ?"
        choices:
          - label: "`const`"
            correct: true
            why: "Une date de naissance ne change jamais."
          - label: "`let`"
            correct: false
            why: "Ça marcherait, mais `const` dit mieux que la valeur ne changera pas."
          - label: "`console.log`"
            correct: false
            why: "console.log affiche, il ne crée pas de boîte."
        explanation: "On choisit `const` par défaut."
      - code: prog-k-q4
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Que se passe-t-il quand on exécute ce code ?"
        snippet: |
          const ville = "Lille";
          ville = "Nice";
          console.log(ville);
        language: javascript
        choices:
          - label: "Une erreur : on ne peut pas changer une constante"
            correct: true
            why: "La deuxième ligne est refusée."
          - label: "Nice s'affiche"
            correct: false
            why: "La valeur d'une const ne peut pas être remplacée."
          - label: "Lille s'affiche"
            correct: false
            why: "Le programme s'arrête sur l'erreur avant d'afficher."
        explanation: "Changer une `const` provoque l'erreur « Assignment to constant variable »."
      - code: prog-k-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "La bonne habitude est d'utiliser `const` par défaut, et `let` seulement quand la valeur doit changer."
        choices:
          - label: "Vrai"
            correct: true
            why: "Ainsi, on voit tout de suite ce qui peut changer dans le programme."
          - label: "Faux"
            correct: false
            why: "C'est pourtant la règle suivie par la plupart des développeurs."
        explanation: "`const` protège contre les changements par erreur."
    exercises:
      - slug: prog-ex-variables-guide
        kind: COMPLETER
        title: "let ou const ?"
        difficulty: FACILE
        skill: algo-bases
        statement: "Le prénom ne changera pas, la ville oui. Complète avec le bon mot, puis affiche la ville."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Une valeur qui ne change pas : mot de cinq lettres."
          - "Une valeur qui change : mot de trois lettres."
          - "const, let, ville."
        solution: '["const", "let", "ville"]'
        explanation: "`const prenom` car le prénom ne change pas ; `let ville` car elle peut changer."
        xp: 10
        payload:
          language: javascript
          template: |
            [[1]] prenom = "Inès";
            [[2]] ville = "Lyon";
            ville = "Bordeaux";
            console.log([[3]]);
          blanks:
            - ["const"]
            - ["let"]
            - ["ville"]
      - slug: prog-ex-const-libre
        kind: CODE_LIBRE
        title: "Une constante et une variable"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          1. crée une **constante** `pays` qui contient `"Sénégal"` ;
          2. crée une **variable** `meteo` (avec `let`) qui contient `"pluie"` ;
          3. change `meteo` en `"soleil"` ;
          4. affiche `pays`, puis `meteo`.
        criteria: "pays en const, meteo en let modifiée, deux affichages."
        hints:
          - "`const pays = \"Sénégal\";`"
          - "`let meteo = \"pluie\";` puis `meteo = \"soleil\";`"
          - "`console.log(pays);` et `console.log(meteo);`"
        solution: |
          const pays = "Sénégal";
          let meteo = "pluie";
          meteo = "soleil";
          console.log(pays);
          console.log(meteo);
        explanation: "Le pays est fixe (const), la météo change (let)."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Ta constante et ta variable

          checks:
            - pattern: 'const\s+pays\s*=\s*["''`]Sénégal["''`]'
              message: "Crée la constante : const pays = \"Sénégal\";"
            - pattern: 'let\s+meteo\s*=\s*["''`]pluie["''`]'
              message: "Crée la variable : let meteo = \"pluie\";"
            - pattern: '(?<!let\s)\bmeteo\s*=\s*["''`]soleil["''`]'
              message: "Change la météo : meteo = \"soleil\";"
            - pattern: 'console\.log\s*\(\s*pays\s*\)'
              message: "Affiche pays."
            - pattern: 'console\.log\s*\(\s*meteo\s*\)'
              message: "Affiche meteo."
          output: |
            Sénégal
            soleil
      - slug: prog-ex-const-bug
        kind: CORRIGER_ERREUR
        title: "Une constante qui devait changer"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          Ce programme plante avec « Assignment to constant variable ». Le **niveau** d'une joueuse doit
          pouvoir changer. Corrige la déclaration.
        criteria: "niveau est déclaré avec let."
        hints:
          - "Le message dit qu'on essaie de changer une constante."
          - "Une valeur qui change se déclare avec un autre mot."
          - "`let niveau = \"débutante\";`"
        solution: |
          let niveau = "débutante";
          niveau = "confirmée";
          console.log(niveau);
        explanation: "Le niveau change : il faut `let`, pas `const`."
        xp: 10
        payload:
          language: javascript
          starter: |
            const niveau = "débutante";
            niveau = "confirmée";
            console.log(niveau);
          checks:
            - pattern: 'const\s+niveau'
              absent: true
              message: "niveau change : ce ne peut pas être une const."
            - pattern: 'let\s+niveau\s*=\s*["''`]débutante["''`]'
              message: "Déclare let niveau = \"débutante\";"
            - pattern: 'console\.log\s*\(\s*niveau\s*\)'
              message: "Garde l'affichage de niveau."
          output: "confirmée"

  # ===================================================================== LEÇON 4
  - slug: prog-types
    title: "Les sortes de valeurs : texte, nombre, vrai/faux"
    duration: 10
    objective: "Reconnaître un texte, un nombre et un booléen, et connaître le type d'une valeur avec typeof."
    prerequisites: "Leçon « Une valeur qui ne change pas : const »."
    skills: [algo-bases]
    xp: 10
    memo: |
      - **Texte** (`string`) : entre guillemets, `"Awa"`, `"18"`.
      - **Nombre** (`number`) : sans guillemets, `18`, `2.5` (la virgule s'écrit avec un point).
      - **Booléen** (`boolean`) : `true` (vrai) ou `false` (faux), sans guillemets.
      - `typeof valeur` donne la sorte : `"string"`, `"number"` ou `"boolean"`.
    commonMistakes: |
      - Mettre un nombre entre guillemets : `"18"` est un texte, pas un nombre.
      - Écrire `"true"` entre guillemets : c'est un texte, pas un booléen.
    blocks:
      - type: text
        md: |
          Toutes les valeurs ne sont pas de la même **sorte**. Un prénom, un âge et une réponse oui/non ne se
          rangent pas de la même façon.
      - type: definition
        id: def-types
        term: "Type (la sorte de valeur)"
        md: |
          Comme au supermarché, chaque produit a son **rayon** :
          - **texte** (`string`) : `"Awa"`, toujours entre guillemets ;
          - **nombre** (`number`) : `18`, sans guillemets ;
          - **booléen** (`boolean`) : `true` ou `false`, comme un **interrupteur** allumé ou éteint.
      - type: code
        id: code-types
        language: javascript
        title: "Trois sortes de valeurs"
        code: |
          const prenom = "Awa";
          const age = 25;
          const inscrite = true;
          console.log(typeof prenom);
          console.log(typeof age);
          console.log(typeof inscrite);
        lines:
          - n: 1
            note: "Entre guillemets : un **texte**."
          - n: 2
            note: "Sans guillemets : un **nombre**."
          - n: 3
            note: "`true` sans guillemets : un **booléen** (vrai)."
          - n: 4
            note: "`typeof` donne la sorte : affiche string."
          - n: 5
            note: "Affiche number."
          - n: 6
            note: "Affiche boolean."
      - type: demo
        title: "Essaie"
        md: "Exécute, puis mets `25` entre guillemets : `typeof` répond alors string."
        language: javascript
        code: |
          const prenom = "Awa";
          const age = 25;
          const inscrite = true;
          console.log(typeof prenom);
          console.log(typeof age);
          console.log(typeof inscrite);
      - type: question
        ref: prog-v-q2
        review: def-types
      - type: question
        ref: prog-c1-b2
        review: code-types
      - type: text
        md: "**Exercice 1 (guidé)** : complète avec la bonne sorte."
      - type: exercise
        ref: prog-ex-types-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : trois variables, trois sortes."
      - type: exercise
        ref: prog-ex-variables
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : les valeurs sont rangées dans la mauvaise sorte."
      - type: exercise
        ref: prog-ex-types-bug
      - type: jury
        items:
          - q: "Quels sont les types de base en JavaScript ?"
            a: "Les principaux sont string (texte), number (nombre) et boolean (vrai ou faux). On peut connaître le type d'une valeur avec typeof."
      - type: quiz
        items:
          - ref: prog-ty-q3
            review: def-types
          - ref: prog-ty-q4
            review: def-types
          - ref: prog-ty-q5
            review: code-types
    questions:
      - code: prog-v-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quelle est la sorte de la valeur `true` ?"
        choices:
          - label: "Booléen"
            correct: true
            why: "Oui : vrai ou faux."
          - label: "Texte"
            correct: false
            why: "Sans guillemets, `true` n'est pas un texte."
          - label: "Nombre"
            correct: false
            why: "Ce n'est pas un nombre."
        explanation: "Les booléens n'ont que deux valeurs : `true` et `false`."
      - code: prog-c1-b2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche `console.log(typeof 42);` ?"
        snippet: "console.log(typeof 42);"
        language: javascript
        choices:
          - label: "number"
            correct: true
            why: "42 est un nombre."
          - label: "string"
            correct: false
            why: "Ce serait avec `\"42\"`."
          - label: "42"
            correct: false
            why: "`typeof` donne la sorte, pas la valeur."
        explanation: "`typeof` renvoie le nom de la sorte : number, string, boolean…"
      - code: prog-ty-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: algo-bases
        prompt: "Quelle valeur est un **texte** ?"
        choices:
          - label: "`\"18\"`"
            correct: true
            why: "Les guillemets en font un texte, même s'il contient des chiffres."
          - label: "`18`"
            correct: false
            why: "Sans guillemets, c'est un nombre."
          - label: "`false`"
            correct: false
            why: "C'est un booléen."
        explanation: "Ce sont les guillemets qui font un texte."
      - code: prog-ty-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: algo-bases
        prompt: "`\"true\"` (avec des guillemets) est un booléen."
        choices:
          - label: "Vrai"
            correct: false
            why: "Avec des guillemets, c'est un texte qui contient le mot true."
          - label: "Faux"
            correct: true
            why: "Exact : le booléen s'écrit `true`, sans guillemets."
        explanation: "`true` = booléen ; `\"true\"` = texte."
      - code: prog-ty-q5
        kind: RESULTAT_CODE
        difficulty: 1
        skill: algo-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          const code = "75000";
          console.log(typeof code);
        language: javascript
        choices:
          - label: "string"
            correct: true
            why: "Entre guillemets : c'est un texte."
          - label: "number"
            correct: false
            why: "Les guillemets en font un texte."
          - label: "75000"
            correct: false
            why: "typeof donne la sorte, pas la valeur."
        explanation: "Un code postal est souvent rangé comme texte, car on ne fait pas de calcul avec."
    exercises:
      - slug: prog-ex-types-guide
        kind: COMPLETER
        title: "La bonne sorte"
        difficulty: FACILE
        skill: algo-bases
        statement: "Complète chaque commentaire avec la sorte que va afficher typeof : string, number ou boolean."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Entre guillemets : string."
          - "Un nombre sans guillemets : number. Vrai ou faux : boolean."
          - "string, number, boolean."
        solution: '["string", "number", "boolean"]'
        explanation: "\"Lyon\" est un texte, 21 un nombre, true un booléen."
        xp: 10
        payload:
          language: javascript
          template: |
            console.log(typeof "Lyon");   // affiche [[1]]
            console.log(typeof 21);       // affiche [[2]]
            console.log(typeof true);     // affiche [[3]]
          blanks:
            - ["string"]
            - ["number"]
            - ["boolean"]
      - slug: prog-ex-variables
        kind: CODE_LIBRE
        title: "Mes trois variables"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          1. crée une constante `ville` qui contient le texte `"Lyon"` ;
          2. crée une variable `temperature` (avec `let`) qui vaut le nombre `21` ;
          3. crée une constante `ensoleille` qui vaut `true` ;
          4. affiche la sorte de chacune avec `console.log(typeof ...)`.
        criteria: "Trois déclarations de trois sortes différentes et trois affichages avec typeof."
        hints:
          - "`const ville = \"Lyon\";`"
          - "Un nombre et un booléen s'écrivent sans guillemets : `let temperature = 21;` et `const ensoleille = true;`"
          - "`console.log(typeof ville);` (et pareil pour les deux autres)"
        solution: |
          const ville = "Lyon";
          let temperature = 21;
          const ensoleille = true;
          console.log(typeof ville);
          console.log(typeof temperature);
          console.log(typeof ensoleille);
        explanation: "Trois sortes différentes : un texte, un nombre, un booléen."
        xp: 15
        payload:
          language: javascript
          starter: |
            // Tes trois variables

          checks:
            - pattern: 'const\s+ville\s*=\s*["''`]Lyon["''`]'
              message: "Déclare la constante : const ville = \"Lyon\";"
            - pattern: 'let\s+temperature\s*=\s*21\b'
              message: "Déclare la variable : let temperature = 21; (sans guillemets, c'est un nombre)."
            - pattern: '(let|const)\s+ensoleille\s*=\s*true\b'
              message: "Déclare ensoleille avec la valeur true (sans guillemets)."
            - pattern: '\A(?>[\s\S]*?typeof\s){3}'
              message: "Affiche la sorte des trois variables avec typeof."
            - pattern: 'temperature\s*=\s*["''`]21'
              absent: true
              message: "21 est un nombre : pas de guillemets."
          output: |
            string
            number
            boolean
      - slug: prog-ex-types-bug
        kind: CORRIGER_ERREUR
        title: "La mauvaise sorte"
        difficulty: FACILE
        skill: algo-bases
        statement: |
          `age` devrait être un **nombre** et `abonnee` un **booléen**. Ici, les deux sont des textes :
          typeof affiche deux fois string. Corrige les deux déclarations pour obtenir number puis boolean.
        criteria: "age vaut le nombre 30 et abonnee vaut true, sans guillemets."
        hints:
          - "Ce sont les guillemets qui transforment une valeur en texte."
          - "Enlève les guillemets autour de 30."
          - "`let age = 30;` et `const abonnee = true;`"
        solution: |
          let age = 30;
          const abonnee = true;
          console.log(typeof age);
          console.log(typeof abonnee);
        explanation: "Sans guillemets, 30 est un nombre et true un booléen."
        xp: 10
        payload:
          language: javascript
          starter: |
            let age = "30";
            const abonnee = "true";
            console.log(typeof age);
            console.log(typeof abonnee);
          checks:
