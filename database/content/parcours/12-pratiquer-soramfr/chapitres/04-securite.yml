      - slug: sor-ex-properties
        kind: CORRIGER_ERREUR
        title: "Nettoyer application.properties"
        difficulty: INTERMEDIAIRE
        skill: rgpd-secrets
        statement: |
          Voici la configuration de Soramfr (le secret a été remplacé par un exemple). Rends-la sûre pour la
          production :
          1. le secret JWT vient de la variable d'environnement `JWT_SECRET`, **sans valeur par défaut** ;
          2. le mot de passe de la base vient de `DB_PASSWORD`, **sans** valeur par défaut `postgres` ;
          3. Hibernate **vérifie** le schéma au lieu de le modifier (`validate`) ;
          4. les requêtes SQL ne sont plus affichées ;
          5. les détails techniques ne sont plus envoyés dans les erreurs.
        criteria: "Aucun secret en clair ; configuration prudente pour la production."
        hints:
          - "Syntaxe d'une variable d'environnement dans Spring : `${NOM_DE_LA_VARIABLE}`."
          - "`app.jwt.secret=${JWT_SECRET}` et `spring.datasource.password=${DB_PASSWORD}`."
          - "`spring.jpa.hibernate.ddl-auto=validate`, `spring.jpa.show-sql=false`, `app.errors.include-details=false`."
        solution: |
          spring.application.name=projetfind-etude
          spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_utilisateurs}
          spring.datasource.username=${DB_USERNAME:postgres}
          spring.datasource.password=${DB_PASSWORD}
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          server.port=${PORT:8080}
          app.errors.include-details=false
          app.jwt.secret=${JWT_SECRET}
          app.jwt.exp-minutes=120
        explanation: |
          - `${JWT_SECRET}` sans valeur par défaut : si la variable manque, l'application **refuse de démarrer**.
            C'est voulu : mieux vaut une panne visible qu'un secret faible.
          - `ddl-auto=validate` : Hibernate vérifie que les tables correspondent aux entités, sans jamais les
            modifier. Les changements de schéma passent par des migrations versionnées (Flyway).
          - `show-sql=false` et `include-details=false` : pas d'informations techniques exposées.
        xp: 30
        payload:
          language: properties
          starter: |
            spring.application.name=projetfind-etude
            spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_utilisateurs}
            spring.datasource.username=${DB_USERNAME:postgres}
            spring.datasource.password=${DB_PASSWORD:postgres}
            spring.jpa.hibernate.ddl-auto=update
            spring.jpa.show-sql=true
            server.port=${PORT:8080}
            app.errors.include-details=true
            app.jwt.secret=une-longue-phrase-secrete-ecrite-en-clair-dans-le-depot
            app.jwt.exp-minutes=120
          checks:
            - pattern: '^app\.jwt\.secret\s*=\s*\$\{JWT_SECRET\}\s*$'
              message: "Le secret JWT doit venir de la variable d'environnement : app.jwt.secret=${JWT_SECRET}"
            - pattern: 'ecrite-en-clair'
              absent: true
              message: "Le secret en clair doit disparaître du fichier."
            - pattern: '^spring\.datasource\.password\s*=\s*\$\{DB_PASSWORD\}\s*$'
              message: "Le mot de passe de la base : spring.datasource.password=${DB_PASSWORD} (sans valeur par défaut)."
            - pattern: '^spring\.jpa\.hibernate\.ddl-auto\s*=\s*validate\s*$'
              message: "En production, Hibernate vérifie le schéma : spring.jpa.hibernate.ddl-auto=validate"
            - pattern: '^spring\.jpa\.show-sql\s*=\s*false\s*$'
              message: "N'affiche plus les requêtes SQL : spring.jpa.show-sql=false"
            - pattern: '^app\.errors\.include-details\s*=\s*false\s*$'
              message: "Ne renvoie plus les détails techniques : app.errors.include-details=false"

