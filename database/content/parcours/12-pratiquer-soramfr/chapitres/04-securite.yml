      - slug: sor-ex-jwt-expliquer
        kind: CODE_LIBRE
        title: "Expliquer les trois parties d'un jeton"
        difficulty: INTERMEDIAIRE
        skill: auth-jwt
        statement: |
          Regarde le jeton découpé en trois dans la leçon. Explique chaque partie en une ligne :
          `En-tête :`, `Contenu :`, `Signature :`. Pour le contenu, dis s'il est secret ou lisible ; pour la
          signature, dis à quoi elle sert.
        criteria: "Contenu lisible (pas chiffré) ; signature qui empêche la modification."
        hints:
          - "En-tête : l'algorithme utilisé (HS256)."
          - "Contenu : les claims (id, pseudo, rôle, expiration), lisibles par tout le monde."
          - "Signature : prouve que personne n'a modifié le jeton, grâce au secret du serveur."
        solution: |
          En-tête : l'algorithme de signature utilisé (HS256).
          Contenu : l'id, le pseudo, le rôle et l'expiration ; il est lisible par tout le monde, pas chiffré.
          Signature : calculée avec le secret du serveur, elle prouve que personne n'a modifié le jeton.
        explanation: "Comme le contenu est lisible, on n'y met jamais de mot de passe."
        xp: 15
        payload:
          language: text
          starter: |
            En-tête :
            Contenu :
            Signature :
          checks:
            - pattern: '(?im)^\s*En-t[êe]te\s*:[ \t]*\S[^\n]{5,}'
              message: "Décris l'en-tête."
            - pattern: '(?im)^\s*Contenu\s*:[^\n]*(?:lisible|pas chiffr|non chiffr|base64)'
              message: "Dis que le contenu est lisible (pas chiffré)."
            - pattern: '(?im)^\s*Signature\s*:[^\n]*(?:modifi|falsifi|chang|secret)'
              message: "Explique que la signature empêche de modifier le jeton."

  - slug: sor-proteger-routes
    title: "TP — Protéger une route avec JWT"
    duration: 15
    objective: "Comprendre JwtAuthFilter et SecurityConfig, puis réserver /api/users aux administratrices."
    prerequisites: "Leçon « Le jeton JWT »."
    skills: [auth-jwt, spring-structure]
    xp: 30
    memo: |
      - `JwtAuthFilter` lit `Authorization: Bearer <jeton>`, vérifie le jeton et dépose l'identité (avec `ROLE_USER` ou `ROLE_ADMIN`) dans le **contexte de sécurité**.
      - `SecurityConfig` fixe les règles, **dans l'ordre** : la première règle qui correspond gagne.
      - `permitAll()` : ouvert à tous ; `authenticated()` : connecté ; `hasRole("ADMIN")` : rôle ADMIN (Spring cherche `ROLE_ADMIN`).
      - Soramfr n'a aucune règle `hasRole` : toute personne connectée peut lister et supprimer les comptes.
      - 401 = pas connecté ; 403 = connecté mais interdit. Sans point d'entrée configuré, Spring renvoie 403 dans les deux cas.
    commonMistakes: |
      - Mettre `.requestMatchers("/api/**").authenticated()` **avant** la règle admin : elle ne sera jamais atteinte.
      - Écrire `hasRole("ROLE_ADMIN")` : Spring ajoute déjà `ROLE_` (il chercherait `ROLE_ROLE_ADMIN`).
      - Protéger seulement côté Angular : un appel direct à l'API (Postman, curl) contourne le garde.
    blocks:
      - type: text
        md: |
          Le jeton existe. Il reste à l'utiliser pour **filtrer** les requêtes. Deux classes s'en chargent :
          un **filtre** qui lit le jeton, et une **configuration** qui décide qui peut aller où.
      - type: definition
        id: def-filtre
        term: "Filtre"
        md: |
          Un **contrôle à l'entrée**, avant que la requête n'atteigne le contrôleur. Comme le vigile qui
          regarde les bracelets avant l'entrée d'une salle de concert.
      - type: code
        id: code-jwtfilter
        language: java
        title: "Soramfr — JwtAuthFilter.java (extrait)"
        code: |
          String header = req.getHeader(HttpHeaders.AUTHORIZATION);
          if (StringUtils.hasText(header) && header.startsWith("Bearer ")) {
              String token = header.substring(7);
              try {
                  String role = jwt.getRole(token);
                  String username = jwt.getUsername(token);
                  var auth = new UsernamePasswordAuthenticationToken(
                      username, null, List.of(new SimpleGrantedAuthority("ROLE_" + role)));
                  SecurityContextHolder.getContext().setAuthentication(auth);
              } catch (Exception e) {
                  SecurityContextHolder.clearContext();
              }
          }
          chain.doFilter(req, res);
        lines:
          - n: 1
            note: "On lit l'en-tête `Authorization`."
          - n: 2
            note: "Il doit commencer par `Bearer ` (avec l'espace)."
          - n: 3
            note: "`substring(7)` enlève les 7 caractères de `Bearer ` : il reste le jeton."
          - n: 5
            note: "`getRole` **vérifie la signature et l'expiration** avant de lire le rôle (il appelle `parse`)."
          - n: 8
            note: "`ROLE_` + `ADMIN` = `ROLE_ADMIN` : la forme attendue par `hasRole(\"ADMIN\")`."
          - n: 9
            note: "L'identité est déposée dans le **contexte de sécurité** : Spring sait qui fait la requête."
          - n: 11
            note: "Jeton invalide ou expiré : aucune identité. La règle `authenticated()` refusera ensuite."
          - n: 14
            note: "Dans tous les cas, la requête continue vers le filtre suivant."
      - type: question
        ref: sor-p-q1
        review: code-jwtfilter
      - type: code
        id: code-securityconfig
        language: java
        title: "Soramfr — SecurityConfig.java (règles actuelles)"
        code: |
          .authorizeHttpRequests(auth -> auth
              .requestMatchers(HttpMethod.OPTIONS, "/**").permitAll()
              .requestMatchers("/api/auth/**").permitAll()
              .requestMatchers("/api/**").authenticated()
              .anyRequest().authenticated()
          );
        lines:
          - n: 2
            note: "Les requêtes `OPTIONS` (le « pré-vol » CORS du navigateur) passent toujours."
          - n: 3
            note: "Inscription et connexion : publiques (on n'a pas encore de jeton)."
          - n: 4
            note: "Tout le reste de l'API : il suffit d'être connecté… **quel que soit le rôle**."
          - n: 5
            note: "Toute autre adresse : connectée aussi."
      - type: definition
        id: def-401-403
        term: "401 ou 403 ?"
        md: |
          - **401 Unauthorized** : « Je ne sais pas qui tu es » (pas de jeton, jeton faux ou expiré).
          - **403 Forbidden** : « Je sais qui tu es, mais tu n'as pas le droit » (USER sur une route ADMIN).

          Soramfr renvoie **403** même sans jeton : Spring utilise ce code par défaut quand aucun
          « point d'entrée » n'est configuré. On ajoute `.exceptionHandling(e -> e.authenticationEntryPoint(new
          HttpStatusEntryPoint(HttpStatus.UNAUTHORIZED)))`.
      - type: question
        ref: sor-p-q2
        review: def-401-403
      - type: text
        md: "Exercice guidé : remets les règles de sécurité dans le bon ordre."
      - type: exercise
        ref: sor-ex-regles-ordre
      - type: text
        md: |
          TP en autonomie : **protège la route d'administration avec JWT**. Ajoute la règle ADMIN et le
          point d'entrée 401.
      - type: exercise
        ref: sor-ex-proteger-admin
      - type: steps
        id: etapes-verif-postman
        title: "Vérifier la protection avec Postman"
        items:
          - "`GET /api/users` **sans** jeton → attendu **401**."
          - "Connexion avec un compte USER, puis `GET /api/users` avec son jeton → attendu **403**."
          - "Connexion avec un compte ADMIN, puis `GET /api/users` avec son jeton → attendu **200**."
          - "`POST /api/auth/login` sans jeton → toujours **200** (route publique)."
      - type: text
        md: "**Exercice guidé** : complète les règles de sécurité."
      - type: exercise
        ref: sor-ex-regles-guide
      - type: jury
        items:
          - q: "Comment protégez-vous les routes d'administration ?"
            a: |
              « Côté serveur, dans `SecurityConfig` : `.requestMatchers(\"/api/users/**\").hasRole(\"ADMIN\")`,
              placé avant la règle générale. Le filtre JWT dépose le rôle `ROLE_ADMIN` lu dans le jeton signé.
              Côté Angular, un garde de rôle masque la page, mais c'est le serveur qui fait foi. »
          - q: "Quelle différence entre 401 et 403 ?"
            a: "401 : on ne sait pas qui tu es. 403 : on sait qui tu es, mais tu n'as pas le droit."
      - type: quiz
        items:
          - ref: sor-p-q3
            review: code-securityconfig
          - ref: sor-p-q4
            review: def-filtre
          - ref: sor-p-q5
            review: etapes-verif-postman
    questions:
      - code: sor-p-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Que fait le filtre si le jeton est expiré ?"
        choices:
          - label: "Il n'enregistre aucune identité ; la route protégée sera refusée"
            correct: true
            why: "Oui : `parse` lève une exception, le `catch` vide le contexte."
          - label: "Il prolonge le jeton"
            correct: false
            why: "Le filtre ne fabrique jamais de jeton."
          - label: "Il laisse passer en tant qu'ADMIN"
            correct: false
            why: "Heureusement non."
        explanation: "Pas d'identité → la règle `authenticated()` ou `hasRole(...)` bloque la requête."
      - code: sor-p-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Une cliente connectée (USER) appelle une route réservée ADMIN. Quel code est correct ?"
        choices:
          - label: "403"
            correct: true
            why: "Oui : on sait qui elle est, mais elle n'a pas le droit."
          - label: "401"
            correct: false
            why: "Elle est bien authentifiée."
          - label: "404"
            correct: false
