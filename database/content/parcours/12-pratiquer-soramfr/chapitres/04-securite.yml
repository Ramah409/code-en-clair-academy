slug: soramfr-securite
position: 4
level: INTERMEDIAIRE
title: "Sécuriser Soramfr : BCrypt, JWT et Spring Security"
summary: "Hacher les mots de passe, fabriquer et vérifier un jeton JWT, protéger les routes par rôle, et corriger les failles CORS, XSS et de configuration du projet."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: sor-bcrypt
    title: "Hacher les mots de passe avec BCrypt"
    duration: 12
    objective: "Expliquer la différence entre hacher et chiffrer, et vérifier qu'aucun hash ne sort de l'API."
    prerequisites: "Chapitre « Le backend Spring Boot de Soramfr »."
    skills: [auth-jwt, rgpd-secrets]
    xp: 20
    memo: |
      - **Hacher** : transformer un texte en empreinte, **sans retour possible**. **Chiffrer** : on peut déchiffrer avec la clé.
      - Un mot de passe se **hache**, il ne se chiffre pas.
      - BCrypt ajoute un **sel** (un morceau aléatoire) : deux mots de passe identiques donnent deux hash différents.
      - BCrypt est **lent exprès** (le « coût ») : essayer des milliards de mots de passe devient trop long.
      - `encoder.encode(motDePasse)` à l'inscription ; `encoder.matches(motDePasse, hash)` à la connexion.
      - Un hash ne doit **jamais** sortir de l'API (Soramfr le renvoie dans `UserDto` : à corriger).
    commonMistakes: |
      - Dire « crypter » ou « chiffrer » le mot de passe : on le **hache**.
      - Comparer deux hash avec `equals` : à cause du sel, il faut `encoder.matches(...)`.
      - Utiliser MD5 ou SHA-256 seuls : trop rapides, donc faciles à attaquer.
      - Écrire « BCcrypt » dans le rapport (faute de frappe relevée dans le dossier).
    blocks:
      - type: text
        md: |
          Si un pirate volait la base de Soramfr, trouverait-il les mots de passe ? Non, grâce au
          **hachage**. Voyons pourquoi, et vérifions qu'aucune fuite n'existe ailleurs.
      - type: definition
        id: def-hachage
        term: "Hacher (hachage)"
        md: |
          Transformer un texte en une **empreinte** de taille fixe, **sans pouvoir revenir en arrière**.
          C'est comme passer une carotte au mixeur : facile de faire la purée, impossible de reconstituer la
          carotte. Pour vérifier un mot de passe, on refait la purée et on compare.
      - type: definition
        id: def-chiffrer
        term: "Chiffrer"
        md: |
          Transformer un texte avec une **clé**, de façon **réversible** : avec la clé, on retrouve le texte.
          C'est un coffre-fort. Pour un mot de passe, c'est dangereux : qui vole la clé ouvre tous les coffres.
      - type: definition
        id: def-sel
        term: "Sel"
        md: |
          Un morceau de texte **aléatoire** ajouté au mot de passe avant de le hacher. Deux personnes qui ont
          choisi « Soleil2025 » obtiennent deux hash **différents**. Les listes de hash déjà calculés
          deviennent inutiles.
      - type: code
        id: code-bcrypt-hash
        language: text
        title: "À quoi ressemble un hash BCrypt (60 caractères)"
        code: |
          $2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy
        lines:
          - n: 1
            note: "`$2a` : la version de BCrypt. `$10` : le coût (2¹⁰ tours). Les 22 caractères suivants : le **sel**. Le reste : l'empreinte."
      - type: question
        ref: sor-b-q1
        review: def-hachage
      - type: code
        id: code-bcrypt-soramfr
        language: java
        title: "Soramfr — AuthService.java (extraits)"
        code: |
          private final BCryptPasswordEncoder encoder = new BCryptPasswordEncoder();

          nouvelutilisateur.setPasswordHash(encoder.encode(req.password));

          if (!encoder.matches(req.password, nouvelutilisateur.getPasswordHash())) {
              throw new ValidationException("mot de passe incorrect");
          }
        lines:
          - n: 1
            note: "L'outil BCrypt de Spring Security. (Mieux : le déclarer comme `@Bean` pour le partager.)"
          - n: 3
            note: "Inscription : on stocke le résultat de `encode`, jamais `req.password`."
          - n: 5
            note: "Connexion : `matches` relit le sel dans le hash, rehache le mot de passe tapé et compare."
      - type: callout
        variant: warning
        title: "Une fuite dans Soramfr"
        md: |
          `UserService.toDto` fait `new UserDto(e.getId(), e.getName(), e.getEmail(), e.getUsername(),
          e.getPasswordHash())`. Le DTO a un champ `password` : **`GET /api/users` renvoie le hash de chaque
          compte**. `@JsonIgnore` protège l'entité, mais pas le DTO, qui recopie la valeur.
      - type: question
        ref: sor-b-q2
        review: code-bcrypt-soramfr
      - type: text
        md: "Exercice guidé : complète l'inscription et la connexion."
      - type: exercise
        ref: sor-ex-bcrypt-guide
      - type: text
        md: "**Trouver et corriger un bug** : supprime la fuite du hash dans `UserDto` et `toDto`."
      - type: exercise
        ref: sor-ex-userdto-hash
      - type: text
        md: "**En autonomie** : explique BCrypt avec tes mots."
      - type: exercise
        ref: sor-ex-bcrypt-expliquer
      - type: jury
        items:
          - q: "Comment stockez-vous les mots de passe ?"
            a: "Hachés avec BCrypt, qui ajoute un sel aléatoire et un coût de calcul. Même en volant la base, on ne peut pas retrouver les mots de passe."
          - q: "Quelle différence entre hacher et chiffrer ?"
            a: "Le chiffrement est réversible avec une clé ; le hachage ne l'est pas. Pour un mot de passe, on n'a jamais besoin de le relire : on le hache."
          - q: "Pourquoi pas SHA-256 ?"
            a: "Il est conçu pour être rapide : un attaquant teste des milliards de mots de passe par seconde. BCrypt est volontairement lent et salé."
      - type: quiz
        items:
          - ref: sor-b-q3
            review: def-sel
          - ref: sor-b-q4
            review: def-chiffrer
          - ref: sor-b-q5
            review: code-bcrypt-soramfr
    questions:
      - code: sor-b-q1
        kind: VRAI_FAUX
        difficulty: 1
        skill: auth-jwt
        prompt: "Avec le hash BCrypt stocké en base, l'administratrice peut retrouver le mot de passe d'une cliente."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : un hash ne se « déhache » pas."
          - label: "Faux"
            correct: true
            why: "Exact : personne ne peut retrouver le mot de passe, pas même l'administratrice."
        explanation: "Le hachage est à sens unique. En cas d'oubli, on propose de **réinitialiser** le mot de passe, jamais de le renvoyer."
      - code: sor-b-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Pourquoi utiliser `encoder.matches(motTapé, hash)` plutôt que `encoder.encode(motTapé).equals(hash)` ?"
        choices:
          - label: "Parce que `encode` tire un nouveau sel à chaque fois : le résultat change"
            correct: true
            why: "Oui : `matches` réutilise le sel contenu dans le hash stocké."
          - label: "Parce que `equals` n'existe pas pour les textes"
            correct: false
            why: "`equals` existe, mais il comparerait deux hash avec des sels différents."
          - label: "Il n'y a aucune différence"
            correct: false
            why: "La comparaison avec `equals` échouerait toujours."
        explanation: "Chaque `encode` produit un hash différent (sel aléatoire). `matches` sait extraire le sel et refaire le calcul."
      - code: sor-b-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "À quoi sert le **sel** de BCrypt ?"
        choices:
          - label: "À donner des hash différents pour deux mots de passe identiques"
            correct: true
            why: "Oui : les tables de hash précalculés deviennent inutiles."
          - label: "À pouvoir déchiffrer le mot de passe"
            correct: false
            why: "Un hash ne se déchiffre pas, avec ou sans sel."
          - label: "À raccourcir le hash"
            correct: false
            why: "Le hash BCrypt fait toujours 60 caractères."
        explanation: "Sel aléatoire + coût élevé : les deux protections de BCrypt."
      - code: sor-b-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Quel mot est juste pour un mot de passe stocké avec BCrypt ?"
        choices:
          - label: "Haché"
            correct: true
            why: "Oui : transformation à sens unique."
          - label: "Chiffré"
            correct: false
            why: "Chiffré sous-entend réversible avec une clé."
          - label: "Crypté"
            correct: false
            why: "Terme impropre en français ; et ce n'est pas un chiffrement."
        explanation: "Mot de passe → **haché**. Donnée qu'on doit relire (un numéro de carte…) → **chiffrée**."
      - code: sor-b-q5
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: rgpd-secrets
        prompt: "`UserEntity.passwordHash` porte `@JsonIgnore`. Pourquoi le hash sort-il quand même de `GET /api/users` ?"
        choices:
          - label: "Parce que `toDto` le recopie dans le champ `password` de `UserDto`"
            correct: true
            why: "Oui : `@JsonIgnore` ne protège que l'entité."
          - label: "Parce que `@JsonIgnore` ne marche pas avec PostgreSQL"
            correct: false
            why: "`@JsonIgnore` concerne le JSON, pas la base."
          - label: "Parce qu'Angular le demande"
            correct: false
            why: "Angular ne choisit pas ce que le serveur renvoie."
        explanation: "La protection doit être dans le **DTO** : pas de champ `password` du tout."
    exercises:
      - slug: sor-ex-bcrypt-guide
        kind: COMPLETER
        title: "Compléter l'utilisation de BCrypt"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Complète les deux méthodes de BCrypt."
        criteria: "Les deux trous sont corrects."
        hints:
          - "À l'inscription, on transforme le mot de passe : en anglais, « encoder »."
          - "À la connexion, on vérifie qu'il « correspond » : en anglais, « matches »."
          - "encode, matches."
        solution: '["encode", "matches"]'
        explanation: "`encode` fabrique le hash à stocker ; `matches` vérifie un mot de passe tapé contre le hash stocké."
        xp: 10
        payload:
          language: java
          template: |
            // Inscription
            user.setPasswordHash(encoder.[[1]](req.password));

            // Connexion
            if (!encoder.[[2]](req.password, user.getPasswordHash())) { ... }
          blanks:
            - ["encode"]
            - ["matches"]
      - slug: sor-ex-userdto-hash
        kind: CORRIGER_ERREUR
        title: "Supprimer la fuite du hash dans UserDto"
        difficulty: INTERMEDIAIRE
        skill: rgpd-secrets
        statement: |
          Ce code vient de Soramfr (simplifié). Corrige-le pour que **plus aucun mot de passe ni hash** ne
          sorte de l'API :
          1. transforme `UserDto` en `record UserDto(Long id, String name, String email, String username)` ;
          2. corrige `toDto` en conséquence.
        criteria: "UserDto n'a plus de champ password ; toDto ne lit plus le hash."
        hints:
          - "Le champ `password` doit disparaître du DTO."
          - "`public record UserDto(Long id, String name, String email, String username) { }`"
          - "`return new UserDto(e.getId(), e.getName(), e.getEmail(), e.getUsername());`"
        solution: |
          public record UserDto(Long id, String name, String email, String username) {
          }

          // Dans UserService
          private UserDto toDto(UserEntity e) {
              return new UserDto(e.getId(), e.getName(), e.getEmail(), e.getUsername());
          }
        explanation: |
          Le DTO de sortie ne contient que les informations publiques. Pour la **création** d'un compte, on
          utilise un autre DTO d'entrée (`RegisterRequest`), qui, lui, reçoit le mot de passe.
        xp: 25
        payload:
          language: java
          starter: |
            public class UserDto {
                private Long id;
                private String name;
                private String email;
                private String username;
                private String password;
                // constructeur, getters et setters…
            }

            // Dans UserService
            private UserDto toDto(UserEntity e) {
                return new UserDto(e.getId(), e.getName(), e.getEmail(), e.getUsername(), e.getPasswordHash());
            }
          checks:
            - pattern: 'getPasswordHash'
              absent: true
              message: "toDto ne doit plus lire le hash du mot de passe."
            - pattern: 'String\s+password'
              absent: true
              message: "UserDto ne doit plus avoir de champ password."
            - pattern: 'record\s+UserDto\s*\(\s*Long\s+id\s*,\s*String\s+name\s*,\s*String\s+email\s*,\s*String\s+username\s*\)'
              message: "Déclare public record UserDto(Long id, String name, String email, String username) { }"
            - pattern: 'new\s+UserDto\s*\(\s*e\.getId\(\)\s*,\s*e\.getName\(\)\s*,\s*e\.getEmail\(\)\s*,\s*e\.getUsername\(\)\s*\)'
              message: "toDto : return new UserDto(e.getId(), e.getName(), e.getEmail(), e.getUsername());"

  # ===================================================================== LEÇON 2
      - slug: sor-ex-bcrypt-expliquer
        kind: CODE_LIBRE
        title: "Expliquer BCrypt avec mes mots"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Explique, comme devant le jury, comment Soramfr protège les mots de passe. Écris trois lignes :
          - `Hacher :` ce que veut dire hacher (et la différence avec chiffrer) ;
          - `Sel :` à quoi sert le sel ;
          - `Connexion :` quelle méthode vérifie le mot de passe à la connexion.
        criteria: "Hacher = sans retour ; le sel rend les hash différents ; matches à la connexion."
        hints:
          - "Hacher : une empreinte sans retour possible, contrairement au chiffrement."
          - "Sel : un morceau aléatoire, pour que deux mots de passe identiques donnent deux hash différents."
          - "Connexion : encoder.matches(motDePasse, hash)."
        solution: |
          Hacher : transformer le mot de passe en empreinte, sans retour possible (on ne peut pas le retrouver, contrairement au chiffrement).
          Sel : un morceau aléatoire ajouté par BCrypt, pour que deux mots de passe identiques donnent deux hash différents.
          Connexion : encoder.matches(motDePasse, hash) compare le mot de passe tapé avec le hash enregistré.
        explanation: "Tu expliques l'idée, pas une ligne apprise par cœur."
        xp: 15
        payload:
          language: text
          starter: |
            Hacher :
            Sel :
            Connexion :
          checks:
            - pattern: '(?im)^\s*Hacher\s*:[^\n]*(?:sans retour|irr[ée]versible|retrouver|empreinte)'
              message: "Explique que le hachage est une empreinte sans retour possible."
            - pattern: '(?im)^\s*Sel\s*:[^\n]*(?:al[ée]atoire|diff[ée]rent)'
              message: "Explique que le sel est aléatoire et rend les hash différents."
            - pattern: '(?im)^\s*Connexion\s*:[^\n]*matches'
              message: "Cite la méthode matches."

  - slug: sor-jwt
    title: "Le jeton JWT : fabriquer, signer, vérifier"
    duration: 14
    objective: "Lire JwtService ligne par ligne et sortir le secret du code."
    prerequisites: "Leçon « Hacher les mots de passe avec BCrypt »."
    skills: [auth-jwt, rgpd-secrets]
    xp: 25
    memo: |
      - Un **JWT** = trois parties séparées par des points : `en-tête.contenu.signature`.
      - Le contenu (les **claims**) est lisible par tout le monde (encodé en Base64, **pas chiffré**).
      - La **signature** (HMAC-SHA256 avec un secret) prouve que personne n'a modifié le jeton.
      - Soramfr met dans le jeton : `sub` (id), `username`, `role`, `iat` (création), `exp` (expiration, 120 min).
      - Le **secret** ne doit jamais être écrit dans le code ni dans Git : variable d'environnement `JWT_SECRET`.
      - Le serveur ne garde pas de session : on parle d'authentification **sans état** (stateless).
    commonMistakes: |
      - Mettre des données sensibles dans le jeton (il est lisible).
      - Écrire le secret dans `application.properties` et le pousser sur GitHub (c'est le cas de Soramfr).
      - Utiliser un secret court : HS256 demande au moins 256 bits (32 caractères aléatoires).
      - `secret.getBytes()` sans préciser l'encodage : préférer `getBytes(StandardCharsets.UTF_8)`.
      - Croire que la déconnexion Angular « tue » le jeton : il reste valable jusqu'à son expiration.
    blocks:
      - type: text
        md: |
          Après la connexion, Soramfr renvoie un **jeton**. Angular le joint ensuite à chaque requête. Mais
          comment le serveur sait-il que ce jeton est authentique ?
      - type: definition
        id: def-jwt
        term: "JWT (JSON Web Token)"
        md: |
          Un **bracelet de festival**. À l'entrée (la connexion), on te le pose après avoir vérifié ton
          billet. Ensuite, les vigiles regardent seulement le bracelet : pas besoin de revérifier ton billet
          à chaque scène. Le bracelet porte ton nom, ta catégorie (USER ou ADMIN) et une date de fin.
      - type: definition
        id: def-signature
        term: "Signature"
        md: |
          Le **sceau** du festival sur le bracelet. Il est fabriqué avec un **secret** que seul le serveur
          connaît. Si quelqu'un modifie le bracelet (par exemple change USER en ADMIN), le sceau ne
          correspond plus : le jeton est refusé.
      - type: code
        id: code-jwt-structure
        language: text
        title: "Un jeton, découpé en trois"
        code: |
          eyJhbGciOiJIUzI1NiJ9
          .eyJzdWIiOiI3IiwidXNlcm5hbWUiOiJtYWkiLCJyb2xlIjoiVVNFUiIsImV4cCI6MTc2MDAwMDAwMH0
          .3vXq9…signature…
        lines:
          - n: 1
            note: "En-tête, décodé : `{\"alg\":\"HS256\"}` — l'algorithme de signature."
          - n: 2
            note: "Contenu, décodé : `{\"sub\":\"7\",\"username\":\"mai\",\"role\":\"USER\",\"exp\":…}`. **Lisible par tous.**"
          - n: 3
            note: "Signature : calculée avec le secret. Impossible à refaire sans lui."
      - type: question
        ref: sor-j-q1
        review: def-signature
      - type: code
        id: code-jwtservice
        language: java
        title: "Soramfr — JwtService.java (extrait)"
        code: |
          @Value("${app.jwt.secret}")
          private String secret;

          @Value("${app.jwt.exp-minutes:120}")
          private long expMinutes;

          public String generateToken(Long userId, String username, String role){
              Instant now = Instant.now();
              Instant exp = now.plusSeconds(expMinutes * 60);
              return Jwts.builder()
                  .setSubject(String.valueOf(userId))
                  .addClaims(Map.of("username", username, "role", role))
                  .setIssuedAt(Date.from(now))
                  .setExpiration(Date.from(exp))
                  .signWith(Keys.hmacShaKeyFor(secret.getBytes()), SignatureAlgorithm.HS256)
                  .compact();
          }
        lines:
          - n: 1
            note: "`@Value` lit le secret dans la configuration. Bonne idée… mais dans Soramfr, la valeur est écrite en clair dans `application.properties`."
          - n: 4
            note: "Durée de vie : 120 minutes par défaut."
          - n: 11
            note: "`sub` (subject) : l'id de l'utilisateur."
          - n: 12
            note: "Claims personnalisés : pseudo et rôle. Lisibles par tous, donc jamais de donnée secrète ici."
          - n: 14
            note: "`exp` : après cette date, le jeton est refusé."
          - n: 15
            note: "Signature HMAC-SHA256. `getBytes()` sans encodage dépend du système : préférer `getBytes(StandardCharsets.UTF_8)`. Ces méthodes (`setSubject`, `SignatureAlgorithm`) sont aussi dépréciées dans les versions récentes de JJWT."
          - n: 16
            note: "`compact()` assemble les trois parties en une chaîne."
      - type: callout
        variant: warning
        title: "Le secret est dans GitHub"
        md: |
          Le fichier `application.properties` de Soramfr contient la ligne `app.jwt.secret=…` avec la vraie
          valeur, et le dépôt est public. Toute personne qui lit le dépôt peut **fabriquer un jeton ADMIN
          valide**. Il faut : 1) changer le secret, 2) le lire depuis une variable d'environnement,
          3) ne jamais le recommiter.
      - type: question
        ref: sor-j-q2
        review: code-jwtservice
      - type: text
        md: "Exercice guidé : complète la fabrication du jeton."
      - type: exercise
        ref: sor-ex-jwt-guide
      - type: text
        md: "**Améliorer la sécurité** : nettoie le fichier de configuration de Soramfr."
      - type: exercise
        ref: sor-ex-properties
      - type: text
        md: "**En autonomie** : explique les trois parties d'un jeton."
      - type: exercise
        ref: sor-ex-jwt-expliquer
      - type: jury
        items:
          - q: "Comment fonctionne votre authentification ?"
            a: |
              « À la connexion, le serveur vérifie le mot de passe avec BCrypt et renvoie un JWT signé en
              HMAC-SHA256, valable 2 heures, qui contient l'id, le pseudo et le rôle. Angular l'envoie dans
              l'en-tête `Authorization: Bearer`. Un filtre Spring vérifie la signature et l'expiration à chaque
              requête. Le serveur ne garde aucune session. »
          - q: "Un utilisateur peut-il modifier son rôle dans le jeton ?"
            a: "Il peut lire et modifier le contenu, mais la signature ne correspondra plus : le serveur refusera le jeton."
          - q: "Où est stocké le secret de signature ?"
            a: "« Dans la version rendue, dans application.properties : c'est une erreur. Il doit venir d'une variable d'environnement, et le secret exposé doit être changé. »"
      - type: quiz
        items:
          - ref: sor-j-q3
            review: def-jwt
          - ref: sor-j-q4
            review: code-jwt-structure
          - ref: sor-j-q5
            review: code-jwtservice
          - ref: sor-j-q6
    questions:
      - code: sor-j-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Quelqu'un remplace `\"role\":\"USER\"` par `\"role\":\"ADMIN\"` dans son jeton. Que se passe-t-il ?"
        choices:
          - label: "Le serveur refuse le jeton : la signature ne correspond plus"
            correct: true
            why: "Oui : la signature dépend du contenu."
          - label: "Il devient administrateur"
            correct: false
            why: "Seulement si le serveur ne vérifiait pas la signature."
          - label: "Le jeton est automatiquement corrigé"
            correct: false
            why: "Le serveur ne corrige rien ; il accepte ou refuse."
        explanation: "La signature protège l'**intégrité** du jeton. Sans le secret, impossible de fabriquer une signature valide."
      - code: sor-j-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Pourquoi le secret JWT de Soramfr publié sur GitHub est-il grave ?"
        choices:
          - label: "N'importe qui peut fabriquer un jeton ADMIN accepté par le serveur"
            correct: true
            why: "Oui : avec le secret, on peut signer n'importe quel contenu."
          - label: "GitHub peut supprimer le dépôt"
            correct: false
            why: "Le problème est la sécurité de l'application, pas le dépôt."
          - label: "Ce n'est pas grave si le dépôt est ancien"
            correct: false
            why: "Un secret publié doit toujours être considéré comme compromis et changé."
        explanation: "Un secret publié = un secret perdu. On le **change** (rotation) et on le fournit par variable d'environnement."
      - code: sor-j-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: auth-jwt
        prompt: "Le contenu d'un JWT est chiffré : personne ne peut le lire sans le secret."
        choices:
          - label: "Vrai"
            correct: false
