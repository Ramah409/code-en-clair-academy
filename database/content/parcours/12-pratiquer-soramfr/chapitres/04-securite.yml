        explanation: "401 = identité inconnue ; 403 = identité connue, droit refusé."
      - code: sor-p-q3
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: auth-jwt
        prompt: "Pourquoi la règle `/api/users/**` doit-elle être écrite **avant** `/api/**` ?"
        choices:
          - label: "Parce que Spring applique la première règle qui correspond"
            correct: true
            why: "Oui : `/api/**` correspond aussi à `/api/users` et laisserait passer tout le monde."
          - label: "Parce que les règles sont triées par ordre alphabétique"
            correct: false
            why: "Spring ne trie pas les règles : il les lit dans l'ordre écrit."
          - label: "L'ordre n'a aucune importance"
            correct: false
