    exercises:
      - slug: sor-ex-regles-ordre
        kind: REMETTRE_ORDRE
        title: "Remettre les règles de sécurité dans l'ordre"
        difficulty: FACILE
        skill: auth-jwt
        statement: "Remets les règles dans l'ordre : du plus précis au plus général."
        criteria: "Les routes publiques d'abord, la règle ADMIN avant la règle générale."
        hints:
          - "Les requêtes OPTIONS et l'authentification sont publiques : elles viennent en premier."
          - "`/api/users/**` est plus précis que `/api/**`."
          - "`anyRequest()` est toujours la dernière règle."
        solution: |
          .requestMatchers(HttpMethod.OPTIONS, "/**").permitAll()
          .requestMatchers("/api/auth/**").permitAll()
          .requestMatchers("/api/users/**").hasRole("ADMIN")
          .requestMatchers("/api/**").authenticated()
          .anyRequest().authenticated()
        explanation: "La première règle qui correspond gagne. Si `/api/**` passait avant `/api/users/**`, une cliente connectée pourrait lister les comptes."
        xp: 10
        payload:
          language: java
          lines:
            - ".requestMatchers(HttpMethod.OPTIONS, \"/**\").permitAll()"
            - ".requestMatchers(\"/api/auth/**\").permitAll()"
            - ".requestMatchers(\"/api/users/**\").hasRole(\"ADMIN\")"
            - ".requestMatchers(\"/api/**\").authenticated()"
            - ".anyRequest().authenticated()"
          alternatives:
            - [1, 0, 2, 3, 4]
      - slug: sor-ex-proteger-admin
        kind: CORRIGER_ERREUR
        title: "TP — Réserver /api/users aux administratrices"
        difficulty: INTERMEDIAIRE
        skill: auth-jwt
        statement: |
          Voici les règles de Soramfr. Corrige-les :
          1. ajoute la règle qui réserve `/api/users/**` au rôle **ADMIN**, au bon endroit ;
          2. ajoute le point d'entrée qui répond **401** quand il n'y a pas de jeton :
             `.exceptionHandling(e -> e.authenticationEntryPoint(new HttpStatusEntryPoint(HttpStatus.UNAUTHORIZED)))`.
        criteria: "La règle ADMIN précède la règle générale ; les routes d'authentification restent publiques ; 401 sans jeton."
        hints:
          - "`.requestMatchers(\"/api/users/**\").hasRole(\"ADMIN\")`"
          - "Place-la **après** `/api/auth/**` et **avant** `/api/**`."
          - "Ajoute `.exceptionHandling(...)` sur `http`, par exemple juste après `.sessionManagement(...)`."
        solution: |
          http
              .cors(cors -> { })
              .csrf(csrf -> csrf.disable())
              .sessionManagement(sm -> sm.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
              .exceptionHandling(e -> e.authenticationEntryPoint(new HttpStatusEntryPoint(HttpStatus.UNAUTHORIZED)))
              .addFilterBefore(new JwtAuthFilter(jwt), UsernamePasswordAuthenticationFilter.class)
              .authorizeHttpRequests(auth -> auth
                  .requestMatchers(HttpMethod.OPTIONS, "/**").permitAll()
                  .requestMatchers("/api/auth/**").permitAll()
                  .requestMatchers("/api/users/**").hasRole("ADMIN")
                  .requestMatchers("/api/**").authenticated()
                  .anyRequest().authenticated()
              );
          return http.build();
        explanation: |
          - La règle ADMIN est placée avant la règle générale : sinon `/api/**` la masquerait.
          - `hasRole("ADMIN")` cherche l'autorité `ROLE_ADMIN`, justement celle que dépose `JwtAuthFilter`.
          - Le point d'entrée transforme « pas de jeton » en **401** au lieu du 403 par défaut.
        xp: 35
        payload:
          language: java
          starter: |
            http
                .cors(cors -> { })
                .csrf(csrf -> csrf.disable())
                .sessionManagement(sm -> sm.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
                .addFilterBefore(new JwtAuthFilter(jwt), UsernamePasswordAuthenticationFilter.class)
                .authorizeHttpRequests(auth -> auth
                    .requestMatchers(HttpMethod.OPTIONS, "/**").permitAll()
                    .requestMatchers("/api/auth/**").permitAll()
                    .requestMatchers("/api/**").authenticated()
                    .anyRequest().authenticated()
                );
            return http.build();
          checks:
            - pattern: 'requestMatchers\(\s*"/api/users/\*\*"\s*\)\s*\.(hasRole\(\s*"ADMIN"\s*\)|hasAuthority\(\s*"ROLE_ADMIN"\s*\))'
              message: "Ajoute la règle : .requestMatchers(\"/api/users/**\").hasRole(\"ADMIN\")"
            - pattern: 'hasRole\(\s*"ROLE_ADMIN"\s*\)'
              absent: true
              message: "hasRole ajoute déjà le préfixe ROLE_ : écris hasRole(\"ADMIN\")."
            - pattern: 'requestMatchers\(\s*"/api/users/\*\*"\s*\)[\s\S]*requestMatchers\(\s*"/api/\*\*"\s*\)\s*\.authenticated\(\)'
              message: "La règle ADMIN doit être placée AVANT .requestMatchers(\"/api/**\").authenticated()."
            - pattern: 'requestMatchers\(\s*"/api/auth/\*\*"\s*\)\s*\.permitAll\(\)'
              message: "Les routes /api/auth/** (inscription, connexion) doivent rester publiques."
            - pattern: 'authenticationEntryPoint\(\s*new\s+HttpStatusEntryPoint\(\s*HttpStatus\.UNAUTHORIZED\s*\)\s*\)'
              message: "Ajoute le point d'entrée 401 : .exceptionHandling(e -> e.authenticationEntryPoint(new HttpStatusEntryPoint(HttpStatus.UNAUTHORIZED)))"
            - pattern: 'anyRequest\(\)\s*\.permitAll\(\)'
              absent: true
              message: "Ne laisse pas passer toutes les requêtes : anyRequest() doit rester authenticated()."

  # ===================================================================== LEÇON 4
      - slug: sor-ex-regles-guide
        kind: COMPLETER
