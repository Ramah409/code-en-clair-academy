  - slug: sor-roles
    title: "Un rôle décidé par le serveur, stocké en base"
    duration: 12
    objective: "Remplacer le rôle calculé à partir du pseudo par un rôle stocké en base."
    prerequisites: "Leçon « TP — Protéger une route avec JWT »."
    skills: [auth-jwt, securite-owasp]
    xp: 25
    memo: |
      - Soramfr calcule le rôle à la connexion : ADMIN si le pseudo vaut `admin` ou si l'e-mail est une adresse précise écrite dans le code.
      - Risques : n'importe qui peut créer le pseudo `admin` ; une adresse personnelle est publiée dans le dépôt ; changer d'administratrice impose de modifier le code.
      - Solution : colonne `role` (`USER` par défaut) dans l'entité et en base ; le service lit `user.getRole()`.
      - Le rôle n'est **jamais** choisi dans un formulaire : la maquette de connexion du rapport a un sélecteur USER/ADMIN, à retirer.
    commonMistakes: |
      - Laisser l'inscription accepter un champ `role` envoyé par le navigateur (élévation de privilèges).
      - Garder un sélecteur de rôle sur la page de connexion (même « pour la démo »).
      - Écrire des adresses e-mail personnelles dans le code source public.
    blocks:
      - type: text
        md: |
          Qui décide qu'une personne est administratrice ? Dans Soramfr, c'est… son **pseudo**. Regardons
          le code, puis corrigeons-le.
      - type: code
        id: code-role-soramfr
        language: java
        title: "Soramfr — AuthService.login (extrait, adresse anonymisée)"
        code: |
          String role = (
              "admin".equalsIgnoreCase(nouvelutilisateur.getUsername())
              || "prenom.nom@exemple.fr".equalsIgnoreCase(nouvelutilisateur.getEmail())
          ) ? "ADMIN" : "USER";
        lines:
          - n: 2
            note: "Quiconque s'inscrit avec le pseudo `admin` (s'il est libre) devient administrateur."
          - n: 3
            note: "Une adresse précise est écrite **en dur** (dans Soramfr, une vraie adresse personnelle, publiée sur GitHub)."
          - n: 4
            note: "L'opérateur `? :` choisit entre deux valeurs : « condition ? si vrai : si faux »."
      - type: definition
        id: def-elevation
        term: "Élévation de privilèges"
        md: |
          Une attaque où une personne obtient **plus de droits** qu'elle ne devrait. C'est comme se
          fabriquer un badge « direction » avec un feutre. Ici, il suffit de choisir le bon pseudo.
      - type: question
        ref: sor-ro-q1
        review: code-role-soramfr
      - type: compare
        left:
          title: "Maquette de connexion du rapport"
          good: false
          md: |
            Un sélecteur « Utilisateur / Administrateur » sur la page de connexion. Même s'il ne sert qu'à
            l'affichage (`demoViewRole`), il laisse croire que l'on **choisit** son rôle.
        right:
          title: "Ce qu'il faut"
          good: true
          md: |
            Un simple formulaire identifiant + mot de passe. Le serveur lit le rôle **en base** et le met
            dans le jeton signé.
      - type: code
        id: code-role-corrige
        language: java
        title: "Version corrigée"
        code: |
          // UserEntity
          @Column(nullable = false, length = 10)
          private String role = "USER";

          // AuthService.login
          String role = user.getRole();
          String token = jwtService.generateToken(user.getId(), user.getUsername(), role);
        lines:
          - n: 2
            note: "Nouvelle colonne obligatoire, 10 caractères."
          - n: 3
            note: "Valeur par défaut : toute nouvelle inscription est `USER`."
          - n: 6
            note: "Le rôle vient de la base. Pour nommer une administratrice, on modifie sa ligne en base (ou via une route réservée ADMIN)."
      - type: question
        ref: sor-ro-q2
        review: code-role-corrige
      - type: text
        md: "Exercice guidé : complète la déclaration de la colonne `role`."
      - type: exercise
        ref: sor-ex-role-guide
      - type: text
        md: "**Améliorer la sécurité** : corrige le calcul du rôle."
      - type: exercise
        ref: sor-ex-role-serveur
      - type: text
        md: "**En autonomie** : explique le risque et la solution."
      - type: exercise
        ref: sor-ex-role-expliquer
      - type: jury
        items:
          - q: "Comment un compte devient-il administrateur ?"
            a: |
              « Dans la version rendue, par son pseudo ou une adresse e-mail codée en dur : c'est une faille.
              Dans la version corrigée, le rôle est une colonne en base, USER par défaut, que seule une
              administratrice peut modifier. »
          - q: "Pourquoi la maquette de connexion a-t-elle un sélecteur de rôle ?"
            a: "« C'était un mode démonstration pour tester les deux interfaces. Il ne doit pas exister en production : le rôle est décidé par le serveur. »"
      - type: quiz
        items:
          - ref: sor-ro-q3
            review: def-elevation
          - ref: sor-ro-q4
            review: code-role-corrige
          - ref: sor-ro-q5
    questions:
      - code: sor-ro-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quelle attaque permet le calcul du rôle à partir du pseudo ?"
        choices:
          - label: "Une élévation de privilèges : s'inscrire avec le pseudo `admin`"
            correct: true
            why: "Oui : si ce pseudo est libre, on devient administrateur."
          - label: "Une injection SQL"
            correct: false
            why: "Aucune requête SQL n'est construite à la main ici."
          - label: "Aucune"
            correct: false
            why: "Le rôle dépend d'une donnée choisie par l'utilisateur : c'est dangereux."
        explanation: "Un droit ne doit jamais dépendre d'une valeur que l'utilisateur choisit librement."
      - code: sor-ro-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Dans la version corrigée, quel rôle reçoit une personne qui vient de s'inscrire ?"
        choices:
          - label: "USER, la valeur par défaut de la colonne"
            correct: true
            why: "Oui : `private String role = \"USER\";`."
          - label: "Le rôle qu'elle a choisi dans le formulaire"
            correct: false
            why: "Le formulaire ne propose plus de rôle."
          - label: "ADMIN si elle est la première"
            correct: false
            why: "Aucune règle de ce genre."
        explanation: "Toute inscription publique donne `USER`. Les administratrices sont nommées par une administratrice."
      - code: sor-ro-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: securite-owasp
        prompt: "Accepter un champ `role` dans le JSON d'inscription est sans danger si Angular ne l'envoie jamais."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : n'importe qui peut appeler l'API avec Postman et ajouter `\"role\": \"ADMIN\"`."
          - label: "Faux"
            correct: true
            why: "Exact : le serveur ne doit jamais lire le rôle dans une requête d'inscription."
        explanation: "Tout ce qui vient du client peut être modifié. Le DTO d'inscription ne doit pas avoir de champ `role`."
      - code: sor-ro-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-ddl
        prompt: "Quelle contrainte SQL empêche d'enregistrer un rôle inconnu ?"
        choices:
          - label: "`CHECK (role IN ('USER', 'ADMIN'))`"
            correct: true
            why: "Oui : la base refuse toute autre valeur."
          - label: "`UNIQUE (role)`"
            correct: false
            why: "Il ne pourrait y avoir qu'un seul USER !"
          - label: "`DEFAULT 'USER'`"
            correct: false
            why: "`DEFAULT` choisit une valeur si rien n'est fourni, mais n'interdit rien."
        explanation: "`DEFAULT` + `NOT NULL` + `CHECK` : valeur par défaut, obligatoire, et limitée à la liste."
      - code: sor-ro-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Pourquoi ne faut-il pas écrire une adresse e-mail personnelle dans le code d'un dépôt public ?"
        choices:
          - label: "C'est une donnée personnelle exposée à tous (spam, hameçonnage) et un indice pour les attaquants"
            correct: true
            why: "Oui : elle désigne en plus le compte administrateur."
          - label: "Parce que Java n'accepte pas le caractère @"
            correct: false
            why: "Java accepte ce caractère dans un texte."
          - label: "Il n'y a aucun problème"
            correct: false
            why: "C'est à la fois une question de RGPD et de sécurité."
        explanation: "Données personnelles et secrets n'ont rien à faire dans le code source."
    exercises:
      - slug: sor-ex-role-guide
        kind: COMPLETER
        title: "Déclarer la colonne role"
        difficulty: FACILE
        skill: spring-jpa
        statement: "Complète la déclaration. Respecte les majuscules."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La colonne est obligatoire : `nullable = …`."
          - "Valeur par défaut : le rôle le plus faible."
          - "false, USER, getRole."
        solution: '["false", "USER", "getRole"]'
        explanation: "Colonne obligatoire, `USER` par défaut, et le service lit ce rôle pour fabriquer le jeton."
        xp: 10
        payload:
          language: java
          template: |
            @Column(nullable = [[1]], length = 10)
            private String role = "[[2]]";

            String role = user.[[3]]();
          blanks:
            - ["false"]
            - ["USER"]
            - ["getRole"]
      - slug: sor-ex-role-serveur
        kind: CORRIGER_ERREUR
        title: "Corriger le calcul du rôle"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Corrige ce code :
          1. dans l'entité, ajoute la colonne `role` obligatoire (10 caractères), `"USER"` par défaut,
             avec son getter `getRole()` ;
          2. dans `login`, le rôle doit venir de `user.getRole()` : supprime la comparaison avec le pseudo et
             l'adresse e-mail écrite en dur.
        criteria: "Le rôle est une donnée de l'entité ; aucun pseudo ni e-mail codé en dur."
        hints:
          - "`@Column(nullable = false, length = 10) private String role = \"USER\";`"
          - "`public String getRole() { return role; }`"
          - "Dans login : `String role = user.getRole();`"
        solution: |
          // UserEntity
          @Column(nullable = false, length = 10)
          private String role = "USER";

          public String getRole() {
              return role;
          }

          // AuthService.login
          String role = user.getRole();
          String token = jwtService.generateToken(user.getId(), user.getUsername(), role);
        explanation: "Le rôle devient une **donnée**, pas une règle codée en dur. Nommer une nouvelle administratrice ne demande plus de redéployer."
        xp: 30
        payload:
          language: java
          starter: |
            // UserEntity
            @Column(nullable = false, unique = true)
            private String username;

            // AuthService.login
            String role = (
                "admin".equalsIgnoreCase(user.getUsername())
                || "prenom.nom@exemple.fr".equalsIgnoreCase(user.getEmail())
            ) ? "ADMIN" : "USER";
            String token = jwtService.generateToken(user.getId(), user.getUsername(), role);
          checks:
            - pattern: '"admin"\s*\.equalsIgnoreCase'
              absent: true
              message: "Le rôle ne doit plus dépendre du pseudo « admin »."
            - pattern: '"[^"\s]+@[^"\s]+"'
              absent: true
              message: "Aucune adresse e-mail ne doit rester écrite dans le code."
            - pattern: '@Column\((?=[^)]*nullable\s*=\s*false)(?=[^)]*length\s*=\s*10)[^)]*\)\s*private\s+String\s+role\s*=\s*"USER"\s*;'
              message: "Ajoute la colonne : @Column(nullable = false, length = 10) private String role = \"USER\";"
            - pattern: 'public\s+String\s+getRole\s*\(\s*\)\s*\{\s*return\s+(this\.)?role\s*;\s*\}'
              message: "Ajoute le getter : public String getRole() { return role; }"
            - pattern: 'String\s+role\s*=\s*user\.getRole\(\)\s*;'
              message: "Dans login : String role = user.getRole();"

