  - slug: sor-owasp
    title: "CORS, CSRF, XSS et injection SQL dans Soramfr"
    duration: 15
    objective: "Expliquer les quatre notions avec l'exemple de Soramfr et corriger la configuration CORS."
    prerequisites: "Leçon « Un rôle décidé par le serveur »."
    skills: [securite-owasp]
    xp: 25
    memo: |
      - **CORS** : le navigateur n'autorise une page à appeler une API d'un **autre domaine** que si l'API le permet (`allowedOrigins`).
      - **CSRF** : un site piégé fait envoyer une requête par ton navigateur avec **tes cookies**. Soramfr envoie le jeton dans un en-tête (pas un cookie) : désactiver la protection CSRF est acceptable.
      - **XSS** : du JavaScript malveillant injecté dans une page. Angular échappe l'affichage par défaut ; mais un jeton dans `localStorage` peut être volé par un script injecté.
      - **Injection SQL** : du SQL glissé dans une donnée. Spring Data JPA utilise des requêtes paramétrées : protégé.
      - CORS de Soramfr : deux blocs, une faute de frappe `"/api//auth/**"`, deux orthographes du domaine Netlify.
    commonMistakes: |
      - Croire que CORS protège le serveur : il protège l'utilisatrice **dans son navigateur**. Postman l'ignore.
      - Mettre `allowedOrigins("*")` avec `allowCredentials(true)` : refusé par Spring, et dangereux.
      - Utiliser `innerHTML` ou `bypassSecurityTrustHtml` avec des données saisies par les utilisateurs.
      - Construire une requête SQL par concaténation : `"... WHERE email = '" + email + "'"`.
    blocks:
      - type: text
        md: |
          Quatre mots reviennent toujours au jury : **CORS, CSRF, XSS, injection SQL**. On les explique avec
          des images simples, puis on regarde où en est Soramfr.
      - type: definition
        id: def-cors
        term: "CORS (partage de ressources entre origines)"
        md: |
          Par défaut, une page chargée depuis `soramfr.netlify.app` n'a pas le droit de lire les réponses
          d'une API située ailleurs (`…onrender.com`). C'est le **navigateur** qui bloque. L'API peut dire
          « j'accepte cette origine » : c'est la **liste des invités** à l'entrée d'une soirée.
      - type: code
        id: code-cors-soramfr
        language: java
        title: "Soramfr — CorsConfig.java (extrait)"
        code: |
          registry.addMapping("/api/**")
                  .allowedOrigins("http://localhost:4200", "https://soramtfr-projet.netlify.app")
                  .allowedMethods("GET","POST","PUT", "DELETE", "OPTIONS")
                  .allowCredentials(true);

          registry.addMapping("/api//auth/**")
                  .allowedOrigins("http://localhost:4200", "https://soramfr-projet.netlify.app")
                  .allowedMethods("GET", "POST", "PUT", "DELETE", "OPTIONS")
                  .allowCredentials(true);
        lines:
          - n: 1
            note: "Règle pour toute l'API."
          - n: 2
            note: "Le domaine s'écrit `soramtfr`…"
          - n: 6
            note: "Deuxième bloc inutile (`/api/**` couvre déjà `/api/auth/**`), avec une **double barre** `//` : il ne correspond à aucune adresse réelle."
          - n: 7
            note: "…et ici `soramfr` : une seule des deux orthographes est la bonne. Le rapport mélange aussi AlertMe, Soramfr et Soramtfr."
      - type: question
        ref: sor-o-q1
        review: def-cors
      - type: definition
        id: def-csrf
        term: "CSRF (falsification de requête)"
        md: |
          Un site piégé contient un formulaire caché qui envoie « supprime mon compte » à Soramfr. Si Soramfr
          reconnaissait les gens grâce à un **cookie**, le navigateur l'enverrait automatiquement : l'attaque
          marcherait. Soramfr exige un en-tête `Authorization` que le site piégé ne connaît pas : c'est pour
          ça que `csrf.disable()` est acceptable ici.
      - type: definition
        id: def-xss
        term: "XSS (script injecté)"
        md: |
          Un pirate réussit à faire exécuter **son** JavaScript dans **ta** page (par exemple via un
          commentaire contenant `<script>`). Ce script peut lire `localStorage`… où Soramfr range le jeton.
          Angular protège l'affichage (`{{ }}` échappe le HTML), mais il faut éviter `innerHTML` avec des
          données saisies, et idéalement ranger le jeton dans un cookie `HttpOnly`, illisible par JavaScript.
      - type: definition
        id: def-injection
        term: "Injection SQL"
        md: |
          Glisser du SQL dans une donnée : un « pseudo » comme `' OR '1'='1`. Si la requête est construite en
          **collant** les textes, ce morceau devient du code. Avec des **paramètres** (`WHERE email = ?`), la
          valeur reste une valeur. Spring Data JPA paramètre toujours : Soramfr est protégé.
      - type: compare
        left:
          title: "Vulnérable"
          good: false
          language: java
          code: |
            String sql = "SELECT * FROM users WHERE email = '" + email + "'";
        right:
          title: "Protégé"
          good: true
          language: java
          code: |
            userRepository.findByEmailOrUsername(email, email);
            // ou : jdbc.query("SELECT * FROM users WHERE email = ?", mapper, email);
      - type: question
        ref: sor-o-q2
        review: def-injection
      - type: text
        md: "Exercice guidé : associe chaque attaque à sa protection."
      - type: exercise
        ref: sor-ex-owasp-guide
      - type: text
        md: "**Améliorer la sécurité** : réécris `CorsConfig` proprement."
      - type: exercise
        ref: sor-ex-cors
      - type: text
        md: "**En autonomie** : une protection pour chaque attaque, expliquée."
      - type: exercise
        ref: sor-ex-owasp-expliquer
      - type: jury
        items:
          - q: "Pourquoi avez-vous désactivé la protection CSRF ?"
            a: "Parce que l'API est sans état et que le jeton est envoyé dans l'en-tête Authorization, pas dans un cookie. Un site tiers ne peut pas l'ajouter à une requête forgée."
          - q: "Votre application est-elle protégée contre le XSS ?"
            a: |
              « Angular échappe les données affichées avec `{{ }}`. Le point faible est le jeton dans
              `localStorage` : en cas de XSS, il serait lisible. Amélioration : cookie HttpOnly, SameSite,
              et une politique de sécurité du contenu (CSP). »
          - q: "À quoi sert CORS ?"
            a: "À autoriser explicitement le frontend (une autre origine) à appeler l'API depuis le navigateur. Il faut lister précisément les origines de confiance."
      - type: quiz
        items:
          - ref: sor-o-q3
            review: def-csrf
          - ref: sor-o-q4
            review: def-xss
          - ref: sor-o-q5
            review: code-cors-soramfr
          - ref: sor-o-q6
            review: def-cors
    questions:
      - code: sor-o-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Qui bloque une requête refusée par CORS ?"
        choices:
          - label: "Le navigateur"
            correct: true
            why: "Oui : c'est une protection du navigateur. Postman ou curl ne l'appliquent pas."
          - label: "La base de données"
            correct: false
            why: "La base n'est pas concernée."
          - label: "Le pare-feu du serveur"
            correct: false
            why: "CORS est une règle appliquée par le navigateur à partir des en-têtes de l'API."
        explanation: "CORS protège l'utilisatrice contre des pages malveillantes ; ce n'est pas un mécanisme d'authentification."
      - code: sor-o-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Pourquoi `findByEmailOrUsername` est-il protégé contre l'injection SQL ?"
        choices:
          - label: "Parce que Spring Data passe les valeurs en paramètres, séparées du texte SQL"
            correct: true
            why: "Oui : la valeur ne peut jamais devenir du code."
          - label: "Parce que PostgreSQL refuse les apostrophes"
            correct: false
            why: "PostgreSQL accepte les apostrophes dans les données."
          - label: "Parce qu'Angular vérifie les e-mails"
            correct: false
            why: "Le serveur ne doit jamais compter sur le frontend."
        explanation: "Requête paramétrée = la structure SQL est fixée avant d'y placer les valeurs."
      - code: sor-o-q3
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: securite-owasp
        prompt: "Pourquoi `csrf.disable()` est-il acceptable dans Soramfr ?"
        choices:
          - label: "Parce que l'authentification repose sur un en-tête Authorization, pas sur un cookie envoyé automatiquement"
            correct: true
            why: "Oui : un site tiers ne peut pas ajouter cet en-tête."
