        explanation: "Du plus précis au plus général : routes publiques, routes admin, puis le reste."
      - code: sor-p-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Quel en-tête HTTP transporte le jeton dans Soramfr ?"
        choices:
          - label: "`Authorization: Bearer <jeton>`"
