      - slug: sor-ex-cors
        kind: CORRIGER_ERREUR
        title: "Réécrire CorsConfig proprement"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Corrige `CorsConfig` :
          1. une **seule** règle `/api/**` (supprime le bloc `"/api//auth/**"`) ;
          2. les origines viennent de la configuration :
             `@Value("${app.cors.allowed-origins}") private String[] origines;` puis `.allowedOrigins(origines)` ;
          3. garde les méthodes et `allowCredentials(true)`.
        criteria: "Une seule règle, origines lues depuis la configuration, aucun domaine écrit en dur."
        hints:
          - "Supprime entièrement le deuxième `registry.addMapping(...)`."
          - "Ajoute le champ `@Value(\"${app.cors.allowed-origins}\") private String[] origines;`."
          - "`.allowedOrigins(origines)` à la place de la liste écrite en dur."
        solution: |
          @Configuration
          public class CorsConfig implements WebMvcConfigurer {

              @Value("${app.cors.allowed-origins}")
              private String[] origines;

              @Override
              public void addCorsMappings(CorsRegistry registry) {
                  registry.addMapping("/api/**")
                          .allowedOrigins(origines)
                          .allowedMethods("GET", "POST", "PUT", "DELETE", "OPTIONS")
                          .allowedHeaders("Authorization", "Content-Type")
                          .allowCredentials(true);
              }
          }
        explanation: |
          Dans `application.properties` : `app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}`.
          En production, la variable `CORS_ORIGINS` contient l'adresse Netlify exacte. Plus de faute de
          frappe possible dans le code, et un seul endroit à modifier.
        xp: 30
        payload:
          language: java
          starter: |
            @Configuration
            public class CorsConfig implements WebMvcConfigurer {

                @Override
                public void addCorsMappings(CorsRegistry registry) {
                    registry.addMapping("/api/**")
                            .allowedOrigins("http://localhost:4200", "https://soramtfr-projet.netlify.app")
                            .allowedMethods("GET", "POST", "PUT", "DELETE", "OPTIONS")
                            .allowedHeaders("Authorization", "Content-Type")
                            .allowCredentials(true);

                    registry.addMapping("/api//auth/**")
                            .allowedOrigins("http://localhost:4200", "https://soramfr-projet.netlify.app")
                            .allowedMethods("GET", "POST", "PUT", "DELETE", "OPTIONS")
                            .allowCredentials(true);
                }
            }
          checks:
            - pattern: '/api//'
              absent: true
              message: "Supprime la règle \"/api//auth/**\" : elle contient une double barre et ne sert à rien."
            - pattern: 'addMapping[\s\S]*addMapping'
              absent: true
              message: "Une seule règle registry.addMapping(\"/api/**\") suffit."
            - pattern: 'addMapping\(\s*"/api/\*\*"\s*\)'
              message: "Garde la règle registry.addMapping(\"/api/**\")."
            - pattern: '@Value\(\s*"\$\{app\.cors\.allowed-origins\}"\s*\)\s*private\s+String\[\]\s+origines\s*;'
              message: "Lis les origines dans la configuration : @Value(\"${app.cors.allowed-origins}\") private String[] origines;"
            - pattern: 'allowedOrigins\(\s*origines\s*\)'
              message: "Utilise .allowedOrigins(origines)."
            - pattern: 'netlify\.app'
              absent: true
              message: "Aucun domaine ne doit rester écrit en dur dans le code."
            - pattern: 'allowCredentials\(\s*true\s*\)'
              message: "Garde .allowCredentials(true)."
      - slug: sor-ex-owasp-expliquer
        kind: CODE_LIBRE
        title: "Expliquer les protections de Soramfr"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Écris trois lignes, une par attaque, et dis ce qui protège Soramfr :
          `Injection SQL :`, `XSS :`, `CORS :`.
        criteria: "Injection : requêtes paramétrées / JPA ; XSS : Angular échappe ; CORS : origines autorisées."
        hints:
          - "Injection SQL : Spring Data JPA envoie les valeurs en paramètres."
          - "XSS : Angular échappe ce qu'il affiche avec {{ }}."
          - "CORS : seules les origines listées (localhost:4200, le site Netlify) peuvent appeler l'API."
        solution: |
          Injection SQL : Spring Data JPA utilise des requêtes paramétrées, les valeurs ne deviennent jamais du SQL.
          XSS : Angular échappe tout ce qu'il affiche avec {{ }}.
          CORS : seules les origines autorisées (le front local et le site Netlify) peuvent appeler l'API.
        explanation: "Une attaque, une protection, une phrase."
        xp: 15
        payload:
          language: text
          starter: |
            Injection SQL :
            XSS :
            CORS :
          checks:
            - pattern: '(?im)^\s*Injection SQL\s*:[^\n]*(?:param|JPA|\?)'
              message: "Injection SQL : parle des requêtes paramétrées (JPA)."
            - pattern: '(?im)^\s*XSS\s*:[^\n]*(?:[ée]chapp|Angular)'
              message: "XSS : Angular échappe l'affichage."
            - pattern: '(?im)^\s*CORS\s*:[^\n]*(?:origin|domaine|autoris)'
              message: "CORS : seules les origines autorisées peuvent appeler l'API."

bank:
  - code: sor-c4-b1
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: auth-jwt
    prompt: "Que signifie « authentification sans état (stateless) » dans Soramfr ?"
    choices:
      - label: "Le serveur ne garde aucune session : chaque requête apporte son jeton"
        correct: true
        why: "Oui : `SessionCreationPolicy.STATELESS`."
      - label: "Les utilisateurs n'ont pas de compte"
        correct: false
        why: "Les comptes sont en base."
      - label: "Le jeton n'expire jamais"
        correct: false
        why: "Il expire après 120 minutes."
    explanation: "Sans état : pas de session côté serveur, donc facile à répartir sur plusieurs serveurs ; mais révoquer un jeton est plus difficile."
  - code: sor-c4-b2
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: auth-jwt
    prompt: "`hasRole(\"ADMIN\")` cherche quelle autorité dans le contexte de sécurité ?"
    choices:
      - label: "`ROLE_ADMIN`"
        correct: true
        why: "Oui : Spring ajoute le préfixe `ROLE_`."
      - label: "`ADMIN`"
        correct: false
        why: "C'est `hasAuthority(\"ADMIN\")` qui chercherait exactement `ADMIN`."
      - label: "`admin`"
        correct: false
        why: "La casse compte, et le préfixe est ajouté."
    explanation: "C'est pour ça que `JwtAuthFilter` crée `new SimpleGrantedAuthority(\"ROLE_\" + role)`."
  - code: sor-c4-b3
    kind: VRAI_FAUX
    difficulty: 2
    skill: rgpd-secrets
    prompt: "Après avoir supprimé le secret JWT du dépôt, on peut garder la même valeur de secret."
    choices:
      - label: "Vrai"
        correct: false
        why: "Non : l'historique Git l'a conservé, et d'autres ont pu le copier."
      - label: "Faux"
        correct: true
        why: "Exact : un secret publié doit être remplacé."
    explanation: "Un secret exposé est compromis pour toujours : rotation obligatoire."
  - code: sor-c4-b4
    kind: CHOIX_UNIQUE
    difficulty: 3
    skill: securite-owasp
    prompt: "Quel réglage de cookie limite le CSRF en empêchant son envoi depuis un autre site ?"
    choices:
      - label: "`SameSite=Strict`"
        correct: true
        why: "Oui : le cookie n'est envoyé que pour les requêtes venant du même site."
      - label: "`Max-Age=0`"
        correct: false
        why: "Cela supprime le cookie."
      - label: "`Path=/`"
        correct: false
        why: "`Path` limite les adresses du site, pas l'origine de la requête."
    explanation: "Cookie de session sûr : `HttpOnly` (anti-XSS), `Secure` (HTTPS seulement), `SameSite` (anti-CSRF)."
  - code: sor-c4-b5
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: auth-jwt
    prompt: "Dans Soramfr, sans jeton, `GET /api/users` renvoie 403 au lieu de 401. Pourquoi ?"
    choices:
      - label: "Aucun point d'entrée d'authentification n'est configuré : Spring utilise 403 par défaut"
        correct: true
        why: "Oui : on ajoute `HttpStatusEntryPoint(HttpStatus.UNAUTHORIZED)`."
      - label: "Parce que la route n'existe pas"
        correct: false
        why: "Ce serait 404."
      - label: "Parce que la base est éteinte"
        correct: false
        why: "Ce serait 500."
    explanation: "Configurer `authenticationEntryPoint` pour distinguer « non connecté » (401) de « interdit » (403)."
