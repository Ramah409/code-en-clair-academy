    choices:
      - label: "`docker compose up -d`"
        correct: true
        why: "Oui : `-d` pour détaché."
      - label: "`docker build .`"
        correct: false
        why: "Construit une image, sans rien démarrer."
      - label: "`ng serve`"
        correct: false
        why: "Lance le serveur de développement Angular."
    explanation: "`docker compose up -d` ; `docker compose logs -f backend` pour suivre les logs ; `docker compose down` pour tout arrêter."
  - code: sor-c7-b2
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: docker-deploiement
    prompt: "À quoi sert un fichier `.dockerignore` ?"
    choices:
      - label: "À exclure des fichiers de la copie vers l'image (`.git`, `target`, `.env`…)"
        correct: true
        why: "Oui : image plus légère et pas de secret embarqué."
      - label: "À ignorer les erreurs de Docker"
        correct: false
        why: "Il ne concerne que les fichiers copiés."
      - label: "À masquer les conteneurs de `docker ps`"
        correct: false
