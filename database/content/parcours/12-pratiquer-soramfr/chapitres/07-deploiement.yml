  - code: sor-c7-b3
    kind: VRAI_FAUX
    difficulty: 2
    skill: docker-deploiement
    prompt: "Une image Docker construite une fois peut être lancée à l'identique sur l'ordinateur de n'importe quel membre de l'équipe."
    choices:
      - label: "Vrai"
        correct: true
        why: "Oui : c'est l'intérêt principal de Docker (« ça marche chez moi » disparaît)."
      - label: "Faux"
