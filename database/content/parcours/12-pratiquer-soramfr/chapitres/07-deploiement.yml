slug: soramfr-deploiement
position: 7
level: AVANCE
title: "Déployer Soramfr proprement"
summary: "Sortir les secrets du code avec les variables d'environnement, écrire un Dockerfile multi-étapes sûr, et assembler PostgreSQL, Spring et Angular avec Docker Compose."
quizQuestionCount: 10

lessons:
  # ===================================================================== LEÇON 1
  - slug: sor-variables-env
    title: "Variables d'environnement et secrets"
    duration: 12
    objective: "Savoir où mettre chaque réglage (code, fichier de configuration, variable d'environnement) et écrire un .env.example."
    prerequisites: "Leçon « Le jeton JWT »."
    skills: [docker-deploiement, rgpd-secrets]
    xp: 20
    memo: |
      - Une **variable d'environnement** est un réglage donné à l'application **au démarrage**, par la machine qui la lance.
      - Spring lit `${NOM}` ou `${NOM:valeur_par_defaut}` dans `application.properties`.
      - Les **secrets** (mot de passe de la base, clé JWT) : variable d'environnement **sans** valeur par défaut.
      - `.env` contient les vraies valeurs et **n'est jamais commité** (`.gitignore`) ; `.env.example` montre les noms, sans valeur réelle.
      - Sur Render, les variables se saisissent dans l'onglet **Environment** du service.
    commonMistakes: |
      - Commiter le fichier `.env`.
      - Donner une valeur par défaut « pratique » à un secret (`${DB_PASSWORD:postgres}`).
      - Mettre un secret dans `environment.ts` d'Angular : tout ce qui est dans Angular est public.
      - Oublier une variable en production : l'application démarre avec la valeur de développement.
    blocks:
      - type: text
        md: |
          Soramfr tourne sur ton ordinateur **et** en ligne (Render pour le backend, Netlify pour le
          frontend). Les adresses, les mots de passe et les secrets ne sont pas les mêmes. Comment garder un
          seul code ?
      - type: definition
        id: def-var-env
        term: "Variable d'environnement"
        md: |
          Un **post-it** collé sur la machine qui lance l'application : « le mot de passe de la base est… ».
          Le code ne contient pas la valeur, il sait seulement **lire le post-it**. Chaque machine (ton
          ordinateur, Render) a ses propres post-it.
      - type: code
        id: code-env-properties
        language: properties
        title: "Lire des variables d'environnement dans Spring"
        code: |
          spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_utilisateurs}
          spring.datasource.password=${DB_PASSWORD}
          app.jwt.secret=${JWT_SECRET}
          app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
        lines:
          - n: 1
            note: "`${DB_URL:...}` : la variable `DB_URL`, ou la valeur après `:` si elle n'existe pas. Acceptable pour une adresse locale."
          - n: 2
            note: "Pas de valeur par défaut pour un secret : si la variable manque, Spring refuse de démarrer."
          - n: 4
            note: "En production : `CORS_ORIGINS=https://…netlify.app`."
      - type: question
        ref: sor-v-q1
        review: def-var-env
      - type: compare
        left:
          title: ".env (jamais commité)"
          good: true
          language: bash
          code: |
            DB_PASSWORD=Xk3!f9-long-et-unique
            JWT_SECRET=8f2c…64-caracteres-aleatoires…
        right:
          title: ".env.example (commité)"
          good: true
          language: bash
          code: |
            DB_PASSWORD=
            JWT_SECRET=
      - type: callout
        variant: warning
        title: "Et Angular ?"
        md: |
          `environment.prod.ts` contient l'adresse de l'API (`https://soramtfr-backend-2.onrender.com`). C'est
          normal : cette adresse est publique. Mais **aucun secret** ne doit jamais aller dans Angular : tout
          le code est téléchargé par le navigateur et lisible par tous.
      - type: question
        ref: sor-v-q2
        review: code-env-properties
      - type: text
        md: "Exercice guidé : complète la configuration."
      - type: exercise
        ref: sor-ex-env-guide
      - type: text
        md: "En autonomie : écris le fichier `.env.example` de Soramfr."
      - type: exercise
        ref: sor-ex-env-example
      - type: text
        md: "**Trouver l'erreur** : un secret écrit dans la configuration."
      - type: exercise
        ref: sor-ex-secret-bug
      - type: jury
        items:
          - q: "Comment gérez-vous les secrets ?"
            a: "Par des variables d'environnement : un fichier `.env` en local (ignoré par Git) et les réglages du service sur Render en production. Le dépôt ne contient qu'un `.env.example` sans valeurs."
          - q: "Peut-on mettre la clé JWT dans environment.ts ?"
            a: "Non : tout le code Angular est envoyé au navigateur. N'importe qui pourrait la lire et fabriquer des jetons."
      - type: quiz
        items:
          - ref: sor-v-q3
            review: code-env-properties
          - ref: sor-v-q4
            review: def-var-env
          - ref: sor-v-q5
    questions:
      - code: sor-v-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Pourquoi utiliser des variables d'environnement ?"
        choices:
          - label: "Pour garder le même code avec des réglages différents selon la machine, sans écrire les secrets dans le code"
            correct: true
            why: "Oui."
          - label: "Pour rendre l'application plus rapide"
            correct: false
            why: "La vitesse n'est pas concernée."
          - label: "Parce que Java ne sait pas lire les fichiers"
            correct: false
            why: "Java lit très bien les fichiers."
        explanation: "Un code, plusieurs environnements (local, test, production) : les réglages viennent de l'extérieur."
      - code: sor-v-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Que fait Spring avec `app.jwt.secret=${JWT_SECRET}` si la variable `JWT_SECRET` n'existe pas ?"
        choices:
          - label: "Il refuse de démarrer, faute de valeur"
            correct: true
            why: "Oui : c'est volontaire, pour ne jamais démarrer sans secret."
          - label: "Il utilise un secret vide"
            correct: false
            why: "Sans valeur par défaut, la propriété ne peut pas être résolue."
          - label: "Il génère un secret aléatoire"
            correct: false
            why: "Spring ne le fait pas pour une propriété à nous."
        explanation: "Mieux vaut une panne visible au démarrage qu'une application qui tourne avec un secret faible."
      - code: sor-v-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: rgpd-secrets
        prompt: "Quel fichier peut être commité dans Git ?"
        choices:
          - label: "`.env.example`, qui contient les noms de variables sans valeurs réelles"
            correct: true
            why: "Oui : il documente ce qu'il faut configurer."
          - label: "`.env`, avec les vrais mots de passe"
            correct: false
            why: "Jamais : il doit figurer dans `.gitignore`."
          - label: "Les deux"
            correct: false
            why: "Le `.env` réel ne doit jamais être partagé."
        explanation: "`.env` ignoré, `.env.example` partagé."
      - code: sor-v-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Mettre un secret dans `environment.prod.ts` est sans risque car ce fichier n'est utilisé qu'en production."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : en production, il est justement envoyé à tous les navigateurs."
          - label: "Faux"
            correct: true
            why: "Exact : le code Angular est public."
        explanation: "Seules des valeurs publiques (adresse de l'API) vont dans Angular."
      - code: sor-v-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Où saisir `JWT_SECRET` pour le backend déployé sur Render ?"
        choices:
          - label: "Dans les variables d'environnement du service, sur le tableau de bord de Render"
            correct: true
            why: "Oui : Render les fournit à l'application au démarrage."
          - label: "Dans le README du dépôt"
            correct: false
            why: "Le README est public."
          - label: "Dans `environment.prod.ts`"
            correct: false
            why: "Ce fichier concerne Angular et il est public."
        explanation: "Chaque hébergeur a son écran de variables (Render, Railway, Heroku…) ; pour Docker, `environment:` ou `env_file:`."
    exercises:
      - slug: sor-ex-env-guide
        kind: COMPLETER
        title: "Compléter la configuration"
        difficulty: FACILE
        skill: docker-deploiement
        statement: "Complète avec les noms de variables d'environnement (en majuscules)."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot de passe de la base de données : DB_…"
          - "Le secret de signature des jetons : JWT_…"
          - "DB_PASSWORD, JWT_SECRET, CORS_ORIGINS."
        solution: '["DB_PASSWORD", "JWT_SECRET", "CORS_ORIGINS"]'
        explanation: "Chaque réglage sensible ou variable selon l'environnement vient d'une variable nommée clairement."
        xp: 10
        payload:
          language: properties
          template: |
            spring.datasource.password=${[[1]]}
            app.jwt.secret=${[[2]]}
            app.cors.allowed-origins=${[[3]]:http://localhost:4200}
          blanks:
            - ["DB_PASSWORD"]
            - ["JWT_SECRET"]
            - ["CORS_ORIGINS"]
      - slug: sor-ex-env-example
        kind: CODE_LIBRE
        title: "Écrire le .env.example de Soramfr"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Écris le fichier `.env.example`. Il liste, une par ligne, les variables `DB_URL`, `DB_USERNAME`,
          `DB_PASSWORD`, `JWT_SECRET` et `CORS_ORIGINS`.
          - `DB_URL` et `CORS_ORIGINS` peuvent avoir leur valeur locale d'exemple ;
          - `DB_USERNAME` vaut `soramfr` ;
          - `DB_PASSWORD` et `JWT_SECRET` restent **vides** (`NOM=`).
        criteria: "Cinq variables ; les deux secrets sont vides."
        hints:
          - "Une ligne par variable : `NOM=valeur`."
          - "`DB_URL=jdbc:postgresql://localhost:5432/soramfr` et `CORS_ORIGINS=http://localhost:4200`."
          - "`DB_PASSWORD=` et `JWT_SECRET=` sans rien après le signe égal."
        solution: |
          DB_URL=jdbc:postgresql://localhost:5432/soramfr
          DB_USERNAME=soramfr
          DB_PASSWORD=
          JWT_SECRET=
          CORS_ORIGINS=http://localhost:4200
        explanation: "Ce fichier sert de mode d'emploi : une nouvelle développeuse le copie en `.env` et remplit les secrets qu'on lui transmet par un canal sûr."
        xp: 15
        payload:
          language: bash
          starter: |
            # Copier ce fichier en .env puis compléter les secrets
          checks:
            - pattern: '^DB_URL=\S+'
              message: "Ajoute DB_URL avec une adresse locale d'exemple."
            - pattern: '^DB_USERNAME=soramfr\s*$'
              message: "Ajoute DB_USERNAME=soramfr."
            - pattern: '^DB_PASSWORD=\s*$'
              message: "DB_PASSWORD doit être présent et vide : DB_PASSWORD="
            - pattern: '^JWT_SECRET=\s*$'
              message: "JWT_SECRET doit être présent et vide : JWT_SECRET="
            - pattern: '^CORS_ORIGINS=\S+'
              message: "Ajoute CORS_ORIGINS avec l'adresse locale d'Angular."

  # ===================================================================== LEÇON 2
      - slug: sor-ex-secret-bug
        kind: CORRIGER_ERREUR
        title: "Un secret avec une valeur par défaut"
        difficulty: FACILE
        skill: rgpd-secrets
        statement: |
          Cette ligne donne une **valeur par défaut** au secret JWT : si la variable est oubliée, l'application
          démarre avec un secret connu de tous (il est dans Git). Supprime la valeur par défaut.
        criteria: "app.jwt.secret=${JWT_SECRET}, sans valeur après deux-points."
        hints:
          - "Après les deux-points vient la valeur par défaut."
          - "Un secret n'a pas de valeur par défaut."
          - "app.jwt.secret=${JWT_SECRET}"
        solution: |
          app.jwt.secret=${JWT_SECRET}
        explanation: "Sans valeur par défaut, l'application refuse de démarrer si le secret manque : c'est voulu."
        xp: 10
        payload:
          language: properties
          starter: |
            app.jwt.secret=${JWT_SECRET:monSecretSoramfr2025}
          checks:
            - pattern: 'JWT_SECRET:'
              absent: true
              message: "Le secret ne doit pas avoir de valeur par défaut."
            - pattern: '(?m)^app\.jwt\.secret=\$\{JWT_SECRET\}\s*$'
              message: "Écris app.jwt.secret=${JWT_SECRET}."

  - slug: sor-dockerfile
    title: "TP — Un Dockerfile propre en deux étapes"
    duration: 15
    objective: "Comprendre image et conteneur, repérer les défauts du Dockerfile de Soramfr et le réécrire en multi-étapes, sans administrateur."
    prerequisites: "Leçon « Variables d'environnement et secrets »."
    skills: [docker-deploiement]
    xp: 30
    memo: |
      - **Image** : le modèle figé (application + tout ce qu'il faut pour la lancer). **Conteneur** : une image en train de tourner.
      - **Multi-étapes** : étape 1 avec le JDK et Maven pour **construire** le `.jar` ; étape 2 avec un **JRE** seul pour l'**exécuter**. L'image finale est plus petite et contient moins d'outils exploitables.
      - `USER` : ne pas lancer l'application en `root` (administrateur).
      - Ne pas sauter les tests (`-DskipTests`) sans qu'ils tournent ailleurs (intégration continue).
      - Le nom du `.jar` doit correspondre au vrai fichier produit (Soramfr lance `mon-app.jar`, qui n'existe pas).
    commonMistakes: |
      - Une seule étape avec le JDK complet : image lourde, compilateur présent en production.
      - Lancer l'application en root.
      - `COPY . .` sans `.dockerignore` : on copie `target/`, `.git`, voire un `.env`.
      - Un nom de `.jar` en dur qui ne correspond pas à l'`artifactId` du `pom.xml`.
    blocks:
      - type: text
        md: |
          Pour Render, Soramfr est livré sous forme d'**image Docker**. Le Dockerfile actuel fonctionne à
          moitié et a plusieurs défauts. On les repère, puis on le réécrit.
      - type: definition
        id: def-image
        term: "Image et conteneur"
        md: |
          Une **image**, c'est un **plat surgelé** : tout est dedans, prêt, figé. Un **conteneur**, c'est ce
          plat **réchauffé et servi** : l'image qui tourne. On peut lancer plusieurs conteneurs à partir de la
          même image.
      - type: definition
        id: def-dockerfile
        term: "Dockerfile"
        md: |
          La **recette** de l'image : une suite d'instructions (`FROM` : partir de telle base, `COPY` : copier
          des fichiers, `RUN` : exécuter une commande, `CMD` : ce qu'on lance au démarrage).
      - type: code
        id: code-dockerfile-soramfr
        language: dockerfile
        title: "Soramfr — Dockerfile"
        code: |
          FROM eclipse-temurin:21-jdk
          WORKDIR /app
          COPY . .
          RUN chmod +x mvnw
          RUN ./mvnw clean package -DskipTests
          EXPOSE 8080
          CMD ["java", "-jar", "/app/target/mon-app.jar"]
        lines:
          - n: 1
            note: "Image de base avec le **JDK complet** : utile pour compiler, inutile (et plus risqué) pour exécuter."
          - n: 3
            note: "Copie **tout** le dossier (y compris `.git`, `target`…) : prévoir un `.dockerignore`."
          - n: 5
            note: "Construction **sans les tests** : une version cassée peut partir en production."
          - n: 7
            note: "`mon-app.jar` : Maven produit en réalité `<artifactId>-<version>.jar`. Le conteneur s'arrête avec « Unable to access jarfile »… sauf si `finalName` est configuré. Et aucune instruction `USER` : l'application tourne en **root**."
      - type: question
        ref: sor-d-q1
        review: code-dockerfile-soramfr
      - type: code
        id: code-dockerfile-simple
        language: dockerfile
        title: "Exemple simple : servir une page statique"
        code: |
          FROM nginx:1.27-alpine
          COPY index.html /usr/share/nginx/html/
          EXPOSE 80
        lines:
          - n: 1
            note: "On part d'une image qui contient déjà un serveur web (Nginx), version Alpine (très légère)."
          - n: 2
            note: "On y ajoute notre page."
          - n: 3
            note: "On documente le port écouté."
      - type: definition
        id: def-multi-etapes
        term: "Construction multi-étapes"
        md: |
          Une **cuisine** et une **salle**. On cuisine (compile) dans une grande cuisine pleine d'outils
          (JDK, Maven). Puis on apporte **seulement l'assiette** (le `.jar`) dans une salle dépouillée (un JRE).
          Le client n'entre jamais dans la cuisine.
      - type: question
        ref: sor-d-q2
        review: def-multi-etapes
      - type: text
        md: "Exercice guidé : remets le Dockerfile multi-étapes dans l'ordre."
      - type: exercise
        ref: sor-ex-dockerfile-ordre
      - type: text
        md: "TP en autonomie : réécris le Dockerfile de Soramfr."
      - type: exercise
        ref: sor-ex-dockerfile
      - type: text
        md: "**Exercice guidé** : complète les deux étapes."
      - type: exercise
        ref: sor-ex-dockerfile-guide
      - type: jury
        items:
          - q: "Quelle différence entre une image et un conteneur ?"
            a: "L'image est un modèle figé, construit à partir du Dockerfile. Le conteneur est une instance de cette image en cours d'exécution."
          - q: "Pourquoi un Dockerfile multi-étapes ?"
            a: "Pour construire avec le JDK et Maven, puis ne garder dans l'image finale qu'un JRE et le `.jar`. L'image est plus légère et contient moins d'outils utilisables par un attaquant."
          - q: "Pourquoi ne pas lancer l'application en root ?"
            a: "Principe du moindre privilège : si l'application est compromise, l'attaquant n'a que les droits d'un utilisateur limité dans le conteneur."
      - type: quiz
        items:
          - ref: sor-d-q3
            review: def-image
          - ref: sor-d-q4
            review: def-dockerfile
          - ref: sor-d-q5
            review: code-dockerfile-soramfr
    questions:
      - code: sor-d-q1
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Quels défauts a le Dockerfile de Soramfr ?"
        choices:
          - label: "Il garde le JDK complet dans l'image finale"
            correct: true
            why: "Une seule étape, basée sur le JDK."
          - label: "Il lance l'application en root"
            correct: true
            why: "Aucune instruction `USER`."
          - label: "Il saute les tests"
            correct: true
            why: "`-DskipTests`."
          - label: "Il utilise Java 21"
            correct: false
            why: "Java 21 est une version LTS récente : c'est un bon choix."
        explanation: "Image lourde, root, tests sautés, nom de `.jar` incertain : quatre points à corriger."
      - code: sor-d-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Dans un Dockerfile multi-étapes, que contient l'image finale ?"
        choices:
          - label: "Uniquement ce qui est copié dans la dernière étape (JRE + .jar)"
            correct: true
            why: "Oui : les étapes précédentes sont jetées."
          - label: "Tout ce qui a été installé dans toutes les étapes"
            correct: false
            why: "Seule la dernière étape compose l'image finale."
          - label: "Le code source Java"
            correct: false
            why: "Seulement s'il est copié dans la dernière étape, ce qu'on évite."
        explanation: "`COPY --from=build` ne récupère que le fichier voulu depuis l'étape de construction."
      - code: sor-d-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: docker-deploiement
        prompt: "Un conteneur, c'est…"
        choices:
          - label: "une image en train de tourner"
            correct: true
            why: "Oui."
          - label: "le fichier Dockerfile"
            correct: false
            why: "Le Dockerfile est la recette de l'image."
          - label: "une machine virtuelle complète avec son propre système"
            correct: false
            why: "Un conteneur partage le noyau du système hôte : il est plus léger."
        explanation: "Dockerfile → (build) → image → (run) → conteneur."
      - code: sor-d-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Quelle instruction définit la commande lancée au démarrage du conteneur ?"
        choices:
          - label: "`CMD` (ou `ENTRYPOINT`)"
            correct: true
            why: "Oui."
          - label: "`RUN`"
            correct: false
            why: "`RUN` s'exécute pendant la **construction** de l'image."
          - label: "`FROM`"
            correct: false
            why: "`FROM` choisit l'image de base."
        explanation: "`RUN` = pendant le build ; `CMD`/`ENTRYPOINT` = au démarrage du conteneur."
      - code: sor-d-q5
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: docker-deploiement
        prompt: "Pourquoi `CMD [\"java\", \"-jar\", \"/app/target/mon-app.jar\"]` peut-il échouer ?"
        choices:
          - label: "Parce que Maven nomme le fichier `<artifactId>-<version>.jar`, pas `mon-app.jar`"
            correct: true
            why: "Oui : sans `finalName`, le fichier n'existe pas sous ce nom."
          - label: "Parce que Java ne sait pas lancer un .jar"
            correct: false
            why: "`java -jar` est la façon standard."
          - label: "Parce que le port 8080 est interdit"
            correct: false
            why: "Le port n'a rien à voir avec le nom du fichier."
        explanation: "Solution simple : copier le `.jar` sous un nom fixe dans l'étape d'exécution (`COPY --from=build /app/target/*.jar app.jar`)."
    exercises:
      - slug: sor-ex-dockerfile-ordre
        kind: REMETTRE_ORDRE
        title: "Ordonner un Dockerfile multi-étapes"
        difficulty: FACILE
        skill: docker-deploiement
        statement: "Remets les lignes dans l'ordre."
        criteria: "Étape de construction complète, puis étape d'exécution."
        hints:
          - "Chaque étape commence par `FROM`."
          - "On copie le code et on construit dans la première étape."
          - "`USER` avant `CMD`, dans la deuxième étape."
        solution: |
          FROM eclipse-temurin:21-jdk AS build
          WORKDIR /app
          COPY . .
          RUN ./mvnw -B clean package
          FROM eclipse-temurin:21-jre
          COPY --from=build /app/target/*.jar /app/app.jar
          USER 1001
          CMD ["java", "-jar", "/app/app.jar"]
        explanation: "Deux `FROM`, deux étapes. La seconde récupère seulement le `.jar` avec `COPY --from=build`."
        xp: 10
        payload:
          language: dockerfile
          lines:
            - "FROM eclipse-temurin:21-jdk AS build"
            - "WORKDIR /app"
            - "COPY . ."
            - "RUN ./mvnw -B clean package"
            - "FROM eclipse-temurin:21-jre"
            - "COPY --from=build /app/target/*.jar /app/app.jar"
            - "USER 1001"
            - "CMD [\"java\", \"-jar\", \"/app/app.jar\"]"
      - slug: sor-ex-dockerfile
        kind: CORRIGER_ERREUR
        title: "TP — Réécrire le Dockerfile de Soramfr"
        difficulty: DIFFICILE
        skill: docker-deploiement
        statement: |
          Réécris ce Dockerfile :
          1. **étape `build`** : `FROM eclipse-temurin:21-jdk AS build`, copie le projet, construit **avec** les tests
             (`./mvnw -B clean package`, sans `-DskipTests`) ;
          2. **étape d'exécution** : `FROM eclipse-temurin:21-jre`, copie seulement le `.jar` avec
             `COPY --from=build /app/target/*.jar /app/app.jar` ;
          3. crée ou utilise un utilisateur non administrateur (`USER 1001` ou un utilisateur créé avec `useradd`) ;
          4. lance `/app/app.jar`.
        criteria: "Deux étapes, JRE à l'exécution, tests non sautés, utilisateur non root, bon nom de .jar."
        hints:
          - "Deux instructions `FROM` : la première avec `AS build`."
          - "`COPY --from=build /app/target/*.jar /app/app.jar`"
          - "`USER 1001` puis `CMD [\"java\", \"-jar\", \"/app/app.jar\"]`."
        solution: |
          FROM eclipse-temurin:21-jdk AS build
          WORKDIR /app
          COPY . .
          RUN chmod +x mvnw && ./mvnw -B clean package

          FROM eclipse-temurin:21-jre
          WORKDIR /app
          COPY --from=build /app/target/*.jar /app/app.jar
          USER 1001
          EXPOSE 8080
          CMD ["java", "-jar", "/app/app.jar"]
        explanation: |
          - L'image finale ne contient ni le JDK, ni Maven, ni le code source : seulement un JRE et `app.jar`.
          - Les tests tournent pendant la construction : une version qui les casse ne produit pas d'image.
          - `USER 1001` : l'application n'a pas les droits d'administrateur dans le conteneur.
          - Le `.jar` est copié sous un nom fixe : plus de « Unable to access jarfile ».
        xp: 40
        payload:
          language: dockerfile
          starter: |
            FROM eclipse-temurin:21-jdk
            WORKDIR /app
            COPY . .
            RUN chmod +x mvnw
            RUN ./mvnw clean package -DskipTests
            EXPOSE 8080
            CMD ["java", "-jar", "/app/target/mon-app.jar"]
          checks:
            - pattern: '(?i)^FROM\s+eclipse-temurin:21-jdk\s+AS\s+build\s*$'
              message: "Première étape : FROM eclipse-temurin:21-jdk AS build"
            - pattern: '(?i)^FROM\s+eclipse-temurin:21-jre\S*\s*$'
              message: "Deuxième étape avec un JRE seulement : FROM eclipse-temurin:21-jre"
            - pattern: 'skipTests'
              absent: true
              message: "Ne saute plus les tests : retire -DskipTests."
            - pattern: 'mvnw[^\n]*package'
              message: "Construis le projet : ./mvnw -B clean package"
            - pattern: '(?i)^COPY\s+--from=build\s+/app/target/\*\.jar\s+/app/app\.jar\s*$'
              message: "Copie seulement le .jar : COPY --from=build /app/target/*.jar /app/app.jar"
            - pattern: '(?i)^USER\s+(?!root\b)(?!0\b)\S+'
              message: "Ajoute un utilisateur non administrateur : USER 1001"
            - pattern: '(?i)^USER[\s\S]*^CMD'
              message: "L'instruction USER doit venir avant CMD."
            - pattern: 'CMD\s*\[\s*"java"\s*,\s*"-jar"\s*,\s*"/app/app\.jar"\s*\]'
              message: "Lance le bon fichier : CMD [\"java\", \"-jar\", \"/app/app.jar\"]"
            - pattern: 'mon-app\.jar'
              absent: true
              message: "mon-app.jar n'existe pas : utilise /app/app.jar."

  # ===================================================================== LEÇON 3
      - slug: sor-ex-dockerfile-guide
