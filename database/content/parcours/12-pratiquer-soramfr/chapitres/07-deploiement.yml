  - slug: sor-compose
    title: "Docker Compose et mise en ligne"
    duration: 14
    objective: "Assembler PostgreSQL et le backend avec Docker Compose, puis comprendre le déploiement Render + Netlify."
    prerequisites: "Leçon « TP — Un Dockerfile propre en deux étapes »."
    skills: [docker-deploiement]
    xp: 30
    memo: |
      - **Docker Compose** décrit plusieurs conteneurs qui travaillent ensemble dans un seul fichier `compose.yaml`.
      - Chaque **service** : une image (ou un `build`), des variables (`environment`), des ports, des volumes.
      - Entre conteneurs, on s'appelle par le **nom du service** : `jdbc:postgresql://db:5432/soramfr`.
      - Un **volume** garde les données de PostgreSQL quand le conteneur est recréé.
      - `depends_on` avec `condition: service_healthy` attend que la base soit prête.
      - En ligne : backend sur Render (Docker), frontend sur Netlify (`ng build`), base PostgreSQL hébergée ; CORS réglé sur l'adresse Netlify exacte.
    commonMistakes: |
      - Écrire `localhost` pour joindre la base depuis le conteneur du backend : `localhost` désigne le conteneur lui-même.
      - Oublier le volume : toutes les données disparaissent à chaque redémarrage.
      - Écrire les mots de passe directement dans `compose.yaml` commité.
      - Publier le port de PostgreSQL sur Internet sans nécessité.
    blocks:
      - type: text
        md: |
          Soramfr a besoin de **deux** programmes au minimum : PostgreSQL et le backend. Docker Compose les
          démarre ensemble, avec une seule commande : `docker compose up`.
      - type: definition
        id: def-compose
        term: "Docker Compose"
        md: |
          Le **chef d'orchestre** : un fichier décrit tous les musiciens (les conteneurs), leurs réglages et
          l'ordre d'entrée. `docker compose up` lance tout l'orchestre.
      - type: definition
        id: def-volume
        term: "Volume"
        md: |
          Un **disque dur externe** branché sur le conteneur. Le conteneur peut être jeté et recréé, les
          données (les tables PostgreSQL) restent sur le volume.
      - type: code
        id: code-compose
        language: yaml
        title: "compose.yaml pour Soramfr"
        code: |
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: soramfr
                POSTGRES_USER: soramfr
                POSTGRES_PASSWORD: ${DB_PASSWORD}
              volumes:
                - donnees:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U soramfr -d soramfr"]
                interval: 5s

            backend:
              build: .
              environment:
                DB_URL: jdbc:postgresql://db:5432/soramfr
                DB_USERNAME: soramfr
                DB_PASSWORD: ${DB_PASSWORD}
                JWT_SECRET: ${JWT_SECRET}
              ports:
                - "8080:8080"
              depends_on:
                db:
                  condition: service_healthy

          volumes:
            donnees:
        lines:
          - n: 2
            note: "Le service `db` : son nom sert d'adresse réseau pour les autres conteneurs."
          - n: 7
            note: "`${DB_PASSWORD}` est lu dans le fichier `.env` à côté : aucun mot de passe écrit ici."
          - n: 9
            note: "Les données PostgreSQL vont sur le volume `donnees`."
          - n: 11
            note: "Le test de santé : `pg_isready` répond quand la base accepte les connexions."
          - n: 15
            note: "`build: .` : l'image est construite avec le Dockerfile du dossier."
          - n: 17
            note: "`db:5432` : on joint la base par le **nom du service**, pas par `localhost`."
          - n: 22
            note: "Port 8080 du conteneur publié sur le port 8080 de la machine."
          - n: 25
            note: "Le backend attend que la base soit **en bonne santé**."
      - type: question
        ref: sor-cp-q1
        review: code-compose
      - type: steps
        id: etapes-mise-en-ligne
        title: "Mettre Soramfr en ligne"
        items:
          - "**Base** : créer une base PostgreSQL hébergée (Render, Neon…) et noter son adresse."
          - "**Backend (Render)** : service de type Docker relié au dépôt GitHub ; renseigner `DB_URL`, `DB_USERNAME`, `DB_PASSWORD`, `JWT_SECRET`, `CORS_ORIGINS`."
          - "**Frontend (Netlify)** : commande `ng build`, dossier publié `dist/<projet>/browser`, `environment.prod.ts` pointant vers l'adresse Render."
          - "**Routage Angular** : fichier `_redirects` avec `/* /index.html 200`, sinon rafraîchir `/produits` donne une erreur 404."
          - "**Vérifier** : inscription, connexion et route admin depuis l'adresse Netlify ; aucune erreur CORS dans la console."
      - type: question
        ref: sor-cp-q2
        review: etapes-mise-en-ligne
      - type: text
        md: "Exercice guidé : complète le service backend."
      - type: exercise
        ref: sor-ex-compose-guide
      - type: text
        md: "En autonomie : écris le service `db` du fichier Compose."
      - type: exercise
        ref: sor-ex-compose-db
      - type: text
        md: "**Trouver l'erreur** : le backend cherche la base au mauvais endroit."
      - type: exercise
        ref: sor-ex-compose-bug
      - type: jury
        items:
          - q: "Comment avez-vous déployé votre application ?"
            a: |
              « Le backend est une image Docker déployée sur Render, avec les secrets en variables
              d'environnement. Le frontend est construit avec `ng build` et publié sur Netlify. La base est un
              PostgreSQL hébergé. En local, Docker Compose lance la base et le backend ensemble. »
          - q: "Pourquoi le backend ne peut-il pas utiliser localhost pour joindre la base dans Docker Compose ?"
            a: "Parce que chaque conteneur a son propre réseau : localhost désigne le conteneur lui-même. On utilise le nom du service, `db`."
      - type: quiz
        items:
          - ref: sor-cp-q3
            review: def-volume
          - ref: sor-cp-q4
            review: def-compose
          - ref: sor-cp-q5
            review: etapes-mise-en-ligne
    questions:
      - code: sor-cp-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Dans Compose, quelle adresse le backend utilise-t-il pour joindre PostgreSQL ?"
        choices:
          - label: "`jdbc:postgresql://db:5432/soramfr`"
            correct: true
            why: "Oui : `db` est le nom du service."
          - label: "`jdbc:postgresql://localhost:5432/soramfr`"
            correct: false
            why: "`localhost` désigne le conteneur du backend lui-même."
          - label: "`http://db:8080`"
            correct: false
            why: "C'est le port du backend, et le protocole n'est pas JDBC."
        explanation: "Compose crée un réseau où chaque service est joignable par son nom."
      - code: sor-cp-q2
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: docker-deploiement
        prompt: "Sur Netlify, rafraîchir la page `/produits` donne une erreur 404. Pourquoi ?"
        choices:
          - label: "Le serveur cherche un fichier `/produits` qui n'existe pas ; il faut renvoyer toutes les adresses vers `index.html`"
            correct: true
            why: "Oui : c'est Angular qui gère les routes, dans le navigateur."
          - label: "Le backend est éteint"
            correct: false
            why: "La page elle-même n'est pas trouvée, avant tout appel à l'API."
          - label: "La route `/produits` n'existe pas dans Angular"
            correct: false
            why: "Elle existe : la navigation interne fonctionne."
        explanation: "Règle de réécriture `/* /index.html 200` (fichier `_redirects` sur Netlify)."
      - code: sor-cp-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: docker-deploiement
        prompt: "Sans volume, les comptes enregistrés dans PostgreSQL disparaissent quand on recrée le conteneur."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui : les données sont dans le conteneur, qui est jeté."
          - label: "Faux"
            correct: false
            why: "Sans volume, rien ne survit à la suppression du conteneur."
        explanation: "Un volume sépare les données de la vie du conteneur."
      - code: sor-cp-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "À quoi sert `depends_on` avec `condition: service_healthy` ?"
        choices:
          - label: "À démarrer le backend seulement quand la base répond au test de santé"
            correct: true
            why: "Oui : on évite des erreurs de connexion au démarrage."
          - label: "À redémarrer la base chaque minute"
            correct: false
            why: "Ce n'est pas son rôle."
          - label: "À copier la base dans le backend"
            correct: false
            why: "Chaque service reste séparé."
        explanation: "L'ordre de démarrage ne suffit pas : la base doit être **prête**."
      - code: sor-cp-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Après le déploiement, la console du navigateur affiche une erreur CORS. Que vérifier en premier ?"
        choices:
          - label: "Que `CORS_ORIGINS` contient l'adresse Netlify exacte (orthographe, https)"
            correct: true
            why: "Oui : c'est la cause la plus fréquente, et Soramfr mélange deux orthographes."
          - label: "Que PostgreSQL est bien démarré"
            correct: false
            why: "Une erreur CORS vient des en-têtes de l'API, pas de la base."
          - label: "Que le mot de passe de l'utilisatrice est correct"
            correct: false
            why: "CORS intervient avant toute logique de connexion."
        explanation: "L'origine autorisée doit correspondre exactement : protocole, nom de domaine, port."
