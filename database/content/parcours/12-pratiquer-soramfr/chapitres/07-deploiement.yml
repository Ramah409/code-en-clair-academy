      - slug: sor-ex-compose-db
        kind: CODE_LIBRE
        title: "Écrire le service db"
        difficulty: INTERMEDIAIRE
        skill: docker-deploiement
        statement: |
          Écris le début d'un `compose.yaml` avec un service `db` :
          - image `postgres:16-alpine` ;
          - variables `POSTGRES_DB: soramfr`, `POSTGRES_USER: soramfr`, `POSTGRES_PASSWORD: ${DB_PASSWORD}` ;
          - un volume nommé `donnees` monté sur `/var/lib/postgresql/data` (et déclaré en bas du fichier) ;
          - un `healthcheck` qui utilise `pg_isready`.
        criteria: "Service db complet, mot de passe lu dans l'environnement, volume déclaré, test de santé."
        hints:
          - "Commence par `services:` puis `  db:` (indentation de deux espaces)."
          - "`volumes:` dans le service : `- donnees:/var/lib/postgresql/data` ; et en bas : `volumes:` / `  donnees:`."
          - "`healthcheck:` / `  test: [\"CMD-SHELL\", \"pg_isready -U soramfr -d soramfr\"]`"
        solution: |
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: soramfr
                POSTGRES_USER: soramfr
                POSTGRES_PASSWORD: ${DB_PASSWORD}
              volumes:
                - donnees:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U soramfr -d soramfr"]
                interval: 5s

          volumes:
            donnees:
        explanation: "La base démarre avec son mot de passe lu dans `.env`, garde ses données sur le volume `donnees` et signale quand elle est prête."
        xp: 30
        payload:
          language: yaml
          starter: |
            services:
          checks:
            - pattern: '^services:\s*$'
              message: "Le fichier commence par services:"
            - pattern: '^\s+db:\s*$'
              message: "Déclare le service db:"
            - pattern: '^\s+image:\s*"?postgres:16-alpine"?\s*$'
              message: "Utilise l'image postgres:16-alpine."
            - pattern: '^\s+POSTGRES_DB:\s*"?soramfr"?\s*$'
              message: "Ajoute POSTGRES_DB: soramfr."
            - pattern: '^\s+POSTGRES_USER:\s*"?soramfr"?\s*$'
              message: "Ajoute POSTGRES_USER: soramfr."
            - pattern: '^\s+POSTGRES_PASSWORD:\s*"?\$\{DB_PASSWORD\}"?\s*$'
              message: "Le mot de passe vient de l'environnement : POSTGRES_PASSWORD: ${DB_PASSWORD}"
            - pattern: '^\s+-\s*"?donnees:/var/lib/postgresql/data"?\s*$'
              message: "Monte le volume : - donnees:/var/lib/postgresql/data"
            - pattern: '^volumes:\s*\n\s+donnees:'
              message: "Déclare le volume en bas du fichier : volumes: puis donnees:"
            - pattern: 'healthcheck:[\s\S]*pg_isready'
              message: "Ajoute un healthcheck qui utilise pg_isready."
      - slug: sor-ex-compose-bug
        kind: CORRIGER_ERREUR
        title: "Le backend cherche la base sur localhost"
        difficulty: FACILE
        skill: docker-deploiement
        statement: |
          Dans un conteneur, `localhost` désigne **le conteneur lui-même**, pas la base. Corrige `DB_URL` pour
          appeler la base par le **nom de son service** : `db`.
        criteria: "DB_URL pointe vers db:5432."
        hints:
          - "Entre conteneurs, on s'appelle par le nom du service."
          - "Le service de la base s'appelle db."
          - "jdbc:postgresql://db:5432/soramfr"
        solution: |
          backend:
            build: .
            environment:
              DB_URL: jdbc:postgresql://db:5432/soramfr
        explanation: "Compose crée un réseau où chaque service est joignable par son nom."
        xp: 10
        payload:
          language: yaml
          starter: |
            backend:
              build: .
              environment:
                DB_URL: jdbc:postgresql://localhost:5432/soramfr
          checks:
            - pattern: 'localhost'
              absent: true
              message: "localhost désigne le conteneur du backend lui-même."
            - pattern: 'DB_URL:\s*jdbc:postgresql://db:5432/soramfr'
              message: "Utilise jdbc:postgresql://db:5432/soramfr."

bank:
