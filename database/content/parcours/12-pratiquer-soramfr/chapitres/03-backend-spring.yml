slug: soramfr-backend-spring
position: 3
level: INTERMEDIAIRE
title: "Le backend Spring Boot de Soramfr"
summary: "Comprendre les couches du backend, créer une entité et son repository, reconstruire l'inscription, écrire un endpoint REST et gérer les erreurs proprement."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: sor-couches
    title: "Les couches du backend : chacun son métier"
    duration: 11
    objective: "Savoir à quoi servent les paquets controller, service, repository, entity et dto de Soramfr."
    prerequisites: "Chapitre « Découvrir Soramfr »."
    skills: [spring-structure, uml-architecture]
    xp: 15
    memo: |
      - **controller** : reçoit les requêtes HTTP et renvoie les réponses (`@RestController`).
      - **service** : contient les règles métier (`@Service`).
      - **repository** : parle à la base (`extends JpaRepository`).
      - **entity** : les classes qui correspondent aux tables (`@Entity`).
      - **dto** : les objets qui voyagent dans l'API (entrée et sortie), sans les champs sensibles.
      - **config**, **security**, **error** : réglages, sécurité, gestion des erreurs.
      - Sens des appels : controller → service → repository → base. Jamais l'inverse.
    commonMistakes: |
      - Mettre des règles métier dans le contrôleur (« si l'e-mail existe… »).
      - Renvoyer directement une entité dans l'API : on risque d'exposer des champs sensibles.
      - Appeler le repository depuis le contrôleur en sautant le service.
      - Dire que Soramfr suit « le modèle MVC » : c'est une **API REST en couches** ; la vue est dans Angular.
    blocks:
      - type: text
        md: |
          Ouvre le dossier `src/main/java` de Soramfr : tu y vois des **paquets** (des dossiers de classes) :
          `controller`, `service`, `repository`, `entity`, `dto`, `config`, `security`, `error`. Ce rangement
          n'est pas décoratif : chaque couche a **un seul métier**.
      - type: definition
        id: def-couche
        term: "Architecture en couches"
        md: |
          Comme dans un restaurant bien organisé : la **serveuse** prend la commande (contrôleur), le **chef**
          décide comment préparer (service), le **commis** va chercher les ingrédients au garde-manger
          (repository). Personne ne fait le travail des autres. Si on change de garde-manger, seul le commis
          doit s'adapter.
      - type: steps
        id: etapes-couches
        title: "Les paquets de Soramfr"
        items:
          - "**controller** — `AuthController`, `UserController` : reçoivent `POST /api/auth/register`, `GET /api/users`…"
          - "**service** — `AuthService`, `UserService` : vérifient, décident, appellent le repository."
          - "**repository** — `UserRepository` : lit et écrit dans la table `users`."
          - "**entity** — `UserEntity` : la table `users` vue depuis Java."
          - "**dto** — `RegisterRequest`, `LoginRequest`, `AuthResponse`, `UserDto` : les données qui voyagent."
          - "**config / security / error** — `SecurityConfig`, `CorsConfig`, `JwtService`, `JwtAuthFilter`, `ErrorHondler`."
      - type: question
        ref: sor-c-q1
        review: def-couche
      - type: definition
        id: def-dto
        term: "DTO (Data Transfer Object)"
        md: |
          Un objet qui sert **uniquement à transporter** des données entre Angular et Spring. C'est
          l'**enveloppe** qu'on envoie par la poste : on n'y met que ce que le destinataire doit lire.
          L'entité, elle, reste à la maison avec tous ses champs (y compris le hash du mot de passe).
      - type: code
        id: code-dto-soramfr
        language: java
        title: "Soramfr — RegisterRequest.java"
        code: |
          public class RegisterRequest {
              public String name;
              public String email;
              public String username;
              public String password;
          }
        lines:
          - n: 1
            note: "Un DTO d'**entrée** : il reçoit le JSON de l'inscription."
          - n: 2
            note: "Champs `public` : Jackson (la bibliothèque qui lit le JSON) peut les remplir directement. C'est simple, mais on préfère souvent un `record`."
      - type: code
        id: code-record
        language: java
        title: "La même chose, plus moderne : un record Java"
        code: |
          public record RegisterRequest(String name, String email, String username, String password) {
          }
        lines:
          - n: 1
            note: "Un **record** déclare en une ligne une classe dont les champs ne changent plus. Java crée tout seul le constructeur et les méthodes pour lire les champs."
      - type: callout
        variant: exam
        title: "MVC ou pas MVC ?"
        md: |
          Le rapport dit que Soramfr suit le modèle **MVC**. Attention : le « V » (la vue) n'est pas dans
          Spring, il est dans Angular. Côté backend, dis plutôt : « une **API REST en couches** :
          contrôleur, service, repository ».
      - type: text
        md: "Exercice guidé : place la bonne annotation sur chaque classe."
      - type: exercise
        ref: sor-ex-annotations-couches
      - type: text
        md: "En autonomie : écris un DTO de sortie pour les produits, sous forme de record."
      - type: exercise
        ref: sor-ex-produit-dto
      - type: jury
        items:
          - q: "Pourquoi séparer contrôleur, service et repository ?"
            a: |
              Chaque couche a une seule responsabilité. Le code est plus lisible, plus facile à tester (on peut
              tester le service sans HTTP) et à faire évoluer (changer de base ne touche que le repository).
          - q: "Pourquoi utiliser des DTO au lieu de renvoyer l'entité ?"
            a: "Pour contrôler exactement ce qui sort de l'API. L'entité contient le hash du mot de passe ; le DTO ne contient que les champs publics."
      - type: quiz
        items:
          - ref: sor-c-q2
            review: etapes-couches
          - ref: sor-c-q3
            review: def-dto
          - ref: sor-c-q4
            review: code-record
          - ref: sor-c-q5
    questions:
      - code: sor-c-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-structure
        prompt: "Dans quelle couche place-t-on la règle « un e-mail ne peut pas être utilisé deux fois » ?"
        choices:
          - label: "Le service"
            correct: true
            why: "Oui : c'est une règle métier."
          - label: "Le contrôleur"
            correct: false
            why: "Le contrôleur reçoit et répond ; il délègue les décisions au service."
          - label: "Le DTO"
            correct: false
            why: "Un DTO transporte des données, il ne décide rien."
        explanation: "Règles métier → service. (La contrainte UNIQUE en base reste une sécurité supplémentaire.)"
      - code: sor-c-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-structure
        prompt: "Quelle classe de Soramfr appartient à la couche **repository** ?"
        choices:
          - label: "`UserRepository`"
            correct: true
            why: "Oui : elle hérite de `JpaRepository` et parle à la base."
          - label: "`AuthController`"
            correct: false
            why: "C'est un contrôleur."
          - label: "`RegisterRequest`"
            correct: false
            why: "C'est un DTO."
        explanation: "Le repository est la seule couche qui accède à la base."
      - code: sor-c-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Pourquoi un DTO de sortie ne doit-il jamais contenir le mot de passe, même haché ?"
        choices:
          - label: "Parce que tout ce qui sort de l'API peut être lu par n'importe qui qui l'appelle"
            correct: true
            why: "Oui : un hash exposé peut être attaqué hors ligne."
          - label: "Parce que Java ne sait pas sérialiser les mots de passe"
            correct: false
            why: "Java sait très bien le faire : c'est justement le danger."
          - label: "Parce que le JSON ne supporte pas les caractères spéciaux"
            correct: false
            why: "Le JSON accepte ces caractères."
        explanation: "Le DTO de sortie ne contient que le strict nécessaire. Le hash reste en base."
      - code: sor-c-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: java-bases
        prompt: "Un `record` Java crée automatiquement le constructeur et les méthodes pour lire ses champs."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui : c'est tout l'intérêt du record."
          - label: "Faux"
            correct: false
            why: "Si : `new RegisterRequest(...)` et `req.email()` existent sans rien écrire de plus."
        explanation: "Record : données immuables, constructeur, accesseurs, `equals`, `hashCode` et `toString` générés."
      - code: sor-c-q5
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: uml-architecture
        prompt: "Comment décrire le plus justement l'architecture du backend de Soramfr ?"
        choices:
          - label: "Une API REST en couches (contrôleur, service, repository)"
            correct: true
            why: "Oui : le backend ne produit pas de vue HTML, il renvoie du JSON."
          - label: "Un MVC complet avec des vues JSP"
            correct: false
            why: "Il n'y a aucune vue côté Spring : l'interface est dans Angular."
          - label: "Un microservice par table"
            correct: false
            why: "Tout est dans une seule application Spring Boot."
        explanation: "La vue est dans Angular. Côté serveur : une API REST organisée en couches."
    exercises:
      - slug: sor-ex-annotations-couches
        kind: COMPLETER
        title: "La bonne annotation pour chaque couche"
        difficulty: FACILE
        skill: spring-structure
        statement: "Complète avec l'annotation (ou le type) qui convient. Respecte les majuscules."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Un contrôleur qui renvoie du JSON : @Rest…"
          - "La logique métier : une annotation de sept lettres."
          - "@RestController, @Service, JpaRepository."
        solution: '["@RestController", "@Service", "JpaRepository"]'
        explanation: "`@RestController` pour recevoir les requêtes et renvoyer du JSON, `@Service` pour la logique métier, `JpaRepository<UserEntity, Long>` pour obtenir gratuitement les méthodes d'accès à la base."
        xp: 10
        payload:
          language: java
          template: |
            [[1]]
            public class AuthController { ... }

            [[2]]
            public class AuthService { ... }

            public interface UserRepository extends [[3]]<UserEntity, Long> { ... }
          blanks:
            - ["@RestController"]
            - ["@Service"]
            - ["JpaRepository"]
      - slug: sor-ex-produit-dto
        kind: CODE_LIBRE
        title: "Écrire le DTO ProduitDto"
        difficulty: FACILE
        skill: spring-rest
        statement: |
          Écris un **record** `ProduitDto` avec trois champs : `id` (`Long`), `nom` (`String`) et
          `prix` (`BigDecimal`, le type Java adapté à l'argent).
        criteria: "Un record ProduitDto avec les trois champs typés."
        hints:
          - "Un record se déclare avec `public record Nom(...) { }`."
          - "Les champs se mettent entre parenthèses, séparés par des virgules : `Type nom`."
          - "`public record ProduitDto(Long id, String nom, BigDecimal prix) { }`"
        solution: |
          import java.math.BigDecimal;

          public record ProduitDto(Long id, String nom, BigDecimal prix) {
          }
        explanation: |
          `BigDecimal` évite les erreurs d'arrondi des nombres à virgule (`double`) : 0.1 + 0.2 ne donne pas
          exactement 0.3 avec un `double`. Pour de l'argent, c'est inacceptable.
        xp: 15
        payload:
          language: java
          starter: |
            import java.math.BigDecimal;

            // Écris ici le record ProduitDto
          checks:
            - pattern: 'record\s+ProduitDto\s*\('
              message: "Déclare un record nommé ProduitDto : public record ProduitDto(...) { }"
            - pattern: 'Long\s+id\b'
              message: "Le premier champ est Long id."
            - pattern: 'String\s+nom\b'
              message: "Il faut un champ String nom."
            - pattern: 'BigDecimal\s+prix\b'
              message: "Le prix est un BigDecimal (pas un double) : BigDecimal prix."
            - pattern: '\)\s*\{[\s\S]*\}'
              message: "Un record se termine par un bloc { } (même vide)."

  # ===================================================================== LEÇON 2
  - slug: sor-entite-produit
    title: "TP — Créer une entité et sa table"
    duration: 13
    objective: "Écrire l'entité JPA ProduitEntity et comprendre la table qu'elle produit."
    prerequisites: "Leçon « De l'entité UserEntity à la table users »."
    skills: [spring-jpa, sql-ddl]
    xp: 25
    memo: |
      - `@Entity` + `@Table(name = "produits")` : la classe devient la table `produits`.
      - `@Id` + `@GeneratedValue(strategy = GenerationType.IDENTITY)` : clé primaire générée par PostgreSQL.
      - `@Column(nullable = false, length = 150)` → `VARCHAR(150) NOT NULL`.
      - `BigDecimal` pour les prix, `@Column(precision = 10, scale = 2)` → `NUMERIC(10, 2)`.
      - Un **constructeur vide** est obligatoire pour JPA.
    commonMistakes: |
      - Oublier le constructeur vide : Hibernate ne peut pas recréer l'objet en lisant la base.
      - Utiliser `double` pour un prix.
      - Oublier `@Id` : Spring refuse de démarrer (« No identifier specified for entity »).
      - Écrire le catalogue en dur dans Angular (c'est le cas dans Soramfr) au lieu de le stocker en base.
    blocks:
      - type: text
        md: |
          Dans Soramfr, les douze produits sont écrits **en dur** dans `product.service.ts` (Angular). Pour
          ajouter un produit, il faut modifier le code et redéployer ! La bonne solution : une table
          `produits` en base, gérée par une **entité** Spring.
      - type: code
        id: code-produits-angular
        language: typescript
        title: "Soramfr — product.service.ts (extrait)"
        code: |
          private products: Product [] = [
            new Product(1, "Brume de poche 25 ml", "Format mini avec capuchon de sécurité…", 20, "/img3.jpg"),
            new Product(6, "Alarme portable de sécurité", "Alarme sonore puissante (130 dB)…", 15, "/coque1.jpg"),
          ];
          getAll(): Product[]{
            return this.products;
          }
        lines:
          - n: 1
            note: "Un tableau de produits écrit directement dans le code du navigateur."
          - n: 5
            note: "`getAll()` renvoie ce tableau. Aucun appel HTTP : le commentaire du fichier dit « récupérés via l'API », mais ce n'est pas encore le cas."
      - type: definition
        id: def-annotation
        term: "Annotation"
        md: |
          Une **étiquette** qui commence par `@` et que l'on colle sur une classe, un champ ou une méthode.
          Elle ne fait rien toute seule : elle **donne une consigne** à un outil (Spring, Hibernate…). Comme
          l'étiquette « fragile » sur un colis : c'est le livreur qui adapte son geste.
      - type: code
        id: code-entite-simple
        language: java
        title: "Exemple simple : une entité Livre"
        code: |
          @Entity
          public class Livre {
              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              private String titre;

              public Livre() {
              }
          }
        lines:
          - n: 1
            note: "`@Entity` : Hibernate crée une table `livre`."
          - n: 3
            note: "`@Id` : la clé primaire."
          - n: 4
            note: "`IDENTITY` : c'est PostgreSQL qui choisit le numéro."
          - n: 7
            note: "Sans annotation, `titre` devient quand même une colonne (facultative, 255 caractères)."
          - n: 9
            note: "Le constructeur vide : Hibernate l'utilise pour recréer l'objet à partir d'une ligne."
      - type: question
        ref: sor-e-q1
        review: code-entite-simple
      - type: text
        md: "Exercice guidé : remets les lignes de l'entité `ProduitEntity` dans l'ordre."
      - type: exercise
        ref: sor-ex-entite-ordre
      - type: text
        md: |
          TP en autonomie : écris l'entité complète `ProduitEntity`. La vérification contrôle chaque
          annotation et te dit précisément ce qui manque.
      - type: exercise
        ref: sor-ex-entite-produit
      - type: code
        id: code-table-produits
        language: sql
        title: "La table que produit ton entité"
        code: |
          CREATE TABLE produits (
            id          BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            nom         VARCHAR(150)   NOT NULL,
            description VARCHAR(1000),
            prix        NUMERIC(10, 2) NOT NULL,
            image_url   VARCHAR(255)
          );
        lines:
          - n: 3
            note: "`@Column(nullable = false, length = 150)`."
          - n: 5
            note: "`BigDecimal` + `precision = 10, scale = 2` : 10 chiffres dont 2 après la virgule."
          - n: 6
            note: "`imageUrl` en Java devient `image_url` : Spring Boot convertit les noms en snake_case."
      - type: jury
        items:
          - q: "Pourquoi JPA a-t-il besoin d'un constructeur sans paramètre ?"
            a: "Pour créer un objet vide, puis le remplir avec les colonnes lues en base. Il ne connaît pas les autres constructeurs."
          - q: "Pourquoi BigDecimal pour un prix ?"
            a: "Les `double` font des erreurs d'arrondi (0.1 + 0.2 ≠ 0.3). `BigDecimal` calcule exactement, ce qui est indispensable pour de l'argent."
      - type: quiz
        items:
          - ref: sor-e-q2
            review: def-annotation
          - ref: sor-e-q3
            review: code-table-produits
          - ref: sor-e-q4
            review: code-produits-angular
    questions:
      - code: sor-e-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Que se passe-t-il si une entité n'a pas d'attribut annoté `@Id` ?"
        choices:
          - label: "L'application ne démarre pas : Hibernate exige une clé primaire"
            correct: true
            why: "Oui : « No identifier specified for entity »."
          - label: "Hibernate ajoute tout seul une colonne id"
            correct: false
            why: "Non, il refuse l'entité."
          - label: "La table est créée sans clé primaire"
            correct: false
            why: "JPA impose un identifiant à chaque entité."
        explanation: "Toute entité JPA doit avoir un identifiant `@Id`."
      - code: sor-e-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Une annotation Java (`@Entity`, `@Column`…), c'est…"
        choices:
          - label: "une étiquette qui donne une consigne à un outil"
            correct: true
            why: "Oui : Hibernate lit `@Entity` et agit en conséquence."
          - label: "une méthode qui s'exécute toute seule"
            correct: false
            why: "Une annotation n'exécute rien ; c'est un outil qui la lit."
          - label: "un commentaire ignoré par Java"
            correct: false
            why: "Les commentaires sont ignorés ; les annotations sont lues par les frameworks."
        explanation: "L'annotation est une information attachée au code, lue par Spring, Hibernate, JUnit…"
      - code: sor-e-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "L'attribut Java `imageUrl` devient quelle colonne avec Spring Boot ?"
        choices:
          - label: "`image_url`"
            correct: true
            why: "Oui : Spring Boot convertit le camelCase en snake_case."
          - label: "`imageUrl`"
            correct: false
            why: "Par défaut, Spring Boot change la casse en snake_case."
          - label: "`IMAGEURL`"
            correct: false
            why: "Ce n'est pas la stratégie de nommage par défaut."
        explanation: "Stratégie de nommage par défaut de Spring Boot : `camelCase` → `snake_case`."
      - code: sor-e-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: full-stack
        prompt: "Quel est le principal problème du catalogue écrit en dur dans `product.service.ts` ?"
        choices:
          - label: "Ajouter ou modifier un produit oblige à changer le code et à redéployer"
            correct: true
            why: "Oui : les données sont mélangées au code."
          - label: "Angular ne sait pas afficher plus de dix produits"
            correct: false
            why: "Angular affiche sans problème de longues listes."
          - label: "Les prix sont trop bas"
            correct: false
            why: "Le problème n'est pas la valeur, mais l'endroit où elle est stockée."
        explanation: "Les données doivent vivre en base, derrière une API. Le code, lui, doit seulement les afficher."
    exercises:
      - slug: sor-ex-entite-ordre
        kind: REMETTRE_ORDRE
        title: "Remettre l'entité ProduitEntity dans l'ordre"
        difficulty: FACILE
        skill: spring-jpa
        statement: "Remets les lignes dans l'ordre pour obtenir une entité correcte."
        criteria: "Les annotations précèdent ce qu'elles décrivent ; la classe est bien ouverte et fermée."
        hints:
          - "Les annotations de classe viennent avant `public class`."
          - "`@Id` et `@GeneratedValue` se placent juste avant le champ `id`."
          - "Le constructeur vide et l'accolade fermante terminent la classe."
        solution: |
          @Entity
          @Table(name = "produits")
          public class ProduitEntity {
              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;
              @Column(nullable = false, length = 150)
              private String nom;
              public ProduitEntity() { }
          }
        explanation: "Une annotation s'applique à l'élément qui la **suit** immédiatement."
        xp: 10
        payload:
          language: java
          lines:
            - "@Entity"
            - "@Table(name = \"produits\")"
            - "public class ProduitEntity {"
            - "    @Id"
            - "    @GeneratedValue(strategy = GenerationType.IDENTITY)"
            - "    private Long id;"
            - "    @Column(nullable = false, length = 150)"
            - "    private String nom;"
            - "    public ProduitEntity() { }"
            - "}"
          alternatives:
            - [1, 0, 2, 3, 4, 5, 6, 7, 8, 9]
            - [0, 1, 2, 4, 3, 5, 6, 7, 8, 9]
            - [1, 0, 2, 4, 3, 5, 6, 7, 8, 9]
      - slug: sor-ex-entite-produit
        kind: CODE_LIBRE
        title: "TP — Écrire l'entité ProduitEntity"
        difficulty: INTERMEDIAIRE
        skill: spring-jpa
        statement: |
          Écris l'entité `ProduitEntity` qui correspond à la table `produits` :
          - `id` : `Long`, clé primaire générée par PostgreSQL (`IDENTITY`) ;
          - `nom` : `String`, obligatoire, 150 caractères maximum ;
          - `description` : `String`, facultative, 1000 caractères maximum ;
          - `prix` : `BigDecimal`, obligatoire, `precision = 10`, `scale = 2` ;
          - `imageUrl` : `String`, facultative.

          N'oublie pas le constructeur vide. (Les getters et setters ne sont pas demandés.)
        criteria: "Toutes les annotations nécessaires sont présentes et correctes."
        hints:
          - "En haut : `@Entity` et `@Table(name = \"produits\")`."
          - "Pour `id` : `@Id` puis `@GeneratedValue(strategy = GenerationType.IDENTITY)`."
          - "`@Column(nullable = false, precision = 10, scale = 2) private BigDecimal prix;` et `public ProduitEntity() { }`."
        solution: |
          import java.math.BigDecimal;
          import jakarta.persistence.*;

          @Entity
          @Table(name = "produits")
          public class ProduitEntity {

              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              @Column(nullable = false, length = 150)
              private String nom;

              @Column(length = 1000)
              private String description;

              @Column(nullable = false, precision = 10, scale = 2)
              private BigDecimal prix;

              private String imageUrl;

              public ProduitEntity() {
              }
          }
        explanation: |
          Chaque règle métier du tableau devient une annotation :
          - « obligatoire » → `nullable = false` ; « 150 caractères » → `length = 150` ;
          - « prix à deux décimales » → `BigDecimal` avec `precision` et `scale` ;
          - le constructeur vide permet à Hibernate de recréer l'objet depuis la base.
        xp: 30
        payload:
          language: java
          starter: |
            import java.math.BigDecimal;
            import jakarta.persistence.*;

            public class ProduitEntity {

            }
          checks:
            - pattern: '@Entity\s+(@Table\([^)]*\)\s+)?public\s+class\s+ProduitEntity|@Table\([^)]*\)\s+@Entity\s+public\s+class\s+ProduitEntity'
              message: "Ajoute @Entity juste au-dessus de la classe."
            - pattern: '@Table\(\s*name\s*=\s*"produits"\s*\)'
              message: "La table doit s'appeler produits : @Table(name = \"produits\")."
            - pattern: '@Id\s+(@GeneratedValue\([^)]*\)\s+)?private\s+Long\s+id\s*;|@GeneratedValue\([^)]*\)\s+@Id\s+private\s+Long\s+id\s*;'
              message: "Le champ id doit être annoté @Id : @Id private Long id;"
            - pattern: '@GeneratedValue\(\s*strategy\s*=\s*GenerationType\.IDENTITY\s*\)'
              message: "La clé primaire est générée par PostgreSQL : @GeneratedValue(strategy = GenerationType.IDENTITY)."
            - pattern: '@Column\((?=[^)]*nullable\s*=\s*false)(?=[^)]*length\s*=\s*150)[^)]*\)\s*private\s+String\s+nom\s*;'
              message: "Le nom est obligatoire et limité à 150 caractères : @Column(nullable = false, length = 150)."
            - pattern: '@Column\([^)]*length\s*=\s*1000[^)]*\)\s*private\s+String\s+description\s*;'
              message: "La description est limitée à 1000 caractères : @Column(length = 1000)."
            - pattern: '@Column\((?=[^)]*nullable\s*=\s*false)(?=[^)]*precision\s*=\s*10)(?=[^)]*scale\s*=\s*2)[^)]*\)\s*private\s+BigDecimal\s+prix\s*;'
              message: "Le prix : @Column(nullable = false, precision = 10, scale = 2) private BigDecimal prix;"
            - pattern: 'private\s+String\s+imageUrl\s*;'
              message: "Il manque le champ private String imageUrl;"
            - pattern: 'public\s+ProduitEntity\s*\(\s*\)'
              message: "JPA a besoin d'un constructeur vide : public ProduitEntity() { }"
            - pattern: '\bdouble\s+prix'
              absent: true
              message: "N'utilise pas double pour un prix : les arrondis seraient faux. Utilise BigDecimal."

  # ===================================================================== LEÇON 3
  - slug: sor-repository
    title: "Le repository : parler à la base sans écrire de SQL"
    duration: 11
    objective: "Comprendre JpaRepository et les méthodes dérivées de Soramfr (existsByEmail, findByEmailOrUsername)."
    prerequisites: "Leçon « TP — Créer une entité et sa table »."
    skills: [spring-jpa, sql-select]
    xp: 20
    memo: |
      - `interface UserRepository extends JpaRepository<UserEntity, Long>` : `UserEntity` = l'entité, `Long` = le type de la clé.
      - Méthodes offertes : `save`, `findById`, `findAll`, `existsById`, `deleteById`, `count`…
      - **Méthodes dérivées** : Spring lit le **nom** de la méthode et écrit le SQL.
      - `existsByEmail(email)` → `SELECT ... WHERE email = ?` (vrai ou faux).
      - `findByEmailOrUsername(a, b)` → `WHERE email = ? OR username = ?`, renvoie un `Optional`.
      - Les valeurs sont passées en **paramètres** (`?`) : pas d'injection SQL possible.
    commonMistakes: |
      - Faire une faute dans le nom de la méthode (`findByEmial`) : l'application refuse de démarrer.
      - Oublier que `findBy…` peut ne rien trouver : on reçoit un `Optional` vide, à gérer avec `orElseThrow`.
      - Écrire une classe qui implémente le repository : c'est inutile, Spring la génère.
    blocks:
      - type: text
        md: |
          Dans Soramfr, `UserRepository` fait quelques lignes et ne contient **aucun SQL**. Pourtant, il
          sait vérifier un e-mail, trouver un compte ou en enregistrer un. Comment ?
      - type: definition
        id: def-interface
        term: "Interface"
        md: |
          En Java, une **interface** est une liste de méthodes **promises**, sans leur contenu. C'est le menu
          d'un restaurant : il dit ce qu'on peut commander, pas la recette. Ici, c'est **Spring** qui écrit la
          recette (le code) tout seul au démarrage.
      - type: code
        id: code-user-repository
        language: java
        title: "Soramfr — UserRepository.java"
        code: |
          public interface UserRepository extends JpaRepository<UserEntity, Long> {

              boolean existsByEmail(String email);

              boolean existsByUsername(String username);

              Optional<UserEntity> findByEmailOrUsername(String email, String username);
          }
        lines:
          - n: 1
            note: "`extends JpaRepository<UserEntity, Long>` : on hérite de `save`, `findById`, `findAll`, `deleteById`… pour l'entité `UserEntity` dont la clé est un `Long`."
          - n: 3
            note: "`existsByEmail` : Spring lit « exists / By / Email » et produit une requête qui répond vrai ou faux."
          - n: 7
            note: "`findByEmailOrUsername` : `WHERE email = ? OR username = ?`. Le résultat est un `Optional` : une boîte qui peut être vide."
      - type: compare
        left:
          title: "Nom de la méthode"
          code: |
            existsByEmail(String email)
            findByEmailOrUsername(String e, String u)
            findByNomContainingIgnoreCase(String mot)
          language: java
        right:
          title: "SQL généré (simplifié)"
          code: |
            SELECT count(*) > 0 FROM users WHERE email = ?;
            SELECT * FROM users WHERE email = ? OR username = ?;
            SELECT * FROM produits WHERE lower(nom) LIKE lower('%' || ? || '%');
          language: sql
      - type: question
        ref: sor-rp-q1
        review: code-user-repository
      - type: definition
        id: def-optional
        term: "Optional"
        md: |
          Une **boîte** qui contient un objet… ou rien. Au lieu de renvoyer `null` (et risquer une erreur),
          `findBy…` renvoie un `Optional`. On l'ouvre avec `orElseThrow(...)` : « donne-moi l'objet, sinon
          lance une erreur ».
      - type: code
        id: code-orelsethrow
        language: java
        title: "Soramfr — AuthService.login (extrait)"
        code: |
          UserEntity nouvelutilisateur = userRepository.findByEmailOrUsername(req.identifier, req.identifier)
                  .orElseThrow(() -> new EntityNotFoundException("Utilisateur introuvable"));
        lines:
          - n: 1
            note: "La même valeur `identifier` est cherchée comme e-mail **ou** comme pseudo : on peut se connecter avec l'un ou l'autre."
          - n: 2
            note: "Si la boîte est vide, on lance une erreur. (On verra que ce message en dit trop à un attaquant.)"
      - type: text
        md: "Exercice guidé : complète le repository des produits."
      - type: exercise
        ref: sor-ex-repo-guide
      - type: text
        md: "En autonomie : écris un repository avec deux méthodes dérivées."
      - type: exercise
        ref: sor-ex-produit-repository
      - type: jury
        items:
          - q: "Vous n'avez écrit aucun SQL pour les utilisateurs. Comment la base est-elle interrogée ?"
            a: "Grâce à Spring Data JPA : il génère l'implémentation du repository et traduit le nom des méthodes (`existsByEmail`) en requêtes SQL paramétrées."
          - q: "Votre application est-elle protégée contre l'injection SQL ?"
            a: "Oui pour ces requêtes : Spring Data passe les valeurs en paramètres, jamais en les collant dans le texte SQL."
      - type: quiz
        items:
          - ref: sor-rp-q2
            review: def-interface
          - ref: sor-rp-q3
            review: def-optional
          - ref: sor-rp-q4
            review: code-user-repository
    questions:
      - code: sor-rp-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-jpa
        prompt: "Que renvoie `existsByUsername(\"mai\")` ?"
        choices:
          - label: "`true` si un compte a le pseudo `mai`, sinon `false`"
            correct: true
            why: "Oui : c'est un `boolean`."
          - label: "Le compte dont le pseudo est `mai`"
            correct: false
            why: "Pour obtenir le compte, il faudrait `findByUsername`."
          - label: "Le nombre de comptes"
            correct: false
            why: "Ce serait `count()`."
        explanation: "`existsBy…` → vrai/faux ; `findBy…` → le ou les objets ; `countBy…` → un nombre."
      - code: sor-rp-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-jpa
        prompt: "Il faut écrire une classe `UserRepositoryImpl` pour que `UserRepository` fonctionne."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : Spring Data génère l'implémentation au démarrage."
          - label: "Faux"
            correct: true
            why: "Exact : l'interface suffit."
        explanation: "On déclare l'interface ; Spring écrit le code."
      - code: sor-rp-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-bases
        prompt: "Que fait `.orElseThrow(...)` sur un `Optional` vide ?"
        choices:
          - label: "Il lance l'exception fournie"
            correct: true
            why: "Oui : on arrête le traitement avec une erreur claire."
          - label: "Il renvoie `null`"
            correct: false
            why: "C'est justement ce que l'Optional permet d'éviter."
          - label: "Il crée un nouvel utilisateur"
            correct: false
            why: "Il ne crée rien."
        explanation: "`orElseThrow` : l'objet s'il existe, sinon une exception (que le gestionnaire d'erreurs transforme en réponse HTTP)."
      - code: sor-rp-q4
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: sql-select
        prompt: "Quel SQL correspond à `findByEmailOrUsername(email, username)` ?"
        choices:
          - label: "`SELECT * FROM users WHERE email = ? OR username = ?`"
            correct: true
            why: "Oui : `Or` dans le nom devient `OR` dans la requête."
          - label: "`SELECT * FROM users WHERE email = ? AND username = ?`"
            correct: false
            why: "Ce serait `findByEmailAndUsername`."
          - label: "`SELECT email, username FROM users`"
            correct: false
            why: "Il n'y a aucun filtre dans cette requête."
        explanation: "Les mots `And`, `Or`, `Containing`, `LessThan`… du nom deviennent des conditions SQL."
    exercises:
      - slug: sor-ex-repo-guide
        kind: COMPLETER
        title: "Compléter ProduitRepository"
        difficulty: FACILE
        skill: spring-jpa
        statement: "Complète le repository des produits. Respecte les majuscules."
        criteria: "Les trois trous sont corrects."
        hints:
          - "On hérite de l'interface fournie par Spring Data JPA."
          - "Le type de la clé primaire de ProduitEntity est `Long`."
          - "JpaRepository, ProduitEntity, Long."
        solution: '["JpaRepository", "ProduitEntity", "Long"]'
        explanation: "`JpaRepository<ProduitEntity, Long>` : l'entité gérée, puis le type de sa clé primaire."
        xp: 10
        payload:
          language: java
          template: |
            public interface ProduitRepository extends [[1]]<[[2]], [[3]]> {
            }
          blanks:
            - ["JpaRepository"]
            - ["ProduitEntity"]
            - ["Long"]
      - slug: sor-ex-produit-repository
        kind: CODE_LIBRE
        title: "Écrire ProduitRepository avec deux recherches"
        difficulty: INTERMEDIAIRE
        skill: spring-jpa
        statement: |
          Écris l'interface `ProduitRepository` pour l'entité `ProduitEntity` (clé `Long`) avec :
          1. une méthode qui cherche les produits dont le **nom contient** un mot, **sans tenir compte des
             majuscules** (la barre de recherche du catalogue) ;
          2. une méthode qui renvoie les produits dont le **prix est inférieur ou égal** à un montant.

          Les deux renvoient une `List<ProduitEntity>`.
        criteria: "Interface héritant de JpaRepository, deux méthodes dérivées correctement nommées."
        hints:
          - "`public interface ProduitRepository extends JpaRepository<ProduitEntity, Long> { ... }`"
          - "Mots-clés Spring Data : `Containing`, `IgnoreCase`, `LessThanEqual`."
          - "`findByNomContainingIgnoreCase(String mot)` et `findByPrixLessThanEqual(BigDecimal prix)`."
        solution: |
          import java.math.BigDecimal;
          import java.util.List;
          import org.springframework.data.jpa.repository.JpaRepository;

          public interface ProduitRepository extends JpaRepository<ProduitEntity, Long> {

              List<ProduitEntity> findByNomContainingIgnoreCase(String mot);

              List<ProduitEntity> findByPrixLessThanEqual(BigDecimal prix);
          }
        explanation: |
          Spring lit le nom : `findBy` + `Nom` + `Containing` (LIKE '%mot%') + `IgnoreCase` (sans majuscules).
          Puis `findBy` + `Prix` + `LessThanEqual` (<=). La recherche du catalogue, faite aujourd'hui en
          TypeScript sur une liste en dur, peut ainsi se faire côté serveur.
        xp: 25
        payload:
          language: java
          starter: |
            import java.math.BigDecimal;
            import java.util.List;
            import org.springframework.data.jpa.repository.JpaRepository;

          checks:
            - pattern: 'interface\s+ProduitRepository\s+extends\s+JpaRepository\s*<\s*ProduitEntity\s*,\s*Long\s*>'
              message: "Déclare l'interface : public interface ProduitRepository extends JpaRepository<ProduitEntity, Long>."
            - pattern: 'List\s*<\s*ProduitEntity\s*>\s+findByNomContainingIgnoreCase\s*\(\s*String\s+\w+\s*\)'
              message: "Recherche par nom : List<ProduitEntity> findByNomContainingIgnoreCase(String mot);"
            - pattern: 'List\s*<\s*ProduitEntity\s*>\s+findByPrixLessThanEqual\s*\(\s*BigDecimal\s+\w+\s*\)'
              message: "Recherche par prix : List<ProduitEntity> findByPrixLessThanEqual(BigDecimal prix);"
            - pattern: 'class\s+ProduitRepository'
              absent: true
              message: "Un repository Spring Data est une interface, pas une classe."

  # ===================================================================== LEÇON 4
  - slug: sor-service-inscription
    title: "TP — Reconstruire l'inscription dans le service"
    duration: 15
    objective: "Réécrire AuthService.register : contrôles, doublons, hachage BCrypt, sauvegarde et réponse."
    prerequisites: "Leçon « Le repository »."
    skills: [spring-rest, auth-jwt]
    xp: 30
    memo: |
      Les cinq temps de `register` :
      1. **Contrôler** les champs (vides, mot de passe d'au moins 8 caractères) → 400.
      2. **Refuser les doublons** (`existsByEmail`, `existsByUsername`) → 409.
      3. **Construire** l'entité à partir du DTO.
      4. **Hacher** le mot de passe (`encoder.encode`) et ne stocker que le hash.
      5. **Sauvegarder** (`save`) et renvoyer un DTO public (`AuthResponse`).
    commonMistakes: |
      - Stocker `req.password` au lieu de `encoder.encode(req.password)`.
      - Vérifier les doublons **après** la sauvegarde.
      - Renvoyer l'entité complète au lieu d'un DTO.
      - Contrôle différent entre Angular (6 caractères) et Spring (8) : dans Soramfr, un mot de passe de 7 caractères passe le formulaire mais est refusé par le serveur.
    blocks:
      - type: text
        md: |
          On arrive au cœur de l'inscription : la méthode `register` du service. Tu vas la **lire** ligne par
          ligne, puis la **réécrire** toi-même.
      - type: definition
        id: def-exception
        term: "Exception"
        md: |
          Un **signal d'alarme** qui arrête le traitement en cours. `throw new ValidationException("Nom
          obligatoire")` veut dire : « stop, cette demande n'est pas valable ». Un gestionnaire d'erreurs
          attrape l'alarme et la transforme en réponse HTTP (400, 409…).
      - type: code
        id: code-register-simple
        language: java
        title: "Exemple simple : ouvrir un compte à la bibliothèque"
        code: |
          public Lecteur inscrire(String nom) {
              if (nom == null || nom.isBlank()) {
                  throw new IllegalArgumentException("Nom obligatoire");
              }
              if (lecteurs.existeDeja(nom)) {
                  throw new IllegalStateException("Ce lecteur existe déjà");
              }
              return lecteurs.enregistrer(new Lecteur(nom));
          }
        lines:
          - n: 2
            note: "`isBlank()` : vrai si le texte est vide ou ne contient que des espaces."
          - n: 3
            note: "`throw` lance l'exception : la méthode s'arrête ici."
          - n: 5
            note: "On vérifie les doublons **avant** d'enregistrer."
          - n: 8
            note: "Tout est bon : on enregistre et on renvoie le résultat."
      - type: code
        id: code-register-soramfr
        language: java
        title: "Soramfr — AuthService.register (extrait)"
        code: |
          public AuthResponse register(RegisterRequest req){
              if (req.name == null || req.name.isBlank())
                  throw new ValidationException("Nom obligatoire");
              if (req.password == null || req.password.length() < 8)
                 throw new ValidationException("Mot de passe minimum 8 caractères");

              if (userRepository.existsByEmail(req.email))
                 throw new ErrorHondler.DuplicateResourceException("Email déjà utilisé");
              if (userRepository.existsByUsername(req.username))
                throw new ErrorHondler.DuplicateResourceException("Pseudo déjà utilisé");

              UserEntity nouvelutilisateur = new UserEntity();
              nouvelutilisateur.setName(req.name);
              nouvelutilisateur.setEmail(req.email);
              nouvelutilisateur.setUsername(req.username);
              nouvelutilisateur.setPasswordHash(encoder.encode(req.password));

              UserEntity saved = userRepository.save(nouvelutilisateur);
              return new AuthResponse(saved.getId(), saved.getName(), saved.getEmail(), saved.getUsername());
          }
        lines:
          - n: 2
            note: "Contrôle du nom : absent ou vide → exception → réponse **400**."
          - n: 4
            note: "Mot de passe d'au moins **8** caractères. (Angular n'en exige que 6 : incohérence à corriger.)"
          - n: 7
            note: "Doublon d'e-mail → `DuplicateResourceException` → réponse **409**."
          - n: 11
            note: "On crée l'entité vide, puis on la remplit avec les données du DTO."
          - n: 15
            note: "**Le point clé** : on stocke `encoder.encode(...)`, le hash BCrypt, jamais le mot de passe."
          - n: 17
            note: "`save` exécute l'INSERT et renvoie l'entité avec son `id` généré."
          - n: 18
            note: "On renvoie un DTO public : id, nom, e-mail, pseudo. Pas de hash."
      - type: question
        ref: sor-s-q1
        review: code-register-soramfr
      - type: text
        md: "Exercice guidé : complète les lignes clés de `register`."
      - type: exercise
        ref: sor-ex-register-guide
      - type: text
        md: |
          TP en autonomie : **reconstruis la fonctionnalité d'inscription** côté serveur. Le squelette de la
          classe est fourni ; écris le corps de `register`.
      - type: exercise
        ref: sor-ex-register-service
      - type: jury
        items:
          - q: "Détaillez votre méthode d'inscription."
            a: |
              « Elle contrôle les champs obligatoires et la longueur du mot de passe, vérifie que l'e-mail et le
              pseudo ne sont pas déjà utilisés, crée l'entité, hache le mot de passe avec BCrypt, l'enregistre
              via le repository et renvoie un DTO sans le mot de passe. »
          - q: "Que se passe-t-il si deux personnes s'inscrivent au même moment avec le même e-mail ?"
            a: |
              Les deux `existsByEmail` peuvent répondre « non » en même temps. C'est la contrainte `UNIQUE` en
              base qui bloque la deuxième insertion. Il faudrait aussi traduire cette erreur en 409.
      - type: quiz
        items:
          - ref: sor-s-q2
            review: def-exception
          - ref: sor-s-q3
            review: code-register-soramfr
          - ref: sor-s-q4
            review: code-register-soramfr
    questions:
      - code: sor-s-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: auth-jwt
        prompt: "Quelle ligne garantit que le mot de passe n'est jamais stocké en clair ?"
        choices:
          - label: "`setPasswordHash(encoder.encode(req.password))`"
            correct: true
            why: "Oui : on stocke le hash BCrypt."
          - label: "`@JsonIgnore` sur `passwordHash`"
            correct: false
            why: "`@JsonIgnore` évite de l'**envoyer** dans le JSON, mais ne change pas ce qui est **stocké**."
          - label: "`req.password.length() < 8`"
            correct: false
            why: "C'est un contrôle de longueur."
        explanation: "Seul `encoder.encode(...)` transforme le mot de passe avant l'enregistrement."
      - code: sor-s-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-exceptions
        prompt: "Que fait `throw new ValidationException(\"Nom obligatoire\")` ?"
        choices:
          - label: "Il arrête la méthode et signale une erreur"
            correct: true
            why: "Oui : le code suivant n'est pas exécuté."
          - label: "Il affiche un message et continue"
            correct: false
            why: "`throw` interrompt la méthode."
          - label: "Il enregistre le compte sans nom"
            correct: false
            why: "Justement non : on arrête tout."
        explanation: "Une exception interrompt le traitement. Le gestionnaire d'erreurs la transforme en réponse HTTP 400."
      - code: sor-s-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Angular accepte un mot de passe de 6 caractères, Spring en exige 8. Que voit une personne qui tape `abc123` ?"
        choices:
          - label: "Le formulaire l'accepte, puis le serveur répond 400 « Mot de passe minimum 8 caractères »"
            correct: true
            why: "Oui : les deux règles ne sont pas alignées."
          - label: "Son compte est créé"
            correct: false
            why: "Le serveur refuse : c'est lui qui a le dernier mot."
          - label: "Angular bloque le formulaire"
            correct: false
            why: "Angular n'exige que 6 caractères : `abc123` passe."
        explanation: "Les règles doivent être **identiques** des deux côtés. Le contrôle Angular sert au confort ; celui du serveur sert à la sécurité."
      - code: sor-s-q4
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: spring-rest
        prompt: "Pourquoi vérifier les doublons **avant** `save` ?"
        choices:
          - label: "Pour répondre un message clair (409) au lieu d'une erreur de base de données"
            correct: true
            why: "Oui : la contrainte UNIQUE reste une sécurité, mais le service donne un message compréhensible."
          - label: "Parce que `save` supprime les doublons"
            correct: false
            why: "`save` ne supprime rien."
          - label: "Ce n'est pas utile"
            correct: false
            why: "Sans ce contrôle, la personne recevrait une erreur 500 peu claire."
        explanation: "Le service anticipe le cas prévu (doublon → 409). La contrainte UNIQUE couvre les cas imprévus (inscriptions simultanées)."
    exercises:
