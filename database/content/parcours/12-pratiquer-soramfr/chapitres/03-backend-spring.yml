        difficulty: FACILE
        skill: spring-rest
        statement: "Complète les quatre trous. Respecte les majuscules."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "La méthode du repository qui répond vrai/faux pour un e-mail."
          - "La méthode de BCrypt qui hache un mot de passe."
          - "existsByEmail, encode, save, AuthResponse."
        solution: '["existsByEmail", "encode", "save", "AuthResponse"]'
        explanation: "Vérifier (`existsByEmail`), hacher (`encode`), enregistrer (`save`), répondre avec un DTO public (`AuthResponse`)."
        xp: 10
        payload:
          language: java
          template: |
            if (userRepository.[[1]](req.email))
                throw new ErrorHondler.DuplicateResourceException("Email déjà utilisé");

            nouvelutilisateur.setPasswordHash(encoder.[[2]](req.password));
            UserEntity saved = userRepository.[[3]](nouvelutilisateur);
