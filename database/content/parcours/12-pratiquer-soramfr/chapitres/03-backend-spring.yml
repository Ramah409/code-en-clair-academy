      - slug: sor-ex-register-service
        kind: CODE_LIBRE
        title: "TP — Reconstruire la méthode register"
        difficulty: DIFFICILE
        skill: spring-rest
        statement: |
          Écris le corps de `register(RegisterRequest req)` :
          1. refuse un nom, un e-mail ou un pseudo vide (`ValidationException`) ;
          2. refuse un mot de passe absent ou de moins de **8** caractères ;
          3. refuse un e-mail ou un pseudo déjà utilisé (`DuplicateResourceException`) ;
          4. crée un `UserEntity`, remplis nom, e-mail, pseudo et **le hash** du mot de passe ;
          5. enregistre-le et renvoie `new AuthResponse(id, name, email, username)`.
        criteria: "Contrôles, doublons, hachage, sauvegarde et réponse publique présents ; aucun mot de passe en clair."
        hints:
          - "Contrôle : `if (req.name == null || req.name.isBlank()) throw new ValidationException(\"Nom obligatoire\");`"
          - "Doublons : `if (userRepository.existsByEmail(req.email)) throw new DuplicateResourceException(\"Email déjà utilisé\");`"
          - "`user.setPasswordHash(encoder.encode(req.password));` puis `UserEntity saved = userRepository.save(user);`"
        solution: |
          public AuthResponse register(RegisterRequest req) {
              if (req.name == null || req.name.isBlank())
                  throw new ValidationException("Nom obligatoire");
              if (req.email == null || req.email.isBlank())
                  throw new ValidationException("Email obligatoire");
              if (req.username == null || req.username.isBlank())
                  throw new ValidationException("Pseudo obligatoire");
              if (req.password == null || req.password.length() < 8)
                  throw new ValidationException("Mot de passe minimum 8 caractères");

              if (userRepository.existsByEmail(req.email))
                  throw new DuplicateResourceException("Email déjà utilisé");
              if (userRepository.existsByUsername(req.username))
                  throw new DuplicateResourceException("Pseudo déjà utilisé");

              UserEntity user = new UserEntity();
              user.setName(req.name);
              user.setEmail(req.email);
              user.setUsername(req.username);
              user.setPasswordHash(encoder.encode(req.password));

              UserEntity saved = userRepository.save(user);
              return new AuthResponse(saved.getId(), saved.getName(), saved.getEmail(), saved.getUsername());
          }
        explanation: |
          L'ordre compte : on contrôle d'abord ce qui est **gratuit** (les champs), puis ce qui demande la base
          (les doublons), et on n'écrit en base qu'une fois tout vérifié. Le mot de passe n'existe en clair que
          dans la variable `req.password`, le temps de le hacher.
        xp: 40
        payload:
          language: java
          starter: |
            @Service
            public class AuthService {

                private final UserRepository userRepository;
                private final BCryptPasswordEncoder encoder = new BCryptPasswordEncoder();

                public AuthService(UserRepository userRepository) {
                    this.userRepository = userRepository;
                }

                public AuthResponse register(RegisterRequest req) {
                    // 1. contrôles des champs

                    // 2. doublons

                    // 3. création de l'entité et hachage

                    // 4. sauvegarde et réponse
                }
            }
          checks:
            - pattern: 'req\.name\s*==\s*null[\s\S]*req\.name\.isBlank\(\)'
              message: "Refuse un nom absent ou vide : if (req.name == null || req.name.isBlank()) throw new ValidationException(...)."
            - pattern: 'req\.email\s*==\s*null[\s\S]*req\.email\.isBlank\(\)'
              message: "Refuse un e-mail absent ou vide."
            - pattern: 'req\.username\s*==\s*null[\s\S]*req\.username\.isBlank\(\)'
              message: "Refuse un pseudo absent ou vide."
            - pattern: 'req\.password\.length\(\)\s*<\s*8'
              message: "Refuse les mots de passe de moins de 8 caractères : req.password.length() < 8."
            - pattern: 'throw\s+new\s+ValidationException\s*\('
              message: "Les champs invalides lèvent une ValidationException (réponse 400)."
            - pattern: 'userRepository\.existsByEmail\s*\(\s*req\.email\s*\)'
              message: "Vérifie que l'e-mail est libre : userRepository.existsByEmail(req.email)."
            - pattern: 'userRepository\.existsByUsername\s*\(\s*req\.username\s*\)'
              message: "Vérifie que le pseudo est libre : userRepository.existsByUsername(req.username)."
            - pattern: 'throw\s+new\s+(ErrorHondler\.)?DuplicateResourceException\s*\('
              message: "Un doublon lève une DuplicateResourceException (réponse 409)."
            - pattern: 'new\s+UserEntity\s*\('
              message: "Crée l'entité : UserEntity user = new UserEntity();"
            - pattern: 'setPasswordHash\s*\(\s*encoder\.encode\s*\(\s*req\.password\s*\)\s*\)'
              message: "Stocke le hash : user.setPasswordHash(encoder.encode(req.password));"
            - pattern: 'setPasswordHash\s*\(\s*req\.password\s*\)'
              absent: true
              message: "Danger : tu stockes le mot de passe en clair. Hache-le avec encoder.encode(...)."
            - pattern: 'userRepository\.save\s*\('
              message: "Enregistre l'entité avec userRepository.save(...)."
            - pattern: 'return\s+new\s+AuthResponse\s*\('
              message: "Renvoie un DTO public : return new AuthResponse(saved.getId(), ...);"
            - pattern: 'existsByEmail[\s\S]*userRepository\.save'
              message: "Les doublons doivent être vérifiés AVANT la sauvegarde."

  # ===================================================================== LEÇON 5
  - slug: sor-endpoint-rest
    title: "TP — Créer et tester un endpoint REST"
    duration: 14
    objective: "Écrire un contrôleur REST pour les produits (liste et détail) et savoir le tester."
    prerequisites: "Leçon « TP — Reconstruire l'inscription »."
    skills: [spring-rest]
    xp: 30
    memo: |
      - **Endpoint** = une adresse + un verbe HTTP que l'API accepte (`GET /api/produits`).
      - `@GetMapping` (lire), `@PostMapping` (créer), `@PutMapping` (modifier), `@DeleteMapping` (supprimer).
      - `@PathVariable Long id` : récupère la partie variable de l'adresse (`/api/produits/{id}`).
      - `@RequestBody` : récupère le JSON envoyé.
      - `ResponseEntity` : permet de choisir le code de statut (201, 204…).
      - Le contrôleur **délègue** au service ; il ne touche jamais le repository.
    commonMistakes: |
      - Oublier `@PathVariable` : `id` reste vide.
      - Utiliser `GET` pour une action qui modifie des données.
      - Renvoyer 200 pour une création (préférer 201) ou pour une suppression (préférer 204).
      - Oublier le `/` ou écrire deux `/` dans l'adresse (Soramfr a `"/api//auth/**"` dans `CorsConfig`).
    blocks:
      - type: text
        md: |
          Aujourd'hui, le catalogue de Soramfr est écrit dans Angular. Tu vas créer l'**endpoint** qui le
          servira depuis la base : `GET /api/produits` pour la liste, `GET /api/produits/{id}` pour un produit.
      - type: definition
        id: def-endpoint
        term: "Endpoint"
        md: |
          Une **porte d'entrée** de l'API : une adresse et un verbe. Comme un guichet précis à la poste :
          « guichet 3 : retrait des colis ». `GET /api/produits` est le guichet « liste des produits ».
      - type: code
        id: code-usercontroller
        language: java
        title: "Soramfr — UserController.java (extrait)"
        code: |
          @RestController
          @RequestMapping("/api/users")
          public class UserController {

              private final UserService userService;

              public UserController(UserService userService){
                  this.userService = userService;
              }

              @GetMapping
              public List<UserDto> getAll(){
                  return userService.getAll();
              }

              @GetMapping("/{id}")
              public UserDto getById(@PathVariable Long id) {
                  return userService.getById(id);
              }

              @DeleteMapping("/{id}")
              public ResponseEntity<Void> delete(@PathVariable Long id){
                  userService.delete(id);
                  return ResponseEntity.noContent().build();
              }
          }
        lines:
          - n: 11
            note: "`@GetMapping` sans adresse : c'est `GET /api/users`."
          - n: 12
            note: "La liste est convertie en tableau JSON, avec le code 200."
          - n: 16
            note: "`{id}` est une partie variable de l'adresse : `/api/users/7`."
          - n: 17
            note: "`@PathVariable Long id` : Spring met 7 dans la variable `id`."
          - n: 21
            note: "`@DeleteMapping(\"/{id}\")` : `DELETE /api/users/7`."
          - n: 24
            note: "`noContent()` : réponse **204**, suppression réussie, rien à renvoyer."
      - type: question
        ref: sor-ep-q1
        review: code-usercontroller
      - type: callout
        variant: warning
        title: "À vérifier dans Soramfr"
        md: |
          Rien, dans `SecurityConfig`, ne réserve `/api/users` à l'administratrice : **toute personne
          connectée** peut lister et supprimer des comptes, même avec le rôle USER. On le corrige au chapitre
          sécurité.
      - type: text
        md: "Exercice guidé : complète les annotations du contrôleur des produits."
      - type: exercise
        ref: sor-ex-endpoint-guide
      - type: text
        md: "TP en autonomie : écris le contrôleur complet."
      - type: exercise
        ref: sor-ex-produit-controller
      - type: steps
        id: etapes-test-endpoint
        title: "Tester ton endpoint avec Postman"
        items:
          - "Lance le backend (`./mvnw spring-boot:run`)."
          - "Dans Postman, crée une requête **GET** `http://localhost:8080/api/produits`."
          - "Onglet **Authorization** → **Bearer Token** : colle le jeton reçu à la connexion (la route est protégée)."
          - "Clique sur **Send** : tu dois voir le code **200** et un tableau JSON."
          - "Essaie `GET /api/produits/999` : tu dois obtenir **404**, pas 500."
          - "Retire le jeton et recommence : tu dois obtenir **401**."
      - type: jury
        items:
          - q: "Quelle différence entre @PathVariable et @RequestBody ?"
            a: "`@PathVariable` lit une valeur dans l'adresse (`/api/produits/3`). `@RequestBody` lit le JSON envoyé dans le corps de la requête."
          - q: "Comment avez-vous testé vos endpoints ?"
            a: |
              « Avec Postman : pour chaque route, je vérifie le code de statut et le JSON, dans le cas normal et
              dans les cas d'erreur (404, 401, 409). Prochaine étape : les automatiser avec MockMvc. »
      - type: quiz
        items:
          - ref: sor-ep-q2
            review: def-endpoint
          - ref: sor-ep-q3
            review: code-usercontroller
          - ref: sor-ep-q4
            review: etapes-test-endpoint
    questions:
      - code: sor-ep-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Quelle requête appelle la méthode `getById` de `UserController` pour le compte 12 ?"
        choices:
          - label: "`GET /api/users/12`"
            correct: true
            why: "Oui : `@RequestMapping(\"/api/users\")` + `@GetMapping(\"/{id}\")`."
          - label: "`GET /api/users?id=12`"
            correct: false
            why: "Ce serait un paramètre de requête (`@RequestParam`), pas une partie de l'adresse."
          - label: "`POST /api/users/12`"
            correct: false
            why: "La méthode est déclarée avec `@GetMapping`."
        explanation: "L'adresse complète = préfixe de la classe + adresse de la méthode ; `{id}` est remplacé par la valeur."
      - code: sor-ep-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-rest
        prompt: "Quel verbe HTTP convient pour **modifier** un produit existant ?"
        choices:
          - label: "PUT"
            correct: true
            why: "Oui : PUT remplace la ressource par la nouvelle version."
          - label: "GET"
            correct: false
            why: "GET ne doit jamais modifier de données."
          - label: "DELETE"
            correct: false
            why: "DELETE supprime."
        explanation: "GET lit, POST crée, PUT modifie (remplace), PATCH modifie en partie, DELETE supprime."
      - code: sor-ep-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Quel code renvoie `ResponseEntity.noContent().build()` ?"
        choices:
          - label: "204 No Content"
            correct: true
            why: "Oui : réussi, sans corps de réponse."
          - label: "200 OK"
            correct: false
            why: "`ok()` renverrait 200."
          - label: "404 Not Found"
            correct: false
            why: "`notFound()` renverrait 404."
        explanation: "204 est la réponse habituelle d'une suppression réussie."
      - code: sor-ep-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Tu appelles `GET /api/produits` dans Postman **sans jeton**. Quel code attends-tu si la sécurité est correcte ?"
        choices:
          - label: "401"
            correct: true
            why: "Oui : aucune identité prouvée."
          - label: "200"
            correct: false
            why: "La route est protégée : sans jeton, pas d'accès."
          - label: "404"
            correct: false
            why: "La route existe ; le problème vient de l'authentification."
        explanation: "401 = pas authentifié. (Soramfr renvoie 403 dans ce cas, faute de point d'entrée d'authentification configuré : on le corrige au chapitre sécurité.)"
    exercises:
      - slug: sor-ex-endpoint-guide
        kind: COMPLETER
        title: "Compléter le contrôleur des produits"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète les annotations. Respecte les majuscules."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Un contrôleur qui renvoie du JSON : @Rest…"
          - "Pour lire la valeur `{id}` de l'adresse : @Path…"
          - "@RestController, @GetMapping, @GetMapping, @PathVariable."
        solution: '["@RestController", "@GetMapping", "@GetMapping", "@PathVariable"]'
        explanation: "`@RestController` pour la classe, `@GetMapping` pour les lectures, `@PathVariable` pour récupérer l'identifiant dans l'adresse."
        xp: 10
        payload:
          language: java
          template: |
            [[1]]
            @RequestMapping("/api/produits")
            public class ProduitController {

                [[2]]
                public List<ProduitDto> lister() { ... }

                [[3]]("/{id}")
                public ProduitDto detail([[4]] Long id) { ... }
            }
          blanks:
            - ["@RestController"]
            - ["@GetMapping"]
            - ["@GetMapping"]
            - ["@PathVariable"]
      - slug: sor-ex-produit-controller
        kind: CODE_LIBRE
        title: "TP — Écrire ProduitController"
        difficulty: INTERMEDIAIRE
        skill: spring-rest
        statement: |
          Écris `ProduitController` :
          - préfixe `/api/produits` ;
          - `GET /api/produits` → `List<ProduitDto> lister()` qui appelle `produitService.lister()` ;
          - `GET /api/produits/{id}` → `ProduitDto detail(Long id)` qui appelle `produitService.detail(id)` ;
          - le service est reçu par le **constructeur**.
        criteria: "Contrôleur REST, préfixe, deux GET, @PathVariable, délégation au service, aucun repository."
        hints:
          - "Annotations de classe : `@RestController` et `@RequestMapping(\"/api/produits\")`."
          - "Champ `private final ProduitService produitService;` et un constructeur qui le reçoit."
          - "`@GetMapping(\"/{id}\") public ProduitDto detail(@PathVariable Long id) { return produitService.detail(id); }`"
        solution: |
          @RestController
          @RequestMapping("/api/produits")
          public class ProduitController {

              private final ProduitService produitService;

              public ProduitController(ProduitService produitService) {
                  this.produitService = produitService;
              }

              @GetMapping
              public List<ProduitDto> lister() {
                  return produitService.lister();
              }

              @GetMapping("/{id}")
              public ProduitDto detail(@PathVariable Long id) {
                  return produitService.detail(id);
              }
          }
        explanation: |
          Le contrôleur ne fait que **traduire** HTTP en appels Java : il ne contient aucune règle et ne parle
          pas au repository. Si le produit n'existe pas, c'est le service qui lance l'exception, transformée en
          404 par le gestionnaire d'erreurs.
        xp: 35
        payload:
          language: java
          starter: |
            import java.util.List;
            import org.springframework.web.bind.annotation.*;

          checks:
            - pattern: '@RestController'
              message: "La classe doit être annotée @RestController."
            - pattern: '@RequestMapping\(\s*"/api/produits"\s*\)'
              message: "Préfixe de la classe : @RequestMapping(\"/api/produits\")."
            - pattern: 'class\s+ProduitController'
              message: "La classe s'appelle ProduitController."
            - pattern: 'ProduitController\s*\(\s*ProduitService\s+\w+\s*\)'
              message: "Le service est reçu par le constructeur : public ProduitController(ProduitService produitService)."
            - pattern: '@GetMapping(\(\s*\))?\s+public\s+List\s*<\s*ProduitDto\s*>\s+lister\s*\(\s*\)'
              message: "Liste : @GetMapping public List<ProduitDto> lister()."
            - pattern: '@GetMapping\(\s*"/\{id\}"\s*\)\s+public\s+ProduitDto\s+detail\s*\(\s*@PathVariable\s+Long\s+id\s*\)'
              message: "Détail : @GetMapping(\"/{id}\") public ProduitDto detail(@PathVariable Long id)."
            - pattern: 'produitService\.lister\s*\(\s*\)'
              message: "lister() doit appeler produitService.lister()."
            - pattern: 'produitService\.detail\s*\(\s*id\s*\)'
              message: "detail() doit appeler produitService.detail(id)."
            - pattern: 'Repository'
              absent: true
              message: "Le contrôleur ne parle pas au repository : passe par le service."

  # ===================================================================== LEÇON 6
  - slug: sor-erreurs
    title: "Gérer les erreurs sans en dire trop"
    duration: 13
    objective: "Comprendre ErrorHondler (@RestControllerAdvice) et corriger la connexion pour qu'elle ne révèle pas quels comptes existent."
    prerequisites: "Leçon « TP — Créer et tester un endpoint REST »."
    skills: [spring-rest, securite-owasp]
    xp: 25
    memo: |
      - `@RestControllerAdvice` : une classe qui attrape les exceptions de **tous** les contrôleurs.
      - `@ExceptionHandler(X.class)` : « quand l'exception X arrive, réponds comme ceci ».
      - Soramfr : `EntityNotFoundException` → 404, `ValidationException` → 400, `DuplicateResourceException` → 409, reste → 500.
      - Connexion : même réponse **401** et même message « Identifiant ou mot de passe incorrect » que le compte existe ou non.
      - Ne jamais renvoyer la trace technique en production (`app.errors.include-details=false`).
    commonMistakes: |
      - Dire « Utilisateur introuvable » ou « mot de passe incorrect » : un attaquant apprend quels comptes existent (énumération).
      - Renvoyer 400 ou 404 pour un mauvais mot de passe au lieu de 401.
      - Laisser `include-details=true` en production : la classe de l'exception et la ligne du code sont exposées.
      - Faute de frappe dans un nom de classe (`ErrorHondler`) : ça fonctionne, mais ça donne une impression de négligence.
    blocks:
      - type: text
        md: |
          Quand quelque chose se passe mal, l'API doit répondre **clairement** à Angular… sans donner
          d'indices à un attaquant. Soramfr a un bon point de départ : une classe qui centralise les erreurs.
      - type: definition
        id: def-advice
        term: "@RestControllerAdvice"
        md: |
          Un **service après-vente** commun à tous les contrôleurs. Quand une exception est lancée n'importe
          où, elle remonte jusqu'à lui, et il choisit la réponse HTTP. Chaque contrôleur n'a plus à gérer ses
          erreurs lui-même.
      - type: code
        id: code-errorhandler
        language: java
        title: "Soramfr — ErrorHondler.java (extrait)"
        code: |
          @RestControllerAdvice
          public class ErrorHondler {

              @ExceptionHandler(EntityNotFoundException.class)
              public ResponseEntity<Map<String,Object>> notFound(EntityNotFoundException ex, HttpServletRequest request){
                  return ResponseEntity.status(HttpStatus.NOT_FOUND).body(Map.of(
                      "timestamp", Instant.now(),
                      "status", HttpStatus.NOT_FOUND.value(),
                      "error", "Utilisateur introuvable",
                      "message", ex.getMessage(),
                      "path", request.getRequestURI()
                  ));
              }

              @ExceptionHandler(ValidationException.class)
              public ResponseEntity<Map<String,Object>> badRequest(ValidationException ex, HttpServletRequest request){
                  return ResponseEntity.status(HttpStatus.BAD_REQUEST).body(Map.of(
                      "status", 400, "error", "Requête invalide", "message", ex.getMessage()));
              }
          }
        lines:
          - n: 1
            note: "Cette classe surveille tous les contrôleurs."
          - n: 4
            note: "Quand une `EntityNotFoundException` est lancée…"
          - n: 6
            note: "… on répond **404** avec un JSON qui décrit l'erreur."
          - n: 9
            note: "Petit défaut : « Utilisateur introuvable » est écrit en dur, même si c'est un produit qui manque."
          - n: 10
            note: "`ex.getMessage()` : le message choisi au moment du `throw`."
          - n: 15
            note: "Les `ValidationException` (champ vide, mot de passe trop court) deviennent des **400**."
      - type: question
        ref: sor-er-q1
        review: code-errorhandler
      - type: definition
        id: def-enumeration
        term: "Énumération de comptes"
        md: |
          Une technique d'attaque : on essaie des adresses e-mail une par une et on regarde la réponse. Si
          le site dit « Utilisateur introuvable » pour les unes et « mot de passe incorrect » pour les autres,
          l'attaquant sait **quels comptes existent**. Il peut ensuite les cibler (hameçonnage, essais de mots
          de passe). C'est comme un portier qui répondrait « Madame Diallo n'habite pas ici » : il en dit trop.
      - type: compare
        left:
          title: "Soramfr aujourd'hui"
          good: false
          language: java
          code: |
            .orElseThrow(() -> new EntityNotFoundException("Utilisateur introuvable"));  // 404
            if (!encoder.matches(req.password, user.getPasswordHash())) {
                throw new ValidationException("mot de passe incorrect");                // 400
            }
        right:
          title: "Version corrigée"
          good: true
          language: java
          code: |
            .orElseThrow(() -> new InvalidCredentialsException("Identifiant ou mot de passe incorrect"));
            if (!encoder.matches(req.password, user.getPasswordHash())) {
                throw new InvalidCredentialsException("Identifiant ou mot de passe incorrect");
            }
            // + un @ExceptionHandler qui répond 401 UNAUTHORIZED
      - type: question
        ref: sor-er-q2
        review: def-enumeration
      - type: text
        md: "Exercice guidé : associe chaque exception au bon statut HTTP."
      - type: exercise
        ref: sor-ex-erreurs-guide
      - type: text
        md: |
          **Trouver et corriger un bug** : la connexion de Soramfr révèle quels comptes existent. Corrige le
          service **et** le gestionnaire d'erreurs.
      - type: exercise
        ref: sor-ex-login-erreurs
      - type: jury
        items:
          - q: "Comment gérez-vous les erreurs dans votre API ?"
            a: |
              « Avec une classe `@RestControllerAdvice` : chaque type d'exception est traduit en code HTTP et en
              JSON homogène (statut, message, chemin). Les erreurs imprévues donnent un 500 générique, et le
              détail n'est écrit que dans les journaux du serveur. »
          - q: "Pourquoi un message identique pour « compte inconnu » et « mauvais mot de passe » ?"
            a: "Pour ne pas révéler quels comptes existent. C'est une recommandation de l'OWASP contre l'énumération de comptes."
      - type: quiz
        items:
          - ref: sor-er-q3
            review: def-advice
          - ref: sor-er-q4
            review: def-enumeration
          - ref: sor-er-q5
    questions:
      - code: sor-er-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-rest
        prompt: "Dans Soramfr, quelle réponse obtient-on pour `GET /api/users/999` si ce compte n'existe pas ?"
        choices:
          - label: "404, grâce à `EntityNotFoundException` et à `ErrorHondler`"
            correct: true
            why: "Oui : le service lance l'exception, le gestionnaire la traduit en 404."
          - label: "500, car l'exception n'est pas gérée"
            correct: false
            why: "Elle est gérée par `@ExceptionHandler(EntityNotFoundException.class)`."
          - label: "200 avec un corps vide"
            correct: false
            why: "`orElseThrow` lance une exception : pas de réponse 200."
        explanation: "Exception lancée dans le service → attrapée par `@RestControllerAdvice` → réponse 404 en JSON."
      - code: sor-er-q2
        kind: CHOIX_UNIQUE
        difficulty: 3
        skill: securite-owasp
        prompt: "Pourquoi les deux messages de connexion de Soramfr posent-ils un problème de sécurité ?"
        choices:
          - label: "Ils permettent de savoir si une adresse e-mail a un compte"
            correct: true
            why: "Oui : c'est l'énumération de comptes."
          - label: "Ils affichent le mot de passe"
            correct: false
            why: "Aucun mot de passe n'est affiché."
          - label: "Ils sont en français"
            correct: false
            why: "La langue n'a pas d'importance ici."
        explanation: "Réponse unique, statut unique (401) : l'attaquant ne peut plus distinguer les comptes existants."
      - code: sor-er-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-rest
        prompt: "Sans `@RestControllerAdvice`, il faudrait gérer les erreurs dans chaque contrôleur."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui : ou alors Spring renverrait ses réponses par défaut, peu adaptées."
          - label: "Faux"
            correct: false
            why: "Le gestionnaire centralisé évite justement de répéter ce code partout."
        explanation: "Centraliser la gestion des erreurs garantit des réponses homogènes et évite la répétition."
      - code: sor-er-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: securite-owasp
        prompt: "Quel code de statut convient pour « identifiant ou mot de passe incorrect » ?"
        choices:
          - label: "401 Unauthorized"
            correct: true
            why: "Oui : l'authentification a échoué."
          - label: "400 Bad Request"
            correct: false
            why: "La requête est bien formée ; c'est l'identité qui n'est pas prouvée."
          - label: "404 Not Found"
            correct: false
            why: "404 révélerait que le compte n'existe pas."
        explanation: "Échec d'authentification → 401, avec un message qui ne dit pas quelle information est fausse."
      - code: sor-er-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: rgpd-secrets
        prompt: "Soramfr a `app.errors.include-details=true`. Quel est le risque en production ?"
        choices:
          - label: "Les erreurs 500 exposent le nom de l'exception et la ligne du code"
            correct: true
            why: "Oui : ces indices aident un attaquant à comprendre le serveur."
          - label: "Les mots de passe apparaissent dans les réponses"
            correct: false
            why: "Ce réglage ajoute la classe de l'exception et la première ligne de la trace, pas les mots de passe."
          - label: "Aucun risque"
            correct: false
            why: "Toute information technique exposée est un risque."
        explanation: "Les détails techniques vont dans les **journaux du serveur**, jamais dans la réponse envoyée au navigateur."
    exercises:
      - slug: sor-ex-erreurs-guide
        kind: COMPLETER
        title: "Associer chaque exception à son statut"
        difficulty: FACILE
        skill: spring-rest
        statement: "Complète avec le code de statut HTTP (un nombre)."
        criteria: "Les quatre codes sont corrects."
        hints:
          - "Introuvable : quatre cent…"
          - "Doublon : conflit. Identifiants faux : non authentifié."
          - "404, 400, 409, 401."
        solution: '["404", "400", "409", "401"]'
        explanation: "Chaque situation prévue a son code. Le 500 est réservé aux erreurs **imprévues**."
        xp: 10
        payload:
          language: text
          template: |
            EntityNotFoundException ............ [[1]]
            ValidationException ................ [[2]]
            DuplicateResourceException ......... [[3]]
            InvalidCredentialsException ........ [[4]]
          blanks:
            - ["404"]
            - ["400"]
            - ["409"]
            - ["401"]
      - slug: sor-ex-login-erreurs
        kind: CORRIGER_ERREUR
        title: "Corriger la connexion qui révèle les comptes"
        difficulty: INTERMEDIAIRE
        skill: securite-owasp
        statement: |
          Ce code est celui de Soramfr. Corrige-le :
          1. dans `login`, remplace les **deux** exceptions par `InvalidCredentialsException` avec le **même**
             message : `"Identifiant ou mot de passe incorrect"` ;
          2. dans `ErrorHondler`, complète le gestionnaire pour qu'il réponde **401** (`HttpStatus.UNAUTHORIZED`).
        criteria: "Aucun message ne révèle l'existence du compte ; réponse 401 identique dans les deux cas."
        hints:
          - "Les messages « Utilisateur introuvable » et « mot de passe incorrect » doivent disparaître."
          - "`.orElseThrow(() -> new InvalidCredentialsException(\"Identifiant ou mot de passe incorrect\"))`"
          - "`return ResponseEntity.status(HttpStatus.UNAUTHORIZED).body(Map.of(\"status\", 401, \"message\", ex.getMessage()));`"
        solution: |
          public AuthResponse login(LoginRequest req) {
              UserEntity user = userRepository.findByEmailOrUsername(req.identifier, req.identifier)
                      .orElseThrow(() -> new InvalidCredentialsException("Identifiant ou mot de passe incorrect"));
              if (!encoder.matches(req.password, user.getPasswordHash())) {
                  throw new InvalidCredentialsException("Identifiant ou mot de passe incorrect");
              }
              // ... génération du jeton
          }

          // Dans ErrorHondler
          @ExceptionHandler(InvalidCredentialsException.class)
          public ResponseEntity<Map<String, Object>> unauthorized(InvalidCredentialsException ex) {
              return ResponseEntity.status(HttpStatus.UNAUTHORIZED)
                      .body(Map.of("status", 401, "message", ex.getMessage()));
          }
        explanation: |
          Compte inconnu ou mauvais mot de passe : la réponse est **strictement identique** (401, même message).
          L'attaquant ne peut plus trier les adresses. Pour aller plus loin, on limite aussi le nombre d'essais
          par minute (protection contre la force brute).
        xp: 30
        payload:
          language: java
          starter: |
            public AuthResponse login(LoginRequest req) {
                UserEntity user = userRepository.findByEmailOrUsername(req.identifier, req.identifier)
                        .orElseThrow(() -> new EntityNotFoundException("Utilisateur introuvable"));
                if (!encoder.matches(req.password, user.getPasswordHash())) {
                    throw new ValidationException("mot de passe incorrect");
                }
                // ... génération du jeton
            }

            // Dans ErrorHondler
            @ExceptionHandler(InvalidCredentialsException.class)
            public ResponseEntity<Map<String, Object>> unauthorized(InvalidCredentialsException ex) {
                // à compléter : réponse 401
            }
          checks:
            - pattern: 'Utilisateur introuvable'
              absent: true
              message: "Le message « Utilisateur introuvable » révèle que le compte n'existe pas : remplace-le."
            - pattern: 'EntityNotFoundException'
              absent: true
              message: "Pour la connexion, n'utilise plus EntityNotFoundException (elle donne un 404)."
            - pattern: 'orElseThrow\s*\(\s*\(\s*\)\s*->\s*new\s+InvalidCredentialsException\s*\(\s*"Identifiant ou mot de passe incorrect"\s*\)\s*\)'
              message: "Compte introuvable : .orElseThrow(() -> new InvalidCredentialsException(\"Identifiant ou mot de passe incorrect\"))."
            - pattern: 'matches[\s\S]*throw\s+new\s+InvalidCredentialsException\s*\(\s*"Identifiant ou mot de passe incorrect"\s*\)'
              message: "Mauvais mot de passe : throw new InvalidCredentialsException(\"Identifiant ou mot de passe incorrect\");"
            - pattern: 'ValidationException\s*\(\s*"mot de passe'
              absent: true
              message: "Le mauvais mot de passe ne doit plus lever une ValidationException (400)."
            - pattern: 'HttpStatus\.UNAUTHORIZED'
              message: "Le gestionnaire doit répondre 401 : ResponseEntity.status(HttpStatus.UNAUTHORIZED)."
            - pattern: 'unauthorized\s*\([^)]*\)\s*\{[\s\S]*return\s+ResponseEntity'
              message: "Le gestionnaire doit renvoyer une ResponseEntity."

bank:
  - code: sor-c3-b1
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: spring-structure
    prompt: "Qui crée l'objet `AuthService` utilisé par `AuthController` ?"
    choices:
      - label: "Spring, au démarrage, grâce à l'annotation `@Service`"
        correct: true
        why: "Oui : Spring crée les objets annotés et les injecte."
      - label: "Le contrôleur, avec `new AuthService()`"
        correct: false
        why: "Le contrôleur le reçoit par son constructeur."
      - label: "Angular"
        correct: false
        why: "Angular tourne dans le navigateur ; il ne crée pas d'objets Java."
    explanation: "C'est l'**inversion de contrôle** : Spring fabrique les objets et les relie entre eux (injection de dépendances)."
  - code: sor-c3-b2
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: spring-rest
    prompt: "Quelle annotation lit la valeur `42` dans `DELETE /api/users/42` ?"
    choices:
      - label: "`@PathVariable`"
        correct: true
        why: "Oui : `{id}` fait partie de l'adresse."
      - label: "`@RequestBody`"
        correct: false
        why: "`@RequestBody` lit le JSON du corps."
      - label: "`@RequestParam`"
        correct: false
        why: "`@RequestParam` lit un paramètre après `?` (`?id=42`)."
    explanation: "Adresse → `@PathVariable` ; `?cle=valeur` → `@RequestParam` ; corps JSON → `@RequestBody`."
  - code: sor-c3-b3
    kind: CHOIX_UNIQUE
    difficulty: 3
    skill: securite-owasp
    prompt: "Dans Soramfr, `UserService.toDto` fait `new UserDto(..., e.getPasswordHash())`. Quelle conséquence ?"
    choices:
