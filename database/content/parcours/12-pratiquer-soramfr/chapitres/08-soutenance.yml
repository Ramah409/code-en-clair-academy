  - code: sor-c8-b5
    kind: CHOIX_UNIQUE
    difficulty: 3
    skill: securite-owasp
    prompt: "Parmi ces défauts de Soramfr, lequel relève des « défaillances d'identification et d'authentification » (OWASP) ?"
    choices:
      - label: "Des messages de connexion qui révèlent si un compte existe"
        correct: true
        why: "Oui : ils facilitent l'énumération et la force brute."
      - label: "Le catalogue écrit en dur dans Angular"
        correct: false
        why: "C'est un choix de conception, pas une faille d'authentification."
      - label: "La faute de frappe dans ErrorHondler"
        correct: false
        why: "Aucun impact sur la sécurité."
    explanation: "Messages génériques, limitation des essais, mots de passe robustes : les parades classiques."
