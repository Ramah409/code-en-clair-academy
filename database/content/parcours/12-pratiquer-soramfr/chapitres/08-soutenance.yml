    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: uml-architecture
    prompt: "Quel diagramme UML montre les acteurs (cliente, administratrice) et ce qu'ils peuvent faire ?"
    choices:
      - label: "Le diagramme de cas d'utilisation"
        correct: true
        why: "Oui : acteurs + cas d'utilisation (s'inscrire, gérer son panier, supprimer un compte)."
      - label: "Le diagramme de classes"
        correct: false
        why: "Il montre les classes, leurs attributs et leurs liens."
      - label: "Le diagramme de séquence"
