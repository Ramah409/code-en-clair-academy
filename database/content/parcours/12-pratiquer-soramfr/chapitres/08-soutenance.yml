  - code: sor-c8-b3
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: uml-architecture
    prompt: "Quel diagramme UML représente le mieux « le voyage d'une inscription » d'Angular à PostgreSQL ?"
    choices:
      - label: "Un diagramme de séquence"
        correct: true
        why: "Oui : il montre les échanges successifs entre composant, service, contrôleur, repository et base."
