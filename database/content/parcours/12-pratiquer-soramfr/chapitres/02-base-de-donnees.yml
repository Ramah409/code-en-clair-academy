          Rappel : une utilisatrice passe **zéro ou plusieurs** commandes ; une commande est passée par **une
          seule** utilisatrice.
        criteria: "0,n — PASSER — 1,1."
        hints:
          - "Côté UTILISATEUR : zéro ou plusieurs commandes."
          - "Côté COMMANDE : exactement une utilisatrice."
          - "0,n ; PASSER ; 1,1."
        solution: '["0,n", "PASSER", "1,1"]'
        explanation: "La cardinalité se lit depuis l'entité : « une utilisatrice passe 0 ou n commandes »."
