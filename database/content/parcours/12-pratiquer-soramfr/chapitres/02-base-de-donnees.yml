bank:
  - code: sor-c2-b1
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: spring-jpa
    prompt: "Quel réglage fait créer et modifier les tables automatiquement par Hibernate dans Soramfr ?"
    choices:
      - label: "`spring.jpa.hibernate.ddl-auto=update`"
        correct: true
        why: "Oui : Hibernate compare les entités à la base et ajoute ce qui manque."
      - label: "`spring.jpa.show-sql=true`"
        correct: false
        why: "Ce réglage affiche les requêtes SQL dans la console, il ne modifie rien."
      - label: "`server.port=8080`"
        correct: false
        why: "C'est le port HTTP du backend."
    explanation: "`ddl-auto=update` est pratique en développement mais risqué en production : on préfère des migrations versionnées (Flyway) et `ddl-auto=validate`."
  - code: sor-c2-b2
    kind: CHOIX_UNIQUE
    difficulty: 1
    skill: merise-mcd
    prompt: "Dans un MCD Merise, comment repère-t-on l'identifiant d'une entité ?"
    choices:
      - label: "Il est souligné"
        correct: true
        why: "Oui : c'est la convention Merise."
      - label: "Il est écrit en rouge"
        correct: false
        why: "Aucune couleur n'est imposée par Merise."
      - label: "Il est toujours le dernier attribut"
        correct: false
        why: "La position n'a pas d'importance ; on le place souvent en premier."
    explanation: "Identifiant souligné dans le MCD ; clé primaire soulignée et clés étrangères précédées de # dans le MLD."
  - code: sor-c2-b3
    kind: VRAI_FAUX
    difficulty: 2
    skill: sql-ddl
    prompt: "Le mot de passe de la base de données de Soramfr (`postgres` par défaut) peut rester tel quel en production."
    choices:
      - label: "Vrai"
        correct: false
        why: "Non : c'est le premier mot de passe essayé par un attaquant."
      - label: "Faux"
        correct: true
        why: "Exact : en production, un mot de passe long, unique, fourni par une variable d'environnement."
    explanation: "Les secrets (mot de passe de la base, clé JWT) ne doivent être ni faibles ni écrits dans le code."
  - code: sor-c2-b4
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: merise-mld-mpd
    prompt: "Dans le MLD `commande (id_commande, date_commande, statut, #id_utilisateur)`, que signifie le `#` ?"
    choices:
      - label: "`id_utilisateur` est une clé étrangère"
        correct: true
        why: "Oui : c'est la convention d'écriture du MLD."
      - label: "`id_utilisateur` est un nombre"
        correct: false
        why: "Le `#` ne parle pas du type."
      - label: "`id_utilisateur` est facultatif"
        correct: false
        why: "Le `#` ne dit rien du caractère obligatoire."
    explanation: "MLD : clé primaire soulignée, clé étrangère précédée de `#`."
  - code: sor-c2-b5
    kind: CHOIX_UNIQUE
    difficulty: 3
    skill: merise-mcd
    prompt: "Le rapport contient une entité CONFIRMATION_DE_COMMANDE. Quelle modélisation est plus juste ?"
    choices:
      - label: "Un attribut `statut` dans COMMANDE (EN_COURS, VALIDEE…)"
        correct: true
        why: "Oui : confirmer une commande change son état, ce n'est pas une nouvelle chose à stocker."
      - label: "Une deuxième entité COMMANDE_CONFIRMEE"
        correct: false
        why: "On dupliquerait les commandes selon leur état."
      - label: "Un attribut `confirmation` dans UTILISATEUR"
        correct: false
        why: "La confirmation concerne une commande, pas une personne."
    explanation: "Une action ou un état se modélise souvent par un attribut (statut, date de validation), pas par une entité."
