      - code: sor-g-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-routage
        prompt: "Que renvoie un garde pour **refuser** l'accès à une page ?"
        choices:
          - label: "`false` (ou une redirection)"
            correct: true
            why: "Oui."
          - label: "`true`"
            correct: false
            why: "`true` autorise l'accès."
          - label: "Un code HTTP 403"
            correct: false
            why: "Un garde Angular ne renvoie pas de code HTTP ; c'est le serveur qui le fait."
        explanation: "`CanActivateFn` renvoie `true`, `false` ou un `UrlTree` (redirection)."
      - code: sor-g-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-routage
        prompt: "À quoi sert la route `{ path: '**', redirectTo: 'accueil' }` ?"
        choices:
