      - slug: sor-ex-logout
        kind: CORRIGER_ERREUR
        title: "Réparer la déconnexion de la page produits"
        difficulty: FACILE
        skill: angular-routage
        statement: |
          Corrige `ProduitsComponent` :
          1. injecte `AuthService` dans le constructeur (`private auth: AuthService`) ;
          2. `logout()` appelle simplement `this.auth.logout()`, qui efface tout et redirige.
        criteria: "La page produits utilise la déconnexion complète du service."
        hints:
          - "Ajoute `private auth: AuthService` dans les paramètres du constructeur."
          - "Supprime le `localStorage.removeItem('demoViewRole')`."
          - "`logout() { this.auth.logout(); }`"
        solution: |
          constructor(
            private ps: ProductService,
            private route: ActivatedRoute,
            private auth: AuthService
          ) {}

          logout(): void {
            this.auth.logout();
          }
        explanation: |
          La déconnexion est écrite **une seule fois**, dans `AuthService`. Tous les composants l'appellent :
          si on ajoute un jour une information à effacer, on ne modifie qu'un endroit.
        xp: 20
        payload:
          language: typescript
          starter: |
            constructor(
              private ps: ProductService,
              private route: ActivatedRoute,
              private router: Router
            ) {}

            logout() {
              localStorage.removeItem('demoViewRole');
              this.router.navigate(['/connexion']);
            }
          checks:
            - pattern: 'private\s+auth\s*:\s*AuthService'
              message: "Injecte le service : private auth: AuthService dans le constructeur."
            - pattern: 'logout\s*\(\s*\)\s*(:\s*void\s*)?\{\s*this\.auth\.logout\(\)\s*;?\s*\}'
              message: "logout() doit seulement appeler this.auth.logout();"
            - pattern: 'localStorage'
              absent: true
              message: "Le composant ne doit plus toucher lui-même à localStorage."

  # ===================================================================== LEÇON 5
  - slug: sor-panier
    title: "Le panier : un bug d'ajout et un total calculé"
    duration: 12
    objective: "Lire le composant panier, comprendre le getter total et corriger la méthode add."
    prerequisites: "Leçon « L'intercepteur, le jeton et la déconnexion »."
    skills: [angular-composants, typescript]
    xp: 25
    memo: |
      - Le panier est stocké dans `localStorage` sous forme de liste « à plat » (un élément par unité), puis regroupé en lignes `{ produits, quantite }`.
      - `get total()` : un **getter**, recalculé à chaque lecture avec `reduce`.
      - **Bug de Soramfr** : `add()` n'augmente la quantité que si le produit est **déjà** dans le panier ; sinon, il ne fait rien.
      - Le total est **calculé**, jamais stocké : il ne peut pas être faux.
    commonMistakes: |
      - Oublier le cas « l'élément n'existe pas encore » dans une fonction d'ajout.
      - Stocker le total à part : il faut penser à le mettre à jour à chaque changement.
      - `alert('commande confirmer !')` : une alerte bloquante et une faute d'accord ; préférer un message dans la page.
    blocks:
      - type: text
        md: |
          Le panier est une vraie petite mécanique. On va la lire, puis corriger une erreur de logique
          classique : oublier un cas.
      - type: definition
        id: def-getter
        term: "Getter"
        md: |
          Une méthode déguisée en propriété : on écrit `panier.total` sans parenthèses, mais le calcul se
          refait à chaque lecture. C'est une **balance de cuisine** : elle affiche toujours le poids actuel,
          on n'a jamais à le noter à la main.
      - type: definition
        id: def-reduce
        term: "reduce"
        md: |
          Parcourt une liste en **accumulant** un résultat. Comme passer à la caisse : on part de 0, et à chaque
          article on ajoute prix × quantité.
      - type: code
        id: code-panier
        language: typescript
        title: "Soramfr — panier.component.ts (extrait)"
        code: |
          panier: { produits: Product; quantite: number }[] = [];

          get total(): number {
            return this.panier.reduce((s, it) => s + it.produits.price * it.quantite, 0);
          }

          add(produits: Product): void {
            const x = this.panier.find(i => i.produits.id === produits.id);
            if (x) x.quantite++;
            this.save();
          }
        lines:
          - n: 1
            note: "Chaque ligne du panier : un produit et sa quantité."
          - n: 3
            note: "`get total()` : on lira `this.total` comme une propriété."
          - n: 4
            note: "`reduce` : `s` est la somme en cours (départ : `0`), `it` la ligne courante."
          - n: 8
            note: "`find` cherche la ligne du produit ; renvoie `undefined` si elle n'existe pas."
          - n: 9
            note: "**Le bug** : si `x` n'existe pas, rien ne se passe. Le produit n'est jamais ajouté."
      - type: question
        ref: sor-pa-q1
        review: code-panier
      - type: text
        md: "Exercice guidé : complète le calcul du total."
      - type: exercise
        ref: sor-ex-total-guide
      - type: text
        md: "**Trouver et corriger un bug** : répare `add()`."
      - type: exercise
        ref: sor-ex-panier-add
      - type: jury
        items:
          - q: "Pourquoi le total n'est-il pas stocké ?"
            a: "Parce qu'il se calcule à partir des lignes. Un getter le recalcule à chaque affichage : il est toujours juste. C'est la même idée qu'en base : on ne stocke pas une donnée calculable."
          - q: "Où est enregistré le panier ?"
            a: "« Dans le localStorage du navigateur. C'est simple, mais le panier est perdu si on change d'appareil ; l'évolution prévue est de l'enregistrer en base via une API. »"
      - type: quiz
        items:
          - ref: sor-pa-q2
            review: def-getter
          - ref: sor-pa-q3
            review: def-reduce
          - ref: sor-pa-q4
            review: code-panier
    questions:
      - code: sor-pa-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: typescript
        prompt: "Le panier contient seulement l'alarme (id 6). On appelle `add(coqueSOS)` (id 7). Que se passe-t-il ?"
        choices:
          - label: "Rien : `find` renvoie `undefined`, et aucun `else` n'ajoute la coque"
            correct: true
            why: "Oui : c'est le bug."
          - label: "La coque est ajoutée avec la quantité 1"
            correct: false
            why: "Il manque justement ce cas dans le code."
          - label: "L'alarme passe à la quantité 2"
            correct: false
            why: "`find` cherche l'id 7, pas l'id 6."
        explanation: "Toujours penser aux deux cas : l'élément existe déjà (on augmente) / il n'existe pas (on ajoute)."
      - code: sor-pa-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: typescript
        prompt: "Comment lit-on le total dans le template, avec `get total()` ?"
        choices:
          - label: "`{{ total }}`, sans parenthèses"
            correct: true
            why: "Oui : un getter se lit comme une propriété."
          - label: "`{{ total() }}`"
            correct: false
            why: "Les parenthèses sont pour une méthode classique ou un signal."
          - label: "`{{ get.total }}`"
            correct: false
            why: "`get` est un mot-clé de déclaration, pas un objet."
        explanation: "`get total()` se lit `total`."
      - code: sor-pa-q3
        kind: RESULTAT_CODE
        difficulty: 2
        skill: typescript
        prompt: "Que renvoie ce code ?"
        snippet: |
          const lignes = [{ prix: 20, quantite: 2 }, { prix: 15, quantite: 1 }];
          lignes.reduce((s, l) => s + l.prix * l.quantite, 0);
        language: typescript
        choices:
          - label: "55"
            correct: true
            why: "0 + 20 × 2 + 15 × 1 = 55."
          - label: "35"
            correct: false
            why: "C'est la somme des prix sans les quantités."
          - label: "3"
            correct: false
            why: "C'est le nombre d'articles."
        explanation: "`reduce` part de 0 et ajoute prix × quantité de chaque ligne."
      - code: sor-pa-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: typescript
        prompt: "`this.panier.find(...)` renvoie `undefined` quand aucun élément ne correspond."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui : c'est pour ça qu'il faut tester le résultat."
          - label: "Faux"
            correct: false
            why: "`find` ne lève pas d'erreur : il renvoie `undefined`."
        explanation: "Après un `find`, on gère toujours le cas `undefined`."
    exercises:
      - slug: sor-ex-total-guide
        kind: COMPLETER
        title: "Compléter le calcul du total"
        difficulty: FACILE
        skill: typescript
        statement: "Complète le getter du total."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La méthode qui accumule un résultat sur une liste."
          - "On multiplie le prix par la quantité."
          - "reduce, quantite, 0."
        solution: '["reduce", "quantite", "0"]'
        explanation: "`reduce((somme, ligne) => somme + prix × quantité, 0)` : le `0` est la valeur de départ."
        xp: 10
        payload:
          language: typescript
          template: |
            get total(): number {
              return this.panier.[[1]]((s, it) => s + it.produits.price * it.[[2]], [[3]]);
            }
          blanks:
            - ["reduce"]
            - ["quantite"]
            - ["0"]
      - slug: sor-ex-panier-add
        kind: CORRIGER_ERREUR
        title: "Réparer l'ajout au panier"
        difficulty: FACILE
        skill: typescript
        statement: |
          Corrige `add()` : si le produit est déjà dans le panier, sa quantité augmente de 1 ; **sinon**, ajoute
          une nouvelle ligne `{ produits, quantite: 1 }` avec `this.panier.push(...)`. N'oublie pas `this.save()`.
        criteria: "Les deux cas sont traités, puis le panier est sauvegardé."
        hints:
          - "Il manque un `else`."
          - "`this.panier.push({ produits, quantite: 1 });`"
          - "`if (x) { x.quantite++; } else { this.panier.push({ produits, quantite: 1 }); } this.save();`"
        solution: |
          add(produits: Product): void {
            const x = this.panier.find(i => i.produits.id === produits.id);
            if (x) {
              x.quantite++;
            } else {
              this.panier.push({ produits, quantite: 1 });
            }
            this.save();
          }
        explanation: "La fonction traite maintenant les **deux** cas. `{ produits }` est un raccourci de `{ produits: produits }`."
        xp: 20
        payload:
          language: typescript
          starter: |
            add(produits: Product): void {
              const x = this.panier.find(i => i.produits.id === produits.id);
              if (x) x.quantite++;
              this.save();
            }
          checks:
            - pattern: 'x\.quantite\s*(\+\+|\+=\s*1)'
              message: "Si le produit existe déjà, augmente sa quantité : x.quantite++."
            - pattern: 'this\.panier\.push\(\s*\{\s*produits(\s*:\s*produits)?\s*,\s*quantite\s*:\s*1\s*\}\s*\)'
              message: "Sinon, ajoute une ligne : this.panier.push({ produits, quantite: 1 })."
            - pattern: 'else'
              message: "Utilise un else pour le cas où le produit n'est pas encore dans le panier."
            - pattern: 'this\.save\(\)'
              message: "Sauvegarde le panier à la fin : this.save();"

