      - slug: sor-ex-role-guard
        kind: CORRIGER_ERREUR
        title: "Réparer roleGuard"
        difficulty: INTERMEDIAIRE
        skill: angular-routage
        statement: |
          Corrige le garde :
          1. il doit lire la clé **`roles`** déclarée dans les routes ;
          2. il ne doit plus lire `demoViewRole` : le rôle vient uniquement de `auth.getUser()`.
