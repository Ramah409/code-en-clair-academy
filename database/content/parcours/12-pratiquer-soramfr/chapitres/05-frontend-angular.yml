    exercises:
      - slug: sor-ex-intercepteur-guide
        kind: COMPLETER
        title: "Ajouter l'en-tête dans l'intercepteur"
        difficulty: FACILE
        skill: angular-routage
        statement: "Complète l'intercepteur. Respecte les majuscules."
        criteria: "Les trois trous sont corrects."
        hints:
          - "On copie la requête : méthode `clone`."
          - "Le nom de l'en-tête HTTP qui transporte le jeton."
          - "clone, Authorization, Bearer."
        solution: '["clone", "Authorization", "Bearer"]'
        explanation: "`req.clone({ setHeaders: { Authorization: `Bearer ${token}` } })` : copie de la requête avec l'en-tête."
        xp: 10
        payload:
          language: typescript
          template: |
            const authReq = token
              ? req.[[1]]({ setHeaders: { [[2]]: `[[3]] ${token}` } })
