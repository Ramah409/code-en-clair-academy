  # ===================================================================== LEÇON 4
  - slug: sor-intercepteur
    title: "L'intercepteur, le jeton et la déconnexion"
    duration: 12
    objective: "Comprendre AuthInterceptor et corriger la déconnexion incomplète de la page produits."
    prerequisites: "Leçon « Routes et gardes »."
    skills: [angular-routage, auth-jwt]
    xp: 25
    memo: |
      - Un **intercepteur** modifie **toutes** les requêtes HTTP au passage : il ajoute `Authorization: Bearer <jeton>`.
      - Il surveille aussi les réponses : sur **401**, il déconnecte et renvoie vers la connexion.
      - `AuthService.logout()` efface `currentUser`, `demoViewRole` et `token`, puis redirige.
      - **Bug de Soramfr** : `ProduitsComponent.logout()` efface seulement `demoViewRole` : le jeton et l'utilisateur restent, on est toujours « connecté ».
      - Une seule méthode de déconnexion, appelée partout.
    commonMistakes: |
      - Réécrire la déconnexion dans chaque composant au lieu d'appeler le service.
      - Considérer qu'on est connecté parce qu'une valeur existe dans `localStorage`, sans regarder si le jeton a expiré.
      - Oublier que le serveur ne sait pas que l'on s'est déconnecté (jeton encore valable).
    blocks:
      - type: text
        md: |
          Comment le jeton arrive-t-il dans chaque requête sans qu'on l'ajoute à la main ? Grâce à
          l'**intercepteur**. Et comment se déconnecte-t-on proprement ? Regardons.
      - type: definition
        id: def-intercepteur
        term: "Intercepteur HTTP"
        md: |
          Le **service courrier** de l'entreprise : chaque lettre qui sort passe par lui, et il y colle
          automatiquement le tampon officiel (le jeton). Il ouvre aussi les réponses : si l'une dit « accès
          refusé, identité inconnue » (401), il te déconnecte.
      - type: code
        id: code-interceptor
        language: typescript
        title: "Soramfr — auth.interceptor.ts (extrait)"
        code: |
          intercept(req: HttpRequest<any>, next: HttpHandler): Observable<HttpEvent<any>> {
            const token = this.auth.getToken();
            const authReq = token ? req.clone({ setHeaders: { Authorization: `Bearer ${token}` } }) : req;
            return next.handle(authReq).pipe(
              catchError((err: HttpErrorResponse) => {
                if (err.status === 401) {
                  this.auth.logout();
                }
                return throwError(() => err);
              })
            );
          }
        lines:
          - n: 2
            note: "On lit le jeton rangé dans `localStorage`."
          - n: 3
            note: "Une requête HTTP ne se modifie pas : on la **clone** en ajoutant l'en-tête."
          - n: 4
            note: "`next.handle` envoie la requête ; `pipe` permet de traiter la réponse."
          - n: 6
            note: "Sur 401 : on nettoie et on renvoie vers la connexion. (Comme Soramfr répond 403 sans jeton, ce cas n'arrive presque jamais : d'où l'intérêt du point d'entrée 401 côté serveur.)"
          - n: 9
            note: "On relance l'erreur pour que le composant puisse aussi l'afficher."
      - type: question
        ref: sor-i-q1
        review: code-interceptor
      - type: compare
        left:
          title: "Soramfr — AuthService.logout()"
          good: true
          language: typescript
          code: |
            logout(): void {
              localStorage.removeItem(this.KEY_USER);
              localStorage.removeItem(this.KEY_VIEW);
              localStorage.removeItem(this.KEY_TOKEN);
              this.router.navigate(['/connexion']);
            }
        right:
          title: "Soramfr — ProduitsComponent.logout()"
          good: false
          language: typescript
          code: |
            logout(){
              localStorage.removeItem('demoViewRole');
              this.router.navigate(['/connexion']);
            }
      - type: callout
        variant: warning
        title: "Le bug"
        md: |
          Après un clic sur « Se déconnecter » dans la page produits, `token` et `currentUser` restent dans
          le navigateur. `isLoggedIn()` répond toujours `true`. Sur un ordinateur partagé, la personne suivante
          retrouve la session ouverte.
      - type: question
        ref: sor-i-q2
        review: code-interceptor
      - type: text
        md: "Exercice guidé : complète l'ajout de l'en-tête dans l'intercepteur."
      - type: exercise
        ref: sor-ex-intercepteur-guide
      - type: text
        md: "**Trouver et corriger un bug** : répare la déconnexion de la page produits."
      - type: exercise
        ref: sor-ex-logout
      - type: jury
        items:
          - q: "À quoi sert votre intercepteur ?"
            a: "À ajouter automatiquement l'en-tête `Authorization: Bearer` à chaque requête, et à déconnecter l'utilisateur si le serveur répond 401."
          - q: "Que se passe-t-il à la déconnexion ?"
            a: |
              « Le jeton et les informations de l'utilisateur sont effacés du navigateur, puis on revient à la
              page de connexion. Le jeton reste techniquement valable jusqu'à son expiration : une amélioration
              serait une révocation côté serveur. »
      - type: quiz
        items:
          - ref: sor-i-q3
            review: def-intercepteur
          - ref: sor-i-q4
            review: code-interceptor
          - ref: sor-i-q5
    questions:
      - code: sor-i-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-routage
        prompt: "Pourquoi l'intercepteur utilise-t-il `req.clone(...)` ?"
        choices:
          - label: "Parce qu'une requête HTTP d'Angular ne peut pas être modifiée : on en crée une copie modifiée"
            correct: true
            why: "Oui : les objets `HttpRequest` sont immuables."
          - label: "Pour envoyer la requête deux fois"
            correct: false
            why: "Seule la copie est envoyée."
          - label: "Pour sauvegarder la requête dans `localStorage`"
            correct: false
            why: "Rien n'est sauvegardé."
        explanation: "Immuabilité : on ne modifie pas, on copie en changeant ce qu'on veut."
      - code: sor-i-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-routage
        prompt: "Après le `logout()` de la page produits, que répond `auth.isLoggedIn()` ?"
        choices:
          - label: "`true`, car `currentUser` est toujours dans `localStorage`"
            correct: true
            why: "Oui : seule `demoViewRole` a été effacée."
          - label: "`false`"
            correct: false
            why: "`isLoggedIn` regarde aussi `currentUser`, qui n'a pas été effacé."
          - label: "Une erreur"
            correct: false
            why: "La méthode fonctionne, mais avec un résultat trompeur."
        explanation: "Une déconnexion doit tout effacer : on appelle `auth.logout()`, écrit une seule fois."
      - code: sor-i-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-routage
        prompt: "À quelles requêtes s'applique un intercepteur HttpClient ?"
        choices:
          - label: "À toutes les requêtes faites avec HttpClient"
            correct: true
            why: "Oui : c'est tout son intérêt."
          - label: "Seulement à la requête de connexion"
            correct: false
            why: "Il s'applique partout."
          - label: "Seulement aux requêtes vers Google"
            correct: false
            why: "Il ne dépend pas de l'adresse, sauf si on le programme ainsi."
        explanation: "Un seul endroit pour une règle commune à toutes les requêtes."
      - code: sor-i-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-routage
        prompt: "Pourquoi l'intercepteur relance-t-il l'erreur avec `throwError(() => err)` ?"
        choices:
          - label: "Pour que le composant qui a fait l'appel puisse aussi réagir (afficher un message)"
            correct: true
            why: "Oui : sinon l'erreur serait « avalée »."
          - label: "Pour recommencer la requête"
            correct: false
            why: "Ce serait `retry`."
          - label: "Pour fermer l'application"
            correct: false
            why: "Rien ne se ferme."
        explanation: "L'intercepteur traite ce qui est commun (401) et laisse le reste au composant."
      - code: sor-i-q5
        kind: VRAI_FAUX
