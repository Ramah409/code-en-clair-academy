slug: soramfr-frontend-angular
position: 5
level: INTERMEDIAIRE
title: "Le frontend Angular de Soramfr"
summary: "Reconstruire le formulaire d'inscription, appeler l'API avec un service, protéger les pages avec des gardes, gérer le jeton et corriger les bugs du panier."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: sor-composant-inscription
    title: "TP — Reconstruire le formulaire d'inscription"
    duration: 15
    objective: "Comprendre un composant Angular (classe + template) et réécrire le formulaire d'inscription de Soramfr."
    prerequisites: "Chapitre « Découvrir Soramfr »."
    skills: [angular-composants, angular-formulaires]
    xp: 30
    memo: |
      - Un **composant** = une classe TypeScript (les données et les actions) + un **template** HTML (l'affichage).
      - `{{ variable }}` : afficher une valeur. `(evenement)="methode()"` : réagir à une action.
      - `[(ngModel)]="champ"` : lien **dans les deux sens** entre un champ du formulaire et une variable.
      - `(ngSubmit)="onSubmit()"` : appelé à l'envoi du formulaire.
      - `@if (condition) { ... }` : afficher un bloc seulement si la condition est vraie.
      - Chaque champ a une **étiquette** (`<label>`) lisible : un `placeholder` ne suffit pas.
    commonMistakes: |
      - Oublier l'attribut `name` sur un champ avec `ngModel` dans un `<form>` : Angular affiche une erreur.
      - Oublier d'importer `FormsModule` dans le composant.
      - Des `<label>` vides avec seulement un `placeholder` (cas de Soramfr) : les lecteurs d'écran n'annoncent rien de clair.
      - Des couleurs écrites dans `style="color: red"` : mieux vaut une classe CSS et un rôle `alert`.
    blocks:
      - type: text
        md: |
          Le formulaire d'inscription est la première chose que voit une nouvelle cliente. Tu vas comprendre
          comment Angular le construit, puis le **réécrire** toi-même, en mieux.
      - type: definition
        id: def-composant
        term: "Composant"
        md: |
          Une **brique d'écran**, comme une pièce de Lego : un formulaire, une carte produit, une barre de
          menu. Chaque composant a deux faces : une **classe** TypeScript (ce qu'il sait et ce qu'il fait) et
          un **template** HTML (ce qu'il affiche).
      - type: definition
        id: def-liaison
        term: "Liaison de données (binding)"
        md: |
          Le **fil** entre la classe et l'écran :
          - `{{ error }}` : la classe → l'écran (afficher) ;
          - `(click)="valider()"` : l'écran → la classe (réagir) ;
          - `[(ngModel)]="email"` : dans les **deux sens**. Taper dans le champ modifie `email` ; changer
            `email` dans le code modifie le champ. C'est la « boîte à double sens ».
      - type: code
        id: code-simple-form
        language: html
        title: "Exemple simple : un formulaire de newsletter"
        code: |
          <form (ngSubmit)="inscrire()">
            <label for="mail">Ton e-mail</label>
            <input id="mail" type="email" name="mail" [(ngModel)]="mail" required />
            <button type="submit">S'inscrire</button>
          </form>
          @if (merci) {
            <p role="status">Merci, {{ mail }} !</p>
          }
        lines:
          - n: 1
            note: "`(ngSubmit)` : quand on valide le formulaire, Angular appelle `inscrire()`."
          - n: 2
            note: "Une vraie étiquette, reliée au champ par `for` / `id`."
          - n: 3
            note: "`[(ngModel)]=\"mail\"` relie le champ à la variable `mail`. `name` est obligatoire dans un formulaire."
          - n: 6
            note: "`@if` : le message n'apparaît que si `merci` vaut `true`."
      - type: question
        ref: sor-fa-q1
        review: def-liaison
      - type: code
        id: code-inscription-ts
        language: typescript
        title: "Soramfr — inscription.component.ts (extrait)"
        code: |
          onSubmit(): void {
            if (this.password !== this.password2) {
              this.error = 'Les mots de passe ne correspondent pas';
              return;
            }
            if (this.password.length < 6) {
              this.error = 'Le mot de passe doit contenir au moins 6 caractères';
              return;
            }
            this.userApi.register(body).subscribe({
              next: () => this.router.navigate(['/connexion']),
              error: (err) => this.error = err?.error?.message || 'Inscription impossible'
            });
          }
        lines:
          - n: 2
            note: "`!==` : « est différent de ». Les deux mots de passe doivent être identiques."
          - n: 6
            note: "**Incohérence** : 6 caractères ici, 8 côté Spring. À aligner sur 8."
          - n: 10
            note: "`register` renvoie un Observable ; `subscribe` déclenche l'appel HTTP."
          - n: 11
            note: "`next` : la réponse est arrivée (201). Redirection vers la connexion (sans `?registered=1` : le message de bienvenue prévu ne s'affiche jamais)."
          - n: 12
            note: "`error` : on affiche le message renvoyé par le serveur (409, 400…)."
      - type: question
        ref: sor-fa-q2
        review: code-inscription-ts
      - type: text
        md: "Exercice guidé : corrige et complète `onSubmit`."
      - type: exercise
        ref: sor-ex-inscription-ts
      - type: text
        md: |
          TP en autonomie : **reconstruis le template** du formulaire d'inscription, avec de vraies étiquettes
          et un message d'erreur accessible.
      - type: exercise
        ref: sor-ex-inscription-html
      - type: jury
        items:
          - q: "Qu'est-ce qu'un composant Angular ?"
            a: "Une brique d'interface composée d'une classe TypeScript (données et méthodes) et d'un template HTML. On assemble les composants pour construire les pages."
          - q: "Quelle différence entre formulaire template (ngModel) et formulaire réactif ?"
            a: |
              « Avec `ngModel`, la logique est dans le template : simple pour de petits formulaires. Avec les
              formulaires réactifs (`FormGroup`), la structure et les validations sont dans la classe : plus
              facile à tester et à faire grandir. »
          - q: "Pourquoi vérifier le mot de passe côté Angular s'il est revérifié côté serveur ?"
            a: "Pour le confort : l'utilisatrice est prévenue tout de suite. Mais la vraie règle est côté serveur, et les deux doivent être identiques."
      - type: quiz
        items:
          - ref: sor-fa-q3
            review: def-composant
          - ref: sor-fa-q4
            review: code-simple-form
          - ref: sor-fa-q5
            review: code-inscription-ts
    questions:
      - code: sor-fa-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Que fait `[(ngModel)]=\"email\"` ?"
        choices:
          - label: "Il relie le champ et la variable `email` dans les deux sens"
            correct: true
            why: "Oui : taper met à jour la variable, et inversement."
          - label: "Il envoie l'e-mail au serveur"
            correct: false
            why: "L'envoi se fait avec un service HTTP."
          - label: "Il vérifie que l'e-mail est valide"
            correct: false
            why: "La validation vient d'attributs comme `type=\"email\"` ou `required`."
        explanation: "`[( )]` (la « banane dans une boîte ») = liaison bidirectionnelle."
      - code: sor-fa-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-services
        prompt: "Dans `onSubmit`, quand l'appel HTTP part-il vraiment ?"
        choices:
          - label: "Au moment du `subscribe`"
            correct: true
            why: "Oui : un Observable HTTP ne fait rien tant qu'on ne s'y abonne pas."
          - label: "Dès l'appel `this.userApi.register(body)`"
            correct: false
            why: "Cet appel prépare seulement l'Observable."
          - label: "Au chargement de la page"
            correct: false
            why: "Rien n'est envoyé avant la validation du formulaire."
        explanation: "Les Observables HTTP d'Angular sont « froids » : `subscribe` déclenche la requête."
      - code: sor-fa-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-composants
        prompt: "Un composant Angular, c'est…"
        choices:
          - label: "une classe TypeScript et un template HTML qui forment une brique d'écran"
            correct: true
            why: "Oui."
          - label: "une table de la base de données"
            correct: false
            why: "Ça, c'est une entité côté Spring."
          - label: "un fichier de configuration"
            correct: false
            why: "La configuration est dans `app.config.ts`, `angular.json`…"
        explanation: "Composant = classe + template (+ styles)."
      - code: sor-fa-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: accessibilite
        prompt: "Un `placeholder` suffit à rendre un champ de formulaire accessible."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : il disparaît dès qu'on tape et n'est pas toujours lu comme une étiquette."
          - label: "Faux"
            correct: true
            why: "Exact : il faut un `<label>` associé au champ."
        explanation: "Chaque champ a une étiquette visible, reliée par `for`/`id` (ou en entourant le champ)."
      - code: sor-fa-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-formulaires
        prompt: "Quelle longueur minimale de mot de passe faut-il vérifier dans Angular ?"
        choices:
          - label: "8 caractères, comme le serveur"
            correct: true
            why: "Oui : les deux règles doivent être identiques."
          - label: "6 caractères, comme aujourd'hui"
            correct: false
            why: "Le serveur refuserait les mots de passe de 6 ou 7 caractères."
          - label: "Aucune : le serveur s'en charge"
            correct: false
            why: "Le contrôle côté Angular évite un aller-retour inutile et guide l'utilisatrice."
        explanation: "Même règle des deux côtés : Angular pour le confort, le serveur pour la sécurité."
    exercises:
      - slug: sor-ex-inscription-ts
        kind: COMPLETER
        title: "Corriger et compléter onSubmit"
        difficulty: FACILE
        skill: angular-formulaires
        statement: "Complète `onSubmit` : longueur alignée sur le serveur, appel HTTP et gestion de la réponse."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "La même longueur que dans `AuthService` côté Spring."
          - "On s'abonne à l'Observable pour lancer la requête."
          - "8, subscribe, next, error."
        solution: '["8", "subscribe", "next", "error"]'
        explanation: "`subscribe({ next, error })` : `next` reçoit la réponse réussie, `error` reçoit les erreurs HTTP (400, 409…)."
        xp: 10
        payload:
          language: typescript
          template: |
            if (this.password.length < [[1]]) {
              this.error = 'Le mot de passe doit contenir au moins 8 caractères';
              return;
            }
            this.userApi.register(body).[[2]]({
              [[3]]: () => this.router.navigate(['/connexion'], { queryParams: { registered: 1 } }),
              [[4]]: (err) => this.error = err?.error?.message || 'Inscription impossible'
            });
          blanks:
            - ["8"]
            - ["subscribe"]
            - ["next"]
            - ["error"]
      - slug: sor-ex-inscription-html
        kind: CODE_LIBRE
        title: "TP — Écrire le template d'inscription"
        difficulty: INTERMEDIAIRE
        skill: angular-formulaires
        statement: |
          Écris le template du formulaire d'inscription :
          - un `<form>` qui appelle `onSubmit()` à l'envoi ;
          - quatre champs reliés à `name`, `email`, `username`, `password`, **plus** `password2` (confirmation) ;
          - chaque champ a un attribut `name` et une **étiquette** `<label>` ;
          - le champ e-mail est de type `email`, les deux mots de passe de type `password` ;
          - un bouton de type `submit` ;
          - si `error` n'est pas vide, un paragraphe avec `role="alert"` affiche `{{ error }}`.
        criteria: "Formulaire relié à onSubmit, cinq champs liés par ngModel avec name et label, types corrects, bouton submit, erreur accessible."
        hints:
          - "`<form (ngSubmit)=\"onSubmit()\"> ... </form>`"
          - "`<label for=\"email\">E-mail</label> <input id=\"email\" type=\"email\" name=\"email\" [(ngModel)]=\"email\" required />`"
          - "`@if (error) { <p role=\"alert\">{{ error }}</p> }` et `<button type=\"submit\">Créer mon compte</button>`"
        solution: |
          @if (error) {
            <p class="erreur" role="alert">{{ error }}</p>
          }
          <form (ngSubmit)="onSubmit()">
            <label for="name">Nom complet</label>
            <input id="name" name="name" [(ngModel)]="name" required />

            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" [(ngModel)]="email" required />

            <label for="username">Pseudo</label>
            <input id="username" name="username" [(ngModel)]="username" required />

            <label for="password">Mot de passe (8 caractères minimum)</label>
            <input id="password" type="password" name="password" [(ngModel)]="password" required minlength="8" />

            <label for="password2">Confirme le mot de passe</label>
            <input id="password2" type="password" name="password2" [(ngModel)]="password2" required />

            <button type="submit">Créer mon compte</button>
          </form>
        explanation: |
          Chaque champ a une étiquette reliée par `for`/`id` : un lecteur d'écran annonce « E-mail, champ de
          saisie ». Le message d'erreur a `role="alert"` : il est lu dès qu'il apparaît. `type="email"` et
          `type="password"` adaptent le clavier sur mobile et masquent la saisie.
        xp: 35
        payload:
          language: html
          starter: |
            <!-- Message d'erreur -->

            <!-- Formulaire -->
          checks:
            - pattern: '<form[^>]*\(ngSubmit\)\s*=\s*"onSubmit\(\)"'
              message: "Le formulaire appelle onSubmit() à l'envoi : <form (ngSubmit)=\"onSubmit()\">."
            - pattern: '\[\(ngModel\)\]\s*=\s*"name"'
              message: "Il manque le champ relié à name : [(ngModel)]=\"name\"."
            - pattern: '\[\(ngModel\)\]\s*=\s*"email"'
              message: "Il manque le champ relié à email."
            - pattern: '\[\(ngModel\)\]\s*=\s*"username"'
              message: "Il manque le champ relié à username."
            - pattern: '\[\(ngModel\)\]\s*=\s*"password"'
              message: "Il manque le champ relié à password."
            - pattern: '\[\(ngModel\)\]\s*=\s*"password2"'
              message: "Il manque le champ de confirmation relié à password2."
            - pattern: '\A(?>[\s\S]*?<input\b(?=[^>]*\bname\s*=\s*"[^"]+")[^>]*>){5}'
              message: "Chaque champ avec ngModel doit avoir un attribut name."
            - pattern: '<input(?=[^>]*type\s*=\s*"email")(?=[^>]*"email")[^>]*>'
              message: "Le champ e-mail est de type email : type=\"email\"."
            - pattern: '\A(?>[\s\S]*?type\s*=\s*"password"){2}'
              message: "Les deux mots de passe sont de type password (saisie masquée)."
            - pattern: '\A(?>[\s\S]*?<label\b[^>]*>\s*[^<\s]){5}'
              message: "Chaque champ doit avoir une étiquette <label> avec un texte (cinq au total)."
            - pattern: '<button[^>]*type\s*=\s*"submit"'
              message: "Ajoute un bouton <button type=\"submit\">."
            - pattern: '@if\s*\(\s*error\s*\)\s*\{[\s\S]*role\s*=\s*"alert"[\s\S]*\{\{\s*error\s*\}\}'
              message: "Affiche l'erreur seulement si elle existe : @if (error) { <p role=\"alert\">{{ error }}</p> }."

  # ===================================================================== LEÇON 2
  - slug: sor-service-http
    title: "Appeler l'API : services, HttpClient et Observables"
    duration: 12
    objective: "Comprendre UserApiService, utiliser environment.apiUrl et supprimer l'en-tête ajouté deux fois."
    prerequisites: "Leçon « TP — Reconstruire le formulaire d'inscription »."
    skills: [angular-services]
    xp: 25
    memo: |
      - Un **service** Angular (`@Injectable({ providedIn: 'root' })`) regroupe le code partagé, comme les appels HTTP.
      - `HttpClient.post<T>(url, corps)` renvoie un **Observable** : une réponse qui arrivera plus tard.
      - L'adresse de l'API vient de `environment.apiUrl`, jamais écrite en dur.
      - L'intercepteur ajoute déjà le jeton : inutile de le rajouter dans chaque service.
    commonMistakes: |
      - Écrire `http://localhost:8080` dans le code (cas de Soramfr) : en production, l'application appelle… l'ordinateur de la cliente.
      - Ajouter l'en-tête `Authorization` à la main **et** dans l'intercepteur.
      - Oublier de s'abonner : aucune requête ne part.
      - Mettre des appels HTTP directement dans les composants au lieu d'un service.
    blocks:
      - type: text
        md: |
          Les composants ne parlent pas directement au serveur : ils passent par un **service**. Dans
          Soramfr, c'est `UserApiService`.
      - type: definition
        id: def-service-angular
        term: "Service Angular"
        md: |
          Un **employé spécialisé** que tous les composants peuvent appeler. Le formulaire d'inscription et la
          page d'administration ont tous deux besoin de parler à l'API : ils demandent au même service au lieu
          de réécrire le code chacun de leur côté.
      - type: definition
        id: def-observable
        term: "Observable"
        md: |
          Un **ticket de retrait** au pressing : tu le reçois tout de suite, le vêtement (la réponse) arrivera
          plus tard. `subscribe` revient à dire « préviens-moi quand c'est prêt, ou s'il y a un problème ».
      - type: code
        id: code-userapi
        language: typescript
        title: "Soramfr — user-api.service.ts (extrait)"
        code: |
          const HOST = 'http://localhost:8080';
          const API  = `${HOST}/api`;
          const AUTH = `${API}/auth`;

          @Injectable({ providedIn: 'root' })
          export class UserApiService {
            private readonly usersUrl = `${API}/users`;

            constructor(private http: HttpClient) {}

            register(payload: RegisterRequest): Observable<AuthResponse> {
              return this.http.post<AuthResponse>(`${AUTH}/register`, payload);
            }

            getAll(): Observable<UserDto[]> {
              return this.http.get<UserDto[]>(this.usersUrl, { headers: this.authHeaders() });
            }

            private authHeaders(): HttpHeaders {
              const token = localStorage.getItem('token');
              return token ? new HttpHeaders({ Authorization: `Bearer ${token}` }) : new HttpHeaders();
            }
          }
        lines:
          - n: 1
            note: "**Adresse écrite en dur.** `environment.ts` existe pourtant, avec `apiUrl`."
          - n: 5
            note: "`providedIn: 'root'` : un seul exemplaire du service pour toute l'application."
          - n: 9
            note: "Angular fournit `HttpClient` par le constructeur (injection de dépendances, comme dans Spring)."
          - n: 12
            note: "`post<AuthResponse>` : on annonce le type de la réponse attendue."
          - n: 16
            note: "On ajoute l'en-tête `Authorization` à la main…"
          - n: 19
            note: "…alors que `AuthInterceptor` l'ajoute déjà à **toutes** les requêtes. Double travail, deux endroits à maintenir."
      - type: question
        ref: sor-sh-q1
        review: def-observable
      - type: text
        md: "Exercice guidé : complète un service qui utilise `environment.apiUrl`."
      - type: exercise
        ref: sor-ex-service-guide
      - type: text
        md: "**Trouver et corriger un bug** : remplace l'adresse en dur et supprime l'en-tête en double."
      - type: exercise
        ref: sor-ex-userapi-env
      - type: jury
        items:
          - q: "Comment votre frontend communique-t-il avec le backend ?"
            a: "Par des services Angular qui utilisent HttpClient. Ils renvoient des Observables auxquels les composants s'abonnent. Un intercepteur ajoute le jeton à chaque requête."
          - q: "Comment gérez-vous l'adresse de l'API entre le développement et la production ?"
            a: "Avec les fichiers `environment.ts` et `environment.prod.ts` ; Angular remplace l'un par l'autre au build de production (`fileReplacements`)."
      - type: quiz
        items:
          - ref: sor-sh-q2
            review: def-service-angular
          - ref: sor-sh-q3
            review: code-userapi
          - ref: sor-sh-q4
            review: code-userapi
    questions:
      - code: sor-sh-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: angular-services
        prompt: "Que renvoie `this.http.post<AuthResponse>(...)` ?"
        choices:
          - label: "Un Observable qui fournira la réponse plus tard"
            correct: true
            why: "Oui : la réponse n'est pas encore arrivée au moment du `return`."
          - label: "Directement l'objet `AuthResponse`"
            correct: false
            why: "HTTP prend du temps : Angular ne bloque pas la page en attendant."
          - label: "Le code de statut HTTP"
            correct: false
            why: "Le statut est dans la réponse, qui arrivera via l'Observable."
        explanation: "HTTP est **asynchrone** : on reçoit un Observable, et on s'abonne pour être prévenu."
      - code: sor-sh-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: angular-services
        prompt: "Pourquoi placer les appels HTTP dans un service plutôt que dans chaque composant ?"
        choices:
          - label: "Pour les partager entre plusieurs composants et ne les écrire qu'une fois"
            correct: true
            why: "Oui : un seul endroit à modifier et à tester."
          - label: "Parce que les composants ne peuvent pas importer HttpClient"
            correct: false
            why: "Ils le pourraient, mais ce serait moins bien organisé."
          - label: "Pour que les requêtes soient plus rapides"
            correct: false
            why: "La vitesse est la même."
        explanation: "Composant = affichage ; service = logique partagée (HTTP, état…)."
      - code: sor-sh-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: docker-deploiement
        prompt: "Soramfr est déployé sur Netlify avec `HOST = 'http://localhost:8080'`. Que se passe-t-il pour une cliente ?"
        choices:
          - label: "Son navigateur essaie d'appeler un serveur sur son propre ordinateur : échec"
            correct: true
            why: "Oui : localhost désigne toujours la machine qui exécute le code, ici celle de la cliente."
          - label: "Netlify redirige automatiquement vers le bon serveur"
            correct: false
            why: "Netlify ne connaît pas l'adresse de ton backend."
          - label: "Tout fonctionne"
            correct: false
            why: "Seulement sur ton ordinateur, où le backend tourne."
        explanation: "L'adresse de l'API doit venir de `environment.apiUrl`, remplacé par l'adresse de production au build."
      - code: sor-sh-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: angular-routage
        prompt: "Si `AuthInterceptor` ajoute déjà le jeton, la méthode `authHeaders()` de `UserApiService` est inutile."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui : l'intercepteur s'applique à toutes les requêtes de HttpClient."
          - label: "Faux"
            correct: false
            why: "L'intercepteur couvre déjà ce cas."
        explanation: "Une seule responsabilité, un seul endroit : l'intercepteur."
    exercises:
      - slug: sor-ex-service-guide
        kind: COMPLETER
        title: "Un service qui utilise environment.apiUrl"
        difficulty: FACILE
        skill: angular-services
        statement: "Complète le service des produits. Respecte les majuscules."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La propriété de `environment` qui contient l'adresse du backend."
          - "Lire une liste : verbe HTTP GET, méthode `get` de HttpClient."
          - "apiUrl, get, Observable."
        solution: '["apiUrl", "get", "Observable"]'
        explanation: "`${environment.apiUrl}/api/produits` s'adapte au build ; `get<ProduitDto[]>` renvoie un `Observable<ProduitDto[]>`."
        xp: 10
        payload:
          language: typescript
          template: |
            @Injectable({ providedIn: 'root' })
            export class ProduitApiService {
              private readonly url = `${environment.[[1]]}/api/produits`;

              constructor(private http: HttpClient) {}

              lister(): [[3]]<ProduitDto[]> {
                return this.http.[[2]]<ProduitDto[]>(this.url);
              }
            }
          blanks:
            - ["apiUrl"]
            - ["get"]
            - ["Observable"]
      - slug: sor-ex-userapi-env
        kind: CORRIGER_ERREUR
        title: "Corriger UserApiService"
        difficulty: INTERMEDIAIRE
        skill: angular-services
        statement: |
          Corrige ce service de Soramfr :
          1. importe `environment` depuis `'../environments/environment'` et construis `API` avec
             `environment.apiUrl` (plus aucune adresse `localhost` en dur) ;
          2. supprime la méthode `authHeaders()` et ses utilisations : l'intercepteur ajoute déjà le jeton.
        criteria: "Adresse issue de environment.apiUrl ; plus d'en-tête ajouté à la main."
        hints:
          - "`import { environment } from '../environments/environment';`"
          - "`const API = `${environment.apiUrl}/api`;`"
          - "`return this.http.get<UserDto[]>(this.usersUrl);` sans second argument."
        solution: |
          import { Injectable } from '@angular/core';
          import { HttpClient } from '@angular/common/http';
          import { Observable } from 'rxjs';
          import { environment } from '../environments/environment';

          const API = `${environment.apiUrl}/api`;
          const AUTH = `${API}/auth`;

          @Injectable({ providedIn: 'root' })
          export class UserApiService {
            private readonly usersUrl = `${API}/users`;

            constructor(private http: HttpClient) {}

            register(payload: RegisterRequest): Observable<AuthResponse> {
              return this.http.post<AuthResponse>(`${AUTH}/register`, payload);
            }

            getAll(): Observable<UserDto[]> {
              return this.http.get<UserDto[]>(this.usersUrl);
            }

            delete(id: number): Observable<void> {
              return this.http.delete<void>(`${this.usersUrl}/${id}`);
            }
          }
        explanation: |
          L'adresse vient maintenant du fichier d'environnement : `ng build` (configuration production) la
          remplace par l'adresse Render. Le jeton est ajouté par l'intercepteur, à un seul endroit.
        xp: 30
        payload:
          language: typescript
          starter: |
            import { Injectable } from '@angular/core';
            import { HttpClient, HttpHeaders } from '@angular/common/http';
            import { Observable } from 'rxjs';

            const HOST = 'http://localhost:8080';
            const API = `${HOST}/api`;
            const AUTH = `${API}/auth`;

            @Injectable({ providedIn: 'root' })
            export class UserApiService {
              private readonly usersUrl = `${API}/users`;

              constructor(private http: HttpClient) {}

              register(payload: RegisterRequest): Observable<AuthResponse> {
                return this.http.post<AuthResponse>(`${AUTH}/register`, payload);
              }

              getAll(): Observable<UserDto[]> {
                return this.http.get<UserDto[]>(this.usersUrl, { headers: this.authHeaders() });
              }

              delete(id: number): Observable<void> {
                return this.http.delete<void>(`${this.usersUrl}/${id}`, { headers: this.authHeaders() });
              }

              private authHeaders(): HttpHeaders {
                const token = localStorage.getItem('token');
                return token ? new HttpHeaders({ Authorization: `Bearer ${token}` }) : new HttpHeaders();
              }
            }
          checks:
            - pattern: 'localhost'
              absent: true
              message: "Plus aucune adresse localhost ne doit être écrite dans le service."
            - pattern: "import\\s*\\{\\s*environment\\s*\\}\\s*from\\s*['\"]\\.\\./environments/environment['\"]"
              message: "Importe environment : import { environment } from '../environments/environment';"
            - pattern: '\$\{\s*environment\.apiUrl\s*\}'
              message: "Construis l'adresse avec ${environment.apiUrl}."
            - pattern: 'authHeaders'
              absent: true
              message: "Supprime authHeaders() et ses utilisations : l'intercepteur ajoute déjà le jeton."
            - pattern: 'localStorage'
              absent: true
              message: "Le service ne doit plus lire le jeton lui-même."
            - pattern: 'this\.http\.get<UserDto\[\]>\(\s*this\.usersUrl\s*\)'
              message: "getAll : return this.http.get<UserDto[]>(this.usersUrl);"

  # ===================================================================== LEÇON 3
  - slug: sor-guards
    title: "Routes et gardes : le bug du roleGuard"
    duration: 13
    objective: "Lire app.routes.ts, comprendre authGuard et roleGuard, puis trouver et corriger le bug qui laisse passer tout le monde."
    prerequisites: "Leçon « Appeler l'API »."
    skills: [angular-routage]
    xp: 25
    memo: |
      - Une **route** associe une adresse (`/admin`) à un composant (`AdminComponent`).
      - `canActivate: [authGuard, roleGuard]` : les gardes décident si on peut entrer.
      - `data: { roles: ['ADMIN'] }` : des informations attachées à la route, lues par le garde.
      - **Bug de Soramfr** : les routes écrivent `roles`, le garde lit `role` → la liste est toujours vide → tout le monde passe.
      - Le garde améliore l'expérience ; la vraie sécurité reste côté serveur.
    commonMistakes: |
      - Une faute de nom de clé entre la route et le garde (le bug de Soramfr).
      - Un garde qui fait confiance à une valeur modifiable à la main dans `localStorage` (`demoViewRole`).
      - Oublier la route `**` pour les adresses inconnues.
    blocks:
      - type: text
        md: |
          La page `/admin` ne doit s'ouvrir qu'aux administratrices. Soramfr a prévu un **garde** pour ça…
          mais il laisse passer tout le monde. Tu vas mener l'enquête.
      - type: definition
        id: def-route
        term: "Route"
        md: |
          Le **panneau indicateur** de l'application : « adresse `/panier` → afficher `PanierComponent` ».
          Angular change de page sans recharger le site.
      - type: definition
        id: def-garde
        term: "Garde (guard)"
        md: |
          Le **portier** d'une page. Avant d'afficher la page, Angular lui demande « je peux entrer ? ». Il
          répond `true` (entrée) ou `false` (et peut rediriger ailleurs).
      - type: code
        id: code-routes
        language: typescript
        title: "Soramfr — app.routes.ts (extrait)"
        code: |
          export const routes: Routes = [
              { path: '', redirectTo: 'accueil', pathMatch: 'full' },
              { path: 'connexion', component: ConnexionComponent },
              { path: 'produits', component: ProduitsComponent, canActivate: [authGuard, roleGuard], data: { roles: ['USER'] } },
              { path: 'admin', component: AdminComponent, canActivate: [authGuard, roleGuard], data: { roles: ['ADMIN'] } },
              { path: '**', redirectTo: 'accueil' }
          ];
        lines:
          - n: 2
            note: "L'adresse vide redirige vers l'accueil."
          - n: 4
            note: "Deux gardes, puis `data: { roles: ['USER'] }` : la liste des rôles autorisés. La clé s'appelle **`roles`**."
          - n: 5
            note: "La page admin : réservée à `['ADMIN']`."
          - n: 6
            note: "`**` : toute adresse inconnue renvoie à l'accueil."
      - type: code
        id: code-roleguard
        language: typescript
        title: "Soramfr — role.guard.ts (extrait)"
        code: |
          export const roleGuard: CanActivateFn = (route, state) => {
            const auth = inject(AuthService);
            const router = inject(Router);
            const expected = (route.data?.['role'] as Array<'ADMIN' | 'USER'>) ?? [];
            const user = auth.getUser();
            const view = (localStorage.getItem('demoViewRole') as 'ADMIN' | 'USER' | null);
            const role = (user?.role as any) ?? view ?? null;
            if (!role) {
              router.navigate(['/connexion'], { queryParams: { redirect: state.url } });
              return false;
            }
            if (expected.length && !expected.includes(role)) {
              router.navigate([role === 'ADMIN' ? '/admin' : '/produits']);
              return false;
            }
            return true;
          };
        lines:
          - n: 2
            note: "`inject(...)` : dans une fonction, on demande les services à Angular avec `inject`."
          - n: 4
            note: "Le garde lit `route.data['role']`… **sans s**. La route a écrit `roles`. Résultat : `undefined`, donc `?? []` → liste vide."
          - n: 6
            note: "Il lit aussi `demoViewRole`, une valeur que n'importe qui peut modifier dans les outils du navigateur."
          - n: 12
            note: "Avec une liste vide, `expected.length` vaut 0 : la condition est fausse… et on arrive au `return true`. **Tout le monde passe.**"
      - type: question
        ref: sor-g-q1
        review: code-roleguard
      - type: text
        md: "Exercice guidé : complète la déclaration de la route d'administration."
      - type: exercise
        ref: sor-ex-route-guide
      - type: text
        md: "**Trouver et corriger un bug** : répare `roleGuard`."
      - type: exercise
        ref: sor-ex-role-guard
      - type: jury
        items:
          - q: "Comment protégez-vous les pages côté Angular ?"
            a: "Avec des gardes `canActivate` : `authGuard` vérifie la connexion, `roleGuard` compare le rôle de l'utilisateur à la liste `roles` déclarée dans la route."
          - q: "Avez-vous rencontré des bugs ? Comment les avez-vous trouvés ?"
            a: |
              « Oui : mon garde de rôle lisait la clé `role` alors que mes routes déclaraient `roles`. La liste
              était toujours vide, donc tout le monde passait. Je l'ai trouvé en testant la page admin avec un
              compte USER, puis en affichant `route.data` dans la console. »
            tip: "Raconter un vrai bug, avec la méthode pour le trouver, montre ta démarche de développeuse."
      - type: quiz
        items:
          - ref: sor-g-q2
            review: def-garde
          - ref: sor-g-q3
            review: code-routes
          - ref: sor-g-q4
