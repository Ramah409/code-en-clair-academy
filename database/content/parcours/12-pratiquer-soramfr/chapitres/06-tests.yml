  - slug: sor-debug
    title: "Déboguer : lire une trace d'erreur et écrire de bons logs"
    duration: 12
    objective: "Trouver la cause d'une erreur dans une trace Java et remplacer les System.out par des logs sûrs."
    prerequisites: "Leçon « Tester la sécurité avec MockMvc »."
    skills: [java-exceptions, rgpd-secrets]
    xp: 25
    memo: |
      - Une **trace** (stack trace) se lit : 1) le **type** et le **message** de l'exception ; 2) la première ligne qui vient de **ton** code (`com.example.projetfind…`) ; 3) le `Caused by:` le plus bas, la cause d'origine.
      - Un **log** est un message écrit par l'application pour les équipes techniques, avec un **niveau** : ERROR, WARN, INFO, DEBUG.
      - En Java : `private static final Logger log = LoggerFactory.getLogger(MaClasse.class);` puis `log.info("Connexion de {}", identifiant);`.
      - Jamais de mot de passe, de jeton ou de donnée sensible dans les logs.
      - Soramfr fait bien : `ErrorHondler` écrit l'erreur 500 dans les logs et renvoie un message neutre.
    commonMistakes: |
      - Lire seulement la dernière ligne de la trace.
      - `e.printStackTrace()` ou `System.out.println` : pas de niveau, pas de date, impossible à filtrer.
      - Coller les valeurs dans le message (`"Connexion de " + x`) au lieu d'utiliser `{}`.
      - Écrire un mot de passe dans un log « pour déboguer ».
    blocks:
      - type: text
        md: |
          Un bug arrive toujours. Ce qui fait la différence, c'est la **méthode** pour trouver sa cause.
          On apprend à lire une trace, puis à écrire des logs utiles et sûrs.
      - type: definition
        id: def-trace
        term: "Trace d'erreur (stack trace)"
        md: |
          Le **fil d'Ariane** d'une erreur : la liste des méthodes qui s'appelaient les unes les autres au
          moment du problème, de la plus récente à la plus ancienne. On y cherche la première ligne qui vient
          de **notre** code.
      - type: code
        id: code-trace
        language: text
        title: "Une trace reçue en inscrivant deux fois le même e-mail en même temps"
        code: |
          org.springframework.dao.DataIntegrityViolationException: could not execute statement
              at org.springframework.orm.jpa.vendor.HibernateJpaDialect.convertHibernateAccessException(...)
              at com.example.projetfind.etude.service.AuthService.register(AuthService.java:99)
              at com.example.projetfind.etude.controller.AuthController.register(AuthController.java:30)
          Caused by: org.postgresql.util.PSQLException: ERROR: duplicate key value violates unique constraint "uk_users_email"
        lines:
          - n: 1
            note: "Le **type** de l'exception et son message : un problème d'intégrité des données."
          - n: 3
            note: "La première ligne de **notre** code : `AuthService.java`, ligne 99 (le `save`)."
          - n: 4
            note: "Qui l'a appelée : le contrôleur."
          - n: 5
            note: "`Caused by` : la cause d'origine. PostgreSQL a refusé un doublon d'e-mail grâce à la contrainte UNIQUE. Le service devrait traduire ce cas en 409."
      - type: question
        ref: sor-dbg-q1
        review: code-trace
      - type: definition
        id: def-log
        term: "Log (journal)"
        md: |
          Le **carnet de bord** de l'application : chaque événement important y est noté avec sa date et son
          niveau de gravité. Quand une cliente dit « ça n'a pas marché hier à 18 h », on relit le carnet.
          - `ERROR` : quelque chose a échoué ; `WARN` : situation anormale mais gérée ;
          - `INFO` : événement normal important ; `DEBUG` : détails pour le développement.
      - type: code
        id: code-log-soramfr
        language: java
        title: "Soramfr — ErrorHondler, gestion des erreurs 500"
        code: |
          private static final Logger log = LoggerFactory.getLogger(ErrorHondler.class);

          log.error("Erreur 500 sur {} {} : {}", request.getMethod(), request.getRequestURI(), ex.toString(), ex);
        lines:
          - n: 1
            note: "Un logger SLF4J, un par classe."
          - n: 3
            note: "Les `{}` sont remplacés par les valeurs, dans l'ordre. L'exception en dernier argument ajoute la trace complète au log. Le client, lui, reçoit un message neutre."
      - type: question
        ref: sor-dbg-q2
        review: def-log
      - type: text
        md: "Exercice guidé : décode la trace ci-dessus."
      - type: exercise
        ref: sor-ex-trace-guide
      - type: text
        md: "**Améliorer la sécurité et la qualité** : remplace les `System.out` du login par de vrais logs, sans donnée sensible."
      - type: exercise
        ref: sor-ex-logs
      - type: text
        md: "**En autonomie** : choisir le niveau d'un log et ce qu'on n'y écrit jamais."
      - type: exercise
        ref: sor-ex-logs-expliquer
      - type: jury
        items:
          - q: "Comment déboguez-vous une erreur 500 ?"
            a: |
              « Je relis le log du serveur : type d'exception, première ligne de mon code, puis le `Caused by`.
              Je reproduis le cas avec Postman, je pose un point d'arrêt dans l'IDE si besoin, je corrige et
              j'ajoute un test pour que le bug ne revienne pas. »
          - q: "Que ne faut-il jamais écrire dans les logs ?"
            a: "Les mots de passe, les jetons, les numéros de carte et plus largement les données personnelles non nécessaires (RGPD)."
      - type: quiz
        items:
          - ref: sor-dbg-q3
            review: def-trace
          - ref: sor-dbg-q4
            review: code-log-soramfr
          - ref: sor-dbg-q5
            review: def-log
    questions:
      - code: sor-dbg-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-exceptions
        prompt: "Dans la trace, quelle ligne indique la cause d'origine ?"
        choices:
          - label: "`Caused by: org.postgresql.util.PSQLException: ... duplicate key ...`"
            correct: true
            why: "Oui : le `Caused by` le plus bas est la cause première."
          - label: "La première ligne `DataIntegrityViolationException`"
            correct: false
            why: "C'est l'exception « enveloppe » ; la cause précise est plus bas."
          - label: "La ligne `AuthController.register`"
            correct: false
            why: "C'est seulement l'appelant."
        explanation: "Lire de haut en bas, puis descendre au dernier `Caused by`."
      - code: sor-dbg-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-exceptions
        prompt: "Quel niveau de log pour « un utilisateur a échoué à se connecter » ?"
        choices:
          - label: "WARN"
            correct: true
            why: "Oui : situation anormale, mais gérée."
          - label: "ERROR"
            correct: false
            why: "Rien n'est cassé : l'application a fait son travail en refusant."
          - label: "DEBUG"
            correct: false
            why: "C'est une information utile en production (surveillance des attaques)."
        explanation: "ERROR pour les échecs techniques, WARN pour les situations suspectes gérées, INFO pour les événements normaux."
      - code: sor-dbg-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-exceptions
        prompt: "Dans une trace, quelle ligne regarder en priorité pour trouver où intervenir dans ton code ?"
        choices:
          - label: "La première ligne qui contient ton paquet (`com.example.projetfind…`)"
            correct: true
            why: "Oui : c'est là que ton code a déclenché le problème."
          - label: "La dernière ligne de la trace"
            correct: false
            why: "Elle vient souvent du démarrage de Tomcat ou de Java."
          - label: "La ligne la plus longue"
            correct: false
            why: "La longueur ne veut rien dire."
        explanation: "Les lignes des bibliothèques (Spring, Hibernate) indiquent le chemin ; la tienne indique où agir."
      - code: sor-dbg-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-exceptions
        prompt: "Pourquoi écrire `log.info(\"Connexion de {}\", id)` plutôt que `log.info(\"Connexion de \" + id)` ?"
        choices:
          - label: "Le message n'est construit que si le niveau INFO est actif, et le format reste stable"
            correct: true
            why: "Oui : plus performant et plus lisible."
          - label: "Parce que `+` est interdit en Java"
            correct: false
            why: "`+` fonctionne, mais c'est moins efficace."
          - label: "Pour chiffrer la valeur"
            correct: false
            why: "`{}` ne chiffre rien."
        explanation: "Les `{}` de SLF4J : message paramétré, construit seulement si nécessaire."
      - code: sor-dbg-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: rgpd-secrets
        prompt: "On peut écrire le mot de passe tapé dans les logs, tant que le fichier de logs reste sur le serveur."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : les logs sont lus par plusieurs personnes, copiés, archivés…"
          - label: "Faux"
            correct: true
            why: "Exact : jamais de mot de passe dans les logs."
        explanation: "Les logs sont une fuite fréquente de données sensibles."
    exercises:
      - slug: sor-ex-trace-guide
        kind: COMPLETER
        title: "Décoder la trace"
        difficulty: FACILE
        skill: java-exceptions
        statement: "Relis la trace de la leçon et complète."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le nom de la classe de ton code qui apparaît en premier."
          - "Le numéro de ligne entre parenthèses."
          - "AuthService, 99, UNIQUE."
        solution: '["AuthService", "99", "UNIQUE"]'
        explanation: "La première ligne de notre code est `AuthService.java:99` ; la cause est la contrainte UNIQUE sur l'e-mail."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Classe de mon code en cause : [[1]]
            Numéro de ligne : [[2]]
            Contrainte de la base qui a refusé : [[3]]
          blanks:
            - ["AuthService"]
            - ["99"]
            - ["UNIQUE"]
      - slug: sor-ex-logs
        kind: CORRIGER_ERREUR
        title: "Remplacer System.out par des logs sûrs"
        difficulty: INTERMEDIAIRE
        skill: rgpd-secrets
        statement: |
          Corrige ce code de débogage :
          1. déclare `private static final Logger log = LoggerFactory.getLogger(AuthService.class);` ;
          2. remplace le premier `System.out` par `log.info("Tentative de connexion de {}", req.identifier);` ;
          3. remplace l'échec par `log.warn("Échec de connexion pour {}", req.identifier);` ;
          4. aucun mot de passe ne doit apparaître dans les logs, et plus aucun `System.out` ni `printStackTrace`.
        criteria: "Logger SLF4J déclaré, messages paramétrés, aucun mot de passe, aucun System.out."
        hints:
          - "Le logger est un champ `static final` de la classe."
          - "`log.info(\"Tentative de connexion de {}\", req.identifier);`"
          - "Supprime `req.password` de tous les messages."
        solution: |
          private static final Logger log = LoggerFactory.getLogger(AuthService.class);

          public AuthResponse login(LoginRequest req) {
              log.info("Tentative de connexion de {}", req.identifier);
              UserEntity user = userRepository.findByEmailOrUsername(req.identifier, req.identifier)
                      .orElseThrow(() -> new InvalidCredentialsException("Identifiant ou mot de passe incorrect"));
              if (!encoder.matches(req.password, user.getPasswordHash())) {
                  log.warn("Échec de connexion pour {}", req.identifier);
                  throw new InvalidCredentialsException("Identifiant ou mot de passe incorrect");
              }
              // ...
          }
        explanation: "Le log garde la trace utile (qui, quand, résultat) sans jamais contenir de secret. Les échecs répétés en WARN permettent de repérer une attaque par force brute."
        xp: 25
        payload:
          language: java
          starter: |
            public AuthResponse login(LoginRequest req) {
                System.out.println("Connexion de " + req.identifier + " avec le mot de passe " + req.password);
                UserEntity user = userRepository.findByEmailOrUsername(req.identifier, req.identifier)
                        .orElseThrow(() -> new InvalidCredentialsException("Identifiant ou mot de passe incorrect"));
                if (!encoder.matches(req.password, user.getPasswordHash())) {
                    System.out.println("ECHEC pour " + req.identifier + " / " + req.password);
                    throw new InvalidCredentialsException("Identifiant ou mot de passe incorrect");
                }
                // ...
            }
          checks:
            - pattern: 'System\.out'
              absent: true
              message: "Remplace tous les System.out par le logger."
            - pattern: 'printStackTrace'
              absent: true
              message: "N'utilise pas printStackTrace : passe l'exception au logger."
            - pattern: 'private\s+static\s+final\s+Logger\s+log\s*=\s*LoggerFactory\.getLogger\(\s*AuthService\.class\s*\)\s*;'
              message: "Déclare le logger : private static final Logger log = LoggerFactory.getLogger(AuthService.class);"
            - pattern: 'log\.info\(\s*"[^"]*\{\}[^"]*"\s*,\s*req\.identifier\s*\)'
              message: "Tentative de connexion : log.info(\"Tentative de connexion de {}\", req.identifier);"
            - pattern: 'log\.warn\(\s*"[^"]*\{\}[^"]*"\s*,\s*req\.identifier\s*\)'
              message: "Échec : log.warn(\"Échec de connexion pour {}\", req.identifier);"
            - pattern: 'log\.\w+\([^;]*password'
              absent: true
              message: "Aucun mot de passe dans les logs !"
      - slug: sor-ex-logs-expliquer
        kind: CODE_LIBRE
        title: "Choisir le bon niveau de log"
        difficulty: INTERMEDIAIRE
        skill: java-exceptions
        statement: |
          Écris trois lignes :
          - `Base inaccessible :` le niveau de log pour « la base de données ne répond plus » ;
          - `Connexion réussie :` le niveau de log pour « une cliente s'est connectée » ;
          - `Jamais :` ce qu'on n'écrit jamais dans un log.
        criteria: "ERROR ; INFO ; mot de passe ou jeton."
        hints:
          - "Une panne grave : ERROR."
          - "Un événement normal : INFO."
          - "Jamais de mot de passe ni de jeton."
        solution: |
          Base inaccessible : ERROR
          Connexion réussie : INFO
          Jamais : un mot de passe, un jeton ou une donnée sensible.
        explanation: "Le niveau dit l'importance ; le contenu ne doit rien révéler."
        xp: 15
        payload:
          language: text
          starter: |
            Base inaccessible :
            Connexion réussie :
            Jamais :
          checks:
            - pattern: '(?im)^\s*Base inaccessible\s*:[ \t]*ERROR'
              message: "Une panne grave se note en ERROR."
            - pattern: '(?im)^\s*Connexion r[ée]ussie\s*:[ \t]*INFO'
              message: "Un événement normal se note en INFO."
            - pattern: '(?im)^\s*Jamais\s*:[^\n]*(?:mot de passe|jeton|token|sensible)'
              message: "Cite le mot de passe ou le jeton."

