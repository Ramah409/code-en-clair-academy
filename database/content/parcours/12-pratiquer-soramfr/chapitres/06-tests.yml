  - slug: sor-mockmvc
    title: "Tester la sécurité avec MockMvc"
    duration: 13
    objective: "Écrire des tests d'intégration qui vérifient les codes 201, 401 et 403 des routes de Soramfr."
    prerequisites: "Leçon « Du test manuel au test unitaire »."
    skills: [spring-tests, auth-jwt]
    xp: 30
    memo: |
      - **Test d'intégration** : démarre l'application Spring (sécurité, contrôleurs, services) et envoie de fausses requêtes HTTP.
      - `@SpringBootTest` + `@AutoConfigureMockMvc` ; on injecte `MockMvc`.
      - `mockMvc.perform(get("/api/users")).andExpect(status().isUnauthorized())`.
      - `.contentType(MediaType.APPLICATION_JSON).content("{...}")` pour envoyer du JSON.
      - `.header("Authorization", "Bearer " + jeton)` pour tester avec un jeton.
      - Ces tests automatisent le scénario Postman et tournent à chaque build.
    commonMistakes: |
      - Attendre `isForbidden()` (403) pour une requête sans jeton : c'est `isUnauthorized()` (401) une fois le point d'entrée corrigé.
      - Oublier le `contentType` : Spring répond 415 (type de contenu non supporté).
      - Des tests qui dépendent de l'ordre d'exécution ou de données laissées par un autre test.
    blocks:
      - type: text
        md: |
          Postman, c'est bien, mais il faut penser à le lancer. Un test **MockMvc** rejoue les mêmes
          vérifications **automatiquement**, à chaque `mvn test`.
      - type: definition
        id: def-integration
        term: "Test d'intégration"
        md: |
          Vérifier que **plusieurs pièces fonctionnent ensemble**. Après avoir testé les freins seuls (test
          unitaire), on fait un tour de pâté de maisons avec le vélo entier. Ici : filtre JWT + règles de
          sécurité + contrôleur + service.
      - type: definition
        id: def-mockmvc
        term: "MockMvc"
        md: |
          Un **faux navigateur** fourni par Spring : il envoie des requêtes HTTP à ton application sans
          ouvrir de vrai port réseau, et te laisse vérifier la réponse.
      - type: code
        id: code-mockmvc
        language: java
        title: "Tests de sécurité de Soramfr"
        code: |
          @SpringBootTest
          @AutoConfigureMockMvc
          class SecuriteTest {

              @Autowired
              MockMvc mockMvc;

              @Test
              void listeDesComptesSansJetonRepond401() throws Exception {
                  mockMvc.perform(get("/api/users"))
                         .andExpect(status().isUnauthorized());
              }

              @Test
              void inscriptionValideRepond201() throws Exception {
                  mockMvc.perform(post("/api/auth/register")
                                  .contentType(MediaType.APPLICATION_JSON)
                                  .content("""
                                      {"name":"Awa","email":"awa@exemple.fr","username":"awa","password":"Soleil2025!"}
                                      """))
                         .andExpect(status().isCreated())
                         .andExpect(jsonPath("$.password").doesNotExist());
              }
          }
        lines:
          - n: 1
            note: "Démarre toute l'application Spring pour le test."
          - n: 2
            note: "Prépare un `MockMvc` prêt à l'emploi."
          - n: 10
            note: "`perform(get(...))` : on envoie `GET /api/users`, sans jeton."
          - n: 11
            note: "On attend **401**."
          - n: 17
            note: "On précise qu'on envoie du JSON."
          - n: 18
            note: "Un bloc de texte Java (`\"\"\"`) contient le JSON."
          - n: 22
            note: "`jsonPath(\"$.password\")` lit un champ de la réponse : il ne doit pas exister."
      - type: question
        ref: sor-mm-q1
        review: code-mockmvc
      - type: text
        md: "Exercice guidé : remets les lignes du test dans l'ordre."
      - type: exercise
        ref: sor-ex-mockmvc-ordre
      - type: text
        md: "En autonomie : écris le test qui vérifie qu'une cliente reçoit **403** sur la liste des comptes."
      - type: exercise
        ref: sor-ex-mockmvc-403
      - type: text
        md: "**Trouver l'erreur** : un test de sécurité qui accepte tout."
      - type: exercise
        ref: sor-ex-mockmvc-bug
      - type: jury
        items:
          - q: "Comment vérifiez-vous que vos routes sont bien protégées ?"
            a: "Par des tests d'intégration MockMvc : sans jeton → 401, avec un jeton USER → 403 sur les routes admin, avec un jeton ADMIN → 200. Ils tournent à chaque build."
          - q: "Quelle est la pyramide des tests ?"
            a: "Beaucoup de tests unitaires (rapides), moins de tests d'intégration, et quelques tests de bout en bout (navigateur réel), plus lents et fragiles."
      - type: quiz
        items:
          - ref: sor-mm-q2
            review: def-integration
          - ref: sor-mm-q3
