slug: soramfr-tests
position: 6
level: INTERMEDIAIRE
title: "Tester et déboguer Soramfr"
summary: "Tester l'API avec Postman, écrire de vrais tests unitaires JUnit et Mockito, un test d'intégration MockMvc, et lire une trace d'erreur."
quizQuestionCount: 10

lessons:
  # ===================================================================== LEÇON 1
  - slug: sor-postman
    title: "TP — Tester l'API avec Postman"
    duration: 14
    objective: "Construire un scénario de tests Postman complet (inscription, doublon, connexion, route protégée) avec des variables et des vérifications automatiques."
    prerequisites: "Chapitre « Sécuriser Soramfr »."
    skills: [tests-strategie, spring-rest]
    xp: 25
    memo: |
      - **Postman** envoie des requêtes HTTP à l'API sans passer par Angular.
      - Une **collection** regroupe les requêtes ; un **environnement** contient des variables (`{{baseUrl}}`, `{{token}}`).
      - Onglet **Tests** : un petit script JavaScript vérifie la réponse (`pm.test`, `pm.response.to.have.status(201)`).
      - `pm.environment.set("token", ...)` garde le jeton pour les requêtes suivantes.
      - Tester **le cas normal ET les cas d'erreur** : 201, 409, 400, 401, 403, 404.
    commonMistakes: |
      - Tester seulement le cas où tout va bien.
      - Copier-coller le jeton à la main dans chaque requête au lieu d'une variable.
      - Appeler « tests unitaires » des appels Postman (c'est ce que fait le rapport) : ce sont des tests **manuels d'API**, de niveau intégration.
    blocks:
      - type: text
        md: |
          Le rapport de Soramfr présente des captures Postman : inscription, connexion, liste des comptes.
          C'est un bon début. On va en faire un **scénario complet**, avec des vérifications automatiques.
      - type: definition
        id: def-postman
        term: "Postman"
        md: |
          Une **télécommande** pour l'API : tu choisis le verbe (GET, POST…), l'adresse, les en-têtes et le
          JSON, tu appuies sur **Send**, et tu vois la réponse brute. Pas besoin que l'interface Angular soit
          terminée pour tester le backend.
      - type: definition
        id: def-variable-postman
        term: "Variable d'environnement Postman"
        md: |
          Une **étiquette** qui remplace une valeur : `{{baseUrl}}/api/auth/login`. On change `baseUrl` une
          fois (local ou production), toutes les requêtes suivent. `{{token}}` garde le jeton reçu.
      - type: steps
        id: etapes-scenario
        title: "Le scénario de tests de Soramfr"
        items:
          - "`POST {{baseUrl}}/api/auth/register` avec un nouvel e-mail → **201**."
          - "Même requête une deuxième fois → **409** (doublon)."
          - "`POST /api/auth/register` avec un mot de passe de 5 caractères → **400**."
          - "`POST /api/auth/login` avec les bons identifiants → **200**, et on enregistre `token`."
          - "`POST /api/auth/login` avec un mauvais mot de passe → **401** (après correction)."
          - "`GET /api/users` sans jeton → **401** ; avec le jeton USER → **403** (après correction)."
      - type: code
        id: code-postman-test
        language: javascript
        title: "Onglet Tests de la requête d'inscription"
        code: |
          pm.test("Statut 201 Created", function () {
              pm.response.to.have.status(201);
          });

          pm.test("La réponse ne contient pas de mot de passe", function () {
              const data = pm.response.json();
              pm.expect(data.password).to.be.undefined;
          });
        lines:
          - n: 1
            note: "`pm.test(nom, fonction)` : un test, avec un nom lisible dans le rapport de Postman."
          - n: 2
            note: "On vérifie le code de statut."
          - n: 6
            note: "`pm.response.json()` transforme la réponse en objet JavaScript."
          - n: 7
            note: "`pm.expect(...)` : une vérification. Ici, aucun champ `password` ne doit sortir de l'API."
      - type: question
        ref: sor-pm-q1
        review: etapes-scenario
      - type: text
        md: "Exercice guidé : remets le scénario de tests dans un ordre qui fonctionne."
      - type: exercise
        ref: sor-ex-scenario-ordre
      - type: text
        md: |
          TP en autonomie : **teste avec Postman**. Écris le script de l'onglet Tests de la requête de
          connexion.
      - type: exercise
        ref: sor-ex-postman-login
      - type: text
        md: "**Trouver l'erreur** : un test Postman qui attend le mauvais code."
      - type: exercise
        ref: sor-ex-postman-bug
      - type: jury
        items:
          - q: "Comment avez-vous testé votre API ?"
            a: |
              « Avec une collection Postman : pour chaque route, le cas normal et les cas d'erreur, avec des
              scripts qui vérifient le code de statut et le contenu. Le jeton est gardé dans une variable. »
          - q: "Vos tests Postman sont-ils des tests unitaires ?"
            a: "Non : ils appellent l'application entière (HTTP, sécurité, base). Ce sont des tests d'API, de niveau intégration. Les tests unitaires testent une classe seule, avec JUnit."
            tip: "Le rapport les appelle « tests unitaires » : corrige-le toi-même devant le jury."
      - type: quiz
        items:
          - ref: sor-pm-q2
            review: def-postman
          - ref: sor-pm-q3
            review: def-variable-postman
          - ref: sor-pm-q4
            review: code-postman-test
    questions:
      - code: sor-pm-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Pourquoi envoyer deux fois la même inscription dans le scénario ?"
        choices:
          - label: "Pour vérifier que le doublon est refusé avec 409"
            correct: true
            why: "Oui : on teste un cas d'erreur prévu."
          - label: "Pour créer deux comptes identiques"
            correct: false
            why: "C'est justement ce qui doit être impossible."
          - label: "Parce que la première requête échoue toujours"
            correct: false
            why: "La première doit réussir (201)."
        explanation: "Un bon scénario teste les règles métier, donc aussi les refus."
      - code: sor-pm-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: tests-strategie
        prompt: "Postman permet de tester le backend avant que les pages Angular soient terminées."
        choices:
          - label: "Vrai"
            correct: true
            why: "Oui : il parle directement à l'API."
          - label: "Faux"
            correct: false
            why: "Postman n'a pas besoin d'Angular."
        explanation: "Le backend se teste indépendamment du frontend : c'est l'un des intérêts d'une API REST."
      - code: sor-pm-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "À quoi sert `{{token}}` dans l'en-tête `Authorization: Bearer {{token}}` ?"
        choices:
          - label: "À réutiliser automatiquement le jeton enregistré après la connexion"
            correct: true
            why: "Oui : pas de copier-coller."
          - label: "À chiffrer le jeton"
            correct: false
            why: "Postman ne chiffre rien ici."
          - label: "À générer un nouveau jeton"
            correct: false
            why: "Seul le serveur fabrique les jetons."
        explanation: "`pm.environment.set(\"token\", ...)` dans la connexion, puis `{{token}}` partout ailleurs."
      - code: sor-pm-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Que vérifie `pm.response.to.have.status(201)` ?"
        choices:
          - label: "Que le code de statut de la réponse vaut 201"
            correct: true
            why: "Oui."
          - label: "Que la réponse contient 201 caractères"
            correct: false
            why: "Il s'agit du code HTTP."
          - label: "Que la requête a pris moins de 201 ms"
            correct: false
            why: "Ce serait `pm.expect(pm.response.responseTime).to.be.below(201)`."
        explanation: "Chaque requête du scénario vérifie au minimum son code de statut."
    exercises:
      - slug: sor-ex-scenario-ordre
        kind: REMETTRE_ORDRE
        title: "Ordonner le scénario de tests"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Remets les requêtes dans un ordre où chacune a ce dont elle a besoin."
        criteria: "Le compte existe avant la connexion ; le jeton existe avant la route protégée."
        hints:
          - "On ne peut pas tester le doublon avant d'avoir créé le compte."
          - "Le jeton vient de la connexion."
          - "Inscription, doublon, connexion, route protégée."
        solution: |
          1. POST /api/auth/register → 201
          2. POST /api/auth/register (même e-mail) → 409
          3. POST /api/auth/login → 200 + enregistrer le jeton
          4. GET /api/users avec le jeton → 200 ou 403 selon le rôle
        explanation: "Chaque étape prépare la suivante : le compte, puis le jeton, puis l'accès protégé."
        xp: 10
        payload:
          language: text
          lines:
            - "POST /api/auth/register → 201"
            - "POST /api/auth/register (même e-mail) → 409"
            - "POST /api/auth/login → 200 + enregistrer le jeton"
            - "GET /api/users avec le jeton → 200 ou 403 selon le rôle"
      - slug: sor-ex-postman-login
        kind: CODE_LIBRE
        title: "TP — Script de test Postman pour la connexion"
        difficulty: INTERMEDIAIRE
        skill: tests-strategie
        statement: |
          Écris le script de l'onglet **Tests** de `POST /api/auth/login` :
          1. un test « Statut 200 » qui vérifie le code **200** ;
          2. lis la réponse avec `pm.response.json()` ;
          3. un test qui vérifie que `token` est une chaîne (`pm.expect(data.token).to.be.a('string')`) ;
          4. enregistre le jeton dans la variable d'environnement `token`.
        criteria: "Deux pm.test, le statut 200, la lecture du JSON, la vérification du jeton et son enregistrement."
        hints:
          - "`pm.test(\"Statut 200\", function () { pm.response.to.have.status(200); });`"
          - "`const data = pm.response.json();`"
          - "`pm.environment.set(\"token\", data.token);`"
        solution: |
          pm.test("Statut 200", function () {
              pm.response.to.have.status(200);
          });

          const data = pm.response.json();

          pm.test("Un jeton est renvoyé", function () {
              pm.expect(data.token).to.be.a('string');
          });

          pm.environment.set("token", data.token);
        explanation: |
          Après cette requête, toutes les suivantes peuvent utiliser `Authorization: Bearer {{token}}`. Lance
          la collection entière avec le **Collection Runner** : tu obtiens un rapport vert/rouge en un clic.
        xp: 25
        payload:
          language: javascript
          starter: |
            // Script de l'onglet Tests de POST /api/auth/login
          checks:
            - pattern: '\A(?>[\s\S]*?pm\.test\s*\(){2}'
              message: "Écris au moins deux tests avec pm.test(\"nom\", function () { ... })."
            - pattern: 'pm\.response\.to\.have\.status\(\s*200\s*\)'
              message: "Vérifie le statut : pm.response.to.have.status(200);"
            - pattern: 'pm\.response\.json\(\s*\)'
              message: "Lis la réponse : const data = pm.response.json();"
            - pattern: "pm\\.expect\\(\\s*\\w+\\.token\\s*\\)\\.to\\.be\\.a\\(\\s*['\"]string['\"]\\s*\\)"
              message: "Vérifie le jeton : pm.expect(data.token).to.be.a('string');"
            - pattern: "pm\\.environment\\.set\\(\\s*['\"]token['\"]\\s*,\\s*\\w+\\.token\\s*\\)"
              message: "Enregistre le jeton : pm.environment.set(\"token\", data.token);"

  # ===================================================================== LEÇON 2
      - slug: sor-ex-postman-bug
        kind: CORRIGER_ERREUR
        title: "Un test qui attend le mauvais code"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Ce test de l'inscription échoue alors que l'inscription fonctionne : il attend **200**, mais une
          inscription crée un compte et répond **201**. Corrige le code attendu.
        criteria: "Le test vérifie le statut 201."
        hints:
          - "Quel code répond Soramfr après une création ?"
          - "201 Created."
          - "pm.response.to.have.status(201);"
        solution: |
          pm.test("Statut 201 Created", function () {
              pm.response.to.have.status(201);
          });
        explanation: "Un test doit attendre ce que l'API promet : 201 pour une création."
        xp: 10
        payload:
          language: javascript
          starter: |
            pm.test("Statut 201 Created", function () {
                pm.response.to.have.status(200);
            });
          checks:
            - pattern: 'status\(\s*200\s*\)'
              absent: true
              message: "L'inscription ne répond pas 200."
            - pattern: 'pm\.response\.to\.have\.status\(\s*201\s*\)'
              message: "Attends le statut 201."

  - slug: sor-junit
    title: "Du test manuel au test unitaire : JUnit et Mockito"
    duration: 15
    objective: "Écrire un vrai test unitaire de AuthService.register avec JUnit 5 et Mockito."
    prerequisites: "Leçon « TP — Tester l'API avec Postman »."
    skills: [java-tests, spring-tests]
    xp: 30
    memo: |
      - **Test unitaire** : teste **une** classe, seule, en quelques millisecondes, sans base ni réseau.
      - Structure **AAA** : *Arrange* (préparer), *Act* (agir), *Assert* (vérifier).
      - `@Test` marque une méthode de test ; `assertEquals`, `assertThrows`… vérifient.
      - **Mockito** fabrique des **doublures** : `when(repo.existsByEmail("a@b.fr")).thenReturn(true)`.
      - `verify(repo, never()).save(any())` : vérifie qu'une méthode n'a **pas** été appelée.
      - Soramfr n'a que le test par défaut `contextLoads()` : c'est un point à améliorer.
    commonMistakes: |
      - Tester plusieurs choses sans rapport dans un seul test.
      - Utiliser la vraie base dans un test unitaire (lent, fragile).
      - Oublier de vérifier ce qui **ne doit pas** se passer (aucune sauvegarde en cas de doublon).
      - Des noms de tests vagues (`test1`) : le nom doit dire le comportement attendu.
    blocks:
      - type: text
        md: |
          Le dossier Soramfr contient un seul test Java : `contextLoads()`, qui vérifie que l'application
          démarre. On va écrire un **vrai** test unitaire du service d'inscription.
      - type: definition
        id: def-test-unitaire
        term: "Test unitaire"
        md: |
          Tester **une pièce seule**, comme on teste les freins d'un vélo sur un banc, sans partir en balade.
          C'est rapide et précis : si le test échoue, on sait exactement quelle pièce est en cause.
      - type: definition
        id: def-mock
        term: "Mock (doublure)"
        md: |
          Un **cascadeur** qui remplace l'acteur. Pour tester `AuthService` sans base, on lui donne un faux
          `UserRepository` dont on programme les réponses : « si on te demande si cet e-mail existe, réponds
          oui ». Mockito fabrique ces doublures.
      - type: code
        id: code-test-simple
        language: java
        title: "Exemple simple : tester l'ajout au panier"
        code: |
          class PanierTest {

              @Test
              void ajouterUnProduitLeMetDansLePanier() {
                  Panier panier = new Panier();
                  Produit alarme = new Produit("Alarme de poche");

                  panier.ajouter(alarme);

                  assertTrue(panier.contient(alarme));
              }
          }
        lines:
          - n: 3
            note: "`@Test` : JUnit exécutera cette méthode."
          - n: 4
            note: "Le nom décrit le comportement attendu, en français si tu veux."
          - n: 5
            note: "**Arrange** : on prépare un panier vide et un produit."
          - n: 8
            note: "**Act** : on appelle la méthode testée."
          - n: 10
            note: "**Assert** : on vérifie le résultat. Si l'alarme n'est pas dans le panier, le test échoue."
      - type: question
        ref: sor-ju-q1
        review: def-test-unitaire
      - type: code
        id: code-test-authservice
        language: java
        title: "Tester AuthService.register avec Mockito"
        code: |
          @ExtendWith(MockitoExtension.class)
          class AuthServiceTest {

              @Mock
              UserRepository userRepository;

              @InjectMocks
              AuthService authService;

              @Test
              void registerHacheLeMotDePasse() {
                  RegisterRequest req = requete("awa@exemple.fr");
                  when(userRepository.save(any())).thenAnswer(i -> i.getArgument(0));

                  authService.register(req);

                  ArgumentCaptor<UserEntity> captor = ArgumentCaptor.forClass(UserEntity.class);
                  verify(userRepository).save(captor.capture());
                  assertNotEquals("Soleil2025!", captor.getValue().getPasswordHash());
              }
          }
        lines:
          - n: 1
            note: "On active Mockito pour cette classe de test."
          - n: 4
            note: "`@Mock` : un faux repository, qui ne touche aucune base."
          - n: 7
            note: "`@InjectMocks` : un vrai `AuthService`, qui reçoit le faux repository."
          - n: 13
            note: "On programme la doublure : `save` renvoie l'objet qu'on lui donne."
          - n: 17
            note: "Un **capteur** récupère l'entité passée à `save`."
          - n: 19
            note: "Le hash enregistré ne doit pas être le mot de passe en clair."
      - type: question
        ref: sor-ju-q2
        review: def-mock
      - type: text
        md: "Exercice guidé : complète le test du doublon d'e-mail."
      - type: exercise
        ref: sor-ex-junit-guide
      - type: text
        md: "En autonomie : écris un test unitaire complet."
      - type: exercise
        ref: sor-ex-junit-doublon
      - type: text
        md: "**Trouver l'erreur** : une vérification à l'envers."
      - type: exercise
        ref: sor-ex-junit-bug
      - type: jury
        items:
          - q: "Quelle différence entre un test unitaire et un test d'intégration ?"
            a: "Le test unitaire vérifie une classe seule, avec des doublures pour ses dépendances. Le test d'intégration vérifie plusieurs couches ensemble (HTTP, sécurité, base)."
          - q: "Qu'est-ce qu'un mock ?"
            a: "Une doublure d'une dépendance, programmée pour renvoyer des réponses choisies. Elle permet de tester une classe sans base de données et de vérifier les appels effectués."
          - q: "Quels tests auriez-vous aimé écrire ?"
            a: "« Des tests unitaires d'AuthService (doublons, hachage, mauvais mot de passe) et des tests MockMvc sur les codes 401 et 403 des routes protégées. »"
      - type: quiz
        items:
          - ref: sor-ju-q3
            review: code-test-simple
          - ref: sor-ju-q4
            review: code-test-authservice
          - ref: sor-ju-q5
            review: def-test-unitaire
    questions:
      - code: sor-ju-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Dans quel ordre écrit-on un test selon la méthode AAA ?"
        choices:
          - label: "Préparer, agir, vérifier"
            correct: true
            why: "Oui : Arrange, Act, Assert."
          - label: "Vérifier, préparer, agir"
            correct: false
            why: "On ne peut pas vérifier avant d'avoir agi."
          - label: "Agir, agir, agir"
            correct: false
            why: "Un test sans vérification ne teste rien."
        explanation: "AAA rend chaque test lisible en trois blocs."
      - code: sor-ju-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-tests
        prompt: "Pourquoi utiliser un mock de `UserRepository` dans un test unitaire d'`AuthService` ?"
        choices:
          - label: "Pour tester le service seul, sans base de données, et choisir les réponses du repository"
            correct: true
            why: "Oui : rapide, isolé et maîtrisé."
          - label: "Pour que le test écrive dans la vraie base"
            correct: false
            why: "C'est justement ce qu'on évite."
          - label: "Parce que JUnit l'exige"
            correct: false
            why: "JUnit n'exige rien de tel."
        explanation: "Le mock isole la classe testée de ses dépendances."
      - code: sor-ju-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Quelle annotation marque une méthode de test JUnit 5 ?"
        choices:
          - label: "`@Test`"
            correct: true
            why: "Oui."
          - label: "`@Service`"
            correct: false
            why: "C'est une annotation Spring pour la logique métier."
          - label: "`@Entity`"
            correct: false
            why: "C'est une annotation JPA."
        explanation: "`@Test` (org.junit.jupiter.api.Test)."
      - code: sor-ju-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-tests
        prompt: "Que vérifie `verify(userRepository, never()).save(any())` ?"
        choices:
          - label: "Que `save` n'a jamais été appelée"
            correct: true
            why: "Oui : utile pour un doublon, où rien ne doit être enregistré."
          - label: "Que `save` a été appelée une fois"
            correct: false
            why: "Ce serait `verify(userRepository).save(any())`."
          - label: "Que la base est vide"
            correct: false
            why: "Le mock ne connaît aucune base."
        explanation: "`verify` contrôle les appels faits à une doublure ; `never()` exige zéro appel."
      - code: sor-ju-q5
        kind: VRAI_FAUX
        difficulty: 2
        skill: tests-strategie
        prompt: "Le test `contextLoads()` suffit à garantir que l'inscription de Soramfr fonctionne."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : il vérifie seulement que l'application démarre."
          - label: "Faux"
            correct: true
            why: "Exact : aucune règle métier n'est testée."
        explanation: "Il faut des tests ciblés sur chaque règle : doublons, hachage, longueur du mot de passe…"
    exercises:
      - slug: sor-ex-junit-guide
        kind: COMPLETER
        title: "Compléter le test du doublon"
        difficulty: FACILE
        skill: java-tests
        statement: "Complète le test. Respecte les majuscules."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "L'annotation d'une méthode de test."
          - "Programmer une doublure : `when(...).then…(true)`."
          - "@Test, thenReturn, assertThrows, never."
        solution: '["@Test", "thenReturn", "assertThrows", "never"]'
        explanation: "On programme le doublon, on vérifie que l'exception est levée, puis qu'aucune sauvegarde n'a eu lieu."
        xp: 10
        payload:
          language: java
          template: |
            [[1]]
            void registerRefuseUnEmailDejaUtilise() {
                when(userRepository.existsByEmail("awa@exemple.fr")).[[2]](true);

                [[3]](DuplicateResourceException.class, () -> authService.register(requete("awa@exemple.fr")));

                verify(userRepository, [[4]]()).save(any());
            }
          blanks:
            - ["@Test"]
            - ["thenReturn"]
            - ["assertThrows"]
            - ["never"]
      - slug: sor-ex-junit-doublon
        kind: CODE_LIBRE
        title: "Écrire le test « pseudo déjà utilisé »"
        difficulty: INTERMEDIAIRE
        skill: java-tests
        statement: |
          Dans `AuthServiceTest` (les champs `@Mock UserRepository userRepository` et
          `@InjectMocks AuthService authService` existent déjà), écris la méthode de test
          `registerRefuseUnPseudoDejaUtilise` :
          1. **Arrange** : l'e-mail est libre (`existsByEmail` → `false`), le pseudo `awa` est pris
             (`existsByUsername("awa")` → `true`) ;
          2. **Act + Assert** : `register` lève une `DuplicateResourceException` ;
          3. **Assert** : `save` n'a jamais été appelée.

          Une méthode utilitaire `requete(String email)` crée un `RegisterRequest` valide avec le pseudo `awa`.
        criteria: "Méthode @Test, deux doublures programmées, assertThrows sur DuplicateResourceException, verify never save."
        hints:
          - "`when(userRepository.existsByEmail(anyString())).thenReturn(false);`"
          - "`when(userRepository.existsByUsername(\"awa\")).thenReturn(true);`"
          - "`assertThrows(DuplicateResourceException.class, () -> authService.register(requete(\"awa@exemple.fr\")));` puis `verify(userRepository, never()).save(any());`"
        solution: |
          @Test
          void registerRefuseUnPseudoDejaUtilise() {
              when(userRepository.existsByEmail(anyString())).thenReturn(false);
              when(userRepository.existsByUsername("awa")).thenReturn(true);

              assertThrows(DuplicateResourceException.class,
                      () -> authService.register(requete("awa@exemple.fr")));

              verify(userRepository, never()).save(any());
          }
        explanation: |
          Le test raconte une règle métier en trois temps. S'il échoue un jour (par exemple si quelqu'un
          supprime le contrôle du pseudo), il le signale immédiatement, avant la mise en production.
        xp: 30
        payload:
          language: java
          starter: |
            // Dans la classe AuthServiceTest

          checks:
            - pattern: '@Test\s+(public\s+)?void\s+registerRefuseUnPseudoDejaUtilise\s*\(\s*\)'
              message: "Déclare la méthode : @Test void registerRefuseUnPseudoDejaUtilise() { ... }"
            - pattern: 'when\(\s*userRepository\.existsByEmail\((?:[^()]|\([^()]*\))*\)\s*\)\s*\.thenReturn\(\s*false\s*\)'
              message: "Programme l'e-mail libre : when(userRepository.existsByEmail(anyString())).thenReturn(false);"
            - pattern: 'when\(\s*userRepository\.existsByUsername\(\s*"awa"\s*\)\s*\)\s*\.thenReturn\(\s*true\s*\)'
              message: "Programme le pseudo pris : when(userRepository.existsByUsername(\"awa\")).thenReturn(true);"
            - pattern: 'assertThrows\(\s*(ErrorHondler\.)?DuplicateResourceException\.class\s*,\s*\(\s*\)\s*->\s*authService\.register\('
              message: "Vérifie l'exception : assertThrows(DuplicateResourceException.class, () -> authService.register(...));"
            - pattern: 'verify\(\s*userRepository\s*,\s*never\(\)\s*\)\s*\.save\('
              message: "Vérifie qu'aucune sauvegarde n'a eu lieu : verify(userRepository, never()).save(any());"

