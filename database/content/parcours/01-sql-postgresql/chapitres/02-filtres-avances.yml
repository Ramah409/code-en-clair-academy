slug: filtres-avances
position: 2
level: DEBUTANT
title: "Filtres avancés"
summary: "Combiner plusieurs conditions, filtrer par liste, intervalle ou motif, maîtriser la valeur NULL et transformer les données affichées."
quizQuestionCount: 15

lessons:
  # ===================================================================== LEÇON 1
  - slug: sql-and-or-not
    title: "Combiner des conditions : AND, OR, NOT"
    duration: 10
    objective: "Écrire des filtres à plusieurs conditions et maîtriser la priorité des opérateurs logiques."
    prerequisites: "Filtrer avec WHERE (chapitre 1)."
    skills: [sql-select]
    xp: 10
    memo: |
      - `AND` : les **deux** conditions doivent être vraies.
      - `OR` : **au moins une** condition doit être vraie.
      - `NOT` inverse une condition : `NOT (statut = 'ANNULEE')`.
      - Priorité : `NOT` puis `AND` puis `OR`. **Mets des parenthèses** dès que tu mélanges AND et OR.
    commonMistakes: |
      - `WHERE ville = 'Paris' OR 'Lyon'` : chaque côté du OR doit être une condition complète → `ville = 'Paris' OR ville = 'Lyon'`.
      - Oublier les parenthèses : `categorie_id = 1 OR categorie_id = 2 AND stock > 0` ne filtre le stock que pour la catégorie 2.
    blocks:
      - type: text
        md: |
          Dans la vraie vie, un filtre est rarement simple : « les produits **informatiques** **encore en
          stock** », « les commandes **livrées** **ou** **expédiées** ». SQL combine les conditions avec trois
          opérateurs logiques : `AND`, `OR` et `NOT`.
      - type: definition
        id: def-and-et
        term: "AND (et)"
        md: "La ligne est gardée si **toutes** les conditions reliées par AND sont vraies. Chaque AND ajouté rend le filtre **plus strict**."
      - type: definition
        id: def-or-ou
        term: "OR (ou)"
        md: "La ligne est gardée si **au moins une** des conditions est vraie. Chaque OR ajouté rend le filtre **plus large**."
      - type: code
        language: sql
        title: "Livres encore bien en stock"
        code: |
          SELECT nom, stock
          FROM produits
          WHERE categorie_id = 1
            AND stock > 10;
        lines:
          - n: 3
            note: "Première condition : la catégorie 1 correspond aux livres."
          - n: 4
            note: "`AND` : on ne garde que les livres **dont en plus** le stock dépasse 10. Les deux conditions doivent être vraies."
      - type: demo
        title: "Démonstration"
        md: "Exécute, puis remplace `AND` par `OR` : observe combien de lignes en plus apparaissent."
        language: sql
        code: |
          SELECT nom, categorie_id, stock
          FROM produits
          WHERE categorie_id = 1
            AND stock > 10;
      - type: question
        ref: sql-c2l1-q1
      - type: text
        md: |
          **Attention à la priorité.** Comme en mathématiques où × passe avant +, en SQL `AND` est évalué
          **avant** `OR`. Compare ces deux requêtes :
      - type: compare
        left:
          title: "Sans parenthèses (piège)"
          good: false
          language: sql
          code: |
            WHERE statut = 'LIVREE'
               OR statut = 'EXPEDIEE'
              AND date_commande >= '2025-01-01'
          md: "Comprise comme : `LIVREE` (n'importe quand) **ou** (`EXPEDIEE` **et** en 2025)."
        right:
          title: "Avec parenthèses (intention claire)"
          good: true
          language: sql
          code: |
            WHERE (statut = 'LIVREE'
                   OR statut = 'EXPEDIEE')
              AND date_commande >= '2025-01-01'
          md: "Livrées **ou** expédiées, **et** dans tous les cas passées en 2025."
      - type: question
        ref: sql-c2l1-q2
      - type: definition
        term: "NOT"
        md: "Inverse une condition. `NOT (statut = 'ANNULEE')` équivaut à `statut <> 'ANNULEE'`. Il devient très utile avec `IN`, `LIKE` ou `BETWEEN`, que tu verras juste après."
      - type: question
        ref: sql-c2l1-q3
      - type: exercise
        ref: sql-ex-commandes-2025-actives
      - type: question
        ref: sql-c2l1-q4
      - type: quiz
        items:
          - ref: sqlq-andor-1
            review: def-and-et
          - ref: sqlq-andor-2
          - ref: sqlq-andor-3
            review: def-or-ou
    questions:
      - code: sql-c2l1-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Tu remplaces `AND` par `OR` dans un filtre à deux conditions. Le nombre de lignes renvoyées…"
        choices:
          - label: "augmente ou reste identique"
            correct: true
            why: "OR accepte une ligne dès qu'une condition est vraie : le filtre est plus large."
          - label: "diminue ou reste identique"
            correct: false
            why: "C'est l'effet inverse : AND est plus strict que OR."
          - label: "reste toujours identique"
            correct: false
            why: "Les deux opérateurs n'ont pas le même sens."
        explanation: "AND = intersection (plus strict), OR = union (plus large). Les résultats d'un AND sont toujours inclus dans ceux du OR correspondant."
      - code: sql-c2l1-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Comment PostgreSQL comprend-il cette condition ?"
        snippet: |
          WHERE categorie_id = 1 OR categorie_id = 2 AND stock > 0
        language: sql
        choices:
          - label: "`categorie_id = 1 OR (categorie_id = 2 AND stock > 0)`"
            correct: true
            why: "AND est prioritaire : il est évalué avant OR."
          - label: "`(categorie_id = 1 OR categorie_id = 2) AND stock > 0`"
            correct: false
            why: "Ce serait le cas avec des parenthèses explicites autour du OR."
          - label: "La requête provoque une erreur de syntaxe"
            correct: false
            why: "Elle est valide ; c'est justement pour ça que le piège est dangereux."
        explanation: "Priorité : NOT > AND > OR. Dès que tu mélanges AND et OR, ajoute des parenthèses : ta requête exprime alors exactement ton intention."
      - code: sql-c2l1-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`WHERE NOT (prix > 50)` renvoie les mêmes lignes que `WHERE prix <= 50`."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le contraire de « strictement supérieur à 50 » est « inférieur ou égal à 50 »."
          - label: "Faux"
            correct: false
            why: "Les deux formes sont équivalentes (pour une colonne sans NULL, comme prix ici)."
        explanation: "NOT inverse la condition. Remarque : si la colonne peut être NULL, aucune des deux formes ne garde les lignes NULL (tu verras pourquoi dans la leçon sur NULL)."
      - code: sql-c2l1-q4
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Complète pour garder les employés du service 2 **ou** 3 dont le salaire dépasse 3000 €."
        snippet: |
          SELECT prenom, nom, salaire
          FROM employes
          WHERE ____ AND salaire > 3000;
        language: sql
        answers: ["(service_id = 2 OR service_id = 3)", "(service_id = 3 OR service_id = 2)", "service_id IN (2, 3)", "service_id IN (3, 2)"]
        explanation: "Il faut des **parenthèses** autour du OR (ou utiliser `IN (2, 3)`, que tu verras à la leçon suivante). Sans elles, le salaire ne serait filtré que pour le service 3."
      - code: sqlq-andor-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Avec AND, une ligne est gardée quand…
        choices:
          - label: les deux conditions sont vraies
            correct: true
            why: 'Oui : les deux à la fois.'
          - label: au moins une condition est vraie
            correct: false
            why: Ça, c'est OR.
          - label: aucune condition n'est vraie
            correct: false
            why: Ce serait NOT (a OR b).
        explanation: AND = les deux ; OR = au moins une ; NOT = le contraire.
      - code: sqlq-andor-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: Pourquoi ajouter des parenthèses dans `WHERE ville = 'Paris' AND (prix < 10 OR prix > 100)` ?
        choices:
          - label: 'Parce que AND passe avant OR : sans parenthèses, le sens change'
            correct: true
            why: "Oui : les parenthèses imposent l'ordre voulu."
          - label: Parce que SQL l'exige toujours
            correct: false
            why: Elles sont facultatives, mais changent le sens ici.
          - label: Pour accélérer la requête
            correct: false
            why: Elles ne changent pas la vitesse.
        explanation: Comme en maths (× avant +), AND est évalué avant OR. En cas de doute, mettre des parenthèses.
      - code: sqlq-andor-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: '`WHERE service_id = 2 OR service_id = 3` garde les employés des services 2 et 3.'
        choices:
          - label: Vrai
            correct: true
            why: "Oui : chaque employé est dans l'un OU l'autre."
          - label: Faux
            correct: false
            why: Avec AND, on ne trouverait personne (un employé n'est pas dans deux services).
        explanation: 'Piège classique : « les services 2 et 3 » se traduit par OR (ou IN).'
    exercises:
      - slug: sql-ex-commandes-2025-actives
        kind: SQL
        title: "Commandes 2025 livrées ou expédiées"
        difficulty: INTERMEDIAIRE
        skill: sql-select
        statement: |
          Le service logistique veut les commandes **livrées ou expédiées** passées **à partir du
          1er janvier 2025**. Affiche leur **id**, **date_commande** et **statut**, triées par date croissante.
        criteria: "3 colonnes, uniquement des commandes LIVREE ou EXPEDIEE datées de 2025, triées par date."
        hints:
          - "Il y a deux conditions sur le statut (reliées par OR) et une condition sur la date."
          - "Mets les deux conditions de statut entre parenthèses avant d'ajouter `AND date_commande >= '2025-01-01'`."
          - "`WHERE (statut = 'LIVREE' OR statut = 'EXPEDIEE') AND date_commande >= '2025-01-01' ORDER BY date_commande`"
        solution: |
          SELECT id, date_commande, statut
          FROM commandes
          WHERE (statut = 'LIVREE' OR statut = 'EXPEDIEE')
            AND date_commande >= '2025-01-01'
          ORDER BY date_commande;
        explanation: |
          Les parenthèses forcent PostgreSQL à évaluer d'abord « livrée ou expédiée », puis à appliquer la
          condition de date à **toutes** ces lignes. Sans parenthèses, les commandes livrées de 2024 seraient
          aussi renvoyées.
        xp: 15
        payload:
          mode: READ
          ordered: true

  # ===================================================================== LEÇON 2
  - slug: sql-in-between-like
    title: "Listes, intervalles et motifs : IN, BETWEEN, LIKE"
    duration: 10
    objective: "Filtrer par liste de valeurs, par intervalle et par motif de texte."
    prerequisites: "AND, OR et NOT."
    skills: [sql-select]
    xp: 10
    memo: |
      - `col IN ('a', 'b')` ≡ `col = 'a' OR col = 'b'` ; `NOT IN` pour exclure.
      - `col BETWEEN 10 AND 20` inclut les **deux bornes** (≡ `col >= 10 AND col <= 20`).
      - `LIKE` avec `%` (n'importe quelle suite de caractères) et `_` (exactement un caractère).
      - `LIKE` respecte la casse ; `ILIKE` (spécifique à PostgreSQL) l'ignore.
    commonMistakes: |
      - Croire que BETWEEN exclut les bornes.
      - Écrire `LIKE 'A*'` : le joker SQL est `%`, pas `*`.
      - Utiliser `=` avec un motif : `nom = 'A%'` cherche littéralement « A% ».
    blocks:
      - type: text
        md: |
          Écrire `ville = 'Paris' OR ville = 'Lyon' OR ville = 'Lille'` devient vite pénible. SQL propose des
          raccourcis lisibles pour les cas les plus fréquents : une **liste** de valeurs, un **intervalle**, un
          **motif** de texte.
      - type: code
        language: sql
        title: "IN : appartenir à une liste"
        code: |
          SELECT prenom, nom, ville
          FROM clients
          WHERE ville IN ('Paris', 'Lyon');
        lines:
          - n: 3
            note: "`IN (...)` garde les lignes dont la ville fait partie de la liste. C'est un raccourci pour plusieurs `OR`."
      - type: demo
        title: "Démonstration"
        md: "Ajoute `'Lille'` à la liste, puis essaie `NOT IN`."
        language: sql
        code: |
          SELECT prenom, nom, ville
          FROM clients
          WHERE ville IN ('Paris', 'Lyon');
      - type: question
        ref: sql-c2l2-q1
      - type: code
        language: sql
        title: "BETWEEN : un intervalle, bornes comprises"
        code: |
          SELECT nom, prix
          FROM produits
          WHERE prix BETWEEN 20 AND 30
          ORDER BY prix;
        lines:
          - n: 3
            note: "Garde les prix de 20 à 30 **inclus**. Équivaut à `prix >= 20 AND prix <= 30`. Fonctionne aussi avec les dates."
      - type: question
        ref: sql-c2l2-q2
      - type: definition
        id: def-like-et-ses-jokers
        term: "LIKE et ses jokers"
        md: |
          `LIKE` compare un texte à un **motif** :
          - `%` remplace **n'importe quelle suite** de caractères (même vide) ;
          - `_` remplace **exactement un** caractère.

          `'A%'` = commence par A ; `'%ine'` = finit par « ine » ; `'%sql%'` = contient « sql ».
      - type: code
        language: sql
        title: "Rechercher dans un texte"
        code: |
          SELECT nom
          FROM produits
          WHERE nom ILIKE '%jeu%';
        lines:
          - n: 3
            note: "`ILIKE` ignore les majuscules : « Jeu de société » et « jeu » sont trouvés. `'%jeu%'` = contient « jeu » n'importe où."
      - type: demo
        title: "Démonstration : une barre de recherche"
        md: "C'est ce que fait la recherche d'un site marchand. Remplace `jeu` par `sql` ou `livre`, puis essaie `LIKE` au lieu de `ILIKE`."
        language: sql
        code: |
          SELECT nom, prix
          FROM produits
          WHERE nom ILIKE '%jeu%';
      - type: question
        ref: sql-c2l2-q3
      - type: exercise
        ref: sql-ex-clients-prenom-a
      - type: question
        ref: sql-c2l2-q4
      - type: exercise
        ref: sql-ex-produits-intervalle
      - type: quiz
        items:
          - ref: sqlq-inlike-1
            review: def-like-et-ses-jokers
          - ref: sqlq-inlike-2
          - ref: sqlq-inlike-3
    questions:
      - code: sql-c2l2-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Quelle condition est équivalente à `statut IN ('EN_ATTENTE', 'EXPEDIEE')` ?"
        choices:
          - label: "`statut = 'EN_ATTENTE' OR statut = 'EXPEDIEE'`"
            correct: true
            why: "IN est un raccourci pour une série de OR sur la même colonne."
          - label: "`statut = 'EN_ATTENTE' AND statut = 'EXPEDIEE'`"
            correct: false
            why: "Une commande ne peut pas avoir deux statuts à la fois : aucune ligne ne serait renvoyée."
          - label: "`statut BETWEEN 'EN_ATTENTE' AND 'EXPEDIEE'`"
            correct: false
            why: "BETWEEN compare selon l'ordre alphabétique : ce n'est pas une liste de valeurs précises."
        explanation: "`IN (liste)` rend les requêtes plus courtes et plus lisibles que plusieurs OR."
      - code: sql-c2l2-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "`WHERE prix BETWEEN 20 AND 30` exclut un produit qui coûte exactement 30 €."
        choices:
          - label: "Vrai"
            correct: false
            why: "BETWEEN inclut les deux bornes."
          - label: "Faux"
            correct: true
            why: "Exact : 20 et 30 sont compris dans l'intervalle."
        explanation: "`BETWEEN a AND b` ≡ `>= a AND <= b`. Pour exclure une borne, écris les comparaisons toi-même."
      - code: sql-c2l2-q3
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: sql-select
        prompt: "Quels noms correspondent au motif `LIKE 'C_a%'` ? (plusieurs réponses)"
        choices:
          - label: "Chaise"
            correct: true
            why: "C, puis un caractère (h), puis a, puis n'importe quoi : ça correspond."
          - label: "Clavier mécanique"
            correct: true
            why: "C, l, a, puis la suite : ça correspond."
          - label: "Casque audio"
            correct: false
            why: "Le 3ᵉ caractère est « s », pas « a »."
          - label: "coffret"
            correct: false
            why: "LIKE respecte la casse : « c » minuscule ne correspond pas à « C »."
        explanation: "`_` remplace exactement **un** caractère, `%` une suite quelconque. Ici : C + 1 caractère + a + reste."
      - code: sql-c2l2-q4
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Complète pour trouver les clients dont l'e-mail se termine par `@exemple.fr`."
        snippet: |
          SELECT prenom, email
          FROM clients
          WHERE email LIKE ____;
        language: sql
        answers: ["'%@exemple.fr'"]
        explanation: "`%` au début signifie « n'importe quoi avant ». Le motif est un texte : il s'écrit entre apostrophes."
      - code: sqlq-inlike-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Dans LIKE, que remplace le joker `%` ?
        choices:
          - label: N'importe quelle suite de caractères, même vide
            correct: true
            why: Oui.
          - label: Exactement un caractère
            correct: false
            why: C'est le rôle de `_`.
          - label: Un chiffre seulement
            correct: false
            why: '`%` accepte tout type de caractère.'
        explanation: '`%` : zéro, un ou plusieurs caractères ; `_` : exactement un caractère.'
      - code: sqlq-inlike-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: Quelle condition trouve « clavier », « Clavier » et « CLAVIER » dans PostgreSQL ?
        choices:
          - label: "`nom ILIKE '%clavier%'`"
            correct: true
            why: 'Oui : ILIKE ignore les majuscules.'
          - label: "`nom LIKE '%clavier%'`"
            correct: false
            why: LIKE tient compte des majuscules.
          - label: "`nom = 'clavier'`"
            correct: false
            why: Il faudrait le mot exact, sans rien autour.
        explanation: ILIKE est propre à PostgreSQL ; ailleurs, on écrit `LOWER(nom) LIKE '%clavier%'`.
      - code: sqlq-inlike-3
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: '`prix BETWEEN 10 AND 20` inclut les produits à 10 € et à 20 €.'
        choices:
          - label: Vrai
            correct: true
            why: 'Oui : les bornes sont comprises.'
          - label: Faux
            correct: false
            why: BETWEEN inclut les deux bornes.
        explanation: '`BETWEEN a AND b` équivaut à `>= a AND <= b`.'
    exercises:
      - slug: sql-ex-clients-prenom-a
        kind: SQL
        title: "Clients dont le prénom commence par A"
        difficulty: FACILE
        skill: sql-select
        statement: |
          Affiche le **prénom** et le **nom** des clients dont le prénom **commence par la lettre A**.
        criteria: "2 colonnes (prenom, nom), uniquement les prénoms commençant par A."
        hints:
          - "Un filtre sur un motif de texte utilise LIKE."
          - "Le joker `%` remplace n'importe quelle suite de caractères."
          - "`WHERE prenom LIKE 'A%'`"
        solution: |
          SELECT prenom, nom
          FROM clients
          WHERE prenom LIKE 'A%';
        explanation: |
          `'A%'` signifie : un A majuscule suivi de n'importe quoi. On obtient Awa, Aminata et Alice. Avec
          `ILIKE`, les prénoms commençant par un « a » minuscule seraient aussi trouvés.
        xp: 10
        payload:
          mode: READ
          requiredKeywords:
            - pattern: "\\blike\\b|\\bilike\\b"
              message: "Utilise LIKE (ou ILIKE) pour filtrer sur un motif de texte."
      - slug: sql-ex-produits-intervalle
        kind: SQL
        title: "Petits prix dans certaines catégories"
        difficulty: INTERMEDIAIRE
        skill: sql-select
        statement: |
          Pour une vitrine « petits prix », affiche le **nom**, le **prix** et la **categorie_id** des
          produits des catégories **5 (jeux), 7 (papeterie) et 8 (jardin)** dont le prix est compris
          **entre 5 et 20 €** (bornes incluses), du moins cher au plus cher.
        criteria: "3 colonnes, catégories 5, 7 ou 8, prix de 5 à 20 € inclus, tri par prix croissant."
        hints:
          - "Utilise IN pour la liste de catégories et BETWEEN pour l'intervalle de prix."
          - "Les deux conditions se combinent avec AND."
          - "`WHERE categorie_id IN (5, 7, 8) AND prix BETWEEN 5 AND 20 ORDER BY prix`"
        solution: |
          SELECT nom, prix, categorie_id
          FROM produits
          WHERE categorie_id IN (5, 7, 8)
            AND prix BETWEEN 5 AND 20
          ORDER BY prix;
        explanation: |
          `IN (5, 7, 8)` évite trois OR entre parenthèses, et `BETWEEN 5 AND 20` inclut les deux bornes. Le tri
          final `ORDER BY prix` est croissant par défaut.
        xp: 15
        payload:
          mode: READ
          ordered: true

  # ===================================================================== LEÇON 3
  - slug: sql-null
    title: "La valeur NULL : l'absence de valeur"
    duration: 10
    objective: "Comprendre NULL, le filtrer avec IS NULL et le remplacer avec COALESCE."
    prerequisites: "WHERE et les opérateurs de comparaison."
    skills: [sql-select]
    xp: 10
    memo: |
      - `NULL` signifie « valeur inconnue ou absente », ce n'est **ni 0 ni une chaîne vide**.
      - On teste NULL avec `IS NULL` / `IS NOT NULL`, **jamais** avec `= NULL`.
      - Toute comparaison ou calcul avec NULL donne NULL (donc la ligne n'est pas gardée par WHERE).
      - `COALESCE(col, valeur)` remplace NULL par une valeur par défaut.
    commonMistakes: |
      - `WHERE ville = NULL` ne renvoie **jamais** rien.
      - Oublier les NULL dans un `<>` : `ville <> 'Paris'` n'inclut pas les clients sans ville.
      - Confondre NULL et `''` (chaîne vide) : ce sont deux valeurs différentes.
    blocks:
      - type: text
        md: |
          Trois clients n'ont pas renseigné leur ville. Que contient la colonne `ville` pour eux ? Ni un texte
          vide, ni le mot « inconnu » : elle contient **NULL**, le marqueur SQL de l'absence de valeur.
      - type: definition
        id: def-null
        term: "NULL"
        md: |
          Marqueur signifiant « valeur inconnue ou non applicable ». NULL n'est pas une valeur comme les
          autres : il n'est égal à rien, **pas même à un autre NULL**.
      - type: demo
        title: "Démonstration : le piège du = NULL"
        md: "Exécute cette requête : elle ne renvoie **aucune ligne**, alors que trois clients n'ont pas de ville. Remplace `= NULL` par `IS NULL`."
        language: sql
        code: |
          SELECT prenom, nom, ville
          FROM clients
          WHERE ville = NULL;
      - type: text
        md: |
          Pourquoi ? SQL utilise une **logique à trois valeurs** : vrai, faux et **inconnu**. Comparer quoi
          que ce soit à NULL donne « inconnu », et `WHERE` ne garde que les lignes où la condition est
          **vraie**.
      - type: code
        language: sql
        title: "Tester correctement l'absence de valeur"
        code: |
          SELECT prenom, nom
          FROM clients
          WHERE ville IS NULL;
        lines:
          - n: 3
            note: "`IS NULL` est l'opérateur prévu pour ce test. Son contraire est `IS NOT NULL`."
      - type: question
        ref: sql-c2l3-q1
      - type: definition
        id: def-coalesce
        term: "COALESCE"
        md: "Fonction qui renvoie le **premier argument non NULL**. `COALESCE(ville, 'Non renseignée')` affiche « Non renseignée » à la place de NULL."
      - type: code
        language: sql
        title: "Afficher une valeur par défaut"
        code: |
          SELECT prenom,
                 COALESCE(ville, 'Non renseignée') AS ville
          FROM clients
          ORDER BY prenom;
        lines:
          - n: 2
            note: "Si `ville` est NULL, COALESCE renvoie le texte 'Non renseignée' ; sinon la ville elle-même."
      - type: demo
        title: "Démonstration"
        language: sql
        code: |
          SELECT prenom,
                 COALESCE(ville, 'Non renseignée') AS ville
          FROM clients
          ORDER BY prenom;
      - type: question
        ref: sql-c2l3-q2
      - type: question
        ref: sql-c2l3-q3
      - type: exercise
        ref: sql-ex-avis-sans-commentaire
      - type: question
        ref: sql-c2l3-q4
      - type: quiz
        items:
          - ref: sqlq-null-1
            review: def-null
          - ref: sqlq-null-2
          - ref: sqlq-null-3
            review: def-coalesce
    questions:
      - code: sql-c2l3-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: "Comment afficher les avis **sans commentaire** (colonne `commentaire` vide de valeur) ?"
        choices:
          - label: "`WHERE commentaire IS NULL`"
            correct: true
            why: "IS NULL est le seul test fiable de l'absence de valeur."
          - label: "`WHERE commentaire = NULL`"
            correct: false
            why: "Une comparaison avec NULL vaut « inconnu » : aucune ligne n'est renvoyée."
          - label: "`WHERE commentaire = ''`"
            correct: false
            why: "La chaîne vide est une vraie valeur, différente de NULL."
          - label: "`WHERE commentaire = 0`"
            correct: false
            why: "NULL n'est pas zéro (et commentaire est un texte)."
        explanation: "Réflexe à avoir : **NULL se teste avec IS**. `= NULL` est une erreur logique silencieuse, très fréquente en examen."
      - code: sql-c2l3-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Que renvoie cette requête ?"
        snippet: |
          SELECT 10 + NULL AS total;
        language: sql
        choices:
          - label: "NULL"
            correct: true
            why: "Tout calcul impliquant NULL donne NULL : une valeur inconnue + 10 reste inconnue."
          - label: "10"
            correct: false
            why: "NULL n'est pas traité comme 0."
          - label: "Une erreur"
            correct: false
            why: "L'opération est valide, son résultat est simplement NULL."
        explanation: "NULL « contamine » les calculs. Pour traiter NULL comme 0 : `10 + COALESCE(valeur, 0)`."
      - code: sql-c2l3-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: sql-select
        prompt: "`WHERE ville <> 'Paris'` renvoie aussi les clients dont la ville est NULL."
        choices:
          - label: "Vrai"
            correct: false
            why: "`NULL <> 'Paris'` vaut « inconnu » : ces lignes sont écartées."
          - label: "Faux"
            correct: true
            why: "Pour les inclure, il faut ajouter `OR ville IS NULL`."
        explanation: "C'est un piège classique : un filtre « différent de » exclut silencieusement les NULL. Pense toujours à eux."
      - code: sql-c2l3-q4
        kind: COMPLETER_CODE
        difficulty: 1
        skill: sql-select
        prompt: "Complète pour afficher 0 au lieu de NULL dans la colonne `service_id`."
        snippet: |
          SELECT prenom, ____(service_id, 0) AS service
          FROM employes;
        language: sql
        answers: ["COALESCE"]
        explanation: "`COALESCE(a, b)` renvoie `a` s'il n'est pas NULL, sinon `b`. Il accepte autant d'arguments que nécessaire."
      - code: sqlq-null-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Que représente NULL ?
        choices:
          - label: L'absence de valeur (inconnue ou non renseignée)
            correct: true
            why: Oui.
          - label: Le nombre zéro
            correct: false
            why: 0 est une vraie valeur.
          - label: Un texte vide ''
            correct: false
            why: "'' est un texte, même vide."
        explanation: "NULL n'est ni 0, ni '' : c'est « pas de valeur »."
      - code: sqlq-null-2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Quelle condition est correcte pour trouver les clients sans ville ?
        choices:
          - label: '`WHERE ville IS NULL`'
            correct: true
            why: Oui.
          - label: '`WHERE ville = NULL`'
            correct: false
            why: 'Toute comparaison avec NULL donne « inconnu » : aucune ligne.'
          - label: "`WHERE ville = ''`"
            correct: false
            why: "'' n'est pas NULL."
        explanation: On teste NULL avec `IS NULL` / `IS NOT NULL`, jamais avec `=`.
      - code: sqlq-null-3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: Que renvoie `COALESCE(NULL, NULL, 'inconnue')` ?
        choices:
          - label: "'inconnue'"
            correct: true
            why: 'Oui : la première valeur non NULL.'
          - label: 'NULL'
            correct: false
            why: COALESCE saute les NULL.
          - label: Une erreur
            correct: false
            why: C'est un usage normal.
        explanation: 'COALESCE renvoie le premier argument non NULL : pratique pour une valeur par défaut.'
    exercises:
      - slug: sql-ex-avis-sans-commentaire
        kind: SQL
        title: "Avis sans commentaire"
        difficulty: FACILE
        skill: sql-select
        statement: |
          La responsable qualité veut relancer les clients qui ont noté un produit **sans laisser de
          commentaire**. Affiche l'**id** de l'avis, le **produit_id**, le **client_id** et la **note** de ces avis.
        criteria: "4 colonnes, uniquement les avis dont le commentaire est NULL."
        hints:
          - "L'absence de commentaire est représentée par NULL."
          - "Un test d'égalité avec NULL ne fonctionne jamais."
          - "`WHERE commentaire IS NULL`"
        solution: |
          SELECT id, produit_id, client_id, note
          FROM avis
          WHERE commentaire IS NULL;
        explanation: |
          `IS NULL` teste l'absence de valeur. Avec `= NULL`, la requête ne renverrait aucune ligne sans
          provoquer d'erreur : c'est pour cela que ce piège est si fréquent.
        xp: 10
        payload:
          mode: READ

  # ===================================================================== LEÇON 4
  - slug: sql-distinct-case-fonctions
    title: "DISTINCT, CASE et fonctions utiles"
    duration: 12
    objective: "Supprimer les doublons, classer des valeurs avec CASE et utiliser les fonctions de texte et de date les plus courantes."
    prerequisites: "SELECT, alias et calculs (chapitre 1)."
    skills: [sql-select]
    xp: 12
    memo: |
      - `SELECT DISTINCT col` supprime les lignes en double du résultat.
      - `CASE WHEN condition THEN valeur ... ELSE valeur END` crée une valeur selon des conditions.
      - Texte : `UPPER`, `LOWER`, `LENGTH`, `||` ; dates : `EXTRACT(YEAR FROM d)`, `CURRENT_DATE`, `d - INTERVAL '7 days'`.
    commonMistakes: |
      - Croire que DISTINCT s'applique à une seule colonne : il porte sur **toute la ligne** du SELECT.
      - Oublier `END` à la fin d'un CASE.
      - Oublier le ELSE : les cas non prévus deviennent NULL.
    blocks:
      - type: text
        md: |
          « Dans quelles villes avons-nous des clients ? » Si tu écris `SELECT ville FROM clients`, Paris
          apparaît six fois. Pour une liste **sans doublon**, SQL propose `DISTINCT`.
      - type: code
        language: sql
        title: "Supprimer les doublons"
        code: |
          SELECT DISTINCT ville
          FROM clients
          WHERE ville IS NOT NULL
          ORDER BY ville;
        lines:
          - n: 1
            note: "`DISTINCT` se place juste après SELECT : chaque ville n'apparaît qu'une fois."
          - n: 3
            note: "On écarte les clients sans ville pour n'afficher que de vraies villes."
      - type: demo
        title: "Démonstration"
        md: "Retire `DISTINCT` pour voir les doublons réapparaître."
        language: sql
        code: |
          SELECT DISTINCT ville
          FROM clients
          WHERE ville IS NOT NULL
          ORDER BY ville;
      - type: question
        ref: sql-c2l4-q1
      - type: definition
        id: def-case
        term: "CASE"
        md: |
          Expression conditionnelle, l'équivalent SQL du « si… alors… sinon ». Les conditions sont testées
          dans l'ordre ; la **première vraie** l'emporte.
      - type: code
        language: sql
        title: "Classer les produits par gamme de prix"
        code: |
          SELECT nom, prix,
                 CASE
                   WHEN prix < 20 THEN 'Petit prix'
                   WHEN prix < 60 THEN 'Milieu de gamme'
                   ELSE 'Premium'
                 END AS gamme
          FROM produits
          ORDER BY prix;
        lines:
          - n: 2
            note: "Début de l'expression conditionnelle."
          - n: 3
            note: "Si le prix est inférieur à 20, la gamme vaut 'Petit prix'. Les autres conditions ne sont pas testées."
          - n: 4
            note: "Sinon, si le prix est inférieur à 60 : 'Milieu de gamme'. Un produit à 15 € est déjà classé à la ligne 3."
          - n: 5
            note: "Tous les autres cas : 'Premium'."
          - n: 6
            note: "`END` ferme le CASE ; `AS gamme` nomme la colonne calculée."
      - type: demo
        title: "Démonstration"
        language: sql
        code: |
          SELECT nom, prix,
                 CASE
                   WHEN prix < 20 THEN 'Petit prix'
                   WHEN prix < 60 THEN 'Milieu de gamme'
                   ELSE 'Premium'
                 END AS gamme
          FROM produits
          ORDER BY prix;
      - type: question
        ref: sql-c2l4-q2
      - type: text
        md: |
          Quelques fonctions très utilisées :

          | Fonction | Rôle | Exemple |
          |----------|------|---------|
          | `UPPER(t)` / `LOWER(t)` | majuscules / minuscules | `UPPER(nom)` |
          | `LENGTH(t)` | nombre de caractères | `LENGTH(prenom)` |
          | `EXTRACT(YEAR FROM d)` | partie d'une date | année d'inscription |
          | `CURRENT_DATE` | date du jour | `CURRENT_DATE - date_inscription` |
          | `ROUND(n, 2)` | arrondi | `ROUND(prix * 1.2, 2)` |
      - type: question
        ref: sql-c2l4-q3
      - type: exercise
        ref: sql-ex-annees-inscription
      - type: question
        ref: sql-c2l4-q4
      - type: exercise
        ref: sql-ex-niveau-stock
      - type: quiz
        items:
          - ref: sqlq-case-1
          - ref: sqlq-case-2
            review: def-case
          - ref: sqlq-case-3
    questions:
      - code: sql-c2l4-q1
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Les clients habitent dans 9 villes différentes et 3 clients n'ont pas de ville. Combien de lignes renvoie cette requête ?"
        snippet: |
          SELECT DISTINCT ville
          FROM clients;
        language: sql
        choices:
          - label: "10"
            correct: true
            why: "Les 9 villes, plus une ligne NULL : DISTINCT regroupe tous les NULL en une seule ligne."
          - label: "9"
            correct: false
            why: "Sans filtre IS NOT NULL, la valeur NULL apparaît une fois dans le résultat."
          - label: "12"
            correct: false
            why: "DISTINCT ne conserve qu'une seule ligne NULL, pas trois."
          - label: "25"
            correct: false
            why: "Ce serait le nombre de clients sans DISTINCT."
        explanation: "Pour DISTINCT (et GROUP BY), tous les NULL sont considérés comme identiques : ils forment une seule ligne. D'où l'intérêt d'ajouter `WHERE ville IS NOT NULL`."
      - code: sql-c2l4-q2
        kind: RESULTAT_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Pour un produit à **15 €**, que vaut la colonne `gamme` ?"
        snippet: |
          CASE
            WHEN prix < 60 THEN 'Milieu de gamme'
            WHEN prix < 20 THEN 'Petit prix'
            ELSE 'Premium'
          END AS gamme
        language: sql
        choices:
          - label: "Milieu de gamme"
            correct: true
            why: "15 < 60 est vrai dès la première condition : le CASE s'arrête là."
          - label: "Petit prix"
            correct: false
            why: "Cette branche n'est jamais atteinte pour 15 €, car la première condition est déjà vraie."
          - label: "Premium"
            correct: false
            why: "Le ELSE n'est utilisé que si aucune condition n'est vraie."
        explanation: "Les conditions d'un CASE sont testées **dans l'ordre**. Range-les de la plus restrictive à la plus large."
      - code: sql-c2l4-q3
        kind: COMPLETER_CODE
        difficulty: 2
        skill: sql-select
        prompt: "Complète pour afficher l'**année** de chaque commande."
        snippet: |
          SELECT id, ____(YEAR FROM date_commande) AS annee
          FROM commandes;
        language: sql
        answers: ["EXTRACT"]
        explanation: "`EXTRACT(champ FROM date)` extrait YEAR, MONTH, DAY, DOW (jour de la semaine)… C'est la fonction standard SQL."
      - code: sql-c2l4-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: sql-select
        prompt: "Dans `SELECT DISTINCT ville, prenom FROM clients`, DISTINCT s'applique uniquement à la colonne ville."
        choices:
          - label: "Vrai"
            correct: false
            why: "DISTINCT porte sur la combinaison de toutes les colonnes sélectionnées."
          - label: "Faux"
            correct: true
            why: "Deux lignes ne sont fusionnées que si ville ET prenom sont identiques."
        explanation: "DISTINCT supprime les **lignes** en double, en comparant toutes les colonnes du SELECT."
      - code: sqlq-case-1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: À quoi sert `DISTINCT` ?
        choices:
          - label: À supprimer les lignes en double du résultat
            correct: true
            why: Oui.
          - label: À supprimer les doublons dans la table
            correct: false
            why: SELECT ne modifie jamais la table.
          - label: À trier le résultat
            correct: false
            why: C'est ORDER BY.
        explanation: '`SELECT DISTINCT ville FROM clients` : chaque ville une seule fois.'
      - code: sqlq-case-2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: sql-select
        prompt: Dans un CASE, que se passe-t-il si aucune condition WHEN n'est vraie et qu'il n'y a pas de ELSE ?
        choices:
          - label: La valeur est NULL
            correct: true
            why: Oui.
          - label: Une erreur est levée
            correct: false
            why: 'Aucune erreur : le résultat est NULL.'
          - label: La ligne est supprimée du résultat
            correct: false
            why: La ligne reste, avec NULL.
        explanation: Pense au ELSE pour couvrir tous les cas.
      - code: sqlq-case-3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: sql-select
        prompt: Quelle fonction met un texte en majuscules ?
        choices:
          - label: '`UPPER(nom)`'
            correct: true
            why: Oui.
          - label: '`LOWER(nom)`'
            correct: false
            why: LOWER met en minuscules.
          - label: '`LENGTH(nom)`'
            correct: false
            why: LENGTH compte les caractères.
        explanation: 'UPPER, LOWER, LENGTH, TRIM, CONCAT (ou `||`) : les fonctions de texte les plus courantes.'
    exercises:
      - slug: sql-ex-annees-inscription
        kind: SQL
        title: "Années d'inscription"
        difficulty: INTERMEDIAIRE
        skill: sql-select
        statement: |
          Affiche la liste des **années** au cours desquelles des clients se sont inscrits, **sans doublon**,
          dans une colonne nommée `annee`, de la plus ancienne à la plus récente.
        criteria: "1 colonne nommée annee, une ligne par année distincte, triée par ordre croissant."
        hints:
          - "EXTRACT(YEAR FROM ...) extrait l'année d'une date."
          - "DISTINCT supprime les doublons ; l'alias se donne avec AS."
          - "`SELECT DISTINCT EXTRACT(YEAR FROM date_inscription) AS annee FROM clients ORDER BY annee;`"
        solution: |
          SELECT DISTINCT EXTRACT(YEAR FROM date_inscription) AS annee
          FROM clients
          ORDER BY annee;
        explanation: |
          `EXTRACT(YEAR FROM date_inscription)` produit l'année de chaque inscription, `DISTINCT` supprime les
          répétitions et `ORDER BY annee` utilise l'alias pour trier. On obtient 2023, 2024 et 2025.
        xp: 15
        payload:
          mode: READ
          ordered: true
      - slug: sql-ex-niveau-stock
        kind: SQL
        title: "Niveau de stock"
        difficulty: INTERMEDIAIRE
        skill: sql-select
        statement: |
          Affiche le **nom**, le **stock** et une colonne `niveau` qui vaut :
          - `'Rupture'` si le stock est égal à 0 ;
          - `'Faible'` si le stock est inférieur à 10 ;
          - `'Correct'` sinon.

          Trie le résultat par stock croissant, puis par nom.
        criteria: "3 colonnes (nom, stock, niveau), les 30 produits, tri par stock puis nom."
        hints:
          - "Utilise une expression CASE avec deux WHEN et un ELSE."
          - "L'ordre des WHEN compte : teste d'abord `stock = 0`, ensuite `stock < 10`."
          - "`CASE WHEN stock = 0 THEN 'Rupture' WHEN stock < 10 THEN 'Faible' ELSE 'Correct' END AS niveau`"
        solution: |
          SELECT nom, stock,
                 CASE
                   WHEN stock = 0 THEN 'Rupture'
                   WHEN stock < 10 THEN 'Faible'
                   ELSE 'Correct'
                 END AS niveau
          FROM produits
          ORDER BY stock, nom;
        explanation: |
          Le CASE teste les conditions dans l'ordre. Si l'on testait d'abord `stock < 10`, les produits en
          rupture (stock = 0) seraient classés « Faible », car 0 < 10 est vrai.
        xp: 20
        payload:
          mode: READ
          ordered: true

bank:
  - code: sql-c2-b1
    kind: CHOIX_UNIQUE
    difficulty: 1
    skill: sql-select
    prompt: "Quelle requête trouve les produits dont le nom **contient** « SQL », quelle que soit la casse ?"
    choices:
      - label: "`WHERE nom ILIKE '%sql%'`"
        correct: true
        why: "ILIKE ignore la casse et `%...%` signifie « contient »."
      - label: "`WHERE nom LIKE 'sql'`"
        correct: false
        why: "Sans joker, LIKE cherche exactement « sql », et respecte la casse."
      - label: "`WHERE nom = '%SQL%'`"
        correct: false
        why: "`=` ne comprend pas les jokers."
      - label: "`WHERE nom CONTAINS 'SQL'`"
        correct: false
        why: "CONTAINS n'existe pas en SQL standard."
    explanation: "`ILIKE` est propre à PostgreSQL. En SQL standard, on écrirait `LOWER(nom) LIKE '%sql%'`."
  - code: sql-c2-b2
    kind: RESULTAT_CODE
    difficulty: 2
    skill: sql-select
    prompt: "Que renvoie `COALESCE(NULL, NULL, 'défaut', 'autre')` ?"
    snippet: |
      SELECT COALESCE(NULL, NULL, 'défaut', 'autre');
    language: sql
    choices:
      - label: "défaut"
        correct: true
        why: "COALESCE renvoie le premier argument non NULL."
      - label: "autre"
        correct: false
        why: "COALESCE s'arrête au premier argument non NULL."
      - label: "NULL"
        correct: false
        why: "Il existe un argument non NULL."
    explanation: "COALESCE parcourt ses arguments de gauche à droite et s'arrête au premier non NULL."
  - code: sql-c2-b3
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-select
    prompt: "Tu veux les clients qui n'habitent **pas** à Paris, y compris ceux sans ville. Quelle condition choisir ?"
    choices:
      - label: "`WHERE ville <> 'Paris' OR ville IS NULL`"
        correct: true
        why: "La seconde condition récupère explicitement les NULL écartés par le <>."
      - label: "`WHERE ville <> 'Paris'`"
        correct: false
        why: "Les clients sans ville sont exclus, car NULL <> 'Paris' vaut « inconnu »."
      - label: "`WHERE NOT ville = 'Paris'`"
        correct: false
        why: "Même problème : NOT(inconnu) reste inconnu."
    explanation: "Chaque fois qu'une colonne peut être NULL, demande-toi si ces lignes doivent être incluses."
  - code: sql-c2-b4
    kind: VRAI_FAUX
    difficulty: 1
    skill: sql-select
    prompt: "`NULL = NULL` est vrai en SQL."
    choices:
      - label: "Vrai"
        correct: false
        why: "Deux valeurs inconnues ne sont pas forcément égales : le résultat est « inconnu »."
      - label: "Faux"
        correct: true
        why: "Exact : `NULL = NULL` vaut NULL (inconnu), pas vrai."
    explanation: "C'est pourquoi on utilise `IS NULL`. PostgreSQL propose aussi `IS NOT DISTINCT FROM` pour comparer en traitant deux NULL comme égaux."
  - code: sql-c2-b5
    kind: COMPLETER_CODE
    difficulty: 2
    skill: sql-select
    prompt: "Complète pour garder les commandes dont le statut n'est **ni** ANNULEE **ni** EN_ATTENTE."
    snippet: |
      SELECT id, statut FROM commandes
      WHERE statut ____ ('ANNULEE', 'EN_ATTENTE');
    language: sql
    answers: ["NOT IN"]
    explanation: "`NOT IN (liste)` exclut toutes les valeurs de la liste. Attention : si la liste contenait un NULL, NOT IN ne renverrait aucune ligne !"
  - code: sql-c2-b6
    kind: RESULTAT_CODE
    difficulty: 2
    skill: sql-select
    prompt: "Que renvoie cette requête ?"
    snippet: |
      SELECT LENGTH('CDA') + LENGTH('Academy') AS n;
    language: sql
    choices:
      - label: "10"
        correct: true
        why: "3 caractères + 7 caractères = 10."
      - label: "11"
        correct: false
        why: "Il n'y a pas d'espace compté : ce sont deux chaînes séparées."
      - label: "CDAAcademy"
        correct: false
        why: "`+` additionne les longueurs ; la concaténation s'écrit `||`."
    explanation: "LENGTH compte les caractères d'un texte. Pour coller deux textes, PostgreSQL utilise `||`."
  - code: sql-c2-b7
    kind: CHOIX_UNIQUE
    difficulty: 2
    skill: sql-select
    prompt: "Quelle condition garde les commandes du **premier trimestre 2025** (janvier à mars inclus) ?"
    choices:
      - label: "`date_commande BETWEEN '2025-01-01' AND '2025-03-31'`"
        correct: true
        why: "BETWEEN inclut les bornes : du 1er janvier au 31 mars."
      - label: "`date_commande BETWEEN '2025-01' AND '2025-03'`"
        correct: false
        why: "Ces textes ne sont pas des dates valides au format AAAA-MM-JJ."
      - label: "`date_commande > '2025-01-01' AND date_commande < '2025-03-31'`"
        correct: false
        why: "Les comparaisons strictes excluent le 1er janvier et le 31 mars."
    explanation: "Pour une colonne de type DATE, BETWEEN avec des dates complètes est la forme la plus lisible. Pour un TIMESTAMP, on préfère `>= '2025-01-01' AND < '2025-04-01'`."
  - code: sql-c2-b8
    kind: CHOIX_MULTIPLE
    difficulty: 2
    skill: sql-select
    prompt: "Quelles conditions renvoient exactement les produits des catégories 1 et 2 ? (plusieurs réponses)"
    choices:
      - label: "`categorie_id IN (1, 2)`"
        correct: true
        why: "Liste explicite des deux valeurs."
      - label: "`categorie_id = 1 OR categorie_id = 2`"
        correct: true
        why: "Forme développée de IN."
      - label: "`categorie_id BETWEEN 1 AND 2`"
        correct: true
        why: "Pour des entiers, l'intervalle [1, 2] contient exactement 1 et 2."
      - label: "`categorie_id = 1 AND categorie_id = 2`"
        correct: false
        why: "Une ligne ne peut pas avoir deux catégories à la fois : aucun résultat."
    explanation: "Plusieurs écritures peuvent être équivalentes ; choisis la plus lisible pour le contexte (ici `IN`)."
  - code: sql-c2-b9
    kind: RESULTAT_CODE
