slug: java-poo
position: 2
level: INTERMEDIAIRE
title: "Penser en objets"
summary: "Décrire une chose avec une classe, la fabriquer avec new, l'initialiser avec un constructeur, lui donner des méthodes, protéger ses données, puis réutiliser avec l'héritage et les interfaces. Une seule notion par leçon."
quizQuestionCount: 15

lessons:
  # ===================================================================== LEÇON 1
  - slug: java-classes-objets
    title: "Classe et objet : décrire puis fabriquer"
    duration: 10
    objective: "Écrire une classe avec des attributs, fabriquer des objets avec new et lire ou modifier leurs attributs."
    prerequisites: "Chapitre « Les bases de Java »."
    skills: [poo, java-bases]
    xp: 15
    memo: |
      - Une **classe** est un **plan** : elle décrit les informations (les **attributs**) qu'aura chaque objet.
      - Un **objet** est une chose fabriquée à partir de ce plan avec `new` : `Livre livre = new Livre();`
      - On lit ou modifie un attribut avec un point : `livre.titre = "Dune";`
      - Chaque objet a **ses propres** valeurs.
    commonMistakes: |
      - Oublier `new` : la variable ne désigne alors aucun objet.
      - Confondre la classe (le plan) et l'objet (la chose construite).
    blocks:
      - type: text
        md: |
          Dans une bibliothèque, il y a **des** livres : chacun a un titre et une autrice. Plutôt que de gérer
          des variables éparpillées, Java permet de décrire une fois pour toutes ce qu'est **un** livre.
      - type: definition
        id: def-classe
        term: "Classe et objet"
        md: |
          Une **classe** est un **plan d'architecte** ; un **objet** est une **maison construite** avec ce
          plan. Avec un seul plan, on construit autant de maisons qu'on veut, chacune avec ses propres
          meubles.
      - type: code
        id: code-classe-livre
        language: java
        title: "Une classe Livre et deux objets"
        code: |
          public class Bibliotheque {
              public static void main(String[] args) {
                  Livre premier = new Livre();
                  premier.titre = "Une si longue lettre";
                  premier.autrice = "Mariama Bâ";

                  Livre second = new Livre();
                  second.titre = "Dune";

                  System.out.println(premier.titre);
                  System.out.println(second.titre);
              }
          }

          class Livre {
              String titre;
              String autrice;
          }
        lines:
          - n: 3
            note: "`new Livre()` fabrique un objet à partir du plan `Livre`."
          - n: 4
            note: "On remplit l'attribut titre **de cet objet-là**."
          - n: 7
            note: "Un deuxième objet, indépendant du premier."
          - n: 15
            note: "La classe `Livre` : le plan. Elle décrit deux attributs."
      - type: question
        ref: java-co-q1
        review: def-classe
      - type: question
        ref: java-cl-q2
        review: code-classe-livre
      - type: text
        md: "**Exercice 1 (guidé)** : complète la classe et la fabrication."
      - type: exercise
        ref: java-ex-objet-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une classe Chat et deux chats."
      - type: exercise
        ref: java-ex-objet-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un objet jamais fabriqué."
      - type: exercise
        ref: java-ex-objet-bug
      - type: jury
        items:
          - q: "Quelle différence entre une classe et un objet ?"
            a: "La classe est le modèle (attributs et méthodes) ; l'objet est une instance concrète créée avec `new`, avec ses propres valeurs."
      - type: quiz
        items:
          - ref: java-cl-q3
            review: def-classe
          - ref: java-cl-q4
            review: code-classe-livre
          - ref: java-cl-q5
            review: def-classe
    questions:
      - code: java-co-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Avec une classe `Livre`, combien d'objets peut-on créer ?"
        choices:
          - label: "Autant qu'on veut, chacun avec ses propres valeurs"
            correct: true
            why: "Un plan, beaucoup de maisons."
          - label: "Un seul"
            correct: false
            why: "La classe sert justement à en fabriquer plusieurs."
          - label: "Aucun : une classe ne sert qu'à ranger du code"
            correct: false
            why: "On crée des objets avec new."
        explanation: "Chaque `new Livre()` crée un objet indépendant."
      - code: java-cl-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: poo
        prompt: "Qu'affiche ce code ?"
        snippet: |
          Livre a = new Livre();
          a.titre = "Dune";
          Livre b = new Livre();
          b.titre = "Kirikou";
          System.out.println(a.titre);
        language: java
        choices:
          - label: "Dune"
            correct: true
            why: "Chaque objet garde ses propres valeurs."
          - label: "Kirikou"
            correct: false
            why: "b est un autre objet : il ne change pas a."
          - label: "null"
            correct: false
            why: "Le titre de a a bien été rempli."
        explanation: "Deux objets, deux titres différents."
      - code: java-cl-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Quel mot fabrique un objet à partir d'une classe ?"
        choices:
          - label: "`new`"
            correct: true
            why: "`new Livre()`."
          - label: "`class`"
            correct: false
            why: "class sert à écrire le plan."
          - label: "`return`"
            correct: false
            why: "return renvoie un résultat."
        explanation: "class = le plan ; new = la construction."
      - code: java-cl-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Comment remplir l'attribut autrice de l'objet `premier` ?"
        choices:
          - label: "`premier.autrice = \"Mariama Bâ\";`"
            correct: true
            why: "L'objet, un point, l'attribut."
          - label: "`Livre.autrice = \"Mariama Bâ\";`"
            correct: false
            why: "Livre est le plan, pas un objet précis."
          - label: "`autrice = \"Mariama Bâ\";`"
            correct: false
            why: "Il faut préciser de quel objet on parle."
        explanation: "`objet.attribut`."
      - code: java-cl-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: poo
        prompt: "Les attributs d'une classe décrivent les informations que chaque objet contiendra."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le plan liste les cases à remplir."
          - label: "Faux"
            correct: false
            why: "C'est la définition des attributs."
        explanation: "Attributs = les données de l'objet."
    exercises:
      - slug: java-ex-objet-guide
        kind: COMPLETER
        title: "Une classe Film"
        difficulty: FACILE
        skill: poo
        statement: "Complète : la classe Film a un titre ; on fabrique un film et on remplit son titre."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot qui déclare le plan : class."
          - "Le mot qui fabrique l'objet : new."
          - "class, new, titre."
        solution: '["class", "new", "titre"]'
        explanation: "`class Film { String titre; }` puis `Film f = new Film(); f.titre = ...;`"
        xp: 10
        payload:
          language: java
          template: |
            [[1]] Film {
                String titre;
            }

            Film f = [[2]] Film();
            f.[[3]] = "Atlantique";
          blanks:
            - ["class"]
            - ["new"]
            - ["titre"]
      - slug: java-ex-objet-libre
        kind: CODE_LIBRE
        title: "Deux chats"
        difficulty: FACILE
        skill: poo
        statement: |
          1. écris une classe `Chat` avec deux attributs texte : `nom` et `couleur` ;
          2. dans le `main` de la classe `Maison`, fabrique deux chats (`Mimi` roux, `Filou` noir) ;
          3. affiche le nom du premier et la couleur du second.
        criteria: "Une classe Chat avec deux attributs, deux new Chat(), deux affichages."
        hints:
          - "`class Chat { String nom; String couleur; }`"
          - "`Chat mimi = new Chat(); mimi.nom = \"Mimi\"; mimi.couleur = \"roux\";`"
          - "`System.out.println(mimi.nom);` puis `System.out.println(filou.couleur);`"
        solution: |
          public class Maison {
              public static void main(String[] args) {
                  Chat mimi = new Chat();
                  mimi.nom = "Mimi";
                  mimi.couleur = "roux";
                  Chat filou = new Chat();
                  filou.nom = "Filou";
                  filou.couleur = "noir";
                  System.out.println(mimi.nom);
                  System.out.println(filou.couleur);
              }
          }

          class Chat {
              String nom;
              String couleur;
          }
        explanation: "Un plan, deux objets, chacun avec ses valeurs."
        xp: 15
        payload:
          language: java
          starter: |
            public class Maison {
                public static void main(String[] args) {

                }
            }

            class Chat {

            }
          checks:
            - pattern: 'class\s+Chat\s*\{[^}]*String\s+nom\s*;[^}]*String\s+couleur\s*;|class\s+Chat\s*\{[^}]*String\s+couleur\s*;[^}]*String\s+nom\s*;'
              message: "La classe Chat a deux attributs : String nom; et String couleur;"
            - pattern: '\A(?>[\s\S]*?new\s+Chat\s*\(\s*\)){2}'
              message: "Fabrique deux chats avec new Chat()."
            - pattern: '\.nom\s*=\s*"Mimi"'
              message: "Le premier chat s'appelle Mimi."
            - pattern: '\.couleur\s*=\s*"noir"'
              message: "Le second chat est noir."
          output: |
            Mimi
            noir
      - slug: java-ex-objet-bug
        kind: CORRIGER_ERREUR
        title: "Un objet jamais fabriqué"
        difficulty: FACILE
        skill: poo
        statement: |
          Le compilateur refuse : « variable plante might not have been initialized ». La variable `plante`
          ne désigne aucun objet. Fabrique-le avec `new`.
        criteria: "L'objet est fabriqué avec new Plante()."
        hints:
          - "Déclarer une variable ne fabrique pas l'objet."
          - "Il faut new."
          - "`Plante plante = new Plante();`"
        solution: |
          public class Jardin {
              public static void main(String[] args) {
                  Plante plante = new Plante();
                  plante.nom = "Basilic";
                  System.out.println(plante.nom);
              }
          }

          class Plante {
              String nom;
          }
        explanation: "Sans new, il n'y a pas d'objet où ranger le nom."
        xp: 10
        payload:
          language: java
          starter: |
            public class Jardin {
                public static void main(String[] args) {
                    Plante plante;
                    plante.nom = "Basilic";
                    System.out.println(plante.nom);
                }
            }

            class Plante {
                String nom;
            }
          checks:
            - pattern: 'Plante\s+plante\s*=\s*new\s+Plante\s*\(\s*\)\s*;'
              message: "Fabrique l'objet : Plante plante = new Plante();"
          output: "Basilic"

  # ===================================================================== LEÇON 2
  - slug: java-constructeur
    title: "Le constructeur et this"
    duration: 10
    objective: "Écrire un constructeur qui remplit les attributs à la fabrication, en utilisant this."
    prerequisites: "Leçon « Classe et objet : décrire puis fabriquer »."
    skills: [poo]
    xp: 15
    memo: |
      - Le **constructeur** a le **même nom que la classe** et **aucun type de retour**.
      - Il est appelé par `new` : `new Livre("Dune", "Frank Herbert")`.
      - `this.titre` désigne l'attribut de l'objet ; `titre` seul désigne le paramètre.
      - Sans constructeur écrit, Java en fournit un vide (celui de la leçon précédente).
    commonMistakes: |
      - Écrire `titre = titre;` sans this : l'attribut reste vide (null).
      - Donner un type de retour au constructeur (`void Livre(...)`) : ce n'est plus un constructeur.
    blocks:
      - type: text
        md: |
          Remplir chaque attribut à la main après `new`, c'est long et on peut en oublier. Le **constructeur**
          remplit tout **au moment de la fabrication**.
      - type: definition
        id: def-constructeur
        term: "Constructeur"
        md: |
          Le **formulaire de naissance** d'un objet : on donne toutes les informations au moment où il est
          fabriqué. `this` veut dire « l'objet que je suis en train de fabriquer ».
      - type: code
        id: code-constructeur
        language: java
        title: "Un livre rempli dès sa fabrication"
        code: |
          public class Bibliotheque {
              public static void main(String[] args) {
                  Livre livre = new Livre("Dune", "Frank Herbert");
                  System.out.println(livre.titre);
                  System.out.println(livre.auteur);
              }
          }

          class Livre {
              String titre;
              String auteur;

              Livre(String titre, String auteur) {
                  this.titre = titre;
                  this.auteur = auteur;
              }
          }
        lines:
          - n: 3
            note: "`new` appelle le constructeur avec deux arguments."
          - n: 13
            note: "Le constructeur : même nom que la classe, pas de type de retour."
          - n: 14
            note: "`this.titre` = l'attribut de l'objet ; `titre` = le paramètre reçu."
      - type: question
        ref: java-co-q3
        review: def-constructeur
      - type: question
        ref: java-co-q5
        review: code-constructeur
      - type: text
        md: "**Exercice 1 (guidé)** : complète le constructeur."
      - type: exercise
        ref: java-ex-constructeur-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un constructeur pour une ville."
      - type: exercise
        ref: java-ex-constructeur-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un titre qui reste vide."
      - type: exercise
        ref: java-ex-constructeur-bug
      - type: quiz
        items:
          - ref: java-cs-q3
            review: def-constructeur
          - ref: java-cs-q4
            review: code-constructeur
          - ref: java-cs-q5
            review: def-constructeur
    questions:
      - code: java-co-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Qu'est-ce qui distingue un constructeur d'une méthode ordinaire ?"
        choices:
          - label: "Il porte le nom de la classe et n'a pas de type de retour"
            correct: true
            why: "`Livre(String titre, ...)`."
          - label: "Il s'appelle toujours init"
            correct: false
            why: "Il porte le nom de la classe."
          - label: "Il renvoie toujours void"
            correct: false
            why: "Il n'a aucun type de retour, même pas void."
        explanation: "Le constructeur remplit l'objet lors du `new`."
      - code: java-co-q5
        kind: VRAI_FAUX
        difficulty: 2
        skill: poo
        prompt: "Dans le constructeur, `titre = titre;` (sans this) remplit l'attribut titre."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : le paramètre est recopié dans lui-même, l'attribut reste vide (null)."
          - label: "Faux"
            correct: true
            why: "Exact : il faut `this.titre = titre;`."
        explanation: "`this.` désigne l'attribut de l'objet."
      - code: java-cs-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Quand le constructeur est-il appelé ?"
        choices:
          - label: "À chaque `new`"
            correct: true
            why: "C'est la fabrication de l'objet."
          - label: "À chaque lecture d'un attribut"
            correct: false
            why: "Il n'est appelé qu'une fois par objet."
          - label: "Jamais automatiquement"
            correct: false
            why: "new l'appelle toujours."
        explanation: "new → constructeur → objet prêt."
      - code: java-cs-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Que désigne `this.auteur` dans le constructeur ?"
        choices:
          - label: "L'attribut auteur de l'objet en cours de fabrication"
            correct: true
            why: "this = cet objet-ci."
          - label: "Le paramètre auteur"
            correct: false
            why: "Le paramètre s'écrit sans this."
          - label: "La classe Livre"
            correct: false
            why: "this désigne l'objet, pas la classe."
        explanation: "this.attribut = paramètre."
      - code: java-cs-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: poo
        prompt: "Avec le constructeur `Livre(String titre, String auteur)`, quelle fabrication compile ?"
        choices:
          - label: "`new Livre(\"Dune\", \"Frank Herbert\")`"
            correct: true
            why: "Deux textes, dans l'ordre."
          - label: "`new Livre()`"
            correct: false
            why: "Dès qu'on écrit un constructeur, le constructeur vide n'existe plus."
          - label: "`new Livre(\"Dune\")`"
            correct: false
            why: "Il manque l'auteur."
        explanation: "Les arguments doivent correspondre aux paramètres."
    exercises:
      - slug: java-ex-constructeur-guide
        kind: COMPLETER
        title: "Compléter le constructeur"
        difficulty: FACILE
        skill: poo
        statement: "Complète le constructeur de la classe Plat."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le constructeur porte le nom de la classe."
          - "L'attribut se désigne avec this."
          - "Plat, this, this."
        solution: '["Plat", "this", "this"]'
        explanation: "`Plat(String nom, String pays) { this.nom = nom; this.pays = pays; }`"
        xp: 10
        payload:
          language: java
          template: |
            class Plat {
                String nom;
                String pays;

                [[1]](String nom, String pays) {
                    [[2]].nom = nom;
                    [[3]].pays = pays;
                }
            }
          blanks:
            - ["Plat"]
            - ["this"]
            - ["this"]
      - slug: java-ex-constructeur-libre
        kind: CODE_LIBRE
        title: "Un constructeur pour une ville"
        difficulty: FACILE
        skill: poo
        statement: |
          1. écris une classe `Ville` avec deux attributs texte, `nom` et `pays`, et un constructeur
             `Ville(String nom, String pays)` qui les remplit avec `this` ;
          2. dans le `main` de la classe `Voyage`, fabrique `new Ville("Dakar", "Sénégal")` et affiche son nom
             puis son pays.
        criteria: "Constructeur avec this, un new avec deux arguments, deux affichages."
        hints:
          - "`Ville(String nom, String pays) { this.nom = nom; this.pays = pays; }`"
          - "`Ville v = new Ville(\"Dakar\", \"Sénégal\");`"
          - "`System.out.println(v.nom);` puis `System.out.println(v.pays);`"
        solution: |
          public class Voyage {
              public static void main(String[] args) {
                  Ville v = new Ville("Dakar", "Sénégal");
                  System.out.println(v.nom);
                  System.out.println(v.pays);
              }
          }

          class Ville {
              String nom;
              String pays;

              Ville(String nom, String pays) {
                  this.nom = nom;
                  this.pays = pays;
              }
          }
        explanation: "L'objet est complet dès sa fabrication."
        xp: 15
        payload:
          language: java
          starter: |
            public class Voyage {
                public static void main(String[] args) {

                }
            }

            class Ville {

            }
          checks:
            - pattern: 'Ville\s*\(\s*String\s+nom\s*,\s*String\s+pays\s*\)\s*\{'
              message: "Écris le constructeur Ville(String nom, String pays)."
            - pattern: 'this\.nom\s*=\s*nom\s*;'
              message: "Remplis l'attribut : this.nom = nom;"
            - pattern: 'this\.pays\s*=\s*pays\s*;'
              message: "Remplis l'attribut : this.pays = pays;"
            - pattern: 'new\s+Ville\s*\(\s*"Dakar"\s*,\s*"Sénégal"\s*\)'
              message: "Fabrique new Ville(\"Dakar\", \"Sénégal\")."
          output: |
            Dakar
            Sénégal
      - slug: java-ex-constructeur-bug
        kind: CORRIGER_ERREUR
        title: "Un titre qui reste vide"
        difficulty: FACILE
        skill: poo
        statement: |
          Ce programme affiche `null` au lieu de `Kirikou` : le constructeur recopie le paramètre dans
          lui-même. Corrige-le avec `this`.
        criteria: "Le constructeur utilise this.titre = titre;"
        hints:
          - "`titre = titre;` ne touche pas l'attribut."
          - "Pour désigner l'attribut de l'objet : this."
          - "`this.titre = titre;`"
        solution: |
          public class Cinema {
              public static void main(String[] args) {
                  Film film = new Film("Kirikou");
                  System.out.println(film.titre);
              }
          }

          class Film {
              String titre;

              Film(String titre) {
                  this.titre = titre;
              }
          }
        explanation: "`this.titre` est l'attribut ; `titre` est le paramètre."
        xp: 10
        payload:
          language: java
          starter: |
            public class Cinema {
                public static void main(String[] args) {
                    Film film = new Film("Kirikou");
                    System.out.println(film.titre);
                }
            }

            class Film {
                String titre;

                Film(String titre) {
                    titre = titre;
                }
            }
          checks:
            - pattern: 'this\.titre\s*=\s*titre\s*;'
              message: "Écris this.titre = titre;"
          output: "Kirikou"

  # ===================================================================== LEÇON 3
  - slug: java-methodes-objet
    title: "Les méthodes d'un objet"
    duration: 10
    objective: "Écrire une méthode (sans static) qui utilise les attributs de l'objet, et l'appeler sur un objet."
    prerequisites: "Leçon « Le constructeur et this »."
    skills: [poo]
    xp: 15
    memo: |
      - Une méthode **sans** `static` appartient à **chaque objet** : elle utilise **ses** attributs.
      - On l'appelle sur un objet : `livre.fiche()`.
      - Dans la méthode, `titre` désigne l'attribut de l'objet sur lequel on l'a appelée.
      - Attributs = ce que l'objet **sait** ; méthodes = ce que l'objet **sait faire**.
    commonMistakes: |
      - Appeler la méthode sur la classe (`Livre.fiche()`) au lieu d'un objet.
      - Oublier les parenthèses à l'appel.
    blocks:
      - type: text
        md: |
          Un objet ne fait pas que ranger des informations : il sait aussi **faire des choses** avec elles.
          Ce sont ses **méthodes**.
      - type: definition
        id: def-methode-objet
        term: "Méthode d'objet"
        md: |
          Un **bouton** sur l'objet : « présente-toi ». Chaque objet répond avec **ses propres**
          informations. Le même bouton sur deux livres donne deux fiches différentes.
      - type: code
        id: code-methode-objet
        language: java
        title: "Un livre qui se présente"
        code: |
          public class Bibliotheque {
              public static void main(String[] args) {
                  Livre a = new Livre("Dune", "Frank Herbert");
                  Livre b = new Livre("Une si longue lettre", "Mariama Bâ");
                  System.out.println(a.fiche());
                  System.out.println(b.fiche());
              }
          }

          class Livre {
              String titre;
              String auteur;

              Livre(String titre, String auteur) {
                  this.titre = titre;
                  this.auteur = auteur;
              }

