      - slug: java-ex-interface
        kind: CODE_LIBRE
        title: "Deux façons de saluer"
        difficulty: INTERMEDIAIRE
        skill: poo
        statement: |
          1. déclare une interface `Salutation` avec une méthode `String saluer(String prenom)` ;
          2. écris `SalutationPolie` et `SalutationAmicale` qui l'implémentent et renvoient
             `"Bonjour " + prenom` et `"Salut " + prenom` ;
          3. utilise `@Override` sur chaque implémentation ;
          4. dans le `main` de la classe `Accueil`, range une `SalutationAmicale` dans une variable de type
             `Salutation` et affiche `saluer("Awa")`.
        criteria: "Interface, deux implémentations avec @Override, utilisation par le type de l'interface."
        hints:
          - "`interface Salutation { String saluer(String prenom); }`"
          - "`class SalutationAmicale implements Salutation { @Override public String saluer(String prenom) { ... } }`"
          - "`Salutation s = new SalutationAmicale(); System.out.println(s.saluer(\"Awa\"));`"
        solution: |
          public class Accueil {
              public static void main(String[] args) {
                  Salutation s = new SalutationAmicale();
                  System.out.println(s.saluer("Awa"));
              }
          }

          interface Salutation {
              String saluer(String prenom);
          }

          class SalutationPolie implements Salutation {
              @Override
              public String saluer(String prenom) {
                  return "Bonjour " + prenom;
              }
          }

          class SalutationAmicale implements Salutation {
              @Override
              public String saluer(String prenom) {
                  return "Salut " + prenom;
              }
          }
        explanation: "Le main manipule une Salutation sans savoir laquelle : on peut en ajouter une troisième sans rien casser."
        xp: 25
        payload:
          language: java
          starter: |
            public class Accueil {
                public static void main(String[] args) {

                }
            }

            // Interface et implémentations
          checks:
            - pattern: 'interface\s+Salutation\s*\{\s*String\s+saluer\s*\(\s*String\s+\w+\s*\)\s*;'
              message: "Déclare interface Salutation { String saluer(String prenom); }"
            - pattern: 'class\s+SalutationPolie\s+implements\s+Salutation'
              message: "SalutationPolie implémente Salutation."
            - pattern: 'class\s+SalutationAmicale\s+implements\s+Salutation'
              message: "SalutationAmicale implémente Salutation."
            - pattern: '\A(?>[\s\S]*?@Override\s+public\s+String\s+saluer){2}'
              message: "Chaque implémentation redéfinit saluer avec @Override."
            - pattern: 'Salutation\s+\w+\s*=\s*new\s+SalutationAmicale\s*\(\s*\)'
              message: "Dans main : Salutation s = new SalutationAmicale();"
          output: "Salut Awa"
      - slug: java-ex-interface-bug
        kind: CORRIGER_ERREUR
        title: "Un contrat pas respecté"
        difficulty: FACILE
        skill: poo
        statement: |
          Le compilateur refuse `Velo` : elle signe le contrat `Transport` mais ne fournit pas la méthode
          `description()`. Ajoute-la (avec `@Override`) pour qu'elle renvoie `"Vélo : écologique"`.
        criteria: "Velo fournit la méthode description() du contrat."
        hints:
          - "Toutes les méthodes du contrat doivent être écrites."
          - "Même signature que dans l'interface, avec public."
          - "`@Override public String description() { return \"Vélo : écologique\"; }`"
        solution: |
          public class Ville {
              public static void main(String[] args) {
                  Transport t = new Velo();
                  System.out.println(t.description());
              }
          }

          interface Transport {
              String description();
          }

          class Velo implements Transport {
              @Override
              public String description() {
                  return "Vélo : écologique";
              }
          }
        explanation: "Signer un contrat, c'est s'engager à fournir toutes ses méthodes."
        xp: 10
        payload:
          language: java
          starter: |
            public class Ville {
                public static void main(String[] args) {
                    Transport t = new Velo();
                    System.out.println(t.description());
                }
            }

            interface Transport {
                String description();
            }

            class Velo implements Transport {

            }
          checks:
            - pattern: 'class\s+Velo\s+implements\s+Transport\s*\{[\s\S]*public\s+String\s+description\s*\(\s*\)\s*\{\s*return\s+"Vélo : écologique"\s*;'
              message: "Écris dans Velo : public String description() { return \"Vélo : écologique\"; }"
          output: "Vélo : écologique"

