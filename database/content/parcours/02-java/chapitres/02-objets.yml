  # ===================================================================== LEÇON 5
  - slug: java-heritage-interfaces
    title: "L'héritage : extends et super"
    duration: 11
    objective: "Faire hériter une classe d'une autre avec extends, et appeler le constructeur parent avec super."
    prerequisites: "Leçon « Protéger ses données »."
    skills: [poo]
    xp: 15
    memo: |
      - `class Admin extends Utilisateur` : Admin **reçoit** les attributs et les méthodes d'Utilisateur.
      - On hérite seulement si la phrase « un X **est un** Y » est vraie.
      - `super(email)` appelle le constructeur du parent (première ligne du constructeur enfant).
      - `protected` : visible dans la classe et dans ses enfants.
      - Une classe n'a qu'**un seul** parent.
    commonMistakes: |
      - Hériter sans relation « est un » (un Panier n'« est » pas une Liste).
      - Oublier `super(...)` quand le parent n'a pas de constructeur vide.
    blocks:
      - type: text
        md: |
          Une administratrice **est une** utilisatrice, avec des droits en plus. Plutôt que de tout réécrire,
          Java permet d'**hériter**.
      - type: definition
        id: def-heritage
        term: "Héritage"
        md: |
          Un enfant **hérite** des traits de ses parents, puis développe ses propres talents. La classe enfant
          reçoit tout ce qu'a le parent et y ajoute ce qui lui est propre.
      - type: code
        id: code-heritage
        language: java
        title: "Admin hérite d'Utilisateur"
        code: |
          public class Equipe {
              public static void main(String[] args) {
                  Admin awa = new Admin("awa@exemple.fr");
                  System.out.println(awa.description());
                  System.out.println(awa.droits());
              }
          }

          class Utilisateur {
              protected String email;

              public Utilisateur(String email) {
                  this.email = email;
              }

              public String description() {
                  return "Compte " + email;
              }
          }

          class Admin extends Utilisateur {
              public Admin(String email) {
                  super(email);
              }

              public String droits() {
                  return "Tous les droits";
              }
          }
        lines:
          - n: 4
