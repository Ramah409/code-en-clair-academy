      - slug: java-ex-extends-libre
        kind: CODE_LIBRE
        title: "Un chien est un animal"
        difficulty: INTERMEDIAIRE
        skill: poo
        statement: |
          1. écris la classe `Animal` avec un attribut `protected String nom`, un constructeur, et une méthode
             `public String presentation()` qui renvoie `"Je m'appelle " + nom` ;
          2. écris `Chien extends Animal` avec un constructeur qui appelle `super(nom)`, et une méthode
             `public String aboyer()` qui renvoie `"Wouf !"` ;
          3. dans le `main` de la classe `Refuge`, fabrique un chien `Médor` et affiche `presentation()` puis
             `aboyer()`.
        criteria: "extends, super, une méthode héritée et une méthode propre."
        hints:
          - "`class Chien extends Animal { public Chien(String nom) { super(nom); } ... }`"
          - "`public String aboyer() { return \"Wouf !\"; }`"
          - "`System.out.println(medor.presentation());` puis `System.out.println(medor.aboyer());`"
        solution: |
          public class Refuge {
              public static void main(String[] args) {
                  Chien medor = new Chien("Médor");
                  System.out.println(medor.presentation());
                  System.out.println(medor.aboyer());
              }
          }

          class Animal {
              protected String nom;

              public Animal(String nom) {
                  this.nom = nom;
              }

              public String presentation() {
                  return "Je m'appelle " + nom;
              }
          }

          class Chien extends Animal {
              public Chien(String nom) {
                  super(nom);
              }

              public String aboyer() {
                  return "Wouf !";
              }
          }
        explanation: "presentation() vient du parent, aboyer() appartient au chien."
