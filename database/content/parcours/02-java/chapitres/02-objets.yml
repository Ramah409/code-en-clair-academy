  # ===================================================================== LEÇON 7
  - slug: java-interfaces
    title: "Les interfaces : un contrat à respecter"
    duration: 11
    objective: "Déclarer une interface, l'implémenter dans plusieurs classes et les manipuler à travers le type de l'interface."
    prerequisites: "Leçon « Redéfinir une méthode »."
    skills: [poo]
    xp: 15
    memo: |
      - Une **interface** liste des méthodes **sans leur contenu** : c'est un contrat.
      - `class NotificationEmail implements Notification` : la classe **signe** le contrat et doit fournir toutes ses méthodes.
      - On peut manipuler tous les objets qui ont signé à travers le type de l'interface : `Notification n = new NotificationSms();`
      - Une classe peut implémenter **plusieurs** interfaces (mais n'hérite que d'une classe).
    commonMistakes: |
      - Oublier une méthode du contrat : la classe ne compile pas.
      - Essayer de faire `new Notification()` : on ne fabrique pas un contrat, seulement les classes qui l'ont signé.
    blocks:
      - type: text
        md: |
          Une application envoie des notifications par e-mail, par SMS… Le reste du code ne devrait pas avoir à
          s'en soucier. Il suffit que chaque moyen respecte **le même contrat**.
      - type: definition
        id: def-interface-java
        term: "Interface"
        md: |
          Une **prise électrique normalisée** : n'importe quel appareil qui respecte la norme peut s'y
          brancher. L'interface est la norme ; chaque classe qui l'implémente est un appareil compatible.
      - type: code
        id: code-interface-java
        language: java
        title: "Deux façons de notifier"
        code: |
          public class Messagerie {
              public static void main(String[] args) {
                  Notification n = new NotificationSms();
                  System.out.println(n.envoyer("Cours à 9 h"));
                  n = new NotificationEmail();
                  System.out.println(n.envoyer("Cours à 9 h"));
              }
          }

          interface Notification {
              String envoyer(String message);
          }

          class NotificationSms implements Notification {
              @Override
              public String envoyer(String message) {
                  return "SMS : " + message;
              }
          }

          class NotificationEmail implements Notification {
              @Override
              public String envoyer(String message) {
                  return "E-mail : " + message;
              }
          }
        lines:
          - n: 3
            note: "La variable a le type du contrat ; elle peut contenir n'importe quelle classe qui l'a signé."
          - n: 10
            note: "Le contrat : une méthode, sans contenu."
          - n: 14
            note: "`implements` : la classe signe le contrat et fournit la méthode."
      - type: question
        ref: java-hi-q2
        review: def-interface-java
      - type: question
        ref: java-hi-q4
        review: code-interface-java
      - type: text
        md: "**Exercice 1 (guidé)** : complète le contrat et sa signature."
      - type: exercise
        ref: java-ex-interface-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : deux façons de notifier."
      - type: exercise
        ref: java-ex-interface
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un contrat pas respecté."
      - type: exercise
