  - slug: java-override
    title: "Redéfinir une méthode : @Override et polymorphisme"
    duration: 11
    objective: "Redéfinir une méthode héritée avec @Override et comprendre que la version de l'objet réel est appelée."
    prerequisites: "Leçon « L'héritage : extends et super »."
    skills: [poo]
    xp: 15
    memo: |
      - Un enfant peut **redéfinir** une méthode de son parent : même nom, mêmes paramètres, autre contenu.
      - `@Override` au-dessus : le compilateur vérifie que la méthode existe bien chez le parent.
      - **Polymorphisme** : une variable de type `Utilisateur` peut contenir un `Admin` ; c'est la version de l'**objet réel** qui s'exécute.
    commonMistakes: |
      - Oublier `@Override` : une faute de frappe crée une nouvelle méthode sans prévenir.
      - Changer les paramètres : ce n'est plus une redéfinition.
    blocks:
      - type: text
        md: |
          Une administratrice se présente autrement qu'une simple utilisatrice. On garde le même nom de méthode,
          mais on change son contenu.
      - type: definition
        id: def-override
        term: "Redéfinir (@Override)"
        md: |
          Une **recette de famille adaptée** : même nom de plat, mais chacun la cuisine à sa façon. Quand on
          commande « le plat », on reçoit la version de la personne qui cuisine vraiment.
      - type: code
        id: code-override
        language: java
        title: "Deux versions de description()"
        code: |
          public class Equipe {
              public static void main(String[] args) {
                  Utilisateur u1 = new Utilisateur("leo@exemple.fr");
                  Utilisateur u2 = new Admin("awa@exemple.fr");
                  System.out.println(u1.description());
                  System.out.println(u2.description());
              }
          }

          class Utilisateur {
              protected String email;

              public Utilisateur(String email) {
                  this.email = email;
              }

              public String description() {
                  return "Utilisateur " + email;
              }
          }

          class Admin extends Utilisateur {
              public Admin(String email) {
                  super(email);
              }

              @Override
              public String description() {
                  return "Administratrice " + email;
              }
          }
        lines:
          - n: 4
            note: "La variable est de type Utilisateur, mais l'objet réel est un Admin."
          - n: 6
            note: "C'est la version d'Admin qui s'exécute : « Administratrice awa@exemple.fr »."
          - n: 27
            note: "`@Override` : on redéfinit la méthode du parent, vérifié par le compilateur."
