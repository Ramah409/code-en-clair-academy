  # ===================================================================== LEÇON 4
  - slug: java-encapsulation
    title: "Protéger ses données : private, getters et setters"
    duration: 12
    objective: "Rendre les attributs privés et n'y donner accès que par des méthodes publiques qui appliquent les règles."
    prerequisites: "Leçon « Les méthodes d'un objet »."
    skills: [poo]
    xp: 20
    memo: |
      - `private` : l'attribut n'est accessible **que dans sa classe**.
      - **Getter** : méthode publique qui permet de **lire** (`getTitre()`, ou `isDisponible()` pour un booléen).
      - **Setter** / méthode métier : permet de **modifier en respectant une règle** (`emprunter()` refuse si le livre est déjà sorti).
      - C'est l'**encapsulation** : on passe par le guichet, jamais directement dans le coffre.
    commonMistakes: |
      - Laisser des attributs publics : n'importe quel code peut y mettre une valeur absurde.
      - Écrire un setter pour chaque attribut sans règle : on perd l'intérêt de la protection.
    blocks:
      - type: text
        md: |
          Si n'importe quel code peut écrire `livre.disponible = true`, un livre emprunté pourrait être prêté
          deux fois. Il faut **protéger** les données.
      - type: definition
        id: def-encapsulation
        term: "Encapsulation"
        md: |
          Un **guichet de banque** : on ne se sert pas dans le coffre, on passe par le guichet, qui vérifie
          que l'opération est possible. Les attributs sont `private`, les méthodes `public` font guichet.
      - type: code
        id: code-encapsulation
        language: java
        title: "Un livre qu'on ne peut pas prêter deux fois"
        code: |
          public class Pret {
              public static void main(String[] args) {
                  Livre livre = new Livre("Dune");
                  livre.emprunter();
                  livre.emprunter();
                  System.out.println(livre.isDisponible());
              }
          }

          class Livre {
              private String titre;
              private boolean disponible = true;

              public Livre(String titre) {
                  this.titre = titre;
              }

              public boolean isDisponible() {
                  return disponible;
              }

              public void emprunter() {
                  if (!disponible) {
                      System.out.println(titre + " est déjà emprunté");
                      return;
                  }
                  disponible = false;
                  System.out.println(titre + " emprunté");
              }
          }
        lines:
          - n: 11
            note: "`private` : personne en dehors de la classe ne peut toucher cet attribut."
          - n: 18
            note: "Un **getter** : on peut lire la disponibilité, pas la modifier."
          - n: 22
            note: "La règle : un livre déjà sorti ne peut pas être emprunté. `return` arrête la méthode."
          - n: 5
            note: "Le deuxième emprunt est refusé par la règle."
      - type: question
        ref: java-co-q2
        review: def-encapsulation
      - type: question
        ref: java-c2-b1
        review: code-encapsulation
