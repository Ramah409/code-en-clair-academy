  # ===================================================================== LEÇON 4
  - slug: java-textes
    title: "Les textes : coller et transformer un String"
    duration: 9
    objective: "Assembler des textes avec + et utiliser les outils des String : toUpperCase, toLowerCase, length."
    prerequisites: "Leçon « Une valeur qui ne change pas : final »."
    skills: [java-bases]
    xp: 10
    memo: |
      - Comme en JavaScript, `+` **colle** des textes : `"Bonjour " + prenom`.
      - Outils d'un String : `toUpperCase()`, `toLowerCase()`, `trim()`, et `length()` — en Java, **avec parenthèses**.
      - Un outil renvoie un **nouveau** texte : `nom.toUpperCase();` seul ne change pas `nom`.
    commonMistakes: |
      - Écrire `length` sans parenthèses (c'était le cas en JavaScript, pas en Java).
      - Oublier de ranger le résultat : `nom = nom.toUpperCase();`.
    blocks:
      - type: text
        md: |
          Bonne nouvelle : les textes Java ressemblent beaucoup à ceux de JavaScript. Deux différences : le
          type s'écrit `String`, et `length()` prend des parenthèses.
      - type: definition
        id: def-string
        term: "String et ses outils"
        md: |
          Un texte avec sa **boîte à outils** attachée, comme en JavaScript. On choisit l'outil avec un point
          et on l'active avec des parenthèses : `prenom.toUpperCase()`.
      - type: code
        id: code-string-outils
        language: java
        title: "Coller et transformer"
        code: |
          public class Accueil {
              public static void main(String[] args) {
                  String prenom = "Awa";
                  String message = "Bonjour " + prenom + " !";
                  System.out.println(message);
                  System.out.println(prenom.toUpperCase());
                  System.out.println(prenom.length());
              }
          }
        lines:
          - n: 4
            note: "`+` colle trois morceaux : Bonjour Awa !"
          - n: 6
            note: "Affiche AWA."
          - n: 7
            note: "`length()` avec parenthèses : le nombre de caractères."
