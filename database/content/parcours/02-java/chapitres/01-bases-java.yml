          String[] notes = {"do", "ré", "mi"};
          System.out.println(notes[2]);
        language: java
        choices:
          - label: "mi"
            correct: true
            why: "Case 0 : do, case 1 : ré, case 2 : mi."
          - label: "ré"
            correct: false
            why: "ré est dans la case 1."
          - label: "Une erreur"
            correct: false
            why: "La case 2 existe."
