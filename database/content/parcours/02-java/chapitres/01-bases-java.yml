        term: "Boucles en Java"
        md: |
          Le même **tour de piste** qu'en JavaScript. Le compteur est une vraie variable Java : on écrit son
          type, `int`.
      - type: code
        id: code-boucles-java
        language: java
        title: "for et while"
        code: |
          public class Rebours {
              public static void main(String[] args) {
                  for (int i = 1; i <= 3; i++) {
                      System.out.println("Étape " + i);
                  }
                  int secondes = 3;
                  while (secondes > 0) {
                      System.out.println(secondes);
                      secondes--;
                  }
                  System.out.println("Partez !");
              }
          }
        lines:
          - n: 3
            note: "`int i` : le compteur est typé. Le reste est identique à JavaScript."
          - n: 7
            note: "while : tant qu'il reste des secondes."
