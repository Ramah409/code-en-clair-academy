        prompt: "Quelle écriture crée un tableau de textes en Java ?"
        choices:
          - label: "`String[] fruits = {\"pomme\", \"kiwi\"};`"
            correct: true
            why: "Le type suivi de crochets, les valeurs entre accolades."
          - label: "`String fruits = [\"pomme\", \"kiwi\"];`"
            correct: false
            why: "C'est l'écriture JavaScript, et il manque les crochets au type."
          - label: "`const fruits = {\"pomme\", \"kiwi\"};`"
            correct: false
            why: "const n'existe pas en Java."
        explanation: "`Type[] nom = {valeur1, valeur2};`"
      - code: java-tb-q2
