    memo: |
      - `for (int i = 1; i <= 5; i++) { ... }` : comme en JavaScript, mais le compteur est **typé** (`int i`).
      - `while (condition) { ... }` : identique à JavaScript.
      - Toujours faire évoluer la condition pour sortir de la boucle.
    commonMistakes: |
      - Écrire `let i` : let n'existe pas en Java, c'est `int i`.
      - Oublier de faire évoluer la variable d'un while : boucle infinie.
    blocks:
      - type: text
        md: |
          Les boucles Java ressemblent à celles de JavaScript. Une seule différence : le compteur a un type,
          `int`.
