slug: java-bases
position: 1
level: DEBUTANT
title: "Les bases de Java"
summary: "Écrire un programme Java, déclarer des variables typées, travailler avec des textes, décider, répéter, ranger dans un tableau et écrire ses propres méthodes. Une seule notion par leçon."
quizQuestionCount: 15

lessons:
  # ===================================================================== LEÇON 1
  - slug: java-premier-programme
    title: "Ton premier programme Java"
    duration: 10
    objective: "Comprendre la structure d'un programme Java (classe, main), afficher avec System.out.println et savoir ce qu'est la compilation."
    prerequisites: "Parcours « Premiers pas en programmation » conseillé."
    skills: [java-bases]
    xp: 15
    memo: |
      - Tout code Java vit dans une **classe** : `public class Bonjour { ... }`.
      - Le programme démarre dans `public static void main(String[] args)` : la **porte d'entrée**. Pour l'instant, recopie cette ligne telle quelle.
      - `System.out.println("…");` affiche une ligne (l'équivalent de `console.log`).
      - Chaque instruction se termine **obligatoirement** par un point-virgule.
      - Le **compilateur** (`javac`) vérifie et traduit le code ; la **JVM** (`java`) l'exécute.
    commonMistakes: |
      - Oublier le point-virgule : erreur de compilation.
      - Écrire `system.out.println` : Java distingue majuscules et minuscules (`System`).
      - Nom de fichier différent du nom de la classe publique.
    blocks:
      - type: text
        md: |
          En JavaScript, une seule ligne suffisait pour afficher un message. Java demande un petit
          **cadre** autour : c'est plus strict, mais ce cadre rend les gros programmes plus solides.
      - type: definition
        id: def-classe-intro
        term: "Classe (premier contact)"
        md: |
          Pour l'instant, retiens qu'une **classe** est une **boîte qui contient du code**. En Java, tout le
          code doit être rangé dans une classe. On verra plus tard qu'elle sert aussi de plan pour fabriquer
          des objets.
      - type: code
        id: code-bonjour-java
        language: java
        title: "Bonjour.java"
        code: |
          public class Bonjour {
              public static void main(String[] args) {
                  System.out.println("Bonjour !");
                  System.out.println("Je découvre Java.");
              }
          }
        lines:
          - n: 1
            note: "La classe `Bonjour`. Le fichier doit s'appeler `Bonjour.java`."
          - n: 2
            note: "`main` : la **porte d'entrée**. Java commence toujours ici. Les autres mots seront expliqués plus tard."
          - n: 3
            note: "`System.out.println` affiche une ligne. Le texte est entre guillemets doubles, et la ligne finit par `;`."
          - n: 5
            note: "Accolade qui ferme `main`."
          - n: 6
            note: "Accolade qui ferme la classe."
      - type: question
        ref: java-pp-q1
        review: code-bonjour-java
      - type: definition
        id: def-compilation
        term: "Compilation et JVM"
        md: |
          Le **compilateur** (`javac`) relit tout ton code et le **traduit**, comme un traducteur qui vérifie
          chaque phrase avant de publier le livre. S'il trouve une faute, il refuse : c'est une **erreur de
          compilation**. Ensuite, la **JVM** (machine virtuelle Java) exécute le résultat sur n'importe quel
          ordinateur (Windows, Mac, Linux).
      - type: steps
        title: "Lancer le programme en ligne de commande"
        items:
          - "`javac Bonjour.java` : compile et crée `Bonjour.class`."
          - "`java Bonjour` : la JVM exécute le programme et affiche les deux lignes."
          - "Dans IntelliJ ou VS Code, le bouton « Run » fait ces deux étapes pour toi."
      - type: question
        ref: java-pp-q2
        review: def-compilation
      - type: text
        md: "**Exercice 1 (guidé)** : complète la structure du programme."
      - type: exercise
        ref: java-ex-main-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : écris un programme Java complet qui affiche trois lignes."
      - type: exercise
        ref: java-ex-presentation
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : le compilateur refuse ce programme."
      - type: exercise
        ref: java-ex-premier-bug
      - type: jury
        items:
          - q: "Quelle différence entre JDK, JRE et JVM ?"
            a: "La JVM exécute le bytecode. Le JRE contient la JVM et les bibliothèques pour exécuter. Le JDK ajoute les outils de développement, dont le compilateur `javac`."
          - q: "Pourquoi dit-on que Java est portable ?"
            a: "Le code est compilé en bytecode, exécuté par une JVM disponible sur chaque système : le même programme tourne partout sans être recompilé."
      - type: quiz
        items:
          - ref: java-pp-q3
            review: code-bonjour-java
          - ref: java-pp-q4
            review: def-compilation
          - ref: java-pp-q5
            review: code-bonjour-java
    questions:
      - code: java-pp-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Par quelle méthode un programme Java commence-t-il ?"
        choices:
          - label: "`main`"
            correct: true
            why: "Oui : `public static void main(String[] args)`."
          - label: "`start`"
            correct: false
            why: "Ce n'est pas la porte d'entrée Java."
          - label: "La première ligne du fichier, quelle qu'elle soit"
            correct: false
            why: "Java cherche la méthode main."
        explanation: "La JVM appelle `main` pour démarrer le programme."
      - code: java-pp-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-bases
        prompt: "Que fait la commande `javac Bonjour.java` ?"
        choices:
          - label: "Elle compile (vérifie et traduit) le code"
            correct: true
            why: "javac = Java compiler."
          - label: "Elle exécute le programme"
            correct: false
            why: "C'est la commande `java`."
          - label: "Elle installe Java"
            correct: false
            why: "Java doit déjà être installé."
        explanation: "Compiler (javac), puis exécuter (java)."
      - code: java-pp-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Quelle instruction affiche « Salut » en Java ?"
        choices:
          - label: "`System.out.println(\"Salut\");`"
            correct: true
            why: "Oui, avec le point-virgule."
          - label: "`console.log(\"Salut\");`"
            correct: false
            why: "C'est du JavaScript."
          - label: "`print Salut`"
            correct: false
            why: "Écriture inconnue en Java."
        explanation: "`System.out.println` affiche une ligne dans la console."
      - code: java-pp-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: java-bases
        prompt: "Une erreur de compilation empêche le programme de démarrer."
        choices:
          - label: "Vrai"
            correct: true
            why: "Le compilateur refuse de produire le programme."
          - label: "Faux"
            correct: false
            why: "Sans compilation réussie, rien à exécuter."
        explanation: "C'est un avantage : beaucoup d'erreurs sont trouvées avant même l'exécution."
      - code: java-pp-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Comment doit s'appeler le fichier qui contient `public class Commande` ?"
        choices:
          - label: "`Commande.java`"
            correct: true
            why: "Même nom que la classe publique, extension .java."
          - label: "`commande.txt`"
            correct: false
            why: "L'extension doit être .java et les majuscules respectées."
          - label: "`Main.java`"
            correct: false
            why: "Le nom doit correspondre à la classe publique."
        explanation: "Règle Java : une classe publique par fichier, fichier au même nom."
    exercises:
      - slug: java-ex-main-guide
        kind: COMPLETER
        title: "La structure d'un programme Java"
        difficulty: FACILE
        skill: java-bases
        statement: "Complète le programme. Respecte les majuscules."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot-clé qui déclare une classe."
          - "Le nom de la méthode de démarrage."
          - "class, main, println."
        solution: '["class", "main", "println"]'
        explanation: "`public class Salut`, `public static void main(String[] args)`, `System.out.println(...)`."
        xp: 10
        payload:
          language: java
          template: |
            public [[1]] Salut {
                public static void [[2]](String[] args) {
                    System.out.[[3]]("Salut !");
                }
            }
          blanks:
            - ["class"]
            - ["main"]
            - ["println"]
      - slug: java-ex-presentation
        kind: CODE_LIBRE
        title: "Un programme Java complet"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Écris une classe `Presentation` avec une méthode `main` qui affiche trois lignes :
          `Bonjour`, `J'apprends Java` et `À bientôt`.
        criteria: "Classe Presentation, méthode main, trois System.out.println."
        hints:
          - "`public class Presentation { ... }`"
          - "`public static void main(String[] args) { ... }`"
          - "Trois lignes `System.out.println(\"...\");`"
        solution: |
          public class Presentation {
              public static void main(String[] args) {
                  System.out.println("Bonjour");
                  System.out.println("J'apprends Java");
                  System.out.println("À bientôt");
              }
          }
        explanation: "Le cadre (classe + main) entoure les instructions, exécutées dans l'ordre."
        xp: 15
        payload:
          language: java
          starter: |
            // Ta classe Presentation

          checks:
            - pattern: 'public\s+class\s+Presentation\s*\{'
              message: "Déclare public class Presentation { ... }."
            - pattern: 'public\s+static\s+void\s+main\s*\(\s*String\s*\[\]\s*\w+\s*\)'
              message: "Écris la méthode public static void main(String[] args)."
            - pattern: '\A(?>[\s\S]*?System\.out\.println\s*\(){3}'
              message: "Affiche trois lignes avec System.out.println."
            - pattern: 'System\.out\.println\s*\(\s*"Bonjour"\s*\)\s*;'
              message: "La première ligne affiche \"Bonjour\" (n'oublie pas le point-virgule)."
          output: |
            Bonjour
            J'apprends Java
            À bientôt
      - slug: java-ex-premier-bug
        kind: CORRIGER_ERREUR
        title: "Deux fautes de compilation"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Le compilateur refuse ce programme : `system` est écrit en minuscule et un point-virgule manque.
          Corrige les deux fautes.
        criteria: "System avec une majuscule, chaque instruction terminée par ;"
        hints:
          - "Java distingue majuscules et minuscules."
          - "Regarde la fin de chaque ligne d'affichage."
          - "`System.out.println(\"Coucou\");`"
        solution: |
          public class Coucou {
              public static void main(String[] args) {
                  System.out.println("Coucou");
                  System.out.println("Java est strict");
              }
          }
        explanation: "`System` prend une majuscule, et chaque instruction finit par un point-virgule."
        xp: 10
        payload:
          language: java
          starter: |
            public class Coucou {
                public static void main(String[] args) {
                    system.out.println("Coucou");
                    System.out.println("Java est strict")
                }
            }
          checks:
            - pattern: '\bsystem\.out'
              absent: true
              message: "System s'écrit avec une majuscule."
            - pattern: 'System\.out\.println\s*\(\s*"Java est strict"\s*\)\s*;'
              message: "Ajoute le point-virgule après la deuxième instruction."
          output: |
            Coucou
            Java est strict

  # ===================================================================== LEÇON 2
  - slug: java-types-conditions
    title: "Les variables typées : int, double, boolean, String"
    duration: 10
    objective: "Déclarer une variable en annonçant son type, et choisir le bon type pour chaque valeur."
    prerequisites: "Leçon « Ton premier programme Java »."
    skills: [java-bases]
    xp: 15
    memo: |
      - Java est **typé** : on annonce le type avant le nom, `int age = 18;`, et il ne change plus.
      - `int` : nombre entier ; `double` : nombre à virgule (écrite avec un point) ; `boolean` : `true`/`false` ; `String` : texte (avec une **majuscule**).
      - Changer la valeur : `age = 19;` (sans répéter le type).
      - Le compilateur refuse une valeur du mauvais type.
    commonMistakes: |
      - Mettre un nombre à virgule dans un `int` : `int prix = 9.99;` ne compile pas.
      - Écrire `string` en minuscules : c'est `String`.
      - Répéter le type pour changer la valeur : `int age = 19;` une deuxième fois est refusé.
    blocks:
      - type: text
        md: |
          En JavaScript, une variable pouvait contenir un nombre puis un texte. En Java, **non** : chaque
          variable a un **type fixe**, annoncé à sa création. Le compilateur vérifie tout.
      - type: definition
        id: def-typage-statique
        term: "Variable typée"
        md: |
          Des **bocaux étiquetés** : dans le bocal « sucre », on ne peut pas verser du sel. En Java, l'étiquette
          (le type) est écrite devant le nom de la variable, et elle ne change jamais.
      - type: code
        id: code-types
        language: java
        title: "Quatre variables typées"
        code: |
          public class Profil {
              public static void main(String[] args) {
                  int age = 25;
                  double taille = 1.68;
                  boolean abonnee = true;
                  String prenom = "Awa";
                  System.out.println(prenom);
                  System.out.println(age);
                  age = 26;
                  System.out.println(age);
              }
          }
        lines:
          - n: 3
            note: "`int` : un nombre entier."
          - n: 4
            note: "`double` : un nombre à virgule (écrite avec un point)."
          - n: 5
            note: "`boolean` : true ou false."
          - n: 6
            note: "`String` (avec une majuscule) : un texte."
          - n: 9
            note: "On change la valeur sans répéter le type."
      - type: question
        ref: java-tc-q1
        review: def-typage-statique
      - type: question
        ref: java-ty-q2
        review: code-types
      - type: text
        md: "**Exercice 1 (guidé)** : choisis les bons types."
      - type: exercise
        ref: java-ex-types-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : la fiche d'une ville."
      - type: exercise
        ref: java-ex-types-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : des valeurs dans le mauvais bocal."
      - type: exercise
        ref: java-ex-types-bug
      - type: jury
        items:
          - q: "Quelle différence entre un type primitif et un objet en Java ?"
            a: "Les primitifs (`int`, `double`, `boolean`) contiennent directement une valeur ; les objets (`String`, tes classes) sont manipulés par référence et ont des méthodes."
      - type: quiz
        items:
          - ref: java-tc-q5
            review: def-typage-statique
          - ref: java-ty-q4
            review: code-types
          - ref: java-ty-q5
            review: code-types
    questions:
      - code: java-tc-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Quelle déclaration compile ?"
        choices:
          - label: "`double taille = 1.68;`"
            correct: true
            why: "Un nombre à virgule dans un double."
          - label: "`int taille = 1.68;`"
            correct: false
            why: "Un int ne peut pas contenir de virgule."
          - label: "`int age = \"18\";`"
            correct: false
            why: "\"18\" est un texte."
        explanation: "Le type annoncé doit correspondre à la valeur."
      - code: java-ty-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Quel type choisir pour ranger « vrai » ou « faux » ?"
        choices:
          - label: "`boolean`"
            correct: true
            why: "true ou false."
          - label: "`String`"
            correct: false
            why: "String range des textes."
          - label: "`int`"
            correct: false
            why: "int range des nombres entiers."
        explanation: "`boolean connecte = false;`"
      - code: java-tc-q5
        kind: VRAI_FAUX
        difficulty: 2
        skill: java-bases
        prompt: "En Java, une variable déclarée `int` peut plus tard recevoir un texte."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : le type est fixé."
          - label: "Faux"
            correct: true
            why: "Exact : le compilateur refuse."
        explanation: "C'est la grande différence avec JavaScript."
      - code: java-ty-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "La variable `ville` existe déjà. Comment changer sa valeur en « Nice » ?"
        choices:
          - label: "`ville = \"Nice\";`"
            correct: true
            why: "Le type n'est écrit qu'à la création."
          - label: "`String ville = \"Nice\";`"
            correct: false
            why: "Répéter le type recrée la variable : refusé."
          - label: "`ville := \"Nice\";`"
            correct: false
            why: "Cette écriture n'existe pas en Java."
        explanation: "Le type s'écrit une seule fois, à la déclaration."
      - code: java-ty-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Comment s'écrit le type « texte » en Java ?"
        choices:
          - label: "`String`, avec une majuscule"
            correct: true
            why: "Les types objets commencent par une majuscule."
          - label: "`string`"
            correct: false
            why: "En minuscules, Java ne le reconnaît pas."
          - label: "`text`"
            correct: false
            why: "Ce type n'existe pas."
        explanation: "`String prenom = \"Awa\";`"
    exercises:
      - slug: java-ex-types-guide
        kind: COMPLETER
        title: "Choisir les bons types"
        difficulty: FACILE
        skill: java-bases
        statement: "Complète avec le type Java qui convient."
        criteria: "Les quatre types sont corrects."
        hints:
          - "Un âge entier : int. Une taille à virgule : double."
          - "Un texte : String, avec une majuscule."
          - "int, double, String, boolean."
        solution: '["int", "double", "String", "boolean"]'
        explanation: "Chaque valeur dans le bocal qui lui correspond."
        xp: 10
        payload:
          language: java
          template: |
            [[1]] age = 30;
            [[2]] taille = 1.75;
            [[3]] ville = "Lille";
            [[4]] connecte = false;
          blanks:
            - ["int"]
            - ["double"]
            - ["String"]
            - ["boolean"]
      - slug: java-ex-types-libre
        kind: CODE_LIBRE
        title: "La fiche d'une ville"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Dans le `main` d'une classe `Ville`, déclare :
          - `nom` (texte) qui vaut `"Dakar"` ;
          - `quartiers` (entier) qui vaut `19` ;
          - `capitale` (vrai/faux) qui vaut `true` ;
          puis affiche les trois, une ligne chacun.
        criteria: "Trois variables correctement typées et trois affichages."
        hints:
          - "`String nom = \"Dakar\";`"
          - "`int quartiers = 19;` et `boolean capitale = true;`"
          - "`System.out.println(nom);` (et pareil pour les deux autres)"
        solution: |
          public class Ville {
              public static void main(String[] args) {
                  String nom = "Dakar";
                  int quartiers = 19;
                  boolean capitale = true;
                  System.out.println(nom);
                  System.out.println(quartiers);
                  System.out.println(capitale);
              }
          }
        explanation: "Chaque valeur a son type : texte, entier, booléen."
        xp: 15
        payload:
          language: java
          starter: |
            public class Ville {
                public static void main(String[] args) {

                }
            }
          checks:
            - pattern: 'String\s+nom\s*=\s*"Dakar"\s*;'
              message: "Déclare String nom = \"Dakar\";"
            - pattern: 'int\s+quartiers\s*=\s*19\s*;'
              message: "Déclare int quartiers = 19;"
            - pattern: 'boolean\s+capitale\s*=\s*true\s*;'
              message: "Déclare boolean capitale = true;"
            - pattern: '\A(?>[\s\S]*?System\.out\.println\s*\(){3}'
              message: "Affiche les trois variables."
          output: |
            Dakar
            19
            true
      - slug: java-ex-types-bug
        kind: CORRIGER_ERREUR
        title: "Des valeurs dans le mauvais bocal"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Le compilateur refuse deux lignes : `taille` contient un nombre à virgule mais est déclarée `int`,
          et `inscrite` contient un booléen mais est déclarée `String`. Corrige les deux types.
        criteria: "taille est un double, inscrite est un boolean."
        hints:
          - "Un nombre à virgule se range dans un double."
          - "true se range dans un boolean."
          - "`double taille = 1.62;` et `boolean inscrite = true;`"
        solution: |
          public class Fiche {
              public static void main(String[] args) {
                  double taille = 1.62;
                  boolean inscrite = true;
                  System.out.println(taille);
                  System.out.println(inscrite);
              }
          }
        explanation: "Chaque valeur doit aller dans le bocal de son type."
        xp: 10
        payload:
          language: java
          starter: |
            public class Fiche {
                public static void main(String[] args) {
                    int taille = 1.62;
                    String inscrite = true;
                    System.out.println(taille);
                    System.out.println(inscrite);
                }
            }
          checks:
            - pattern: 'double\s+taille\s*=\s*1\.62\s*;'
              message: "taille contient un nombre à virgule : double taille = 1.62;"
            - pattern: 'boolean\s+inscrite\s*=\s*true\s*;'
              message: "inscrite contient true : boolean inscrite = true;"
          output: |
            1.62
            true

  # ===================================================================== LEÇON 3
  - slug: java-final
    title: "Une valeur qui ne change pas : final"
    duration: 8
    objective: "Déclarer une constante avec final et respecter la convention des MAJUSCULES."
    prerequisites: "Leçon « Les variables typées »."
    skills: [java-bases]
    xp: 10
    memo: |
      - `final` rend une variable **non modifiable** : c'est l'équivalent de `const`.
      - Convention : les constantes s'écrivent en **MAJUSCULES**, mots séparés par `_` : `final int AGE_MAJORITE = 18;`
      - Essayer de changer une variable `final` : **erreur de compilation**.
    commonMistakes: |
      - Oublier le type : `final AGE = 18;` ne compile pas (il faut `final int`).
      - Vouloir changer une constante plus loin dans le code.
    blocks:
      - type: text
        md: |
          L'âge de la majorité, le nom de l'application : ces valeurs ne changent jamais. On les protège
          avec `final`.
      - type: definition
        id: def-final
        term: "final"
        md: |
          Une valeur **gravée dans le marbre** : une fois écrite, personne ne peut la modifier. Le compilateur
          refuse toute tentative.
      - type: code
        id: code-final
        language: java
        title: "Deux constantes"
        code: |
          public class Reglages {
              public static void main(String[] args) {
                  final int AGE_MAJORITE = 18;
                  final String NOM_APPLI = "Code en Clair";
                  System.out.println(NOM_APPLI);
                  System.out.println(AGE_MAJORITE);
              }
          }
        lines:
          - n: 3
            note: "`final`, puis le type, puis le nom en MAJUSCULES."
          - n: 4
            note: "Une constante texte."
      - type: question
        ref: java-tc-q4
        review: def-final
      - type: question
        ref: java-fi-q2
        review: code-final
