          renvoyer son résultat. Corrige les deux problèmes.
        criteria: "Le paramètre est typé String et la méthode renvoie le message."
        hints:
          - "Chaque paramètre a un type."
          - "Une méthode qui n'est pas void doit renvoyer une valeur."
          - "`static String bienvenue(String ville) { return \"Bienvenue à \" + ville; }`"
        solution: |
          public class Tourisme {
              static String bienvenue(String ville) {
                  return "Bienvenue à " + ville;
              }

              public static void main(String[] args) {
                  System.out.println(bienvenue("Dakar"));
              }
          }
        explanation: "Paramètre typé, résultat renvoyé avec return."
        xp: 10
        payload:
          language: java
          starter: |
