                }
            }
          checks:
            - pattern: 'static\s+String\s+bienvenue\s*\(\s*String\s+ville\s*\)'
              message: "Type le paramètre : bienvenue(String ville)."
            - pattern: 'return\s+"Bienvenue à "\s*\+\s*ville\s*;'
              message: "Renvoie le message : return \"Bienvenue à \" + ville;"
          output: "Bienvenue à Dakar"

