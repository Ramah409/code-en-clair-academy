      - slug: java-ex-tableaux-libre
        kind: CODE_LIBRE
        title: "Une liste de couleurs"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Dans le `main` d'une classe `Couleurs` :
          1. crée le tableau `couleurs` avec `"rouge"`, `"vert"` et `"bleu"` ;
          2. affiche sa taille ;
          3. affiche chaque couleur avec une boucle for-each.
        criteria: "Un tableau String[], length, une boucle for-each."
        hints:
          - "`String[] couleurs = {\"rouge\", \"vert\", \"bleu\"};`"
          - "`System.out.println(couleurs.length);`"
          - "`for (String couleur : couleurs) { System.out.println(couleur); }`"
        solution: |
          public class Couleurs {
              public static void main(String[] args) {
                  String[] couleurs = {"rouge", "vert", "bleu"};
                  System.out.println(couleurs.length);
                  for (String couleur : couleurs) {
                      System.out.println(couleur);
                  }
              }
          }
        explanation: "La taille, puis chaque élément."
        xp: 15
        payload:
          language: java
          starter: |
            public class Couleurs {
                public static void main(String[] args) {

                }
            }
          checks:
            - pattern: 'String\s*\[\s*\]\s+couleurs\s*=\s*\{\s*"rouge"\s*,\s*"vert"\s*,\s*"bleu"\s*\}\s*;'
              message: "Crée String[] couleurs = {\"rouge\", \"vert\", \"bleu\"};"
            - pattern: 'System\.out\.println\s*\(\s*couleurs\.length\s*\)'
              message: "Affiche couleurs.length."
            - pattern: 'for\s*\(\s*String\s+\w+\s*:\s*couleurs\s*\)'
              message: "Parcours avec for (String couleur : couleurs)."
          output: |
            3
            rouge
            vert
            bleu
      - slug: java-ex-tableaux-bug
        kind: CORRIGER_ERREUR
        title: "Une case qui n'existe pas"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Ce programme plante avec « ArrayIndexOutOfBoundsException : Index 3 out of bounds for length 3 ».
          Il veut afficher le **dernier** invité. Corrige l'indice.
        criteria: "Le dernier invité est lu à l'indice 2."
        hints:
          - "Trois cases : 0, 1 et 2."
          - "La case 3 n'existe pas."
          - "`invites[2]`"
        solution: |
          public class Invites {
              public static void main(String[] args) {
                  String[] invites = {"Awa", "Léo", "Inès"};
                  System.out.println(invites[2]);
              }
          }
        explanation: "Le dernier élément est à l'indice length - 1, ici 2."
        xp: 10
        payload:
          language: java
          starter: |
            public class Invites {
                public static void main(String[] args) {
                    String[] invites = {"Awa", "Léo", "Inès"};
                    System.out.println(invites[3]);
                }
            }
          checks:
            - pattern: 'invites\s*\[\s*2\s*\]'
              message: "Lis la dernière case : invites[2]."
            - pattern: 'invites\s*\[\s*3\s*\]'
              absent: true
              message: "La case 3 n'existe pas."
          output: "Inès"

  # ===================================================================== LEÇON 9
  - slug: java-methodes
    title: "Écrire ses propres méthodes"
    duration: 11
    objective: "Écrire une méthode static avec des paramètres typés et un type de retour, puis l'appeler depuis main."
    prerequisites: "Leçon « Les tableaux »."
    skills: [java-bases]
    xp: 15
    memo: |
      - Une **méthode** Java = une fonction rangée dans une classe.
      - `static String saluer(String prenom) { return "Bonjour " + prenom; }` : type du résultat, nom, paramètres **typés**.
      - `void` : la méthode ne renvoie rien (comme `main`).
      - `static` : on peut l'appeler directement depuis `main`, sans créer d'objet (les objets arrivent au chapitre suivant).
      - Appel : `saluer("Awa")`.
    commonMistakes: |
      - Oublier le type d'un paramètre : `saluer(prenom)` dans la déclaration ne compile pas.
      - Oublier `return` alors que le type de retour n'est pas void.
      - Renvoyer une valeur du mauvais type.
    blocks:
      - type: text
        md: |
          En JavaScript, tu écrivais des fonctions. En Java, on les appelle des **méthodes**, et chaque
          information a son type : les paramètres **et** le résultat.
      - type: definition
        id: def-methode-java
        term: "Méthode"
        md: |
          Une **recette** avec une étiquette précise : « je prends un texte, je rends un texte ». Le compilateur
          vérifie qu'on lui donne bien les bons ingrédients et qu'elle rend bien le bon plat.
      - type: code
        id: code-methode-java
        language: java
        title: "Une méthode qui prépare un message"
        code: |
          public class Accueil {
              static String saluer(String prenom) {
                  return "Bonjour " + prenom + " !";
              }

              public static void main(String[] args) {
                  String message = saluer("Awa");
                  System.out.println(message);
                  System.out.println(saluer("Léo"));
              }
          }
        lines:
          - n: 2
            note: "`static`, le type du résultat (`String`), le nom, puis le paramètre typé (`String prenom`)."
          - n: 3
            note: "`return` renvoie le message préparé."
          - n: 7
            note: "L'appel, depuis main. Le résultat est rangé dans une variable String."
      - type: question
        ref: java-c1-b1
        review: def-methode-java
      - type: question
        ref: java-me-q2
        review: code-methode-java
      - type: text
        md: "**Exercice 1 (guidé)** : complète la méthode."
      - type: exercise
        ref: java-ex-methodes-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : choisir un tarif."
      - type: exercise
        ref: java-ex-tarif
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un paramètre sans type."
      - type: exercise
        ref: java-ex-methodes-bug
      - type: quiz
        items:
          - ref: java-me-q3
            review: def-methode-java
          - ref: java-me-q4
            review: code-methode-java
          - ref: java-me-q5
            review: def-methode-java
    questions:
      - code: java-c1-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-bases
        prompt: "Que signifie `void` dans une déclaration de méthode ?"
