        kind: CODE_LIBRE
        title: "Deux constantes et une variable"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Dans le `main` d'une classe `Jeu` :
          - déclare la constante `NOM_JEU` (texte) qui vaut `"Quiz CDA"` ;
          - déclare la variable `niveau` (texte) qui vaut `"débutante"`, puis change-la en `"confirmée"` ;
          - affiche `NOM_JEU`, puis `niveau`.
        criteria: "Une constante final en majuscules, une variable modifiée, deux affichages."
        hints:
          - "`final String NOM_JEU = \"Quiz CDA\";`"
          - "`String niveau = \"débutante\";` puis `niveau = \"confirmée\";`"
          - "Deux `System.out.println(...)`."
        solution: |
          public class Jeu {
              public static void main(String[] args) {
                  final String NOM_JEU = "Quiz CDA";
                  String niveau = "débutante";
                  niveau = "confirmée";
                  System.out.println(NOM_JEU);
                  System.out.println(niveau);
