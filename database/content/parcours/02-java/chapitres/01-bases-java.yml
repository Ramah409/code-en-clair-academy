              message: "Déclare String niveau = \"débutante\";"
            - pattern: '(?<!String\s)\bniveau\s*=\s*"confirmée"\s*;'
              message: "Change la valeur : niveau = \"confirmée\";"
            - pattern: 'System\.out\.println\s*\(\s*NOM_JEU\s*\)'
              message: "Affiche NOM_JEU."
          output: |
            Quiz CDA
            confirmée
