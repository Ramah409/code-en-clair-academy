  # ===================================================================== LEÇON 6
  - slug: java-equals
    title: "Comparer deux textes : equals"
    duration: 9
    objective: "Comparer le contenu de deux String avec equals, et comprendre pourquoi == ne convient pas."
    prerequisites: "Leçon « Les conditions en Java »."
    skills: [java-bases]
    xp: 10
    memo: |
      - Pour comparer deux textes : `a.equals(b)`, qui répond `true` ou `false`.
      - **Jamais** `a == b` pour des String : `==` vérifie si c'est le **même exemplaire** en mémoire, pas le même contenu.
      - Astuce : `"ADMIN".equals(role)` fonctionne même si `role` est vide (null).
      - `equalsIgnoreCase` compare sans tenir compte des majuscules.
    commonMistakes: |
      - Comparer des String avec `==` : le résultat peut être faux alors que les textes sont identiques.
    blocks:
      - type: text
        md: |
          En JavaScript, `===` comparait deux textes. En Java, les textes sont des **objets**, et on les compare
          avec un outil spécial : `equals`.
      - type: definition
        id: def-equals
        term: "equals"
        md: |
          `==` vérifie si deux variables désignent **le même exemplaire**, `equals` vérifie si elles ont **le
          même contenu**. Deux livres identiques achetés séparément ont le même contenu (`equals` vrai) mais ne
          sont pas le même exemplaire (`==` faux).
      - type: code
        id: code-equals
        language: java
        title: "Comparer des textes"
        code: |
          public class Connexion {
              public static void main(String[] args) {
                  String role = "ADMIN";
                  System.out.println(role.equals("ADMIN"));
                  System.out.println("admin".equals(role));
                  System.out.println("admin".equalsIgnoreCase(role));
              }
          }
        lines:
          - n: 4
            note: "Même contenu : true."
          - n: 5
            note: "Les majuscules comptent : false."
          - n: 6
            note: "`equalsIgnoreCase` ignore les majuscules : true."
      - type: compare
        left:
          title: "Piège"
          good: false
          language: java
          code: |
            if (saisie == "oui") { ... }
          md: "Compare les exemplaires : peut répondre faux même si la saisie vaut « oui »."
        right:
          title: "Correct"
          good: true
          language: java
          code: |
            if ("oui".equals(saisie)) { ... }
          md: "Compare le contenu."
      - type: question
        ref: java-tc-q2
        review: def-equals
      - type: question
        ref: java-eq-q2
        review: code-equals
      - type: text
        md: "**Exercice 1 (guidé)** : complète la comparaison."
      - type: exercise
        ref: java-ex-equals-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : vérifier un mot de passe."
      - type: exercise
        ref: java-ex-equals-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un == entre deux textes."
      - type: exercise
        ref: java-ex-equals-bug
      - type: jury
        items:
          - q: "Pourquoi compare-t-on les String avec equals et pas avec == ?"
            a: "`==` compare les références (le même objet en mémoire) ; `equals` compare le contenu. Deux textes identiques peuvent être deux objets différents."
      - type: quiz
        items:
          - ref: java-eq-q3
            review: def-equals
          - ref: java-eq-q4
            review: code-equals
          - ref: java-eq-q5
            review: def-equals
    questions:
      - code: java-tc-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-bases
        prompt: "Comment vérifier que `role` contient le texte ADMIN ?"
        choices:
          - label: "`\"ADMIN\".equals(role)`"
            correct: true
