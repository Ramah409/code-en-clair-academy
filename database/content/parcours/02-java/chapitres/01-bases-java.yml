      - slug: java-ex-tarif
        kind: CODE_LIBRE
        title: "Choisir un tarif"
        difficulty: INTERMEDIAIRE
        skill: java-bases
        statement: |
          Écris une méthode `static String tarif(int age, boolean etudiant)` qui renvoie :
          - `"Gratuit"` si l'âge est plus petit que 12 ;
          - `"Tarif réduit"` si la personne est étudiante ;
          - `"Plein tarif"` sinon.
        criteria: "Signature correcte, trois cas traités dans le bon ordre, valeurs de retour."
        hints:
          - "`static String tarif(int age, boolean etudiant) { ... }`"
          - "`if (age < 12) { return \"Gratuit\"; }` en premier."
          - "`else if (etudiant) { return \"Tarif réduit\"; }` puis `return \"Plein tarif\";`"
        solution: |
          static String tarif(int age, boolean etudiant) {
              if (age < 12) {
                  return "Gratuit";
              } else if (etudiant) {
                  return "Tarif réduit";
              }
              return "Plein tarif";
          }
        explanation: "Les cas sont testés du plus particulier au plus général."
        xp: 20
        payload:
          language: java
          starter: |
            // Ta méthode tarif

          checks:
            - pattern: 'static\s+String\s+tarif\s*\(\s*int\s+age\s*,\s*boolean\s+etudiant\s*\)'
              message: "Signature attendue : static String tarif(int age, boolean etudiant)."
            - pattern: 'if\s*\(\s*age\s*<\s*12\s*\)'
              message: "Teste d'abord l'âge : if (age < 12)."
            - pattern: 'return\s+"Gratuit"\s*;'
              message: "Les moins de 12 ans : return \"Gratuit\";"
            - pattern: 'if\s*\(\s*etudiant\s*(==\s*true\s*)?\)'
              message: "Teste le statut étudiant : else if (etudiant)."
            - pattern: 'return\s+"Tarif réduit"\s*;'
              message: "Pour les étudiants : return \"Tarif réduit\";"
            - pattern: 'return\s+"Plein tarif"\s*;'
              message: "Sinon : return \"Plein tarif\";"
            - pattern: 'age\s*<\s*12[\s\S]*etudiant'
              message: "Teste l'âge AVANT le statut étudiant."
      - slug: java-ex-methodes-bug
        kind: CORRIGER_ERREUR
        title: "Un paramètre sans type"
        difficulty: FACILE
        skill: java-bases
        statement: |
