        statement: |
          Dans le `main` d'une classe `Badge` :
          1. crée `prenom` qui vaut `"Awa"` et `role` qui vaut `"formatrice"` ;
          2. crée `badge` en collant le prénom, `" - "` et le rôle ;
          3. affiche `badge` en majuscules : `AWA - FORMATRICE`.
