  # ===================================================================== LEÇON 8
  - slug: java-tableaux
    title: "Les tableaux : String[] et la boucle for-each"
    duration: 10
    objective: "Créer un tableau Java de taille fixe, lire une case, connaître sa taille et le parcourir avec for-each."
    prerequisites: "Leçon « Les boucles en Java »."
    skills: [java-bases]
    xp: 15
    memo: |
      - `String[] jours = {"lundi", "mardi", "mercredi"};` : un tableau de textes (les crochets après le type).
      - Les cases commencent à **0** : `jours[0]` vaut `"lundi"`.
      - `jours.length` donne la taille — ici **sans** parenthèses.
      - Un tableau Java a une **taille fixe** : on ne peut pas y ajouter de case (pour ça, on utilisera les List).
      - Parcourir : `for (String jour : jours) { ... }` (le `:` se lit « dans »).
    commonMistakes: |
      - Écrire `jours.length()` : pour un tableau, c'est `length` sans parenthèses.
      - Lire une case qui n'existe pas : `ArrayIndexOutOfBoundsException`.
    blocks:
      - type: text
        md: |
          Comme en JavaScript, un tableau range plusieurs valeurs. En Java, il a un type (`String[]`) et une
          taille fixe.
      - type: definition
        id: def-tableau-java
        term: "Tableau Java"
        md: |
          Une **boîte à œufs** : un nombre de cases fixé à la fabrication, toutes de la même sorte. On peut
          changer ce qu'il y a dans une case, mais pas ajouter de case.
      - type: code
        id: code-tableau-java
        language: java
        title: "Un tableau de jours"
        code: |
          public class Planning {
              public static void main(String[] args) {
                  String[] jours = {"lundi", "mardi", "mercredi"};
                  System.out.println(jours[0]);
                  System.out.println(jours.length);
                  for (String jour : jours) {
                      System.out.println("Cours le " + jour);
                  }
              }
          }
        lines:
          - n: 3
            note: "`String[]` : un tableau de textes, créé avec des accolades."
          - n: 4
            note: "Case 0 : lundi."
          - n: 5
            note: "La taille : `length` sans parenthèses pour un tableau."
          - n: 6
            note: "for-each : « pour chaque jour dans jours ». L'équivalent du for…of de JavaScript."
