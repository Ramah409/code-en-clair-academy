  # ===================================================================== LEÇON 5
  - slug: java-conditions
    title: "Les conditions en Java : if, else, &&, ||"
    duration: 10
    objective: "Écrire des conditions en Java : la même écriture qu'en JavaScript, avec == et != pour comparer des nombres."
    prerequisites: "Leçon « Les textes : coller et transformer un String »."
    skills: [java-bases]
    xp: 15
    memo: |
      - `if`, `else if`, `else`, `&&`, `||`, `!` : **exactement** comme en JavaScript.
      - Nombres : `==` (égal), `!=` (différent), `<`, `>`, `<=`, `>=`. Java n'a pas de `===`.
      - Pour comparer des **textes**, il faudra un outil spécial : ce sera la leçon suivante.
      - La condition doit être un vrai `boolean` : `if (age)` ne compile pas.
    commonMistakes: |
      - Écrire `===` : n'existe pas en Java.
      - Écrire `if (age)` : la condition doit répondre true ou false.
    blocks:
      - type: text
        md: |
          Tu connais déjà les conditions en JavaScript. En Java, l'écriture est la même ; seul le signe
          « égal » change : `==` au lieu de `===`.
      - type: definition
        id: def-conditions-java
        term: "Conditions en Java"
        md: |
          Le même **carrefour** qu'en JavaScript : une question (vrai/faux) choisit la route. Pour comparer
          deux nombres, on écrit `==` (égal) ou `!=` (différent).
      - type: code
        id: code-conditions-java
        language: java
        title: "Un message selon l'heure et le jour"
        code: |
          public class Salutation {
              public static void main(String[] args) {
                  int heure = 20;
                  boolean weekEnd = true;
                  if (heure < 12) {
                      System.out.println("Bonjour");
                  } else if (heure < 18) {
                      System.out.println("Bon après-midi");
                  } else {
                      System.out.println("Bonsoir");
                  }
                  if (weekEnd || heure == 12) {
                      System.out.println("Pense à faire une pause !");
                  }
              }
          }
        lines:
          - n: 5
            note: "Comme en JavaScript : if, else if, else."
          - n: 12
            note: "`||` : le week-end, ou à midi pile (`==` compare deux nombres)."
      - type: question
        ref: java-cd-q1
        review: def-conditions-java
      - type: question
        ref: java-cd-q2
        review: code-conditions-java
      - type: text
        md: "**Exercice 1 (guidé)** : complète la condition."
      - type: exercise
        ref: java-ex-conditions-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : l'accès à une salle."
      - type: exercise
        ref: java-ex-conditions-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un === à la mode JavaScript."
      - type: exercise
        ref: java-ex-conditions-bug
      - type: quiz
        items:
          - ref: java-cd-q3
            review: def-conditions-java
          - ref: java-cd-q4
            review: code-conditions-java
          - ref: java-cd-q5
