          - label: "`role == \"ADMIN\"`"
            correct: false
            why: "== compare les exemplaires, pas le contenu."
          - label: "`role = \"ADMIN\"`"
            correct: false
            why: "C'est un rangement de valeur."
        explanation: "Pour les textes : equals."
      - code: java-eq-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: java-bases
        prompt: "Qu'affiche ce code ?"
        snippet: |
          String ville = "Lyon";
          System.out.println(ville.equals("lyon"));
        language: java
        choices:
          - label: "false"
            correct: true
            why: "Les majuscules comptent : L n'est pas l."
          - label: "true"
            correct: false
            why: "equals tient compte des majuscules."
          - label: "Lyon"
            correct: false
            why: "equals répond true ou false."
        explanation: "Pour ignorer les majuscules : equalsIgnoreCase."
      - code: java-eq-q3
        kind: VRAI_FAUX
