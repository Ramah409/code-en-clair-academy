      - type: exercise
        ref: java-ex-static-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un texte qui ne change pas."
      - type: exercise
        ref: java-ex-string-bug
      - type: jury
        items:
          - q: "Qu'est-ce que le garbage collector ?"
            a: "Un mécanisme de la JVM qui libère automatiquement la mémoire des objets qui ne sont plus utilisés ; le développeur n'a pas à libérer la mémoire à la main."
          - q: "Que signifie static ?"
            a: "Un membre static appartient à la classe et non à chaque objet : il est partagé et accessible sans objet."
          - q: "Pourquoi String est-il immuable ?"
            a: "Pour la sécurité et le partage : un texte ne peut pas être modifié dans le dos d'un autre code. Chaque transformation renvoie un nouveau String."
          - q: "Quelle différence entre JDK, JRE et JVM ?"
            a: "La JVM exécute le programme compilé ; le JRE contient la JVM et les bibliothèques ; le JDK ajoute les outils de développement, dont le compilateur."
