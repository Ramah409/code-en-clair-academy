      - slug: java-ex-solid-libre
        kind: CODE_LIBRE
        title: "Un service qui reçoit son journal"
        difficulty: INTERMEDIAIRE
        skill: poo
        statement: |
          1. l'interface `Journal` a une méthode `void noter(String message)` ;
          2. `JournalConsole implements Journal` affiche `"[journal] " + message` ;
          3. `ConnexionService` a un attribut `private final Journal journal`, reçu par le constructeur, et une
             méthode `connecter(String email)` qui appelle `journal.noter("Connexion de " + email)` ;
          4. dans le `main` de la classe `Site`, fabrique le service avec un `new JournalConsole()` et connecte
             `awa@exemple.fr`.
        criteria: "Interface, implémentation, dépendance private final reçue par le constructeur."
        hints:
          - "`interface Journal { void noter(String message); }`"
          - "`public ConnexionService(Journal journal) { this.journal = journal; }`"
          - "`new ConnexionService(new JournalConsole()).connecter(\"awa@exemple.fr\");`"
        solution: |
          public class Site {
              public static void main(String[] args) {
                  ConnexionService service = new ConnexionService(new JournalConsole());
                  service.connecter("awa@exemple.fr");
              }
          }

          interface Journal {
              void noter(String message);
          }

          class JournalConsole implements Journal {
              @Override
              public void noter(String message) {
                  System.out.println("[journal] " + message);
              }
          }

          class ConnexionService {
              private final Journal journal;

              public ConnexionService(Journal journal) {
                  this.journal = journal;
              }

              public void connecter(String email) {
                  journal.noter("Connexion de " + email);
              }
          }
        explanation: "Le service ne connaît que le contrat Journal : on pourrait écrire dans un fichier sans le modifier."
        xp: 25
        payload:
          language: java
          starter: |
            public class Site {
                public static void main(String[] args) {

                }
            }
          checks:
            - pattern: 'interface\s+Journal\s*\{\s*void\s+noter\s*\(\s*String\s+\w+\s*\)\s*;'
              message: "Déclare interface Journal { void noter(String message); }"
            - pattern: 'class\s+JournalConsole\s+implements\s+Journal'
              message: "JournalConsole implémente Journal."
            - pattern: 'private\s+final\s+Journal\s+journal\s*;'
              message: "Dans ConnexionService : private final Journal journal;"
            - pattern: 'ConnexionService\s*\(\s*Journal\s+journal\s*\)\s*\{\s*this\.journal\s*=\s*journal\s*;'
              message: "Reçois le journal par le constructeur."
            - pattern: 'new\s+ConnexionService\s*\(\s*new\s+JournalConsole\s*\(\s*\)\s*\)'
              message: "Dans main : new ConnexionService(new JournalConsole())."
          output: "[journal] Connexion de awa@exemple.fr"
      - slug: java-ex-solid-bug
        kind: CORRIGER_ERREUR
        title: "Une dépendance soudée"
        difficulty: INTERMEDIAIRE
        skill: poo
        statement: |
          `RappelService` fabrique lui-même un `NotificationEmail` : il est soudé à l'e-mail. Modifie-le pour
          qu'il **reçoive** une `Notification` par son constructeur (attribut `private final`), et fournis-lui
          un `NotificationEmail` dans le `main`.
        criteria: "Plus de new NotificationEmail() dans le service ; la dépendance est reçue par le constructeur."
        hints:
          - "Supprime le new à l'intérieur du service."
          - "Ajoute un constructeur RappelService(Notification notification)."
          - "Dans main : `new RappelService(new NotificationEmail())`."
        solution: |
          public class Agenda {
              public static void main(String[] args) {
                  RappelService rappel = new RappelService(new NotificationEmail());
                  rappel.rappeler("Cours à 9 h");
              }
          }

          interface Notification {
              void envoyer(String message);
          }

          class NotificationEmail implements Notification {
              @Override
              public void envoyer(String message) {
                  System.out.println("E-mail : " + message);
              }
          }

          class RappelService {
              private final Notification notification;

              public RappelService(Notification notification) {
                  this.notification = notification;
              }

              public void rappeler(String message) {
                  notification.envoyer(message);
              }
          }
        explanation: "Le service dépend maintenant du contrat, fourni de l'extérieur."
        xp: 20
        payload:
          language: java
          starter: |
            public class Agenda {
                public static void main(String[] args) {
                    RappelService rappel = new RappelService();
                    rappel.rappeler("Cours à 9 h");
                }
            }

            interface Notification {
                void envoyer(String message);
            }

            class NotificationEmail implements Notification {
                @Override
                public void envoyer(String message) {
                    System.out.println("E-mail : " + message);
                }
            }

            class RappelService {
                private NotificationEmail notification = new NotificationEmail();

                public void rappeler(String message) {
                    notification.envoyer(message);
                }
            }
          checks:
            - pattern: 'class\s+RappelService[\s\S]*new\s+NotificationEmail'
              absent: true
              message: "Le service ne doit plus fabriquer lui-même NotificationEmail."
            - pattern: 'private\s+final\s+Notification\s+notification\s*;'
              message: "Attribut : private final Notification notification;"
            - pattern: 'RappelService\s*\(\s*Notification\s+notification\s*\)'
              message: "Constructeur : RappelService(Notification notification)."
            - pattern: 'new\s+RappelService\s*\(\s*new\s+NotificationEmail\s*\(\s*\)\s*\)'
              message: "Dans main : new RappelService(new NotificationEmail())."
          output: "E-mail : Cours à 9 h"

  # ===================================================================== LEÇON 4
  - slug: java-questions-jury
    title: "Java devant le jury"
    duration: 12
    objective: "Répondre simplement aux questions classiques sur la JVM, la mémoire, static et String."
    prerequisites: "Leçon « Dépendre d'une interface »."
    skills: [java-bases, oral-cda]
    xp: 20
    memo: |
      - **JVM** : exécute le programme compilé ; **ramasse-miettes** (garbage collector) : libère la mémoire des objets inutilisés.
      - **Pile** (stack) : variables locales et appels de méthodes ; **tas** (heap) : les objets créés avec `new`.
      - `static` : appartient à la **classe**, partagé par tous les objets.
      - `String` est **immuable** : `StringBuilder` pour construire un texte en de nombreux morceaux.
      - **Maven** (fichier `pom.xml`) gère les bibliothèques et la construction d'un projet Java.
    commonMistakes: |
      - Réciter une définition sans exemple.
      - Confondre JVM, JRE et JDK.
    blocks:
      - type: text
        md: |
          Voici les questions Java qui reviennent le plus souvent. Pour chacune : une phrase simple, puis un
          exemple. Tu connais déjà toutes les notions : il s'agit de savoir les **expliquer**.
      - type: definition
        id: def-memoire
        term: "Pile et tas"
        md: |
          - La **pile** (stack) est un **bloc-notes** de travail : chaque méthode appelée y pose ses variables
            locales, qui disparaissent à la fin de la méthode.
          - Le **tas** (heap) est un **entrepôt** où vivent les objets créés avec `new`. Le **ramasse-miettes**
            passe régulièrement jeter ceux que plus personne n'utilise.
      - type: definition
        id: def-static
        term: "static"
        md: |
          Ce qui est `static` appartient à la **classe elle-même**, partagé par tous les objets, comme le
          règlement affiché dans le hall d'un immeuble (le même pour tous les appartements).
      - type: code
        id: code-static
        language: java
        title: "Un compteur partagé"
        code: |
          public class Comptes {
              public static void main(String[] args) {
                  new Compte("awa");
                  new Compte("leo");
                  System.out.println(Compte.nombreDeComptes);
              }
          }

          class Compte {
              static int nombreDeComptes = 0;
              private final String pseudo;

              public Compte(String pseudo) {
                  this.pseudo = pseudo;
                  nombreDeComptes++;
              }
          }
        lines:
          - n: 5
            note: "On lit l'attribut static sur la **classe** : il est partagé."
          - n: 10
            note: "`static` : un seul exemplaire pour toute la classe."
          - n: 15
            note: "Chaque nouveau compte fait avancer le même compteur."
      - type: question
        ref: java-jq-q3
        review: def-static
      - type: question
        ref: java-jq-q2
        review: def-memoire
