slug: java-examen
position: 4
level: EXAMEN
title: "Java pour le titre CDA"
summary: "Écrire un code Java propre (records, objets immuables, dépendre d'interfaces) et répondre aux questions Java du jury. Une seule notion par leçon."
quizQuestionCount: 12

lessons:
  # ===================================================================== LEÇON 1
  - slug: java-bonnes-pratiques
    title: "Les records : des classes de données en une ligne"
    duration: 10
    objective: "Écrire un record, lire ses champs et savoir ce que Java génère automatiquement (equals, hashCode, toString)."
    prerequisites: "Chapitre « Collections et exceptions »."
    skills: [poo, java-bases]
    xp: 15
    memo: |
      - `record Livre(String titre, String auteur) {}` : une classe de données **en une ligne**.
      - Java génère le constructeur, les accesseurs `titre()` et `auteur()` (sans « get »), `equals`, `hashCode` et `toString`.
      - Un record est **immuable** : pas de setter, ses champs ne changent plus.
      - Idéal pour les **DTO** (les données envoyées par une API).
      - Règle : deux objets égaux (`equals`) doivent avoir le même `hashCode` — le record s'en occupe pour toi.
    commonMistakes: |
      - Appeler `getTitre()` sur un record : c'est `titre()`.
      - Vouloir modifier un champ de record : impossible, il faut en créer un nouveau.
    blocks:
      - type: text
        md: |
          Beaucoup de classes ne servent qu'à **transporter des données** : un constructeur, des getters, et
          c'est tout. Java propose une écriture ultra-courte pour elles : le **record**.
      - type: definition
        id: def-record
        term: "record"
        md: |
          Une **enveloppe scellée** : on y met des informations à la fabrication, on peut les lire, mais plus
          les changer. Java écrit tout le reste pour toi.
      - type: compare
        left:
          title: "Classe classique (extrait)"
          language: java
          code: |
            class LivreDto {
                private final String titre;
                private final String auteur;
                public LivreDto(String titre, String auteur) { this.titre = titre; this.auteur = auteur; }
                public String getTitre() { return titre; }
                public String getAuteur() { return auteur; }
                // + equals, hashCode, toString…
            }
        right:
          title: "record (équivalent)"
          good: true
          language: java
          code: |
            record LivreDto(String titre, String auteur) {
            }
      - type: code
        id: code-record
        language: java
        title: "Utiliser un record"
        code: |
          public class Catalogue {
              public static void main(String[] args) {
                  LivreDto dune = new LivreDto("Dune", "Frank Herbert");
                  System.out.println(dune.titre());
                  System.out.println(dune);
                  LivreDto copie = new LivreDto("Dune", "Frank Herbert");
                  System.out.println(dune.equals(copie));
              }
          }

          record LivreDto(String titre, String auteur) {
          }
        lines:
          - n: 3
            note: "Le constructeur est généré : on donne les champs dans l'ordre."
          - n: 4
            note: "L'accesseur s'appelle `titre()`, pas `getTitre()`."
          - n: 5
            note: "`toString` généré : LivreDto[titre=Dune, auteur=Frank Herbert]."
          - n: 7
            note: "`equals` généré : mêmes valeurs, donc true."
      - type: question
        ref: java-bp-q1
        review: def-record
      - type: question
        ref: java-rc-q2
        review: code-record
      - type: text
        md: "**Exercice 1 (guidé)** : complète un record et son utilisation."
      - type: exercise
        ref: java-ex-record-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un record Ville."
      - type: exercise
        ref: java-ex-record-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un getter qui n'existe pas."
      - type: exercise
        ref: java-ex-record-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'un record et quand l'utilisez-vous ?"
            a: "Une classe de données immuable dont Java génère constructeur, accesseurs, equals, hashCode et toString. Je l'utilise pour les DTO de mon API."
          - q: "Pourquoi redéfinir hashCode quand on redéfinit equals ?"
            a: "Parce que les collections à hachage (HashMap, HashSet) utilisent hashCode pour ranger les objets ; deux objets égaux doivent avoir le même hashCode, sinon on ne les retrouve pas."
      - type: quiz
        items:
          - ref: java-bp-q3
            review: def-record
          - ref: java-rc-q4
            review: code-record
          - ref: java-bp-q5
            review: def-record
    questions:
      - code: java-bp-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-bases
        prompt: "Que génère Java automatiquement pour `record Point(int x, int y)` ?"
        choices:
          - label: "Le constructeur, les accesseurs x() et y(), equals, hashCode et toString"
            correct: true
            why: "Tout le code répétitif."
          - label: "Des setters setX et setY"
            correct: false
            why: "Un record est immuable : pas de setter."
          - label: "Rien, il faut tout écrire"
            correct: false
            why: "C'est justement l'intérêt du record."
        explanation: "Records : immuables et concis."
      - code: java-rc-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Comment lire le champ auteur du record `dune` ?"
        choices:
          - label: "`dune.auteur()`"
            correct: true
            why: "L'accesseur porte le nom du champ, avec des parenthèses."
          - label: "`dune.getAuteur()`"
            correct: false
            why: "Un record ne génère pas de get."
          - label: "`dune.auteur`"
            correct: false
            why: "Le champ est privé : on passe par l'accesseur."
        explanation: "Record : `nomDuChamp()`."
      - code: java-bp-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: java-collections
        prompt: "Deux objets égaux selon equals peuvent avoir des hashCode différents sans poser de problème."
        choices:
          - label: "Vrai"
            correct: false
            why: "Non : HashSet et HashMap ne les retrouveraient pas."
          - label: "Faux"
            correct: true
            why: "Exact : c'est le contrat equals / hashCode."
        explanation: "Égaux ⇒ même hashCode (le record le garantit)."
      - code: java-rc-q4
        kind: RESULTAT_CODE
        difficulty: 2
        skill: java-bases
        prompt: "Dans l'exemple, qu'affiche `dune.equals(copie)` ?"
        snippet: |
          LivreDto dune = new LivreDto("Dune", "Frank Herbert");
          LivreDto copie = new LivreDto("Dune", "Frank Herbert");
          System.out.println(dune.equals(copie));
        language: java
        choices:
          - label: "true"
            correct: true
            why: "Le equals généré compare les valeurs des champs."
          - label: "false"
            correct: false
            why: "Ce sont deux objets, mais leurs valeurs sont identiques."
          - label: "Une erreur"
            correct: false
            why: "equals est généré automatiquement."
        explanation: "Un record compare ses valeurs, pas ses exemplaires."
      - code: java-bp-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-bases
        prompt: "Quelle convention de nommage est correcte en Java ?"
        choices:
          - label: "Classe `InscriptionService`, méthode `envoyerEmail`, constante `NOMBRE_ESSAIS`"
            correct: true
            why: "PascalCase, camelCase, MAJUSCULES."
          - label: "Classe `inscription_service`, méthode `EnvoyerEmail`"
            correct: false
            why: "Conventions inversées."
          - label: "Tout en majuscules"
            correct: false
            why: "Réservé aux constantes."
        explanation: "Des conventions partagées rendent le code lisible par toute l'équipe."
    exercises:
      - slug: java-ex-record-guide
        kind: COMPLETER
        title: "Compléter un record"
        difficulty: FACILE
        skill: java-bases
        statement: "Complète le record et la lecture d'un champ."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Le mot-clé qui remplace class pour une classe de données."
          - "On lit un champ de record avec son nom suivi de parenthèses."
          - "record, email, email."
        solution: '["record", "email", "email"]'
        explanation: "`record UtilisatriceDto(Long id, String email)` ; on lit avec `dto.email()` (pas `getEmail()`)."
        xp: 10
        payload:
          language: java
          template: |
            [[1]] UtilisatriceDto(Long id, String [[2]]) {
            }

            UtilisatriceDto dto = new UtilisatriceDto(1L, "awa@exemple.fr");
            System.out.println(dto.[[3]]());
          blanks:
            - ["record"]
            - ["email"]
            - ["email"]
      - slug: java-ex-record-libre
        kind: CODE_LIBRE
        title: "Un record Ville"
        difficulty: FACILE
        skill: java-bases
        statement: |
          1. déclare un record `Ville` avec deux champs texte : `nom` et `pays` ;
          2. dans le `main` de la classe `Carte`, fabrique `new Ville("Bamako", "Mali")` et affiche son nom
             puis son pays avec les accesseurs.
        criteria: "Un record à deux champs, un new, deux accesseurs."
        hints:
          - "`record Ville(String nom, String pays) { }`"
          - "`Ville v = new Ville(\"Bamako\", \"Mali\");`"
          - "`System.out.println(v.nom());` puis `System.out.println(v.pays());`"
        solution: |
          public class Carte {
              public static void main(String[] args) {
                  Ville v = new Ville("Bamako", "Mali");
                  System.out.println(v.nom());
                  System.out.println(v.pays());
              }
          }

          record Ville(String nom, String pays) {
          }
        explanation: "Une ligne pour le record, Java fait le reste."
        xp: 15
        payload:
          language: java
          starter: |
            public class Carte {
                public static void main(String[] args) {

                }
            }
          checks:
            - pattern: 'record\s+Ville\s*\(\s*String\s+nom\s*,\s*String\s+pays\s*\)'
              message: "Déclare record Ville(String nom, String pays) { }"
            - pattern: 'new\s+Ville\s*\(\s*"Bamako"\s*,\s*"Mali"\s*\)'
              message: "Fabrique new Ville(\"Bamako\", \"Mali\")."
            - pattern: '\w+\.nom\s*\(\s*\)'
              message: "Lis le nom avec v.nom()."
            - pattern: '\w+\.pays\s*\(\s*\)'
              message: "Lis le pays avec v.pays()."
          output: |
            Bamako
            Mali
      - slug: java-ex-record-bug
        kind: CORRIGER_ERREUR
        title: "Un getter qui n'existe pas"
        difficulty: FACILE
        skill: java-bases
        statement: |
          Le compilateur refuse `film.getTitre()` : un record ne génère pas de méthode « get ». Corrige
          l'appel.
        criteria: "Le champ est lu avec titre()."
        hints:
          - "L'accesseur d'un record porte le nom du champ."
          - "Sans get, avec des parenthèses."
          - "`film.titre()`"
        solution: |
          public class Cinema {
              public static void main(String[] args) {
                  FilmDto film = new FilmDto("Atlantique", "Mati Diop");
                  System.out.println(film.titre());
              }
          }

          record FilmDto(String titre, String realisatrice) {
          }
        explanation: "Record : `titre()`, pas `getTitre()`."
        xp: 10
        payload:
          language: java
          starter: |
            public class Cinema {
                public static void main(String[] args) {
                    FilmDto film = new FilmDto("Atlantique", "Mati Diop");
                    System.out.println(film.getTitre());
                }
            }

            record FilmDto(String titre, String realisatrice) {
            }
          checks:
            - pattern: 'getTitre'
              absent: true
              message: "Un record n'a pas de getTitre()."
            - pattern: 'film\.titre\s*\(\s*\)'
              message: "Lis le champ avec film.titre()."
          output: "Atlantique"

  # ===================================================================== LEÇON 2
  - slug: java-immuable
    title: "Des objets qui ne changent pas : l'immutabilité"
    duration: 10
    objective: "Rendre une classe immuable (attributs private final, pas de setter) et comprendre pourquoi c'est plus sûr."
    prerequisites: "Leçon « Les records »."
    skills: [poo]
    xp: 15
    memo: |
      - Un objet **immuable** ne change plus après sa fabrication.
      - Recette : attributs `private final`, **aucun setter**, valeurs données dans le constructeur.
      - Pour « changer », on fabrique un **nouvel** objet.
      - `String` et les records sont immuables.
      - Avantage : aucune autre partie du code ne peut modifier l'objet dans ton dos.
    commonMistakes: |
      - Garder un setter « au cas où » : l'objet n'est plus immuable.
      - Oublier `final` sur un attribut.
    blocks:
      - type: text
        md: |
          Une adresse change ? Plutôt que de modifier l'ancienne (que d'autres parties du code utilisent peut-être),
          on en crée une **nouvelle**. C'est l'**immutabilité**.
      - type: definition
        id: def-immuable
        term: "Objet immuable"
        md: |
          Une **photo imprimée** : on ne peut pas la retoucher, mais on peut en imprimer une nouvelle. Personne
          ne peut modifier ta photo en cachette.
      - type: code
        id: code-immuable
        language: java
        title: "Une adresse immuable"
        code: |
          public class Demenagement {
              public static void main(String[] args) {
                  Adresse avant = new Adresse("rue des Lilas", "Lyon");
                  Adresse apres = new Adresse("avenue Blanche", "Dakar");
                  System.out.println(avant.getVille());
                  System.out.println(apres.getVille());
              }
          }

          class Adresse {
              private final String rue;
              private final String ville;

              public Adresse(String rue, String ville) {
                  this.rue = rue;
                  this.ville = ville;
              }

              public String getRue() { return rue; }
              public String getVille() { return ville; }
          }
        lines:
          - n: 4
            note: "Pour « déménager », on fabrique une nouvelle adresse."
          - n: 11
            note: "`private final` : rempli une seule fois, dans le constructeur."
          - n: 19
            note: "Des getters, aucun setter."
      - type: question
        ref: java-im-q1
        review: def-immuable
      - type: question
        ref: java-im-q2
        review: code-immuable
      - type: text
        md: "**Exercice 1 (guidé)** : complète la classe immuable."
      - type: exercise
        ref: java-ex-immuable-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un badge immuable."
      - type: exercise
        ref: java-ex-immuable-libre
      - type: text
        md: "**Exercice 3 (améliorer un code)** : rends cette classe immuable."
      - type: exercise
        ref: java-ex-immuable
      - type: quiz
        items:
          - ref: java-im-q3
            review: def-immuable
          - ref: java-im-q4
            review: code-immuable
          - ref: java-im-q5
            review: def-immuable
    questions:
      - code: java-im-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Qu'est-ce qu'un objet immuable ?"
        choices:
          - label: "Un objet qui ne change plus après sa fabrication"
            correct: true
            why: "Comme une photo imprimée."
          - label: "Un objet qu'on ne peut pas fabriquer"
            correct: false
            why: "On le fabrique normalement avec new."
          - label: "Un objet sans attributs"
            correct: false
            why: "Il a des attributs, mais ils ne changent plus."
        explanation: "Immuable = non modifiable après création."
      - code: java-im-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: poo
        prompt: "Quelle recette rend une classe immuable ?"
        choices:
          - label: "Attributs private final, et aucun setter"
            correct: true
            why: "Remplis une fois, jamais modifiés."
          - label: "Attributs public"
            correct: false
            why: "Au contraire : n'importe qui pourrait les changer."
          - label: "Un setter par attribut"
            correct: false
            why: "Les setters permettent de modifier."
        explanation: "private final + pas de setter (ou un record)."
      - code: java-im-q3
        kind: VRAI_FAUX
        difficulty: 1
        skill: poo
        prompt: "`String` est immuable en Java."
        choices:
          - label: "Vrai"
            correct: true
            why: "Chaque « modification » crée un nouveau texte."
          - label: "Faux"
            correct: false
            why: "toUpperCase() renvoie un nouveau String sans changer l'ancien."
        explanation: "C'est pour ça qu'on écrit `nom = nom.toUpperCase();`."
      - code: java-im-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: poo
        prompt: "Dans l'exemple, comment « changer » l'adresse de quelqu'un ?"
        choices:
          - label: "En fabriquant une nouvelle Adresse"
            correct: true
            why: "L'ancienne reste intacte."
          - label: "Avec setVille"
            correct: false
            why: "Il n'y a volontairement pas de setter."
          - label: "En écrivant avant.ville = \"Dakar\""
            correct: false
            why: "L'attribut est private final."
        explanation: "Immuable : on remplace, on ne modifie pas."
      - code: java-im-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: poo
        prompt: "Quel est l'avantage principal d'un objet immuable ?"
        choices:
          - label: "Aucune autre partie du code ne peut le modifier en cachette"
            correct: true
            why: "Moins de surprises, moins de bugs."
          - label: "Il est plus rapide à fabriquer"
            correct: false
            why: "Ce n'est pas une question de vitesse."
          - label: "Il prend moins de place"
            correct: false
            why: "Ce n'est pas son intérêt."
        explanation: "Plus simple à comprendre, plus sûr."
    exercises:
      - slug: java-ex-immuable-guide
        kind: COMPLETER
        title: "Compléter la classe immuable"
        difficulty: FACILE
        skill: poo
        statement: "Complète pour que la classe Carte soit immuable."
        criteria: "Les deux trous sont corrects."
        hints:
          - "Un attribut protégé et figé : private final."
          - "Le deuxième mot fige la valeur."
          - "private, final."
        solution: '["private", "final"]'
        explanation: "`private final String titulaire;`"
        xp: 10
        payload:
          language: java
          template: |
            class Carte {
                [[1]] [[2]] String titulaire;

                public Carte(String titulaire) {
                    this.titulaire = titulaire;
                }

                public String getTitulaire() {
                    return titulaire;
                }
            }
          blanks:
            - ["private"]
            - ["final"]
      - slug: java-ex-immuable-libre
        kind: CODE_LIBRE
        title: "Un badge immuable"
        difficulty: FACILE
        skill: poo
        statement: |
          Écris une classe `Badge` immuable :
          - deux attributs `private final String` : `nom` et `service` ;
          - un constructeur qui les remplit ;
          - deux getters, et **aucun** setter.

          Dans le `main` de la classe `Accueil`, fabrique un badge (`"Awa"`, `"Formation"`) et affiche son
          service.
        criteria: "Attributs private final, constructeur, getters, pas de setter."
        hints:
          - "`private final String nom;` et `private final String service;`"
          - "`public String getService() { return service; }`"
          - "Pas de méthode qui commence par set."
        solution: |
          public class Accueil {
              public static void main(String[] args) {
                  Badge badge = new Badge("Awa", "Formation");
                  System.out.println(badge.getService());
              }
          }

          class Badge {
              private final String nom;
              private final String service;

              public Badge(String nom, String service) {
                  this.nom = nom;
                  this.service = service;
              }

              public String getNom() { return nom; }
              public String getService() { return service; }
          }
        explanation: "Une fois fabriqué, le badge ne peut plus changer."
        xp: 15
        payload:
          language: java
          starter: |
            public class Accueil {
                public static void main(String[] args) {

                }
            }

            class Badge {

            }
          checks:
            - pattern: 'private\s+final\s+String\s+nom\s*;'
              message: "Déclare private final String nom;"
            - pattern: 'private\s+final\s+String\s+service\s*;'
              message: "Déclare private final String service;"
            - pattern: 'public\s+String\s+getService\s*\(\s*\)'
              message: "Ajoute le getter getService()."
            - pattern: '\bset[A-Z]\w*\s*\('
              absent: true
              message: "Pas de setter : l'objet est immuable."
          output: "Formation"
      - slug: java-ex-immuable
        kind: CORRIGER_ERREUR
        title: "Rendre une classe immuable"
        difficulty: INTERMEDIAIRE
        skill: poo
        statement: |
          Cette classe `Adresse` peut être modifiée n'importe quand. Rends-la **immuable** :
          - attributs `private final` ;
          - plus aucun setter ;
          - les getters restent.
          (Tu peux aussi la remplacer par un `record Adresse(String rue, String ville)`.)
        criteria: "Aucun setter ; attributs final (ou record)."
        hints:
          - "Supprime `setRue` et `setVille`."
          - "Ajoute `final` : `private final String rue;`"
          - "Ou plus court : `public record Adresse(String rue, String ville) { }`"
        solution: |
          public class Adresse {
              private final String rue;
              private final String ville;

              public Adresse(String rue, String ville) {
                  this.rue = rue;
                  this.ville = ville;
              }

              public String getRue() { return rue; }
              public String getVille() { return ville; }
          }
        explanation: "Une adresse qui change se remplace par une nouvelle adresse : aucune autre partie du code ne peut la modifier dans son dos."
        xp: 25
        payload:
          language: java
          starter: |
            public class Adresse {
                private String rue;
                private String ville;

                public Adresse(String rue, String ville) {
                    this.rue = rue;
                    this.ville = ville;
                }

                public String getRue() { return rue; }
                public String getVille() { return ville; }
                public void setRue(String rue) { this.rue = rue; }
                public void setVille(String ville) { this.ville = ville; }
            }
          checks:
            - pattern: '\bset[A-Z]\w*\s*\('
              absent: true
              message: "Supprime les setters : un objet immuable ne se modifie plus."
            - pattern: 'private\s+final\s+String\s+rue|record\s+Adresse\s*\(\s*String\s+rue'
              message: "rue doit être final (ou utilise un record)."
            - pattern: 'private\s+final\s+String\s+ville|record\s+Adresse\s*\([^)]*String\s+ville'
              message: "ville doit être final (ou utilise un record)."

  # ===================================================================== LEÇON 3
  - slug: java-solid
    title: "Dépendre d'une interface : les principes SOLID"
    duration: 11
    objective: "Appliquer deux principes SOLID : une classe = une responsabilité, et recevoir ses dépendances (des interfaces) par le constructeur."
    prerequisites: "Leçon « Des objets qui ne changent pas »."
    skills: [poo]
    xp: 20
    memo: |
      - **S — responsabilité unique** : une classe fait **une seule chose** (le service d'inscription n'envoie pas les factures).
      - **D — inversion des dépendances** : une classe dépend d'un **contrat** (interface), pas d'une classe précise.
      - On **reçoit** ses dépendances par le constructeur (on ne les fabrique pas soi-même avec new) : c'est l'**injection**, ce que fait Spring.
      - Attribut de dépendance : `private final`.
    commonMistakes: |
      - Fabriquer ses dépendances à l'intérieur (`new NotificationEmail()`) : impossible de changer sans modifier la classe.
      - Des classes « fourre-tout » qui font tout.
    blocks:
      - type: text
        md: |
          Un code qui marche n'est pas forcément un bon code. Le jury regarde aussi s'il est **facile à faire
          évoluer**. Deux principes (sur les cinq de SOLID) reviennent toujours.
      - type: definition
        id: def-solid
        term: "SOLID (S et D)"
        md: |
          - **S** : un **métier par personne** dans une équipe — la cuisinière cuisine, le serveur sert.
          - **D** : une lampe se **branche sur une prise** normalisée, elle n'est pas soudée à une centrale
            électrique. On peut changer de fournisseur sans changer la lampe.
      - type: code
        id: code-solid
        language: java
        title: "Un service qui reçoit sa dépendance"
        code: |
          public class Application {
              public static void main(String[] args) {
                  InscriptionService service = new InscriptionService(new NotificationSms());
                  service.inscrire("awa@exemple.fr");
              }
          }

          interface Notification {
              void envoyer(String message);
          }

          class NotificationSms implements Notification {
              @Override
              public void envoyer(String message) {
                  System.out.println("SMS : " + message);
              }
          }

          class InscriptionService {
              private final Notification notification;

              public InscriptionService(Notification notification) {
                  this.notification = notification;
              }

              public void inscrire(String email) {
                  notification.envoyer("Bienvenue " + email);
              }
          }
        lines:
          - n: 3
            note: "On **fournit** la dépendance de l'extérieur. Demain, on pourra donner un e-mail à la place."
          - n: 20
            note: "Le type de l'attribut est l'**interface**, et il est `final`."
          - n: 22
            note: "Injection par le constructeur, comme le fait Spring."
          - n: 27
            note: "Le service ne sait pas si c'est un SMS ou un e-mail : il suit le contrat."
      - type: question
        ref: java-bp-q2
        review: def-solid
