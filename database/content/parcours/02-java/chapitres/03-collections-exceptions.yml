      - slug: java-ex-exception-perso
        kind: CODE_LIBRE
        title: "Une exception EmailDejaUtilise"
        difficulty: INTERMEDIAIRE
        skill: java-exceptions
        statement: |
          1. crée `EmailDejaUtiliseException`, qui hérite de `RuntimeException`, avec un constructeur
             `EmailDejaUtiliseException(String email)` qui appelle `super("E-mail déjà utilisé : " + email)` ;
          2. écris `static void inscrire(Set<String> emails, String email)` qui lève cette exception si
             l'e-mail est déjà dans l'ensemble (`contains`), sinon l'ajoute avec `add`.
        criteria: "Exception personnalisée, contrôle de l'e-mail, levée de l'exception, ajout."
        hints:
          - "`class EmailDejaUtiliseException extends RuntimeException { ... }`"
          - "`if (emails.contains(email)) { throw new EmailDejaUtiliseException(email); }`"
          - "Sinon : `emails.add(email);`"
        solution: |
          class EmailDejaUtiliseException extends RuntimeException {
              public EmailDejaUtiliseException(String email) {
                  super("E-mail déjà utilisé : " + email);
              }
          }

          static void inscrire(Set<String> emails, String email) {
              if (emails.contains(email)) {
                  throw new EmailDejaUtiliseException(email);
              }
              emails.add(email);
          }
        explanation: "L'exception porte un nom métier clair : l'API pourra répondre 409 (conflit)."
        xp: 25
        payload:
          language: java
          starter: |
            // Exception et méthode

          checks:
            - pattern: 'class\s+EmailDejaUtiliseException\s+extends\s+RuntimeException'
              message: "L'exception hérite de RuntimeException."
            - pattern: 'EmailDejaUtiliseException\s*\(\s*String\s+\w+\s*\)\s*\{\s*super\s*\('
              message: "Le constructeur reçoit l'e-mail et appelle super(message)."
            - pattern: 'static\s+void\s+inscrire\s*\(\s*Set\s*<\s*String\s*>\s+\w+\s*,\s*String\s+\w+\s*\)'
              message: "Signature : static void inscrire(Set<String> emails, String email)."
            - pattern: 'if\s*\(\s*\w+\.contains\s*\(\s*\w+\s*\)\s*\)'
              message: "Vérifie si l'e-mail est déjà présent : if (emails.contains(email))."
            - pattern: 'throw\s+new\s+EmailDejaUtiliseException\s*\('
              message: "Lève EmailDejaUtiliseException quand l'e-mail est déjà utilisé."
            - pattern: '\w+\.add\s*\(\s*\w+\s*\)'
              message: "Sinon, ajoute l'e-mail : emails.add(email)."
