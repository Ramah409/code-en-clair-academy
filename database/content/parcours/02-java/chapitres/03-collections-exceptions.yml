  - slug: java-exceptions
    title: "Lever et attraper une exception : throw, try, catch"
    duration: 11
    objective: "Lever une exception avec throw quand une règle n'est pas respectée, et l'attraper avec try / catch."
    prerequisites: "Leçon « Filtrer et transformer : les streams »."
    skills: [java-exceptions]
    xp: 15
    memo: |
      - `throw new IllegalArgumentException("message")` **lève** une exception : la méthode s'arrête là.
      - `try { ... } catch (IllegalArgumentException e) { ... }` : on essaie, et on **attrape** un type d'exception précis.
      - `e.getMessage()` donne le texte de l'exception.
      - Comme en JavaScript, mais le `catch` précise **quel type** d'exception il attrape.
    commonMistakes: |
      - Oublier `new` : `throw IllegalArgumentException(...)` ne compile pas.
      - Un catch vide : l'erreur est cachée.
    blocks:
      - type: text
        md: |
          Tu as vu throw / try / catch en JavaScript. Java fait pareil, avec une précision : on dit **quel
          type** d'exception on attrape.
      - type: definition
        id: def-exception-java
        term: "Exception"
        md: |
          Un **signalement** : lancé (`throw`) là où le problème survient, et reçu (`catch`) par le service qui
          sait quoi en faire. Chaque signalement a un type, comme un formulaire différent selon le problème.
      - type: code
        id: code-exception-java
        language: java
        title: "Refuser un pseudo vide"
        code: |
          public class Inscription {
              static String creerPseudo(String saisie) {
                  if (saisie.isBlank()) {
                      throw new IllegalArgumentException("Le pseudo ne peut pas être vide");
                  }
                  return saisie.trim();
              }

              public static void main(String[] args) {
                  try {
                      System.out.println(creerPseudo("   "));
                  } catch (IllegalArgumentException e) {
                      System.out.println("Refusé : " + e.getMessage());
                  }
              }
          }
        lines:
          - n: 3
            note: "`isBlank()` : le texte est vide ou fait seulement d'espaces."
          - n: 4
            note: "`throw` lève l'exception : la méthode s'arrête ici."
          - n: 12
            note: "`catch` attrape ce type précis d'exception."
          - n: 13
            note: "`getMessage()` : le texte de l'exception."
