      - slug: java-ex-finally-libre
        kind: CODE_LIBRE
        title: "Toujours dire au revoir"
        difficulty: FACILE
        skill: java-exceptions
        statement: |
          Dans le `main` de la classe `Session` : dans un `try`, lève une
          `IllegalStateException("Session expirée")` ; dans le `catch`, affiche le message ; dans un
          `finally`, affiche `Au revoir`.
        criteria: "try qui lève, catch qui affiche getMessage(), finally qui affiche Au revoir."
        hints:
          - "`try { throw new IllegalStateException(\"Session expirée\"); }`"
          - "`catch (IllegalStateException e) { System.out.println(e.getMessage()); }`"
          - "`finally { System.out.println(\"Au revoir\"); }`"
        solution: |
          public class Session {
              public static void main(String[] args) {
                  try {
                      throw new IllegalStateException("Session expirée");
                  } catch (IllegalStateException e) {
                      System.out.println(e.getMessage());
                  } finally {
                      System.out.println("Au revoir");
                  }
              }
          }
        explanation: "Le finally s'exécute après le catch, dans tous les cas."
        xp: 15
        payload:
          language: java
          starter: |
            public class Session {
                public static void main(String[] args) {

                }
            }
          checks:
            - pattern: 'throw\s+new\s+IllegalStateException\s*\(\s*"Session expirée"\s*\)'
              message: "Dans le try : throw new IllegalStateException(\"Session expirée\");"
            - pattern: 'catch\s*\(\s*IllegalStateException\s+(\w+)\s*\)\s*\{\s*System\.out\.println\s*\(\s*\1\.getMessage\s*\(\s*\)\s*\)'
              message: "Dans le catch, affiche e.getMessage()."
            - pattern: 'finally\s*\{\s*System\.out\.println\s*\(\s*"Au revoir"\s*\)'
              message: "Dans le finally, affiche \"Au revoir\"."
          output: |
            Session expirée
            Au revoir
      - slug: java-ex-finally-bug
        kind: CORRIGER_ERREUR
        title: "Une exception vérifiée pas déclarée"
        difficulty: INTERMEDIAIRE
        skill: java-exceptions
        statement: |
          Le compilateur refuse la méthode `lire` : « unreported exception IOException ; must be caught or
          declared to be thrown ». Déclare l'exception dans la signature avec `throws`.
        criteria: "La méthode lire déclare throws IOException."
        hints:
          - "Files.readString peut lever une IOException, qui est vérifiée."
          - "Il faut la déclarer dans la signature."
          - "`static String lire(String chemin) throws IOException`"
        solution: |
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          public class Carnet {
              static String lire(String chemin) throws IOException {
                  return Files.readString(Path.of(chemin));
              }

              public static void main(String[] args) {
                  try {
                      System.out.println(lire("absent.txt"));
                  } catch (IOException e) {
                      System.out.println("Fichier introuvable");
                  }
              }
          }
        explanation: "Une exception vérifiée doit être déclarée (throws) ou attrapée (catch)."
        xp: 15
        payload:
          language: java
          starter: |
