                  roles.put("leo@exemple.fr", "APPRENANT");
                  System.out.println(roles.get("awa@exemple.fr"));
                  System.out.println(roles.containsKey("zoe@exemple.fr"));
              }
          }
        explanation: "Recherche directe par e-mail : c'est l'usage typique d'une Map."
        xp: 15
        payload:
