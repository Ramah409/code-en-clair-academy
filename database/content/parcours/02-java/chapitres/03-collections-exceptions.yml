            note: "`List.of(...)` fabrique directement une petite liste (qu'on ne pourra plus modifier)."
          - n: 9
            note: "`stream()` ouvre le tapis roulant."
          - n: 10
            note: "`filter` garde les livres disponibles. `l -> l.isDisponible()` est une lambda."
          - n: 11
            note: "`map(Livre::getTitre)` transforme chaque livre en son titre."
          - n: 12
