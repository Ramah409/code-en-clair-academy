lessons:
  # ===================================================================== LEÇON 1
  - slug: java-collections
    title: "Une liste qui grandit : List et ArrayList"
    duration: 11
    objective: "Créer une List, y ajouter des éléments, lire un élément, connaître sa taille et la parcourir."
    prerequisites: "Chapitre « Penser en objets »."
    skills: [java-collections]
    xp: 15
    memo: |
      - `List<String> cours = new ArrayList<>();` : une liste de textes, **vide** au départ, qui grandit.
      - `add("Java")` ajoute à la fin ; `get(0)` lit la case 0 ; `size()` donne le nombre d'éléments.
      - Les `< >` précisent le type des éléments (on dit « générique »).
      - Parcourir : `for (String c : cours) { ... }` (comme un tableau).
      - Pour des nombres : `List<Integer>` (et non `List<int>`).
    commonMistakes: |
      - Écrire `List<int>` : il faut `List<Integer>`.
      - Confondre `size()` (List), `length` (tableau) et `length()` (String).
    blocks:
      - type: text
        md: |
          Un tableau Java a une taille fixe. Au quotidien, on préfère une **liste** qui grandit toute seule :
          `List`.
      - type: definition
        id: def-list
        term: "List"
        md: |
          Une **file d'attente** : chacun a sa place (0, 1, 2…), et de nouvelles personnes peuvent toujours
          arriver au bout. `ArrayList` est la liste la plus utilisée.
      - type: code
        id: code-list
        language: java
        title: "Une liste de cours"
        code: |
          import java.util.ArrayList;
          import java.util.List;

          public class Programme {
              public static void main(String[] args) {
                  List<String> cours = new ArrayList<>();
                  cours.add("Java");
                  cours.add("SQL");
                  cours.add("Angular");
                  System.out.println(cours.get(0));
                  System.out.println(cours.size());
                  for (String c : cours) {
                      System.out.println("Cours : " + c);
                  }
              }
          }
        lines:
          - n: 1
            note: "`import` : on indique où Java doit chercher ArrayList et List (dans java.util)."
          - n: 6
            note: "Une liste de textes, vide. Les `<>` à droite reprennent le type annoncé à gauche."
          - n: 7
            note: "`add` ajoute à la fin."
          - n: 10
            note: "`get(0)` : le premier élément, Java."
          - n: 11
            note: "`size()` : le nombre d'éléments."
      - type: question
        ref: java-col-q5
        review: code-list
      - type: question
        ref: java-col-q3
        review: def-list
      - type: text
        md: "**Exercice 1 (guidé)** : complète la liste."
      - type: exercise
        ref: java-ex-list-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une liste de villes."
      - type: exercise
        ref: java-ex-list-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un length au lieu de size."
      - type: exercise
        ref: java-ex-list-bug
      - type: jury
        items:
          - q: "À quoi servent les génériques (List<String>) ?"
            a: "À préciser le type des éléments : le compilateur vérifie qu'on n'y met que des String et on n'a pas besoin de conversion à la lecture."
      - type: quiz
        items:
          - ref: java-li-q3
            review: def-list
          - ref: java-li-q4
            review: code-list
          - ref: java-li-q5
            review: def-list
    questions:
      - code: java-col-q5
        kind: RESULTAT_CODE
        difficulty: 1
        skill: java-collections
        prompt: "Qu'affiche ce code ?"
        snippet: |
          List<String> l = new ArrayList<>();
          l.add("a");
          l.add("b");
          l.add("c");
          System.out.println(l.get(2));
        language: java
        choices:
          - label: "c"
            correct: true
            why: "Case 0 : a, case 1 : b, case 2 : c."
          - label: "b"
            correct: false
            why: "b est dans la case 1."
          - label: "Une erreur"
            correct: false
            why: "La case 2 existe."
        explanation: "Comme pour les tableaux, les cases commencent à 0."
      - code: java-col-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-collections
        prompt: "Pourquoi `List<int>` ne compile-t-il pas ?"
        choices:
          - label: "Les génériques n'acceptent que des objets : il faut `List<Integer>`"
            correct: true
            why: "Integer est la version objet de int."
          - label: "Parce que les listes ne peuvent contenir que du texte"
            correct: false
            why: "Elles contiennent n'importe quel type d'objet."
          - label: "Parce qu'il manque new"
            correct: false
            why: "Le problème est le type entre chevrons."
        explanation: "int → Integer, double → Double, boolean → Boolean."
      - code: java-li-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-collections
        prompt: "Quelle est la grande différence entre une List et un tableau ?"
        choices:
          - label: "La List grandit quand on ajoute des éléments"
            correct: true
            why: "Un tableau a une taille fixe."
          - label: "La List ne peut contenir que des textes"
            correct: false
            why: "Elle peut contenir tout type d'objet."
          - label: "Aucune"
            correct: false
            why: "La taille fixe du tableau fait toute la différence."
        explanation: "Tableau : taille fixe ; List : taille qui s'adapte."
      - code: java-li-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-collections
        prompt: "Comment ajouter « Docker » à la liste `cours` ?"
        choices:
          - label: "`cours.add(\"Docker\");`"
            correct: true
            why: "add ajoute à la fin."
          - label: "`cours.push(\"Docker\");`"
            correct: false
            why: "push, c'est JavaScript."
          - label: "`cours[3] = \"Docker\";`"
            correct: false
            why: "Les crochets ne marchent pas avec une List."
        explanation: "List : add, get, size."
      - code: java-li-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-collections
        prompt: "Quelle taille pour quoi ?"
        choices:
          - label: "List : `size()` ; tableau : `length` ; String : `length()`"
            correct: true
            why: "Trois écritures à ne pas mélanger."
          - label: "Tout : `size()`"
            correct: false
            why: "size() ne sert qu'aux collections."
          - label: "Tout : `length`"
            correct: false
            why: "Chaque type a son écriture."
        explanation: "Petit piège classique de Java."
    exercises:
      - slug: java-ex-list-guide
        kind: COMPLETER
        title: "Compléter la liste"
        difficulty: FACILE
        skill: java-collections
        statement: "Complète : crée une liste de textes, ajoute Nantes, affiche sa taille."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La liste la plus utilisée : ArrayList."
          - "Ajouter : add. La taille : size."
          - "ArrayList, add, size."
        solution: '["ArrayList", "add", "size"]'
        explanation: "`new ArrayList<>()`, `villes.add(\"Nantes\")`, `villes.size()`."
        xp: 10
        payload:
          language: java
          template: |
            List<String> villes = new [[1]]<>();
            villes.[[2]]("Nantes");
            System.out.println(villes.[[3]]());
          blanks:
            - ["ArrayList"]
            - ["add"]
            - ["size"]
      - slug: java-ex-list-libre
        kind: CODE_LIBRE
        title: "Une liste de villes"
        difficulty: FACILE
        skill: java-collections
        statement: |
          Dans le `main` de la classe `Voyages` :
          1. crée une `List<String>` nommée `villes` avec `new ArrayList<>()` ;
          2. ajoute `"Dakar"`, `"Lyon"` et `"Lille"` ;
          3. affiche chaque ville avec une boucle for-each, puis la taille de la liste.
        criteria: "List<String> + ArrayList, trois add, un for-each, size()."
        hints:
          - "`List<String> villes = new ArrayList<>();`"
          - "`villes.add(\"Dakar\");` (et les deux autres)"
          - "`for (String v : villes) { ... }` puis `System.out.println(villes.size());`"
        solution: |
          import java.util.ArrayList;
          import java.util.List;

          public class Voyages {
              public static void main(String[] args) {
                  List<String> villes = new ArrayList<>();
                  villes.add("Dakar");
                  villes.add("Lyon");
                  villes.add("Lille");
                  for (String v : villes) {
                      System.out.println(v);
                  }
                  System.out.println(villes.size());
              }
          }
        explanation: "La liste grandit à chaque add."
        xp: 15
        payload:
          language: java
          starter: |
            import java.util.ArrayList;
            import java.util.List;

            public class Voyages {
                public static void main(String[] args) {

                }
            }
          checks:
            - pattern: 'List\s*<\s*String\s*>\s+villes\s*=\s*new\s+ArrayList\s*<\s*>\s*\(\s*\)'
              message: "Crée List<String> villes = new ArrayList<>();"
            - pattern: '\A(?>[\s\S]*?villes\.add\s*\(){3}'
              message: "Ajoute trois villes avec villes.add(...)."
            - pattern: 'for\s*\(\s*String\s+\w+\s*:\s*villes\s*\)'
              message: "Parcours avec for (String v : villes)."
            - pattern: 'villes\.size\s*\(\s*\)'
              message: "Affiche la taille : villes.size()."
          output: |
            Dakar
            Lyon
            Lille
            3
      - slug: java-ex-list-bug
        kind: CORRIGER_ERREUR
        title: "Un length au lieu de size"
        difficulty: FACILE
        skill: java-collections
        statement: |
          Le compilateur refuse `taches.length` : une List ne connaît pas `length`. Corrige pour afficher
          le nombre de tâches.
        criteria: "La taille d'une List se lit avec size()."
        hints:
          - "length, c'est pour les tableaux."
          - "Pour une List : size()."
          - "`taches.size()`"
        solution: |
          import java.util.ArrayList;
          import java.util.List;

          public class Taches {
              public static void main(String[] args) {
                  List<String> taches = new ArrayList<>();
                  taches.add("Réviser SQL");
                  taches.add("Coder");
                  System.out.println(taches.size());
              }
          }
        explanation: "List : size()."
        xp: 10
        payload:
          language: java
          starter: |
            import java.util.ArrayList;
            import java.util.List;

            public class Taches {
                public static void main(String[] args) {
                    List<String> taches = new ArrayList<>();
                    taches.add("Réviser SQL");
                    taches.add("Coder");
                    System.out.println(taches.length);
                }
            }
          checks:
            - pattern: 'taches\.length'
              absent: true
              message: "Une List n'a pas de length."
            - pattern: 'taches\.size\s*\(\s*\)'
              message: "Utilise taches.size()."
          output: "2"

  # ===================================================================== LEÇON 2
  - slug: java-map
    title: "Un dictionnaire : Map et HashMap"
    duration: 10
    objective: "Associer des clés à des valeurs avec une Map, et retrouver une valeur à partir de sa clé."
    prerequisites: "Leçon « Une liste qui grandit : List et ArrayList »."
    skills: [java-collections]
    xp: 15
    memo: |
      - `Map<String, String> capitales = new HashMap<>();` : des **clés** texte, des **valeurs** texte.
      - `put("Sénégal", "Dakar")` range ; `get("Sénégal")` retrouve `"Dakar"`.
      - `containsKey("Mali")` répond `true` ou `false`.
      - Une clé n'existe qu'une fois : un nouveau `put` sur la même clé **remplace** la valeur.
      - `get` d'une clé absente renvoie `null` ; `getOrDefault(cle, "?")` renvoie une valeur de secours.
    commonMistakes: |
      - Lire `get(cle)` sans vérifier : `null` si la clé n'existe pas.
      - Croire qu'une Map garde l'ordre d'ajout : une HashMap ne le garantit pas.
    blocks:
      - type: text
        md: |
          Retrouver la capitale d'un pays, le rôle d'une utilisatrice à partir de son e-mail… Pour retrouver une
          valeur à partir d'une **clé**, on utilise une `Map`.
      - type: definition
        id: def-map
        term: "Map"
        md: |
          Un **dictionnaire** : on retrouve une définition (la valeur) à partir d'un mot (la clé). Chaque mot
          n'a qu'une entrée. `HashMap` est la version la plus utilisée.
      - type: code
        id: code-map
        language: java
        title: "Des pays et leurs capitales"
        code: |
          import java.util.HashMap;
          import java.util.Map;

          public class Atlas {
              public static void main(String[] args) {
                  Map<String, String> capitales = new HashMap<>();
                  capitales.put("Sénégal", "Dakar");
                  capitales.put("Mali", "Bamako");
                  System.out.println(capitales.get("Sénégal"));
                  System.out.println(capitales.containsKey("Maroc"));
                  System.out.println(capitales.getOrDefault("Maroc", "inconnue"));
              }
          }
        lines:
          - n: 6
            note: "Des clés texte (les pays), des valeurs texte (les capitales)."
          - n: 7
            note: "`put` range une association clé → valeur."
          - n: 9
            note: "`get` retrouve la valeur de la clé : Dakar."
          - n: 10
            note: "`containsKey` : le Maroc n'y est pas, false."
          - n: 11
            note: "`getOrDefault` : « inconnue » au lieu de null."
      - type: question
        ref: java-col-q1
        review: def-map
      - type: question
        ref: java-mp-q2
        review: code-map
      - type: text
        md: "**Exercice 1 (guidé)** : complète la Map."
      - type: exercise
        ref: java-ex-collections-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : les rôles des utilisatrices."
      - type: exercise
        ref: java-ex-map-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un add sur une Map."
      - type: exercise
        ref: java-ex-map-bug
      - type: jury
        items:
          - q: "Quelle différence entre une List et une Map ?"
            a: "Une List est une suite ordonnée d'éléments accessibles par leur position ; une Map associe des clés uniques à des valeurs."
      - type: quiz
        items:
          - ref: java-mp-q3
            review: def-map
          - ref: java-mp-q4
            review: code-map
          - ref: java-mp-q5
            review: def-map
    questions:
      - code: java-col-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-collections
        prompt: "Pour retrouver le rôle d'une utilisatrice à partir de son e-mail, quelle collection choisir ?"
        choices:
          - label: "Une `Map<String, String>`"
            correct: true
            why: "Clé = e-mail, valeur = rôle."
          - label: "Une `List<String>`"
            correct: false
            why: "Il faudrait connaître la position de chaque utilisatrice."
          - label: "Un `String`"
            correct: false
            why: "Un texte ne range pas des associations."
        explanation: "Map : recherche directe par clé."
      - code: java-mp-q2
        kind: RESULTAT_CODE
        difficulty: 1
        skill: java-collections
        prompt: "Qu'affiche ce code ?"
        snippet: |
          Map<String, String> couleurs = new HashMap<>();
          couleurs.put("ciel", "bleu");
          couleurs.put("ciel", "gris");
          System.out.println(couleurs.get("ciel"));
        language: java
        choices:
          - label: "gris"
            correct: true
            why: "Une clé n'existe qu'une fois : le deuxième put remplace la valeur."
          - label: "bleu"
            correct: false
            why: "La valeur a été remplacée."
          - label: "bleu gris"
            correct: false
            why: "Une clé n'a qu'une seule valeur."
        explanation: "put sur une clé existante = remplacer."
      - code: java-mp-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-collections
        prompt: "Que renvoie `get` pour une clé qui n'existe pas ?"
        choices:
          - label: "`null`"
            correct: true
            why: "Rien n'est associé à cette clé."
          - label: "Une erreur"
            correct: false
            why: "get ne plante pas : il renvoie null."
          - label: "La première valeur de la Map"
            correct: false
            why: "Il n'y a pas de « première » valeur."
        explanation: "D'où l'intérêt de getOrDefault."
      - code: java-mp-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-collections
        prompt: "Quelle méthode range une association dans une Map ?"
        choices:
          - label: "`put`"
            correct: true
            why: "put(cle, valeur)."
          - label: "`add`"
            correct: false
            why: "add sert aux List."
          - label: "`push`"
            correct: false
            why: "push, c'est JavaScript."
        explanation: "Map : put, get, containsKey."
      - code: java-mp-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: java-collections
        prompt: "Dans une Map, une même clé peut apparaître deux fois avec deux valeurs."
        choices:
          - label: "Vrai"
            correct: false
            why: "Une clé est unique."
          - label: "Faux"
            correct: true
            why: "Exact : un nouveau put remplace l'ancienne valeur."
        explanation: "Comme un mot dans un dictionnaire : une seule entrée."
    exercises:
      - slug: java-ex-collections-guide
        kind: COMPLETER
        title: "Compléter la Map"
        difficulty: FACILE
        skill: java-collections
        statement: "Complète : range la capitale de la France, puis retrouve-la."
        criteria: "Les trois trous sont corrects."
        hints:
          - "La Map la plus utilisée : HashMap."
          - "Ranger : put. Retrouver : get."
          - "HashMap, put, get."
        solution: '["HashMap", "put", "get"]'
        explanation: "`new HashMap<>()`, `put(\"France\", \"Paris\")`, `get(\"France\")`."
        xp: 10
        payload:
          language: java
          template: |
            Map<String, String> capitales = new [[1]]<>();
            capitales.[[2]]("France", "Paris");
            System.out.println(capitales.[[3]]("France"));
          blanks:
            - ["HashMap"]
            - ["put"]
            - ["get"]
      - slug: java-ex-map-libre
        kind: CODE_LIBRE
        title: "Les rôles des utilisatrices"
        difficulty: FACILE
        skill: java-collections
        statement: |
          Dans le `main` de la classe `Roles` :
          1. crée une `Map<String, String>` nommée `roles` ;
          2. range `"awa@exemple.fr"` → `"ADMIN"` et `"leo@exemple.fr"` → `"APPRENANT"` ;
          3. affiche le rôle de `awa@exemple.fr`, puis si la Map contient `zoe@exemple.fr`.
        criteria: "Une Map, deux put, un get, un containsKey."
        hints:
          - "`Map<String, String> roles = new HashMap<>();`"
          - "`roles.put(\"awa@exemple.fr\", \"ADMIN\");`"
          - "`roles.get(\"awa@exemple.fr\")` et `roles.containsKey(\"zoe@exemple.fr\")`"
        solution: |
