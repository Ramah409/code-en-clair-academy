  # ===================================================================== LEÇON 5
  - slug: java-finally
    title: "finally et les exceptions vérifiées"
    duration: 11
    objective: "Utiliser finally pour toujours exécuter du code, et distinguer les exceptions vérifiées (throws) des non vérifiées."
    prerequisites: "Leçon « Lever et attraper une exception »."
    skills: [java-exceptions]
    xp: 15
    memo: |
      - `finally { ... }` s'exécute **toujours**, qu'il y ait une exception ou non (idéal pour fermer un fichier).
      - **Vérifiée** (checked, ex. `IOException`) : un problème extérieur prévisible. Le compilateur **oblige** à l'attraper ou à la déclarer avec `throws`.
      - **Non vérifiée** (`RuntimeException` et ses enfants, ex. `IllegalArgumentException`) : pas d'obligation.
    commonMistakes: |
      - Oublier de traiter une exception vérifiée : erreur de compilation.
      - Mettre dans finally du code qui ne doit s'exécuter qu'en cas de réussite.
    blocks:
      - type: text
        md: |
          Java va plus loin que JavaScript : il **classe** les exceptions, et oblige parfois à les prévoir.
      - type: definition
        id: def-checked
        term: "Vérifiée ou non vérifiée"
        md: |
          - **Vérifiée** : comme un **contrôle obligatoire avant un vol** — un problème extérieur (fichier absent,
            réseau) que le compilateur t'oblige à prévoir.
          - **Non vérifiée** : une erreur de logique ou une règle métier non respectée. Pas d'obligation.
          - `finally` : la **porte qu'on referme toujours** en partant, que la journée se soit bien passée ou non.
      - type: code
        id: code-finally
        language: java
        title: "Lire un fichier et toujours conclure"
        code: |
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          public class Lecture {
              static String lire(String chemin) throws IOException {
                  return Files.readString(Path.of(chemin));
              }

              public static void main(String[] args) {
                  try {
                      System.out.println(lire("notes-absentes.txt"));
                  } catch (IOException e) {
                      System.out.println("Fichier introuvable");
                  } finally {
                      System.out.println("Lecture terminée");
                  }
              }
          }
        lines:
          - n: 6
            note: "`throws IOException` : la méthode prévient qu'elle peut lever cette exception vérifiée."
          - n: 13
            note: "L'appelant doit l'attraper (ou la déclarer à son tour)."
          - n: 15
            note: "`finally` s'exécute dans tous les cas : Lecture terminée."
      - type: question
        ref: java-exc-q1
        review: def-checked
