            - pattern: 'Map\s*<\s*String\s*,\s*String\s*>\s+roles\s*=\s*new\s+HashMap\s*<\s*>\s*\(\s*\)'
              message: "Crée Map<String, String> roles = new HashMap<>();"
            - pattern: 'roles\.put\s*\(\s*"awa@exemple\.fr"\s*,\s*"ADMIN"\s*\)'
              message: "Range roles.put(\"awa@exemple.fr\", \"ADMIN\");"
            - pattern: 'roles\.get\s*\(\s*"awa@exemple\.fr"\s*\)'
              message: "Affiche roles.get(\"awa@exemple.fr\")."
            - pattern: 'roles\.containsKey\s*\(\s*"zoe@exemple\.fr"\s*\)'
