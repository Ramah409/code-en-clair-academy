              message: "Déclare l'exception : static String lire(String chemin) throws IOException"
          output: "Fichier introuvable"

  # ===================================================================== LEÇON 6
  - slug: java-exceptions-perso
    title: "Créer sa propre exception"
    duration: 11
    objective: "Créer une exception métier qui hérite de RuntimeException, avec un message clair, et la lever."
    prerequisites: "Leçon « finally et les exceptions vérifiées »."
    skills: [java-exceptions]
    xp: 20
    memo: |
      - Une exception est une **classe** : on peut créer la nôtre, avec un nom métier clair.
      - `class EmailDejaUtiliseException extends RuntimeException` : non vérifiée, adaptée à une règle métier.
      - Son constructeur appelle `super(message)` : le message sera lisible avec `getMessage()`.
      - Dans Spring, un gestionnaire d'erreurs (`@RestControllerAdvice`) la transformera en réponse HTTP.
    commonMistakes: |
      - Hériter d'`Exception` : elle devient vérifiée, il faudrait `throws` partout.
      - Un nom vague (`MonErreur`) : le nom doit dire ce qui s'est passé.
    blocks:
      - type: text
        md: |
          `IllegalArgumentException` est très générale. Pour une règle métier (« cet e-mail est déjà pris »),
          on crée une exception **au nom parlant**.
      - type: definition
        id: def-exception-perso
        term: "Exception personnalisée"
        md: |
          Un **formulaire de signalement sur mesure** : au lieu d'un « problème divers », on remplit
          « e-mail déjà utilisé ». Tout le monde comprend tout de suite ce qui s'est passé.
      - type: code
        id: code-exception-perso
        language: java
        title: "Une exception métier"
        code: |
          import java.util.HashSet;
          import java.util.Set;

          public class Inscriptions {
              static Set<String> emails = new HashSet<>();

              static void inscrire(String email) {
                  if (emails.contains(email)) {
                      throw new EmailDejaUtiliseException(email);
                  }
                  emails.add(email);
              }

              public static void main(String[] args) {
                  inscrire("awa@exemple.fr");
                  try {
                      inscrire("awa@exemple.fr");
                  } catch (EmailDejaUtiliseException e) {
                      System.out.println(e.getMessage());
                  }
              }
          }

          class EmailDejaUtiliseException extends RuntimeException {
              public EmailDejaUtiliseException(String email) {
                  super("L'adresse " + email + " est déjà utilisée");
              }
          }
        lines:
          - n: 5
            note: "Un `Set` : comme une List, mais sans doublon possible (`contains`, `add`)."
          - n: 9
            note: "On lève notre propre exception, au nom parlant."
          - n: 24
            note: "Elle hérite de RuntimeException : non vérifiée."
          - n: 26
            note: "`super(message)` : le texte lu par getMessage()."
