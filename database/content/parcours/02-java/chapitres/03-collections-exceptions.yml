        criteria: "L'exception hérite de RuntimeException."
        hints:
          - "Exception = vérifiée ; RuntimeException = non vérifiée."
          - "Change le parent de l'exception."
          - "`class PlaceIndisponibleException extends RuntimeException`"
        solution: |
          public class Reservation {
              static void reserver(boolean placeLibre) {
