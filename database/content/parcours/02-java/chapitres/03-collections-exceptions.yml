  # ===================================================================== LEÇON 3
  - slug: java-streams
    title: "Filtrer et transformer : les streams et les lambdas"
    duration: 12
    objective: "Filtrer et transformer une liste avec stream, filter, map et toList, en écrivant de petites lambdas."
    prerequisites: "Leçon « Un dictionnaire : Map et HashMap »."
    skills: [java-collections]
    xp: 20
    memo: |
      - `liste.stream().filter(...).map(...).toList()` : l'équivalent de filter et map en JavaScript.
      - Une **lambda** `p -> p.isDisponible()` : une petite fonction (comme `p => ...` en JavaScript, avec une flèche `->`).
      - `Livre::getTitre` : une **référence de méthode**, raccourci pour `l -> l.getTitre()`.
      - La liste d'origine n'est pas modifiée : on récupère une nouvelle liste.
    commonMistakes: |
      - Écrire `=>` : en Java, la flèche est `->`.
      - Oublier `toList()` : on n'obtient pas de liste.
    blocks:
      - type: text
        md: |
          Tu connais filter et map en JavaScript. Java a les mêmes, sur un **stream** (un flux d'éléments).
      - type: definition
        id: def-stream
        term: "Stream et lambda"
        md: |
          Un **tapis roulant** sur lequel passent les éléments d'une liste : on y installe des postes (filtrer,
          transformer) et on récupère le résultat au bout. Chaque poste reçoit une **lambda**, une petite
          fonction écrite avec `->`.
      - type: code
        id: code-stream
        language: java
        title: "Les titres des livres disponibles"
        code: |
          import java.util.List;

          public class Catalogue {
              public static void main(String[] args) {
                  List<Livre> livres = List.of(
                          new Livre("Dune", true),
                          new Livre("Kirikou", false),
                          new Livre("Une si longue lettre", true));
                  List<String> disponibles = livres.stream()
                          .filter(l -> l.isDisponible())
                          .map(Livre::getTitre)
                          .toList();
                  System.out.println(disponibles);
              }
          }

          class Livre {
              private String titre;
              private boolean disponible;

              public Livre(String titre, boolean disponible) {
                  this.titre = titre;
                  this.disponible = disponible;
              }

              public String getTitre() { return titre; }
              public boolean isDisponible() { return disponible; }
          }
        lines:
