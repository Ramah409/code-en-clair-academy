position: 3
level: AVANCE
title: "Collections et exceptions"
summary: "Ranger des éléments dans une List, associer des clés et des valeurs dans une Map, filtrer avec les streams, puis gérer les erreurs avec les exceptions. Une seule notion par leçon."
