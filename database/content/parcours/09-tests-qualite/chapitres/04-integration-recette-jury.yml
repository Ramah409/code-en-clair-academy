slug: tst-integration-jury
position: 4
level: EXAMEN
title: "Intégration, bout en bout, recette et jury"
summary: "Tester avec une vraie base (Testcontainers), automatiser un parcours dans le navigateur (Playwright), rédiger un cahier de recette, suivre le cycle d'un bug, puis défendre sa démarche qualité. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: tst-integration-e2e
    title: "Le test d'intégration avec Testcontainers"
    duration: 11
    objective: "Écrire un test d'intégration qui démarre un vrai PostgreSQL jetable avec Testcontainers."
    prerequisites: "Chapitre « Code propre, Git et intégration continue »."
    skills: [tests-strategie, spring-tests]
    xp: 15
    memo: |
      - **Testcontainers** : démarre un vrai PostgreSQL dans Docker pour la durée des tests.
      - `@SpringBootTest` : toute l'application ; `@ServiceConnection` relie le conteneur à Spring automatiquement.
      - On utilise la **même version** de PostgreSQL qu'en production.
      - Docker doit être présent sur la machine (ou la CI).
    commonMistakes: |
      - Tester l'intégration avec H2 alors que la production utilise PostgreSQL (comportements différents).
      - Oublier que Docker doit tourner pour lancer ces tests.
    blocks:
      - type: text
        md: |
          Les tests unitaires vérifient les pièces. Il faut aussi vérifier que les pièces **s'emboîtent** : la
          requête SQL générée fonctionne-t-elle vraiment sur PostgreSQL ?
      - type: definition
        id: def-testcontainers
        term: "Testcontainers"
        md: |
          Une **salle d'essai jetable** : pour chaque série de tests, on monte une vraie base PostgreSQL toute
          neuve dans un conteneur Docker, on teste, puis on la jette. Aucune trace, aucun effet sur la base
          de développement.
      - type: code
        id: code-integration
        language: java
        title: "LivreRepositoryIT.java"
        code: |
          @SpringBootTest
          @Testcontainers
          class LivreRepositoryIT {

              @Container
              @ServiceConnection
              static PostgreSQLContainer<?> postgres = new PostgreSQLContainer<>("postgres:16-alpine");

              @Autowired LivreRepository livres;

              @Test
              void chercheSansTenirCompteDesMajuscules() {
                  livres.save(new Livre("Le Petit Prince"));

                  List<Livre> trouves = livres.findByTitreContainingIgnoreCase("PETIT");

                  assertFalse(trouves.isEmpty());
              }
          }
        lines:
          - n: 1
            note: "Toute l'application démarre, avec Flyway et JPA."
          - n: 5
            note: "`@Container` : Testcontainers démarre et arrête le conteneur."
          - n: 6
            note: "`@ServiceConnection` : l'URL, l'utilisateur et le mot de passe sont transmis à Spring tout seuls."
          - n: 7
            note: "La **même version** de PostgreSQL qu'en production."
          - n: 15
            note: "On teste la vraie requête SQL générée, sur le vrai moteur."
      - type: question
        ref: tst-it-q1
        review: code-integration
      - type: question
        ref: tst-it-q3
        review: def-testcontainers
      - type: text
        md: "**Exercice 1 (guidé)** : complète les annotations."
      - type: exercise
        ref: tst-ex-testcontainers-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un test d'intégration des salles."
      - type: exercise
        ref: tst-ex-testcontainers-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une base différente de la production."
      - type: exercise
        ref: tst-ex-testcontainers-bug
      - type: jury
        items:
          - q: "Pourquoi Testcontainers plutôt qu'une base H2 en mémoire ?"
            a: "Pour tester sur le même moteur qu'en production : PostgreSQL a ses propres types, fonctions (ILIKE, JSONB) et contraintes. H2 peut faire passer un test qui échouerait en production. Testcontainers démarre un vrai PostgreSQL jetable dans Docker."
      - type: quiz
        items:
          - ref: tst-tc-q3
            review: def-testcontainers
          - ref: tst-tc-q4
            review: code-integration
          - ref: tst-tc-q5
            review: code-integration
    questions:
      - code: tst-it-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-tests
        prompt: "À quoi sert `@ServiceConnection` sur le conteneur PostgreSQL ?"
        choices:
          - label: "À transmettre automatiquement l'adresse et les identifiants du conteneur à Spring"
            correct: true
            why: "Plus besoin de configurer la datasource à la main."
          - label: "À se connecter à la base de production"
            correct: false
            why: "Surtout pas : on utilise une base jetable."
          - label: "À créer les tables"
            correct: false
            why: "C'est le rôle de Flyway."
        explanation: "Disponible depuis Spring Boot 3.1."
      - code: tst-it-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: spring-tests
        prompt: "Testcontainers nécessite Docker sur la machine qui lance les tests (ou sur la CI)."
        choices:
          - label: "Vrai"
            correct: true
            why: "Il démarre de vrais conteneurs."
          - label: "Faux"
            correct: false
            why: "Sans Docker, il ne peut rien démarrer."
        explanation: "Les machines ubuntu-latest de GitHub Actions ont Docker."
      - code: tst-tc-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-tests
        prompt: "Que devient la base PostgreSQL de test après les tests ?"
        choices:
          - label: "Elle est jetée avec le conteneur"
            correct: true
            why: "Aucune trace."
          - label: "Elle remplace la base de production"
            correct: false
            why: "Jamais."
          - label: "Elle est gardée pour toujours"
            correct: false
            why: "Elle est jetable."
        explanation: "Salle d'essai jetable."
      - code: tst-tc-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: spring-tests
        prompt: "Pourquoi utiliser l'image `postgres:16-alpine` et pas H2 ?"
        choices:
          - label: "Pour tester sur le même moteur que la production"
            correct: true
            why: "Même comportement SQL."
          - label: "Parce que H2 n'existe plus"
            correct: false
            why: "Il existe, mais il se comporte différemment."
          - label: "Pour aller plus vite"
            correct: false
            why: "H2 est même plus rapide ; la fidélité compte plus."
        explanation: "Tester comme en vrai."
      - code: tst-tc-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: spring-tests
        prompt: "Que démarre `@SpringBootTest` ?"
        choices:
          - label: "Toute l'application Spring"
            correct: true
            why: "Tous les beans, avec la base."
          - label: "Seulement un contrôleur"
            correct: false
            why: "C'est @WebMvcTest."
          - label: "Un navigateur"
            correct: false
            why: "C'est Playwright."
        explanation: "Test d'intégration complet côté serveur."
    exercises:
      - slug: tst-ex-testcontainers-guide
        kind: COMPLETER
        title: "Compléter les annotations"
        difficulty: FACILE
        skill: spring-tests
        statement: "Complète les annotations du test d'intégration."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Toute l'application : SpringBootTest."
          - "Le conteneur : Container ; la connexion automatique : ServiceConnection."
          - "SpringBootTest, Container, ServiceConnection."
        solution: '["SpringBootTest", "Container", "ServiceConnection"]'
        explanation: "Application, conteneur, connexion."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]]
            @Testcontainers
            class SalleRepositoryIT {
                @[[2]]
                @[[3]]
                static PostgreSQLContainer<?> postgres = new PostgreSQLContainer<>("postgres:16-alpine");
            }
          blanks:
            - ["SpringBootTest"]
            - ["Container"]
            - ["ServiceConnection"]
      - slug: tst-ex-testcontainers-libre
        kind: CODE_LIBRE
        title: "Un test d'intégration des salles"
        difficulty: INTERMEDIAIRE
        skill: spring-tests
        statement: |
          Dans `SalleRepositoryIT` (conteneur déjà déclaré, `@Autowired SalleRepository salles`), écris le test
          `trouveParVille()` : enregistre `new Salle("Atelier", "Lyon")`, cherche avec
          `salles.findByVille("Lyon")`, et vérifie que la liste n'est pas vide.
        criteria: "save, findByVille(\"Lyon\"), assertFalse(…isEmpty())."
        hints:
          - "`salles.save(new Salle(\"Atelier\", \"Lyon\"));`"
          - "`List<Salle> trouvees = salles.findByVille(\"Lyon\");`"
          - "`assertFalse(trouvees.isEmpty());`"
        solution: |
          @Test
          void trouveParVille() {
              salles.save(new Salle("Atelier", "Lyon"));
              List<Salle> trouvees = salles.findByVille("Lyon");
              assertFalse(trouvees.isEmpty());
          }
        explanation: "La vraie requête, sur la vraie base."
        xp: 20
        payload:
          language: java
          starter: |
            @Test
            void trouveParVille() {

            }
          checks:
            - pattern: 'salles\.save\s*\(\s*new\s+Salle\s*\(\s*"Atelier"\s*,\s*"Lyon"\s*\)\s*\)'
              message: "Enregistre salles.save(new Salle(\"Atelier\", \"Lyon\"))."
            - pattern: '(\w+)\s*=\s*salles\.findByVille\s*\(\s*"Lyon"\s*\)[\s\S]*assertFalse\s*\(\s*\1\.isEmpty\s*\(\s*\)\s*\)'
              message: "Cherche avec findByVille(\"Lyon\") puis vérifie assertFalse(liste.isEmpty())."
      - slug: tst-ex-testcontainers-bug
        kind: CORRIGER_ERREUR
        title: "Une base différente de la production"
        difficulty: FACILE
        skill: spring-tests
        statement: |
          Ce test d'intégration utilise une base H2 en mémoire, alors que la production utilise PostgreSQL.
          Remplace la configuration par un conteneur `PostgreSQLContainer` (`postgres:16-alpine`) annoté
          `@Container` et `@ServiceConnection`.
        criteria: "PostgreSQLContainer avec les deux annotations, plus de H2."
        hints:
          - "Tester sur le même moteur qu'en production."
          - "`@Container @ServiceConnection static PostgreSQLContainer<?> postgres = …`"
          - "`new PostgreSQLContainer<>(\"postgres:16-alpine\")`"
        solution: |
          @SpringBootTest
          @Testcontainers
          class LivreRepositoryIT {
              @Container
              @ServiceConnection
              static PostgreSQLContainer<?> postgres = new PostgreSQLContainer<>("postgres:16-alpine");
          }
        explanation: "Même moteur, mêmes surprises qu'en production."
        xp: 10
        payload:
          language: java
          starter: |
            @SpringBootTest(properties = "spring.datasource.url=jdbc:h2:mem:test")
            class LivreRepositoryIT {
            }
          checks:
            - pattern: '(?i)h2'
              absent: true
              message: "Pas de H2 : la production utilise PostgreSQL."
            - pattern: '@Container\s+@ServiceConnection\s+static\s+PostgreSQLContainer\s*<\s*\?\s*>\s+\w+\s*=\s*new\s+PostgreSQLContainer\s*<\s*>\s*\(\s*"postgres:16-alpine"\s*\)'
              message: "Déclare @Container @ServiceConnection static PostgreSQLContainer<?> postgres = new PostgreSQLContainer<>(\"postgres:16-alpine\")."

  # ===================================================================== LEÇON 2
  - slug: tst-playwright
    title: "Le test de bout en bout avec Playwright"
    duration: 10
    objective: "Écrire un scénario Playwright qui agit comme une utilisatrice dans un vrai navigateur."
    prerequisites: "Leçon « Le test d'intégration avec Testcontainers »."
    skills: [tests-strategie]
    xp: 15
    memo: |
      - **Playwright** : pilote un vrai navigateur (`page.goto`, `fill`, `click`, `expect(...).toBeVisible()`).
      - Sélectionner par **rôle et libellé** (`getByRole`, `getByLabel`), comme une utilisatrice, plutôt que par classe CSS.
      - On automatise seulement les **parcours critiques** (inscription, connexion, réservation).
    commonMistakes: |
      - Des scénarios qui dépendent de données laissées par un autre test.
      - Sélectionner par classe CSS : le test casse au moindre changement de style.
    blocks:
      - type: definition
        id: def-playwright
        term: "Playwright"
        md: |
          Un **robot testeur** qui s'assoit devant le navigateur : il ouvre les pages, remplit les champs,
          clique, et vérifie ce qui s'affiche, comme le ferait une vraie personne.
      - type: code
        id: code-playwright
        language: typescript
        title: "reservation.spec.ts (Playwright)"
        code: |
          test('une cliente réserve une salle', async ({ page }) => {
            await page.goto('/connexion');
            await page.getByLabel('E-mail').fill('cliente@exemple.fr');
            await page.getByLabel('Mot de passe').fill('Mot-de-passe-test');
            await page.getByRole('button', { name: 'Se connecter' }).click();

            await page.getByRole('link', { name: 'Réserver' }).click();
            await page.getByRole('button', { name: 'Salle Atelier' }).click();

            await expect(page.getByText('Réservation confirmée')).toBeVisible();
          });
        lines:
          - n: 2
            note: "Ouvre la page de connexion dans un vrai navigateur."
          - n: 3
            note: "Trouve le champ par son **libellé**, comme le ferait une personne."
          - n: 5
            note: "Trouve le bouton par son **rôle** et son **nom**."
          - n: 10
            note: "Vérifie ce que voit l'utilisatrice."
      - type: question
        ref: tst-it-q4
        review: code-playwright
      - type: question
        ref: tst-c4-b2
        review: def-playwright
      - type: text
        md: "**Exercice 1 (guidé)** : complète le scénario."
      - type: exercise
        ref: tst-ex-playwright-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un scénario de connexion."
      - type: exercise
        ref: tst-ex-playwright-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un sélecteur fragile."
      - type: exercise
        ref: tst-ex-playwright-bug
      - type: quiz
        items:
          - ref: tst-pw-q3
            review: code-playwright
          - ref: tst-pw-q4
            review: def-playwright
          - ref: tst-pw-q5
            review: code-playwright
    questions:
      - code: tst-it-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Pourquoi sélectionner un bouton par `getByRole('button', { name: 'Se connecter' })` ?"
        choices:
          - label: "C'est ainsi qu'une personne (et un lecteur d'écran) le repère : le test résiste aux changements de style"
            correct: true
            why: "Et il vérifie au passage l'accessibilité."
          - label: "C'est plus rapide que les classes CSS"
            correct: false
            why: "La vitesse n'est pas la raison."
          - label: "Playwright n'accepte pas d'autre sélecteur"
            correct: false
            why: "Il en accepte, mais ils sont plus fragiles."
        explanation: "Un test qui pense comme une utilisatrice."
      - code: tst-c4-b2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Quel outil pilote un vrai navigateur pour les tests de bout en bout ?"
        choices:
          - label: "Playwright"
            correct: true
            why: "Aussi : Cypress, Selenium."
          - label: "Mockito"
            correct: false
            why: "Mockito crée des doublures Java."
          - label: "JaCoCo"
            correct: false
            why: "JaCoCo mesure la couverture."
        explanation: "Les tests E2E vérifient les parcours critiques."
      - code: tst-pw-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Quelle méthode remplit un champ ?"
        choices:
          - label: "`fill`"
            correct: true
            why: "Elle tape le texte."
          - label: "`click`"
            correct: false
            why: "Elle clique."
          - label: "`goto`"
            correct: false
            why: "Elle ouvre une page."
        explanation: "goto, fill, click, expect."
      - code: tst-pw-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: tests-strategie
        prompt: "On automatise avec Playwright tous les écrans de l'application, dans tous les détails."
        choices:
          - label: "Vrai"
            correct: false
            why: "Ce serait lent et fragile."
          - label: "Faux"
            correct: true
            why: "Seulement les parcours critiques."
        explanation: "Le haut de la pyramide reste étroit."
      - code: tst-pw-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Que vérifie `expect(page.getByText('Réservation confirmée')).toBeVisible()` ?"
        choices:
          - label: "Que le message est affiché à l'écran"
            correct: true
            why: "Ce que voit l'utilisatrice."
          - label: "Que la base contient la réservation"
            correct: false
            why: "Il regarde l'écran."
          - label: "Que le bouton est cliquable"
            correct: false
            why: "Il vérifie un texte."
        explanation: "On vérifie le résultat visible."
    exercises:
      - slug: tst-ex-playwright-guide
        kind: COMPLETER
        title: "Compléter un scénario Playwright"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Complète : ouvrir la page, remplir le champ, cliquer, vérifier."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Ouvrir une adresse : goto. Remplir : fill."
          - "Cliquer : click. Vérifier la visibilité : toBeVisible."
          - "goto, fill, click, toBeVisible."
        solution: '["goto", "fill", "click", "toBeVisible"]'
        explanation: "Aller, remplir, cliquer, constater."
        xp: 10
        payload:
          language: typescript
          template: |
            await page.[[1]]('/inscription');
            await page.getByLabel('E-mail').[[2]]('nouvelle@exemple.fr');
            await page.getByRole('button', { name: 'Créer mon compte' }).[[3]]();
            await expect(page.getByText('Bienvenue')).[[4]]();
          blanks:
            - ["goto"]
            - ["fill"]
            - ["click"]
            - ["toBeVisible"]
      - slug: tst-ex-playwright-libre
        kind: CODE_LIBRE
        title: "Un scénario de connexion"
        difficulty: INTERMEDIAIRE
        skill: tests-strategie
        statement: |
          Écris les lignes d'un scénario qui : ouvre `/connexion`, remplit le champ « E-mail » avec
          `awa@exemple.fr`, remplit « Mot de passe » avec `Mot-de-passe-test`, clique sur le bouton
          « Se connecter », puis vérifie que le texte « Mes emprunts » est visible.
        criteria: "goto, deux fill par libellé, click par rôle, expect toBeVisible."
        hints:
          - "`await page.goto('/connexion');`"
          - "`await page.getByLabel('E-mail').fill('awa@exemple.fr');`"
          - "`await expect(page.getByText('Mes emprunts')).toBeVisible();`"
        solution: |
          await page.goto('/connexion');
          await page.getByLabel('E-mail').fill('awa@exemple.fr');
          await page.getByLabel('Mot de passe').fill('Mot-de-passe-test');
          await page.getByRole('button', { name: 'Se connecter' }).click();
          await expect(page.getByText('Mes emprunts')).toBeVisible();
        explanation: "Le parcours, vu par l'utilisatrice."
        xp: 20
        payload:
          language: typescript
          starter: |
            await page.goto('');
          checks:
            - pattern: "page\\.goto\\s*\\(\\s*['\"]/connexion['\"]\\s*\\)"
              message: "Ouvre /connexion."
            - pattern: "getByLabel\\s*\\(\\s*['\"]E-mail['\"]\\s*\\)\\s*\\.fill\\s*\\(\\s*['\"]awa@exemple\\.fr['\"]"
              message: "Remplis le champ E-mail."
            - pattern: "getByLabel\\s*\\(\\s*['\"]Mot de passe['\"]\\s*\\)\\s*\\.fill\\s*\\("
              message: "Remplis le champ Mot de passe."
            - pattern: "getByRole\\s*\\(\\s*['\"]button['\"]\\s*,\\s*\\{\\s*name\\s*:\\s*['\"]Se connecter['\"]\\s*\\}\\s*\\)\\s*\\.click\\s*\\(\\s*\\)"
              message: "Clique sur le bouton « Se connecter » avec getByRole."
            - pattern: "expect\\s*\\(\\s*page\\.getByText\\s*\\(\\s*['\"]Mes emprunts['\"]\\s*\\)\\s*\\)\\s*\\.toBeVisible\\s*\\(\\s*\\)"
              message: "Vérifie que « Mes emprunts » est visible."
      - slug: tst-ex-playwright-bug
        kind: CORRIGER_ERREUR
        title: "Un sélecteur fragile"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Ce scénario clique sur le bouton par sa classe CSS : il cassera au prochain changement de style.
          Utilise plutôt `getByRole('button', { name: 'Emprunter' })`.
        criteria: "getByRole button Emprunter, plus de classe CSS."
        hints:
          - "Comment une personne repère-t-elle le bouton ?"
          - "Par son rôle et son nom."
          - "`page.getByRole('button', { name: 'Emprunter' }).click();`"
        solution: |
          await page.getByRole('button', { name: 'Emprunter' }).click();
        explanation: "Un sélecteur qui pense comme une utilisatrice."
        xp: 10
        payload:
          language: typescript
          starter: |
            await page.locator('.btn-primary.mt-2').click();
          checks:
            - pattern: '\.btn-primary'
              absent: true
              message: "Pas de classe CSS."
            - pattern: "getByRole\\s*\\(\\s*['\"]button['\"]\\s*,\\s*\\{\\s*name\\s*:\\s*['\"]Emprunter['\"]\\s*\\}\\s*\\)\\s*\\.click"
              message: "Écris getByRole('button', { name: 'Emprunter' }).click()."

  # ===================================================================== LEÇON 3
  - slug: tst-recette
    title: "Le cahier de recette"
    duration: 10
    objective: "Rédiger une fiche de cas de test précise, avec préconditions, étapes et résultat attendu vérifiable."
    prerequisites: "Leçon « Le test de bout en bout avec Playwright »."
    skills: [tests-strategie]
    xp: 15
    memo: |
      - **Cahier de recette** : la liste des cas de test fonctionnels, déroulée avec le client.
      - Chaque fiche : **identifiant**, **préconditions**, **étapes**, **résultat attendu**, résultat obtenu, statut.
      - Un résultat attendu se vérifie par **oui ou non** : jamais « ça marche ».
      - Un cas **KO** donne un ticket de correction.
    commonMistakes: |
      - Un cahier de recette sans résultat attendu précis.
      - Oublier les préconditions (l'état de départ).
    blocks:
      - type: definition
        id: def-recette
        term: "Cahier de recette"
        md: |
          La **liste de contrôle avant le décollage** d'un avion : chaque point est vérifié et coché. Pour une
          application, chaque cas dit **quoi faire** et **quel résultat on attend**, pour que la cliente valide
          que tout son besoin est couvert.
      - type: code
        id: code-recette
        language: text
        title: "Une fiche de cas de test"
        code: |
          ID               : CT-07
          Fonctionnalité   : Réservation d'une salle
          Préconditions    : cliente connectée ; salle « Atelier » libre
          Étapes           : 1. Ouvrir « Réserver »  2. Choisir « Atelier »  3. Confirmer
          Résultat attendu : message « Réservation confirmée » ; la salle devient indisponible
          Résultat obtenu  : conforme
          Statut           : OK
        lines:
          - n: 1
            note: "Un identifiant pour s'y référer (dans un ticket, au jury)."
          - n: 3
            note: "L'état de départ nécessaire."
          - n: 5
            note: "Précis et vérifiable, pas « ça marche »."
          - n: 7
            note: "OK ou KO ; un KO donne un ticket de correction."
