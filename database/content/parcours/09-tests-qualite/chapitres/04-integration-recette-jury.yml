        solution: '["Préconditions", "Étapes", "Résultat attendu"]'
        explanation: "D'où partir, quoi faire, quoi constater."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            ID : CT-03
            [[1]] : l'adhérente est connectée ; le livre « Dune » est disponible
            [[2]] : 1. Ouvrir la fiche de « Dune »  2. Cliquer sur « Emprunter »
            [[3]] : le message « Emprunt enregistré » s'affiche
          blanks:
            - ["Préconditions", "Preconditions"]
            - ["Étapes", "Etapes"]
            - ["Résultat attendu", "Resultat attendu"]
      - slug: tst-ex-fiche-recette
        kind: CODE_LIBRE
        title: "Une fiche de recette"
        difficulty: INTERMEDIAIRE
        skill: tests-strategie
        statement: |
          Rédige la fiche du cas de test « **Connexion avec un mauvais mot de passe** ». Utilise exactement ces
          intitulés, un par ligne : `ID :`, `Fonctionnalité :`, `Préconditions :`, `Étapes :`,
          `Résultat attendu :`. Le résultat attendu doit citer le message affiché **et** le fait que
          l'utilisatrice **reste** sur la page de connexion (ou n'est pas connectée).
        criteria: "Cinq intitulés remplis ; le résultat attendu cite un message et l'absence de connexion."
        hints:
          - "ID : CT-02 ; Fonctionnalité : Connexion."
          - "Préconditions : un compte existe avec l'e-mail awa@exemple.fr."
          - "Résultat attendu : le message « Identifiants invalides » s'affiche et l'utilisatrice reste sur la page de connexion."
        solution: |
          ID : CT-02
          Fonctionnalité : Connexion
          Préconditions : un compte existe pour awa@exemple.fr
          Étapes : 1. Ouvrir la page de connexion 2. Saisir awa@exemple.fr et un mauvais mot de passe 3. Cliquer sur « Se connecter »
          Résultat attendu : le message « Identifiants invalides » s'affiche et l'utilisatrice reste sur la page de connexion, non connectée
        explanation: "Une fiche précise que n'importe qui peut dérouler et juger OK ou KO."
        xp: 20
        payload:
          language: text
          starter: |
            ID :
            Fonctionnalité :
            Préconditions :
            Étapes :
            Résultat attendu :
          checks:
            - pattern: '(?im)^\s*ID\s*:[ \t]*\S+'
              message: "Donne un identifiant après « ID : »."
            - pattern: '(?im)^\s*Fonctionnalit[ée]\s*:[ \t]*\S[^\n]{3,}'
              message: "Nomme la fonctionnalité."
            - pattern: '(?im)^\s*Pr[ée]conditions?\s*:[ \t]*\S[^\n]{8,}'
              message: "Décris les préconditions (par exemple : un compte existe)."
            - pattern: '(?im)^\s*[ÉE]tapes\s*:[ \t]*\S[^\n]{15,}'
              message: "Décris les étapes."
            - pattern: '(?im)^\s*R[ée]sultat\s+attendu\s*:[^\n]*(?:message|«|")'
              message: "Le résultat attendu doit citer le message affiché."
            - pattern: '(?im)^\s*R[ée]sultat\s+attendu\s*:[^\n]*(?:reste|non\s+connect|pas\s+connect|n.est\s+pas\s+connect)'
              message: "Le résultat attendu doit dire que l'utilisatrice n'est pas connectée."
      - slug: tst-ex-recette-bug
        kind: CORRIGER_ERREUR
        title: "Un résultat attendu trop vague"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Le résultat attendu de cette fiche est « ça marche ». Remplace-le par un résultat vérifiable qui cite
          le message « Emprunt enregistré ».
        criteria: "Résultat attendu précis, qui cite le message."
        hints:
          - "Qu'est-ce que l'adhérente doit voir ?"
          - "Un message précis."
          - "Résultat attendu : le message « Emprunt enregistré » s'affiche."
        solution: |
          ID : CT-03
          Résultat attendu : le message « Emprunt enregistré » s'affiche et le livre devient indisponible
        explanation: "Vérifiable par oui ou non."
        xp: 10
        payload:
          language: text
          starter: |
            ID : CT-03
            Résultat attendu : ça marche
          checks:
            - pattern: "(?i)ça\\s+marche"
              absent: true
              message: "« Ça marche » n'est pas vérifiable."
            - pattern: '(?im)^\s*R[ée]sultat\s+attendu\s*:[^\n]*Emprunt enregistré'
              message: "Cite le message « Emprunt enregistré »."

  # ===================================================================== LEÇON 4
  - slug: tst-bugs
    title: "Le cycle de vie d'un bug"
    duration: 9
    objective: "Suivre un bug du signalement à la livraison, en passant par un test qui le reproduit."
    prerequisites: "Leçon « Le cahier de recette »."
    skills: [tests-strategie]
    xp: 15
    memo: |
      - Un bug suit un cycle : signalement → reproduction → test qui échoue → correction → test vert → livraison.
      - Un bon ticket : étapes pour reproduire, résultat attendu, résultat obtenu.
      - Chaque bug corrigé laisse un **test de non-régression** derrière lui.
    commonMistakes: |
      - Corriger sans test : le bug peut revenir.
      - Un ticket « ça ne marche pas » impossible à reproduire.
    blocks:
      - type: definition
        id: def-bug
        term: "Test de non-régression"
        md: |
          Un **garde-fou** posé à l'endroit exact où quelqu'un est tombé : on corrige, puis on installe une
          barrière pour que personne ne retombe au même endroit.
      - type: steps
        id: etapes-bug
        title: "Le cycle de vie d'un bug"
        items:
          - "**Signalement** : un ticket décrit le problème, les étapes pour le reproduire et le résultat attendu."
          - "**Reproduction** : on écrit un test automatique qui échoue à cause du bug."
          - "**Correction** : on modifie le code jusqu'à ce que le test passe."
          - "**Vérification** : toute la suite de tests reste verte, la CI valide la pull request."
          - "**Livraison** : la correction est fusionnée puis déployée ; le ticket est fermé."
      - type: question
        ref: tst-jq-q1
        review: etapes-bug
      - type: question
        ref: tst-jq-q4
        review: etapes-bug
      - type: text
        md: "**Exercice 1 (guidé)** : remets le cycle d'un bug dans l'ordre."
      - type: exercise
        ref: tst-ex-bug-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : un ticket de bug."
      - type: exercise
        ref: tst-ex-ticket-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un ticket impossible à reproduire."
      - type: exercise
        ref: tst-ex-ticket-bug
      - type: jury
        items:
          - q: "Comment gérez-vous un bug découvert en production ?"
            a: "Je le reproduis avec un test qui échoue, je le corrige sur une branche dédiée, la CI valide, puis je déploie. Le test reste dans la suite pour que le bug ne revienne jamais."
      - type: quiz
        items:
          - ref: tst-c4-b1
            review: def-bug
          - ref: tst-bg-q4
            review: etapes-bug
          - ref: tst-bg-q5
            review: def-bug
    questions:
      - code: tst-jq-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Quelle est la première chose à faire après avoir reproduit un bug ?"
        choices:
          - label: "Écrire un test automatique qui échoue à cause du bug"
            correct: true
            why: "Il prouvera la correction et empêchera le retour du bug."
          - label: "Modifier le code au hasard"
            correct: false
            why: "On ne saurait pas si c'est corrigé."
          - label: "Fermer le ticket"
            correct: false
            why: "Rien n'est encore corrigé."
        explanation: "Test rouge, correction, test vert."
      - code: tst-jq-q4
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Que doit contenir un bon ticket de bug ?"
        choices:
          - label: "Les étapes pour reproduire, le résultat attendu et le résultat obtenu"
            correct: true
            why: "N'importe qui peut reproduire le problème."
          - label: "Seulement « ça ne marche pas »"
            correct: false
            why: "Impossible à reproduire."
          - label: "Le nom de la personne responsable"
            correct: false
            why: "On cherche la cause, pas un coupable."
        explanation: "Plus l'environnement (navigateur, version) et une capture si utile."
      - code: tst-c4-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Qu'est-ce qu'un test de non-régression ?"
        choices:
          - label: "Un test qui vérifie que ce qui marchait marche toujours après une modification"
            correct: true
            why: "Il protège l'existant."
          - label: "Un test qui ne peut jamais échouer"
            correct: false
            why: "Un test qui n'échoue jamais ne sert à rien."
          - label: "Un test manuel fait par le client"
            correct: false
            why: "Il est en général automatisé."
        explanation: "Toute la suite automatique joue ce rôle à chaque changement."
      - code: tst-bg-q4
        kind: VRAI_FAUX
        difficulty: 1
        skill: tests-strategie
        prompt: "Après la correction, le test qui reproduisait le bug est supprimé."
        choices:
          - label: "Vrai"
            correct: false
            why: "Il reste pour empêcher le retour du bug."
          - label: "Faux"
            correct: true
            why: "C'est le garde-fou."
        explanation: "Le test reste dans la suite."
      - code: tst-bg-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Pourquoi écrire le test qui échoue AVANT la correction ?"
        choices:
          - label: "Pour prouver que le test détecte bien le bug"
            correct: true
            why: "S'il passait déjà, il ne protégerait rien."
          - label: "Pour gagner du temps"
            correct: false
            why: "C'est une question de fiabilité."
          - label: "Ce n'est pas utile"
            correct: false
            why: "C'est la base de la méthode."
        explanation: "Rouge d'abord, comme en TDD."
    exercises:
      - slug: tst-ex-bug-ordre
        kind: REMETTRE_ORDRE
        title: "Le cycle d'un bug"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Remets les étapes dans l'ordre."
        criteria: "Signaler, reproduire, écrire le test, corriger, valider, livrer."
        hints:
          - "Tout commence par un ticket."
          - "Le test qui échoue vient avant la correction."
          - "La livraison vient après la CI verte."
        solution: |
          Un ticket décrit le bug et les étapes pour le reproduire
          On reproduit le bug en local
          On écrit un test automatique qui échoue
          On corrige le code : le test passe
          La CI valide la pull request
          La correction est fusionnée et déployée
        explanation: "Chaque bug corrigé laisse un test derrière lui."
        xp: 10
        payload:
          language: text
          lines:
            - "Un ticket décrit le bug et les étapes pour le reproduire"
            - "On reproduit le bug en local"
            - "On écrit un test automatique qui échoue"
            - "On corrige le code : le test passe"
            - "La CI valide la pull request"
            - "La correction est fusionnée et déployée"
      - slug: tst-ex-ticket-libre
        kind: CODE_LIBRE
        title: "Un ticket de bug"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Rédige un ticket pour ce bug : « le bouton Emprunter reste actif sur un livre déjà emprunté ». Utilise
          les intitulés `Étapes :`, `Résultat attendu :` et `Résultat obtenu :`.
        criteria: "Trois intitulés remplis, avec une vraie phrase."
        hints:
          - "Étapes : ouvrir la fiche d'un livre déjà emprunté."
          - "Résultat attendu : le bouton Emprunter est désactivé."
          - "Résultat obtenu : le bouton reste actif."
        solution: |
          Étapes : ouvrir la fiche d'un livre déjà emprunté
          Résultat attendu : le bouton « Emprunter » est désactivé
          Résultat obtenu : le bouton « Emprunter » reste actif
        explanation: "N'importe qui peut reproduire."
        xp: 15
        payload:
          language: text
          starter: |
            Étapes :
            Résultat attendu :
            Résultat obtenu :
          checks:
            - pattern: '(?im)^\s*[ÉE]tapes\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris les étapes."
            - pattern: '(?im)^\s*R[ée]sultat\s+attendu\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris le résultat attendu."
            - pattern: '(?im)^\s*R[ée]sultat\s+obtenu\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris le résultat obtenu."
      - slug: tst-ex-ticket-bug
        kind: CORRIGER_ERREUR
        title: "Un ticket impossible à reproduire"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Ce ticket dit seulement « ça ne marche pas ». Remplace-le par les trois intitulés `Étapes :`,
          `Résultat attendu :` et `Résultat obtenu :`, pour le bug « la recherche par auteur ne trouve rien ».
        criteria: "Les trois intitulés, plus de « ça ne marche pas »."
        hints:
          - "Que faut-il faire pour voir le bug ?"
          - "Que devrait-on voir ? Que voit-on ?"
          - "Étapes : chercher « Hugo » dans le catalogue…"
        solution: |
          Étapes : chercher « Hugo » dans le catalogue
          Résultat attendu : les livres de Victor Hugo s'affichent
          Résultat obtenu : la liste reste vide
        explanation: "Un ticket reproductible."
        xp: 10
        payload:
          language: text
          starter: |
            ça ne marche pas
          checks:
            - pattern: "(?i)ça\\s+ne\\s+marche\\s+pas"
              absent: true
              message: "« Ça ne marche pas » ne permet pas de reproduire."
            - pattern: '(?im)^\s*[ÉE]tapes\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris les étapes."
            - pattern: '(?im)^\s*R[ée]sultat\s+attendu\s*:[ \t]*\S[^\n]{10,}'
              message: "Décris le résultat attendu."
            - pattern: '(?im)^\s*R[ée]sultat\s+obtenu\s*:[ \t]*\S[^\n]{8,}'
              message: "Décris le résultat obtenu."

  # ===================================================================== LEÇON 5
  - slug: tst-questions-jury
    title: "La qualité devant le jury"
    duration: 10
    objective: "Présenter sa démarche qualité en trois temps : prévenir, détecter, corriger."
    prerequisites: "Leçon « Le cycle de vie d'un bug »."
    skills: [tests-strategie, oral-cda]
    xp: 20
    memo: |
      - Démarche qualité = **prévenir** (conventions, revue, linters) + **détecter** (tests, CI) + **corriger** (tickets, test de régression).
      - Savoir lancer ses tests pendant la démonstration (`./mvnw test`, `npm test`).
      - Un test **fragile** (flaky) se corrige tout de suite.
    commonMistakes: |
      - « J'ai testé à la main » comme seule réponse.
      - Ne pas savoir lancer ses propres tests pendant la démonstration.
    blocks:
      - type: text
        md: |
          Le jury veut savoir si tu peux livrer un logiciel **fiable** dans une équipe. Montre une démarche
          complète, avec des exemples tirés de ton projet.
      - type: steps
        id: etapes-demarche
        title: "Prévenir, détecter, corriger"
        items:
          - "**Prévenir** : conventions de nommage, linters, revue de code sur chaque pull request."
          - "**Détecter** : tests automatiques lancés par la CI, cahier de recette avant livraison."
          - "**Corriger** : un ticket, un test de régression, la correction, la CI verte."
      - type: jury
        id: jury-qualite
        title: "Questions fréquentes sur la qualité"
        items:
          - q: "Combien de tests avez-vous et comment les lancez-vous ?"
            a: "Donnez le nombre réel de tests backend et frontend, la commande (./mvnw test, npm test) et leur durée. Montrez qu'ils tournent dans GitHub Actions à chaque push."
          - q: "Qu'est-ce qui vous garantit qu'une modification ne casse rien ?"
            a: "La suite de tests automatiques relancée par la CI sur chaque pull request, la revue de code, et le cahier de recette pour les parcours critiques avant une livraison."
          - q: "Qu'est-ce qu'un test fragile (flaky) ?"
            a: "Un test qui réussit ou échoue de façon aléatoire, souvent à cause du temps, de l'ordre d'exécution ou de données partagées. Je le corrige tout de suite, sinon l'équipe finit par ignorer les échecs."
      - type: question
        ref: tst-jq-q2
        review: jury-qualite
      - type: question
        ref: tst-jq-q3
        review: jury-qualite
      - type: text
        md: "**Exercice 1 (guidé)** : les trois temps."
      - type: exercise
        ref: tst-ex-demarche-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : présente ta démarche qualité."
      - type: exercise
        ref: tst-ex-demarche
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une réponse sans méthode."
      - type: exercise
        ref: tst-ex-demarche-bug
      - type: quiz
        items:
          - ref: tst-jq-q5
            review: jury-qualite
          - ref: tst-qj-q4
            review: etapes-demarche
          - ref: tst-qj-q5
            review: etapes-demarche
    questions:
      - code: tst-jq-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: tests-strategie
        prompt: "Un test qui échoue de temps en temps, au hasard, peut être ignoré sans conséquence."
        choices:
          - label: "Vrai"
            correct: false
            why: "L'équipe apprend à ignorer les échecs, même les vrais."
          - label: "Faux"
            correct: true
            why: "Un test fragile doit être corrigé rapidement."
        explanation: "La confiance dans la suite de tests est précieuse."
      - code: tst-jq-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: oral-cda
        prompt: "Le jury demande comment vous savez qu'une modification ne casse rien. Meilleure réponse ?"
        choices:
          - label: "Les tests automatiques relancés par la CI sur chaque pull request, plus une revue de code"
            correct: true
            why: "Concret et vérifiable."
          - label: "Je fais attention"
            correct: false
            why: "Pas de méthode."
          - label: "Je teste tout à la main avant chaque livraison"
            correct: false
            why: "Long, incomplet et non reproductible."
        explanation: "Une démarche outillée."
      - code: tst-jq-q5
        kind: TEXTE
        difficulty: 2
        skill: tests-strategie
        prompt: "Comment appelle-t-on en anglais un test qui réussit ou échoue de façon aléatoire ? (un mot)"
        answers: ["flaky"]
        explanation: "Souvent causé par le temps, l'ordre d'exécution ou des données partagées."
      - code: tst-qj-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Dans quel temps de la démarche qualité se place la revue de code ?"
        choices:
          - label: "Prévenir"
            correct: true
            why: "Elle évite que les erreurs arrivent sur main."
          - label: "Corriger"
            correct: false
            why: "On corrige après avoir détecté."
          - label: "Aucun"
            correct: false
            why: "Elle fait partie de la démarche."
        explanation: "Prévenir, détecter, corriger."
      - code: tst-qj-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Dans quel temps se place la CI qui lance les tests ?"
        choices:
          - label: "Détecter"
            correct: true
            why: "Elle repère les régressions."
          - label: "Prévenir"
            correct: false
            why: "Elle détecte ce qui a déjà cassé."
          - label: "Corriger"
            correct: false
            why: "Elle ne corrige rien elle-même."
        explanation: "Tests + CI = détecter."
    exercises:
      - slug: tst-ex-demarche-guide
        kind: COMPLETER
        title: "Les trois temps"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Complète avec : Prévenir, Détecter, Corriger."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Avant l'erreur : prévenir."
          - "La repérer : détecter ; la réparer : corriger."
          - "Prévenir, Détecter, Corriger."
        solution: '["Prévenir", "Détecter", "Corriger"]'
        explanation: "Une démarche complète."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            [[1]] : revue de code et linters
            [[2]] : tests automatiques et CI
            [[3]] : ticket et test de régression
          blanks:
            - ["Prévenir", "Prevenir"]
            - ["Détecter", "Detecter"]
            - ["Corriger"]
      - slug: tst-ex-demarche
        kind: CODE_LIBRE
        title: "Ma démarche qualité"
        difficulty: INTERMEDIAIRE
        skill: oral-cda
        statement: |
          Présente ta démarche qualité en trois lignes : `Prévenir :`, `Détecter :`, `Corriger :`.
          Cite au moins un outil ou une pratique concrète par ligne.
        criteria: "Trois temps, chacun avec une pratique ou un outil concret."
        hints:
          - "Prévenir : conventions, revue de code, linter, SonarLint."
          - "Détecter : tests JUnit et Angular, GitHub Actions, cahier de recette."
          - "Corriger : ticket, test de régression, pull request."
        solution: |
          Prévenir : conventions de nommage, ESLint et SonarLint, revue de code sur chaque pull request.
          Détecter : tests JUnit, Mockito et Angular lancés par GitHub Actions à chaque push, cahier de recette avant livraison.
          Corriger : un ticket par bug, un test de régression qui échoue, la correction, puis la CI verte avant fusion.
        explanation: "Prévenir, détecter, corriger : une réponse structurée et concrète."
        xp: 20
        payload:
          language: text
          starter: |
            Prévenir :
            Détecter :
            Corriger :
          checks:
            - pattern: '(?im)^\s*Pr[ée]venir\s*:[^\n]*(?:convention|revue|review|lint|sonar|pull\s*request|format)'
              message: "« Prévenir » : cite une pratique (revue de code, linter, conventions…)."
            - pattern: '(?im)^\s*D[ée]tecter\s*:[^\n]*(?:test|junit|mockito|ci\b|github\s+actions|recette|playwright)'
              message: "« Détecter » : cite des tests ou la CI."
            - pattern: '(?im)^\s*Corriger\s*:[^\n]*(?:ticket|test|r[ée]gression|pull\s*request|branche)'
              message: "« Corriger » : cite le ticket, le test de régression ou la pull request."
      - slug: tst-ex-demarche-bug
        kind: CORRIGER_ERREUR
        title: "Une réponse sans méthode"
        difficulty: FACILE
        skill: oral-cda
        statement: |
          À la question « Comment savez-vous que votre application fonctionne ? », cette réponse dit seulement
          « J'ai testé à la main ». Remplace-la par une phrase qui cite les **tests automatiques** et la **CI**.
        criteria: "Plus de « à la main » seul ; tests automatiques et CI cités."
        hints:
          - "Le jury attend une méthode outillée."
          - "Tests automatiques + intégration continue."
          - "Mes tests automatiques sont lancés par la CI à chaque pull request."
        solution: |
          Mes tests automatiques JUnit et Angular sont lancés par la CI GitHub Actions à chaque pull request.
        explanation: "Une réponse vérifiable."
        xp: 10
        payload:
          language: text
          starter: |
            J'ai testé à la main.
          checks:
            - pattern: "(?i)test[ée]\\s+à\\s+la\\s+main"
              absent: true
              message: "« Testé à la main » ne suffit pas."
            - pattern: '(?i)tests?\s+automatiques?'
              message: "Cite les tests automatiques."
            - pattern: '(?i)\bCI\b|int[ée]gration\s+continue|github\s+actions'
              message: "Cite la CI."

