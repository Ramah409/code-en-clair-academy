slug: tst-doublures-tdd
position: 2
level: INTERMEDIAIRE
title: "Doublures, TDD et couverture"
summary: "Isoler une classe avec Mockito, écrire le test avant le code (TDD) et mesurer ce que les tests couvrent."
quizQuestionCount: 10

lessons:
  # ===================================================================== LEÇON 1
  - slug: tst-mockito
    title: "Isoler avec des doublures Mockito"
    duration: 14
    objective: "Créer des doublures, programmer leurs réponses, vérifier leurs appels et capturer les arguments transmis."
    prerequisites: "Chapitre « Pourquoi et comment tester »."
    skills: [java-tests, spring-tests]
    xp: 25
    memo: |
      - Une **doublure** remplace une dépendance (repository, service d'e-mail, API externe) pendant le test.
      - `@Mock` crée la doublure ; `@InjectMocks` crée la classe testée avec ses doublures.
      - **Bouchon** (stub) : `when(x.methode()).thenReturn(valeur)` → on programme une réponse.
      - **Espion de vérification** : `verify(x).methode(...)`, `verify(x, never())`, `verify(x, times(2))`.
      - `ArgumentCaptor` : récupérer l'objet exact passé à une doublure pour l'examiner.
    commonMistakes: |
      - Doubler la classe qu'on teste : on ne teste plus rien.
      - Tout vérifier avec `verify` : le test casse à chaque petite modification interne.
      - Oublier `@ExtendWith(MockitoExtension.class)` : les doublures restent `null`.
    blocks:
      - type: text
        md: |
          Pour tester l'envoi d'un e-mail de bienvenue, on ne veut pas **vraiment** envoyer un e-mail à chaque
          test. On remplace le service d'e-mail par une **doublure** qui note simplement qu'on l'a appelée.
      - type: definition
        id: def-doublure
        term: "Doublure"
        md: |
          Un **mannequin de crash-test** : il prend la place d'une vraie personne pour tester la voiture sans
          risque. Il ne sait rien faire d'autre que ce qu'on lui a programmé, mais il enregistre tout ce qu'il
          subit.
      - type: code
        id: code-mockito
        language: java
        title: "InscriptionServiceTest.java"
        code: |
          @ExtendWith(MockitoExtension.class)
          class InscriptionServiceTest {

              @Mock UtilisateurRepository utilisateurs;
              @Mock EmailService emails;
              @InjectMocks InscriptionService service;

              @Test
              void envoieUnEmailDeBienvenue() {
                  when(utilisateurs.existsByEmail("awa@exemple.fr")).thenReturn(false);

                  service.inscrire("awa@exemple.fr", "Awa");

                  ArgumentCaptor<Email> captor = ArgumentCaptor.forClass(Email.class);
                  verify(emails).envoyer(captor.capture());
                  assertEquals("Bienvenue Awa !", captor.getValue().sujet());
              }
          }
        lines:
          - n: 4
            note: "Doublure du repository : pas de base de données."
          - n: 5
            note: "Doublure du service d'e-mail : aucun e-mail réel."
          - n: 6
            note: "Le **vrai** service, qui reçoit les deux doublures."
          - n: 10
            note: "Bouchon : l'e-mail n'existe pas encore."
          - n: 14
            note: "Un « filet » pour attraper l'e-mail passé à la doublure."
          - n: 15
            note: "On vérifie que `envoyer` a été appelé, et on capture son argument."
          - n: 16
            note: "On examine l'e-mail capturé."
      - type: question
        ref: tst-mk-q1
        review: code-mockito
      - type: question
        ref: tst-mk-q2
        review: def-doublure
      - type: text
        md: "Exercice guidé : complète les vérifications."
      - type: exercise
        ref: tst-ex-mockito-guide
      - type: text
        md: "En autonomie : teste le refus d'un e-mail déjà utilisé."
      - type: exercise
        ref: tst-ex-mockito
      - type: jury
        items:
          - q: "Quelle différence entre un bouchon et un mock ?"
            a: "Un bouchon (stub) renvoie des réponses programmées pour que le code testé puisse avancer : when…thenReturn. Un mock sert en plus à vérifier les interactions : verify(emails).envoyer(...). Avec Mockito, le même objet peut jouer les deux rôles."
          - q: "Pourquoi ne pas tout vérifier avec verify ?"
            a: "Parce que le test devient lié à la façon dont le code est écrit, pas à ce qu'il produit. Je vérifie d'abord le résultat, et j'utilise verify seulement pour les effets de bord importants, comme l'envoi d'un e-mail ou l'enregistrement en base."
      - type: quiz
        items:
          - ref: tst-mk-q3
            review: code-mockito
          - ref: tst-mk-q4
            review: code-mockito
          - ref: tst-mk-q5
            review: def-doublure
    questions:
      - code: tst-mk-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "À quoi sert `ArgumentCaptor` ?"
        choices:
          - label: "À récupérer l'objet exact passé à une doublure pour l'examiner"
            correct: true
            why: "On peut ensuite vérifier ses champs."
          - label: "À créer une doublure"
            correct: false
            why: "C'est le rôle de @Mock."
          - label: "À capturer les exceptions"
            correct: false
            why: "C'est le rôle de assertThrows."
        explanation: "verify(x).methode(captor.capture()) puis captor.getValue()."
      - code: tst-mk-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Pourquoi remplacer le service d'e-mail par une doublure dans un test ?"
        choices:
          - label: "Pour ne pas envoyer de vrais e-mails et garder un test rapide et isolé"
            correct: true
            why: "Le test ne dépend plus d'un serveur d'e-mail."
          - label: "Parce que Mockito l'impose"
            correct: false
            why: "C'est un choix de conception."
          - label: "Pour tester le serveur d'e-mail"
            correct: false
            why: "On le remplace justement, on ne le teste pas."
        explanation: "On teste une classe à la fois."
      - code: tst-mk-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "Comment vérifier qu'aucun e-mail n'a été envoyé ?"
        choices:
          - label: "verify(emails, never()).envoyer(any())"
            correct: true
            why: "never() = zéro appel."
          - label: "assertNull(emails)"
            correct: false
            why: "La doublure existe, elle n'est pas null."
          - label: "when(emails.envoyer(any())).thenReturn(null)"
            correct: false
            why: "On programme une réponse, on ne vérifie rien."
        explanation: "Aussi : times(2), atLeastOnce()…"
      - code: tst-mk-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: java-tests
        prompt: "Sans `@ExtendWith(MockitoExtension.class)`, les champs `@Mock` restent null."
        choices:
          - label: "Vrai"
            correct: true
            why: "Personne ne les crée."
          - label: "Faux"
            correct: false
            why: "L'extension est indispensable avec JUnit 5 (ou MockitoAnnotations.openMocks)."
        explanation: "Symptôme : NullPointerException dès le premier appel."
      - code: tst-mk-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "Quelle classe ne faut-il jamais remplacer par une doublure dans son propre test ?"
        choices:
          - label: "La classe qu'on est en train de tester"
            correct: true
            why: "Sinon on teste la doublure, pas le code."
          - label: "Le repository"
            correct: false
            why: "C'est une dépendance : on peut la doubler."
          - label: "Le service d'e-mail"
            correct: false
            why: "Idem."
        explanation: "@InjectMocks crée le vrai objet testé."
    exercises:
      - slug: tst-ex-mockito-guide
        kind: COMPLETER
        title: "Compléter les vérifications"
        difficulty: FACILE
        skill: java-tests
        statement: "Complète : programmer la doublure, vérifier un appel, vérifier une absence d'appel."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "On programme avec when… thenReturn."
          - "On vérifie avec verify ; zéro appel : never()."
          - "when, thenReturn, verify, never."
        solution: '["when", "thenReturn", "verify", "never"]'
        explanation: "Programmer, agir, vérifier les appels."
        xp: 10
        payload:
          language: java
          template: |
            [[1]](stock.quantite("café")).[[2]](0);

            boolean ok = commandeService.commander("café", 1);

            assertFalse(ok);
            [[3]](stock).quantite("café");
            verify(paiement, [[4]]()).debiter(any());
          blanks:
            - ["when"]
            - ["thenReturn"]
            - ["verify"]
            - ["never"]
      - slug: tst-ex-mockito
        kind: CODE_LIBRE
        title: "Refuser un e-mail déjà utilisé"
        difficulty: DIFFICILE
        skill: java-tests
        statement: |
          Dans `InscriptionServiceTest` (doublures `utilisateurs` et `emails`, service `service` déjà déclarés),
          écris le test `refuseUnEmailDejaUtilise()` :
          1. programme `utilisateurs.existsByEmail("awa@exemple.fr")` pour renvoyer `true` ;
          2. vérifie que `service.inscrire("awa@exemple.fr", "Awa")` lance `EmailDejaUtiliseException` ;
          3. vérifie que `utilisateurs.save(...)` n'est **jamais** appelé ;
          4. vérifie qu'**aucun** e-mail n'est envoyé.
        criteria: "when…thenReturn(true), assertThrows, verify(…, never()) sur save et sur envoyer."
        hints:
          - "`when(utilisateurs.existsByEmail(\"awa@exemple.fr\")).thenReturn(true);`"
          - "`assertThrows(EmailDejaUtiliseException.class, () -> service.inscrire(\"awa@exemple.fr\", \"Awa\"));`"
          - "`verify(utilisateurs, never()).save(any());` et `verify(emails, never()).envoyer(any());`"
        solution: |
          @Test
          void refuseUnEmailDejaUtilise() {
              when(utilisateurs.existsByEmail("awa@exemple.fr")).thenReturn(true);

              assertThrows(EmailDejaUtiliseException.class,
                      () -> service.inscrire("awa@exemple.fr", "Awa"));

              verify(utilisateurs, never()).save(any());
              verify(emails, never()).envoyer(any());
          }
        explanation: "On vérifie l'erreur, mais aussi qu'aucun effet de bord n'a eu lieu."
        xp: 30
        payload:
          language: java
          starter: |
            @Test
            void refuseUnEmailDejaUtilise() {

            }
          checks:
            - pattern: 'when\s*\(\s*utilisateurs\.existsByEmail\s*\(\s*"awa@exemple\.fr"\s*\)\s*\)\s*\.thenReturn\s*\(\s*true\s*\)'
              message: "Programme `when(utilisateurs.existsByEmail(\"awa@exemple.fr\")).thenReturn(true)`."
            - pattern: 'assertThrows\s*\(\s*EmailDejaUtiliseException\.class\s*,\s*\(\s*\)\s*->\s*service\.inscrire\s*\('
              message: "Vérifie l'exception avec `assertThrows(EmailDejaUtiliseException.class, () -> service.inscrire(…))`."
            - pattern: 'verify\s*\(\s*utilisateurs\s*,\s*never\s*\(\s*\)\s*\)\s*\.save\s*\('
              message: "Vérifie que `save` n'est jamais appelé : `verify(utilisateurs, never()).save(any())`."
            - pattern: 'verify\s*\(\s*emails\s*,\s*never\s*\(\s*\)\s*\)\s*\.envoyer\s*\('
              message: "Vérifie qu'aucun e-mail n'est envoyé : `verify(emails, never()).envoyer(any())`."

  # ===================================================================== LEÇON 2
  - slug: tst-tdd
    title: "Le TDD et la couverture de code"
    duration: 13
    objective: "Appliquer le cycle rouge-vert-refactoriser, et interpréter un taux de couverture sans en faire un objectif absolu."
    prerequisites: "Leçon « Isoler avec des doublures Mockito »."
    skills: [tests-strategie, java-tests]
    xp: 25
    memo: |
      - **TDD** (développement piloté par les tests) : écrire le test **avant** le code.
      - Cycle : **Rouge** (le test échoue) → **Vert** (le code minimal le fait passer) → **Refactoriser** (on améliore sans casser).
      - Avantages : on ne code que ce qui est utile, et chaque règle est protégée par un test.
      - **Couverture** : pourcentage de lignes exécutées par les tests (JaCoCo en Java).
      - 100 % de couverture ne garantit **pas** l'absence de bug : un test sans bonne assertion « couvre » sans vérifier.
    commonMistakes: |
      - Écrire tout le code, puis quelques tests pour « faire de la couverture ».
      - Sauter l'étape rouge : on ne sait pas si le test peut échouer.
      - Viser 100 % en testant des getters au lieu des règles métier.
    blocks:
      - type: text
        md: |
          Le **TDD** renverse l'ordre habituel : on écrit d'abord le test qui décrit ce qu'on veut, on le voit
          échouer, puis on écrit juste assez de code pour qu'il passe.
      - type: definition
        id: def-tdd
        term: "Rouge, vert, refactoriser"
        md: |
          Comme un **GPS** : on entre d'abord la **destination** (le test, rouge car on n'y est pas), puis on
          roule jusqu'à l'atteindre (vert), puis on cherche un **meilleur itinéraire** sans changer de
          destination (refactoriser).
      - type: steps
        id: etapes-tdd
        title: "Un tour de TDD pour « la livraison est gratuite dès 50 € »"
        items:
          - "**Rouge** : `assertEquals(0, Livraison.frais(50))` → ne compile pas ou échoue, la méthode n'existe pas."
          - "**Vert** : `return montant >= 50 ? 0 : 4.9;` → le test passe."
          - "**Rouge** : `assertEquals(4.9, Livraison.frais(49.99))` → on ajoute le cas suivant."
          - "**Vert** : il passe déjà ? Parfait, la règle est bien écrite."
          - "**Refactoriser** : remplacer `50` et `4.9` par des constantes nommées, relancer les tests."
      - type: question
        ref: tst-tdd-q1
        review: etapes-tdd
      - type: definition
        id: def-couverture
        term: "Couverture de code"
        md: |
          Le **pourcentage de routes** d'une ville qu'un livreur a parcourues. 80 % des routes parcourues ne
          veut pas dire qu'il a regardé si les maisons étaient en bon état. De même, une ligne exécutée par un
          test n'est pas forcément **vérifiée**.
      - type: question
        ref: tst-tdd-q2
        review: def-couverture
      - type: text
        md: "Exercice guidé : remets un cycle TDD dans l'ordre."
      - type: exercise
        ref: tst-ex-tdd-ordre
      - type: text
        md: "En autonomie : écris le code qui fait passer ces tests."
      - type: exercise
        ref: tst-ex-tdd-vert
      - type: jury
        items:
          - q: "Pratiquez-vous le TDD ?"
            a: "Sur les règles métier, oui : j'écris le test qui décrit la règle, je le vois échouer, j'écris le code minimal, puis je refactorise avec les tests comme filet. Pour l'interface, j'écris plutôt les tests après. L'important est que chaque règle métier soit couverte par un test."
          - q: "Quel est votre taux de couverture ?"
            a: "Je le mesure avec JaCoCo, mais je ne vise pas un chiffre à tout prix. Je vérifie surtout que les services et règles métier sont bien couverts avec de vraies assertions. Une couverture élevée avec de mauvais tests ne protège de rien."
      - type: quiz
        items:
          - ref: tst-tdd-q3
            review: def-tdd
          - ref: tst-tdd-q4
            review: def-couverture
          - ref: tst-tdd-q5
            review: etapes-tdd
    questions:
      - code: tst-tdd-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Quelle est la première étape du TDD ?"
        choices:
          - label: "Écrire un test qui échoue"
            correct: true
            why: "Rouge d'abord."
          - label: "Écrire tout le code"
            correct: false
            why: "C'est l'approche classique, pas le TDD."
          - label: "Refactoriser"
            correct: false
            why: "C'est la dernière étape."
        explanation: "Rouge → Vert → Refactoriser."
      - code: tst-tdd-q2
        kind: VRAI_FAUX
        difficulty: 2
        skill: tests-strategie
        prompt: "Un code couvert à 100 % par les tests ne contient aucun bug."
        choices:
          - label: "Vrai"
            correct: false
            why: "Couvrir une ligne ne veut pas dire la vérifier."
          - label: "Faux"
            correct: true
            why: "Des tests sans bonnes assertions couvrent sans protéger."
        explanation: "La couverture montre ce qui n'est pas testé, pas la qualité des tests."
      - code: tst-tdd-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Pourquoi faut-il voir le test échouer avant d'écrire le code ?"
        choices:
          - label: "Pour être sûr que le test est capable de détecter l'absence de la fonctionnalité"
            correct: true
            why: "Un test qui passe toujours ne protège de rien."
          - label: "Pour perdre du temps"
            correct: false
            why: "C'est une vérification rapide et utile."
          - label: "Parce que JUnit l'exige"
            correct: false
            why: "C'est une discipline, pas une contrainte technique."
        explanation: "On teste le test."
      - code: tst-tdd-q4
        kind: TEXTE
        difficulty: 2
        skill: java-tests
        prompt: "Quel outil mesure la couverture de code des tests Java avec Maven ? (un nom)"
        answers: ["JaCoCo", "Jacoco", "jacoco"]
        explanation: "Le rapport HTML montre en rouge les lignes jamais exécutées."
      - code: tst-tdd-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Pendant l'étape « refactoriser », que doit-il arriver aux tests ?"
        choices:
          - label: "Ils doivent rester verts"
            correct: true
            why: "On améliore le code sans changer son comportement."
          - label: "Ils doivent devenir rouges"
            correct: false
            why: "Ce serait une régression."
          - label: "On les supprime"
            correct: false
            why: "Ils sont le filet de sécurité."
        explanation: "Refactoriser = même comportement, meilleur code."
    exercises:
      - slug: tst-ex-tdd-ordre
        kind: REMETTRE_ORDRE
        title: "Un cycle TDD"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Remets dans l'ordre les étapes pour ajouter la règle « mot de passe d'au moins 12 caractères »."
        criteria: "Test, échec, code minimal, succès, amélioration, relance."
        hints:
          - "On commence par écrire le test."
          - "On le lance pour le voir échouer."
          - "On termine en améliorant le code et en relançant les tests."
        solution: |
          Écrire le test : un mot de passe de 11 caractères est refusé
          Lancer le test : il échoue (rouge)
          Écrire le code minimal : if (mdp.length() < 12) throw …
          Relancer le test : il passe (vert)
          Remplacer 12 par une constante LONGUEUR_MIN
          Relancer tous les tests : ils restent verts
        explanation: "Rouge, vert, refactoriser, et toujours relancer."
        xp: 10
        payload:
          language: text
          lines:
            - "Écrire le test : un mot de passe de 11 caractères est refusé"
            - "Lancer le test : il échoue (rouge)"
            - "Écrire le code minimal : if (mdp.length() < 12) throw …"
            - "Relancer le test : il passe (vert)"
            - "Remplacer 12 par une constante LONGUEUR_MIN"
            - "Relancer tous les tests : ils restent verts"
      - slug: tst-ex-tdd-vert
        kind: CODE_LIBRE
        title: "Passer au vert"
        difficulty: INTERMEDIAIRE
        skill: java-tests
        statement: |
          Ces tests sont rouges. Écris la classe `Livraison` avec la méthode statique
          `double frais(double montant)` qui les fait passer :

          ```java
          assertEquals(4.9, Livraison.frais(49.99));
          assertEquals(0, Livraison.frais(50));
          assertThrows(IllegalArgumentException.class, () -> Livraison.frais(-1));
          ```

          Utilise deux constantes : `SEUIL_GRATUITE = 50` et `FRAIS_STANDARD = 4.9`.
        criteria: "Méthode statique, exception si montant négatif, comparaison >= au seuil, constantes nommées."
        hints:
          - "`private static final double SEUIL_GRATUITE = 50;`"
          - "`if (montant < 0) throw new IllegalArgumentException(\"Montant négatif\");`"
          - "`return montant >= SEUIL_GRATUITE ? 0 : FRAIS_STANDARD;`"
        solution: |
          public class Livraison {

              private static final double SEUIL_GRATUITE = 50;
              private static final double FRAIS_STANDARD = 4.9;

              public static double frais(double montant) {
                  if (montant < 0) {
                      throw new IllegalArgumentException("Montant négatif");
                  }
                  return montant >= SEUIL_GRATUITE ? 0 : FRAIS_STANDARD;
              }
          }
        explanation: "Le code minimal qui satisfait les trois tests, avec des noms à la place des nombres magiques."
        xp: 20
        payload:
          language: java
          starter: |
            public class Livraison {

            }
          checks:
            - pattern: 'static\s+final\s+double\s+SEUIL_GRATUITE\s*=\s*50(?:\.0+)?\s*;'
              message: "Déclare la constante `SEUIL_GRATUITE = 50`."
            - pattern: 'static\s+final\s+double\s+FRAIS_STANDARD\s*=\s*4\.9\s*;'
              message: "Déclare la constante `FRAIS_STANDARD = 4.9`."
            - pattern: 'public\s+static\s+double\s+frais\s*\(\s*double\s+montant\s*\)'
              message: "Écris `public static double frais(double montant)`."
            - pattern: 'if\s*\(\s*montant\s*<\s*0(?:\.0+)?\s*\)\s*\{?\s*throw\s+new\s+IllegalArgumentException'
              message: "Lance une `IllegalArgumentException` si le montant est négatif."
            - pattern: 'montant\s*>=\s*SEUIL_GRATUITE|SEUIL_GRATUITE\s*<=\s*montant|montant\s*<\s*SEUIL_GRATUITE'
              message: "Compare le montant au seuil avec `>=` (50 € doit être gratuit)."
            - pattern: 'return[^;]*\b(?:50|4\.9)\b'
              absent: true
              message: "Utilise les constantes au lieu d'écrire 50 ou 4.9 dans le return."

