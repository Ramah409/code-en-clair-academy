slug: tst-doublures-tdd
position: 2
level: INTERMEDIAIRE
title: "Doublures, TDD et couverture"
summary: "Programmer une doublure, vérifier ses appels et capturer ses arguments, écrire le test avant le code (TDD) et lire un taux de couverture. Une seule notion par leçon."
quizQuestionCount: 14

lessons:
  # ===================================================================== LEÇON 1
  - slug: tst-mockito
    title: "Les bouchons : when… thenReturn"
    duration: 11
    objective: "Créer des doublures avec Mockito et programmer leurs réponses, y compris une panne."
    prerequisites: "Chapitre « Pourquoi et comment tester »."
    skills: [java-tests, spring-tests]
    xp: 15
    memo: |
      - Une **doublure** remplace une dépendance (repository, service d'e-mail, API externe) pendant le test.
      - `@Mock` crée la doublure ; `@InjectMocks` crée la classe testée avec ses doublures.
      - **Bouchon** (stub) : `when(x.methode()).thenReturn(valeur)` → on programme une réponse.
      - `thenThrow(...)` simule une panne de la dépendance.
      - `@ExtendWith(MockitoExtension.class)` active Mockito dans la classe de test.
    commonMistakes: |
      - Doubler la classe qu'on teste : on ne teste plus rien.
      - Oublier `@ExtendWith(MockitoExtension.class)` : les doublures restent `null`.
    blocks:
      - type: text
        md: |
          Pour tester une inscription, on ne veut pas de vraie base de données. On remplace le repository par une
          **doublure** à qui l'on dicte ses réponses.
      - type: definition
        id: def-doublure
        term: "Doublure"
        md: |
          Un **mannequin de crash-test** : il prend la place d'une vraie personne pour tester la voiture sans
          risque. Il ne sait rien faire d'autre que ce qu'on lui a programmé, mais il enregistre tout ce qu'il
          subit.
      - type: code
        id: code-bouchon
        language: java
        title: "Programmer une réponse"
        code: |
          @ExtendWith(MockitoExtension.class)
          class InscriptionServiceTest {

              @Mock UtilisateurRepository utilisateurs;
              @Mock EmailService emails;
              @InjectMocks InscriptionService service;

              @Test
              void refuseUnEmailDejaUtilise() {
                  when(utilisateurs.existsByEmail("awa@exemple.fr")).thenReturn(true);

                  assertThrows(EmailDejaUtiliseException.class,
                          () -> service.inscrire("awa@exemple.fr", "Awa"));
              }
          }
        lines:
          - n: 4
            note: "Doublure du repository : pas de base de données."
          - n: 5
            note: "Doublure du service d'e-mail : aucun e-mail réel."
          - n: 6
            note: "Le **vrai** service, qui reçoit les deux doublures."
          - n: 10
            note: "Bouchon : « oui, cet e-mail existe déjà »."
          - n: 12
            note: "Le service doit alors refuser l'inscription."
      - type: question
        ref: tst-mk-q2
        review: def-doublure
      - type: question
        ref: tst-mk-q4
        review: code-bouchon
      - type: text
        md: "**Exercice 1 (guidé)** : complète les bouchons."
      - type: exercise
        ref: tst-ex-bouchon-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un e-mail libre."
      - type: exercise
        ref: tst-ex-bouchon-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une doublure de trop."
      - type: exercise
        ref: tst-ex-bouchon-bug
      - type: quiz
        items:
          - ref: tst-mk-q5
            review: def-doublure
          - ref: tst-c2-b1
            review: code-bouchon
          - ref: tst-bo-q5
            review: code-bouchon
    questions:
      - code: tst-mk-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Pourquoi remplacer le service d'e-mail par une doublure dans un test ?"
        choices:
          - label: "Pour ne pas envoyer de vrais e-mails et garder un test rapide et isolé"
            correct: true
            why: "Le test ne dépend plus d'un serveur d'e-mail."
          - label: "Parce que Mockito l'impose"
            correct: false
            why: "C'est un choix de conception."
          - label: "Pour tester le serveur d'e-mail"
            correct: false
            why: "On le remplace justement, on ne le teste pas."
        explanation: "On teste une classe à la fois."
      - code: tst-mk-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: java-tests
        prompt: "Sans `@ExtendWith(MockitoExtension.class)`, les champs `@Mock` restent null."
        choices:
          - label: "Vrai"
            correct: true
            why: "Personne ne les crée."
          - label: "Faux"
            correct: false
            why: "L'extension est indispensable avec JUnit 5 (ou MockitoAnnotations.openMocks)."
        explanation: "Symptôme : NullPointerException dès le premier appel."
      - code: tst-mk-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "Quelle classe ne faut-il jamais remplacer par une doublure dans son propre test ?"
        choices:
          - label: "La classe qu'on est en train de tester"
            correct: true
            why: "Sinon on teste la doublure, pas le code."
          - label: "Le repository"
            correct: false
            why: "C'est une dépendance : on peut la doubler."
          - label: "Le service d'e-mail"
            correct: false
            why: "Idem."
        explanation: "@InjectMocks crée le vrai objet testé."
      - code: tst-c2-b1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "`when(repo.findById(1L)).thenThrow(new RuntimeException())` sert à…"
        choices:
          - label: "Simuler une panne de la dépendance pour tester la réaction du code"
            correct: true
            why: "On teste le chemin d'erreur."
          - label: "Faire échouer le test volontairement"
            correct: false
            why: "Le test vérifie la réaction, il ne doit pas échouer."
          - label: "Supprimer l'élément 1"
            correct: false
            why: "Aucune donnée réelle n'est touchée."
        explanation: "Les doublures permettent de reproduire facilement les cas d'erreur."
      - code: tst-bo-q5
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Que renvoie une doublure qu'on n'a pas programmée, pour une méthode qui renvoie un booléen ?"
        choices:
          - label: "false (une valeur par défaut)"
            correct: true
            why: "Mockito renvoie des valeurs vides par défaut."
          - label: "true"
            correct: false
            why: "La valeur par défaut est false."
          - label: "Une erreur de compilation"
            correct: false
            why: "Le code compile."
        explanation: "Il faut programmer les réponses utiles au test."
    exercises:
      - slug: tst-ex-bouchon-guide
        kind: COMPLETER
        title: "Compléter les bouchons"
        difficulty: FACILE
        skill: java-tests
        statement: "Complète : la doublure, le vrai service, puis la réponse programmée."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "La doublure : Mock ; le vrai service : InjectMocks."
          - "On programme avec when… thenReturn."
          - "Mock, InjectMocks, when, thenReturn."
        solution: '["Mock", "InjectMocks", "when", "thenReturn"]'
        explanation: "Créer, injecter, programmer."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]] LivreRepository livres;
            @[[2]] EmpruntService service;

            [[3]](livres.existsById(3L)).[[4]](false);
          blanks:
            - ["Mock"]
            - ["InjectMocks"]
            - ["when"]
            - ["thenReturn"]
      - slug: tst-ex-bouchon-libre
        kind: CODE_LIBRE
        title: "Un e-mail libre"
        difficulty: INTERMEDIAIRE
        skill: java-tests
        statement: |
          Écris le test `accepteUnEmailLibre()` :
          - programme `utilisateurs.existsByEmail("leo@exemple.fr")` pour renvoyer `false` ;
          - appelle `service.inscrire("leo@exemple.fr", "Léo")` ;
          - vérifie avec `assertDoesNotThrow` que rien n'est lancé, en enveloppant l'appel : `assertDoesNotThrow(() -> service.inscrire(...))`.
        criteria: "when…thenReturn(false) et assertDoesNotThrow sur l'inscription."
        hints:
          - "`when(utilisateurs.existsByEmail(\"leo@exemple.fr\")).thenReturn(false);`"
          - "`assertDoesNotThrow(() -> …)` enveloppe l'appel."
          - "`assertDoesNotThrow(() -> service.inscrire(\"leo@exemple.fr\", \"Léo\"));`"
        solution: |
          @Test
          void accepteUnEmailLibre() {
              when(utilisateurs.existsByEmail("leo@exemple.fr")).thenReturn(false);
              assertDoesNotThrow(() -> service.inscrire("leo@exemple.fr", "Léo"));
          }
        explanation: "Le chemin heureux, sans vraie base."
        xp: 15
        payload:
          language: java
          starter: |
            @Test
            void accepteUnEmailLibre() {

            }
          checks:
            - pattern: 'when\s*\(\s*utilisateurs\.existsByEmail\s*\(\s*"leo@exemple\.fr"\s*\)\s*\)\s*\.thenReturn\s*\(\s*false\s*\)'
              message: "Programme when(utilisateurs.existsByEmail(\"leo@exemple.fr\")).thenReturn(false)."
            - pattern: 'assertDoesNotThrow\s*\(\s*\(\s*\)\s*->\s*service\.inscrire\s*\(\s*"leo@exemple\.fr"\s*,\s*"Léo"\s*\)\s*\)'
              message: "Vérifie assertDoesNotThrow(() -> service.inscrire(\"leo@exemple.fr\", \"Léo\"))."
      - slug: tst-ex-bouchon-bug
        kind: CORRIGER_ERREUR
        title: "Une doublure de trop"
        difficulty: FACILE
        skill: java-tests
        statement: |
          Ce test a remplacé le service **testé** par une doublure : il ne teste plus rien. Le service doit être
          le vrai objet : remplace `@Mock` par `@InjectMocks` sur `service`.
        criteria: "@InjectMocks InscriptionService service."
        hints:
          - "Quelle classe est testée ?"
          - "Elle doit être réelle."
          - "`@InjectMocks InscriptionService service;`"
        solution: |
          @Mock UtilisateurRepository utilisateurs;
          @InjectMocks InscriptionService service;
        explanation: "On double les dépendances, jamais l'objet testé."
        xp: 10
        payload:
          language: java
          starter: |
            @Mock UtilisateurRepository utilisateurs;
            @Mock InscriptionService service;
          checks:
            - pattern: '@Mock\s+InscriptionService'
              absent: true
              message: "Le service testé ne doit pas être une doublure."
            - pattern: '@InjectMocks\s+InscriptionService\s+service'
              message: "Écris @InjectMocks InscriptionService service."

  # ===================================================================== LEÇON 2
  - slug: tst-captor
    title: "Vérifier un appel et capturer son argument"
    duration: 11
    objective: "Vérifier qu'une doublure a été appelée, jamais appelée, et examiner l'objet qu'on lui a passé avec ArgumentCaptor."
    prerequisites: "Leçon « Les bouchons : when… thenReturn »."
    skills: [java-tests]
    xp: 15
    memo: |
      - `verify(x).methode(...)` : la méthode a été appelée ; `verify(x, never())` : jamais.
      - `ArgumentCaptor` : récupérer l'objet exact passé à une doublure pour l'examiner.
      - On vérifie les **effets de bord importants** (e-mail envoyé, enregistrement), pas chaque détail interne.
    commonMistakes: |
      - Tout vérifier avec `verify` : le test casse à chaque petite modification interne.
      - Oublier `captor.capture()` dans le verify.
    blocks:
      - type: definition
        id: def-captor
        term: "ArgumentCaptor"
        md: |
          Un **filet** tendu devant la doublure : quand on lui passe un objet, le filet l'attrape pour qu'on
          puisse regarder ce qu'il contient.
      - type: code
        id: code-mockito
        language: java
        title: "Vérifier l'e-mail de bienvenue"
        code: |
          @Test
          void envoieUnEmailDeBienvenue() {
              when(utilisateurs.existsByEmail("awa@exemple.fr")).thenReturn(false);

              service.inscrire("awa@exemple.fr", "Awa");

              ArgumentCaptor<Email> captor = ArgumentCaptor.forClass(Email.class);
              verify(emails).envoyer(captor.capture());
              assertEquals("Bienvenue Awa !", captor.getValue().sujet());
          }
        lines:
          - n: 3
            note: "Bouchon : l'e-mail n'existe pas encore."
          - n: 7
            note: "Un « filet » pour attraper l'e-mail passé à la doublure."
          - n: 8
            note: "On vérifie que `envoyer` a été appelé, et on capture son argument."
          - n: 9
            note: "On examine l'e-mail capturé."
      - type: question
        ref: tst-mk-q1
        review: def-captor
      - type: question
        ref: tst-mk-q3
        review: code-mockito
      - type: text
        md: "**Exercice 1 (guidé)** : complète les vérifications."
      - type: exercise
        ref: tst-ex-mockito-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : refuser un e-mail déjà utilisé."
      - type: exercise
        ref: tst-ex-mockito
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un filet jamais tendu."
      - type: exercise
        ref: tst-ex-captor-bug
      - type: jury
        items:
          - q: "Quelle différence entre un bouchon et un mock ?"
            a: "Un bouchon (stub) renvoie des réponses programmées pour que le code testé puisse avancer : when…thenReturn. Un mock sert en plus à vérifier les interactions : verify(emails).envoyer(...). Avec Mockito, le même objet peut jouer les deux rôles."
          - q: "Pourquoi ne pas tout vérifier avec verify ?"
            a: "Parce que le test devient lié à la façon dont le code est écrit, pas à ce qu'il produit. Je vérifie d'abord le résultat, et j'utilise verify seulement pour les effets de bord importants, comme l'envoi d'un e-mail ou l'enregistrement en base."
      - type: quiz
        items:
          - ref: tst-ca-q3
            review: code-mockito
          - ref: tst-ca-q4
            review: def-captor
          - ref: tst-ca-q5
            review: code-mockito
    questions:
      - code: tst-mk-q1
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "À quoi sert `ArgumentCaptor` ?"
        choices:
          - label: "À récupérer l'objet exact passé à une doublure pour l'examiner"
            correct: true
            why: "On peut ensuite vérifier ses champs."
          - label: "À créer une doublure"
            correct: false
            why: "C'est le rôle de @Mock."
          - label: "À capturer les exceptions"
            correct: false
            why: "C'est le rôle de assertThrows."
        explanation: "verify(x).methode(captor.capture()) puis captor.getValue()."
      - code: tst-mk-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "Comment vérifier qu'aucun e-mail n'a été envoyé ?"
        choices:
          - label: "verify(emails, never()).envoyer(any())"
            correct: true
            why: "never() = zéro appel."
          - label: "assertNull(emails)"
            correct: false
            why: "La doublure existe, elle n'est pas null."
          - label: "when(emails.envoyer(any())).thenReturn(null)"
            correct: false
            why: "On programme une réponse, on ne vérifie rien."
        explanation: "Aussi : times(2), atLeastOnce()…"
      - code: tst-ca-q3
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Comment lire l'objet attrapé par le filet ?"
        choices:
          - label: "`captor.getValue()`"
            correct: true
            why: "La dernière valeur capturée."
          - label: "`captor.capture()`"
            correct: false
            why: "capture() tend le filet dans le verify."
          - label: "`emails.getValue()`"
            correct: false
            why: "On lit depuis le captor."
        explanation: "capture() dans verify, getValue() ensuite."
      - code: tst-ca-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: java-tests
        prompt: "Il vaut mieux vérifier chaque appel interne avec verify, pour être sûr."
        choices:
          - label: "Vrai"
            correct: false
            why: "Le test casserait à chaque petite réorganisation."
          - label: "Faux"
            correct: true
            why: "On vérifie les effets de bord importants."
        explanation: "Tester le quoi, pas le comment."
      - code: tst-ca-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "Dans l'exemple, que vérifie la dernière ligne ?"
        choices:
          - label: "Le sujet de l'e-mail envoyé"
            correct: true
            why: "On examine l'objet capturé."
          - label: "Que l'e-mail n'a pas été envoyé"
            correct: false
            why: "Il a été envoyé."
          - label: "Que l'utilisateur existe"
            correct: false
            why: "Ce n'est pas la dernière ligne."
        explanation: "Vérifier le contenu, pas seulement l'appel."
    exercises:
      - slug: tst-ex-mockito-guide
        kind: COMPLETER
        title: "Compléter les vérifications"
        difficulty: FACILE
        skill: java-tests
        statement: "Complète : vérifier un appel avec capture, lire la valeur, vérifier une absence d'appel."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "On vérifie avec verify et on tend le filet avec capture."
          - "On lit avec getValue ; zéro appel : never."
          - "verify, capture, getValue, never."
        solution: '["verify", "capture", "getValue", "never"]'
        explanation: "Vérifier, capturer, examiner, et vérifier l'absence."
        xp: 10
        payload:
          language: java
          template: |
            ArgumentCaptor<Emprunt> captor = ArgumentCaptor.forClass(Emprunt.class);
            [[1]](emprunts).save(captor.[[2]]());
            assertEquals("Dune", captor.[[3]]().titre());

            verify(emails, [[4]]()).envoyer(any());
          blanks:
            - ["verify"]
            - ["capture"]
            - ["getValue"]
            - ["never"]
      - slug: tst-ex-mockito
        kind: CODE_LIBRE
        title: "Refuser un e-mail déjà utilisé"
        difficulty: DIFFICILE
        skill: java-tests
        statement: |
          Dans `InscriptionServiceTest` (doublures `utilisateurs` et `emails`, service `service` déjà déclarés),
          écris le test `refuseUnEmailDejaUtilise()` :
          1. programme `utilisateurs.existsByEmail("awa@exemple.fr")` pour renvoyer `true` ;
          2. vérifie que `service.inscrire("awa@exemple.fr", "Awa")` lance `EmailDejaUtiliseException` ;
          3. vérifie que `utilisateurs.save(...)` n'est **jamais** appelé ;
          4. vérifie qu'**aucun** e-mail n'est envoyé.
        criteria: "when…thenReturn(true), assertThrows, verify(…, never()) sur save et sur envoyer."
        hints:
          - "`when(utilisateurs.existsByEmail(\"awa@exemple.fr\")).thenReturn(true);`"
          - "`assertThrows(EmailDejaUtiliseException.class, () -> service.inscrire(\"awa@exemple.fr\", \"Awa\"));`"
          - "`verify(utilisateurs, never()).save(any());` et `verify(emails, never()).envoyer(any());`"
        solution: |
          @Test
          void refuseUnEmailDejaUtilise() {
              when(utilisateurs.existsByEmail("awa@exemple.fr")).thenReturn(true);

              assertThrows(EmailDejaUtiliseException.class,
                      () -> service.inscrire("awa@exemple.fr", "Awa"));

              verify(utilisateurs, never()).save(any());
              verify(emails, never()).envoyer(any());
          }
        explanation: "On vérifie l'erreur, mais aussi qu'aucun effet de bord n'a eu lieu."
        xp: 30
        payload:
          language: java
          starter: |
            @Test
            void refuseUnEmailDejaUtilise() {

            }
          checks:
            - pattern: 'when\s*\(\s*utilisateurs\.existsByEmail\s*\(\s*"awa@exemple\.fr"\s*\)\s*\)\s*\.thenReturn\s*\(\s*true\s*\)'
              message: "Programme `when(utilisateurs.existsByEmail(\"awa@exemple.fr\")).thenReturn(true)`."
            - pattern: 'assertThrows\s*\(\s*EmailDejaUtiliseException\.class\s*,\s*\(\s*\)\s*->\s*service\.inscrire\s*\('
              message: "Vérifie l'exception avec `assertThrows(EmailDejaUtiliseException.class, () -> service.inscrire(…))`."
            - pattern: 'verify\s*\(\s*utilisateurs\s*,\s*never\s*\(\s*\)\s*\)\s*\.save\s*\('
              message: "Vérifie que `save` n'est jamais appelé : `verify(utilisateurs, never()).save(any())`."
            - pattern: 'verify\s*\(\s*emails\s*,\s*never\s*\(\s*\)\s*\)\s*\.envoyer\s*\('
              message: "Vérifie qu'aucun e-mail n'est envoyé : `verify(emails, never()).envoyer(any())`."
      - slug: tst-ex-captor-bug
        kind: CORRIGER_ERREUR
        title: "Un filet jamais tendu"
        difficulty: FACILE
        skill: java-tests
        statement: |
          Le captor est créé, mais jamais tendu : `verify` utilise `any()`. Remplace `any()` par
          `captor.capture()` pour attraper l'e-mail.
        criteria: "verify(emails).envoyer(captor.capture())."
        hints:
          - "Le filet doit être dans le verify."
          - "capture() tend le filet."
          - "`verify(emails).envoyer(captor.capture());`"
        solution: |
          ArgumentCaptor<Email> captor = ArgumentCaptor.forClass(Email.class);
          verify(emails).envoyer(captor.capture());
          assertEquals("Bienvenue Awa !", captor.getValue().sujet());
        explanation: "Sans capture(), getValue() n'a rien à donner."
        xp: 10
        payload:
          language: java
          starter: |
            ArgumentCaptor<Email> captor = ArgumentCaptor.forClass(Email.class);
            verify(emails).envoyer(any());
            assertEquals("Bienvenue Awa !", captor.getValue().sujet());
          checks:
            - pattern: 'envoyer\s*\(\s*any\s*\(\s*\)\s*\)'
              absent: true
              message: "any() n'attrape rien."
            - pattern: 'verify\s*\(\s*emails\s*\)\s*\.envoyer\s*\(\s*captor\.capture\s*\(\s*\)\s*\)'
              message: "Écris verify(emails).envoyer(captor.capture())."

  # ===================================================================== LEÇON 3
  - slug: tst-tdd
    title: "Le TDD : rouge, vert, refactoriser"
    duration: 11
    objective: "Appliquer le cycle rouge-vert-refactoriser pour ajouter une règle."
    prerequisites: "Leçon « Vérifier un appel et capturer son argument »."
    skills: [tests-strategie, java-tests]
    xp: 15
    memo: |
      - **TDD** (développement piloté par les tests) : écrire le test **avant** le code.
      - Cycle : **Rouge** (le test échoue) → **Vert** (le code minimal le fait passer) → **Refactoriser** (on améliore sans casser).
      - Avantages : on ne code que ce qui est utile, et chaque règle est protégée par un test.
    commonMistakes: |
      - Écrire tout le code, puis quelques tests « pour la forme ».
      - Sauter l'étape rouge : on ne sait pas si le test peut échouer.
    blocks:
      - type: text
        md: |
          Le **TDD** renverse l'ordre habituel : on écrit d'abord le test qui décrit ce qu'on veut, on le voit
          échouer, puis on écrit juste assez de code pour qu'il passe.
      - type: definition
        id: def-tdd
        term: "Rouge, vert, refactoriser"
        md: |
          Comme un **GPS** : on entre d'abord la **destination** (le test, rouge car on n'y est pas), puis on
          roule jusqu'à l'atteindre (vert), puis on cherche un **meilleur itinéraire** sans changer de
          destination (refactoriser).
      - type: steps
        id: etapes-tdd
        title: "Un tour de TDD pour « un pseudo ne peut pas être vide »"
        items:
          - "**Rouge** : `assertFalse(Pseudo.estValide(\"\"))` → ne compile pas ou échoue, la méthode n'existe pas."
          - "**Vert** : `return !pseudo.isBlank();` → le test passe."
          - "**Rouge** : `assertTrue(Pseudo.estValide(\"awa\"))` → on ajoute le cas suivant."
          - "**Vert** : il passe déjà ? Parfait, la règle est bien écrite."
          - "**Refactoriser** : donner un nom clair aux messages d'erreur, relancer les tests."
      - type: question
        ref: tst-tdd-q1
        review: etapes-tdd
      - type: question
        ref: tst-tdd-q3
        review: def-tdd
      - type: text
        md: "**Exercice 1 (guidé)** : remets un cycle TDD dans l'ordre."
      - type: exercise
        ref: tst-ex-tdd-ordre
      - type: text
        md: "**Exercice 2 (en autonomie)** : passer au vert."
      - type: exercise
        ref: tst-ex-tdd-vert
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un cycle dans le désordre."
      - type: exercise
        ref: tst-ex-tdd-bug
      - type: jury
        items:
          - q: "Pratiquez-vous le TDD ?"
            a: "Sur les règles métier, oui : j'écris le test qui décrit la règle, je le vois échouer, j'écris le code minimal, puis je refactorise avec les tests comme filet. Pour l'interface, j'écris plutôt les tests après. L'important est que chaque règle métier soit couverte par un test."
      - type: quiz
        items:
          - ref: tst-tdd-q5
            review: etapes-tdd
          - ref: tst-c2-b2
            review: def-tdd
          - ref: tst-td-q5
            review: def-tdd
    questions:
