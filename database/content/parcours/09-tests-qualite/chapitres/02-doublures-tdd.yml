    exercises:
      - slug: tst-ex-tdd-ordre
        kind: REMETTRE_ORDRE
        title: "Un cycle TDD"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Remets dans l'ordre les étapes pour ajouter la règle « un titre de livre ne peut pas être vide »."
        criteria: "Test, échec, code minimal, succès, amélioration, relance."
        hints:
          - "On commence par écrire le test."
          - "On le lance pour le voir échouer."
          - "On termine en améliorant le code et en relançant les tests."
        solution: |
          Écrire le test : un titre vide est refusé
          Lancer le test : il échoue (rouge)
          Écrire le code minimal : if (titre.isBlank()) throw …
          Relancer le test : il passe (vert)
          Donner un nom clair au message d'erreur
          Relancer tous les tests : ils restent verts
        explanation: "Rouge, vert, refactoriser, et toujours relancer."
        xp: 10
        payload:
          language: text
          lines:
            - "Écrire le test : un titre vide est refusé"
            - "Lancer le test : il échoue (rouge)"
            - "Écrire le code minimal : if (titre.isBlank()) throw …"
            - "Relancer le test : il passe (vert)"
            - "Donner un nom clair au message d'erreur"
            - "Relancer tous les tests : ils restent verts"
      - slug: tst-ex-tdd-vert
        kind: CODE_LIBRE
        title: "Passer au vert"
        difficulty: INTERMEDIAIRE
        skill: java-tests
        statement: |
          Ces tests sont rouges. Écris la classe `Pseudo` avec la méthode statique
          `boolean estValide(String pseudo)` qui les fait passer :

          ```java
          assertTrue(Pseudo.estValide("awa"));
          assertFalse(Pseudo.estValide("   "));
          assertThrows(IllegalArgumentException.class, () -> Pseudo.estValide(null));
          ```

          Un pseudo est valide s'il n'est pas vide (`isBlank()` répond `true` pour un texte vide ou fait
          seulement d'espaces). Le message de l'exception est rangé dans une constante `MESSAGE_ABSENT`.
        criteria: "Méthode statique, exception si le pseudo est null, test isBlank, constante nommée pour le message."
        hints:
          - "`private static final String MESSAGE_ABSENT = \"Pseudo absent\";`"
          - "`if (pseudo == null) throw new IllegalArgumentException(MESSAGE_ABSENT);`"
          - "`return !pseudo.isBlank();`"
        solution: |
          public class Pseudo {

              private static final String MESSAGE_ABSENT = "Pseudo absent";

              public static boolean estValide(String pseudo) {
                  if (pseudo == null) {
                      throw new IllegalArgumentException(MESSAGE_ABSENT);
                  }
                  return !pseudo.isBlank();
              }
          }
        explanation: "Le code minimal qui satisfait les trois tests, avec un nom clair à la place d'un texte écrit en dur."
        xp: 20
        payload:
          language: java
          starter: |
            public class Pseudo {

            }
          checks:
            - pattern: 'static\s+final\s+String\s+MESSAGE_ABSENT\s*=\s*"[^"]+"\s*;'
              message: "Déclare la constante `MESSAGE_ABSENT`."
            - pattern: 'public\s+static\s+boolean\s+estValide\s*\(\s*String\s+pseudo\s*\)'
              message: "Écris `public static boolean estValide(String pseudo)`."
            - pattern: 'if\s*\(\s*pseudo\s*==\s*null\s*\)\s*\{?\s*throw\s+new\s+IllegalArgumentException\s*\(\s*MESSAGE_ABSENT\s*\)'
              message: "Lance une `IllegalArgumentException(MESSAGE_ABSENT)` si le pseudo est null."
            - pattern: 'return\s*!\s*pseudo\.isBlank\s*\(\s*\)|return\s+pseudo\.isBlank\s*\(\s*\)\s*==\s*false'
              message: "Renvoie `!pseudo.isBlank()` : valide s'il n'est pas vide."
      - slug: tst-ex-tdd-bug
        kind: CORRIGER_ERREUR
        title: "Un cycle dans le désordre"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Ce cycle commence par le code et oublie de voir le test échouer. Réécris-le dans l'ordre :
          `Rouge`, `Vert`, `Refactoriser`, une étape par ligne.
        criteria: "Les trois lignes dans l'ordre Rouge, Vert, Refactoriser."
        hints:
          - "Le test vient en premier, et il échoue."
          - "Puis le code minimal, puis l'amélioration."
          - "Rouge, Vert, Refactoriser."
        solution: |
          Rouge : écrire le test et le voir échouer
          Vert : écrire le code minimal qui le fait passer
          Refactoriser : améliorer le code, les tests restent verts
        explanation: "Le test d'abord."
        xp: 10
        payload:
          language: text
          starter: |
            Vert : écrire le code minimal qui le fait passer
            Refactoriser : améliorer le code, les tests restent verts
            Rouge : écrire le test et le voir échouer
          checks:
            - pattern: '(?i)\A\s*Rouge\b[^\n]*\n\s*Vert\b[^\n]*\n\s*Refactoriser\b'
              message: "L'ordre : Rouge, Vert, Refactoriser."

  # ===================================================================== LEÇON 4
  - slug: tst-couverture
    title: "La couverture de code"
    duration: 10
    objective: "Lire un rapport de couverture et comprendre qu'une ligne couverte n'est pas forcément vérifiée."
    prerequisites: "Leçon « Le TDD : rouge, vert, refactoriser »."
    skills: [tests-strategie, java-tests]
    xp: 15
    memo: |
      - **Couverture** : la part des lignes exécutées par les tests (JaCoCo en Java).
      - Le rapport montre en **rouge** les lignes jamais exécutées : ce sont elles qu'il faut regarder.
      - 100 % de couverture ne garantit **pas** l'absence de bug : un test sans bonne assertion « couvre » sans vérifier.
      - On couvre d'abord les **règles métier**, pas les getters.
    commonMistakes: |
      - Viser un chiffre en testant des getters au lieu des règles métier.
      - Des tests qui exécutent le code sans rien vérifier.
    blocks:
      - type: definition
        id: def-couverture
        term: "Couverture de code"
        md: |
          Le **plan des routes** qu'un livreur a parcourues. Avoir parcouru une route ne veut pas dire qu'il a
          regardé si les maisons étaient en bon état. De même, une ligne exécutée par un test n'est pas
          forcément **vérifiée**.
      - type: compare
        left:
          title: "Couvre sans vérifier"
          code: |
            @Test
            void emprunter() {
                service.emprunter(1L, 7L);
            }
          language: java
        right:
          title: "Couvre et vérifie"
          code: |
            @Test
            void emprunter() {
                service.emprunter(1L, 7L);
                verify(emprunts).save(any());
            }
          language: java
      - type: question
        ref: tst-tdd-q2
        review: def-couverture
      - type: question
        ref: tst-tdd-q4
        review: def-couverture
      - type: text
        md: "**Exercice 1 (guidé)** : lire le rapport."
      - type: exercise
        ref: tst-ex-couverture-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : où ajouter des tests ?"
      - type: exercise
        ref: tst-ex-couverture-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un test qui couvre sans vérifier."
