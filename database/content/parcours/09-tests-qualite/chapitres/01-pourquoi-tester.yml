              message: "L'obtenu n'est pas le premier argument."
            - pattern: 'assertEquals\s*\(\s*"AWA"\s*,\s*resultat\s*\)'
              message: "Écris assertEquals(\"AWA\", resultat)."

  # ===================================================================== LEÇON 4
  - slug: tst-assertthrows
    title: "Tester une erreur : assertThrows"
    duration: 9
    objective: "Vérifier qu'une méthode refuse une situation interdite en lançant la bonne exception."
    prerequisites: "Leçon « Mon premier test JUnit 5 »."
    skills: [java-tests]
    xp: 15
    memo: |
      - `assertThrows(MonException.class, () -> objet.methode(...))` : le test réussit **seulement si** l'exception est lancée.
      - La flèche `() -> …` enveloppe l'appel : JUnit l'exécute et observe.
      - Tester les erreurs est aussi important que tester les réussites.
    commonMistakes: |
      - Un `try { … } catch { }` qui ne vérifie rien.
      - Appeler la méthode sans flèche : l'exception casse le test au lieu d'être vérifiée.
    blocks:
      - type: definition
        id: def-assertthrows
        term: "assertThrows"
        md: |
          Un **crash-test** : on lance volontairement la voiture contre le mur pour vérifier que l'airbag se
          déclenche. Ici, on donne une valeur interdite et on vérifie que la bonne alarme (l'exception) sonne.
      - type: code
        id: code-assertthrows
        language: java
        title: "Refuser un invité en double"
        code: |
          @Test
          void refuseUnInviteEnDouble() {
              ListeInvites liste = new ListeInvites();
              liste.ajouter("Awa");
              assertThrows(InviteDejaPresentException.class, () -> liste.ajouter("Awa"));
          }
        lines:
          - n: 4
            note: "On prépare la situation : Awa est déjà invitée…"
          - n: 5
            note: "… et on vérifie que l'ajouter une deuxième fois lance bien l'exception."
      - type: question
        ref: tst-at-q1
        review: code-assertthrows
      - type: question
        ref: tst-at-q2
        review: def-assertthrows
      - type: text
        md: "**Exercice 1 (guidé)** : complète la vérification."
      - type: exercise
        ref: tst-ex-assertthrows-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : un texte vide refusé."
      - type: exercise
        ref: tst-ex-assertthrows-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un try/catch qui ne vérifie rien."
      - type: exercise
        ref: tst-ex-assertthrows-bug
      - type: quiz
        items:
          - ref: tst-at-q3
            review: code-assertthrows
          - ref: tst-at-q4
            review: def-assertthrows
          - ref: tst-at-q5
            review: code-assertthrows
    questions:
      - code: tst-at-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Quand un test avec `assertThrows` réussit-il ?"
        choices:
          - label: "Quand l'exception attendue est lancée"
            correct: true
            why: "C'est ce qu'on vérifie."
          - label: "Quand aucune exception n'est lancée"
            correct: false
            why: "Il échouerait."
          - label: "Toujours"
            correct: false
            why: "Il vérifie vraiment."
        explanation: "L'alarme doit sonner."
      - code: tst-at-q2
        kind: VRAI_FAUX
        difficulty: 1
        skill: java-tests
        prompt: "Tester les cas d'erreur est aussi important que tester les réussites."
        choices:
          - label: "Vrai"
            correct: true
            why: "Les règles métier refusent des situations."
          - label: "Faux"
            correct: false
            why: "Un refus cassé est un bug grave."
        explanation: "Chemin heureux + erreurs."
      - code: tst-at-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "Pourquoi écrire `() -> liste.ajouter(\"Awa\")` et pas simplement `liste.ajouter(\"Awa\")` ?"
        choices:
          - label: "La flèche confie l'appel à JUnit, qui peut observer l'exception"
            correct: true
            why: "Sinon, l'exception casserait le test avant la vérification."
          - label: "C'est plus court"
            correct: false
            why: "C'est même plus long."
          - label: "Aucune différence"
            correct: false
            why: "Sans flèche, rien n'est vérifié."
        explanation: "JUnit exécute et observe."
      - code: tst-at-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
        prompt: "Quel est le premier argument de `assertThrows` ?"
        choices:
          - label: "La classe de l'exception attendue (`MonException.class`)"
            correct: true
            why: "On dit quelle alarme doit sonner."
          - label: "Le message d'erreur"
            correct: false
            why: "C'est la classe."
          - label: "Le résultat attendu"
            correct: false
            why: "Il n'y a pas de résultat : une exception."
        explanation: "assertThrows(Classe.class, () -> appel)."
      - code: tst-at-q5
        kind: RESULTAT_CODE
        difficulty: 2
