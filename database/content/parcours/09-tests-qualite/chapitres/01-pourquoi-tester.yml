  # ===================================================================== LEÇON 5
  - slug: tst-beforeeach
    title: "Repartir de zéro : @BeforeEach"
    duration: 9
    objective: "Préparer un état propre avant chaque test pour garder des tests indépendants."
    prerequisites: "Leçon « Tester une erreur : assertThrows »."
    skills: [java-tests]
    xp: 15
    memo: |
      - `@BeforeEach` : une méthode exécutée **avant chaque** test.
      - On y crée les objets communs : chaque test part d'une situation neuve.
      - Des tests **indépendants** donnent le même résultat, quel que soit leur ordre.
    commonMistakes: |
      - Un test qui dépend du résultat d'un autre test.
      - Partager un objet modifié entre tests sans le recréer.
    blocks:
      - type: definition
        id: def-beforeeach
        term: "@BeforeEach"
        md: |
          **Remettre la table à zéro** entre deux parties de jeu de société : chaque partie commence avec le même
          plateau, peu importe comment la précédente s'est terminée.
      - type: code
        id: code-beforeeach
        language: java
        title: "Une liste neuve avant chaque test"
        code: |
          class ListeInvitesTest {

              private ListeInvites liste;

              @BeforeEach
              void preparer() {
                  liste = new ListeInvites();
              }

              @Test
              void ajouteUnInvite() {
                  liste.ajouter("Awa");
                  assertTrue(liste.contient("Awa"));
              }

              @Test
              void commenceVide() {
                  assertFalse(liste.contient("Awa"));
              }
          }
        lines:
          - n: 5
            note: "`@BeforeEach` : une liste neuve et vide avant **chaque** test."
          - n: 18
            note: "Même si l'autre test a ajouté Awa, celui-ci repart d'une liste vide."
      - type: question
        ref: tst-ju-q3
        review: code-beforeeach
      - type: question
        ref: tst-c1-b2
        review: def-beforeeach
      - type: text
        md: "**Exercice 1 (guidé)** : complète la préparation."
      - type: exercise
        ref: tst-ex-beforeeach-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une bibliothèque neuve."
      - type: exercise
        ref: tst-ex-beforeeach-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : des tests qui se gênent."
      - type: exercise
        ref: tst-ex-beforeeach-bug
      - type: quiz
        items:
          - ref: tst-be-q3
            review: code-beforeeach
          - ref: tst-be-q4
            review: def-beforeeach
          - ref: tst-be-q5
            review: code-beforeeach
    questions:
      - code: tst-ju-q3
        kind: VRAI_FAUX
        difficulty: 2
        skill: java-tests
        prompt: "Grâce à `@BeforeEach`, chaque test part d'une liste d'invités neuve et vide."
        choices:
          - label: "Vrai"
            correct: true
            why: "La méthode s'exécute avant chaque test."
          - label: "Faux"
