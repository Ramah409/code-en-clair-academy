        solution: |
          class ListeInvitesTest {
              private ListeInvites liste;

              @BeforeEach
              void preparer() {
                  liste = new ListeInvites();
              }
          }
        explanation: "Chaque test repart de zéro."
        xp: 10
        payload:
          language: java
          starter: |
            class ListeInvitesTest {
                private ListeInvites liste = new ListeInvites();
            }
          checks:
            - pattern: '@BeforeEach\s+(?:public\s+)?void\s+\w+\s*\(\s*\)\s*\{\s*liste\s*=\s*new\s+ListeInvites\s*\(\s*\)\s*;'
              message: "Recrée la liste dans une méthode @BeforeEach."

  # ===================================================================== LEÇON 6
  - slug: tst-parametres
    title: "Plusieurs valeurs, un seul test : @ParameterizedTest"
    duration: 10
    objective: "Tester une même règle avec plusieurs jeux de valeurs, dont les valeurs limites."
    prerequisites: "Leçon « Repartir de zéro : @BeforeEach »."
    skills: [java-tests, tests-strategie]
    xp: 15
    memo: |
      - `@ParameterizedTest` + `@CsvSource` : le même test avec plusieurs lignes de données.
      - Les colonnes deviennent les paramètres de la méthode.
      - **Valeurs limites** : les cas à la frontière (texte vide, seulement des espaces, une seule lettre).
    commonMistakes: |
      - Copier-coller le même test pour chaque valeur.
      - Oublier les valeurs limites.
    blocks:
      - type: definition
        id: def-parametre
        term: "Test paramétré"
        md: |
          Un **moule à gâteaux** : une seule recette de test, remplie avec plusieurs jeux de valeurs. Pratique
          pour tester les **valeurs limites**, là où se cachent souvent les bugs.
      - type: code
        id: code-parametre
        language: java
        title: "Tester plusieurs pseudos"
        code: |
          @ParameterizedTest
          @CsvSource({
              "awa, true",
              "'', false",
              "'   ', false",
              "a, true"
          })
          void pseudoValide(String pseudo, boolean attendu) {
              assertEquals(attendu, Pseudo.estValide(pseudo));
          }
        lines:
          - n: 1
            note: "Un test lancé une fois par ligne de données."
          - n: 4
            note: "Les valeurs limites : un texte vide, des espaces seulement."
          - n: 8
            note: "Les colonnes deviennent les paramètres de la méthode."
      - type: question
        ref: tst-ju-q2
        review: def-parametre
      - type: question
        ref: tst-ju-q5
        review: code-parametre
      - type: text
        md: "**Exercice 1 (guidé)** : complète le test paramétré."
      - type: exercise
        ref: tst-ex-parametre-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : tester des e-mails."
      - type: exercise
        ref: tst-ex-parametre-libre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une annotation manquante."
      - type: exercise
        ref: tst-ex-parametre-bug
      - type: jury
        items:
          - q: "Que sont les valeurs limites ?"
            a: "Les valeurs à la frontière d'une règle : un texte vide ou fait d'espaces pour un champ obligatoire, la valeur juste avant et juste après un seuil. C'est là que se cachent la plupart des bugs. Je les teste avec des tests paramétrés."
      - type: quiz
        items:
          - ref: tst-pa-q3
            review: code-parametre
          - ref: tst-pa-q4
            review: def-parametre
          - ref: tst-pa-q5
            review: code-parametre
    questions:
      - code: tst-ju-q2
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: java-tests
        prompt: "Pour un champ « pseudo obligatoire », quelles valeurs tester en priorité ?"
        choices:
          - label: "Un texte vide, des espaces seulement, une seule lettre"
            correct: true
            why: "Les valeurs à la frontière de la règle."
          - label: "Seulement « awa »"
            correct: false
            why: "On raterait les cas limites."
          - label: "Des pseudos très longs uniquement"
            correct: false
            why: "Utile parfois, mais pas en priorité."
        explanation: "Les bugs aiment les frontières."
      - code: tst-ju-q5
        kind: TEXTE
        difficulty: 2
        skill: java-tests
        prompt: "Quelle annotation fournit des jeux de données en lignes de texte séparées par des virgules ? (sans @)"
        answers: ["CsvSource", "@CsvSource"]
        explanation: "Avec `@ParameterizedTest`. Il existe aussi `@ValueSource` et `@MethodSource`."
