      - slug: tst-ex-beforeeach-bug
        kind: CORRIGER_ERREUR
        title: "Des tests qui se gênent"
        difficulty: FACILE
        skill: java-tests
        statement: |
          La liste est créée une seule fois dans la déclaration du champ… puis modifiée par chaque test : les
          résultats dépendent de l'ordre. Recrée-la dans une méthode `@BeforeEach`.
        criteria: "@BeforeEach qui recrée la liste."
