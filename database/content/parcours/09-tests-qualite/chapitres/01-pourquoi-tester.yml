slug: tst-pourquoi-tester
position: 1
level: DEBUTANT
title: "Pourquoi et comment tester"
summary: "Les familles de tests et la pyramide, le modèle préparer-agir-vérifier, puis les premiers tests JUnit 5 : vérifier une valeur, vérifier une erreur, repartir de zéro et tester plusieurs valeurs. Une seule notion par leçon."
quizQuestionCount: 16

lessons:
  # ===================================================================== LEÇON 1
  - slug: tst-familles
    title: "Les familles de tests et la pyramide"
    duration: 10
    objective: "Distinguer tests unitaires, d'intégration, de bout en bout et de recette, et expliquer la pyramide des tests."
    prerequisites: "Parcours « Java et la programmation objet »."
    skills: [tests-strategie]
    xp: 15
    memo: |
      - **Unitaire** : une seule classe ou fonction, isolée. Très rapide.
      - **Intégration** : plusieurs morceaux ensemble (service + base de données). Plus lent.
      - **Bout en bout** (E2E) : un vrai navigateur clique dans l'application complète. Lent et fragile.
      - **Recette** (acceptation) : vérifier avec le client que le besoin est couvert.
      - **Pyramide** : beaucoup d'unitaires en bas, quelques intégrations, très peu de bout en bout en haut.
    commonMistakes: |
      - Tout tester à la main avant chaque livraison.
      - N'écrire que des tests de bout en bout : lents, fragiles, difficiles à déboguer.
    blocks:
      - type: text
        md: |
          Tester à la main, c'est long, et on oublie toujours quelque chose. Un **test automatique** est un petit
          programme qui vérifie un autre programme. On le relance autant de fois qu'on veut, gratuitement.
      - type: definition
        id: def-pyramide
        term: "La pyramide des tests"
        md: |
          Pense à la **construction d'une voiture** : on teste chaque **pièce** (unitaire, très souvent, vite),
          puis le **moteur assemblé** (intégration), et enfin on fait **un tour de piste** avec la voiture complète
          (bout en bout). On ne teste pas chaque vis en faisant un tour de piste !
      - type: code
        id: code-pyramide
        language: text
        title: "La pyramide"
        code: |2
                   /\        Bout en bout : très peu (Playwright, Cypress)
                  /  \
                 /----\      Intégration : quelques-uns (@SpringBootTest, Testcontainers)
                /      \
               /--------\    Unitaires : beaucoup (JUnit, Mockito, Vitest)
        lines:
          - n: 1
            note: "En haut : lents et coûteux, mais proches de l'utilisatrice."
          - n: 3
            note: "Au milieu : vérifient que les morceaux s'assemblent bien."
          - n: 5
            note: "En bas : rapides, nombreux, précis quand ils échouent."
      - type: question
        ref: tst-fam-q1
        review: def-pyramide
      - type: question
        ref: tst-fam-q3
        review: code-pyramide
      - type: text
        md: "**Exercice 1 (guidé)** : classe chaque test dans sa famille."
      - type: exercise
        ref: tst-ex-familles-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : une stratégie de tests."
      - type: exercise
        ref: tst-ex-strategie
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : une pyramide à l'envers."
      - type: exercise
        ref: tst-ex-pyramide-bug
      - type: jury
        items:
          - q: "Quelle est votre stratégie de tests ?"
            a: "Je suis la pyramide des tests : des tests unitaires nombreux sur la logique métier (JUnit 5, Mockito côté Spring, tests de services côté Angular), des tests d'intégration sur les contrôleurs et la base (MockMvc, Testcontainers), et quelques scénarios de bout en bout sur les parcours critiques comme l'inscription. Les tests tournent à chaque push dans GitHub Actions."
      - type: quiz
        items:
          - ref: tst-fam-q4
            review: def-pyramide
          - ref: tst-fa-q4
            review: def-pyramide
          - ref: tst-fa-q5
            review: code-pyramide
    questions:
      - code: tst-fam-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Quels tests doivent être les plus nombreux ?"
        choices:
          - label: "Les tests unitaires"
            correct: true
            why: "Rapides et précis."
          - label: "Les tests de bout en bout"
            correct: false
            why: "Lents et fragiles : on en garde peu."
          - label: "Les tests manuels"
            correct: false
            why: "Ils ne sont pas automatisés."
        explanation: "La base de la pyramide est la plus large."
      - code: tst-fam-q3
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Un robot ouvre Chrome, s'inscrit, se connecte et emprunte un livre. Quel type de test ?"
        choices:
          - label: "Bout en bout (E2E)"
            correct: true
            why: "Toute l'application, comme une vraie utilisatrice."
          - label: "Unitaire"
            correct: false
            why: "Un unitaire teste une seule classe."
          - label: "Intégration"
            correct: false
            why: "L'intégration teste quelques morceaux, sans navigateur."
        explanation: "Playwright ou Cypress."
      - code: tst-fam-q4
        kind: VRAI_FAUX
        difficulty: 2
        skill: tests-strategie
        prompt: "Quand un test unitaire échoue, on sait généralement très vite où se trouve le problème."
        choices:
          - label: "Vrai"
            correct: true
            why: "Il ne teste qu'un petit morceau."
          - label: "Faux"
            correct: false
            why: "C'est justement son avantage sur un test de bout en bout."
        explanation: "Petite portée = diagnostic rapide."
      - code: tst-fa-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Qui valide un test de recette ?"
        choices:
          - label: "Le client, qui vérifie que son besoin est couvert"
            correct: true
            why: "C'est un test d'acceptation."
          - label: "Le compilateur Java"
            correct: false
            why: "Il vérifie la syntaxe."
          - label: "Personne"
            correct: false
            why: "La recette engage le client."
        explanation: "Recette = accord sur le besoin."
      - code: tst-fa-q5
        kind: CHOIX_UNIQUE
        difficulty: 2
        skill: tests-strategie
        prompt: "Pourquoi garder peu de tests de bout en bout ?"
        choices:
          - label: "Ils sont lents et cassent souvent pour des raisons extérieures"
            correct: true
            why: "Réseau, navigateur, données…"
          - label: "Ils ne servent à rien"
            correct: false
            why: "Ils vérifient les parcours critiques."
          - label: "Ils sont interdits en production"
            correct: false
            why: "Aucun rapport."
        explanation: "Quelques-uns, sur les parcours importants."
    exercises:
      - slug: tst-ex-familles-guide
        kind: COMPLETER
        title: "Classer les tests"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Complète avec : unitaire, intégration, bout, recette."
        criteria: "Les quatre trous sont corrects."
        hints:
          - "Une seule méthode isolée : unitaire."
          - "Le client valide le besoin : recette."
          - "unitaire, intégration, bout, recette."
        solution: '["unitaire", "intégration", "bout", "recette"]'
        explanation: "Quatre familles, quatre portées différentes."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            Tester inscrire() avec un faux repository           : test [[1]]
            Tester le repository sur un vrai PostgreSQL          : test d'[[2]]
            Un robot clique dans le site complet                 : test de [[3]] en bout
            La cliente vérifie que le besoin est couvert          : test de [[4]]
          blanks:
            - ["unitaire"]
            - ["intégration", "integration"]
            - ["bout"]
            - ["recette", "validation", "acceptation"]
      - slug: tst-ex-strategie
        kind: CODE_LIBRE
        title: "Une stratégie de tests"
        difficulty: INTERMEDIAIRE
        skill: tests-strategie
        statement: |
          Décris en trois lignes la stratégie de tests d'une application de réservation Angular + Spring Boot.
          Commence les lignes par `Unitaires :`, `Intégration :` et `Bout en bout :`, et cite **au moins un
          outil** par ligne (JUnit, Mockito, Jasmine, Vitest, MockMvc, Testcontainers, Playwright, Cypress…).
        criteria: "Trois lignes, chacune avec un outil adapté à sa famille."
        hints:
          - "Unitaires : les services Java avec JUnit 5 et Mockito."
          - "Intégration : les contrôleurs avec MockMvc, la base avec Testcontainers."
          - "Bout en bout : le parcours de réservation avec Playwright."
        solution: |
          Unitaires : les règles de réservation dans les services, avec JUnit 5 et Mockito, et les services Angular avec Vitest.
          Intégration : les contrôleurs avec MockMvc et les repositories sur PostgreSQL avec Testcontainers.
          Bout en bout : le parcours inscription puis réservation dans un vrai navigateur avec Playwright.
        explanation: "Chaque étage de la pyramide a ses outils et sa cible."
        xp: 20
        payload:
          language: text
          starter: |
            Unitaires :
            Intégration :
            Bout en bout :
          checks:
            - pattern: '(?im)^\s*Unitaires?\s*:[^\n]*\b(?:JUnit|Mockito|Jasmine|Vitest|Jest|Karma)\b'
              message: "Cite un outil de tests unitaires (JUnit, Mockito, Vitest…) sur la ligne « Unitaires : »."
            - pattern: '(?im)^\s*Int[ée]gration\s*:[^\n]*\b(?:MockMvc|Testcontainers|SpringBootTest|WebMvcTest|HttpTestingController)\b'
              message: "Cite un outil d'intégration (MockMvc, Testcontainers…) sur la ligne « Intégration : »."
            - pattern: '(?im)^\s*Bout\s+en\s+bout\s*:[^\n]*\b(?:Playwright|Cypress|Selenium)\b'
              message: "Cite un outil de bout en bout (Playwright, Cypress…) sur la ligne « Bout en bout : »."
      - slug: tst-ex-pyramide-bug
        kind: CORRIGER_ERREUR
        title: "Une pyramide à l'envers"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Cette équipe a écrit « beaucoup » de tests de bout en bout et « peu » de tests unitaires. Remets les
          bons mots : beaucoup d'unitaires, peu de bout en bout.
        criteria: "Unitaires : beaucoup ; Bout en bout : peu."
        hints:
          - "Quels tests sont rapides et précis ?"
          - "Les unitaires : il en faut beaucoup."
          - "Unitaires : beaucoup ; Bout en bout : peu."
        solution: |
          Unitaires : beaucoup
          Intégration : quelques-uns
          Bout en bout : peu
        explanation: "La base de la pyramide est la plus large."
        xp: 10
        payload:
          language: text
          starter: |
            Unitaires : peu
            Intégration : quelques-uns
            Bout en bout : beaucoup
          checks:
            - pattern: '(?mi)^\s*Unitaires\s*:\s*beaucoup\s*$'
              message: "Il faut beaucoup de tests unitaires."
            - pattern: '(?mi)^\s*Bout en bout\s*:\s*peu\s*$'
              message: "Il faut peu de tests de bout en bout."

  # ===================================================================== LEÇON 2
  - slug: tst-aaa
    title: "Préparer, agir, vérifier"
    duration: 9
    objective: "Écrire un test en trois temps : préparer la situation, appeler la méthode, vérifier le résultat."
    prerequisites: "Leçon « Les familles de tests et la pyramide »."
    skills: [tests-strategie]
    xp: 15
    memo: |
      - **Préparer** (Arrange) : créer les objets et la situation de départ.
      - **Agir** (Act) : appeler **une** méthode testée.
      - **Vérifier** (Assert) : comparer le résultat à ce qu'on attend.
      - On teste le **chemin heureux**, les **erreurs** et les **valeurs limites**.
    commonMistakes: |
      - Mélanger plusieurs actions dans un seul test.
      - Tester seulement le « chemin heureux », jamais les erreurs.
    blocks:
      - type: definition
        id: def-aaa
        term: "Préparer, agir, vérifier (AAA)"
        md: |
          Chaque test raconte une petite histoire en trois temps, comme une **recette** : on sort les ingrédients
          (**préparer**), on fait cuire (**agir**), on goûte (**vérifier**). En anglais : Arrange, Act, Assert.
      - type: code
        id: code-aaa
        language: java
        title: "Un test en trois temps"
        code: |
          @Test
          void saluerAvecLePrenom() {
              Accueil accueil = new Accueil();

              String message = accueil.saluer("Awa");

              assertEquals("Bonjour Awa", message);
          }
        lines:
          - n: 3
            note: "**Préparer** : on crée l'objet à tester."
          - n: 5
            note: "**Agir** : on appelle la méthode."
          - n: 7
            note: "**Vérifier** : le message est bien celui attendu."
      - type: question
        ref: tst-fam-q2
        review: code-aaa
      - type: question
        ref: tst-fam-q5
        review: def-aaa
      - type: text
        md: "**Exercice 1 (guidé)** : nomme les trois temps."
      - type: exercise
        ref: tst-ex-aaa-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : remettre un test dans l'ordre."
      - type: exercise
        ref: tst-ex-aaa-ordre
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : les temps dans le désordre."
      - type: exercise
        ref: tst-ex-aaa-bug
      - type: jury
        items:
          - q: "Qu'est-ce qu'un test de régression ?"
            a: "Un test qui vérifie qu'une fonctionnalité qui marchait fonctionne toujours après une modification. En pratique, toute la suite de tests automatiques joue ce rôle. Quand je corrige un bug, j'ajoute d'abord un test qui le reproduit."
      - type: quiz
        items:
          - ref: tst-c1-b1
            review: def-aaa
          - ref: tst-aa-q4
            review: code-aaa
          - ref: tst-aa-q5
            review: def-aaa
    questions:
      - code: tst-fam-q2
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Dans un test, `assertEquals(\"Bonjour Awa\", message)` correspond à quelle étape ?"
        choices:
          - label: "Vérifier"
            correct: true
            why: "On compare le résultat à l'attendu."
          - label: "Préparer"
            correct: false
            why: "Préparer, c'est créer les objets."
          - label: "Agir"
            correct: false
            why: "Agir, c'est appeler la méthode testée."
        explanation: "Arrange, Act, Assert."
      - code: tst-fam-q5
        kind: CHOIX_MULTIPLE
        difficulty: 2
        skill: tests-strategie
        prompt: "Quels cas faut-il tester pour une méthode d'inscription ? (plusieurs réponses)"
        choices:
          - label: "Une inscription normale"
            correct: true
            why: "Le chemin heureux."
          - label: "Un e-mail déjà utilisé"
            correct: true
            why: "Cas d'erreur métier."
          - label: "Un e-mail vide ou sans @"
            correct: true
            why: "Valeur limite invalide."
          - label: "La couleur du bouton « S'inscrire »"
            correct: false
            why: "Ce n'est pas la logique de la méthode."
        explanation: "Chemin heureux, erreurs et valeurs limites."
      - code: tst-c1-b1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Tu corriges un bug signalé par une utilisatrice. Quelle est la bonne pratique ?"
        choices:
          - label: "Écrire d'abord un test qui reproduit le bug, puis le corriger"
            correct: true
            why: "Le bug ne pourra plus revenir sans qu'on le voie."
          - label: "Corriger vite et ne rien ajouter"
            correct: false
            why: "Le bug pourrait revenir plus tard."
          - label: "Supprimer les tests qui échouent"
            correct: false
            why: "On perd la protection."
        explanation: "Un bug corrigé = un test de plus."
      - code: tst-aa-q4
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: tests-strategie
        prompt: "Dans l'exemple, quelle ligne correspond à « agir » ?"
        choices:
          - label: "`String message = accueil.saluer(\"Awa\");`"
            correct: true
            why: "On appelle la méthode testée."
          - label: "`Accueil accueil = new Accueil();`"
            correct: false
            why: "C'est préparer."
          - label: "`assertEquals(\"Bonjour Awa\", message);`"
            correct: false
            why: "C'est vérifier."
        explanation: "Agir = appeler la méthode."
      - code: tst-aa-q5
        kind: VRAI_FAUX
        difficulty: 1
        skill: tests-strategie
        prompt: "Un bon test n'agit qu'une seule fois : il teste une seule chose."
        choices:
          - label: "Vrai"
            correct: true
            why: "En cas d'échec, on sait tout de suite quoi regarder."
          - label: "Faux"
            correct: false
            why: "Un test = un comportement."
        explanation: "Une histoire courte, une seule action."
    exercises:
      - slug: tst-ex-aaa-guide
        kind: COMPLETER
        title: "Nommer les trois temps"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Complète les commentaires avec : préparer, agir, vérifier."
        criteria: "Les trois trous sont corrects."
        hints:
          - "On crée d'abord la liste : préparer."
          - "On appelle ajouter : agir ; on compare : vérifier."
          - "préparer, agir, vérifier."
        solution: '["préparer", "agir", "vérifier"]'
        explanation: "Arrange, Act, Assert."
        xp: 10
        payload:
          language: text
          caseSensitive: false
          template: |
            ListeInvites liste = new ListeInvites();     → [[1]]
            liste.ajouter("Awa");                         → [[2]]
            assertTrue(liste.contient("Awa"));            → [[3]]
          blanks:
            - ["préparer", "preparer"]
            - ["agir"]
            - ["vérifier", "verifier"]
      - slug: tst-ex-aaa-ordre
        kind: REMETTRE_ORDRE
        title: "Remettre un test dans l'ordre"
        difficulty: FACILE
        skill: tests-strategie
        statement: "Remets les lignes de ce test dans l'ordre préparer, agir, vérifier."
        criteria: "Annotation, signature, préparer, agir, vérifier, accolade."
        hints:
          - "L'annotation et la signature d'abord."
          - "On crée l'objet avant d'appeler la méthode."
          - "La vérification vient en dernier."
        solution: |
          @Test
          void mettreEnMajuscules() {
              Formateur f = new Formateur();
              String resultat = f.majuscules("awa");
              assertEquals("AWA", resultat);
          }
        explanation: "Préparer, agir, vérifier."
        xp: 10
        payload:
          language: java
          lines:
            - "@Test"
            - "void mettreEnMajuscules() {"
            - "    Formateur f = new Formateur();"
            - "    String resultat = f.majuscules(\"awa\");"
            - "    assertEquals(\"AWA\", resultat);"
            - "}"
      - slug: tst-ex-aaa-bug
        kind: CORRIGER_ERREUR
        title: "Les temps dans le désordre"
        difficulty: FACILE
        skill: tests-strategie
        statement: |
          Ce test vérifie avant d'agir : `message` n'existe pas encore. Remets les lignes dans l'ordre : préparer,
          agir, vérifier.
        criteria: "La vérification vient après l'appel de saluer."
        hints:
          - "On ne peut pas vérifier un résultat pas encore calculé."
          - "L'appel à saluer vient avant assertEquals."
          - "Préparer, agir, vérifier."
        solution: |
          @Test
          void saluerAvecLePrenom() {
              Accueil accueil = new Accueil();
              String message = accueil.saluer("Awa");
              assertEquals("Bonjour Awa", message);
          }
        explanation: "L'histoire se raconte dans l'ordre."
        xp: 10
        payload:
          language: java
          starter: |
            @Test
            void saluerAvecLePrenom() {
                Accueil accueil = new Accueil();
                assertEquals("Bonjour Awa", message);
                String message = accueil.saluer("Awa");
            }
          checks:
            - pattern: 'new\s+Accueil\s*\(\s*\)[\s\S]*accueil\.saluer\s*\(\s*"Awa"\s*\)[\s\S]*assertEquals\s*\(\s*"Bonjour Awa"\s*,\s*message\s*\)'
              message: "Remets l'ordre : new Accueil(), puis saluer, puis assertEquals."

  # ===================================================================== LEÇON 3
  - slug: tst-junit
    title: "Mon premier test JUnit 5"
    duration: 10
    objective: "Écrire un test JUnit 5 avec @Test et les assertions assertEquals, assertTrue et assertFalse."
    prerequisites: "Leçon « Préparer, agir, vérifier »."
    skills: [java-tests]
    xp: 15
    memo: |
      - `@Test` : cette méthode est un test. Nom lisible : `ajouteUnInvite()`.
      - `assertEquals(attendu, obtenu)` : **l'attendu d'abord**.
      - `assertTrue(condition)`, `assertFalse(condition)`.
      - Un test **sans assertion** passe toujours : il ne vérifie rien.
    commonMistakes: |
      - Inverser attendu et obtenu dans `assertEquals` : le message d'échec devient trompeur.
      - Un test sans aucune assertion.
    blocks:
      - type: text
        md: |
          **JUnit 5** est l'outil standard pour tester du Java. Un test est une méthode ordinaire, marquée
          `@Test`, qui appelle ton code et vérifie le résultat.
      - type: definition
        id: def-assertion
        term: "Assertion"
        md: |
          Une **affirmation** que le test vérifie : « le message vaut Bonjour Awa », « Awa est dans la liste ».
          Si elle est fausse, le test échoue et le rapport dit ce qui était attendu.
      - type: code
        id: code-junit
        language: java
        title: "ListeInvitesTest.java"
        code: |
          class ListeInvitesTest {

              @Test
              void ajouteUnInvite() {
                  ListeInvites liste = new ListeInvites();
                  liste.ajouter("Awa");
                  assertTrue(liste.contient("Awa"));
              }

              @Test
              void garderLePremierInvite() {
                  ListeInvites liste = new ListeInvites();
                  liste.ajouter("Awa");
                  assertEquals("Awa", liste.premier());
              }
          }
        lines:
          - n: 3
            note: "`@Test` : JUnit exécutera cette méthode."
          - n: 4
            note: "Le nom dit ce qu'on vérifie, comme une phrase."
          - n: 7
            note: "`assertTrue(...)` : on vérifie qu'Awa est bien dans la liste."
          - n: 14
            note: "`assertEquals(attendu, obtenu)` : l'attendu d'abord."
      - type: question
        ref: tst-ju-q1
        review: code-junit
      - type: question
        ref: tst-ju-q4
        review: def-assertion
      - type: text
        md: "**Exercice 1 (guidé)** : complète le test."
      - type: exercise
        ref: tst-ex-junit-guide
      - type: text
        md: "**Exercice 2 (en autonomie)** : tester des initiales."
      - type: exercise
        ref: tst-ex-junit
      - type: text
        md: "**Exercice 3 (trouver l'erreur)** : un attendu à l'envers."
      - type: exercise
        ref: tst-ex-junit-bug
      - type: jury
        items:
          - q: "Comment nommez-vous vos tests ?"
            a: "Par une phrase qui décrit le comportement attendu, par exemple refuseUnInviteEnDouble, éventuellement avec @DisplayName. En cas d'échec, le rapport dit tout de suite quelle règle est cassée."
      - type: quiz
        items:
          - ref: tst-jt-q3
            review: code-junit
          - ref: tst-jt-q4
            review: def-assertion
          - ref: tst-jt-q5
            review: code-junit
    questions:
      - code: tst-ju-q1
        kind: CHOIX_UNIQUE
        difficulty: 1
        skill: java-tests
