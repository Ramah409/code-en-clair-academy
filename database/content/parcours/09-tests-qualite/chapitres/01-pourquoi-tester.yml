        statement: "Complète : l'assertion, la classe de l'exception et la flèche."
        criteria: "Les trois trous sont corrects."
        hints:
          - "L'assertion d'erreur : assertThrows."
          - "La classe se note avec .class ; la flèche s'écrit ->."
