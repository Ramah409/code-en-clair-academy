    exercises:
      - slug: tst-ex-parametre-guide
        kind: COMPLETER
        title: "Compléter le test paramétré"
        difficulty: FACILE
        skill: java-tests
        statement: "Complète les deux annotations et la vérification."
        criteria: "Les trois trous sont corrects."
        hints:
          - "Un test paramétré : ParameterizedTest."
          - "Des lignes de données : CsvSource ; la comparaison : assertEquals."
          - "ParameterizedTest, CsvSource, assertEquals."
        solution: '["ParameterizedTest", "CsvSource", "assertEquals"]'
        explanation: "Une recette, plusieurs données."
        xp: 10
        payload:
          language: java
          template: |
            @[[1]]
            @[[2]]({ "awa, true", "'', false" })
            void pseudoValide(String pseudo, boolean attendu) {
                [[3]](attendu, Pseudo.estValide(pseudo));
            }
          blanks:
            - ["ParameterizedTest"]
            - ["CsvSource"]
            - ["assertEquals"]
      - slug: tst-ex-parametre-libre
        kind: CODE_LIBRE
        title: "Tester des e-mails"
        difficulty: INTERMEDIAIRE
        skill: java-tests
        statement: |
          `Email.estValide(String email)` renvoie vrai si l'e-mail contient un `@`. Écris un test paramétré
          `emailValide(String email, boolean attendu)` avec au moins ces trois lignes :
          `"awa@exemple.fr, true"`, `"awa.exemple.fr, false"` et `"'', false"`.
        criteria: "@ParameterizedTest, @CsvSource avec les trois lignes, assertEquals(attendu, …)."
        hints:
          - "`@ParameterizedTest` puis `@CsvSource({ … })`."
          - "Une ligne par cas, entre guillemets."
          - "`assertEquals(attendu, Email.estValide(email));`"
        solution: |
          @ParameterizedTest
          @CsvSource({
              "awa@exemple.fr, true",
              "awa.exemple.fr, false",
              "'', false"
          })
          void emailValide(String email, boolean attendu) {
              assertEquals(attendu, Email.estValide(email));
          }
        explanation: "Le cas normal, un cas faux, un cas vide."
        xp: 20
        payload:
          language: java
          starter: |
            void emailValide(String email, boolean attendu) {

            }
          checks:
            - pattern: '@ParameterizedTest'
              message: "Ajoute @ParameterizedTest."
            - pattern: '@CsvSource\s*\(\s*\{[^}]*"awa@exemple\.fr,\s*true"[^}]*"awa\.exemple\.fr,\s*false"[^}]*"'''',\s*false"'
              message: "Mets les trois lignes dans @CsvSource, dans l'ordre demandé."
            - pattern: 'assertEquals\s*\(\s*attendu\s*,\s*Email\.estValide\s*\(\s*email\s*\)\s*\)'
              message: "Vérifie assertEquals(attendu, Email.estValide(email))."
      - slug: tst-ex-parametre-bug
        kind: CORRIGER_ERREUR
        title: "Une annotation manquante"
        difficulty: FACILE
        skill: java-tests
        statement: |
          Ce test reçoit des paramètres mais n'est marqué que `@Test` : JUnit ne sait pas d'où viennent les
          valeurs. Remplace `@Test` par `@ParameterizedTest`.
        criteria: "@ParameterizedTest à la place de @Test."
        hints:
          - "Un test avec des paramètres de données…"
          - "… est un test paramétré."
          - "`@ParameterizedTest`"
        solution: |
          @ParameterizedTest
          @CsvSource({ "awa, true", "'', false" })
          void pseudoValide(String pseudo, boolean attendu) {
              assertEquals(attendu, Pseudo.estValide(pseudo));
          }
        explanation: "@CsvSource va avec @ParameterizedTest."
        xp: 10
        payload:
          language: java
          starter: |
            @Test
            @CsvSource({ "awa, true", "'', false" })
            void pseudoValide(String pseudo, boolean attendu) {
                assertEquals(attendu, Pseudo.estValide(pseudo));
            }
          checks:
            - pattern: '@Test\b'
              absent: true
              message: "Remplace @Test."
            - pattern: '@ParameterizedTest'
              message: "Écris @ParameterizedTest."

