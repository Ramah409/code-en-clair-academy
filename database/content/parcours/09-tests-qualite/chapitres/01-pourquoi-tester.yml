          checks:
            - pattern: 'assertThrows\s*\(\s*IllegalArgumentException\.class\s*,\s*\(\s*\)\s*->\s*Initiales\.de\s*\(\s*""\s*\)\s*\)'
              message: "Écris assertThrows(IllegalArgumentException.class, () -> Initiales.de(\"\"))."
      - slug: tst-ex-assertthrows-bug
        kind: CORRIGER_ERREUR
        title: "Un try/catch qui ne vérifie rien"
        difficulty: INTERMEDIAIRE
        skill: java-tests
        statement: |
          Ce test passe même si aucune exception n'est lancée. Remplace le `try/catch` par
