        statement: |
          `Initiales.de("")` doit lancer `IllegalArgumentException`. Écris le test `refuseUnTexteVide`.
        criteria: "@Test et assertThrows(IllegalArgumentException.class, () -> Initiales.de(\"\"))."
        hints:
          - "`@Test void refuseUnTexteVide() { … }`"
          - "La classe : IllegalArgumentException.class."
          - "`assertThrows(IllegalArgumentException.class, () -> Initiales.de(\"\"));`"
        solution: |
