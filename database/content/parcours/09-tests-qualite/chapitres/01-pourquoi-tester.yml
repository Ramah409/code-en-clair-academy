      - slug: tst-ex-junit
        kind: CODE_LIBRE
        title: "Tester des initiales"
        difficulty: INTERMEDIAIRE
        skill: java-tests
        statement: |
          La méthode statique `Initiales.de(String nomComplet)` renvoie les initiales en majuscules :
          `"Awa Diallo"` donne `"AD"`, `"Léo"` donne `"L"`.

          Écris la classe `InitialesTest` avec **deux** tests :
          - `prenomEtNom` : `"Awa Diallo"` → `"AD"` ;
          - `prenomSeul` : `"Léo"` → `"L"`.
        criteria: "Deux méthodes @Test, deux assertEquals avec l'attendu en premier."
        hints:
          - "`@Test void prenomEtNom() { assertEquals(\"AD\", Initiales.de(\"Awa Diallo\")); }`"
          - "L'attendu vient en premier."
          - "`assertEquals(\"L\", Initiales.de(\"Léo\"));`"
        solution: |
          class InitialesTest {

              @Test
              void prenomEtNom() {
                  assertEquals("AD", Initiales.de("Awa Diallo"));
              }

              @Test
              void prenomSeul() {
                  assertEquals("L", Initiales.de("Léo"));
              }
          }
        explanation: "Le cas normal et un cas limite (un seul mot)."
        xp: 20
        payload:
          language: java
          starter: |
            class InitialesTest {

            }
          checks:
            - pattern: '\A(?>[\s\S]*?@Test\b){2}'
              message: "Écris deux méthodes annotées `@Test`."
            - pattern: 'void\s+prenomEtNom\s*\(\s*\)[^}]*assertEquals\s*\(\s*"AD"\s*,\s*Initiales\.de\s*\(\s*"Awa Diallo"\s*\)'
              message: "`prenomEtNom` : `assertEquals(\"AD\", Initiales.de(\"Awa Diallo\"))` (l'attendu d'abord)."
            - pattern: 'void\s+prenomSeul\s*\(\s*\)[^}]*assertEquals\s*\(\s*"L"\s*,\s*Initiales\.de\s*\(\s*"Léo"\s*\)'
              message: "`prenomSeul` : `assertEquals(\"L\", Initiales.de(\"Léo\"))`."
      - slug: tst-ex-junit-bug
        kind: CORRIGER_ERREUR
        title: "Un attendu à l'envers"
        difficulty: FACILE
        skill: java-tests
        statement: |
          Dans ce test, l'attendu et l'obtenu sont inversés : en cas d'échec, le message serait trompeur. Remets
          l'attendu en premier.
        criteria: "assertEquals(\"AWA\", resultat)."
        hints:
          - "Quel est l'attendu ?"
          - "Le texte fixe \"AWA\"."
          - "`assertEquals(\"AWA\", resultat);`"
        solution: |
          String resultat = f.majuscules("awa");
          assertEquals("AWA", resultat);
        explanation: "L'attendu d'abord."
        xp: 10
        payload:
          language: java
          starter: |
