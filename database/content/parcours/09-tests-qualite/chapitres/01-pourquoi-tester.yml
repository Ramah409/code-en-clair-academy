        language: java
        choices:
          - label: "Il échoue : l'exception attendue n'est pas arrivée"
            correct: true
            why: "La règle est cassée, le test le signale."
          - label: "Il réussit"
            correct: false
            why: "Il attend une exception."
          - label: "Il ne compile pas"
            correct: false
            why: "Il compile."
        explanation: "Le test protège la règle."
    exercises:
      - slug: tst-ex-assertthrows-guide
        kind: COMPLETER
